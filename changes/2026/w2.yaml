            op: input
            source: Form W-2 box 12, code TP (total cash tips reported to the employer); zero if none
          cite:
            doc: iw2w3
            locator: p. 23, Box 12—Codes, "Code TP—Total amount of cash tips reported to the employer"
    - add_line:
        after: w2.box12_tp
        line:
          id: w2.box12_tt
          printed: 12 (TT)
          label: Box 12, code TT. Total amount of qualified overtime compensation
          type: NonNegDollars
          expr:
            op: input
            source: Form W-2 box 12, code TT (total qualified overtime compensation); zero if none
          cite:
            doc: iw2w3
            locator: p. 23, Box 12—Codes, "Code TT—Total amount of qualified overtime compensation"
    - add_question:
        input: w2.box12_tp
        like: w2.box12_userra
        entry:
          help: The code TP amount in box 12, zero if none.
    - add_question:
        input: w2.box12_tt
        like: w2.box12_tp
        entry:
          help: The code TT amount in box 12, zero if none.
