changes:
  tax_year: 2026
  form: w2
  entries:
  - change: C-PRI-24
    evidence:
    - doc: iw2w3
      page: 23
      quote: Code TP—Total amount of cash tips reported to the employer
    - doc: iw2w3
      page: 23
      quote: Code TT—Total amount of qualified overtime compensation
