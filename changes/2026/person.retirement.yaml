          return, the couple's taxable compensation less the other spouse's IRA contributions, or a Roth contribution above the limit
          for your income), with the excess not withdrawn with its earnings by the due date of your return (including extensions)?
        to: Were the contributions for 2026 to your traditional and Roth IRAs together (made by you, your spouse or an employer, other
          than under a SEP or SIMPLE IRA plan, and any rollover that did not qualify) more than you were allowed to contribute (more
          than $7,500, or $8,600 if age 50 or older at the end of 2026, or more than your taxable compensation, or, on a joint return,
          the couple's taxable compensation less the other spouse's IRA contributions, or a Roth contribution above the limit for
          your income), with the excess not withdrawn with its earnings by the due date of your return (including extensions)?
    - set:
        line: person.ira_limit_under50
        field: label
        from: $7,000
        to: $7,500
    - set:
        line: person.ira_limit_over50
        field: label
        from: $8,000
        to: $8,600
    - set:
