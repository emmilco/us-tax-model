          remedy: Your traditional and Roth IRA contributions for 2025 are together more than $7,000 ($8,000 if age 50 or
            older), an excess contribution, which is outside this tool.
          cite:
            doc: p590a
            locator: p. 35, Excess Contributions, "Generally, an excess contribution is the amount contributed to your traditional
              IRAs for the year that is more than the smaller of"
        - when: ira.over_comp
          form: Excess IRA contributions (Form 5329 Part III, Pub. 590-A)
          remedy: The traditional and Roth IRA contributions for 2025 on this return are more than the compensation on line
            10 of the IRA Deduction Worksheet, an excess contribution, which is outside this tool.
          cite:
            doc: p590a
            locator: p. 35, Excess Contributions, "Your taxable compensation for the year"
        - when: ira.special_gate
          form: IRA deduction special cases (Pub. 590-A)
          remedy: Nonqualified deferred compensation in box 1 (Form W-2 box 11 or code Z, Form 1099-MISC box 15), fellowship
            or stipend payments not on a Form W-2, repayments of qualified reservist distributions and difficulty of care
            payments change the IRA compensation or contribution limits; they are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 95, Line 20, "don’t include that income on line 8 of the worksheet" and "Don’t include any repayments
              of qualified reservist distributions"; p590a p. 6, What Is Compensation?, "certain non-tuition fellowship and
              stipend payments not reported to you on Form W-2 are treated as taxable compensation for IRA purposes"
        - when: ira.excl_gate
          form: IRA deduction with excluded foreign or possession income (Pub. 590-A)
          remedy: With a retirement plan coverage and Form 2555 (or excluded income from Form 4563 or Puerto Rico), the IRA
