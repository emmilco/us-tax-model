    - doc: i8606
      page: 6
      quote: combined taxable compensation of both you and your spouse is less than $15,000 ($16,100 if one spouse is age
        50 or older at the end of 2026; $17,200 if both spouses are age 50 or older at the end of 2026
    - doc: n-25-67
      page: 4
      quote: is increased from $7,000 to $7,500.
    - doc: n-25-67
      page: 4
      quote: is increased from $1,000 to $1,100.
    verified: draft
    note: The amounts shown in labels, the question and the refusals. The limits themselves are parameters (ira.limit 750000,
      ira.limit_50 860000, ira.kbh_none/one/both 1500000/1610000/1720000), set by the parameter lane. The locators that quote
      the IRA Deduction Worksheet (i1040gi) and Pub. 590-A wait for their 2026 editions.
    operations:
    - set:
        line: person.ira_extra_left
        field: label
        from: Were the contributions for 2025 to your traditional and Roth IRAs together (made by you, your spouse or an employer,
          other than under a SEP or SIMPLE IRA plan, and any rollover that did not qualify) more than you were allowed to contribute
          (more than $7,000, or $8,000 if age 50 or older at the end of 2025, or more than your taxable compensation, or, on a joint
          return, the couple's taxable compensation less the other spouse's IRA contributions, or a Roth contribution above the limit
          for your income), with the excess not withdrawn with its earnings by the due date of your return (including extensions)?
        to: Were the contributions for 2026 to your traditional and Roth IRAs together (made by you, your spouse or an employer, other
          than under a SEP or SIMPLE IRA plan, and any rollover that did not qualify) more than you were allowed to contribute (more
          than $7,500, or $8,600 if age 50 or older at the end of 2026, or more than your taxable compensation, or, on a joint return,
          the couple's taxable compensation less the other spouse's IRA contributions, or a Roth contribution above the limit for
          your income), with the excess not withdrawn with its earnings by the due date of your return (including extensions)?
    - set:
        line: person.ira_extra_left
        field: expr.source
        from: Were the contributions for 2025 to your traditional and Roth IRAs together (made by you, your spouse or an employer,
          other than under a SEP or SIMPLE IRA plan, and any rollover that did not qualify) more than you were allowed to contribute
