          remedy: On a joint return where you or your spouse made contributions to both a traditional IRA and a Roth IRA for
            2025, the IRA deduction is figured with Pub. 590-A, which this tool does not prepare.
          cite:
            doc: i1040gi
            locator: p. 95, Line 20, "If you are filing a joint return and you or your spouse made contributions to both a
              traditional IRA and a Roth IRA for 2025, don’t use the IRA Deduction Worksheet in these instructions"
        - when: ira.kbh_short
          form: IRA deduction on a joint return with little compensation (Pub. 590-A worksheet)
          remedy: On a joint return with line 10 of the IRA Deduction Worksheet under $14,000 ($15,000 or $16,000 with spouses
            age 50 or older), the IRA deduction is figured with the worksheet in Pub. 590-A, which this tool does not prepare.
          cite:
            doc: i1040gi
            locator: p. 98, IRA Deduction Worksheet—Continued, Caution, "stop here and use the worksheet in Pub. 590-A to
              figure your IRA deduction"
        - when: person.ira_excess_gate
          form: Excess or recharacterized IRA contributions (Form 5329 Parts III and IV, Pub. 590-A)
          remedy: Traditional or Roth IRA contributions for 2025 that are more than allowed or were recharacterized, and an
            excess contribution from an earlier year that remained in an IRA at the end of 2025, are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 95, Line 20, "If the total of your IRA deduction on line 20 plus any nondeductible contributions to
              your traditional IRAs shown on Form 8606 is less than your total traditional IRA contributions for 2025, see
              Pub. 590-A for special rules"
        - when: person.ira_over_limit
