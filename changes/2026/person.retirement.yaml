    - set_question:
        input: person.ira_extra_left
        field: help
        from: The limit for traditional and Roth IRAs together is $7,000 ($8,000 if you were 50 or older at the end of 2025), or your
          taxable pay if that is less (on a joint return, the couple's pay less the other spouse's IRA contributions); a Roth IRA
          has a lower limit at higher incomes. Count money an employer put in and a rollover that did not qualify. A Yes ends the
          interview here.
        to: The limit for traditional and Roth IRAs together is $7,500 ($8,600 if you were 50 or older at the end of 2026), or your
          taxable pay if that is less (on a joint return, the couple's pay less the other spouse's IRA contributions); a Roth IRA
          has a lower limit at higher incomes. Count money an employer put in and a rollover that did not qualify. A Yes ends the
          interview here.
    - set_question:
        input: person.age50_at_year_end
        field: help
        from: Age 50 or older at the end of 2025 raises the IRA contribution limit to $8,000, changes the IRA Deduction Worksheet's
          percentages, and allows catch-up contributions to a SIMPLE IRA.
        to: Age 50 or older at the end of 2026 raises the IRA contribution limit to $8,600, changes the IRA Deduction Worksheet's
          percentages, and allows catch-up contributions to a SIMPLE IRA.
  - change: C-PEOP-11
    evidence:
    - doc: f8606
      page: 1
      quote: but does not include Trump accounts.
    - doc: i8606
      page: 2
      quote: traditional IRAs do not include Trump accounts
    verified: draft
    note: 'Trump accounts are refused (owner decision 2026-11-04, ADOPTION.md question 5): a Form 1099-R from one refuses
      in retirement.yaml; here the traditional IRA questions leave Trump-account money out.'
    operations:
    - set_question:
        input: person.ira_trad
        field: help
        from: Form 5498 or a statement from the IRA's trustee shows it. Leave out rollovers, repayments of a reservist distribution,
          money you deducted on your 2024 return, anything you took back out with its earnings by the deadline for your return, trustee's
          fees billed separately, and SEP or SIMPLE contributions.
        to: Form 5498 or a statement from the IRA's trustee shows it. Leave out rollovers, repayments of a reservist distribution,
          money you deducted on your 2025 return, anything you took back out with its earnings by the deadline for your return, trustee's
          fees billed separately, SEP or SIMPLE contributions, and money put into a Trump account.
    - set_question:
        input: person.ira_basis
        field: help
        from: Your basis is the total of your nondeductible contributions to traditional IRAs, less any nontaxable distributions;
          zero if you made no nondeductible contributions before 2025.
        to: Your basis is the total of your nondeductible contributions to traditional IRAs (not Trump accounts), less any nontaxable
          distributions; zero if you made no nondeductible contributions before 2026.
