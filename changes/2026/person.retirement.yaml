        - when: person.ira_over_limit
          form: Excess IRA contributions (Form 5329 Part III, Pub. 590-A)
          remedy: Your traditional and Roth IRA contributions for 2026 are together more than $7,500 ($8,600 if age 50 or
            older), an excess contribution, which is outside this tool.
          cite:
            doc: p590a
            locator: p. 35, Excess Contributions, "Generally, an excess contribution is the amount contributed to your traditional
              IRAs for the year that is more than the smaller of"
        - when: ira.over_comp
          form: Excess IRA contributions (Form 5329 Part III, Pub. 590-A)
          remedy: The traditional and Roth IRA contributions for 2025 on this return are more than the compensation on line
