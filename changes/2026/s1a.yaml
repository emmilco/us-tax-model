      follow the 2026 draft''s numbers. Citations to the 2025 i1040gi are left as they are: no 2026 i1040gi is archived, so
      their pages and words wait for it. The decedent window (the died_before_65 lines) waits for the same reason. The Form
      1040 reader of line 44 is f1040.yaml C-PRI-02.'
