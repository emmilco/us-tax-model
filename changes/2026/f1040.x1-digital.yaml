          interest in a digital asset)?"; i1040gi p. 15, Digital Assets, "Digital assets are any digital representations of
          value that are recorded on a cryptographically secured distributed ledger or any similar technology."; i1040gi p.
          16, "Received new digital assets as a result of mining, staking, and similar activities", "Disposed of a digital
          asset in exchange or trade for another digital asset", "Holding a digital asset in a wallet or account" and "Purchasing
          digital assets using U.S. or other real currency"'
        to: 'Form 1040 (2026), page 2, Other Information, "At any time during 2026, did you: (a) receive (as a reward, award,
          or payment for property or services); or (b) sell, exchange, or otherwise dispose of a digital asset (or a financial
          interest in a digital asset)?"; i1040gi p. 15, Digital Assets, "Digital assets are any digital representations of
          value that are recorded on a cryptographically secured distributed ledger or any similar technology."; i1040gi p.
          16, "Received new digital assets as a result of mining, staking, and similar activities", "Disposed of a digital
