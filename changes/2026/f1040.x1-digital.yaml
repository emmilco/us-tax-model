  entries:
  - change: C-X1-F1040-01
    evidence:
    - doc: f1040
      page: 2
      quote: 'At any time during 2026, did you: (a) receive (as a reward, award, or payment for property or services); or
        (b) sell, exchange, or otherwise dispose of a digital asset (or a financial interest in a digital asset)?'
    verified: draft
    note: 'The digital asset question keeps its wording and moves from page 1 to page 2, under Other Information. Citation
      only: the line, its question and its entry check are unchanged. The i1040gi quotes of the line are awaited (2026 instructions
      not posted); the year in the question moves at adoption.'
