changes:
  tax_year: 2026
  form: scveh
  entries:
  - change: C-BUS-01
    evidence:
    - doc: n-26-10
      page: 3
      quote: The standard mileage rate for transportation or travel expenses for 2026 is 72.5 cents per mile for all miles
        of business use
    - doc: irb26-29
      page: 13
      quote: (1) Business 76 cents per mile
    - doc: i1040sc
      page: 7
      quote: Multiply your business miles driven from January 1, 2026, to June 30, 2026, by 72.5 cents per mile
    - doc: i1040sc
      page: 7
      quote: Multiply your business miles driven from July 1, 2026, to December 31, 2026, by 76 cents per mile
    verified: draft
    note: 'The questions are added here: the proposal left them to adoption. The two periods take the place of scveh.miles_business
      in the bank and the profiles.'
    operations:
    - remove_line:
        line: scveh.rate
    - add_line:
        after: scveh.placed_date
        line:
          id: scveh.miles_business_h1
          printed: (helper)
          label: Business miles, January 1 to June 30, 2026
          type: Count
          expr:
            op: input
            source: The miles you drove this vehicle for this business (not commuting) from January 1, 2026, to June 30, 2026
          cite:
            doc: i1040sc
            locator: p. 7 (draft), Line 9, "Multiply your business miles driven from January 1, 2026, to June 30, 2026, by
              72.5 cents per mile"
    - add_line:
        after: scveh.miles_business_h1
        line:
          id: scveh.miles_business_h2
          printed: (helper)
          label: Business miles, July 1 to December 31, 2026
          type: Count
          expr:
            op: input
            source: The miles you drove this vehicle for this business (not commuting) from July 1, 2026, to December 31,
              2026
          cite:
            doc: i1040sc
            locator: p. 7 (draft), Line 9, "Multiply your business miles driven from July 1, 2026, to December 31, 2026, by
              76 cents per mile"
    - set:
        line: scveh.miles_business
        field: label
        from: Business miles
        to: Add scveh.miles_business_h1, scveh.miles_business_h2
    - set:
        line: scveh.miles_business
        field: expr
        from:
          op: input
          source: The miles you drove this vehicle in 2025 for this business (not commuting)
        to:
          op: sum
          of:
          - scveh.miles_business_h1
          - scveh.miles_business_h2
    - set:
        line: scveh.miles_business
        field: cite.locator
        from: Schedule C (2025), line 44a; i1040sc p. 15, Line 44b
        to: Schedule C (2026), line 44a, Business; the miles of both periods (C-BUS-01)
    - add_line:
        after: scveh.smr_bad
        line:
          id: scveh.dollar
          printed: (helper)
          label: One dollar
          type: NonNegDollars
          expr:
            op: param
            ref: sc.hundred_cents
          cite:
            doc: n-26-10
            locator: p. 3, section 3, the rate is stated per mile ("72.5 cents per mile"); it is held as dollars per mile
              (an exact rate) and applied to the business miles as dollars
    - add_line:
        after: scveh.dollar
        line:
          id: scveh.miles_h1_dollars
          printed: (helper)
          label: Business miles January 1 to June 30, as dollars
          type: NonNegDollars
          expr:
            op: multiply_count
            amount: scveh.dollar
            count: scveh.miles_business_h1
          cite:
            doc: i1040sc
            locator: p. 7 (draft), Line 9, "Multiply your business miles driven from January 1, 2026, to June 30, 2026, by
              72.5 cents per mile"
    - add_line:
        after: scveh.miles_h1_dollars
        line:
          id: scveh.miles_h2_dollars
          printed: (helper)
          label: Business miles July 1 to December 31, as dollars
          type: NonNegDollars
          expr:
            op: multiply_count
            amount: scveh.dollar
            count: scveh.miles_business_h2
          cite:
            doc: i1040sc
            locator: p. 7 (draft), Line 9, "Multiply your business miles driven from July 1, 2026, to December 31, 2026, by
              76 cents per mile"
    - add_line:
        after: scveh.miles_h2_dollars
        line:
          id: scveh.smr_h1
          printed: (helper)
          label: Business miles January 1 to June 30 times 72.5 cents, rounded to the cent
          type: NonNegDollars
          expr:
            op: multiply_rate
            amount: scveh.miles_h1_dollars
            rate:
              param: sc.mileage_rate_h1
          cite:
            doc: n-26-10
            locator: p. 3, section 3, "The standard mileage rate for transportation or travel expenses for 2026 is 72.5 cents
              per mile for all miles of business use"; i1040sc p. 7 (draft), Line 9
          ambiguity: amb.2025.multiplication_subcent
    - add_line:
        after: scveh.smr_h1
        line:
          id: scveh.smr_h2
          printed: (helper)
          label: Business miles July 1 to December 31 times 76 cents
          type: NonNegDollars
          expr:
            op: multiply_rate
            amount: scveh.miles_h2_dollars
            rate:
              param: sc.mileage_rate_h2
          cite:
            doc: irb26-29
            locator: p. 13, Announcement 2026-11, "(1) Business 76 cents per mile"; "apply to deductible transportation expenses
              paid or incurred for business, medical, or moving expense purposes on or after July 1, 2026"
    - set:
        line: scveh.smr_amount
        field: label
        from: Business miles times the standard mileage rate
        to: Add scveh.smr_h1, scveh.smr_h2
    - set:
        line: scveh.smr_amount
        field: expr
        from:
          op: multiply_count
          amount: scveh.rate
          count: scveh.miles_business
        to:
          op: sum
          of:
          - scveh.smr_h1
          - scveh.smr_h2
    - set:
        line: scveh.smr_amount
        field: cite.locator
        from: p. 6, Line 9, "Multiply the number of business miles driven by 0.70"
        to: 'p. 7 (draft), Line 9, the two products: "by 72.5 cents per mile" and "by 76 cents per mile"'
    - add_question:
        input: scveh.miles_business_h1
        like: scveh.miles_business
        default: 0
        reason: 'Closed: none unless the scenario states a count.'
    - add_question:
        input: scveh.miles_business_h2
        like: scveh.miles_business_h1
        default: 0
        reason: 'Closed: none unless the scenario states a count.'
    - remove_question:
        input: scveh.miles_business
  - change: C-BUS-02
    evidence:
    - doc: i1040sc
      page: 9
      quote: Enter interest paid or accrued on debt incurred to purchase a vehicle that is used in your trade or business
    - doc: i1040sc
      page: 9
      quote: allocate the vehicle loan interest between its business use and personal use
    - doc: i1040sc
      page: 7
      quote: Report the business-use portion of vehicle loan interest on line 16b, regardless of whether you use the business
        standard mileage rate or the actual costs of operating your vehicle
    verified: draft
    note: Schedule C line 16b (sc.vehicle_interest, changes/2026/sc.yaml) sums this line over the business's vehicles.
    operations:
    - add_line:
        after: scveh.parking
        line:
          id: scveh.loan_interest
          printed: (helper)
          label: Business-use portion of the interest on a loan to buy this vehicle
          type: NonNegDollars
          expr:
            op: input
            source: The business-use portion of the interest you paid or accrued in 2026 on a loan you took to buy this vehicle
              (with either the standard mileage rate or actual expenses; for a vehicle also used for personal purposes, only
              the part of the interest allocable to business use, and none of the interest you deduct on Schedule 1-A); zero
              if none
          cite:
            doc: i1040sc
            locator: p. 9, Line 16b, "Enter interest paid or accrued on debt incurred to purchase a vehicle that is used in
              your trade or business", "allocate the vehicle loan interest between its business use and personal use" and
              "If you claim a deduction on Schedule 1-A (Form 1040) for vehicle loan interest, then you can’t claim a deduction
              for that same interest on Schedule C"; p. 7, Line 9, "Report the business-use portion of vehicle loan interest
              on line 16b, regardless of whether you use the business standard mileage rate or the actual costs of operating
              your vehicle"
    - add_question:
        input: scveh.loan_interest
        default: 0
        reason: 'Closed: no amount unless the scenario states one.'
        like: scveh.parking
        entry:
          prompt: For this vehicle — How much interest did you pay in 2026 on a loan you took to buy it? Only the business-use
            part. (Zero if none.)
          help: This applies with the standard mileage rate too. If you also drive it for yourself, count only the business
            share of the interest, and leave out any interest you deduct as personal car loan interest.
  - change: C-BUS-12
    evidence:
    - doc: rp-26-15
      page: 2
      quote: the applicable percentage for qualified property acquired after September 27, 2017, and before January 20, 2025,
        and placed in service during calendar year 2026 is 20 percent
    - doc: plaw-119-21
      page: 119
      quote: In the case of qualified property placed in service by the taxpayer during the first taxable year ending after
        January 19, 2025, if the taxpayer elects to have this paragraph apply for such taxable year
    verified: final
    note: 'The rate is read from sc.bonus_rate_phase_down (20 percent, rp-26-15 p. 2), which replaces sc.bonus_rate_40; the
      line ids rate40 and bonus_forty are kept. The 40 percent election (bonus_choice forty) applies only to property placed
      in service in the first taxable year ending after January 19, 2025, so it is no longer offered: the 2026 enum bonus_choice
      must drop the value forty (parameter lane), or the build''s guard check fails at adoption.'
    operations:
    - set:
        line: scveh.bonus_choice
        field: expr.source
        from: For 5-year property placed in service in 2025, did you claim the special depreciation allowance (full), elect
          the 40% allowance instead of 100% for property acquired after January 19, 2025 (forty), or elect not to claim any
          special allowance (none)?
        to: For 5-year property placed in service in 2026, did you claim the special depreciation allowance (full) or elect
          not to claim any special allowance (none)?
    - set:
        line: scveh.bonus_choice
        field: cite.locator
        from: p. 13, Line 25; p. 7, Election out
        to: p. 13, Line 25; p. 7, Election out; plaw-119-21 sec. 70301(b)(3) (139 Stat. 189), the election of 40 percent "In
          the case of qualified property placed in service by the taxpayer during the first taxable year ending after January
          19, 2025" (not available for property placed in service in 2026)
    - set:
        line: scveh.rate40
        field: label
        from: 40% special allowance
        to: 20% special allowance (acquired after September 27, 2017, and before January 20, 2025)
    - set:
        line: scveh.rate40
        field: expr.ref
        from: sc.bonus_rate_40
        to: sc.bonus_rate_phase_down
    - set:
        line: scveh.rate40
        field: cite.doc
        from: i4562
        to: rp-26-15
    - set:
        line: scveh.rate40
        field: cite.locator
        from: p. 5, Line 14
        to: p. 2, section 2.02, "the applicable percentage for qualified property acquired after September 27, 2017, and before
          January 20, 2025, and placed in service during calendar year 2026 is 20 percent"
    - set:
        line: scveh.bonus_forty
        field: label
        from: 40% special allowance
        to: 20% special allowance
    - set:
        line: scveh.bonus_fullcase
        field: label
        from: 'The allowance when it is claimed: 100% if acquired after January 19, 2025, otherwise 40%'
        to: 'The allowance when it is claimed: 100% if acquired after January 19, 2025, otherwise 20%'
    - set:
        line: scveh.bonus_this_year
        field: expr.alternatives
        from:
        - guard:
            op: test
            eq:
            - scveh.bonus_choice
            - const: full
          then: scveh.bonus_fullcase
        - guard:
            op: test
            eq:
            - scveh.bonus_choice
            - const: forty
          then: scveh.bonus_forty
        - guard:
            op: test
            eq:
            - scveh.bonus_choice
            - const: none
          then: scveh.zero
        to:
        - guard:
            op: test
            eq:
            - scveh.bonus_choice
            - const: full
          then: scveh.bonus_fullcase
        - guard:
            op: test
            eq:
            - scveh.bonus_choice
            - const: none
          then: scveh.zero
    - set_question:
        input: scveh.bonus_choice
        field: value_labels
        from:
          full: 'Yes: the special depreciation allowance'
          forty: The 40% allowance in place of 100% (an election for property acquired after January 19, 2025)
          none: 'No: I elect not to take any special allowance'
        to:
          full: 'Yes: the special depreciation allowance'
          none: 'No: I elect not to take any special allowance'
