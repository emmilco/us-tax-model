          printed: (helper)
          label: Line 1 is more than zero
          type: Bool
          expr:
            op: test
            gt:
            - f5695.line12_if_carry
            - param: sales.zero
          cite:
            doc: i1040s8812
            locator: p. 5 (draft), Credit Limit Worksheet A, "Complete Credit Limit Worksheet B only if you meet all the following",
              "You are claiming one or more of the following credits", "c. Residential clean energy credit, Form 5695."
    - set:
        line: f5695.claiming_part1
        field: label
        from: Claiming the residential clean energy credit (Part I is completed and line 13 is more than zero)
        to: Claiming the residential clean energy credit (Form 5695 is completed and line 1 is more than zero)
    - set:
        line: f5695.claiming_part1
        field: expr
        from:
          op: choose
          alternatives:
          - guard:
              op: test
              eq:
              - f5695.part1_any
              - const: true
            then: f5695.line13_positive
          - guard:
              op: test
              eq:
              - f5695.part1_any
              - const: false
            then: f5695.no
        to:
          op: choose
          alternatives:
          - guard:
              op: test
              eq:
              - f5695.part1_any
              - const: true
            then: f5695.carry_positive
          - guard:
              op: test
              eq:
              - f5695.part1_any
              - const: false
            then: f5695.no
    - set:
        line: f5695.claiming_part1
        field: cite.locator
        from: p. 4, Credit Limit Worksheet A, "You are claiming one or more of the following credits", "Residential clean
          energy credit, Form 5695, Part I"
        to: p. 5 (draft), Credit Limit Worksheet A, "Complete Credit Limit Worksheet B only if you meet all the following",
          "You are claiming one or more of the following credits", "c. Residential clean energy credit, Form 5695."
    - remove_line:
        line: f5695.line13_positive
    - set_ambiguity:
        id: amb.2025.clwb_claiming_part1
        field: text_at_issue
        from: 'i1040s8812 p. 4, Credit Limit Worksheet A: "Complete Credit Limit Worksheet B only if you meet all the following.
          1. You are claiming one or more of the following credits. ... c. Residential clean energy credit, Form 5695, Part
          I." Whether one is claiming the credit depends on Form 5695 line 15, which is limited by a worksheet that reads
          Credit Limit Worksheet B line 14 when Worksheet B is completed.'
        to: 'i1040s8812 p. 5, Credit Limit Worksheet A: "Complete Credit Limit Worksheet B only if you meet all the following.
          1. You are claiming one or more of the following credits. ... c. Residential clean energy credit, Form 5695." Whether
          one is claiming the credit depends on Form 5695 line 3, which is limited by a worksheet that reads Credit Limit
          Worksheet B line 14 when Worksheet B is completed.'
    - set_ambiguity:
        id: amb.2025.clwb_claiming_part1
        field: readings
        from:
        - Claiming the credit means completing Form 5695 Part I with line 13 (the credit before the tax limit, the 2024 carryforward
          included) more than zero.
        - Claiming the credit means Form 5695 line 15 (the credit allowed) is more than zero.
        to:
        - Claiming the credit means completing Form 5695 with line 1 (the carryforward from 2025, the credit before the tax
          limit) more than zero.
        - Claiming the credit means Form 5695 line 3 (the credit allowed) is more than zero.
    - set_ambiguity:
        id: amb.2025.clwb_claiming_part1
        field: reason
        from: The second is circular (line 15 depends on whether Worksheet B is completed). The readings cannot differ in
          any amount. With Worksheet B completed, the Part I limit subtracts Worksheet B line 14, which is never more than
          Schedule 8812 line 12, instead of Form 1040 line 19, the smaller of line 12 and Credit Limit Worksheet A line 3;
          so the limit with Worksheet B is at least the limit without it. If line 13 is more than zero and line 15 is zero
          with Worksheet B, it is zero without it too, and Credit Limit Worksheet A line 4 (Worksheet B line 15, Schedule
          3 line 5a) is zero either way; if line 15 is more than zero, both readings complete Worksheet B.
        to: The second is circular (line 3 depends on whether Worksheet B is completed). The readings cannot differ in any
          amount. With Worksheet B completed, the line 2 limit subtracts Worksheet B line 14, which is never more than Schedule
          8812 line 12, instead of Form 1040 line 19, the smaller of line 12 and Credit Limit Worksheet A line 3; so the limit
          with Worksheet B is at least the limit without it. If line 1 is more than zero and line 3 is zero with Worksheet
          B, it is zero without it too, and Credit Limit Worksheet A line 4 (Worksheet B line 15, Schedule 3 line 5a) is zero
          either way; if line 3 is more than zero, both readings complete Worksheet B.
    - set_ambiguity:
        id: amb.2025.clwb_claiming_part1
        field: cite.locator
        from: p. 4, Credit Limit Worksheet A, "Complete Credit Limit Worksheet B only if you meet all the following"
        to: p. 5, Credit Limit Worksheet A, "Complete Credit Limit Worksheet B only if you meet all the following"
