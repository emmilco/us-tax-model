  entries:
  - change: C-CRED-01
    evidence:
    - doc: f5695
      page: 2
      quote: Carryforward of Residential Energy Credit
    - doc: i5695
      page: 2
      quote: Termination of credits. You can’t claim residential clean energy credits for expenditures made after December
        31, 2025.
    - doc: i5695
      page: 2
      quote: You can’t claim energy efficient home improvement credits for expenditures or property placed in service after
        December 31, 2025.
    - doc: plaw-119-21
      page: 181
      quote: with respect to any expenditures made after December 31, 2025
    - doc: plaw-119-21
      page: 181
      quote: placed in service after December 31, 2025
    verified: draft
    note: The form keeps only the carryforward tail of Part I (C-CRED-03, C-CRED-04); the current-year lines of Part I (C-CRED-02)
      and all of Part II (C-CRED-06 to C-CRED-08) are removed. No scope line names Form 5695 in 2025 (the change map's scope.credits
      is gone since the redraft), so no scope operation is needed.
    operations:
    - set_form:
        field: title
        from: Form 5695 — Residential Energy Credits (Parts I and II)
        to: Form 5695 — Carryforward of Residential Energy Credit
    - set_form:
        field: note
        from: Part I (residential clean energy credit, to Schedule 3 line 5a) and Part II (energy efficient home improvement
          credit, to Schedule 3 line 5b), with the Residential Clean Energy Credit Limit Worksheet (line 14) and the Energy
          Efficient Home Improvement Credit Limit Worksheet (line 31). Fuel cell property (lines 7a to 11), business use of
          an item, joint occupancy with anyone other than a spouse, spouses with separate main homes, improvements related
          to the construction of a home and items without a valid QMID are refused. Addresses and QMIDs are not values (the
          data model has no strings); a QMID is an attestation per category. Each kind of property is asked by a yes or no
          question beneath one opening question, and a part is figured only when one of its kinds was installed.
        to: 'Lines 1 to 4: the residential clean energy credit carryforward from 2025 (line 1, the 2025 Form 5695 line 16),
          limited by the Residential Clean Energy Credit Limit Worksheet (line 2), the credit to Schedule 3 line 5a (line
          3) and the carryforward to 2027 (line 4). No credit is figured from costs: the residential clean energy credit ends
          with expenditures made after December 31, 2025, and the energy efficient home improvement credit with property placed
          in service after that date. The form is completed only when the 2025 return carries a credit forward.'
