  - change: C-CRED-03
    evidence:
    - doc: f5695
      page: 2
      quote: Credit carryforward from 2025. Enter the amount, if any, from your 2025 Form 5695, line 16
    - doc: f5695
      page: 2
      quote: Residential clean energy credit. Enter the smaller of line 1 or line 2. Also include this amount on
    - doc: f5695
      page: 2
      quote: Credit carryforward to 2027. If line 3 is less than line 1, subtract line 3 from
    - doc: i5695
      page: 2
      quote: Use Form 5695 to take any residential clean energy credit carryforward from 2025 or to carry the unused portion
        of the residential clean energy credit to 2027
    - doc: i5695
      page: 2
      quote: 'Caution: You may claim only a carryforward of any unused residential clean energy credit (which is shown on
        your prior-year Form 5695, line 16)'
    - doc: i5695
      page: 2
      quote: If you can’t use all of the credit because of the tax liability limit (that is, line 2 is less than line 1),
        you can carry the unused portion of the credit to 2027.
    verified: draft
    note: 'Ids are kept through the renumbering: f5695.carry_in is printed 1, f5695.rce_limit 2 (C-CRED-04), f5695.rce_credit 3 (read
      by s3.line5a and s8812.clwb_15, lane O3b) and f5695.carry_out 4. Line 1 is the only source, so the 2025 line 13 (the sum
      of lines 6b, 11 and 12) is removed and lines 3 and 4 read line 1''s gate line. f5695.part1_any (read by s3.line5a) is
      kept, now true exactly when there is a carryforward. The i1040gi joint-return cite stays the 2025 edition until the
      2026 Form 1040 instructions are archived.'
    operations:
    - set:
        line: f5695.zero
        field: cite.locator
        from: Form 5695 (2025), lines 5b, 11, 18b to 20d, 22d to 26c, 29h and 32
