        to: 'Form 5695 is completed: there is a residential clean energy credit carryforward from 2025'
    - set:
        line: f5695.part1_any
        field: expr
        from:
          op: choose
          alternatives:
          - guard:
              op: test
              eq:
              - f5695.kinds_answered
              - const: true
            then: f5695.part1_some
          - guard:
              op: test
              eq:
              - f5695.kinds_answered
              - const: false
            then: f5695.no
        to:
          op: copy
          from: f5695.carry_if_prior
    - set:
        line: f5695.part1_any
        field: cite.locator
        from: p. 2, Residential Clean Energy Credit (Part I), "You may be able to take a credit of 30% of your costs of qualified
