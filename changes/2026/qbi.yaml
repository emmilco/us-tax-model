changes:
  tax_year: 2026
  form: qbi
  entries:
  - change: C-SCHED-31
    evidence:
    - doc: f8995
      page: 2
      quote: Qualified business income deduction. Enter the greater of line 15 or line 16
    - doc: f8995
      page: 2
      quote: Use this form if your taxable income, before your qualified business income deduction, is at or below $201,750
        ($201,775 if married filing separately; $403,500 if married filing jointly)
    - doc: i8995
      page: 6
      quote: This is the amount to be carried forward to the next year
    - doc: i8995
      page: 5
      quote: Include here the qualified portion of trade or business (loss) carryforward allowed in calculating taxable income
        in the current year
    verified: draft
    note: The deduction is Form 8995 line 17 (the greater of line 15 and the minimum deduction). The prior-year carryforward
      the filer enters is still line 16 of the 2025 Form 8995; the instructions now describe the carryforward under Line 18.
      The threshold in the citation of qbi.deduction is the 2026 one (C-SCHED-30); qbi.use_8995a's citation, which quotes
      the same sentence, is left to that change.
    operations:
    - set:
        line: qbi.deduction
        field: expr.alternatives
        from:
        - guard:
            op: test
            eq:
            - qbi.use_8995a
            - const: true
          then: qbi.via_8995a
        - guard:
            op: test
            eq:
            - qbi.use_8995a
            - const: false
          then: f8995.line15
        to:
        - guard:
            op: test
            eq:
            - qbi.use_8995a
            - const: true
          then: qbi.via_8995a
        - guard:
            op: test
            eq:
            - qbi.use_8995a
            - const: false
          then: f8995.deduction
    - set:
        line: qbi.deduction
        field: cite.locator
        from: p. 1, "Use this form if your taxable income, before your qualified business income deduction, is at or below
          $197,300 ($394,600 if married filing jointly)", "Qualified business income deduction. Enter the smaller of line
          10 or line 14" (line 15); i8995 pp. 3–4
        to: p. 2, "Use this form if your taxable income, before your qualified business income deduction, is at or below $201,750
          ($201,775 if married filing separately; $403,500 if married filing jointly)", "Qualified business income deduction.
          Enter the greater of line 15 or line 16" (line 17); i8995 p. 6, Line 17, "If the smaller of line 10 or 14 is less
          than $400, enter $400"
    - set:
        line: qbi.carryforward
        field: cite.locator
        from: 'p. 4, Line 3, "Include here the qualified portion of trade or business (loss) carryforward allowed in calculating
          taxable income in the current year"; p. 5, Line 16, "This is the amount to be carried forward to the next year"
          (owner: the printed amount)'
        to: 'p. 5, Line 3, "Include here the qualified portion of trade or business (loss) carryforward allowed in calculating
          taxable income in the current year"; p. 6, Line 18, "This is the amount to be carried forward to the next year"
          (owner: the printed amount)'
    - set:
        line: qbi.carryforward_if_prior_form
        field: cite.locator
        from: p. 4, Line 3, "Include here the qualified portion of trade or business (loss) carryforward allowed in calculating
          taxable income in the current year"; p. 5, Line 16, "This is the amount to be carried forward to the next year"
        to: p. 5, Line 3, "Include here the qualified portion of trade or business (loss) carryforward allowed in calculating
          taxable income in the current year"; p. 6, Line 18, "This is the amount to be carried forward to the next year"
  - change: C-SCHED-32
    evidence:
    - doc: f8995a
      page: 3
      quote: Total qualified business income deduction. Enter the greater of line 39 or line 40
    verified: draft
    operations:
    - set:
        line: qbi.via_8995a
        field: expr.from
        from: f8995a.line39
        to: f8995a.deduction
    - set:
        line: qbi.via_8995a
        field: cite.locator
        from: Form 8995-A (2025), line 39
        to: Form 8995-A (2026), line 41
  - change: C-SCHED-33
    evidence:
    - doc: i8995
      page: 2
      quote: Taxable income is computed without regard to section 68.
    - doc: i8995
      page: 6
      quote: 'Form 1040 or 1040-SR filers who file Schedule A: Form 1040 or 1040-SR, line 11a, minus the amounts on Schedule
        A (Form 1040) lines 4,7,10,15,16, and 17z, and Form 1040 or 1040-SR, line 13a.'
    - doc: i8995
      page: 6
      quote: 'Form 1040 or 1040-SR filers who do not file Schedule A: Form 1040 or 1040-SR, line 11a, minus lines 12e, 12f,
        and 13a.'
    - doc: f1040sa
      page: 3
      quote: Add the amounts in far-right column for lines 4 through 17z
    verified: draft
    note: sa.deduction is sa.line17 (2026 Schedule A line 18, the sum of lines 4 to 17z, before any section 68 limit) for
      an itemizer and the standard deduction otherwise, so with f1040.line12f (C-PRI-01) and f1040.line13b (Schedule 1-A,
      printed 13a from 2026, C-PRI-02) it is the subtraction both readings of the Line 11 instructions name. The section 68
      limit itself is refused on Form 1040 line 15 (f1040.gate.itemized_limit, C-PRI-18), so 12e never differs from the sum
      on a completed return; the QBI computation reads the sum, not 12e's limited amount, either way.
    operations:
    - set:
        line: qbi.deductions_before
        field: label
        from: Form 1040 lines 12e and 13b, the deductions taken before the QBI deduction
        to: Form 1040 lines 12e, 12f and 13a (Schedule 1-A), the deductions taken before the QBI deduction; the itemized deductions
          are Schedule A lines 4 to 17z before the section 68 limit
    - set:
        line: qbi.deductions_before
        field: expr.of
        from:
        - sa.deduction
        - f1040.line13b
        to:
        - sa.deduction
        - f1040.line12f
        - f1040.line13b
    - set:
        line: qbi.deductions_before
        field: cite
        from:
          doc: i8995-correction
          locator: 'Correction to 2025 Form 8995 instructions, Line 11, "Form 1040 or 1040-SR filers: Form 1040 or 1040-SR,
            line 11a, minus lines 12e and 13b"'
        to:
          doc: i8995
          locator: 'pp. 5–6, Line 11, "Enter your taxable income figured before any QBI deduction", "Form 1040 or 1040-SR
            filers who file Schedule A: Form 1040 or 1040-SR, line 11a, minus the amounts on Schedule A (Form 1040) lines
            4,7,10,15,16, and 17z, and Form 1040 or 1040-SR, line 13a", "Form 1040 or 1040-SR filers who do not file Schedule
            A: Form 1040 or 1040-SR, line 11a, minus lines 12e, 12f, and 13a"; p. 2, What’s New, "Taxable income is computed
            without regard to section 68."'
    - set:
        line: qbi.taxable_before
        field: label
        from: Taxable income before the QBI deduction; Form 1040 line 11a minus lines 12e and 13b, floored at zero
        to: Taxable income before the QBI deduction; Form 1040 line 11a minus lines 12e, 12f and 13a, floored at zero
    - set:
        line: qbi.taxable_before
        field: cite
        from:
          doc: i8995-correction
          locator: 'Correction to 2025 Form 8995 instructions, Line 11, "Enter your taxable income figured before any QBI
            deduction", "Form 1040 or 1040-SR filers: Form 1040 or 1040-SR, line 11a, minus lines 12e and 13b"'
        to:
          doc: i8995
          locator: 'pp. 5–6, Line 11, "Enter your taxable income figured before any QBI deduction", "Form 1040 or 1040-SR
            filers who file Schedule A: Form 1040 or 1040-SR, line 11a, minus the amounts on Schedule A (Form 1040) lines
            4,7,10,15,16, and 17z, and Form 1040 or 1040-SR, line 13a", "Form 1040 or 1040-SR filers who do not file Schedule
            A: Form 1040 or 1040-SR, line 11a, minus lines 12e, 12f, and 13a"'
    - set_form:
        field: note
        from: Section 199A dividends and the qualified business income of the Schedule C businesses (with a prior-year qualified
          business loss carryforward), not PTP amounts. Taxable income before QBI is AGI less the selected deduction; Schedule
          1-A is outside scope. The Jan. 27, 2026 Form 8995 instruction correction is followed.
        to: 'Section 199A dividends and the qualified business income of the Schedule C businesses (with a prior-year qualified
          business loss carryforward), not PTP amounts. Taxable income before QBI is AGI less the deductions taken before
          it: the standard deduction or the itemized deductions before the section 68 limit, the charitable deduction for
          non-itemizers and the Schedule 1-A deductions.'
