      page: 3
      quote: If line 17 is $244,500 or less ($122,250 or less if married filing separately), multiply line 17 by 26% (0.26).
        Otherwise, multiply line 17 by 28% (0.28) and subtract $4,890 ($2,445 if married filing separately) from the result
