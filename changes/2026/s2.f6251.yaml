  - change: C-LAW-02
    evidence:
    - doc: f6251
      page: 2
      quote: Subtract Schedule 1-A (Form 1040), line 43, from Form 1040, 1040-SR, or 1040-NR, line 14
    - doc: f6251
      page: 2
