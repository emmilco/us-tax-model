    - set:
        line: s2.amt_l1a
        field: label
        from: 'Form 6251 line 1a: Form 1040 line 14 less Schedule 1-A line 37'
        to: 'Form 6251 line 1a: Form 1040 line 14 less Schedule 1-A line 43'
    - set:
