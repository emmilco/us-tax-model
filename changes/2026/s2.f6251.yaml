    verified: draft
    note: 'The citations of the Schedule 2 AMT screen that quote Form 6251 itself, requoted from the 2026 Form 6251 draft
      (archived as f6251): Schedule 1-A line 37 is line 43, Form 1040 line 7 is line 7a, and the amounts printed on lines
      4, 7, 18, 19, 25 and 39 are the 2026 ones; lines 19 and 25 print each amount as a bullet, so each is quoted apart. The
      labels of s2.amt_l1a, s2.amt_l21 and s2.amt_l29 print the same numbers. The amounts the lines compute are parameters
      (amt.bracket, amt.bracket_subtract, the capital gain breakpoints), staged for 2026 in research/ty2026/params-2026.proposed.yaml
      with the same values. The labels of the other lines that print these amounts are set by s2.labels.yaml. In s2.amt_part3,
      an i6251 citation, the Form 6251 segment names its document (f6251).'
