    operations:
    - set:
        line: f8889.medical
        field: expr.source
        from: 'The part of your 2025 HSA distributions used to pay qualified medical expenses; zero if none


          The expenses must not have been reimbursed by insurance or other coverage, and must have been incurred after the
          HSA was established.


          Whose expenses count:

