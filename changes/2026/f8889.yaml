    - set_question:
        input: f8889.fsa
        field: help
        from: It counts as other health coverage for you and your spouse alike, even when only one person signed up for it.
          Answer No if it pays only dental and vision costs, or pays nothing until the minimum annual deductible for an HSA
          plan is met ($1,650 for a plan covering one person, $3,300 for more). Answer Yes if it was suspended for only part
          of 2025, or if it pays only after retirement and the person who has it had retired. A 2024 health FSA's extra months
          in early 2025 count only if money was left in it at the end of 2024. A dependent care FSA is not a health FSA.
        to: It counts as other health coverage for you and your spouse alike, even when only one person signed up for it.
          Answer No if it pays only dental and vision costs, or pays nothing until the minimum annual deductible for an HSA
          plan is met ($1,700 for a plan covering one person, $3,400 for more). Answer Yes if it was suspended for only part
          of 2026, or if it pays only after retirement and the person who has it had retired. A 2025 health FSA's extra months
          in early 2026 count only if money was left in it at the end of 2025. A dependent care FSA is not a health FSA.
    - set_question:
        input: f8889.allocated
        field: help
        from: The shared limit is the family amount for the months both of you are treated as having family coverage ($8,550
          for a full year). Your spouse's part is the rest; the two parts together may not be more than it.
        to: The shared limit is the family amount for the months both of you are treated as having family coverage ($8,750
          for a full year). Your spouse's part is the rest; the two parts together may not be more than it.
    - set_question:
        input: f8889.testing_prior
        field: help
        from: This is about the “last-month rule”. A person who could have an HSA on December 1, 2024 was allowed the full
          yearly amount for the plan held that day, on condition of staying able to have an HSA through December 31, 2025.
          Answer Yes if more went in for 2024 than your own months allowed, counting each month by the plan of that month.
          That can be so if your plan began during 2024; if for part of 2024 you were someone's dependent or had other health
          coverage, counting a health FSA or HRA at work (also the extra months of a 2023 health FSA early in 2024, and your
          spouse's FSA); or if your plan, or a plan your spouse had, went from covering one person to covering more. Line
          3 of your 2024 Form 8889 then shows the full yearly amount ($4,150 for a plan covering one person, $8,300 for more,
          before the extra $1,000 from age 55) although not every month of 2024 earned it. If you are not sure, answer Yes.
        to: This is about the “last-month rule”. A person who could have an HSA on December 1, 2025 was allowed the full yearly
          amount for the plan held that day, on condition of staying able to have an HSA through December 31, 2026. Answer
          Yes if more went in for 2025 than your own months allowed, counting each month by the plan of that month. That can
          be so if your plan began during 2025; if for part of 2025 you were someone's dependent or had other health coverage,
          counting a health FSA or HRA at work (also the extra months of a 2024 health FSA early in 2025, and your spouse's
          FSA); or if your plan, or a plan your spouse had, went from covering one person to covering more. Line 3 of your
          2025 Form 8889 then shows the full yearly amount ($4,300 for a plan covering one person, $8,550 for more, before
          the extra $1,000 from age 55) although not every month of 2025 earned it. If you are not sure, answer Yes.
  - change: C-PRI-22
    evidence:
    - doc: i8889
      page: 2
      quote: '2. Bronze and Catastrophic Plans Treated as HDHPs: After 2025, bronze and catastrophic plans available through
        an Exchange are considered HSA-compatible, regardless of whether the plans satisfy the general definition of an HDHP.'
    - doc: i8889
      page: 2
      quote: Notice 2026-5 clarifies that bronze and catastrophic plans do not have to be purchased through an Exchange to
        qualify for the new relief.
    - doc: i8889
      page: 3
      quote: A direct primary care service arrangement is not considered a health plan and does not disqualify an otherwise
        “eligible individual”
    verified: draft
    note: 'The computation does not change; the definitions shown with the HDHP coverage questions do. The coverage questions
      are Form 8889''s (coverage_year, clear_all_year, months_eligible), not person''s: no person.hsa.yaml is needed. coverage_year''s
      quotes are re-based here with the 2026 amounts of C-PRI-20, and months_eligible''s help with the 2026 minimum deductible,
      so that each field is set once. Notice 2026-5 is not archived; nothing here quotes it.'
    operations:
    - set:
        line: f8889.coverage_year
        field: expr.source
        from: 'Were you covered by a high-deductible health plan (HDHP) on the first day of every month of 2025, with the
          same type of coverage in all twelve?


          - Self-only all year: an HDHP covering only you on the first day of every month of 2025.

          - Family all year: on the first day of every month of 2025, an HDHP covering you and at least one other person (such
          as an employee-plus-spouse or employee-plus-children tier), including as a member of someone else''s plan (a parent''s,
          or your husband''s or wife''s, for example), or a self-only HDHP and a family HDHP at the same time.

          - Changed: anything else, including HDHP coverage that started, ended or changed type during 2025, or if you are
          not sure. The month-by-month questions follow.


          This asks about the plan only. Whether you were an eligible individual in every month (no Medicare, no other health
          coverage, not a dependent), and whether your husband''s or wife''s family coverage counts as yours, are asked next.'
        to: 'Were you covered by a high-deductible health plan (HDHP) on the first day of every month of 2026, with the same
          type of coverage in all twelve? A bronze or catastrophic plan counts as an HDHP.


          - Self-only all year: an HDHP covering only you on the first day of every month of 2026.

          - Family all year: on the first day of every month of 2026, an HDHP covering you and at least one other person (such
          as an employee-plus-spouse or employee-plus-children tier), including as a member of someone else''s plan (a parent''s,
          or your husband''s or wife''s, for example), or a self-only HDHP and a family HDHP at the same time.

          - Changed: anything else, including HDHP coverage that started, ended or changed type during 2026, or if you are
          not sure. The month-by-month questions follow.


          This asks about the plan only. Whether you were an eligible individual in every month (no Medicare, no other health
          coverage, not a dependent), and whether your husband''s or wife''s family coverage counts as yours, are asked next.'
    - set:
        line: f8889.coverage_year
        field: label
        from: 'HDHP coverage on the first day of every month of 2025: self-only in all twelve, family in all twelve, or anything
          else (including coverage that started, ended or changed type)'
        to: 'HDHP coverage (a bronze or catastrophic plan counting as one) on the first day of every month of 2026: self-only
          in all twelve, family in all twelve, or anything else (including coverage that started, ended or changed type)'
    - set:
        line: f8889.coverage_year
        field: cite.locator
        from: p. 2, Eligible Individual, "you must be covered under a high deductible health plan (HDHP) and have no other
          health coverage except certain disregarded coverage ... You must be, or be considered, an eligible individual on
          the first day of a month"; p. 4, Line 1, "If you were covered by both a self-only HDHP and a family HDHP at the
          same time, you are treated as having family coverage during that period"; p. 4, Line 3, rule 3, "If you were, or
          were considered, an eligible individual for the entire year and you did not change your type of coverage, enter
          $4,300 for a self-only HDHP or $8,550 for a family HDHP on line 3"; p969 p. 4, "Family HDHP coverage is HDHP coverage
          for an eligible individual and at least one other individual"
        to: p. 3, Eligible Individual, "you must be covered under an HDHP and have no other health plan except certain disregarded
          coverage"; p. 4, High Deductible Health Plan, "Bronze and catastrophic plans are treated as high deductible health
          plans."; p. 5, Line 1, "If you were covered by both a self-only HDHP and a family HDHP at the same time, you are
          treated as having family coverage during that period"; p. 5, Line 3, rule 3, "If you were, or were considered, an
          eligible individual for the entire year and you did not change your type of coverage, enter $4,400 for a self-only
          HDHP or $8,750 for a family HDHP on line 3"
    - set_question:
        input: f8889.coverage_year
        field: help
        from: What counts is the plan you had on the first day of each month; plan papers usually call such a plan “HSA-eligible”
          or “HDHP”. If you were covered all year as a member of someone else's plan (a parent's, or your spouse's), or by
          a plan for only you and a family plan at once, choose “covering more than one person”; if that was so for only part
          of the year, choose “No”. A change of insurer with no gap and the same kind of plan is not a change.
        to: What counts is the plan you had on the first day of each month; plan papers usually call such a plan “HSA-eligible”
          or “HDHP”, and a bronze or catastrophic plan counts too. If you were covered all year as a member of someone else's
          plan (a parent's, or your spouse's), or by a plan for only you and a family plan at once, choose “covering more
          than one person”; if that was so for only part of the year, choose “No”. A change of insurer with no gap and the
          same kind of plan is not a change.
    - set:
        line: f8889.clear_all_year
        field: expr.source
        from: 'On the first day of every month of 2025, were all three of these true?


          - you were not enrolled in Medicare, counting Medicare coverage backdated to an earlier month

          - you had no other health coverage, apart from the coverage the instructions disregard (accident, disability, dental,
          vision, long-term care, telehealth and other remote care, workers'' compensation, tort or property liability insurance,
          insurance for a specified disease or illness, and insurance paying a fixed amount per day of hospitalization); VA
          care for a service-connected disability and benefits under surprise billing laws are not other health coverage

          - you could not be claimed as a dependent on someone else''s 2025 return'
        to: 'On the first day of every month of 2026, were all three of these true?


          - you were not enrolled in Medicare, counting Medicare coverage backdated to an earlier month

          - you had no other health coverage, apart from the coverage the instructions disregard (accident, disability, dental,
          vision, long-term care, telehealth and other remote care, workers'' compensation, tort or property liability insurance,
          insurance for a specified disease or illness, and insurance paying a fixed amount per day of hospitalization); VA
          care for a service-connected disability, benefits under surprise billing laws and a direct primary care service
          arrangement are not other health coverage

          - you could not be claimed as a dependent on someone else''s 2026 return'
    - set:
        line: f8889.clear_all_year
        field: cite.locator
        from: p. 2, Eligible Individual, "you must be covered under a high deductible health plan (HDHP) and have no other
          health coverage except certain disregarded coverage ... you cannot be enrolled in Medicare or be another person's
          dependent"; p. 2, Certain coverage disregarded and Permitted insurance; p. 2, Eligible Individual, VA hospital care
          or medical services for a service-connected disability and benefits under surprise billing laws; p. 4, "You cannot
          deduct any contributions for any month in which you were enrolled in Medicare. Also, you cannot deduct contributions
          if you are someone else's dependent for 2025"; p969 p. 7, Enrolled in Medicare, "This rule applies to periods of
          retroactive Medicare coverage"
        to: p. 3, Eligible Individual, "you must be covered under an HDHP and have no other health plan except certain disregarded
          coverage"; p. 3, Eligible Individual, "However, you cannot be enrolled in Medicare or be another person’s dependent.";
          p. 3, Certain coverage disregarded and Permitted insurance; p. 3, Eligible Individual, VA hospital care or medical
          services for a service-connected disability, benefits under surprise billing laws, and "A direct primary care service
          arrangement is not considered a health plan and does not disqualify an otherwise “eligible individual”"; p. 5, "You
          cannot deduct any contributions for any month in which you were enrolled in Medicare. Also, you cannot deduct contributions
          if you are someone else’s dependent for 2026."
    - set_question:
        input: f8889.clear_all_year
        field: help
        from: 'Other health coverage means a second plan that pays medical bills before the high deductible is met, such as
          your spouse''s ordinary plan that also covers you. These do not count either: telehealth, workers'' compensation,
          liability cover under a car or home policy, insurance for one named illness or a fixed amount per day in hospital,
          and VA care for a service-connected disability. Medicare counts from the month its coverage began, even if that
          was set back. If you are not sure, answer No.'
        to: 'Other health coverage means a second plan that pays medical bills before the high deductible is met, such as
          your spouse''s ordinary plan that also covers you. These do not count either: telehealth, workers'' compensation,
          liability cover under a car or home policy, insurance for one named illness or a fixed amount per day in hospital,
          VA care for a service-connected disability, and a direct primary care arrangement (a set fee paid to a doctor''s
          practice). Medicare counts from the month its coverage began, even if that was set back. If you are not sure, answer
          No.'
    - set_question:
        input: f8889.months_eligible
        field: help
        from: Count a month only if everything held on its first day; December counts as one of the months. An FSA or HRA
          that pays only dental and vision costs, or nothing until the minimum annual deductible for an HSA plan is met ($1,650
          for a plan covering one person, $3,300 for more), does not count against a month; nor do telehealth, workers' compensation,
          insurance for one named illness or a fixed amount per day in hospital, or VA care for a service-connected disability.
          Zero if there was no such month.
        to: Count a month only if everything held on its first day; December counts as one of the months. An FSA or HRA that
          pays only dental and vision costs, or nothing until the minimum annual deductible for an HSA plan is met ($1,700
          for a plan covering one person, $3,400 for more), does not count against a month; nor do telehealth, workers' compensation,
          insurance for one named illness or a fixed amount per day in hospital, VA care for a service-connected disability,
          or a direct primary care arrangement (a set fee paid to a doctor's practice). A bronze or catastrophic plan counts
          as an HSA-qualifying plan. Zero if there was no such month.
