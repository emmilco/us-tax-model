changes:
  tax_year: 2026
  form: carloan
  entries:
  - change: C-SCHED-40
    evidence:
    - doc: fr-2026-18219
      page: 22
      quote: existing indebtedness on a vehicle traded in as part of a purchase transaction for an APV, to the extent such
        indebtedness exceeds the vehicle’s trade-in value specified by the contract for the purchase of the APV
    - doc: fr-2026-18219
      page: 24
      quote: to purchase collision and liability insurance that is not a credit insurance product, or to purchase any property
        or services unrelated to an APV (for example, a trailer or a boat) is not incurred by a taxpayer for the purchase
        of an APV
    - doc: fr-2026-18219
      page: 24
      quote: Only the portion of the indebtedness allocated to the indebtedness described in paragraph (d)(2)(i) of this section
        is an SPVL
    - doc: fr-2026-18219
      page: 24
      quote: The amount of the new loan that is an SPVL is limited to the outstanding balance of the refinanced loan as of
        the date of the refinancing
    - doc: fr-2026-18219
      page: 24
      quote: A taxpayer allocates principal and interest between the amount of the new loan that is an SPVL and the remaining
        portion of the indebtedness on a pro rata basis
    - doc: fr-2026-18219
      page: 25
      quote: 'Example 4: Negative equity and a down payment'
    - doc: fr-2026-18219
      page: 25
      quote: only 90 percent of each interest payment on the loan may be QPVLI
    - doc: fr-2026-18219
      page: 27
      quote: Independently deductible interest is limited to interest that is QPVLI
    - doc: fr-2026-18219
      page: 28
      quote: This section applies to taxable years beginning after December 31, 2024, and before January 1, 2029.
    verified: final
    note: 'The car loan citations of the proposed regulations (fr-2025-24154, not in the 2026 archive) moved to the final
      regulations, T.D. 10054 (fr-2026-18219): each section at its page in the final (paragraph (d) on p. 24, its examples
      on pp. 24 and 25, (e) on p. 25, (g) on p. 27), the definition of negative equity renumbered (b)(9), Example 4''s heading
      and the collision and liability insurance passage quoted as the final prints them, and the final''s new Example 5 (the
      pro rata split of each interest payment) cited for carloan.mixed_prorated. Citations only: the rules the lines compute
      read the same in the final. What the final changes in substance (credit insurance products qualify; collision and liability
      insurance that is not a credit insurance product does not) bears on the wording of carloan.nonqualifying, and the final
      applies to taxable years beginning after December 31, 2024, so to 2025 as well: a bug of the 2025 form (BUG-1441), whose fix the
      year carries.'
