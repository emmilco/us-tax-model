  - change: C-BUS-04
    evidence:
    - doc: i1040sc
      page: 11
      quote: You can fully deduct the following meal expenses
    - doc: i1040sc
      page: 11
      quote: Meals provided to crew members on certain commercial fishing vessels and at other qualifying facilities
    - doc: i1040sc
      page: 11
      quote: Meals that are part of goods or services sold in a bona fide transaction for adequate and full consideration
    - doc: i1040sc
      page: 11
      quote: may not deduct costs paid or incurred after 2025 for the operation of an employer-operated eating facility
    - doc: i1040sc
      page: 2
      quote: However no deduction is allowed for expenses paid or incurred after 2025 by an employer
    verified: draft
    note: 'The full-deduction list follows the 2026 text (two cases reworded, two added) and keeps the Pub. 463 cases of the
      2025 question (client-reimbursed contractor meals, employee recreation, food for the public), whose 2026 edition is
      not archived: amb.2025.meals_full_exceptions is to be re-ruled when p463 for 2026 is archived. Section 274(o) meals
      (for the convenience of the employer, or of an employer-operated eating facility) are excluded from both the 50% and
      the full amounts.'
    operations:
    - set:
        line: sc.meals_50
        field: expr.source
        from: 'The full cost of business meals (actual cost or the standard meal allowance) subject to the 50% limit, before
          applying the percentage: meals while you or your employees travel away from home on business, including your employees''
          travel meals you pay for or reimburse other than as wages; and meals with a current or potential business customer,
          client, consultant or similar business contact that were ordinary and necessary in your business, not lavish or
          extravagant, with you or your employee present, and, at an entertainment event, bought separately from the entertainment
          or stated separately on the bill. Do not include entertainment, meals during a period of duty under the Department
          of Transportation hours of service limits, or food for the children in your daycare, which are asked about separately;
          zero if none'
        to: 'The full cost of business meals (actual cost or the standard meal allowance) subject to the 50% limit, before
          applying the percentage: meals while you or your employees travel away from home on business, including your employees''
          travel meals you pay for or reimburse other than as wages; and meals with a current or potential business customer,
          client, consultant or similar business contact that were ordinary and necessary in your business, not lavish or
          extravagant, with you or your employee present, and, at an entertainment event, bought separately from the entertainment
          or stated separately on the bill. Do not include entertainment, meals during a period of duty under the Department
          of Transportation hours of service limits, or food for the children in your daycare, which are asked about separately,
          and do not include meals provided to your employees for your convenience or food and beverages of an eating facility
          you operate for your employees, which are not deductible; zero if none'
    - set:
        line: sc.meals_50
        field: cite.locator
        from: pp. 9–10, Line 24b, Business meal expenses ("You can deduct a percentage of the actual cost of a meal if the
          following conditions are met"), Standard meal allowance, Amount of deduction ("including meals incurred while away
          from home on business"); p. 9, Line 24a, "Do not include entertainment expenses on this line"
        to: pp. 10–11, Line 24b, Business meal expenses ("You can deduct a percentage of the actual cost of a meal if the
          following conditions are met"), Standard meal allowance, Amount of deduction ("including meals incurred while away
          from home on business"); p. 10, Line 24a, "Do not include entertainment expenses on this line"; p. 11, Meals furnished
          to employees for the convenience of the employer, "may not deduct costs paid or incurred after 2025 for the operation
          of an employer-operated eating facility"
    - set:
        line: sc.meals_50_if_travel_meals
        field: cite.locator
        from: pp. 9–10, Line 24b, Business meal expenses ("You can deduct a percentage of the actual cost of a meal if the
          following conditions are met"), Standard meal allowance, Amount of deduction ("including meals incurred while away
          from home on business"); p. 9, Line 24a, "Do not include entertainment expenses on this line"
        to: pp. 10–11, Line 24b, Business meal expenses ("You can deduct a percentage of the actual cost of a meal if the
          following conditions are met"), Standard meal allowance, Amount of deduction ("including meals incurred while away
          from home on business"); p. 10, Line 24a, "Do not include entertainment expenses on this line"; p. 11, Meals furnished
          to employees for the convenience of the employer, "may not deduct costs paid or incurred after 2025 for the operation
          of an employer-operated eating facility"
    - set:
        line: sc.meals_100
        field: label
        from: Meals and incidentals not subject to the 50% limit, deducted in full
        to: Meals not subject to the 50% limit, deducted in full
    - set:
        line: sc.meals_100
        field: expr.source
        from: 'The cost of meals and incidentals not subject to the 50% limit, deducted in full: meals furnished or reimbursed
          to an employee and treated as wages subject to withholding; meals provided to a nonemployee, to the extent includible
          in their income and reported on Form 1099-NEC; meals a customer or client reimbursed you for, as an independent
          contractor, after you gave them adequate records; recreational, social or similar activities for your employees
          (such as a holiday party or a summer picnic); food and beverages provided to the general public as advertising or
          to promote goodwill; meals you sell to the public; and, if you run a daycare, the food consumed by the children
          in your care (actual cost or, for eligible children in family daycare, the standard meal and snack rates; not food
          consumed by you or your family), less any reimbursement under a food program of the Department of Agriculture. Don''t
          include anything entered elsewhere on this Schedule C (for example, in cost of goods sold); zero if none'
        to: 'The cost of meals not subject to the 50% limit, deducted in full: meals provided to an employee whose value you
          include in the employee''s wages subject to withholding; meals provided to a nonemployee, to the extent their value
          is includible in their income and reported on Form 1099-NEC; meals provided to crew members on certain commercial
          fishing vessels and at other qualifying facilities; meals that are part of goods or services you sell in a bona
          fide transaction for adequate and full consideration (such as food bought to prepare meals for restaurant or catering
          customers, including meals your employees eat at the worksite); meals a customer or client reimbursed you for, as
          an independent contractor, after you gave them adequate records; recreational, social or similar activities for
          your employees (such as a holiday party or a summer picnic); food and beverages provided to the general public as
          advertising or to promote goodwill; and, if you run a daycare, the food consumed by the children in your care (actual
          cost or, for eligible children in family daycare, the standard meal and snack rates; not food consumed by you or
          your family), less any reimbursement under a food program of the Department of Agriculture. Do not include meals
          provided to your employees for your convenience or food and beverages of an eating facility you operate for your
          employees (not deductible), unless you sell them to the employees for full value or they are fishing-vessel or fish-processing
          meals. Don''t include anything entered elsewhere on this Schedule C (for example, in cost of goods sold); zero if
          none'
    - set:
        line: sc.meals_100
        field: cite.locator
        from: p. 10, Line 24b, Amount of deduction, "However, you can fully deduct meals and incidentals furnished or reimbursed
          to an employee if you properly treat the expense as wages subject to withholding. You can also fully deduct meals
          and incidentals provided to a nonemployee to the extent the expenses are includible in the gross income of that
          person and reported on Form 1099-NEC" and Daycare providers, "If you receive reimbursement under a food program
          of the Department of Agriculture, only deduct the cost of food that exceeds reimbursement"; p587 p. 13, Meals, "You
          can deduct as a business expense 100% of the actual cost of food consumed by your daycare recipients"
        to: p. 11, Line 24b, Amount of deduction, "You can fully deduct the following meal expenses", "Meals provided to an
          employee if you include the value of the meals in the employee’s wages subject to withholding", "Meals provided
          to a nonemployee to the extent the value is includible in the recipient’s gross income and properly reported on
          Form 1099-NEC", "Meals provided to crew members on certain commercial fishing vessels and at other qualifying facilities"
          and "Meals that are part of goods or services sold in a bona fide transaction for adequate and full consideration";
          Meals furnished to employees for the convenience of the employer, "may not deduct costs paid or incurred after 2025
          for the operation of an employer-operated eating facility" and "However, a sole proprietor may deduct such costs
          if the costs are for a meal it sells to employees in a bona fide transaction"; Daycare providers, "If you receive
          reimbursement under a food program of the Department of Agriculture, only deduct the cost of food that exceeds reimbursement";
          p587 p. 13, Meals, "You can deduct as a business expense 100% of the actual cost of food consumed by your daycare
          recipients"
    - set:
        line: sc.meals_100_if_travel_meals
        field: label
        from: Meals and incidentals not subject to the 50% limit, deducted in full, asked only of a business with travel,
          meal or food expenses (zero without)
        to: Meals not subject to the 50% limit, deducted in full, asked only of a business with travel, meal or food expenses
          (zero without)
    - set:
        line: sc.meals_100_if_travel_meals
        field: cite.locator
        from: p. 10, Line 24b, Amount of deduction, "However, you can fully deduct meals and incidentals furnished or reimbursed
          to an employee if you properly treat the expense as wages subject to withholding. You can also fully deduct meals
          and incidentals provided to a nonemployee to the extent the expenses are includible in the gross income of that
          person and reported on Form 1099-NEC" and Daycare providers, "If you receive reimbursement under a food program
          of the Department of Agriculture, only deduct the cost of food that exceeds reimbursement"; p587 p. 13, Meals, "You
          can deduct as a business expense 100% of the actual cost of food consumed by your daycare recipients"
        to: p. 11, Line 24b, Amount of deduction, "You can fully deduct the following meal expenses", "Meals provided to an
          employee if you include the value of the meals in the employee’s wages subject to withholding", "Meals provided
          to a nonemployee to the extent the value is includible in the recipient’s gross income and properly reported on
          Form 1099-NEC", "Meals provided to crew members on certain commercial fishing vessels and at other qualifying facilities"
          and "Meals that are part of goods or services sold in a bona fide transaction for adequate and full consideration";
          Meals furnished to employees for the convenience of the employer, "may not deduct costs paid or incurred after 2025
          for the operation of an employer-operated eating facility" and "However, a sole proprietor may deduct such costs
          if the costs are for a meal it sells to employees in a bona fide transaction"; Daycare providers, "If you receive
          reimbursement under a food program of the Department of Agriculture, only deduct the cost of food that exceeds reimbursement";
          p587 p. 13, Meals, "You can deduct as a business expense 100% of the actual cost of food consumed by your daycare
          recipients"
    - set_question:
        input: sc.meals_50
        field: help
        from: Include travel meals of employees that you paid for. Leave out entertainment, lavish meals, and the meals the
          next two questions ask about (transport workers on duty, and food deducted in full).
        to: Include travel meals of employees that you paid for. Leave out entertainment, lavish meals, meals you give staff
          for your convenience or in a cafeteria you run (not deductible), and the meals the next two questions ask about.
    - set_question:
        input: sc.meals_100
        field: prompt
        from: 'How much did this business spend in 2025 on food and drink that is deducted in full: a staff party or picnic,
          food given to the public to promote the business, meals it sells, meals counted as someone’s pay, meals a client
          paid you back for, or food for the children in your daycare?'
        to: 'How much did this business spend in 2026 on food and drink that is deducted in full: a staff party or picnic,
          food given to the public to promote the business, meals it sells (with its staff’s meals at work that are part of
          them), meals counted as someone’s pay, meals for the crew of a commercial fishing vessel, meals a client paid you
          back for, or food for the children in your daycare?'
  - change: C-BUS-06
    evidence:
    - doc: i1040sc
      page: 11
      quote: Space used for storage is allowed only if the residence is the sole fixed location of your business
    verified: draft
    note: The storage condition (the home the sole fixed location of the business) is in the 2025 definitions too, cited there
      to Pub. 587 (2025) p. 3, which the 2025 i1040sc refers to; for 2026 the instructions state it themselves (p. 11), so these
      operations move the citations to the 2026 i1040sc and change the year. The tick-box label of sc.ho_uses and the
      square-feet help are the same in both years.
    operations:
    - set:
        line: sc.ho_uses
        field: cite.locator
        from: p. 10, Line 30, Business use of your home; Simplified method, "used regularly and exclusively for business, regularly
          for daycare, or regularly for storage"; Pub. 587 referenced; p587 p. 3, Storage of inventory or product samples, "Your
          home is the only fixed location of your trade or business"
        to: p. 11, Line 30, Business use of your home; Simplified method, "Space used for storage is allowed only if the residence
          is the sole fixed location of your business"; Pub. 587 referenced
    - set:
        line: sc.ho_sqft
        field: expr.source
        from: The square feet of your home used regularly and exclusively for this business (or, if your home is the sole fixed
          location of the business, regularly for storing inventory or product samples) throughout 2025
        to: The square feet of your home used regularly and exclusively for this business (or, if your home is the sole fixed
          location of the business, regularly for storing inventory or product samples) throughout 2026
    - set:
        line: sc.ho_sqft
        field: cite.locator
        from: p. 12, Simplified Method Worksheet, line 2, and line 30 entry spaces; p. 10, Simplified method; p587 p. 3, Storage
          of inventory or product samples, "Your home is the only fixed location of your trade or business"
        to: p. 14, Simplified Method Worksheet, line 2, and line 30 entry spaces; p. 11, Simplified method, "Space used for
          storage is allowed only if the residence is the sole fixed location of your business"
    - set_question:
        input: sc.ho_uses
        field: prompt
        from: In 2025, did you use part of your home regularly and only for this business, regularly as a daycare, or (if your
          home is its only fixed place of business) regularly to store its stock or samples, and do you want to deduct it?
        to: In 2026, did you use part of your home regularly and only for this business, regularly as a daycare, or (if your
          home is its only fixed place of business) regularly to store its stock or samples, and do you want to deduct it?
