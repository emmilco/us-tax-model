        line: sc.line16a
        field: cite.locator
        from: p. 8, Lines 16a and 16b, How to report; p. 14, Line 30, "You can’t deduct any excess mortgage interest, excess
          real estate taxes, or excess casualty losses on Schedule C for this home"
