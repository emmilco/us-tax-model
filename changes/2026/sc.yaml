            locator: p. 9, Line 16b, "Enter interest paid or accrued on debt incurred to purchase a vehicle that is used in
              your trade or business" and "Deduct only the business-use portion of the vehicle loan interest on Schedule C
              (Form 1040)"; p. 7, Line 9, "Report the business-use portion of vehicle loan interest on line 16b, regardless
              of whether you use the business standard mileage rate or the actual costs of operating your vehicle"
    - set:
        line: sc.interest_other
        field: printed
        from: 16b
        to: 16c
    - set:
        line: sc.interest_other
        field: expr.source
        from: Other interest on business debt (including mortgage interest not reported on a Form 1098 to you); for a vehicle
          used for business and personal purposes, only the business part, and none of the interest you deduct on Schedule
          1-A; for interest paid in 2025 that also applies to future years, only the part that applies to 2025; for a mortgage
          on which you and another person (other than your spouse on a joint return) were liable and paid interest and the
          other person received the Form 1098, only your share; not mortgage interest on your home; zero if none
        to: Other interest on business debt (including mortgage interest not reported on a Form 1098 to you; not interest
          on a loan to buy a vehicle, which is asked with each vehicle); for interest paid in 2026 that also applies to future
          years, only the part that applies to 2026; for a mortgage on which you and another person (other than your spouse
          on a joint return) were liable and paid interest and the other person received the Form 1098, only your share; not
          mortgage interest on your home; zero if none
    - set:
        line: sc.interest_other
        field: cite.locator
        from: p. 8, Lines 16a and 16b, "If you paid interest in 2025 that also applies to future years, deduct only the part
          that applies to 2025" and "include your share of the interest on line 16b"; p. 14, Line 30, "You can’t deduct any
          excess mortgage interest, excess real estate taxes, or excess casualty losses on Schedule C for this home"
        to: p. 9, Line 16c, "Enter any business-related interest not listed on line 16a or 16b"; Line 16a, "If you did not
          receive a Form 1098, enter the interest on line 16c", "include your share of the interest on line 16c" and "If you
          paid interest in 2026 that also applies to future years, deduct only the part that applies to 2026"; p. 15, Line
          30, "You can’t deduct any excess mortgage interest, excess real estate taxes, or excess casualty losses on Schedule
          C for this home"
    - set:
        line: sc.line23
        field: expr.source
        from: 'Business taxes and licenses: sales tax imposed on you as the seller, real estate and personal property taxes
          on business assets, licenses and regulatory fees paid each year (not licenses you must amortize, such as some liquor
          licenses, and not license plates for a car, truck or van you list for this business, which its car and truck expenses
          already include), the employer share of social security and Medicare taxes, federal unemployment tax, federal highway
          use tax, contributions to a state unemployment insurance fund or a paid family and medical leave program disability
