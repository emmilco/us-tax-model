      page: 9
      quote: If you did not receive a Form 1098, enter the interest on line 16c
    - doc: i1040sc
      page: 9
      quote: include your share of the interest on line 16c
    - doc: i1040sc
      page: 7
      quote: 'Report the business-use portion of these expenses as follows: vehicle loan interest on line 16b and personal
        property taxes on your vehicle on line 23'
    verified: draft
    note: 'The new printed line 16b is the sum over the business''s vehicles of scveh.loan_interest (changes/2026/scveh.yaml,
      C-BUS-02); the line that was 16b keeps its id sc.interest_other and is printed 16c. The business-use portion is asked, not
      figured: the 2026 text says to allocate the interest between business and personal use without naming a method, and
      the 2025 line 16b asked the business part the same way. Line 23 now names the business-use part of a listed vehicle''s
      personal property tax, which the 2026 text routes there under either method.'
    operations:
