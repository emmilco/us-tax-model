changes:
  tax_year: 2026
  form: asset
  entries:
  - change: C-BUS-11
    evidence:
    - doc: f4562
      page: 2
      quote: 14a Special depreciation allowance for certain qualified property (other than listed property) under section
        168(k)
    verified: draft
    operations:
    - set:
        line: asset.bonus
        field: printed
        from: '14'
        to: 14a
  - change: C-BUS-12
    evidence:
    - doc: rp-26-15
      page: 2
      quote: the applicable percentage for qualified property acquired after September 27, 2017, and before January 20, 2025,
        and placed in service during calendar year 2026 is 20 percent
    - doc: plaw-119-21
      page: 119
      quote: In the case of qualified property placed in service by the taxpayer during the first taxable year ending after
        January 19, 2025, if the taxpayer elects to have this paragraph apply for such taxable year
    verified: final
    note: 'As in changes/2026/scveh.yaml C-BUS-12: sc.bonus_rate_phase_down replaces sc.bonus_rate_40, and the 2026 enum bonus_choice
      must drop forty.'
    operations:
    - set:
        line: asset.bonus_choice
        field: expr.source
        from: For the class of property this belongs to (its recovery period), did you claim the special depreciation allowance
          (full), elect the 40% allowance instead of 100% for property acquired after January 19, 2025 (forty), or elect not
          to claim any special allowance (none)?
        to: For the class of property this belongs to (its recovery period), did you claim the special depreciation allowance
          (full) or elect not to claim any special allowance (none)?
    - set:
        line: asset.bonus_choice
        field: cite.locator
        from: pp. 5–6, Line 14, "you can elect to take a 40% special depreciation allowance"; p. 7, Election out, "for any
          class of property"
        to: p. 7, Election out, "for any class of property"; plaw-119-21 sec. 70301(b)(3) (139 Stat. 189), the election of
          40 percent "In the case of qualified property placed in service by the taxpayer during the first taxable year ending
          after January 19, 2025" (not available for property placed in service in 2026)
    - set:
        line: asset.bonus_claimed
        field: label
        from: A special depreciation allowance is claimed for the class of this property (the full allowance or the 40% allowance)
        to: A special depreciation allowance is claimed for the class of this property
    - set:
        line: asset.rate40
        field: label
        from: 40% special allowance
        to: 20% special allowance (acquired after September 27, 2017, and before January 20, 2025)
    - set:
        line: asset.rate40
        field: expr.ref
        from: sc.bonus_rate_40
        to: sc.bonus_rate_phase_down
    - set:
        line: asset.rate40
        field: cite.doc
        from: i4562
        to: rp-26-15
    - set:
        line: asset.rate40
        field: cite.locator
        from: pp. 5–6, Line 14, "is limited to a special depreciation allowance of 40% of the depreciable basis"
        to: p. 2, section 2.02, "the applicable percentage for qualified property acquired after September 27, 2017, and before
          January 20, 2025, and placed in service during calendar year 2026 is 20 percent"
    - set:
        line: asset.bonus_forty
        field: label
        from: 40% special allowance
        to: 20% special allowance
    - set:
        line: asset.bonus_fullcase
        field: label
        from: 'The allowance when it is claimed: 100% if acquired after January 19, 2025; 40% if acquired after September
          27, 2017 and before January 20, 2025'
        to: 'The allowance when it is claimed: 100% if acquired after January 19, 2025; 20% if acquired after September 27,
          2017 and before January 20, 2025'
    - set:
        line: asset.bonus_elected
        field: expr.alternatives
        from:
        - guard:
            op: test
            eq:
            - asset.bonus_choice
            - const: full
          then: asset.bonus_fullcase
        - guard:
            op: test
            eq:
            - asset.bonus_choice
            - const: forty
          then: asset.bonus_forty
        - guard:
            op: test
            eq:
            - asset.bonus_choice
            - const: none
          then: asset.zero
        to:
        - guard:
            op: test
            eq:
            - asset.bonus_choice
            - const: full
          then: asset.bonus_fullcase
        - guard:
            op: test
            eq:
            - asset.bonus_choice
            - const: none
          then: asset.zero
    - set_question:
        input: asset.bonus_choice
        field: value_labels
        from:
          full: 'Yes: the special depreciation allowance'
          forty: The 40% allowance in place of 100% (an election for property acquired after January 19, 2025)
          none: 'No: I elect not to take any special allowance'
        to:
          full: 'Yes: the special depreciation allowance'
          none: 'No: I elect not to take any special allowance'
