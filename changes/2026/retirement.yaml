            this tool.
          cite:
            doc: i1040gi
            locator: p. 27, Exception 2; f1099r Box 7
        to:
        - when: retirement.trump
          form: Form 5329 Parts X and XI (Trump accounts)
          remedy: A distribution from a Trump account (box 7c of Form 1099-R checked) is outside this tool.
          cite:
            doc: f1099r
            locator: p. 9, Box 7c, "If the Trump account box is checked, you’ve received a distribution from a Trump account.";
              Box 7d, "Shows the earnings attributable to the distributed excess contributions made to a Trump account."
