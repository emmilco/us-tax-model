            SIMPLE IRA, code 3 other than from an IRA, or a distribution code other than 7, 4, 2, 1, S, 3, G or Q, is outside
            this tool.
          cite:
            doc: i1040gi
            locator: p. 27, Exception 2; f1099r Box 7
        - when: retirement.screen_refused
          form: Form 5329 or Form 8915-F for this Form 1099-R
          remedy: A qualified disaster recovery distribution, a modified series of substantially equal payments, an annuity
            or modified endowment contract distribution, a repayment, a December 30-31 long-term care distribution, more than
            one exception, an exception covering only part of a code 2 distribution, or a code 4 or 7 that does not fit needs
            Form 5329 or Form 8915-F rules this tool does not apply.
          cite:
            doc: i5329
            locator: p. 5, Line 2, "Enter on line 2 the amount that you can exclude."
        - when: retirement.annuity_rollover
          form: Pub. 575 (rollover of a pension or annuity figured by the Simplified Method)
          remedy: A rollover from a pension or annuity whose taxable part is figured with the Simplified Method is outside
            this tool.
          cite:
            doc: i1040gi
            locator: p. 30, Rollovers, 'See Pub. 575 for more details on rollovers'
        to:
        - when: retirement.trump
          form: Form 5329 Parts X and XI (Trump accounts)
          remedy: A distribution from a Trump account (box 7c of Form 1099-R checked) is outside this tool.
          cite:
            doc: f1099r
            locator: p. 9, Box 7c, "If the Trump account box is checked, you’ve received a distribution from a Trump account.";
              Box 7d, "Shows the earnings attributable to the distributed excess contributions made to a Trump account."
