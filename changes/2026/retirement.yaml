  - change:
    - C-PEOP-05
    - C-PEOP-07
    evidence:
    - *id004
    - doc: p590b
      page: 29
      quote: you are a first-time homebuyer if you had no present interest in a main home during the 2-year period ending
        on the date of acquisition of the home that the distribution is being used to buy, build, or rebuild.
    verified: draft
    note: 'One locator holds both entries'' quotes, so both are set here: the exception range (01–24) and the first-time homebuyer
      sentence of Pub. 590-B ("that" for "which", now p. 29).'
    operations:
    - set:
