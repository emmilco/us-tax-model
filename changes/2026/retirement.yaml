          buying, building, or rebuilding a home." and "Any usual or reasonable settlement, financing, or other closing costs."; First-time
          homebuyer, "Generally, you are a first-time homebuyer if you had no present interest in a main home during the 2-year period
          ending on the date of acquisition of the home that the distribution is being used to buy, build, or rebuild. If you are
          married, your spouse must also meet this no-ownership requirement.", "You enter into a binding contract to buy the main
          home", "You were ordered or called to active duty after September 11, 2001.", "of more than 179 days or for an indefinite
