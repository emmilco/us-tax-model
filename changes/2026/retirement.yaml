          number (01–23). If more than one exception applies, enter 99.", "Qualified retirement plan distributions (doesn’t apply
          to IRAs) you received after separation from service when the separation from service occurs in or after the year you reach
          age 55 (age 50 for qualified public safety employees and private sector firefighters) or 25 years of service under the plan,
          whichever is earlier.", "(if from an employer plan, payments must begin after separation from service)", "You are considered
          disabled if you can furnish proof that you can’t do any substantial gainful activity because of your physical or mental
