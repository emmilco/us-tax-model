      page: 6
      quote: Schedule 2, line 16c; and
    - doc: i1040s8812
      page: 6
      quote: Schedule 2, line 17c.
    verified: draft
    note: Only the references move (2025 Schedule 2 lines 5 and 6 are 2026 line 16c's parts, line 13 is 17c); the Schedule
      2 amounts stay refused through s2.other, whose wording the Schedule 2 operations (C-SCHED-10) carry.
    operations:
    - set:
        line: s8812.line22
        field: label
        from: Enter the total of the amounts from Schedule 1, line 15; Schedule 2, line 5; Schedule 2, line 6; and Schedule
          2, line 13
        to: Enter the total of the amounts from Schedule 1, line 15; Schedule 2, line 16c; and Schedule 2, line 17c
    - set:
        line: s8812.line22
        field: cite.locator
        from: Schedule 8812 (2025), line 22 (Schedule 2 lines 5, 6 and 13 are refused by s2.other)
        to: Schedule 8812 (2026), line 22 (draft) (Schedule 2 lines 16c and 17c are refused by s2.other)
    - set:
        line: s8812.line22
        field: refuses
        from:
        - when: s2.other
          form: Schedule 8812 line 22 (Schedule 2, lines 5, 6 and 13)
          remedy: Other Schedule 2 taxes are outside this tool.
          cite:
            doc: f1040s8812
            locator: Schedule 8812 (2025), line 22
        to:
        - when: s2.other
          form: Schedule 8812 line 22 (Schedule 2, lines 16c and 17c)
          remedy: Other Schedule 2 taxes are outside this tool.
          cite:
            doc: f1040s8812
            locator: Schedule 8812 (2026), line 22 (draft)
