  - change: C-SCHED-19
    evidence:
    - doc: i1040s8812
      page: 2
      quote: To claim the CTC or ACTC on either your original or an amended 2026 return, you must have a valid SSN.
    - doc: i1040s8812
      page: 2
      quote: only one filer is required to have a valid SSN to be eligible for the CTC or ACTC
    - doc: i1040s8812
      page: 2
      quote: The qualifying child used to claim the CTC or ACTC on either your original or an amended 2026 return must have
        a valid SSN.
    - doc: i1040s8812
      page: 2
      quote: To claim the ODC on either your original or an amended 2026 return, you (and your spouse if filing jointly) must
        have an SSN or ITIN issued on or before the due date of your return (including extensions).
    verified: draft
    note: The i1040s8812 sentences are requoted from the 2026 draft; the i1040gi parts of both citations keep their 2025 quotes
      until the 2026 Instructions for Form 1040 are archived.
    operations:
    - set:
        line: s8812.line4
        field: cite.locator
        from: Schedule 8812 (2025), line 4; i1040s8812 p. 1, Taxpayer Identification Number Requirements, "If you, and your
          spouse if filing jointly, do not have a valid SSN, you can’t claim the CTC or ACTC", "If you are filing a joint
          return, only one spouse is required to have a valid SSN to be eligible for the CTC or ACTC", "For the CTC and ACTC,
          a valid SSN is one that is valid for employment and that is issued by the Social Security Administration before
          the due date of your 2025 return (including extensions)", "If you have a qualifying child who does not have a valid
          SSN, you can’t use the child to claim the CTC or ACTC"; i1040gi pp. 17–19, Step 3, "Do you have a child who meets
          the conditions to be your qualifying child?", "Was the child a U.S. citizen, U.S. national, or U.S. resident alien?",
          "Was the child under age 17 at the end of 2025?", "Did you, or your spouse if filing a joint return, and this child
          have SSNs valid for employment and issued before the due date of your 2025 return (including extensions)?"
        to: Schedule 8812 (2026), line 4; i1040s8812 p. 2 (draft), Valid SSN Required Before the Due Date of Your Return To
          Claim the CTC and ACTC, "To claim the CTC or ACTC on either your original or an amended 2026 return, you must have
          a valid SSN", "If you are filing a joint return, only one filer is required to have a valid SSN to be eligible for
          the CTC or ACTC", "A valid SSN is one that is valid for employment and that is issued by the Social Security Administration
          before the due date of your 2026 return (including extensions)", "The qualifying child used to claim the CTC or
          ACTC on either your original or an amended 2026 return must have a valid SSN"; i1040gi pp. 17–19, Step 3, "Do you
          have a child who meets the conditions to be your qualifying child?", "Was the child a U.S. citizen, U.S. national,
          or U.S. resident alien?", "Was the child under age 17 at the end of 2025?", "Did you, or your spouse if filing a
          joint return, and this child have SSNs valid for employment and issued before the due date of your 2025 return (including
          extensions)?"
    - set:
        line: s8812.line6
        field: cite.locator
        from: Schedule 8812 (2025), line 6; i1040s8812 p. 1, Taxpayer Identification Number Requirements, "If your qualifying
          child does not have a valid SSN, but has another type of taxpayer identification number issued on or before the
          due date of your 2025 return (including extensions), you may be able to claim the ODC for that child", "TIN Required
          by Due Date of Your Return To Claim the ODC", "If you have a dependent who does not have an SSN, ITIN, or ATIN issued
          on or before the due date of your 2025 return (including extensions), you can’t use that dependent to claim the
          ODC"; i1040gi pp. 17–19, Step 3, "Did the child have an SSN, ITIN, or adoption taxpayer identification number (ATIN)
          issued on or before the due date of your return (including extensions)?", "Was the child a U.S. citizen, U.S. national,
          or U.S. resident alien?", "Was the child under age 17 at the end of 2025? Yes. Continue No. You can claim the credit
          for other", "Did your qualifying relative have an SSN, ITIN, or ATIN issued on or before the due date of your 2025
          return (including extensions)?", "Was your qualifying relative a U.S. citizen, U.S. national, or U.S. resident alien?"
        to: Schedule 8812 (2026), line 6; i1040s8812 p. 2 (draft), Qualifying child required to have a valid SSN, "If your
          qualifying child does not have a valid SSN, but has another type of taxpayer identification number issued on or
          before the due date of your 2026 return (including extensions), you may be able to claim the ODC for that child",
          TIN Required by Due Date of Your Return To Claim the ODC, "To claim the ODC on either your original or an amended
          2026 return, you (and your spouse if filing jointly) must have an SSN or ITIN issued on or before the due date of
          your return (including extensions)"; i1040gi pp. 17–19, Step 3, "Did the child have an SSN, ITIN, or adoption taxpayer
          identification number (ATIN) issued on or before the due date of your return (including extensions)?", "Was the
          child a U.S. citizen, U.S. national, or U.S. resident alien?", "Was the child under age 17 at the end of 2025? Yes.
          Continue No. You can claim the credit for other", "Did your qualifying relative have an SSN, ITIN, or ATIN issued
          on or before the due date of your 2025 return (including extensions)?", "Was your qualifying relative a U.S. citizen,
          U.S. national, or U.S. resident alien?"
