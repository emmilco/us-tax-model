  - change: C-SCHED-17
    evidence:
    - doc: f1040s8812
      page: 2
      quote: Enter the total of the amounts from Schedule 1 (Form 1040), line 15; Schedule 2 (Form 1040), line 16c; and Schedule
        2 (Form 1040), line 17c
