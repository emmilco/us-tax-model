    evidence:
    - doc: i1040sc
      page: 11
      quote: Enter the total salaries and wages for the tax year reduced by the amount of the following credit(s), if applicable.
    - doc: i1040sc
      page: 11
      quote: Work Opportunity Credit (Form 5884).
    - doc: i1040sc
      page: 11
      quote: Credit for Employer Differential Wage Payments (Form 8932).
    - doc: i1040sc
      page: 11
      quote: Employer Credit for Paid Family and Medical Leave (Form 8994).
    - doc: i1040sc
      page: 2
      quote: The energy efficient commercial buildings deduction is available only for property for which construction began
        before July 1, 2026.
    - doc: i1040sc
      page: 2
      quote: Qualified sound recording productions that are produced and recorded in the United States have been added to
        the types of property for which certain production costs may be deductible provided the production commences before
