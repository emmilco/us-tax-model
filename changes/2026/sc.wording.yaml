    evidence:
    - doc: i1040sc
      page: 10
      quote: They do not include expenses for laundry, cleaning and pressing of clothing, lodging taxes, or the costs of
        telephone calls.
    - doc: i1040sc
      page: 10
      quote: The amount of the deduction is $5 a day
