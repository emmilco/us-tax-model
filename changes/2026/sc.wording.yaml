    note: 'Form 8844 is dropped from the credits the question names (the 2026 line 26 list is Forms 5884, 8932 and 8994;
      the screen still refuses on the other forms it names). The What''s New pointers of the citation are re-quoted from
      the 2026 p. 2; the p. 1 research and experimental expenditures pointer is not printed in 2026 and is replaced by the
      energy efficient commercial buildings pointer (the 2026 p. 17 sentence on amortizing research costs is not quoted).
      Unquoted page pointers (p. 3, p. 5, p. 6 Line 6 and Medicaid, p. 7, p. 8, p. 9 Line 23 headings, p. 10 Lines 26 and
      27a) and the p463 and i4562 parts are left as they are: the 2026 pages are not verified. The two refusals added to
      the 2025 screen (pay for work done outside the United States; start-up costs over $5,000 of a business begun in the
      year) are carried with their 2026 pages, the start-up one dated 2026 and naming Form 4562-B, which the 2026 draft
      prints for amortization that begins in 2026. The prompt''s leased-vehicle threshold ($62,000) holds for 2026:
      Table 3 of Rev. Proc. 2026-15 (final), for leases beginning in 2026, starts at a fair market value over $62,000, the same as
      the 2025 figure the prompt prints.'
    operations:
    - set:
