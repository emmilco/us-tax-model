    - doc: f1040s1a
      page: 4
      quote: Subtract line 38 from line 37. If zero or less, enter $6,000 on line 41
    - doc: f1040s1a
      page: 4
      quote: Add lines 15, 27, 36, and 43. Enter here and on Form 1040, 1040-SR, or 1040-NR, line 13a
    verified: draft
