# Limits on depreciation and the section 179 deduction for passenger automobiles (including trucks and vans) acquired
# after September 27, 2017, placed in service 2019 to 2025, by year of the recovery period ("4th & later" repeated for
# each later year a 2025 return can reach). Year 1 is the limit with the special depreciation allowance; the limit
# without it is in auto_limit_first_nobonus. Written by hand; checked cell by cell against Pub. 946 (PDF and HTML)
# and Pub. 463 by tools/check_auto_limits.py.
