# New York State household credit table 1 (Filing status ① only, Single), transcribed from the web edition of IT-201-I (the PDF's columns are scattered; sources/ny/2025/README.md),
# cell by cell as printed (docs/ny/DECISIONS.md Part D). Bands are the printed 'Over / but not over' rows of federal
# adjusted gross income in cents: over X and not over Y is [X + 1 cent, Y + 1 cent). The first row, from "(see Note 2)",
# includes zero and negative income ("Note 2 This amount could be 0 or a negative amount."): the line that reads
# this table looks up federal AGI floored at zero. The last band, open above, is "No credit is allowed".
# One column: the table is for filing status ① only; the line chooses it only for a single filer (the column lists every status because a tax table must cover them).
table:
  id: ny_hh_state_t1
  kind: tax_table
  title: "New York State household credit table 1 (Filing status ① only, Single)"
  tax_year: 2025
  cite:
    doc: ny_it201i-html
    locator: 'New York State household credit table 1—Filing status ① only (Single), "If your federal adjusted gross income (see Note 1) is over:", "but not over", "enter on Form IT-201, line 40:"'
    quote: "No credit is allowed; do not make an entry on Form IT-201, line 40."
  bounds: { at_least: 0, less_than: 100000000000000 }
  columns:
    - { key: amount, statuses: [single, mfj, mfs, hoh, qss] }
  bands:
    - { at_least: 0, less_than: 500001, tax: [7500] }
    - { at_least: 500001, less_than: 600001, tax: [6000] }
    - { at_least: 600001, less_than: 700001, tax: [5000] }
    - { at_least: 700001, less_than: 2000001, tax: [4500] }
    - { at_least: 2000001, less_than: 2500001, tax: [4000] }
    - { at_least: 2500001, less_than: 2800001, tax: [2000] }
    - { at_least: 2800001, less_than: 100000000000000, tax: [0] }
