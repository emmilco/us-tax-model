# New York State household credit table 2 (Filing status ②, ④ and ⑤), column 4, transcribed from the web edition of IT-201-I (the PDF's columns are scattered; sources/ny/2025/README.md),
# cell by cell as printed (docs/ny/DECISIONS.md Part D). Bands are the printed 'Over / but not over' rows of federal
# adjusted gross income in cents: over X and not over Y is [X + 1 cent, Y + 1 cent). The first row, from "(see Note 2)",
# includes zero and negative income ("Note 2 This amount could be 0 or a negative amount."): the line that reads
# this table looks up federal AGI floored at zero. The last band, open above, is "No credit is allowed".
# Column 4 of the printed table (that many people: item H dependents plus one for you and one for your spouse on a joint return); the line chooses the column, the "over 7" column (Note 3) is refused where a credit is allowed.
table:
  id: ny_hh_state_t2_p4
  kind: tax_table
  title: "New York State household credit table 2 (Filing status ②, ④ and ⑤), column 4"
  tax_year: 2025
  cite:
    doc: ny_it201i-html
    locator: 'New York State household credit table 2—Filing status ②, ④, and ⑤, "And the number of dependents listed on Form IT-201, item H, plus one for you (and one for your spouse if Married filing joint return) is:", "Enter on Form IT-201, line 40:"'
    quote: "No credit is allowed; do not make an entry on Form IT-201, line 40."
  bounds: { at_least: 0, less_than: 100000000000000 }
  columns:
    - { key: amount, statuses: [single, mfj, mfs, hoh, qss] }
  bands:
    - { at_least: 0, less_than: 500001, tax: [13500] }
    - { at_least: 500001, less_than: 600001, tax: [12000] }
    - { at_least: 600001, less_than: 700001, tax: [11000] }
    - { at_least: 700001, less_than: 2000001, tax: [10500] }
    - { at_least: 2000001, less_than: 2200001, tax: [9000] }
    - { at_least: 2200001, less_than: 2500001, tax: [8000] }
    - { at_least: 2500001, less_than: 2800001, tax: [5500] }
    - { at_least: 2800001, less_than: 3200001, tax: [3500] }
    - { at_least: 3200001, less_than: 100000000000000, tax: [0] }
