    doc: ny_it201i-html
    locator: 'New York City household credit table 5—Filing status ②, ④, and ⑤, "And the number of dependents listed on Form IT-201, item H, plus one for you (and one for your spouse if Married filing joint return) is:", "Enter on Form IT-201, line 48:"'
    quote: "No credit is allowed; do not make an entry on Form IT-201, line 48."
  bounds: { at_least: 0, less_than: 100000000000000 }
  columns:
