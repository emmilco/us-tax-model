# The figures of a 2025 return that the 2026 return takes as answers: each 2025 line (`from`) and the input of the
# 2026 return that holds it (`to`). An input that asks for a prior-year figure has the same id in both years, so `to`
# names it as this year's definitions do. `how`: `copy` enters the figure as it is; `negate` enters a signed loss as a
# positive amount; `nonzero` answers a yes-or-no question with whether the figure is other than zero.
# The build checks every entry against this year's definitions (engine/src/carryover.ts).
tax_year: 2025
carryovers:
  # Capital loss carryover worksheet (clcw) and the recoveries worksheet (rec)
  - {from: f1040.line11a, to: clcw.prior_11, how: copy}
  - {from: f1040.line14, to: clcw.prior_14, how: copy}
  - {from: sd.line7, to: clcw.prior_sd7, how: copy}
  - {from: sd.line15, to: clcw.prior_sd15, how: copy}
  - {from: sd.line21, to: clcw.prior_sd21, how: negate}
  - {from: sd.line21, to: sd.carryover, how: nonzero}
  - {from: f1040.line11a, to: rec.agi_prior, how: copy}
  - {from: f1040.line14, to: rec.ded_prior, how: copy}
  - {from: sa.line4, to: rec.medical_deducted, how: copy}
  # State and local refunds (refund)
  - {from: f1040.status, to: refund.status, how: copy}
  - {from: sa.line5d, to: refund.line5d_prior_year, how: copy}
  - {from: sa.line5e, to: refund.line5e_prior_year, how: copy}
  - {from: sa.total_itemized, to: refund.line17_prior_year, how: copy}
  # Investment interest, residential clean energy credit and section 179 carryforwards
  - {from: f4952.line7, to: f4952.prior_7, how: copy}
  - {from: f4952.line7, to: f4952.carryover, how: nonzero}
  - {from: f5695.carry_out, to: f5695.carry_in, how: copy}
  - {from: f5695.carry_out, to: f5695.carry, how: nonzero}
  - {from: s179.line13, to: s179.carryover, how: copy}
  - {from: s179.line13, to: s179.prior_form, how: nonzero}
  # IRA basis (Form 8606 line 14, per person)
  - {from: f8606.line14, to: person.ira_basis, how: copy}
  # Qualified business loss carryforward (Form 8995 line 16)
  - {from: f8995.qbi_loss_carryforward, to: qbi.carryforward, how: negate}
  # Passive activity loss carried forward, per rental (Form 8582 Part VIII)
  - {from: rental.carryforward, to: rental.prior_amt, how: copy}
  - {from: rental.carryforward, to: rental.prior_any, how: nonzero}
