register:
  tax_year: 2025
  entries:
    - id: amb.2025.multiplication_subcent
      text_at_issue: >
        QDCGT lines 18 and 21 multiply an amount by 15% and 20%. With the
        return-wide rounding setting off (dollars and cents), the instructions
        do not state how a fractional cent in the product is treated.
      readings:
        - Round the product half-up to the nearest cent at the multiplication.
        - Truncate the product toward zero to whole cents.
        - Carry the exact fraction forward until some later rounding step.
      chosen: Round the product half-up to the nearest cent at the multiplication.
      reason: >
        Matches the half-up convention of the printed whole-dollar rounding
        rules. The whole-dollar default is unaffected: whole-dollar amounts
        multiplied by these rates produce exact cents, so the reading only
        matters when cents are turned on.
      cite:
        doc: i1040gi
        locator: QDCGT worksheet, lines 18 and 21; Rounding Off to Whole Dollars, p. 23
      status: Chosen for Stage 1; shown to the user whenever it can affect the return.
    - id: amb.2025.ss_wages
      text_at_issue: Schedule 3 line 11 says total wages without naming W-2 boxes.
      readings:
        - Box 1 taxable compensation
        - Social Security wages and tips in boxes 3 plus 7
      chosen: Use boxes 3 plus 7, summed across employers separately per person.
      reason: Owner approved the Stage 2 proposal. iw2w3 p. 18 defines these boxes and
        their combined wage base; box 1 can exclude deferrals subject to Social
        Security.
      cite:
        doc: iw2w3
        locator: p. 18, boxes 3 and 7; compare i1040gi p. 117, Schedule 3 line 11
      status: Owner approved modeling interpretation; source transcription review
        remains open.
    - id: amb.2025.sales_rounding
      text_at_issue: Form 8949 permits cents or rounding all amounts; Form 1040 says
        add cents before rounding a line total. Row versus total reconciliation
        is not explicit.
      readings:
        - Preserve exact cents throughout.
        - Round each row before aggregation.
        - Round totals after aggregating exact rows.
      chosen: Preserve exact cents throughout Stage 3; whole-dollar mode remains
        deferred.
      reason: Avoid choosing a reconciliation policy without explicit support; cents
        are expressly permitted.
      cite:
        doc: i8949
        locator: p. 3, Rounding Off to Whole Dollars; compare i1040gi p. 23
      status: Stage 3 implementation choice; whole-dollar default not implemented.
    - id: amb.2025.sd4952_selection
      text_at_issue: Schedule D line 20 directs Form 4952 filers to SDTW, while the
        worksheet applicability text specifies an amount on Form 4952 line 4g
        and gives exceptions.
      readings:
        - Follow line 20 literally for every Form 4952 filer.
        - Apply the detailed worksheet applicability and exceptions.
      chosen: Use the detailed worksheet conditions, including line 4g and exceptions.
      reason: The worksheet explicitly limits its own use and the Form 1040 line 16
        instructions repeat the line 4g condition.
      cite:
        doc: i1040sd
        locator: p. 15, Schedule D Tax Worksheet applicability; compare f1040sd line 20
          and i1040gi p. 36
      status: Explicit Stage 3 source interpretation for review.
