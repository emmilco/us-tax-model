    - id: amb.2025.div_gain_portions_disjoint
      text_at_issue: 'Form 1099-DIV boxes 2b, 2c and 2d each show "the portion of the amount in box 2a" of one kind of gain; no
        instruction says whether one amount can be in two of them. div.bad_special refuses when boxes 2b, 2c and 2d together
        exceed box 2a, as well as when any one of them does.'
      readings:
      - The three portions are disjoint, so their sum cannot exceed box 2a; a larger sum is refused as an inconsistent entry.
      - The portions may overlap; only each box against box 2a is tested.
      chosen: The first (div.bad_special tests div.special_total, boxes 2b plus 2c plus 2d, against box 2a).
      reason: >
        The issuer instructions define each box by a different kind of property: box 2b is unrecaptured section 1250 gain "from
        certain depreciable real property", box 2c section 1202 gain "from certain qualified small business stock", box 2d 28%
        rate gain "from sales or exchanges of collectibles"; and box 2a must "Include all amounts shown in boxes 2b, 2c, 2d, and
        2f". No one gain comes from two of those kinds. Box 2f (section 897 gain from US real property interests) can share an
        amount with box 2b, and it is not in the sum. The reading can only refuse an entry, never change a computed amount, and
        any box 2c amount is refused in any case (div.section1202). Recorded under T-006.
      cite:
        doc: i1099div
        locator: p. 4, Box 2a, "Include all amounts shown in boxes 2b, 2c, 2d, and 2f"; Box 2b; Box 2c; Box 2d
      status: Session reading under the owner's standing delegation (2026-11-03); the encoding is unchanged.
    - id: amb.2025.f5695_spouse_carryforward
      text_at_issue: 'i5695 p. 1, Purpose of Form: "Also use Form 5695 to take any residential clean energy credit carryforward from
        2024"; Form 5695 (2025), line 12: "Credit carryforward from 2024. Enter the amount, if any, from your 2024 Form 5695, line
        16." The instructions do not say whether, on a joint 2025 return, line 12 takes a carryforward from a 2024 Form 5695 the
        spouse filed on a return of their own (a couple who married in 2025, or who filed separately for 2024), or the total when
        each spouse has one.'
      readings:
      - Count both spouses' carryforwards on a joint return (line 12 is the total of the line 16 amounts of every 2024 Form 5695
        either spouse filed).
      - Count only a carryforward from a 2024 Form 5695 filed on a return of the person who is the taxpayer on the 2025 return.
      chosen: The first (f5695.carry and f5695.line12 ask about your or, on a joint return, your spouse's 2024 Form 5695, and line
        12 takes the total).
      reason: 'The general joint-return rule: "A married couple filing jointly report their combined income and deduct their
        combined allowable expenses on one return" (i1040gi p. 13). The instructions give no exception for this credit, and their
        joint-occupancy allocation "don''t apply to married individuals filing a joint return" (i5695 p. 2). The reading matters
        only on a joint return where a spouse brings a carryforward from a separate 2024 return; were it wrong, line 12, line 15
        and Schedule 3 line 5a would be overstated by that carryforward (BUG-0597).'
      cite:
        doc: i1040gi
        locator: 'p. 13, Married Filing Jointly, "A married couple filing jointly report their combined income and deduct their
          combined allowable expenses on one return"; i5695 p. 1, Purpose of Form, "Also use Form 5695 to take any residential
          clean energy credit carryforward from 2024"; i5695 p. 2, Joint occupancy, "These rules don''t apply to married
          individuals filing a joint return."'
      status: Coordinator's decision D15 of the goal-1 round (2026-11-15), following the owner's reading of 2026-11-11; the
        encoding is unchanged.
    - id: amb.2025.k1p_activity_per_box
      text_at_issue: 'Schedule K-1 (Form 1065) instructions, Box 1: "If the partnership had more than one trade or business activity,
        it will attach a statement identifying the income or loss from each activity"; boxes 2 and 3 say the same of rental
        activities. A K-1 without such a statement does not say in words that each box is one activity.'
      readings:
      - Each of boxes 1, 2 and 3 of a K-1 without the statement (boxes 22 and 23 unchecked) is one activity for Form 8582.
      - The amounts of one K-1 form a single activity.
      chosen: The first (k1p.b1_*, k1p.b2_*, k1p.b3_*); a K-1 with box 22 or 23 checked is refused (k1p.r_b2223).
      reason: The instructions route each box to a different part (box 2 to Part IV when actively participated, boxes 1 and 3 to
        Part V) and tie the multi-activity case to an attached statement, which boxes 22 and 23 announce; without it each box is
        one trade or business, rental real estate or other rental activity.
      cite:
        doc: i1065sk1
        locator: p. 14, Box 1. Ordinary Business Income (Loss), "If the partnership had more than one trade or business activity,
          it will attach a statement identifying the income or loss from each activity"
      status: Coordinator's decision for lane x2-k1p (scout-k1 amb 1), 2026-11-15.
    - id: amb.2025.k1p_basis_by_filer
      text_at_issue: 'Schedule K-1 (Form 1065) instructions, Basis Limitations: "It’s the partner’s responsibility to track and
        maintain the information necessary to figure their adjusted basis in the partnership". The basis and at-risk limits are
        figured from facts the K-1 does not show (prior-year basis, contributions, loans).'
      readings:
      - The filer states whether the year's losses exceed basis and whether any amount is not at risk; a Yes refuses.
      - The Worksheet for Adjusting the Basis of a Partner’s Interest is encoded from the prior-year basis.
      chosen: The first (k1p.basis_short, k1p.not_at_risk, asked only when the K-1 shows a loss).
      reason: Owner decisions D-K2 and D-K3 (settled as the scout recommends). The worksheet needs the prior year's ending basis,
        which most filers do not hold in a form the tool can check; the refusal covers every case the limit changes.
      cite:
        doc: i1065sk1
        locator: p. 3, Basis Limitations, "a partner may only claim their share of a partnership loss (including a capital loss)
          to the extent it doesn’t exceed their adjusted basis in the partnership"
      status: Coordinator's decision for lane x2-k1p (D-K2, D-K3), 2026-11-15.
    - id: amb.2025.k1p_portfolio_no_sche
      text_at_issue: 'Schedule E instructions, Line 28, and the K-1 instructions route boxes 5 to 9 to Schedule B, Form 1040 and
        Schedule D, not to Schedule E. Whether a K-1 with only portfolio amounts takes a row on Schedule E line 28 is not said.'
      readings:
      - A K-1 with nothing in boxes 1, 2, 3 or 4a and no held-back loss puts no row on Schedule E.
      - Every K-1 takes a row on line 28.
      chosen: The first (k1p.sche_row).
      reason: Line 28 columns (g) to (k) hold only passive and nonpassive income and losses; portfolio income "isn’t subject to
        the passive activity limitations" and is reported elsewhere, so a portfolio-only K-1 has nothing to enter on the row.
      cite:
        doc: i1065sk1
        locator: p. 15, Portfolio Income, "Portfolio income or loss (shown in boxes 5 through 9b and in box 11, code A) isn’t
          subject to the passive activity limitations"
      status: Coordinator's decision for lane x2-k1p (scout-k1 amb 7, D-K13), 2026-11-15.
    - id: amb.2025.k1p_box9c_business
      text_at_issue: 'Schedule K-1 (Form 1065) instructions, Box 9c: "If the partnership reports only unrecaptured section 1250
        gain from the sale or exchange of its business assets, it’ll enter a dollar amount in box 9c. If it reports the other two
        types of unrecaptured gain, it’ll provide an attached statement".'
      readings:
      - A dollar amount in box 9c is gain from the partnership's business assets (worksheet line 5); a statement is refused.
      - The amount may hold other types and must be split from the statement.
      chosen: The first (k1p.box9c, help on the question; the statement case is named in help as outside the tool).
      reason: The instructions tie the dollar amount to the business-asset type and the other types to an attached statement.
      cite:
        doc: i1065sk1
        locator: p. 16, Box 9c. Unrecaptured Section 1250 Gain, "If the partnership reports only unrecaptured section 1250 gain
          from the sale or exchange of its business assets, it’ll enter a dollar amount in box 9c"
      status: Coordinator's decision for lane x2-k1p (scout-k1 amb 8), 2026-11-15.
    - id: amb.2025.k1p_prior_with_activity
      text_at_issue: 'Form 8582 instructions, Part IV and Part V column (c): prior-year unallowed losses are entered for each
        activity "from Part VII, column (c), of your 2024 Form 8582". An activity can carry such a loss in a year its K-1 box
        is blank.'
      readings:
      - The held-back loss question is asked of a K-1 with an amount in box 1, 2 or 3.
      - It is asked of every K-1.
      chosen: The first (k1p.prior_any_if_activity).
      reason: One question saved on every portfolio-only K-1. A held-back loss on a K-1 whose boxes 1 to 3 are all blank stays
        held back (not deducted), which can only understate the losses allowed; the help and the question name the 2024 Form 8582.
      cite:
        doc: i8582
        locator: p. 10, Part IV, "You find these amounts in Part VII, column (c), of your 2024 Form 8582"
      status: Coordinator's decision for lane x2-k1p, 2026-11-15; open to the owner's review (a reading that understates a
        deduction).
    - id: amb.2025.k1p_material_tests
      text_at_issue: 'Schedule K-1 (Form 1065) instructions, Material participation: seven tests for individuals other than limited
        partners; "If you’re a limited partner, you must meet item 1, 5, or 6 above". Tests 4, 6 and 7 rest on facts outside the
        activity (other activities, earlier years, all facts and circumstances).'
      readings:
      - Tests 1, 2, 3 and 5 are asked in turn and decide; a Yes to test 4, 6 or 7 is refused; a partner who meets none is passive.
      - All seven tests are asked as one question with the tests in help.
      chosen: The first (k1p.material, k1p.t4, k1p.t6, k1p.t7).
      reason: Owner decision D-K5 (settled as the scout recommends). Item G answers which tests apply; a limited partner is asked
        tests 1, 5 and 6 only. The spouse's work counts ("any work that you or your spouse does").
      cite:
        doc: i1065sk1
        locator: p. 9, Limited partners, "If you’re a limited partner, you must meet item 1, 5, or 6 above to qualify as having
          materially participated"
      status: Coordinator's decision for lane x2-k1p (D-K5), 2026-11-15.
    - id: amb.2025.f7203_capital_lines
      text_at_issue: Form 7203 line 3g reads "Net capital gains (enter losses in Part III)" and line 38 "Net capital loss",
        while Schedule K-1 (Form 1120-S) reports a net short-term amount (box 7) and a net long-term amount (box 8a)
        separately. The form does not say whether a short-term loss and a long-term gain are netted before the stock basis
        computation.
      readings:
        - Enter each box on its own sign, a gain on line 3g and a loss on line 38, without netting box 7 against box 8a.
        - Net box 7 and box 8a first and enter the net on line 3g or line 38.
      chosen: Each box on its own sign (k1s.gain7, k1s.gain8 on f7203.l3g; k1s.loss7, k1s.loss8 on f7203.a38).
      reason: >
        The instructions for line 3 say "Enter only positive amounts from Schedule K-1 (Form 1120-S) on line 3. Negative
        amounts (decreases to stock basis) are entered in Part III", which reads item by item; the order of basis
        adjustments (income first, losses last) gives the same ending basis either way when no loss is limited, and a
        capital loss that is limited is refused (f7203.cap_limited).
      cite:
        doc: i7203
        locator: p. 2, Line 3, "Enter only positive amounts from Schedule K-1 (Form 1120-S) on line 3"
      status: Lane x2-k1s reading, for the owner's ruling.
    - id: amb.2025.f7203_prorata_places
      text_at_issue: Form 7203 Part III column (c) asks for "the pro rata amount" of each loss when stock basis (line 10) is
        less than the total of the losses, and says the column (c) total "can't exceed the amount reported on line 10",
        without saying how the ratio is figured or rounded.
      readings:
        - Each loss times line 10 divided by the line 47 total, the ratio rounded half-up to six places, the product to the
          cent; line 11 is the smaller of the column (c) total and line 10.
        - Keep the ratio exact and give any rounding remainder to one line so the column totals line 10 exactly.
      chosen: Six places, as the prorate atom does elsewhere (f7203.c35_p to f7203.c38_p), with line 11 capped at line 10.
      reason: >
        The same reading the register records for other pro rata splits (amb.2025.carloan_ratio_places); on losses below
        $10 million the result differs from an exact ratio by at most a few cents, and the cap keeps line 11 within line 10
        as the instruction requires.
      cite:
        doc: i7203
        locator: p. 4, Part III. Shareholder Allowable Loss and Deduction Items, "enter the pro rata amount on the
          corresponding line in column (c)"
      status: Lane x2-k1s reading, for the owner's ruling.
    - id: amb.2025.f7203_required
      text_at_issue: Form 7203 is filed by shareholders who "Are claiming a deduction for their share of an aggregate loss
        from an S corporation" or "Received a non-dividend distribution". The instructions do not define "aggregate loss"
        for a K-1 with both income items and loss items.
      readings:
        - Figure Form 7203 whenever any loss item (box 1, 2, 3, 7 or 8a below zero) or a distribution is reported.
        - Figure it only when the K-1's items net to a loss, or a distribution is reported.
      chosen: Any loss item or a distribution (k1s.f7203_required).
      reason: >
        Every loss and deduction item is limited by basis item by item (Part III lists them line by line), so figuring
        basis whenever any loss item is present never omits a limitation; when basis covers the losses the result equals
        the K-1 amounts, so the broader reading can change no value, only add the two basis questions.
      cite:
        doc: i7203
        locator: p. 1, Who Must File, "Are claiming a deduction for their share of an aggregate loss from an S corporation"
      status: Lane x2-k1s reading, for the owner's ruling.
    - id: amb.2025.k1s_qbi_basis
      text_at_issue: The Schedule K-1 (Form 1120-S) instructions for box 17, code V, say to include in QBI "only those items
        that are qualified items of income, gain, deduction, and loss included or allowed in determining taxable income for
        the tax year", without saying how the qualified part of a loss partly suspended by the basis limitation is found.
      readings:
        - Refuse a qualified business loss on a K-1 whose losses are partly carried forward by the basis limitation.
        - Scale the statement's QBI loss by the allowed share of the K-1's losses.
      chosen: Refuse (k1s.qbi_cut).
      reason: >
        The statement reports QBI by business, while Form 7203 limits losses by kind across the whole K-1; no archived text
        says which part of the QBI loss the allowed loss carries, and the case is rare beside the computed one (basis
        covering the losses).
      cite:
        doc: i1120ssk
        locator: p. 17, Code V. Section 199A information, "you must include only those items that are qualified items of
          income, gain, deduction, and loss included or allowed in determining taxable income for the tax year"
      status: Lane x2-k1s reading, for the owner's ruling.
    - id: amb.2025.mfs_spouse_qc
      text_at_issue: 'On a separate return the husband or wife is "any other person" for Step 1 (i1040gi p. 17, "a qualifying
        child of any other person (other than your spouse if filing jointly)"), so a child who lived with both is the
        qualifying child of both. The tie-breaker rules decide only when the two "don’t file a joint return together but both
        parents claim the child" (p501 p. 15), and otherwise "you and the other person may be able to choose which of you
        claims the child" (p501 p. 17). The text does not say how a preparer of one spouse''s return learns whether the other
        will claim, and a non-parent claims only with the higher AGI (i1040gi p. 21).'
      readings:
      - Ask whether the husband or wife is the only other such person and whether they will claim the child. When they will
        not, and you are the child's parent by birth or adoption, no tie-breaker arises and you claim the child; when they
        will, or you are not the child's parent, refuse at the tie-breaker gate.
      - Refuse every separate return on which the child is also the qualifying child of the husband or wife, as for any other
        person.
      chosen: The first (dependent.other_only_spouse, dependent.spouse_claims, dependent.filer_parent; dependent.spouse_settles
        clears dependent.qc_tiebreak and dependent.eic_tiebreak only on the computed path).
      reason: 'Pub. 501 Example 6 (p. 17) states the case: "You and your spouse will file separate returns. Your spouse agrees to
        let you treat your child as a qualifying child. This means, if your spouse doesn’t claim your child as a qualifying
        child, you can claim this child". The spouse''s claim is a fact the filer can learn from the spouse, as Example 6
        assumes. When the spouse also claims, the IRS rule by time lived and AGI needs the spouse''s facts, and a stepparent,
        foster parent or other non-parent claims only with an AGI higher than the parent''s (i1040gi p. 21), so those stay
        refused. When the spouse settles it but the child is not your qualifying child, the existing test still refuses a
        child who is the qualifying child of another taxpayer (Step 4). A parent who is refused because the spouse also
        claims is refused even where the spouse is a stepparent and the filer would win the tie-breaker as the only parent:
        the tool does not ask whether the spouse is a parent.'
      cite:
        doc: p501
        locator: 'p. 17, "Subject to these tiebreaker rules, you and the other person may be able to choose which of you claims
          the child as a qualifying child."; p. 17, Example 6—separated parents, "You and your spouse will file separate returns.
          Your spouse agrees to let you treat your child as a qualifying child. This means, if your spouse doesn’t claim your child
          as a qualifying child, you can claim this child as a qualifying child"; i1040gi p. 17, Step 1, "If the child meets the
          conditions to be a qualifying child of any other person (other than your spouse if filing jointly) for 2025"'
      status: Owner decision D3 of the married-filing-separately round, settled as the design scout recommended (delegated to the
        coordinator, 2026-11-15); lane mfs-l4.
    - id: amb.2025.rental_activity_per_property
      text_at_issue: The instructions let a filer group rental activities into one appropriate economic unit, and do not say how
        a tool should treat several properties when the filer does not say.
      readings:
      - Each property listed on Schedule E is one activity.
      - Ask how activities are grouped and allocate by group.
      chosen: Each property is one activity; a filer who treats two or more rentals as one activity is refused (sche.grouped).
      reason: Grouping changes the Part IV to VIII allocation; asking is rare and costly, so it is screened out.
      cite:
        doc: i8582
        locator: p. 1, Grouping of Activities
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
      unlinked: The reading is enforced by the refusal sche.grouped (line sche.line23a) rather than by one line's expression.
    - id: amb.2025.f8582_magi_build
      text_at_issue: Form 8582 line 6 takes modified adjusted gross income "except don't take into account" any passive activity
        loss; the tool cannot read Form 1040 line 11 without a cycle (line 11 contains the allowed loss).
      readings:
      - Build MAGI from the income lines with no Schedule E rental amount at all, adding royalty income (not passive) and subtracting
        the adjustments other than self-employment tax, IRA and student loan interest.
      - Start from AGI and add back the allowed passive loss.
      chosen: The first.
      reason: 'The two agree whenever line 9 is reached: line 9 is reached only when line 3 is a loss, and then the passive incomes
        and losses net to that loss, which MAGI leaves out. Taxable social security, the EE bond exclusion and adoption benefits
        are excluded or refused elsewhere.'
      cite:
        doc: i8582
        locator: p. 11, Line 6, "To figure modified adjusted gross income, combine all the amounts used to figure adjusted gross
          income"
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
    - id: amb.2025.f8582_ratio_places
      text_at_issue: Parts VI and VII divide each loss by the total of the column and multiply by line 9 (or line C); the instructions
        say the ratios must total 1.00 and column (c) must equal line 9, but give no number of places.
      readings:
      - Ratios to six places, each product rounded to the cent; a cent of residue against line 9 is accepted.
      - Allocate the residue to the largest loss.
      chosen: Ratios to six places, products to the cent (prorate, places 6).
      reason: A cent of difference has no effect on the tax at whole-dollar rounding.
      cite:
        doc: i8582
        locator: p. 12, Part VI, "The total of all the ratios in column (b) must equal 1.00"
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
    - id: amb.2025.rental_use_ratio_places
      text_at_issue: Pub. 527 divides expenses by the fraction of rental days over total days of use and shows the fraction as
        a rounded percent (85/99 (86%)).
      readings:
      - Divide by the exact fraction, carried to six places.
      - Round the fraction to a whole percent.
      chosen: Six places.
      reason: The publication's percent is a display of the fraction; the fraction itself is exact.
      cite:
        doc: p527
        locator: p. 26, Dividing Expenses, "Your rental expenses are 85/99 (86%) of the cottage expenses"
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
    - id: amb.2025.rental_overlap_days
      text_at_issue: A day rented at a fair price on which the owner also used the unit counts as a rental day for dividing expenses
        but as a personal day for the home test.
      readings:
      - Ask the personal days (all of them) and, beneath, how many were also fair rental days; divide by fair days over fair plus
        personal less overlap; test the home rule on personal days against fair days less overlap.
      chosen: The reading above.
      reason: It is the publication's own example (85/99 for division; 16 personal and 83 rental days for the home test).
      cite:
        doc: p527
        locator: p. 26, Dwelling Unit Used as a Home, "count it as a day of personal use in applying both (1) and (2) above"
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
    - id: amb.2025.rental_direct_expenses
      text_at_issue: When a unit with personal use is not used as a home, Pub. 527 says to divide the expenses by days; Worksheet
        5-1 (for a home) treats rental-only expenses such as advertising and commissions as undivided.
      readings:
      - Divide every expense by the days fraction.
      - Leave rental-only expenses undivided.
      chosen: Divide every expense (the chapter text applies to a unit not used as a home; Worksheet 5-1 is refused).
      reason: The design scout's reading D2; the worksheet that treats them differently applies only to a home, which is refused.
      cite:
        doc: p527
        locator: p. 25, Dividing Expenses, "divide your expenses between the rental use and the personal use based on the number
          of days used for each purpose"
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
      unlinked: The reading is in every rental.divN line; linking each would repeat it thirteen times.
    - id: amb.2025.rental_not_qbi
      text_at_issue: A rental real estate activity is a trade or business for the qualified business income deduction only if
        it meets the safe harbor or is a section 162 trade or business.
      readings:
      - A rental is not a trade or business unless the filer says it is (then refused).
      chosen: The reading above (sche.qbi_business refuses).
      reason: Rev. Proc. 2019-38 is not archived; most single-property landlords do not meet it.
      cite:
        doc: i8995
        locator: p. 1, Trade or business, "provides a safe harbor under which a rental real estate enterprise will be treated
          as a trade or business for purposes of the QBI deduction"
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
      unlinked: Enforced by the refusal sche.qbi_business.
    - id: amb.2025.rental_prior_depreciation_tables
      text_at_issue: Depreciation of a building placed in service before 2025 is figured from Tables A-6 and A-7a, not taken from
        the filer's earlier depreciation schedule.
      readings:
      - Figure it from the tables.
      - Ask for the amount on the prior schedule.
      chosen: Figure it from the tables.
      reason: The tables give the deduction the rules require; a schedule prepared another way is screened out (rprop.screen).
      cite:
        doc: p946
        locator: p. 37, Using the MACRS Percentage Tables
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
    - id: amb.2025.f8582_shown
      text_at_issue: Form 8582 need not be filed under the exception; the tool computes the same arithmetic either way.
      readings:
      - Show the form only when it must be filed.
      - Always show it when there is a passive rental.
      chosen: Show it only when required (f8582.required).
      reason: Under the exception line 9 equals the total loss, so the allowed losses are the same.
      cite:
        doc: i8582
        locator: p. 1, Exception; p. 2, Coordination With Other Limitations, "If all the above conditions are met, your rental real estate losses are not limited, and you don’t need to complete Form 8582"
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
    - id: amb.2025.s1_ebl_rental
      text_at_issue: The excess business loss screen counts Schedule C losses; the Schedule E instructions say a Schedule E loss
        may also be subject to it (Form 461 is not archived).
      readings:
      - Count rental and royalty losses before the passive limit toward the screen.
      - Leave them out.
      chosen: 'Count them (conservative: refuses more).'
      reason: Form 461 is not archived to say which rental losses are business losses.
      cite:
        doc: i1040se
        locator: p. 1, Reminders, "you may be subject to a business loss limitation"
      status: Coordinator's decision for lane x1-sche (2026-11-15), as the design scout recommends; awaiting review.
    - id: amb.2025.sa_mfs_spouse_itemizes
      text_at_issue: 'i1040gi p. 33, Line 12b: "If your filing status is married filing separately and your spouse itemizes
        deductions on their return, check the box on line 12b." Whether the spouse itemizes is the spouse''s choice on another
        return, which the filer may not know when filing; the instructions do not say what a filer who does not know should do.'
      readings:
      - Ask the fact ("Is your husband or wife itemizing deductions on their own 2025 return?"), with help telling the filer
        to ask the spouse.
      - Refuse a married filing separately return whose filer does not know the spouse's choice.
      chosen: The first (sa.spouse_itemizes, read through sa.mfs_spouse_itemizes).
      reason: 'The line is a fact about the spouse''s return, and a filer can find it out by asking; Pub. 504 p. 4: "If you and
        your spouse file separate returns and one of you itemizes deductions, the other spouse can’t use the standard
        deduction and should also itemize deductions." A wrong No overstates the standard deduction; the help says to ask.'
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12b, "If your filing status is married filing separately and your spouse itemizes deductions on
          their return, check the box on line 12b"'
      status: Coordinator's decision for lane mfs-l2 (scout-mfs.md 3.7, settled as recommended under the owner's delegation,
        2026-11-15).
    - id: amb.2025.sa_mfs_mortgage_limit
      text_at_issue: 'i1040sca p. 8, Limits on home mortgage interest: "you can only deduct home mortgage interest on up to
        $750,000 ($375,000 if you are married filing separately) of that debt". The instructions do not say whether a
        married filing separately filer measures a mortgage owed jointly with the spouse at its whole balance or at a share;
        Pub. 936, which the instructions send the filer to, is not archived.'
      readings:
      - Count the whole balance of every loan on the home, including one shared with the spouse, against $375,000 ($500,000
        for debt taken out on or before December 15, 2017); a filer over it is refused.
      - Count only the filer's share of a jointly owed loan.
      chosen: The first (sa.mortgage_over_limit_mfs).
      reason: The limit question only refuses, so counting the whole balance can only refuse a return that the share reading
        would compute; it cannot produce a wrong deduction. The rule leans to Yes (formal gates design, standing rule 6).
        The reading is reopened when Pub. 936 is archived.
      cite:
        doc: i1040sca
        locator: 'p. 8, Limits on home mortgage interest, "deduct home mortgage interest on up to $750,000 ($375,000 if you are
          married filing separately) of that debt"'
      status: Coordinator's decision for lane mfs-l2 (scout-mfs.md 3.3, settled as recommended under the owner's delegation,
        2026-11-15).
    - id: amb.2025.ira_mfs_spouse_covered
      text_at_issue: 'i1040gi p. 96, Married persons filing separately: "If you weren’t covered by a retirement plan but your
        spouse was, you are considered covered by a plan unless you lived apart from your spouse for all of 2025." i1040gi p.
        31, Lines 6a and 6b, Exception: do not use the Social Security Benefits Worksheet if "You made contributions to a
        traditional IRA for 2025 and you or your spouse were covered by a retirement plan at work or through self-employment."
        Whether "your spouse were covered" in the exception reaches a married filing separately filer who lived apart from
        the spouse all year, and whose spouse was covered, is not stated.'
      readings:
      - Ask the spouse's coverage only when it can change the worksheet (married filing separately, a traditional
        contribution, the filer not covered, and living together at some time in 2025); a filer who lived apart all year is
        treated as not covered through the spouse, for line 1a and for the social security exception alike.
      - Ask every married filing separately filer with a traditional contribution and social security benefits whether the
        spouse was covered, and refuse (ira.cov_gate) when the spouse was, even after living apart all year.
      chosen: The first (ira.mfs_spouse_covered, ira.mfs_spouse_covered_if_asked).
      reason: 'Pub. 590-A p. 13 states that a separate filer who lived apart all year has filing status single "for this
        purpose", and its Table 1-3 (p. 14) gives that filer the full deduction whatever the spouse''s coverage; the spouse''s
        coverage has no effect on that return. The readings differ only for a filer who lived apart all year, had social
        security benefits and a traditional contribution, was not covered and whose spouse was.'
      cite:
        doc: p590a
        locator: 'p. 13, Lived apart from spouse, "If you didn’t live with your spouse at any time during the year and you file
          a separate return, your filing status, for this purpose, is single"'
      status: Coordinator's decision for lane mfs-l2 (scout-mfs.md 3.3, settled as recommended under the owner's delegation,
        2026-11-15).
    - id: amb.2025.s1_line20_box
      text_at_issue: 'Schedule 1 (2025), line 20: "If you are married filing separately and lived apart from your spouse for
        the entire year (see instructions), check here". The box sits on the IRA deduction line; the instructions (i1040gi p.
        96) give it under line 20 and do not say whether it is checked on a return that takes no IRA deduction.'
      readings:
      - Check the box when the filer is married filing separately, lived apart from the spouse all year, and made a
        traditional IRA contribution for 2025 (the IRA Deduction Worksheet is used).
      - Check it on every married filing separately return of a filer who lived apart all year.
      chosen: The first (s1.line20_box).
      reason: The box tells the IRS which line 2 amount of the worksheet applies ($89,000 rather than $10,000); i1040gi warns
        of a math error notice when it is missing, which arises only where an IRA deduction is figured. The first reading
        asks no MFS filer without an IRA contribution about living arrangements for a box that changes nothing.
      cite:
        doc: i1040gi
        locator: 'p. 96, Married persons filing separately, "If you are married filing separately and you lived apart from your
          spouse for all of 2025, check the box on line 20. If you don’t check the box on line 20, you may get a math error
          notice from the IRS"'
      status: Coordinator's decision for lane mfs-l2 (scout-mfs.md 3.7, amb.2025.mfs_lived_apart_boxes, settled as recommended
        under the owner's delegation, 2026-11-15).
    - id: amb.2025.rec_two_returns
      text_at_issue: 'p525 p. 27, Worksheet 2: "Use information from your tax return for the year the expense was deducted."
        On a joint 2025 return, the amounts paid back may be for deductions on one 2024 return (a joint one, or one
        spouse''s own) or on two (each spouse filed separately for 2024).'
      readings:
      - Worksheet 2 is completed once, against the one 2024 return the deductions were on; amounts for deductions on two 2024
        returns are refused (they need a worksheet for each return, and the split of line 1 and line 8z for each).
      - Complete Worksheet 2 once against the combined figures of both 2024 returns.
      chosen: The first (rec.two_returns, refused at rec.to_line8z).
      reason: The worksheet's lines 4, 7 and 10 are figures of one return; combining two returns has no basis in the text,
        and the refund worksheet already refuses the like case for state refunds (amb.2025.refund_two_returns).
      cite:
        doc: p525
        locator: p. 27, Worksheet 2, "Use information from your tax return for the year the expense was deducted"
      status: Authoring agent's reading, lane x2-s1o (2026-11-15), for the owner.
    - id: amb.2025.rec_mortgage_cap
      text_at_issue: 'p525 p. 27, Worksheet 2, footnote 2 to line 2: "Don’t enter more than the amount deducted for the prior
        year." A mortgage interest refund (Form 1098 box 4) is asked as one amount.'
      readings:
      - Ask for the refund of mortgage interest deducted, capped in the question at the interest deducted (a refund above it
        happens only when the 2024 deduction was limited).
      - Ask the refund and the 2024 mortgage interest deducted separately and take the smaller, as for medical expenses.
      chosen: The first (rec.mortgage).
      reason: Mortgage interest is deducted in full unless the 2024 home mortgage limit applied; a separate question would be
        asked of every filer with a mortgage refund to serve that rare case. Medical expenses, deducted only above the 7.5%
        floor, take the second form (rec.medical_deducted), as in Example 34.
      cite:
        doc: p525
        locator: p. 27, Worksheet 2, footnote 2, "Don’t enter more than the amount deducted for the prior year"; p. 26, Example
          34, "the amount actually deducted"
      status: Authoring agent's reading, lane x2-s1o (2026-11-15), for the owner.
    - id: amb.2025.rec_ratio_places
      text_at_issue: 'p525 p. 26, Worksheet 2a, lines 7 and 8: "divide line 1 by line 6. Then multiply by the amount on line 5";
        p. 27, Worksheet 2, line A: "Divide the amount on line 1a by the amount on line 3. Enter the percentage". The
        precision of the ratio is not stated.'
      readings:
      - Round the ratio half-up to six decimal places, then the product half-up to the cent (the prorate atom).
      - Round the percentage to whole or tenths of a percent.
      chosen: The first (rec.w2a_line7_share, rec.w2a_line8_share, rec.line_b_share).
      reason: Six places leave the result within a cent of the exact product for any amount under $10,000 and match the
        precision used elsewhere for an unstated ratio (carloan). When line 11 equals line 3 the worksheet's own first case
        puts line 1a on Schedule 1 line 1 without a ratio (rec.line_b), and when line 1a or lines 1b and 2 are zero the
        ratio is exactly 0 or 1.
      cite:
        doc: p525
        locator: p. 27, Worksheet 2, line A, "Divide the amount on line 1a by the amount on line 3. Enter the percentage"
      status: Authoring agent's reading, lane x2-s1o (2026-11-15), for the owner.
    - id: amb.2025.rec_line5
      text_at_issue: 'p525 p. 27, Worksheet 2, line 5: "Enter any amount previously refunded to you (don’t enter an amount from
        line 1a, 1b, or 2)."'
      readings:
      - Zero for 2024 deductions recovered in 2025; an amount refunded during 2024 reduced the 2024 deduction itself.
      - Ask the filer for any amount previously refunded.
      chosen: The first (rec.line5).
      reason: For deductions of 2024 there is no year between the year of the deduction and 2025 in which an amount could
        have been refunded and included; a refund in 2024 itself reduced the deduction (p. 24, Recovery and expense in same
        year), so it is already out of line 4. Recoveries for earlier years are refused (rec.before_prior_year).
      cite:
        doc: p525
        locator: p. 24, Recovery and expense in same year, "If the refund or other recovery and the expense occur in the same
          year, the recovery reduces the deduction or credit and isn’t reported as income"
      status: Authoring agent's reading, lane x2-s1o (2026-11-15), for the owner.
    - id: amb.2025.rec_prior_taxable
      text_at_issue: 'p525 p. 27, Worksheet 2, line 10: "Taxable income for prior year (2024 Form 1040, line 15", with footnote
        4: "If taxable income is a negative amount, enter that amount in brackets." Form 1040 line 15 cannot be negative;
        p. 26 says taxable income is negative when "the sum of lines 12 and 13, was more than line 11".'
      readings:
      - Ask whether 2024 line 15 is more than zero; if it is, line 10 is not negative and line 11 is line 9. Otherwise line 10
        is 2024 line 11 less line 14 (lines 12 and 13 added), which can be negative.
      - Ask line 15 and treat a zero as zero.
      chosen: The first (rec.ti_positive, rec.agi_prior, rec.ded_prior, rec.line10).
      reason: The footnote forbids entering zero unless taxable income is exactly zero, and the 2024 Form 1040 line 14 is the
        sum of lines 12 and 13 that p. 26 compares with line 11. A negative 2024 taxable income while a net operating loss is
        carried into 2025 is refused (rec.nol_negative), since footnote 4 adds that it "will have to be adjusted for any net
        operating loss carryover".
      cite:
        doc: p525
        locator: 'p. 26, Negative taxable income, "You have a negative taxable income for 2024 if your: • Form 1040, the sum of lines 12 and 13, was more than line 11"'
      status: Authoring agent's reading, lane x2-s1o (2026-11-15), for the owner.
    - id: amb.2025.s1_nol_limit_test
      text_at_issue: 'i172 p. 2: the deduction of NOLs from tax years after 2017 cannot exceed "80% of the excess (if any) of
        taxable income computed without regard to deductions for NOLs, or Qualified Business Income (QBI), or section 250
        deductions". Taxable income figured without the NOL deduction is not on the return.'
      readings:
      - 'Compute the deduction as the whole carryover N only when N is at most four times T, where T is Form 1040 line 11b less
        line 14 with the deduction taken (unfloored); refuse otherwise. Sound when T0, taxable income without the NOL and QBI
        deductions, is at least T + N: then N ≤ 4T gives N ≤ 0.8(T + N) ≤ 0.8 T0.'
      - Refigure taxable income without the deduction (a shadow chain of every AGI-dependent line) and apply the limit
        exactly.
      chosen: The first (s1.nol_ti, s1.nol_ti4, s1.nol_limit_test, refused at f1040.line15 by s1.nol_limit).
      reason: 'Owner decision D3 (lane x2-s1o, scout-s1-other): the sufficiency test is accepted. The premise T0 ≥ T + N holds
        when no deduction in scope rises with AGI. Checked against the forms (lane x2-s1o, 2026-11-15): the above-the-line
        deductions with phase-outs (student loan interest, IRA) fall as modified AGI rises; taxable social security benefits
        rise with other income, so AGI without the NOL is at least AGI with it plus N; the itemized deductions with an AGI
        floor (medical, casualty) and the SALT limit that falls above $500,000 of modified AGI fall as AGI rises; the larger of
        itemized and standard deductions keeps that direction; Schedule 1-A deductions (tips, overtime, car loan interest,
        seniors) phase out with modified AGI; the QBI deduction is left out of T0 and only lowers T. The one deduction that
        rises with AGI, charitable gifts under the AGI percentage limits, is refused when a limit binds (sa.charity_limited).
        NOLs from before 2018 (no 80% limit, deducted first) are refused (s1.nol_before_limit_date). The refusal sits on line 15, not
        on line 8a, because the test reads lines 11b and 14, which read line 8a.'
      cite:
        doc: i172
        locator: 'p. 2, "80% of the excess (if any) of taxable income computed without regard to deductions for NOLs, or
          Qualified Business Income (QBI), or section 250 deductions"'
      status: Owner decision D3 of scout-s1-other, settled as the scout recommends (coordinator delegation, 2026-11-15); premise
        checked by lane x2-s1o.
    - id: amb.2025.f8853c_period
      text_at_issue: 'i8853 pp. 8–9, Line 21: "The number of days in your LTC period depends on which method you choose to define
        the LTC period. Generally, you can choose either the Contract Period method or the Equal Payment Rate method."'
      readings:
      - The equal payment rate method, with one LTC period in 2025 (the days the one payment rate applied); a change of rate,
        or a second contract starting or stopping, makes more than one period and is refused.
      - The contract period method (a daily contract makes every day its own period).
      chosen: The first (f8853c.days, f8853c.rate_changed).
      reason: With one rate, the equal payment rate method gives one period and one Section C, which the form computes as
        printed; the contract period method for a daily contract would need a Section C per day. The filer may choose
        either method, so the first is a permitted choice, not a narrowing of the law.
      cite:
        doc: i8853
        locator: 'p. 9, Method 2—Equal Payment Rate, "your LTC period is the period during which the insurance company uses the
          same payment rate to compute your benefits"'
      status: Authoring agent's reading, lane x2-s1o (2026-11-15), for the owner.
    - id: amb.2025.f1116_ratio_places
      text_at_issue: Form 1116 line 3f says "round off the result to at least four decimal places" and the Worksheet for Home
        Mortgage Interest line 3 says "rounded to at least four places"; line 19 says only "Divide line 17 by line 18" and
        states no rounding.
      readings:
        - Round each ratio half-up to exactly four decimal places, the least precision lines 3f and the worksheet allow.
        - Keep each ratio at full precision, which also satisfies "at least four".
        - Round line 19 differently from line 3f (for example six places), since its text states no rounding.
      chosen: Round lines 3f, the worksheet's line 3 and line 19 half-up to four decimal places (the prorate atom with places
        4 on f1116col.line3g_figured, f1116col.line4a_figured and f1116.line21_figured).
      reason: >
        Four places is the least precision lines 3f and the worksheet allow, the instructions' own example ("round off to
        0.8757"), and the precedent of amb.2025.sli_ratio_places. Line 19 is taken the same way so that one ratio rule runs
        through the form. The readings differ by cents: with line 20 of $10,095 a change of 0.00005 in the ratio moves line 21
        by about 50 cents.
      cite:
        doc: i1116
        locator: p. 18, Line 3f; p. 25, Line 19
      status: Lane x1-f1116 reading (scout readings A2 and D6), settled by the coordinator's delegation.
    - id: amb.2025.f1116_interest_threshold
      text_at_issue: 'Lines 4a and 4b say that when gross foreign source income "doesn’t exceed $5,000, you can allocate all of
        your interest expense to U.S. source income."'
      readings:
        - The allocation is permitted, not required; the tool takes it whenever it is available.
        - The filer chooses, and may apportion interest even at $5,000 or less.
      chosen: At $5,000 or less no interest expense is entered on lines 4a or 4b (f1116.foreign_over, f1116col.line4a).
      reason: >
        Allocating interest to U.S. income never lowers the credit limit, so taking the permission is never worse for the
        filer; asking would add a question no filer gains by answering the other way.
      cite:
        doc: i1116
        locator: p. 18, Lines 4a and 4b
      status: Lane x1-f1116 reading (scout reading A5), settled by the coordinator's delegation.
    - id: amb.2025.f1116_high_taxed
      text_at_issue: 'Reg. 1.904-4(c)(1): income is high-taxed "if, after allocating expenses, losses, and other deductions
        ... the sum of the foreign income taxes paid ... exceeds the highest rate of tax specified in section 1 ...
        multiplied by the amount of such income"; (c)(3) groups a U.S. person''s passive income received in the year into
        one item "subject to a withholding tax of fifteen percent or greater" and one "of less than fifteen percent (but
        greater than zero)"; (c)(2)(i) apportions deductions to the groups under 1.861-8.'
      readings:
        - The withholding rate of an item is the foreign tax on it divided by its income, taken per column and per kind
          (a column's dividends, a column's interest); deductions are apportioned to each group by its gross income over
          line 3e; the rate is 37 percent.
        - The rate of each payment is the rate the foreign law imposes on it, so a column whose payments straddle 15
          percent (a fund's mix of countries) is split between the groups.
        - A lower rate for qualified dividends (20 percent under section 1(h)).
      chosen: The first (f1116col.div_hi, f1116col.int_hi and the group lines; f1116.high_taxed when either group's tax
        is more than 37 percent of its income after deductions, refused on line 35).
      reason: >
        The regulation fixes the rate as the highest rate "specified in section 1", 37 percent for 2025, and (c)(2)(iii)
        makes the test before the section 904(b) adjustments, which is where qualified dividends get their lower rate; so
        the third reading is rejected. The return holds income and tax per column and kind, not per payment: a fund
        reports one foreign tax on one foreign income, and a country's treaty rate is normally one rate, so the per
        column and kind ratio is the payment's rate in the common cases. Every deduction on the returns computed
        (line 3c and home mortgage interest) is apportioned by gross income, so each group bears the same share of them;
        a group can be a loss only when all are, so the reallocation of (c)(2)(ii) never moves income between groups
        here. The residue is a column whose payments straddle 15 percent, classed by its average.
      cite:
        doc: cfr-26-1-904-4
        locator: p. 3, (c) High-taxed income; p. 4, (c)(2) and (c)(3)
      status: Lane x1-f1116 second pass, from the archived regulation; replaces the provisional 20 percent screen of
        scout decision D2.
    - id: amb.2025.f1116_itemized
      text_at_issue: 'Line 3a lists "Medical expenses (line 4)", "General sales taxes", "Real estate taxes for your home" and
        "State and local personal property taxes"; state income taxes may need "a special allocation ... See Pub. 514";
        Pub. 514 (p. 27) allocates state income tax by the income the state taxes; Reg. 1.861-8(e)(12)(i) apportions the
        charitable deduction "on the basis of the relative amounts of gross income from sources in the United States in
        each grouping".'
      readings:
        - Gifts to charity go to U.S. income (a foreign category holds no U.S.-source gross income) and gambling losses
          to the gambling winnings they offset, which are U.S. income on this path; neither is entered on Form 1116.
          State or local income tax is refused, since its foreign part needs the income the state taxes.
        - Gifts to charity are not definitely related and are apportioned with line 3b.
        - State income tax is apportioned by line 3d over line 3e on line 2.
      chosen: The first (f1116.itemized_unread narrowed to Schedule A line 5a; f1116.line3a_itemized unchanged).
      reason: >
        The regulation, archived now, places the charitable deduction on U.S. income for every filer whose gift is
        allowed by section 170; the second reading follows Pub. 514's general list, which the regulation displaces. A
        gift allowed only by a treaty (to a Canadian, Mexican or Israeli charity) is apportioned by income from that
        country under (e)(12)(ii), which this reading does not catch; it is recorded here as the residue. Gambling losses
        are deductible only up to gambling winnings and are incurred in the activity that produces them; a foreign
        gambling winning is not passive income and refuses at ftc.all_passive. Pub. 514 makes the state tax rule depend
        on "the total income taxed by the state" against U.S. source income, and on whether the state exempts foreign
        income; neither is on the return, and the split of a capped line 5e between line 2 and line 3a is not stated, so
        the third reading is rejected and the refusal stays.
      cite:
        doc: p514
        locator: p. 27, State income taxes; Deductions not definitely related
      status: Lane x1-f1116 second pass, from Pub. 514 and Reg. 1.861-8 now archived; narrows scout decision D5.
    - id: amb.2025.f1116_3b_items
      text_at_issue: 'Line 3b: "any other deductions that don’t definitely relate to any specific type of income (for example,
        deductions shown on Schedule 1 (Form 1040), Part II, Adjustments to Income)"; the senior deduction is excluded and
        the car loan interest deduction goes to line 4b.'
      readings:
        - Every Schedule 1 Part II adjustment except student loan interest (line 4b) goes on line 3b; Schedule 1-A tips,
          overtime and the qualified business income deduction are left off as related to U.S. income.
        - An adjustment tied to particular U.S. income (for example educator expenses) is left off line 3b.
      chosen: The first (f1116.line3b = Schedule 1 line 26 less line 21).
      reason: >
        It follows the example the instructions give. The adjustments that relate to self-employment do not arise on the
        returns computed, which refuse Schedule C on this path.
      cite:
        doc: i1116
        locator: p. 17, Lines 3a and 3b
      status: Lane x1-f1116 reading (scout reading A6), settled by the coordinator's delegation.
    - id: amb.2025.f1116_exception
      text_at_issue: 'The adjustment exception may be elected ("you can elect not to adjust") when line 5 of the worksheet
        does not exceed the ceiling and foreign qualified dividends plus foreign capital gain distributions are "less than
        $20,000".'
      readings:
        - Take the exception whenever it applies, and test the $20,000 against all foreign dividends of the columns, which
          is never less than the foreign qualified dividends.
        - Compute both paths and take the larger credit.
      chosen: The first (f1116.exception). A return that must adjust and cannot take the exception is refused (f1116.adjust).
      reason: >
        Not adjusting is the simple path the instructions describe first; testing all foreign dividends needs no question
        about which of them are qualified, and can only refuse a return the exact test would let through, never the reverse.
      cite:
        doc: i1116
        locator: p. 9, Adjustment exception; p. 23, Line 18
      status: Lane x1-f1116 reading (scout reading A7 and decision D4), settled by the coordinator's delegation.
    - id: amb.2025.f1116_gross_income
      text_at_issue: 'Lines 3d and 3e: "gross income means the total of your gross receipts (reduced by cost of goods sold),
        total capital and ordinary gains (before subtracting any losses), and all other income (before subtracting any
        deductions)".'
      readings:
        - Capital gains are taken sale entry by sale entry, adding each entry with a gain and leaving out each entry with a
          loss; an aggregate entry for a Form 8949 box counts as one entry.
        - Every transaction's gain is added, which for an aggregate entry needs the gross gains behind its net total.
      chosen: The first (f1116.gains, with capital gain distributions from Schedule D line 13 added on line 3e).
      reason: >
        The entries are what the return holds. An aggregate entry nets gains and losses that the second reading would add
        separately, so where an aggregate entry hides a loss, line 3e is smaller under the first reading and the credit
        limit slightly lower.
      cite:
        doc: i1116
        locator: p. 17, Lines 3d and 3e
      status: Lane x1-f1116 reading (scout reading A1 and decision D6), settled by the coordinator's delegation.
    - id: amb.2025.f1116_carryback
      text_at_issue: 'Pub. 514 p. 37: unused foreign tax "first" is paid in the first preceding year "up to the excess limit in
        that year"; i1116sb line 7: "Actual or estimated amount of line 6 to be carried back", with a difference corrected
        on the next year''s line 2a.'
      readings:
        - The carryback is not elective; nothing is carried back by the tool, and a return whose 2024 passive limit had
          room (2024 Form 1116 line 24 less than line 23, or foreign income with no credit taken) is refused.
        - Enter zero on line 7 as an estimate in every case and let the next year's line 2a correct it.
        - Figure the carryback from the 2024 Form 1116 lines 23 and 14 and enter it on line 7.
      chosen: The first (f1116sb.l7_xiii zero; f1116sb.prior_year asked when line 6 is above zero; f1116sb.carryback refuses).
      reason: >
        Coordinator decision D1 settles that the tool never carries back. The second reading would state a carryover to
        2026 that the law has already reduced, and leave the filer unaware of a 2024 refund; the third needs an amended
        2024 return, outside the tool. A 2024 election year takes no carryback (i1116 p. 19), nor does a year without
        foreign income (Pub. 514 p. 37, Example 2).
      cite:
        doc: p514
        locator: p. 37, Carryback and Carryover
      status: Lane x1-f1116 second pass under coordinator decision D1.
    - id: amb.2025.f1116_carryover_election
      text_at_issue: 'i1116 pp. 1-2: with the election, "You can''t carry over to or from any other year any foreign taxes paid
        or accrued in a tax year to which the election applies (but carryovers to and from other years are unaffected)";
        p. 19: no carryover is carried "to or from any year for which you made the election".'
      readings:
        - A filer with foreign tax carried into 2025 files Form 1116 (the election is not made), so the carryover is used.
        - Make the election whenever its conditions are met and leave the carryover for later years.
        - Figure both and take the larger credit for 2025.
      chosen: The first (ftc.elect false when ftc.carryover_if_asked is true).
      reason: >
        The carryover can be used only on Form 1116, and each year it is not used brings its oldest column nearer to
        expiry. The election gives more only when this year's limit is below this year's foreign tax, where the Form 1116
        carries the difference forward instead; the third reading would need both computations on every such return and
        files no Schedule B on the election path. Recorded for the owner.
      cite:
        doc: i1116
        locator: pp. 1-2, election to claim the foreign tax credit without filing Form 1116; p. 19, Line 10
      status: Lane x1-f1116 second pass reading, for the owner.
    - id: amb.2025.f4137_reported_over_received
      text_at_issue: 'Form 4137 (2025), line 4: "Subtract line 3 from line 2." Line 2 is the tips received (including the tips
        reported) and line 3 the tips reported; the form does not say what to enter when the tips reported are more than the
        tips received, for example tips reported in January 2026 for December 2025 and counted on the 2026 form.'
      readings:
      - Enter zero on line 4 (no unreported tips) when line 3 is more than line 2.
      - Enter the negative difference on line 4.
      chosen: The first (f4137.line4 subtracts with a floor of zero).
      reason: 'Line 4 is "Include as income on Form 1040 ... line 1c", the tips not reported; a negative unreported amount has no
        meaning there, and column (c) is to "Include all cash and charge tips you received", so it holds at least the tips
        reported. The reading matters only for inconsistent entries.'
      cite:
        doc: f4137
        locator: 'p. 1, line 4, "Subtract line 3 from line 2. Include as income on Form 1040, 1040-SR, or 1040-NR, line 1c"; p. 2,
          Columns (c) and (d), "Include all cash and charge tips you received"'
      status: Lane x2-paynow2 (coverage expansion, pay not on a W-2), 2026-11-15.
    - id: amb.2025.mw_all_nontaxable
      text_at_issue: 'i1040gi p. 24, Line 1d: "Enter your taxable Medicaid waiver payments that were not reported on Form(s) W-2."
        Pub. 525 p. 33 treats certain Medicaid waiver payments as difficulty-of-care payments, excluded for care of an eligible
        individual living in the provider''s home, but "to the extent they''re received for more than" ten qualified foster
        individuals under age 19 or five aged 19 or older they are income.'
      readings:
      - Treat every Medicaid waiver payment the filer reports (pay for caring for someone who lives in the filer's home) as
        nontaxable, with no question on the number of people cared for.
      - Ask the number of people cared for and refuse when it is over the limits.
      chosen: The first.
      reason: 'The interview asks only about pay for care of someone living in the filer''s home with them, the case Pub. 525
        names; an individual care provider caring for more than five adults or ten children at home is taken to be outside the
        situations a filer of this tool reports. Were it wrong, line 1a or 1d would be right but Schedule 1 line 8s would
        exclude too much. Notice 2014-7 is not archived.'
      cite:
        doc: p525
        locator: 'p. 33, "Certain Medicaid waiver payments are treated as difficulty-of-care payments when received by an
          individual care provider for caring for an eligible individual (whether related or unrelated) living in the provider’s
          home", "Ten qualified foster individuals under age 19, or", "Five qualified foster individuals age 19 or older"'
      status: Lane x2-paynow2 (coverage expansion, pay not on a W-2), 2026-11-15.
