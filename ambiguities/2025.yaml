register:
  tax_year: 2025
  entries:
    - id: amb.2025.multiplication_subcent
      text_at_issue: Percentage calculations can produce fractional cents when exact-cents mode is used.
        The form instructions do not specify subcent handling.
      readings:
        - Round the product half-up to the nearest cent at the multiplication.
        - Truncate the product toward zero to whole cents.
        - Carry the exact fraction forward until some later rounding step.
      chosen: Round the product half-up to the nearest cent at the multiplication.
      reason: >
        Matches the half-up convention of the printed whole-dollar rounding rules. The whole-dollar
        default is unaffected: whole-dollar amounts multiplied by these rates produce exact cents,
        so the reading only matters when cents are turned on.
      cite:
        doc: i1040gi
        locator: QDCGT worksheet, lines 18 and 21; Rounding Off to Whole Dollars, p. 23
      status: Applied throughout Stages 1–4; whole-dollar mode remains deferred.
    - id: amb.2025.ss_wages
      text_at_issue: Schedule 3 line 11 says total wages without naming W-2 boxes.
      readings:
        - Box 1 taxable compensation
        - Social Security wages and tips in boxes 3 plus 7
      chosen: Use boxes 3 plus 7, summed across employers separately per person.
      reason: Owner approved the Stage 2 proposal. iw2w3 p. 18 defines these boxes and their combined wage
        base; box 1 can exclude deferrals subject to Social Security.
      cite:
        doc: iw2w3
        locator: p. 18, boxes 3 and 7; compare i1040gi p. 117, Schedule 3 line 11
      status: Owner approved modeling interpretation; source transcription review remains open.
    - id: amb.2025.sales_rounding
      text_at_issue: Form 8949 permits cents or rounding all amounts; Form 1040 says add cents before
        rounding a line total. Row versus total reconciliation is not explicit.
      readings:
        - Preserve exact cents throughout.
        - Round each row before aggregation.
        - Round totals after aggregating exact rows.
      chosen: Preserve exact cents throughout Stage 3; whole-dollar mode remains deferred.
      reason: Avoid choosing a reconciliation policy without explicit support; cents are expressly
        permitted.
      cite:
        doc: i8949
        locator: p. 3, Rounding Off to Whole Dollars; compare i1040gi p. 23
      status: Stage 3 implementation choice; whole-dollar default not implemented.
    - id: amb.2025.sd4952_selection
      text_at_issue: Schedule D line 20 directs Form 4952 filers to SDTW, while the worksheet
        applicability text specifies an amount on Form 4952 line 4g and gives exceptions.
      readings:
        - Follow line 20 literally for every Form 4952 filer.
        - Apply the detailed worksheet applicability and exceptions.
      chosen: Use the detailed worksheet conditions, including line 4g and exceptions.
      reason: The worksheet explicitly limits its own use and the Form 1040 line 16 instructions repeat
        the line 4g condition.
      cite:
        doc: i1040sd
        locator: p. 15, Schedule D Tax Worksheet applicability; compare f1040sd line 20 and i1040gi p. 36
      status: Explicit Stage 3 source interpretation for review.
    - id: amb.2025.box2c_scope
      text_at_issue: The computed-scope table includes Form 1099-DIV box 2c, but the refusal list excludes
        Form 8949 code Q and Form 6251.
      readings:
        - Expand the distribution-only section 1202 exclusion path and associated AMT treatment.
        - Retain the explicit code Q/Form 6251 exclusions and refuse box 2c pending scope expansion.
      chosen: Refuse nonzero box 2c; no exclusion or AMT amount is silently omitted.
      reason: Archived Schedule D instructions require the exclusion on Form 8949 code Q and describe an
        AMT adjustment for 50/60/75-percent exclusions. The existing explicit exclusions are
        retained; the owner was notified and asked, then said continue without selecting an
        expansion.
      cite:
        doc: i1040sd
        locator: p. 8, Gain from Form 1099-DIV and Alternative Minimum Tax
      status: Scope conflict disclosed; expansion remains open.
    - id: amb.2025.eic_below_table
      text_at_issue: Worksheet A, line 2 says to look up the earned income in the EIC Table, whose first row is "At least
        1 But less than 50". An earned income below $1 (for example, no wages) has no row.
      readings:
        - The credit on line 2 is zero, so "If line 2 is zero, STOP. You can't take the credit" applies.
        - The return is refused because the table gives no value.
      chosen: The credit on line 2 is zero.
      reason: >
        Every column of the table is zero at the far end and rises from $2 to $11 in the first row, so the credit is
        built up from earned income; with no row for less than $1 the table grants nothing there, and the worksheet's
        own instruction for a zero line 2 ends the computation. Rev. Proc. 2024-40 section 3.06(1) describes the
        credit as a percentage of earned income up to the earned income amount, which is zero at zero earned income.
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 2; p. 49, EIC Table, first row
      status: Chosen during Stage 9; owner review pending.

    - id: amb.2025.eic_valid_ssn
      text_at_issue: For the EIC a child's valid SSN is "a number issued by the Social Security Administration unless 'Not
        Valid for Employment' is printed on the social security card and the number was issued solely to allow the
        recipient ... to apply for or receive a federally funded benefit", issued on or before the due date of the return.
        The tool reuses the child tax credit question, "an SSN valid for employment, issued before the due date".
      readings:
        - Reuse the child tax credit question for the EIC count.
        - Ask a separate per-person question in the EIC's own words.
      chosen: Reuse the child tax credit question.
      reason: >
        The two definitions select the same children except for a number issued on the due date itself and a card marked
        "Not Valid for Employment" for a reason other than federally funded benefits; a separate question would ask every
        filer with a dependent one more question for those two cases.
      cite:
        doc: i1040gi
        locator: pp. 44-45, Social security number (SSN) (EIC); p. 18, Step 3, question 4 (child tax credit)
      status: Chosen during Stage 9; owner review pending (T-028).
