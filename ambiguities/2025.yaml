register:
  tax_year: 2025
  entries:
    - id: amb.2025.multiplication_subcent
      text_at_issue: Percentage calculations can produce fractional cents when exact-cents mode is used.
        The form instructions do not specify subcent handling.
      readings:
        - Round the product half-up to the nearest cent at the multiplication.
        - Truncate the product toward zero to whole cents.
        - Carry the exact fraction forward until some later rounding step.
      chosen: Round the product half-up to the nearest cent at the multiplication.
      reason: >
        Matches the half-up convention of the printed whole-dollar rounding rules. The whole-dollar
        default is unaffected: whole-dollar amounts multiplied by these rates produce exact cents,
        so the reading only matters when cents are turned on.
      cite:
        doc: i1040gi
        locator: QDCGT worksheet, lines 18 and 21; Rounding Off to Whole Dollars, p. 23
      status: Applied throughout Stages 1–4; whole-dollar mode remains deferred.
    - id: amb.2025.ss_wages
      text_at_issue: Schedule 3 line 11 says total wages without naming W-2 boxes.
      readings:
        - Box 1 taxable compensation
        - Social Security wages and tips in boxes 3 plus 7
      chosen: Use boxes 3 plus 7, summed across employers separately per person.
      reason: Owner approved the Stage 2 proposal. iw2w3 p. 18 defines these boxes and their combined wage
        base; box 1 can exclude deferrals subject to Social Security.
      cite:
        doc: iw2w3
        locator: p. 18, boxes 3 and 7; compare i1040gi p. 117, Schedule 3 line 11
      status: Owner approved modeling interpretation; source transcription review remains open.
    - id: amb.2025.sales_rounding
      text_at_issue: Form 8949 permits cents or rounding all amounts; Form 1040 says add cents before
        rounding a line total. Row versus total reconciliation is not explicit.
      readings:
        - Preserve exact cents throughout.
        - Round each row before aggregation.
        - Round totals after aggregating exact rows.
      chosen: Preserve exact cents throughout Stage 3; whole-dollar mode remains deferred.
      reason: Avoid choosing a reconciliation policy without explicit support; cents are expressly
        permitted.
      cite:
        doc: i8949
        locator: p. 3, Rounding Off to Whole Dollars; compare i1040gi p. 23
      status: Stage 3 implementation choice; whole-dollar default not implemented.
    - id: amb.2025.sd4952_selection
      text_at_issue: Schedule D line 20 directs Form 4952 filers to SDTW, while the worksheet
        applicability text specifies an amount on Form 4952 line 4g and gives exceptions.
      readings:
        - Follow line 20 literally for every Form 4952 filer.
        - Apply the detailed worksheet applicability and exceptions.
      chosen: Use the detailed worksheet conditions, including line 4g and exceptions.
      reason: The worksheet explicitly limits its own use and the Form 1040 line 16 instructions repeat
        the line 4g condition.
      cite:
        doc: i1040sd
        locator: p. 15, Schedule D Tax Worksheet, applicability; compare f1040sd line 20 and i1040gi p. 36
      status: Explicit Stage 3 source interpretation for review.
    - id: amb.2025.box2c_scope
      text_at_issue: The computed-scope table includes Form 1099-DIV box 2c, but the refusal list excludes
        Form 8949 code Q and Form 6251.
      readings:
        - Expand the distribution-only section 1202 exclusion path and associated AMT treatment.
        - Retain the explicit code Q/Form 6251 exclusions and refuse box 2c pending scope expansion.
      chosen: Refuse nonzero box 2c; no exclusion or AMT amount is silently omitted.
      reason: Archived Schedule D instructions require the exclusion on Form 8949 code Q and describe an
        AMT adjustment for 50/60/75-percent exclusions. The existing explicit exclusions are
        retained; the owner was notified and asked, then said continue without selecting an
        expansion.
      cite:
        doc: i1040sd
        locator: p. 8, Gain from Form 1099-DIV and Alternative Minimum Tax
      status: Scope conflict disclosed; expansion remains open.
    - id: amb.2025.eic_below_table
      text_at_issue: Worksheet A, line 2 says to look up the earned income in the EIC Table, whose first row is "At least
        1 But less than 50". An earned income below $1 (for example, no wages) has no row.
      readings:
        - The credit on line 2 is zero, so "If line 2 is zero, STOP. You can't take the credit" applies.
        - The return is refused because the table gives no value.
      chosen: The credit on line 2 is zero.
      reason: >
        Every column of the table is zero at the far end and rises from $2 to $11 in the first row, so the credit is
        built up from earned income; with no row for less than $1 the table grants nothing there, and the worksheet's
        own instruction for a zero line 2 ends the computation. Rev. Proc. 2024-40 section 3.06(1) describes the
        credit as a percentage of earned income up to the earned income amount, which is zero at zero earned income.
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 2; p. 49, EIC Table, first row
      status: Owner approved ($0) after the check that it cannot err; below $1 every column's credit, figured at
        the steepest build-up rate (45%), is under $0.45 and rounds to $0, and earned income is never negative in scope
        (self-employment is refused).

    - id: amb.2025.hsa_last_month_change
      text_at_issue: Form 8889 line 3 instructions, rule 2, "If the last-month rule ... applies, you are considered an eligible
        individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on
        the first day of the last month", and rule 4, "If you were, or were considered, an eligible individual for the entire
        year and you changed your type of coverage during the year, enter on line 3 ... the greater of" the Line 3
        Limitation Chart and Worksheet or the maximum for the December 1 coverage.
      readings:
        - Under the last-month rule, line 3 is the maximum for the December 1 coverage (rule 2's same coverage for the year).
        - Under the last-month rule with a change of coverage type, line 3 is the greater of the chart and the December 1
          maximum (rule 4 names a filer who "were considered" eligible all year).
      chosen: The greater of the chart and the December 1 maximum when the coverage type changed among the eligible months;
        the December 1 maximum otherwise (f8889.line3_last_month).
      reason: >
        Rule 4 names the filer considered eligible all year, which is the last-month rule's filer, so it reads as the
        stricter fit to the text; the result is never less than rule 2's amount. Found by the Stage 11 class M hand-work
        (the model applied rule 4; the second transcription read rule 2); the owner chose rule 4.
      cite:
        doc: i8889
        locator: p. 4, Line 3, rules 2, 3 and 4
      status: Owner ruling after Stage 11 (keep rule 4).
    - id: amb.2025.hsa_last_month_all_year
      text_at_issue: 'Form 8889 instructions p. 2, Last-month rule, "You may consider yourself an ''eligible individual''
        for the entire year if you are an eligible individual on the 1st day of the last month", and p. 4, Line 3, rule 2,
        "You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last
        month"; rules 3 and 4 name a filer who "were, or were considered," eligible for the entire year; Pub. 969 p. 5
        adds "if you didn''t otherwise have coverage". Whether a filer eligible in all twelve months can use the rule''s
        coverage treatment for the line 6 spouse rules (Step 1''s "months you were treated as having family coverage") and
        line 7.'
      readings:
        - Any filer eligible on December 1 who uses the last-month rule is treated as having the December 1 coverage for
          all twelve months.
        - The rule applies only to a filer not eligible in every month; a filer eligible all year keeps the actual months of
          family coverage.
      chosen: The first (f8889.use_last_month, read by f8889.step1_total, f8889.married_family, f8889.self_in_family and
        line 7).
      reason: >
        The rule is open to anyone eligible on December 1 and its coverage treatment is unqualified in the Form 8889
        instructions; Pub. 969 Example 2 treats a filer covered all year who changed to family coverage as contributing
        under the last-month rule. The filer answers whether they use it, so a filer eligible all year who does not gets
        the second reading's result. Found by the Stage 16 transcription review of f8889.
      cite:
        doc: i8889
        locator: p. 2, Last-month rule; p. 4, Line 3, rules 2 to 4; p. 7, Line 6, Step 1
      status: Proposed for the owner (Stage 16).
    - id: amb.2025.sli_ratio_places
      text_at_issue: The Student Loan Interest Deduction Worksheet, line 7, says "Enter the result as a decimal (rounded to at
        least three places)".
      readings:
        - Round the ratio to exactly three decimal places (half-up), the least precision the text allows.
        - Keep the ratio at full precision, which also satisfies "at least three places".
      chosen: Round the ratio half-up to three decimal places (the prorate atom with places 3 on sli.line8_figured).
      reason: >
        The owner's ruling. Three places is the least precision the text allows and the usual hand computation; the
        readings differ by at most a few cents of deduction (for example $167.50 against $166.67 on line 8 when line 6
        is $1,000 and line 1 is $2,500).
      cite:
        doc: i1040gi
        locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 7
      status: Owner ruling, Stage 11.
    - id: amb.2025.qbi_cooperative_patron
      text_at_issue: Form 8995 says to use the form if "you aren't a patron of an agricultural or horticultural cooperative";
        the Instructions for Form 8995 and the Form 1040 instructions for line 13a say "you aren't a patron in a specified
        agricultural or horticultural cooperative".
      readings:
        - Only a patron of a specified agricultural or horticultural cooperative is outside Form 8995 (the instructions).
        - Any patron of an agricultural or horticultural cooperative is outside Form 8995 (the form).
      chosen: Refuse any patron of an agricultural or horticultural cooperative, specified or not (qbi.unsupported).
      reason: >
        The owner asked for the strictly accurate reading. Refusing every patron satisfies both texts: a filer the form
        excludes is never computed on it, and a filer the instructions exclude is a patron the form also excludes. The
        cost is a refusal for a patron of a cooperative that is not specified, which the instructions would allow.
      cite:
        doc: f8995
        locator: Form 8995 (2025), note above line 1; i8995, Who Can Use Form 8995; i1040gi line 13a
      status: Owner ruling (choose the strictly accurate reading), after Stage 10.
    - id: amb.2025.eic_valid_ssn
      text_at_issue: For the EIC a child's valid SSN is "a number issued by the Social Security Administration unless 'Not
        Valid for Employment' is printed on the social security card and the number was issued solely to allow the
        recipient ... to apply for or receive a federally funded benefit", issued on or before the due date of the return.
        The child tax credit asks for "an SSN valid for employment" issued before the due date.
      readings:
        - Reuse the child tax credit question for the EIC count.
        - Ask a separate per-person question in the EIC's own words.
      chosen: Ask a separate per-person question in the EIC's own words (dependent.eic_ssn).
      reason: >
        The two definitions differ for a number issued on the due date itself and for a card marked "Not Valid for
        Employment" for a reason other than federally funded benefits. The owner preferred the separate question as the
        safer reading; it is asked only for a person who is already a qualifying child for the EIC.
      cite:
        doc: i1040gi
        locator: pp. 44-45, Social security number (SSN) (EIC); p. 18, Step 3, question 4 (child tax credit)
      status: Owner ruling, Stage 9 follow-up.
    - id: amb.2025.carloan_ratio_places
      text_at_issue: Proposed § 1.163-16(d)(2)(iii)(A) and (d)(4) allocate a loan's interest "on a pro rata basis" between the
        part that is a specified passenger vehicle loan and the rest, without saying how the ratio is figured or rounded.
      readings:
        - Round the ratio (qualifying debt divided by the loan) half-up to six decimal places, then the interest to the cent.
        - Keep the ratio exact and round only the allocated interest to the cent.
        - Round the ratio to three places, as the Student Loan Interest Deduction Worksheet does.
      chosen: Round the ratio half-up to six decimal places (the prorate atom with places 6 on carloan.mixed_prorated and
        carloan.refi_interest), the product half-up to the cent.
      reason: >
        The owner's ruling. Six places keeps the existing prorate atom unchanged; at the $10,000 cap on line 24 the result
        differs from an exact ratio by less than one cent, while three places could differ by about $5.
      cite:
        doc: fr-2025-24154
        locator: pp. 20–22, Proposed § 1.163-16(d)(2)(iii)(A) and (d)(4)
      status: Owner ruling, Stage 12.
    - id: amb.2025.hsa_line7_months
      text_at_issue: The Additional Contribution Amount Worksheet for Form 8889 line 7 says "$1,000 × number of months
        eligible", for a married filer age 55 or older when "You or your spouse had family coverage under an HDHP and were, or
        were considered to be, an eligible individual on the first day of the month" and "You were not enrolled in Medicare
        for the month". It does not say whether a month of self-only coverage, in a year with family coverage in other months,
        counts.
      readings:
        - Count every month you were, or were considered to be, an eligible individual (an eligible individual is never
          enrolled in Medicare).
        - Count only the months treated as having family coverage.
      chosen: Count every month treated as eligible (f8889.elig_months, all twelve under the last-month rule).
      reason: >
        Line 3 leaves out the additional contribution amount for every month once a married filer had family coverage at
        any time (p. 5, Note), so counting only family months would drop it for the self-only months altogether, which
        nothing in the instructions says. The worksheet's own words are "number of months eligible", and "If items (1)
        and (2) apply to all months during 2025, enter $1,000". Both readings agree when every eligible month has family
        coverage.
      cite:
        doc: i8889
        locator: p. 5, Line 3, Note; p. 7, Line 7 Additional Contribution Amount and the worksheet
      status: Owner accepted, after Stage 13.
    - id: amb.2025.auto_later_year_basis
      text_at_issue: Pub. 946 chapter 5, Depreciation Worksheet for Passenger Automobiles, line 16 says of the special depreciation
        allowance "Enter -0- if this is not the year you placed the car in service", so for a later year line 18 (the basis for
        depreciation) is the business cost less the section 179 deduction only. Chapter 4, Figuring the Unadjusted Basis of Your
        Property, says the table rates apply to unadjusted basis, which reduces the original basis by "Any special depreciation
        allowance taken on the property".
      readings:
      - Later years apply the table rate to the business cost less the section 179 deduction (the worksheet as printed).
      - Later years apply the table rate to the basis reduced by the special allowance taken in the first year (the general rule).
      chosen: 'Neither is computed: a vehicle placed in service 2019 to 2024 that took a special allowance in its first year is
        refused (scveh.screen).'
      reason: The owner's ruling. The two passages give different amounts for the common case of a vehicle that took the 100%
        allowance, and the publication does not say which governs; vehicles that took no special allowance, or only section 179,
        are computed the same under both.
      cite:
        doc: p946-html
        locator: Chapter 5, Depreciation Worksheet for Passenger Automobiles, line 16; chapter 4, Figuring the Unadjusted Basis
          of Your Property
      status: Owner ruling, Stage 14.
    - id: amb.2025.auto_unrecovered_basis
      text_at_issue: 'Pub. 946 chapter 5, Deductions After the Recovery Period: "Unrecovered basis is the cost or other basis
        of the passenger automobile reduced by any ... depreciation, and section 179 deductions that would have been allowable
        if you had used the car 100% for business and investment use and the passenger automobile limits had not applied." Its
        example reduces the basis by the amounts allowed under the limits ($31,500 less $16,935), and in its last year allows
        $1,875 where the table amount is $1,814.'
      readings:
      - Reduce the basis by the deductions allowable at 100% business use under the limits, each the lesser of the table amount
        and the limit (the example's method).
      - Reduce the basis by the deductions allowable at 100% business use without the limits (the definition's last clause), which
        leaves no unrecovered basis.
      - As the first reading, but allow the limit in a year where it exceeds the table amount (the example's last row).
      chosen: 'The first reading: each year''s deduction at 100% business use is the lesser of the table amount (with the section
        179 deduction in year 1) and that year''s limit (scveh.d1 to scveh.d6).'
      reason: 'The second reading would make the section meaningless, since the limits are what create unrecovered basis; the
        example computes it with the limits ("At the end of 2024, you had an unrecovered basis of $14,565 ($31,500 − $16,935)")
        and its 60% variation confirms business use is taken as 100%. The example''s last row ($1,875 allowed against $1,814)
        is taken as an error: the lesser of the two is the rule of every other row. The difference arises only when the unrecovered
        basis is below the year''s limit.'
      cite:
        doc: p946-html
        locator: Chapter 5, Deductions After the Recovery Period, and its example
      status: Owner accepted, after Stage 14.
    - id: amb.2025.mq_joint
      text_at_issue: 'Pub. 946 chapter 4, Which Convention Applies?: the mid-quarter convention applies if "the total depreciable
        bases of MACRS property you placed in service during the last 3 months of the tax year ... are more than 40% of the total
        depreciable bases of all MACRS property you placed in service during the entire year." It does not say whether spouses
        filing a joint return are one taxpayer for the test.'
      readings:
      - Both spouses' property together, as one return.
      - Each spouse's property separately.
      chosen: Both spouses' property together (mq.q4 and mq.total sum over every person on the return).
      reason: The owner's ruling; section 179's limits are already figured once for a joint return (i4562 line 11, "combine the
        total taxable incomes for you and your spouse").
      cite:
        doc: p946-html
        locator: Chapter 4, Which Convention Applies?, Mid-quarter convention
      status: Owner ruling, Stage 14.
    - id: amb.2025.vehicle_business_pct
      text_at_issue: 'Form 4562 instructions, Column (c): "For automobiles and other vehicles, determine this percentage by dividing
        the number of miles the vehicle is driven for trade or business purposes ... by the total number of miles the vehicle
        is driven for all purposes." No precision is given.'
      readings:
      - Six decimal places, half-up.
      - Hundredths of a percent.
      - Whole percent.
      chosen: Business miles over total miles to six decimal places, half-up (the prorate atom with places 6 wherever the percentage
        is applied).
      reason: The owner's ruling.
      cite:
        doc: i4562
        locator: p. 14, Column (c)—Business/investment use percentage
      status: Owner ruling, Stage 14.
    - id: amb.2025.sep_rate_places
      text_at_issue: 'Pub. 560 chapter 5, Rate Worksheet for Self-Employed, line 3: "Self-employed rate as a decimal rounded to
        at least 3 decimal places (line 1 ÷ line 2)"; the Rate Table for Self-Employed gives six (10% is 0.090909).'
      readings:
      - Six decimal places (the Rate Table).
      - Three decimal places (the least the worksheet allows).
      chosen: Six decimal places, half-up (person.sep_s5); only whole-percent plan rates are accepted, which the Rate Table covers.
      reason: For whole-percent plan rates the Rate Table applies, and it prints six places; "at least 3" permits six.
      cite:
        doc: p560
        locator: chapter 5, Rate Table for Self-Employed and Rate Worksheet for Self-Employed
      status: Owner accepted, after Stage 14.
    - id: amb.2025.f7206_line15_person
      text_at_issue: 'Form 7206 line 7: "Multiply Schedule 1 (Form 1040), line 15, deductible part of self-employment tax, by
        the percentage on line 6"; the Schedule 1 line 17 worksheet, line 2, subtracts "any deductions on Schedule 1, lines 15
        and 16". On a joint return Schedule 1 lines 15 and 16 combine both spouses.'
      readings:
      - Use the amounts of the spouse whose business establishes the plan (their own Schedule SE line 13 and SEP or SIMPLE deduction).
      - Use the whole of Schedule 1, lines 15 and 16.
      chosen: 'The first: sc.f7206_line7 uses person.se_line13 and sc.f7206_line9 uses person.s16 of the business''s owner.'
      reason: Line 5 of Form 7206 and its line 9 ("attributable to the same trade or business") look only at the businesses of
        the person whose insurance it is; the other spouse's self-employment tax is not attributable to this business. The readings
        agree when only one spouse is self-employed.
      cite:
        doc: f7206
        locator: Form 7206 (2025), lines 5 to 9; i1040gi Schedule 1 line 17 worksheet, line 2
      status: Owner accepted, after Stage 14.
    - id: amb.2025.f7206_ratio_places
      text_at_issue: 'Form 7206 line 6: "Divide line 4 by line 5". No precision is given.'
      readings:
      - Six decimal places, half-up.
      - Exact.
      chosen: Six decimal places, half-up (prorate with places 6 on sc.f7206_line7_pos and sc.f7206_line9_pos).
      reason: Six places is the precision of the other ratios in this tool; with one business the ratio is exactly 1.
      cite:
        doc: f7206
        locator: Form 7206 (2025), line 6
      status: Owner accepted, after Stage 14.
    - id: amb.2025.f7206_plan_attribution
      text_at_issue: 'Form 7206 line 9: "Enter the amount, if any, from Schedule 1 (Form 1040), line 16, ... attributable to the
        same trade or business in which the insurance plan is established." The instructions do not say how a contribution figured
        on all of a person''s businesses is attributed to one.'
      readings:
      - In proportion to the business's share of the person's net profits (line 4 over line 5, as line 7 does for self-employment
        tax).
      - Wholly to the business under which the plan is established.
      chosen: In proportion to the business's net profit over the total of the person's net profits (sc.f7206_line9).
      reason: A SEP or SIMPLE plan is supported only for a person with one Schedule C (Pub. 560 p. 7, "If you have more than one
        business, but only one has a retirement plan, only the earned income from that business is considered for that plan"; a
        plan with more than one Schedule C is refused, person.plan_screened), and with one business both readings give the whole
        amount.
      cite:
        doc: f7206
        locator: Form 7206 (2025), lines 6, 7 and 9
      status: Owner accepted, after Stage 14. Reason corrected after T-044 (BUG-0078; owner ruling to refuse a plan with more than one
        Schedule C); the reading is unchanged.
    - id: amb.2025.qbi_attribution
      text_at_issue: 'Form 8995 instructions, Line 1: "To figure the total amount of QBI, you must consider all items that are
        attributable to the trade or business. This includes, but isn''t limited to, ... deductible part of self-employment tax,
        self-employment health insurance deduction, and contributions to qualified retirement plans." No method is given for a
        person with more than one business.'
      readings:
      - Self-employment tax and retirement contributions in proportion to each business's net profit; the health insurance deduction
        to the business of its Form 7206.
      - Each item in proportion to net profit.
      chosen: The first (sc.qbi_se, sc.qbi_plan, sc.qbi_ded). Line 2 of Form 8995, the total, does not depend on the method.
      reason: Form 7206 is figured for the business under which the plan is established, so its deduction is attributable to that
        business; self-employment tax is figured on all businesses together, as on Form 7206 line 7, and a retirement plan is
        supported only for a person with one Schedule C (person.plan_screened), so its contributions belong to that business.
      cite:
        doc: i8995
        locator: Line 1, Determining your qualified business income
      status: Owner accepted, after Stage 14.
    - id: amb.2025.s179_carryover_no_property
      text_at_issue: 'Form 4562 instructions, Worksheet 1: "1. Enter total cost of section 179 property ... placed in service
        during the tax year beginning in 2025 ... 3. Enter the smaller of line 1 or line 2 here ... 4. Enter the amount from line
        3 here and on Form 4562, line 1"; Line 5: "If line 5 is zero, you cannot elect to expense any section 179 property. In
        this case, skip lines 6 through 11, enter zero on line 12, and enter the carryover of any disallowed deduction from 2024
        ... on line 13."'
      readings:
      - 'As printed: with no section 179 property placed in service in 2025, line 1 and line 5 are zero and a 2024 carryover is
        carried again, not deducted.'
      - Line 1 is the $2,500,000 limit whether or not property was placed in service, so a carryover can be deducted up to the
        income limit.
      chosen: The second. s179.line1 is the $2,500,000 the line 1 instruction states, so line 5 is the dollar limitation and a
        carryover is deducted up to the dollar limitation less the 2025 election and up to the business income limit (line 11).
        On a separate return line 5 is 50% of the limitation, the instruction's allocation when the spouses elect no other.
      reason: Research for the owner (ambiguities/research/amb.2025.s179_carryover_no_property.md) quotes the archived 26 U.S.C.
        179(b)(3)(B), Treas. Reg. 1.179-2(b) and 1.179-3(b) to (d), and P.L. 119-21 sec. 70306. The carryover's room is "the
        limitation of paragraphs (1) and (2)", the dollar amount, which the cost of 2025 property reduces only above $4,000,000.
        Form 4562 computes exactly that when line 1 is the $2,500,000 the line 1 instruction states (p. 4). The optional
        Worksheet 1 instead takes the smaller of that and the cost of 2025 property, a cap that changes no return without a
        carryover and departs from the statute on a return with one.
      cite:
        doc: i4562
        locator: p. 4, Line 1 and Worksheet 1; p. 5, Line 5
      status: Owner ruling after Stage 14 (T-043), on the research memo.
    - id: amb.2025.meals_full_exceptions
      text_at_issue: 'Schedule C instructions, Line 24b, Amount of deduction: "However, you can fully deduct meals and incidentals
        furnished or reimbursed to an employee if you properly treat the expense as wages subject to withholding. You can also
        fully deduct meals and incidentals provided to a nonemployee to the extent the expenses are includible in the gross income
        of that person and reported on Form 1099-NEC. See chapter 5 of Pub. 15, Employer''s Tax Guide, for details and other
        exceptions. See also chapter 8 of Pub. 334."'
      readings:
      - Only the two cases the instruction names are deducted in full.
      - The two named cases and the other exceptions to the 50% limit, as Pub. 463 lists them (Exception to the 50% Limit for
        Meals, p. 16), each deducted in full.
      chosen: The second (sc.meals_100). Of Pub. 463's six exceptions, exception 2 (an employee reimbursed under an accountable
        plan) concerns employees and is not a Schedule C expense; exception 1 is the instruction's first case; exceptions 3 to
        6 are the client-reimbursed independent contractor, recreation for employees, food for the general public, and meals sold
        to the public. The question asks for none of the amounts entered elsewhere on Schedule C, such as cost of goods sold.
      reason: The instruction says other exceptions exist and points to Pub. 15 chapter 5 and Pub. 334 chapter 8. Pub. 15 (2025)
        chapter 5 covers whether meals are wages and lists no exceptions to the limit; Pub. 334 (2025), Travel and Meals, repeats
        the 50% rule and refers to Pub. 463, which lists the exceptions. Asking for the named cases only would leave a filer
        whose meals fall under another exception with no correct entry.
      cite:
        doc: p463
        locator: p. 16, Exception to the 50% Limit for Meals, exceptions 1 to 6
      status: Owner ruling after Stage 14 (T-042).
    - id: amb.2025.vehicle_s179_claimed
      text_at_issue: 'Pub. 946, Depreciation Worksheet for Passenger Automobiles, line 10: "Section 179 deduction claimed this year (not more
        than line 9)"; Form 4562 line 11: "The total cost you can deduct is limited to your taxable income from the active conduct of a trade
        or business."'
      readings:
      - The section 179 cost elected for the vehicle this year (Form 4562 column (i)), not more than line 9.
      - The part of that election deducted this year after the business income limit of Form 4562 line 11, the rest being carried over.
      chosen: The first (scveh.line10 through scveh.s179_line10).
      reason: The two differ only when the business income limit cuts the year's section 179 deduction and the vehicle carries part of it.
        The basis is reduced by the whole amount elected, the carryover included, since Pub. 946 says that on a disposition before the
        carryover is used "you must add it back to the property's basis" (p. 20); the worksheet then limits the year's depreciation by
        the same amount. The second reading would let the year's depreciation room grow by an amount that is still deductible later.
      cite:
        doc: p946
        locator: p. 62, Depreciation Worksheet for Passenger Automobiles, line 10; p. 20, Carryover of disallowed deduction
      status: Agent reading, after Stage 14 (scveh render review), for the owner's review (TASKS.md T-046).
    - id: amb.2025.dc_ineligible_providers
      text_at_issue: 'i2441 p. 2, item 4: "The person who provided the care wasn''t your spouse, the parent of your qualifying child,
        or a person whom you can claim as a dependent. If your child (including stepchild or foster child) provided the care, they
        must have been age 19 or older by the end of 2025 and they can''t be your dependent"; p503 p. 8, Payments to Relatives or
        Dependents: "A person for whom you (or your spouse if filing jointly) can claim as a dependent", "Your child ... who was
        under age 19 at the end of the year, even if they aren''t your dependent", "A person who was your spouse any time during
        the year" and "The parent of your qualifying person if your qualifying person is your child and under age 13".'
      readings:
      - Pub. 503's list of four (dcprov.related), which is broader for a spouse (at any time during the year) and narrower for a
        parent (only of your child under 13).
      - The instructions' list (your spouse, the parent of your qualifying child, your dependent, your child under 19).
      chosen: The first (dcprov.related asks Pub. 503's list; a Yes refuses Form 2441).
      reason: The owner's decision (Stage 15, decision 6). The publication is the more specific text, and both lists agree on a
        dependent and a child under 19. A provider in either list refuses, so the reading decides only which question is asked.
      cite:
        doc: p503
        locator: p. 8, Payments to Relatives or Dependents, "However, don't count any amounts you pay to"
      status: Owner ruling, Stage 15 (T-048).
    - id: amb.2025.dc_line1e_attribution
      text_at_issue: 'i2441 p. 4, Lines 4 and 5: "If filing jointly, figure your and your spouse''s earned income separately" and
        earned income "generally includes ... The amount shown on Form 1040, 1040-SR, or 1040-NR, line 1z"; line 1z includes line
        1e (Form 2441 line 26), a figure for the return, not for either spouse.'
      readings:
      - Line 1e is the earned income of the spouse whose Forms W-2 show box 10; when both spouses' (or neither spouse's) Forms W-2
        show box 10 on a joint return, line 1e is above zero and a credit remains (line 31 above zero), the form is refused.
      - Line 1e is split between the spouses in proportion to each spouse's part of line 12.
      - Line 1e is the filer's (line 4) earned income.
      chosen: The first (person.dc_1e, f2441.attrib_gate). On a return that is not joint there is one person and line 1e is theirs.
        When the split is undetermined but no credit remains (line 31 is zero, so line 3 and line 6 are zero whatever lines 4 and 5
        hold), line 1e is shown in the taxpayer's line 4, keeping lines 4 and 5 together equal to line 1z plus self-employment
        earnings; the credit cannot differ.
      reason: The owner's decision (Stage 15, decision 6). Taxable benefits arise from one spouse's plan; the instructions give no
        rule for dividing a joint line 26, and the case where it matters (benefits over the exclusion with a credit still left) is
        rare, since excluded benefits of $5,000 leave at most $1,000 of the $6,000 limit.
      cite:
        doc: i2441
        locator: p. 4, Lines 4 and 5, "If filing jointly, figure your and your spouse's earned income separately"
      status: Owner ruling, Stage 15 (T-048); the display of line 1e on line 4 in the undetermined case with no credit is an agent
        reading for the owner's review.
    - id: amb.2025.dc_line30
      text_at_issue: 'Form 2441 line 30: "Complete line 2 on page 1 of this form. Don''t include in column (d) any benefits shown on
        line 28 above. Then, add the amounts in column (d) and enter the total here"; the instructions give no rule for dividing
        line 28 among the qualifying persons.'
      readings:
      - Line 30 is the total of the qualified expenses incurred and paid in 2025 for all qualifying persons less line 28, and not
        less than zero; column (d) shows each person's expenses before excluding benefits.
      - Each person's column (d) is asked net of the benefits that paid for that person's care, and line 30 is their sum.
      chosen: The first (f2441.line30; dependent.dc_paid and dependent.dc_line2d ask and show each person's expenses including
        those paid with dependent care benefits).
      reason: The owner's decision (Stage 15, decision 6). The total is determined by the text and verifiable; an allocation of line
        28 among persons is not. In Pub. 503's example (the Paris family, p. 13) the benefits covered one child's expenses and the
        total less the benefits is the line 30 the example uses ($19,500 less $1,000).
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 30
      status: Owner ruling, Stage 15 (T-048).
    - id: amb.2025.dc_plan_maximum
      text_at_issue: 'Form 2441 line 21: "However, don''t enter more than the maximum amount allowed under your dependent care plan";
        i2441 p. 5, Line 21: "if your dependent care plan only allows a maximum of $4,000 to be excluded, substitute $4,000". The
        text speaks of one plan; spouses, or one person with two employers, may have more than one.'
      readings:
      - One plan maximum for the return (f2441.plan_max), the smaller of it and $5,000; refused when the plans allow different
        maximums.
      - The $5,000 limit, reduced only if every plan's maximum is lower.
      - The sum of the plans' maximums, not more than $5,000.
      chosen: The first (f2441.plan_max, f2441.plans_differ).
      reason: The owner's decision (Stage 15, decision 6). Where every plan allows the same maximum the readings agree; where they
        differ the text does not decide, so that case is refused.
      cite:
        doc: i2441
        locator: p. 5, Line 21, "Don't enter more than the maximum amount allowed under your dependent care plan"
      status: Owner ruling, Stage 15 (T-048).
    - id: amb.2025.dc_rate_nonpositive_agi
      text_at_issue: 'Form 2441, line 8: "Enter on line 8 the decimal amount shown below that applies to the amount on line 7", in a
        table whose first band is "Over $0 But not over 15,000".'
      readings:
      - Line 7 of zero or less takes the first band's .35.
      - Line 7 of zero or less has no decimal amount, and the credit is not figured.
      chosen: The first (tables/2025/dc_rate.yaml, the first band open below).
      reason: The owner's ruling. In this tool the readings cannot differ in the credit. Line 7 (adjusted gross income) of zero or
        less gives taxable income of zero and no tax on Form 1040 line 16, and Schedule 2 Part I (line 17) is zero here, the
        alternative minimum tax and the repayment of excess advance premium tax credit being refused (s2.amt and the Schedule 2
        screen); so line 18 is zero, and the Credit Limit Worksheet's line 3 and line 10 are zero. A rate is still needed for line
        8 to be known.
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 8
      status: Owner ruling, Stage 15 (T-048).
    - id: amb.2025.f5695_17abc_section_a
      text_at_issue: 'Form 5695, after line 17c: "If you checked the No box for line 17a, 17b, or 17c, you cannot claim the
        energy efficient home improvement credit. Do not complete Part II, Section A." The instructions for lines 17a to 17c
        say each time "If you check the No box, you can''t take the energy efficient home improvement credit."'
      readings:
      - A No on line 17a, 17b or 17c zeroes Section A (lines 18b, 19h and 20d) only; Section B and the home energy audit are
        figured by their own tests (lines 21a, 21b and 26a).
      - A No on any of them disallows the whole of Part II.
      chosen: The first (f5695.sec_a_claimed gates lines 18b, 19h and 20d only).
      reason: The owner's decision. Section B has its own residence test on line 21a, "a home located in the United States
        that you use as a residence", which is not limited to the main home, and its own original-use test on line 21b, and
        the audit has its own test on line 26a; the form's direction is "Do not complete Part II, Section A". Reading the
        No as disallowing Section B would make line 21a's wider residence test unreachable for anyone without Section A
        improvements on a main home.
      cite:
        doc: f5695
        locator: Form 5695 (2025), lines 17a to 17c and 21a; i5695 p. 5, Lines 17a Through 17e
      status: Owner ruling, Stage 15 (T-048).
    - id: amb.2025.f5695_category_cap
      text_at_issue: 'Form 5695 lines 22d, 23d, 24d and 25e cap 30% of each category''s total cost at $600 ("Multiply line 22c
        by 30% (0.30). Enter the results. Do not enter more than $600"); the instructions list "A credit limit of $600 for
        any qualified energy property item" (i5695 p. 2).'
      readings:
      - The form's cap of $600 on each category (central air conditioners, water heaters, furnaces and boilers, enabling
        property), whatever the number of items in it.
      - A cap of $600 on each item, so that two central air conditioners could give up to $1,200 before line 28.
      chosen: The first (f5695.ac_capped, wh_capped, furnace_capped and enabling_capped against f5695.item_max).
      reason: The owner's decision to encode the form as printed. The joint occupancy list of credit limits (i5695 p. 3) also
        gives the limit by category ("$600 for central air conditioners"). The two readings differ only for a filer with two
        or more items in one category whose 30% exceeds $600 together, and line 28's $1,200 limit narrows even that.
      cite:
        doc: f5695
        locator: Form 5695 (2025), lines 22d, 23d, 24d and 25e; i5695 p. 2, Energy Efficient Home Improvement Credit (Part
          II), "A credit limit of $600 for any qualified energy property item"
      status: Owner ruling, Stage 15 (T-048).
    - id: amb.2025.f5695_battery_second_home
      text_at_issue: 'i5695 p. 2: lines 1 to 4 each say "The home doesn''t have to be your main home"; qualified battery storage
        technology costs are for technology "installed in connection with your home located in the United States", with
        nothing said either way about a main home. Fuel cell property, by contrast, is for "your main home".'
      readings:
      - Battery storage technology on any home in the United States you used as a residence counts, as lines 1 to 4 do.
      - Battery storage technology counts only on the main home, as fuel cell property does.
      chosen: The first (f5695.line5a asks for battery storage technology installed in connection with your home in the United
        States, not your main home).
      reason: The owner's decision. The text names the main home where it means it (fuel cell property, line 7a) and does not
        for the battery; the Part I general rule is that improvements to "more than one home that you used as a residence"
        go on one Form 5695 (i5695 p. 2).
      cite:
        doc: i5695
        locator: p. 2, Qualified battery storage technology costs, "installed in connection with your home located in the
          United States"
      status: Owner ruling, Stage 15 (T-048).
    - id: amb.2025.f5695_section_b_residence
      text_at_issue: 'Form 5695 line 21a: "a home located in the United States that you use as a residence"; i5695 p. 3,
        Section B: "a home that you used during 2025"; but the Schedule 3 line 5b instructions describe the credit as for
        improvements "to your main home" (i1040gi p. 116) and line 17d says "You can only claim the energy efficient home
        improvement credit on one main home" (i5695 p. 5).'
      readings:
      - Section B property (lines 22 to 25 and 29) counts on any home in the United States you use as a residence, a second
        home or a rented home included; Section A and the audit require the main home.
      - All of Part II requires the main home.
      chosen: The first (f5695.line21a's question says the home may be a second home or a home you rent).
      reason: The owner's decision. Line 21a and the Section B paragraph state the wider test, line 21c asks for "each home",
        and Fact Sheet 2025-01 says "such property may be installed in the taxpayer’s second home" and that "the taxpayer may
        rent the home". The main-home statements are in Section A (lines 17a and 17d) and in a summary in the Form 1040
        instructions.
      cite:
        doc: fs-2025-01
        locator: p. 5, Energy Efficient Home Improvement Credit - Qualifying residence, "In this case, the taxpayer may rent
          the home in which such property is installed, and such property may be installed in the taxpayer’s second home"
      status: Owner ruling, Stage 15 (T-048).
    - id: amb.2025.clwb_claiming_part1
      text_at_issue: 'i1040s8812 p. 4, Credit Limit Worksheet A: "Complete Credit Limit Worksheet B only if you meet all the
        following. 1. You are claiming one or more of the following credits. ... c. Residential clean energy credit, Form
        5695, Part I." Whether one is claiming the credit depends on Form 5695 line 15, which is limited by a worksheet that
        reads Credit Limit Worksheet B line 14 when Worksheet B is completed.'
      readings:
      - Claiming the credit means completing Form 5695 Part I with line 13 (the credit before the tax limit, the 2024
        carryforward included) more than zero.
      - Claiming the credit means Form 5695 line 15 (the credit allowed) is more than zero.
      chosen: The first (f5695.claiming_part1).
      reason: The second is circular (line 15 depends on whether Worksheet B is completed). The readings cannot differ in any
        amount. With Worksheet B completed, the Part I limit subtracts Worksheet B line 14, which is never more than Schedule
        8812 line 12, instead of Form 1040 line 19, the smaller of line 12 and Credit Limit Worksheet A line 3; so the limit
        with Worksheet B is at least the limit without it. If line 13 is more than zero and line 15 is zero with Worksheet B,
        it is zero without it too, and Credit Limit Worksheet A line 4 (Worksheet B line 15, Schedule 3 line 5a) is zero
        either way; if line 15 is more than zero, both readings complete Worksheet B.
      cite:
        doc: i1040s8812
        locator: p. 4, Credit Limit Worksheet A, "Complete Credit Limit Worksheet B only if you meet all the following"
      status: Agent reading, Stage 15 (T-048), for the owner's review.
    - id: amb.2025.savers_ineligible_column
      text_at_issue: 'Form 8880, Caution and Who Can Take This Credit: "You cannot take this credit if either of the following
        applies ... The person(s) who made the qualified contribution or elective deferral (a) was born after January 1, 2008;
        (b) is claimed as a dependent on someone else’s 2025 tax return; or (c) was a student".'
      readings:
      - On a joint return, an ineligible spouse's own column is zero (line 6 of that column), and the other spouse's column is
        figured as usual.
      - On a joint return, one ineligible spouse bars the whole credit.
      chosen: The first (f8880.line6a and f8880.line6b through f8880.elig_a and f8880.elig_b).
      reason: The owner's decision (Stage 15 premise map, decision 4). The test is of "the person(s) who made the qualified
        contribution or elective deferral", so it reads as a test of each contributor, and the form keeps each spouse's
        contributions in their own column. Whether a person is claimed as a dependent is asked of each person
        (person.sav_claimed), not read from the return's "can claim" question; it is asked only when someone can claim you or
        your spouse (sa.dependent), since otherwise no one is claimed.
      cite:
        doc: f8880
        locator: 'p. 2, Who Can Take This Credit, "The person(s) who made the qualified contribution or elective deferral (a) was
          born after January 1, 2008; (b) is claimed as a dependent on someone else’s 2025 tax return; or (c) was a student"'
      status: Owner decision, Stage 15 (T-048).
    - id: amb.2025.savers_line4_gross
      text_at_issue: 'Form 8880, Line 4: "Enter the total amount of distributions you, and your spouse if filing jointly, received
        after 2022 and before the due date of your 2025 return (including extensions) from any of the following types of plans",
        followed by a list of distributions not to include.'
      readings:
      - The gross distribution (Form 1099-R box 1) less the part rolled over, the listed kinds excluded; a nontaxable part (basis
        recovered, a qualified Roth distribution) counts.
      - The taxable amount of each distribution.
      chosen: The first (retirement.sav_gross; f8880.line4a and f8880.line4b).
      reason: The owner's decision (Stage 15 premise map, decision 4). The text says "total amount of distributions" and
        excludes only the kinds it lists; a rollover is excluded because it is "not taxable as the result of a rollover", and the
        other exclusions it lists either need a form this tool refuses (retirement.special, retirement.bad_code) or are asked for
        each Form 1099-R (retirement.sav_military, retirement.sav_404k, retirement.sav_inherited).
      cite:
        doc: f8880
        locator: 'p. 2, Line 4, "Enter the total amount of distributions"; "Don’t include any of the following"'
      status: Owner decision, Stage 15 (T-048).
    - id: amb.2025.savers_2026_joint
      text_at_issue: 'Form 8880, Line 4: "Exception. Don’t include your spouse’s distributions with yours when entering an amount
        on line 4 if you and your spouse didn’t file a joint return for the year the distribution was received." A distribution
        received in 2026, before the due date of the 2025 return, is received in a year whose return is not yet filed.'
      readings:
      - A 2026 distribution counts as from a year filed jointly when the 2025 return is joint (both columns).
      - A 2026 distribution counts as from a year filed jointly only if the spouses expect to file jointly for 2026.
      - A 2026 distribution goes in the column of the spouse who received it only.
      chosen: The first (person.sav_prior_joint includes 2026; f8880.prior_joint).
      reason: The owner's decision (Stage 15 premise map, decision 4). The 2026 return cannot be known when the 2025 return is
        prepared, and the 2025 return's filing status is the one fact available.
      cite:
        doc: f8880
        locator: 'p. 2, Line 4, "Exception. Don’t include your spouse’s distributions with yours when entering an amount on line
          4 if you and your spouse didn’t file a joint return for the year the distribution was received"'
      status: Owner decision, Stage 15 (T-048).
    - id: amb.2025.savers_inherited_plans
      text_at_issue: 'Form 8880, Line 4, among the distributions not to include: "Distributions from an inherited IRA by a nonspousal
        beneficiary." The list names no inherited employer plan.'
      readings:
      - Only an inherited IRA of a nonspouse beneficiary is excluded; distributions from an inherited 401(k), 403(b) or other
        plan count.
      - Distributions to a nonspouse beneficiary from any inherited plan are excluded.
      chosen: The first (retirement.sav_inherited is asked of IRA distributions only).
      reason: The owner's decision (Stage 15 premise map, decision 4), the literal reading of the list.
      cite:
        doc: f8880
        locator: 'p. 2, Line 4, "Distributions from an inherited IRA by a nonspousal beneficiary"'
      status: Owner decision, Stage 15 (T-048).
    - id: amb.2025.savers_sep_contrib
      text_at_issue: 'Form 8880, Line 2: "Elective deferrals (including designated Roth contributions under section 402A, if applicable)
        to a 401(k), 403(b), governmental 457(b), SEP, SIMPLE, or the federal TSP." A self-employed person''s own SEP contribution
        (Pub. 560 chapter 2) is an employer contribution, not an elective deferral; the person''s SIMPLE IRA salary reduction
        contributions (chapter 3) are.'
      readings:
      - The self-employed SIMPLE salary reduction contributions (person.simple_deferral) count on line 2; the self-employed SEP
        contribution (person.sep_contrib) does not.
      - Both count.
      - Neither counts.
      chosen: The first (person.sav_simple_plan).
      reason: The owner's decision (Stage 15 premise map, decision 2). Only elective deferrals to a SEP (code F, a salary
        reduction SEP) are named; a SEP contribution a self-employed person makes for themselves is a nonelective contribution.
      cite:
        doc: f8880
        locator: 'p. 2, Line 2, "Elective deferrals (including designated Roth contributions under section 402A, if applicable)
          to a 401(k), 403(b), governmental 457(b), SEP, SIMPLE, or the federal TSP"'
      status: Owner decision, Stage 15 (T-048).
    - id: amb.2025.dc_born_died_half_year
      text_at_issue: 'Pub. 503, Who Is a Qualifying Person?, "treated as having lived with you for more than half of 2025 if your
        home was the person''s home more than half the time they were alive in 2025"; the dependent tests ask whether a person
        who is not your qualifying child lived with you "the entire time" (dependent.months).'
      readings:
      - A person over 12 unable to care for themselves who was born or died in 2025 qualifies on the time they were alive, as
        Pub. 503 says.
      - The dependent tests' answer stands, so such a person may not be counted.
      chosen: The second, as encoded (no question is added); it can only leave out a qualifying person, so it never overstates
        the credit.
      reason: The owner's ruling (Stage 15 question 13). The case is rare, and asking it would add a question for every
        dependent.
      cite:
        doc: p503
        locator: p. 3, Who Is a Qualifying Person?
      status: Owner ruling, Stage 15 (HANDOFF-STAGE-15.md, question 13).
    - id: amb.2025.line8z_kinds
      text_at_issue: 'Schedule 1, line 8z: "Other income. List type and amount". i1040gi p. 92 gives examples; the project has
        no text values, so the type cannot be written.'
      readings:
      - A collection of line 8z entries, each with a kind from a fixed list (shown on the values sheet in place of the type)
        and an amount; the kinds that need no other form or worksheet are computed and the rest refused.
      - One total for line 8z with a notice that the filer writes the type on the form.
      chosen: 'The first (oi8z). Computed kinds: RTAA payments (Form 1099-G box 5) and kickbacks, side commissions, push money
        or similar payments not from self-employment. Refused kinds: recoveries (Pub. 525 Recoveries), loss on corrective
        distributions, charitable deduction recaptures (Schedule 2 line 17g), the taxable part of disaster relief
        payments, Coverdell ESA or QTP distributions (Form 5329), dividends on insurance policies above the net premiums,
        and any other kind.'
      reason: 'The owner''s decision D4 (Stage 16). The closed list is the premise map''s R-OI-2 less insurance dividends:
        Form 8960 line 7 takes "Other items of NII ... reported on Schedule 1 (Form 1040), line 8z", and an insurance
        policy dividend above the premiums paid may be net investment income (an amount from an insurance contract) that
        this tool would leave off Form 8960; an entry cannot read the return''s income to refuse only above the Form 8960
        threshold (that would be a cycle through line 8z), so the conservative reading refuses it.'
      cite:
        doc: i1040gi
        locator: 'p. 92, Line 8z, "List the type and amount of income" and "Examples of income to report on line 8z include
          the following"; i8960 p. 13, Line 7—Other Modifications to Investment Income, "Other items of NII (or properly allocable deductions) not otherwise
          included on Form 8960 reported on Schedule 1 (Form 1040), line 8z"'
      status: Owner decision D4, Stage 16 (T-053); the refusal of insurance dividends is the authoring agent's conservative
        choice, for the owner.
    - id: amb.2025.gambling_losses
      text_at_issue: 'Schedule A, line 16 (i1040sca p. 11): "Gambling losses ... but only to the extent of gambling winnings
        reported on Schedule 1 (Form 1040), line 8b." A filer who does not itemize deducts none (p525 p. 33, "If you itemize
        your deductions on Schedule A (Form 1040), you can deduct gambling losses").'
      readings:
      - Line 16 is the smaller of the year's gambling losses and line 8b; it enters Schedule A line 17 like any other
        itemized deduction, so it counts only when itemized deductions are taken; with no winnings it is zero and the
        losses are not asked.
      - Gambling losses are not computed (Schedule A line 16 stays refused).
      chosen: The first (sa.line16_gambling, sa.line16); a professional gambler (s1.gambling_pro) is refused at line 8b.
      reason: The owner's decision D14 (Stage 16). The comparison of itemized and standard deductions (sa.itemizes) already
        applies the "only when itemizing" condition. Whether a professional gambler is asked only when there are winnings
        is the authoring agent's reading (a professional gambler with no winnings has nothing on line 8b or line 16).
      cite:
        doc: i1040sca
        locator: 'p. 11, Other Itemized Deductions, "but only to the extent of gambling winnings reported on Schedule 1 (Form
          1040), line 8b"; p525 p. 33, Gambling winnings, "If you’re in the trade or business of gambling, use Schedule C
          (Form 1040)"'
      status: Owner decision D14, Stage 16 (T-053).
    - id: amb.2025.jury_24a_cap
      text_at_issue: 'Schedule 1, line 24a (i1040gi p. 99): "Enter your jury duty pay if you gave the pay to your employer
        because your employer paid your salary while you served on the jury." Nothing says what to do with an amount given
        to the employer above the jury duty pay on line 8h.'
      readings:
      - The amount given to the employer is asked; an amount above line 8h is an impossible entry and is refused.
      - Line 24a is the smaller of the amount given and line 8h.
      chosen: The first (s1.jury_over refuses s1.line24a).
      reason: 'The pay given to the employer is part of the pay received (p525 p. 34, "you can deduct the amount turned over
        to your employer"), so a larger amount is an entry error to correct, not a case to cap silently; as with w2.g_bad,
        the refusal fires only on an impossible entry. Premise map Q14, left open by D3.'
      cite:
        doc: i1040gi
        locator: 'p. 99, Line 24a, "Enter your jury duty pay if you gave the pay to your employer because your employer paid
          your salary while you served on the jury"'
      status: The authoring agent's reading, Stage 16 (T-053), for the owner.
    - id: amb.2025.refund_not_itemized
      text_at_issue: 'i1040gi p. 88, Line 1, TIP: "None of your refund is taxable if, in the year you paid the tax, you either
        (a) didn’t itemize deductions, or (b) elected to deduct state and local general sales taxes instead of state and local
        income taxes." Pub. 525 p. 24 also says that when you could choose income or sales taxes "the maximum refund that
        you may have to include in income is limited to the excess of the tax you chose to deduct for that year over the tax
        you didn’t choose to deduct", which read alone suggests a cap rather than zero for a filer who deducted sales taxes.'
      readings:
      - Schedule 1 line 1 is zero, and the worksheet is not used, when you did not itemize for 2024 or deducted general sales
        taxes instead of income taxes; the worksheet is used only when you itemized and deducted income taxes.
      - A filer who deducted sales taxes includes the income tax refund up to the excess of the sales tax over the income
        tax.
      chosen: The first (refund.worksheet, refund.taxable).
      reason: 'The owner''s decision D5, with the verification''s correction E5 of the premise map. The cap in Pub. 525 limits
        the refund of the tax you chose to deduct; for an income tax refund when sales tax was deducted, Pub. 525 p. 24, Example
        27, says "Because you didn’t choose to deduct the state income tax, you don’t include the state income tax refund in
        income", agreeing with the TIP. A refund of the sales tax itself is a different recovery, refused (refund.other).'
      cite:
        doc: i1040gi
        locator: 'p. 88, Line 1, "None of your refund is taxable if, in the year you paid the tax"; p525 p. 24, State tax refund,
          "Because you didn’t choose to deduct the state income tax, you don’t include the state income tax refund in income"'
      status: Owner decision, Stage 16 (T-053, D5).
    - id: amb.2025.refund_exceptions
      text_at_issue: 'i1040gi pp. 88-89, Line 1: "Exception. See Itemized Deduction Recoveries in Pub. 525 instead of using
        the State and Local Income Tax Refund Worksheet in these instructions if any of the following applies", items 1 to
        9; Pub. 525 p. 24 adds a nonresident alien. The exceptions say when the worksheet may not be used; they do not say
        whether they matter when no worksheet is needed because you did not itemize for 2024 or deducted sales taxes.'
      readings:
      - Ask items 1 and 5 (a refund for another year, a last 2024 estimated payment made in 2025) and Form 1099-G box 8 of
        every refund, and the rest (items 3, 4, 6, 7, 8, 9 and a 2024 Form 1040-NR) only when the worksheet would be used;
        refuse on Yes. Item 2 (refunds of other taxes) is asked of every return with the other recoveries.
      - Ask every exception of every refund, before the itemizing questions.
      chosen: The first (refund.box8 and refund.not_2024 on refund.taxable; refund.exc_tax and refund.exc_who on refund.line1;
        refund.other on Schedule 1 line 1).
      reason: The TIP is stated for "the year you paid the tax", which is 2024 only when the refund is for 2024 and was paid
        then, so items 1 and 5 can make a refund taxable even when you did not itemize for 2024, and a part of the refund for
        a 2025 payment changes the 2025 deduction for taxes (Pub. 525 p. 24, Example 28). Items 3, 4, 6, 7, 8 and 9 and the
        nonresident rule change only how much of a refund of a deducted tax is included; when no income tax was deducted
        for 2024, none is (Pub. 525 p. 24, Deductions not itemized). Box 8 sends a taxable refund to Schedule C or F whatever
        the itemizing. A recovery deducted on an earlier Form 8960 is refused by the existing screen f8960.refund, asked of
        every return.
      cite:
        doc: i1040gi
        locator: 'pp. 88–89, Line 1, "Exception. See Itemized Deduction Recoveries in Pub. 525 instead of using the State and
          Local Income Tax Refund Worksheet"; p525 p. 24, Deductions not itemized'
      status: Agent reading within the owner's decision D5, Stage 16 (T-053), for the owner's review.
    - id: amb.2025.refund_cap_5d
      text_at_issue: 'i1040gi p. 90, State and Local Income Tax Refund Worksheet, line 1: "But don’t enter more than the amount
        of your state and local income taxes shown on your 2024 Schedule A, line 5d." Line 5d of the 2024 Schedule A is the
        total of line 5a (income or general sales taxes), 5b (real estate taxes) and 5c (personal property taxes); the income
        tax alone is on line 5a.'
      readings:
      - Cap line 1 at the amount on 2024 Schedule A line 5d, as printed.
      - Cap line 1 at the income tax part, line 5a.
      chosen: The first (refund.line1).
      reason: The owner's decision D6(a). The worksheet names line 5d. A refund larger than the income tax deducted on line 5a
        is exception 4 territory when sales taxes could have been deducted, and is caught there (refund.exc_tax).
      cite:
        doc: i1040gi
        locator: 'p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 1, "But don’t enter more than
          the amount of your state and local income taxes shown on your 2024 Schedule A, line 5d"'
      status: Owner decision, Stage 16 (T-053, D6).
    - id: amb.2025.refund_paid_5d
      text_at_issue: 'i1040gi p. 90, State and Local Income Tax Refund Worksheet, line 2: "the amount of state and local income
        taxes (or general sales taxes), real estate taxes, and personal property taxes paid in 2024 (generally, this is the
        amount reported on your 2024 Schedule A, line 5d)". "Generally" admits a paid amount different from line 5d without
        saying when.'
      readings:
      - Ask the amount reported on 2024 Schedule A line 5d, and use it both for the line 1 limit and for the amount paid on
        line 2.
      - Ask the amount paid in 2024 separately from line 5d.
      chosen: The first (refund.line5d_2024).
      reason: The owner's decision D6(b). The worksheet itself takes line 5d as the usual amount, and a filer reads it from
        the 2024 return.
      cite:
        doc: i1040gi
        locator: 'p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 2, "(generally, this is the amount
          reported on your 2024 Schedule A, line 5d)"'
      status: Owner decision, Stage 16 (T-053, D6).
    - id: amb.2025.refund_boxes_2024
      text_at_issue: 'i1040gi p. 90, State and Local Income Tax Refund Worksheet, line 6: "Check any boxes that apply. You
        were born before January 2, 1960. You are blind. Spouse was born before January 2, 1960. Spouse is blind." with the
        footnote "If your filing status is married filing separately, you can check the boxes for your spouse only if your
        spouse had no income, isn’t filing a return, and can’t be claimed as a dependent on another person’s return." The
        boxes are those of the 2024 standard deduction; the 2024 spouse may not be the 2025 spouse, and the worksheet does
        not say when blindness is judged or when a spouse box applies for a 2024 status other than married filing separately.'
      readings:
      - Ask four yes/no questions about 2024 (born before January 2, 1960; blind at the end of 2024; the same for the spouse
        on the 2024 return, with the married filing separately conditions in the spouse questions); ask the spouse questions
        only when the 2024 filing status was married filing jointly or married filing separately; each box checked adds the
        per-box amount.
      - Ask one count of boxes checked.
      - Derive the boxes from the 2025 person records.
      chosen: The first (refund.you_born, refund.you_blind, refund.spouse_born, refund.spouse_blind, refund.spouse_boxes).
      reason: The owner's decision D6(c) (four yes/no questions, since a 2024 spouse may not be the 2025 one). Blindness at
        the end of the year and the spouse boxes for a joint or separate return follow the standard deduction instructions
        (i1040gi p. 33, Line 12d, for 2025, "If you or your spouse (if you are married and filing a joint return) were born
        before January 2, 1961, or were blind at the end of 2025" and "Don’t check any boxes for your spouse if your filing
        status is head of household"); a single or qualifying surviving spouse return has no spouse whose boxes it checks.
        The worksheet's "number of boxes checked" times the amount is written as the sum of the amount for each box checked
        (no atom makes a count from yes/no answers on a return-level form); the two are equal.
      cite:
        doc: i1040gi
        locator: 'p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Check any boxes that apply";
          p. 33, Line 12d, "Don’t check any boxes for your spouse if your filing status is head of household"'
      status: Owner decision D6(c), Stage 16 (T-053); the timing of blindness and the statuses with spouse boxes are the agent's
        reading, for the owner's review.
    - id: amb.2025.alimony_screen
      text_at_issue: 'Form 1040 instructions, Lines 2a and 2b and Line 19a: alimony under a divorce or separation agreement entered
        into on or before December 31, 2018 (and not changed to exclude it) is income to the recipient and deductible by the
        payer; "If you are including alimony payments from more than one divorce or separation agreement in your income, enter
        the total". Pub. 504 adds the recapture rule (Worksheet 1), the statement for more than one recipient and the rules
        for payments partly child support.'
      readings:
      - Compute lines 2a and 19a from the amounts received and paid under pre-2019 agreements, and refuse, by one screen,
        more than one agreement or recipient, a recapture of alimony, and payments of which part is child support.
      - Compute them for any number of agreements, as line 2a's total, refusing only the recapture.
      - Refuse alimony altogether.
      chosen: The first (s1.alimony, s1.alimony_unsupported; amounts under an agreement entered into after 2018, or after
        a change that expressly excludes them, are not asked, as the questions say, and are neither income nor deductible).
      reason: The owner's decision (Stage 16 decision batch, D2, with the screens of the premise map, R-ALI-1 and R-ALI-2).
        The statement listing the other agreements and recipients, and the recapture worksheet, are not prepared; a payment
        partly child support needs the Pub. 504 allocation rules.
      cite:
        doc: p504
        locator: p. 12, Alimony, "If you paid alimony to more than one person, enter the SSN or ITIN of one of the recipients";
          p. 16, Recapture of Alimony; p. 13, Underpayment
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.s1_unnumbered_lines
      text_at_issue: 'Schedule 1 line 2b ("Date of original divorce or separation agreement"), line 19b ("Recipient''s SSN")
        and line 19c (the date again) are not amounts; the project has no text or date values for them.'
      readings:
      - Ask nothing and show a notice on the values sheet that the filer writes them on the form.
      - Ask them and show them on the values sheet.
      chosen: The first (s1.line2b_notice, s1.line19b_notice, s1.line19c_notice, shown when line 2a or line 19a is more than
        zero).
      reason: The owner's decision (Stage 16 decision batch, D12). No amount depends on them.
      cite:
        doc: i1040gi
        locator: p. 89, Line 2b, "enter the month and year of your original divorce or separation agreement"; p. 95, Line
          19c, "On line 19c, enter the month and year of your original divorce or separation agreement"
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.ewp_oid
      text_at_issue: 'Form 1040 instructions, Line 18: "The Form 1099-INT or Form 1099-OID you received will show the amount
        of any penalty you were charged." The Schedule B screen (sb.unsupported) refuses only original issue discount not
        reported on a Form 1099-OID, so a penalty on a Form 1099-OID passes it.'
      readings:
      - One penalty input per interest payer that takes the penalty from either form (Form 1099-INT box 2, or the penalty
        shown on Form 1099-OID).
      - A Form 1099-INT box 2 input per payer, and a screen refusing a penalty reported on Form 1099-OID.
      chosen: The first (interest.penalty, totaled on s1.line18 and copied to Form 8960 line 10).
      reason: The owner's decision (Stage 16 decision batch, D2, as corrected by the verification, E4) allows an input or
        a screen; the instruction treats the two forms alike, so an input loses nothing. Form 1099-OID is not archived, so
        its box number is not named.
      cite:
        doc: i1040gi
        locator: p. 95, Line 18, "The Form 1099-INT or Form 1099-OID you received will show the amount of any penalty you
          were charged"
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.cod_fully_taxable
      text_at_issue: 'Form 1040 instructions, Line 8c: "Canceled debt may be shown in box 2 of Form 1099-C. However, part or
        all of your income from cancellation of debt may be nontaxable. See Pub. 4681". Pub. 4681 lists exceptions (gifts,
        student loans, deductible debt, price reductions) and exclusions (bankruptcy, insolvency and others, Form 982), and
        treats foreclosures, repossessions and abandonments separately.'
      readings:
      - Compute line 8c only for canceled nonbusiness debt that is fully taxable, refusing by one screen every exception
        or exclusion, business, rental or farm debt, foreclosures, repossessions and abandonments, deductible interest,
        nonrecourse debt and debt owed jointly with someone other than the spouse on the return.
      - Also compute an excepted student loan as not income (the premise map's R-COD-3).
      chosen: The first (s1.cod_amount, s1.cod_unsupported). Student loans are refused with the other exceptions.
      reason: The owner's decision (Stage 16 decision batch, D2, "fully taxable canceled nonbusiness debt"). An excepted
        student loan discharge is nontaxable and usually comes with no Form 1099-C (p. 3, TIP), so a filer who reports one
        is refused rather than told how much of it to include; the conservative choice where D2 is silent.
      cite:
        doc: p4681
        locator: p. 3, General Rules, "There are several exceptions and exclusions that may result in part or all of a canceled
          debt being nontaxable"; p. 4, Exceptions
      status: Owner decision, Stage 16 (T-053); the student loan refusal is the encoding's choice, for the owner.
    - id: amb.2025.hsa_partial_exception
      text_at_issue: 'Form 8889 instructions, Lines 17a and 17b: "If any of the exceptions apply to any of the distributions
        included on line 16, check the box on line 17a. Enter on line 17b only 20% (0.20) of any amount included on line 16
        that does not meet any of the exceptions." When only part of line 16 is excepted (for example, the account beneficiary
        turned 65 during the year), the part subject to the tax depends on when each distribution was made.'
      readings:
      - The line 17a box as a question, and when it is checked, an input for the part of line 16 subject to the tax (at
        most line 16).
      - Refuse a partial exception.
      chosen: The first (f8889.line17a, f8889.subject_part).
      reason: The owner's decision (Stage 16 decision batch, D13). With the box unchecked all of line 16 is subject to the
        tax; with it checked and nothing subject, line 17b is zero.
      cite:
        doc: i8889
        locator: p. 9, Exceptions to the Additional 20% Tax, "Enter on line 17b only 20% (0.20) of any amount included on
          line 16 that does not meet any of the exceptions"
    - id: amb.2025.ira_both_kinds
      text_at_issue: 'i1040gi p. 95, Line 20, item 2: "If you are filing a joint return and you or your spouse made contributions
        to both a traditional IRA and a Roth IRA for 2025, don’t use the IRA Deduction Worksheet in these instructions."'
      readings:
      - Refuse a joint return with any traditional and any Roth contribution for 2025 between the spouses (you traditional and
        your spouse Roth included).
      - Refuse only when one spouse contributed to both kinds.
      chosen: The first (ira.both_kinds).
      reason: The owner's decision (Stage 16 decision 8). The Kay Bailey Hutchison limit reduces one spouse's limit by Roth
        contributions made for the other spouse (p590a p. 10), so the cross case can matter; the broad reading is the one that
        cannot leave a return the worksheet does not serve.
      cite:
        doc: i1040gi
        locator: 'p. 95, Line 20, "If you are filing a joint return and you or your spouse made contributions to both a traditional
          IRA and a Roth IRA for 2025, don’t use the IRA Deduction Worksheet in these instructions"'
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.ira_age50
      text_at_issue: 'The IRA Deduction Worksheet uses "age 50 or older at the end of 2025" for the applicable amount, the line
        7 rate and the caution below line 10; it gives no birth-date rule.'
      readings:
      - Ask each person directly whether they were age 50 or older at the end of 2025 (person.ira_age50).
      - Derive it from a birth-date cut (born before January 1, 1976, or before January 2, 1976 under the day-before rule
        Pub. 501 states for age 65).
      chosen: The first.
      reason: The owner's decision (Stage 16 decision 9(a)). The archived text states the day-before rule only for age 65 and
        the standard deduction; asking the age at the end of 2025 is the worksheet's own wording, as person.simple_age is for
        the SIMPLE catch-up.
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, "$8,000 if age 50 or older at the end of 2025"'
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.ira_covered
      text_at_issue: 'i1040gi p. 96: "The “Retirement plan” box in box 13 of your Form W-2 should be checked if you were covered
        by a plan at work even if you weren’t vested in the plan. You are also covered by a plan if you were self-employed and
        had a SEP, SIMPLE, or qualified retirement plan." Pub. 590-A p. 12 adds plan-year rules and exceptions (reservists,
        volunteer firefighters) that box 13 alone does not settle.'
      readings:
      - One question per person whether they were covered by a retirement plan at work, with W-2 box 13 named in its help
        (person.ira_work_plan), together with the self-employed person's own SEP or SIMPLE plan already asked (person.plan,
        read only with a Schedule C).
      - A box 13 input on each Form W-2, with a question for coverage not shown on a W-2.
      chosen: The first (person.ira_cov).
      reason: The owner's decision (Stage 16 decision 9(b)). A self-employed person's own qualified plan other than a SEP or
        SIMPLE (such as a solo 401(k)) is refused by scope.schedule1, so person.plan covers the self-employed plans this tool
        computes.
      cite:
        doc: i1040gi
        locator: 'p. 96, Were You Covered by a Retirement Plan?, "The “Retirement plan” box in box 13 of your Form W-2 should
          be checked if you were covered by a plan at work even if you weren’t vested in the plan"'
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.ira_se_floor
      text_at_issue: 'IRA Deduction Worksheet line 9: "Enter the earned income you (and your spouse if filing jointly) received
        as a self-employed individual or a partner ... minus any deductions on Schedule 1, lines 15 and 16. If zero or less,
        enter -0-." Pub. 590-A p. 7: "If you have a net loss from self-employment, don’t subtract the loss from your salaries
        or wages when figuring your total compensation."'
      readings:
      - Floor each person's self-employment earned income at zero, then add the two (person.ira_se, ira.line9).
      - Add the spouses' amounts and floor the total, as the worksheet prints it.
      chosen: The first.
      reason: The owner's decision (Stage 16 decision 9(c)). Pub. 590-A treats a self-employment loss as not reducing wages;
        the readings differ only on a joint return where one spouse has a self-employment loss and the other a profit.
      cite:
        doc: p590a
        locator: 'p. 7, Self-employment loss, "If you have a net loss from self-employment, don’t subtract the loss from your salaries
          or wages when figuring your total compensation"'
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.ira_se_earned
      text_at_issue: 'IRA Deduction Worksheet line 9: "Generally, this is your (and your spouse’s if filing jointly) net earnings
        from self-employment if your personal services were a material income-producing factor, minus any deductions on
        Schedule 1, lines 15 and 16." Pub. 590-A pp. 6-7: "compensation is the net earnings from your trade or business (provided
        your personal services are a material income-producing factor) reduced by" the plan deduction and the deductible part
        of self-employment tax.'
      readings:
      - The person's Schedule C net profit or loss (person.sc_total), less that person's Schedule 1 lines 15 and 16, with
        personal services taken as a material income-producing factor.
      - Schedule SE net earnings from self-employment (line 6, 92.35% of the profit), less lines 15 and 16.
      - Ask whether personal services were a material income-producing factor, and refuse when not.
      chosen: The first.
      reason: Pub. 590-A names the net earnings "from your trade or business" reduced by the two deductions, which is the net
        profit; the 92.35% figure would reduce the profit for the tax twice. A Schedule C business whose income comes mainly
        from capital rather than the owner's services is not screened (an open question for the owner).
      cite:
        doc: p590a
        locator: 'p. 6, What Is Compensation?, "If you are self-employed (a sole proprietor or a partner), compensation is the
          net"; p. 7, "earnings from your trade or business (provided your personal services are a material income-producing
          factor) reduced by the total of"'
      status: Authoring reading, Stage 16 (T-053); for the owner.
    - id: amb.2025.ira_ssb_copy
      text_at_issue: 'The Social Security Benefits Worksheet line 6 reads Schedule 1 line 20 (i1040gi p. 32, "Enter the total
        of the amounts from Schedule 1, lines 11 through 20, and 23 and 25"), and the IRA Deduction Worksheet line 3 reads Form
        1040 line 9, which includes the taxable benefits (p. 97). The instructions route every case in which both are figured
        to Pub. 590-A (p. 31, Exception) or skip lines 2 through 6 of the IRA worksheet (p. 97), but the line graph has a cycle
        the build rejects.'
      readings:
      - The Social Security Benefits Worksheet reads its own copy of line 20 figured on the no-coverage path (the smallest of
        the applicable amount, line 10 and line 11 for each person, person.ira_ssb), which equals line 20 on every return the
        worksheet serves; the copy refuses when someone is covered and there are traditional contributions (the p. 31
        exception), and ssb.pub915 keeps its own question.
      - IRA worksheet line 3 reads Form 1040 line 9 without the taxable benefits.
      - Derive the p. 31 refusal from the contribution and coverage answers instead of ssb.pub915.
      chosen: The first (ssb.ira_line20, person.ira_ssb, ira.cov_gate).
      reason: The owner's decision (Stage 16 decision 7). The IRA worksheet stays a literal transcription, and the special
        case sits where the instructions carve the exception, in the social security worksheet's own list. The copy's refusal
        fires only on a return that ssb.pub915 already refuses when answered as the instructions require.
      cite:
        doc: i1040gi
        locator: 'p. 31, Lines 6a and 6b, Exception; p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, "If you checked “No”
          on line 1a (and “No” on line 1b if married filing jointly), skip lines 2 through 6"'
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.ira_line7_cents
      text_at_issue: 'IRA Deduction Worksheet line 7: "Multiply lines 6a and 6b by the percentage below that applies to you.
        If the result isn’t a multiple of $10, increase it to the next multiple of $10 (for example, increase $490.30 to $500)."
        Line 6 can carry cents, and the product can then have a fraction of a cent.'
      readings:
      - Round the product half-up to the cent (multiply_rate, amb.2025.multiplication_subcent), then increase it to the next
        multiple of $10.
      - Increase the exact product to the next multiple of $10.
      chosen: The first.
      reason: The project's rule for products (amb.2025.multiplication_subcent). The readings differ only when the exact product
        is less than half a cent above a multiple of $10.
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "If the result isn’t a multiple of $10, increase it to the
          next multiple of $10 (for example, increase $490.30 to $500)"'
      status: Authoring reading, Stage 16 (T-053).
    - id: amb.2025.ira_deduct_less
      text_at_issue: 'IRA Deduction Worksheet line 12: "This is the most you can deduct. ... Or, if you want, you can deduct
        a smaller amount and treat the rest as a nondeductible contribution (see Form 8606)."'
      readings:
      - Compute the most you can deduct and refuse the election to deduct less (ira.deduct_less).
      - Take an input for the amount you choose to deduct.
      chosen: The first.
      reason: The owner's decision (Stage 16 decision 8). An input with no default would be asked of every filer with a
        deduction; the election is rare.
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 12, "Or, if you want, you can deduct a smaller amount and treat
          the rest as a nondeductible contribution (see Form 8606)"'
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.ira_fellowship
      text_at_issue: 'Pub. 590-A p. 6: "certain non-tuition fellowship and stipend payments not reported to you on Form W-2 are
        treated as taxable compensation for IRA purposes." IRA Deduction Worksheet line 8 lists wages, alimony and combat pay
        only.'
      readings:
      - Refuse the IRA deduction when such payments exist (ira.special, with box 11 and code Z amounts, reservist repayments
        and difficulty of care payments).
      - Add them to line 8.
      - Follow the worksheet and leave them out.
      chosen: The first.
      reason: The owner's decision (Stage 16 decision 8). The worksheet and the publication disagree; refusing cannot be
        wrong. Box 11 and code Z amounts are refused rather than taken as W-2 inputs, by the same decision.
      cite:
        doc: p590a
        locator: 'p. 6, What Is Compensation?, "certain non-tuition fellowship and stipend payments not reported to you on Form
          W-2 are treated as taxable compensation for IRA purposes"'
      status: Owner decision, Stage 16 (T-053).
    - id: amb.2025.savers_traditional
      text_at_issue: 'Form 8880 line 1: "Traditional and Roth IRA contributions, and ABLE account contributions by the designated
        beneficiary for 2025. Do not include rollover contributions."'
      readings:
      - Count every traditional IRA contribution for 2025, deductible or not (IRA Deduction Worksheet line 11), with the Roth
        contributions.
      - Count only the deductible part.
      chosen: The first (person.sav_line1 adds person.ira_contrib).
      reason: The owner's decision (Stage 16 decision 10). The line names traditional IRA contributions without limiting them
        to the deductible ones. Excess or recharacterized contributions, traditional or Roth, are refused by one screen per
        person (person.ira_excess), which also answers Stage 15 owner question 4.
      cite:
        doc: f8880
        locator: 'Form 8880 (2025), line 1, "Traditional and Roth IRA contributions"'
      status: Owner decision, Stage 16 (T-053).
