      prompt: 'For this person (you, or your spouse on a joint return) — you and your spouse each have an HSA and family coverage. Do you divide the family contribution limit equally (equal), or by a different allocation you both agree on, such as allocating nothing to one spouse (agreed)? Use the same answer on both Forms 8889.'
      help: The family limit is figured on each Form 8889 for the months treated as having family coverage (Step 1 of the
        line 6 instructions).
      order: 10
      cite:
        doc: i8889
        locator: 'p. 7, Line 6, Steps 1 and 2'
    - input: f8889.allocated
      prompt: 'For this person (you, or your spouse on a joint return) — the part of the family contribution limit (Step 1) allocated to this person under the allocation you agreed on. The two parts together may not be more than the limit.'
