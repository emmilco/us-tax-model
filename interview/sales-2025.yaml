interview:
  tax_year: 2025
  targets:
    - f1040.line7a
    - f1040.line16
  initial: {}
  cite:
    doc: f8949
    locator: Parts I and II, transaction rows
  questions:
    - input: $sales
      prompt: List stable transaction keys for all sales, including transactions intended for aggregate
        reporting. Use [] only if there are no sales.
      help: Enter a JSON array of distinct keys. Enter each transaction once; the route selects Form 8949
        or Schedule D aggregate reporting.
      order: 1
      cite:
        doc: f8949
        locator: Parts I and II, transaction rows
    - input: sales.box
      prompt: "Classification from records: A/B/C short-term, D/E/F long-term; G–L digital assets"
      help: "Use records and the broker report: A/D basis reported, B/E basis not reported, C/F no 1099-B.
        A–C short-term, D–F long-term. Generally more than one year is long-term; inherited property
        has special rules. Holding periods are not calculated here."
      order: 2
      cite:
        doc: i8949
        locator: pp. 2–5, holding period and checkbox classifications
    - input: sales.route
      prompt: Report this transaction in detail on Form 8949 or directly in Schedule D aggregate totals
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 5
      cite:
        doc: i1040sd
        locator: p. 10, lines 1a and 8a
    - input: sales.code
      prompt: "Adjustment codes: none, B, W, BW; choose other for any additional code"
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 4
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - input: sales.special
      prompt: Does this sale involve collectibles, section 1202 stock, or section 1250 property?
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 3
      cite:
        doc: i1040sd
        locator: pp. 11–12, lines 18 and 19
    - input: sales.aggregate_eligible
      prompt: "Confirm all aggregate conditions: basis reported, no broker adjustments, no Ordinary box,
        no QOF disposition/deferral, no corrections, no collectibles"
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: i1040sd
        locator: p. 10, lines 1a and 8a
    - input: sales.proceeds
      prompt: "Column (d): proceeds per broker report, or net proceeds if no report"
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: i8949
        locator: p. 6, column (d)
    - input: sales.reported_basis
      prompt: Basis shown on broker report
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - input: sales.correct_basis
      prompt: Correct adjusted basis from records
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - input: sales.wash_loss
      prompt: Correct nondeductible wash-sale loss; positive cents, including losses not reported by broker
      help: Enter correct disallowed loss in integer cents. Wash sales are not detected automatically. If
        correcting a broker amount downward, attach the explanation required by code W.
      order: 10
      cite:
        doc: i8949
        locator: p. 10, code W; a lower corrected loss requires an explanation statement
    - input: sd.other_forms
      prompt: Are there gains/losses from Forms 4797, 2439, 6252, 4684, 6781, 8824 or Schedule K-1?
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: f1040sd
        locator: Schedule D (2025), Parts I–III
    - input: sd.carryover
      prompt: Is there a capital loss carryover from the prior year?
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: f1040sd
        locator: Schedule D (2025), Parts I–III
    - input: sd.distributions
      prompt: Capital gain distributions, generally Form 1099-DIV box 2a
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: i1040sd
        locator: p. 11, line 13
    - input: f1040.status
      prompt: Form 1040, Filing Status checkboxes
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: f1040
        locator: Form 1040, Filing Status
    - input: f1040.line3a
      prompt: Form 1040 line 3a total qualified dividends, generally Form 1099-DIV box 1b, after the line
        3a exceptions. Supplied as a subtotal; qualification checks are outside this stage.
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: i1040gi
        locator: Instructions for Form 1040, pp. 25–26, line 3a and exceptions
    - input: f1040.line15
      prompt: Form 1040 line 15; in Stage 1 supplied as an input (the lines that figure it are outside
        this stage).
      help: Money is integer cents; enter true/false for questions and one of the stated values for
        classifications. Unknown answers may be null; they never become zero.
      order: 10
      cite:
        doc: i1040gi
        locator: Instructions for Form 1040, line 15
    - input: f4952.line1
      prompt: Investment interest paid or accrued in 2025
      help: Money is integer cents; answer true/false for screening questions. Unknown may be null.
      order: 10
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - input: f4952.carryover
      prompt: Any prior-year disallowed investment interest carryover?
      help: Money is integer cents; answer true/false for screening questions. Unknown may be null.
      order: 10
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - input: f4952.unsupported
      prompt: Interest attributable to royalties, a business, passive activities, tax-exempt income, or
        at-risk limitations; other unsupported investment income or expenses?
      help: Money is integer cents; answer true/false for screening questions. Unknown may be null.
      order: 10
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - input: f4952.alternative_allocation
      prompt: Elect an alternative allocation of Form 4952 line 4g to qualified dividends instead of
        capital gains first?
      help: Money is integer cents; answer true/false for screening questions. Unknown may be null.
      order: 10
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - input: f4952.line4g
      prompt: Amount of qualified dividends and net capital gain elected into investment income
      help: Enter integer cents. Elected income loses preferential rates. Once made, the election can be
        revoked only with IRS consent; this tool does not make it automatically.
      order: 10
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - input: interest.amount
      prompt: Taxable interest from this payer, including Treasury interest; exclude tax-exempt interest
      help: Money is integer cents. Answer true/false to screening questions. Unknown may be null.
      order: 10
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - input: sb.unsupported
      prompt: Any nominee income, original issue discount, accrued interest adjustment, bond premium,
        seller-financed mortgage interest, savings-bond exclusion, foreign corporation reporting, or
        other special treatment?
      help: Money is integer cents. Answer true/false to screening questions. Unknown may be null.
      order: 10
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - input: sb.ordinary_dividends
      prompt: Total ordinary dividends, Form 1099-DIV box 1a
      help: Money is integer cents. Answer true/false to screening questions. Unknown may be null.
      order: 10
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - input: sb.line7a
      prompt: Any financial interest in or signature authority over a foreign financial account during
        2025?
      help: Money is integer cents. Answer true/false to screening questions. Unknown may be null.
      order: 10
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - input: sb.fbar_required
      prompt: Are you required to file FinCEN Form 114 (FBAR)? Determine under its instructions; this tool
        does not determine foreign account values or exceptions.
      help: Money is integer cents. Answer true/false to screening questions. Unknown may be null.
      order: 10
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - input: sb.form8938
      prompt: Are you required to file Form 8938 for specified foreign financial assets?
      help: Money is integer cents. Answer true/false to screening questions. Unknown may be null.
      order: 10
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - input: sb.line8
      prompt: Received a distribution from, or were grantor of or transferor to, a foreign trust during
        2025?
      help: Money is integer cents. Answer true/false to screening questions. Unknown may be null.
      order: 10
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - input: $interest
      prompt: List stable keys for taxable interest payers. Use [] when there are none.
      help: Enter a JSON array of distinct keys. Include all taxable interest payers.
      order: 8
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - input: div.box2b
      prompt: Unrecaptured section 1250 gain, box 2b
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box2c
      prompt: Section 1202 gain, box 2c
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box2d
      prompt: Collectibles (28%) gain, box 2d
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box2e
      prompt: Section 897 ordinary dividends, box 2e
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box2f
      prompt: Section 897 capital gain, box 2f
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box3
      prompt: Nondividend distributions/return of capital, box 3
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box4
      prompt: Federal income tax withheld, box 4
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box6
      prompt: Investment expenses already included in box 1a, box 6
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box9
      prompt: Cash liquidation distributions, box 9
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box10
      prompt: Noncash liquidation distributions, box 10
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box12
      prompt: Exempt-interest dividends, box 12
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.box13
      prompt: Specified private activity bond interest dividends, box 13
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.basis_reconciled
      prompt: For box 3, have basis reductions been applied to records with no distribution exceeding
        basis?
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: div.fatca
      prompt: Is the FATCA reporting checkbox checked? Review Form 8938 requirements separately.
      help: Enter combined 1099-DIV box amounts in integer cents. Use true/false for questions. Unknown
        may be null.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - input: qbi.dividends
      prompt: Qualified section 199A dividends from Form 1099-DIV box 5 after confirming eligibility
      help: Integer cents; this amount is part of ordinary dividends, not an additional amount.
      order: 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1a, 1b and 5
