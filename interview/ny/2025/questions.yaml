# The New York question bank (decision C5), asked after the federal interview: orders from 1000, above every federal
# question, except questions asked where their subject lives: care (155), the New York 529 account (180) and
# tax-free interest from other states' bonds (272). Six topics, in the order of a
# life: where you lived (1000), income as New York counts it (1010), deductions (1020), credits and other taxes (1030),
# things you bought (1040), tax already paid and your refund (1050). A question is asked only where the federal answers
# leave it open (docs/provisional/lanes/ny.md). A New York refusal stops only the New York profile
# (interview/ny/2025/ny.yaml); the federal profiles are unchanged.
bank:
  tax_year: 2025
  frames:
    ny_it2: 'For this Form W-2 (Form IT-2, W-2 record) — '
  groups:
  - id: ny_where
    heading: Did any of these apply to you (or, on a joint return, your spouse)?
  - id: ny_interest
    heading: Did any of your (or, on a joint return, your spouse's) interest or dividends come from these?
  - id: ny_filing
    heading: Do any of these apply to you (or, on a joint return, your spouse)?
  questions:
  # ---- 1000 Where you lived
  - input: ny_it201.ask.city_resident
    order: 1000
    seq: 10
    prompt: Did you live in New York City (the Bronx, Brooklyn, Manhattan, Queens or Staten Island) for all of 2025?
    help: Count time away on vacation, for work or at school if your home stayed in the city. A college dorm does not count
      as a home. This tool prepares the New York return only for someone who lived in the city all year.
  - input: ny_it201.ask.state_resident
    order: 1000
    seq: 20
    prompt: Did you live in New York State for all of 2025?
    help: New York State was your home if it was your permanent home all year, or if you kept a place to live there for
      nearly all of the year and spent 184 days or more in the state. Either answer ends the New York part here; the
      answer decides which New York form you need.
  - input: ny_it201.ask.spouse_resident
    order: 1000
    seq: 30
    prompt: Did your husband or wife also live in New York City for all of 2025?
    help: When one spouse lived elsewhere for part of the year, New York requires separate returns or a joint return
      taxing both as residents, which this tool does not prepare.
  - input: ny_it201.ask.spouse_cannot_sign
    order: 1000
    seq: 31
    prompt: Is your husband or wife unable or unwilling to sign a joint New York return, because you do not know where they
      are or because they refuse to sign it?
    help: New York then allows a separate return in some cases, which this tool does not prepare; a Yes ends the New York
      part here.
  - input: ny_it201.ask.yonkers
    order: 1000
    seq: 40
    group: ny_where
    tick: Lived or worked in Yonkers, or had a place there, in 2025
    prompt: At any time in 2025, did you (or, on a joint return, your spouse) live or work in Yonkers, or have a place to
      live there, even one an employer or relative kept for you?
    help: Count a place you could use, whether or not you stayed in it. Yonkers has its own income tax, which this tool
      does not compute. A Yes ends the New York part here.
  - input: ny_it201.ask.moved_in
    order: 1000
    seq: 41
    group: ny_where
    tick: Moved into New York City on January 1, 2025
    help: Moving in on the first day of the year can bring income earned before the move into the 2025 New York return.
  - input: ny_it201.ask.moved_out
    order: 1000
    seq: 42
    group: ny_where
    tick: Moved out of New York City on January 1, 2026
    help: Moving out on the first day of 2026 can bring income not yet paid into the 2025 New York return.
  - input: ny_it201.ask.active_duty
    order: 1000
    seq: 45
    help: Asked because you said you (or your spouse) served in the armed forces, or because you are married and not filing
      jointly. A servicemember's husband or wife may choose another state of residence for tax; military residence rules
      are outside this tool, so a Yes ends the New York part here.
  - input: ny_it201.ask.special_accrual
    order: 1000
    seq: 50
    prompt: Did you (or, on a joint return, your spouse) have income fixed in one year but reported federally in another, such as a 2025 bonus paid in 2026, or deferred pay or an installment-sale gain from before 2025?
    help: With a move at the turn of the year, such income falls under New York's special accrual rules, which this tool
      does not apply. A Yes ends the New York part here.
  - input: ny_it201.ask.decedent
    order: 1000
    seq: 60
    prompt: Is this return for someone who has died?
    help: Answer Yes if you are filing for a person who died in 2025 or since, including a husband or wife on this joint
      return. Such a return is outside this tool.
  - input: ny_it201.ask.item_c
    order: 1000
    seq: 70
    prompt: You said no one can claim you (or, on a joint return, your spouse) as a dependent. Could a parent or someone else
      claim you if they filed a return, even one they do not have to file?
    help: New York counts you as someone's dependent even when that person does not file or did not claim you. A Yes gives
      a smaller New York standard deduction to a single filer and no household credit.
  # ---- 1010 Income as New York counts it
  - input: ny_it201.ask.public_job
    order: 1010
    seq: 10
    help: Count the State, a city, county, town or village, a school district, SUNY or CUNY, and public bodies such as the
      MTA, a public hospital or library, or a fire district. A federal job does not count here.
  - input: ny_it201.ask.414h
    order: 1010
    seq: 11
    prompt: Does a Form W-2 from that job show a 414(h) retirement contribution (usually in box 14)?
    help: 'New York adds back 414(h) contributions to these retirement systems: the New York State and Local Employees'' or
      Police and Fire Retirement System, the State Teachers'' Retirement System, the SUNY or CUNY Optional Retirement
      Program, the New York City Employees'', Teachers'' or Board of Education Retirement System, the City Police or Fire
      Pension Fund, and the MABSTOA Pension Plan. Contributions to a 401(k), 403(b) or 457 plan do not count. This tool
      does not compute the addition; a Yes ends the New York part here.'
  - input: ny_it201.ask.nyc_flex
    order: 1010
    seq: 12
    prompt: Does a Form W-2 you (or, on a joint return, your spouse) got from New York City or another New York City public
      employer, such as CUNY, the city schools, NYC Transit or the Housing Authority, show pay set aside for a flexible
      benefits plan?
    help: It may be listed in box 14, for example as IRC 125. New York adds it back to income, which this tool does not
      compute; a Yes ends the New York part here.
  - input: ny_it201.ask.us_obligation_interest
    order: 1010
    seq: 20
    group: ny_interest
    tick: U.S. government bonds, notes or bills, or a fund holding them
    prompt: Was any of your (or, on a joint return, your spouse's) interest or dividends from U.S. government obligations, such
      as Treasury bills, notes or bonds, savings bonds, bonds of a U.S. government agency, or a fund that holds them?
    help: Such interest is often in box 3 of a Form 1099-INT. New York does not tax it, but this tool does not compute the
      subtraction, so a Yes ends the New York part here rather than overstate your tax.
  - input: ny_it201.ask.bab
    order: 1010
    seq: 21
    group: ny_interest
    tick: Build America Bonds
    help: Build America Bonds are taxable bonds issued by states and cities in 2009 and 2010. Their interest changes the
      income New York uses for its household credits, which this tool does not handle.
  # ---- asked where its subject lives: after the federal tax-exempt interest and dividend questions
  - input: ny_it201.ask.out_of_state_bond_interest
    order: 272
    seq: 30
    prompt: Did any of your (or, on a joint return, your spouse's) tax-free interest or dividends come from bonds issued outside
      New York, or from a fund that holds them?
    help: National tax-free bond funds hold other states' bonds; part of a New York fund may too (see its year-end statement). Bonds of New York, its cities and agencies, or a U.S. territory are No. A Yes ends the New York part here.
  - input: ny_it201.ask.gov_pension
    order: 1010
    seq: 30
    prompt: Was any of your (or, on a joint return, your spouse's) pension or retirement money from the federal government, the
      military, or a New York State or local government job?
    help: Count a pension received as a beneficiary or a former spouse, and a refund of your own contributions. New York
      does not tax these pensions; this tool does not compute the subtraction, so a Yes ends the New York part here.
  - input: ny_it201.ask.gov_pension_other
    order: 1010
    seq: 31
    prompt: Was any of it from the MTA, MABSTOA, the Long Island Rail Road, a SUNY, CUNY or State Education Department plan
      (such as TIAA), or the government of a U.S. territory (such as Puerto Rico or Guam) or of Washington, D.C.?
    help: These public plans count as government pensions in New York.
  - input: ny_it201.ask.pension_exclusion
    order: 1010
    seq: 32
    prompt: Did you (or, on a joint return, your spouse) turn 59½ by December 31, 2025, or receive any of that pension or IRA
      money as the beneficiary of someone who died?
    help: New York excludes up to $20,000 of such income for a person 59½ or older, which this tool does not compute.
  - input: ny_it201.ask.ny_529
    order: 180
    seq: 40
    help: Count an account you closed, or moved to another state's plan, during 2025. A 529 plan of another state, or an account
      someone else owns for you, counts as No.
  - input: ny_it201.ask.529_nonqualified
    order: 180
    seq: 41
    prompt: In 2025, did you (or, on a joint return, your spouse) take money out of that New York 529 account for anything but college, career training or student
      loans? School tuition before college and a move to another state's plan count.
    help: "Career training is No only if paid from July 4, 2025, to an eligible school; loans, only the student's or a sibling's. No too: a Roth IRA or ABLE rollover, the student's death or disability, or a move between family members' New York accounts."
  - input: ny_it201.ask.529_owner
    order: 180
    seq: 42
    prompt: In 2025, did you (or, on a joint return, your spouse) put money into that New York 529 account, or take any out?
    help: New York lets an account owner deduct up to $5,000 of contributions ($10,000 on a joint return); this tool does not
      compute it, so a Yes ends the New York part here.
  - input: ny_it201.ask.inflation_check
    order: 1010
    seq: 50
    prompt: Did you (or, on a joint return, your spouse) include a New York State inflation refund check in your federal
      income, as a state tax refund or as other income?
    help: New York mailed inflation refund checks in the fall of 2025. Whether New York subtracts them is unsettled for 2025,
      so a Yes ends the New York part here.
  - input: ny_it201.ask.railroad_uc
    order: 1010
    seq: 52
    prompt: Were any of your (or, on a joint return, your spouse's) unemployment benefits paid by the Railroad Retirement
      Board?
    help: Railroad unemployment benefits are paid by the U.S. Railroad Retirement Board, not by New York State. New York does
      not tax them; this tool does not compute that subtraction, so a Yes ends the New York part here.
  - input: ny_it201.ask.prior_168k
    order: 1010
    seq: 55
    prompt: Since June 2003, have you (or, on a joint return, your spouse) taken bonus depreciation on business or rental
      property you still had in 2025?
    help: Bonus depreciation deducts much or all of a cost in the first year (an earlier Form 4562, line 14 or 25); count
      property deducted in full. Leave out property placed in service before June 1, 2003, and resurgence zone or New York
      Liberty Zone property. New York spreads the rest over years (Form IT-398), which this tool does not compute; a Yes
      ends the New York part here.
  - input: ny_it201.ask.suv_carryover
    order: 1010
    seq: 57
    prompt: Did any of the section 179 deduction you (or, on a joint return, your spouse) carried over from an earlier year come from expensing an SUV over 6,000
      pounds?
    help: Count any passenger vehicle rated over 6,000 pounds gross vehicle weight that is not a truck, van or motor home,
      even one used only for business. If you are not sure which property the carryover is from, answer Yes when such a
      vehicle was among the property expensed in the year it arose. New York adds back a section 179 deduction taken on
      it, which this tool does not compute; a Yes ends the New York part here.
  - input: ny_it201.ask.it225
    order: 1010
    seq: 60
    prompt: Does any item on New York's list of less common income changes (Form IT-225) apply to you (or, on a joint
      return, your spouse)? Most people have none.
    help: 'For example: a business with employees and a profit under $250,000, through a partnership or S corporation
      or of your own (New York subtracts 15% of the profit), sickness benefits paid by the Railroad Retirement Board, moving
      expenses you paid or were repaid for by an employer, a disability income exclusion, a trust''s accumulation
      distribution, or Holocaust reparations or a wrongful-conviction award. This tool does not compute them; a Yes ends the
      New York part here.'
  # ---- 1020 Deductions
  - input: ny_it201.ask.itemize
    order: 1020
    seq: 10
    prompt: Do you want to itemize deductions on your New York return instead of taking the New York standard deduction?
    help: 'New York lets you choose either, whatever you did on your federal return. Itemizing helps only if your New York
      itemized deductions (the federal ones, without income taxes) are more than the standard deduction: $8,000 single,
      $16,050 married filing jointly, $11,200 head of household. This tool takes the standard deduction; a Yes ends the
      New York part here.'
  - input: ny_it201.ask.spouse_itemizes
    order: 1020
    seq: 20
    help: When married people file separately, both must itemize if either does.
  # ---- 1030 Credits and other taxes
  - input: ny_it201.ask.resident_credit
    order: 1030
    seq: 10
    prompt: In 2025, did you (or, on a joint return, your spouse) pay income tax to another state, or to a city or Canadian
      province outside New York?
    help: For example tax taken out of pay for New Jersey or Connecticut (another state in box 15 of a Form W-2), or tax
      paid to Washington, D.C. New York gives a credit for it, which this tool does not compute.
  - input: ny_it201.ask.college_tuition
    order: 1030
    seq: 20
    prompt: You said college tuition was paid in 2025. Did you (or, on a joint return, your spouse) pay any of it yourselves?
    help: New York has a college tuition credit (Form IT-272), which this tool does not compute.
  - input: ny_it201.ask.real_property_credit
    order: 1030
    seq: 30
    prompt: In 2025, did you (or, on a joint return, your spouse) pay rent averaging $450 a month or less, not counting heat, gas, electricity, furnishings or meals, or own real estate worth $85,000 or less in all?
    help: Leave out rent paid by a subsidy, such as Section 8. New York's real property tax credit (Form IT-214) also needs six months or more in the same New York home; this tool does not compute it.
  - input: ny_it201.ask.noncustodial
    order: 1030
    seq: 40
    prompt: Did you (or, on a joint return, your spouse) pay child support in 2025 through New York's child support program (a
      Support Collection Unit)?
    help: Such a parent may get a New York credit (Form IT-209), which this tool does not compute.
  - input: ny_it201.ask.city_credits
    order: 1030
    seq: 50
    prompt: Did your (or, on a joint return, your spouse's) business pay New York City unincorporated business tax for 2025?
    help: New York City gives a credit for part of that tax, which this tool does not compute.
  - input: ny_it201.ask.mctmt
    order: 1030
    seq: 60
    prompt: Did more than $50,000 of your (or, on a joint return, your spouse's) self-employment earnings come from business done
      in New York City or the nearby counties?
    help: The counties are Dutchess, Nassau, Orange, Putnam, Rockland, Suffolk and Westchester, and the $50,000 is counted
      for each person. Above it the metropolitan commuter transportation mobility tax applies, which this tool does not
      compute.
  - input: ny_it201.ask.other_credits
    order: 1030
    seq: 70
    prompt: Are you claiming any other New York State tax credit, such as for long-term care insurance, home solar equipment
      or a business?
    help: These credits are claimed on their own forms and Form IT-201-ATT. This tool computes only the household credits and
      the New York City school tax credit.
  - input: ny_it201.ask.other_taxes
    order: 1030
    seq: 80
    prompt: Do you (or, on a joint return, your spouse) owe any other New York tax, such as a tax on a lump-sum retirement
      payment or the payback of a New York credit taken earlier?
    help: Other New York taxes are reported on Form IT-201-ATT, which this tool does not prepare.
  # ---- 1040 Things you bought
  - input: ny_it201.ask.bought_untaxed
    order: 1040
    seq: 10
    prompt: In 2025, did you (or, on a joint return, your spouse) buy anything taxable in New York without paying New York sales tax, such as online or out of state?
    help: Count a purchase taxed below the combined state and local rate where you lived, and an untaxed purchase on an Indian reservation (unless Oneida Nation tax was paid). Leave out purchases of a business registered for sales tax. Purchases under $1,000 are charged from a chart.
  - input: ny_it201.ask.use_tax_dmv_only
    order: 1040
    seq: 15
    prompt: Was every such purchase a vehicle, boat, trailer or snowmobile whose tax you pay at the DMV when you register it?
    help: A Yes means no use tax is owed on this return. If you will not register it at the DMV, answer No.
  - input: ny_it201.ask.use_tax_st141
    order: 1040
    seq: 20
    prompt: Leaving out a vehicle or boat taxed at the DMV, did any one of those purchases cost $1,000 or more, or was any of
      them for a rental, royalties or a business not registered for sales tax?
    help: Then the tax must be worked out exactly on Form ST-141, which this tool does not do.
  - input: ny_it201.ask.use_tax_exact
    order: 1040
    seq: 30
    help: The exact amount is worked out on Form ST-141, which this tool does not do.
  - input: ny_it201.ask.abode_part_year
    order: 1040
    seq: 40
    prompt: Was there a month of 2025 in which you had a home in New York State for half the month or less?
    help: The chart amount is for a full year and is cut by months without a New York home, which this tool does not do. A
      month in which you had a New York home for more than half of it counts as a full month.
  # ---- 1050 Tax already paid, and your refund
  - input: ny_it201.ask.other_withholding
    order: 1050
    seq: 10
    prompt: Was New York income tax taken out of any retirement, unemployment or other payment (not pay on a Form W-2) to you
      (or, on a joint return, your spouse)?
    help: Look at the state and local boxes of your (or, on a joint return, your spouse's) Forms 1099-R, 1099-G and W-2G. This tool counts New York withholding
      from Forms W-2 only.
  - input: $ny_it2
    order: 1050
    seq: 20
    prompt: List your Forms W-2 again, one entry per form, so their New York boxes can be entered; include a W-2 that shows no
      New York tax.
    help: New York needs a record for each Form W-2 you received (Form IT-2). Naming them as you named your federal Forms W-2
      makes them easier to match. If you received a corrected Form W-2c, enter its corrected amounts.
  - input: ny_it2.state_withheld
    order: 1050
    seq: 30
    help: Box 17 of the Form W-2, the state income tax withheld, where box 15 shows NY; from a corrected Form W-2c, the
      corrected amount. Enter 0 if none.
  - input: ny_it2.city_withheld
    order: 1050
    seq: 40
    help: Box 19 of the Form W-2, the local income tax withheld, where box 20 shows New York City (NYC); from a corrected
      Form W-2c, the corrected amount. Enter 0 if none.
  - input: ny_it2.yonkers_withheld
    order: 1050
    seq: 50
    help: Box 19 of the Form W-2 where box 20 shows Yonkers; from a corrected Form W-2c, the corrected amount. Enter 0 if
      none; Yonkers tax is outside this tool.
  - input: ny_it201.ask.est_any
    order: 1050
    seq: 60
    help: Count estimated payments of State, City or commuter (MCTMT) tax (the last one may be paid in January 2026), a 2024
      New York refund you asked to have applied to 2025, and a payment made with a request for more time to file.
  - input: ny_it201.line75_amount
    order: 1050
    seq: 70
    prompt: How much in all? Count each 2025 New York estimated payment (including one made in January 2026), a 2024 refund
      applied to 2025, and any amount paid with a request for more time to file.
    help: Include State, City, Yonkers and commuter transportation tax payments, and estimated tax an estate or trust
      allocated to you; do not include New York City business tax payments.
  - input: ny_it201.ask.abroad
    order: 1050
    seq: 80
    group: ny_filing
    tick: Outside the U.S. on April 15, 2026, and filing later
    help: Being abroad on the due date gives two more months to file. Returns filed on that extra time are outside this
      tool.
  - input: ny_it201.ask.installment
    order: 1050
    seq: 81
    group: ny_filing
    tick: Will ask to pay what you owe in installments
    help: An installment agreement is requested with a code on the return, which this tool does not prepare.
  - input: ny_it201.ask.contributions
    order: 1050
    seq: 82
    group: ny_filing
    tick: Giving to a New York State charity fund on this return
    prompt: Do you want to give money to one of New York State's charity funds through this return?
    help: The funds are listed on Form IT-227. Gifts made this way are outside this tool.
  - input: ny_it201.ask.prior_full_year
    order: 1050
    seq: 90
    prompt: Did you file a New York return for 2024, as a resident, part-year resident or nonresident?
    help: 'You owe more than was paid in. New York charges no penalty for that if what you paid during 2025 was at least your
      2024 New York tax, which needs a 2024 return. Without one, a balance due ends the New York part here.'
  - input: ny_it201.ask.prior_year_tax
    order: 1050
    seq: 91
    prompt: What was the total New York State, City, Yonkers and commuter transportation (MCTMT) tax on your 2024 New York
      return, before payments and refundable credits?
    help: Leave out sales or use tax and gifts to New York funds. Used only to check for the penalty for paying too little
      during the year.
  - input: ny_it201.ask.prior_agi_high
    order: 1050
    seq: 92
    prompt: Was the New York adjusted gross income on your 2024 return more than $150,000?
    help: Above $150,000 ($75,000 married filing separately), what you paid during 2025 must reach 110% of your 2024 tax to
      avoid the penalty.
  - input: ny_it201.ask.est_late
    order: 1050
    seq: 95
    prompt: Was any 2025 New York estimated installment skipped, or any of your (or, on a joint return, your spouse's) 2025
      New York estimated payments made late or smaller than a quarter of what was due for the year?
    help: A penalty can apply for any quarter in which a payment was late or short, even when the year's total was enough.
  - input: ny_it201.ask.late_penalty
    order: 1050
    seq: 100
    prompt: Will you pay the New York tax you owe after April 15, 2026, or file this return after its due date?
    help: Late filing and late payment penalties and interest are outside this tool.
  - input: ny_it201.ask.apply_any
    order: 1050
    seq: 110
    help: Any part of a refund can be applied to your 2026 New York estimated tax instead.
  - input: ny_it201.line79_amount
    order: 1050
    seq: 120
    prompt: How much of your New York refund should be kept as a payment toward your 2026 New York tax?
    help: The rest is refunded to you.
  - input: ny_it201.ask.refund_529
    order: 1050
    seq: 130
    prompt: Do you want all or part of your New York refund put into a New York 529 college savings account?
    help: Depositing a refund into a 529 account (Form IT-195) is outside this tool.
  # ---- asked where its subject lives: after the federal alimony questions
  - input: ny_it201.ask.alimony_later
    order: 161
    seq: 14
    prompt: In 2025, did you (or, on a joint return, your spouse) pay or receive alimony under an agreement made after 2018,
      or under an earlier one changed after 2018 to say New York's alimony rules apply?
    help: Count every agreement, including a second one beside an older agreement. New York's rules are those of Tax Law
      section 612(w). Unlike the federal return, New York taxes such alimony and lets the payer subtract it, which this tool
      does not compute; a Yes ends the New York part here.
  # ---- asked where its subject lives: after the federal care questions
  - input: ny_it201.ask.dependent_care
    order: 155
    seq: 5
    prompt: New York has its own credit for care costs. Would the care you paid for qualify for the federal child and dependent
      care credit, whether or not you claimed it?
    help: New York's credit (Form IT-216) is not computed by this tool, so a Yes ends the New York part here.
