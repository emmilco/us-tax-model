  - input: f5695.line1
    order: 25
    help: |-
      Zero if none.

      A cost counts in 2025 when the original installation is completed.

      Include labor for onsite preparation, assembly or original installation and for piping or wiring to connect the property to the home.

      Reduce the cost:
      - by any subsidy from a public utility for buying or installing the property that was not included in your income (also when a contractor received it for you)
      - by any rebate:
        - a reduction of the price, based on the cost of the property, from someone connected with the sale (the manufacturer, distributor, seller or installer)
        - a payment from a Department of Energy Home Energy Rebate program

      Do not subtract:
      - a state energy-efficiency incentive unless it is such a rebate
      - net metering credits

      Do not include financing costs such as interest, origination fees or an extended warranty.

      If you own a condominium or are a tenant-stockholder in a cooperative, include your proportionate share of the costs paid by the condominium management association or the cooperative housing corporation.

      Costs for more than one home go on the same line.
