# The interview's question bank for tax year 2025. Each question names its input and gives
# its order and help; its prompt is its collection's frame followed by the form line's
# question text, and its citation the line's (a roster question's, its collection's), filled
# at build. A prompt or cite here is interview wording the form line does not carry.
# The profiles (2025, sales, stage4, full) list the inputs they ask.
bank:
  tax_year: 2025
  frames:
    person: 'For this person (you, or your spouse on a joint return) — '
    f8889: 'For this person (you, or your spouse on a joint return) — '
    sc: 'For this business — '
    scveh: 'For this vehicle — '
    asset: 'For this property — '
    ltc: 'For this person covered by long-term care insurance — '
    dcprov: 'For this care provider (Form 2441, Part I) — '
    oi8z: 'For this item of other income (Schedule 1, line 8z) — '
  questions:
  - input: $person
    order: 0
    help: One entry for you and, on a joint return, one for your spouse. Amounts that are not asked person by person
      (interest, dividends, sales, pensions and annuities, social security benefits, deductions, payments) are entered
      once, for you and your spouse combined.
    prompt: Who is on this return? Enter ["taxpayer"], or ["taxpayer","spouse"] if you are married filing jointly.
  - input: person.role
    order: 0
    help: Answer taxpayer for the entry keyed taxpayer and spouse for the entry keyed spouse.
    prompt: Whose entry is this? taxpayer for you, spouse for your spouse.
  - input: f8889.allocation
    order: 10
    help: The family limit is figured on each Form 8889 for the months treated as having family coverage (Step 1
      of the line 6 instructions).
    prompt: For this person (you, or your spouse on a joint return) — you and your spouse each have an HSA and family
      coverage. Do you divide the family contribution limit equally (equal), or by a different allocation you both
      agree on, such as allocating nothing to one spouse (agreed)? Use the same answer on both Forms 8889.
  - input: f8889.allocated
    order: 10
    help: Money is integer cents. Your spouse's part is the rest of the limit.
    prompt: For this person (you, or your spouse on a joint return) — the part of the family contribution limit
      (Step 1) allocated to this person under the allocation you agreed on. The two parts together may not be more
      than the limit.
