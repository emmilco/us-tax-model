# The interview's question bank for tax year 2025. Each question names its input and gives
# its order and help; its prompt is its collection's frame followed by the form line's
# question text, and its citation the line's (a roster question's, its collection's), filled
# at build. A prompt or cite here is interview wording the form line does not carry.
# The profiles (2025, sales, stage4, full) list the inputs they ask.
bank:
  tax_year: 2025
  frames:
    person: 'For this person (you, or your spouse on a joint return) — '
    f8889: 'For this person (you, or your spouse on a joint return) — '
    sc: 'For this business — '
    scveh: 'For this vehicle — '
    asset: 'For this property — '
    ltc: 'For this person covered by long-term care insurance — '
    dcprov: 'For this care provider (Form 2441, Part I) — '
    oi8z: 'For this item of other income (Schedule 1, line 8z) — '
    f1095a: 'For this Form 1095-A (Health Insurance Marketplace Statement) — '
  questions:
  - input: $person
    order: 0
    help: Choose “Me and my spouse” only if you are married and filing a joint return. Forms W-2 and Forms 1099-R (IRA
      distributions, pensions and annuities) are entered under the person who received them. Amounts that are not asked
      person by person (interest, dividends, sales, social security benefits, deductions, payments) are entered once,
      for you and your spouse combined.
    prompt: 'Who is on this return: just you, or you and your spouse on a joint return?'
    choices:
    - label: Just me
      value: [taxpayer]
      labels: { taxpayer: You }
    - label: Me and my spouse (joint return)
      value: [taxpayer, spouse]
      labels: { taxpayer: You, spouse: Your spouse }
  - input: person.role
    order: 0
    help: Your own entry is the taxpayer's; your spouse's entry is the spouse's.
  - input: f8889.allocation
    order: 10
    help: The family limit is figured on each Form 8889 for the months treated as having family coverage (Step 1
      of the line 6 instructions).
    prompt: For this person (you, or your spouse on a joint return) — you and your spouse each have an HSA and family
      coverage. Do you divide the family contribution limit equally (equal), or by a different allocation you both
      agree on, such as allocating nothing to one spouse (agreed)? Use the same answer on both Forms 8889.
  - input: f8889.allocated
    order: 10
    help: Your spouse's part is the rest of the limit.
    prompt: For this person (you, or your spouse on a joint return) — the part of the family contribution limit
      (Step 1) allocated to this person under the allocation you agreed on. The two parts together may not be more
      than the limit.
  - input: div.any
    order: 10
    help: 'If you are not sure, answer Yes: the next questions ask for each amount, and you can enter zero for any you
      did not receive. Amounts you receive from a mutual fund, ETF or money market fund, including a municipal or other
      tax-exempt bond fund, are dividends, even when a statement calls them interest or tax-exempt interest. A benefit
      from a corporation you own, such as personal use of its car or home, a below-market or forgiven loan, or a purchase
      for less than value, counts when it is treated as a dividend. On a joint return, answer for you and your spouse
      together.'
