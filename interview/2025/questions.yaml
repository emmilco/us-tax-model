      or get money from one?
    cite:
      doc: i8889
      locator: pp. 1-2, Who Must File; p. 4, Name and social security number (SSN), "complete a separate Form 8889
        for each of you"; f5498sa p. 3, Instructions for Participant, "Box 2. Shows the total contributions made in 2025
