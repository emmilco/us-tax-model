  - input: f8889.line2
    order: 9
    seq: 6
    help: "Count deposits by you, or by anyone other than your employer, that were for 2025, made up to April 15, 2026
      (later if you served in a combat zone). Box 12 of your Form W-2 shows, next to the letter W, what your employer
      put in and what was taken out of your pay before tax; leave that out, and leave out pre-tax money taken from your
      pay in early 2026 for 2025 (it belongs in the question before). Money taken out of your pay after tax counts
      here. Do not count money moved in from another HSA, an Archer MSA or an IRA. Zero if none."
    prompt: For this person (you, or your spouse on a joint return) — How much did you put into your HSA for 2025
      yourself, not counting money in box 12 of your Form W-2?
