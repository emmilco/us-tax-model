  - input: f8960.prior_2i
    order: 11
    help: Asked only when a capital loss is carried into 2025 and your modified adjusted gross income is over the net
      investment income tax threshold. Answer No if you did not figure net investment income tax for 2024.
  - input: f8960.refund
    order: 10
    help: Yes if in 2025 you (or, on a joint return, your spouse) recovered or were refunded any amount deducted on an earlier
