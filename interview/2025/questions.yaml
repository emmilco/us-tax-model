    prompt: For this person (you, or your spouse on a joint return) — Was any money moved into your HSA straight from an
      IRA in 2025?
  - input: f8889.excess_withdrawn
    order: 9
    seq: 8
    help: This is called withdrawing excess contributions. It covers money put in by you, your employer or anyone else.
      Answer Yes also if you plan to do it before the filing deadline, extensions included.
    prompt: For this person (you, or your spouse on a joint return) — In 2025, or in 2026 before filing this return, did
      you take money back out of your HSA because too much had been put in?
  - input: f8889.coverage_year
    order: 9
    seq: 9
    help: "What counts is the plan you had on the first day of each month; plan papers usually call such a plan
      “HSA-eligible” or “HDHP”. If you were covered all year as a member of someone else's plan (a parent's, or your spouse's), or by a plan for only you and a family plan at once, choose “covering more than one person”; if that was so for only part of the year, choose “No”. A change of insurer with no gap and the
      same kind of plan is not a change."
    prompt: For this person (you, or your spouse on a joint return) — Was your health plan in 2025 a high-deductible plan
      that works with an HSA, and the same kind all year?
    value_labels:
      self_only: Yes, all 12 months, covering one person only
      family: Yes, all 12 months, covering more than one person
      changed: 'No: it started, stopped or changed during 2025, or not sure'
  - input: f8889.clear_all_year
    order: 9
    seq: 10
    help: "Other health coverage means a second plan that pays medical bills before the high deductible is met, such as your spouse's ordinary plan that also covers you. These do not count either: telehealth, workers'
      compensation, liability cover under a car or home policy, insurance for one named illness or a fixed amount per
      day in hospital, and VA care for a service-connected disability. Medicare counts from the month its coverage
      began, even if that was set back. If you are not sure, answer No."
    prompt: |-
      For this person (you, or your spouse on a joint return) — On the first day of every month of 2025, were all three of these true?

      - you were not enrolled in Medicare
      - you had no other health coverage that pays medical bills (dental, vision, accident, disability and long-term care insurance do not count)
      - nobody could claim you as a dependent
  - input: f8889.fsa
    order: 9
    seq: 11
    help: "It counts as other health coverage for you and your spouse alike, even when only one person signed up for it.
      Answer No if it pays only dental and vision costs, or pays nothing until the minimum annual deductible for an
      HSA plan is met ($1,650 for a plan covering one person, $3,300 for more). Answer Yes if it was suspended for only
      part of 2025, or if it pays only after retirement and the person who has it had retired. A 2024 health FSA's
      extra months in early 2025 count only if money was left in it at the end of 2024. A dependent care FSA is not a
      health FSA."
    prompt: For this person (you, or your spouse on a joint return) — Did you or your spouse have a health FSA or HRA at work in 2025 that pays ordinary medical bills?
  - input: f8889.spouse_family
    order: 9
    seq: 12
    help: A plan covering more than one person includes one for an employee and a child. Answer Yes even if your spouse has no HSA and even if the plan did not cover you. In a month when both of you qualified to have an HSA, both of you are treated as having family coverage, and the limit is the family one, shared between you both.
    prompt: For this person (you, or your spouse on a joint return) — In any month of 2025, did your spouse have a
      high-deductible plan covering more than one person?
  - input: f8889.months_eligible
    order: 9
    seq: 13
    help: Count a month only if everything held on its first day; December counts as one of the months. An FSA or HRA
      that pays only dental and vision costs, or nothing until the minimum annual deductible for an HSA plan is met
      ($1,650 for a plan covering one person, $3,300 for more), does not count against a
      month; nor do telehealth, workers' compensation, insurance for one named illness or a fixed amount per day in
      hospital, or VA care for a service-connected disability. Zero if there was no such month.
    prompt: |-
      For this person (you, or your spouse on a joint return) — On the first day of how many months of 2025 were you covered by an HSA-qualifying plan, with all three of these true?

      - you were not enrolled in Medicare
      - you had no other health coverage that pays medical bills, counting a health FSA or HRA at work that pays ordinary medical bills, yours or your spouse's (dental, vision, accident, disability and long-term care insurance do not count)
      - nobody could claim you as a dependent
  - input: f8889.months_family
    order: 9
    seq: 14
    help: Count a month also if you were covered by someone else's family plan, or had a plan for only you and a family
      plan at once. Your spouse's plan counts for a month in which the three conditions held for your spouse as well, with or without an HSA, and whether or not the plan covered you. Zero if none.
    prompt: For this person (you, or your spouse on a joint return) — On the first day of how many of those months did
      your plan cover more than one person, or did your spouse have a high-deductible plan covering more than
      one person?
  - input: f8889.dec_coverage
