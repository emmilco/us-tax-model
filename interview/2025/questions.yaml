# The interview's question bank for tax year 2025. Each question names its input and gives
# its order and help; its prompt is its collection's frame followed by the form line's
# question text, and its citation the line's (a roster question's, its collection's), filled
# at build. A prompt or cite here is interview wording the form line does not carry.
# The profiles (2025, sales, stage4, full) list the inputs they ask.
bank:
  tax_year: 2025
  frames:
    person: 'For this person (you, or your spouse on a joint return) — '
    f8889: 'For this person (you, or your spouse on a joint return) — '
    sc: 'For this business — '
    scveh: 'For this vehicle — '
    asset: 'For this property — '
    ltc: 'For this person covered by long-term care insurance — '
    dcprov: 'For this care provider (Form 2441, Part I) — '
    oi8z: 'For this item of other income (Schedule 1, line 8z) — '
    f1095a: 'For this Form 1095-A (Health Insurance Marketplace Statement) — '
  questions:
  - input: $person
    order: 0
    help: Choose “together” if you are married and the two of you are filing one return, even if only one of you had
      income. If your husband or wife died during 2025, you can still choose “together”. If you are married but each
      of you files a separate return, choose “Just me”.
    prompt: Who is this tax return for?
    choices:
    - label: Just me
      value: [taxpayer]
      labels: { taxpayer: You }
      records:
      - input: person[taxpayer].role
        value: taxpayer
        shown: The entry “You” is your own.
    - label: Me and my husband or wife, together on one return
      value: [taxpayer, spouse]
      labels: { taxpayer: You, spouse: Your spouse }
      records:
      - input: person[taxpayer].role
        value: taxpayer
        shown: The entry “You” is your own.
      - input: person[spouse].role
        value: spouse
        shown: The entry “Your spouse” is your husband's or wife's.
      - input: f1040.status
        value: mfj
        shown: Your filing status is married filing jointly.
  - input: div.any
    order: 10
    help: 'If you are not sure, answer Yes: the next questions ask for each amount, and you can enter zero for any you
      did not receive. Amounts you receive from a mutual fund, ETF or money market fund, including a municipal or other
      tax-exempt bond fund, are dividends, even when a statement calls them interest or tax-exempt interest. A benefit
      from a corporation you own, such as personal use of its car or home, a below-market or forgiven loan, or a purchase
      for less than value, counts when it is treated as a dividend. On a joint return, answer for you and your spouse
      together.'
  - input: div.box2b
    order: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined.
  - input: div.box2c
    order: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined.
  - input: div.box2d
    order: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined.
  - input: div.box2e
    order: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined.
  - input: div.box2f
    order: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined.
  - input: div.box3
    order: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined.
  - input: div.box9
    order: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined.
  - input: div.box10
    order: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined.
  - input: div.box13
    order: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined.
  - input: div.basis_reconciled
    order: 15
  - input: f1040.status
    order: 0
    help: 'Take the first line that is true for you, with one exception: if you are married but lived apart from your
      husband or wife for the last six months of 2025 and your child lived with you, look at the line about paying for
      a home before the first line. If a court decree of divorce or legal separation was final by December 31, 2025,
      you were not married. If you pick one of the lines about a child or relative, later questions check the details
      (who lived with you, for how long, who paid for the home). If they do not fit, you will be told, and you can
      come back and choose again.'
    prompt: Which of these fits you on December 31, 2025?
    cite:
      doc: i1040gi
      locator: p. 13, Filing Status, Single, "You were never married" and "You were legally separated according to
        your state law under a decree of divorce or separate maintenance"; p. 13, Married Filing Jointly, "They can
        file a joint return even if only one had income"; p. 14, Married Filing Separately, "if you are married at the
        end of 2025 and file a separate return"; p. 14, Head of Household, "if you are unmarried and provide a home for
        certain other persons"; p. 15, Married persons who live apart, "You lived apart from your spouse for the last 6
        months of 2025"; p. 15, Qualifying Surviving Spouse, "Your spouse died in 2023 or 2024 and you didn’t remarry
        before the end of 2025"
    value_labels:
      mfs: Married, and filing apart from my husband or wife (married filing separately)
      qss: Widowed in 2023 or 2024, not remarried, and my child lived with me all of 2025 (qualifying surviving spouse)
      hoh: I paid over half the cost of the home of my child, or of a relative I support (head of household)
      single: 'None of these: I was not married (single)'
      mfj: Married, and filing together with my husband or wife on one return (married filing jointly)
