  - input: ftc.all_passive
    order: 10
    help: Yes if all the foreign-source gross income you (or, on a joint return, your spouse) had was passive category
      income. Passive income is mostly interest and dividends.
  - input: ftc.statements
    order: 10
    help: Yes if every foreign income and tax amount was reported to you (or, on a joint return, your spouse) on a qualified
      payee statement, such as Form 1099-INT or 1099-DIV.
  - input: ftc.eligible
    order: 10
    help: Yes if the foreign taxes are creditable and the holding-period, related-payment and required foreign-tax reduction
