# The interview's question bank for tax year 2025. Each question names its input and gives
# its order and help; its prompt is its collection's frame followed by the form line's
# question text, and its citation the line's (a roster question's, its collection's), filled
# at build. A prompt or cite here is interview wording the form line does not carry.
# The profiles (2025, sales, stage4, full) list the inputs they ask.
bank:
  tax_year: 2025
  frames:
    person: 'For this person (you, or your spouse on a joint return) — '
    f8889: 'For this person (you, or your spouse on a joint return) — '
    sc: 'For this business — '
    scveh: 'For this vehicle — '
    f1116col: 'For this source of foreign income — '
    f1116sbyr: 'For this earlier year — '
    asset: 'For this property — '
    ltc: 'For this person covered by long-term care insurance — '
    dcprov: 'For this care provider — '
    oi8z: 'For this item of other income — '
    f8853c: 'For this person whose care or illness the payments were for — '
    f1095a: 'On this Form 1095-A — '
    k1p: 'On this Schedule K-1 (Form 1065) — '
    k1s: 'For this S corporation — '
    f7203: 'For this S corporation — '
    rental: 'For this rental property — '
    rprop: 'For this building or improvement — '
    royalty: 'For this royalty — '
  groups:
  - id: about_you
    heading: "Is any of these true of you (or, on a joint return, your spouse)?"
  - id: dependent_facts
    heading: "Is any of these true of this person?"
  - id: child_extras
    heading: "Does either of these apply to you (or, on a joint return, your spouse)?"
  - id: own_income
    heading: "In 2025, did you (or, on a joint return, your spouse) have any of these?"
  - id: work_kind
    heading: "Did either of these describe your work in 2025?"
  - id: w2_jobs
    heading: "Do your (or, on a joint return, your spouse's) W-2s, or the jobs on them, show any of these?"
  - id: other_pay
    heading: "In 2025, did you (or, on a joint return, your spouse) have any of these kinds of work or pay?"
  - id: pay_kinds
    heading: "Which of these were you (or, on a joint return, your spouse) paid in 2025?"
  - id: tips_overtime
    heading: "In 2025, did you (or, on a joint return, your spouse) get either of these at a job?"
  - id: tip_kinds
    heading: "About the tips from this employer: is any of these true?"
  - id: care_help
    heading: "In 2025, did you (or, on a joint return, your spouse) have any of these?"
  - id: care_facts
    heading: "About that care: is any of these true of you (or, on a joint return, your spouse)?"
  - id: money_a
    heading: "In 2025, did you (or, on a joint return, your spouse) get any of these?"
  - id: money_b
    heading: "Did any of these happen to you (or, on a joint return, your spouse)?"
  - id: cod_why
    heading: "Does any of these apply to a canceled debt?"
  - id: cod_how
    heading: "Does any of these apply to a canceled debt?"
  - id: interest_dividends
    heading: "In 2025, did you (or, on a joint return, your spouse) have either of these?"
  - id: sales_rare
    heading: In 2025, did you (or, on a joint return, your spouse) have any of these less common sales or trades?
  - id: invest_other
    heading: Is either of these true of your (or, on a joint return, your spouse's) investments?
  - id: outside_us
    heading: At any time in 2025, did you (or, on a joint return, your spouse) have any of these outside the United States?
  - id: foreign_credit
    heading: Do any of these apply to your (or, on a joint return, your spouse's) foreign income or foreign tax?
  - id: other_taxes
    heading: Do you (or, on a joint return, your spouse) owe any of these for 2025?
  - id: paid_already
    heading: Besides tax taken out of wages, did you (or, on a joint return, your spouse) pay federal tax for 2025 in either of these ways?
  - id: before_2025
    heading: Before 2025, did you (or, on a joint return, your spouse) have either of these?
  - id: nol_facts
    heading: Is any of this true of the loss carried into 2025?
  - id: rec_rare
    heading: About the money paid back in 2025, is any of this true?
  - id: rec_kinds
    heading: Was any of the money paid back for any of these 2024 deductions?
  - id: biz_refused
    heading: Is any of these true of it?
  - id: biz_had
    heading: Which of these did it have in 2025?
  - id: veh_history
    heading: Is any of these true of its history?
  - id: veh_use
    heading: Is any of these true of how it is used or depreciated?
  - id: veh_prior
    heading: In an earlier year, was any of these true of it?
  - id: asset_kind
    heading: Is it any of these?
  - id: asset_history
    heading: Is any of these true of its history?
  - id: asset_method
    heading: Is any of these true of how it is depreciated or used?
  - id: rare_credits
    heading: In 2025, did you (or, on a joint return, your spouse) do any of these?
  - id: ira_withdrawal
    heading: Is any of these true of this IRA withdrawal?
  - id: plan_payment
    heading: Is any of these true of this pension or plan payment?
  - id: accounts
    heading: Do you have any of these accounts?
  - id: ira_pay
    heading: Were any of these true for you (or, on a joint return, your spouse) in 2025?
  - id: ssb_facts
    heading: Is any of these true of the social security benefits?
  - id: rare_accounts
    heading: In 2025, did any of these apply to you (or, on a joint return, your spouse)?
  - id: mkt_people
    heading: 'About the people on your Marketplace plan in 2025: is any of these true?'
  - id: f1095a_col_b
    heading: Is any of these true of column B or your plan in 2025?
  - id: mkt_premiums
    heading: 'About the premiums for the Marketplace plan: is any of these true?'
  - id: paid_2025
    heading: In 2025, did you (or, on a joint return, your spouse) do any of these?
  - id: paid_more
    heading: Do any of these apply to you (or, on a joint return, your spouse) for 2025?
  - id: rare_deductions
    heading: Do any of these uncommon things apply to you (or, on a joint return, your spouse)?
  - id: deduction_wishes
    heading: Do you want either of these?
  - id: home_school
    heading: And in 2025, did you (or, on a joint return, your spouse) do any of these?
  - id: energy_power
    heading: Did the work include any of these for making or storing energy?
  - id: energy_shell
    heading: Did the work include any of these?
  - id: energy_heating
    heading: Did the work include any of this heating, cooling or hot-water equipment?
  # --- k1p groups (lane x2-k1p) ---
  - id: k1p_income
    heading: Which of boxes 1 to 4 of this Schedule K-1 show an amount?
  - id: k1p_portfolio
    heading: Which of boxes 5 to 9 show an amount?
  - id: k1p_boxes_10
    heading: Which of boxes 10 to 13 show an amount?
  - id: k1p_boxes_14
    heading: Which of boxes 14 to 17 show an amount or a check?
  - id: k1p_boxes_18
    heading: Which of boxes 18 to 20 show an amount?
  - id: k1p_facts
    heading: Is any of these true of this Schedule K-1 or your share?
  - id: k1p_part_other
    heading: Counting your spouse's work with yours (whether or not you file jointly), is any of these true of your work in
      this business?
  - id: k1p_rental
    heading: Is either of these true of you or of this partnership's rentals?
  - id: k1p_prior
    heading: Which part of the partnership was that loss held back from?
  - id: k1p_carry
    heading: Does your 2024 return, or an earlier one, show any of these for this partnership?
  # --- end k1p groups ---
  - id: k1s_facts
    heading: Is either of these true of this Schedule K-1?
  - id: k1s_box_a
    heading: Which of boxes 1 to 5 of this Schedule K-1 show an amount?
  - id: k1s_box_b
    heading: Which of boxes 6 to 12 of this Schedule K-1 show an amount?
  - id: k1s_box_c
    heading: Which of boxes 13 to 17 of this Schedule K-1 show an amount or a check?
  - id: k1s_box16
    heading: Which codes does box 16 of this Schedule K-1 show?
  - id: k1s_box17
    heading: Which codes does box 17 of this Schedule K-1 show?
  - id: k1s_prior
    heading: On an earlier return, was a loss from this corporation held back for any of these reasons?
  - id: k1s_activity
    heading: Is any of these true of you or this corporation?
  - id: rental_rare
    heading: "Is any of these true of this rental?"
  - id: rental_costs_a
    heading: "In 2025, did you pay any of these for this rental, or did a tenant pay any in place of rent?"
  - id: rental_costs_b
    heading: "In 2025, did you pay any of these for it, or did a tenant pay any in place of rent?"
  - id: rental_costs_c
    heading: "And did you pay any of these for it, or did a tenant pay any in place of rent?"
  - id: rental_use
    heading: "Is either of these true of this rental?"
  - id: rprop_facts
    heading: "Is any of these true of it?"
  - id: royalty_rare
    heading: "Is any of these true of this royalty?"
  - id: rental_return
    heading: "Is any of these true of your (or, on a joint return, your spouse's) rentals?"
  questions:
  # --- k1p (lane x2-k1p) ---
  - input: $k1p
    order: 264
    seq: 1
    help: List each Schedule K-1 (Form 1065) once, by the partnership's name in item B. A Schedule K-1 from an S corporation
      (Form 1120-S) or from an estate or trust (Form 1041) is not listed here.
    prompt: For this person (you, or your spouse on a joint return) — Which partnerships or LLCs sent you a Schedule K-1
      (Form 1065) for 2025?
  - input: k1p.ptp
    order: 264
    seq: 2
    help: Item D is near the top left of the page. Units of a partnership bought on a stock exchange (often called an MLP)
      are outside what this tool prepares; A Yes ends the interview here.
  - input: k1p.general
    order: 264
    seq: 3
    help: Item G is in Part II, on the left. Answer No if the second box, limited partner or other LLC member, is checked.
  - input: k1p.has_b1
    order: 264
    seq: 10
    group: k1p_income
    tick: 'Box 1: ordinary business income (loss)'
  - input: k1p.has_b2
    order: 264
    seq: 11
    group: k1p_income
    tick: 'Box 2: net rental real estate income (loss)'
  - input: k1p.has_b3
    order: 264
    seq: 12
    group: k1p_income
    tick: 'Box 3: other net rental income (loss)'
  - input: k1p.has_b4a
    order: 264
    seq: 13
    group: k1p_income
    tick: 'Box 4a: guaranteed payments for services'
  - input: k1p.r_b4b
    order: 264
    seq: 14
    group: k1p_income
    tick: 'Box 4b: guaranteed payments for capital'
    help: A Yes ends the interview here.
  - input: k1p.box1
    order: 264
    seq: 15
  - input: k1p.box2
    order: 264
    seq: 16
  - input: k1p.box3
    order: 264
    seq: 17
  - input: k1p.box4a
    order: 264
    seq: 18
  - input: k1p.has_b5
    order: 264
    seq: 20
    group: k1p_portfolio
    tick: 'Box 5: interest income'
  - input: k1p.has_b6a
    order: 264
    seq: 21
    group: k1p_portfolio
    tick: 'Box 6a: ordinary dividends'
  - input: k1p.r_b7
    order: 264
    seq: 22
    group: k1p_portfolio
    tick: 'Box 7: royalties'
    help: A Yes ends the interview here.
  - input: k1p.has_b8
    order: 264
    seq: 23
    group: k1p_portfolio
    tick: 'Box 8: net short-term capital gain (loss)'
  - input: k1p.has_b9a
    order: 264
    seq: 24
    group: k1p_portfolio
    tick: 'Box 9a: net long-term capital gain (loss)'
  - input: k1p.box5
    order: 264
    seq: 25
  - input: k1p.box6a
    order: 264
    seq: 26
  - input: k1p.box6b
    order: 264
    seq: 27
    help: Qualified dividends are part of the ordinary dividends in box 6a, never more.
  - input: k1p.box8
    order: 264
    seq: 28
  - input: k1p.box9a
    order: 264
    seq: 29
  - input: k1p.has_b9bc
    order: 264
    seq: 30
    help: Both are parts of the gain in box 9a.
  - input: k1p.box9b
    order: 264
    seq: 31
  - input: k1p.box9c
    order: 264
    seq: 32
    help: If box 9c says STMT, the statement splits it into kinds; that is outside what this tool prepares.
  - input: k1p.r_b10
    order: 264
    seq: 35
    group: k1p_boxes_10
    tick: 'Box 10: net section 1231 gain (loss)'
    help: A Yes ends the interview here.
  - input: k1p.r_b11
    order: 264
    seq: 36
    group: k1p_boxes_10
    tick: 'Box 11: other income (loss)'
    help: A Yes ends the interview here.
  - input: k1p.r_b12
    order: 264
    seq: 37
    group: k1p_boxes_10
    tick: 'Box 12: section 179 deduction'
    help: A Yes ends the interview here.
  - input: k1p.r_b13
    order: 264
    seq: 38
    group: k1p_boxes_10
    tick: 'Box 13: a code other than AE'
    help: 'Code AE (deductions, portfolio income) can be left out: it is not deducted on your return. A Yes ends the interview
      here.'
  - input: k1p.has_b14a
    order: 264
    seq: 40
    group: k1p_boxes_14
    tick: 'Box 14, code A: net earnings from self-employment'
  - input: k1p.r_b14bc
    order: 264
    seq: 41
    group: k1p_boxes_14
    tick: Box 14, code B or C
    help: A Yes ends the interview here.
  - input: k1p.has_b15o
    order: 264
    seq: 42
    group: k1p_boxes_14
    tick: 'Box 15, code O: backup withholding'
  - input: k1p.r_b15
    order: 264
    seq: 43
    group: k1p_boxes_14
    tick: 'Box 15: a code other than O'
    help: A Yes ends the interview here.
  - input: k1p.r_b16
    order: 264
    seq: 44
    group: k1p_boxes_14
    tick: 'Box 16 checked: Schedule K-3 attached'
    help: A Yes ends the interview here.
  - input: k1p.r_b17
    order: 264
    seq: 45
    group: k1p_boxes_14
    tick: 'Box 17: alternative minimum tax items'
    help: A Yes ends the interview here.
  - input: k1p.box14a
    order: 264
    seq: 46
    help: Use the amount shown with code A, before any change; a loss is a negative amount.
  - input: k1p.box15o
    order: 264
    seq: 47
  - input: k1p.has_b18a
    order: 264
    seq: 50
    group: k1p_boxes_18
    tick: 'Box 18, code A: tax-exempt interest income'
  - input: k1p.has_b19
    order: 264
    seq: 51
    group: k1p_boxes_18
    tick: 'Box 19: distributions'
  - input: k1p.has_b20ab
    order: 264
    seq: 52
    group: k1p_boxes_18
    tick: 'Box 20, code A or B: investment income or expenses'
  - input: k1p.has_b20z
    order: 264
    seq: 53
    group: k1p_boxes_18
    tick: 'Box 20, code Z: section 199A information'
  - input: k1p.r_b20
    order: 264
    seq: 54
    group: k1p_boxes_18
    tick: 'Box 20: a code other than A, B, N, Z or AG'
    help: A Yes ends the interview here.
  - input: k1p.box18a
    order: 264
    seq: 55
  - input: k1p.b19_other
    order: 264
    seq: 56
    help: Code A is money (cash and some marketable securities). Other codes are property, or pay for services. A Yes ends
      the interview here.
  - input: k1p.dist_over
    order: 264
    seq: 57
    help: Your basis is what you put in, plus your share of its income and debts, less losses and money taken out earlier.
      The worksheet in the instructions for Schedule K-1 figures it. A Yes ends the interview here.
  - input: k1p.box20z
    order: 264
    seq: 58
    help: The statement for code Z gives each business's qualified business income (QBI); enter their total. Enter 0 if
      it shows none.
  - input: k1p.z_other
    order: 264
    seq: 59
    help: A Yes ends the interview here.
  - input: k1p.r_b21
    order: 264
    seq: 60
    group: k1p_facts
    tick: Box 21 shows foreign taxes paid or accrued
    help: A Yes ends the interview here.
  - input: k1p.r_b2223
    order: 264
    seq: 61
    group: k1p_facts
    tick: Box 22 or box 23 is checked
    help: A Yes ends the interview here.
  - input: k1p.r_foreign
    order: 264
    seq: 62
    group: k1p_facts
    tick: It is a foreign partnership
    help: A Yes ends the interview here.
  - input: k1p.r_disposed
    order: 264
    seq: 63
    group: k1p_facts
    tick: You sold or gave up any of your share in 2025
    help: A Yes ends the interview here.
  - input: k1p.upe
    order: 264
    seq: 64
    group: k1p_facts
    tick: You paid partnership expenses the partnership agreement required you to pay
    help: Only expenses the partnership did not pay you back. A Yes ends the interview here.
  - input: k1p.interest_buy
    order: 264
    seq: 65
    group: k1p_facts
    tick: You paid interest on money borrowed to buy into it
    help: A loan used to buy your share, or to put money into the partnership. A Yes ends the interview here.
  - input: k1p.trader
    order: 264
    seq: 70
    help: A fund that buys and sells stocks for its partners is one; a business that sells goods or services is not. A Yes
      ends the interview here.
  - input: k1p.work
    order: 264
    seq: 71
    help: Count work in running the business. Reading its reports or checking on it as an investor does not count.
  - input: k1p.hours500
    order: 264
    seq: 72
    help: Count your own hours and your spouse's hours in it together, whether or not you file jointly.
  - input: k1p.most_hours
    order: 264
    seq: 73
  - input: k1p.nearly_all
    order: 264
    seq: 74
  - input: k1p.five_of_ten
    order: 264
    seq: 75
    help: 'Your earlier returns show it: the business''s income or loss was in column (i) or (k) of Schedule E, not (g)
      or (h).'
  - input: k1p.t6
    order: 264
    seq: 76
    group: k1p_part_other
    tick: A service business you took part in for 3 earlier years
    help: A Yes ends the interview here.
  - input: k1p.t4
    order: 264
    seq: 77
    group: k1p_part_other
    tick: Over 500 hours in all your businesses of over 100 hours
    help: A Yes ends the interview here.
  - input: k1p.t7
    order: 264
    seq: 78
    group: k1p_part_other
    tick: Regular, continuous and substantial work, over 100 hours
    help: A Yes ends the interview here.
  - input: k1p.decisions
    order: 264
    seq: 80
  - input: k1p.tenth
    order: 264
    seq: 81
    help: The partnership's records or item J show your share. Answer No if it was less than a tenth at any time in 2025.
  - input: k1p.re_pro
    order: 264
    seq: 82
    group: k1p_rental
    tick: "One person: over 750 hours and most work time in real estate"
    help: A Yes ends the interview here.
    prompt: Did you (or, on a joint return, your spouse) work more than 750 hours in 2025 in real estate businesses, and more
      than half of your own work time? On a joint return, one spouse must meet both alone.
  - input: k1p.dwelling
    order: 264
    seq: 83
    group: k1p_rental
    tick: One of its rental homes had over 14 days of personal use
    help: A day counts if you, another partner, a family member of either, or anyone paying less than a fair rent used it.
      A Yes ends the interview here.
  - input: k1p.prior_any
    order: 264
    seq: 85
    help: A 2024 Form 8582 (Part VII, column (c)) lists such a loss.
  - input: k1p.prior_b1_any
    order: 264
    seq: 86
    group: k1p_prior
    tick: The business (box 1)
  - input: k1p.prior_b2_any
    order: 264
    seq: 87
    group: k1p_prior
    tick: Rental real estate (box 2)
  - input: k1p.prior_b3_any
    order: 264
    seq: 88
    group: k1p_prior
    tick: Other rentals (box 3)
  - input: k1p.prior_b1
    order: 264
    seq: 89
  - input: k1p.prior_b2
    order: 264
    seq: 90
  - input: k1p.prior_b3
    order: 264
    seq: 91
  - input: k1p.prior_not_active
    order: 264
    seq: 92
    help: A Yes ends the interview here.
  - input: k1p.basis_short
    order: 264
    seq: 95
    help: Most partners with a loss have basis to cover it. The worksheet for a partner's basis in the instructions for
      Schedule K-1 figures it. A Yes ends the interview here.
    prompt: "On this Schedule K-1 (Form 1065) — Were your 2025 losses from it more than your basis at the end of its year (what you put in, plus your share of its income and debts, less losses and money taken out)?"
  - input: k1p.not_at_risk
    order: 264
    seq: 96
    help: A partner who put in their own cash, or is liable for the partnership's loans, is at risk; so is money borrowed
      from a bank or other outside lender that you must repay. A Yes ends the interview here.
    prompt: "On this Schedule K-1 (Form 1065) — Was any of what you put in borrowed without personal liability (other than qualified real estate loans), protected by a guarantee or stop-loss agreement, or lent by another partner or someone related to one?"
  - input: k1p.basis_carry
    order: 264
    seq: 97
    group: k1p_carry
    tick: A loss held back because your basis in it was too low
    help: A Yes ends the interview here.
  - input: k1p.risk_carry
    order: 264
    seq: 98
    group: k1p_carry
    tick: A loss held back by the at-risk rules (Form 6198)
    help: A Yes ends the interview here.
  - input: k1p.fuel_prior_year
    order: 264
    seq: 99
    group: k1p_carry
    tick: A credit for federal tax on fuels, from its information
    help: A Yes ends the interview here.
  # --- end k1p ---
  - input: $person
    order: 100
    seq: 1
    help: Choose “together” if you are married and the two of you are filing one return, even if only one of you had
      income. If your husband or wife died during 2025, you can still choose “together”. If you are married but each
      of you files a separate return, choose “Just me”.
    prompt: Who is this tax return for?
    choices:
    - label: Just me
      value: [taxpayer]
      labels: { taxpayer: You }
      records:
      - input: person[taxpayer].role
        value: taxpayer
        shown: The entry “You” is your own.
    - label: Me and my husband or wife, together on one return
      value: [taxpayer, spouse]
      labels: { taxpayer: You, spouse: Your spouse }
      records:
      - input: person[taxpayer].role
        value: taxpayer
        shown: The entry “You” is your own.
      - input: person[spouse].role
        value: spouse
        shown: The entry “Your spouse” is your husband's or wife's.
      - input: f1040.status
        value: mfj
        shown: Your filing status is married filing jointly.
  - input: div.any
    order: 272
    seq: 2
    group: interest_dividends
    tick: "Shares or funds owned outside a retirement account, or a 1099-DIV"
    help: "Stocks, mutual funds, ETFs and money market funds are all shares. If you are not sure, answer Yes: the next questions ask for amounts, and zero is a valid answer."
  - input: div.other_boxes
    order: 272
    seq: 9
    help: Most forms use only boxes 1a, 1b, 2a, 5, 7 and 12. Count your share of a form in another's name, and a payment
      with no form, such as a return of capital or a payout when a company closed.
  - input: div.box2b
    order: 272
    seq: 10
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box2c
    order: 272
    seq: 11
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box2d
    order: 272
    seq: 12
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box2e
