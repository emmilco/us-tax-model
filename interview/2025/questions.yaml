# The interview's question bank for tax year 2025. Each question names its input and gives
# its order and help; its prompt is its collection's frame followed by the form line's
# question text, and its citation the line's (a roster question's, its collection's), filled
# at build. A prompt or cite here is interview wording the form line does not carry.
# The profiles (2025, sales, stage4, full) list the inputs they ask.
bank:
  tax_year: 2025
  frames:
    person: 'For this person (you, or your spouse on a joint return) — '
    f8889: 'For this person (you, or your spouse on a joint return) — '
    sc: 'For this business — '
    scveh: 'For this vehicle — '
    asset: 'For this property — '
    ltc: 'For this person covered by long-term care insurance — '
    dcprov: 'For this care provider — '
    oi8z: 'For this item of other income — '
    f1095a: 'On this Form 1095-A — '
  groups:
  - id: about_you
    heading: "Is any of these true of you (or, on a joint return, your spouse)?"
  - id: dependent_facts
    heading: "Is any of these true of this person?"
  - id: child_extras
    heading: "Does either of these apply to you (or, on a joint return, your spouse)?"
  - id: own_income
    heading: "In 2025, did you (or, on a joint return, your spouse) have any of these?"
  - id: work_kind
    heading: "Did either of these describe your work in 2025?"
  - id: w2_jobs
    heading: "Do your (or, on a joint return, your spouse's) W-2s, or the jobs on them, show any of these?"
  - id: other_pay
    heading: "In 2025, did you (or, on a joint return, your spouse) have any of these kinds of work or pay?"
  - id: tips_overtime
    heading: "In 2025, did you (or, on a joint return, your spouse) get either of these at a job?"
  - id: tip_kinds
    heading: "About the tips from this employer: is any of these true?"
  - id: care_help
    heading: "In 2025, did you (or, on a joint return, your spouse) have any of these?"
  - id: care_facts
    heading: "About that care: is any of these true of you (or, on a joint return, your spouse)?"
  - id: money_a
    heading: "In 2025, did you (or, on a joint return, your spouse) get any of these?"
  - id: money_b
    heading: "Did any of these happen to you (or, on a joint return, your spouse)?"
  - id: sales_rare
    heading: In 2025, did you (or, on a joint return, your spouse) have any of these less common sales or trades?
  - id: invest_other
    heading: Is either of these true of your (or, on a joint return, your spouse's) investments?
  - id: outside_us
    heading: At any time in 2025, did you (or, on a joint return, your spouse) have any of these outside the United States?
  - id: other_taxes
    heading: Do you (or, on a joint return, your spouse) owe any of these for 2025?
  - id: paid_already
    heading: Besides tax taken out of wages, did you (or, on a joint return, your spouse) pay federal tax for 2025 in either of these ways?
  - id: before_2025
    heading: Before 2025, did you (or, on a joint return, your spouse) have either of these?
  - id: biz_refused
    heading: Is any of these true of it?
  - id: biz_had
    heading: Which of these did it have in 2025?
  - id: veh_history
    heading: Is any of these true of its history?
  - id: veh_use
    heading: Is any of these true of how it is used or depreciated?
  - id: veh_prior
    heading: In an earlier year, was any of these true of it?
  - id: asset_kind
    heading: Is it any of these?
  - id: asset_history
    heading: Is any of these true of its history?
  - id: asset_method
    heading: Is any of these true of how it is depreciated or used?
  - id: rare_credits
    heading: In 2025, did you (or, on a joint return, your spouse) do any of these?
  - id: ira_withdrawal
    heading: Is any of these true of this IRA withdrawal?
  - id: plan_payment
    heading: Is any of these true of this pension or plan payment?
  - id: accounts
    heading: Do you have any of these accounts?
  - id: ira_pay
    heading: Were any of these true for you (or, on a joint return, your spouse) in 2025?
  - id: ssb_facts
    heading: Is any of these true of the social security benefits?
  - id: rare_accounts
    heading: In 2025, did any of these apply to you (or, on a joint return, your spouse)?
  - id: mkt_people
    heading: 'About the people on your Marketplace plan in 2025: is any of these true?'
  - id: f1095a_col_b
    heading: Is any of these true of column B or your plan in 2025?
  - id: mkt_premiums
    heading: 'About the premiums for the Marketplace plan: is any of these true?'
  - id: paid_2025
    heading: In 2025, did you (or, on a joint return, your spouse) do any of these?
  - id: paid_more
    heading: Do any of these apply to you (or, on a joint return, your spouse) for 2025?
  - id: rare_deductions
    heading: Do any of these uncommon things apply to you (or, on a joint return, your spouse)?
  - id: deduction_wishes
    heading: Do you want either of these?
  - id: home_school
    heading: And in 2025, did you (or, on a joint return, your spouse) do any of these?
  - id: energy_power
    heading: Did the work include any of these for making or storing energy?
  - id: energy_shell
    heading: Did the work include any of these?
  - id: energy_heating
    heading: Did the work include any of this heating, cooling or hot-water equipment?
  questions:
  - input: $person
    order: 100
    seq: 1
    help: Choose “together” if you are married and the two of you are filing one return, even if only one of you had
      income. If your husband or wife died during 2025, you can still choose “together”. If you are married but each
      of you files a separate return, choose “Just me”.
    prompt: Who is this tax return for?
    choices:
    - label: Just me
      value: [taxpayer]
      labels: { taxpayer: You }
      records:
      - input: person[taxpayer].role
        value: taxpayer
        shown: The entry “You” is your own.
    - label: Me and my husband or wife, together on one return
      value: [taxpayer, spouse]
      labels: { taxpayer: You, spouse: Your spouse }
      records:
      - input: person[taxpayer].role
        value: taxpayer
        shown: The entry “You” is your own.
      - input: person[spouse].role
        value: spouse
        shown: The entry “Your spouse” is your husband's or wife's.
      - input: f1040.status
        value: mfj
        shown: Your filing status is married filing jointly.
  - input: div.any
    order: 272
    seq: 1
    help: "Stocks, mutual funds, ETFs and money market funds are all shares. If you are not sure, answer Yes: the next questions ask for amounts, and zero is a valid answer."
  - input: div.other_boxes
    order: 272
    seq: 7
    help: Most forms show amounts only in boxes 1a, 1b, 2a, 5, 7 and 12. If you have no Form 1099-DIV, answer No.
  - input: div.box2b
    order: 272
    seq: 8
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box2c
    order: 272
    seq: 9
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box2d
    order: 272
    seq: 10
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box2e
    order: 272
    seq: 11
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box2f
    order: 272
    seq: 12
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box3
    order: 272
    seq: 13
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box9
    order: 272
    seq: 14
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box10
    order: 272
    seq: 15
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.box13
    order: 272
    seq: 16
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: div.basis_reconciled
    order: 272
    seq: 17
  - input: f1040.status
    order: 100
    seq: 2
    help: 'Take the first line that is true for you, with one exception: if you are married but lived apart from your
      husband or wife for the last six months of 2025 and your child lived with you, look at the line about paying for
      a home before the first line. If a court decree of divorce or legal separation was final by December 31, 2025,
      you were not married. If you pick one of the lines about a child or relative, later questions check the details
      (who lived with you, for how long, who paid for the home). If they do not fit, you will be told, and you can
      come back and choose again.'
    prompt: Which of these fits you on December 31, 2025?
    cite:
      doc: i1040gi
      locator: p. 13, Filing Status, Single, "You were never married" and "You were legally separated according to
        your state law under a decree of divorce or separate maintenance"; p. 13, Married Filing Jointly, "They can
        file a joint return even if only one had income"; p. 14, Married Filing Separately, "if you are married at the
        end of 2025 and file a separate return"; p. 14, Head of Household, "if you are unmarried and provide a home for
        certain other persons"; p. 15, Married persons who live apart, "You lived apart from your spouse for the last 6
        months of 2025"; p. 15, Qualifying Surviving Spouse, "Your spouse died in 2023 or 2024 and you didn’t remarry
        before the end of 2025"
    value_labels:
      mfs: Married, and filing apart from my husband or wife (married filing separately)
      qss: Widowed in 2023 or 2024, not remarried, and my child lived with me all of 2025 (qualifying surviving spouse)
      hoh: I paid over half the cost of the home of my child, or of a relative I support (head of household)
      single: 'None of these: I was not married (single)'
      mfj: Married, and filing together with my husband or wife on one return (married filing jointly)
  - input: f1040.withheld_other_any
    order: 300
    seq: 1
    group: paid_already
    tick: Tax taken out of a pension, social security or other money
    help: "Look for box 4 of a Form 1099 or W-2G, box 6 of Form SSA-1099 or box 10 of Form RRB-1099. Tax withheld on a Schedule K-1 or Form 1042-S counts too. If you are not sure, answer Yes."
    prompt: In 2025, was federal income tax taken out of money paid to you (or, on a joint return, your spouse) other
      than wages, such as a pension, social security, unemployment or gambling winnings?
  - input: f1040.line3a
    order: 272
    seq: 3
    help: "Box 1b is a part of box 1a. Leave out any amount in box 1b that does not qualify, for example on shares you held for less than 61 days around the dividend date (Form 1040 instructions, line 3a)."
    prompt: "Add up box 1b (qualified dividends) of the same forms. Zero if none."
  - input: f4952.has_interest
    order: 276
    seq: 2
    group: invest_other
    tick: Interest paid on money borrowed to buy investments, in 2025 or before
    help: "Any loan counts if the money went into investments. Interest of an earlier year counts only if you could not deduct all of it then. If you are not sure, answer Yes; zero is a valid amount."
    prompt: In 2025 or an earlier year, did you (or, on a joint return, your spouse) pay interest on money borrowed to buy
      investments, such as a margin loan from a broker?
  - input: f4952.line1
    order: 276
    seq: 3
    help: Your broker's year-end statement shows margin interest. If one loan paid for investments and for something else,
      count only the investments' share.
    prompt: How much interest did you pay in 2025 on money borrowed to buy investments? Leave out interest on a home loan,
      and interest on money that went into tax-exempt bonds or a business.
  - input: f4952.carryover
    order: 276
    seq: 4
    prompt: Does a 2024 Form 4952 of yours (or, on a joint return, of your spouse's), on a joint or a separate 2024 return,
      show an amount on line 7 (investment interest that could not be deducted in 2024)?
  - input: f4952.prior_7
    order: 276
    seq: 6
    help: The amount on line 7 of the Form 4952 filed for 2024. If you and your spouse each filed one on a separate 2024
      return, add the two amounts.
  - input: f4952.unsupported
    order: 276
    seq: 7
  - input: f4952.alternative_allocation
    order: 276
    seq: 8
  - input: f4952.line4g
    order: 276
    seq: 5
    help: The choice can be made only on a return filed on time, counting extensions, or on an amended return filed within 6
      months of the due date. Once made, it can be undone only with IRS consent.
    prompt: How much of your qualified dividends and long-term gains do you choose to count as investment income, so that
      more of this interest can be deducted now? What you count is taxed at ordinary rates. Enter 0 to make no such choice.
  - input: f8959.territory_w2
    order: 146
    seq: 4
    group: "other_pay"
    tick: "A wage statement from Puerto Rico or another U.S. territory"
    help: "For example Form 499R-2/W-2PR from Puerto Rico. A Yes ends the interview here."
    prompt: Did you (or, on a joint return, your spouse) get a wage statement from an employer in Puerto Rico or another
      U.S. territory?
  - input: f8960.unsupported
    order: 278
    seq: 1
    help: Yes if any item the question lists applies to you (or, on a joint return, your spouse) for 2025; each is a net
      investment income or modified AGI adjustment of Form 8960 that this tool does not figure, so Yes refuses the return when Form 8960 is required. A
      penalty on early withdrawal of savings (Schedule 1 line 18) is not another adjustment here; this tool enters it on
      line 10.
  - input: f8960.prior_2i
    order: 276
    seq: 16
    help: Asked only when a capital loss is carried into 2025 and your modified adjusted gross income is over the net
      investment income tax threshold. Answer No if you did not figure net investment income tax for 2024.
  - input: f8960.refund
    order: 278
    seq: 2
    help: Yes if in 2025 you (or, on a joint return, your spouse) recovered or were refunded any amount deducted on an earlier
      year's Form 8960 (such as state, local or foreign income tax), whether or not any of it is taxable on Form 1040; the recovery needs the Form 8960
      Deduction Recoveries Worksheet, which this tool does not figure.
  - input: f8960.allocated_taxes
    order: 278
    seq: 3
    help: The part of the state and local income and property taxes you deduct on Schedule A that you allocate to net
      investment income by a reasonable method (Form 8960 line 9b), leaving out foreign taxes you take a credit for.
  - input: ftc.taxes
    order: 280
    seq: 1
    help: "Count only income taxes, after any reduction the credit rules require. Leave out tax on a dividend from shares held under 16 days in the month around the ex-dividend date, or that you must pay over to someone else."
    prompt: "How much foreign tax did you (or, on a joint return, your spouse) pay in 2025? Add up box 7 of your Forms 1099-DIV, box 6 of your Forms 1099-INT, and any income tax you paid to another country yourself. Zero if none."
  - input: ftc.all_passive
    order: 280
    seq: 2
    help: "Interest and dividends that a bank, a broker or a fund reports are passive, even if taxed at a high foreign rate, and so is certain export financing interest. Pay for work abroad and the income of a business are not."
    prompt: "Was all of your (or, on a joint return, your spouse's) income from other countries investment income, such as interest and dividends (“passive category income”)?"
  - input: ftc.statements
    order: 280
    seq: 3
    help: "Answer No if you paid any of the tax to another country yourself."
    prompt: "Was all of that income, and the foreign tax on it, reported to you on a Form 1099-DIV, a Form 1099-INT, a Schedule K-1 or K-3, or a similar statement?"
  - input: ftc.eligible
    order: 280
    seq: 4
    help: "If part of it does not count, such as tax on shares held too briefly, leave that part out of the amount and answer Yes. The Form 1116 instructions list the rules under “Foreign Taxes Not Eligible for a Credit”."
    prompt: "Is all of the foreign tax you entered tax that counts for the credit, under the rules on how long you held the shares, on related payments and on reductions of foreign tax?"
  - input: ftc.elect
    order: 280
    seq: 5
    help: "A credit figured on Form 1116 is outside what this tool prepares; a No ends the interview here."
    prompt: "Do you want to claim the credit for this foreign tax without Form 1116? Foreign tax you cannot use this year is then not carried to any other year."
  - input: sa.gifts
    order: 200
    seq: 5
    group: paid_2025
    tick: Gave money or things to charity, or paid costs of volunteering
    help: Charities include churches, schools, nonprofit hospitals, veterans' groups and governments taking gifts for public
      use. Count a payment that got you something back, such as a fundraising dinner, and a whaling captain's costs of a Native
      Alaskan subsistence hunt.
    prompt: In 2025, did you (or, on a joint return, your spouse) give money or things to a charity, or spend your own money
      doing volunteer work for one?
  - input: sa.gift_carryover
    order: 200
    seq: 8
    group: paid_more
    tick: Have a gift to charity from an earlier year still being deducted
    help: If you itemized deductions in any of the five years before 2025, that return, or a worksheet kept with it, shows a
      carryover. A return with one is outside what this tool prepares; a Yes ends the interview here.
    prompt: Do you (or, on a joint return, your spouse) have a gift to charity from an earlier year that was too large to deduct
      in full then, with the rest carried over to later years?
  - input: $gift
    order: 200
    seq: 42
    help: Group similar things across all the charities you gave to. Leave the list empty if you gave only money.
    prompt: List the kinds of things, other than money, that you gave to charity in 2025, one entry per kind, for example “clothing”
      or “shares of stock”.
  - input: gift.deduction
    order: 200
    seq: 43
    help: For things held a year or less, or that would have brought you ordinary income if sold, the deduction is limited to
      what you paid for them. Zero if none.
    prompt: 'How much can you deduct for this group, added up over all the charities you gave it to: usually what the things
      would have sold for when you gave them? Leave out clothing and household items in less than good used condition, and any
      single gift of $250 or more for which the charity gave you no written acknowledgment.'
  - input: gift.public_securities
    order: 200
    seq: 44
    help: Answer No for privately held stock, a share of a partnership or LLC, stock neither listed on an exchange nor
      regularly traded over the counter (even with a ticker symbol), and shares you were not free to sell.
    prompt: 'Is this group stocks, bonds or fund shares that are publicly traded: listed on a stock exchange, regularly traded
      over the counter, or mutual fund shares whose prices are published daily?'
  - input: gift.special
    order: 200
    seq: 45
    help: A gift with any of these needs an appraisal or special treatment and is outside what this tool prepares; a Yes ends
      the interview here. A group whose deduction is over $5,000 is checked from the amount you entered.
    prompt: 'Is any of these true of this group?
    
    
      - it reached you through a Schedule K-1
    
      - it is a vehicle
    
      - it is a share of a partnership, an S corporation or another pass-through business
    
      - it is intellectual property, such as a patent or a copyright
    
      - it is inventory of a business
    
      - it is a conservation easement, or less than your whole interest in the property
    
      - the charity is restricted in how it may use it
    
      - it is a clothing or household item worth more than $500 that is not in good used condition'
  - input: $interest
    order: 270
    seq: 1
    help: "Count interest of any amount, with or without a Form 1099-INT: on bank accounts, certificates of deposit, bonds, U.S. savings bonds and loans you made. Leave out interest earned inside an IRA or other retirement account."
    prompt: "Which banks, credit unions or others paid you (or, on a joint return, your spouse) interest in 2025? List each one. Leave the list empty if none did."
  - input: interest.amount
    order: 270
    seq: 2
    prompt: "How much taxable interest did this payer pay in 2025? On a Form 1099-INT it is box 1 plus box 3 (interest on U.S. savings bonds and Treasury securities). Leave out tax-exempt interest (box 8)."
  - input: interest.penalty
    order: 270
    seq: 3
    help: Enter the full taxable interest as interest; the penalty is deducted separately, on Schedule 1 line 18.
  - input: f1040.tax_exempt_interest
    order: 271
    seq: 1
    prompt: "How much tax-exempt interest did you (or, on a joint return, your spouse) get in 2025, for example from a city or state bond? Zero if none."
    help: "Box 8 of Form 1099-INT, and tax-exempt amounts on Form 1099-OID (boxes 2 and 11), less any bond premium. Leave out exempt-interest dividends (Form 1099-DIV box 12) and interest earned inside a retirement, health or education savings account."
  - input: div.box12
    order: 272
    seq: 6
    help: Enter the amounts of all your and your spouse's Forms 1099-DIV combined. Include your share of amounts paid in
      someone else's name, and any amount received without a form.
  - input: person.rrta
    order: 140
    seq: 1
    group: "work_kind"
    tick: "Worked for a railroad"
    help: "Yes also if box 14 of a W-2 shows railroad retirement (RRTA) pay or tax, or if you filed Form CT-2. A Yes ends the interview here."
    prompt: For this person (you, or your spouse on a joint return) — Did you work for a railroad in 2025?
  - input: qbi.dividends
    order: 272
    seq: 5
    help: "Box 5 is a part of box 1a, usually from real estate funds (REITs). Leave out the part on shares you held for 45 days or less, or that you must pay over to someone else."
    prompt: "Add up box 5 (section 199A dividends) of the same forms. Zero if none."
  - input: s2.w2_marks
    order: 145
    seq: 1
    group: "w2_jobs"
    tick: "An amount in box 8, or box 12 code A/B/K/M/N/Z"
    help: "Box 8 is tips the employer assigned to you; the letters mark tax an employer did not collect, or special pay. A Yes ends the interview here."
    prompt: Look at your (or, on a joint return, your spouse's) W-2s. Does any have an amount in box 8, or the letter A,
      B, K, M, N or Z in box 12?
  - input: s2.options_any
    order: 146
    seq: 5
    group: "other_pay"
    tick: "Employer stock options used to buy shares, or such shares sold"
    help: Count shares bought through an employee stock purchase plan. Shares simply granted to you, such as restricted
      stock, do not count.
    prompt: In 2025, did you (or, on a joint return, your spouse) use stock options from an employer to buy shares, or sell
      shares bought that way?
  - input: s2.iso_vested
    order: 146
    seq: 6
    group: "other_pay"
    tick: "Shares bought before 2025 with incentive stock options that vested in 2025"
    help: "This is shares bought early, before they vested, that vested on schedule in 2025. If you chose, within 30 days of buying them, to count them for the alternative minimum tax then, answer No. A Yes ends the interview here."
    prompt: Did shares you (or, on a joint return, your spouse) bought before 2025 with incentive stock options (ISOs) vest
      in 2025?
  - input: s2.iso
    order: 146
    seq: 12
    help: "The employer sends Form 3921 for shares bought with an ISO. Other options do not count. The alternative minimum tax then has to be figured (Form 6251). A Yes ends the interview here."
    prompt: Did you (or, on a joint return, your spouse) buy shares in 2025 with incentive stock options (ISOs) and still
      hold any of them at the end of 2025?
  - input: s2.household_help
    order: 155
    seq: 3
    group: "care_help"
    tick: "Someone you paid to work in your home: a nanny, housekeeper, gardener"
    help: Count anyone you paid yourself, whatever the amount. Do not count a company you hired, such as a cleaning service
      or a daycare center.
    prompt: In 2025, did you (or, on a joint return, your spouse) pay anyone to work in or around your home, such as a nanny,
      a carer, a housekeeper or a gardener?
  - input: s2.household_employee
    order: 155
    seq: 4
    help: "Count only people who work as you direct them, not people who run their own business. Do not count pay to a student who was under 18 in 2025. A Yes means household employment taxes (Schedule H). A Yes ends the interview here."
    prompt: Did you pay any one of them $2,800 or more in 2025, or all of them together $1,000 or more in any calendar quarter
      of 2024 or 2025, or hold back income tax from their pay?
  - input: s2.hsa_testing
    order: 193
    seq: 3
    group: rare_accounts
    tick: Over-contributed to an HSA for 2024, with no HSA in 2025
    help: The full yearly amount, or a transfer from an IRA, was allowed for 2024 only if the health plan was kept through 2025
      (the “last-month rule”). A return with this is outside what this tool prepares; a Yes ends the interview here.
    prompt: Did you (or, on a joint return, your spouse) have a health savings account in 2024 but not in 2025, and put more
      into it for 2024 than your months in a qualifying health plan allowed?
  - input: s2.mortgage_subsidy
    order: 200
    seq: 25
    help: These are first-time buyer loans paid for with mortgage bonds, and loans with a mortgage credit certificate. Part
      of the subsidy may have to be paid back (Form 8828). A return with this is outside what this tool prepares; a Yes ends
      the interview here.
    prompt: In 2025, did you (or, on a joint return, your spouse) sell or give away a home bought with a subsidized loan from
      a state or local housing agency?
  - input: s2.lookback
    order: 267
    seq: 1
    help: Interest may then be owed or refunded (Form 8697). Yes also for a film, book or similar property depreciated by
      its forecast income (Form 8866). If neither is familiar, answer No. A return with this is outside what this tool prepares;
      a Yes ends the interview here.
