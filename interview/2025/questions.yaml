    seq: 15
    help: Choose the first answer if on December 1 you were enrolled in Medicare, had other health coverage that pays
      medical bills, or could be claimed as a dependent. Choose the third if you were on someone else's HSA-qualifying family plan, if you had
      both kinds of plan at once, or if you were married, both of you qualified for an HSA that day, and either of you had a plan covering more than one person.
    prompt: For this person (you, or your spouse on a joint return) — What did you have on December 1, 2025?
    value_labels:
      none: No HSA-qualifying coverage that day
      self_only: An HSA-qualifying plan covering one person only
      family: An HSA-qualifying plan covering more than one person
  - input: f8889.last_month
    order: 9
    seq: 16
    help: This is the “last-month rule”. It lets you put in the full yearly amount for the coverage you had on December 1
