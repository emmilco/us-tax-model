  - input: f8960.allocated_taxes
    order: 10
    help: The part of the state and local income and property taxes you deduct on Schedule A that you allocate to net
      investment income by a reasonable method (Form 8960 line 9b), leaving out foreign taxes you take a credit for.
      Used only if you itemize; it cannot exceed the Schedule A tax deduction. Zero if none.
  - input: ftc.taxes
    order: 10
    help: Foreign income taxes you (or, on a joint return, your spouse) paid, after any required reductions. Usually the total of Form 1099-INT box 6 and Form
