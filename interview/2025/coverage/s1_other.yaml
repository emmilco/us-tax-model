    proceeds: {"f8853c[mom].line17": 16060000}
- id: s1o.inmate_amount
  design: scout-s1-other 3.5, line 8u, refused by s1.line8_other (computing it waits for the W-2 part of the pay to be asked; see TASKS.md)
  situation: A person was paid $800 in 2025 for work done while in prison.
  answers:
    "s1.inmate_wages": true
  expect:
    refused: s1.line8_other
- id: s1o.fiduciary_fees
  design: scout-s1-other 3.2, a new line 8z kind computed
  situation: A person was paid $2,500 for acting as executor of a friend's estate.
  answers:
    "$oi8z": [fees]
    "oi8z[fees].kind": fiduciary_fees
    "oi8z[fees].amount": 250000
  expect:
    proceeds: {"oi8z[fees].amount": 250000}
- id: s1o.damages_injury
  design: scout-s1-other 3.2, residual refusal oi8z.injury
  situation: A person received a settlement, partly punitive damages, in a case about a car accident injury.
  answers:
    "$oi8z": [award]
    "oi8z[award].kind": taxable_damages
    "oi8z[award].amount": 500000
    "oi8z[award].injury": true
  expect:
    refused: oi8z[award].injury_if_damages
