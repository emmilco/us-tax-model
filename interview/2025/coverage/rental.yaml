tax_year: 2025
part: Rental real estate and royalties (Schedule E Part I, Form 8582)
profile: full
sets:
  one_w2:
    says: A person with one job and one Form W-2.
    answers:
      $w2@person[taxpayer]:
      - job
      person[taxpayer].w2[job].box1: 5200000
      person[taxpayer].w2[job].box2: 520000
      person[taxpayer].w2[job].box4: 322400
      person[taxpayer].w2[job].box5: 5200000
      person[taxpayer].w2[job].box6: 75400
      s2.w2_marks: false
      s1.nqdc_pension: false
      scope.w2_marks: false
      scope.artist_official: false
      scope.excess_deferral: false
  rents_house:
    says: 'Rents out one house all year: rent $18,000, mortgage interest $6,000, property tax $2,400, the building ($160,000)
      placed in service February 2020.'
    answers:
      scope.rental: true
      scope.rent_personal: false
      $rental:
      - house
      rental[house].kind: sfr
      rental[house].days_fair: 365
      rental[house].personal_any: false
      rental[house].short_stays: false
      rental[house].services: false
      rental[house].under_tenth: false
      rental[house].not_for_profit: false
      rental[house].depletion: false
      rental[house].part_home: false
      rental[house].active: true
      rental[house].rents: 1800000
      rental[house].has_mortgage: true
      rental[house].has_other_interest: false
      rental[house].has_taxes: true
      rental[house].has_insurance: false
      rental[house].has_management: false
      rental[house].has_commissions: false
      rental[house].has_repairs: false
      rental[house].has_cleaning: false
      rental[house].has_utilities: false
      rental[house].has_supplies: false
      rental[house].has_advertising: false
      rental[house].has_legal: false
      rental[house].has_other: false
      rental[house].vehicle: false
      rental[house].amt12: 600000
      rental[house].amt16: 240000
      rental[house].prior_any: false
      $rprop@rental[house]:
      - bldg
      rental[house].rprop[bldg].kind: residential
      rental[house].rprop[bldg].month: m2
      rental[house].rprop[bldg].year: y2020
      rental[house].rprop[bldg].basis: 16000000
      rental[house].rprop[bldg].screen: false
      $royalty: []
      sche.re_pro: false
      sche.grouped: false
      sche.qbi_business: false
  royalty_only:
    says: Has no rental; lists one royalty; no Schedule E return-level items.
    answers:
      scope.rental: true
      scope.rent_personal: false
      $rental: []
      sche.re_pro: false
      sche.grouped: false
      sche.qbi_business: false
rows:
- id: rental.house_computed
  design: scout-schedule-e.md §4 (lane x1-sche)
  situation: A person with one job rents out a house all year with a mortgage, property tax and the building depreciated;
    the return is completed.
  uses:
  - one_w2
  - rents_house
  answers: {}
  expect:
    proceeds:
      scope.rental: true
      rental[house].rents: 1800000
- id: rental.excluded_home
  design: scout-schedule-e.md §4 (lane x1-sche)
  situation: A person rents her own home for 10 days around a big event and lives there the rest of the year; nothing is reported
    and the return is completed.
  uses:
  - one_w2
  - rents_house
  answers:
    rental[house].days_fair: 10
    rental[house].personal_any: true
    rental[house].days_personal: 300
    rental[house].days_overlap: 0
  expect:
    proceeds:
      rental[house].days_fair: 10
- id: rental.personal_not_home
  design: scout-schedule-e.md §4 (lane x1-sche)
  situation: A person rents a vacation cabin 200 days and uses it 10 days himself; the expenses are divided and the return
