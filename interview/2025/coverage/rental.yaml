- id: rental.house_computed
  design: scout-schedule-e.md §4 (lane x1-sche)
  situation: A person with one job rents out a house all year with a mortgage, property tax and the building depreciated;
    the return is completed.
  uses:
  - one_w2
  - rents_house
  answers: {}
  expect:
    proceeds:
