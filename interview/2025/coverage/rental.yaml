      - bldg
      rental[house].rprop[bldg].kind: residential
      rental[house].rprop[bldg].month: m2
      rental[house].rprop[bldg].year: y2020
      rental[house].rprop[bldg].basis: 16000000
      rental[house].rprop[bldg].disposed: false
      rental[house].rprop[bldg].fast: false
      rental[house].rprop[bldg].ads: false
      rental[house].rprop[bldg].basis_changed: false
      rental[house].rprop[bldg].credit: false
