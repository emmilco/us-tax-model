      rental[house].land_heavy: false
      rental[house].active: true
      rental[house].rents: 1800000
      rental[house].has_mortgage: true
      rental[house].has_other_interest: false
      rental[house].has_taxes: true
      rental[house].has_insurance: false
      rental[house].has_management: false
      rental[house].has_commissions: false
      rental[house].has_repairs: false
      rental[house].has_cleaning: false
      rental[house].has_utilities: false
      rental[house].has_supplies: false
      rental[house].has_advertising: false
      rental[house].has_legal: false
      rental[house].mortgage_excess: false
