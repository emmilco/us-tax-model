tax_year: 2025
part: Other money received, other taxes and the rare situations
profile: full
sets:
  won:
    says: A person who won something in 2025.
    answers:
      s1.winnings_any: true
  options:
    says: A person who used employer stock options in 2025, or sold shares bought with them.
    answers:
      s2.options_any: true
  one_w2:
    says: A person with one job and one Form W-2.
    answers:
      $w2@person[taxpayer]: [job]
      person[taxpayer].w2[job].box1: 5200000
      person[taxpayer].w2[job].box2: 520000
      person[taxpayer].w2[job].box4: 322400
      person[taxpayer].w2[job].box5: 5200000
      person[taxpayer].w2[job].box6: 75400
rows:
- id: other.iso_kept
  design: s2.amt, incentive stock options (Form 6251 line 2i)
  situation: A person bought shares with incentive stock options in 2025 and still holds them.
  uses: [options]
  answers:
    s2.iso: true
  expect:
    refused: s2.amt
- id: other.iso_vested_2025
  design: s2.amt, incentive stock option shares that vest in 2025 (Form 6251 line 2i; BUG-0643)
  situation: A person bought shares early with incentive stock options in 2024; they vested in 2025, and nothing was bought or sold in 2025.
  answers:
    s2.options_any: false
    s2.iso_vested: true
  expect:
    refused: s2.amt
