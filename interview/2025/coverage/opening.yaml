# Coverage rows: situations the interview is known to handle, checked by walking the built interview
# (engine/src/interview-coverage.ts; interview/README.md, "Coverage rows"). No model is called.
#
# A row: the situation in one plain sentence, the answers a filer in it gives (by the question's exact id, as the
# answer log has it) and the end the walk must come to. Every question the row does not answer is answered by the
# background return, which answers only the kinds of question a filer with nothing to report is asked.
tax_year: 2025
part: The opening (who the return is for, and the filing status)
profile: full
rows:
  - id: opening.couple
    design: C.1 row 1 (married, filing together)
    situation: A married couple puts both incomes on one return and is not asked for a filing status or whose entry is whose.
    answers:
      $person: [taxpayer, spouse]
    expect:
      records:
        f1040.status: mfj
        person[taxpayer].role: taxpayer
        person[spouse].role: spouse
      not_asked: [f1040.status]
  - id: opening.couple_spouse_died
    design: C.1 row 2 (filing together, spouse died in 2025)
    situation: A person whose husband or wife died during 2025 files one return for the two of them.
    answers:
      $person: [taxpayer, spouse]
      household.married_dec31: false
      household.spouse_died_this_year: true
    expect:
      proceeds:
        f1040.status: mfj
        household.spouse_died_this_year: true
  - id: opening.pair_not_married
    design: C.1 row 3 (filing together, not married, no death)
    situation: Two people who are not married to each other choose one return together.
    answers:
      $person: [taxpayer, spouse]
      household.married_dec31: false
      household.spouse_died_this_year: false
    expect:
      refused: household.filing_status_conflict
  - id: opening.separate
    design: C.1 row 4 (married, filing a separate return)
    situation: A married person files a return apart from their husband or wife.
    answers:
      $person: [taxpayer]
      f1040.status: mfs
      household.married_dec31: true
      household.community_property: false
      sa.spouse_itemizes: false
      sa.spouse_extra: false
    expect:
      proceeds:
        f1040.status: mfs
  - id: opening.living_apart_parent
    design: C.1 row 5 (married, living apart, child at home; may be head of household)
    situation: A married parent who lives apart from their husband or wife picks the line about paying for a home, says they were married at the end of the year, and is asked whether they count as unmarried.
    answers:
      $person: [taxpayer]
      f1040.status: hoh
      household.ever_married: true
      household.married_dec31: true
      household.spouse_died_this_year: false
    expect:
      asks: household.considered_unmarried
  - id: opening.unmarried_with_child
    design: C.1 row 6 (unmarried with a child or supported relative)
    situation: A person who has never been married and pays for the home of their child picks the line about a home, and is asked about the cost of the home without being asked whether they were married or unmarried.
    answers:
      $person: [taxpayer]
      f1040.status: hoh
      household.ever_married: false
    expect:
      asks: household.home_cost
      not_asked: [household.married_dec31, household.spouse_died_this_year, household.considered_unmarried]
  - id: opening.widowed_with_child
    design: C.1 row 7 (widowed in 2023 or 2024 with a child)
    situation: A person widowed in 2023 or 2024 whose child lives with them picks that line and is asked its five tests.
    answers:
      $person: [taxpayer]
      f1040.status: qss
    expect:
      asks: household.qss_eligible
  - id: opening.single
    design: C.1 row 8 (unmarried, none of these)
    situation: A person who has never been married, with no child or supported relative, takes the last line and files as single after one question about marriage.
    answers:
      $person: [taxpayer]
      f1040.status: single
      household.ever_married: false
    expect:
      not_asked: [household.married_dec31, household.spouse_died_this_year]
      proceeds:
        f1040.status: single
        person[taxpayer].role: taxpayer
  - id: opening.married_picks_single
    design: C.1 row 9 (married, picks "None of these")
    situation: A married person takes the line that says they were not married, then says they were married at the end of 2025.
    answers:
      $person: [taxpayer]
      f1040.status: single
      household.ever_married: true
      household.married_dec31: true
    expect:
      refused: household.filing_status_conflict
  - id: opening.widowed_this_year_alone
    design: C.1 row 10 (spouse died in 2025, filing alone)
    situation: A person whose husband or wife died during 2025 files for themselves alone as single.
    answers:
      $person: [taxpayer]
      f1040.status: single
      household.ever_married: true
      household.married_dec31: false
      household.spouse_died_this_year: true
    expect:
      refused: household.widowed_this_year
  - id: opening.birth_year_after_tax_year
    design: DECISIONS.md item 2 (a birth year is range-checked; the upper bound)
    situation: A person types a year of birth after 2025.
    answers:
      person[taxpayer].birth_year: 2026
    expect:
      refused: household.birth_year_bad
  - id: opening.birth_year_too_early
    design: DECISIONS.md item 2 (a birth year is range-checked; the lower bound)
    situation: A person types a year of birth more than 125 years before 2025.
    answers:
      person[taxpayer].birth_year: 1899
    expect:
      refused: household.birth_year_bad
  - id: opening.birth_year_latest_accepted
    design: DECISIONS.md item 2 (the upper bound itself is accepted)
    situation: A person born in 2025 is not refused for the year of birth; the walk ends at the refusal of a filer under 16.
    answers:
      person[taxpayer].birth_year: 2025
    expect:
      refused: household.filer_under16
  - id: opening.birth_year_earliest_accepted
    design: DECISIONS.md item 2 (the lower bound itself is accepted)
    situation: A person born in 1900, with nothing else to report.
    answers:
      person[taxpayer].birth_year: 1900
      person[taxpayer].work_ssn: true
      person[taxpayer].rmd_missed: false
      s3.elderly_credit: false
    expect:
      proceeds: {"person[taxpayer].birth_year": 1900}
