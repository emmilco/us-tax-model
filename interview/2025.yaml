interview:
  tax_year: 2025
  targets:
    - f1040.line31
  initial:
    $person:
      - taxpayer
  cite: &a1
    doc: i1040gi
    locator: p. 117, Schedule 3 line 11
  questions:
    - input: f1040.status
      prompt: Form 1040, Filing Status checkboxes
      help: Read f1040, Form 1040, Filing Status. Enter cents for money. Enter null if
        you do not know; it never becomes zero.
      order: 0
      cite:
        doc: f1040
        locator: Form 1040, Filing Status
    - input: person.rrta
      prompt: Do any wage statements report railroad retirement compensation or taxes
        (W-2 box 14)?
      help: "Read iw2w3, pp. 12–13, Railroad employers: RRTA compensation and taxes in
        box 14; boxes 3–7 are not used for RRTA. Enter cents for money. Enter
        null if you do not know; it never becomes zero."
      order: 1
      cite:
        doc: iw2w3
        locator: "pp. 12–13, Railroad employers: RRTA compensation and taxes in box 14;
          boxes 3–7 are not used for RRTA"
    - input: w2.box3
      prompt: Social security wages
      help: Read iw2w3, p. 18, boxes 3, 4 and 7. Enter cents for money. Enter null if
        you do not know; it never becomes zero.
      order: 4
      cite:
        doc: iw2w3
        locator: p. 18, boxes 3, 4 and 7
    - input: w2.box7
      prompt: Social security tips
      help: Read iw2w3, p. 18, boxes 3, 4 and 7. Enter cents for money. Enter null if
        you do not know; it never becomes zero.
      order: 4
      cite:
        doc: iw2w3
        locator: p. 18, boxes 3, 4 and 7
    - input: w2.box4
      prompt: Social security tax withheld
      help: Read iw2w3, p. 18, boxes 3, 4 and 7. Enter cents for money. Enter null if
        you do not know; it never becomes zero.
      order: 3
      cite:
        doc: iw2w3
        locator: p. 18, boxes 3, 4 and 7
    - input: s3.line9
      prompt: Net premium tax credit from Form 8962 (supplied subtotal; preparation
        outside Stage 2)
      help: Read f1040s3, Schedule 3 (2025), line 9. Enter cents for money. Enter null
        if you do not know; it never becomes zero.
      order: 10
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 9
    - input: s3.line10
      prompt: Amount paid with request for extension to file
      help: Read f1040s3, Schedule 3 (2025), line 10. Enter cents for money. Enter
        null if you do not know; it never becomes zero.
      order: 10
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 10
    - input: s3.line12
      prompt: Credit for federal tax on fuels from Form 4136 (supplied subtotal;
        preparation outside Stage 2)
      help: Read f1040s3, Schedule 3 (2025), line 12. Enter cents for money. Enter
        null if you do not know; it never becomes zero.
      order: 10
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 12
    - input: s3.line14
      prompt: Total other payments or refundable credits (supplied subtotal;
        preparation outside Stage 2)
      help: Read f1040s3, Schedule 3 (2025), line 14. Enter cents for money. Enter
        null if you do not know; it never becomes zero.
      order: 10
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 14
    - input: $w2
      prompt: List distinct employer keys for this person after checking all W-2s. Use
        one entry per actual employer, consolidating repeated forms explicitly.
        [] confirms none.
      help: Use stable local labels such as employer_a. This is a complete roster, not
        a count of W-2 sheets. Check employer identity in W-2 boxes b and c.
      order: 2
      cite: *a1
