  # ---- The ladder's starred situations ----
  religious_work:
    label: Work for a church or religious organization, or as clergy
    theme: work_pay
    refs: [ladder 21]
    share: 0.01
    range: [0.004, 0.02]
    source:
      kind: judgment
      reasoning: Clergy number a few hundred thousand and employees of religious organizations perhaps 1 to 2 million (BLS, recalled), about 1% of returns.
  noncitizen:
    label: Citizen of another country without a green card
    theme: foreign
    refs: [ladder 22]
    share: 0.035
    range: [0.02, 0.06]
    source:
      kind: judgment
      reasoning: Noncitizens without lawful permanent residence (temporary visa holders, refugees and asylees awaiting adjustment, the undocumented) number about 15 to 20 million people (DHS and Census, recalled); returns filed with ITINs alone are about 4 million. About 3.5%.
  abroad_or_territory:
    label: Lived or worked outside the 50 states and DC, including Puerto Rico and other territories
    theme: foreign
    refs: [ladder 23]
    share: 0.01
    range: [0.0027, 0.02]
    source:
      kind: judgment
      reasoning: The foreign earned income exclusion (0.27% of returns) counts only part of US citizens abroad (several hundred thousand returns more claim the foreign tax credit or no exclusion), and territory residents with federal returns add a few hundred thousand.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 89, header: "Foreign-earned income exclusion", returns: 432724}
  casualty:
    label: Property damaged, destroyed or stolen
    theme: home_vehicle
    refs: [ladder 24]
    share: 0.02
    range: [0.002, 0.08]
    source:
      kind: judgment
      reasoning: Deducted casualty losses are a few thousand returns (disaster losses 0.007%), but the question as worded draws yes from anyone with a damaged car or a burglary, perhaps several percent; scoped to federally declared disasters it is well under 1%.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 133, header: "Disaster loss deduction", returns: 10848}
    note: Wording-sensitive; below the cut at any reasonable wording.
  savings_accounts:
    label: A 529, Coverdell, ABLE or medical savings account
    refs: [ladder 25]
    share: 0.06
    range: [0.04, 0.10]
    source:
      kind: judgment
      reasoning: About 16 million 529 accounts (ISS Market Intelligence, recalled), several per family in many cases, so perhaps 8 to 10 million owner returns; ABLE, Coverdell and Archer MSAs add little.
  ira_owner:
    label: Owns an IRA, including an inherited one
    refs: [ladder 26]
    share: 0.33
    range: [0.25, 0.40]
    source:
      kind: judgment
      reasoning: About 4 in 10 US households own an IRA (ICI, recalled); per return, with single filers, about a third.
  equity_comp_or_amt:
    label: Stock compensation from an employer, or alternative minimum tax on an earlier return
    refs: [ladder 27]
    share: 0.05
    range: [0.025, 0.10]
    source:
      kind: judgment
      reasoning: Employee stock purchase plan participants and holders of restricted stock units and options number perhaps 8 to 15 million (NCEO, recalled); AMT on an earlier return (0.09% in 2023, 0.07% with a prior-year minimum tax credit) adds little.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 143, header: "Alternative minimum tax", returns: 150167}
        - {file: soi-23in33ar, table: "Table 3.3", column: 22, header: "Prior-year minimum tax credit", returns: 113755}
  household_employer:
