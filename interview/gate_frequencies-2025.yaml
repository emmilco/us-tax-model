# How often each candidate gate situation applies: the share of ALL individual returns that would answer
# yes. Read by the "Rare-situation pages" rule of docs/2026-11-06_formal_gates_design.md: gates answered
# yes by fewer filers than the cut (a fixed 5%, owner decision 2026-11-07) go on themed grids at the end.
# Checked and rendered to reports/2025/gate_frequencies.md by tools/coverage/gate_frequencies.py; its --recompute
# (engines interpreter) re-reads every IRS cell and microdata share recorded here.
#
# Each situation: label; refs (where it is a candidate: the applicability survey's A/B gates
# (research/audits/2026-11-06_applicability_survey.md), an input asked directly today, or the top-level
# number in the ladder proposal, `git show 204cc77:docs/2026-11-06_question_ladder_proposal.md`); share
# (central estimate) and range [low, high]; source (kind soi, microdata or judgment); note; and, below
# the cut, theme (one of `themes`, the proposed grid).
#
# IRS counts are tax year 2023 (Publication 1304 tables archived in sources/2025/), as in the coverage
# estimate; 2025 shares are assumed similar unless a note says why not. An IRS count is of returns
# reporting an amount. Where more filers would honestly answer the question yes (a state refund that is
# not taxable, small gambling winnings, tuition paid without a credit) the entry is a judgment bounded by
# that count. Figures in a judgment's reasoning that come from outside the archive (Census, CDC, DoD,
# industry counts) are recalled, not archived or re-read, and are stated as approximate.
tax_year_counts: 2023
total_returns: {file: soi-23in12ms, table: "Table 1.2", column: 1, header: "All returns / Number of returns", returns: 160602107}
cut:
  share: 0.05
  source: owner decision 2026-11-07
  note: Situations whose share is below the cut go on the rare-situation grids, by theme, at most max_rows rows per grid.
max_rows: 8
# The themes are a proposal for the owner; each situation below the cut names one.
themes:
  work_pay: Work and pay
  other_income: Other income and repayments
  business_farm: Business and farm
  family_household: Family and household
  investments: Investments
  home_vehicle: Home, vehicle and property
  foreign: Foreign and outside the United States
  other: Payments and other screens
situations:

  # ---- Who is on the return (direct questions asked of everyone today) ----
  married:
    label: Married at the end of 2025
    refs: [household.married]
    share: 0.3656
    range: [0.3656, 0.39]
    source:
      kind: soi
      combine: sum
      cells:
        - {file: soi-23in12ms, table: "Table 1.2", column: 13, header: "married persons filing jointly", returns: 54568939}
        - {file: soi-23in12ms, table: "Table 1.2", column: 25, header: "married persons filing separately", returns: 4139858}
    note: Joint (with qualifying surviving spouses) plus separate returns. Married people filing as head of household (living apart) answer yes too, so the share is a floor.
  age65:
    label: You or your spouse 65 or older
    refs: [person.age65]
    share: 0.1944
    range: [0.1944, 0.22]
    source:
      kind: soi
      combine: single
      cells:
        - {file: soi-23in16ag, table: "Table 1.6", column: 1, header: "All returns", row: "65 and over", returns: 31217324}
    note: Age of the primary taxpayer only (the table's note 1); a joint return with only the spouse 65 or older adds a little.
  community_property:
    label: Lived in a community-property state
    refs: [household.community_property]
    share: 0.2335
    range: [0.2335, 0.31]
    source:
      kind: microdata
      dataset: populace_us_2024
      predicate: {state_fips: [4, 6, 16, 22, 32, 35, 48, 53, 55]}
      microdata_share: 0.2335
    note: Arizona, California, Idaho, Louisiana, Nevada, New Mexico, Texas, Washington and Wisconsin. Asked of everyone today though it matters only for married filers and head of household. By resident population these states hold about 31% of the US (Census, recalled), above the microdata's 23%; the range spans both.
  dependent_filer:
    label: You can be claimed as a dependent on someone else's return
    theme: family_household
    refs: [sa.dependent]
    share: 0.0469
    range: [0.0469, 0.055]
    source:
      kind: soi
      combine: single
      cells:
        - {file: soi-23in17dp, table: "Table 1.7", column: 1, header: "Number of returns", returns: 7525664}
    note: Returns marked as dependent returns. A filer who could be claimed but is not (and so does not mark it) also answers yes; the table cannot show them.
  spouse_died:
    label: Spouse died in 2025
    theme: family_household
    refs: [household.spouse_died_2025]
    share: 0.006
    range: [0.004, 0.008]
    source:
      kind: judgment
      reasoning: About 3.1 million US deaths a year (CDC, recalled), roughly a third of them of married people, leave about 1 million surviving spouses, about 0.6% of returns.
  blind:
    label: You or your spouse blind
    theme: family_household
    refs: [person.blind]
    share: 0.004
    range: [0.002, 0.01]
    source:
      kind: judgment
      reasoning: Legal blindness affects roughly 1 million US adults (recalled, CDC/NEI order of magnitude); about 0.4% of returns after joint returns. The microdata's is_blind (3.0% of filing units, any member) measures a broader vision-disability question and was not used.
  filer_under16:
    label: You or your spouse under 16
    theme: family_household
    refs: [person.under16]
    share: 0.005
    range: [0.002, 0.0112]
    source:
      kind: judgment
      reasoning: Primary taxpayers under 18 are 1.1% of returns (Table 1.6); those under 16 are a part of them, taken as about half.
      bounds:
        - {file: soi-23in16ag, table: "Table 1.6", column: 1, header: "All returns", row: "Under 18", returns: 1803861}

  # ---- Scope screens (complements asked of everyone today) ----
  scope_credits:
    label: Credits this tool does not figure
    theme: other
    refs: [scope.credits]
    share: 0.012
    range: [0.0091, 0.02]
    source:
      kind: judgment
      reasoning: Other nonrefundable credits (general business, adoption, clean vehicle, elderly, mortgage interest and others) are 0.9% of returns; the screen also lists refundable credits and credits outside that total, so a little more.
      bounds:
        - {file: soi-23in33ar, table: "Table 3.3", column: 18, header: "Other nonrefundable credits / Total", returns: 1467567}
  scope_other_income:
    label: Income or return treatment outside what the tool handles (wages not on a W-2 and others)
    theme: other_income
    refs: [scope.other_income]
    share: 0.015
    range: [0.0079, 0.03]
    source:
      kind: judgment
      reasoning: The countable parts (other earned income, household employee wages not on a W-2, taxable dependent care benefits, tips not on a W-2, Form 8919 wages) are 0.8% at the largest and 1.4% summed; the screen lists further treatments with no count.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 17, header: "Other earned income", returns: 1267621}
        - {file: soi-23in14ar, table: "Table 1.4", column: 9, header: "Household employee wages", returns: 404554}
        - {file: soi-23in14ar, table: "Table 1.4", column: 13, header: "Taxable dependent care benefits", returns: 431865}
        - {file: soi-23in14ar, table: "Table 1.4", column: 11, header: "Tip income not reported", returns: 106786}
        - {file: soi-23in14ar, table: "Table 1.4", column: 15, header: "Wages from Form 8919", returns: 55403}
  scope_other_line16:
    label: Additional line 16 taxes (Forms 8814, 4972, 8615 and others)
    theme: other
    refs: [scope.other_line16]
    share: 0.002
    range: [0.0014, 0.005]
    source:
      kind: judgment
      reasoning: The kiddie tax (Form 8615) alone is 0.14% of returns (dependent returns with it, Table 1.7); Forms 8814 and 4972 add a little.
      bounds:
        - {file: soi-23in17dp, table: "Table 1.7", column: 35, header: "kiddie tax", returns: 228992}
  scope_schedule1:
    label: Schedule 1 items asked by one screen (rental, partnership or S corporation, estate, farm, other income, NOL, Form 4797)
    refs: [scope.schedule1]
    share: 0.1200
    range: [0.0594, 0.15]
    source:
      kind: microdata
      dataset: populace_us_2024
      predicate: {nonzero: [rental_income, partnership_s_corp_income, estate_income, farm_income, miscellaneous_income]}
      microdata_share: 0.1200
    note: The union of the coverage estimate's categories behind this screen, each raked to its IRS count; NOL and Form 4797 (no microdata variable, 0.6% and 1.1% alone) are left out, so the share is a floor.

  # ---- Income: the ladder's common topics ----
  wages:
    label: Work as an employee, or any Form W-2
    refs: [ladder 1, "$w2"]
    share: 0.7869
    range: [0.7869, 0.80]
    source:
      kind: soi
      combine: single
      cells:
        - {file: soi-23in14ar, table: "Table 1.4", column: 7, header: "Total from Form W-2 wages", returns: 126376015}
  workplace_plan:
    label: Contributed to a retirement plan through work (401(k), 403(b), 457, TSP)
    refs: [ladder 1b, w2.box12_any]
    share: 0.35
    range: [0.25, 0.45]
    source:
      kind: judgment
      reasoning: About half of private-sector workers participate in an employer plan (BLS National Compensation Survey, recalled) and nearly all public employees; with W-2 wages on 79% of returns that is roughly 35% of returns. The microdata's 401(k) contribution variables flag 30% but identically for traditional, Roth and IRA contributions, so they were not used. Each W-2's box 12 question (w2.box12_any) is yes for still more returns, since code DD (employer health coverage) is common.
  interest:
    label: Interest received
    refs: [ladder 2, "$interest"]
    share: 0.3441
    range: [0.3441, 0.39]
    source:
      kind: soi
      combine: max
      cells:
        - {file: soi-23in14ar, table: "Table 1.4", column: 19, header: "Taxable interest", returns: 55260238}
        - {file: soi-23in14ar, table: "Table 1.4", column: 21, header: "Tax-exempt interest", returns: 6893860}
    note: The larger of taxable and tax-exempt interest; the high end adds them.
  dividends:
    label: Dividends or fund distributions, with or without a form
    refs: [survey B-1, ladder 3]
    share: 0.2100
    range: [0.2100, 0.23]
    source:
      kind: soi
      combine: max
      cells:
        - {file: soi-23in14ar, table: "Table 1.4", column: 23, header: "Ordinary dividends", returns: 33718460}
        - {file: soi-23in14ar, table: "Table 1.4", column: 35, header: "Capital gain distributions reported on Form 1040", returns: 3209131}
    note: The high end adds capital gain distributions reported directly on Form 1040.
  retirement_distributions:
    label: Pension, annuity, retirement-plan or IRA distributions (any Form 1099-R)
    refs: [ladder 4, "$retirement"]
    share: 0.2357
    range: [0.2026, 0.31]
    source:
      kind: microdata
      dataset: populace_us_2024
      predicate: {positive: [pension_income, taxable_ira_distributions, tax_exempt_ira_distributions]}
      microdata_share: 0.2357
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 47, header: "Pensions and annuities", note: "total (column 47), not taxable (column 49)", returns: 32538787}
        - {file: soi-23in14ar, table: "Table 1.4", column: 45, header: "Taxable Individual Retirement Arrangement (IRA) distributions", returns: 16694154}
    note: IRS counts bound the union from 20.3% (pensions alone) to 30.7% (summed). Rollovers and conversions reported on a Form 1099-R also answer yes and are partly outside both counts.
  ira_contributions:
    label: IRA contributions for 2025 (traditional or Roth)
    refs: [ladder 5, person.sav_trad]
    share: 0.08
    range: [0.04, 0.13]
    source:
      kind: judgment
      reasoning: Deducted traditional IRA contributions are 1.6% of returns; nondeductible traditional and Roth contributions appear on no counted line. About one in ten to one in seven US households contributes to an IRA in a year (ICI surveys, recalled), and households are fewer than returns, so about 8%. The microdata's IRA contribution variables flag 30% of filing units, the same units as its 401(k) variables, and were not used. For person.sav_trad alone (traditional IRA only) the share is lower, about 3%.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 123, header: "IRA payments", returns: 2503934}
  social_security:
    label: Social Security or tier 1 railroad benefits
    refs: [ladder 6, ssb.benefits]
    share: 0.1999
    range: [0.1999, 0.21]
    source:
      kind: soi
      combine: single
      cells:
        - {file: soi-23in14ar, table: "Table 1.4", column: 85, header: "Social security benefits / Total", returns: 32104077}
  securities_sales:
    label: Sales or exchanges of stocks, funds, digital assets or other property
    refs: [ladder 7, "$sales"]
    share: 0.13
    range: [0.1145, 0.17]
    source:
      kind: judgment
      reasoning: Returns with a net long-term gain or loss from sales of capital assets (disjoint columns, summed) are 11.4%, a floor on returns with any sale; all returns with Schedule D gain or loss are 16.3%, but that includes returns with only distributions or a carryover. Sales with no net gain or loss, and a home sale whose gain is excluded, also answer yes.
      bounds:
        - {file: soi-23in14acg, table: "Table 1.4A", column: 65, header: "Net long-term gain from sales of capital assets", returns: 8891406}
        - {file: soi-23in14acg, table: "Table 1.4A", column: 67, header: "Net long-term loss from sales of capital assets", returns: 9496262}
        - {file: soi-23in14ar, table: "Table 1.4", column: 37, header: "Taxable net gain", returns: 12392020}
        - {file: soi-23in14ar, table: "Table 1.4", column: 39, header: "Taxable net loss", returns: 13833037}
  unemployment:
    label: Unemployment compensation
    theme: work_pay
    refs: [ladder 8, s1.uc_paid]
    share: 0.0292
    range: [0.0292, 0.035]
    source:
      kind: soi
      combine: single
      cells:
        - {file: soi-23in14ar, table: "Table 1.4", column: 83, header: "Unemployment compensation", returns: 4697502}
  state_refund:
    label: Received a state or local income tax refund, credit or offset
    refs: [ladder 8, refund.received]
    share: 0.40
    range: [0.25, 0.55]
    source:
      kind: judgment
      reasoning: Only refunds that are taxable are counted (1.9% of returns), but everyone who received a refund answers yes. Most of the about 85% of filers in states with an income tax file a state return, and most state returns end in a refund, so about 40%.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 27, header: "State income tax refunds", returns: 3109096}
  business_any:
    label: Business, farm or fishing, rental, royalties or a pass-through
    refs: [ladder 9]
    share: 0.2642
    range: [0.1898, 0.32]
    source:
      kind: microdata
      dataset: populace_us_2024
      predicate: {nonzero: [self_employment_income, rental_income, partnership_s_corp_income, farm_income, estate_income]}
      microdata_share: 0.2642
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 31, header: "Business or profession / Net income", returns: 21411713}
        - {file: soi-23in14ar, table: "Table 1.4", column: 33, header: "Business or profession / Net loss", returns: 9067174}
    note: Each part raked to its IRS count; the ladder also asks "in any earlier year" (carryovers), which adds a little.
  self_employment:
    label: Operated a business or practised a profession for yourself (Schedule C)
    refs: [ladder 9a, "$sc"]
    share: 0.1898
    range: [0.1898, 0.21]
    source:
      kind: soi
      combine: sum
      cells:
        - {file: soi-23in14ar, table: "Table 1.4", column: 31, header: "Business or profession / Net income", returns: 21411713}
        - {file: soi-23in14ar, table: "Table 1.4", column: 33, header: "Business or profession / Net loss", returns: 9067174}
    note: Net income and net loss are disjoint, so their sum counts returns with a Schedule C.
  schedule_e:
    label: Rental property, royalties, or a share of a partnership, S corporation, estate or trust
    refs: [ladder 9b, scope.schedule1]
    share: 0.10
    range: [0.0594, 0.14]
    source:
      kind: judgment
      reasoning: Rental and royalty returns are 5.9%, partnership 3.3%, S corporation 3.5%, estate and trust 0.4%; summed 13.2%. They overlap (the same filers often hold several), so about 10%.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 63, header: "Total rental and royalty / Net income", returns: 6346357}
        - {file: soi-23in14ar, table: "Table 1.4", column: 65, header: "Total rental and royalty / Net loss", returns: 3196282}
        - {file: soi-23in14ar, table: "Table 1.4", column: 67, header: "Partnership / Net income", returns: 3266345}
        - {file: soi-23in14ar, table: "Table 1.4", column: 69, header: "Partnership / Net loss", returns: 2103634}
        - {file: soi-23in14ar, table: "Table 1.4", column: 71, header: "S corporation / Net income", returns: 4138040}
        - {file: soi-23in14ar, table: "Table 1.4", column: 73, header: "S corporation / Net loss", returns: 1415974}
        - {file: soi-23in14ar, table: "Table 1.4", column: 75, header: "Estate and trust / Net income", returns: 648583}
        - {file: soi-23in14ar, table: "Table 1.4", column: 77, header: "Estate and trust / Net loss", returns: 36592}
  farm:
    label: Farm or fishing income, or a Form 1099-PATR
    theme: business_farm
    refs: [ladder 9c]
    share: 0.012
    range: [0.0109, 0.015]
    source:
      kind: judgment
      reasoning: Schedule F returns (net income plus net loss, disjoint) are 1.09%; cooperative patrons without a farm and fishing on Schedule C add a little.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 79, header: "Farm / Net income", returns: 484162}
        - {file: soi-23in14ar, table: "Table 1.4", column: 81, header: "Farm / Net loss", returns: 1258869}
  business_carryovers:
    label: A business, farm or rental loss or deduction carried into 2025 (section 179, QBI loss, NOL)
    theme: business_farm
    refs: [ladder 9d, survey B-5, s179.line10, qbi.carryforward]
    share: 0.012
    range: [0.0063, 0.025]
    source:
      kind: judgment
      reasoning: Net operating loss returns alone are 0.63%; section 179 and QBI loss carryforwards have no count and mostly fall on the same business owners.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 95, header: "Net operating loss", returns: 1019019}

  # ---- Family, health, education, home ----
  dependents:
    label: Dependents (children or others you claim)
    refs: [ladder 10, "$dependent"]
    share: 0.2937
    range: [0.2425, 0.36]
    source:
      kind: microdata
      dataset: populace_us_2024
      predicate: {positive: [tax_unit_count_dependents]}
      microdata_share: 0.2937
      bounds:
        - {file: soi-23in33ar, table: "Table 3.3", column: 12, header: "Nonrefundable child and other dependent tax credit", returns: 38949527}
    note: The child and other dependent credit alone (nonrefundable part) is on 24.3% of returns, a floor.
  care_expenses:
    label: Paid for care of a child or dependent so you could work
    theme: family_household
    refs: [ladder 10, f2441.care]
    share: 0.045
    range: [0.0356, 0.07]
    source:
      kind: judgment
      reasoning: The child and dependent care credit is claimed on 3.6% of returns; filers who paid care but take the employer exclusion instead, or whose credit is zero, also answer yes.
      bounds:
        - {file: soi-23in33ar, table: "Table 3.3", column: 6, header: "Credit for child and dependent care", returns: 5720294}
  dependent_care_benefits:
    label: Dependent care benefits from an employer (W-2 box 10)
    theme: family_household
    refs: [f2441.benefits]
    share: 0.012
    range: [0.0027, 0.025]
    source:
      kind: judgment
      reasoning: Taxable dependent care benefits are on 0.27% of returns; most benefits are excluded and uncounted. Dependent care FSAs have roughly 1.5 to 2.5 million participants (recalled), about 1% of returns.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 13, header: "Taxable dependent care benefits", returns: 431865}
  hsa:
    label: Health savings account (contributions, employer contributions or distributions)
    refs: [ladder 11, "$f8889"]
    share: 0.11
    range: [0.07, 0.16]
    source:
      kind: judgment
      reasoning: Only own-contribution deductions (1.25%) and taxable distributions (0.29%) are counted; employer contributions and qualified distributions also require Form 8889. About 37 million HSA accounts exist (Devenir, recalled), most with a contribution or distribution in a year, held by perhaps 15 to 20 million returns, about 11%.
      bounds:
        - {file: soi-23in14ar, table: "Table 1.4", column: 109, header: "Health savings account deduction", returns: 2012002}
        - {file: soi-23in14ar, table: "Table 1.4", column: 101, header: "Taxable health savings account distributions", returns: 464689}
    note: Weak and across the cut. The archived tables count only a small part of Form 8889 filers; a count of Forms 8889 (not archived) would settle it.
  marketplace:
    label: Marketplace health coverage (Form 1095-A)
    refs: ["$f1095a"]
    share: 0.085
    range: [0.0598, 0.10]
    source:
      kind: judgment
      reasoning: Returns with advance premium tax credit were 6.0% in 2023. Marketplace enrolment rose from about 16 million (2023) to about 24 million (2025) under the enhanced credits (CMS, recalled), so about 8.5% for 2025.
      bounds:
        - {file: soi-23in27aca, table: "Table 2.7", column: 5, header: "Advance payment of premium tax credit", returns: 9604913}
        - {file: soi-23in27aca, table: "Table 2.7", column: 3, header: "Total premium tax credit", returns: 8860422}
  education:
    label: Education after high school (tuition or qualified expenses paid for you, your spouse or a dependent)
    refs: [ladder 12, f8863.paid]
    share: 0.09
    range: [0.0449, 0.13]
    source:
      kind: judgment
      reasoning: Education credits are claimed on 4.5% of returns (the larger of the nonrefundable education and American opportunity counts), but expenses paid without a credit (income over the limit, scholarships covering tuition, students filing their own return while a parent claims them) also answer yes. About 19 million students in postsecondary education (NCES, recalled) touch roughly 14 million returns, about 9%. The microdata's qualified_tuition_expenses flags 0.7% and was not used.
      bounds:
        - {file: soi-23in33ar, table: "Table 3.3", column: 8, header: "Nonrefundable education credit", returns: 7211349}
        - {file: soi-23in33ar, table: "Table 3.3", column: 40, header: "American opportunity credit", returns: 5821688}
    note: Weak and across the cut.
  home_energy:
    label: Home energy improvements or residential clean energy property
    theme: home_vehicle
    refs: [ladder 13, f5695.part1_any, f5695.part2_any]
    share: 0.0252
    range: [0.016, 0.035]
    source:
      kind: soi
      combine: sum
      cells:
        - {file: soi-23in33ar, table: "Table 3.3", column: 14, header: "Residential clean energy credit", returns: 1481945}
        - {file: soi-23in33ar, table: "Table 3.3", column: 16, header: "Energy efficient home improvement credit", returns: 2570561}
    note: Summed (overlap assumed small); 2025 is the last year for both credits, so a rush may raise it.
  clean_energy_part1:
    label: Residential clean energy property (Form 5695 Part I) or a carryforward
    theme: home_vehicle
    refs: [f5695.part1_any]
    share: 0.0092
    range: [0.0092, 0.015]
    source:
      kind: soi
      combine: single
      cells:
        - {file: soi-23in33ar, table: "Table 3.3", column: 14, header: "Residential clean energy credit", returns: 1481945}
  home_improvement_part2:
    label: Energy efficient home improvements (Form 5695 Part II)
    theme: home_vehicle
    refs: [f5695.part2_any]
    share: 0.0160
    range: [0.0160, 0.025]
    source:
      kind: soi
      combine: single
      cells:
        - {file: soi-23in33ar, table: "Table 3.3", column: 16, header: "Energy efficient home improvement credit", returns: 2570561}
  home_or_charity:
    label: Mortgage interest, property taxes or charity
    refs: [ladder 14]
    share: 0.60
    range: [0.45, 0.70]
    source:
      kind: judgment
      reasoning: About 65% of households own their home and nearly all pay property tax (Census, recalled); renters who give to charity add more. Itemizers are only 9.4% of returns, which measures who deducts, not who would answer yes. The microdata's imputed mortgage interest, property tax and charity flags (19%, 22%, 20%) follow itemizers and were not used.
      bounds:
