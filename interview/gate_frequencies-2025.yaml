    theme: family_household
    refs: [ladder 28]
    share: 0.02
    range: [0.0015, 0.08]
    source:
      kind: judgment
      reasoning: Household employment tax (Schedule H) is on 0.15% of returns; household employers who should file but do not, and families with nannies or housekeepers who are not employees, answer yes too. A wording that includes any paid cleaner or contractor draws far more.
      bounds:
        - {file: soi-23in33ar, table: "Table 3.3", column: 78, header: "Household employment tax", returns: 242743}
    note: Wording-sensitive.
