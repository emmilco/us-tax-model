    range: [0.0037, 0.015]
    source:
      kind: judgment
      reasoning: The clean vehicle credit was on 0.31% of returns in 2023 and the refuelling property credit 0.07%. Electric vehicle purchases rose in 2024 and 2025 (the credit ended for vehicles acquired after September 2025), and buyers who transferred the credit to a dealer or leased also answer yes, so about 0.8%.
      bounds:
        - {file: soi-23in33ar, table: "Table 3.3", column: 30, header: "Clean vehicle credit", returns: 493953}
        - {file: soi-23in33ar, table: "Table 3.3", column: 28, header: "Alternative fuel vehicle refueling prop. credit", returns: 104733}
