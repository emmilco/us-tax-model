      locator: p. 19, Line 10, "You can’t carry over unused foreign taxes paid or accrued in a year to which the election doesn’t
        apply to or from any year for which you made the election", "However, you must reduce the amount of any carryback or
        carryforward by the amount that you would have used had you chosen to claim a credit rather than a deduction in that
        year"
  - id: f1116sb.prior_none
