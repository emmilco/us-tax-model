  - id: f1116sb.current
    printed: (helper)
    type: Dollars
    label: 'Current year foreign taxes available for credit: Form 1116 lines 9, 12 and 13 combined (line 14 less line 10)'
    expr:
      op: subtract
      from: f1116.line14
      take: f1116.line10
    cite:
      doc: i1116sb
      locator: p. 1, Excess limitation. If your foreign tax credit limitation, "your current year foreign taxes available
        for credit (the sum of Form 1116, Part III, lines 9, 12, and 13)"
  - id: f1116sb.excess_limit
    printed: (helper)
    type: NonNegDollars
    label: 'Excess limitation: Form 1116 line 23 above the current year foreign taxes available for credit (zero if not above)'
    expr:
      op: subtract_floor0
      from: f1116.line23
      take: f1116sb.current
    cite:
      doc: i1116sb
      locator: p. 1, Excess limitation. If your foreign tax credit limitation, "(Form 1116, Part III, line 23) exceeds your
        current year foreign taxes available for credit (the sum of Form 1116, Part III, lines 9, 12, and 13), you have an
        excess limitation."
  - id: f1116sb.used_i
    printed: (helper)
    type: NonNegDollars
    label: 'Carryover of the 10th preceding tax year used in the current year: line 3 of the column, but not more than the
      excess limitation left'
