form:
  id: f1116sb
  kind: form
  title: Schedule B (Form 1116) — Foreign Tax Carryover Reconciliation Schedule (passive category)
  tax_year: 2025
  note: Filed with the passive category Form 1116 when foreign tax is carried into 2025 or a carryover is generated. Line
    1 is the 2024 Schedule B line 8, column by column; line 2 is empty (an adjustment is refused); line 4 uses the carryover
    oldest column first up to the excess limitation; line 5 is the 10th preceding year's carryover left unused; line 6 is
    the current year's excess foreign tax; nothing is carried back (line 7 is zero, and a return whose 2024 limit had room
    is refused).
  lines:
  - id: f1116sb.zero
    printed: (helper)
    type: NonNegDollars
    label: Year parameter sales.zero
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1116sb
      locator: p. 2, Line 7. Actual or estimated amount of line 6 to be carried back to the prior tax year, "Enter the amount
        of line 6 carried back to the first preceding tax year."
  - id: f1116sb.no
    printed: (helper)
    type: Bool
    label: Year parameter ftc.no (false)
    expr:
      op: param
      ref: ftc.no
    cite:
      doc: i1116sb
      locator: p. 1, Who Must File, "if you’re filing Form 1116 that has a foreign tax carryover in the prior tax year, the
        current tax year, or both, you must file Schedule B for that separate category of income"
  - id: f1116sb.l1_i
    printed: 1 (i)
    type: NonNegDollars
    label: Foreign tax carryover from the prior tax year (enter amounts from the appropriate columns of line 8 of the prior
      year Schedule B), 10th preceding tax year
    expr:
      op: sum_over
      collection: f1116sbyr
      field: f1116sbyr.amount
      where:
        op: test
        eq:
        - f1116sbyr.year
        - const: p10
    cite:
      doc: i1116sb
      locator: p. 1, Line 1. Foreign tax carryover from the prior tax year, "Enter on line 1 the amounts from the appropriate
        columns of line 8 of the prior year Schedule B."
