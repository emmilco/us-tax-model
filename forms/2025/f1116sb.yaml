  - id: f1116sb.changed
    printed: (helper)
    type: Bool
    label: Has the foreign tax carried from 2024 changed since that return was filed (a carryback different from its estimate,
      a redetermination of foreign tax, an audit or another adjustment of Schedule B line 2)?
    expr:
      op: input
      source: Since you filed your 2024 return, has anything changed the foreign tax carried from it, such as a carryback
        to 2023 that differs from the estimate on line 7 of the 2024 Schedule B (Form 1116), a change in foreign tax for an
        earlier year, or an IRS audit?
    cite:
      doc: i1116sb
      locator: p. 1, Line 2. Adjustments to line 1, "Report on lines 2a, 2b, 2c, 2d, etc., any adjustments resulting from
        events that occurred between the filing of your prior year tax return and the filing of your current year tax return."
    gated_by: f1116sb.changed_if_carry
  - id: f1116sb.changed_if_carry
    printed: (gate)
    type: Bool
    label: The foreign tax carried from 2024 has changed since that return was filed, asked only when a carryover is claimed
      (false otherwise)
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - ftc.carryover_if_asked
          - const: true
        then: f1116sb.changed
      - guard:
          op: test
          eq:
          - ftc.carryover_if_asked
          - const: false
        then: f1116sb.no
    cite:
      doc: i1116sb
      locator: p. 1, Line 2. Adjustments to line 1, "Report on lines 2a, 2b, 2c, 2d, etc., any adjustments resulting from
        events that occurred between the filing of your prior year tax return and the filing of your current year tax return."
  - id: f1116sb.split
    printed: (helper)
    type: Bool
    label: Is foreign tax carried from a joint return of an earlier year when this return is not a joint return (or is joint
      with another spouse)?
    expr:
      op: input
      source: Is any of the foreign tax carried into 2025 from a joint return of an earlier year, when this return is not
        a joint return with the same spouse?
    cite:
      doc: p514
      locator: p. 39, Allocations Between Spouses, "You may have to allocate an unused foreign tax or excess limit for a tax
        year in which you and your spouse filed a joint return."
    gated_by: f1116sb.split_if_carry
  - id: f1116sb.split_if_carry
    printed: (gate)
    type: Bool
    label: Foreign tax is carried from a joint return of an earlier year that this return does not continue, asked only when
      a carryover is claimed (false otherwise)
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - ftc.carryover_if_asked
          - const: true
        then: f1116sb.split
      - guard:
          op: test
          eq:
          - ftc.carryover_if_asked
          - const: false
        then: f1116sb.no
    cite:
      doc: p514
      locator: p. 39, Allocations Between Spouses, "You may have to allocate an unused foreign tax or excess limit for a tax
        year in which you and your spouse filed a joint return."
  - id: f1116sb.generated
    printed: (gate)
    type: Bool
    label: A foreign tax carryover is generated in the current year (line 6 above zero)
    expr:
      op: test
      gt:
      - f1116sb.l6_xiii
      - const: 0
    cite:
      doc: i1116sb
      locator: p. 2, Line 6. Foreign tax carryover generated in current tax year, "line 6 is completed only if you have current
        year excess foreign taxes"
  - id: f1116sb.prior_asked
    printed: (gate)
    type: Bool
    label: A foreign tax carryover is generated in the current year, or foreign tax is carried into 2025 from an earlier year
    expr:
      op: test
      any:
      - op: test
        eq:
