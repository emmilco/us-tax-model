      locator: p. 37, Carryback and Carryover, "You are considered to have paid this unused foreign tax first in 2024 (the
        first preceding tax year) up to the excess limit in that year"; "Because you had no foreign income in 2020, you cannot
        carry back the unused foreign tax to that year."; p. 38, "You cannot carry back or carry over any unused foreign taxes
        to or from a year for which you elect not to be subject to the foreign tax credit limit."; i1116 p. 19, Line 10, "You
        can’t carry over unused foreign taxes paid or accrued in a year to which the election doesn’t apply to or from any
        year for which you made the election."
  - id: f1116sb.prior_year
    printed: (helper)
    type: Enum(ftc_prior_year)
    label: 'How the 2024 return treated foreign tax on passive income: no foreign income, the credit without Form 1116, Form
      1116 with its limit used up (line 24 equal to line 23), Form 1116 with room left (line 24 less than line 23), or foreign
      income with the tax deducted or no credit taken'
    expr:
      op: input
      source: 'How did your (or, on a joint return, your spouse''s) 2024 return treat foreign tax on investment income: no
        income from other countries, a credit without Form 1116, Form 1116 with line 24 equal to line 23, Form 1116 with line
        24 less than line 23, or the tax deducted or no credit taken?'
    cite:
      doc: p514
      locator: p. 37, Carryback and Carryover, "You are considered to have paid this unused foreign tax first in 2024 (the
        first preceding tax year) up to the excess limit in that year"; "Because you had no foreign income in 2020, you cannot
        carry back the unused foreign tax to that year."; p. 38, "You cannot carry back or carry over any unused foreign taxes
        to or from a year for which you elect not to be subject to the foreign tax credit limit."; i1116 p. 19, Line 10, "You
        can’t carry over unused foreign taxes paid or accrued in a year to which the election doesn’t apply to or from any
        year for which you made the election."
    gated_by: f1116sb.prior_year_if_excess
    ambiguity: amb.2025.f1116_carryback
  - id: f1116sb.prior_year_if_excess
    printed: (gate)
    type: Enum(ftc_prior_year)
    label: How the 2024 return treated foreign tax on passive income, asked only when a carryover is generated (line 6 above
      zero) or one is carried into 2025; none otherwise
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f1116sb.prior_asked
          - const: true
        then: f1116sb.prior_year
      - guard:
          op: test
          eq:
          - f1116sb.prior_asked
          - const: false
        then: f1116sb.prior_none
    cite:
      doc: p514
      locator: p. 37, Carryback and Carryover, "You are considered to have paid this unused foreign tax first in 2024 (the
        first preceding tax year) up to the excess limit in that year"; "Because you had no foreign income in 2020, you cannot
        carry back the unused foreign tax to that year."; p. 38, "You cannot carry back or carry over any unused foreign taxes
        to or from a year for which you elect not to be subject to the foreign tax credit limit."; i1116 p. 19, Line 10, "You
        can’t carry over unused foreign taxes paid or accrued in a year to which the election doesn’t apply to or from any
        year for which you made the election."
  - id: f1116sb.carryback
    printed: (gate)
    type: Bool
    label: The carryover generated is first carried back to 2024, which had room under its limit (Form 1116 line 24 less than
      line 23) or foreign income with no credit taken
    expr:
      op: test
      all:
      - op: test
        eq:
        - f1116sb.generated
        - const: true
      - op: test
        any:
        - op: test
          eq:
          - f1116sb.prior_year_if_excess
          - const: form_room
        - op: test
          eq:
          - f1116sb.prior_year_if_excess
          - const: other
    cite:
      doc: p514
      locator: p. 37, Carryback and Carryover, "You are considered to have paid this unused foreign tax first in 2024 (the
        first preceding tax year) up to the excess limit in that year"; "Because you had no foreign income in 2020, you cannot
        carry back the unused foreign tax to that year."; p. 38, "You cannot carry back or carry over any unused foreign taxes
        to or from a year for which you elect not to be subject to the foreign tax credit limit."; i1116 p. 19, Line 10, "You
        can’t carry over unused foreign taxes paid or accrued in a year to which the election doesn’t apply to or from any
        year for which you made the election."
    ambiguity: amb.2025.f1116_carryback
  - id: f1116sb.carry_through_prior
    printed: (gate)
    type: Bool
    label: Foreign tax is carried into 2025 through a 2024 return that had foreign income and deducted the foreign tax or took
      no credit for it, and is neither changed since 2024 nor carried from another joint return (those are refused on Form
      1116 line 35; a carryover through a 2024 election year or a year with no foreign income passes through unreduced)
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - ftc.carryover_if_asked
          - const: true
        then: f1116sb.carry_through_tests
      - guard:
          op: test
          eq:
          - ftc.carryover_if_asked
          - const: false
        then: f1116sb.no
    cite:
      doc: i1116
      locator: p. 19, Line 10, "However, you must reduce the amount of any carryback or carryforward by the amount that you
        would have used had you chosen to claim a credit rather than a deduction in that year", "Don’t reduce the carryback
        or carryforward by the amount you would have used in the election year if you hadn’t made the election"
  - id: f1116sb.carry_through_tests
    printed: (helper)
    type: Bool
    label: With foreign tax carried into 2025, the carryover is neither changed since 2024 nor carried from another joint
      return, and the 2024 return had foreign income and deducted the foreign tax or took no credit for it
    expr:
      op: test
      all:
      - op: test
        eq:
        - f1116sb.changed_if_carry
        - const: false
      - op: test
        eq:
        - f1116sb.split_if_carry
        - const: false
      - op: test
        eq:
        - f1116sb.prior_year_if_excess
        - const: other
    cite:
      doc: i1116
      locator: p. 19, Line 10, "However, you must reduce the amount of any carryback or carryforward by the amount that you
        would have used had you chosen to claim a credit rather than a deduction in that year", "Don’t reduce the carryback
        or carryforward by the amount you would have used in the election year if you hadn’t made the election"
