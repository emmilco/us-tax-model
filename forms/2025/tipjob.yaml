form:
  id: tipjob
  kind: form
  title: Qualified Tips From More Than One Employer Worksheet (Schedule 1-A, line 4c) — one row per employer
  tax_year: 2025
  note: One entry per employer from which you received tips as an employee that you are deducting. Tips reported
    on Form 4137 (column (c)) are refused with Form 4137, so column (d) is the column (b) amount.
  lines:
  - id: tipjob.one
    printed: (helper)
    label: One employer
    type: Count
    expr:
      op: param
      ref: ss.one
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 4c, "with respect to employment with more than one employer"
  - id: tipjob.qualified
    printed: (helper)
    label: Were all the tips you are counting from this employer received in an occupation on the IRS list of occupations
      that customarily and regularly received tips on or before December 31, 2024, paid in cash (including by check,
      card or app), voluntarily, without negotiation and in an amount the customer decided, and not for a service that
      is a crime under applicable law?
    type: Bool
    expr:
      op: input
      source: Were all the tips you are counting from this employer received in an occupation on the IRS list of occupations
        that customarily and regularly received tips on or before December 31, 2024 (IRS.gov/TippedOccupations), paid
        in cash (including by check, card or app), voluntarily, without negotiation and in an amount the customer decided,
        and not for a service that is a crime under applicable law?
    cite:
      doc: i1040gi
      locator: pp. 101-103, Schedule 1-A, Qualified Tips, Cash tips, "Paid voluntarily, not subject to negotiation,
        and determined by the customer/payor," "Amounts received that are not qualified tips" and "Occupations that
        customarily and regularly received tips"; "Do not include tips received in occupations that are not included
        on this list"
  - id: tipjob.amount
    printed: 1(b)
    label: Amount of qualified tips reported by this employer on Form W-2, or reported by you to this employer on Form(s)
      4070
    type: NonNegDollars
    expr:
      op: input
      source: 'Qualified tips from this employer, taken from one of these (your choice): Form W-2 box 7 (social security
        tips); the total of the tips you reported to this employer on Forms 4070 or a similar monthly report (which may
        be more accurate if Form W-2 box 1 or box 5 is more than $176,100); or an amount of tips your employer reported
        in Form W-2 box 14 or on a separate statement'
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (b); pp. 103-104, methods 1 to 3
    refuses:
    - when: tipjob.mixed
      form: Qualified tips from an employer where some tips were not qualified tips
      remedy: Splitting one employer's reported tips between qualified and nonqualified tips is outside this tool.
      cite:
        doc: i1040gi
        locator: p. 103, "If you received tips as an employee in more than one occupation for the same employer, only
          those tips that were received in an occupation on the list ... are considered qualified tips. Do not include
          tips received in occupations that are not included on this list in line 4a, 4b, or 4c"
  - id: tipjob.mixed
    printed: (gate)
    label: Some of this employer's tips are not qualified tips
    type: Bool
    expr:
      op: test
      eq:
      - tipjob.qualified
      - const: false
    cite:
      doc: i1040gi
      locator: p. 103, Schedule 1-A, "Determining the amount of qualified tips received by an employee for 2025"
  - id: tipjob.col_c
    printed: 1(c)
    label: Qualified tips reported on Form 4137, column 1(c), for this employer
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (c)
    refuses:
    - when: s2.other
      form: Form 4137 (Social Security and Medicare Tax on Unreported Tip Income)
      remedy: Tips reported on Form 4137 are outside this tool.
      cite:
        doc: i1040gi
        locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (c), and p. 103, method 4
  - id: tipjob.col_d
    printed: 1(d)
    label: Enter the greater of column (b) or column (c)
    type: NonNegDollars
    expr:
      op: larger_of
      of:
      - tipjob.amount
      - tipjob.col_c
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (d)
  collection:
    parent: person
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 4c, and the Qualified Tips From More Than One Employer Worksheet (one row per
        employer)
