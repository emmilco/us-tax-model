form:
  id: tipjob
  kind: form
  title: Qualified Tips From More Than One Employer Worksheet (Schedule 1-A, line 4c) — one row per employer
  tax_year: 2025
  note: One entry per employer from which you received tips as an employee that you are deducting. Tips reported
    on Form 4137 (column (c)) are refused with Form 4137, so column (d) is the column (b) amount.
  lines:
  - id: tipjob.one
    printed: (helper)
    label: One employer
    type: Count
    expr:
      op: param
      ref: ss.one
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 4c, "with respect to employment with more than one employer"
  - id: tipjob.no
    printed: (helper)
    label: Year parameter s3.no (false)
    type: Bool
    expr:
      op: param
      ref: s3.no
    cite:
      doc: i1040gi
      locator: p. 103, Schedule 1-A, "Determining the amount of qualified tips received by an employee for 2025"
  - id: tipjob.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (b)
  - id: tipjob.listed
    printed: (helper)
    label: Were the tips from this employer received in an occupation on the IRS list of occupations that customarily
      and regularly received tips on or before December 31, 2024?
    type: Bool
    expr:
      op: input
      source: Is the work you got these tips for on the IRS list of jobs that customarily get tips? Restaurant, bar and
        hotel staff, hairdressers and barbers, and taxi and delivery drivers are on it.
    cite:
      doc: i1040gi
      locator: pp. 101-103, Schedule 1-A, Qualified Tips, "Occupations that customarily and regularly received tips";
        "Do not include tips received in occupations that are not included on this list"; tipped-occupations, the
        list of occupations by Treasury Tipped Occupation Code
  - id: tipjob.other_work
    printed: (helper)
    label: Were some of the tips from this employer received in an occupation that is not on the IRS list?
    type: Bool
    gated_by: tipjob.other_work_if_listed
    expr:
      op: input
      source: Did you also get tips from this employer for other work that is not on that list?
    cite:
      doc: i1040gi
      locator: p. 103, "If you received tips as an employee in more than one occupation for the same employer, only
        those tips that were received in an occupation on the list ... are considered qualified tips. Do not include
        tips received in occupations that are not included on this list in line 4a, 4b, or 4c"
  - id: tipjob.other_work_if_listed
    printed: (gate)
    label: Whether some of this employer's tips were received in an occupation not on the list, asked only where the tips were received in a listed occupation (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - tipjob.listed
          - const: true
        then: tipjob.other_work
      - guard:
          op: test
          eq:
          - tipjob.listed
          - const: false
        then: tipjob.no
    cite:
      doc: i1040gi
      locator: p. 103, Schedule 1-A, "Determining the amount of qualified tips received by an employee for 2025"
  - id: tipjob.charged
    printed: (helper)
    label: Do the tips from this employer include amounts not paid voluntarily, not determined by the customer or
      subject to negotiation (service charges, automatic gratuities), or amounts not paid in a cash medium (cash, check,
      credit or debit card, gift card, tokens readily exchangeable for a fixed amount such as casino chips, or a payment
      app)?
    type: Bool
    gated_by: tipjob.charged_if_listed
    expr:
      op: input
      source: Do these tips include a service charge or automatic gratuity that the business added to the bill, an
        amount you negotiated with the customer, or tips given as tickets, meals, services or goods instead of money
        (casino chips count as money)?
    cite:
      doc: i1040gi
      locator: pp. 101-103, Schedule 1-A, Qualified Tips, Cash tips, "paid in a cash medium, including by cash, check,
        credit card, debit card, gift card, tangible or intangible tokens that are readily exchangeable for a fixed amount
        (for example, casino chips)"; "Paid voluntarily, not subject to negotiation, and determined by the customer/payor,"
        "Amounts received that are not qualified tips"
  - id: tipjob.charged_if_listed
    printed: (gate)
    label: Whether this employer's tips include amounts not paid voluntarily or not paid in cash, asked only where the tips were received in a listed occupation (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - tipjob.listed
          - const: true
        then: tipjob.charged
      - guard:
          op: test
          eq:
          - tipjob.listed
          - const: false
        then: tipjob.no
    cite:
      doc: i1040gi
      locator: p. 103, Schedule 1-A, "Determining the amount of qualified tips received by an employee for 2025"
  - id: tipjob.unlawful
    printed: (helper)
    label: Were any of the tips from this employer received while performing a service that is a felony or misdemeanor
      under applicable law, or for prostitution or pornographic activity?
    type: Bool
    gated_by: tipjob.unlawful_if_listed
    expr:
      op: input
      source: Was any of the work you got these tips for against the law (for example, serving alcohol without a
        license the state requires), or was any of it prostitution or pornographic activity?
    cite:
      doc: i1040gi
      locator: pp. 101-103, Schedule 1-A, Qualified Tips, "Tips received while performing a service that is a felony
        or misdemeanor under applicable law are not qualified tips", "Amounts received for prostitution and
        pornographic activity are not qualified tips"
  - id: tipjob.unlawful_if_listed
    printed: (gate)
    label: Whether any of this employer's tips were received for an unlawful service, prostitution or pornographic activity, asked only where the tips were received in a listed occupation (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - tipjob.listed
          - const: true
        then: tipjob.unlawful
      - guard:
          op: test
          eq:
          - tipjob.listed
          - const: false
        then: tipjob.no
    cite:
      doc: i1040gi
      locator: p. 103, Schedule 1-A, "Determining the amount of qualified tips received by an employee for 2025"
  - id: tipjob.tips
    printed: (helper)
    label: Qualified tips from this employer, as entered
    type: NonNegDollars
    gated_by: tipjob.amount
    expr:
      op: input
      source: What were your tips from this employer in 2025? Take box 7 of its W-2 (social security tips), or a tip
        amount this employer gave you in box 14 or on a separate statement.
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (b); pp. 103-104, paragraphs 1 through 3
  - id: tipjob.amount
    printed: 1(b)
    label: Amount of qualified tips reported by this employer on Form W-2, or reported by you to this employer on Form(s)
      4070
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - tipjob.listed
          - const: true
        then: tipjob.tips
      - guard:
          op: test
          eq:
          - tipjob.listed
          - const: false
        then: tipjob.zero
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (b); pp. 103-104, paragraphs 1 through 3
    refuses:
    - when: tipjob.mixed
      form: Qualified tips from an employer where some tips were not qualified tips
      remedy: Splitting one employer's reported tips between qualified and nonqualified tips is outside this tool.
      cite:
        doc: i1040gi
        locator: p. 103, "If you received tips as an employee in more than one occupation for the same employer, only
          those tips that were received in an occupation on the list ... are considered qualified tips. Do not include
          tips received in occupations that are not included on this list in line 4a, 4b, or 4c"
  - id: tipjob.mixed
    printed: (gate)
    label: Some of this employer's tips are not qualified tips
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - tipjob.other_work_if_listed
        - const: true
      - op: test
        eq:
        - tipjob.charged_if_listed
        - const: true
      - op: test
        eq:
        - tipjob.unlawful_if_listed
        - const: true
    cite:
      doc: i1040gi
      locator: p. 103, Schedule 1-A, "Determining the amount of qualified tips received by an employee for 2025"
  - id: tipjob.col_c
    printed: 1(c)
    label: Qualified tips reported on Form 4137, column 1(c), for this employer
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (c)
    refuses:
    - when: s2.other
      form: Form 4137 (Social Security and Medicare Tax on Unreported Tip Income)
      remedy: Tips reported on Form 4137 are outside this tool.
      cite:
        doc: i1040gi
        locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (c), and p. 103, method 4
  - id: tipjob.col_d
    printed: 1(d)
    label: Enter the greater of column (b) or column (c)
    type: NonNegDollars
    expr:
      op: larger_of
      of:
      - tipjob.amount
      - tipjob.col_c
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (d)
  collection:
    parent: person
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 4c, and the Qualified Tips From More Than One Employer Worksheet (one row per
        employer)
