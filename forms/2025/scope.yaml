form:
  id: scope
  kind: form
  title: Proof-of-concept scope screening
  tax_year: 2025
  note: Stage 4 screening answers are explicit declarations, not automatic determinations of
    eligibility. Stage 5 wires these gates into the whole-return outcome.
  lines:
    - id: scope.no
      printed: (helper)
      type: Bool
      label: Year parameter household.no (false)
      expr:
        op: param
        ref: household.no
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.w2_count
      printed: (helper)
      type: Count
      label: Number of Forms W-2 on the return
      expr:
        op: sum_over
        collection: person
        field: person.employers
      cite:
        doc: i1040gi
        locator: 'p. 23, Line 1a, "Enter the total amount from Form(s) W-2, box 1"'
    - id: scope.has_w2
      printed: (helper)
      type: Bool
      label: The return has a Form W-2
      expr:
        op: test
        gt:
          - scope.w2_count
          - const: 0
            type: Count
      cite:
        doc: i1040gi
        locator: 'p. 23, Line 1a, "Enter the total amount from Form(s) W-2, box 1"'
    - id: scope.noncitizen
      printed: (helper)
      type: Bool
      label: "At any time in 2025, were you (or, on a joint return, your spouse) not a U.S. citizen?"
      expr:
        op: input
        source: "At any time in 2025, were you (or, on a joint return, your spouse) not a U.S. citizen?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.nonresident
      printed: (helper)
      type: Bool
      gated_by: scope.nonresident_if_noncitizen
      label: "For any part of 2025, were you (or, on a joint return, your spouse) a nonresident alien, that is, neither a U.S. citizen nor a U.S. resident for tax?"
      expr:
        op: input
        source: "For any part of 2025, were you (or, on a joint return, your spouse) a nonresident alien, that is, neither a U.S. citizen nor a U.S. resident for tax?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.nonresident_if_noncitizen
      printed: (gate)
      type: Bool
      label: "The answer to scope.nonresident, asked only when the question scope.noncitizen is answered Yes (false otherwise)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
              - scope.noncitizen
              - const: true
          then: scope.nonresident
        - guard:
            op: test
            eq:
              - scope.noncitizen
              - const: false
          then: scope.no
      cite:
        doc: i1040gi
        locator: 'p. 8, "Most nonresident aliens and dual-status aliens have different filing requirements and may have to file Form 1040-NR"'
    - id: scope.chapter11
      printed: (helper)
      type: Bool
      label: "At any time in 2025, were you (or, on a joint return, your spouse) in a chapter 11 bankruptcy case?"
      expr:
        op: input
        source: "At any time in 2025, were you (or, on a joint return, your spouse) in a chapter 11 bankruptcy case?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.treaty
      printed: (helper)
      type: Bool
      label: "Is any of your (or, on a joint return, your spouse's) 2025 income exempt from U.S. tax under a tax treaty?"
      expr:
        op: input
        source: "Is any of your (or, on a joint return, your spouse's) 2025 income exempt from U.S. tax under a tax treaty,
          such as the pay or scholarship of a student, teacher or researcher from another country (often shown on Form
          1042-S or claimed on Form 8833)?"
      cite:
        doc: i1040s8812
        locator: 'p. 3, Line 18a, "Income excluded under a tax treaty is also excluded from the computation of earned income
          on line 18a."'
    - id: scope.armed_forces
      printed: (helper)
      type: Bool
      label: "In 2022 or later, did you (or, on a joint return, your spouse) serve in the U.S. armed forces, Coast Guard, reserves or National Guard?"
      expr:
        op: input
        source: "In 2022 or later, did you (or, on a joint return, your spouse) serve in the U.S. armed forces, Coast Guard, reserves or National Guard?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.reservist_expenses
      printed: (helper)
      type: Bool
      gated_by: scope.reservist_expenses_if_armed_forces
      label: "Do you want to deduct costs, not paid back, of travel more than 100 miles from home for reserve or National Guard duty in 2025?"
      expr:
        op: input
        source: "Do you want to deduct costs, not paid back, of travel more than 100 miles from home for reserve or National Guard duty in 2025?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.reservist_expenses_if_armed_forces
      printed: (gate)
      type: Bool
      label: "The answer to scope.reservist_expenses, asked only when the question scope.armed_forces is answered Yes (false otherwise)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
              - scope.armed_forces
              - const: true
          then: scope.reservist_expenses
        - guard:
            op: test
            eq:
              - scope.armed_forces
              - const: false
          then: scope.no
      cite:
        doc: i1040gi
        locator: 'p. 93, Line 12, "Certain business expenses of National Guard and reserve members who traveled more than 100 miles from home"'
    - id: scope.military_move
      printed: (helper)
      type: Bool
      gated_by: scope.military_move_if_armed_forces
      label: "Do you want to deduct moving costs, not paid back, of a 2025 move to a new permanent post under military orders, or storage fees while you were posted outside the United States?"
      expr:
        op: input
        source: "Do you want to deduct moving costs, not paid back, of a 2025 move to a new permanent post under military orders, or storage fees while you were posted outside the United States?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31; i1040gi p. 93, Line 14, \"If you are claiming only storage fees during your absence from the United States, check the box on line 14\""
    - id: scope.military_move_if_armed_forces
      printed: (gate)
      type: Bool
      label: "The answer to scope.military_move, asked only when the question scope.armed_forces is answered Yes (false otherwise)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
              - scope.armed_forces
              - const: true
          then: scope.military_move
        - guard:
            op: test
            eq:
              - scope.armed_forces
              - const: false
          then: scope.no
      cite:
        doc: i1040gi
        locator: 'p. 93, Line 14, "You can deduct moving expenses if you are a member of the Armed Forces on active duty and due to a military order you move because of a permanent change of station"'
    - id: scope.reservist_repaid
      printed: (helper)
      type: Bool
      gated_by: scope.reservist_repaid_if_armed_forces
      label: "In 2025, did you (or, on a joint return, your spouse) put back into an IRA money taken out of a retirement plan during a call to active duty as a reservist?"
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) put back into an IRA money taken out of a retirement plan during a call to active duty as a reservist?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.reservist_repaid_if_armed_forces
      printed: (gate)
      type: Bool
      label: "The answer to scope.reservist_repaid, asked only when the question scope.armed_forces is answered Yes (false otherwise)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
              - scope.armed_forces
              - const: true
          then: scope.reservist_repaid
        - guard:
            op: test
            eq:
              - scope.armed_forces
              - const: false
          then: scope.no
      cite:
        doc: i1040gi
        locator: 'p. 95, Line 20, "Don’t include any repayments of qualified reservist distributions"'
    - id: scope.under24_count
      printed: (helper)
      type: Count
      label: "Your entry, if you were under 24 at the end of 2025 (from your year of birth)"
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.role
            - const: taxpayer
          - op: test
            eq:
            - person.under24
            - const: true
      cite:
        doc: i8615
        locator: 'p. 1, Certain January 1 birthdays, "Use the following chart to determine whether certain children with
          January 1 birthdays meet condition 3 under Who Must File"'
    - id: scope.under24
      printed: (helper)
      type: Bool
      label: "You were under 24 at the end of 2025"
      expr:
        op: test
        gt:
        - scope.under24_count
        - const: 0
          type: Count
      cite:
        doc: i8615
        locator: 'p. 1, Who Must File, "under age 24 at the end of 2025"'
    - id: scope.under24_if_not_joint
      printed: (gate)
      type: Bool
      label: "The answer to scope.under24, asked only when the return is not a joint return (false otherwise)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
              - f1040.status
              - const: single
          then: scope.under24
        - guard:
            op: test
            eq:
              - f1040.status
              - const: hoh
          then: scope.under24
        - guard:
            op: test
            eq:
              - f1040.status
              - const: qss
          then: scope.under24
        - guard:
            op: test
            eq:
              - f1040.status
              - const: mfs
          then: scope.under24
        - guard:
            op: test
            eq:
              - f1040.status
              - const: mfj
          then: scope.no
      cite:
        doc: i8615
        locator: 'p. 1, Who Must File, "The child doesn’t file a joint return for 2025"'
    - id: scope.unearned_2700
      printed: (helper)
      type: Bool
      gated_by: scope.unearned_2700_if_under24
      label: "In 2025, did you have more than $2,700 of income that was not pay for work, such as interest, dividends or gains from investments?"
      expr:
        op: input
        source: "In 2025, did you have more than $2,700 of income that was not pay for work, such as interest, dividends or gains from investments?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.unearned_2700_if_under24
      printed: (gate)
      type: Bool
      label: "The answer to scope.unearned_2700, asked only when the question scope.under24 is answered Yes (false otherwise)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
              - scope.under24_if_not_joint
              - const: true
          then: scope.unearned_2700
        - guard:
            op: test
            eq:
              - scope.under24_if_not_joint
              - const: false
          then: scope.no
      cite:
        doc: i8615
        locator: 'p. 1, Who Must File, "The child had more than $2,700 of unearned income"'
    - id: scope.f8615
      printed: (helper)
      type: Bool
      gated_by: scope.f8615_if_unearned_2700
      label: "At the end of 2025, was a parent of yours alive, and were you either under 18, or 18 (or a full-time student aged 19 to 23) with pay for work of no more than half of what it cost to support you?"
      expr:
        op: input
        source: "At the end of 2025, was a parent of yours alive, and were you either under 18, or 18 (or a full-time student aged 19 to 23) with pay for work of no more than half of what it cost to support you?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.f8615_if_unearned_2700
      printed: (gate)
      type: Bool
      label: "The answer to scope.f8615, asked only when the question scope.unearned_2700 is answered Yes (false otherwise)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
              - scope.unearned_2700_if_under24
              - const: true
          then: scope.f8615
        - guard:
            op: test
            eq:
              - scope.unearned_2700_if_under24
              - const: false
          then: scope.no
      cite:
        doc: i8615
        locator: 'p. 1, Who Must File, "Form 8615 must be filed for any child who meets all of the following conditions"'
    - id: scope.f8814
      printed: (helper)
      type: Bool
      label: "Are you (or, on a joint return, your spouse) reporting a child's 2025 interest or dividends on your own return instead of filing a return for the child?"
      expr:
        op: input
        source: "Are you (or, on a joint return, your spouse) reporting a child's 2025 interest or dividends on your own return instead of filing a return for the child?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.adoption_benefits
      printed: (helper)
      type: Bool
      gated_by: scope.adoption_benefits_if_adoption
      label: "Did an employer pay or repay any of the adoption costs for you (or, on a joint return, your spouse)? Box 12 of a W-2 shows it with the code T."
      expr:
        op: input
        source: "Did an employer pay or repay any of the adoption costs for you (or, on a joint return, your spouse)? Box 12 of a W-2 shows it with the code T."
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.adoption_benefits_if_adoption
      printed: (gate)
      type: Bool
      label: "The answer to scope.adoption_benefits, asked only when there was an adoption or adoption costs since the start of 2024 (false otherwise)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
              - s3.adoption_any
              - const: true
          then: scope.adoption_benefits
        - guard:
            op: test
            eq:
              - s3.adoption_any
              - const: false
          then: scope.no
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1f, "Employer-provided adoption benefits should be shown in box 12 of your Form(s) W-2 with code T"'
    - id: scope.rental
      printed: (helper)
      type: Bool
      label: "In 2025, did you (or, on a joint return, your spouse) rent out, offer for rent, or receive rent for, anything you own or lease, or receive royalties?"
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) rent out, offer for rent, or receive rent for, anything you own or lease, or receive royalties?"
      cite:
        doc: f1040
        locator: 'Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31; p527 p. 3, Cash method, "You are a cash basis taxpayer if you report income on your return in the year you actually or constructively receive it, regardless of when it was earned"'
    - id: scope.rent_personal
      printed: (helper)
      type: Bool
      gated_by: scope.rent_personal_if_rental
      label: "Was any of what you rented out something other than a building, a room or land, such as a car, a trailer or equipment?"
      expr:
        op: input
        source: "Was any of what you rented out something other than a building, a room or land, such as a car, a trailer or equipment?"
      cite:
        doc: i1040se
        locator: 'p. 5, Personal property, "Do not use Schedule E to report income and expenses from the rental of personal property, such as equipment or vehicles"'
    - id: scope.rent_personal_if_rental
      printed: (gate)
      type: Bool
      label: "The answer to scope.rent_personal, asked only when the question scope.rental is answered Yes (false otherwise)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
              - scope.rental
              - const: true
          then: scope.rent_personal
        - guard:
            op: test
            eq:
              - scope.rental
              - const: false
          then: scope.no
      cite:
        doc: i1040se
        locator: 'p. 5, Personal property, "Do not use Schedule E to report income and expenses from the rental of personal property, such as equipment or vehicles"'
    - id: scope.k1
      printed: (helper)
      type: Bool
      label: "In 2025, did you (or, on a joint return, your spouse) have income or a loss from a partnership, an S corporation, an estate or a trust? A paper called Schedule K-1 reports it."
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) have income or a loss from a partnership, an S corporation, an estate or a trust? A paper called Schedule K-1 reports it."
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.farm
      printed: (helper)
      type: Bool
      label: "In 2025, did you (or, on a joint return, your spouse) have income or a loss from farming?"
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) have income or a loss from farming?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.remic
      printed: (helper)
      type: Bool
      label: "In 2025, did you (or, on a joint return, your spouse) hold a residual interest in a real estate mortgage investment conduit (REMIC), reported to you on Schedule Q?"
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) hold a residual interest in a real estate mortgage investment conduit (REMIC), reported to you on Schedule Q?"
      cite:
        doc: i1040se
        locator: 'p. 1, General Instructions, "Use Schedule E (Form 1040) to report income or loss from rental real estate, royalties, partnerships, S corporations, estates, trusts, and residual interests in REMICs"; p. 11, Part IV, "You should receive Schedule Q (Form 1066) and instructions from the REMIC for each quarter"; i6251 p. 9, "If you held a residual interest in a REMIC in 2025, the amount you enter on line 4 may not be less than the amount on Schedule E, line 38, column (c)"'
    - id: scope.pay_no_w2
      printed: (helper)
      type: Bool
      label: "In 2025, did you (or, on a joint return, your spouse) have wages, tips, or strike or lockout benefits that are not on a W-2?"
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) have wages, tips, or strike or lockout benefits that are not on a W-2?"
      cite:
        doc: f1040
        locator: "Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31"
    - id: scope.household_pay
      printed: (helper)
      type: Bool
      gated_by: scope.household_pay_if_pay
      label: "In 2025, were you (or, on a joint return, your spouse) paid as a household employee, for work in or around a household's home or for its members (for example as a nanny, carer, housekeeper, gardener or private driver, even in a home you share), by a household that gave you no W-2 and that controlled what work was done and how, not as a self-employed worker offering the work to the public?"
      expr:
        op: input
        source: "In 2025, were you (or, on a joint return, your spouse) paid as a household employee, for work in or around a household's home or for its members (for example as a nanny, carer, housekeeper, gardener or private driver, even in a home you share), by a household that gave you no W-2 and that controlled what work was done and how, not as a self-employed worker offering the work to the public?"
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1b, "Enter the total of your wages received as a household employee that was not reported on Form(s) W-2"; p926 p. 3, Do You Have a Household Employee?, "The worker is your employee if you can control not only what work is done, but how it is done"; p926 p. 4, "A self-employed worker usually provides their own tools and offers services to the general public in an independent business"'
    - id: scope.household_pay_if_pay
      printed: (gate)
      type: Bool
      label: "Wages as a household employee not reported on a W-2 (asked only after a Yes to pay not on a W-2; otherwise no)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - scope.pay_no_w2
            - const: true
          then: scope.household_pay
        - guard:
            op: test
            eq:
            - scope.pay_no_w2
            - const: false
          then: scope.no
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1b, "Enter the total of your wages received as a household employee that was not reported on Form(s) W-2"'
    - id: scope.contractor_pay
      printed: (helper)
      type: Bool
      gated_by: scope.contractor_pay_if_pay
      label: "In 2025, did a firm pay you (or, on a joint return, your spouse) as an independent contractor, when you believe you were its employee, without taking out social security or Medicare tax?"
      expr:
        op: input
        source: "In 2025, did a firm pay you (or, on a joint return, your spouse) as an independent contractor, when you believe you were its employee, without taking out social security or Medicare tax?"
      cite:
        doc: f8919
        locator: 'p. 1, Who must file, "You performed services for a firm", "You believe your pay from the firm wasn’t for services as an independent contractor", "The firm didn’t withhold your share of social security and Medicare taxes from your pay"'
    - id: scope.contractor_pay_if_pay
      printed: (gate)
      type: Bool
      label: "Wages from a firm that treated the worker as an independent contractor (Form 8919) (asked only after a Yes to pay not on a W-2; otherwise no)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - scope.pay_no_w2
            - const: true
          then: scope.contractor_pay
        - guard:
            op: test
            eq:
            - scope.pay_no_w2
            - const: false
          then: scope.no
      cite:
        doc: f8919
        locator: 'p. 1, Who must file, "You performed services for a firm", "You believe your pay from the firm wasn’t for services as an independent contractor", "The firm didn’t withhold your share of social security and Medicare taxes from your pay"'
    - id: scope.tips_unreported
      printed: (helper)
      type: Bool
      gated_by: scope.tips_unreported_if_pay
      label: "In 2025, did you (or, on a joint return, your spouse) get cash or card tips at a job that were not reported in full to the employer, or tips that were not money, such as tickets or other items of value?"
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) get cash or card tips at a job that were not reported in full to the employer, or tips that were not money, such as tickets or other items of value?"
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1c, "This should include any tip income you didn’t report to your employer", "Also, include the value of any noncash tips you received, such as tickets, passes, or other items of value"'
    - id: scope.tips_unreported_if_pay
      printed: (gate)
      type: Bool
      label: "Tips not reported in full to an employer, or noncash tips (Form 4137 and line 1c) (asked only after a Yes to pay not on a W-2; otherwise no)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - scope.pay_no_w2
            - const: true
          then: scope.tips_unreported
        - guard:
            op: test
            eq:
            - scope.pay_no_w2
            - const: false
          then: scope.no
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1c, "This should include any tip income you didn’t report to your employer", "Also, include the value of any noncash tips you received, such as tickets, passes, or other items of value"'
    - id: scope.strike_pay
      printed: (helper)
      type: Bool
      gated_by: scope.strike_pay_if_pay
      label: "In 2025, did you (or, on a joint return, your spouse) get strike or lockout benefits, other than bona fide gifts?"
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) get strike or lockout benefits, other than bona fide gifts?"
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1h, "Strike or lockout benefits (other than bona fide gifts)"'
    - id: scope.strike_pay_if_pay
      printed: (gate)
      type: Bool
      label: "Strike or lockout benefits (asked only after a Yes to pay not on a W-2; otherwise no)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - scope.pay_no_w2
            - const: true
          then: scope.strike_pay
        - guard:
            op: test
            eq:
            - scope.pay_no_w2
            - const: false
          then: scope.no
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1h, "Strike or lockout benefits (other than bona fide gifts)"'
