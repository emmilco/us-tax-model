form:
  id: scope
  kind: form
  title: Proof-of-concept scope screening
  tax_year: 2025
  note: Stage 4 screening answers are explicit declarations, not automatic determinations of
    eligibility. Stage 5 wires these gates into the whole-return outcome.
  lines:
    - id: scope.schedule1
      printed: (helper)
      type: Bool
      label: 'Any income or adjustment requiring Schedule 1 other than unemployment compensation, educator expenses, the HSA deduction and student loan interest, including a taxable state or local tax refund; alimony; an IRA deduction; being self-employed or filing Schedule C (income or loss, including statutory-employee wages) or Schedule SE (including clergy, and church employee income: wages from a church that elected exemption from social security and Medicare taxes); rental real estate, royalties, partnerships, S corporations, estates or trusts (Schedule E or a Schedule K-1); rental of personal property; farm income (Schedule F); gambling winnings, prizes or other income for Schedule 1 line 8; or an exclusion of Medicaid waiver payments (Schedule 1 line 8s)? (Schedule 1-A deductions are asked separately.)'
      expr:
        op: input
        source: 'Any income or adjustment requiring Schedule 1 other than unemployment compensation, educator expenses, the HSA deduction and student loan interest, including a taxable state or local tax refund; alimony; an IRA deduction; being self-employed or filing Schedule C (income or loss, including statutory-employee wages) or Schedule SE (including clergy, and church employee income: wages from a church that elected exemption from social security and Medicare taxes); rental real estate, royalties, partnerships, S corporations, estates or trusts (Schedule E or a Schedule K-1); rental of personal property; farm income (Schedule F); gambling winnings, prizes or other income for Schedule 1 line 8; or an exclusion of Medicaid waiver payments (Schedule 1 line 8s)? (Schedule 1-A deductions are asked separately.)'
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.credits
      printed: (helper)
      type: Bool
      label: 'Do you want to claim any credit other than the foreign tax credit claimed without Form 1116, the excess social security credit, the child tax credit, the credit for other dependents, the additional child tax credit and the earned income credit, or do you have any other amount for Schedule 3 Part I (for example a Form 8978 adjustment)?'
      expr:
        op: input
        source: 'Do you want to claim any credit other than the foreign tax credit claimed without Form 1116, the excess social security credit, the child tax credit, the credit for other dependents, the additional child tax credit and the earned income credit, or do you have any other amount for Schedule 3 Part I (for example a Form 8978 adjustment)?'
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.other_income
      printed: (helper)
      type: Bool
      label: 'Any nonresident alien status (you or your spouse, for any part of 2025) or other income or return treatment outside wages, interest, dividends, supported securities sales, Form 1099-R distributions and social security benefits, including wages or tips not on a Form W-2, Medicaid waiver payments (whether or not in Form W-2 box 1), dependent care or adoption benefits, other earned income (Form 1040 lines 1b-1h), or income or loss from a passive activity (including gain on selling an interest in one)?'
      expr:
        op: input
        source: 'Any nonresident alien status (you or your spouse, for any part of 2025) or other income or return treatment outside wages, interest, dividends, supported securities sales, Form 1099-R distributions and social security benefits, including wages or tips not on a Form W-2, Medicaid waiver payments (whether or not in Form W-2 box 1), dependent care or adoption benefits, other earned income (Form 1040 lines 1b-1h), or income or loss from a passive activity (including gain on selling an interest in one)?'
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.other_line16
      printed: (helper)
      type: Bool
      label: 'Any additional Form 1040 line 16 tax or filing, including filing Form 8814 (even with no tax), Form 4972, Form 8615, a section 962 election, Form 8621, a Form 8978 amount, or recapture of an education credit?'
      expr:
        op: input
        source: 'Any additional Form 1040 line 16 tax or filing, including filing Form 8814 (even with no tax), Form 4972, Form 8615, a section 962 election, Form 8621, a Form 8978 amount, or recapture of an education credit?'
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.ready
      printed: (helper)
      type: Bool
      label: All declared scope screens passed
      expr:
        op: test
        eq:
          - const: true
          - const: true
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
      refuses:
        - when: scope.schedule1
          form: Schedule 1
          remedy: Schedule 1 income and adjustments other than unemployment compensation, educator expenses, the HSA deduction and student loan interest are outside this tool.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.credits
          form: Other credit forms (Schedule 3 lines 2 to 4, 5b, 6d, 6f, 6l and 6m; Form 1040 lines 29 to 31)
          remedy: Credits other than the foreign tax credit by election, the excess social security credit, the Schedule 8812 credits and the earned income credit require forms outside this proof of concept.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.other_income
          form: Form 1040 additional income/return forms
          remedy: Prepare the required unsupported income or return treatment.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.other_line16
          form: Form 1040 line 16 additional tax forms
          remedy: Prepare the applicable additional tax or alternative worksheet.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: s3.married
          form: Schedule 3 line 11 (per-spouse computation)
          remedy: The interview currently represents one person. Married filing statuses are unsupported for
            this per-spouse rule.
          cite:
            doc: i1040gi
            locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
