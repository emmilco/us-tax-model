form:
  id: scope
  kind: form
  title: Proof-of-concept scope screening
  tax_year: 2025
  note: Stage 4 screening answers are explicit declarations, not automatic determinations of
    eligibility. Stage 5 wires these gates into the whole-return outcome.
  lines:
    - id: scope.schedule1
      printed: (helper)
      type: Bool
      label: 'Any income or adjustment requiring Schedule 1 other than business income or loss from Schedule C, unemployment compensation, educator expenses, the HSA deduction, the deductible part of self-employment tax, self-employed SEP and SIMPLE contributions, the self-employed health insurance deduction and student loan interest, including a taxable state or local tax refund; alimony; an IRA deduction; statutory-employee wages or clergy income; church employee income (wages from a church that elected exemption from social security and Medicare taxes); other qualified retirement plans for the self-employed (such as a solo 401(k) or other Keogh plan); rental real estate, royalties, partnerships, S corporations, estates or trusts (Schedule E or a Schedule K-1); rental of personal property; farm income (Schedule F); gambling winnings, prizes or other income for Schedule 1 line 8; or an exclusion of Medicaid waiver payments (Schedule 1 line 8s)? (Schedule 1-A deductions are asked separately.)'
      expr:
        op: input
        source: 'Any income or adjustment requiring Schedule 1 other than business income or loss from Schedule C, unemployment compensation, educator expenses, the HSA deduction, the deductible part of self-employment tax, self-employed SEP and SIMPLE contributions, the self-employed health insurance deduction and student loan interest, including a taxable state or local tax refund; alimony; an IRA deduction; statutory-employee wages or clergy income; church employee income (wages from a church that elected exemption from social security and Medicare taxes); other qualified retirement plans for the self-employed (such as a solo 401(k) or other Keogh plan); rental real estate, royalties, partnerships, S corporations, estates or trusts (Schedule E or a Schedule K-1); rental of personal property; farm income (Schedule F); gambling winnings, prizes or other income for Schedule 1 line 8; or an exclusion of Medicaid waiver payments (Schedule 1 line 8s)? (Schedule 1-A deductions are asked separately.)'
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.credits
      printed: (helper)
      type: Bool
      label: 'Do you want to claim any credit other than the foreign tax credit claimed without Form 1116, the excess social security credit, the child tax credit, the credit for other dependents, the additional child tax credit, the earned income credit, the credit for child and dependent care expenses (Form 2441), the retirement savings contributions credit (Form 8880) and the residential energy credits (Form 5695), or do you have any other amount for Schedule 3 Part I (for example a Form 8978 adjustment)?'
      expr:
        op: input
        source: 'Do you want to claim any credit other than the foreign tax credit claimed without Form 1116, the excess social security credit, the child tax credit, the credit for other dependents, the additional child tax credit, the earned income credit, the credit for child and dependent care expenses (Form 2441), the retirement savings contributions credit (Form 8880) and the residential energy credits (Form 5695), or do you have any other amount for Schedule 3 Part I (for example a Form 8978 adjustment)?'
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.other_income
      printed: (helper)
      type: Bool
      label: 'Any nonresident alien status (you or your spouse, for any part of 2025) or other income or return treatment outside wages, interest, dividends, supported securities sales, Form 1099-R distributions and social security benefits, including wages or tips not on a Form W-2, Medicaid waiver payments (whether or not in Form W-2 box 1), adoption benefits, dependent care benefits other than those shown in box 10 of a Form W-2 (or a grace-period amount from such a plan), other earned income (Form 1040 lines 1b to 1d and 1f to 1h), or income or loss from a passive activity (including gain on selling an interest in one)?'
      expr:
        op: input
        source: 'Any nonresident alien status (you or your spouse, for any part of 2025) or other income or return treatment outside wages, interest, dividends, supported securities sales, Form 1099-R distributions and social security benefits, including wages or tips not on a Form W-2, Medicaid waiver payments (whether or not in Form W-2 box 1), adoption benefits, dependent care benefits other than those shown in box 10 of a Form W-2 (or a grace-period amount from such a plan), other earned income (Form 1040 lines 1b to 1d and 1f to 1h), or income or loss from a passive activity (including gain on selling an interest in one)?'
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.other_line16
      printed: (helper)
      type: Bool
      label: 'Any additional Form 1040 line 16 tax or filing, including filing Form 8814 (even with no tax), Form 4972, Form 8615, a section 962 election, Form 8621, a Form 8978 amount, or recapture of an education credit?'
      expr:
        op: input
        source: 'Any additional Form 1040 line 16 tax or filing, including filing Form 8814 (even with no tax), Form 4972, Form 8615, a section 962 election, Form 8621, a Form 8978 amount, or recapture of an education credit?'
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.ready
      printed: (helper)
      type: Bool
      label: All declared scope screens passed
      expr:
        op: test
        eq:
          - const: true
          - const: true
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
      refuses:
        - when: scope.schedule1
          form: Schedule 1
          remedy: Schedule 1 income and adjustments other than unemployment compensation, educator expenses, the HSA deduction and student loan interest are outside this tool.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.credits
          form: Other credit forms (Schedule 3 lines 3 and 6a to 6z; Form 1040 lines 29 to 31)
          remedy: Credits other than the foreign tax credit by election, the excess social security credit, the Schedule 8812 credits, the earned income credit, the child and dependent care credit, the saver's credit and the residential energy credits require forms outside this proof of concept.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.other_income
          form: Form 1040 additional income/return forms
          remedy: Prepare the required unsupported income or return treatment.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.other_line16
          form: Form 1040 line 16 additional tax forms
          remedy: Prepare the applicable additional tax or alternative worksheet.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: s3.mfs
          form: Married filing separately
          remedy: The rules for a married filing separately return (among them a spouse who itemizes, the Social
            Security base for spouses who lived together and the credits a separate return cannot take) are outside
            this tool. Married filing jointly is supported.
          cite:
            doc: i1040gi
            locator: p. 14, Married Filing Separately
