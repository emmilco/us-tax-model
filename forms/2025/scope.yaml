form:
  id: scope
  kind: form
  title: Proof-of-concept scope screening
  tax_year: 2025
  note: Stage 4 screening answers are explicit declarations, not automatic determinations of
    eligibility. Stage 5 wires these gates into the whole-return outcome.
  lines:
    - id: scope.schedule1
      printed: (helper)
      type: Bool
      label: Any income or adjustment requiring Schedule 1, including a taxable state/local tax refund?
      expr:
        op: input
        source: Any income or adjustment requiring Schedule 1, including a taxable state/local tax refund?
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.schedule1a
      printed: (helper)
      type: Bool
      label: Any deduction claimed on Schedule 1-A, including tips, overtime, car-loan interest or
        enhanced senior deduction?
      expr:
        op: input
        source: Any deduction claimed on Schedule 1-A, including tips, overtime, car-loan interest or
          enhanced senior deduction?
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.credits
      printed: (helper)
      type: Bool
      label: Any dependent or other credit outside the simple foreign tax credit and excess Social
        Security credit?
      expr:
        op: input
        source: Any dependent or other credit outside the simple foreign tax credit and excess Social
          Security credit?
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.other_income
      printed: (helper)
      type: Bool
      label: Any retirement, Social Security, nonresident or other income/return treatment outside wages,
        interest, dividends and supported securities sales, including wages or tips not on a Form W-2,
        Medicaid waiver payments, dependent care or adoption benefits, or other earned income (Form
        1040 lines 1b–1h)?
      expr:
        op: input
        source: Any retirement, Social Security, nonresident or other income/return treatment outside wages,
          interest, dividends and supported securities sales, including wages or tips not on a Form W-2,
          Medicaid waiver payments, dependent care or adoption benefits, or other earned income (Form
          1040 lines 1b–1h)?
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.other_line16
      printed: (helper)
      type: Bool
      label: Any additional Form 1040 line 16 tax, including Forms 8814, 4972, 8615 or a section 962
        election?
      expr:
        op: input
        source: Any additional Form 1040 line 16 tax, including Forms 8814, 4972, 8615 or a section 962
          election?
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: scope.ready
      printed: (helper)
      type: Bool
      label: All declared scope screens passed
      expr:
        op: test
        eq:
          - const: true
          - const: true
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
      refuses:
        - when: scope.schedule1
          form: Schedule 1
          remedy: Schedule 1 income and adjustments are outside this proof of concept.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.schedule1a
          form: Schedule 1-A
          remedy: Schedule 1-A deductions are outside this proof of concept.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.credits
          form: Schedule 8812 / other credit forms
          remedy: Dependent and other unsupported credits require forms outside this proof of concept.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.other_income
          form: Form 1040 additional income/return forms
          remedy: Prepare the required unsupported income or return treatment.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.other_line16
          form: Form 1040 line 16 additional tax forms
          remedy: Prepare the applicable additional tax or alternative worksheet.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: s3.married
          form: Schedule 3 line 11 (per-spouse computation)
          remedy: The interview currently represents one person. Married filing statuses are unsupported for
            this per-spouse rule.
          cite:
            doc: i1040gi
            locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
