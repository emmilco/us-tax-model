form:
  id: scope
  kind: form
  title: Proof-of-concept scope screening
  tax_year: 2025
  note: Stage 4 screening answers are explicit declarations, not automatic determinations of
    eligibility. Stage 5 wires these gates into the whole-return outcome.
  lines:
    - id: scope.schedule1
      printed: (helper)
      type: Bool
      label: |-
        Any income or adjustment requiring Schedule 1 other than the ones this tool asks about separately, including any of the following?

        Income:
        - statutory-employee wages or income as a minister, a member of a religious order who has not taken a vow of poverty, or a Christian Science practitioner
        - church employee income (wages from a church or qualified church-controlled organization that elected exemption from social security and Medicare taxes)
        - a refund or other recovery of an amount you deducted or took a credit for in an earlier year, other than a state or local income tax refund, for example:
          - a refund of general sales tax, real estate tax or personal property tax
          - a refund of mortgage interest in box 4 of Form 1098
          - a reimbursement of medical expenses
          - a payment on a bad debt you deducted
        - sales of business property (Form 4797)
        - a net operating loss deduction
        - rental real estate, royalties, partnerships, S corporations, estates or trusts (Schedule E or a Schedule K-1)
        - rental of personal property
        - farm income (Schedule F)
        - an exclusion of Medicaid waiver payments (Schedule 1 line 8s)

        Adjustments:
        - other qualified retirement plans for the self-employed (such as a solo 401(k) or other Keogh plan)
        - an adjustment on Schedule 1 line 12, 14 or 23

        The ones this tool asks about separately:
        - business income or loss from Schedule C
        - a taxable state or local income tax refund
        - alimony under an agreement made before 2019
        - unemployment compensation
        - the line 8 items asked one by one
        - educator expenses
        - the HSA deduction
        - the deductible part of self-employment tax
        - self-employed SEP and SIMPLE contributions
        - the self-employed health insurance deduction
        - the penalty on early withdrawal of savings
        - the IRA deduction
        - student loan interest
        - jury duty pay you gave your employer

        Schedule 1-A deductions are asked separately.
      expr:
        op: input
        source: |-
          Any income or adjustment requiring Schedule 1 other than the ones this tool asks about separately, including any of the following?

          Income:
          - statutory-employee wages or income as a minister, a member of a religious order who has not taken a vow of poverty, or a Christian Science practitioner
          - church employee income (wages from a church or qualified church-controlled organization that elected exemption from social security and Medicare taxes)
          - a refund or other recovery of an amount you deducted or took a credit for in an earlier year, other than a state or local income tax refund, for example:
            - a refund of general sales tax, real estate tax or personal property tax
            - a refund of mortgage interest in box 4 of Form 1098
            - a reimbursement of medical expenses
            - a payment on a bad debt you deducted
          - sales of business property (Form 4797)
          - a net operating loss deduction
          - rental real estate, royalties, partnerships, S corporations, estates or trusts (Schedule E or a Schedule K-1)
          - rental of personal property
          - farm income (Schedule F)
          - an exclusion of Medicaid waiver payments (Schedule 1 line 8s)

          Adjustments:
          - other qualified retirement plans for the self-employed (such as a solo 401(k) or other Keogh plan)
          - an adjustment on Schedule 1 line 12, 14 or 23

          The ones this tool asks about separately:
          - business income or loss from Schedule C
          - a taxable state or local income tax refund
          - alimony under an agreement made before 2019
          - unemployment compensation
          - the line 8 items asked one by one
          - educator expenses
          - the HSA deduction
          - the deductible part of self-employment tax
          - self-employed SEP and SIMPLE contributions
          - the self-employed health insurance deduction
          - the penalty on early withdrawal of savings
          - the IRA deduction
          - student loan interest
          - jury duty pay you gave your employer

          Schedule 1-A deductions are asked separately.
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31; i1040gi p. 43, Clergy, "The following instructions apply to ministers, members of religious orders who have not taken a vow of poverty, and Christian Science practitioners."; i1040sse p. 1, Employees of Churches and Church Organizations, "Church employee income is wages you received as an employee (other than as a minister, member of a religious order, or Christian Science practitioner) of a church or qualified church-controlled organization that has a certificate in effect electing an exemption from employer social security and Medicare taxes."
    - id: scope.other_income
      printed: (helper)
      type: Bool
      label: |-
        Any nonresident alien status, or other income or return treatment outside the kinds listed below?

        Kinds this question is not about:
        - wages
        - interest
        - dividends
        - supported securities sales
        - Form 1099-R distributions
        - social security benefits

        Nonresident alien status:
        - you or your spouse, for any part of 2025

        Other income or return treatment, including:
        - wages or tips not on a Form W-2
        - Medicaid waiver payments (whether or not in Form W-2 box 1)
        - adoption benefits
        - dependent care benefits other than those shown in box 10 of a Form W-2 (or a grace-period amount from such a plan)
        - other earned income (Form 1040 lines 1b to 1d and 1f to 1h)
        - income or loss from a passive activity (including gain on selling an interest in one)
        - the 2025 part of a qualified disaster recovery distribution you received in 2023 or 2024, or a 2025 repayment of one (Form 8915-F)
        - a repayment to an IRA of a qualified reservist distribution (Form 8606 line 1)
        - you or your spouse being a debtor in a chapter 11 bankruptcy case open at any time in 2025, even if your only income is wages, interest or dividends
      expr:
        op: input
        source: |-
          Any nonresident alien status, or other income or return treatment outside the kinds listed below?

          Kinds this question is not about:
          - wages
          - interest
          - dividends
          - supported securities sales
          - Form 1099-R distributions
          - social security benefits

          Nonresident alien status:
          - you or your spouse, for any part of 2025

          Other income or return treatment, including:
          - wages or tips not on a Form W-2
          - Medicaid waiver payments (whether or not in Form W-2 box 1)
          - adoption benefits
          - dependent care benefits other than those shown in box 10 of a Form W-2 (or a grace-period amount from such a plan)
          - other earned income (Form 1040 lines 1b to 1d and 1f to 1h)
          - income or loss from a passive activity (including gain on selling an interest in one)
          - the 2025 part of a qualified disaster recovery distribution you received in 2023 or 2024, or a 2025 repayment of one (Form 8915-F)
          - a repayment to an IRA of a qualified reservist distribution (Form 8606 line 1)
          - you or your spouse being a debtor in a chapter 11 bankruptcy case open at any time in 2025, even if your only income is wages, interest or dividends
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31; p575 p. 35, "if you received a $18,000 qualified
          disaster recovery distribution in 2023, you can include $6,000 in your income in 2023, 2024, and 2025"; i8606 p. 9, Line 1, "Include on line 1 any repayment of a qualified reservist distribution."; i1040gi p. 23, Chapter 11 Bankruptcy Cases, "If you are a debtor in a chapter 11 bankruptcy case, income taxable to the bankruptcy estate and reported on the estate’s income tax return includes:" and "Because this income is taxable to the estate, don’t include this income on your own individual income tax return."
    - id: scope.other_line16
      printed: (helper)
      type: Bool
      label: |-
        Any additional Form 1040 line 16 tax or filing, including any of the following?

        A child's unearned income:
        - filing Form 8814 (even with no tax)
        - Form 8615, required if all of these apply:
          - you had more than $2,700 of unearned income
          - you are required to file
          - you do not file jointly
          - you have a parent who was alive at the end of 2025
          - you were under 18 at the end of 2025, or 18 with earned income of not more than half your support, or a full-time student 19 to 23 with earned income of not more than half your support

        Foreign corporations:
        - a section 962 election
        - Form 8621
        - stock you own, directly or indirectly, in a controlled foreign corporation (CFC) or a passive foreign investment company (PFIC), even with nothing to include in income for 2025 (its distributions, dispositions and related adjustments can make the modified AGI of Form 8960 line 13 differ from AGI)

        Other:
        - Form 4972
        - a Form 8978 amount
        - recapture of an education credit
        - income averaging of farming or fishing income on Schedule J (if you choose it)
      expr:
        op: input
        source: |-
          Any additional Form 1040 line 16 tax or filing, including any of the following?

          A child's unearned income:
          - filing Form 8814 (even with no tax)
          - Form 8615, required if all of these apply:
            - you had more than $2,700 of unearned income
            - you are required to file
            - you do not file jointly
            - you have a parent who was alive at the end of 2025
            - you were under 18 at the end of 2025, or 18 with earned income of not more than half your support, or a full-time student 19 to 23 with earned income of not more than half your support

          Foreign corporations:
          - a section 962 election
          - Form 8621
          - stock you own, directly or indirectly, in a controlled foreign corporation (CFC) or a passive foreign investment company (PFIC), even with nothing to include in income for 2025 (its distributions, dispositions and related adjustments can make the modified AGI of Form 8960 line 13 differ from AGI)

          Other:
          - Form 4972
          - a Form 8978 amount
          - recapture of an education credit
          - income averaging of farming or fishing income on Schedule J (if you choose it)
      cite:
        doc: f1040
        locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31; i1040gi p. 36, "You must file Form 8615 if you meet all of the following conditions." and "If you had income from farming or fishing, your tax may be less if you choose to figure it using income averaging on Schedule J."; i8960 p. 22, Line 13—Modified Adjusted Gross Income (MAGI), "If you exclude amounts under section 911 or own certain CFCs or PFICs, your MAGI is your AGI as modified by certain rules described in Regulations section 1.1411-10(e)(1).", "Increase AGI by the amount of any distributions described in section 959(d) or 1293(c) included in your NII as a dividend." and "Increase AGI by the amount of any excess distributions derived from a PFIC that are dividends included in MAGI but not included in gross income for regular income tax purposes."
    - id: scope.ready
      printed: (helper)
      type: Bool
      label: All declared scope screens passed
      expr:
        op: test
        eq:
          - const: true
          - const: true
      cite:
        doc: f1040
        locator: 'Form 1040 (2025), the lines the screens cover: line 8, "Additional income from Schedule 1, line 10", line 10, "Adjustments to income from Schedule 1, line 26", line 13b, "Additional deductions from Schedule 1-A, line 38", line 16, "Tax (see instructions). Check if any from Form(s)", line 19, "Child tax credit or credit for other dependents from Schedule 8812", line 20, "Amount from Schedule 3, line 8", line 27a, "Earned income credit (EIC)", line 28, "Additional child tax credit (ACTC) from Schedule 8812", line 29, "American opportunity credit from Form 8863, line 8", line 30, "Refundable adoption credit from Form 8839, line 13", line 31, "Amount from Schedule 3, line 15"'
      refuses:
        - when: scope.schedule1
          form: Schedule 1
          remedy: Schedule 1 income and adjustments other than the ones this tool computes (Schedule C business income, a taxable state or local income tax refund, alimony under an agreement made before 2019, unemployment compensation, the supported line 8 items, educator expenses, the HSA deduction, the deductible part of self-employment tax, self-employed SEP and SIMPLE contributions, the self-employed health insurance deduction, the early withdrawal penalty, the IRA deduction, student loan interest and jury duty pay given to your employer) are outside this tool.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.other_income
          form: Form 1040 additional income/return forms
          remedy: Prepare the required unsupported income or return treatment.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.other_line16
          form: Form 1040 line 16 additional tax forms
          remedy: Prepare the applicable additional tax or alternative worksheet.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: s3.mfs
          form: Married filing separately
          remedy: The rules for a married filing separately return (among them a spouse who itemizes, the Social
            Security base for spouses who lived together and the credits a separate return cannot take) are outside
            this tool. Married filing jointly is supported.
          cite:
            doc: i1040gi
            locator: p. 14, Married Filing Separately
        - when: s3.adoption_if_any
          form: Form 8839 (adoption credit)
          remedy: An adoption that became final in 2025, or adoption costs paid in 2025, can give the adoption credit (Form 8839, with its refundable part on Form 1040 line 30), which this tool does not prepare.
          cite:
            doc: i8839
            locator: p. 1, Purpose of Form, "You may be able to take this credit in 2025 if any of the following statements are true"
        - when: s3.adoption_us_if_earlier
          form: Form 8839 (adoption credit)
          remedy: Costs paid in 2024 toward adopting a U.S. child, where the adoption was not final at the end of 2024, are credited on the 2025 return (Form 8839), which this tool does not prepare.
          cite:
            doc: i8839
            locator: p. 1, Purpose of Form, "2024 and the adoption wasn’t final at the end of 2024"; p. 3, Domestic Adoption, "the year after the year of the payment"
        - when: s3.credit_bond
          form: Form 8912 (credit to holders of tax credit bonds)
          remedy: A tax credit from a bond, or one a fund passes on (Form 1097-BTC), is claimed on Form 8912, which this tool does not prepare.
          cite:
            doc: i8912
            locator: p. 1, Who Can Claim the Credits, "can claim the credit by filing Form 8912 for each tax year in which it holds the bond on a credit allowance date"; p. 2, Line 1, "This amount is the total bond credits reported to you on Form(s) 1097-BTC"
        - when: s3.elderly_credit_if_asked
          form: Schedule R (credit for the elderly or the disabled)
          remedy: The credit for the elderly or the disabled (Schedule R) is outside this tool. To go on without the credit, answer No to that question.
          cite:
            doc: i1040sr
            locator: p. 1, Qualified Individual, "You are a qualified individual for this credit if you are a U.S. citizen or resident alien"
        - when: s3.ev_dealer_if_ev
          form: Form 8936 (clean vehicle credits)
          remedy: A dealer took the clean vehicle credit off the price, so Form 8936 and its Schedule A must be filed with this return; this tool does not prepare them.
          cite:
            doc: i8936
            locator: p. 1, Purpose of Form, "You must file Form 8936 and Schedule A (Form 8936) if you purchased a new or used clean vehicle from a registered dealer and reduced the amount you paid at the time of sale by transferring the credit to the dealer"
        - when: s3.ev_credit_if_bought
          form: Form 8936 (clean vehicle credits)
          remedy: This tool does not prepare the clean vehicle credits (Form 8936). To go on without the credit, answer No to that question.
          cite:
            doc: i8936
            locator: p. 1, Purpose of Form, "to figure the following credits for clean vehicles you placed in service during your tax year"
        - when: s3.ev_equipment_if_ev
          form: Form 8911 (alternative fuel vehicle refueling property credit)
          remedy: This tool does not prepare the credit for vehicle charging or fueling equipment (Form 8911). To go on without the credit, answer No to that question.
          cite:
            doc: i8911
            locator: p. 1, Purpose of Form, "to figure your credit for alternative fuel vehicle refueling property you placed in service during your tax year"
        - when: s3.farmland_deferral_if_sold
          form: Form 1062 (Schedule 3 line 13z)
          remedy: The election to pay the tax on a sale of farmland in installments (Form 1062) is reported on Schedule 3 line 13z, which this tool does not prepare.
          cite:
            doc: i1040gi
            locator: p. 117, Line 13z, "Use line 13z to report the credit under section 960(c) with respect to an excess limitation account", "Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin Islands" and "If you made the election to defer net income tax attributable to the gain on the sale or exchange of qualified farmland property"
        - when: ftc.carryover_if_asked
          form: Form 1116
          remedy: A foreign tax credit carried from another year is claimed on Form 1116, which this tool does not prepare.
          cite:
            doc: i1116
            locator: p. 19, Line 10, "Enter the unused foreign taxes in the separate category from another tax year that are eligible to be carried forward to or back to 2025"
        - when: s3.section960c_if_foreign
          form: Schedule 3 line 13z (section 960(c) credit)
          remedy: The credit under section 960(c) is reported on Schedule 3 line 13z, which this tool does not prepare.
          cite:
            doc: i1040gi
            locator: p. 117, Line 13z, "Use line 13z to report the credit under section 960(c) with respect to an excess limitation account", "Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin Islands" and "If you made the election to defer net income tax attributable to the gain on the sale or exchange of qualified farmland property"
        - when: s3.section965_if_foreign
          form: Schedule 3 line 13d (net 965 tax liability)
          remedy: A net 965 tax liability paid in installments is reported on Schedule 3 line 13d, which this tool does not prepare.
          cite:
            doc: i1040gi
            locator: p. 117, Line 13d, "If you elected to pay your net 965 tax liability in installments, report the deferred amount on line 13d"
        - when: s3.virgin_islands_if_foreign
          form: Form 8689 (Schedule 3 line 13z)
          remedy: Tax allocable to the U.S. Virgin Islands (Form 8689) is reported on Schedule 3 line 13z, which this tool does not prepare.
          cite:
            doc: i1040gi
            locator: p. 117, Line 13z, "Use line 13z to report the credit under section 960(c) with respect to an excess limitation account", "Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin Islands" and "If you made the election to defer net income tax attributable to the gain on the sale or exchange of qualified farmland property"
        - when: s3.kerosene_credit_if_kerosene
          form: Form 4136 (credit for federal tax paid on fuels)
          remedy: This tool does not prepare the credit for federal tax paid on fuels (Form 4136). To go on without the credit, answer No to that question.
          cite:
            doc: i4136
            locator: p. 2, Part I—Information About Your Business, "If you are claiming a credit for the tax on undyed kerosene you purchased (other than from a blocked pump) and used in your home during the tax period for heating, lighting, or cooking"
        - when: s3.prior_amt_if_forms
          form: Form 8801 (credit for prior year minimum tax)
          remedy: Alternative minimum tax on your 2024 return can give a credit for 2025 (Form 8801), which this tool does not prepare.
          cite:
            doc: i8801
            locator: p. 1, Who Should File, "An AMT liability and adjustments or preferences other than exclusion items"
        - when: s3.prior_forms_if_forms
          form: Credit carried from an earlier year (Form 3800, 8396, 8801, 8834, 8839, 8859 or 8912)
          remedy: A credit carried over from an earlier year is outside this tool.
          cite:
            doc: i3800
            locator: p. 3, Carryback and Carryforward of Unused Credit, "unused general business credits may be carried back 1 year and carried forward 20 years"; f8396 p. 2, Part II—Mortgage Interest Credit Carryforward to 2026, "you may have an unused credit to carry forward to the next 3 tax years"; i8801 p. 1, Who Should File, "A credit carryforward to 2025 (on 2024 Form 8801, line 26)"; f8834 p. 2, Line 1, "Enter the qualified electric vehicle passive activity credits allowed for your current tax year from Form 8582-CR"; i8839 p. 1, Purpose of Form, "You have a carryforward of an adoption credit from 2024"; f8859 p. 1, Purpose of Form, "to claim a carryforward of the District of Columbia first-time homebuyer credit from 2024"; i8912 p. 3, Line 12, "you may carry the unused portion of the credit to the next tax year"
        - when: s3.repaid_income
          form: Repayment of income of an earlier year (Schedule 3 line 13b or Schedule A line 16)
          remedy: A repayment of more than $3,000 of income reported in an earlier year gives a choice between a deduction and a credit (Schedule 3 line 13b), which this tool does not figure.
          cite:
            doc: p525
            locator: p. 36, Repayments, "If the amount you repaid was more than $3,000, you can deduct the repayment as an other itemized deduction on Schedule A (Form 1040), line 16, if you included the income under a claim of right" and "However, you can choose to take a credit for the year of repayment"; i1040gi p. 117, Line 13b, "If you are claiming a credit for repayment of amounts you included in your income in an earlier year because it appeared you had a right to the income"
        - when: s3.mcc_if_interest
          form: Form 8396 (mortgage interest credit)
          remedy: A mortgage credit certificate gives the mortgage interest credit (Form 8396), which also reduces the home mortgage interest deducted on Schedule A; this tool does not prepare it.
          cite:
            doc: f8396
            locator: p. 2, Who Can Claim the Credit, "You can claim the credit only if you were issued a qualified Mortgage Credit Certificate (MCC) by a state or local governmental unit or agency"; p. 2, Line 3, "you must reduce the amount of home mortgage interest you would otherwise deduct on Schedule A by the amount on Form 8396, line 3"
