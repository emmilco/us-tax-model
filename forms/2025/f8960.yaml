    - id: f8960.line9a
      printed: 9a
      type: NonNegDollars
      label: Investment interest actually deducted on Schedule A
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: true
            then: sa.line9
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: false
            then: f8960.zero
      cite:
        doc: i8960
        locator: p. 17, line 9a
    - id: f8960.line9b
      printed: 9b
      type: NonNegDollars
      label: Allowed tax deduction reasonably allocable to NII
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: true
            then: f8960.allocated_taxes
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: false
            then: f8960.zero
      cite:
        doc: i8960
        locator: pp. 17–18, line 9b; any reasonable allocation method
      refuses:
        - when: f8960.bad_allocation
          form: Form 8960 line 9b
          remedy: "Correct the allocation: the amount allocated to net investment income cannot exceed the
            allowed Schedule A tax deduction."
          cite:
            doc: i8960
            locator: pp. 17–18, allowable taxes allocable to net investment income
