form:
  id: f8960
  kind: form
  title: Form 8960 — wage, interest, dividend and securities slice
  tax_year: 2025
  note: The taxpayer supplies a reasonable tax allocation. No ratio is chosen automatically. Schedule
    A amounts are used only if actually itemized. NIIT uses the limited capital loss on Form 1040
    line 7a, not the unlimited Schedule D loss.
  lines:
    - id: f8960.unsupported
      printed: (helper)
      type: Bool
      label: 'Any annuity, rental, royalty, business or pass-through income; a CFC or PFIC holding; a section 911 exclusion; a disposition adjustment; a section 1411 net operating loss; excluded savings bond interest (Form 8815); a deductible investment expense other than investment interest or state and local tax; or another net investment income adjustment?'
      expr:
        op: input
        source: 'Any annuity, rental, royalty, business or pass-through income; a CFC or PFIC holding; a section 911 exclusion; a disposition adjustment; a section 1411 net operating loss; excluded savings bond interest (Form 8815); a deductible investment expense other than investment interest or state and local tax; or another net investment income adjustment?'
      cite:
        doc: f8960
        locator: Form 8960 (2025), Parts I–III, individual lines 1–17
    - id: f8960.refund
      printed: (helper)
      type: Bool
      label: 'Any recovery or refund in 2025 of an amount deducted on an earlier Form 8960 (for example a state or local income tax refund, or a refund of foreign income tax), even if none of it is taxable on Form 1040?'
      expr:
        op: input
        source: 'Any recovery or refund in 2025 of an amount deducted on an earlier Form 8960 (for example a state or local income tax refund, or a refund of foreign income tax), even if none of it is taxable on Form 1040?'
      cite:
        doc: f8960
        locator: Form 8960 (2025), Parts I–III, individual lines 1–17
    - id: f8960.allocated_taxes
      printed: (helper)
      type: NonNegDollars
      label: Deductible state/local income and property taxes reasonably allocated to net investment
        income; exclude foreign taxes for which a credit is claimed
      expr:
        op: input
        source: Deductible state/local income and property taxes reasonably allocated to net investment
          income; exclude foreign taxes for which a credit is claimed
      cite:
        doc: f8960
        locator: Form 8960 (2025), Parts I–III, individual lines 1–17
    - id: f8960.zero
