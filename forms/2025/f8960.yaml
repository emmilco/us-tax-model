          form: Form 8960 additional adjustments
          remedy: The required investment-income or MAGI modifications are outside this supported slice.
          cite:
            doc: f8960
            locator: Form 8960 (2025), Parts I–III, individual lines 1–17
        - when: f8960.refund
          form: Form 8960 Deduction Recoveries Worksheet / Schedule 1
          remedy: A prior deducted expense recovery needs the NIIT recovery worksheet and review of Schedule 1
            reporting; this path is outside scope.
