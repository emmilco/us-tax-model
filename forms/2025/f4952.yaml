form:
  id: f4952
  kind: form
  title: Form 4952 — supported investment-interest deduction and election
  tax_year: 2025
  note: The election is supplied by the taxpayer, not optimized or made automatically.
    Capital-gain-first allocation is used. The carryforward from 2024 (2024 line 7) is entered on line 2, and the
    carryforward to 2026 is shown on line 7. The form is used only with investment interest, a 2024 carryforward or a
    line 4g election; otherwise lines 4g (as elected) and 8 are zero for Schedule A and the Schedule D Tax Worksheet, and
    its screens are not reached.
  lines:
    - id: f4952.line1
      printed: "1"
      type: NonNegDollars
      label: Investment interest paid or accrued in 2025
      expr:
        op: input
        source: Investment interest paid or accrued in 2025, regardless of when you incurred the debt, meaning interest on a
          loan or the part of a loan allocable to property held for investment (if you used a loan's proceeds for more than
          one purpose, only the interest allocable to the investment use). Do not include personal interest (including
          qualified residence interest), interest allocable to a passive activity, interest that is capitalized (such as
          construction interest subject to section 263A), interest related to tax-exempt interest income, or interest
          disallowed under section 264 on debt with respect to life insurance, endowment or annuity contracts.
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction; p. 3, Allocation of Interest Expense, "If you paid or
          accrued interest on a loan and used the loan proceeds for more than one purpose, you may have to allocate the
          interest."; p. 3, Line 1, "Investment interest expense is interest paid or accrued on a loan or part of a loan
          that is allocable to property held for investment (as defined later).", "Personal interest under section 163(h),
          including qualified residence interest.", "Any interest expense that is capitalized, such as construction
          interest subject to section 263A." and "Interest expense, disallowed under section 264, on indebtedness with
          respect to life insurance, endowment, or annuity contracts issued after June 8, 1997"
    - id: f4952.carryover
      printed: (helper)
      type: Bool
      label: Do you have investment interest expense disallowed in 2024 and carried forward (line 7 of your 2024 Form 4952)?
      expr:
        op: input
        source: Do you have investment interest expense that was disallowed in 2024 and carried forward to 2025 (an amount
          on line 7 of your 2024 Form 4952)?
      cite:
        doc: f4952
        locator: p. 1, Part I, line 2, "Disallowed investment interest expense from 2024 Form 4952, line 7"
    - id: f4952.prior_7
      printed: (helper)
      type: NonNegDollars
      label: The amount on line 7 of your 2024 Form 4952
      expr:
        op: input
        source: The amount on line 7 of your 2024 Form 4952 (disallowed investment interest expense carried forward to 2025)
      cite:
        doc: f4952
        locator: p. 1, Part I, line 2, "Disallowed investment interest expense from 2024 Form 4952, line 7"
    - id: f4952.unsupported
      printed: (helper)
      type: Bool
      label: 'Is any of the interest you count as investment interest paid or accrued in 2025 (line 1), or any of your 2024 carryforward, attributable to royalties, a trade or business, a passive activity, tax-exempt income, or an activity for which you aren''t at risk (Form 6198); do you have any deductible investment expense other than interest (for example depreciation or depletion on assets that produce investment income, or investment expenses on a Schedule K-1); or any other investment income or expense beyond interest, dividends and securities sales?'
      expr:
        op: input
        source: 'Is any of the interest you count as investment interest paid or accrued in 2025 (line 1), or any of your 2024 carryforward, attributable to royalties, a trade or business, a passive activity, tax-exempt income, or an activity for which you aren''t at risk (Form 6198); do you have any deductible investment expense other than interest (for example depreciation or depletion on assets that produce investment income, or investment expenses on a Schedule K-1); or any other investment income or expense beyond interest, dividends and securities sales?'
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction; p. 4, Line 8, "if any part of the interest expense is
          attributable to royalties, enter that part on Schedule E (Form 1040)" and "If any of your deductible investment
          interest expense is attributable to an activity for which you aren’t at risk, you must also use Form 6198"
    - id: f4952.alternative_allocation
      printed: (helper)
      type: Bool
      label: Elect an alternative allocation of Form 4952 line 4g to qualified dividends instead of
        capital gains first?
      expr:
        op: input
        source: Elect an alternative allocation of Form 4952 line 4g to qualified dividends instead of
          capital gains first?
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line4a
      printed: 4a
      type: Dollars
      label: Gross income from property held for investment, before subtracting qualified dividends (taxable interest
        and ordinary dividends, Form 1040 lines 2b and 3b)
      expr:
        op: sum
        of:
          - f1040.line2b
          - f1040.line3b
      cite:
        doc: f4952
        locator: p. 3, Line 4a, "Gross income from property held for investment includes income, unless derived in the
          ordinary course of a trade or business, from interest, ordinary dividends (except Alaska Permanent Fund
          dividends), annuities, and royalties"
    - id: f4952.line4g
      printed: 4g
      type: NonNegDollars
      label: Amount of qualified dividends and net capital gain elected into investment income
      expr:
        op: input
        source: Amount of qualified dividends and net capital gain elected into investment income
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.zero
      printed: (helper)
      type: NonNegDollars
      label: Zero amount
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.used
      printed: (helper)
      type: Bool
      label: Form 4952 is used (an election on line 4g, investment interest paid or accrued in 2025, or a carryforward from
        2024)
      expr:
        op: test
        any:
          - op: test
            eq:
              - f4952.has_election
              - const: true
          - op: test
            eq:
              - f4952.carryover
              - const: true
          - op: test
            gt:
              - f4952.line1
              - const: 0
      cite:
        doc: f4952
        locator: p. 3, Who Must File, "you must file Form 4952 to claim a deduction for your investment interest expense";
          p. 4, "To make the election, enter on line 4g the amount you elect to include in investment income"
    - id: f4952.line2
      printed: "2"
      type: NonNegDollars
      label: Disallowed investment interest expense from 2024 Form 4952, line 7
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f4952.carryover
                - const: true
            then: f4952.prior_7
          - guard:
              op: test
              eq:
                - f4952.carryover
                - const: false
            then: f4952.zero
      cite:
        doc: f4952
        locator: p. 1, Part I, line 2, "Disallowed investment interest expense from 2024 Form 4952, line 7"
      refuses:
        - when: f4952.unsupported
          form: Form 4952 / Form 6198 / Schedule E
          remedy: Allocate the interest and prepare the applicable unsupported schedule or at-risk
            computation.
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
        - when: f4952.alternative_allocation
          form: Form 4952 alternative allocation
          remedy: Only the default capital-gain-first allocation is supported; alternative allocation and Form
            1116 coordination are outside scope.
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line3
      printed: "3"
      type: NonNegDollars
      label: Add lines 1 and 2
      expr:
        op: sum
        of:
          - f4952.line1
          - f4952.line2
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line4b
      printed: 4b
      type: NonNegDollars
      label: Qualified dividends included on line 4a
      expr:
        op: copy
        from: f1040.line3a
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.bad_dividends
      printed: (helper)
      type: Bool
      label: Qualified dividends exceed gross investment income
      expr:
        op: test
        gt:
          - f4952.line4b
          - f4952.line4a
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line4c
      printed: 4c
      type: Dollars
      label: Subtract line 4b from line 4a
      expr:
        op: subtract
        from: f4952.line4a
        take: f4952.line4b
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
      refuses:
        - when: f4952.bad_dividends
          form: Form 4952
          remedy: "Correct investment-income inputs: line 4b is included in line 4a."
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line4d
      printed: 4d
      type: NonNegDollars
      label: Net gain from investment-property dispositions, including distributions
      expr:
        op: subtract_floor0
        from: sd.line16
        take:
          const: 0
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line4e
      printed: 4e
      type: NonNegDollars
      label: Smaller of line 4d and net capital gain
      expr:
        op: smaller_of
        of:
          - f4952.line4d
          - sd.net_gain
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line4f
      printed: 4f
      type: Dollars
      label: Subtract line 4e from line 4d
      expr:
        op: subtract
        from: f4952.line4d
        take: f4952.line4e
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.election_limit
      printed: (helper)
      type: NonNegDollars
      label: "Maximum election: add lines 4b and 4e"
      expr:
        op: sum
        of:
          - f4952.line4b
          - f4952.line4e
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.bad_election
      printed: (helper)
      type: Bool
      label: Election exceeds lines 4b plus 4e
      expr:
        op: test
        gt:
          - f4952.line4g
          - f4952.election_limit
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.election_checked
      printed: (helper)
      type: NonNegDollars
      label: Validated default-allocation election
      expr:
        op: copy
        from: f4952.line4g
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
      refuses:
        - when: f4952.unsupported
          form: Form 4952 / Form 6198 / Schedule E
          remedy: Allocate the interest and prepare the applicable unsupported schedule or at-risk
            computation.
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
        - when: f4952.alternative_allocation
          form: Form 4952 alternative allocation
          remedy: Only the default capital-gain-first allocation is supported; alternative allocation and Form
            1116 coordination are outside scope.
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
        - when: f4952.bad_election
          form: Form 4952
          remedy: Enter no more than the sum of lines 4b and 4e on line 4g.
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.has_election
      printed: (helper)
      type: Bool
      label: An amount is entered on line 4g
      expr:
        op: test
        gt:
          - f4952.line4g
          - const: 0
      cite:
        doc: f4952
        locator: p. 4, Line 4g, "To make the election, enter on line 4g the amount you elect to include in investment
          income"
    - id: f4952.election
      printed: (helper)
      type: NonNegDollars
      label: The validated line 4g election when an amount is entered on line 4g; zero otherwise
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f4952.has_election
                - const: true
            then: f4952.election_checked
          - guard:
              op: test
              eq:
                - f4952.has_election
                - const: false
            then: f4952.zero
      cite:
        doc: f4952
        locator: p. 4, Line 4g, "To make the election, enter on line 4g the amount you elect to include in investment
          income"
    - id: f4952.line4h
      printed: 4h
      type: Dollars
      label: Add lines 4c, 4f and 4g
      expr:
        op: sum
        of:
          - f4952.line4c
          - f4952.line4f
          - f4952.election
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line5
      printed: "5"
      type: NonNegDollars
      label: Other deductible investment expenses are zero in the supported securities slice
      expr:
        op: copy
        from: f4952.zero
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
      refuses:
        - when: f4952.unsupported
          form: Form 4952 / Form 6198 / Schedule E
          remedy: Allocate the interest and prepare the applicable unsupported schedule or at-risk
            computation.
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
        - when: f4952.alternative_allocation
          form: Form 4952 alternative allocation
          remedy: Only the default capital-gain-first allocation is supported; alternative allocation and Form
            1116 coordination are outside scope.
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line6
      printed: "6"
      type: NonNegDollars
      label: Line 4h less line 5; floor at zero
      expr:
        op: subtract_floor0
        from: f4952.line4h
        take: f4952.line5
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line7
      printed: "7"
      type: NonNegDollars
      label: "Interest carryforward to 2026: line 3 less line 6; floor at zero"
      expr:
        op: subtract_floor0
        from: f4952.line3
        take: f4952.line6
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.deduction
      printed: (helper)
      type: NonNegDollars
      label: Smaller of lines 3 and 6
      expr:
        op: smaller_of
        of:
          - f4952.line3
          - f4952.line6
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.line8
      printed: "8"
      type: NonNegDollars
      label: "Investment interest deduction: smaller of lines 3 and 6 (zero when Form 4952 is not used)"
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f4952.used
                - const: true
            then: f4952.deduction
          - guard:
              op: test
              eq:
                - f4952.used
                - const: false
            then: f4952.zero
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.exception
      printed: (helper)
      type: Bool
      label: "Filing exception: interest and ordinary dividends less qualified dividends exceed investment
        interest, with no other deductible expenses or carryover"
      expr:
        op: test
        all:
          - op: test
            gt:
              - f4952.line4c
              - f4952.line1
          - op: test
            eq:
              - f4952.line5
              - const: 0
          - op: test
            eq:
              - f4952.carryover
              - const: false
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.required_test
      printed: (helper)
      type: Bool
      label: File for an election, or to claim interest (including a 2024 carryforward) when the exception does not apply
      expr:
        op: test
        any:
          - op: test
            gt:
              - f4952.election
              - const: 0
          - op: test
            all:
              - op: test
                gt:
                  - f4952.line3
                  - const: 0
              - op: test
                eq:
                  - f4952.exception
                  - const: false
      cite:
        doc: f4952
        locator: pp. 1, 3–4, Investment Interest Expense Deduction
      refuses:
        - when: f4952.unsupported
          form: Form 4952 / Form 6198 / Schedule E
          remedy: Allocate the interest and prepare the applicable unsupported schedule or at-risk
            computation.
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
        - when: f4952.alternative_allocation
          form: Form 4952 alternative allocation
          remedy: Only the default capital-gain-first allocation is supported; alternative allocation and Form
            1116 coordination are outside scope.
          cite:
            doc: f4952
            locator: pp. 1, 3–4, Investment Interest Expense Deduction
    - id: f4952.required
      printed: (helper)
      type: Bool
      label: Form 4952 is used and must be filed (for an election, or to claim interest when the exception does not apply)
      expr:
        op: test
        all:
          - op: test
            eq:
              - f4952.used
              - const: true
          - op: test
            eq:
              - f4952.required_test
              - const: true
      cite:
        doc: f4952
        locator: p. 3, Who Must File, "you must file Form 4952 to claim a deduction for your investment interest expense"
          and "Exception. You don’t have to file Form 4952 if all of the following apply"
