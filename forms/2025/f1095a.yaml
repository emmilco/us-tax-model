form:
  id: f1095a
  kind: form
  title: Form 1095-A, Health Insurance Marketplace Statement (one entry per form)
  tax_year: 2025
  note: One entry per Form 1095-A. A form with coverage in all 12 months and the same columns A and B every month is entered
    by its monthly amounts and line 33C; any other form month by month. Column B is the corrected applicable SLCSP premium
    where the form's is blank, zero or wrong (i8962 p. 14).
  lines:
  - id: f1095a.one
    printed: (helper)
    label: One Form 1095-A
    type: Count
    expr:
      op: param
      ref: sales.one
    cite:
      doc: f1095a
      locator: p. 3, Instructions for Recipient, "If you or your family members enrolled at the Marketplace in more than one
        qualified health plan policy, you will receive a Form 1095-A for each policy."
  - id: f1095a.months
    printed: (helper)
    label: Twelve months
    type: Count
    expr:
      op: param
      ref: ptc.months
    cite: &id001
      doc: i8962
      locator: p. 14, Line 10, "Check “Yes” and continue to line 11 if all of the following apply for each qualified health
        plan", "Full-year coverage with no changes on Form 1095-A, Part III, column A or B."
  - id: f1095a.uniform
    printed: (gate)
    label: Does this Form 1095-A show coverage in all 12 months of 2025, with the same amount in column A every month and
      the same amount in column B every month?
    type: Bool
    expr:
      op: input
      source: Does this Form 1095-A show coverage in all 12 months of 2025, with the same amount in column A (monthly enrollment
        premiums) every month and the same amount in column B (monthly SLCSP premium) every month? Use the corrected column
        B if column B is blank, zero or wrong.
    cite: *id001
  - id: f1095a.mo_a
    printed: (helper)
    label: The monthly amount in column A (the same every month)
    type: NonNegDollars
    expr:
      op: input
      source: The monthly amount in Part III, column A (monthly enrollment premiums), the same in every month
    cite: &id002
      doc: i8962
      locator: p. 16, Column (a), "If you have more than one Form 1095-A affecting a particular month, add the amounts together
        for that month and enter the total on the appropriate line on Form 8962, column (a)."
  - id: f1095a.mo_b
    printed: (helper)
    label: The monthly amount in column B (the same every month)
    type: NonNegDollars
    expr:
      op: input
      source: 'The monthly amount in Part III, column B (monthly SLCSP premium), the same in every month: the amount in column
        B, or the correct applicable SLCSP premium if column B is blank, zero or wrong (from the Marketplace''s tool, for
        example HealthCare.gov/Tax-Tool)'
    cite: &id003
      doc: i8962
      locator: p. 14, "you must determine the correct applicable SLCSP premium for every month."; p974 p. 27, Applicable SLCSP
        premium tools, "Only the Marketplaces are able to provide applicable SLCSP premiums."
  - id: f1095a.c_total
    printed: (helper)
    label: Line 33, column C (annual advance payment of premium tax credit)
    type: NonNegDollars
    expr:
      op: input
      source: The amount on line 33, column C (annual total of the monthly advance payment of premium tax credit)
    cite:
      doc: i8962
      locator: p. 16, Column (f), "If you have more than one Form 1095-A, add the amounts together and enter the total on
        Form 8962, line 11, column (f)."
