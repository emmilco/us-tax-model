  - id: f1095a.b_counted
    printed: (gate)
    label: Do you count this Form 1095-A's column B?
    type: Bool
    expr:
      op: input
      source: Do you count this Form 1095-A's column B? Count it unless another Form 1095-A from the same state, whose column
        B you count, shows coverage in every month this one does. For a month that several forms from one state cover, column
        B is entered from only one of them; forms from different states, and policies from one state that follow one another,
        are each counted.
    cite:
      doc: i8962
      locator: p. 16, Column (b), "If you have more than one Form 1095-A showing coverage in a particular month, use the following
        rules to determine the amounts to enter on Form 8962, column (b), for that month.", "Enter the amount from column B of
        only one Form 1095-A—do not add the amounts from each form."
  - id: f1095a.b_used
    printed: (helper)
    label: This form's column B is counted (the only form, or counted under the one-form-a-month rule)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - f8962.forms
        - const: 1
          type: Count
      - op: test
        eq:
        - f1095a.b_counted
        - const: true
    cite:
      doc: i8962
      locator: p. 15, Column (b), "Enter the amount from column B of only one Form 1095-A—do not add the amounts from each
        form."
  collection:
    cite:
      doc: f1095a
      locator: p. 3, Instructions for Recipient, "If you or your family members enrolled at the Marketplace in more than one
        qualified health plan policy, you will receive a Form 1095-A for each policy."
