          return (including extensions)."
    - id: dependent.edu_inst
      printed: (helper)
      label: Qualified education expenses required to be paid to the institution
      type: NonNegDollars
      expr:
        op: input
        source: |-
          Qualified education expenses paid in 2025 for this student, by anyone, that had to be paid to the institution, for academic periods beginning in 2025 or in the first 3 months of 2026:

          - tuition
          - required enrollment fees
          - books, supplies and equipment required to be paid to the institution as a condition of enrollment or attendance

          Use the amounts actually paid, which may differ from Form 1098-T box 1.

          Do not include:
          - amounts paid in 2024 or 2026
          - room and board
          - insurance
          - medical expenses (including student health fees)
          - transportation
          - expenses deducted elsewhere (for example on Schedule C)
          - expenses used for a tax-free distribution from a Coverdell ESA or qualified tuition program (529 plan)
          - a course or other education involving sports, games or hobbies, or any noncredit course, unless it is part of the student's degree program or, where this student can't get the American opportunity credit, it helps the student acquire or improve job skills

          Zero if none
      cite:
        doc: i8863
        locator: p. 4, Qualified Education Expenses, "Generally, qualified education expenses are amounts paid in 2025 for tuition
          and fees required for the student’s enrollment or attendance at an eligible educational institution."; p. 4, "Any course
          or other education involving sports, games, or hobbies, or any noncredit course, unless such course or other education
          is part of the student’s degree program or (for the lifetime learning credit only) helps the student acquire or improve
          job skills."
    - id: dependent.edu_mat
      printed: (helper)
      label: Other course materials (American opportunity credit only)
      type: NonNegDollars
      expr:
        op: input
        source: 'Other course materials paid for in 2025 for this student: books, supplies and equipment needed for a course of
          study that did not have to be paid to the institution (they count for the American opportunity credit only); the same
          exclusions as for the expenses paid to the institution; zero if none'
      cite:
        doc: i8863
        locator: 'p. 4, Qualified Education Expenses, "American opportunity credit: Qualified education expenses include amounts
          paid for tuition, fees, and course materials, which include books, supplies, and equipment needed for a course of study,
          whether or not the materials are purchased from the educational institution as a condition of enrollment or attendance."'
    - id: dependent.edu_a2025
