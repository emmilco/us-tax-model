form:
  id: dependent
  kind: worksheet
  title: Dependents — qualifying child and qualifying relative tests, per person listed
  tax_year: 2025
  note: One entry per person the filer lists. The tests of Steps 1 through 5 of "Who Qualifies as Your
    Dependent" are encoded per entry; the rules for married persons, children of divorced or separated
    parents, multiple support agreements and a child who is the qualifying child of another person are
    refused rather than decided. Temporary absences count as months lived with you, as the instructions say.
  lines:
    - id: dependent.relationship
      printed: (helper)
      type: Enum(dependent_relationship)
      label: Relationship to you
      expr:
        op: input
        source: "Relationship to you: child (son, daughter, stepchild, foster child or their descendant), sibling
          (brother, sister, half brother, half sister, stepbrother or stepsister, or a son or daughter of a brother,
          sister, half brother or half sister), sibling_descendant (any other descendant of a sibling, such as a
          grandniece or a stepsibling's child), parent (father or mother; not a foster parent, who is entered as other), parent_relative (a grandparent, aunt or
          uncle: an ancestor or sibling of a parent), in_law (step-parent or in-law), household_member (any other
          person, other than your spouse, who lived with you all year as a member of your household, if your
          relationship did not violate local law), or other (any other relationship; such a person is a Step 4 relative
          only if they lived with you all year as a member of your household and the relationship did not violate
          local law)"
      cite:
        doc: i1040gi
        locator: pp. 17 and 19, Steps 1 and 4, "A qualifying child is your..." and "A qualifying relative is your..."; p501 p. 19, Relatives who don't have to live with you, "Your father, mother, grandparent, or other direct ancestor, but not foster parent"
      ambiguity: amb.2025.foster_parent_relationship
    - id: dependent.age
      printed: (helper)
      type: Count
      label: Age at the end of 2025
      expr:
        op: input
        source: Age at the end of 2025 (whole years)
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Under age 19 at the end of 2025"
    - id: dependent.student
      printed: (helper)
      type: Bool
      label: Full-time student in 2025?
      expr:
        op: input
        source: Was this person a full-time student in 2025?
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Under age 24 at the end of 2025, a full-time student (defined later)"
    - id: dependent.disabled
      printed: (helper)
      type: Bool
      label: Permanently and totally disabled?
      expr:
        op: input
        source: Was this person permanently and totally disabled at any time in 2025?
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Any age and permanently and totally disabled (defined later)"
    - id: dependent.months
      printed: (helper)
      type: Count
      label: Months lived with you in 2025, counting temporary absences
      expr:
        op: input
        source: Months this person lived with you in 2025, counting temporary absences for school, vacation, business,
          medical care, military service or detention in a juvenile facility as time lived with you (0–12); enter 7 if
          the person lived with you for more than half of 2025 but fewer than 7 full months. For a person born, died, adopted
          or placed with you in 2025 who meets the other conditions to be your qualifying child, enter 12 if your home
          was their home for more than half the time they were alive or with you, and 0 otherwise; for any other person
          born or who died in 2025, or adopted, lawfully placed with you for legal adoption, or placed with you as an eligible
          foster child in 2025, enter 12 only if your home was their home for the entire time they were alive or since
          the adoption or placement, and 0 otherwise
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Who lived with you for more than half of 2025"; p. 21, Exception to time lived with you ("the person is considered to have lived with you for more than half of 2025 if your home was this person's home for more than half the time the person was alive in 2025"; "Any other person is considered to have lived with you for all of 2025 if the person was born or died in 2025 and your home was this person's home for the entire time the person was alive in 2025")
    - id: dependent.self_support
      printed: (helper)
      type: Bool
      label: Provided over half of their own support?
      expr:
        op: input
        source: Did this person provide over half of their own support for 2025?
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Who didn't provide over half of their own support for 2025"
    - id: dependent.joint_return
      printed: (helper)
      type: Bool
      label: Filing a joint return other than only to claim a refund?
      expr:
        op: input
        source: Is this person filing a joint return for 2025, other than only to claim a refund of withheld or estimated tax?
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Who isn't filing a joint return for 2025 or is filing a joint return for 2025 only to claim a refund"
    - id: dependent.citizen
      printed: (helper)
      type: Bool
      label: U.S. citizen, U.S. national or U.S. resident alien?
      expr:
        op: input
        source: Was this person a U.S. citizen, U.S. national or U.S. resident alien? (Answer yes for your adopted child
          who lived with you all year as a member of your household, if you are a U.S. citizen or U.S. national.)
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, question 1, and Step 3, question 2; p. 20, Exception to citizen test ("If you are a U.S. citizen or U.S. national and your adopted child lived with you all year as a member of your household, that child meets the requirement to be a U.S. citizen in Step 2, question 1; Step 3, question 2; Step 4, question 2; and Step 5, question 3")
    - id: dependent.canada_mexico
      printed: (helper)
      type: Bool
      label: Resident of Canada or Mexico (if not a U.S. citizen, national or resident alien)?
      expr:
        op: input
        source: If not a U.S. citizen, national or resident alien, was this person a resident of Canada or Mexico?
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, question 1, "or a resident of Canada or Mexico"
    - id: dependent.married
      printed: (helper)
      type: Bool
      label: Married?
      expr:
        op: input
        source: 'Was this person married at the end of 2025 (a person legally separated under a decree of divorce or separate maintenance is not married), or is this person filing a joint return for 2025 (for example with a spouse who died during 2025)?'
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, question 2, "Was the child married? Yes. See Married person, later"
    - id: dependent.tin
      printed: (helper)
      type: Bool
      label: SSN, ITIN or ATIN issued on or before the due date of your return?
      expr:
        op: input
        source: Did this person have an SSN, ITIN or ATIN issued on or before the due date of your 2025 return (including
          extensions), or have you applied for an ITIN or ATIN for this person by then?
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 1, and p. 19, Step 5, question 2
    - id: dependent.work_ssn
      printed: (helper)
      type: Bool
      label: SSN valid for employment issued before the due date of your return?
      expr:
        op: input
        source: Did this person have an SSN valid for employment, issued before the due date of your 2025 return (including
          extensions)?
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 4
    - id: dependent.gross_income
      printed: (helper)
      type: NonNegDollars
      label: Gross income for 2025
      expr:
        op: input
        source: This person's gross income for 2025
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Who had gross income of less than $5,200 in 2025"
    - id: dependent.supported
      printed: (helper)
      type: Bool
      label: You provided over half of this person's support?
      expr:
        op: input
        source: Did you provide over half of this person's support in 2025?
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "For whom you provided over half of the person's support in 2025"
    - id: dependent.other_claimant
      printed: (helper)
      type: Bool
      label: Meets the conditions to be the qualifying child of another person?
      expr:
        op: input
        source: 'Does this person meet the conditions to be the qualifying child of any other person for 2025, under the dependent rules or under the EIC rules (which have no support test)?'
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "If the child meets the conditions to be a qualifying child of any other person ... see Qualifying child of more than one person"
    - id: dependent.divorced_rule
      printed: (helper)
      type: Bool
      label: Rule for children of divorced or separated parents applies?
      expr:
        op: input
        source: 'Does the special rule for children of divorced or separated parents, or parents who lived apart (including parents who never married), apply to this person, for example because a Form 8332 release or a decree lets the noncustodial parent claim the child?'
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "But see Children of divorced or separated parents"
    - id: dependent.multiple_support
      printed: (helper)
      type: Bool
      label: Claimed under a multiple support agreement?
      expr:
        op: input
        source: 'Did you and others together provide over half of this person''s support for 2025, with no one person providing over half (a multiple support situation), whether you or another contributor claims the person?'
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Multiple support agreements"
    - id: dependent.parent_home_paid
      printed: (helper)
      type: Bool
      label: For a parent not living with you, you paid over half the cost of their main home for all of 2025 (or the part of
        2025 they were alive)?
      expr:
        op: input
        source: If this person is your parent, did you pay over half the cost of keeping up a home that was their main
          home for all of 2025 (or, if your parent died in 2025, for the entire part of 2025 your parent was alive)?
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 1; p. 15, "If the person is anyone else, see Pub. 501"; p501 p. 9, Death or
          birth, "Your parent for whom you paid, for the entire part of the year your parent was alive, more than half the
          cost of keeping up the home your parent lived in"
    - id: dependent.born_died
      printed: (helper)
      type: Bool
      label: Born or died in 2025?
      expr:
        op: input
        source: Was this person born in 2025, or did this person die in 2025?
      cite:
        doc: i1040gi
        locator: p. 15, "If the person for whom you kept up a home was born or died in 2025, you still may be able to file as
          head of household"
    - id: dependent.placed
      printed: (helper)
      type: Bool
      label: Adopted, placed for adoption or placed as a foster child in 2025?
      expr:
        op: input
        source: Did you adopt this person in 2025, or was this person lawfully placed with you for legal adoption by you, or
          placed with you as an eligible foster child, during 2025?
      cite:
        doc: i1040gi
        locator: p. 15, "Similarly, if you adopted the person for whom you kept up a home in 2025, the person was lawfully
          placed with you for legal adoption by you in 2025, or the person was an eligible foster child placed with you
          during 2025"
    - id: dependent.part_year_home
      printed: (helper)
      type: Bool
      label: Lived with you more than half the part of 2025 they were alive, or since the adoption or placement?
      expr:
        op: input
        source: Was your home this person's home for more than half of the part of 2025 they were alive (or, for a person
          adopted or placed with you in 2025, more than half of the time since the adoption or placement), counting
          temporary absences for school, vacation, business, medical care, military service or detention in a juvenile
          facility as time lived with you?
      cite:
        doc: p501
        locator: p. 9, Death or birth, "Your qualifying child or qualifying relative who lived with you for more than half the
          part of the year they were alive"; i1040gi p. 15, "more than half the time since the person was adopted or placed
          with you in 2025"; i1040gi pp. 14-15, temporary absences, "or detention in a juvenile facility"
    - id: dependent.hoh_lived_half
      printed: (helper)
      type: Bool
      label: Lived with you more than half of 2025, or, for a relative other than a qualifying child (whose months already count
        the part of the year), more than half of the part of 2025 they were alive or since their adoption or placement
      expr:
        op: test
        any:
          - op: test
            eq:
              - dependent.lived_half
              - const: true
          - op: test
            all:
              - op: test
                eq:
                  - dependent.qualifying_child
                  - const: false
              - op: test
                any:
                  - op: test
                    eq:
                      - dependent.born_died
                      - const: true
                  - op: test
                    eq:
                      - dependent.placed
                      - const: true
              - op: test
                eq:
                  - dependent.part_year_home
                  - const: true
      cite:
        doc: p501
        locator: p. 9, Death or birth, "To qualify you for head of household filing status, the qualifying person (as defined
          in Table 4) must be one of the following"; i1040gi p. 15, "the person is considered to have lived with you for more
          than half of 2025 if your main home was this person's main home for more than half the time since the person was
          adopted or placed with you in 2025"
    - id: dependent.dc_lived_half
      printed: (helper)
      type: Bool
      label: Lived with you more than half of 2025, or, for a person other than a qualifying child born or who died in 2025, more
        than half of the part of 2025 they were alive
      expr:
        op: test
        any:
          - op: test
            eq:
              - dependent.lived_half
              - const: true
          - op: test
            all:
              - op: test
                eq:
                  - dependent.qualifying_child
                  - const: false
              - op: test
                eq:
                  - dependent.born_died
                  - const: true
              - op: test
                eq:
                  - dependent.part_year_home
                  - const: true
      cite:
        doc: p503
        locator: p. 3, Birth or death of otherwise qualifying person, "a person who was born or died in 2025 is treated as
          having lived with you for more than half of 2025 if your home was the person's home more than half the time they
          were alive in 2025"
    - id: dependent.one
      printed: (helper)
      type: Count
      label: One person listed
      expr:
        op: param
        ref: dependent.one
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), lines 4 and 6
    - id: dependent.zero
      printed: (helper)
      type: NonNegDollars
      label: No amount for this person
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), lines 5 and 7
    - id: dependent.qc_relationship
      printed: (helper)
      type: Bool
      label: A child, sibling, or a descendant of either
      expr:
        op: test
        any:
          - op: test
            eq:
              - dependent.relationship
              - const: child
          - op: test
            eq:
              - dependent.relationship
              - const: sibling
          - op: test
            eq:
              - dependent.relationship
              - const: sibling_descendant
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Son, daughter, stepchild, foster child, brother, sister, stepbrother, stepsister, half brother, half sister, or a descendant of any of them"
    - id: dependent.younger
      printed: (helper)
      type: Bool
      label: Younger than you (or your spouse if filing jointly)?
      expr:
        op: input
        source: Was this person younger than you (or, if you file jointly, younger than you or your spouse; the person need not be younger than both of you)?
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "and younger than you (or your spouse if filing jointly)"; p501 p. 13, "if you are married filing jointly, the child must be younger than you or your spouse but doesn't have to be younger than both of you"
    - id: dependent.us_half
      printed: (helper)
      type: Bool
      label: Lived with you in the United States for more than half of 2025?
      expr:
        op: input
        source: Did this person live with you in the United States (the 50 states and the District of Columbia) for more
          than half of 2025? If you were on extended active military duty outside the United States, your main home is
          considered to be in the United States during that duty. Temporary absences for school, vacation, business, medical care, military service or
          juvenile detention count as time lived with you. A child born or who died in 2025 counts if your home was
          the child's home for more than half the time the child was alive, and a child you adopted, who was lawfully
          placed with you for legal adoption, or who was placed with you as an eligible foster child in 2025 counts if
          your main home was the child's main home for more than half the time since the adoption or placement.
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, "Who lived with you in the United States for more than half of 2025"; p. 43, Exception to
          time lived with you; p. 44, Members of the military; p. 45, United States
    - id: dependent.eic_ssn
      printed: (helper)
      type: Bool
      label: SSN valid for the EIC, issued on or before the due date of your return?
      expr:
        op: input
        source: Did this person have a social security number issued on or before the due date of your 2025 return
          (including extensions) that is valid for the EIC? Any number issued by the Social Security Administration is
          valid unless the card says "Not Valid for Employment" and the number was issued solely to apply for or receive
          a federally funded benefit; a card that says "Valid for Work Only With DHS Authorization" is valid only while
          the authorization is valid.
      cite:
        doc: i1040gi
        locator: pp. 44–45, Social security number (SSN), EIC
    - id: dependent.qc_age
      printed: (helper)
      type: Bool
      label: Under 19 and younger than you, under 24 a full-time student and younger than you, or permanently and totally disabled
      expr:
        op: test
        any:
          - op: test
            all:
              - op: test
                lt:
                  - dependent.age
                  - param: qc.age_limit
              - op: test
                eq:
                  - dependent.younger
                  - const: true
          - op: test
            all:
              - op: test
                lt:
                  - dependent.age
                  - param: qc.student_age_limit
              - op: test
                eq:
                  - dependent.student
                  - const: true
              - op: test
                eq:
                  - dependent.younger
                  - const: true
          - op: test
            eq:
              - dependent.disabled
              - const: true
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, the age conditions
    - id: dependent.lived_half
      printed: (helper)
      type: Bool
      label: Lived with you for more than half of 2025
      expr:
        op: test
        gt:
          - dependent.months
          - const: 6
            type: Count
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Who lived with you for more than half of 2025"
    - id: dependent.qualifying_child
      printed: (helper)
      type: Bool
      label: Qualifying child (Step 1)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qc_relationship
              - const: true
          - op: test
            eq:
              - dependent.qc_age
              - const: true
          - op: test
            eq:
              - dependent.self_support
              - const: false
          - op: test
            eq:
              - dependent.joint_return
              - const: false
          - op: test
            eq:
              - dependent.lived_half
              - const: true
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Do you have a child who meets the conditions to be your qualifying child?"
      refuses:
        - when: dependent.other_claimant
          form: Qualifying child of more than one person (tie-breaker rules)
          remedy: This person may be the qualifying child of another person. The tie-breaker rules are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 21, Qualifying child of more than one person
        - when: dependent.divorced_rule
          form: Children of divorced or separated parents
          remedy: The rule for children of divorced or separated parents is outside this tool.
          cite:
            doc: i1040gi
            locator: p. 20, Children of divorced or separated parents
        - when: dependent.married
          form: Married person rules
          remedy: A married dependent is outside this tool; see Married person in the instructions.
          cite:
            doc: i1040gi
            locator: p. 21, Married person
    - id: dependent.resident
      printed: (helper)
      type: Bool
      label: U.S. citizen, national or resident alien, or a resident of Canada or Mexico
      expr:
        op: test
        any:
          - op: test
            eq:
              - dependent.citizen
              - const: true
          - op: test
            eq:
              - dependent.canada_mexico
              - const: true
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, question 1
    - id: dependent.qc_dependent
      printed: (helper)
      type: Bool
      label: Qualifying child who is your dependent (Step 2)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qualifying_child
              - const: true
          - op: test
            eq:
              - dependent.resident
              - const: true
          - op: test
            eq:
              - sa.dependent
              - const: false
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, questions 1 and 4
    - id: dependent.qr_relationship
      printed: (helper)
      type: Bool
      label: A relative listed in Step 4, or any other person who lived with you all year
      expr:
        op: test
        any:
          - op: test
            eq:
              - dependent.relationship
              - const: child
          - op: test
            eq:
              - dependent.relationship
              - const: sibling
          - op: test
            eq:
              - dependent.relationship
              - const: parent
          - op: test
            eq:
              - dependent.relationship
              - const: parent_relative
          - op: test
            eq:
              - dependent.relationship
              - const: in_law
          - op: test
            all:
              - op: test
                any:
                  - op: test
                    eq:
                      - dependent.relationship
                      - const: household_member
                  - op: test
                    eq:
                      - dependent.relationship
                      - const: sibling_descendant
                  - op: test
                    eq:
                      - dependent.relationship
                      - const: other
              - op: test
                eq:
                  - dependent.months
                  - const: 12
                    type: Count
              - op: test
                any:
                  - op: test
                    all:
                      - op: test
                        ne:
                          - dependent.relationship
                          - const: other
                      - op: test
                        ne:
                          - dependent.relationship
                          - const: sibling_descendant
                  - op: test
                    eq:
                      - dependent.lawful
                      - const: true
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "A qualifying relative is your..." through "Any other person (other than your spouse) who lived with you all year as a member of your household"
    - id: dependent.lawful
      printed: (helper)
      type: Bool
      label: Your relationship with this person did not violate local law
      expr:
        op: input
        source: Did your relationship with this person not violate local law? (Asked for a person who is a Step 4 relative only
          as a member of your household all year, such as a sibling's grandchild or a step sibling's child, or who is no
          relative.)
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Any other person (other than your spouse) who lived with you all year as a member of your household if your relationship didn’t violate local law."
    - id: dependent.qr_income
      printed: (helper)
      type: Bool
      label: Gross income under $5,200
      expr:
        op: test
        lt:
          - dependent.gross_income
          - param: qr.gross_income_limit
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Who had gross income of less than $5,200 in 2025"
    - id: dependent.income_exception
      printed: (gate)
      type: Bool
      label: Permanently and totally disabled with gross income at or over the limit
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.disabled
              - const: true
          - op: test
            eq:
              - dependent.qr_income
              - const: false
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "If the person was permanently and totally disabled, see Exception to gross income test"
    - id: dependent.qualifying_relative
      printed: (helper)
      type: Bool
      label: Qualifying relative (Step 4)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qr_relationship
              - const: true
          - op: test
            eq:
              - dependent.qualifying_child
              - const: false
          - op: test
            eq:
              - dependent.qr_income
              - const: true
          - op: test
            eq:
              - dependent.supported
              - const: true
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Does any person meet the conditions to be your qualifying relative?"
      refuses:
        - when: dependent.multiple_support
          form: Multiple support agreements
          remedy: A person claimed under a multiple support agreement is outside this tool.
          cite:
            doc: i1040gi
            locator: p. 20, Multiple support agreements
        - when: dependent.income_exception
          form: Exception to gross income test
          remedy: The sheltered-workshop exception to the gross income test for a disabled person is outside this tool.
          cite:
            doc: i1040gi
            locator: pp. 19–20, Exception to gross income test
        - when: dependent.married
          form: Married person rules
          remedy: A married dependent is outside this tool; see Married person in the instructions.
          cite:
            doc: i1040gi
            locator: p. 21, Married person
    - id: dependent.qr_dependent
      printed: (helper)
      type: Bool
      label: Qualifying relative who is your dependent (Step 4, questions 2 and 5)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qualifying_relative
              - const: true
          - op: test
            eq:
              - dependent.resident
              - const: true
          - op: test
            eq:
              - sa.dependent
              - const: false
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, questions 2 and 5
    - id: dependent.claimed_no_tin
      printed: (gate)
      type: Bool
      label: A person who meets the tests to be your dependent but has no SSN, ITIN or ATIN
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.tin
              - const: false
          - op: test
            any:
              - op: test
                eq:
                  - dependent.qc_dependent
                  - const: true
              - op: test
                eq:
                  - dependent.qr_dependent
                  - const: true
      cite:
        doc: i1040gi
        locator: 'p. 22, Social security number, "You must enter each dependent’s social security number (SSN)"'
    - id: dependent.claimed
      printed: (helper)
      type: Bool
      label: Your dependent
      expr:
        op: test
        any:
          - op: test
            eq:
              - dependent.qc_dependent
              - const: true
          - op: test
            eq:
              - dependent.qr_dependent
              - const: true
      cite:
        doc: i1040gi
        locator: pp. 17–19, Who Qualifies as Your Dependent
      refuses: &claimed_no_tin
        - when: dependent.claimed_no_tin
          form: Dependent without an SSN, ITIN or ATIN (Form 1040, Dependents, row (3))
          remedy: Each dependent must be listed with an SSN (or ITIN or ATIN) issued on or before the due date of your return.
            A dependent child who was born and died in 2025 without an SSN, entered as "Died" on row (3) with a copy of the
            birth certificate, death certificate or hospital records, is outside this tool.
          cite:
            doc: i1040gi
            locator: 'p. 22, Social security number, "You must enter each dependent’s social security number (SSN)" and "If your dependent child was born and died in 2025 and you do not have an SSN for the child, enter “Died” on row (3) of the Dependents section and include a copy of the child’s birth certificate, death certificate, or hospital records"; p. 14, Head of Household, "The dependents you claim are those you list by name and SSN ... in the Dependents section on Form 1040 or 1040-SR"'
    - id: dependent.under_ctc_age
      printed: (helper)
      type: Bool
      label: Under age 17 at the end of 2025
      expr:
        op: test
        lt:
          - dependent.age
          - param: ctc.age_limit
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 3
    - id: dependent.ctc_child
      printed: (helper)
      type: Bool
      label: Qualifying child for the child tax credit (Step 3)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qc_dependent
              - const: true
          - op: test
            eq:
              - dependent.tin
              - const: true
          - op: test
            eq:
              - dependent.citizen
              - const: true
          - op: test
            eq:
              - dependent.under_ctc_age
              - const: true
          - op: test
            eq:
              - dependent.work_ssn
              - const: true
          - op: test
            eq:
              - household.ctc_ssn
              - const: true
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, questions 1–4
    - id: dependent.odc_person
      printed: (helper)
      type: Bool
      label: Dependent for the credit for other dependents (Steps 3 and 5)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.claimed
              - const: true
          - op: test
            eq:
              - dependent.tin
              - const: true
          - op: test
            eq:
              - dependent.citizen
              - const: true
          - op: test
            eq:
              - dependent.ctc_child
              - const: false
          - op: test
            eq:
              - household.all_tin
              - const: true
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 3, and p. 19, Step 5
    - id: dependent.ctc_per_child
      printed: (helper)
      type: NonNegDollars
      label: Year parameter ctc.per_child
      expr:
        op: param
        ref: ctc.per_child
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 5
    - id: dependent.ctc_amount
      printed: (helper)
      type: NonNegDollars
      label: Child tax credit amount for this person before limits ($2,200 for a qualifying child, else 0)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - dependent.ctc_child
                - const: true
            then: dependent.ctc_per_child
          - guard:
              op: test
              eq:
                - dependent.ctc_child
                - const: false
            then: dependent.zero
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 5, "Multiply line 4 by $2,200"
    - id: dependent.odc_per_dependent
      printed: (helper)
      type: NonNegDollars
      label: Year parameter odc.per_dependent
      expr:
        op: param
        ref: odc.per_dependent
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 7
    - id: dependent.odc_amount
      printed: (helper)
      type: NonNegDollars
      label: Credit for other dependents amount for this person before limits ($500 for an other dependent, else 0)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - dependent.odc_person
                - const: true
            then: dependent.odc_per_dependent
          - guard:
              op: test
              eq:
                - dependent.odc_person
                - const: false
            then: dependent.zero
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 7, "Multiply line 6 by $500"
    - id: dependent.actc_per_child
      printed: (helper)
      type: NonNegDollars
      label: Year parameter actc.per_child
      expr:
        op: param
        ref: actc.per_child
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 16b
    - id: dependent.actc_amount
      printed: (helper)
      type: NonNegDollars
      label: Additional child tax credit ceiling for this person ($1,700 for a qualifying child, else 0)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - dependent.ctc_child
                - const: true
            then: dependent.actc_per_child
          - guard:
              op: test
              eq:
                - dependent.ctc_child
                - const: false
            then: dependent.zero
      cite:
        doc: f1040s8812
        locator: p. 2, Part II-A Additional Child Tax Credit for All Filers, line 16b, "b Number of qualifying
          children under age 17 with the required social security number", "x $1,700. Enter the result"
    - id: dependent.hoh_test2
      printed: (helper)
      type: Bool
      label: A Test 2 person who lived with you more than half the year, or of the part of the year a relative was alive (the home-cost condition of Test 2 is tested on the household form)
      expr:
        op: test
        any:
          - op: test
            all:
              - op: test
                eq:
                  - dependent.claimed
                  - const: true
              - op: test
                ne:
                  - dependent.relationship
                  - const: household_member
              - op: test
                ne:
                  - dependent.relationship
                  - const: sibling_descendant
              - op: test
                ne:
                  - dependent.relationship
                  - const: other
              - op: test
                eq:
                  - dependent.hoh_lived_half
                  - const: true
          - op: test
            all:
              - op: test
                eq:
                  - dependent.qualifying_child
                  - const: true
              - op: test
                eq:
                  - dependent.married
                  - const: false
              - op: test
                eq:
                  - dependent.lived_half
                  - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2 (a dependent, other than one who is your dependent only because they lived with you all year, which is any person claimed through the last Step 4 bullet, or your unmarried qualifying child, who lived with you more than half the year)
    - id: dependent.hoh_test1
      printed: (helper)
      type: Bool
      label: Qualifies you for head of household under Test 1 through a parent who does not live with you (a parent who lives with you qualifies you through Test 2)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.relationship
              - const: parent
          - op: test
            eq:
              - dependent.claimed
              - const: true
          - op: test
            eq:
              - dependent.parent_home_paid
              - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 1, "You paid over half the cost of keeping up a home that was the main home for all of 2025 of your parent whom you can claim as a dependent"
      refuses: *claimed_no_tin
    - id: dependent.eic_child
      printed: (helper)
      type: Bool
      label: Qualifying child for the EIC (relationship, age, not filing a joint return, lived with you in the United States for more than half of 2025)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qc_relationship
              - const: true
          - op: test
            eq:
              - dependent.qc_age
              - const: true
          - op: test
            eq:
              - dependent.joint_return
              - const: false
          - op: test
            eq:
              - dependent.us_half
              - const: true
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, "A qualifying child for the EIC is your..." (relationship AND age AND not filing a joint
          return AND lived with you in the United States for more than half of 2025)
      refuses:
        - when: dependent.other_claimant
          form: Qualifying child of more than one person (EIC)
          remedy: The tie-breaker rules for a child who is the qualifying child of more than one person are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 44, Qualifying child of more than one person
        - when: dependent.married
          form: Married child (EIC)
          remedy: A married child is a qualifying child for the EIC only under the dependency rules, which are outside this tool for a married person.
          cite:
            doc: i1040gi
            locator: p. 44, Married child
    - id: dependent.eic_ssn_child
      printed: (helper)
      type: Bool
      label: Qualifying child for the EIC who has a valid SSN
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.eic_child
              - const: true
          - op: test
            eq:
              - dependent.eic_ssn
              - const: true
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 2, "the number of qualifying children you have who have valid SSNs"; pp. 44–45,
          Social security number (SSN), "For the EIC, a valid SSN is a number issued by the Social Security Administration
          unless 'Not Valid for Employment' is printed on the social security card"
    - id: dependent.dc_child_all_year
      printed: (helper)
      type: Bool
      label: Your qualifying child who is your dependent and was under age 13 for all of 2025 (age 12 or younger at the end of 2025)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qc_dependent
              - const: true
          - op: test
            lt:
              - dependent.age
              - param: dc.child_age
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "A qualifying child under age 13 whom you can claim as a dependent. If the child turned 13 during the year, the child is a qualifying person for the part of the year they were under age 13"'
    - id: dependent.dc_age13
      printed: (helper)
      type: Bool
      label: Your qualifying child who is your dependent and was 13 at the end of 2025 (who may have been under 13 for part of the year)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qc_dependent
              - const: true
          - op: test
            eq:
              - dependent.age
              - param: dc.child_age
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "A qualifying child under age 13 whom you can claim as a dependent. If the child turned 13 during the year, the child is a qualifying person for the part of the year they were under age 13"'
    - id: dependent.dc_under13
      printed: (helper)
      type: Bool
      label: Under age 13 for part of 2025 when the care was provided?
      expr:
        op: input
        source: Was this child under age 13 for part of 2025, when you paid for their care? (A child who turned 13 in 2025
          is a qualifying person only for the part of the year before their 13th birthday.)
      cite:
        doc: p503
        locator: 'p. 3, Person qualifying for part of year, "You determine a person''s qualifying status each day. For example, if your child for whom you pay child and dependent care expenses turns 13 years old and no longer qualifies on September 16, count only those expenses through September 15"'
    - id: dependent.dc_child
      printed: (helper)
      type: Bool
      label: Your qualifying child who is your dependent, turned 13 during 2025 and was under 13 for part of 2025 when the care was provided
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.dc_age13
              - const: true
          - op: test
            eq:
              - dependent.dc_under13
              - const: true
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "A qualifying child under age 13 whom you can claim as a dependent. If the child turned 13 during the year, the child is a qualifying person for the part of the year they were under age 13"'
    - id: dependent.dc_incapable
      printed: (helper)
      type: Bool
      label: Physically or mentally not able to care for themselves?
      expr:
        op: input
        source: In 2025, was this person physically or mentally not able to care for themselves (unable to dress, clean or feed
          themselves because of a physical or mental disability, or needing constant attention to prevent them from injuring
          themselves or others)? This is a different test from permanent and total disability.
      cite:
        doc: i2441
        locator: 'p. 1, Physically or mentally not able to care for oneself, "Persons who can''t dress, clean, or feed themselves because of physical or mental disabilities are considered not able to care for themselves. Also, persons who must have constant attention to prevent them from injuring themselves or others are considered not able to care for themselves"'
    - id: dependent.dc_disabled_qp
      printed: (helper)
      type: Bool
      label: Your dependent who lived with you for more than half of 2025 and was not able to care for themselves
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.dc_incapable
              - const: true
          - op: test
            eq:
              - dependent.dc_lived_half
              - const: true
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "Any disabled person who wasn''t physically or mentally able to care for themselves who lived with you for more than half the year and whom you can claim as a dependent"; p503 p. 3, Birth or death of otherwise qualifying person'
    - id: dependent.dc_qp
      printed: (helper)
      type: Bool
      label: A qualifying person for Form 2441 (you have care expenses, and this person is your dependent and either your qualifying child under 13 or not able to care for themselves and living with you for more than half the year)
      expr:
        op: test
        all:
          - op: test
            eq:
              - f2441.care
              - const: true
          - op: test
            eq:
              - dependent.claimed
              - const: true
          - op: test
            any:
              - op: test
                eq:
                  - dependent.dc_child_all_year
                  - const: true
              - op: test
                eq:
                  - dependent.dc_disabled_qp
                  - const: true
              - op: test
                eq:
                  - dependent.dc_child
                  - const: true
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "A qualifying child under age 13 whom you can claim as a dependent. If the child turned 13 during the year, the child is a qualifying person for the part of the year they were under age 13"; p. 1, Qualifying Person(s), "Any disabled person who wasn''t physically or mentally able to care for themselves who lived with you for more than half the year and whom you can claim as a dependent"; p. 3, Line 2, "Don''t list a person on line 2 unless they are listed as an eligible person under Qualifying Person(s), earlier"'
    - id: dependent.dc_count
      printed: (helper)
      type: Count
      label: One qualifying person
      expr:
        op: param
        ref: dependent.one
      cite:
        doc: i2441
        locator: 'p. 3, Line 2, "Complete columns (a) through (d) for each qualifying person"; p. 3, Column (b), "You must enter the qualifying person''s SSN" (a qualifying person is a dependent, and a dependent without an SSN, ITIN or ATIN is refused where the person is counted as a dependent)'
    - id: dependent.dc_paid
      printed: (helper)
      type: NonNegDollars
      label: Qualified expenses incurred and paid in 2025 for this person's care
      expr:
        op: input
        source: Qualified expenses you incurred and paid in 2025 for this person's care while they were a qualifying person
          (under age 13, or not able to care for themselves), so that you (and your spouse, if filing jointly) could work
          or look for work. Include care you prepaid in 2024 for 2025, your share of employment taxes on a care provider's
          wages, and expenses paid with dependent care benefits (reimbursed from a dependent care account or paid by your
          employer to the provider); Form 2441 subtracts the benefits you exclude. Do not include 2024 care paid in 2025,
          2025 care paid in 2026, payments for care in 2026, amounts reimbursed by a state social services agency, payments
          to a provider who may not be listed (your spouse, your dependent, your child under 19, or the parent of your
          child under 13), or expenses you claim as medical expenses; zero if none
      cite:
        doc: i2441
        locator: 'pp. 3–4, Column (d), "Enter the qualified expenses you incurred and paid in 2025 for the person listed in column (a)" and "Expenses you incurred in 2025 but didn''t pay until 2026"; p503 p. 10, Expenses prepaid in an earlier year, "If you pay for services before they are provided, you can count the prepaid expenses only in the year the care is received"'
      ambiguity: amb.2025.dc_line30
    - id: dependent.dc_line2d
      printed: 2(d)
      type: NonNegDollars
      label: Qualified expenses you incurred and paid in 2025 for the person listed in column (a)
      expr:
        op: copy
        from: dependent.dc_paid
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 2, column (d)
      ambiguity: amb.2025.dc_line30
    - id: dependent.dc_over12_care
      printed: (helper)
      type: Bool
      label: Care provided while this qualifying person was age 13 or older and disabled
      expr:
        op: input
        source: Of the care expenses included for this person on Form 2441, line 2, was any care provided
          when the person was age 13 or older and physically or mentally unable to care for themselves?
          Answer only for the care included on this form, not their age at the end of the year.
      cite:
        doc: i2441
        locator: 'p. 3, Column (c), "Check the box in column (c) if the qualifying person listed in column (a) was over age 12 at the time the care was provided and was disabled"'
    - id: dependent.dc_line2c
      printed: 2(c)
      type: Bool
      label: Check here if the qualifying person was over age 12 and was disabled
      display: The line 2 column (c) check box, shown on the values sheet; it changes no amount.
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.dc_qp
              - const: true
          - op: test
            eq:
              - dependent.dc_incapable
              - const: true
          - op: test
            any:
              - op: test
                gt:
                  - dependent.age
                  - param: dc.child_age
              - op: test
                all:
                  - op: test
                    eq:
                      - dependent.age
                      - param: dc.child_age
                  - op: test
                    eq:
                      - dependent.dc_over12_care
                      - const: true
      cite:
        doc: i2441
        locator: 'p. 3, Column (c), "Check the box in column (c) if the qualifying person listed in column (a) was over age 12 at the time the care was provided and was disabled"'
    - id: dependent.ptc_files
      printed: (gate)
      label: Is this dependent required to file a 2025 return because of their income (Chart B in the Form 1040 instructions)?
      type: Bool
      expr:
        op: input
        source: 'Is this dependent required to file a 2025 income tax return because of their income, by Chart B in the Form
          1040 instructions (unearned income over $1,350, earned income over $15,750, or gross income over the larger of $1,350
          and earned income up to $15,300 plus $450, for a single dependent under 65 and not blind)? Answer no if the dependent
          files only to claim a refund of withheld or estimated tax.'
      cite:
        doc: i8962
        locator: 'p. 8, Line 2b, "Only include your dependents who are required to file an income tax return because their
          income meets the income tax return filing threshold.", "Do not include the modified AGI of dependents who are filing
          a tax return only to claim a refund of tax withheld or estimated tax."; i1040gi p. 10, Chart B—For Children and Other
          Dependents, "Your unearned income was over $1,350."'
      ambiguity: amb.2025.ptc_dependent_filing
    - id: dependent.ptc_magi
      printed: (helper)
      label: This dependent's modified AGI (Worksheet 1-2)
      type: Dollars
      expr:
        op: input
        source: 'This dependent''s modified AGI for 2025: the AGI on their return (line 11a), plus their tax-exempt interest
          (line 2a), plus any Form 2555 amounts, plus the part of their social security benefits that is not taxable (line 6a
          less line 6b); negative if it was a loss'
      cite:
        doc: i8962
        locator: 'p. 8, Worksheet 1-2, "Only include your dependents who are required to file an income tax return because
          their income meets the income tax return filing threshold."'
    - id: dependent.ptc_magi_counted
      printed: (helper)
      label: This dependent's modified AGI counted in household income (zero unless required to file because of income)
      type: Dollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - dependent.ptc_files
                - const: true
            then: dependent.ptc_magi
          - guard:
              op: test
              eq:
                - dependent.ptc_files
                - const: false
            then: dependent.zero
      cite:
        doc: i8962
        locator: 'p. 8, Line 2b, "Only include your dependents who are required to file an income tax return because their
          income meets the income tax return filing threshold."'
      ambiguity: amb.2025.ptc_dependent_filing
    # --- Stage 19: education credits (generated) ---
    - id: dependent.edu
      printed: (gate)
      label: Qualified education expenses paid in 2025 for this dependent
      type: Bool
      expr:
        op: input
        source: Did anyone pay qualified education expenses in 2025 for this dependent at an eligible educational institution
          (a college, university, vocational school, or other postsecondary school eligible for federal student aid)?
      cite:
        doc: i8863
        locator: p. 2, Who Can Claim an Education Credit, "You may be able to claim an education credit if you, your spouse, or
          a dependent you claim on your tax return was a student enrolled at or attending an eligible educational institution."
    - id: dependent.edu_1098t
      printed: (gate)
      label: The student received a 2025 Form 1098-T from the institution, or an exception applies
      type: Bool
      expr:
        op: input
        source: Did the student receive a 2025 Form 1098-T from the educational institution? Answer yes also if the institution
          was not required to furnish one (for example a qualified nonresident alien, expenses paid entirely with scholarships
          or under a formal billing arrangement, or only courses for which no academic credit is awarded), or if the institution
          did not furnish it and, after February 2, 2026, but before you file, you or the student requested it and you can show
          the enrollment and the payments.
      cite:
        doc: i8863
        locator: p. 1, Form 1098-T requirement, "To be eligible to claim the American opportunity credit or the lifetime learning
          credit, the law requires a taxpayer (or a dependent) to have received Form 1098-T, Tuition Statement, from an eligible
          educational institution, whether domestic or foreign."
      ambiguity: amb.2025.edu_1098t_date
    - id: dependent.edu_student
      printed: (helper)
      label: 'An eligible student of this return: expenses paid, a TIN by the due date and a Form 1098-T (or an exception), and
        claimed as your dependent'
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - f8863.paid
          - const: true
        - op: test
          eq:
          - dependent.claimed
          - const: true
        - op: test
          eq:
          - dependent.edu
          - const: true
        - op: test
          eq:
          - dependent.tin
          - const: true
        - op: test
          eq:
          - dependent.edu_1098t
          - const: true
      cite:
        doc: i8863
        locator: p. 2, Who can claim a dependent’s expenses, "If a student is claimed as a dependent on another person’s tax return,
          all qualified education expenses of the student are treated as having been paid by that person. Therefore, only that
          person can claim an education credit for the student."
    - id: dependent.edu_inst
      printed: (helper)
      label: Qualified education expenses required to be paid to the institution
      type: NonNegDollars
      expr:
        op: input
        source: 'Qualified education expenses paid in 2025 for this student, by anyone, that had to be paid to the institution:
          tuition, required enrollment fees, and books, supplies and equipment required to be paid to the institution as a condition
          of enrollment or attendance, for academic periods beginning in 2025 or in the first 3 months of 2026. Use the amounts
          actually paid, which may differ from Form 1098-T box 1. Do not include amounts paid in 2024 or 2026, room and board,
          insurance, medical expenses (including student health fees), transportation, expenses deducted elsewhere (for example
          on Schedule C), or expenses used for a tax-free distribution from a Coverdell ESA or qualified tuition program (529
          plan); zero if none'
      cite:
        doc: i8863
        locator: p. 4, Qualified Education Expenses, "Generally, qualified education expenses are amounts paid in 2025 for tuition
          and fees required for the student’s enrollment or attendance at an eligible educational institution."
    - id: dependent.edu_mat
      printed: (helper)
      label: Other course materials (American opportunity credit only)
      type: NonNegDollars
      expr:
        op: input
        source: 'Other course materials paid for in 2025 for this student: books, supplies and equipment needed for a course of
          study that did not have to be paid to the institution (they count for the American opportunity credit only); the same
          exclusions as for the expenses paid to the institution; zero if none'
      cite:
        doc: i8863
        locator: 'p. 4, Qualified Education Expenses, "American opportunity credit: Qualified education expenses include amounts
          paid for tuition, fees, and course materials, which include books, supplies, and equipment needed for a course of study,
          whether or not the materials are purchased from the educational institution as a condition of enrollment or attendance."'
    - id: dependent.edu_a2025
      printed: (helper)
      label: Adjusted Qualified Education Expenses Worksheet, line 2a
      type: NonNegDollars
      expr:
        op: input
        source: 'Tax-free educational assistance received in 2025 for this student''s 2025 expenses: the tax-free part of scholarships
          and fellowship grants (including Pell grants; Form 1098-T box 5 may help), tax-free employer-provided educational assistance,
          veterans'' educational assistance, and other tax-free educational assistance. Do not include wages, loans, gifts, inheritances,
          withdrawals from personal savings, emergency financial aid grants, or a scholarship the student includes in income (for
          you or your spouse, the amount on Schedule 1 line 8r); zero if none'
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "a. Tax-free educational assistance received in 2025 allocable
          to the academic period"
    - id: dependent.edu_a2026
      printed: (helper)
      label: Adjusted Qualified Education Expenses Worksheet, line 2b
      type: NonNegDollars
      expr:
        op: input
        source: Tax-free educational assistance received in 2026, before you file this return, that is allocable to an academic
          period of these 2025 expenses; zero if none
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "b. Tax-free educational assistance received in 2026 (and
          before you file your 2025 tax return) allocable to the academic period"
    - id: dependent.edu_refunds
      printed: (helper)
      label: Adjusted Qualified Education Expenses Worksheet, line 2c
      type: NonNegDollars
      expr:
        op: input
        source: Refunds of these 2025 qualified education expenses received in 2025, or in 2026 before you file this return; zero
          if none
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "c. Refunds of qualified education expenses paid in 2025
          if the refund is received in 2025 or in 2026 before you file your 2025 tax return"
    - id: dependent.edu_adj_sum
      printed: (helper)
      label: Add lines 2a, 2b and 2c
      type: NonNegDollars
      expr:
        op: sum
        of:
        - dependent.edu_a2025
        - dependent.edu_a2026
        - dependent.edu_refunds
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "3. Total adjustments (add lines 2a, 2b, and 2c)"
    - id: dependent.edu_adj
      printed: (helper)
      label: 'Adjusted Qualified Education Expenses Worksheet, line 3 for an eligible student: add lines 2a, 2b and 2c'
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.edu_student
            - const: true
          then: dependent.edu_adj_sum
        - guard:
            op: test
            eq:
            - dependent.edu_student
            - const: false
          then: dependent.zero
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "3. Total adjustments (add lines 2a, 2b, and 2c)"
    - id: dependent.edu_over
      printed: (gate)
      label: An academic period whose tax-free assistance and refunds exceed its expenses paid to the institution
      type: Bool
      expr:
        op: input
        source: Was there an academic period for which the tax-free educational assistance and refunds allocable to it were more
          than that period's qualified education expenses that had to be paid to the institution (tuition, required fees and course
          materials required to be paid to the institution)?
      cite:
        doc: i8863
        locator: p. 4, Tax-free educational assistance, "For tax-free educational assistance received in 2025, reduce the qualified
          education expenses for each academic period by the amount of tax-free educational assistance allocable to that academic
          period."
    - id: dependent.edu_over_refused
      printed: (gate)
      label: Adjustments that exceed one academic period's expenses
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - dependent.edu_student
          - const: true
        - op: test
          gt:
          - dependent.edu_adj
          - const: 0
        - op: test
          eq:
          - dependent.edu_over
          - const: true
      cite: &id001
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "Complete a separate worksheet for each student for each
          academic period beginning or treated as beginning (see below) in 2025 for which you paid (or are treated as having paid)
          qualified education expenses in 2025."
    - id: dependent.edu_line23
      printed: '23'
      label: Has the American opportunity credit been claimed for this student for any 4 prior tax years?
      shown_when: dependent.edu_student
      type: Bool
      expr:
        op: input
        source: Has the American opportunity credit been claimed (by you or anyone else) for this student for any 4 tax years
          before 2025?
      cite:
        doc: f8863
        locator: p. 2, Part III, line 23, "Has the American opportunity credit been claimed for this student for any 4 prior tax
          years?"
    - id: dependent.edu_show24
      printed: (helper)
      label: Line 24 is reached (line 23 did not stop)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - dependent.edu_student
          - const: true
        - op: test
          eq:
          - dependent.edu_line23
          - const: false
      cite:
        doc: f8863
        locator: p. 2, Part III, line 23, "Yes—Stop! Go to line 31 for this student."
    - id: dependent.edu_line24
      printed: '24'
      label: Was the student enrolled at least half-time for at least one academic period that began or is treated as having begun
        in 2025 at an eligible educational institution in a program leading toward a postsecondary degree, certificate, or other
        recognized postsecondary educational credential?
      shown_when: dependent.edu_show24
      type: Bool
      expr:
        op: input
        source: Was the student enrolled at least half-time (Form 1098-T box 8) for at least one academic period that began in
          2025, or in the first 3 months of 2026 if paid for in 2025, at an eligible educational institution, in a program leading
          toward a postsecondary degree, certificate or other recognized postsecondary educational credential?
      cite:
        doc: f8863
        locator: p. 2, Part III, line 24, "Was the student enrolled at least half-time for at least one academic period that began
          or is treated as having begun in 2025 at an eligible educational institution in a program leading toward a postsecondary
          degree, certificate, or other recognized postsecondary educational credential?"
    - id: dependent.edu_show25
      printed: (helper)
      label: Line 25 is reached (line 24 did not stop)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - dependent.edu_show24
          - const: true
        - op: test
          eq:
          - dependent.edu_line24
          - const: true
      cite:
        doc: f8863
        locator: p. 2, Part III, line 24, "No—Stop! Go to line 31 for this student."
    - id: dependent.edu_line25
      printed: '25'
      label: Did the student complete the first 4 years of postsecondary education before 2025?
      shown_when: dependent.edu_show25
      type: Bool
      expr:
        op: input
        source: Did the student complete the first 4 years of postsecondary education before 2025, as determined by the institution
          (4 years of academic credit, not counting credit awarded solely for proficiency examinations)?
      cite:
        doc: f8863
        locator: p. 2, Part III, line 25, "Did the student complete the first 4 years of postsecondary education before 2025?"
    - id: dependent.edu_show26
      printed: (helper)
      label: Line 26 is reached (line 25 did not stop)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - dependent.edu_show25
          - const: true
        - op: test
          eq:
          - dependent.edu_line25
          - const: false
      cite:
        doc: f8863
        locator: p. 2, Part III, line 25, "Yes—Stop! Go to line 31 for this student."
    - id: dependent.edu_line26
      printed: '26'
      label: Was the student convicted, before the end of 2025, of a felony for possession or distribution of a controlled substance?
      shown_when: dependent.edu_show26
      type: Bool
      expr:
        op: input
        source: Was the student convicted, before the end of 2025, of a federal or state felony for possession or distribution
          of a controlled substance?
      cite:
        doc: f8863
        locator: p. 2, Part III, line 26, "Was the student convicted, before the end of 2025, of a felony for possession or distribution
          of a controlled substance?"
    - id: dependent.edu_ein
      printed: (gate)
      label: The institution's employer identification number (EIN) is available
      type: Bool
      expr:
        op: input
        source: Do you have the educational institution's employer identification number (EIN), from Form 1098-T or from the institution?
      cite:
        doc: i8863
        locator: p. 4, Student qualifications, "7. You must provide the educational institution’s employer identification number
          (EIN) on your Form 8863."
    - id: dependent.edu_aoc
      printed: (helper)
      label: 'An American opportunity credit student: lines 23 to 26 allow it, the filers have TINs, and the institution''s EIN
        is available'
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - dependent.edu_student
          - const: true
        - op: test
          eq:
          - dependent.edu_line23
          - const: false
        - op: test
          eq:
          - dependent.edu_line24
          - const: true
        - op: test
          eq:
          - dependent.edu_line25
          - const: false
        - op: test
          eq:
          - dependent.edu_line26
          - const: false
        - op: test
          eq:
          - household.all_tin
          - const: true
        - op: test
          eq:
          - dependent.edu_ein
          - const: true
      cite:
        doc: f8863
        locator: p. 2, Part III, line 26, "No—Complete lines 27 through 30 for this student."; i8863 p. 3, Student qualifications,
          "5. Filers and students must have been issued a TIN by the due date of their 2025 return (including extensions)."
      ambiguity: amb.2025.edu_filer_tin
    - id: dependent.edu_llc
      printed: (helper)
      label: 'A lifetime learning credit student: an eligible student who is not an American opportunity credit student'
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - dependent.edu_student
          - const: true
        - op: test
          eq:
          - dependent.edu_aoc
          - const: false
      cite:
        doc: i8863
        locator: p. 4, Tip, "If the requirements above aren’t met for any student, you cannot claim the American opportunity credit
          for that student. You may be able to claim the lifetime learning credit for part or all of that student’s qualified
          education expenses instead if certain requirements are met."
    - id: dependent.edu_line27
      printed: '27'
      label: Adjusted qualified education expenses. Don't enter more than $4,000
      shown_when: dependent.edu_aoc
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.edu_aoc
            - const: true
          then:
            def: aqee
            bind: &id002
              inst: dependent.edu_inst
              mat: dependent.edu_mat
              adj: dependent.edu_adj
            line: line27
        - guard:
            op: test
            eq:
            - dependent.edu_aoc
            - const: false
          then: dependent.zero
      cite:
        doc: f8863
        locator: p. 2, Part III, line 27, "Adjusted qualified education expenses (see instructions). Don’t enter more than $4,000"
      refuses: &id003
      - when: dependent.edu_over_refused
        form: Adjusted Qualified Education Expenses Worksheet for more than one academic period
        remedy: The worksheet is completed for each academic period, and an academic period whose tax-free educational assistance
          and refunds exceed its own expenses cannot be netted against another period's expenses. Figure the worksheet period
          by period.
        cite: *id001
    - id: dependent.edu_line28
      printed: '28'
      label: Subtract $2,000 from line 27. If zero or less, enter -0-
      shown_when: dependent.edu_aoc
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.edu_aoc
            - const: true
          then:
            def: aqee
            bind: *id002
            line: line28
        - guard:
            op: test
            eq:
            - dependent.edu_aoc
            - const: false
          then: dependent.zero
      cite:
        doc: f8863
        locator: p. 2, Part III, line 28, "Subtract $2,000 from line 27. If zero or less, enter -0-"
      refuses: *id003
    - id: dependent.edu_line29
      printed: '29'
      label: Multiply line 28 by 25% (0.25)
      shown_when: dependent.edu_aoc
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.edu_aoc
            - const: true
          then:
            def: aqee
            bind: *id002
            line: line29
        - guard:
            op: test
            eq:
            - dependent.edu_aoc
            - const: false
          then: dependent.zero
      cite:
        doc: f8863
        locator: p. 2, Part III, line 29, "Multiply line 28 by 25% (0.25)"
      refuses: *id003
    - id: dependent.edu_line30
      printed: '30'
      label: American opportunity credit for this student. If line 28 is zero, enter the amount from line 27. Otherwise, add $2,000
        to the amount on line 29
      shown_when: dependent.edu_aoc
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.edu_aoc
            - const: true
          then:
            def: aqee
            bind: *id002
            line: line30
        - guard:
            op: test
            eq:
            - dependent.edu_aoc
            - const: false
          then: dependent.zero
      cite:
        doc: f8863
        locator: p. 2, Part III, line 30, "If line 28 is zero, enter the amount from line 27.", "Include the total of all amounts
          from all Parts III, line 30, on Part I, line 1"
      refuses: *id003
    - id: dependent.edu_line31
      printed: '31'
      label: Adjusted qualified education expenses for the lifetime learning credit
      shown_when: dependent.edu_llc
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.edu_llc
            - const: true
          then:
            def: aqee
            bind: *id002
            line: ws4_llc
        - guard:
            op: test
            eq:
            - dependent.edu_llc
            - const: false
          then: dependent.zero
      cite:
        doc: f8863
        locator: p. 2, Part III, line 31, "Adjusted qualified education expenses (see instructions). Include the total of all
          amounts from all Parts III, line 31, on Part II, line 10"
      refuses: *id003
