form:
  id: dependent
  kind: worksheet
  title: Dependents — qualifying child and qualifying relative tests, per person listed
  tax_year: 2025
  note: One entry per person the filer lists. The tests of Steps 1 through 5 of "Who Qualifies as Your
    Dependent" are encoded per entry; the rules for married persons, children of divorced or separated
    parents, multiple support agreements and a child who is the qualifying child of another person are
    refused rather than decided. Temporary absences count as months lived with you, as the instructions say.
  lines:
    - id: dependent.relationship
      printed: (helper)
      type: Enum(dependent_relationship)
      label: Relationship to you
      expr:
        op: input
        source: |-
          Relationship to you:

          - child (son, daughter, stepchild, eligible foster child, or a descendant of any of them)
            - an adopted child, including a child lawfully placed with you for legal adoption, is your son or daughter
            - an eligible foster child is one placed with you by an authorized placement agency or by judgment, decree, or other order of any court of competent jurisdiction
            - a child in your care without such a placement who is not otherwise your relative is entered as household_member or other
          - sibling (brother, sister, half brother, half sister, stepbrother or stepsister, or a son or daughter of a brother, sister, half brother or half sister)
          - sibling_descendant (any other descendant of a sibling, such as a grandniece or a stepsibling's child)
          - parent (father or mother; not a foster parent, who is entered as other)
          - parent_relative (a grandparent, aunt or uncle: an ancestor or sibling of a parent)
          - in_law (step-parent or in-law, including one whose relationship began with a marriage that has since ended by death or divorce)
          - household_member (any other person, other than a person who was your spouse at any time during 2025, who lived with you all year as a member of your household, if your relationship did not violate local law)
          - other (any other relationship; such a person is a Step 4 relative only if they lived with you all year as a member of your household and the relationship did not violate local law)

          Do not list a person who was your spouse at any time during 2025: that person can't be your qualifying relative.

          Give the relationship to you; on a joint return, a relative of your spouse who is no relative of yours is entered as household_member or other, and a later question asks about the relationship to your spouse.
      cite:
        doc: i1040gi
        locator: pp. 17 and 19, Steps 1 and 4, "A qualifying child is your..." and "A qualifying relative is your..."; p. 20, Adopted child, "An adopted child includes a child lawfully placed with you for legal adoption"; p. 21, Foster child, "A foster child is any child placed with you by an authorized placement agency or by judgment, decree, or other order of any court of competent jurisdiction"; p501 p. 19, Relatives who don't have to live with you, "Your father, mother, grandparent, or other direct ancestor, but not foster parent"; p501 p. 19, Member of Household or Relationship Test, "If at any time during the year the person was your spouse, that person can’t be your qualifying relative."; p501 p. 19, "Any of these relationships that were established by marriage aren’t ended by death or divorce."
      ambiguity: amb.2025.foster_parent_relationship
    - id: dependent.age
      printed: (helper)
      type: Count
      label: Age at the end of 2025
      expr:
        op: input
        source: Age at the end of 2025 (whole years)
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Under age 19 at the end of 2025"
    - id: dependent.student
      printed: (helper)
      type: Bool
      label: Full-time student in 2025?
      expr:
        op: input
        source: |-
          Was this person a full-time student in 2025, that is, during any part of 5 calendar months of 2025 (not necessarily consecutive), either of these?

          - enrolled for the hours or courses the school considers full-time attendance at a school that has a regular teaching staff and course of study and a regularly enrolled student body (an elementary school, junior or senior high school, college, university, or technical, trade or mechanical school)
          - taking a full-time, on-farm training course given by such a school or a state, county or local government agency

          A student who works on a "co-op" job in private industry as part of a school's regular course of classroom and practical training is a full-time student.

          An on-the-job training course, a correspondence school or a school offering courses only through the Internet does not count.
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Under age 24 at the end of 2025, a full-time student (defined later)"; p. 21, Full-time student, "A full-time student is a child who during any part of 5 calendar months of 2025 was enrolled as a full-time student at a school"; p501 p. 13, Student defined, "1. A full-time student at a school that has a regular teaching staff and course of study, and a regularly enrolled student body at the school; or"; p501 p. 13, Full-time student, "A full-time student is a student who is enrolled for the number of hours or courses the school considers to be full-time attendance."; p501 p. 13, Vocational high school students, "Students who work on “co-op” jobs in private industry as a part of a school’s regular course of classroom and practical training are considered full-time students."
    - id: dependent.disabled
      printed: (helper)
      type: Bool
      label: Permanently and totally disabled?
      expr:
        op: input
        source: Was this person permanently and totally disabled at any time in 2025, that is, unable to engage in any
          substantial gainful activity because of a physical or mental condition that a doctor has determined has lasted
          or can be expected to last continuously for at least a year or can be expected to lead to death?
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Any age and permanently and totally disabled (defined later)"; p. 21, Permanently and totally disabled, "the person can’t engage in any substantial gainful activity because of a physical or mental condition"
    - id: dependent.months
      printed: (helper)
      type: Count
      label: Months lived with you in 2025, counting temporary absences
      expr:
        op: input
        source: |-
          Months this person lived with you in 2025 (0–12)

          - counting temporary absences for school, vacation, business, medical care, military service or detention in a juvenile facility as time lived with you
          - counting a newborn's required hospital stay following birth as time lived with you
          - but not counting time a child presumed kidnapped was missing because of the kidnapping

          Enter 7 if the person lived with you for more than half of 2025 but fewer than 7 full months.

          For a person born, died, adopted or placed with you in 2025 who meets the other conditions to be your qualifying child, enter 12 if your home was their home for more than half the time they were alive or with you, and 0 otherwise.

          For any other person born or who died in 2025, or adopted, lawfully placed with you for legal adoption, or placed with you as an eligible foster child in 2025, enter 12 only if your home was their home for the entire time they were alive or since the adoption or placement, and 0 otherwise
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Who lived with you for more than half of 2025"; p501 p. 13, Death or birth of child, "The same is true if the child lived with you more than half the year except for any required hospital stay following birth."; p501 p. 13, Kidnapped child, "You can treat your child as meeting the residency test even if the child has been kidnapped, but the following statements must be true."; p. 21, Exception to time lived with you ("the person is considered to have lived with you for more than half of 2025 if your home was this person's home for more than half the time the person was alive in 2025"; "Any other person is considered to have lived with you for all of 2025 if the person was born or died in 2025 and your home was this person's home for the entire time the person was alive in 2025")
    - id: dependent.self_support
      printed: (helper)
      type: Bool
      label: Provided over half of their own support?
      expr:
        op: input
        source: |-
          Did this person provide over half of their own support for 2025?

          Total support is the amount spent for their food, lodging, clothing, education, medical and dental care, recreation, transportation and similar necessities, including tax-exempt income, savings and borrowed amounts used for their support and GI Bill tuition payments and allowances.

          It does not include:
          - income, social security or Medicare taxes paid from their own income
          - life insurance premiums
          - funeral expenses
          - medical insurance benefits (including Medicare benefits)
          - Survivors' and Dependents' Educational Assistance payments used for the support of the child who receives them

          Count the person's own funds only if actually spent for their support (support the person paid for with their own wages is theirs, even if you paid the wages, and a person living in their own home provides its fair rental value).

          Count lodging at its fair rental value and property, such as a car the person bought with their own funds, at its fair market value.

          Payments you receive from a child placement agency, state or county for a foster child's support are support provided by the agency, state or county, and benefits a state provides to this person as a needy person (welfare, food benefits, housing, etc.) are support provided by the state, not by the person.

          Do not count a scholarship the person received as a student.

          Social security benefits the person receives and uses for their own support are support the person provided.
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Who didn't provide over half of their own support for 2025"; p501 p. 15, Support Test (To Be a Qualifying Child), "However, to see what is or isn’t support, see Support Test (To Be a Qualifying Relative), later."; p501 p. 19, "A person’s own funds aren’t support unless they are actually spent for support."; p501 p. 20, "For lodging, the amount of support is the fair rental value of the lodging."; p501 p. 20, "You can’t include in your contribution to your child’s support any support paid for by the child with the child’s own wages, even if you paid the wages."; p501 p. 15, Foster care payments and expenses, "Payments you receive for the support of a foster child from a child placement agency are considered support provided by the agency."; p501 p. 15, Scholarships, "A scholarship received by a child who is a student isn’t taken into account in determining whether the child provided more than half of their own support."; p501 p. 20, "If a child receives social security benefits and uses them toward their own support, the benefits are considered as provided by the child."; p501 p. 20, Total Support, "Total support includes amounts spent to provide food, lodging, clothing, education, medical and dental care, recreation, transportation, and similar necessities."; p501 p. 20, Tax-exempt income, "In figuring a person’s total support, include tax-exempt income, savings, and borrowed amounts used to support that person."; p501 p. 20, Support provided by the state (welfare, food benefits, housing, etc.), "Benefits provided by the state to a needy person are generally considered support provided by the state."; p501 p. 15, "Similarly, payments you receive for the support of a foster child from a state or county are considered support provided by the state or county."; p501 p. 21, Person living in their own home, "The total fair rental value of a person’s home that the person owns is considered support contributed by that person."; p501 p. 21, Property, "Property provided as support is measured by its fair market value."; p501 p. 21, Capital expenses, "Because the car is bought and owned by your child, the car’s fair market value ($4,500) must be included in your child’s support."; p501 p. 21, Medical insurance benefits, "Medical insurance benefits, including basic and supplementary Medicare benefits, aren’t part of support."; p501 p. 21, Tuition payments and allowances under the GI Bill, "Amounts veterans receive under the GI Bill for tuition payments and allowances while they attend school are included in total support."; p501 p. 21, Don’t Include in Total Support, "1. Federal, state, and local income taxes paid by persons from their own income.", "2. Social security and Medicare taxes paid by persons from their own income.", "3. Life insurance premiums.", "4. Funeral expenses." and "6. Survivors’ and Dependents’ Educational Assistance payments used for the support of the child who receives them."
    - id: dependent.joint_return
      printed: (helper)
      type: Bool
      label: Included on a 2025 joint return filed other than only to claim a refund?
      expr:
        op: input
        source: Is a joint return being filed for 2025 that includes this person (including one filed by this person with a
          spouse who died during 2025, or by this person's surviving spouse after this person died during 2025), other
          than one filed only to claim a refund of withheld or estimated tax?
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Who isn't filing a joint return for 2025 or is filing a joint return for 2025 only to claim a refund"; p. 21, Married person, "If the person is married and files a joint return, you can’t claim that person as your dependent."
    - id: dependent.citizen
      printed: (helper)
      type: Bool
      label: U.S. citizen, U.S. national or U.S. resident alien?
      expr:
        op: input
        source: Was this person a U.S. citizen, U.S. national or U.S. resident alien? (Answer yes for your adopted child
          who lived with you all year as a member of your household, if you are a U.S. citizen or U.S. national.)
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, question 1, and Step 3, question 2; p. 20, Exception to citizen test ("If you are a U.S. citizen or U.S. national and your adopted child lived with you all year as a member of your household, that child meets the requirement to be a U.S. citizen in Step 2, question 1; Step 3, question 2; Step 4, question 2; and Step 5, question 3")
    - id: dependent.canada_mexico
      printed: (helper)
      type: Bool
      label: Resident of Canada or Mexico (if not a U.S. citizen, national or resident alien)?
      expr:
        op: input
        source: If not a U.S. citizen, national or resident alien, was this person a resident of Canada or Mexico?
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, question 1, "or a resident of Canada or Mexico"
    - id: dependent.married
      printed: (helper)
      type: Bool
      label: Married, or included on a 2025 joint return?
      expr:
        op: input
        source: 'Was this person married at the end of 2025 (a person legally separated under a decree of divorce or separate maintenance is not married), or is a joint return being filed for 2025 that includes this person (including one filed by this person with a spouse who died during 2025, or by this person''s surviving spouse after this person died during 2025)?'
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, question 2, "Was the child married? Yes. See Married person, later"; p. 21, Married person, "If the person is married and files a joint return, you can’t claim that person as your dependent."
    - id: dependent.tin
      printed: (helper)
      type: Bool
      label: SSN, ITIN or ATIN issued on or before the due date of your return?
      expr:
        op: input
        source: Did this person have an SSN, ITIN or ATIN issued on or before the due date of your 2025 return (including
          extensions), or have you applied for an ITIN or ATIN for this person by then? An ITIN that has expired counts
          only if it has been renewed, or renewal applied for, by then.
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 1, and p. 19, Step 5, question 2; p503 p. 3, "If your ITIN wasn’t included on at least one U.S. federal tax return for the last 3 consecutive tax years, it expires on December 31 of the third consecutive tax year, and must be renewed before being used again on a U.S. federal tax return."
    - id: dependent.work_ssn
      printed: (helper)
      type: Bool
      label: SSN valid for employment issued before the due date of your return?
      expr:
        op: input
        source: Did this person have an SSN valid for employment, issued before the due date of your 2025 return (including
          extensions)? If the card says "Valid for Work Only With DHS Authorization", answer yes only if the DHS
          authorization is valid.
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 4; p. 22, "if “Valid for Work Only With DHS Authorization” is printed on your child’s social security card, your child has the required SSN only as long as the DHS authorization is valid"
    - id: dependent.gross_income
      printed: (helper)
      type: NonNegDollars
      label: Gross income for 2025
      expr:
        op: input
        source: This person's gross income for 2025, which is all income in the form of money, property, and services that
          isn't exempt from tax. Include gross receipts from rental property without deducting taxes, repairs or other
          expenses, a partner's share of the gross (not net) partnership income, business sales minus the cost of goods
          sold in a manufacturing, merchandising or mining business, and all taxable unemployment compensation, taxable
          social security benefits and certain amounts received as scholarship and fellowship grants. Do not include
          nontaxable social security benefits or other tax-exempt income.
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Who had gross income of less than $5,200 in 2025"; p501 p. 19, Gross income defined, "Gross income is all income in the form of money, property, and services that isn’t exempt from tax."; p501 p. 19, "Gross receipts from rental property are gross income. Don’t deduct taxes, repairs, or other expenses to determine the gross income from rental property."; p501 p. 19, "Gross income includes a partner’s share of the gross (not net) partnership income."; p501 p. 19, "Gross income also includes all taxable unemployment compensation, taxable social security benefits, and certain amounts received as scholarship and fellowship grants."
    - id: dependent.supported
      printed: (helper)
      type: Bool
      label: You provided over half of this person's support?
      expr:
        op: input
        source: |-
          Did you provide over half of this person's support in 2025?

          Total support is the amount spent for the person's food, lodging, clothing, education, medical and dental care, recreation, transportation and similar necessities, including their tax-exempt income, savings and borrowed amounts used for their support and GI Bill tuition payments and allowances.

          It does not include:
          - income, social security or Medicare taxes the person paid from their own income
          - life insurance premiums
          - funeral expenses
          - a scholarship your child received as a student
          - Survivors' and Dependents' Educational Assistance payments used for the support of the child who receives them

          TANF or other public assistance payments you received and used to support this person count as support you provided.

          Count:
          - lodging at its fair rental value, which includes a reasonable allowance for furniture, appliances, heat and other utilities provided
            - a person living in their own home provides its fair rental value
            - if you provide only part of the lodging and the person supplies the rest, divide the fair rental value by how much each of you provides
            - if you live rent free in this person's home, reduce your support by the fair rental value of the lodging they provide you
          - property at its fair market value
          - expenses for the whole household, such as food, divided among its members

          Medical insurance premiums you pay, including premiums for supplementary Medicare coverage, are support you provide; medical insurance benefits, including Medicare benefits, are not support.

          Count both the government's part and the part taken out of your military pay of an Armed Forces dependency allotment, and a tax-exempt military quarters allowance, as yours, and count payments you make for the person's child or dependent care as yours.

          A lump-sum advance payment to a home for the aged for a relative's care for life, based on their life expectancy, counts each year as the payment divided by that life expectancy.

          A capital item such as furniture, an appliance or a car counts only if bought for the person and given to them, not one the household shares or that you own and let them use.

          The person's own funds are support only if actually spent for their support.

          Payments you receive from a child placement agency, state or county for a foster child's support are support provided by the agency, state or county, not by you; your unreimbursed foster care expenses are not support you provided if you are in the trade or business of providing foster care or if they are deductible as a charitable contribution.

          Support your child paid for with the child's own wages is not yours, even if you paid the wages.

          Benefits a state provides to this person as a needy person (welfare, food benefits, housing, etc.) are support provided by the state, not by you; but payments based on need are not counted entirely as this person's support if part of them can be shown not to have been used for it.

          When spouses receive social security benefits by one check made out to both of them, half is support of each spouse unless they can show otherwise.

          Alimony or separate maintenance payments to a spouse (or similar payments from an estate or trust) are not support of a dependent.

          The year you provide support is the year you pay for it, even with borrowed money you repay later.
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "For whom you provided over half of the person's support in 2025"; p. 21, Public assistance payments; p501 p. 20, TANF and other governmental payments, "those payments are considered support you provided for that person"; p501 p. 20, "For lodging, the amount of support is the fair rental value of the lodging."; p501 p. 20, Armed Forces dependency allotments, "The part of the allotment contributed by the government and the part taken out of your military pay are both considered provided by you in figuring whether you provide more than half of the support."; p501 p. 19, "A person’s own funds aren’t support unless they are actually spent for support."; p501 p. 20, Foster care, "Payments you receive for the support of a foster child from a child placement agency are considered support provided by the agency."; p501 p. 15, "Similarly, payments you receive for the support of a foster child from a state or county are considered support provided by the state or county."; p501 p. 20, Child’s wages used for own support, "You can’t include in your contribution to your child’s support any support paid for by the child with the child’s own wages, even if you paid the wages."; p501 p. 20, Support provided by the state (welfare, food benefits, housing, etc.), "Benefits provided by the state to a needy person are generally considered support provided by the state."; p501 p. 20, Total Support, "Total support includes amounts spent to provide food, lodging, clothing, education, medical and dental care, recreation, transportation, and similar necessities."; p501 p. 20, Tax-exempt income, "In figuring a person’s total support, include tax-exempt income, savings, and borrowed amounts used to support that person."; p501 p. 20, "Expenses not directly related to any one member of a household, such as the cost of food for the household, must be divided among the members of the household."; p501 p. 20, Year support is provided, "The year you provide the support is the year you pay for it, even if you do so with borrowed money that you repay in a later year."; p501 p. 20, Tax-exempt military quarters allowances, "These allowances are treated the same way as dependency allotments in figuring support."; p501 p. 20, Home for the aged, "the amount of support you provide each year is the lump-sum payment divided by the relative’s life expectancy"; p501 p. 21, Person living in their own home, "The total fair rental value of a person’s home that the person owns is considered support contributed by that person."; p501 p. 21, Living with someone rent free, "you must reduce the amount you provide for support of that person by the fair rental value of lodging the person provides you"; p501 p. 21, Property, "Property provided as support is measured by its fair market value."; p501 p. 21, Capital expenses, "Because you own the car and don’t give it to your child but merely let your child use it, don’t include the cost of the car in your child’s total support."; p501 p. 21, Medical insurance premiums, "Medical insurance premiums you pay, including premiums for supplementary Medicare coverage, are included in the support you provide."; p501 p. 21, Medical insurance benefits, "Medical insurance benefits, including basic and supplementary Medicare benefits, aren’t part of support."; p501 p. 21, Tuition payments and allowances under the GI Bill, "Amounts veterans receive under the GI Bill for tuition payments and allowances while they attend school are included in total support."; p501 p. 21, Childcare expenses, "If you pay someone to provide child or dependent care, you can include these payments in the amount you provided for the support of your child or disabled dependent"; p501 p. 21, Don’t Include in Total Support, "1. Federal, state, and local income taxes paid by persons from their own income.", "2. Social security and Medicare taxes paid by persons from their own income.", "3. Life insurance premiums.", "4. Funeral expenses.", "5. Scholarships received by your child if your child is a student." and "6. Survivors’ and Dependents’ Educational Assistance payments used for the support of the child who receives them."; p501 p. 15, Foster care payments and expenses, "If you are in the trade or business of providing foster care, your unreimbursed expenses aren’t considered support provided by you."; p501 p. 20, Lodging, "Fair rental value includes a reasonable allowance for the use of furniture and appliances, and for heat and other utilities that are provided."; p501 p. 21, "If you don’t provide the total lodging, the total fair rental value must be divided depending on how much of the total lodging you provide."; p501 p. 20, Support provided by the state, "However, payments based on the needs of the recipient won’t be considered as used entirely for that person’s support if it is shown that part of the payments weren’t used for that purpose."; p501 p. 20, Social security benefits, "If spouses each receive benefits that are paid by one check made out to both of them, half of the total paid is considered to be for the support of each spouse, unless they can show otherwise."; p501 p. 22, Alimony, "Payments to a spouse that are alimony or separate maintenance payments, or similar payments from an estate or trust, aren’t treated as a payment for the support of a dependent."
    - id: dependent.kidnapped
      printed: (helper)
      type: Bool
      label: A child kidnapped by someone who isn't a member of your family or the child's family, presumed kidnapped by law enforcement, and missing because of it at some time in 2025?
      expr:
        op: input
        source: Is this person a child who was kidnapped by someone who isn't a member of your family or the child's family,
          whom law enforcement authorities presume to have been kidnapped, and who was missing because of the kidnapping at
          some time during 2025 (a kidnapping in 2025, or an earlier kidnapping before the child's return)? Answer yes even
          if law enforcement first presumed the kidnapping after 2025, or the child has since been returned.
      cite:
        doc: i1040gi
        locator: p. 21, Kidnapped child, "If your child is presumed by law enforcement authorities to have been kidnapped by someone who isn’t a family member, you may be able to take the child into account"; p501 p. 13, Kidnapped child, "1. The child is presumed by law enforcement authorities to have been kidnapped by someone who isn’t a member of your family or the child’s family.", "2. In the year the kidnapping occurred, the child lived with you for more than half of the part of the year before the date of the kidnapping." and "3. In the year of the child’s return, the child lived with you for more than half the part of the year following the date of the child’s return."; p501 p. 13, "This treatment applies for all years until the earlier of"; p501 p. 18, Kidnapped child, "You can treat a child as your qualifying relative even if the child has been kidnapped"
    - id: dependent.other_claimant
      printed: (helper)
      type: Bool
      label: Meets the conditions to be the qualifying child of another person?
      expr:
        op: input
        source: 'Does this person meet the conditions to be the qualifying child of any other person for 2025, under the dependent rules or under the EIC rules (which have no support test)?'
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "If the child meets the conditions to be a qualifying child of any other person ... see Qualifying child of more than one person"
    - id: dependent.other_nontaxpayer
      printed: (helper)
      type: Bool
      label: Every other person this person is a qualifying child of is not a taxpayer?
      expr:
        op: input
        source: 'If this person meets the conditions to be the qualifying child of another person: is every such other person not a taxpayer for 2025? A person is not a taxpayer if they are not required to file a 2025 U.S. income tax return and either do not file one or file only to get a refund of withheld income tax or estimated tax paid (claiming no earned income credit or other tax credit or deduction), or if they are not a U.S. citizen and have no U.S. gross income.'
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Who wasn’t a qualifying child (see Step 1) of any taxpayer for 2025. For this purpose, a person isn’t a taxpayer if the person isn’t required to file a U.S. income tax return and either doesn’t file such a return or files only to get a refund of withheld income tax or estimated tax paid."; p501 p. 18, Example 2—return filed to claim refund, "Your friend files a return only to get a refund of the income tax withheld and doesn’t claim the earned income credit or any other tax credits or deductions."; p501 p. 18, Child in Canada or Mexico, "If the persons the child does live with aren’t U.S. citizens and have no U.S. gross income, those persons aren’t “taxpayers,” so the child isn’t the qualifying child of any other taxpayer."
    - id: dependent.divorced_rule
      printed: (helper)
      type: Bool
      label: Rule for children of divorced or separated parents applies?
      expr:
        op: input
        source: 'Does the special rule for children of divorced or separated parents, or parents who lived apart (including parents who never married), apply to this person, for example because a Form 8332 release or a decree lets the noncustodial parent claim the child? Answer yes whether you are the custodial parent who signed the release (or whose decree or agreement lets the other parent claim the child) or the noncustodial parent using it. A release the custodial parent has revoked still applies for 2025 unless written notice of the revocation was given (or reasonable efforts were made to give it) to the noncustodial parent in 2024 or earlier.'
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "But see Children of divorced or separated parents"; p. 20, Children of divorced or separated parents, "If conditions (1) through (4) apply, only the noncustodial parent can claim the child for purposes of the child tax credit and credit for other dependents"; p501 p. 22, Revocation of release of claim to an exemption, "For the revocation to be effective for 2025, the custodial parent must have given (or made reasonable efforts to give) written notice of the revocation to the noncustodial parent in 2024 or earlier."
    - id: dependent.multiple_support
      printed: (helper)
      type: Bool
      label: Claimed under a multiple support agreement?
      expr:
        op: input
        source: 'Did you and others together provide over half of this person''s support for 2025, with no one person providing over half (a multiple support situation), whether you or another contributor claims the person?'
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Multiple support agreements"
    - id: dependent.parent_home_paid
      printed: (helper)
      type: Bool
      label: For a parent not living with you, you paid over half the cost of their main home for all of 2025 (or the part of
        2025 they were alive)?
      expr:
        op: input
        source: |-
          If this person is your parent, did you pay over half the cost of keeping up a home that was their main home for all of 2025 (or, if your parent died in 2025, for the entire part of 2025 your parent was alive)?

          A rest home or home for the elderly counts as your parent's main home if you paid over half the cost of keeping your parent there.

          Cost of keeping up a home includes expenses such as:
          - rent
          - mortgage interest
          - real estate taxes
          - insurance on the home
          - repairs
          - utilities
          - food eaten in the home

          It does not include:
          - the cost of clothing, education, medical treatment, vacations, life insurance, or transportation
          - the value of your services or those of a member of your household

          Money your parent spent on the home out of their own income, such as Social Security, counts as paid by your parent, not by you.

          TANF or other similar payments you received and used to keep up the home count as paid by you.
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 1; p. 15, "If the person is anyone else, see Pub. 501"; p501 p. 9, Death or
          birth, "Your parent for whom you paid, for the entire part of the year your parent was alive, more than half the
          cost of keeping up the home your parent lived in"; p501 p. 9, "If you pay more than half the cost of keeping your
          parent in a rest home or home for the elderly, that counts as paying more than half the cost of keeping up your
          parent’s main home." p501 p. 9, Keeping Up a Home, "Costs you include. Include in the cost of keeping up a home expenses such as rent, mortgage interest, real estate taxes, insurance on the home, repairs, utilities, and food eaten in the home." p501 p. 9, "Costs you don’t include. Don’t include the cost of clothing, education, medical treatment, vacations, life insurance, or transportation. Also don’t include the value of your services or those of a member of your household." p501 p. 9, Note, "Amounts paid out of funds received in the child’s or qualifying person’s name, such as Social Security, are considered paid by the child, not you."; p501 p. 9, Note, "if you received Temporary Assistance to Needy Families (TANF) payments or other similar payments and used the payment to support another person, those payments are considered support you provided for that person, rather than support provided by the government or other third party."
    - id: dependent.born_died
      printed: (helper)
      type: Bool
      label: Born or died in 2025?
      expr:
        op: input
        source: Was this person born in 2025, or did this person die in 2025? A child born in 2025 is born alive only if
          state or local law treats the child as born alive and an official document, such as a birth certificate, shows
          the live birth (even if the child lived only for a moment). Do not list a stillborn child.
      cite:
        doc: i1040gi
        locator: p. 15, "If the person for whom you kept up a home was born or died in 2025, you still may be able to file as
          head of household"; p501 p. 13, Child born alive, "State or local law must treat the child as having been born
          alive. There must be proof of a live birth shown by an official document, such as a birth certificate."; p501 p.
          13, Stillborn child, "You can’t claim a stillborn child as a dependent."
    - id: dependent.placed
      printed: (helper)
      type: Bool
      label: Adopted, placed for adoption or placed as a foster child in 2025?
      expr:
        op: input
        source: Did you adopt this person in 2025, or was this person lawfully placed with you for legal adoption by you, or
          placed with you as an eligible foster child, during 2025?
      cite:
        doc: i1040gi
        locator: p. 15, "Similarly, if you adopted the person for whom you kept up a home in 2025, the person was lawfully
          placed with you for legal adoption by you in 2025, or the person was an eligible foster child placed with you
          during 2025"
    - id: dependent.part_year_home
      printed: (helper)
      type: Bool
      label: Lived with you more than half the part of 2025 they were alive, or since the adoption or placement?
      expr:
        op: input
        source: Was your home this person's home for more than half of the part of 2025 they were alive (or, for a person
          adopted or placed with you in 2025, more than half of the time since the adoption or placement), counting
          temporary absences for school, vacation, business, medical care, military service or detention in a juvenile
          facility as time lived with you?
      cite:
        doc: p501
        locator: p. 9, Death or birth, "Your qualifying child or qualifying relative who lived with you for more than half the
          part of the year they were alive"; i1040gi p. 15, "more than half the time since the person was adopted or placed
          with you in 2025"; i1040gi pp. 14-15, temporary absences, "or detention in a juvenile facility"
    - id: dependent.hoh_part_year
      printed: (helper)
      label: 'For a relative other than a qualifying child who did not live with you more than half of 2025: born or died in 2025,
        or adopted or placed, and lived with you more than half of the part of the year'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.qualifying_child
            - const: true
          then: dependent.no
        - guard:
            op: test
            eq:
            - dependent.qualifying_child
            - const: false
          then: dependent.hoh_part_year_relative
      cite:
        doc: p501
        locator: p. 9, Death or birth, "To qualify you for head of household filing status, the qualifying person (as defined
          in Table 4) must be one of the following"; i1040gi p. 15, "the person is considered to have lived with you for more
          than half of 2025 if your main home was this person's main home for more than half the time since the person was adopted
          or placed with you in 2025"
    - id: dependent.hoh_part_year_relative
      printed: (helper)
      label: Born or died in 2025, or adopted or placed with you in 2025, and lived with you more than half of the part of the
        year
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.born_died_or_placed
            - const: true
          then: dependent.part_year_home
        - guard:
            op: test
            eq:
            - dependent.born_died_or_placed
            - const: false
          then: dependent.no
      cite:
        doc: p501
        locator: p. 9, Death or birth, "To qualify you for head of household filing status, the qualifying person (as defined
          in Table 4) must be one of the following"; i1040gi p. 15, "the person is considered to have lived with you for more
          than half of 2025 if your main home was this person's main home for more than half the time since the person was adopted
          or placed with you in 2025"
    - id: dependent.born_died_or_placed
      printed: (helper)
      label: Born or died in 2025, or adopted or placed with you in 2025
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.born_died
            - const: true
          then: dependent.born_died
        - guard:
            op: test
            eq:
            - dependent.born_died
            - const: false
          then: dependent.placed
      cite:
        doc: p501
        locator: p. 9, Death or birth, "To qualify you for head of household filing status, the qualifying person (as defined
          in Table 4) must be one of the following"; i1040gi p. 15, "the person is considered to have lived with you for more
          than half of 2025 if your main home was this person's main home for more than half the time since the person was adopted
          or placed with you in 2025"
    - id: dependent.hoh_lived_half
      printed: (helper)
      type: Bool
      label: Lived with you more than half of 2025, or, for a relative other than a qualifying child (whose months already count
        the part of the year), more than half of the part of 2025 they were alive or since their adoption or placement
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.lived_half
            - const: true
          then: dependent.lived_half
        - guard:
            op: test
            eq:
            - dependent.lived_half
            - const: false
          then: dependent.hoh_part_year
      cite:
        doc: p501
        locator: p. 9, Death or birth, "To qualify you for head of household filing status, the qualifying person (as defined
          in Table 4) must be one of the following"; i1040gi p. 15, "the person is considered to have lived with you for more
          than half of 2025 if your main home was this person's main home for more than half the time since the person was
          adopted or placed with you in 2025"
    - id: dependent.dc_lived_half
      printed: (helper)
      type: Bool
      label: Lived with you more than half of 2025, or, for a person other than a qualifying child born or who died in 2025, more
        than half of the part of 2025 they were alive
      expr:
        op: test
        any:
          - op: test
            eq:
              - dependent.lived_half
              - const: true
          - op: test
            all:
              - op: test
                eq:
                  - dependent.qualifying_child
                  - const: false
              - op: test
                eq:
                  - dependent.born_died
                  - const: true
              - op: test
                eq:
                  - dependent.part_year_home
                  - const: true
      cite:
        doc: p503
        locator: p. 3, Birth or death of otherwise qualifying person, "a person who was born or died in 2025 is treated as
          having lived with you for more than half of 2025 if your home was the person's home more than half the time they
          were alive in 2025"
    - id: dependent.one
      printed: (helper)
      type: Count
      label: One person listed
      expr:
        op: param
        ref: dependent.one
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), lines 4 and 6
    - id: dependent.zero
      printed: (helper)
      type: NonNegDollars
      label: No amount for this person
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), lines 5 and 7
    - id: dependent.qc_relationship
      printed: (helper)
      type: Bool
      label: A child, sibling, or a descendant of either
      expr:
        op: test
        any:
          - op: test
            eq:
              - dependent.relationship
              - const: child
          - op: test
            eq:
              - dependent.relationship
              - const: sibling
          - op: test
            eq:
              - dependent.relationship
              - const: sibling_descendant
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Son, daughter, stepchild, foster child, brother, sister, stepbrother, stepsister, half brother, half sister, or a descendant of any of them"
    - id: dependent.younger
      printed: (helper)
      type: Bool
      label: Younger than you (or your spouse if filing jointly)?
      expr:
        op: input
        source: Was this person younger than you (or, if you file jointly, younger than you or your spouse; the person need not be younger than both of you)?
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "and younger than you (or your spouse if filing jointly)"; p501 p. 13, "if you are married filing jointly, the child must be younger than you or your spouse but doesn't have to be younger than both of you"
    - id: dependent.us_half
      printed: (helper)
      type: Bool
      label: Lived with you in the United States for more than half of 2025?
      expr:
        op: input
        source: |-
          Did this person live with you in the United States (the 50 states and the District of Columbia) for more than half of 2025?

          If you were on extended active military duty outside the United States, your main home is considered to be in the United States during that duty.

          Temporary absences for school, vacation, business, medical care, military service or juvenile detention count as time lived with you; time a child presumed kidnapped was missing because of the kidnapping does not.

          A child born or who died in 2025 counts if your home was the child's home for more than half the time the child was alive.

          A child you adopted, who was lawfully placed with you for legal adoption, or who was placed with you as an eligible foster child in 2025 counts if your main home was the child's main home for more than half the time since the adoption or placement.
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, "Who lived with you in the United States for more than half of 2025"; p. 43, Exception to
          time lived with you; p. 44, Members of the military; p. 45, United States
    - id: dependent.eic_ssn
      printed: (helper)
      type: Bool
      label: SSN valid for the EIC, issued on or before the due date of your return?
      expr:
        op: input
        source: Did this person have a social security number issued on or before the due date of your 2025 return
          (including extensions) that is valid for the EIC? Any number issued by the Social Security Administration is
          valid unless the card says "Not Valid for Employment" and the number was issued solely to apply for or receive
          a federally funded benefit; a card that says "Valid for Work Only With DHS Authorization" is valid only while
          the authorization is valid.
      cite:
        doc: i1040gi
        locator: pp. 44–45, Social security number (SSN), EIC
      ambiguity: amb.2025.eic_valid_ssn
    - id: dependent.under_19
      printed: (helper)
      label: Under age 19 at the end of 2025
      type: Bool
      expr:
        op: test
        lt:
        - dependent.age
        - param: qc.age_limit
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, the age conditions
    - id: dependent.under_24
      printed: (helper)
      label: Under age 24 at the end of 2025
      type: Bool
      expr:
        op: test
        lt:
        - dependent.age
        - param: qc.student_age_limit
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, the age conditions
    - id: dependent.qc_age_younger
      printed: (helper)
      label: Younger than you (or your spouse if filing jointly), or permanently and totally disabled
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.younger
            - const: true
          then: dependent.younger
        - guard:
            op: test
            eq:
            - dependent.younger
            - const: false
          then: dependent.disabled
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, the age conditions
    - id: dependent.qc_age_19
      printed: (helper)
      label: 'Age test for a person aged 19 or older: under 24, a full-time student and younger than you, or permanently and totally
        disabled'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.under_24
            - const: true
          then: dependent.qc_age_student
        - guard:
            op: test
            eq:
            - dependent.under_24
            - const: false
          then: dependent.disabled
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, the age conditions
    - id: dependent.qc_age_student
      printed: (helper)
      label: 'Age test for a person aged 19 to 23: a full-time student and younger than you, or permanently and totally disabled'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.student
            - const: true
          then: dependent.qc_age_younger
        - guard:
            op: test
            eq:
            - dependent.student
            - const: false
          then: dependent.disabled
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, the age conditions
    - id: dependent.qc_age
      printed: (helper)
      type: Bool
      label: Under 19 and younger than you, under 24 a full-time student and younger than you, or permanently and totally disabled
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.under_19
            - const: true
          then: dependent.qc_age_younger
        - guard:
            op: test
            eq:
            - dependent.under_19
            - const: false
          then: dependent.qc_age_19
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, the age conditions
    - id: dependent.lived_half
      printed: (helper)
      type: Bool
      label: Lived with you for more than half of 2025
      expr:
        op: test
        gt:
          - dependent.months
          - const: 6
            type: Count
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Who lived with you for more than half of 2025"
      refuses:
        - when: dependent.kidnap_residency
          form: Kidnapped child (Pub. 501; Pub. 596 for the EIC)
          remedy: A child presumed kidnapped by someone who isn't a family member, who lived with you for fewer than 7 months of 2025 without counting the time missing, may count as living with you under rules this tool does not apply.
          cite:
            doc: i1040gi
            locator: p. 21, Kidnapped child, "For details, see Pub. 501 (Pub. 596 for the EIC)"
    - id: dependent.kidnap_residency
      printed: (gate)
      type: Bool
      label: A child presumed kidnapped who lived with you for fewer than 7 months of 2025, not counting the time missing
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.kidnapped
              - const: true
          - op: test
            lt:
              - dependent.months
              - const: 7
                type: Count
      cite:
        doc: p501
        locator: p. 13, Kidnapped child, "You can treat your child as meeting the residency test even if the child has been kidnapped, but the following statements must be true." (a child who lived with you for more than half of 2025 meets the residency test without this treatment)
    - id: dependent.no
      printed: (helper)
      label: Year parameter household.no (false)
      type: Bool
      expr:
        op: param
        ref: household.no
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Do you have a child who meets the conditions to be your qualifying child?"
    - id: dependent.qc_tests
      printed: (helper)
      label: 'Qualifying child tests (Step 1): relationship, age, support, joint return and residency, each asked only when the
        ones before it pass'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.qc_relationship
            - const: true
          then: dependent.qc_from_age
        - guard:
            op: test
            eq:
            - dependent.qc_relationship
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Do you have a child who meets the conditions to be your qualifying child?"
    - id: dependent.qc_from_age
      printed: (helper)
      label: 'Qualifying child tests (Step 1) from the age test on: age, support, joint return and residency'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.qc_age
            - const: true
          then: dependent.qc_from_support
        - guard:
            op: test
            eq:
            - dependent.qc_age
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Do you have a child who meets the conditions to be your qualifying child?"
    - id: dependent.qc_from_support
      printed: (helper)
      label: 'Qualifying child tests (Step 1) from the support test on: support, joint return and residency'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.self_support
            - const: true
          then: dependent.no
        - guard:
            op: test
            eq:
            - dependent.self_support
            - const: false
          then: dependent.qc_from_joint
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Do you have a child who meets the conditions to be your qualifying child?"
    - id: dependent.qc_from_joint
      printed: (helper)
      label: 'Qualifying child tests (Step 1) from the joint return test on: joint return and residency'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.joint_return
            - const: true
          then: dependent.no
        - guard:
            op: test
            eq:
            - dependent.joint_return
            - const: false
          then: dependent.lived_half
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Do you have a child who meets the conditions to be your qualifying child?"
    - id: dependent.qualifying_child
      printed: (helper)
      type: Bool
      label: Qualifying child (Step 1)
      expr:
        op: test
        eq:
        - dependent.qc_tests
        - const: true
      cite:
        doc: i1040gi
        locator: p. 17, Step 1, "Do you have a child who meets the conditions to be your qualifying child?"
      refuses:
        - when: dependent.qc_tiebreak
          form: Qualifying child of more than one person (tie-breaker rules)
          remedy: This person may be the qualifying child of another person. The tie-breaker rules are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 21, Qualifying child of more than one person
        - when: dependent.divorced_rule
          form: Children of divorced or separated parents
          remedy: The rule for children of divorced or separated parents is outside this tool.
          cite:
            doc: i1040gi
            locator: p. 20, Children of divorced or separated parents
        - when: dependent.married
          form: Married person rules
          remedy: A married dependent is outside this tool; see Married person in the instructions.
          cite:
            doc: i1040gi
            locator: p. 21, Married person
    - id: dependent.resident
      printed: (helper)
      type: Bool
      label: U.S. citizen, national or resident alien, or a resident of Canada or Mexico
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.citizen
            - const: true
          then: dependent.citizen
        - guard:
            op: test
            eq:
            - dependent.citizen
            - const: false
          then: dependent.canada_mexico
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, question 1
    - id: dependent.qc_dependent_resident
      printed: (helper)
      label: Qualifying child who is a U.S. citizen, national or resident alien or a resident of Canada or Mexico, and you are
        not a dependent
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.resident
            - const: true
          then: dependent.filer_not_dependent
        - guard:
            op: test
            eq:
            - dependent.resident
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, questions 1 and 4
    - id: dependent.filer_not_dependent
      printed: (helper)
      label: You (and your spouse if filing jointly) cannot be claimed as a dependent
      type: Bool
      expr:
        op: test
        eq:
        - sa.dependent
        - const: false
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, questions 1 and 4
    - id: dependent.qc_dependent
      printed: (helper)
      type: Bool
      label: Qualifying child who is your dependent (Step 2)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.qualifying_child
            - const: true
          then: dependent.qc_dependent_resident
        - guard:
            op: test
            eq:
            - dependent.qualifying_child
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 18, Step 2, questions 1 and 4
    - id: dependent.qr_listed_relative
      printed: (helper)
      label: A child, sibling, parent, other ancestor or in-law listed in Step 4
      type: Bool
      expr:
        op: test
        any:
        - op: test
          eq:
          - dependent.relationship
          - const: child
        - op: test
          eq:
          - dependent.relationship
          - const: sibling
        - op: test
          eq:
          - dependent.relationship
          - const: parent
        - op: test
          eq:
          - dependent.relationship
          - const: parent_relative
        - op: test
          eq:
          - dependent.relationship
          - const: in_law
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "A qualifying relative is your..." through "Any other person (other than your spouse) who lived
          with you all year as a member of your household"; p501 p. 19, Joint return, "If you file a joint return, the person
          can be related to either you or your spouse."
    - id: dependent.qr_household_member
      printed: (helper)
      label: 'A household member: lived with you all year, or a relative of your spouse on a joint return'
      type: Bool
      expr:
        op: test
        any:
        - op: test
          all:
          - op: test
            eq:
            - f1040.status
            - const: mfj
          - op: test
            eq:
            - dependent.spouse_relative
            - const: true
        - op: test
          eq:
          - dependent.qr_all_year
          - const: true
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "A qualifying relative is your..." through "Any other person (other than your spouse) who lived
          with you all year as a member of your household"; p501 p. 19, Joint return, "If you file a joint return, the person
          can be related to either you or your spouse."
    - id: dependent.qr_other_relation
      printed: (helper)
      label: 'A descendant of a sibling or another person: lived with you all year and the relationship did not violate local
        law, or a relative of your spouse on a joint return'
      type: Bool
      expr:
        op: test
        any:
        - op: test
          all:
          - op: test
            eq:
            - f1040.status
            - const: mfj
          - op: test
            eq:
            - dependent.spouse_relative
            - const: true
        - op: test
          all:
          - op: test
            eq:
            - dependent.qr_all_year
            - const: true
          - op: test
            eq:
            - dependent.lawful
            - const: true
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "A qualifying relative is your..." through "Any other person (other than your spouse) who lived
          with you all year as a member of your household"; p501 p. 19, Joint return, "If you file a joint return, the person
          can be related to either you or your spouse."
    - id: dependent.qr_relationship
      printed: (helper)
      type: Bool
      label: A relative listed in Step 4, or any other person who lived with you all year
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.relationship
            - const: child
          then: dependent.qr_listed_relative
        - guard:
            op: test
            eq:
            - dependent.relationship
            - const: sibling
          then: dependent.qr_listed_relative
        - guard:
            op: test
            eq:
            - dependent.relationship
            - const: parent
          then: dependent.qr_listed_relative
        - guard:
            op: test
            eq:
            - dependent.relationship
            - const: parent_relative
          then: dependent.qr_listed_relative
        - guard:
            op: test
            eq:
            - dependent.relationship
            - const: in_law
          then: dependent.qr_listed_relative
        - guard:
            op: test
            eq:
            - dependent.relationship
            - const: household_member
          then: dependent.qr_household_member
        - guard:
            op: test
            eq:
            - dependent.relationship
            - const: sibling_descendant
          then: dependent.qr_other_relation
        - guard:
            op: test
            eq:
            - dependent.relationship
            - const: other
          then: dependent.qr_other_relation
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "A qualifying relative is your..." through "Any other person (other than your spouse) who lived with you all year as a member of your household"; p501 p. 19, Joint return, "If you file a joint return, the person can be related to either you or your spouse."
    - id: dependent.spouse_relative
      printed: (helper)
      type: Bool
      label: On a joint return, related to your spouse in one of the Step 4 ways
      expr:
        op: input
        source: |-
          Is this person related to your spouse in one of these ways?

          - your spouse's child, stepchild or foster child, or a descendant of any of them
          - your spouse's brother, sister, half brother, half sister, stepbrother or stepsister
          - your spouse's father, mother, grandparent or other direct ancestor (not a foster parent)
          - your spouse's stepfather or stepmother
          - a son or daughter of your spouse's brother, sister, half brother or half sister
          - a brother or sister of your spouse's father or mother
          - your spouse's son-in-law, daughter-in-law, father-in-law, mother-in-law, brother-in-law or sister-in-law

          A relationship established by marriage is not ended by death or divorce.

          (Asked only on a joint return, for a person who is not one of these relatives of yours.)
      cite:
        doc: p501
        locator: p. 19, Joint return, "If you file a joint return, the person can be related to either you or your spouse. Also, the person doesn’t need to be related to the spouse who provides support."; p. 19, Relatives who don't have to live with you, "Your child, stepchild, or foster child, or a descendant of any of them" through "mother-in-law, brother-in-law, or sister-in-law." and "Any of these relationships that were established by marriage aren’t ended by death or divorce."
    - id: dependent.qr_all_year
      printed: (helper)
      type: Bool
      label: Lived with you all of 2025 as a member of your household (qualifying relative test)
      expr:
        op: input
        source: |-
          Did this person live with you all of 2025 as a member of your household?

          Count as time lived with you:
          - a temporary absence by you or the person for special circumstances, such as illness, education, business, vacation, military service or detention in a juvenile facility
          - a stay in a nursing home for an indefinite period to receive constant medical care

          Answer Yes also for:
          - a person who died in 2025 and lived with you as a member of your household until death
          - a child born in 2025 who lived with you as a member of your household for the rest of the year, apart from any required hospital stay following birth
          - a person you adopted, who was lawfully placed with you for legal adoption, or who was placed with you as an eligible foster child in 2025, if your main home was the person's main home for the entire time since the adoption or placement
      cite:
        doc: p501
        locator: p. 19, Temporary absences, "A person is considered to live with you as a member of your household during periods of time when one of you, or both, is temporarily absent due to special circumstances" and "If the person is placed in a nursing home for an indefinite period of time to receive constant medical care, the absence may be considered temporary."; p. 19, Death or birth, "A person who died during the year, but lived with you as a member of your household until death, will meet this test." through "your main home was the person’s main home for the entire time since the person was adopted or placed with you in 2025."; i1040gi p. 19, Step 4, "Any other person (other than your spouse) who lived with you all year as a member of your household"
    - id: dependent.lawful
      printed: (helper)
      type: Bool
      label: Your relationship with this person did not violate local law
      expr:
        op: input
        source: Did your relationship with this person not violate local law? (Asked for a person who is a Step 4 relative only
          as a member of your household all year, such as a sibling's grandchild or a step sibling's child, or who is no
          relative.)
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Any other person (other than your spouse) who lived with you all year as a member of your household if your relationship didn’t violate local law."
    - id: dependent.qr_income
      printed: (helper)
      type: Bool
      label: Gross income under $5,200
      expr:
        op: test
        lt:
          - dependent.gross_income
          - param: qr.gross_income_limit
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Who had gross income of less than $5,200 in 2025"
    - id: dependent.income_exception
      printed: (gate)
      type: Bool
      label: Permanently and totally disabled with gross income at or over the limit
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.disabled
              - const: true
          - op: test
            eq:
              - dependent.qr_income
              - const: false
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "If the person was permanently and totally disabled, see Exception to gross income test"
    - id: dependent.qr_kidnapped
      printed: (gate)
      type: Bool
      label: A child aged 18 or under at the end of 2025 presumed kidnapped by someone who isn't a family member
      expr:
        op: test
        all:
          - op: test
            lt:
              - dependent.age
              - const: 19
                type: Count
          - op: test
            eq:
              - dependent.kidnapped
              - const: true
      cite:
        doc: p501
        locator: 'p. 18, Kidnapped child, "This treatment applies for all years until the earlier of: 1. The year there is a determination that the child is dead, or 2. The year the child would have reached age 18."'
    - id: dependent.qualifying_relative
      printed: (helper)
      type: Bool
      label: Qualifying relative (Step 4)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qr_relationship
              - const: true
          - op: test
            eq:
              - dependent.qualifying_child
              - const: false
          - op: test
            eq:
              - dependent.qr_income
              - const: true
          - op: test
            eq:
              - dependent.supported
              - const: true
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, "Does any person meet the conditions to be your qualifying relative?"
      refuses:
        - when: dependent.multiple_support
          form: Multiple support agreements
          remedy: A person claimed under a multiple support agreement is outside this tool.
          cite:
            doc: i1040gi
            locator: p. 20, Multiple support agreements
        - when: dependent.income_exception
          form: Exception to gross income test
          remedy: The sheltered-workshop exception to the gross income test for a disabled person is outside this tool.
          cite:
            doc: i1040gi
            locator: pp. 19–20, Exception to gross income test
        - when: dependent.married
          form: Married person rules
          remedy: A married dependent is outside this tool; see Married person in the instructions.
          cite:
            doc: i1040gi
            locator: p. 21, Married person
        - when: dependent.qr_kidnapped
          form: Kidnapped child (Pub. 501)
          remedy: A child presumed kidnapped by someone who isn't a family member may be your qualifying relative under
            part-year rules this tool does not apply.
          cite:
            doc: p501
            locator: p. 18, Kidnapped child, "You can treat a child as your qualifying relative even if the child has been kidnapped, but the following statements must be true."
    - id: dependent.qr_dependent_resident
      printed: (helper)
      label: Qualifying relative who is a U.S. citizen, national or resident alien or a resident of Canada or Mexico, and you
        are not a dependent
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.resident
            - const: true
          then: dependent.filer_not_dependent
        - guard:
            op: test
            eq:
            - dependent.resident
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, questions 2 and 5
    - id: dependent.qr_dependent
      printed: (helper)
      type: Bool
      label: Qualifying relative who is your dependent (Step 4, questions 2 and 5)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.qualifying_relative
            - const: true
          then: dependent.qr_dependent_resident
        - guard:
            op: test
            eq:
            - dependent.qualifying_relative
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 19, Step 4, questions 2 and 5
    - id: dependent.claimed_no_tin
      printed: (gate)
      type: Bool
      label: A person who meets the tests to be your dependent but has no SSN, ITIN or ATIN
      expr:
        op: test
        all:
        - op: test
          eq:
          - dependent.tin
          - const: false
        - op: test
          any:
          - op: test
            eq:
            - dependent.qc_dependent
            - const: true
          - op: test
            eq:
            - dependent.qr_dependent
            - const: true
      cite:
        doc: i1040gi
        locator: 'p. 22, Social security number, "You must enter each dependent’s social security number (SSN)"'
    - id: dependent.claimed
      printed: (helper)
      type: Bool
      label: Your dependent
      expr:
        op: test
        any:
        - op: test
          eq:
          - dependent.qc_dependent
          - const: true
        - op: test
          eq:
          - dependent.qr_dependent
          - const: true
      cite:
        doc: i1040gi
        locator: pp. 17–19, Who Qualifies as Your Dependent
      refuses: &claimed_no_tin
        - when: dependent.claimed_no_tin
          form: Dependent without an SSN, ITIN or ATIN (Form 1040, Dependents, row (3))
          remedy: Each dependent must be listed with an SSN (or ITIN or ATIN) issued on or before the due date of your return.
            A dependent child who was born and died in 2025 without an SSN, entered as "Died" on row (3) with a copy of the
            birth certificate, death certificate or hospital records, is outside this tool.
          cite:
            doc: i1040gi
            locator: 'p. 22, Social security number, "You must enter each dependent’s social security number (SSN)" and "If your dependent child was born and died in 2025 and you do not have an SSN for the child, enter “Died” on row (3) of the Dependents section and include a copy of the child’s birth certificate, death certificate, or hospital records"; p. 14, Head of Household, "The dependents you claim are those you list by name and SSN ... in the Dependents section on Form 1040 or 1040-SR"'
    - id: dependent.under_ctc_age
      printed: (helper)
      type: Bool
      label: Under age 17 at the end of 2025
      expr:
        op: test
        lt:
          - dependent.age
          - param: ctc.age_limit
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 3
    - id: dependent.ctc_from_tin
      printed: (helper)
      label: Child tax credit tests (Step 3) from the SSN, ITIN or ATIN test on
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.tin
            - const: true
          then: dependent.ctc_from_citizen
        - guard:
            op: test
            eq:
            - dependent.tin
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, questions 1–4
    - id: dependent.ctc_from_citizen
      printed: (helper)
      label: Child tax credit tests (Step 3) from the citizenship test on
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.citizen
            - const: true
          then: dependent.ctc_from_age
        - guard:
            op: test
            eq:
            - dependent.citizen
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, questions 1–4
    - id: dependent.ctc_from_age
      printed: (helper)
      label: Child tax credit tests (Step 3) from the age test on
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.under_ctc_age
            - const: true
          then: dependent.ctc_from_work_ssn
        - guard:
            op: test
            eq:
            - dependent.under_ctc_age
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, questions 1–4
    - id: dependent.ctc_from_work_ssn
      printed: (helper)
      label: Child tax credit tests (Step 3) from the work SSN test on
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.work_ssn
            - const: true
          then: household.ctc_ssn
        - guard:
            op: test
            eq:
            - dependent.work_ssn
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, questions 1–4
    - id: dependent.ctc_child
      printed: (helper)
      type: Bool
      label: Qualifying child for the child tax credit (Step 3)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.qc_dependent
            - const: true
          then: dependent.ctc_from_tin
        - guard:
            op: test
            eq:
            - dependent.qc_dependent
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, questions 1–4
    - id: dependent.odc_person
      printed: (helper)
      type: Bool
      label: Dependent for the credit for other dependents (Steps 3 and 5)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.claimed
              - const: true
          - op: test
            eq:
              - dependent.tin
              - const: true
          - op: test
            eq:
              - dependent.citizen
              - const: true
          - op: test
            eq:
              - dependent.ctc_child
              - const: false
          - op: test
            eq:
              - household.all_tin
              - const: true
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 3, and p. 19, Step 5
    - id: dependent.ctc_per_child
      printed: (helper)
      type: NonNegDollars
      label: Year parameter ctc.per_child
      expr:
        op: param
        ref: ctc.per_child
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 5
    - id: dependent.ctc_amount
      printed: (helper)
      type: NonNegDollars
      label: Child tax credit amount for this person before limits ($2,200 for a qualifying child, else 0)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - dependent.ctc_child
                - const: true
            then: dependent.ctc_per_child
          - guard:
              op: test
              eq:
                - dependent.ctc_child
                - const: false
            then: dependent.zero
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 5, "Multiply line 4 by $2,200"
    - id: dependent.odc_per_dependent
      printed: (helper)
      type: NonNegDollars
      label: Year parameter odc.per_dependent
      expr:
        op: param
        ref: odc.per_dependent
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 7
    - id: dependent.odc_amount
      printed: (helper)
      type: NonNegDollars
      label: Credit for other dependents amount for this person before limits ($500 for an other dependent, else 0)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - dependent.odc_person
                - const: true
            then: dependent.odc_per_dependent
          - guard:
              op: test
              eq:
                - dependent.odc_person
                - const: false
            then: dependent.zero
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 7, "Multiply line 6 by $500"
    - id: dependent.actc_per_child
      printed: (helper)
      type: NonNegDollars
      label: Year parameter actc.per_child
      expr:
        op: param
        ref: actc.per_child
      cite:
        doc: f1040s8812
        locator: Schedule 8812 (2025), line 16b
    - id: dependent.actc_amount
      printed: (helper)
      type: NonNegDollars
      label: Additional child tax credit ceiling for this person ($1,700 for a qualifying child, else 0)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - dependent.ctc_child
                - const: true
            then: dependent.actc_per_child
          - guard:
              op: test
              eq:
                - dependent.ctc_child
                - const: false
            then: dependent.zero
      cite:
        doc: f1040s8812
        locator: p. 2, Part II-A Additional Child Tax Credit for All Filers, line 16b, "b Number of qualifying
          children under age 17 with the required social security number", "x $1,700. Enter the result"
    - id: dependent.absence_no_return
      printed: (helper)
      type: Bool
      label: Counted an absence the person was not expected to return from, or during which you did not keep up the home
      expr:
        op: input
        source: In counting the time this person lived with you in 2025, did you count as time lived with you an absence by
          you or the person from which it was not reasonable to assume the absent person would return to the home, or
          during which you did not continue to keep up the home? (Asked when this person may qualify you for head of
          household.)
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."
    - id: dependent.hoh_test2_lived
      printed: (helper)
      type: Bool
      label: A Test 2 person who lived with you more than half the year, or of the part of the year a relative was alive, counting every absence you counted (the home-cost condition of Test 2 is tested on the household form)
      expr:
        op: test
        any:
          - op: test
            all:
              - op: test
                eq:
                  - dependent.claimed
                  - const: true
              - op: test
                ne:
                  - dependent.relationship
                  - const: household_member
              - op: test
                ne:
                  - dependent.relationship
                  - const: sibling_descendant
              - op: test
                ne:
                  - dependent.relationship
                  - const: other
              - op: test
                eq:
                  - dependent.hoh_lived_half
                  - const: true
          - op: test
            all:
              - op: test
                eq:
                  - dependent.qualifying_child
                  - const: true
              - op: test
                eq:
                  - dependent.married
                  - const: false
              - op: test
                eq:
                  - dependent.lived_half
                  - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2 (a dependent, other than one who is your dependent only because they lived with you all year, which is any person claimed through the last Step 4 bullet, or your unmarried qualifying child, who lived with you more than half the year)
    - id: dependent.hoh_absence
      printed: (helper)
      type: Bool
      label: A Test 2 person only by counting an absence head of household does not count
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.hoh_test2_lived
            - const: true
          then: dependent.absence_no_return
        - guard:
            op: test
            eq:
            - dependent.hoh_test2_lived
            - const: false
          then: dependent.no
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the absent person will return to the home after the temporary absence."
    - id: dependent.hoh_test2
      printed: (helper)
      type: Bool
      label: A Test 2 person who lived with you more than half the year, or of the part of the year a relative was alive, counting only absences head of household counts (the home-cost condition of Test 2 is tested on the household form)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.hoh_test2_lived
              - const: true
          - op: test
            eq:
              - dependent.absence_no_return
              - const: false
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2 (a dependent, other than one who is your dependent only because they lived with you all year, which is any person claimed through the last Step 4 bullet, or your unmarried qualifying child, who lived with you more than half the year); p501 p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."
    - id: dependent.hoh_test1
      printed: (helper)
      type: Bool
      label: Qualifies you for head of household under Test 1 through a parent who does not live with you (a parent who lives with you qualifies you through Test 2)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.relationship
              - const: parent
          - op: test
            eq:
              - dependent.claimed
              - const: true
          - op: test
            eq:
              - dependent.parent_home_paid
              - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 1, "You paid over half the cost of keeping up a home that was the main home for all of 2025 of your parent whom you can claim as a dependent"
      refuses: *claimed_no_tin
    - id: dependent.tiebreak_other
      printed: (helper)
      label: 'With another person who can claim this person: that person is a taxpayer, or this person is also your qualifying
        child'
      type: Bool
      expr:
        op: test
        any:
        - op: test
          eq:
          - dependent.other_nontaxpayer
          - const: false
        - op: test
          eq:
          - dependent.qc_tests
          - const: true
      cite:
        doc: p501
        locator: p. 15, Qualifying Child of More Than One Person, "Sometimes, a child meets the relationship, age, residency,
          support, and joint return tests to be a qualifying child of more than one person."; i1040gi p. 19, Step 4, "For this
          purpose, a person isn’t a taxpayer if the person isn’t required to file a U.S. income tax return and either doesn’t
          file such a return or files only to get a refund of withheld income tax or estimated tax paid."
    - id: dependent.qc_tiebreak
      printed: (gate)
      type: Bool
      label: The qualifying child of another person who is also your qualifying child, or whose other person is a taxpayer
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.other_claimant
            - const: true
          then: dependent.tiebreak_other
        - guard:
            op: test
            eq:
            - dependent.other_claimant
            - const: false
          then: dependent.no
      cite:
        doc: p501
        locator: p. 15, Qualifying Child of More Than One Person, "Sometimes, a child meets the relationship, age, residency, support, and joint return tests to be a qualifying child of more than one person."; i1040gi p. 19, Step 4, "For this purpose, a person isn’t a taxpayer if the person isn’t required to file a U.S. income tax return and either doesn’t file such a return or files only to get a refund of withheld income tax or estimated tax paid."
    - id: dependent.eic_child_tests
      printed: (helper)
      label: 'EIC qualifying child tests: relationship, age, joint return and residency in the United States, each asked only
        when the ones before it pass'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.qc_relationship
            - const: true
          then: dependent.eic_child_from_age
        - guard:
            op: test
            eq:
            - dependent.qc_relationship
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, "A qualifying child for the EIC is your..." (relationship AND age AND not filing a joint return
          AND lived with you in the United States for more than half of 2025)
    - id: dependent.eic_child_from_age
      printed: (helper)
      label: 'EIC qualifying child tests from the age test on: age, joint return and residency in the United States'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.qc_age
            - const: true
          then: dependent.eic_child_from_joint
        - guard:
            op: test
            eq:
            - dependent.qc_age
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, "A qualifying child for the EIC is your..." (relationship AND age AND not filing a joint return
          AND lived with you in the United States for more than half of 2025)
    - id: dependent.eic_child_from_joint
      printed: (helper)
      label: 'EIC qualifying child tests from the joint return test on: joint return and residency in the United States'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.joint_return
            - const: true
          then: dependent.no
        - guard:
            op: test
            eq:
            - dependent.joint_return
            - const: false
          then: dependent.us_half
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, "A qualifying child for the EIC is your..." (relationship AND age AND not filing a joint return
          AND lived with you in the United States for more than half of 2025)
    - id: dependent.eic_child
      printed: (helper)
      type: Bool
      label: Qualifying child for the EIC (relationship, age, not filing a joint return, lived with you in the United States for more than half of 2025)
      expr:
        op: test
        eq:
        - dependent.eic_child_tests
        - const: true
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, "A qualifying child for the EIC is your..." (relationship AND age AND not filing a joint
          return AND lived with you in the United States for more than half of 2025)
      refuses:
        - when: dependent.kidnap_eic
          form: Kidnapped child (Pub. 501; Pub. 596 for the EIC)
          remedy: A child presumed kidnapped by someone who isn't a family member, who did not live with you in the United States for more than half of 2025 without counting the time missing, may count as living with you under rules this tool does not apply.
          cite:
            doc: i1040gi
            locator: p. 21, Kidnapped child, "For details, see Pub. 501 (Pub. 596 for the EIC)"
        - when: dependent.eic_tiebreak
          form: Qualifying child of more than one person (EIC)
          remedy: The tie-breaker rules for a child who is the qualifying child of more than one person are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 44, Qualifying child of more than one person
        - when: dependent.married
          form: Married child (EIC)
          remedy: A married child is a qualifying child for the EIC only under the dependency rules, which are outside this tool for a married person.
          cite:
            doc: i1040gi
            locator: p. 44, Married child
    - id: dependent.eic_tiebreak
      printed: (gate)
      type: Bool
      label: The qualifying child of another person who is also your qualifying child for the EIC
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.other_claimant
            - const: true
          then: dependent.eic_child_tests
        - guard:
            op: test
            eq:
            - dependent.other_claimant
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 44, Qualifying child of more than one person, "Even if a child meets the conditions to be the qualifying child of more than one person, only one person can claim the child as a qualifying child for all of the following tax benefits"
    - id: dependent.kidnap_eic_related
      printed: (helper)
      label: 'A child presumed kidnapped: meets the EIC relationship test but did not live with you in the United States for more
        than half of 2025'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.qc_relationship
            - const: true
          then: dependent.not_us_half
        - guard:
            op: test
            eq:
            - dependent.qc_relationship
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 21, Kidnapped child, "the credit for other dependents, and the earned income credit (EIC). For details, see
          Pub. 501 (Pub. 596 for the EIC)." (a child who lived with you in the United States for more than half of 2025 meets
          the residency test without this treatment)
    - id: dependent.not_us_half
      printed: (helper)
      label: Did not live with you in the United States for more than half of 2025
      type: Bool
      expr:
        op: test
        eq:
        - dependent.us_half
        - const: false
      cite:
        doc: i1040gi
        locator: p. 21, Kidnapped child, "the credit for other dependents, and the earned income credit (EIC). For details, see
          Pub. 501 (Pub. 596 for the EIC)." (a child who lived with you in the United States for more than half of 2025 meets
          the residency test without this treatment)
    - id: dependent.kidnap_eic
      printed: (gate)
      type: Bool
      label: A child presumed kidnapped who meets the EIC relationship test but did not live with you in the United States for more than half of 2025, not counting the time missing
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.kidnapped
            - const: true
          then: dependent.kidnap_eic_related
        - guard:
            op: test
            eq:
            - dependent.kidnapped
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 21, Kidnapped child, "the credit for other dependents, and the earned income credit (EIC). For details, see Pub. 501 (Pub. 596 for the EIC)." (a child who lived with you in the United States for more than half of 2025 meets the residency test without this treatment)
    - id: dependent.eic_ssn_child
      printed: (helper)
      type: Bool
      label: Qualifying child for the EIC who has a valid SSN
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.eic_child
            - const: true
          then: dependent.eic_ssn
        - guard:
            op: test
            eq:
            - dependent.eic_child
            - const: false
          then: dependent.no
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 2, "the number of qualifying children you have who have valid SSNs"; pp. 44–45,
          Social security number (SSN), "For the EIC, a valid SSN is a number issued by the Social Security Administration
          unless 'Not Valid for Employment' is printed on the social security card"
    - id: dependent.dc_child_all_year
      printed: (helper)
      type: Bool
      label: Your qualifying child who is your dependent and was under age 13 for all of 2025 (age 12 or younger at the end of 2025)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qc_dependent
              - const: true
          - op: test
            lt:
              - dependent.age
              - param: dc.child_age
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "A qualifying child under age 13 whom you can claim as a dependent. If the child turned 13 during the year, the child is a qualifying person for the part of the year they were under age 13"'
    - id: dependent.dc_age13
      printed: (helper)
      type: Bool
      label: Your qualifying child who is your dependent and was 13 at the end of 2025 (who may have been under 13 for part of the year)
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.qc_dependent
              - const: true
          - op: test
            eq:
              - dependent.age
              - param: dc.child_age
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "A qualifying child under age 13 whom you can claim as a dependent. If the child turned 13 during the year, the child is a qualifying person for the part of the year they were under age 13"'
    - id: dependent.dc_under13
      printed: (helper)
      type: Bool
      label: Under age 13 for part of 2025 when the care was provided?
      expr:
        op: input
        source: Was this child under age 13 for part of 2025, when you paid for their care? (A child who turned 13 in 2025
          is a qualifying person only for the part of the year before their 13th birthday.)
      cite:
        doc: p503
        locator: 'p. 3, Person qualifying for part of year, "You determine a person''s qualifying status each day. For example, if your child for whom you pay child and dependent care expenses turns 13 years old and no longer qualifies on September 16, count only those expenses through September 15"'
    - id: dependent.dc_child
      printed: (helper)
      type: Bool
      label: Your qualifying child who is your dependent, turned 13 during 2025 and was under 13 for part of 2025 when the care was provided
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.dc_age13
              - const: true
          - op: test
            eq:
              - dependent.dc_under13
              - const: true
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "A qualifying child under age 13 whom you can claim as a dependent. If the child turned 13 during the year, the child is a qualifying person for the part of the year they were under age 13"'
    - id: dependent.dc_incapable
      printed: (helper)
      type: Bool
      label: Physically or mentally not able to care for themselves?
      expr:
        op: input
        source: In 2025, was this person physically or mentally not able to care for themselves (unable to dress, clean or feed
          themselves because of a physical or mental disability, or needing constant attention to prevent them from injuring
          themselves or others)? This is a different test from permanent and total disability.
      cite:
        doc: i2441
        locator: 'p. 1, Physically or mentally not able to care for oneself, "Persons who can''t dress, clean, or feed themselves because of physical or mental disabilities are considered not able to care for themselves. Also, persons who must have constant attention to prevent them from injuring themselves or others are considered not able to care for themselves"'
    - id: dependent.dc_disabled_qp
      printed: (helper)
      type: Bool
      label: Your dependent who lived with you for more than half of 2025 and was not able to care for themselves
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.dc_incapable
              - const: true
          - op: test
            eq:
              - dependent.dc_lived_half
              - const: true
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "Any disabled person who wasn''t physically or mentally able to care for themselves who lived with you for more than half the year and whom you can claim as a dependent"; p503 p. 3, Birth or death of otherwise qualifying person'
    - id: dependent.dc_qp
      printed: (helper)
      type: Bool
      label: A qualifying person for Form 2441 (you have care expenses, and this person is your dependent and either your qualifying child under 13 or not able to care for themselves and living with you for more than half the year)
      expr:
        op: test
        all:
          - op: test
            eq:
              - f2441.care
              - const: true
          - op: test
            eq:
              - dependent.claimed
              - const: true
          - op: test
            any:
              - op: test
                eq:
                  - dependent.dc_child_all_year
                  - const: true
              - op: test
                eq:
                  - dependent.dc_disabled_qp
                  - const: true
              - op: test
                eq:
                  - dependent.dc_child
                  - const: true
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "A qualifying child under age 13 whom you can claim as a dependent. If the child turned 13 during the year, the child is a qualifying person for the part of the year they were under age 13"; p. 1, Qualifying Person(s), "Any disabled person who wasn''t physically or mentally able to care for themselves who lived with you for more than half the year and whom you can claim as a dependent"; p. 3, Line 2, "Don''t list a person on line 2 unless they are listed as an eligible person under Qualifying Person(s), earlier"'
    - id: dependent.dc_count
      printed: (helper)
      type: Count
      label: One, for every entry (counted as a qualifying person only where dependent.dc_qp holds)
      expr:
        op: param
        ref: dependent.one
      cite:
        doc: i2441
        locator: 'p. 3, Line 2, "Complete columns (a) through (d) for each qualifying person"; p. 3, Column (b), "You must enter the qualifying person''s SSN" (a qualifying person is a dependent, and a dependent without an SSN, ITIN or ATIN is refused where the person is counted as a dependent)'
    - id: dependent.dc_paid
      printed: (helper)
      type: NonNegDollars
      label: Qualified expenses incurred and paid in 2025 for this person's care
      expr:
        op: input
        source: |-
          Qualified expenses you incurred and paid in 2025 for this person's care while they were a qualifying person (under age 13, or not able to care for themselves), so that you (and your spouse, if filing jointly) could work or look for work (unpaid volunteer work, or work for a nominal salary, is not work)

          Include:
          - care you prepaid in 2024 for 2025
          - your share of employment taxes on a care provider's wages
          - expenses paid with dependent care benefits (reimbursed from a dependent care account or paid by your employer to a provider you chose); Form 2441 subtracts the benefits you exclude

          Include also:
          - household services needed to run your home if they were partly for this person's care (for example a cook, maid, babysitter, housekeeper or cleaning person, but not a chauffeur, bartender or gardener)
          - meals your housekeeper eats in your home because of the job and the extra cost of lodging the housekeeper in your home
          - a care provider's transportation of this person to or from the place of care (but not other transportation, or the cost of bringing the provider to your home)
          - agency fees, deposits, application fees and other indirect costs you had to pay to get care (but not a forfeited deposit for care that was not provided)

          Do not include the value of care your employer furnished itself (at your workplace or through a care provider your employer hired).

          Do not include:
          - 2024 care paid in 2025
          - 2025 care paid in 2026
          - payments for care in 2026
          - amounts reimbursed by a state social services agency
          - payments to a provider who may not be listed (your spouse, your dependent, your child under 19, or the parent of your child under 13)
          - expenses you claim as medical expenses
          - the cost of food, lodging, education, clothing or entertainment other than the housekeeper's meals and lodging above (food or schooling incidental to a child's care that can't be separated from the total cost may be included, but never schooling for a child in kindergarten or above)
          - expenses for an overnight camp, a summer school or a tutoring program
          - care outside your home for a qualifying person other than your dependent under 13 who does not regularly spend at least 8 hours a day in your home
          - care at a dependent care center that does not meet all applicable state and local regulations
          - child support payments

          If you (or your spouse) worked or looked for work during only part of the period the expenses cover, count the expenses only for the days of work or looking for work (a day you work at least 1 hour is a day of work).

          But include:
          - care you had to pay for anyway during a short, temporary absence from work, such as a vacation or minor illness (2 weeks or less, or longer depending on the circumstances)
          - for part-time work, care you must pay for weekly, monthly or in another way that covers both days worked and days not worked

          If part of an expense is work related and part is for other purposes, count only the work-related part, unless only a small part is for other purposes.

          Zero if none
      cite:
        doc: i2441
        locator: 'pp. 3–4, Column (d), "Enter the qualified expenses you incurred and paid in 2025 for the person listed in column (a)" and "Expenses you incurred in 2025 but didn''t pay until 2026"; p503 p. 10, Expenses prepaid in an earlier year, "If you pay for services before they are provided, you can count the prepaid expenses only in the year the care is received"; p. 2, Care of the qualifying person, "It doesn''t include the cost of food, lodging, education, clothing, or entertainment. You can include the cost of care provided outside your home for your dependent under age 13, or any other qualifying person who regularly spends at least 8 hours a day in your home. If the care was provided by a dependent care center, the center must meet all applicable state and local regulations." and "But don''t include the cost of schooling for a child in kindergarten or above." and "But don''t include any expenses for sending your child to an overnight camp, a summer school, or a tutoring program."; p. 2, "Child support payments aren''t qualified expenses." and "Generally, if you worked or actively looked for work during only part of the period in which you incurred the expenses, you must figure your expenses for each day."; p503 p. 6, Temporary absence from work, "An absence of 2 weeks or less is a short, temporary absence."; p503 p. 6, Part-time work, "However, if you are required to pay for care weekly, monthly, or in another way that includes both days worked and days not worked, you can figure your credit including the expenses you paid for days you didn''t work. Any day when you work at least 1 hour is a day of work."; p503 p. 8, Expenses partly work related, "If part of an expense is work related (for either household services or the care of a qualifying person) and part is for other purposes, you have to divide the expense." and "However, you don''t have to divide the expense if only a small part is for other purposes."; p. 1, Qualified Expenses, "These include amounts paid for household services and care of the qualifying person while you worked or looked for work."; p. 2, Household services, "They include, for example, the services of a cook, maid, babysitter, housekeeper, or cleaning person if the services were partly for the care of the qualifying person. However, they don''t include the services of a chauffeur, bartender, or gardener."; p503 p. 6, Volunteer work, "For this purpose, you aren''t considered to be working if you do unpaid volunteer work or work for a nominal salary."; p503 p. 7, Transportation, "If a care provider takes a qualifying person to or from a place where care is provided, that transportation is for the care of the qualifying person." and "However, transportation not provided by a care provider isn''t for the care of a qualifying person. Also, if you pay the transportation cost for the care provider to come to your home, that expense isn''t for care of a qualifying person."; p503 p. 7, Fees and deposits, "Fees you paid to an agency to get the services of a care provider, deposits you paid to an agency or preschool, application fees, and other indirect expenses are work-related expenses if you have to pay them to get care" and "However, a forfeited deposit isn''t for the care of a qualifying person if care isn''t provided."; p503 p. 8, Meals and lodging provided for housekeeper, "If you have expenses for meals that your housekeeper eats in your home because of their employment, count these as work-related expenses. If you have extra expenses for providing lodging in your home to the housekeeper, count these as work-related expenses also."; p. 3, Columns (a) and (b), "If you were covered by your employer''s dependent care plan and your employer furnished the care (either at your workplace or by hiring a care provider), enter your employer''s name in column (a)"'
      ambiguity: amb.2025.dc_line30
    - id: dependent.dc_line2d
      printed: 2(d)
      shown_when: dependent.dc_qp
      type: NonNegDollars
      label: Qualified expenses you incurred and paid in 2025 for the person listed in column (a)
      expr:
        op: copy
        from: dependent.dc_paid
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 2, column (d)
      ambiguity: amb.2025.dc_line30
    - id: dependent.dc_over12_care
      printed: (helper)
      type: Bool
      label: Care provided while this qualifying person was age 13 or older and disabled
      expr:
        op: input
        source: Of the care expenses included for this person on Form 2441, line 2, was any care provided
          when the person was age 13 or older and physically or mentally unable to care for themselves?
          Answer only for the care included on this form, not their age at the end of the year.
      cite:
        doc: i2441
        locator: 'p. 3, Column (c), "Check the box in column (c) if the qualifying person listed in column (a) was over age 12 at the time the care was provided and was disabled"'
    - id: dependent.dc_line2c
      printed: 2(c)
      shown_when: dependent.dc_qp
      type: Bool
      label: Check here if the qualifying person was over age 12 and was disabled
      display: The line 2 column (c) check box, shown on the values sheet; it changes no amount.
      expr:
        op: test
        all:
          - op: test
            eq:
              - dependent.dc_qp
              - const: true
          - op: test
            eq:
              - dependent.dc_incapable
              - const: true
          - op: test
            any:
              - op: test
                gt:
                  - dependent.age
                  - param: dc.child_age
              - op: test
                all:
                  - op: test
                    eq:
                      - dependent.age
                      - param: dc.child_age
                  - op: test
                    eq:
                      - dependent.dc_over12_care
                      - const: true
      cite:
        doc: i2441
        locator: 'p. 3, Column (c), "Check the box in column (c) if the qualifying person listed in column (a) was over age 12 at the time the care was provided and was disabled"'
    - id: dependent.ptc_files
      printed: (gate)
      label: Is this dependent required to file a 2025 return because of their income (Chart B in the Form 1040 instructions)?
      type: Bool
      expr:
        op: input
        source: 'Is this dependent required to file a 2025 income tax return because of their income, by Chart B in the Form
          1040 instructions (unearned income over $1,350, earned income over $15,750, or gross income over the larger of $1,350
          and earned income up to $15,300 plus $450, for a single dependent under 65 and not blind)? Answer no if the dependent
          files only to claim a refund of withheld or estimated tax.'
      cite:
        doc: i8962
        locator: 'p. 8, Line 2b, "Only include your dependents who are required to file an income tax return because their
          income meets the income tax return filing threshold.", "Do not include the modified AGI of dependents who are filing
          a tax return only to claim a refund of tax withheld or estimated tax."; i1040gi p. 10, Chart B—For Children and Other
          Dependents, "Your unearned income was over $1,350."'
      ambiguity: amb.2025.ptc_dependent_filing
    - id: dependent.ptc_magi
      printed: (helper)
      label: This dependent's modified AGI (Worksheet 1-2)
      type: Dollars
      expr:
        op: input
        source: 'This dependent''s modified AGI for 2025: the AGI on their return (line 11a), plus their tax-exempt interest
          (line 2a), plus any Form 2555 amounts, plus the part of their social security benefits that is not taxable (line 6a
          less line 6b); negative if it was a loss'
      cite:
        doc: i8962
        locator: 'p. 8, Worksheet 1-2, "Only include your dependents who are required to file an income tax return because
          their income meets the income tax return filing threshold."'
    - id: dependent.ptc_magi_counted
      printed: (helper)
      label: This dependent's modified AGI counted in household income (zero unless required to file because of income)
      type: Dollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - dependent.ptc_files
                - const: true
            then: dependent.ptc_magi
          - guard:
              op: test
              eq:
                - dependent.ptc_files
                - const: false
            then: dependent.zero
      cite:
        doc: i8962
        locator: 'p. 8, Line 2b, "Only include your dependents who are required to file an income tax return because their
          income meets the income tax return filing threshold."'
      ambiguity: amb.2025.ptc_dependent_filing
    # --- Stage 19: education credits (generated) ---
    - id: dependent.edu
      printed: (gate)
      label: Qualified education expenses paid in 2025 for this dependent
      type: Bool
      expr:
        op: input
        source: Did anyone pay qualified education expenses in 2025 for this dependent at an eligible educational institution
          (a college, university, vocational school, or other postsecondary school eligible for federal student aid)?
      cite:
        doc: i8863
        locator: p. 2, Who Can Claim an Education Credit, "You may be able to claim an education credit if you, your spouse, or
          a dependent you claim on your tax return was a student enrolled at or attending an eligible educational institution."
    - id: dependent.edu_1098t
      printed: (gate)
      label: The student received a 2025 Form 1098-T from the institution, or an exception applies
      type: Bool
      expr:
        op: input
        source: Did the student receive a 2025 Form 1098-T from the educational institution? Answer yes also if the institution
          was not required to furnish one (for example a qualified nonresident alien, expenses paid entirely with scholarships
          or under a formal billing arrangement, or only courses for which no academic credit is awarded), or if the institution
          did not furnish it and, after February 2, 2026, but before you file, you or the student requested it, you fully
          cooperated with the institution's efforts to gather the information needed to furnish it, and you can show the
          enrollment and the payments.
      cite:
        doc: i8863
        locator: p. 1, Form 1098-T requirement, "To be eligible to claim the American opportunity credit or the lifetime learning
          credit, the law requires a taxpayer (or a dependent) to have received Form 1098-T, Tuition Statement, from an eligible
          educational institution, whether domestic or foreign."; p. 1, "You must fully cooperate with the educational
          institution’s efforts to gather the information needed to furnish the Form 1098-T."
      ambiguity: amb.2025.edu_1098t_date
    - id: dependent.edu_student
      printed: (helper)
      label: 'An eligible student of this return: expenses paid, a TIN by the due date and a Form 1098-T (or an exception), and
        claimed as your dependent'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f8863.paid
            - const: true
          then: dependent.edu_student_claimed
        - guard:
            op: test
            eq:
            - f8863.paid
            - const: false
          then: dependent.edu_no
      cite:
        doc: i8863
        locator: p. 2, Who can claim a dependent’s expenses, "If a student is claimed as a dependent on another person’s tax return,
          all qualified education expenses of the student are treated as having been paid by that person. Therefore, only that
          person can claim an education credit for the student."
    - id: dependent.edu_student_claimed
      printed: (helper)
      label: 'With education expenses paid: claimed as your dependent, a student with qualified expenses, a TIN by the due date and a Form 1098-T (or an exception)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.claimed
            - const: true
          then: dependent.edu_student_edu
        - guard:
            op: test
            eq:
            - dependent.claimed
            - const: false
          then: dependent.edu_no
      cite:
        doc: i8863
        locator: p. 2, Who can claim a dependent’s expenses, "If a student is claimed as a dependent on another person’s tax return,
          all qualified education expenses of the student are treated as having been paid by that person. Therefore, only that
          person can claim an education credit for the student."
    - id: dependent.edu_student_edu
      printed: (helper)
      label: 'Your dependent: a student with qualified expenses, a TIN by the due date and a Form 1098-T (or an exception)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - dependent.edu
            - const: true
          then: dependent.edu_student_tin
        - guard:
            op: test
            eq:
            - dependent.edu
            - const: false
          then: dependent.edu_no
      cite:
        doc: i8863
