form:
  id: sb
  kind: form
  title: Schedule B — supported interest and ordinary dividends
  tax_year: 2025
  note: Payer keys identify records. Foreign-account and trust answers are retained even where income
    is below the threshold. FBAR/Form 8938 determinations remain explicit taxpayer answers; required
    foreign forms cause named refusals.
  lines:
    - id: sb.unsupported
      printed: (helper)
      type: Bool
      label: 'Any nominee income, original issue discount reported in an amount other than on Form 1099-OID, accrued interest paid on a bond purchase, bond premium adjustment, accrued market discount, a contingent payment debt instrument, seller-financed mortgage interest, a savings bond interest exclusion, or other special treatment?'
      gated_by: sb.unsupported_if_income
      expr:
        op: input
        source: 'Any nominee income, original issue discount reported in an amount other than on Form 1099-OID, accrued interest paid on a bond purchase, bond premium adjustment, accrued market discount, a contingent payment debt instrument, seller-financed mortgage interest, a savings bond interest exclusion, or other special treatment?'
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.ordinary_dividends
      printed: (helper)
      type: NonNegDollars
      label: Total ordinary dividends, Form 1099-DIV box 1a
      gated_by: sb.ordinary_dividends_if_dividends
      expr:
        op: input
        source: Total ordinary dividends, Form 1099-DIV box 1a
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.foreign_any
      printed: (gate)
      type: Bool
      label: |-
        At any time in 2025, did you (or, on a joint return, your spouse) have a foreign account, any other foreign financial asset, a connection to a foreign trust, or a role in a foreign corporation? Count an account or asset you had for only part of the year, including one closed, emptied or sold during 2025, and count it whatever its value. Count what you hold directly or indirectly: through an agent or nominee, a single-member LLC or other disregarded entity, a trust you are treated as owning (such as a revocable living trust), or a corporation, partnership or other entity in which you own more than 50% of the value, the voting power, the profits or the capital, directly or through other companies, partnerships or trusts. Answer Yes if any of these applies to you (or, on a joint return, your spouse):

        - a financial interest in, or signature authority over, an account located outside the United States: a bank, savings, checking, deposit, brokerage, securities, mutual fund, pension or retirement, or commodity futures or options account, or an insurance or annuity policy with a cash value (an account at a branch of a US bank located abroad counts, and so does a cash-value policy issued by an insurer organized outside the United States, even if you bought it or pay for it from the United States)
        - signature authority means you could direct the institution to move the account's assets, alone or together with someone else, even with no money of your own in it, such as an account of your employer, a relative, a business or an organization
        - a financial interest also includes an account of a trust in which you have more than a 50% present beneficial interest
        - an account with a financial institution organized in a US territory (such as Puerto Rico or Guam), or any other account or balance with a business outside the United States that holds money or assets for customers, such as an online payment, mobile-money, cryptocurrency exchange, online betting or gaming, precious-metals custody, or prepaid or stored-value account
        - held outside an account at a US financial institution, counting a company, partnership or other entity organized in Puerto Rico, Guam or another US territory as foreign: stock, bonds or other securities issued by a non-US company or person; an interest in a foreign partnership, company, estate or other entity; a foreign pension or deferred compensation plan; a swap, option or other contract with a foreign counterparty; a loan you made to, or other debt owed to you by, someone who is not a US citizen or resident, or a foreign company or government, even if they live or operate in the United States (including a personal loan to a relative or friend abroad); or being an heir or beneficiary of an estate probated or administered outside the United States, or of someone who lived or died outside the United States, even if nothing has been paid to you yet
        - any of the above held by a child whose interest and dividends you report on your return (Form 8814)
        - a distribution from a foreign trust, including money or property that reached you through another person or company (a loan of cash or marketable securities counts, and so does free or below-market use of a home, car or other property the trust owns); being the grantor of, or a transferor to, a foreign trust that existed at any time during 2025, even one created or funded in an earlier year (a transferor is anyone who gave, sold, lent or otherwise transferred money or property to the trust, directly or through another person, in 2025 or any earlier year); or being a beneficiary of a foreign trust
        - a foreign foundation (such as a Stiftung or Anstalt), a waqf or another arrangement that holds property for beneficiaries counts as a trust; a trust counts as foreign if a court outside the 50 states and the District of Columbia (including one in Puerto Rico, Guam or another US territory) supervises it, or if any trustee or anyone who controls a substantial trust decision is not a US citizen or resident (such as a relative abroad), even if the trust was set up under US law or has a US address; if you are not sure whether an arrangement is a trust or whether a trust is foreign, answer Yes
        - being an officer, director, managing director or manager of a foreign corporation or other company, whatever it is called (such as a Ltd, plc, GmbH, AG, SA, SARL or BV), that is organized outside the 50 states and the District of Columbia, including in Puerto Rico, Guam or another US territory (such as an employer's subsidiary there); or owning 10% or more of the total value, or of the combined voting power, of a foreign corporation's stock, counting shares owned by your spouse, children, grandchildren or parents and by partnerships, corporations, trusts or estates you have an interest in, and shares any of you could acquire through options or warrants
      expr:
        op: input
        source: |-
          At any time in 2025, did you (or, on a joint return, your spouse) have a foreign account, any other foreign financial asset, a connection to a foreign trust, or a role in a foreign corporation? Count an account or asset you had for only part of the year, including one closed, emptied or sold during 2025, and count it whatever its value. Count what you hold directly or indirectly: through an agent or nominee, a single-member LLC or other disregarded entity, a trust you are treated as owning (such as a revocable living trust), or a corporation, partnership or other entity in which you own more than 50% of the value, the voting power, the profits or the capital, directly or through other companies, partnerships or trusts. Answer Yes if any of these applies to you (or, on a joint return, your spouse):

          - a financial interest in, or signature authority over, an account located outside the United States: a bank, savings, checking, deposit, brokerage, securities, mutual fund, pension or retirement, or commodity futures or options account, or an insurance or annuity policy with a cash value (an account at a branch of a US bank located abroad counts, and so does a cash-value policy issued by an insurer organized outside the United States, even if you bought it or pay for it from the United States)
          - signature authority means you could direct the institution to move the account's assets, alone or together with someone else, even with no money of your own in it, such as an account of your employer, a relative, a business or an organization
          - a financial interest also includes an account of a trust in which you have more than a 50% present beneficial interest
          - an account with a financial institution organized in a US territory (such as Puerto Rico or Guam), or any other account or balance with a business outside the United States that holds money or assets for customers, such as an online payment, mobile-money, cryptocurrency exchange, online betting or gaming, precious-metals custody, or prepaid or stored-value account
          - held outside an account at a US financial institution, counting a company, partnership or other entity organized in Puerto Rico, Guam or another US territory as foreign: stock, bonds or other securities issued by a non-US company or person; an interest in a foreign partnership, company, estate or other entity; a foreign pension or deferred compensation plan; a swap, option or other contract with a foreign counterparty; a loan you made to, or other debt owed to you by, someone who is not a US citizen or resident, or a foreign company or government, even if they live or operate in the United States (including a personal loan to a relative or friend abroad); or being an heir or beneficiary of an estate probated or administered outside the United States, or of someone who lived or died outside the United States, even if nothing has been paid to you yet
          - any of the above held by a child whose interest and dividends you report on your return (Form 8814)
          - a distribution from a foreign trust, including money or property that reached you through another person or company (a loan of cash or marketable securities counts, and so does free or below-market use of a home, car or other property the trust owns); being the grantor of, or a transferor to, a foreign trust that existed at any time during 2025, even one created or funded in an earlier year (a transferor is anyone who gave, sold, lent or otherwise transferred money or property to the trust, directly or through another person, in 2025 or any earlier year); or being a beneficiary of a foreign trust
          - a foreign foundation (such as a Stiftung or Anstalt), a waqf or another arrangement that holds property for beneficiaries counts as a trust; a trust counts as foreign if a court outside the 50 states and the District of Columbia (including one in Puerto Rico, Guam or another US territory) supervises it, or if any trustee or anyone who controls a substantial trust decision is not a US citizen or resident (such as a relative abroad), even if the trust was set up under US law or has a US address; if you are not sure whether an arrangement is a trust or whether a trust is foreign, answer Yes
          - being an officer, director, managing director or manager of a foreign corporation or other company, whatever it is called (such as a Ltd, plc, GmbH, AG, SA, SARL or BV), that is organized outside the 50 states and the District of Columbia, including in Puerto Rico, Guam or another US territory (such as an employer's subsidiary there); or owning 10% or more of the total value, or of the combined voting power, of a foreign corporation's stock, counting shares owned by your spouse, children, grandchildren or parents and by partnerships, corporations, trusts or estates you have an interest in, and shares any of you could acquire through options or warrants
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"; i1040sb pp. 2–3, Part III, lines 7a and 8; fincen114 pp. 4–5, Who Must File an FBAR, Financial Account, Foreign Financial Account, Financial Interest, Signature Authority; i8938 pp. 7–8, Specified Foreign Financial Assets, Interests in Foreign Estates and Foreign Trusts, Interests in Foreign Pension Plans and Foreign Deferred Compensation Plans'
    - id: sb.foreign_no
      printed: (helper)
      type: Bool
      label: No foreign account, asset, trust or corporation question without a foreign connection
      expr:
        op: param
        ref: sb.foreign_no
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"'
    - id: sb.line7a
      printed: 7a
      type: Bool
      label: Any financial interest in or signature authority over a foreign financial account during
        2025?
      expr:
        op: input
        source: Any financial interest in or signature authority over a foreign financial account during
          2025?
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.fbar_required
      printed: (helper)
      type: Bool
      gated_by: sb.fbar_required_if_foreign
      label: Are you (or, on a joint return, your spouse) required to file FinCEN Form 114 (FBAR)? Determine under its instructions; this tool
        does not determine foreign account values or exceptions.
      expr:
        op: input
        source: Are you (or, on a joint return, your spouse) required to file FinCEN Form 114 (FBAR)? Determine under its instructions; this tool
          does not determine foreign account values or exceptions.
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.form8938
      printed: (helper)
      type: Bool
      gated_by: sb.form8938_if_foreign
      label: Are you (or, on a joint return, your spouse) required to file Form 8938 for specified foreign financial assets?
      expr:
        op: input
        source: Are you (or, on a joint return, your spouse) required to file Form 8938 for specified foreign financial assets?
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.line8
      printed: "8"
      type: Bool
      gated_by: sb.line8_if_foreign
      label: During 2025, did you (or, on a joint return, your spouse) receive a distribution from a foreign trust, including money or property that reached you through another person or company (a loan of cash or marketable securities counts, and so does free or below-market use of a home, car or other property the trust owns), or were you (or, on a joint return, your spouse) the grantor of, or a transferor to, a foreign trust that existed at any time during 2025, even one created or funded in an earlier year (a transferor is anyone who gave, sold, lent or otherwise transferred money or property to the trust, directly or through another person, in 2025 or any earlier year)? A foreign foundation, a waqf or another arrangement that holds property for beneficiaries counts as a trust; a trust counts as foreign if a court outside the 50 states and the District of Columbia (including one in Puerto Rico, Guam or another US territory) supervises it, or if any trustee or anyone who controls a substantial trust decision is not a US citizen or resident, even if the trust was set up under US law or has a US address; if you are not sure whether an arrangement is a trust or whether a trust is foreign, answer Yes.
      expr:
        op: input
        source: During 2025, did you (or, on a joint return, your spouse) receive a distribution from a foreign trust, including money or property that reached you through another person or company (a loan of cash or marketable securities counts, and so does free or below-market use of a home, car or other property the trust owns), or were you (or, on a joint return, your spouse) the grantor of, or a transferor to, a foreign trust that existed at any time during 2025, even one created or funded in an earlier year (a transferor is anyone who gave, sold, lent or otherwise transferred money or property to the trust, directly or through another person, in 2025 or any earlier year)? A foreign foundation, a waqf or another arrangement that holds property for beneficiaries counts as a trust; a trust counts as foreign if a court outside the 50 states and the District of Columbia (including one in Puerto Rico, Guam or another US territory) supervises it, or if any trustee or anyone who controls a substantial trust decision is not a US citizen or resident, even if the trust was set up under US law or has a US address; if you are not sure whether an arrangement is a trust or whether a trust is foreign, answer Yes.
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts; p. 3, Line 8, "a loan of cash or marketable securities is generally considered to be a distribution"; "If you were the grantor of, or transferor to, a foreign trust that existed during 2025, you may have to file Form 3520."
    - id: sb.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.line2
      printed: "2"
      type: NonNegDollars
      label: Total taxable interest from all payers
      expr:
        op: sum_over
        collection: interest
        field: interest.amount
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
      refuses:
        - when: sb.unsupported_if_income
          form: Schedule B special treatment / Form 8815
          remedy: Prepare the applicable adjustment or exclusion; this tool supports unadjusted taxable
            interest and ordinary dividends.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form5471_if_foreign
          form: Form 5471
          remedy: You may have to file Form 5471 for a foreign corporation; this tool does not prepare it.
          cite:
            doc: i1040sb
            locator: 'p. 2, Part II. Ordinary Dividends, TIP, "You may have to file Form 5471 if, in 2025, you were an officer or director of a foreign corporation", "You may also have to file Form 5471 if, in 2025, you owned 10% or more of the total (a) value of a foreign corporation’s stock, or (b) combined voting power of all classes of a foreign corporation’s stock with voting rights"'
        - when: sb.fbar_required_if_foreign
          form: FinCEN Form 114 (FBAR)
          remedy: Foreign-account reporting and the required country list are outside this tool. Prepare the
            separate FBAR and Schedule B disclosures.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form8938_if_foreign
          form: Form 8938
          remedy: Prepare the required foreign financial asset disclosure; this tool does not prepare Form
            8938.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.line8_if_foreign
          form: Form 3520 / Form 3520-A
          remedy: Review and prepare the required foreign-trust information returns; this path is outside
            scope.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.line3
      printed: "3"
      type: NonNegDollars
      label: Amount from sb.zero
      expr:
        op: copy
        from: sb.zero
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
      refuses:
        - when: sb.unsupported_if_income
          form: Schedule B special treatment / Form 8815
          remedy: Prepare the applicable adjustment or exclusion; this tool supports unadjusted taxable
            interest and ordinary dividends.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form5471_if_foreign
          form: Form 5471
          remedy: You may have to file Form 5471 for a foreign corporation; this tool does not prepare it.
          cite:
            doc: i1040sb
            locator: 'p. 2, Part II. Ordinary Dividends, TIP, "You may have to file Form 5471 if, in 2025, you were an officer or director of a foreign corporation", "You may also have to file Form 5471 if, in 2025, you owned 10% or more of the total (a) value of a foreign corporation’s stock, or (b) combined voting power of all classes of a foreign corporation’s stock with voting rights"'
        - when: sb.fbar_required_if_foreign
          form: FinCEN Form 114 (FBAR)
          remedy: Foreign-account reporting and the required country list are outside this tool. Prepare the
            separate FBAR and Schedule B disclosures.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form8938_if_foreign
          form: Form 8938
          remedy: Prepare the required foreign financial asset disclosure; this tool does not prepare Form
            8938.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.line8_if_foreign
          form: Form 3520 / Form 3520-A
          remedy: Review and prepare the required foreign-trust information returns; this path is outside
            scope.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.line4
      printed: "4"
      type: Dollars
      label: Subtract sb.line3 from sb.line2
      expr:
        op: subtract
        from: sb.line2
        take: sb.line3
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.line6
      printed: "6"
      type: NonNegDollars
      label: Amount from sb.ordinary_dividends_if_dividends
      expr:
        op: copy
        from: sb.ordinary_dividends_if_dividends
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
      refuses:
        - when: sb.unsupported_if_income
          form: Schedule B special treatment / Form 8815
          remedy: Prepare the applicable adjustment or exclusion; this tool supports unadjusted taxable
            interest and ordinary dividends.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form5471_if_foreign
          form: Form 5471
          remedy: You may have to file Form 5471 for a foreign corporation; this tool does not prepare it.
          cite:
            doc: i1040sb
            locator: 'p. 2, Part II. Ordinary Dividends, TIP, "You may have to file Form 5471 if, in 2025, you were an officer or director of a foreign corporation", "You may also have to file Form 5471 if, in 2025, you owned 10% or more of the total (a) value of a foreign corporation’s stock, or (b) combined voting power of all classes of a foreign corporation’s stock with voting rights"'
        - when: sb.fbar_required_if_foreign
          form: FinCEN Form 114 (FBAR)
          remedy: Foreign-account reporting and the required country list are outside this tool. Prepare the
            separate FBAR and Schedule B disclosures.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form8938_if_foreign
          form: Form 8938
          remedy: Prepare the required foreign financial asset disclosure; this tool does not prepare Form
            8938.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.line8_if_foreign
          form: Form 3520 / Form 3520-A
          remedy: Review and prepare the required foreign-trust information returns; this path is outside
            scope.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.partIII
      printed: (helper)
      display: 'Notice on the values sheet: Schedule B Part III must be completed.'
      type: Bool
      label: Complete Part III for interest/dividends over $1,500 or foreign account/trust
      expr:
        op: test
        any:
          - op: test
            gt:
              - sb.line4
              - const: 150000
          - op: test
            gt:
              - sb.line6
              - const: 150000
          - op: test
            eq:
              - sb.line7a
              - const: true
          - op: test
            eq:
              - sb.line8_if_foreign
              - const: true
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.form5471
      printed: (helper)
      type: Bool
      gated_by: sb.form5471_if_foreign
      label: 'In 2025, were you (or, on a joint return, your spouse) an officer, director, managing director or manager of a foreign corporation or other company, whatever it is called, that is organized outside the 50 states and the District of Columbia, including in Puerto Rico, Guam or another US territory, or did you (or, on a joint return, your spouse) own 10% or more of the total value of a foreign corporation''s stock, or of the combined voting power of all classes of a foreign corporation''s stock with voting rights, counting shares owned by your spouse, children, grandchildren or parents and by partnerships, corporations, trusts or estates you have an interest in, and shares any of you could acquire through options or warrants?'
      expr:
        op: input
        source: 'In 2025, were you (or, on a joint return, your spouse) an officer, director, managing director or manager of a foreign corporation or other company, whatever it is called, that is organized outside the 50 states and the District of Columbia, including in Puerto Rico, Guam or another US territory, or did you (or, on a joint return, your spouse) own 10% or more of the total value of a foreign corporation''s stock, or of the combined voting power of all classes of a foreign corporation''s stock with voting rights, counting shares owned by your spouse, children, grandchildren or parents and by partnerships, corporations, trusts or estates you have an interest in, and shares any of you could acquire through options or warrants?'
      cite:
        doc: i1040sb
        locator: 'p. 2, Part II. Ordinary Dividends, TIP, "You may have to file Form 5471 if, in 2025, you were an officer or director of a foreign corporation", "You may also have to file Form 5471 if, in 2025, you owned 10% or more of the total (a) value of a foreign corporation’s stock, or (b) combined voting power of all classes of a foreign corporation’s stock with voting rights"'
    - id: sb.interest_total
      printed: (helper)
      type: NonNegDollars
      label: Taxable interest from all payers, before any Schedule B adjustment
      expr:
        op: sum_over
        collection: interest
        field: interest.amount
      cite:
        doc: i1040sb
        locator: 'p. 1, Line 1, "Report on line 1 all of your taxable interest"'
    - id: sb.has_income
      printed: (gate)
      type: Bool
      label: Taxable interest, ordinary dividends or capital gain distributions are above zero
      expr:
        op: test
        any:
          - op: test
            gt:
              - sb.interest_total
              - const: 0
          - op: test
            gt:
              - sb.ordinary_dividends_if_dividends
              - const: 0
          - op: test
            gt:
              - sd.distributions_if_dividends
              - const: 0
      cite:
        doc: i1040sb
        locator: 'p. 1, General Instructions, "Use Schedule B (Form 1040) if any of the following applies", "You received interest from a seller-financed mortgage", "You have accrued interest from a bond", "You are reporting original issue discount (OID) of less than the amount shown on Form 1099-OID", "You are reporting interest income of less than the amount shown on a Form 1099 due to amortizable bond premium", "You are claiming the exclusion of interest from series EE or I U.S. savings bonds issued after 1989", "You received interest or ordinary dividends as a nominee"'
    - id: sb.no
      printed: (helper)
      type: Bool
      label: No special treatment without interest, ordinary dividends or capital gain distributions
      expr:
        op: param
        ref: sb.no
      cite:
        doc: i1040sb
        locator: 'p. 1, General Instructions, "Use Schedule B (Form 1040) if any of the following applies", "You received interest from a seller-financed mortgage", "You have accrued interest from a bond", "You are reporting original issue discount (OID) of less than the amount shown on Form 1099-OID", "You are reporting interest income of less than the amount shown on a Form 1099 due to amortizable bond premium", "You are claiming the exclusion of interest from series EE or I U.S. savings bonds issued after 1989", "You received interest or ordinary dividends as a nominee"'
    - id: sb.ordinary_dividends_if_dividends
      printed: (helper)
      type: NonNegDollars
      label: 'Total ordinary dividends, Form 1099-DIV box 1a, when you or your spouse received dividends or other distributions; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.any
                - const: true
            then: sb.ordinary_dividends
          - guard:
              op: test
              eq:
                - div.any
                - const: false
            then: sb.zero
      cite:
        doc: i1040sb
        locator: 'p. 2, Line 5, "Report on line 5 all of your ordinary dividends. This amount should be shown in box 1a of your Forms 1099-DIV or substitute statements"'
    - id: sb.unsupported_if_income
      printed: (helper)
      type: Bool
      label: 'Schedule B special treatment, when taxable interest, ordinary dividends or capital gain distributions are above zero; false otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sb.has_income
                - const: true
            then: sb.unsupported
          - guard:
              op: test
              eq:
                - sb.has_income
                - const: false
            then: sb.no
      cite:
        doc: i1040sb
        locator: 'p. 1, General Instructions, "Use Schedule B (Form 1040) if any of the following applies", "You received interest from a seller-financed mortgage", "You have accrued interest from a bond", "You are reporting original issue discount (OID) of less than the amount shown on Form 1099-OID", "You are reporting interest income of less than the amount shown on a Form 1099 due to amortizable bond premium", "You are claiming the exclusion of interest from series EE or I U.S. savings bonds issued after 1989", "You received interest or ordinary dividends as a nominee"'
    - id: sb.fbar_required_if_foreign
      printed: (helper)
      type: Bool
      label: 'FinCEN Form 114 (FBAR) required, when you or your spouse had a foreign account, other foreign financial asset, foreign trust or foreign corporation; false otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
