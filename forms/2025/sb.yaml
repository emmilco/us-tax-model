form:
  id: sb
  kind: form
  title: Schedule B — supported interest and ordinary dividends
  tax_year: 2025
  note: Payer keys identify records. Foreign-account and trust answers are retained even where income
    is below the threshold. FBAR/Form 8938 determinations remain explicit taxpayer answers; required
    foreign forms cause named refusals.
  lines:
    - id: sb.nominee
      printed: (helper)
      type: Bool
      gated_by: sb.nominee_if_income
      label: "Interest or ordinary dividends received as a nominee"
      expr:
        op: input
        source: "Does any of the interest or dividends you (or, on a joint return, your spouse) received in 2025 belong to someone else, for example to the other owner of a joint account who is not your spouse?"
      cite:
        doc: i1040sb
        locator: 'p. 1, General Instructions, "Use Schedule B (Form 1040) if any of the following applies", "You received interest from a seller-financed mortgage", "You have accrued interest from a bond", "You are reporting original issue discount (OID) of less than the amount shown on Form 1099-OID", "You are reporting interest income of less than the amount shown on a Form 1099 due to amortizable bond premium", "You are claiming the exclusion of interest from series EE or I U.S. savings bonds issued after 1989", "You received interest or ordinary dividends as a nominee"'
    - id: sb.bonds_any
      printed: (helper)
      type: Bool
      gated_by: sb.bonds_any_if_income
      label: "Bonds or notes owned directly, U.S. savings bonds cashed, or interest on a loan made or a property sold"
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) own bonds or notes directly (not through a fund), cash in U.S. savings bonds, or receive interest on money you lent or on a property you sold?"
      cite:
        doc: i1040sb
        locator: 'p. 1, General Instructions, "Use Schedule B (Form 1040) if any of the following applies", "You received interest from a seller-financed mortgage", "You have accrued interest from a bond", "You are reporting original issue discount (OID) of less than the amount shown on Form 1099-OID", "You are reporting interest income of less than the amount shown on a Form 1099 due to amortizable bond premium", "You are claiming the exclusion of interest from series EE or I U.S. savings bonds issued after 1989", "You received interest or ordinary dividends as a nominee"'
    - id: sb.bond_special
      printed: (helper)
      type: Bool
      gated_by: sb.bond_special_if_bonds
      label: "Original issue discount reported in an amount other than on Form 1099-OID, accrued interest paid on a bond purchase, bond premium adjustment, accrued market discount, a contingent payment debt instrument, seller-financed mortgage interest, a savings bond interest exclusion, or other special treatment"
      expr:
        op: input
        source: "Does any of these apply to that interest?\n\n- you bought a bond between interest dates and paid the seller the interest earned up to then\n- you paid more than face value for a bond (bond premium), or a Form 1099-INT shows an amount in box 10, 11, 12 or 13, or a Form 1099-OID in box 6 or 10\n- you report a different amount of original issue discount than a Form 1099-OID shows, or have market discount to report\n- a bond whose payments depend on something uncertain (a contingent payment debt instrument)\n- the buyer of your home or other property pays you interest on the price (a seller-financed mortgage)\n- you want to leave out U.S. savings bond interest because you paid for higher education (Form 8815)\n- any other adjustment to the interest or dividends shown on your forms"
      cite:
        doc: i1040sb
        locator: 'p. 1, General Instructions, "Use Schedule B (Form 1040) if any of the following applies", "You received interest from a seller-financed mortgage", "You have accrued interest from a bond", "You are reporting original issue discount (OID) of less than the amount shown on Form 1099-OID", "You are reporting interest income of less than the amount shown on a Form 1099 due to amortizable bond premium", "You are claiming the exclusion of interest from series EE or I U.S. savings bonds issued after 1989", "You received interest or ordinary dividends as a nominee"; f1099oid p. 7, Box 6, "shows the amount of acquisition premium amortization for the year that reduces the amount of OID", Box 10, "shows the amount of premium amortization"'
    - id: sb.unsupported
      printed: (helper)
      type: Bool
      label: 'Any nominee income, original issue discount reported in an amount other than on Form 1099-OID, accrued interest paid on a bond purchase, bond premium adjustment, accrued market discount, a contingent payment debt instrument, seller-financed mortgage interest, a savings bond interest exclusion, or other special treatment'
      expr:
        op: test
        any:
          - op: test
            eq:
              - sb.nominee_if_income
              - const: true
          - op: test
            eq:
              - sb.bond_special_if_bonds
              - const: true
      cite:
        doc: i1040sb
        locator: 'p. 1, General Instructions, "Use Schedule B (Form 1040) if any of the following applies", "You received interest from a seller-financed mortgage", "You have accrued interest from a bond", "You are reporting original issue discount (OID) of less than the amount shown on Form 1099-OID", "You are reporting interest income of less than the amount shown on a Form 1099 due to amortizable bond premium", "You are claiming the exclusion of interest from series EE or I U.S. savings bonds issued after 1989", "You received interest or ordinary dividends as a nominee"'
    - id: sb.ordinary_dividends
      printed: (helper)
      type: NonNegDollars
      label: Total ordinary dividends, Form 1099-DIV box 1a
      gated_by: sb.ordinary_dividends_if_dividends
      expr:
        op: input
        source: Total ordinary dividends, Form 1099-DIV box 1a
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.account_any
      printed: (gate)
      type: Bool
      label: 'At any time in 2025, did you (or, on a joint return, your spouse) have an account in another country (a bank, investment, pension, payment or crypto account), or the power to sign for one?'
      expr:
        op: input
        source: 'At any time in 2025, did you (or, on a joint return, your spouse) have an account in another country (a bank, investment, pension, payment or crypto account), or the power to sign for one?'
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"; i1040sb pp. 2–3, Part III, lines 7a and 8; fincen114 pp. 4–5, Who Must File an FBAR, Financial Account, Foreign Financial Account, Financial Interest, Signature Authority; i8938 pp. 7–8, Specified Foreign Financial Assets, Interests in Foreign Estates and Foreign Trusts, Interests in Foreign Pension Plans and Foreign Deferred Compensation Plans'
    - id: sb.asset_any
      printed: (gate)
      type: Bool
      label: 'At any time in 2025, did you (or, on a joint return, your spouse) own anything else of value outside the United States, or were you owed money by someone abroad?'
      expr:
        op: input
        source: 'At any time in 2025, did you (or, on a joint return, your spouse) own anything else of value outside the United States, or were you owed money by someone abroad?'
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"; i1040sb pp. 2–3, Part III, lines 7a and 8; fincen114 pp. 4–5, Who Must File an FBAR, Financial Account, Foreign Financial Account, Financial Interest, Signature Authority; i8938 pp. 7–8, Specified Foreign Financial Assets, Interests in Foreign Estates and Foreign Trusts, Interests in Foreign Pension Plans and Foreign Deferred Compensation Plans'
    - id: sb.trust_any
      printed: (gate)
      type: Bool
      label: 'Do you (or, on a joint return, your spouse) have anything to do with a trust or family foundation that is outside the United States or has a trustee abroad, as the person who set it up, gave to it, or may receive from it?'
      expr:
        op: input
        source: 'Do you (or, on a joint return, your spouse) have anything to do with a trust or family foundation that is outside the United States or has a trustee abroad, as the person who set it up, gave to it, or may receive from it?'
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"; i1040sb pp. 2–3, Part III, lines 7a and 8; fincen114 pp. 4–5, Who Must File an FBAR, Financial Account, Foreign Financial Account, Financial Interest, Signature Authority; i8938 pp. 7–8, Specified Foreign Financial Assets, Interests in Foreign Estates and Foreign Trusts, Interests in Foreign Pension Plans and Foreign Deferred Compensation Plans'
    - id: sb.company_any
      printed: (gate)
      type: Bool
      label: 'In 2025, were you (or, on a joint return, your spouse) a director, officer or manager of a company set up outside the United States, or an owner, alone or with your family, of 10% or more of one?'
      expr:
        op: input
        source: 'In 2025, were you (or, on a joint return, your spouse) a director, officer or manager of a company set up outside the United States, or an owner, alone or with your family, of 10% or more of one?'
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"; i1040sb pp. 2–3, Part III, lines 7a and 8; fincen114 pp. 4–5, Who Must File an FBAR, Financial Account, Foreign Financial Account, Financial Interest, Signature Authority; i8938 pp. 7–8, Specified Foreign Financial Assets, Interests in Foreign Estates and Foreign Trusts, Interests in Foreign Pension Plans and Foreign Deferred Compensation Plans'
    - id: sb.territory_any
      printed: (gate)
      type: Bool
      label: 'At any time in 2025, did you (or, on a joint return, your spouse) have an account, an investment, a company or a trust in Puerto Rico, Guam or another U.S. territory?'
      expr:
        op: input
        source: 'At any time in 2025, did you (or, on a joint return, your spouse) have an account, an investment, a company or a trust in Puerto Rico, Guam or another U.S. territory?'
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"; i1040sb pp. 2–3, Part III, lines 7a and 8; fincen114 pp. 4–5, Who Must File an FBAR, Financial Account, Foreign Financial Account, Financial Interest, Signature Authority; i8938 pp. 7–8, Specified Foreign Financial Assets, Interests in Foreign Estates and Foreign Trusts, Interests in Foreign Pension Plans and Foreign Deferred Compensation Plans'
    - id: sb.foreign_any
      printed: (gate)
      type: Bool
      label: 'A foreign account, another foreign financial asset, a connection to a foreign trust or a role in a foreign corporation, or any of these in a U.S. territory, at any time in 2025'
      expr:
        op: test
        any:
          - op: test
            eq:
              - sb.account_any
              - const: true
          - op: test
            eq:
              - sb.asset_any
              - const: true
          - op: test
            eq:
              - sb.trust_any
              - const: true
          - op: test
            eq:
              - sb.company_any
              - const: true
          - op: test
            eq:
              - sb.territory_any
              - const: true
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"; i1040sb pp. 2–3, Part III, lines 7a and 8; fincen114 pp. 4–5, Who Must File an FBAR, Financial Account, Foreign Financial Account, Financial Interest, Signature Authority; i8938 pp. 7–8, Specified Foreign Financial Assets, Interests in Foreign Estates and Foreign Trusts, Interests in Foreign Pension Plans and Foreign Deferred Compensation Plans'
    - id: sb.foreign_trust_any
      printed: (gate)
      type: Bool
      label: 'A connection to a foreign trust, or an account, investment, company or trust in a U.S. territory'
      expr:
        op: test
        any:
          - op: test
            eq:
              - sb.trust_any
              - const: true
          - op: test
            eq:
              - sb.territory_any
              - const: true
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"; i1040sb pp. 2–3, Part III, lines 7a and 8; fincen114 pp. 4–5, Who Must File an FBAR, Financial Account, Foreign Financial Account, Financial Interest, Signature Authority; i8938 pp. 7–8, Specified Foreign Financial Assets, Interests in Foreign Estates and Foreign Trusts, Interests in Foreign Pension Plans and Foreign Deferred Compensation Plans'
    - id: sb.foreign_company_any
      printed: (gate)
      type: Bool
      label: 'A role in or 10% of a foreign company, or an account, investment, company or trust in a U.S. territory'
      expr:
        op: test
        any:
          - op: test
            eq:
              - sb.company_any
              - const: true
          - op: test
            eq:
              - sb.territory_any
              - const: true
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"; i1040sb pp. 2–3, Part III, lines 7a and 8; fincen114 pp. 4–5, Who Must File an FBAR, Financial Account, Foreign Financial Account, Financial Interest, Signature Authority; i8938 pp. 7–8, Specified Foreign Financial Assets, Interests in Foreign Estates and Foreign Trusts, Interests in Foreign Pension Plans and Foreign Deferred Compensation Plans'
    - id: sb.foreign_no
      printed: (helper)
      type: Bool
      label: No foreign account, asset, trust or corporation question without a foreign connection
      expr:
        op: param
        ref: sb.foreign_no
      cite:
        doc: f1040sb
        locator: 'Part III, Foreign Accounts and Trusts, "You must complete this part if you (a) had over $1,500 of taxable interest or ordinary dividends; (b) had a foreign account; or (c) received a distribution from, or were a grantor of, or a transferor to, a foreign trust"'
    - id: sb.line7a
      printed: 7a
      type: Bool
      gated_by: sb.line7a_if_foreign
      label: Any financial interest in or signature authority over a foreign financial account during
        2025?
      expr:
        op: input
        source: Any financial interest in or signature authority over a foreign financial account during
          2025?
      cite:
        doc: i1040sb
        locator: 'pp. 2–3, Line 7a—Question 1, "Check the “Yes” box even if you aren''t required to file FinCEN Form 114", "an insurance policy with a cash value", "shares in a mutual fund or similar pooled fund", "A financial account is located in a foreign country if the account is physically located outside of the United States", "Don''t consider the exceptions relating to signature authority in answering Question 1 on line 7a"; fincen114 p. 4, Foreign Financial Account, "An account maintained with a branch of a foreign bank that is physically located in the United States is not a foreign financial account"; fincen114 p. 5, United States, "all United States territories and possessions"'
    - id: sb.fbar_required
      printed: (helper)
      type: Bool
      gated_by: sb.fbar_required_if_foreign
      label: Are you (or, on a joint return, your spouse) required to file FinCEN Form 114 (FBAR)? Determine under its instructions; this tool
        does not determine foreign account values or exceptions.
      expr:
        op: input
        source: Are you (or, on a joint return, your spouse) required to file FinCEN Form 114 (FBAR)? Determine under its instructions; this tool
          does not determine foreign account values or exceptions.
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.form8938
      printed: (helper)
      type: Bool
      gated_by: sb.form8938_if_foreign
      label: Are you (or, on a joint return, your spouse) required to file Form 8938 for specified foreign financial assets?
      expr:
        op: input
        source: Are you (or, on a joint return, your spouse) required to file Form 8938 for specified foreign financial assets?
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.line8
      printed: "8"
      type: Bool
      gated_by: sb.line8_if_foreign
      label: During 2025, did you (or, on a joint return, your spouse) receive a distribution from a foreign trust, including money or property that reached you through another person or company (a loan of cash or marketable securities counts, and so does free or below-market use of a home, car or other property the trust owns), or were you (or, on a joint return, your spouse) the grantor of, or a transferor to, a foreign trust that existed at any time during 2025, even one created or funded in an earlier year (a transferor is anyone who gave, sold, lent or otherwise transferred money or property to the trust, directly or through another person, in 2025 or any earlier year)? A foreign foundation, a waqf or another arrangement that holds property for beneficiaries counts as a trust; a trust counts as foreign unless a court in one of the 50 states or the District of Columbia (not one in Puerto Rico, Guam or another US territory) can supervise its administration and US persons (US citizens or residents, or US companies such as a US bank) control all of its substantial decisions, so it is foreign if anyone else can make or veto any of them, even if the trust was set up under US law or has a US address; if you are not sure whether an arrangement is a trust or whether a trust is foreign, answer Yes.
      expr:
        op: input
        source: During 2025, did you (or, on a joint return, your spouse) receive a distribution from a foreign trust, including money or property that reached you through another person or company (a loan of cash or marketable securities counts, and so does free or below-market use of a home, car or other property the trust owns), or were you (or, on a joint return, your spouse) the grantor of, or a transferor to, a foreign trust that existed at any time during 2025, even one created or funded in an earlier year (a transferor is anyone who gave, sold, lent or otherwise transferred money or property to the trust, directly or through another person, in 2025 or any earlier year)? A foreign foundation, a waqf or another arrangement that holds property for beneficiaries counts as a trust; a trust counts as foreign unless a court in one of the 50 states or the District of Columbia (not one in Puerto Rico, Guam or another US territory) can supervise its administration and US persons (US citizens or residents, or US companies such as a US bank) control all of its substantial decisions, so it is foreign if anyone else can make or veto any of them, even if the trust was set up under US law or has a US address; if you are not sure whether an arrangement is a trust or whether a trust is foreign, answer Yes.
      cite:
        doc: i1040sb
        locator: 'pp. 1–3, interest, dividends and foreign accounts/trusts; p. 3, Line 8, "a loan of cash or marketable securities is generally considered to be a distribution"; "If you were the grantor of, or transferor to, a foreign trust that existed during 2025, you may have to file Form 3520."; cfr-26-301-7701-7 pp. 1–2, In general, "A trust is a United States person if", "The term foreign trust means any trust other than a domestic trust"; cfr-26-301-7701-7 p. 2, The court test, "a court within a territory or possession of the United States or within a foreign country is not a court within the United States"; cfr-26-301-7701-7 p. 4, Control test, "with no other person having the power to veto any of the substantial decisions"'
    - id: sb.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.line2
      printed: "2"
      type: NonNegDollars
      label: Total taxable interest from all payers
      expr:
        op: sum_over
        collection: interest
        field: interest.amount
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
      refuses:
        - when: sb.unsupported_if_income
          form: Schedule B special treatment / Form 8815
          remedy: Prepare the applicable adjustment or exclusion; this tool supports unadjusted taxable
            interest and ordinary dividends.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.fbar_required_if_foreign
          form: FinCEN Form 114 (FBAR)
          remedy: Foreign-account reporting and the required country list are outside this tool. Prepare the
            separate FBAR and Schedule B disclosures.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form8938_if_foreign
          form: Form 8938
          remedy: Prepare the required foreign financial asset disclosure; this tool does not prepare Form
            8938.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.line8_if_foreign
          form: Form 3520 / Form 3520-A
          remedy: Review and prepare the required foreign-trust information returns; this path is outside
            scope.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form5471_if_foreign
          form: Form 5471
          remedy: You may have to file Form 5471 for a foreign corporation; this tool does not prepare it.
          cite:
            doc: i1040sb
            locator: 'p. 2, Part II. Ordinary Dividends, TIP, "You may have to file Form 5471 if, in 2025, you were an officer or director of a foreign corporation", "You may also have to file Form 5471 if, in 2025, you owned 10% or more of the total (a) value of a foreign corporation’s stock, or (b) combined voting power of all classes of a foreign corporation’s stock with voting rights"'
    - id: sb.line3
      printed: "3"
      type: NonNegDollars
      label: Amount from sb.zero
      expr:
        op: copy
        from: sb.zero
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
      refuses:
        - when: sb.unsupported_if_income
          form: Schedule B special treatment / Form 8815
          remedy: Prepare the applicable adjustment or exclusion; this tool supports unadjusted taxable
            interest and ordinary dividends.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.fbar_required_if_foreign
          form: FinCEN Form 114 (FBAR)
          remedy: Foreign-account reporting and the required country list are outside this tool. Prepare the
            separate FBAR and Schedule B disclosures.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form8938_if_foreign
          form: Form 8938
          remedy: Prepare the required foreign financial asset disclosure; this tool does not prepare Form
            8938.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.line8_if_foreign
          form: Form 3520 / Form 3520-A
          remedy: Review and prepare the required foreign-trust information returns; this path is outside
            scope.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form5471_if_foreign
          form: Form 5471
          remedy: You may have to file Form 5471 for a foreign corporation; this tool does not prepare it.
          cite:
            doc: i1040sb
            locator: 'p. 2, Part II. Ordinary Dividends, TIP, "You may have to file Form 5471 if, in 2025, you were an officer or director of a foreign corporation", "You may also have to file Form 5471 if, in 2025, you owned 10% or more of the total (a) value of a foreign corporation’s stock, or (b) combined voting power of all classes of a foreign corporation’s stock with voting rights"'
    - id: sb.line4
      printed: "4"
      type: Dollars
      label: Subtract sb.line3 from sb.line2
      expr:
        op: subtract
        from: sb.line2
        take: sb.line3
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.line6
      printed: "6"
      type: NonNegDollars
      label: Amount from sb.ordinary_dividends_if_dividends
      expr:
        op: copy
        from: sb.ordinary_dividends_if_dividends
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
      refuses:
        - when: sb.unsupported_if_income
          form: Schedule B special treatment / Form 8815
          remedy: Prepare the applicable adjustment or exclusion; this tool supports unadjusted taxable
            interest and ordinary dividends.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.fbar_required_if_foreign
          form: FinCEN Form 114 (FBAR)
          remedy: Foreign-account reporting and the required country list are outside this tool. Prepare the
            separate FBAR and Schedule B disclosures.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form8938_if_foreign
          form: Form 8938
          remedy: Prepare the required foreign financial asset disclosure; this tool does not prepare Form
            8938.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.line8_if_foreign
          form: Form 3520 / Form 3520-A
          remedy: Review and prepare the required foreign-trust information returns; this path is outside
            scope.
          cite:
            doc: i1040sb
            locator: pp. 1–3, interest, dividends and foreign accounts/trusts
        - when: sb.form5471_if_foreign
          form: Form 5471
          remedy: You may have to file Form 5471 for a foreign corporation; this tool does not prepare it.
          cite:
            doc: i1040sb
            locator: 'p. 2, Part II. Ordinary Dividends, TIP, "You may have to file Form 5471 if, in 2025, you were an officer or director of a foreign corporation", "You may also have to file Form 5471 if, in 2025, you owned 10% or more of the total (a) value of a foreign corporation’s stock, or (b) combined voting power of all classes of a foreign corporation’s stock with voting rights"'
    - id: sb.partIII
      printed: (helper)
      display: 'Notice on the values sheet: Schedule B Part III must be completed.'
      type: Bool
      label: Complete Part III for interest/dividends over $1,500 or foreign account/trust
      expr:
        op: test
        any:
          - op: test
            gt:
              - sb.line4
              - const: 150000
          - op: test
            gt:
              - sb.line6
              - const: 150000
          - op: test
            eq:
              - sb.line7a_if_foreign
              - const: true
          - op: test
            eq:
              - sb.line8_if_foreign
              - const: true
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: sb.form5471
      printed: (helper)
      type: Bool
      gated_by: sb.form5471_if_foreign
      label: 'In 2025, were you (or, on a joint return, your spouse) an officer, director, managing director or manager of a foreign corporation or other company, whatever it is called, that is organized outside the 50 states and the District of Columbia, including in Puerto Rico, Guam or another US territory, or did you (or, on a joint return, your spouse) own 10% or more of the total value of a foreign corporation''s stock, or of the combined voting power of all classes of a foreign corporation''s stock with voting rights, counting shares owned by your spouse, children, grandchildren or parents and by partnerships, corporations, trusts or estates you have an interest in, and shares any of you could acquire through options or warrants?'
      expr:
        op: input
        source: 'In 2025, were you (or, on a joint return, your spouse) an officer, director, managing director or manager of a foreign corporation or other company, whatever it is called, that is organized outside the 50 states and the District of Columbia, including in Puerto Rico, Guam or another US territory, or did you (or, on a joint return, your spouse) own 10% or more of the total value of a foreign corporation''s stock, or of the combined voting power of all classes of a foreign corporation''s stock with voting rights, counting shares owned by your spouse, children, grandchildren or parents and by partnerships, corporations, trusts or estates you have an interest in, and shares any of you could acquire through options or warrants?'
      cite:
        doc: i1040sb
        locator: 'p. 2, Part II. Ordinary Dividends, TIP, "You may have to file Form 5471 if, in 2025, you were an officer or director of a foreign corporation", "You may also have to file Form 5471 if, in 2025, you owned 10% or more of the total (a) value of a foreign corporation’s stock, or (b) combined voting power of all classes of a foreign corporation’s stock with voting rights"'
    - id: sb.interest_total
      printed: (helper)
      type: NonNegDollars
      label: Taxable interest from all payers, before any Schedule B adjustment
      expr:
        op: sum_over
        collection: interest
        field: interest.amount
      cite:
        doc: i1040sb
        locator: 'p. 1, Line 1, "Report on line 1 all of your taxable interest"'
    - id: sb.has_income
      printed: (gate)
      type: Bool
      label: Taxable interest, ordinary dividends or capital gain distributions are above zero
      expr:
        op: test
        any:
          - op: test
            gt:
              - sb.interest_total
              - const: 0
          - op: test
            gt:
              - sb.ordinary_dividends_if_dividends
              - const: 0
          - op: test
            gt:
              - sd.distributions_if_dividends
              - const: 0
      cite:
        doc: i1040sb
        locator: 'p. 1, General Instructions, "Use Schedule B (Form 1040) if any of the following applies", "You received interest from a seller-financed mortgage", "You have accrued interest from a bond", "You are reporting original issue discount (OID) of less than the amount shown on Form 1099-OID", "You are reporting interest income of less than the amount shown on a Form 1099 due to amortizable bond premium", "You are claiming the exclusion of interest from series EE or I U.S. savings bonds issued after 1989", "You received interest or ordinary dividends as a nominee"'
    - id: sb.no
      printed: (helper)
      type: Bool
      label: No special treatment without interest, ordinary dividends or capital gain distributions
      expr:
        op: param
        ref: sb.no
      cite:
        doc: i1040sb
        locator: 'p. 1, General Instructions, "Use Schedule B (Form 1040) if any of the following applies", "You received interest from a seller-financed mortgage", "You have accrued interest from a bond", "You are reporting original issue discount (OID) of less than the amount shown on Form 1099-OID", "You are reporting interest income of less than the amount shown on a Form 1099 due to amortizable bond premium", "You are claiming the exclusion of interest from series EE or I U.S. savings bonds issued after 1989", "You received interest or ordinary dividends as a nominee"'
    - id: sb.ordinary_dividends_if_dividends
      printed: (helper)
      type: NonNegDollars
      label: 'Total ordinary dividends, Form 1099-DIV box 1a, when you or your spouse received dividends or other distributions; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.any
                - const: true
            then: sb.ordinary_dividends
          - guard:
              op: test
              eq:
                - div.any
                - const: false
            then: sb.zero
      cite:
        doc: i1040sb
        locator: 'p. 2, Line 5, "Report on line 5 all of your ordinary dividends. This amount should be shown in box 1a of your Forms 1099-DIV or substitute statements"'
    - id: sb.nominee_if_income
      printed: (helper)
      type: Bool
      label: 'Interest or ordinary dividends received as a nominee, when taxable interest, ordinary dividends or capital gain distributions are above zero; false otherwise'
      expr:
