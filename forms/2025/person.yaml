      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 2, "Enter the amount shown below that applies to you"
          and "Married filing separately and you lived with your spouse at any time in 2025, enter $10,000"'
    - id: person.ira_line2_apart
      printed: (helper)
      label: $89,000 (married filing separately and lived apart from your spouse for all of 2025)
      type: NonNegDollars
      expr:
        op: param
        ref: ira.line2_apart
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 2, "Single, head of household, or married filing
          separately and you lived apart from your spouse for all of 2025, enter $89,000"'
    - id: person.ira_line2_status
      printed: (helper)
      label: The line 2 amount for the filing status ($89,000; $146,000 if married filing jointly or qualifying surviving spouse;
        married filing separately, $89,000 if you lived apart from your spouse for all of 2025 and $10,000 otherwise)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.mfs_apart_all_year
            - const: true
          then: person.ira_line2_apart
        - guard:
            op: test
            eq:
            - household.mfs_apart_all_year
            - const: false
          then: person.ira_line2_table
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 2, "Single, head of household, or married filing
          separately and you lived apart from your spouse for all of 2025, enter $89,000" and "Married filing separately and
          you lived with your spouse at any time in 2025, enter $10,000"'
    - id: person.ira_line2_nc
      printed: (helper)
      label: $246,000
      type: NonNegDollars
      expr:
        op: param
        ref: ira.line2_not_covered
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 2, "enter $246,000 for the person who wasn’t covered
          by a plan"'
    - id: person.ira_line2
      printed: (helper)
      label: Worksheet line 2 for this person's column
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_not_covered_joint
            - const: true
          then: person.ira_line2_nc
        - guard:
            op: test
            eq:
            - person.ira_not_covered_joint
            - const: false
          then: person.ira_line2_status
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 2, "Married filing jointly, enter $146,000 in both
          columns. But if you checked “No” on either line 1a or 1b, enter $246,000 for the person who wasn’t covered by a
          plan"'
    - id: person.ira_line6
      printed: (helper)
      label: 'Worksheet line 6 for this person''s column: is line 5 less than line 2? If yes, subtract line 5 from line 2 (if
        no, zero: none of the contributions are deductible)'
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.ira_line2
        take: ira.line5
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 6, "Is the amount on line 5 less than the amount on
          line 2?", "None of your IRA contributions are deductible" and "Subtract line 5 from line 2 in each column"'
    - id: person.ira_line6_yes
      printed: (helper)
      label: Line 5 is less than line 2 in this person's column (line 6, Yes)
      type: Bool
      expr:
        op: test
        gt:
        - person.ira_line6
        - param: sales.zero
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 6, "Is the amount on line 5 less than the amount on
          line 2?"'
    - id: person.ira_wide
      printed: (helper)
      label: This column takes the single rule (70% or 80%, the $10,000 threshold) — not married filing jointly or qualifying
        surviving spouse, or the column of a person who wasn't covered by a retirement plan
      type: Bool
      expr:
        op: test
        any:
        - op: test
          eq:
          - ira.joint_type
          - const: false
        - op: test
          eq:
          - person.ira_cov
          - const: false
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 6, "($10,000 or more in the column for the IRA of
          a person who wasn’t covered by a retirement plan)"; p. 98, IRA Deduction Worksheet—Continued, line 7, "then in the
          column for the IRA of the person who wasn’t covered by a retirement plan, multiply by 70% (0.70)"'
    - id: person.ira_full_narrow
      printed: (helper)
      label: $10,000
      type: NonNegDollars
      expr:
        op: param
        ref: ira.full_narrow
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 6, "and the result is $10,000 or more"'
    - id: person.ira_full_joint
      printed: (helper)
      label: $20,000
      type: NonNegDollars
      expr:
        op: param
        ref: ira.full_joint
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 6, "and the result is $20,000 or more"'
    - id: person.ira_full
      printed: (helper)
      label: The line 6 result at or above which this column takes the applicable amount ($10,000 or $20,000)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_wide
            - const: true
          then: person.ira_full_narrow
        - guard:
            op: test
            eq:
            - person.ira_wide
            - const: false
          then: person.ira_full_joint
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 6, "If single, head of household, or married filing
          separately, and the result is $10,000 or more" and "If married filing jointly or qualifying surviving spouse, and the
          result is $20,000 or more ($10,000 or more in the column for the IRA of a person who wasn’t covered by a retirement
          plan)"'
    - id: person.ira_at_full
      printed: (helper)
      label: The line 6 result is at or above the threshold (enter the applicable amount on line 7)
      type: Bool
      expr:
        op: test
        ge:
        - person.ira_line6
        - person.ira_full
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 6, "enter the applicable amount below on line 7 for
          that column and go to line 8"'
    - id: person.ira_p70
      printed: (helper)
      label: Line 6 multiplied by 70% (0.70)
      type: NonNegDollars
      expr:
        op: multiply_rate
        amount: person.ira_line6
        rate:
          param: ira.rate_70
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "multiply by 70% (0.70)"'
    - id: person.ira_p80
      printed: (helper)
      label: Line 6 multiplied by 80% (0.80)
      type: NonNegDollars
      expr:
        op: multiply_rate
        amount: person.ira_line6
        rate:
          param: ira.rate_80
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "or by 80% (0.80)"'
    - id: person.ira_p35
      printed: (helper)
      label: Line 6 multiplied by 35% (0.35)
      type: NonNegDollars
      expr:
        op: multiply_rate
        amount: person.ira_line6
        rate:
          param: ira.rate_35
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "multiply by 35% (0.35)"'
    - id: person.ira_p40
      printed: (helper)
      label: Line 6 multiplied by 40% (0.40)
      type: NonNegDollars
      expr:
        op: multiply_rate
        amount: person.ira_line6
        rate:
          param: ira.rate_40
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "or by 40% (0.40)"'
    - id: person.ira_prod_wide
      printed: (helper)
      label: Line 6 multiplied by 70% (0.70), or by 80% (0.80) for a person age 50 or older at the end of 2025
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_age50
            - const: true
          then: person.ira_p80
        - guard:
            op: test
            eq:
            - person.ira_age50
            - const: false
          then: person.ira_p70
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "Single, head of household, or married filing separately,
          multiply by 70% (0.70) (or by 80% (0.80) in the column for the IRA of a person who is age 50 or older at the end of
          2025)"'
    - id: person.ira_prod_joint
      printed: (helper)
      label: Line 6 multiplied by 35% (0.35), or by 40% (0.40) for a person age 50 or older at the end of 2025
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_age50
            - const: true
          then: person.ira_p40
        - guard:
            op: test
            eq:
            - person.ira_age50
            - const: false
          then: person.ira_p35
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "Married filing jointly or qualifying surviving spouse, multiply
          by 35% (0.35) (or by 40% (0.40) in the column for the IRA of a person who is age 50 or older at the end of 2025)"'
    - id: person.ira_prod
      printed: (helper)
      label: Line 6 multiplied by the percentage that applies to this column
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_wide
            - const: true
          then: person.ira_prod_wide
        - guard:
            op: test
            eq:
            - person.ira_wide
            - const: false
          then: person.ira_prod_joint
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "Multiply lines 6a and 6b by the percentage below that applies
          to you"'
      ambiguity: amb.2025.ira_line7_cents
    - id: person.ira_rounded
      printed: (helper)
      label: If the result isn't a multiple of $10, increase it to the next multiple of $10
      type: NonNegDollars
      expr:
        op: round
        of: person.ira_prod
        unit: 1000
        rule: up
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "If the result isn’t a multiple of $10, increase it to the
          next multiple of $10 (for example, increase $490.30 to $500)"'
    - id: person.ira_min
      printed: (helper)
      label: $200
      type: NonNegDollars
      expr:
        op: param
        ref: ira.min
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "But if it is less than $200, enter $200"'
    - id: person.ira_floor
      printed: (helper)
      label: If the result is $200 or more, enter the result; but if it is less than $200, enter $200
      type: NonNegDollars
      expr:
        op: larger_of
        of:
        - person.ira_rounded
        - person.ira_min
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 7, "If the result is $200 or more, enter the result. But if
          it is less than $200, enter $200"'
    - id: person.ira_below
      printed: (helper)
      label: Line 7 when the line 6 result is under the threshold (zero when line 6 is No)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_line6_yes
            - const: true
          then: person.ira_floor
        - guard:
            op: test
            eq:
            - person.ira_line6_yes
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 6, "None of your IRA contributions are deductible";
          p. 98, IRA Deduction Worksheet—Continued, line 7'
    - id: person.ira_line7_figured
      printed: (helper)
      label: Line 7 when someone is covered by a retirement plan (lines 2 through 6 completed)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_at_full
            - const: true
          then: person.ira_limit
        - guard:
            op: test
            eq:
            - person.ira_at_full
            - const: false
          then: person.ira_below
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 6, "enter the applicable amount below on line 7 for
          that column and go to line 8" and "Otherwise, go to line 7"'
    - id: person.ira_line7
      printed: (helper)
      label: Worksheet line 7 for this person's column
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - ira.anyone_covered
            - const: true
          then: person.ira_line7_figured
        - guard:
            op: test
            eq:
            - ira.anyone_covered
            - const: false
          then: person.ira_limit
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, "If you checked “No” on line 1a (and “No” on line 1b if
          married filing jointly), skip lines 2 through 6, enter the applicable amount below on line 7a (and line 7b, if applicable),
          and go to line 8"'
    - id: person.ira_over_limit
      printed: (gate)
      label: This person's traditional and Roth IRA contributions for 2025 together are more than the applicable amount
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - person.ira_has
          - const: true
        - op: test
          gt:
          - person.ira_own_total
          - person.ira_limit
      cite:
        doc: p590a
        locator: 'p. 35, Excess Contributions, "Generally, an excess contribution is the amount contributed to your traditional
          IRAs for the year that is more than the smaller of: • $7,000 ($8,000 if you are age 50 or older), or • Your taxable
          compensation for the year"'
    - id: person.ira_own_total
      printed: (helper)
      label: This person's traditional and Roth IRA contributions for 2025
      type: NonNegDollars
      expr:
        op: sum
        of:
        - person.ira_contrib
        - person.sav_roth_if_ira_owner
      cite:
        doc: i8606
        locator: 'p. 5, Overall Contribution Limit for Traditional and Roth IRAs, "your limit on contributions to traditional
          and Roth IRAs is generally the smaller of $7,000 ($8,000 if age 50 or older at the end of 2025) or your taxable compensation"'
    - id: person.ira_line11
      printed: (helper)
      label: Worksheet line 11 for this person's column (traditional IRA contributions for 2025)
      type: NonNegDollars
      expr:
        op: copy
        from: person.ira_contrib
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 11, "Enter traditional IRA contributions made, or that will be
          made by the due date of your 2025 return not counting extensions (April 15, 2026, for most people), for 2025 to your
          IRA on line 11a and to your spouse’s IRA on line 11b"'
      refuses:
      - when: ira.both_kinds
        form: Traditional and Roth IRA contributions on a joint return (Pub. 590-A)
        remedy: On a joint return where you or your spouse made contributions to both a traditional IRA and a Roth IRA for 2025,
          the IRA deduction is figured with Pub. 590-A, which this tool does not prepare.
        cite:
          doc: i1040gi
          locator: 'p. 95, Line 20, "If you are filing a joint return and you or your spouse made contributions to both a traditional
            IRA and a Roth IRA for 2025, don’t use the IRA Deduction Worksheet in these instructions"'
      - when: ira.kbh_short
        form: IRA deduction on a joint return with little compensation (Pub. 590-A worksheet)
        remedy: On a joint return with line 10 of the IRA Deduction Worksheet under $14,000 ($15,000 or $16,000 with spouses
          age 50 or older), the IRA deduction is figured with the worksheet in Pub. 590-A, which this tool does not prepare.
        cite:
          doc: i1040gi
          locator: 'p. 98, IRA Deduction Worksheet—Continued, Caution, "stop here and use the worksheet in Pub. 590-A to figure
            your IRA deduction"'
      - when: person.ira_excess_gate
        form: Excess or recharacterized IRA contributions (Form 5329 Parts III and IV, Pub. 590-A)
        remedy: Traditional or Roth IRA contributions for 2025 that are more than allowed or were recharacterized, and an
          excess contribution from an earlier year that remained in an IRA at the end of 2025, are outside this tool.
        cite:
          doc: i1040gi
          locator: 'p. 95, Line 20, "If the total of your IRA deduction on line 20 plus any nondeductible contributions to your
            traditional IRAs shown on Form 8606 is less than your total traditional IRA contributions for 2025, see Pub. 590-A
            for special rules"'
      - when: person.ira_over_limit
        form: Excess IRA contributions (Form 5329 Part III, Pub. 590-A)
        remedy: Your traditional and Roth IRA contributions for 2025 are together more than $7,000 ($8,000 if age 50 or older),
          an excess contribution, which is outside this tool.
        cite:
          doc: p590a
          locator: 'p. 35, Excess Contributions, "Generally, an excess contribution is the amount contributed to your traditional
            IRAs for the year that is more than the smaller of"'
      - when: ira.over_comp
        form: Excess IRA contributions (Form 5329 Part III, Pub. 590-A)
        remedy: The traditional and Roth IRA contributions for 2025 on this return are more than the compensation on line 10
          of the IRA Deduction Worksheet, an excess contribution, which is outside this tool.
        cite:
          doc: p590a
          locator: 'p. 35, Excess Contributions, "Your taxable compensation for the year"'
      - when: ira.special_gate
        form: IRA deduction special cases (Pub. 590-A)
        remedy: Nonqualified deferred compensation in box 1 (Form W-2 box 11 or code Z, Form 1099-MISC box 15), fellowship or
          stipend payments not on a Form W-2, repayments of qualified reservist distributions and difficulty of care payments
          change the IRA compensation or contribution limits; they are outside this tool.
        cite:
          doc: i1040gi
          locator: 'p. 95, Line 20, "don’t include that income on line 8 of the worksheet" and "Don’t include any repayments
            of qualified reservist distributions"; p590a p. 6, What Is Compensation?, "certain non-tuition fellowship and stipend
            payments not reported to you on Form W-2 are treated as taxable compensation for IRA purposes"'
      - when: ira.excl_gate
        form: IRA deduction with excluded foreign or possession income (Pub. 590-A)
        remedy: With a retirement plan coverage and Form 2555 (or excluded income from Form 4563 or Puerto Rico), the IRA
          deduction is figured with Pub. 590-A, which this tool does not prepare.
        cite:
          doc: i1040gi
          locator: 'p. 96, Were You Covered by a Retirement Plan?, "If you were covered by a retirement plan and you file Form
            2555 or 8815, or you exclude employer-provided adoption benefits, see Pub. 590-A to figure the amount, if any, of
            your IRA deduction"'
      - when: ira.combat_gate
        form: Nontaxable combat pay in IRA compensation (IRA Deduction Worksheet, line 8)
        remedy: Nontaxable combat pay counts as compensation for the IRA deduction; it is outside this tool.
        cite:
          doc: i1040gi
          locator: 'p. 98, IRA Deduction Worksheet—Continued, line 8, "Nontaxable combat pay. This amount should be reported
            in box 12 of Form W-2 with code Q or reported on Form 1040, line 1i"'
    - id: person.ira_7or10
      printed: (helper)
      label: The smaller of line 7 for this column and line 10
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.ira_line7
        - ira.line10
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 12, "On line 12a, enter the smallest of line 7a, 10, or 11a"'
    - id: person.ira_line12
      printed: (helper)
      label: Worksheet line 12 for this person's column (the smallest of line 7, 10 or 11). This is the most you can deduct
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.ira_7or10
        - person.ira_line11
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 12, "On line 12a, enter the smallest of line 7a, 10, or 11a.
          On line 12b, enter the smallest of line 7b, 10, or 11b. This is the most you can deduct"'
      ambiguity: amb.2025.ira_deduct_less
    - id: person.ira_deduction
      printed: (helper)
      label: This person's IRA deduction (worksheet line 12; zero with no traditional IRA contributions)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_has
            - const: true
          then: person.ira_line12
        - guard:
            op: test
            eq:
            - person.ira_has
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 12, "Add the amounts on lines 12a and 12b and enter the total
          on Schedule 1, line 20"'
      refuses:
      - when: person.ira_dist_gate
        form: Nondeductible IRA contributions with a 2025 distribution or conversion (Form 8606 lines 4 to 13, Pub. 590-B)
        remedy: With nondeductible traditional IRA contributions for 2025 and a 2025 traditional IRA distribution or Roth
          conversion, the taxable part of the distribution is figured on Form 8606 lines 4 to 13 (Pub. 590-B Worksheet 1-1),
          which this tool does not prepare.
        cite:
          doc: p590a
          locator: 'p. 15, Both contributions for 2025 and distributions in 2025, "you must figure the taxable part of the traditional
            IRA distribution before you can figure your modified AGI"'
    - id: person.ira_10or11
      printed: (helper)
      label: The smaller of line 10 or line 11 of the worksheet for this person
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - ira.line10
        - person.ira_line11
      cite:
        doc: i8606
        locator: 'p. 9, Line 1, "subtract line 12 of the worksheet (or the amount you chose to deduct on Schedule 1 (Form 1040),
          line 20, if less) from the smaller of line 10 or line 11 of the worksheet"'
    - id: person.ira_nd_figured
      printed: (helper)
      label: Nondeductible contributions figured from the worksheet (the smaller of line 10 or 11, less line 12)
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.ira_10or11
        take: person.ira_line12
      cite:
        doc: i8606
        locator: 'p. 9, Line 1, "subtract line 12 of the worksheet (or the amount you chose to deduct on Schedule 1 (Form 1040),
          line 20, if less) from the smaller of line 10 or line 11 of the worksheet. Enter the result on line 1 of Form 8606"'
    - id: person.ira_nondeductible
      printed: (helper)
      label: This person's nondeductible traditional IRA contributions for 2025 (Form 8606 line 1)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_has
            - const: true
          then: person.ira_nd_figured
        - guard:
            op: test
            eq:
            - person.ira_has
            - const: false
          then: person.zero
      cite:
        doc: f8606
        locator: 'Form 8606 (2025), line 1, "Enter your nondeductible contributions to traditional IRAs for 2025, including those
          made for 2025 from January 1, 2026, through April 15, 2026"'
    - id: person.ira_files_8606
      printed: (helper)
      label: This person files Form 8606 for nondeductible contributions to a traditional IRA for 2025
      type: Bool
      expr:
        op: test
        gt:
        - person.ira_nondeductible
        - param: sales.zero
      cite:
        doc: i8606
        locator: 'p. 2, Who Must File, "You made nondeductible contributions to a traditional IRA for 2025"'
    - id: person.ira_basis
      printed: (helper)
      label: Your total basis in traditional IRAs before 2025 (Form 8606 line 2)
      type: NonNegDollars
      gated_by: person.ira_8606_line2
      expr:
        op: input
        source: 'Your total basis in traditional IRAs (Form 8606 line 2): zero if this is the first year you are required
          to file Form 8606 (you made no nondeductible traditional IRA contributions before 2025); otherwise the amount the Total Basis Chart in the Form 8606 instructions gives for the last Form 8606 you filed
          (generally line 14 of that form)'
      cite:
        doc: i8606
        locator: 'p. 9, Line 2, "Generally, if this is the first year you are required to file Form 8606, enter -0-. Otherwise,
          use the Total Basis Chart to find the amount to enter on line 2"'
    - id: person.ira_basis_adjusted
      printed: (helper)
      label: Your traditional IRA basis changed other than by nondeductible contributions
      type: Bool
      expr:
        op: input
        source: 'Did your traditional IRA basis change other than by nondeductible contributions? That is: did the last Form
          8606 you filed with Part I completed have a Line 15c Worksheet with an amount on line 6; or, since the last Form
          8606 you filed (ever, if you have filed none), did you have a return of excess traditional IRA contributions, transfer
          or receive a traditional IRA incident to divorce, or roll over a nontaxable part of a qualified retirement plan to
          a traditional IRA that wasn''t previously reported on Form 8606, line 2?'
      cite:
        doc: i8606
        locator: 'p. 9, Line 2, "you may need to enter an amount that is more than -0- (even if this is the first year you are
          required to file Form 8606) or increase or decrease the amount from the chart"; p. 9, Total Basis Chart, "the amount
          from line 14 of that Form 8606 as adjusted to include the amount from line 6 of the Line 15c Worksheet, if any"'
    - id: person.ira_basis_gate
      printed: (gate)
      label: A person who files Form 8606 and whose traditional IRA basis changed other than by nondeductible contributions
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - person.ira_files_8606
          - const: true
        - op: test
          eq:
          - person.ira_basis_adjusted
          - const: true
      cite:
        doc: i8606
        locator: 'p. 9, Line 2, "increase or decrease the amount from the chart"'
    - id: person.ira_8606_line2
      printed: (helper)
      label: Form 8606 line 2 for this person (asked only when the person files Form 8606)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_files_8606
            - const: true
          then: person.ira_basis
        - guard:
            op: test
            eq:
            - person.ira_files_8606
            - const: false
          then: person.zero
      cite:
        doc: f8606
        locator: Form 8606 (2025), line 2, "Enter your total basis in traditional IRAs"
      refuses:
      - when: person.ira_basis_gate
        form: Form 8606, line 2 (basis adjustments)
        remedy: Adjusting the Form 8606 line 2 basis for a Line 15c Worksheet amount, a return of excess contributions, a
          transfer incident to divorce or a rollover of a nontaxable part of a qualified plan is outside this tool.
        cite:
          doc: i8606
          locator: 'p. 9, Line 2, "you may need to enter an amount that is more than -0- (even if this is the first year you
            are required to file Form 8606) or increase or decrease the amount from the chart"'
    - id: person.ira_dist
      printed: (helper)
      label: In 2025, did you take a distribution from a traditional IRA, or make a Roth IRA conversion?
      type: Bool
      gated_by: person.ira_dist_if_files
      expr:
        op: input
        source: In 2025, did you take a distribution from a traditional IRA (including a SEP or SIMPLE IRA), or make a Roth
          IRA conversion? Do not count rollovers (but count a repayment, treated as a rollover, of a 2025 qualified disaster,
          birth or adoption, emergency personal expense, domestic abuse or terminal illness distribution), qualified charitable
          distributions, a one-time distribution to fund an HSA, recharacterizations, or returns of contributions made by the
          due date of the return.
      cite:
        doc: f8606
        locator: 'Form 8606 (2025), Part I, "In 2025, did you take a distribution from a traditional IRA, or make a Roth IRA
          conversion?" and "For this purpose, “distributions” does not include rollovers (but does include certain 2025 retirement
          plan distribution repayments treated as rollovers (see instructions))"; i8606 p. 4, Special Terms, Certain 2025 retirement
          plan distribution repayments treated as rollovers'
    - id: person.ira_dist_if_files
      printed: (helper)
      label: This person files Form 8606 for nondeductible contributions for 2025 and took a 2025 traditional IRA distribution
        or Roth conversion
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_files_8606
            - const: true
          then: person.ira_dist
        - guard:
            op: test
            eq:
            - person.ira_files_8606
            - const: false
          then: person.no
      cite:
        doc: f8606
        locator: Form 8606 (2025), Part I, "In 2025, did you take a distribution from a traditional IRA, or make a Roth IRA conversion?"
          and "Go to line 4"
    - id: person.ira_dist_gate
      printed: (gate)
      label: Nondeductible contributions for 2025 with a 2025 traditional IRA distribution or Roth conversion
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_has
            - const: true
          then: person.ira_dist_if_files
        - guard:
            op: test
            eq:
            - person.ira_has
            - const: false
          then: person.no
      cite:
        doc: f8606
        locator: 'Form 8606 (2025), Part I, "In 2025, did you take a distribution from a traditional IRA, or make a Roth IRA
          conversion?" and "Go to line 4"'
    - id: person.ira_8606_line14
      printed: (helper)
      label: Form 8606 line 14 for this person (total basis in traditional IRAs for 2025 and earlier years)
      type: NonNegDollars
      expr:
        op: sum_over
        collection: f8606
        field: f8606.line14
      cite:
        doc: f8606
        locator: Form 8606 (2025), line 14
    - id: person.ira_ssb_lim
      printed: (helper)
      label: 'Social Security Benefits Worksheet copy of the IRA deduction: the smaller of the applicable amount and line 10'
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.ira_limit
        - ira.line10
      cite:
        doc: i1040gi
        locator: 'p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, "skip lines 2 through 6, enter the applicable amount below
          on line 7a"; p. 98, IRA Deduction Worksheet—Continued, line 12, "enter the smallest of line 7a, 10, or 11a"'
      ambiguity: amb.2025.ira_ssb_copy
    - id: person.ira_ssb_figured
      printed: (helper)
      label: 'Social Security Benefits Worksheet copy of the IRA deduction when no one is covered by a retirement plan: the
        smallest of the applicable amount, line 10 and line 11'
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.ira_ssb_lim
        - person.ira_line11
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 12, "enter the smallest of line 7a, 10, or 11a"'
      ambiguity: amb.2025.ira_ssb_copy
      refuses:
      - when: ira.cov_gate
        form: Social security benefits with an IRA deduction and retirement plan coverage (Pub. 590-A Appendix B)
        remedy: With social security benefits, traditional IRA contributions for 2025 and you or your spouse covered by a retirement
          plan, the taxable benefits and the IRA deduction are figured with the worksheets in Pub. 590-A, which this tool does
          not prepare.
        cite:
          doc: i1040gi
          locator: p. 31, Lines 6a and 6b, Exception
    - id: person.ira_ssb
      printed: (helper)
      label: This person's IRA deduction as the Social Security Benefits Worksheet reads it (zero with no traditional IRA contributions)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.ira_has
            - const: true
          then: person.ira_ssb_figured
        - guard:
            op: test
            eq:
            - person.ira_has
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: p. 32, Social Security Benefits Worksheet, line 6
      ambiguity: amb.2025.ira_ssb_copy
    - id: person.ira_se_take
      printed: (helper)
      label: This person's deductions on Schedule 1, lines 15 and 16
      type: NonNegDollars
      expr:
        op: sum
        of:
        - person.se_line13
        - person.s16
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 9, "minus any deductions on Schedule 1, lines 15 and 16"'
    - id: person.ira_se_figured
      printed: (helper)
      label: This person's earned income as a self-employed individual, less Schedule 1 lines 15 and 16 (zero or less, zero)
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.sc_total
        take: person.ira_se_take
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 9, "Enter the earned income you (and your spouse if filing jointly)
          received as a self-employed individual or a partner" and "If zero or less, enter -0-"'
      ambiguity: amb.2025.ira_se_floor
    - id: person.ira_se
      printed: (helper)
      label: This person's part of worksheet line 9 (zero without a Schedule C)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: true
          then: person.ira_se_figured
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: 'p. 98, IRA Deduction Worksheet—Continued, line 9, "Generally, this is your (and your spouse’s if filing jointly)
          net earnings from self-employment if your personal services were a material income-producing factor"'
      ambiguity: amb.2025.ira_se_earned
    # --- Stage 19: education credits (generated) ---
    - id: person.edu
      printed: (gate)
      label: Qualified education expenses paid in 2025 for this person
      type: Bool
      expr:
        op: input
        source: Did anyone pay qualified education expenses in 2025 for this person as a student at an eligible educational institution
          (a college, university, vocational school, or other postsecondary school eligible for federal student aid), counting
          books, supplies and equipment needed for a course of study wherever they were bought?
      cite:
        doc: i8863
        locator: p. 2, Who Can Claim an Education Credit, "You may be able to claim an education credit if you, your spouse, or
          a dependent you claim on your tax return was a student enrolled at or attending an eligible educational institution."
    - id: person.edu_1098t
      printed: (gate)
      label: The student received a 2025 Form 1098-T from the institution, or an exception applies
      type: Bool
      expr:
        op: input
        source: Did the student receive a 2025 Form 1098-T from the educational institution? Answer yes also, if you can show
          the enrollment and the payments, when the institution was not required to furnish one (for example a qualified nonresident
          alien, expenses paid entirely with scholarships or under a formal billing arrangement, or only courses for which no
          academic credit is awarded), or when the institution did not furnish it and, after February 2, 2026, but before you
          file, you or the student requested it and you fully cooperated with the institution's efforts to gather the information
          needed to furnish it.
      cite:
        doc: i8863
        locator: p. 1, Form 1098-T requirement, "To be eligible to claim the American opportunity credit or the lifetime learning
          credit, the law requires a taxpayer (or a dependent) to have received Form 1098-T, Tuition Statement, from an eligible
          educational institution, whether domestic or foreign."; p. 1, "You must fully cooperate with the educational
          institution’s efforts to gather the information needed to furnish the Form 1098-T."
      ambiguity: amb.2025.edu_1098t_date
    - id: person.edu_student
      printed: (helper)
      label: 'An eligible student of this return: expenses paid, a TIN by the due date and a Form 1098-T (or an exception)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f8863.paid
            - const: true
          then: person.edu_student_edu
        - guard:
            op: test
            eq:
            - f8863.paid
            - const: false
          then: person.edu_no
      cite:
        doc: i8863
        locator: p. 3, Who cannot claim a credit, "5. The student has not been issued a TIN by the due date of his or her 2025
          return (including extensions)."
    - id: person.edu_student_edu
      printed: (helper)
      label: 'With education expenses paid: this person was a student with qualified expenses, has a TIN by the due date and a Form 1098-T (or an exception)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.edu
            - const: true
          then: person.edu_student_tin
        - guard:
            op: test
            eq:
            - person.edu
            - const: false
          then: person.edu_no
      cite:
        doc: i8863
        locator: p. 2, Who Can Claim an Education Credit, "You may be able to claim an education credit if you, your spouse, or
          a dependent you claim on your tax return was a student enrolled at or attending an eligible educational institution."
    - id: person.edu_student_tin
      printed: (helper)
      label: 'A student with qualified expenses: an SSN or ITIN (or an ITIN applied for by the due date), and a Form 1098-T (or an exception)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.tin
            - const: true
          then: person.edu_1098t
        - guard:
            op: test
            eq:
            - person.tin
            - const: false
          then: person.edu_student_itin
      cite:
        doc: i8863
        locator: p. 3, Who cannot claim a credit, "5. The student has not been issued a TIN by the due date of his or her 2025
          return (including extensions)."
    - id: person.edu_student_itin
      printed: (helper)
      label: 'A student without an SSN or ITIN: an ITIN applied for by the due date, and a Form 1098-T (or an exception)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.itin_applied
            - const: true
          then: person.edu_1098t
        - guard:
            op: test
            eq:
            - person.itin_applied
            - const: false
          then: person.edu_no
      cite:
        doc: i8863
        locator: p. 3, Who cannot claim a credit, "5. The student has not been issued a TIN by the due date of his or her 2025
          return (including extensions)."
    - id: person.edu_inst
      printed: (helper)
      label: Qualified education expenses required to be paid to the institution
      type: NonNegDollars
      expr:
        op: input
        source: |-
          Qualified education expenses paid in 2025 for this student, by anyone, that had to be paid to the institution, for academic periods beginning in 2025 or in the first 3 months of 2026:

          - tuition
          - fees required for enrollment or attendance, including nonacademic fees (such as student activity or athletic fees) that must be paid to the institution as a condition of enrollment or attendance
          - books, supplies and equipment required to be paid to the institution as a condition of enrollment or attendance

          Use the amounts actually paid, which may differ from Form 1098-T box 1.

          Do not include:
          - amounts paid in 2024 or 2026
          - room and board
          - insurance
          - medical expenses (including student health fees)
          - transportation
          - expenses deducted elsewhere (for example on Schedule C)
          - expenses used for a tax-free distribution from a Coverdell ESA or qualified tuition program (529 plan)
          - a course or other education involving sports, games or hobbies, or any noncredit course, unless it is part of the student's degree program or, where this student can't get the American opportunity credit, it helps the student acquire or improve job skills

          Zero if none
      cite:
        doc: i8863
        locator: p. 4, Qualified Education Expenses, "Generally, qualified education expenses are amounts paid in 2025 for tuition
          and fees required for the student’s enrollment or attendance at an eligible educational institution."; p. 4, "Any course
          or other education involving sports, games, or hobbies, or any noncredit course, unless such course or other education
          is part of the student’s degree program or (for the lifetime learning credit only) helps the student acquire or improve
          job skills."
    - id: person.edu_mat
      printed: (helper)
      label: Other course materials (American opportunity credit only)
      type: NonNegDollars
      expr:
        op: input
        source: 'Other course materials paid for in 2025 for this student: books, supplies and equipment needed for a course of
          study that did not have to be paid to the institution (they count for the American opportunity credit only), paid
          in 2025; do not include amounts paid in 2024 or 2026, expenses deducted elsewhere (for example on Schedule C), expenses
          used for a tax-free distribution from a Coverdell ESA or qualified tuition program (529 plan), or materials for a course
          involving sports, games or hobbies or a noncredit course that is not part of the student''s degree program; zero
          if none'
      cite:
        doc: i8863
        locator: 'p. 4, Qualified Education Expenses, "American opportunity credit: Qualified education expenses include amounts
          paid for tuition, fees, and course materials, which include books, supplies, and equipment needed for a course of study,
          whether or not the materials are purchased from the educational institution as a condition of enrollment or attendance."'
    - id: person.edu_a_this_year
      printed: (helper)
      label: Adjusted Qualified Education Expenses Worksheet, line 2a
      type: NonNegDollars
      expr:
        op: input
        source: 'Tax-free educational assistance received in 2025 that is allocable to the academic periods of the expenses entered
          for this student (periods beginning in 2025 or in the first 3 months of 2026): the tax-free part of scholarships and
          fellowship grants (including Pell grants; Form 1098-T box 5 may help), tax-free employer-provided educational assistance,
          veterans'' educational assistance, and other tax-free educational assistance. Do not include wages, loans, gifts, inheritances,
          withdrawals from personal savings, emergency financial aid grants, or a scholarship the student includes in income (for
          you or your spouse, the amount on Schedule 1 line 8r); a scholarship or fellowship grant can be included in income only
          if its terms allow it to be used for expenses other than qualified education expenses (such as room and board), and
          never one provided by an Indian tribal government and excluded under the Tribal General Welfare Exclusion Act of 2014;
          zero if none'
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "a. Tax-free educational assistance received in 2025 allocable
          to the academic period"; p. 5, Coordination with Pell grants and other scholarships or fellowship grants, "A student
          cannot choose to include in income a scholarship or fellowship grant provided by an Indian tribal government that is
          excluded from income under the Tribal General Welfare Exclusion Act of 2014" and "the scholarship or fellowship grant
          must be one that may (by its terms) be used for expenses other than qualified education expenses (such as room and board)"
    - id: person.edu_a_next_year
      printed: (helper)
      label: Adjusted Qualified Education Expenses Worksheet, line 2b
      type: NonNegDollars
      expr:
        op: input
        source: Tax-free educational assistance received in 2026, before you file this return, that is allocable to an academic
          period of these 2025 expenses; zero if none
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "b. Tax-free educational assistance received in 2026 (and
          before you file your 2025 tax return) allocable to the academic period"
    - id: person.edu_refunds
      printed: (helper)
      label: Adjusted Qualified Education Expenses Worksheet, line 2c
      type: NonNegDollars
      expr:
        op: input
        source: Refunds of these 2025 qualified education expenses received in 2025, or in 2026 before you file this return; zero
          if none
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "c. Refunds of qualified education expenses paid in 2025
          if the refund is received in 2025 or in 2026 before you file your 2025 tax return"
    - id: person.edu_adj_sum
      printed: (helper)
      label: Add lines 2a, 2b and 2c
      type: NonNegDollars
      expr:
        op: sum
        of:
        - person.edu_a_this_year
        - person.edu_a_next_year
        - person.edu_refunds
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "3. Total adjustments (add lines 2a, 2b, and 2c)"
    - id: person.edu_adj
      printed: (helper)
      label: 'Adjusted Qualified Education Expenses Worksheet, line 3 for an eligible student: add lines 2a, 2b and 2c'
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.edu_student
            - const: true
          then: person.edu_adj_sum
        - guard:
            op: test
            eq:
            - person.edu_student
            - const: false
          then: person.zero
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "3. Total adjustments (add lines 2a, 2b, and 2c)"
    - id: person.edu_over
      printed: (gate)
      label: An academic period whose tax-free assistance and refunds exceed its expenses paid to the institution
      type: Bool
      gated_by: person.edu_over_if_adj
      expr:
        op: input
        source: Was there an academic period for which the tax-free educational assistance and refunds allocable to it (received
          in 2025, or in 2026 before you file) were more than that period's qualified education expenses paid in 2025 (tuition
          and required fees, and course materials, which for a student who can get the American opportunity credit are those
          needed for a course of study wherever bought, and otherwise those required to be paid to the institution)?
      cite:
        doc: i8863
        locator: p. 4, Tax-free educational assistance, "For tax-free educational assistance received in 2025, reduce the qualified
          education expenses for each academic period by the amount of tax-free educational assistance allocable to that academic
          period."
    - id: person.edu_has_adj
      printed: (helper)
      label: Adjusted qualified education expenses (worksheet line 3) above zero
      type: Bool
      expr:
        op: test
        gt:
        - person.edu_adj
        - const: 0
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "Complete a separate worksheet for each student for each
          academic period beginning or treated as beginning (see below) in 2025 for which you paid (or are treated as having paid)
          qualified education expenses in 2025."
    - id: person.edu_over_if_adj
      printed: (helper)
      label: Adjustments that exceed one academic period's expenses, where adjusted qualified education expenses are above zero
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.edu_has_adj
            - const: true
          then: person.edu_over
        - guard:
            op: test
            eq:
            - person.edu_has_adj
            - const: false
          then: person.edu_no
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "Complete a separate worksheet for each student for each
          academic period beginning or treated as beginning (see below) in 2025 for which you paid (or are treated as having paid)
          qualified education expenses in 2025."
    - id: person.edu_over_refused
      printed: (gate)
      label: Adjustments that exceed one academic period's expenses
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.edu_student
            - const: true
          then: person.edu_over_if_adj
        - guard:
            op: test
            eq:
            - person.edu_student
            - const: false
          then: person.edu_no
      cite:
        doc: i8863
        locator: p. 9, Adjusted Qualified Education Expenses Worksheet, "Complete a separate worksheet for each student for each
          academic period beginning or treated as beginning (see below) in 2025 for which you paid (or are treated as having paid)
          qualified education expenses in 2025."
    - id: person.edu_line23
      printed: '23'
      label: Has the American opportunity credit been claimed for this student for any 4 prior tax years?
      shown_when: person.edu_student
      type: Bool
      expr:
        op: input
        source: Has the American opportunity credit been claimed (by you or anyone else) for this student for any 4 tax years
          before 2025?
      cite:
        doc: f8863
        locator: p. 2, Part III, line 23, "Has the American opportunity credit been claimed for this student for any 4 prior tax
          years?"; i8863 p. 8, Line 23
    - id: person.edu_show24
      printed: (helper)
      label: Line 24 is reached (line 23 did not stop)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - person.edu_student
          - const: true
        - op: test
          eq:
          - person.edu_line23
          - const: false
      cite:
        doc: f8863
        locator: p. 2, Part III, line 23, "Yes—Stop! Go to line 31 for this student."
    - id: person.edu_line24
      printed: '24'
      label: Was the student enrolled at least half-time for at least one academic period that began or is treated as having begun
        in 2025 at an eligible educational institution in a program leading toward a postsecondary degree, certificate, or other
        recognized postsecondary educational credential?
      shown_when: person.edu_show24
      type: Bool
      expr:
        op: input
        source: Was the student enrolled at least half-time (Form 1098-T box 8) for at least one academic period that began in
          2025, or in the first 3 months of 2026 if paid for in 2025, at an eligible educational institution, in a program leading
          toward a postsecondary degree, certificate or other recognized postsecondary educational credential?
      cite:
        doc: f8863
        locator: p. 2, Part III, line 24, "Was the student enrolled at least half-time for at least one academic period that began
          or is treated as having begun in 2025 at an eligible educational institution in a program leading toward a postsecondary
          degree, certificate, or other recognized postsecondary educational credential?"; i8863 p. 8, Line 24
    - id: person.edu_show25
      printed: (helper)
      label: Line 25 is reached (line 24 did not stop)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - person.edu_show24
          - const: true
        - op: test
          eq:
          - person.edu_line24
          - const: true
      cite:
        doc: f8863
        locator: p. 2, Part III, line 24, "No—Stop! Go to line 31 for this student."
