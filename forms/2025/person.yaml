      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.mw_earned_if_paid
            - const: true
          then: person.zero
        - guard:
            op: test
            eq:
            - person.mw_earned_if_paid
            - const: false
          then: person.line8s
      cite:
        doc: i1040gi
        locator: 'p. 42, Step 5, "Enter the Medicaid waiver payment amounts excluded from income on Schedule 1, line 8s, unless you choose to include these amounts in earned income, in which case enter -0-"'
    - id: person.earned_not_w2
