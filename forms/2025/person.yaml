        op: input
        source: 'Your contributions to your traditional IRAs for 2025, made in 2025 or by the due date of your 2025 return not
          counting extensions (April 15, 2026, for most people), and designated for 2025; do not include rollover contributions,
          repayments of qualified reservist distributions, contributions made in 2025 that you deducted for 2024, contributions
