          then: person.mw_business
        - guard:
            op: test
            eq:
            - person.mw_has_1099
            - const: false
          then: person.no
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "If you are a sole proprietor in a business of providing home care services, see the Schedule C instructions for how to report these amounts"'
    - id: person.mw_total
      printed: (helper)
      type: NonNegDollars
      label: "This person's Medicaid waiver payments (in W-2 box 1 and not in box 1)"
      expr:
        op: sum
        of:
        - person.mw_box1_if_mw
        - person.mw_not_box1_if_mw
      cite:
        doc: i1040gi
        locator: 'p. 92, Line 8s, "Nontaxable amount of Medicaid waiver payments included on Form 1040, line 1a or 1d", "If nontaxable payments were reported to you in box 1 of Form(s) W-2, report the amount on Form 1040 or 1040-SR, line 1a"'
    - id: person.mw_paid
      printed: (helper)
      type: Bool
      label: "This person had Medicaid waiver payments"
      expr:
        op: test
        gt:
        - person.mw_total
        - param: sales.zero
      cite:
        doc: i1040gi
        locator: 'p. 92, Line 8s, "Nontaxable amount of Medicaid waiver payments included on Form 1040, line 1a or 1d", "If nontaxable payments were reported to you in box 1 of Form(s) W-2, report the amount on Form 1040 or 1040-SR, line 1a"'
    - id: person.mw_earned
      printed: (helper)
      type: Bool
      gated_by: person.mw_earned_if_paid
      label: "Do you choose to include your nontaxable Medicaid waiver payments in earned income for purposes of claiming a credit or other tax benefit?"
      expr:
        op: input
        source: "Do you choose to count this Medicaid pay as earned income? It is not taxed either way; counting it can raise credits such as the earned income credit."
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "if you choose to include nontaxable payments in earned income for purposes of claiming a credit or other tax benefit", "If you and your spouse both received nontaxable Medicaid waiver payments during the year, you and your spouse can make different choices about including payments in earned income"'
    - id: person.mw_earned_if_paid
      printed: (gate)
      type: Bool
      label: "The choice to count Medicaid waiver payments as earned income (asked only of a person with such payments; otherwise no)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.mw_paid
            - const: true
          then: person.mw_earned
        - guard:
            op: test
            eq:
            - person.mw_paid
            - const: false
          then: person.no
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "if you choose to include nontaxable payments in earned income for purposes of claiming a credit or other tax benefit", "If you and your spouse both received nontaxable Medicaid waiver payments during the year, you and your spouse can make different choices about including payments in earned income"'
    - id: person.mw_other
      printed: (helper)
      type: NonNegDollars
      label: "Medicaid waiver payments not in W-2 box 1 and not on Form 1099 (shown only in box 12 with code II, or on no form)"
      expr:
        op: subtract_floor0
        from: person.mw_not_box1_if_mw
        take: person.mw_1099_if_not_box1
      cite:
        doc: i1040gi
        locator: 'p. 92, Line 8s, "If you did not receive a Form W-2 for nontaxable payments, or you received nontaxable payments that you didn’t report on line 1a, and choose to include nontaxable amounts in earned income for purposes of claiming a credit or other tax benefit, report the amount on Form 1040 or 1040-SR, line 1d"'
    - id: person.mw_other_1d
      printed: (helper)
      type: NonNegDollars
      label: "Medicaid waiver payments not in W-2 box 1 or on Form 1099 that go on line 1d (only when chosen as earned income; otherwise zero)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.mw_earned_if_paid
            - const: true
          then: person.mw_other
        - guard:
            op: test
            eq:
            - person.mw_earned_if_paid
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: 'p. 92, Line 8s, "and choose to include nontaxable amounts in earned income for purposes of claiming a credit or other tax benefit, report the amount on Form 1040 or 1040-SR, line 1d"'
    - id: person.line1d
      printed: (helper)
      type: NonNegDollars
      label: "This person's Medicaid waiver payments on Form 1040 line 1d"
      expr:
        op: sum
        of:
        - person.mw_1099_if_not_box1
        - person.mw_other_1d
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "enter on Form 1040, line 1d, your Medicaid waiver payments reported on Form 1099-MISC or Form 1099-NEC", "Also enter the total of your taxable and nontaxable Medicaid waiver payments that were not reported on Form(s) W-2, or not reported in box 1 of Form(s) W-2, if you choose to include nontaxable payments in earned income"'
      ambiguity: amb.2025.mw_all_nontaxable
      refuses:
      - when: person.mw_1099_over
        form: Medicaid waiver payments on Form 1099 more than the payments not in W-2 box 1
        remedy: The Medicaid pay reported on Form 1099-MISC or 1099-NEC is part of the pay not in box 1 of a W-2, so it cannot be more. Check the two amounts.
        cite:
          doc: i1040gi
          locator: 'p. 24, Line 1d, "If you do not have a separate trade or business of providing these services, enter on Form 1040, line 1d, your Medicaid waiver payments reported on Form 1099-MISC or Form 1099-NEC"'
      - when: person.mw_business_if_1099
        form: Medicaid waiver payments in a home-care business (Schedule C)
        remedy: A sole proprietor in a business of providing home care services reports these payments as the Schedule C instructions say; this tool does not prepare that.
        cite:
          doc: i1040gi
          locator: 'p. 24, Line 1d, "If you are a sole proprietor in a business of providing home care services, see the Schedule C instructions for how to report these amounts"'
    - id: person.line8s
      printed: (helper)
      type: NonNegDollars
      label: "This person's nontaxable Medicaid waiver payments included on Form 1040 line 1a or 1d (Schedule 1 line 8s)"
      expr:
        op: sum
        of:
        - person.mw_box1_if_mw
        - person.line1d
      cite:
        doc: i1040gi
        locator: 'p. 92, Line 8s, "Then, on line 8s, enter the total amount of the nontaxable payments reported on Form 1040 or 1040-SR, line 1a or 1d"'
    - id: person.mw_not_earned
