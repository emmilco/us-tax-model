      expr:
        op: input
        source: "How much of that was reported on a Form 1099-MISC or 1099-NEC? Zero if none."
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "If you do not have a separate trade or business of providing these services, enter on Form 1040, line 1d, your Medicaid waiver payments reported on Form 1099-MISC or Form 1099-NEC"'
    - id: person.mw_1099_if_not_box1
      printed: (gate)
      type: NonNegDollars
      label: "Medicaid waiver payments on Form 1099-MISC or 1099-NEC (asked only when some payments are not in W-2 box 1; otherwise zero)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.mw_has_not_box1
            - const: true
          then: person.mw_1099
        - guard:
            op: test
            eq:
            - person.mw_has_not_box1
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "If you do not have a separate trade or business of providing these services, enter on Form 1040, line 1d, your Medicaid waiver payments reported on Form 1099-MISC or Form 1099-NEC"'
    - id: person.mw_has_1099
      printed: (helper)
      type: Bool
      label: "Medicaid waiver payments on Form 1099-MISC or 1099-NEC are more than zero"
      expr:
        op: test
        gt:
        - person.mw_1099_if_not_box1
        - param: sales.zero
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "If you do not have a separate trade or business of providing these services, enter on Form 1040, line 1d, your Medicaid waiver payments reported on Form 1099-MISC or Form 1099-NEC"'
    - id: person.mw_1099_over
      printed: (gate)
      type: Bool
      label: "The Medicaid waiver payments on Form 1099 are more than the payments not in W-2 box 1"
      expr:
        op: test
        gt:
        - person.mw_1099_if_not_box1
        - person.mw_not_box1_if_mw
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "If you do not have a separate trade or business of providing these services, enter on Form 1040, line 1d, your Medicaid waiver payments reported on Form 1099-MISC or Form 1099-NEC"'
    - id: person.mw_business
      printed: (helper)
      type: Bool
      gated_by: person.mw_business_if_1099
      label: "Do you run a business of providing home care services, as a sole proprietor?"
      expr:
        op: input
        source: "Do you run a business of your own that provides home care? (Its pay belongs on a business schedule, Schedule C.)"
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "If you are a sole proprietor in a business of providing home care services, see the Schedule C instructions for how to report these amounts"'
    - id: person.mw_business_if_1099
      printed: (gate)
      type: Bool
      label: "A home-care business of your own (asked only with Medicaid waiver payments on Form 1099; otherwise no)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.mw_has_1099
