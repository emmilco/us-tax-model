      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "Also enter the total of your taxable and nontaxable Medicaid waiver payments that were not reported on Form(s) W-2, or not reported in box 1 of Form(s) W-2"; p. 92, Line 8s, "Your nontaxable Medicaid waiver payments should be reported to you on Form(s) W-2 in box 12, Code II"'
    - id: person.mw_not_box1_if_mw
      printed: (gate)
      type: NonNegDollars
      label: "Medicaid waiver payments not in W-2 box 1 (asked only when Medicaid waiver payments are reported for the return; otherwise zero)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - scope.medicaid_waiver
            - const: true
          then: person.mw_not_box1
        - guard:
            op: test
            eq:
            - scope.medicaid_waiver
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "Also enter the total of your taxable and nontaxable Medicaid waiver payments that were not reported on Form(s) W-2, or not reported in box 1 of Form(s) W-2"'
    - id: person.mw_has_not_box1
