      cite:
        doc: i1040gi
        locator: 'p. 92, Line 8s, "Nontaxable amount of Medicaid waiver payments included on Form 1040, line 1a or 1d", "If nontaxable payments were reported to you in box 1 of Form(s) W-2, report the amount on Form 1040 or 1040-SR, line 1a"'
    - id: person.mw_box1_if_mw
      printed: (gate)
      type: NonNegDollars
      label: "Medicaid waiver payments in W-2 box 1 (asked only when Medicaid waiver payments are reported for the return; otherwise zero)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - scope.medicaid_waiver
            - const: true
          then: person.mw_box1
        - guard:
            op: test
            eq:
            - scope.medicaid_waiver
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: 'p. 92, Line 8s, "Nontaxable amount of Medicaid waiver payments included on Form 1040, line 1a or 1d", "If nontaxable payments were reported to you in box 1 of Form(s) W-2, report the amount on Form 1040 or 1040-SR, line 1a"'
    - id: person.mw_not_box1
      printed: (helper)
