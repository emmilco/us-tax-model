        form: Excess elective deferrals on Form 8880 line 2
        remedy: Elective deferrals over the limit for the year, and their later distribution, are outside this tool.
        cite:
          doc: iw2w3
          locator: 'p. 20, Box 12—Codes, "Even though the 2025 limit for elective deferrals and designated Roth contributions
            is $23,500"'
    - id: person.sav_prior_joint
      printed: (helper)
      label: Your distributions in 2023 and 2024 from years for which you and your spouse filed a joint return, and in 2026
        before the due date of your 2025 return (a joint return only)
      type: NonNegDollars
      expr:
        op: input
        source: |-
          On a joint return: the distributions you received in 2023 and 2024 in a year for which you and your spouse filed a joint return, plus those you receive in 2026 before the due date of your 2025 return (including extensions), from any of the following; zero if none

          - a traditional or Roth IRA
          - a 401(k), 403(b), governmental 457(b), 501(c)(18)(D), SEP or SIMPLE plan, or the federal TSP
          - another qualified retirement plan

          Do not include:
          - rollovers or trustee-to-trustee transfers
          - in-plan Roth rollovers
          - amounts rolled over or converted to a Roth IRA
          - plan loans treated as distributions
          - distributions of excess contributions or deferrals
          - IRA contributions returned by the due date
          - section 404(k) dividends
          - distributions from a military retirement plan (other than the TSP)
          - distributions from an inherited IRA as a nonspouse beneficiary
      cite:
        doc: f8880
        locator: 'p. 2, Line 4, "If you’re filing a joint return, include both spouses’ amounts in both columns. Exception.
          Don’t include your spouse’s distributions with yours when entering an amount on line 4 if you and your spouse didn’t
          file a joint return for the year the distribution was received"'
      ambiguity: amb.2025.savers_2026_joint
      refuses:
      - when: person.sav_able
        form: ABLE account contributions or distributions on Form 8880 (Pub. 907)
        remedy: Contributions to an ABLE account by its designated beneficiary (line 1) and ABLE distributions (line 4) are outside
          this tool.
        cite:
          doc: f8880
          locator: 'p. 2, What’s New, "See Pub. 907, Tax Highlights for Persons With Disabilities, for more information about
            ABLE accounts"'
    - id: person.sav_prior_other
      printed: (helper)
      label: Your distributions in 2023 and 2024 from years for which you did not file a joint return with your spouse on this
        return (on a return that is not joint, all of your 2023, 2024 and early-2026 distributions)
      type: NonNegDollars
      expr:
        op: input
        source: |-
          The distributions you received in 2023 and 2024 in a year for which you did not file a joint return with your spouse on this return (on a return that is not a joint return: all your distributions in 2023 and 2024, and in 2026 before the due date of your 2025 return, including extensions), from any of the following; zero if none

          - a traditional or Roth IRA
          - a 401(k), 403(b), governmental 457(b), 501(c)(18)(D), SEP or SIMPLE plan, or the federal TSP
          - another qualified retirement plan

          Do not include:
          - rollovers or trustee-to-trustee transfers
          - in-plan Roth rollovers
          - amounts rolled over or converted to a Roth IRA
          - plan loans treated as distributions
          - distributions of excess contributions or deferrals
          - IRA contributions returned by the due date
          - section 404(k) dividends
          - distributions from a military retirement plan (other than the TSP)
          - distributions from an inherited IRA as a nonspouse beneficiary
      cite:
        doc: f8880
        locator: 'p. 2, Line 4, "Enter the total amount of distributions you, and your spouse if filing jointly, received after
          2022 and before the due date of your 2025 return (including extensions)"; "Exception. Don’t include your spouse’s distributions
          with yours when entering an amount on line 4 if you and your spouse didn’t file a joint return for the year the distribution
          was received"'
      refuses:
      - when: person.sav_able
        form: ABLE account contributions or distributions on Form 8880 (Pub. 907)
        remedy: Contributions to an ABLE account by its designated beneficiary (line 1) and ABLE distributions (line 4) are outside
          this tool.
        cite:
          doc: f8880
          locator: 'p. 2, What’s New, "See Pub. 907, Tax Highlights for Persons With Disabilities, for more information about
            ABLE accounts"'
    - id: person.ira_trad
      printed: (helper)
