      label: This person's 2025 HSA excess contributions (Form 8889)
      type: NonNegDollars
      expr:
        op: sum_over
        collection: f8889
        field: f8889.excess_amt
      cite:
        doc: i5329
        locator: p. 8, Line 47, "Enter the excess of your contributions (made by you or on your behalf) to your HSAs for 2025
          from Form 8889, line 2 (unless withdrawn—discussed next), over your contribution limit (Form 8889, line 12)."
    - id: person.senior_work_ssn
      printed: (helper)
      label: Born before January 2, 1961, and has a valid SSN
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.age65
            - const: true
          then: person.work_ssn
        - guard:
            op: test
            eq:
