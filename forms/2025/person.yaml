      - when: person.plan_screened
        form: Retirement plan contributions outside this tool (SARSEP, other plan rates, higher SIMPLE limits, more than one plan,
          a plan with more than one Schedule C, other elective deferrals, Roth contributions, excess contributions)
        remedy: These retirement contributions are outside this tool.
        cite:
          doc: p560
          locator: pp. 8–11, 14–17, 38–40, chapters 2, 3 and 5
    - id: person.sep_rate_c
      printed: (helper)
      label: The plan rate, as cents
      type: NonNegDollars
      expr:
        op: multiply_count
        amount: person.cent
        count: person.sep_rate
      cite:
        doc: p560
        locator: pp. 38–40, chapter 5, Rate Worksheet for Self-Employed, line 1
    - id: person.sep_rate_plus
      printed: (helper)
      label: The plan rate plus 100%, as cents
      type: NonNegDollars
      expr:
        op: sum
        of:
        - person.sep_rate_c
        - person.hundred
      cite:
        doc: p560
        locator: pp. 38–40, chapter 5, Rate Worksheet for Self-Employed, line 2, "Rate in line 1 plus 1"
    - id: person.sep_shown
      printed: (helper)
      label: This person contributed to a SEP IRA for themselves (the SEP deduction worksheet is completed)
      type: Bool
      expr:
        op: test
        eq:
        - person.plan
        - const: sep
      cite:
        doc: p560
        locator: p. 38, chapter 5, "if you are self-employed, you must use the rate table or rate worksheet and deduction
          worksheet to figure your deduction for contributions you made for yourself to a SEP IRA or qualified plan"
    - id: person.sep_s1
      printed: Step 1
      shown_when: person.sep_shown
      label: Net profit from Schedule C, line 31
      type: Dollars
      expr:
        op: copy
        from: person.sc_total
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 1
      refuses:
      - when: person.se_screened
        form: SEP Deduction Worksheet Step 1 with self-employment income not on a Schedule C (Schedule F, Schedule K-1 box 14 code
          A and the other items of the self-employment screen)
        remedy: These self-employment items are outside this tool.
        cite:
          doc: p560
          locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 1, "Enter your net profit from"
    - id: person.sep_s2
      printed: Step 2
      shown_when: person.sep_shown
      label: Deduction for self-employment tax from Schedule 1, line 15
      type: NonNegDollars
      expr:
        op: copy
        from: person.se_line13
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 2 (this person's own Schedule SE, line 13)
    - id: person.sep_s3
      printed: Step 3
      shown_when: person.sep_shown
      label: Net earnings from self-employment. Subtract step 2 from step 1
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.sep_s1
        take: person.sep_s2
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 3
      ambiguity: amb.2025.sep_loss_floor
    - id: person.sep_s5
      printed: Step 5
      shown_when: person.sep_shown
      label: Multiply step 3 by step 4 (the plan rate divided by the plan rate plus 1, to six decimal places)
      type: NonNegDollars
      expr:
        op: prorate
        amount: person.sep_s3
        part: person.sep_rate_c
        whole: person.sep_rate_plus
        places: 6
      cite:
        doc: p560
        locator: pp. 39–40, chapter 5, Deduction Worksheet for Self-Employed, Steps 4 and 5, "Enter your rate from the
          Rate Table for Self-Employed or Rate Worksheet for Self-Employed", "Multiply step 3 by step 4"; p. 38,
          chapter 5, Rate Table for Self-Employed, "If your plan's contribution rate is 10% of a participant's
          compensation, your rate is 0.090909" (amb.2025.sep_rate_places)
      ambiguity: amb.2025.sep_rate_places
    - id: person.comp_limit
      printed: (helper)
      label: $350,000
      type: NonNegDollars
      expr:
        op: param
        ref: ret.comp_limit
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 6, "Multiply $350,000"
    - id: person.sep_s6
      printed: Step 6
      shown_when: person.sep_shown
      label: Multiply $350,000 by your plan contribution rate (not the reduced rate)
      type: NonNegDollars
      expr:
        op: prorate
        amount: person.comp_limit
        part: person.sep_rate_c
        whole: person.hundred
        places: 6
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 6
    - id: person.sep_s7
      printed: Step 7
      shown_when: person.sep_shown
      label: Enter the smaller of step 5 or step 6
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.sep_s5
        - person.sep_s6
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 7
    - id: person.sep_s8
      printed: Step 8
      shown_when: person.sep_shown
      label: Contribution dollar limit
      type: NonNegDollars
      expr:
        op: param
        ref: ret.sep_dollar_limit
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 8, "$70,000"
    - id: person.sep_s21
      printed: Step 21
      shown_when: person.sep_shown
      label: Maximum deductible contribution (the smaller of step 7 or step 8; no elective deferrals)
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.sep_s7
        - person.sep_s8
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 8 note, "Otherwise, skip steps 9 through 20 and enter
          the smaller of step 7 or step 8 on step 21"
    - id: person.sep_excess
      printed: (gate)
      label: The SEP contributions are more than the maximum deductible contribution
      type: Bool
      expr:
        op: test
        gt:
        - person.sep_contrib
        - person.sep_s21
      cite:
        doc: p560
        locator: p. 39, chapter 5, "Enter your actual contribution, not to exceed your maximum deductible
          contribution"; p. 11, chapter 2, Carryover of Excess SEP Contributions, "If you made SEP contributions that
          are more than the deduction limit (nondeductible contributions), you can carry over and deduct the
          difference in later years"
    - id: person.sep_deduction
      printed: (helper)
      label: SEP deduction for yourself
      type: NonNegDollars
      expr:
        op: copy
        from: person.sep_contrib
      cite:
        doc: p560
        locator: p. 39, chapter 5, "Enter your actual contribution, not to exceed your maximum deductible contribution, on Schedule 1
          (Form 1040), line 16"
      refuses:
      - when: person.sep_excess
        form: SEP contributions above the maximum deductible contribution
        remedy: Excess SEP contributions are outside this tool.
        cite:
          doc: p560
          locator: pp. 11, 39, chapter 2, Excess contributions; chapter 5
    - id: person.simple_deferral
      printed: (helper)
      label: Salary reduction contributions for yourself to your SIMPLE IRA (including catch-up)
      type: NonNegDollars
      expr:
        op: input
        source: The salary reduction contributions you made for yourself to your SIMPLE IRA for 2025 (by the due date of the
          return, including extensions), including any catch-up contributions your plan allows
      cite:
        doc: p560
        locator: p. 16, chapter 3, Salary reduction contributions and Catch-up contributions, "A SIMPLE IRA plan can permit
          participants who are age 50 or over at the end of the calendar year to also make catch-up contributions"; p. 17,
          When To Deduct Contributions, "You can deduct contributions for a particular tax year if they are made for that tax
          year and are made by the due date (including extensions) of your federal income tax return for that year"
      refuses:
      - when: person.plan_screened
        form: Retirement plan contributions outside this tool
        remedy: These retirement contributions are outside this tool.
        cite:
          doc: p560
          locator: pp. 8–11, 14–17, 38–40, chapters 2, 3 and 5
    - id: person.simple_age
      printed: (helper)
      label: 'Catch-up eligibility from the year of birth: 64 or older or 50 to 59 age50, 60 to 63 age60_63, under 50 under50; for
        a person born in a year in which only the birth date decides the band, as that person states'
      type: Enum(catchup_age)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            all:
            - op: test
              ge:
              - person.birth_year
              - const: 0
                type: Count
            - op: test
              lt:
              - person.birth_year
              - param: age.cut_64
          then: person.catchup_age50
        - guard:
            op: test
            all:
            - op: test
              ge:
              - person.birth_year
              - param: age.cut_64
            - op: test
              lt:
              - person.birth_year
              - param: age.cut_60
          then: person.simple_age_60_63_years
        - guard:
            op: test
            all:
            - op: test
              ge:
              - person.birth_year
              - param: age.cut_60
            - op: test
              lt:
              - person.birth_year
              - param: age.cut_50
          then: person.simple_age_50_59_years
        - guard:
            op: test
            ge:
            - person.birth_year
            - param: age.cut_50
          then: person.simple_age_under50_years
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.simple_age_60_63_years
      printed: (helper)
      type: Enum(catchup_age)
      label: 'Catch-up band of a person born from the year age.cut_64 up to the year before age.cut_60: 60 to 63, or for a person
        born in the year age.cut_64 as that person states'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.simple_open_year
            - const: true
          then: person.simple_age_if_open_year
        - guard:
            op: test
            eq:
            - person.simple_open_year
            - const: false
          then: person.catchup_age60_63
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.simple_age_50_59_years
      printed: (helper)
      type: Enum(catchup_age)
      label: 'Catch-up band of a person born from the year age.cut_60 up to the year before age.cut_50: 50 to 59, or for a person
        born in the year age.cut_60 as that person states'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.simple_open_year
            - const: true
          then: person.simple_age_if_open_year
        - guard:
            op: test
            eq:
            - person.simple_open_year
            - const: false
          then: person.catchup_age50
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.simple_age_under50_years
      printed: (helper)
      type: Enum(catchup_age)
      label: 'Catch-up band of a person born in the year age.cut_50 or later: under 50, or for a person born in the year age.cut_50
        from that person''s age-50 answer'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.age50_open_year
            - const: true
          then: person.simple_age_from_age50
        - guard:
            op: test
            eq:
            - person.age50_open_year
            - const: false
          then: person.catchup_under50
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.simple_open_year
      printed: (helper)
      type: Bool
      label: Born in 1962 or 1966 (a year in which the birth date decides whether the SIMPLE catch-up age band is 60 to 63)
      expr:
        op: test
        any:
        - op: test
          eq:
          - person.birth_year
          - param: age.cut_64
        - op: test
          eq:
          - person.birth_year
          - param: age.cut_60
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.simple_age_at_year_end
      printed: (helper)
      label: Catch-up eligibility, as stated by a person born in 1962 or 1966
      type: Enum(catchup_age)
      gated_by: person.simple_age_if_open_year
      expr:
        op: input
        source: 'Your age at the end of 2025 for SIMPLE catch-up contributions: under 50 (under50), 50 to 59 or 64 and over (age50),
          or 60, 61, 62 or 63 (age60_63)'
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.simple_age_if_open_year
      printed: (gate)
      type: Enum(catchup_age)
      label: Catch-up eligibility as stated by a person born in 1962 or 1966 (otherwise 50 to 59 or 64 and over; read only for
        those years)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.simple_open_year
            - const: true
          then: person.simple_age_at_year_end
        - guard:
            op: test
            eq:
            - person.simple_open_year
            - const: false
          then: person.catchup_age50
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.simple_age_from_age50
      printed: (helper)
      type: Enum(catchup_age)
      label: Catch-up eligibility of a person born in 1976 (50 or over at the end of 2025 as that person states, otherwise under 50)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.age50_at_year_end_if_open_year
            - const: true
          then: person.catchup_age50
        - guard:
            op: test
            eq:
            - person.age50_at_year_end_if_open_year
            - const: false
          then: person.catchup_under50
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
      ambiguity: amb.2025.ira_age50
    - id: person.catchup_under50
      printed: (helper)
      type: Enum(catchup_age)
      label: Year parameter ret.catchup_under50 (under50)
      expr:
        op: param
        ref: ret.catchup_under50
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.catchup_age50
      printed: (helper)
      type: Enum(catchup_age)
      label: Year parameter ret.catchup_age50 (age50)
      expr:
        op: param
        ref: ret.catchup_age50
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.catchup_age60_63
      printed: (helper)
      type: Enum(catchup_age)
      label: Year parameter ret.catchup_age60_63 (age60_63)
      expr:
        op: param
        ref: ret.catchup_age60_63
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.simple_kind
      printed: (helper)
      label: Employer contribution formula of your SIMPLE IRA plan
      type: Enum(simple_formula)
      expr:
        op: input
        source: 'The employer contribution formula of your SIMPLE IRA plan for 2025: matching contributions (match) or 2% nonelective
          contributions (nonelective)'
      cite:
        doc: p560
        locator: pp. 16–17, chapter 3, Employer matching contributions and Nonelective contributions
    - id: person.simple_employer
      printed: (helper)
      label: Employer contributions for yourself to your SIMPLE IRA
      type: NonNegDollars
      expr:
        op: input
        source: The employer matching or nonelective contributions you made for yourself to your SIMPLE IRA for 2025 (by the due
          date of the return, including extensions)
      cite:
        doc: p560
        locator: pp. 16–17, chapter 3, Employer matching contributions and Nonelective contributions; p. 17, Time limits for
          contributing funds, "You must make matching contributions or nonelective contributions by the due date (including
          extensions) for filing your federal income tax return for the year."
    - id: person.simple_comp
      printed: (helper)
      label: 'Compensation: net earnings from self-employment (Schedule SE, line 4)'
      type: NonNegDollars
      expr:
        op: copy
        from: person.se_line4c
      cite:
        doc: p560
        locator: p. 15, chapter 3, Compensation, "If you are self-employed, compensation is your net earnings from self-employment (line
          4 of Schedule SE (Form 1040)) before subtracting any contributions made to the SIMPLE IRA plan for yourself"
    - id: person.simple_cap
      printed: (helper)
      label: Salary reduction limit
      type: NonNegDollars
      expr:
        op: param
        ref: ret.simple_limit
      cite:
        doc: p560
        locator: p. 16, chapter 3, Salary reduction contributions, "can't be more than $16,500 for 2025"
    - id: person.simple_regular
      printed: (helper)
      label: Salary reduction contributions that are not catch-up contributions
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.simple_deferral
        - person.simple_cap
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "Salary reduction contributions aren't treated as catch-up contributions until
          they exceed $16,500 for 2025"
    - id: person.simple_catchup
      printed: (helper)
      label: Catch-up contributions
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.simple_deferral
        take: person.simple_regular
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions
    - id: person.catchup_limit
      printed: (helper)
      label: Catch-up contribution limit
      type: NonNegDollars
      expr:
        op: keyed_lookup
        table: simple_catchup
        keys:
        - person.simple_age
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "generally $3,500 for 2025" and "the higher limit on catch-up contributions
          ... is $5,250"
    - id: person.comp_after_regular
      printed: (helper)
      label: Compensation less the salary reduction contributions that are not catch-up contributions
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.simple_comp
        take: person.simple_regular
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "The excess of the participant's compensation over the salary reduction contributions
          that aren't catch-up contributions"
    - id: person.catchup_max
      printed: (helper)
      label: Maximum catch-up contribution
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.catchup_limit
        - person.comp_after_regular
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "can't exceed the lesser of the following amounts"
    - id: person.rate3
      printed: (helper)
      label: 3%
      type: Rate
      expr:
        op: param
        ref: ret.match_rate
      cite:
        doc: p560
        locator: p. 16, chapter 3, Employer matching contributions, "up to 3% of the employee's compensation"
    - id: person.rate2
      printed: (helper)
      label: 2%
      type: Rate
      expr:
        op: param
        ref: ret.nonelective_rate
      cite:
        doc: p560
        locator: p. 17, chapter 3, Nonelective contributions, "nonelective contributions of 2% of compensation"
    - id: person.match_3pct
      printed: (helper)
      label: 3% of compensation
      type: NonNegDollars
      expr:
        op: multiply_rate
        amount: person.simple_comp
        rate: person.rate3
      cite:
        doc: p560
        locator: p. 16, chapter 3, Employer matching contributions
    - id: person.deferrals_total
      printed: (helper)
      label: Salary reduction contributions (allowed)
      type: NonNegDollars
      expr:
        op: sum
        of:
        - person.simple_regular
        - person.simple_catchup
      cite:
        doc: p560
        locator: p. 16, chapter 3, Employer matching contributions, "match each employee's salary reduction contribution(s) on a dollar-for-dollar
          basis"
    - id: person.match_max
      printed: (helper)
      label: Maximum matching contribution
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.deferrals_total
        - person.match_3pct
      cite:
        doc: p560
        locator: p. 16, chapter 3, Employer matching contributions
    - id: person.ne_comp
      printed: (helper)
      label: Compensation taken into account (not more than $350,000)
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.simple_comp
        - person.comp_limit
      cite:
        doc: p560
        locator: p. 17, chapter 3, Nonelective contributions, "Only $350,000 of the employee's compensation can be taken into account"
    - id: person.ne_max
      printed: (helper)
      label: Maximum nonelective contribution
      type: NonNegDollars
      expr:
        op: multiply_rate
        amount: person.ne_comp
        rate: person.rate2
      cite:
        doc: p560
        locator: p. 17, chapter 3, Nonelective contributions
    - id: person.employer_max
      printed: (helper)
      label: Maximum employer contribution for the plan's formula
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.simple_kind
            - const: match
          then: person.match_max
        - guard:
            op: test
            eq:
            - person.simple_kind
            - const: nonelective
          then: person.ne_max
      cite:
        doc: p560
        locator: pp. 16–17, chapter 3, Employer matching contributions and Nonelective contributions
    - id: person.simple_excess
      printed: (gate)
      label: Contributions above the SIMPLE limits
      type: Bool
      expr:
        op: test
        any:
        - op: test
          gt:
          - person.simple_catchup
          - person.catchup_max
        - op: test
          gt:
          - person.simple_employer
          - person.employer_max
        - op: test
          gt:
          - person.simple_regular
          - person.simple_comp
      cite:
        doc: p560
        locator: p. 16, chapter 3, Salary reduction contributions, Catch-up contributions and Employer matching contributions
    - id: person.simple_deduction
      printed: (helper)
      label: SIMPLE deduction for yourself
      type: NonNegDollars
      expr:
        op: sum
        of:
        - person.deferrals_total
        - person.simple_employer
      cite:
        doc: p560
        locator: p. 17, chapter 3, Where To Deduct Contributions, "Sole proprietors and partners deduct contributions for themselves
          on line 16 of Schedule 1"
      refuses:
      - when: person.simple_excess
        form: SIMPLE contributions above the limits
        remedy: Excess SIMPLE contributions are outside this tool.
        cite:
          doc: p560
          locator: pp. 14–17, chapter 3
    - id: person.plan_deduction
      printed: (helper)
      label: Self-employed SEP or SIMPLE deduction for this person
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.plan
            - const: none
          then: person.zero
        - guard:
            op: test
            eq:
            - person.plan
            - const: sep
          then: person.sep_deduction
        - guard:
            op: test
            eq:
            - person.plan
            - const: simple
          then: person.simple_deduction
      cite:
        doc: i1040gi
        locator: p. 93, Schedule 1, line 16, Self-Employed SEP, SIMPLE, and Qualified Plans; p560 p. 38, chapter 5,
