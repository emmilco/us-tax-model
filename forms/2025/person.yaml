    - id: person.se_screen
      printed: (screen)
      label: Does any of these apply to this person's self-employment?
      type: Bool
      expr:
        op: input
        source: |-
          Does any of these apply to this person?

          - church employee income (wages from a church or qualified church-controlled organization that elected exemption from social security and Medicare taxes)
          - being a minister, a member of a religious order or a Christian Science practitioner, or having an approved Form 4361 or Form 4029
          - net earnings from self-employment from a partnership (Schedule K-1, box 14, code A) or other self-employment income not on a Schedule C (such as director's fees, fiduciary fees, or fees as a fee-basis state or local government employee)
          - farm income (Schedule F) or Conservation Reserve Program payments
          - electing an optional method (Schedule SE Part II)
          - a chapter 11 bankruptcy case
          - community income on a separate return
          - self-employment income exempt under an international social security agreement or earned as a U.S. citizen employed by a foreign government
      cite:
        doc: i1040sse
        locator: pp. 1-5, Who Must Pay Self-Employment (SE) Tax, Net Earnings From Self-Employment, Instructions for Part II;
          f1040sse lines 1a, 1b and 5a; p. 1, Employees of Churches and Church Organizations, "Church employee income
          is wages you received as an employee (other than as a minister, member of a religious order, or Christian Science
          practitioner) of a church or qualified church-controlled organization that has a certificate in effect electing an
          exemption from employer social security and Medicare taxes."
    - id: person.se_screened
      printed: (gate)
      label: This person's self-employment tax is outside this tool
      type: Bool
      expr:
        op: test
        eq:
        - person.se_screen
        - const: true
      cite:
        doc: i1040sse
        locator: pp. 1-5
    - id: person.se_line2
      printed: (helper)
      label: Schedule SE line 2 for this person
      type: Dollars
      expr:
        op: copy
        from: person.sc_total
      cite:
        doc: f1040sse
        locator: Schedule SE (2025), line 2, "Net profit or (loss) from Schedule C, line 31"
      refuses:
      - when: person.se_screened
        form: Schedule SE items outside this tool (church employee income, clergy, Forms 4361 and 4029, partnership and other
          self-employment income, farm income, optional methods, chapter 11, community income, exempt income, Forms 4137 and 8919)
        remedy: These self-employment tax items are outside this tool.
        cite:
          doc: i1040sse
          locator: pp. 1-5
    - id: person.se_line6
      printed: (helper)
      label: Schedule SE line 6 for this person
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: true
          then:
            def: se
            bind:
              line2: person.se_line2
              line8a: person.wages
              line8b: person.f4137_line10
              line8c: person.f8919_line10
            line: line6
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: false
          then: person.zero
      cite:
        doc: f1040sse
        locator: Schedule SE (2025), line 6, "Add lines 4c and 5b"; i8959 p. 3, Line 8, "Enter your self-employment
          income from Schedule SE (Form 1040), Part I, line 6"
      refuses:
        - when: person.se_rrta
          form: Schedule SE with railroad retirement (tier 1) compensation
          remedy: Schedule SE line 8a adds railroad retirement (tier 1) compensation to the social security wages, and
            this tool does not take railroad compensation. Prepare Schedule SE with the railroad retirement instructions.
          cite:
            doc: f1040sse
            locator: 'Schedule SE (2025), line 8a, "Total social security wages and tips (total of boxes 3 and 7 on Form(s) W-2) and railroad retirement (tier 1) compensation"'
    - id: person.se_line12
