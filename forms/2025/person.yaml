form:
  id: person
  kind: worksheet
  title: Each person on the return — per-person facts and totals (excess Social Security tax, Schedule SE, SEP and SIMPLE plans, health insurance and others)
  tax_year: 2025
  lines:
    - id: person.role
      printed: (helper)
      type: Enum(person_role)
      label: Whose entry is this, yours or your spouse's?
      expr:
        op: input
        source: Whose entry is this, yours (the taxpayer) or your spouse's?
      cite:
        doc: f1040
        locator: "Form 1040 (2025), page 1, \"Your first name and middle initial\" and \"If joint return, spouse’s first name and middle initial\""
    - id: person.one
      printed: (helper)
      type: Count
      label: One entry for this person
      expr:
        op: param
        ref: person.one
      cite:
        doc: f1040
        locator: "Form 1040 (2025), page 1, one entry for you and, if joint return, one for your spouse"
    - id: person.birth_year
      printed: (helper)
      type: Count
      label: The year you were born
      expr:
        op: input
        source: In what year were you born?
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; p. 33, Blindness, "If you weren’t
          totally blind as of December 31, 2025, you must get a statement certified by your eye doctor (ophthalmologist or
          optometrist) that:", "You can''t see better than 20/200 in your better eye with glasses or contact lenses, or",
          "Your field of vision is 20 degrees or less.", "If your eye condition isn’t likely to improve beyond the conditions
          listed above, you can get a statement certified by your eye doctor (ophthalmologist or optometrist) to this effect
          instead." and "You must keep the statement for your records."; p501 p. 23, Not totally blind, "If your vision
          can be corrected beyond these limits only by contact lenses that you can wear only briefly because of pain, infection,
          or ulcers, you can take the higher standard deduction for blindness if you otherwise qualify."'
    - id: person.birth_cut_year
      printed: (helper)
      type: Bool
      label: Born in a year in which a birth on January 1 changes an age test of this return (1961, 2001, 2002, 2007 or 2008)
      expr:
        op: test
        any:
        - op: test
          eq:
          - person.birth_year
          - param: age.cut_65
        - op: test
          eq:
          - person.birth_year
          - param: age.cut_25
        - op: test
          eq:
          - person.birth_year
          - param: age.cut_24
        - op: test
          eq:
          - person.birth_year
          - param: age.cut_19
        - op: test
          eq:
          - person.birth_year
          - param: age.cut_18
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; p. 33, Blindness, "If you weren’t
          totally blind as of December 31, 2025, you must get a statement certified by your eye doctor (ophthalmologist or
          optometrist) that:", "You can''t see better than 20/200 in your better eye with glasses or contact lenses, or",
          "Your field of vision is 20 degrees or less.", "If your eye condition isn’t likely to improve beyond the conditions
          listed above, you can get a statement certified by your eye doctor (ophthalmologist or optometrist) to this effect
          instead." and "You must keep the statement for your records."; p501 p. 23, Not totally blind, "If your vision
          can be corrected beyond these limits only by contact lenses that you can wear only briefly because of pain, infection,
          or ulcers, you can take the higher standard deduction for blindness if you otherwise qualify."'
    - id: person.born_jan1
      printed: (helper)
      type: Bool
      gated_by: person.born_jan1_if_cut_year
      label: Were you born on January 1?
      expr:
        op: input
        source: Were you born on January 1?
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; p. 33, Blindness, "If you weren’t
          totally blind as of December 31, 2025, you must get a statement certified by your eye doctor (ophthalmologist or
          optometrist) that:", "You can''t see better than 20/200 in your better eye with glasses or contact lenses, or",
          "Your field of vision is 20 degrees or less.", "If your eye condition isn’t likely to improve beyond the conditions
          listed above, you can get a statement certified by your eye doctor (ophthalmologist or optometrist) to this effect
          instead." and "You must keep the statement for your records."; p501 p. 23, Not totally blind, "If your vision
          can be corrected beyond these limits only by contact lenses that you can wear only briefly because of pain, infection,
          or ulcers, you can take the higher standard deduction for blindness if you otherwise qualify."'
    - id: person.born_jan1_if_cut_year
      printed: (gate)
      type: Bool
      label: Born on January 1 (asked only of a person born in 1961, 2001, 2002, 2007 or 2008; otherwise no)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.birth_cut_year
            - const: true
          then: person.born_jan1
        - guard:
            op: test
            eq:
            - person.birth_cut_year
            - const: false
          then: person.no
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; p. 33, Blindness, "If you weren’t
          totally blind as of December 31, 2025, you must get a statement certified by your eye doctor (ophthalmologist or
          optometrist) that:", "You can''t see better than 20/200 in your better eye with glasses or contact lenses, or",
          "Your field of vision is 20 degrees or less.", "If your eye condition isn’t likely to improve beyond the conditions
          listed above, you can get a statement certified by your eye doctor (ophthalmologist or optometrist) to this effect
          instead." and "You must keep the statement for your records."; p501 p. 23, Not totally blind, "If your vision
          can be corrected beyond these limits only by contact lenses that you can wear only briefly because of pain, infection,
          or ulcers, you can take the higher standard deduction for blindness if you otherwise qualify."'
    - id: person.birth_year_bad
      printed: (helper)
      type: Bool
      label: The year of birth entered is after the tax year, or more than 125 years before it
      expr:
        op: test
        any:
        - op: test
          gt:
          - person.birth_year
          - param: age.birth_year_latest
        - op: test
          lt:
          - person.birth_year
          - param: age.birth_year_earliest
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"'
    - id: person.age65
      printed: (helper)
      type: Bool
      label: Born before January 2, 1961
      expr:
        op: test
        any:
        - op: test
          lt:
          - person.birth_year
          - param: age.cut_65
        - op: test
          all:
          - op: test
            eq:
            - person.birth_year
            - param: age.cut_65
          - op: test
            eq:
            - person.born_jan1_if_cut_year
            - const: true
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"'
    - id: person.under24
      printed: (helper)
      type: Bool
      label: Under age 24 at the end of 2025 (born after January 1, 2002)
      expr:
        op: test
        any:
        - op: test
          gt:
          - person.birth_year
          - param: age.cut_24
        - op: test
          all:
          - op: test
            eq:
            - person.birth_year
            - param: age.cut_24
          - op: test
            eq:
            - person.born_jan1_if_cut_year
            - const: false
      cite:
        doc: i8615
        locator: 'p. 1, Certain January 1 birthdays, "Use the following chart to determine whether certain children with
          January 1 birthdays meet condition 3 under Who Must File" (a child born on "January 1, 2002" is considered to be
          24 at the end of 2025: "Don’t use Form 8615 for this child.")'
    - id: person.blind
      printed: (helper)
      type: Bool
      label: Were you blind at the end of 2025 (totally blind, or partly blind with a statement certified by your eye doctor)?
      expr:
        op: input
        source: |-
          Were you blind at the end of 2025?

          Answer yes if you were totally blind as of December 31, 2025.

          If you weren't totally blind, answer yes only if you have a statement certified by your eye doctor (ophthalmologist or optometrist) that you can't see better than 20/200 in your better eye with glasses or contact lenses, or that your field of vision is 20 degrees or less (or, if your eye condition isn't likely to improve beyond these conditions, a certified statement to that effect).

          If your vision can be corrected beyond these limits only by contact lenses that you can wear only briefly because of pain, infection or ulcers, those lenses do not count as correcting it: answer yes if you have the certified statement described above.

          Keep the statement for your records.
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; p. 33, Blindness, "If you weren’t
          totally blind as of December 31, 2025, you must get a statement certified by your eye doctor (ophthalmologist or
          optometrist) that:", "You can''t see better than 20/200 in your better eye with glasses or contact lenses, or",
          "Your field of vision is 20 degrees or less.", "If your eye condition isn’t likely to improve beyond the conditions
          listed above, you can get a statement certified by your eye doctor (ophthalmologist or optometrist) to this effect
          instead." and "You must keep the statement for your records."; p501 p. 23, Not totally blind, "If your vision
          can be corrected beyond these limits only by contact lenses that you can wear only briefly because of pain, infection,
          or ulcers, you can take the higher standard deduction for blindness if you otherwise qualify."'
    - id: person.tin
      printed: (helper)
      type: Bool
      label: Do you have an SSN or ITIN issued on or before the due date of your return?
      expr:
        op: input
        source: Do you have an SSN or ITIN issued on or before the due date of your 2025 return (including extensions)? An ITIN that has expired counts only if it has been renewed by then (a renewal only applied for does not count here).
      cite:
        doc: i1040gi
        locator: p. 17, Before you begin, "The other spouse must have either an SSN or ITIN, and it must have been issued on
          or before the due date of the return (including extensions)"; p. 19, Step 5, question 1; p503 p. 3, "If your ITIN wasn’t included on at least one U.S. federal tax return for the last 3 consecutive tax years, it expires on December 31 of the third consecutive tax year, and must be renewed before being used again on a U.S. federal tax return."
    - id: person.itin_applied
      printed: (helper)
      type: Bool
      label: If not, have you applied, or are you applying, for an ITIN, or for the renewal of your expired ITIN, on or before
        the due date of your return?
      expr:
        op: input
        source: If you have neither (or your ITIN has expired and was not renewed), have you applied, or are you applying, for
          an ITIN, or for the renewal of your expired ITIN, on or before the due date of your 2025 return (including extensions)?
          Answer Yes if you are applying with this return, for example by filing Form W-7 with it.
      cite:
        doc: i1040gi
        locator: p. 19, Step 5, question 1, "(Answer 'Yes' if you are applying for an ITIN on or before the return due date
          (including extensions).)"
    - id: person.work_ssn
      printed: (helper)
      type: Bool
      label: Do you have an SSN valid for employment issued before the due date of your return?
      expr:
        op: input
        source: Do you have an SSN valid for employment, issued before the due date of your 2025 return (including extensions)?
          If your card says "Valid for Work Only With DHS Authorization", answer yes only if the DHS authorization is valid.
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 4; p. 104, Valid SSN for No Tax on Tips, "However, if “Valid for Work Only with DHS
          Authorization” is printed on your social security card, your SSN is valid only as long as the DHS authorization
          is valid"; p. 108, Valid SSN, "see Valid SSN for No Tax on Tips, earlier"; p. 110, Valid SSN, "see Valid SSN for No
          Tax on Tips, earlier"
    - id: person.eic_ssn
      printed: (helper)
      type: Bool
      label: Do you have an SSN valid for the EIC, issued on or before the due date of your return?
      expr:
        op: input
        source: Do you have a social security number issued on or before the due date of your 2025 return (including
          extensions) that is valid for the EIC? Any number issued by the Social Security Administration is valid unless
          the card says "Not Valid for Employment" and the number was issued solely to apply for or receive a federally
          funded benefit; a card that says "Valid for Work Only With DHS Authorization" is valid only while the
          authorization is valid.
      cite:
        doc: i1040gi
        locator: 'p. 40, Step 1, question 2; pp. 44–45, Social security number (SSN), "For the EIC, a valid SSN is a number issued by the Social Security Administration unless “Not Valid for Employment” is printed on the social security card and the number was issued solely to allow the recipient of the SSN to apply for or receive a federally funded benefit"'
    - id: person.under16
      printed: (helper)
      type: Bool
      label: Under age 16 at the end of 2025
      expr:
        op: test
        any:
        - op: test
          gt:
          - person.birth_year
          - param: age.cut_16
        - op: test
          all:
          - op: test
            eq:
            - person.birth_year
            - param: age.cut_16
          - op: test
            eq:
            - person.under16_at_year_end_if_open_year
            - const: true
      cite:
        doc: i1040gi
        locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
      ambiguity: amb.2025.filer_under_16
    - id: person.under16_open_year
      printed: (helper)
      type: Bool
      label: Born in 2010
      expr:
        op: test
        eq:
        - person.birth_year
        - param: age.cut_16
      cite:
        doc: i1040gi
        locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
    - id: person.under16_at_year_end
      printed: (helper)
      type: Bool
      gated_by: person.under16_at_year_end_if_open_year
      label: Were you under age 16 at the end of 2025?
      expr:
        op: input
        source: Were you under age 16 at the end of 2025?
      cite:
        doc: i1040gi
        locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
      ambiguity: amb.2025.filer_under_16
    - id: person.under16_at_year_end_if_open_year
      printed: (gate)
      type: Bool
      label: Under age 16 at the end of 2025, as stated by a person born in 2010 (otherwise no)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.under16_open_year
            - const: true
          then: person.under16_at_year_end
        - guard:
            op: test
            eq:
            - person.under16_open_year
            - const: false
          then: person.no
      cite:
        doc: i1040gi
        locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
    - id: person.educator_expenses
      printed: (helper)
      label: Qualified educator expenses you paid in 2025
      type: NonNegDollars
      gated_by: person.educator_expenses_if_educator
      expr:
        op: input
        source: Qualified educator expenses you paid in 2025 (professional development courses you took that are related to
          the curriculum you teach or to the students you teach, and books, supplies, equipment
          (including computer equipment, software and services) and other materials used in the classroom, including personal
          protective equipment, disinfectant and other supplies used to prevent the spread of coronavirus; not expenses for
          home schooling or nonathletic supplies for courses in health or physical education), reduced by excludable savings bond interest (Form 8815), nontaxable qualified
          tuition program or Coverdell earnings or distributions, and reimbursements not reported in box 1 of your Form W-2;
          zero if none
      cite:
        doc: i1040gi
        locator: p. 93, Schedule 1, line 11, Qualified expenses, 'For professional development courses you have taken related
          to the curriculum you teach or to the students you teach', 'equipment (including computer equipment, software, and
          services)', 'for personal protective equipment, disinfectant, and other supplies used for the prevention of the
          spread of coronavirus', and 'You must reduce your qualified expenses by the following amounts'; p. 93, 'Qualified expenses don’t include expenses for home schooling or for nonathletic supplies for courses
          in health or physical education.'
    - id: person.eligible_educator
      printed: (helper)
      label: Were you an eligible educator in 2025 (a kindergarten through grade 12 teacher, instructor, counselor, principal,
        or aide who worked in a school for at least 900 hours during a school year)?
      type: Bool
      expr:
        op: input
        source: Were you an eligible educator in 2025 (a kindergarten through grade 12 teacher, instructor, counselor, principal,
          or aide who worked in a school for at least 900 hours during a school year)?
      cite:
        doc: i1040gi
        locator: p. 93, Schedule 1, line 11, 'An eligible educator is a kindergarten through grade 12 teacher, instructor, counselor,
          principal, or aide who worked in a school for at least 900 hours during a school year'
    - id: person.educator_expenses_if_educator
      printed: (gate)
      type: NonNegDollars
      label: Qualified educator expenses paid in 2025 (asked only of an eligible educator; otherwise zero)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.eligible_educator
            - const: true
          then: person.educator_expenses
        - guard:
            op: test
            eq:
            - person.eligible_educator
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: p. 93, Schedule 1, line 11, Qualified expenses, 'For professional development courses you have taken related
          to the curriculum you teach or to the students you teach', 'equipment (including computer equipment, software, and
          services)', 'for personal protective equipment, disinfectant, and other supplies used for the prevention of the
          spread of coronavirus', and 'You must reduce your qualified expenses by the following amounts'; p. 93, 'Qualified expenses don’t include expenses for home schooling or for nonathletic supplies for courses
          in health or physical education.'
    - id: person.eic_age25
      printed: (helper)
      type: Bool
      label: Born before January 2, 2001
      expr:
        op: test
        any:
        - op: test
          lt:
          - person.birth_year
          - param: age.cut_25
        - op: test
          all:
          - op: test
            eq:
            - person.birth_year
            - param: age.cut_25
          - op: test
            eq:
            - person.born_jan1_if_cut_year
            - const: true
      cite:
        doc: i1040gi
        locator: p. 41, Step 4, question 2, "Check 'Yes' if you ... were born after December 31, 1960, and before January 2,
          2001"
    - id: person.eic_under65
      printed: (helper)
      type: Bool
      label: Born after December 31, 1960
      expr:
        op: test
        ge:
        - person.birth_year
        - param: age.cut_65
      cite:
        doc: i1040gi
        locator: p. 41, Step 4, question 2, "Check 'Yes' if you ... were born after December 31, 1960, and before January 2,
          2001"
    - id: person.age65_box
      printed: (helper)
      label: Born before January 2, 1961, and not a person who died in 2025 before reaching 65 (a box checked for age)
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.age65
            - const: true
          then: person.not_died_before_65
        - guard:
            op: test
            eq:
            - person.age65
            - const: false
          then: person.no
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before January
          2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; pp. 34–35, Standard Deduction Chart for People
          Who Were Born Before January 2, 1961, or Were Blind
    - id: person.not_died_before_65
      printed: (helper)
      label: Not a person who died in 2025 before reaching 65
      type: Bool
      expr:
        op: test
        eq:
        - person.died_before_65
        - const: false
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before January
          2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; pp. 34–35, Standard Deduction Chart for People
          Who Were Born Before January 2, 1961, or Were Blind
    - id: person.tin_or_itin_applied
      printed: (helper)
      label: An SSN or ITIN, or applied for an ITIN
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.tin
            - const: true
          then: person.tin
        - guard:
            op: test
            eq:
            - person.tin
            - const: false
          then: person.itin_applied
      cite:
        doc: i1040gi
        locator: p. 17, Before you begin, "If you want to claim the credit for other dependents, you, and your spouse if filing
          jointly, must have either an SSN or ITIN"; p. 19, Step 5, question 1, "(Answer 'Yes' if you are applying for an ITIN
          on or before the return due date (including extensions).)"
    - id: person.work_ssn_or_tin
      printed: (helper)
      label: An SSN valid for employment, or an SSN or ITIN
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.tin
            - const: true
          then: person.tin
        - guard:
            op: test
            eq:
            - person.tin
            - const: false
          then: person.work_ssn
      cite:
        doc: i1040gi
        locator: p. 17, Before you begin, "The other spouse must have either an SSN or ITIN"
    - id: person.turned_65_this_year
      printed: (helper)
      type: Bool
      label: Born in 1960, or on January 1, 1961 (a person whose 65th birthday, or the day before it, fell in 2025)
      expr:
        op: test
        any:
        - op: test
          eq:
          - person.birth_year
          - param: age.turning_65
        - op: test
          all:
          - op: test
            eq:
            - person.birth_year
            - param: age.cut_65
          - op: test
            eq:
            - person.born_jan1_if_cut_year
            - const: true
      cite:
        doc: i1040gi
        locator: p. 110, Schedule 1-A, Part V, "Death of a taxpayer in 2025"
    - id: person.died_before_65
      printed: (helper)
      label: The final return of a person who died in 2025 before reaching age 65 (asked only of a person born in 1960, or on January 1, 1961; otherwise no)
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.turned_65_this_year
            - const: true
          then: person.died_at_64
        - guard:
            op: test
            eq:
            - person.turned_65_this_year
            - const: false
          then: person.no
      cite:
        doc: i1040gi
        locator: p. 110, Schedule 1-A, Part V, "Death of a taxpayer in 2025"
    - id: person.died_at_64
      printed: (helper)
      type: Bool
      gated_by: person.died_before_65
      label: Did this person die in 2025 before reaching age 65?
      expr:
        op: input
        source: Did you die in 2025 before reaching age 65? (A person reaches age 65 on the day before the 65th birthday.)
      cite:
        doc: i1040gi
        locator: p. 110, Schedule 1-A, Part V, "Death of a taxpayer in 2025"
    - id: person.educator_max
      printed: (helper)
      type: NonNegDollars
      label: Year parameter s1.educator_max ($300)
      expr:
        op: param
        ref: s1.educator_max
      cite:
        doc: i1040gi
        locator: 'p. 93, Schedule 1, line 11, "If you and your spouse are filing jointly and both of you were eligible educators, the maximum deduction is $600. However, neither spouse can deduct more than $300 of their qualified expenses"'
    - id: person.has_educator_expenses
      printed: (helper)
      type: Bool
      label: Any qualified educator expenses for this person
      expr:
        op: test
        gt:
        - person.educator_expenses_if_educator
        - param: sales.zero
      cite:
        doc: i1040gi
        locator: 'p. 93, Schedule 1, line 11'
    - id: person.educator_limited
      printed: (helper)
      type: NonNegDollars
      label: This person's qualified educator expenses, up to $300
      expr:
        op: smaller_of
        of:
        - person.educator_expenses_if_educator
        - person.educator_max
      cite:
        doc: i1040gi
        locator: 'p. 93, Schedule 1, line 11, "If you and your spouse are filing jointly and both of you were eligible educators, the maximum deduction is $600. However, neither spouse can deduct more than $300 of their qualified expenses"'
    - id: person.educator_eligible_amount
      printed: (helper)
