      label: Value of your HSAs on December 31, 2025 (including 2025 contributions made in 2026)
      type: NonNegDollars
      expr:
        op: input
        source: Total value of your HSAs on December 31, 2025, including contributions for 2025 that you made in 2026 (asked only
          when you have excess HSA contributions)
      cite:
        doc: f5329
        locator: p. 2, Part VII, line 49, "Additional tax. Enter 6% (0.06) of the smaller of line 48 or the value of your HSAs
          on December 31, 2025 (including 2025 contributions made in 2026)."
    - id: person.x_hsa_excess
