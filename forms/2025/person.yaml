form:
  id: person
  kind: worksheet
  title: Each person on the return — per-person facts and totals (excess Social Security tax, Schedule SE, SEP and SIMPLE plans, health insurance and others)
  tax_year: 2025
  lines:
    - id: person.role
      printed: (helper)
      type: Enum(person_role)
      label: Whose entry is this, yours or your spouse's?
      expr:
        op: input
        source: Whose entry is this, yours (the taxpayer) or your spouse's?
      cite:
        doc: f1040
        locator: "Form 1040 (2025), page 1, \"Your first name and middle initial\" and \"If joint return, spouse’s first name and middle initial\""
    - id: person.one
      printed: (helper)
      type: Count
      label: One entry for this person
      expr:
        op: param
        ref: person.one
      cite:
        doc: f1040
        locator: "Form 1040 (2025), page 1, one entry for you and, if joint return, one for your spouse"
    - id: person.age65
      printed: (helper)
      type: Bool
      label: Were you born before January 2, 1961?
      expr:
        op: input
        source: Were you born before January 2, 1961?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: person.blind
      printed: (helper)
      type: Bool
      label: Are you blind under the standard-deduction instructions?
      expr:
        op: input
        source: Are you blind under the standard-deduction instructions?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: person.tin
      printed: (helper)
      type: Bool
      label: Do you have an SSN or ITIN issued on or before the due date of your return?
      expr:
        op: input
        source: Do you have an SSN or ITIN issued on or before the due date of your 2025 return (including extensions)?
      cite:
        doc: i1040gi
        locator: p. 17, Before you begin, "The other spouse must have either an SSN or ITIN, and it must have been issued on
          or before the due date of the return (including extensions)"; p. 19, Step 5, question 1
    - id: person.itin_applied
      printed: (helper)
      type: Bool
      label: If not, have you applied for an ITIN on or before the due date of your return?
      expr:
        op: input
        source: If you have neither, have you applied for an ITIN on or before the due date of your 2025 return (including
          extensions)?
      cite:
        doc: i1040gi
        locator: p. 19, Step 5, question 1, "(Answer 'Yes' if you are applying for an ITIN on or before the return due date
          (including extensions).)"
    - id: person.work_ssn
      printed: (helper)
      type: Bool
      label: Do you have an SSN valid for employment issued before the due date of your return?
      expr:
        op: input
        source: Do you have an SSN valid for employment, issued before the due date of your 2025 return (including extensions)?
      cite:
        doc: i1040gi
        locator: p. 18, Step 3, question 4
    - id: person.educator_expenses
      printed: (helper)
      label: Qualified educator expenses you paid in 2025
      type: NonNegDollars
      expr:
        op: input
        source: Qualified educator expenses you paid in 2025 (professional development courses, and books, supplies, equipment
          and other materials used in the classroom), reduced by excludable savings bond interest (Form 8815), nontaxable qualified
          tuition program or Coverdell earnings or distributions, and reimbursements not reported in box 1 of your Form W-2;
          zero if none
      cite:
        doc: i1040gi
        locator: p. 93, Schedule 1, line 11, Qualified expenses and 'You must reduce your qualified expenses by the following
          amounts'
    - id: person.eligible_educator
      printed: (helper)
      label: Were you an eligible educator in 2025 (a kindergarten through grade 12 teacher, instructor, counselor, principal,
        or aide who worked in a school for at least 900 hours during a school year)?
      type: Bool
      expr:
        op: input
        source: Were you an eligible educator in 2025 (a kindergarten through grade 12 teacher, instructor, counselor, principal,
          or aide who worked in a school for at least 900 hours during a school year)?
      cite:
        doc: i1040gi
        locator: p. 93, Schedule 1, line 11, 'An eligible educator is a kindergarten through grade 12 teacher, instructor, counselor,
          principal, or aide who worked in a school for at least 900 hours during a school year'
    - id: person.born_before_2001
      printed: (helper)
      type: Bool
      label: Were you born before January 2, 2001?
      expr:
        op: input
        source: Were you born before January 2, 2001?
      cite:
        doc: i1040gi
        locator: p. 41, Step 4, question 2, "Check 'Yes' if you ... were born after December 31, 1960, and before January 2,
          2001"
    - id: person.born_after_1960
      printed: (helper)
      type: Bool
      label: Were you born after December 31, 1960?
      expr:
        op: input
        source: Were you born after December 31, 1960?
      cite:
        doc: i1040gi
        locator: p. 41, Step 4, question 2, "Check 'Yes' if you ... were born after December 31, 1960, and before January 2,
          2001"
    - id: person.died_before_65
      printed: (helper)
      label: Is this the final return of a person born between January 2, 1960, and January 1, 1961, who died in 2025 before
        reaching age 65?
      type: Bool
      expr:
        op: input
        source: Is this the final return of a person born between January 2, 1960, and January 1, 1961, who died in 2025 before
          reaching age 65? (A person reaches age 65 on the day before the 65th birthday.)
      cite:
        doc: i1040gi
        locator: p. 110, Schedule 1-A, Part V, "Death of a taxpayer in 2025"
    - id: person.educator_max
      printed: (helper)
      type: NonNegDollars
      label: Year parameter s1.educator_max ($300)
      expr:
        op: param
        ref: s1.educator_max
      cite:
        doc: i1040gi
        locator: 'p. 93, Schedule 1, line 11, "If you and your spouse are filing jointly and both of you were eligible educators, the maximum deduction is $600. However, neither spouse can deduct more than $300 of their qualified expenses"'
    - id: person.has_educator_expenses
      printed: (helper)
      type: Bool
      label: Any qualified educator expenses for this person
      expr:
        op: test
        gt:
        - person.educator_expenses
        - param: sales.zero
      cite:
        doc: i1040gi
        locator: 'p. 93, Schedule 1, line 11'
    - id: person.educator_limited
      printed: (helper)
      type: NonNegDollars
      label: This person's qualified educator expenses, up to $300
      expr:
        op: smaller_of
        of:
        - person.educator_expenses
        - person.educator_max
      cite:
        doc: i1040gi
        locator: 'p. 93, Schedule 1, line 11, "If you and your spouse are filing jointly and both of you were eligible educators, the maximum deduction is $600. However, neither spouse can deduct more than $300 of their qualified expenses"'
    - id: person.educator_eligible_amount
      printed: (helper)
      type: NonNegDollars
      label: This person's qualified educator expenses up to $300 if an eligible educator, else zero
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.eligible_educator
            - const: true
          then: person.educator_limited
        - guard:
            op: test
            eq:
            - person.eligible_educator
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: 'p. 93, Schedule 1, line 11, "If you were an eligible educator in 2025, you can deduct on line 11 up to $300 of qualified expenses you paid in 2025"; "If you and your spouse are filing jointly and both of you were eligible educators, the maximum deduction is $600. However, neither spouse can deduct more than $300 of their qualified expenses"'
    - id: person.educator_deduction
      printed: (helper)
      type: NonNegDollars
      label: This person's educator expense deduction
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.has_educator_expenses
            - const: true
          then: person.educator_eligible_amount
        - guard:
            op: test
            eq:
            - person.has_educator_expenses
            - const: false
          then: person.zero
      cite:
        doc: i1040gi
        locator: 'p. 93, Schedule 1, line 11, "If you were an eligible educator in 2025, you can deduct on line 11 up to $300 of qualified expenses you paid in 2025"; "If you and your spouse are filing jointly and both of you were eligible educators, the maximum deduction is $600. However, neither spouse can deduct more than $300 of their qualified expenses"'
    - id: person.hsa_forms
      printed: (helper)
      type: Count
      label: Number of Forms 8889 entered for this person
      expr:
        op: sum_over
        collection: f8889
        field: f8889.one
      cite:
        doc: i8889
        locator: 'p. 4, Name and social security number (SSN), "complete a separate Form 8889 for each of you"'
    - id: person.hsa_repeated
      printed: (gate)
      type: Bool
      label: More than one Form 8889 entered for this person
      expr:
        op: test
        gt:
        - person.hsa_forms
        - const: 1
          type: Count
      cite:
        doc: i8889
        locator: 'p. 4, Name and social security number (SSN), "complete a separate Form 8889 for each of you"'
    - id: person.hsa_split
      printed: (helper)
      type: Count
      label: 'This persons Form 8889 uses the spouse rule of line 6'
      expr:
        op: sum_over
        collection: f8889
        field: f8889.one
        where:
          op: test
          eq:
          - f8889.split
          - const: true
      cite:
        doc: i8889
        locator: 'p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during 2025; Steps 1 to 3'
    - id: person.hsa_agreed
      printed: (helper)
      type: Count
      label: 'This persons Form 8889 uses an agreed allocation under the spouse rule of line 6'
      expr:
        op: sum_over
        collection: f8889
        field: f8889.one
        where:
          op: test
          all:
          - op: test
            eq:
            - f8889.split
            - const: true
          - op: test
            eq:
            - f8889.allocation
            - const: agreed
      cite:
        doc: i8889
        locator: 'p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during 2025; Steps 1 to 3'
    - id: person.hsa_step1
      printed: (helper)
      type: NonNegDollars
      label: 'This persons Step 1 limit under the spouse rule of line 6'
      expr:
        op: sum_over
        collection: f8889
        field: f8889.step1
        where:
          op: test
          eq:
          - f8889.split
          - const: true
      cite:
        doc: i8889
        locator: 'p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during 2025; Steps 1 to 3'
    - id: person.hsa_share
      printed: (helper)
      type: NonNegDollars
      label: 'This persons part of the Step 1 limit under the spouse rule of line 6'
      expr:
        op: sum_over
        collection: f8889
        field: f8889.share_raw
        where:
          op: test
          eq:
          - f8889.split
          - const: true
      cite:
        doc: i8889
        locator: 'p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during 2025; Steps 1 to 3'
    - id: person.hsa_deduction
      printed: (helper)
      type: NonNegDollars
      label: Form 8889 line 13 for this person
      expr:
        op: sum_over
        collection: f8889
        field: f8889.line13
      cite:
        doc: i8889
        locator: 'p. 4, "Combine the amounts on line 13 of both Forms 8889 and enter this amount on Schedule 1 (Form 1040),
          line 13"'
      refuses:
        - when: person.hsa_repeated
          form: More than one Form 8889 for one person
          remedy: Enter one Form 8889 per person, combining all of that person's own HSAs on it. A separate Form 8889 for
            each HSA (with a controlling Form 8889) is required only for an inherited HSA, which is outside this tool.
          cite:
            doc: i8889
            locator: p. 3, "If, during the tax year, you are the beneficiary of two or more HSAs or you are a beneficiary of
              an HSA and you have your own HSA, you must complete a separate Form 8889 for each HSA"
    - id: person.hsa_taxable
      printed: (helper)
      type: NonNegDollars
      label: Form 8889 line 16 for this person
      expr:
        op: sum_over
        collection: f8889
        field: f8889.line16
      cite:
        doc: f8889
        locator: 'Form 8889 (2025), Part II, "If you are filing jointly and both you and your spouse each have separate HSAs,
          complete a separate Part II for each spouse"; line 16'
    - id: person.hsa_addtax
      printed: (helper)
      type: NonNegDollars
      label: Form 8889 line 17b for this person
      expr:
        op: sum_over
        collection: f8889
        field: f8889.line17b
      cite:
        doc: f8889
        locator: Form 8889 (2025), line 17b, "Also, include this amount in the total on Schedule 2 (Form 1040), Part II, line
          17c"
    - id: person.tip_employers
      printed: (helper)
      type: Count
      label: Number of employers that paid this person qualified tips
      expr:
        op: sum_over
        collection: tipjob
        field: tipjob.one
      cite:
        doc: i1040gi
        locator: p. 104, Schedule 1-A, line 4c
    - id: person.tip_total
      printed: (helper)
      type: NonNegDollars
      label: This person's worksheet column (d) total
      expr:
        op: sum_over
        collection: tipjob
        field: tipjob.col_d
      cite:
        doc: i1040gi
        locator: p. 104, Qualified Tips From More Than One Employer Worksheet, line 2
    - id: person.tip_reported
      printed: (helper)
      type: NonNegDollars
      label: This person's worksheet column (b) total
      expr:
        op: sum_over
        collection: tipjob
        field: tipjob.amount
      cite:
        doc: i1040gi
        locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (b)
    - id: person.ot_employers
      printed: (helper)
      type: Count
      label: Number of employers that paid this person qualified overtime compensation
      expr:
        op: sum_over
        collection: otjob
        field: otjob.one
      cite:
        doc: i1040gi
        locator: p. 108, Schedule 1-A, line 14a, and the Qualified Overtime Compensation From More Than One Employer Worksheet
    - id: person.ot_total
      printed: (helper)
      type: NonNegDollars
      label: This person's overtime worksheet column (b) total
      expr:
        op: sum_over
        collection: otjob
        field: otjob.col_b
      cite:
        doc: i1040gi
        locator: p. 108, Schedule 1-A, line 14a, and the Qualified Overtime Compensation From More Than One Employer Worksheet, line 2
    - id: person.rrta
      printed: rrta
      label: 'Do any wage statements report railroad retirement compensation or taxes (W-2 box 14), or did you file Form CT-2 as an employee representative?'
      type: Bool
      expr:
        op: input
        source: 'Do any wage statements report railroad retirement compensation or taxes (W-2 box 14), or did you file Form CT-2 as an employee representative?'
      cite:
        doc: iw2w3
        locator: "pp. 12–13, Railroad employers: RRTA compensation and taxes in box 14; boxes 3–7 are not
          used for RRTA"
    - id: person.sc_rrta_count
      printed: (helper)
      label: Number of this person's Schedules C while this person has railroad retirement compensation
      type: Count
      expr:
        op: sum_over
        collection: sc
        field: sc.one
        where:
          op: test
          eq:
          - sc.rrta
          - const: true
      cite:
        doc: f1040sse
        locator: 'Schedule SE (2025), line 8a, "Total social security wages and tips (total of boxes 3 and 7 on Form(s) W-2) and railroad retirement (tier 1) compensation"'
    - id: person.se_rrta
      printed: (gate)
      label: Self-employment and railroad retirement compensation together
      type: Bool
      expr:
        op: test
        gt:
        - person.sc_rrta_count
        - const: 0
          type: Count
      note: Counted through the person's Schedules C, so the railroad question is asked only of a person with a business.
      cite:
        doc: f1040sse
        locator: 'Schedule SE (2025), line 8a, "Total social security wages and tips (total of boxes 3 and 7 on Form(s) W-2) and railroad retirement (tier 1) compensation"'
    - id: person.employers
      printed: employers
      label: Total w2.one for this person
      type: Count
      expr:
        op: sum_over
        collection: w2
        field: w2.one
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: person.overcount
      printed: overcount
      label: Number of employers that withheld more than the limit
      type: Count
      expr:
        op: sum_over
        collection: w2
        field: w2.one
        where:
          op: test
          eq:
            - w2.over
            - const: true
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: person.over
      printed: over
      label: Any employer withheld more than the limit
      type: Bool
      expr:
        op: test
        gt:
          - person.overcount
          - const: 0
            type: Count
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: person.wages
      printed: wages
      label: Total w2.wages for this person
      type: NonNegDollars
      expr:
        op: sum_over
        collection: w2
        field: w2.wages
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
      ambiguity: amb.2025.ss_wages
    - id: person.withheld
      printed: withheld
      label: Total w2.box4 for this person
      type: NonNegDollars
      expr:
        op: sum_over
        collection: w2
        field: w2.box4
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: person.box1
      printed: (helper)
      label: Total W-2 box 1 for this person
      type: NonNegDollars
      expr:
        op: sum_over
        collection: w2
        field: w2.box1
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 1a
    - id: person.box2
      printed: (helper)
      label: Total W-2 box 2 for this person
      type: NonNegDollars
      expr:
        op: sum_over
        collection: w2
        field: w2.box2
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 25a
    - id: person.eligible
      printed: eligible
      label: More than one employer and total social security wages over $176,100
      type: Bool
      expr:
        op: test
        all:
          - op: test
            gt:
              - person.employers
              - const: 1
                type: Count
          - op: test
            gt:
              - person.wages
              - param: ss.base
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: person.excess
      printed: excess
      label: Withholding above $10,918.20, if any
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.withheld
        take:
          param: ss.limit
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: person.zero
      printed: zero
      label: No excess credit
      type: NonNegDollars
      expr:
        op: param
        ref: ss.zero
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: person.credit
      printed: credit
      label: Excess social security tax withheld, figured separately for this person
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - person.eligible
                - const: true
            then: person.excess
          - guard:
              op: test
              eq:
                - person.eligible
                - const: false
            then: person.zero
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
      refuses:
        - when: person.rrta
          form: Schedule 3 line 11 (RRTA path)
          remedy: This stage handles Social Security only. Use the railroad retirement instructions; excess
            Tier 2 tax uses Form 843 rather than Form 1040.
          cite:
            doc: i1040gi
            locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
        - when: person.over
          form: Form 843
          remedy: An employer withheld more than $10,918.20. Ask that employer to adjust the tax. If the
            employer does not adjust the overcollection, you can file a refund claim using Form 843.
            This tool cannot complete the credit until the overcollection is resolved.
          cite:
            doc: i1040gi
            locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: person.medicare5
      printed: (helper)
      type: NonNegDollars
      label: Total W-2 box 5 for this person
      expr:
        op: sum_over
        collection: w2
        field: w2.box5
      cite:
        doc: f8959
        locator: Form 8959 (2025), lines 1–24; i8959 pp. 1–3
      refuses:
        - when: person.rrta
          form: Form 8959 RRTA computation
          remedy: RRTA compensation is outside the supported wage-only path.
          cite:
            doc: f8959
            locator: Form 8959 (2025), lines 1–24; i8959 pp. 1–3
    - id: person.medicare6
      printed: (helper)
      type: NonNegDollars
      label: Total W-2 box 6 for this person
      expr:
        op: sum_over
        collection: w2
        field: w2.box6
      cite:
        doc: f8959
        locator: Form 8959 (2025), lines 1–24; i8959 pp. 1–3
      refuses:
        - when: person.rrta
          form: Form 8959 RRTA computation
          remedy: RRTA compensation is outside the supported wage-only path.
          cite:
            doc: f8959
            locator: Form 8959 (2025), lines 1–24; i8959 pp. 1–3
    - id: person.sc_count
      printed: (helper)
      label: Number of Schedules C for this person
      type: Count
      expr:
        op: sum_over
        collection: sc
        field: sc.one
      cite:
        doc: i1040sc
        locator: p. 14, Line 31; i4562 p. 4, Part I
    - id: person.ho_count
      printed: (helper)
      label: Number of this person's Schedules C that claim the business use of the home
      type: Count
      expr:
        op: sum_over
        collection: sc
        field: sc.one
        where:
          op: test
          eq:
          - sc.ho_uses
          - const: true
      cite:
        doc: i1040sc
        locator: p. 10, Simplified method, "You are limited to a maximum of 300 square feet for all of the businesses you conduct
          in your home that qualify for this deduction"
    - id: person.mq_q4
      printed: (helper)
      label: Mid-quarter test basis, fourth quarter, this person
      type: NonNegDollars
      expr:
        op: sum_over
        collection: sc
        field: sc.mq_q4
      cite:
        doc: i1040sc
        locator: p. 14, Line 31; i4562 p. 4, Part I
    - id: person.mq_total
      printed: (helper)
      label: Mid-quarter test basis, 2025, this person
      type: NonNegDollars
      expr:
        op: sum_over
        collection: sc
        field: sc.mq_total
      cite:
        doc: i1040sc
        locator: p. 14, Line 31; i4562 p. 4, Part I
    - id: person.cost179
      printed: (helper)
      label: Cost of section 179 property, this person
      type: NonNegDollars
      expr:
        op: sum_over
        collection: sc
        field: sc.cost179
      cite:
        doc: i1040sc
        locator: p. 14, Line 31; i4562 p. 4, Part I
    - id: person.s179_nonlisted
      printed: (helper)
      label: Section 179 elected, other than listed property, this person
      type: NonNegDollars
      expr:
        op: sum_over
        collection: sc
        field: sc.f6
      cite:
        doc: i1040sc
        locator: p. 14, Line 31; i4562 p. 4, Part I
    - id: person.s179_listed
      printed: (helper)
      label: Section 179 elected on listed property, this person
      type: NonNegDollars
      expr:
        op: sum_over
        collection: sc
        field: sc.f29
      cite:
        doc: i1040sc
        locator: p. 14, Line 31; i4562 p. 4, Part I
    - id: person.income179
      printed: (helper)
      label: Business net profit or loss without section 179, this person
      type: Dollars
      expr:
        op: sum_over
        collection: sc
        field: sc.line31_pre179
      cite:
        doc: i1040sc
        locator: p. 14, Line 31; i4562 p. 4, Part I
    - id: person.has_sc
      printed: (helper)
      label: This person has at least one Schedule C
      type: Bool
      expr:
        op: test
        gt:
        - person.sc_count
        - const: 0
          type: Count
      cite:
        doc: i1040sse
        locator: p. 1, Who Must File Schedule SE; p. 2, Joint Returns, "If both spouses have self-employment income, each must
          file a separate Schedule SE"
    - id: person.sc_total
      printed: (helper)
      label: This person's Schedule C net profit or loss (all businesses)
      type: Dollars
      expr:
        op: sum_over
        collection: sc
        field: sc.result
      cite:
        doc: i1040sse
        locator: p. 2, More Than One Business, "Figure the combined SE tax on one Schedule SE"
    - id: person.se_screen
      printed: (screen)
      label: Does any of these apply to this person's self-employment?
      type: Bool
      expr:
        op: input
        source: 'Does any of these apply to this person: church employee income (wages from a church that elected exemption from
          social security and Medicare taxes); being a minister, a member of a religious order or a Christian Science practitioner,
          or having an approved Form 4361 or Form 4029; net earnings from self-employment from a partnership (Schedule K-1, box
          14, code A) or other self-employment income not on a Schedule C (such as director''s fees, fiduciary fees, or fees as
          a fee-basis state or local government employee); farm income (Schedule F) or Conservation Reserve Program payments;
          electing an optional method (Schedule SE Part II); a chapter 11 bankruptcy case; community income on a separate return;
          self-employment income exempt under an international social security agreement or earned as a U.S. citizen employed
          by a foreign government; or tips reported on Form 4137 or wages on Form 8919?'
      cite:
        doc: i1040sse
        locator: pp. 1-5, Who Must Pay Self-Employment (SE) Tax, Net Earnings From Self-Employment, Instructions for Part II;
          f1040sse lines 1a, 1b, 5a, 8b and 8c
    - id: person.se_screened
      printed: (gate)
      label: This person's self-employment tax is outside this tool
      type: Bool
      expr:
        op: test
        eq:
        - person.se_screen
        - const: true
      cite:
        doc: i1040sse
        locator: pp. 1-5
    - id: person.se_line2
      printed: (helper)
      label: Schedule SE line 2 for this person
      type: Dollars
      expr:
        op: copy
        from: person.sc_total
      cite:
        doc: f1040sse
        locator: Schedule SE (2025), line 2, "Net profit or (loss) from Schedule C, line 31"
      refuses:
      - when: person.se_screened
        form: Schedule SE items outside this tool (church employee income, clergy, Forms 4361 and 4029, partnership and other
          self-employment income, farm income, optional methods, chapter 11, community income, exempt income, Forms 4137 and 8919)
        remedy: These self-employment tax items are outside this tool.
        cite:
          doc: i1040sse
          locator: pp. 1-5
    - id: person.se_line6
      printed: (helper)
      label: Schedule SE line 6 for this person
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: true
          then:
            def: se
            bind:
              line2: person.se_line2
              line8a: person.wages
            line: line6
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: false
          then: person.zero
      cite:
        doc: f1040sse
        locator: Schedule SE (2025), line 6; i8959 Line 8, "Schedule SE, line 6"
      refuses:
        - when: person.se_rrta
          form: Schedule SE with railroad retirement (tier 1) compensation
          remedy: Schedule SE line 8a adds railroad retirement (tier 1) compensation to the social security wages, and
            this tool does not take railroad compensation. Prepare Schedule SE with the railroad retirement instructions.
          cite:
            doc: f1040sse
            locator: 'Schedule SE (2025), line 8a, "Total social security wages and tips (total of boxes 3 and 7 on Form(s) W-2) and railroad retirement (tier 1) compensation"'
    - id: person.se_line12
      printed: (helper)
      label: Schedule SE line 12 (self-employment tax) for this person
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: true
          then:
            def: se
            bind:
              line2: person.se_line2
              line8a: person.wages
            line: line12
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: false
          then: person.zero
      cite:
        doc: f1040sse
        locator: Schedule SE (2025), line 12, "Enter here and on Schedule 2 (Form 1040), line 4"
      refuses:
        - when: person.se_rrta
          form: Schedule SE with railroad retirement (tier 1) compensation
          remedy: Schedule SE line 8a adds railroad retirement (tier 1) compensation to the social security wages, and
            this tool does not take railroad compensation. Prepare Schedule SE with the railroad retirement instructions.
          cite:
            doc: f1040sse
            locator: 'Schedule SE (2025), line 8a, "Total social security wages and tips (total of boxes 3 and 7 on Form(s) W-2) and railroad retirement (tier 1) compensation"'
    - id: person.se_line13
      printed: (helper)
      label: Schedule SE line 13 (deduction for one-half of self-employment tax) for this person
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: true
          then:
            def: se
            bind:
              line2: person.se_line2
              line8a: person.wages
            line: line13
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: false
          then: person.zero
      cite:
        doc: f1040sse
        locator: Schedule SE (2025), line 13, "Enter here and on Schedule 1 (Form 1040), line 15"
      refuses:
        - when: person.se_rrta
          form: Schedule SE with railroad retirement (tier 1) compensation
          remedy: Schedule SE line 8a adds railroad retirement (tier 1) compensation to the social security wages, and
            this tool does not take railroad compensation. Prepare Schedule SE with the railroad retirement instructions.
          cite:
            doc: f1040sse
            locator: 'Schedule SE (2025), line 8a, "Total social security wages and tips (total of boxes 3 and 7 on Form(s) W-2) and railroad retirement (tier 1) compensation"'
    - id: person.se_line4c
      printed: (helper)
      label: Schedule SE line 4c for this person
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: true
          then:
            def: se
            bind:
              line2: person.se_line2
              line8a: person.wages
            line: line4c
        - guard:
            op: test
            eq:
            - person.has_sc
            - const: false
          then: person.zero
      cite:
        doc: f1040sse
        locator: Schedule SE (2025), line 4c
      refuses:
        - when: person.se_rrta
          form: Schedule SE with railroad retirement (tier 1) compensation
          remedy: Schedule SE line 8a adds railroad retirement (tier 1) compensation to the social security wages, and
            this tool does not take railroad compensation. Prepare Schedule SE with the railroad retirement instructions.
          cite:
            doc: f1040sse
            locator: 'Schedule SE (2025), line 8a, "Total social security wages and tips (total of boxes 3 and 7 on Form(s) W-2) and railroad retirement (tier 1) compensation"'
    - id: person.plan
      printed: (helper)
      label: Retirement plan of this self-employed person
      type: Enum(retire_plan)
      expr:
        op: input
        source: Did you (this person) contribute for yourself, as a self-employed person, to a SEP IRA (sep) or a SIMPLE IRA (simple)
          for 2025, or to neither (none)?
      cite:
        doc: p560
        locator: pp. 8–11, 14–17, chapter 2, Simplified Employee Pension (SEP); chapter 3, SIMPLE IRA Plan; i1040gi Schedule 1, line 16
    - id: person.plan_screen
      printed: (screen)
      label: Does any of these apply to this person's retirement contributions?
      type: Bool
      expr:
        op: input
        source: 'Does any of these apply: a SARSEP; a SEP plan whose contribution rate is not a whole percentage or is more than
          25%; a SIMPLE IRA plan of an employer that allows the higher contribution limits of section 117 of the SECURE 2.0 Act;
          contributions for yourself to more than one plan, or to a qualified plan (such as a solo 401(k)); salary reduction contributions
          or elective deferrals to any other plan in 2025 (such as a 401(k) or 403(b) through an employer); Roth SEP or Roth SIMPLE
          contributions; or contributions that are more than the maximum deductible amount?'
      cite:
        doc: p560
        locator: pp. 11, 16, 38, chapter 2, Salary Reduction Simplified Employee Pension (SARSEP); chapter 3, Salary reduction contributions;
          chapter 5, Caution, "apply only to self-employed individuals who have only one defined contribution plan"
    - id: person.plan_screened
      printed: (gate)
      label: This person's retirement contributions are outside this tool (screened, or a plan with more than one Schedule C)
      type: Bool
      expr:
        op: test
        any:
        - op: test
          eq:
          - person.plan_screen
          - const: true
        - op: test
          all:
          - op: test
            not:
              op: test
              eq:
              - person.plan
              - const: none
          - op: test
            gt:
            - person.sc_count
            - const: 1
              type: Count
      cite:
        doc: p560
        locator: 'pp. 8–11, 14–17, 38–40, chapters 2, 3 and 5; p. 7, "If you have more than one business, but only one has a retirement plan, only the earned income from that business is considered for that plan"'
    - id: person.cent
      printed: (helper)
      label: One cent
      type: NonNegDollars
      expr:
        op: param
        ref: sc.one_cent
      cite:
        doc: p560
        locator: pp. 38–40, chapter 5, Rate Table for Self-Employed
    - id: person.hundred
      printed: (helper)
      label: 100%, as cents
      type: NonNegDollars
      expr:
        op: param
        ref: sc.hundred_cents
      cite:
        doc: p560
        locator: pp. 38–40, chapter 5, Rate Worksheet for Self-Employed, "Rate in line 1 plus 1"
    - id: person.sep_rate
      printed: (helper)
      label: Plan contribution rate (whole percent)
      type: Count
      expr:
        op: input
        source: The contribution rate stated in your SEP plan, as a whole percent (for example 10)
      cite:
        doc: p560
        locator: pp. 38–40, chapter 5, Rate Table for Self-Employed, "find your plan contribution rate (the contribution rate stated in your
          plan)"
    - id: person.sep_contrib
      printed: (helper)
      label: Contributions to your own SEP IRA for 2025
      type: NonNegDollars
      expr:
        op: input
        source: The contributions you made for yourself to your SEP IRA for 2025 (by the due date of the return, including extensions)
      cite:
        doc: p560
        locator: 'pp. 11, 39, chapter 2, Deduction Limit for Self-Employed Individuals; chapter 5, Deduction Worksheet for Self-Employed,
          "Next: Enter your actual contribution"'
      refuses:
      - when: person.plan_screened
        form: Retirement plan contributions outside this tool (SARSEP, other plan rates, higher SIMPLE limits, more than one plan,
          a plan with more than one Schedule C, other elective deferrals, Roth contributions, excess contributions)
        remedy: These retirement contributions are outside this tool.
        cite:
          doc: p560
          locator: pp. 8–11, 14–17, 38–40, chapters 2, 3 and 5
    - id: person.sep_rate_c
      printed: (helper)
      label: The plan rate, as cents
      type: NonNegDollars
      expr:
        op: multiply_count
        amount: person.cent
        count: person.sep_rate
      cite:
        doc: p560
        locator: pp. 38–40, chapter 5, Rate Worksheet for Self-Employed, line 1
    - id: person.sep_rate_plus
      printed: (helper)
      label: The plan rate plus 100%, as cents
      type: NonNegDollars
      expr:
        op: sum
        of:
        - person.sep_rate_c
        - person.hundred
      cite:
        doc: p560
        locator: pp. 38–40, chapter 5, Rate Worksheet for Self-Employed, line 2, "Rate in line 1 plus 1"
    - id: person.sep_s1
      printed: Step 1
      label: Net profit from Schedule C, line 31
      type: Dollars
      expr:
        op: copy
        from: person.sc_total
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 1
    - id: person.sep_s2
      printed: Step 2
      label: Deduction for self-employment tax from Schedule 1, line 15
      type: NonNegDollars
      expr:
        op: copy
        from: person.se_line13
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 2 (this person's own Schedule SE, line 13)
    - id: person.sep_s3
      printed: Step 3
      label: Net earnings from self-employment. Subtract step 2 from step 1
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.sep_s1
        take: person.sep_s2
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 3
    - id: person.sep_s5
      printed: Step 5
      label: Multiply step 3 by step 4 (the plan rate divided by the plan rate plus 1, to six decimal places)
      type: NonNegDollars
      expr:
        op: prorate
        amount: person.sep_s3
        part: person.sep_rate_c
        whole: person.sep_rate_plus
        places: 6
      cite:
        doc: p560
        locator: pp. 39–40, chapter 5, Deduction Worksheet for Self-Employed, Steps 4 and 5; Rate Table for Self-Employed (for example 10%
          gives 0.090909) (amb.2025.sep_rate_places)
    - id: person.comp_limit
      printed: (helper)
      label: $350,000
      type: NonNegDollars
      expr:
        op: param
        ref: ret.comp_limit
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 6, "Multiply $350,000"
    - id: person.sep_s6
      printed: Step 6
      label: Multiply $350,000 by your plan contribution rate (not the reduced rate)
      type: NonNegDollars
      expr:
        op: prorate
        amount: person.comp_limit
        part: person.sep_rate_c
        whole: person.hundred
        places: 6
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 6
    - id: person.sep_s7
      printed: Step 7
      label: Enter the smaller of step 5 or step 6
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.sep_s5
        - person.sep_s6
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 7
    - id: person.sep_s8
      printed: Step 8
      label: Contribution dollar limit
      type: NonNegDollars
      expr:
        op: param
        ref: ret.sep_dollar_limit
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 8, "$70,000"
    - id: person.sep_s21
      printed: Step 21
      label: Maximum deductible contribution (the smaller of step 7 or step 8; no elective deferrals)
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.sep_s7
        - person.sep_s8
      cite:
        doc: p560
        locator: p. 39, chapter 5, Deduction Worksheet for Self-Employed, Step 8 note, "Otherwise, skip steps 9 through 20 and enter
          the smaller of step 7 or step 8 on step 21"
    - id: person.sep_excess
      printed: (gate)
      label: The SEP contributions are more than the maximum deductible contribution
      type: Bool
      expr:
        op: test
        gt:
        - person.sep_contrib
        - person.sep_s21
      cite:
        doc: p560
        locator: p. 39, chapter 5, "Enter your actual contribution, not to exceed your maximum deductible contribution"; chapter 2, Excess
          contributions
    - id: person.sep_deduction
      printed: (helper)
      label: SEP deduction for yourself
      type: NonNegDollars
      expr:
        op: copy
        from: person.sep_contrib
      cite:
        doc: p560
        locator: p. 39, chapter 5, "Enter your actual contribution, not to exceed your maximum deductible contribution, on Schedule 1
          (Form 1040), line 16"
      refuses:
      - when: person.sep_excess
        form: SEP contributions above the maximum deductible contribution
        remedy: Excess SEP contributions are outside this tool.
        cite:
          doc: p560
          locator: pp. 11, 39, chapter 2, Excess contributions; chapter 5
    - id: person.simple_deferral
      printed: (helper)
      label: Salary reduction contributions for yourself to your SIMPLE IRA (including catch-up)
      type: NonNegDollars
      expr:
        op: input
        source: The salary reduction contributions you made for yourself to your SIMPLE IRA for 2025, including any catch-up contributions
      cite:
        doc: p560
        locator: p. 16, chapter 3, Salary reduction contributions and Catch-up contributions
      refuses:
      - when: person.plan_screened
        form: Retirement plan contributions outside this tool
        remedy: These retirement contributions are outside this tool.
        cite:
          doc: p560
          locator: pp. 8–11, 14–17, 38–40, chapters 2, 3 and 5
    - id: person.simple_age
      printed: (helper)
      label: Catch-up eligibility
      type: Enum(catchup_age)
      expr:
        op: input
        source: 'Your age at the end of 2025 for SIMPLE catch-up contributions: under 50 (under50), 50 to 59 or 64 and over (age50),
          or 60, 61, 62 or 63 (age60_63)'
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "age 50 or over at the end of the calendar year" and "in a tax year in which
          they attain age 60, 61, 62, or 63"
    - id: person.simple_kind
      printed: (helper)
      label: Employer contribution formula of your SIMPLE IRA plan
      type: Enum(simple_formula)
      expr:
        op: input
        source: 'The employer contribution formula of your SIMPLE IRA plan for 2025: matching contributions (match) or 2% nonelective
          contributions (nonelective)'
      cite:
        doc: p560
        locator: pp. 16–17, chapter 3, Employer matching contributions and Nonelective contributions
    - id: person.simple_employer
      printed: (helper)
      label: Employer contributions for yourself to your SIMPLE IRA
      type: NonNegDollars
      expr:
        op: input
        source: The employer matching or nonelective contributions you made for yourself to your SIMPLE IRA for 2025
      cite:
        doc: p560
        locator: pp. 16–17, chapter 3, Employer matching contributions and Nonelective contributions
    - id: person.simple_comp
      printed: (helper)
      label: 'Compensation: net earnings from self-employment (Schedule SE, line 4)'
      type: NonNegDollars
      expr:
        op: copy
        from: person.se_line4c
      cite:
        doc: p560
        locator: p. 15, chapter 3, Compensation, "If you are self-employed, compensation is your net earnings from self-employment (line
          4 of Schedule SE (Form 1040)) before subtracting any contributions made to the SIMPLE IRA plan for yourself"
    - id: person.simple_cap
      printed: (helper)
      label: Salary reduction limit
      type: NonNegDollars
      expr:
        op: param
        ref: ret.simple_limit
      cite:
        doc: p560
        locator: p. 16, chapter 3, Salary reduction contributions, "can't be more than $16,500 for 2025"
    - id: person.simple_regular
      printed: (helper)
      label: Salary reduction contributions that are not catch-up contributions
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.simple_deferral
        - person.simple_cap
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "Salary reduction contributions aren't treated as catch-up contributions until
          they exceed $16,500 for 2025"
    - id: person.simple_catchup
      printed: (helper)
      label: Catch-up contributions
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.simple_deferral
        take: person.simple_regular
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions
    - id: person.catchup_limit
      printed: (helper)
      label: Catch-up contribution limit
      type: NonNegDollars
      expr:
        op: keyed_lookup
        table: simple_catchup
        keys:
        - person.simple_age
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "generally $3,500 for 2025" and "the higher limit on catch-up contributions
          ... is $5,250"
    - id: person.comp_after_regular
      printed: (helper)
      label: Compensation less the salary reduction contributions that are not catch-up contributions
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: person.simple_comp
        take: person.simple_regular
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "The excess of the participant's compensation over the salary reduction contributions
          that aren't catch-up contributions"
    - id: person.catchup_max
      printed: (helper)
      label: Maximum catch-up contribution
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.catchup_limit
        - person.comp_after_regular
      cite:
        doc: p560
        locator: p. 16, chapter 3, Catch-up contributions, "can't exceed the lesser of the following amounts"
    - id: person.rate3
      printed: (helper)
      label: 3%
      type: Rate
      expr:
        op: param
        ref: ret.match_rate
      cite:
        doc: p560
        locator: p. 16, chapter 3, Employer matching contributions, "up to 3% of the employee's compensation"
    - id: person.rate2
      printed: (helper)
      label: 2%
      type: Rate
      expr:
        op: param
        ref: ret.nonelective_rate
      cite:
        doc: p560
        locator: p. 17, chapter 3, Nonelective contributions, "nonelective contributions of 2% of compensation"
    - id: person.match_3pct
      printed: (helper)
      label: 3% of compensation
      type: NonNegDollars
      expr:
        op: multiply_rate
        amount: person.simple_comp
        rate: person.rate3
      cite:
        doc: p560
        locator: p. 16, chapter 3, Employer matching contributions
    - id: person.deferrals_total
      printed: (helper)
      label: Salary reduction contributions (allowed)
      type: NonNegDollars
      expr:
        op: sum
        of:
        - person.simple_regular
        - person.simple_catchup
      cite:
        doc: p560
        locator: p. 16, chapter 3, Employer matching contributions, "match each employee's salary reduction contribution(s) on a dollar-for-dollar
          basis"
    - id: person.match_max
      printed: (helper)
      label: Maximum matching contribution
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.deferrals_total
        - person.match_3pct
      cite:
        doc: p560
        locator: p. 16, chapter 3, Employer matching contributions
    - id: person.ne_comp
      printed: (helper)
      label: Compensation taken into account (not more than $350,000)
      type: NonNegDollars
      expr:
        op: smaller_of
        of:
        - person.simple_comp
        - person.comp_limit
      cite:
        doc: p560
        locator: p. 17, chapter 3, Nonelective contributions, "Only $350,000 of the employee's compensation can be taken into account"
    - id: person.ne_max
      printed: (helper)
      label: Maximum nonelective contribution
      type: NonNegDollars
      expr:
        op: multiply_rate
        amount: person.ne_comp
        rate: person.rate2
      cite:
        doc: p560
        locator: p. 17, chapter 3, Nonelective contributions
    - id: person.employer_max
      printed: (helper)
      label: Maximum employer contribution for the plan's formula
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.simple_kind
            - const: match
          then: person.match_max
        - guard:
            op: test
            eq:
            - person.simple_kind
            - const: nonelective
          then: person.ne_max
      cite:
        doc: p560
        locator: pp. 16–17, chapter 3, Employer matching contributions and Nonelective contributions
    - id: person.simple_excess
      printed: (gate)
      label: Contributions above the SIMPLE limits
      type: Bool
      expr:
        op: test
        any:
        - op: test
          gt:
          - person.simple_catchup
          - person.catchup_max
        - op: test
          gt:
          - person.simple_employer
          - person.employer_max
        - op: test
          gt:
          - person.simple_regular
          - person.simple_comp
      cite:
        doc: p560
        locator: p. 16, chapter 3, Salary reduction contributions, Catch-up contributions and Employer matching contributions
    - id: person.simple_deduction
      printed: (helper)
      label: SIMPLE deduction for yourself
      type: NonNegDollars
      expr:
        op: sum
        of:
        - person.deferrals_total
        - person.simple_employer
      cite:
        doc: p560
