    - id: person.rmd_missed_if_possible
      printed: (gate)
      type: Bool
      label: A required minimum distribution not received in full by its deadline (asked only of a person born in 1952 or earlier or with an inherited account; otherwise no)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - person.rmd_possible
            - const: true
          then: person.rmd_missed
        - guard:
            op: test
            eq:
            - person.rmd_possible
            - const: false
          then: person.no
      cite:
        doc: f5329
        locator: 'p. 1, Part II, "Complete this part if you included an amount in income, on Schedule 1 (Form 1040), line 8z, from
