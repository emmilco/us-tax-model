form:
  id: f8889
  kind: form
  title: Form 8889 — Health Savings Accounts (Parts I and II)
  tax_year: 2025
  note: Part I for one person, with the spouse rules of lines 6 and 7 on a joint return, with the Line 3 Limitation Chart and Worksheet and the last-month rule; Part II
    (distributions), with the additional 20% tax on the part not excepted. Part III, Archer MSAs, qualified HSA funding distributions,
    excess contributions, deemed distributions and inherited HSAs are refused.
  lines:
  - id: f8889.one
    printed: (helper)
    label: One Form 8889
    type: Count
    expr:
      op: param
      ref: person.one
    cite:
      doc: i8889
      locator: 'p. 4, Name and social security number (SSN), "complete a separate Form 8889 for each of you"'
  - id: f8889.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), lines 4, 7 and 10
  - id: f8889.line2
    printed: '2'
    label: HSA contributions you made for 2025 (or those made on your behalf), including those made by the unextended due
      date of your tax return that were for 2025. Do not include employer contributions, contributions through a cafeteria
      plan, or rollovers
    type: NonNegDollars
    expr:
      op: input
      source: HSA contributions you made for 2025 (or those made on your behalf), including those made by April 15, 2026 that
        were for 2025; do not include employer contributions, payroll contributions through a cafeteria plan, rollovers, or
        qualified HSA funding distributions; zero if none
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 2; i8889 p. 4, Line 2
  - id: f8889.line9
    printed: '9'
    label: Employer contributions made to your HSAs for 2025
    type: NonNegDollars
    expr:
      op: input
      source: Employer contributions to your HSAs for 2025, including payroll contributions through a cafeteria plan (Form
        W-2 box 12, code W, less employer contributions for 2024 included there, plus employer contributions for 2025 made
        in 2026); zero if none
    cite:
      doc: i8889
      locator: p. 7, Line 9 Employer Contributions and the Employer Contribution Worksheet
  - id: f8889.any
    printed: (helper)
    label: Any HSA contributions for 2025 (yours or your employer's)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        gt:
        - f8889.line2
        - param: sales.zero
      - op: test
        gt:
        - f8889.line9
        - param: sales.zero
    cite:
      doc: i8889
      locator: pp. 1-2, Who Must File (you or your employer made contributions to your HSA for 2025)
  - id: f8889.unsupported
    printed: (helper)
    label: 'Any of these: a qualified HSA funding distribution from an IRA in 2025; contributions to an Archer MSA for 2025 (Form 8853), or, if you or your spouse had family coverage at any time during 2025, to your spouse''s Archer MSA; excess
      HSA contributions from an earlier year that remain in your HSA; failing to remain an eligible individual during a testing
      period that began in an earlier year; an HSA you acquired because of the account beneficiary''s death; the HSA of a person who died in 2025 whose
      estate is the beneficiary; a deemed distribution
      (a prohibited transaction, or an HSA used as security for a loan); a withdrawal of excess contributions or their earnings (made in 2025, or in 2026 by the due date of your 2025 return, including extensions);
      or a mistaken distribution you repaid?'
    type: Bool
    expr:
      op: input
      source: 'Any of these: a qualified HSA funding distribution from an IRA in 2025; contributions by you or your employer to
        an Archer MSA for 2025 (Form 8853), or, if you or your spouse had family coverage under an HDHP at any time during 2025, to your spouse''s Archer MSA; excess HSA contributions from an earlier year that remain in your HSA; failing
        to remain an eligible individual during a testing period that began in an earlier year (last-month rule or qualified
        HSA funding distribution); an HSA you acquired because of the account beneficiary''s death; the HSA of a person who
        died in 2025 whose estate is the beneficiary (its value at death is included on the final return); a deemed distribution
        from an HSA in 2025 (a prohibited transaction, or any part of an HSA used as security for a loan); a withdrawal of
        excess contributions or their earnings, made in 2025 or in 2026 by the due date of your 2025 return, including extensions; or a mistaken distribution you repaid to your HSA?'
    cite:
      doc: i8889
      locator: Parts II and III, line 4 (Archer MSAs), line 10 (qualified HSA funding distributions), line 13 (Prior Year
        Excess Contributions), line 14b (excess contributions withdrawn), Lines 17a and 17b (mistaken distributions), Death
        of HSA Account Beneficiary, and Deemed Distributions From HSAs
  - id: f8889.mfs
    printed: (gate)
    label: 'Married filing separately'
    type: Bool
    expr:
      op: test
      eq:
      - f1040.status
      - const: mfs
    cite:
      doc: i1040gi
      locator: 'p. 14, Married Filing Separately'
  - id: f8889.months_eligible
    printed: (helper)
    label: Number of months of 2025 on the first day of which you were an eligible individual
    type: Count
    expr:
      op: input
      source: Number of months of 2025 on the first day of which you were an eligible individual (covered by a high-deductible
        health plan, with no other disqualifying health coverage, not enrolled in Medicare, and not able to be claimed as
        a dependent on someone else's 2025 return); 0 to 12
    cite:
      doc: i8889
      locator: pp. 2 and 6, Eligible Individual and the Line 3 Limitation Chart and Worksheet ('Were you an eligible individual
        ... on the first day of the month?')
  - id: f8889.months_family
    printed: (helper)
    label: Of those eligible months, the number in which you had or were treated as having family HDHP coverage
    type: Count
    expr:
      op: input
      source: Of those eligible months, the number in which you had or were treated as having family high-deductible health
        plan coverage on the first day of the month; 0 to the number of eligible months. If you and your spouse were both
        eligible individuals for a month and either of you had family HDHP coverage, count that month as family coverage
        for both of you and disregard either spouse's self-only plan. Count the actual eligible months here; the separate
        last-month-rule question determines whether December 1 coverage is treated as applying throughout the year.
    cite:
      doc: i8889
      locator: p. 4, How To Complete Part I and Line 3 rule 1 (both eligible spouses are treated as having family coverage
        if either has a family HDHP); p. 6, Line 3 Limitation Chart and Worksheet, monthly coverage
  - id: f8889.bad_months
    printed: (helper)
    label: The month counts or the December 1 coverage are impossible (more than 12 eligible months, more family months
      than eligible months, or a December 1 coverage the month counts cannot include)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        gt:
        - f8889.months_eligible
        - const: 12
          type: Count
      - op: test
        gt:
        - f8889.months_family
        - f8889.months_eligible
      - op: test
        all:
        - op: test
          eq:
          - f8889.dec_coverage
          - const: self_only
        - op: test
          eq:
          - f8889.months_family
          - f8889.months_eligible
      - op: test
        all:
        - op: test
          eq:
          - f8889.dec_coverage
          - const: family
        - op: test
          eq:
          - f8889.months_family
          - const: 0
            type: Count
      - op: test
        all:
        - op: test
          ne:
          - f8889.dec_coverage
          - const: none
        - op: test
          eq:
          - f8889.months_eligible
          - const: 0
            type: Count
      - op: test
        all:
        - op: test
          eq:
          - f8889.dec_coverage
          - const: none
        - op: test
          eq:
          - f8889.months_eligible
          - const: 12
            type: Count
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet (twelve months of 2025, each counted on the first day of the month,
        December 1 among them)
  - id: f8889.age55
    printed: (helper)
    label: Were you age 55 or older at the end of 2025?
    type: Bool
    expr:
      op: input
      source: Were you age 55 or older at the end of 2025?
    cite:
      doc: i8889
      locator: p. 4, Line 3, rule 6, and p. 6, Line 3 Limitation Chart
  - id: f8889.twelve
    printed: (helper)
    label: 'Twelve months'
    type: Count
    expr:
      op: param
      ref: hsa.year_months
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 2'
  - id: f8889.married_family
    printed: (helper)
    label: 'Married at the end of 2025 and treated as having family coverage at any time during 2025'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - household.married
        - const: true
      - op: test
        any:
        - op: test
          all:
          - op: test
            eq:
            - f8889.use_last_month
            - const: true
          - op: test
            eq:
            - f8889.dec_coverage
            - const: family
        - op: test
          all:
          - op: test
            eq:
            - f8889.use_last_month
            - const: false
          - op: test
            gt:
            - f8889.months_family
            - const: 0
              type: Count
    cite:
      doc: i8889
      locator: 'p. 5, Line 3, "Note. If you are married and had family coverage at any time during the year, the additional contribution amount is figured on line 7 and is not included on line 3"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.age55_line3
    printed: (helper)
    label: 'Age 55 or older and the additional contribution amount is included on line 3 (unmarried, or married without family coverage)'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8889.age55
        - const: true
      - op: test
        eq:
        - f8889.married_family
        - const: false
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 6, "If, at the end of 2025, you were age 55 or older and unmarried or married with self-only HDHP coverage for the entire year, you can increase the amount determined in (3) or (4) by $1,000"; p. 5, Line 3, "Note. If you are married and had family coverage at any time during the year, the additional contribution amount is figured on line 7 and is not included on line 3"'
  - id: f8889.self_amount
    printed: (helper)
    label: Line 3 chart amount for a month of self-only coverage ($4,300; $5,300 if age 55 or older at the end of 2025)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.age55_line3
          - const: true
        then: f8889.self_55
      - guard:
          op: test
          eq:
          - f8889.age55_line3
          - const: false
        then: f8889.self_under55
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, 'Enter $4,300 on the line below for the month. If you were age 55 or older at
        the end of 2025, enter $5,300 for the month'
  - id: f8889.self_under55
    printed: (helper)
    label: Year parameter hsa.self_only ($4,300)
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.self_only
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, $4,300
  - id: f8889.self_55
    printed: (helper)
    label: Year parameter hsa.self_only_55 ($5,300)
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.self_only_55
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, $5,300
  - id: f8889.age55_unmarried
    printed: (helper)
    label: Unmarried and age 55 or older at the end of 2025
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8889.age55
        - const: true
      - op: test
        eq:
        - household.married
        - const: false
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, 'If, at the end of 2025, you were unmarried and age 55 or older, enter $9,550
        for the month'
  - id: f8889.family_amount
    printed: (helper)
    label: Line 3 chart amount for a month of family coverage ($8,550; $9,550 if unmarried and age 55 or older at the end
      of 2025)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.age55_unmarried
          - const: true
        then: f8889.family_55
      - guard:
          op: test
          eq:
          - f8889.age55_unmarried
          - const: false
        then: f8889.family_under55
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, 'Enter $8,550 on the line below for the month. If, at the end of 2025, you were
        unmarried and age 55 or older, enter $9,550 for the month'
  - id: f8889.family_under55
    printed: (helper)
    label: Year parameter hsa.family ($8,550)
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.family
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, $8,550
  - id: f8889.family_55
    printed: (helper)
    label: Year parameter hsa.family_55 ($9,550)
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.family_55
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, $9,550
  - id: f8889.family_extra
    printed: (helper)
    label: Family monthly amount less the self-only monthly amount
    type: Dollars
    expr:
      op: subtract
      from: f8889.family_amount
      take: f8889.self_amount
    cite:
      doc: i8889
      locator: 'p. 6, Line 3 Limitation Chart and Worksheet (each family month enters the family amount: the self-only amount
        plus this difference)'
  - id: f8889.chart_self
    printed: (helper)
    label: The self-only monthly amount for every eligible month
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.self_amount
      count: f8889.months_eligible
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet, the monthly amounts
  - id: f8889.chart_family
    printed: (helper)
    label: The family difference for every month of family coverage
    type: Dollars
    expr:
      op: multiply_count
      amount: f8889.family_extra
      count: f8889.months_family
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet, the monthly amounts
  - id: f8889.chart_total
    printed: (helper)
    label: Total for all months (Line 3 Limitation Chart and Worksheet)
    type: Dollars
    expr:
      op: sum
      of:
      - f8889.chart_self
      - f8889.chart_family
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet, 'Total for all months'
  - id: f8889.chart_limit
    printed: (helper)
    label: Limitation. Divide the total by 12
    type: Dollars
    expr:
      op: multiply_rate
      amount: f8889.chart_total
      rate:
        param: hsa.twelfth
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet, 'Limitation. Divide the total by 12. Enter here and on line 3'
  - id: f8889.all_year
    printed: (helper)
    label: Eligible individual on the first day of every month of 2025
    type: Bool
    expr:
      op: test
      eq:
      - f8889.months_eligible
      - const: 12
        type: Count
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 3 and 4
  - id: f8889.changed
    printed: (helper)
    label: Coverage type changed during the year (family coverage in some eligible months, self-only in others)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        gt:
        - f8889.months_family
        - const: 0
          type: Count
      - op: test
        lt:
        - f8889.months_family
        - f8889.months_eligible
    cite:
      doc: i8889
      locator: p. 4, Line 3, rule 4, 'you changed your type of coverage during the year'
  - id: f8889.dec_coverage
    printed: (helper)
    label: 'HDHP coverage you had or were treated as having on December 1, 2025: none, self_only or family'
    type: Enum(hsa_coverage)
    expr:
      op: input
      source: 'The high-deductible health plan coverage you had or were treated as having on December 1, 2025: none
        (you were not an eligible individual that day), self_only, or family. If you and your spouse were both eligible
        individuals that day and either of you had family HDHP coverage, answer family for both spouses and disregard
        either spouse''s self-only plan.'
    cite:
      doc: i8889
      locator: p. 4, How To Complete Part I and Line 3 rules 1, 2 and 4(b), spouse-attributed family coverage and the
        coverage on the first day of the last month
  - id: f8889.dec_amount
    printed: (helper)
    label: The maximum amount for the HDHP coverage you had on December 1 (the full-year amount of that coverage type)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.dec_coverage
          - const: self_only
        then: f8889.self_amount
      - guard:
          op: test
          eq:
          - f8889.dec_coverage
          - const: family
        then: f8889.family_amount
      - guard:
          op: test
          eq:
          - f8889.dec_coverage
          - const: none
        then: f8889.zero
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 2, 3 and 4(b)
  - id: f8889.last_month
    printed: (helper)
    label: Do you use the last-month rule (treating yourself as an eligible individual for all of 2025 with your December
      1 coverage, subject to the testing period through December 31, 2026)?
    type: Bool
    expr:
      op: input
      source: 'Do you use the last-month rule: treat yourself as an eligible individual for all of 2025 with the coverage
        you had on December 1, 2025, which requires you to remain an eligible individual from December 1, 2025 through December
        31, 2026 (the testing period)?'
    cite:
      doc: i8889
      locator: p. 2, Last-month rule and Testing period; p. 4, Line 3, rule 2
  - id: f8889.use_last_month
    printed: (helper)
    label: The last-month rule applies (an eligible individual on December 1 who uses it)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        ne:
        - f8889.dec_coverage
        - const: none
      - op: test
        eq:
        - f8889.last_month
        - const: true
    cite:
      doc: i8889
      locator: p. 2, Last-month rule; p. 4, Line 3, rule 2
    ambiguity: amb.2025.hsa_last_month_all_year
  - id: f8889.line3_changed
    printed: (helper)
    label: The greater of the Line 3 Limitation Chart and Worksheet and the maximum for your December 1 coverage
    type: Dollars
    expr:
      op: larger_of
      of:
      - f8889.chart_limit
      - f8889.dec_amount
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 4, ''enter on line 3 ... the greater of: a. The limitation shown on the last line of the
        Line 3 Limitation Chart and Worksheet ... or b. The maximum amount that can be contributed based on the type of HDHP
        coverage you had on the first day of the last month'''
  - id: f8889.line3_all_year
    printed: (helper)
    label: Line 3 for an eligible individual all year
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.changed
          - const: true
        then: f8889.line3_changed
      - guard:
          op: test
          eq:
          - f8889.changed
          - const: false
        then: f8889.chart_limit
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 3 and 4 (for a year with one coverage type the chart gives $4,300 or $8,550, plus $1,000
        if age 55 or older)
  - id: f8889.line3_last_month
    printed: (helper)
    label: Line 3 under the last-month rule (considered an eligible individual all year)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.changed
          - const: true
        then: f8889.line3_changed
      - guard:
          op: test
          eq:
          - f8889.changed
          - const: false
        then: f8889.dec_amount
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 2, 3 and 4 (rule 4 covers a filer who 'were, or were considered, an eligible
        individual for the entire year' and changed type, amb.2025.hsa_last_month_change)
    ambiguity: amb.2025.hsa_last_month_change
  - id: f8889.line3_part_year
    printed: (helper)
    label: Line 3 when not an eligible individual every month
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: true
        then: f8889.line3_last_month
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: false
        then: f8889.chart_limit
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 2 and 5
  - id: f8889.line3
    printed: '3'
    label: If you were under age 55 at the end of 2025 and, on the first day of every month during 2025, you were, or were
      considered, an eligible individual with the same coverage, enter $4,300 ($8,550 for family coverage). All others, see
      the instructions for the amount to enter
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.all_year
          - const: true
        then: f8889.line3_all_year
      - guard:
          op: test
          eq:
          - f8889.all_year
          - const: false
        then: f8889.line3_part_year
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 3; i8889 pp. 4-6, Line 3
  - id: f8889.line4
    printed: '4'
    label: Enter the amount you and your employer contributed to your Archer MSAs for 2025 from Form 8853, lines 1 and 2
    type: NonNegDollars
    expr:
      op: copy
      from: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 4 (Archer MSA contributions are refused by f8889.unsupported)
  - id: f8889.line5
    printed: '5'
    label: Subtract line 4 from line 3. If zero or less, enter -0-
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line3
      take: f8889.line4
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 5
  - id: f8889.family_year
    printed: (helper)
    label: 'The family amount for all twelve months'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.family_under55
      count: f8889.twelve
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.family_dec_year
    printed: (helper)
    label: 'Under the last-month rule: the family amount for all twelve months if family coverage on December 1, else zero'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.dec_coverage
          - const: family
        then: f8889.family_year
      - guard:
          op: test
          eq:
          - f8889.dec_coverage
          - const: self_only
        then: f8889.zero
      - guard:
          op: test
          eq:
          - f8889.dec_coverage
          - const: none
        then: f8889.zero
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.family_counted
    printed: (helper)
    label: 'The family amount for each month of family coverage'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.family_under55
      count: f8889.months_family
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage"'
  - id: f8889.step1_total
    printed: (helper)
    label: 'Step 1: the family amount for each month treated as having family coverage'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: true
        then: f8889.family_dec_year
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: false
        then: f8889.family_counted
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.step1_line3
    printed: (helper)
    label: 'Step 1: refigured line 3 (the total divided by 12)'
    type: Dollars
    expr:
      op: multiply_rate
      amount: f8889.step1_total
      rate:
        param: hsa.twelfth
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage. When refiguring line 5, use the same amount you previously entered on line 4"'
  - id: f8889.step1
    printed: (helper)
    label: 'Step 1: refigured line 5 (refigured line 3 less line 4)'
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.step1_line3
      take: f8889.line4
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage. When refiguring line 5, use the same amount you previously entered on line 4"'
  - id: f8889.step1_x2
    printed: (helper)
    label: 'Twice the Step 1 limit'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.step1
      count: f8889.two
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"'
  - id: f8889.two
    printed: (helper)
    label: 'Two spouses'
    type: Count
    expr:
      op: param
      ref: hsa.two
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during 2025'
  - id: f8889.share_equal
    printed: (helper)
    label: 'Step 2: half of the Step 1 limit'
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8889.step1
      rate:
        param: hsa.half
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"'
  - id: f8889.allocation
    printed: (helper)
    label: 'Do you and your spouse divide the family contribution limit equally, or by a different allocation you both agree on?'
    type: Enum(hsa_allocation)
    expr:
      op: input
      source: Do you and your spouse divide the family contribution limit equally (equal), or by a different allocation you both agree on, such as allocating nothing to one spouse (agreed)?
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"'
  - id: f8889.allocated
    printed: (helper)
    label: 'The part of the Step 1 family contribution limit allocated to you under the allocation you and your spouse agreed on'
    type: NonNegDollars
    expr:
      op: input
      source: The part of the family contribution limit (Step 1) allocated to you under the allocation you and your spouse agreed on; your spouse's part is the rest
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"; p. 7, Line 6, Step 3, "Subtract the part of the contribution limit allocated to your spouse in Step 2 from the amount determined in Step 1"'
  - id: f8889.share_raw
    printed: (helper)
    label: 'Steps 2 and 3: your part of the Step 1 limit (Step 1 less the part allocated to your spouse)'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.allocation
          - const: equal
        then: f8889.share_equal
      - guard:
          op: test
          eq:
          - f8889.allocation
          - const: agreed
        then: f8889.allocated
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"; p. 7, Line 6, Step 3, "Subtract the part of the contribution limit allocated to your spouse in Step 2 from the amount determined in Step 1"'
  - id: f8889.allocation_bad
    printed: (gate)
    label: 'The spouses allocation cannot be checked or does not hold: only one spouse treated as having family coverage, only one using an agreed allocation, or an agreed allocation with different Step 1 limits or with more than the Step 1 limit allocated in total'
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - household.hsa_split_count
        - const: 1
          type: Count
      - op: test
        eq:
        - household.hsa_agreed_count
        - const: 1
          type: Count
      - op: test
        all:
        - op: test
          eq:
          - f8889.allocation
          - const: agreed
        - op: test
          any:
          - op: test
            ne:
            - f8889.step1_x2
            - household.hsa_step1_sum
          - op: test
            gt:
            - household.hsa_share_sum
            - f8889.step1
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 1, "Use the family coverage amount if you or your spouse had an HDHP with family coverage"; "if you and your spouse are both eligible individuals and either of you has an HDHP with family coverage, you both are treated as having only the family coverage plan"; p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"'
  - id: f8889.share
    printed: (helper)
    label: 'Steps 2 and 3: your part of the Step 1 limit'
    type: NonNegDollars
    expr:
      op: copy
      from: f8889.share_raw
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 3, "Subtract the part of the contribution limit allocated to your spouse in Step 2 from the amount determined in Step 1"'
    refuses:
    - when: f8889.allocation_bad
      form: Form 8889 line 6 for spouses with separate HSAs
      remedy: Count the months treated as family coverage the same way for both spouses (if either had family coverage while
        both were eligible, both are treated as having it), use the same allocation method on both Forms 8889, and allocate
        no more than the Step 1 limit between you. An agreed allocation between spouses whose Step 1 limits differ is
        outside this tool.
      cite:
        doc: i8889
        locator: 'p. 4, Line 3, rule 1; p. 7, Line 6, Steps 1 to 3'
  - id: f8889.self_year
    printed: (helper)
    label: 'The self-only monthly amount for all twelve months'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.self_amount
      count: f8889.twelve
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.self_counted
    printed: (helper)
    label: 'The self-only monthly amount for each eligible month'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.self_amount
      count: f8889.months_eligible
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"'
  - id: f8889.self_all
    printed: (helper)
    label: 'The self-only monthly amount for each month treated as eligible'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: true
        then: f8889.self_year
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: false
        then: f8889.self_counted
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.self_family_months
    printed: (helper)
    label: 'The self-only monthly amount for each month of family coverage'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.self_amount
      count: f8889.months_family
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"'
  - id: f8889.self_dec_year
    printed: (helper)
    label: 'Under the last-month rule: the self-only monthly amount for all twelve months if family coverage on December 1, else zero'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.dec_coverage
          - const: family
        then: f8889.self_year
      - guard:
          op: test
          eq:
          - f8889.dec_coverage
          - const: self_only
        then: f8889.zero
      - guard:
          op: test
          eq:
          - f8889.dec_coverage
          - const: none
        then: f8889.zero
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.self_in_family
    printed: (helper)
    label: 'The self-only monthly amount for each month treated as having family coverage'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: true
        then: f8889.self_dec_year
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: false
        then: f8889.self_family_months
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.step4_total
    printed: (helper)
    label: 'Step 4: the self-only monthly amount for each eligible month without family coverage'
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.self_all
      take: f8889.self_in_family
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3. Enter the total on line 6"'
    ambiguity: amb.2025.hsa_step4_other_limits
  - id: f8889.step4
    printed: (helper)
    label: 'Step 4: other contribution limits (the total divided by 12)'
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8889.step4_total
      rate:
        param: hsa.twelfth
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3. Enter the total on line 6"'
  - id: f8889.line6_split
    printed: (helper)
    label: 'Line 6 for spouses with separate HSAs: Step 3 plus Step 4'
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f8889.share
      - f8889.step4
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3. Enter the total on line 6"'
  - id: f8889.split
    printed: (helper)
    label: 'Spouses with separate HSAs, treated as having family coverage at any time during 2025'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8889.married_family
        - const: true
      - op: test
        eq:
        - household.hsa_both
        - const: true
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during 2025'
  - id: f8889.line6
    printed: '6'
    label: Enter the amount from line 5. But if you and your spouse each have separate HSAs and had family coverage under
      an HDHP at any time during 2025, see the instructions for the amount to enter
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.split
          - const: true
        then: f8889.line6_split
      - guard:
          op: test
          eq:
          - f8889.split
          - const: false
        then: f8889.line5
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 6 (married filers are refused by f8889.married)
  - id: f8889.additional
    printed: (helper)
    label: 'Year parameter hsa.additional ($1,000)'
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.additional
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"'
  - id: f8889.line7_year
    printed: (helper)
    label: '$1,000 for all twelve months'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.additional
      count: f8889.twelve
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.line7_counted
    printed: (helper)
    label: '$1,000 for each eligible month'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.additional
      count: f8889.months_eligible
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"'
  - id: f8889.line7_total
    printed: (helper)
    label: 'Additional Contribution Amount Worksheet, line 1: $1,000 × number of months eligible'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: true
        then: f8889.line7_year
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: false
        then: f8889.line7_counted
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"'
    ambiguity: amb.2025.hsa_line7_months
  - id: f8889.line7_worksheet
    printed: (helper)
    label: 'Additional Contribution Amount Worksheet, line 2: divide line 1 by 12'
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8889.line7_total
      rate:
        param: hsa.twelfth
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"'
  - id: f8889.line7_applies
    printed: (helper)
    label: 'Age 55 or older at the end of 2025, married, and treated as having family coverage at any time during 2025'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8889.age55
        - const: true
      - op: test
        eq:
        - f8889.married_family
        - const: true
    cite:
      doc: i8889
      locator: 'p. 7, Line 7, "If, at the end of 2025, you were age 55 or older and married, use the Additional Contribution Amount Worksheet"; p. 5, Line 3, "Note. If you are married and had family coverage at any time during the year, the additional contribution amount is figured on line 7 and is not included on line 3"'
  - id: f8889.line7
    printed: '7'
    label: If you were age 55 or older at the end of 2025, married, and you or your spouse had family coverage under an HDHP
      at any time during 2025, enter your additional contribution amount
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.line7_applies
          - const: true
        then: f8889.line7_worksheet
      - guard:
          op: test
          eq:
          - f8889.line7_applies
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 7 (married filers are refused by f8889.married; an unmarried filer's $1,000 is in line
        3)
  - id: f8889.line8
    printed: '8'
    label: Add lines 6 and 7
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f8889.line6
      - f8889.line7
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 8
  - id: f8889.line10
    printed: '10'
    label: Qualified HSA funding distributions
    type: NonNegDollars
    expr:
      op: copy
      from: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 10 (qualified HSA funding distributions are refused by f8889.unsupported)
  - id: f8889.line11
    printed: '11'
    label: Add lines 9 and 10
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f8889.line9
      - f8889.line10
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 11
  - id: f8889.line12
    printed: '12'
    label: Subtract line 11 from line 8. If zero or less, enter -0-
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line8
      take: f8889.line11
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 12
  - id: f8889.employer_in_box1
    printed: (helper)
    label: The excess employer contributions are included in Form W-2 box 1
    type: Bool
    expr:
      op: input
      source: Are your employer's HSA contributions above the limit included in your wages in Form W-2 box 1? (Answer no if the
        employer has not included them; asked only when employer contributions exceed the limit.)
    cite:
      doc: i8889
      locator: 'p. 8, Excess Employer Contributions, "Excess employer contributions are the excess, if any, of your employer''s contributions over your limitation on line 8."'
  - id: f8889.excess
    printed: (helper)
    label: Employer contributions above the limit that are not included in Form W-2 box 1
    type: Bool
    expr:
      op: test
      all:
      - op: test
        gt:
        - f8889.line11
        - f8889.line8
      - op: test
        eq:
        - f8889.employer_in_box1
        - const: false
    cite:
      doc: i8889
      locator: 'p. 8, Excess Employer Contributions, "Excess employer contributions are the excess, if any, of your employer''s contributions over your limitation on line 8."'
  - id: f8889.excess_own
    printed: (helper)
    label: Your contributions above your limit (line 2 less line 13)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line2
      take: f8889.line13
    cite:
      doc: i5329
      locator: 'p. 8, Line 47, "Enter the excess of your contributions (made by you or on your behalf) to your HSAs for 2025 from
        Form 8889, line 2 (unless withdrawn—discussed next), over your contribution limit (Form 8889, line 12)."'
  - id: f8889.excess_employer
    printed: (helper)
    label: Employer contributions above the limit (line 11 less line 8)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line11
      take: f8889.line8
    cite:
      doc: i5329
      locator: 'p. 8, Line 47, "Also include on line 47 any excess contributions your employer made."'
  - id: f8889.excess_amt
    printed: (helper)
    label: 2025 excess HSA contributions for Form 5329 line 47
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f8889.excess_own
      - f8889.excess_employer
    cite:
      doc: i5329
      locator: 'p. 8, Line 47, "Also include on line 47 any excess contributions your employer made."'
  - id: f8889.line13_figured
    printed: (helper)
    label: Generally, enter the smaller of line 2 or line 12
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - f8889.line2
      - f8889.line12
    cite:
      doc: i8889
      locator: p. 8, Line 13, 'Generally, enter the smaller of line 2 or line 12 on line 13 and on Schedule 1 (Form 1040),
        Part II, line 13'
    refuses:
    - when: f8889.mfs
      form: Form 8889 on a married filing separately return
      remedy: Married filing separately is outside this tool; the HSA rules for spouses are supported on a joint return.
      cite:
        doc: i1040gi
        locator: p. 14, Married Filing Separately
    - when: f8889.bad_months
      form: Form 8889 line 3 month counts
      remedy: The number of eligible months must be at most 12 and the number of family months at most the eligible months,
        and the December 1 coverage must agree with them (December 1 is one of the months counted). Check the answers.
      cite:
        doc: i8889
        locator: p. 6, Line 3 Limitation Chart and Worksheet
    - when: f8889.excess
      form: Excess employer HSA contributions not included in Form W-2 box 1
      remedy: Employer contributions above the limit that your employer did not include in box 1 are other income, which
        this tool does not take; ask the employer for a corrected Form W-2.
      cite:
        doc: i8889
        locator: 'p. 8, Excess Employer Contributions, "Excess employer contributions are the excess, if any, of your employer''s contributions over your limitation on line 8."'
  - id: f8889.line13
    printed: '13'
    label: HSA deduction (see instructions)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.any
          - const: true
        then: f8889.line13_figured
      - guard:
          op: test
          eq:
          - f8889.any
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 13
    refuses:
    - when: f8889.unsupported
      form: Form 8889 Part III, Form 8853, or other HSA situations
      remedy: Qualified HSA funding distributions, Archer MSAs, prior-year excess contributions, testing-period failures, inherited
        HSAs, deemed distributions, withdrawals of excess contributions and repaid mistaken distributions are outside this tool.
      cite:
        doc: i8889
        locator: Parts II and III; lines 4, 10 and 13
  - id: f8889.line14a
    printed: 14a
    label: Total distributions you received in 2025 from all HSAs (see instructions)
    type: NonNegDollars
    expr:
      op: input
      source: Total distributions you received in 2025 from all of your own HSAs (box 1 of your Forms 1099-SA, including
        distributions you rolled over); zero if none
    cite:
      doc: i8889
      locator: p. 8, Line 14a, "Enter the total distributions your HSAs made in 2025. These amounts should be shown on Form
        1099-SA, box 1"
  - id: f8889.has_dist
    printed: (helper)
    label: Any HSA distributions in 2025
    type: Bool
    expr:
      op: test
      gt:
      - f8889.line14a
      - param: sales.zero
    cite:
      doc: f8889
      locator: p. 1, Part II, "HSA Distributions", "Total distributions you received in 2025 from all HSAs" (line 14a)
  - id: f8889.rollover
    printed: (helper)
    label: Distributions included on line 14a that you rolled over to another HSA
    type: NonNegDollars
    expr:
      op: input
      source: The part of those distributions that you rolled over to another HSA within 60 days (a rollover); zero if none
    cite:
      doc: i8889
      locator: p. 8, Line 14b, "Include on line 14b any distributions your HSA made in 2025 that qualified as a rollover
        contribution to another HSA"; p. 3, Rollovers, "Generally, you must complete the rollover within 60 days after you
        received the distribution"
  - id: f8889.rollover_bad
    printed: (gate)
    label: The distributions rolled over are more than the total distributions
    type: Bool
    expr:
      op: test
      gt:
      - f8889.rollover
      - f8889.line14a
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 14b, "Distributions included on line 14a that you rolled over to another HSA"
  - id: f8889.line14b
    printed: 14b
    label: Distributions included on line 14a that you rolled over to another HSA. Also include any excess contributions (and
      the earnings on those excess contributions) included on line 14a that were withdrawn by the due date of your return
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: true
        then: f8889.rollover
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 14b (withdrawals of excess contributions are refused by f8889.unsupported)
    refuses:
    - when: f8889.rollover_bad
      when_known: true
      form: Form 8889 line 14b
      remedy: The distributions rolled over are part of the total distributions on line 14a and cannot be more than it.
      cite:
        doc: f8889
        locator: Form 8889 (2025), line 14b, "Distributions included on line 14a"
  - id: f8889.line14c
    printed: 14c
    label: Subtract line 14b from line 14a
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line14a
      take: f8889.line14b
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 14c (line 14b is at most line 14a)
  - id: f8889.medical
    printed: (helper)
    label: Qualified medical expenses paid using HSA distributions
    type: NonNegDollars
    expr:
      op: input
      source: The part of your 2025 HSA distributions used to pay qualified medical expenses (not reimbursed by insurance
        or other coverage, and incurred after the HSA was established) of you, your spouse, your dependents, and anyone who
        would be your dependent except that they filed a joint return, had gross income, or you (or your spouse, on a joint
        return) could be claimed as someone else's dependent; a child of divorced or separated parents counts for both
        parents; zero if none
    cite:
      doc: i8889
      locator: p. 8, Line 15, "Only include on line 15 distributions from your HSA that were used to pay you for qualified
        medical expenses not reimbursed by insurance or other coverage and that you incurred after the HSA was established"
        and "Any person who would be a dependent except that"; p. 9, Line 15, TIP, divorced or separated parents
  - id: f8889.line15
    printed: '15'
    label: Qualified medical expenses paid using HSA distributions (see instructions)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: true
        then: f8889.medical
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 15
  - id: f8889.line16_figured
    printed: (helper)
    label: Line 14c less line 15, not less than zero, before the HSA screen
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line14c
      take: f8889.line15
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 16, "Subtract line 15 from line 14c. If zero or less, enter -0-"
  - id: f8889.line16
    printed: '16'
    label: Taxable HSA distributions. Subtract line 15 from line 14c. If zero or less, enter -0-. Also, include this amount
      in the total on Schedule 1 (Form 1040), Part I, line 8f
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: true
        then: f8889.line16_figured
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 16
    refuses:
    - when: f8889.unsupported
      form: Form 8889 Part III, Form 8853, or other HSA situations
      remedy: Qualified HSA funding distributions, Archer MSAs, prior-year excess contributions, testing-period failures, inherited
        HSAs, deemed distributions, withdrawals of excess contributions and repaid mistaken distributions are outside this tool.
      cite:
        doc: i8889
        locator: Parts II and III; lines 4, 10 and 13
  - id: f8889.has_taxable
    printed: (helper)
    label: Any taxable HSA distributions (line 16 more than zero)
    type: Bool
    expr:
      op: test
      gt:
      - f8889.line16
      - param: sales.zero
    cite:
      doc: i8889
      locator: p. 9, Lines 17a and 17b Additional 20% Tax, "HSA distributions included in income (line 16) are subject to
        an additional 20% tax unless one of the following exceptions applies"
  - id: f8889.line17a
    printed: 17a
    label: If any of the distributions included on line 16 meet any of the Exceptions to the Additional 20% Tax (see instructions),
      check here
    type: Bool
    expr:
      op: input
      source: Were any of your taxable HSA distributions made after you became disabled or turned age 65 (the exceptions to
        the additional 20% tax)?
    cite:
      doc: i8889
      locator: 'p. 9, Exceptions to the Additional 20% Tax, "The additional 20% tax does not apply to distributions made after
        the account beneficiary: • Dies, • Becomes disabled or • Turns age 65" and "If any of the exceptions apply to any
        of the distributions included on line 16, check the box on line 17a"'
  - id: f8889.subject_part
    printed: (helper)
    label: The part of line 16 that does not meet any of the exceptions
    type: NonNegDollars
    expr:
      op: input
      source: The part of your taxable HSA distributions (Form 8889 line 16) that was made before you became disabled or turned
        age 65 (the part subject to the additional 20% tax); zero if all of it was made after
    cite:
      doc: i8889
      locator: p. 9, Exceptions to the Additional 20% Tax, "Enter on line 17b only 20% (0.20) of any amount included on line
        16 that does not meet any of the exceptions"
  - id: f8889.subject_bad
    printed: (gate)
    label: The part subject to the additional 20% tax is more than line 16
    type: Bool
    expr:
      op: test
      gt:
      - f8889.subject_part
      - f8889.line16
    cite:
      doc: i8889
      locator: p. 9, Exceptions to the Additional 20% Tax, "any amount included on line 16"
  - id: f8889.subject_excepted
    printed: (helper)
    label: The part of line 16 subject to the additional 20% tax when some of it meets an exception
    type: NonNegDollars
    expr:
      op: copy
      from: f8889.subject_part
    cite:
      doc: i8889
      locator: p. 9, Exceptions to the Additional 20% Tax, "Enter on line 17b only 20% (0.20) of any amount included on line
        16 that does not meet any of the exceptions"
    ambiguity: amb.2025.hsa_partial_exception
    refuses:
    - when: f8889.subject_bad
      form: Form 8889 line 17b
      remedy: The part subject to the additional 20% tax is part of line 16 and cannot be more than it.
      cite:
        doc: i8889
        locator: p. 9, Exceptions to the Additional 20% Tax
  - id: f8889.subject
    printed: (helper)
    label: Distributions included on line 16 that are subject to the additional 20% tax
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.line17a
          - const: false
        then: f8889.line16
      - guard:
          op: test
          eq:
          - f8889.line17a
          - const: true
        then: f8889.subject_excepted
    cite:
      doc: i8889
      locator: p. 9, Lines 17a and 17b Additional 20% Tax, "HSA distributions included in income (line 16) are subject to
        an additional 20% tax unless one of the following exceptions applies"
  - id: f8889.line17b_figured
    printed: (helper)
    label: 20% of the distributions subject to the additional tax
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8889.subject
      rate:
        param: hsa.additional_rate
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 17b, "Enter 20% (0.20) of the distributions included on line 16 that are subject to the
        additional 20% tax"
    ambiguity: amb.2025.multiplication_subcent
  - id: f8889.line17b
    printed: 17b
    label: Additional 20% tax (see instructions). Enter 20% (0.20) of the distributions included on line 16 that are subject
      to the additional 20% tax. Also, include this amount in the total on Schedule 2 (Form 1040), Part II, line 17c
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_taxable
          - const: true
        then: f8889.line17b_figured
      - guard:
          op: test
          eq:
          - f8889.has_taxable
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 17b
  collection:
    parent: person
    cite:
      doc: i8889
      locator: 'p. 4, Name and social security number (SSN), "If married filing jointly and both you and your spouse have
        HSAs, complete a separate Form 8889 for each of you"'
