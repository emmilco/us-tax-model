form:
  id: f8889
  kind: form
  title: Form 8889 — Health Savings Accounts (Parts I and II)
  tax_year: 2025
  note: Part I for one person, with the spouse rules of lines 6 and 7 on a joint return, with the Line 3 Limitation Chart and Worksheet and the last-month rule; Part II
    (distributions), with the additional 20% tax on the part not excepted. Each of these is refused by its own question, namely the Form 8889 of a
    person who died in 2025, an inherited HSA, an Archer MSA, a qualified HSA funding distribution, a withdrawal of excess
    contributions, a failed testing period (Part III), a Form 1099-SA distribution code other than 1 or 3, a repaid mistaken
    distribution and a deemed distribution.
  lines:
  - id: f8889.one
    printed: (helper)
    label: One Form 8889
    type: Count
    expr:
      op: param
      ref: person.one
    cite:
      doc: i8889
      locator: 'p. 4, Name and social security number (SSN), "complete a separate Form 8889 for each of you"'
  - id: f8889.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), lines 4, 7 and 10
  - id: f8889.line2
    printed: '2'
    label: HSA contributions you made for 2025 (or those made on your behalf), including those made by the unextended due
      date of your tax return that were for 2025. Do not include employer contributions, contributions through a cafeteria
      plan, rollovers, or direct trustee-to-trustee transfers from another of your HSAs
    type: NonNegDollars
    expr:
      op: input
      source: HSA contributions you made for 2025 (or those made on your behalf), including those made by April 15, 2026 that
        were for 2025 (or by a later date if you served in, or in support of, the U.S. Armed Forces in a designated combat zone
        or contingency operation); do not include employer contributions, payroll contributions through a cafeteria plan, rollovers,
        amounts the trustee of another of your HSAs transferred directly to this one (a trustee-to-trustee transfer), or
        qualified HSA funding distributions; zero if none
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 2; i8889 p. 4, Line 2, "Thus, you may contribute to your 2025 HSA through April 15, 2026,
        or a later date if you served in a designated combat zone or contingency operation."; i8889 pp. 3-4, Rollovers, "If you
        instruct the trustee of your HSA to transfer funds directly to the trustee of another of your HSAs, the transfer is not
        considered a rollover." and "Do not include the amount transferred in ... include it as a distribution on line 14a."
  - id: f8889.line9
    printed: '9'
    label: Employer contributions made to your HSAs for 2025
    type: NonNegDollars
    expr:
      op: input
      source: Employer contributions to your HSAs for 2025, including payroll contributions through a cafeteria plan (Form
        W-2 box 12, code W, less employer contributions for 2024 included there, plus employer contributions for 2025 made
        in 2026); zero if none
    cite:
      doc: i8889
      locator: p. 7, Line 9 Employer Contributions and the Employer Contribution Worksheet
  - id: f8889.any
    printed: (helper)
    label: Any HSA contributions for 2025 (yours or your employer's)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        gt:
        - f8889.line2
        - param: sales.zero
      - op: test
        gt:
        - f8889.line9
        - param: sales.zero
    cite:
      doc: i8889
      locator: pp. 1-2, Who Must File (you or your employer made contributions to your HSA for 2025)
  - id: f8889.no
    printed: (helper)
    label: Year parameter hsa.no (false)
    type: Bool
    expr:
      op: param
      ref: hsa.no
    cite:
      doc: f8889
      locator: Form 8889 (2025), Parts I and II (a question that is not asked has the answer no)
  - id: f8889.yes
    printed: (helper)
    label: Year parameter hsa.yes (true)
    type: Bool
    expr:
      op: param
      ref: hsa.yes
    cite:
      doc: f8889
      locator: Form 8889 (2025), Parts I and II (a condition that holds without being asked)
  - id: f8889.owner_died
    printed: (helper)
    label: The account beneficiary of this HSA (the person this Form 8889 is for) died in 2025
    type: Bool
    expr:
      op: input
      source: Did the account beneficiary of this HSA (the person this Form 8889 is for) die in 2025? This is the case on
        the final return of a person who died in 2025 and, for that person's Form 8889, on a joint return with the surviving
        husband or wife. It includes an HSA whose beneficiary is the estate, the value of which at the date of death is
        included on the final return.
    cite:
      doc: i8889
      locator: 'p. 2, Last-month rule, "if you are an eligible individual on the 1st day of the last month of the tax year
        (December 1, for most individuals)"; p. 3, Death of Account Beneficiary, "If the account beneficiary''s estate is the
        beneficiary, the value of the HSA as of the date of death is included on the account beneficiary''s final income tax
        return"; i1040gi p. 12, Death of a Taxpayer, "A joint return should show your spouse''s 2025 income before death and
        your income for all of 2025"'
  - id: f8889.inherited
    printed: (helper)
    label: An interest in an HSA acquired because of the death of its account beneficiary
    type: Bool
    expr:
      op: input
      source: Did you acquire an interest in an HSA because of the death of its account beneficiary (as the surviving
        spouse or as any other beneficiary), in 2025 or in an earlier year, including an HSA from which you only received
        a distribution after the death?
    cite:
      doc: i8889
      locator: 'p. 1, Who Must File, "You acquired an interest in an HSA because of the death of the account beneficiary";
        p. 3, Death of Account Beneficiary, "If the account beneficiary''s surviving spouse is the designated beneficiary, the
        HSA is treated as if the surviving spouse were the account beneficiary" and "If the designated beneficiary is not the
        account beneficiary''s surviving spouse, or there is no designated beneficiary, the account ceases to be an HSA as of
        the date of death"'
  - id: f8889.archer
    printed: (helper)
    label: You, or your husband or wife, had an Archer MSA at any time in 2025
    type: Bool
    expr:
      op: input
      source: Did you, or your husband or wife, have an Archer MSA at any time in 2025? Form 8889 line 4 takes from Form
        8853 the contributions made to your Archer MSAs for 2025, and those made to your husband's or wife's if either of
        you had family coverage under a high-deductible health plan at any time during 2025; Form 8853 also reports every
        distribution from an Archer MSA, including one rolled over into an HSA.
    cite:
      doc: f8889
      locator: 'Form 8889 (2025), line 4, "Enter the amount you and your employer contributed to your Archer MSAs for 2025
        from Form 8853, lines 1 and 2. If you or your spouse had family coverage under an HDHP at any time during 2025, also
        include any amount contributed to your spouse’s Archer MSAs"; i8889 p. 4, Figuring Your HSA Deduction, "Your maximum
        contribution is reduced by any employer contributions to your HSA, any contributions made to your Archer MSA, and any
        qualified HSA funding distributions"; i8889 p. 3, Rollovers, "A rollover is a tax-free distribution (withdrawal) of
        assets from one HSA or Archer MSA that is reinvested in another HSA of the same account beneficiary"; i8853 p. 1, Who
        Must File, "You (or your spouse, if filing jointly) received Archer MSA or Medicare Advantage MSA distributions in
        2025"; f5498sa p. 3, Instructions for Participant, "Box 6. Shows the type of account that is reported on this Form
        5498-SA"'
  - id: f8889.ira_transfer
    printed: (helper)
    label: A qualified HSA funding distribution was made to your HSA in 2025
    type: Bool
    expr:
      op: input
      source: Was a qualified HSA funding distribution made to your HSA in 2025 (a distribution from your traditional IRA
        or Roth IRA to your HSA in a direct trustee-to-trustee transfer)?
    cite:
      doc: i8889
      locator: 'p. 7, Line 10, "A distribution from your traditional IRA or Roth IRA to your HSA in a direct
        trustee-to-trustee transfer is called an HSA funding distribution" and "reduces the amount that can be contributed to
        your HSA by you and from other sources (including employer contributions)"; p. 8, Excess Employer Contributions, "If you
        made a qualified HSA funding distribution (line 10) during the tax year, reduce your limitation (line 8) by that
        distribution/ contribution before you determine whether you have excess employer contributions"'
  - id: f8889.excess_withdrawn
    printed: (helper)
    label: A withdrawal of excess HSA contributions or their earnings, made in 2025 or in 2026 by the due date of the 2025
      return
    type: Bool
    expr:
      op: input
      source: Did you withdraw from your HSA any excess contributions (yours or your employer's) or the earnings on them,
        in 2025, or in 2026 by the due date of your 2025 return including extensions, or will you by that date?
    cite:
      doc: i8889
      locator: 'p. 8, Excess Contributions You Make, "you can withdraw some or all of your excess contributions for 2025 and
        they will be treated as if they had not been contributed if"; p. 8, Line 14b, "Also include any excess contributions
        (and the earnings on those excess contributions) included on line 14a that were withdrawn by the due date, including
        extensions, of your return"'
  - id: f8889.mfs
    printed: (gate)
    label: 'Married filing separately'
    type: Bool
    expr:
      op: test
      eq:
      - f1040.status
      - const: mfs
    cite:
      doc: i1040gi
      locator: 'p. 14, Married Filing Separately'
  - id: f8889.coverage_year
    printed: (helper)
    label: 'HDHP coverage on the first day of every month of 2025: self-only in all twelve, family in all twelve, or
      anything else (including coverage that started, ended or changed type)'
    type: Enum(hsa_year_coverage)
    expr:
      op: input
      source: |-
        Were you covered by a high-deductible health plan (HDHP) on the first day of every month of 2025, with the same type of coverage in all twelve?

        - Self-only all year: an HDHP covering only you on the first day of every month of 2025.
        - Family all year: on the first day of every month of 2025, an HDHP covering you and at least one other person (such as an employee-plus-spouse or employee-plus-children tier), including as a member of someone else's plan (a parent's, or your husband's or wife's, for example), or a self-only HDHP and a family HDHP at the same time.
        - Changed: anything else, including HDHP coverage that started, ended or changed type during 2025, or if you are not sure. The month-by-month questions follow.

        This asks about the plan only. Whether you were an eligible individual in every month (no Medicare, no other health coverage, not a dependent), and whether your husband's or wife's family coverage counts as yours, are asked next.
    cite:
      doc: i8889
      locator: 'p. 2, Eligible Individual, "you must be covered under a high deductible health plan (HDHP) and have no other
        health coverage except certain disregarded coverage ... You must be, or be considered, an eligible individual on the
        first day of a month"; p. 4, Line 1, "If you were covered by both a self-only HDHP and a family
        HDHP at the same time, you are treated as having family coverage during that period"; p. 4, Line 3, rule 3, "If you
        were, or were considered, an eligible individual for the entire year
        and you did not change your type of coverage, enter $4,300 for a self-only HDHP or $8,550 for a family HDHP on line
        3"; p969 p. 4,
        "Family HDHP coverage is HDHP coverage for an eligible individual and at least one other individual"'
  - id: f8889.clear_all_year
    printed: (helper)
    gated_by: f8889.clear_if_uniform
    label: On the first day of every month of 2025, not enrolled in Medicare, with no other health coverage that is not
      disregarded, and not able to be claimed as a dependent
    type: Bool
    expr:
      op: input
      source: |-
        On the first day of every month of 2025, were all three of these true?

        - you were not enrolled in Medicare, counting Medicare coverage backdated to an earlier month
        - you had no other health coverage, apart from the coverage the instructions disregard (accident, disability, dental, vision, long-term care, telehealth and other remote care, workers' compensation, tort or property liability insurance, insurance for a specified disease or illness, and insurance paying a fixed amount per day of hospitalization); VA care for a service-connected disability and benefits under surprise billing laws are not other health coverage
        - you could not be claimed as a dependent on someone else's 2025 return
    cite:
      doc: i8889
      locator: 'p. 2, Eligible Individual, "you must be covered under a high deductible health plan (HDHP) and have no other
        health coverage except certain disregarded coverage ... you cannot be enrolled in Medicare or be another person''s
        dependent"; p. 2, Certain coverage disregarded and Permitted insurance; p. 2, Eligible Individual, VA hospital care or
        medical services for a service-connected disability and benefits under surprise billing laws; p. 4, "You cannot
        deduct any contributions for any month in which you were enrolled in Medicare. Also, you cannot deduct contributions
        if you are someone else''s dependent for 2025"; p969 p. 7, Enrolled in Medicare, "This rule applies to periods of
        retroactive Medicare coverage"'
  - id: f8889.fsa
    printed: (helper)
    gated_by: f8889.fsa_if_clear
    label: Covered at any time in 2025 by a health FSA or an HRA that pays or reimburses qualified medical expenses (your
      own or your husband's or wife's), other than a limited-purpose, post-deductible, suspended or retiree-only one
    type: Bool
    expr:
      op: input
      source: At any time in 2025, were you covered by a health flexible spending arrangement (FSA) or a health
        reimbursement arrangement (HRA) that pays or reimburses qualified medical expenses, whether it was your own or your
        husband's or wife's? Do not count a limited-purpose health FSA or HRA (dental, vision and preventive care only), a
        post-deductible health FSA or HRA, a suspended HRA, or a retiree-only HRA before retirement.
    cite:
      doc: p969
      locator: 'p. 5, Other employee health plans, "An employee covered by an HDHP and a health FSA or an HRA that pays or
        reimburses qualified medical expenses can''t generally make contributions to an HSA" and the four arrangements that
        follow (limited-purpose health FSA or HRA, suspended HRA, post-deductible health FSA or HRA, retiree-only HRA)'
  - id: f8889.spouse_family
    printed: (helper)
    gated_by: f8889.spouse_family_if_asked
    label: Your husband or wife had family HDHP coverage in any month of 2025
    type: Bool
    expr:
      op: input
      source: In any month of 2025, did your husband or wife have family coverage under an HDHP (HDHP coverage for more than
        one person)? If you were both eligible individuals in such a month, you are both treated as having family coverage
        for it.
    cite:
      doc: i8889
      locator: 'p. 4, How To Complete Part I, "if you and your spouse are both eligible individuals and either of you has an
        HDHP with family coverage, you both are treated as having only the family coverage plan. Disregard any plans with
        self-only coverage"; p. 4, Line 3, rule 1, "Use the family coverage amount if you or your spouse had an HDHP with
        family coverage"'
  - id: f8889.months_eligible
    printed: (helper)
    label: Number of months of 2025 on the first day of which you were an eligible individual
    type: Count
    expr:
      op: input
      source: Number of months of 2025 on the first day of which you were an eligible individual (covered by a high-deductible
        health plan, with no other disqualifying health coverage, not enrolled in Medicare, and not able to be claimed as
        a dependent on someone else's 2025 return)
    cite:
      doc: i8889
      locator: pp. 2 and 6, Eligible Individual and the Line 3 Limitation Chart and Worksheet ('Were you an eligible individual
        ... on the first day of the month?')
  - id: f8889.months_family
    printed: (helper)
    label: Of those eligible months, the number in which you had or were treated as having family HDHP coverage
    type: Count
    expr:
      op: input
      source: Of those eligible months, the number in which you had or were treated as having family (not self-only)
        high-deductible health plan coverage on the first day of the month; zero if your coverage was self-only in all of
        them. If you and your spouse were both
        eligible individuals for a month and either of you had family HDHP coverage, count that month as family coverage
        for both of you and disregard either spouse's self-only plan. Count the actual eligible months here; the separate
        last-month-rule question determines whether December 1 coverage is treated as applying throughout the year.
    cite:
      doc: i8889
      locator: p. 4, How To Complete Part I and Line 3 rule 1 (both eligible spouses are treated as having family coverage
        if either has a family HDHP); p. 6, Line 3 Limitation Chart and Worksheet, monthly coverage
  - id: f8889.bad_months_counted
    printed: (helper)
    label: The month counts or the December 1 coverage are impossible (more than 12 eligible months, more family months
      than eligible months, or a December 1 coverage the month counts cannot include)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        gt:
        - f8889.months_eligible
        - const: 12
          type: Count
      - op: test
        gt:
        - f8889.months_family
        - f8889.months_eligible
      - op: test
        all:
        - op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: self_only
        - op: test
          eq:
          - f8889.months_family
          - f8889.months_eligible
      - op: test
        all:
        - op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: family
        - op: test
          eq:
          - f8889.months_family
          - const: 0
            type: Count
      - op: test
        all:
        - op: test
          ne:
          - f8889.dec_coverage_if_changed
          - const: none
        - op: test
          eq:
          - f8889.months_eligible
          - const: 0
            type: Count
      - op: test
        all:
        - op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: none
        - op: test
          eq:
          - f8889.months_eligible
          - const: 12
            type: Count
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet (twelve months of 2025, each counted on the first day of the month,
        December 1 among them)
  - id: f8889.counts_hold
    printed: (helper)
    label: Year parameter hsa.year_counts_hold (false)
    type: Bool
    expr:
      op: param
      ref: hsa.year_counts_hold
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet (twelve months of 2025, each counted on the first day of the month,
        December 1 among them)
  - id: f8889.bad_months
    printed: (helper)
    label: The month counts or the December 1 coverage are impossible (asked only when coverage changed during the year; one
      coverage type all year gives twelve eligible months and that December 1 coverage)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: self_only
        then: f8889.counts_hold
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: family
        then: f8889.counts_hold
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: changed
        then: f8889.bad_months_counted
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet (twelve months of 2025, each counted on the first day of the month,
        December 1 among them); p. 4, Line 3, rule 3
  - id: f8889.clear_if_uniform
    printed: (helper)
    label: 'The three conditions of an eligible individual held on the first day of every month: asked only when HDHP
      coverage was of one type all year'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.coverage_year
          - const: self_only
        then: f8889.clear_all_year
      - guard:
          op: test
          eq:
          - f8889.coverage_year
          - const: family
        then: f8889.clear_all_year
      - guard:
          op: test
          eq:
          - f8889.coverage_year
          - const: changed
        then: f8889.no
    cite:
      doc: i8889
      locator: p. 2, Eligible Individual; p. 4, Line 3, rule 3 (a year that was not the same in every month is counted
        month by month)
  - id: f8889.fsa_if_clear
    printed: (helper)
    label: 'Covered by a general-purpose health FSA or HRA in 2025: asked only when the three conditions held in every
      month'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.clear_if_uniform
          - const: true
        then: f8889.fsa
      - guard:
          op: test
          eq:
          - f8889.clear_if_uniform
          - const: false
        then: f8889.no
    cite:
      doc: p969
      locator: p. 5, Other employee health plans
  - id: f8889.no_fsa
    printed: (helper)
    label: Not covered by a general-purpose health FSA or HRA in 2025
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.fsa_if_clear
          - const: true
        then: f8889.no
      - guard:
          op: test
          eq:
          - f8889.fsa_if_clear
          - const: false
        then: f8889.yes
    cite:
      doc: p969
      locator: p. 5, Other employee health plans
  - id: f8889.eligible_all
    printed: (helper)
    label: 'An eligible individual on the first day of every month of 2025 by the answers about the person: the three conditions held and no general-purpose health FSA or HRA'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.clear_if_uniform
          - const: true
        then: f8889.no_fsa
      - guard:
          op: test
          eq:
          - f8889.clear_if_uniform
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 3, "If you were, or were considered, an eligible individual for the entire year and you did
        not change your type of coverage"'
  - id: f8889.sf_married
    printed: (helper)
    label: Married at the end of 2025
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - household.married
          - const: true
        then: f8889.yes
      - guard:
          op: test
          eq:
          - household.married
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 1, "Use the family coverage amount if you or your spouse had an HDHP with family coverage"'
  - id: f8889.sf_eligible
    printed: (helper)
    label: Married at the end of 2025 and an eligible individual in every month
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.eligible_all
          - const: true
        then: f8889.sf_married
      - guard:
          op: test
          eq:
          - f8889.eligible_all
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 1, "Use the family coverage amount if you or your spouse had an HDHP with family coverage"'
  - id: f8889.ask_spouse_family
    printed: (helper)
    label: 'A married person with self-only HDHP coverage all year who was an eligible individual in every month: the
      spouse''s family coverage is asked'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.coverage_year
          - const: self_only
        then: f8889.sf_eligible
      - guard:
          op: test
          eq:
          - f8889.coverage_year
          - const: family
        then: f8889.no
      - guard:
          op: test
          eq:
          - f8889.coverage_year
          - const: changed
        then: f8889.no
    cite:
      doc: i8889
      locator: 'p. 4, How To Complete Part I, "if you and your spouse are both eligible individuals and either of you has an
        HDHP with family coverage, you both are treated as having only the family coverage plan"'
  - id: f8889.spouse_family_if_asked
    printed: (helper)
    label: 'Your husband or wife had family HDHP coverage in any month of 2025: asked only of a married person with
      self-only coverage all year'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.ask_spouse_family
          - const: true
        then: f8889.spouse_family
      - guard:
          op: test
          eq:
          - f8889.ask_spouse_family
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 1, "Use the family coverage amount if you or your spouse had an HDHP with family coverage"'
  - id: f8889.cov_self_only
    printed: (helper)
    label: Year parameter hsa.cov_self_only (self-only all year)
    type: Enum(hsa_year_coverage)
    expr:
      op: param
      ref: hsa.cov_self_only
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 3, "enter $4,300 for a self-only HDHP"'
  - id: f8889.cov_family
    printed: (helper)
    label: Year parameter hsa.cov_family (family all year)
    type: Enum(hsa_year_coverage)
    expr:
      op: param
      ref: hsa.cov_family
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 3, "$8,550 for a family HDHP"'
  - id: f8889.cov_changed
    printed: (helper)
    label: Year parameter hsa.cov_changed (not one type of coverage as an eligible individual all year)
    type: Enum(hsa_year_coverage)
    expr:
      op: param
      ref: hsa.cov_changed
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 4 and 5; p. 6, Line 3 Limitation Chart and Worksheet
  - id: f8889.coverage_self_spouse
    printed: (helper)
    label: 'Self-only HDHP coverage all year as an eligible individual: self-only all year unless the spouse''s family coverage makes months family'
    type: Enum(hsa_year_coverage)
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.spouse_family_if_asked
          - const: true
        then: f8889.cov_changed
      - guard:
          op: test
          eq:
          - f8889.spouse_family_if_asked
          - const: false
        then: f8889.cov_self_only
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 1, "Use the family coverage amount if you or your spouse had an HDHP with family coverage"'
  - id: f8889.coverage_self
    printed: (helper)
    label: 'Self-only HDHP coverage all year: self-only all year as an eligible individual, else counted month by month'
    type: Enum(hsa_year_coverage)
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.eligible_all
          - const: true
        then: f8889.coverage_self_spouse
      - guard:
          op: test
          eq:
          - f8889.eligible_all
          - const: false
        then: f8889.cov_changed
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 3, "If you were, or were considered, an eligible individual for the entire year and you did
        not change your type of coverage"'
  - id: f8889.coverage_family
    printed: (helper)
    label: 'Family HDHP coverage all year: family all year as an eligible individual, else counted month by month'
    type: Enum(hsa_year_coverage)
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.eligible_all
          - const: true
        then: f8889.cov_family
      - guard:
          op: test
          eq:
          - f8889.eligible_all
          - const: false
        then: f8889.cov_changed
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 3, "If you were, or were considered, an eligible individual for the entire year and you did
        not change your type of coverage"'
  - id: f8889.coverage
    printed: (helper)
    label: 'Coverage as an eligible individual in 2025: self-only all year, family all year, or changed during the year
      (counted month by month)'
    type: Enum(hsa_year_coverage)
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.coverage_year
          - const: self_only
        then: f8889.coverage_self
      - guard:
          op: test
          eq:
          - f8889.coverage_year
          - const: family
        then: f8889.coverage_family
      - guard:
          op: test
          eq:
          - f8889.coverage_year
          - const: changed
        then: f8889.cov_changed
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 3, "If you were, or were considered, an eligible individual for the entire year and you did
        not change your type of coverage, enter $4,300 for a self-only HDHP or $8,550 for a family HDHP on line 3"; p. 4, Line 3,
        rules 4 and 5'
  - id: f8889.age55
    printed: (helper)
    label: Were you age 55 or older at the end of 2025?
    type: Bool
    expr:
      op: input
      source: Were you age 55 or older at the end of 2025?
    cite:
      doc: i8889
      locator: p. 4, Line 3, rule 6, and p. 6, Line 3 Limitation Chart
  - id: f8889.twelve
    printed: (helper)
    label: 'Twelve months'
    type: Count
    expr:
      op: param
      ref: hsa.year_months
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 2'
  - id: f8889.married_family
    printed: (helper)
    label: 'Married at the end of 2025 and treated as having family coverage at any time during 2025'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - household.married
          - const: true
        then: f8889.family_any_time
      - guard:
          op: test
          eq:
          - household.married
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: 'p. 5, Line 3, "Note. If you are married and had family coverage at any time during the year, the additional contribution amount is figured on line 7 and is not included on line 3"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.age55_line3
    printed: (helper)
    label: 'Age 55 or older and the additional contribution amount is included on line 3 (unmarried, or married without family coverage)'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8889.age55
        - const: true
      - op: test
        eq:
        - f8889.married_family
        - const: false
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 6, "If, at the end of 2025, you were age 55 or older and unmarried or married with self-only HDHP coverage for the entire year, you can increase the amount determined in (3) or (4) by $1,000"; p. 5, Line 3, "Note. If you are married and had family coverage at any time during the year, the additional contribution amount is figured on line 7 and is not included on line 3"'
  - id: f8889.self_amount
    printed: (helper)
    label: Line 3 chart amount for a month of self-only coverage ($4,300; $5,300 if age 55 or older at the end of 2025)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.age55_line3
          - const: true
        then: f8889.self_55
      - guard:
          op: test
          eq:
          - f8889.age55_line3
          - const: false
        then: f8889.self_under55
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, 'Enter $4,300 on the line below for the month. If you were age 55 or older at
        the end of 2025, enter $5,300 for the month'
  - id: f8889.self_under55
    printed: (helper)
    label: Year parameter hsa.self_only ($4,300)
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.self_only
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, $4,300
  - id: f8889.self_55
    printed: (helper)
    label: Year parameter hsa.self_only_55 ($5,300)
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.self_only_55
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, $5,300
  - id: f8889.age55_unmarried
    printed: (helper)
    label: Unmarried and age 55 or older at the end of 2025
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8889.age55
        - const: true
      - op: test
        eq:
        - household.married
        - const: false
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, 'If, at the end of 2025, you were unmarried and age 55 or older, enter $9,550
        for the month'
  - id: f8889.family_amount
    printed: (helper)
    label: Line 3 chart amount for a month of family coverage ($8,550; $9,550 if unmarried and age 55 or older at the end
      of 2025)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.age55_unmarried
          - const: true
        then: f8889.family_55
      - guard:
          op: test
          eq:
          - f8889.age55_unmarried
          - const: false
        then: f8889.family_under55
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, 'Enter $8,550 on the line below for the month. If, at the end of 2025, you were
        unmarried and age 55 or older, enter $9,550 for the month'
  - id: f8889.family_under55
    printed: (helper)
    label: Year parameter hsa.family ($8,550)
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.family
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, $8,550
  - id: f8889.family_55
    printed: (helper)
    label: Year parameter hsa.family_55 ($9,550)
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.family_55
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart, $9,550
  - id: f8889.family_extra
    printed: (helper)
    label: Family monthly amount less the self-only monthly amount
    type: Dollars
    expr:
      op: subtract
      from: f8889.family_amount
      take: f8889.self_amount
    cite:
      doc: i8889
      locator: 'p. 6, Line 3 Limitation Chart and Worksheet (each family month enters the family amount: the self-only amount
        plus this difference)'
  - id: f8889.chart_self
    printed: (helper)
    label: The self-only monthly amount for every eligible month
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.self_amount
      count: f8889.months_eligible
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet, the monthly amounts
  - id: f8889.chart_family
    printed: (helper)
    label: The family difference for every month of family coverage
    type: Dollars
    expr:
      op: multiply_count
      amount: f8889.family_extra
      count: f8889.months_family
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet, the monthly amounts
  - id: f8889.chart_total
    printed: (helper)
    label: Total for all months (Line 3 Limitation Chart and Worksheet)
    type: Dollars
    expr:
      op: sum
      of:
      - f8889.chart_self
      - f8889.chart_family
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet, 'Total for all months'
  - id: f8889.chart_limit
    printed: (helper)
    label: Limitation. Divide the total by 12
    type: Dollars
    expr:
      op: multiply_rate
      amount: f8889.chart_total
      rate:
        param: hsa.twelfth
    cite:
      doc: i8889
      locator: p. 6, Line 3 Limitation Chart and Worksheet, 'Limitation. Divide the total by 12. Enter here and on line 3'
  - id: f8889.all_year
    printed: (helper)
    label: Eligible individual on the first day of every month of 2025
    type: Bool
    expr:
      op: test
      eq:
      - f8889.months_eligible
      - const: 12
        type: Count
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 3 and 4
  - id: f8889.changed
    printed: (helper)
    label: Coverage type changed during the year (family coverage in some eligible months, self-only in others)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        gt:
        - f8889.months_family
        - const: 0
          type: Count
      - op: test
        lt:
        - f8889.months_family
        - f8889.months_eligible
    cite:
      doc: i8889
      locator: p. 4, Line 3, rule 4, 'you changed your type of coverage during the year'
  - id: f8889.dec_coverage
    printed: (helper)
    gated_by: f8889.dec_coverage_if_changed
    label: 'HDHP coverage you had or were treated as having on December 1, 2025: none, self_only or family'
    type: Enum(hsa_coverage)
    expr:
      op: input
      source: 'The high-deductible health plan coverage you had or were treated as having on December 1, 2025: none
        (you were not an eligible individual that day), self_only, or family. Family is HDHP coverage for you and at
        least one other person, and includes coverage as a member of someone else''s family HDHP (your spouse''s or a parent''s, for example) and a self-only HDHP and a family HDHP held
        at the same time. If you and your spouse were both eligible individuals that day and either of you had family HDHP
        coverage, answer family for both spouses and disregard either spouse''s self-only plan.'
    cite:
      doc: i8889
      locator: p. 4, How To Complete Part I, Line 1 ("If you were covered by both a self-only HDHP and a family HDHP at the
        same time, you are treated as having family coverage during that period") and Line 3 rules 1, 2 and 4(b),
        spouse-attributed family coverage and the coverage on the first day of the last month
  - id: f8889.year_self_only
    printed: (helper)
    label: Year parameter hsa.year_self_only (self-only)
    type: Enum(hsa_coverage)
    expr:
      op: param
      ref: hsa.year_self_only
    cite:
      doc: i8889
      locator: p. 4, Line 3, rule 3, "If you were, or were considered, an eligible individual for the entire year and you did
        not change your type of coverage, enter $4,300 for a self-only HDHP"
  - id: f8889.year_family
    printed: (helper)
    label: Year parameter hsa.year_family (family)
    type: Enum(hsa_coverage)
    expr:
      op: param
      ref: hsa.year_family
    cite:
      doc: i8889
      locator: p. 4, Line 3, rule 3, "If you were, or were considered, an eligible individual for the entire year and you did
        not change your type of coverage, enter ... $8,550 for a family HDHP"
  - id: f8889.dec_coverage_if_changed
    printed: (helper)
    label: 'The HDHP coverage on December 1, 2025: asked only when coverage changed during the year; self-only or family all
      year is that coverage on December 1'
    type: Enum(hsa_coverage)
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: self_only
        then: f8889.year_self_only
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: family
        then: f8889.year_family
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: changed
        then: f8889.dec_coverage
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 2, 3 and 4(b) (the coverage on the first day of the last month, and under rule 3 an
        eligible individual for the entire year who did not change the type of coverage)
  - id: f8889.dec_amount
    printed: (helper)
    label: The maximum amount for the HDHP coverage you had on December 1 (the full-year amount of that coverage type)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: self_only
        then: f8889.self_amount
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: family
        then: f8889.family_amount
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: none
        then: f8889.zero
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 2, 3 and 4(b)
  - id: f8889.last_month
    printed: (helper)
    gated_by: f8889.use_last_month
    label: Do you use the last-month rule (treating yourself as an eligible individual for all of 2025 with your December
      1 coverage, subject to the testing period through December 31, 2026)?
    type: Bool
    expr:
      op: input
      source: 'Do you use the last-month rule: treat yourself as an eligible individual for all of 2025 with the coverage
        you had on December 1, 2025, which requires you to remain an eligible individual from December 1, 2025 through December
        31, 2026 (the testing period)?'
    cite:
      doc: i8889
      locator: p. 2, Last-month rule and Testing period; p. 4, Line 3, rule 2
  - id: f8889.no_last_month
    printed: (helper)
    label: Year parameter hsa.no_last_month (false)
    type: Bool
    expr:
      op: param
      ref: hsa.no_last_month
    cite:
      doc: i8889
      locator: 'p. 2, Last-month rule, "for the entire year if you are an
        eligible individual"'
  - id: f8889.use_last_month
    printed: (helper)
    label: 'The last-month rule applies: an eligible individual on December 1 (the December 1 coverage, asked first, is
      not none) who uses it'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: none
        then: f8889.no_last_month
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: self_only
        then: f8889.last_month
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: family
        then: f8889.last_month
    cite:
      doc: i8889
      locator: 'p. 2, Last-month rule, "for the entire year if you are an
        eligible individual"; p. 4, Line 3, rule 2'
    ambiguity: amb.2025.hsa_last_month_all_year
  - id: f8889.year_same
    printed: (helper)
    label: Year parameter hsa.year_same (true)
    type: Bool
    expr:
      op: param
      ref: hsa.year_same
    cite:
      doc: i8889
      locator: p. 4, Line 3, rule 3, "If you were, or were considered, an eligible individual for the entire year and you did
        not change your type of coverage"
  - id: f8889.full_year
    printed: (helper)
    label: 'Treated as having the December 1 coverage for all of 2025: one type of coverage all year, or the last-month rule
      applies'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: self_only
        then: f8889.year_same
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: family
        then: f8889.year_same
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: changed
        then: f8889.use_last_month
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the
        entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the
        last month of your tax year"; rule 3, "If you were, or were considered, an eligible individual for the entire year
        and you did not change your type of coverage"'
    ambiguity: amb.2025.hsa_last_month_all_year
  - id: f8889.dec_family
    printed: (helper)
    label: Family HDHP coverage on December 1, 2025
    type: Bool
    expr:
      op: test
      eq:
      - f8889.dec_coverage_if_changed
      - const: family
    cite:
      doc: i8889
      locator: p. 4, Line 3, rule 2, "You are treated as having the same HDHP coverage for the entire year as you had on the
        first day of the last month of your tax year"
  - id: f8889.some_family_months
    printed: (helper)
    label: At least one eligible month of family HDHP coverage
    type: Bool
    expr:
      op: test
      gt:
      - f8889.months_family
      - const: 0
        type: Count
    cite:
      doc: i8889
      locator: 'p. 5, Line 3, "Note. If you are married and had family coverage at any time during the year"'
  - id: f8889.family_any_time
    printed: (helper)
    label: Treated as having family coverage at any time during 2025 (the December 1 coverage under a full-year treatment,
      else any month of family coverage)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: true
        then: f8889.dec_family
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: false
        then: f8889.some_family_months
    cite:
      doc: i8889
      locator: 'p. 5, Line 3, "Note. If you are married and had family coverage at any time during the year, the additional
        contribution amount is figured on line 7 and is not included on line 3"; p. 4, Line 3, rule 2, "You are treated as
        having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.line3_changed
    printed: (helper)
    label: The greater of the Line 3 Limitation Chart and Worksheet and the maximum for your December 1 coverage
    type: Dollars
    expr:
      op: larger_of
      of:
      - f8889.chart_limit
      - f8889.dec_amount
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 4, ''enter on line 3 ... the greater of: a. The limitation shown on the last line of the
        Line 3 Limitation Chart and Worksheet ... or b. The maximum amount that can be contributed based on the type of HDHP
        coverage you had on the first day of the last month'''
  - id: f8889.line3_all_year
    printed: (helper)
    label: Line 3 for an eligible individual all year
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.changed
          - const: true
        then: f8889.line3_changed
      - guard:
          op: test
          eq:
          - f8889.changed
          - const: false
        then: f8889.chart_limit
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 3 and 4 (for a year with one coverage type the chart gives $4,300 or $8,550, plus $1,000
        if age 55 or older)
  - id: f8889.line3_last_month
    printed: (helper)
    label: Line 3 under the last-month rule (considered an eligible individual all year)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.changed
          - const: true
        then: f8889.line3_changed
      - guard:
          op: test
          eq:
          - f8889.changed
          - const: false
        then: f8889.dec_amount
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 2, 3 and 4 (rule 4 covers a filer who 'were, or were considered, an eligible
        individual for the entire year' and changed type, amb.2025.hsa_last_month_change)
    ambiguity: amb.2025.hsa_last_month_change
  - id: f8889.line3_part_year
    printed: (helper)
    label: Line 3 when not an eligible individual every month
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: true
        then: f8889.line3_last_month
      - guard:
          op: test
          eq:
          - f8889.use_last_month
          - const: false
        then: f8889.chart_limit
    cite:
      doc: i8889
      locator: p. 4, Line 3, rules 2 and 5
  - id: f8889.line3_months
    printed: (helper)
    label: Line 3 when coverage changed during the year (from the month counts, the December 1 coverage and the last-month
      rule)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.all_year
          - const: true
        then: f8889.line3_all_year
      - guard:
          op: test
          eq:
          - f8889.all_year
          - const: false
        then: f8889.line3_part_year
    cite:
      doc: i8889
      locator: pp. 4-6, Line 3 and the Line 3 Limitation Chart and Worksheet
  - id: f8889.line3
    printed: '3'
    label: If you were under age 55 at the end of 2025 and, on the first day of every month during 2025, you were, or were
      considered, an eligible individual with the same coverage, enter $4,300 ($8,550 for family coverage). All others, see
      the instructions for the amount to enter
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: self_only
        then: f8889.self_amount
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: family
        then: f8889.family_amount
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: changed
        then: f8889.line3_months
    cite:
      doc: f8889
      locator: 'Form 8889 (2025), line 3; i8889 p. 4, Line 3, rule 3, "If you were, or were considered, an eligible individual
        for the entire year and you did not change your type of coverage, enter $4,300 for a self-only HDHP or $8,550 for a
        family HDHP on line 3"'
  - id: f8889.line4
    printed: '4'
    label: Enter the amount you and your employer contributed to your Archer MSAs for 2025 from Form 8853, lines 1 and 2
    type: NonNegDollars
    expr:
      op: copy
      from: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 4 (a filer with an Archer MSA is refused on line 13, by f8889.archer)
  - id: f8889.line5
    printed: '5'
    label: Subtract line 4 from line 3. If zero or less, enter -0-
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line3
      take: f8889.line4
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 5
  - id: f8889.family_year
    printed: (helper)
    label: 'The family amount for all twelve months'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.family_under55
      count: f8889.twelve
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.family_dec_year
    printed: (helper)
    label: 'Under the last-month rule: the family amount for all twelve months if family coverage on December 1, else zero'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: family
        then: f8889.family_year
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: self_only
        then: f8889.zero
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: none
        then: f8889.zero
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.family_counted
    printed: (helper)
    label: 'The family amount for each month of family coverage'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.family_under55
      count: f8889.months_family
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage"'
  - id: f8889.step1_total
    printed: (helper)
    label: 'Step 1: the family amount for each month treated as having family coverage'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: true
        then: f8889.family_dec_year
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: false
        then: f8889.family_counted
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.step1_line3
    printed: (helper)
    label: 'Step 1: refigured line 3 (the total divided by 12)'
    type: Dollars
    expr:
      op: multiply_rate
      amount: f8889.step1_total
      rate:
        param: hsa.twelfth
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage. When refiguring line 5, use the same amount you previously entered on line 4"'
  - id: f8889.step1
    printed: (helper)
    label: 'Step 1: refigured line 5 (refigured line 3 less line 4)'
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.step1_line3
      take: f8889.line4
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for the months you were treated as having family coverage. When refiguring line 5, use the same amount you previously entered on line 4"'
  - id: f8889.step1_x2
    printed: (helper)
    label: 'Twice the Step 1 limit'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.step1
      count: f8889.two
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"'
  - id: f8889.two
    printed: (helper)
    label: 'Two spouses'
    type: Count
    expr:
      op: param
      ref: hsa.two
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during 2025'
  - id: f8889.share_equal
    printed: (helper)
    label: 'Step 2: half of the Step 1 limit'
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8889.step1
      rate:
        param: hsa.half
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"'
  - id: f8889.allocation
    printed: (helper)
    label: 'Do you and your spouse divide the family contribution limit equally, or by a different allocation you both agree on?'
    type: Enum(hsa_allocation)
    expr:
      op: input
      source: Do you and your spouse divide the family contribution limit equally (equal), or by a different allocation you both agree on, such as allocating nothing to one spouse (agreed)?
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"'
  - id: f8889.allocated
    printed: (helper)
    label: 'The part of the Step 1 family contribution limit allocated to you under the allocation you and your spouse agreed on'
    type: NonNegDollars
    expr:
      op: input
      source: The part of the family contribution limit (Step 1) allocated to you under the allocation you and your spouse agreed on; your spouse's part is the rest
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"; p. 7, Line 6, Step 3, "Subtract the part of the contribution limit allocated to your spouse in Step 2 from the amount determined in Step 1"'
  - id: f8889.share_raw
    printed: (helper)
    label: 'Steps 2 and 3: your part of the Step 1 limit (Step 1 less the part allocated to your spouse)'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.allocation
          - const: equal
        then: f8889.share_equal
      - guard:
          op: test
          eq:
          - f8889.allocation
          - const: agreed
        then: f8889.allocated
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"; p. 7, Line 6, Step 3, "Subtract the part of the contribution limit allocated to your spouse in Step 2 from the amount determined in Step 1"'
  - id: f8889.allocation_bad
    printed: (gate)
    label: 'The spouses allocation cannot be checked or does not hold: only one spouse treated as having family coverage, only one using an agreed allocation, or an agreed allocation with different Step 1 limits or with more than the Step 1 limit allocated in total'
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - household.hsa_split_count
        - const: 1
          type: Count
      - op: test
        eq:
        - household.hsa_agreed_count
        - const: 1
          type: Count
      - op: test
        all:
        - op: test
          eq:
          - f8889.allocation
          - const: agreed
        - op: test
          any:
          - op: test
            ne:
            - f8889.step1_x2
            - household.hsa_step1_sum
          - op: test
            gt:
            - household.hsa_share_sum
            - f8889.step1
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 1, "Use the family coverage amount if you or your spouse had an HDHP with family coverage"; "if you and your spouse are both eligible individuals and either of you has an HDHP with family coverage, you both are treated as having only the family coverage plan"; p. 7, Line 6, Step 2, "Divide the refigured contribution limit from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as allocating nothing to one spouse)"'
  - id: f8889.share
    printed: (helper)
    label: 'Steps 2 and 3: your part of the Step 1 limit'
    type: NonNegDollars
    expr:
      op: copy
      from: f8889.share_raw
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 3, "Subtract the part of the contribution limit allocated to your spouse in Step 2 from the amount determined in Step 1"'
    refuses:
    - when: f8889.allocation_bad
      form: Form 8889 line 6 for spouses with separate HSAs
      remedy: Count the months treated as family coverage the same way for both spouses (if either had family coverage while
        both were eligible, both are treated as having it), use the same allocation method on both Forms 8889, and allocate
        no more than the Step 1 limit between you. An agreed allocation between spouses whose Step 1 limits differ is
        outside this tool.
      cite:
        doc: i8889
        locator: 'p. 4, Line 3, rule 1; p. 7, Line 6, Steps 1 to 3'
  - id: f8889.self_year
    printed: (helper)
    label: 'The self-only monthly amount for all twelve months'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.self_amount
      count: f8889.twelve
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.self_counted
    printed: (helper)
    label: 'The self-only monthly amount for each eligible month'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.self_amount
      count: f8889.months_eligible
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"'
  - id: f8889.self_all
    printed: (helper)
    label: 'The self-only monthly amount for each month treated as eligible'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: true
        then: f8889.self_year
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: false
        then: f8889.self_counted
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.self_family_months
    printed: (helper)
    label: 'The self-only monthly amount for each month of family coverage'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.self_amount
      count: f8889.months_family
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"'
  - id: f8889.self_dec_year
    printed: (helper)
    label: 'Under the last-month rule: the self-only monthly amount for all twelve months if family coverage on December 1, else zero'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: family
        then: f8889.self_year
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: self_only
        then: f8889.zero
      - guard:
          op: test
          eq:
          - f8889.dec_coverage_if_changed
          - const: none
        then: f8889.zero
    cite:
      doc: i8889
      locator: 'p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.self_in_family
    printed: (helper)
    label: 'The self-only monthly amount for each month treated as having family coverage'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: true
        then: f8889.self_dec_year
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: false
        then: f8889.self_family_months
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.step4_total
    printed: (helper)
    label: 'Step 4: the self-only monthly amount for each eligible month without family coverage'
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.self_all
      take: f8889.self_in_family
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3. Enter the total on line 6"'
    ambiguity: amb.2025.hsa_step4_other_limits
  - id: f8889.step4
    printed: (helper)
    label: 'Step 4: other contribution limits (the total divided by 12)'
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8889.step4_total
      rate:
        param: hsa.twelfth
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3. Enter the total on line 6"'
  - id: f8889.line6_split
    printed: (helper)
    label: 'Line 6 for spouses with separate HSAs: Step 3 plus Step 4'
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f8889.share
      - f8889.step4
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Step 4, "Determine any other contribution limits that apply for the tax year and add that amount to the result in Step 3. Enter the total on line 6"'
  - id: f8889.split
    printed: (helper)
    label: 'Spouses with separate HSAs, treated as having family coverage at any time during 2025'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.married_family
          - const: true
        then: household.hsa_both
      - guard:
          op: test
          eq:
          - f8889.married_family
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: 'p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during 2025'
  - id: f8889.line6
    printed: '6'
    label: Enter the amount from line 5. But if you and your spouse each have separate HSAs and had family coverage under
      an HDHP at any time during 2025, see the instructions for the amount to enter
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.split
          - const: true
        then: f8889.line6_split
      - guard:
          op: test
          eq:
          - f8889.split
          - const: false
        then: f8889.line5
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 6; i8889 p. 7, Line 6 (spouses with separate HSAs and family coverage take
        f8889.line6_split)
  - id: f8889.additional
    printed: (helper)
    label: 'Year parameter hsa.additional ($1,000)'
    type: NonNegDollars
    expr:
      op: param
      ref: hsa.additional
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"'
  - id: f8889.line7_year
    printed: (helper)
    label: '$1,000 for all twelve months'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.additional
      count: f8889.twelve
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"; p. 4, Line 3, rule 2, "If the last-month rule ... applies, you are considered an eligible individual for the entire year. You are treated as having the same HDHP coverage for the entire year as you had on the first day of the last month of your tax year"'
  - id: f8889.line7_counted
    printed: (helper)
    label: '$1,000 for each eligible month'
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: f8889.additional
      count: f8889.months_eligible
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"'
  - id: f8889.line7_total
    printed: (helper)
    label: 'Additional Contribution Amount Worksheet, line 1: $1,000 × number of months eligible'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: true
        then: f8889.line7_year
      - guard:
          op: test
          eq:
          - f8889.full_year
          - const: false
        then: f8889.line7_counted
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"'
    ambiguity: amb.2025.hsa_line7_months
  - id: f8889.line7_worksheet
    printed: (helper)
    label: 'Additional Contribution Amount Worksheet, line 2: divide line 1 by 12'
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8889.line7_total
      rate:
        param: hsa.twelfth
    cite:
      doc: i8889
      locator: 'p. 7, Line 7 Additional Contribution Amount and the Additional Contribution Amount Worksheet, "1. $1,000 × number of months eligible ... 2. Divide line 1 by 12"'
  - id: f8889.line7_applies
    printed: (helper)
    label: 'Age 55 or older at the end of 2025, married, and treated as having family coverage at any time during 2025'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8889.age55
        - const: true
      - op: test
        eq:
        - f8889.married_family
        - const: true
    cite:
      doc: i8889
      locator: 'p. 7, Line 7, "If, at the end of 2025, you were age 55 or older and married, use the Additional Contribution Amount Worksheet"; p. 5, Line 3, "Note. If you are married and had family coverage at any time during the year, the additional contribution amount is figured on line 7 and is not included on line 3"'
  - id: f8889.line7
    printed: '7'
    label: If you were age 55 or older at the end of 2025, married, and you or your spouse had family coverage under an HDHP
      at any time during 2025, enter your additional contribution amount
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.line7_applies
          - const: true
        then: f8889.line7_worksheet
      - guard:
          op: test
          eq:
          - f8889.line7_applies
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 7; i8889 p. 7, Line 7 (a married filer's amount is f8889.line7_worksheet; an unmarried
        filer's $1,000 is in line 3)
  - id: f8889.line8
    printed: '8'
    label: Add lines 6 and 7
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f8889.line6
      - f8889.line7
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 8
  - id: f8889.line10
    printed: '10'
    label: Qualified HSA funding distributions
    type: NonNegDollars
    expr:
      op: copy
      from: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 10; i8889 p. 7, Line 10 (a qualified HSA funding distribution is refused on line 13, by f8889.ira_transfer)
  - id: f8889.line11
    printed: '11'
    label: Add lines 9 and 10
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f8889.line9
      - f8889.line10
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 11
  - id: f8889.line12
    printed: '12'
    label: Subtract line 11 from line 8. If zero or less, enter -0-
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line8
      take: f8889.line11
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 12
  - id: f8889.employer_in_box1
    printed: (helper)
    label: The excess employer contributions are included in Form W-2 box 1
    type: Bool
    expr:
      op: input
      source: Are your employer's HSA contributions above the limit included in your wages in Form W-2 box 1? (Answer no if the
        employer has not included them; asked only when employer contributions exceed the limit.)
    cite:
      doc: i8889
      locator: 'p. 8, Excess Employer Contributions, "Excess employer contributions are the excess, if any, of your employer''s contributions over your limitation on line 8."'
  - id: f8889.excess
    printed: (helper)
    label: Employer contributions above the limit that are not included in Form W-2 box 1
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.over_limit
          - const: true
        then: f8889.not_in_box1
      - guard:
          op: test
          eq:
          - f8889.over_limit
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: 'p. 8, Excess Employer Contributions, "Excess employer contributions are the excess, if any, of your employer''s contributions over your limitation on line 8."'
  - id: f8889.over_limit
    printed: (helper)
    label: Employer contributions (line 11) are more than the limit (line 8)
    type: Bool
    expr:
      op: test
      gt:
      - f8889.line11
      - f8889.line8
    cite:
      doc: i8889
      locator: 'p. 8, Excess Employer Contributions, "Excess employer contributions are the excess, if any, of your employer''s contributions over your limitation on line 8."'
  - id: f8889.not_in_box1
    printed: (helper)
    label: The excess employer contributions are not included in Form W-2 box 1
    type: Bool
    expr:
      op: test
      eq:
      - f8889.employer_in_box1
      - const: false
    cite:
      doc: i8889
      locator: 'p. 8, Excess Employer Contributions, "Excess employer contributions are the excess, if any, of your employer''s contributions over your limitation on line 8."'
  - id: f8889.excess_own
    printed: (helper)
    label: Your contributions above your limit (line 2 less line 13)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line2
      take: f8889.line13
    cite:
      doc: i5329
      locator: 'p. 8, Line 47, "Enter the excess of your contributions (made by you or on your behalf) to your HSAs for 2025 from
        Form 8889, line 2 (unless withdrawn—discussed next), over your contribution limit (Form 8889, line 12)."'
  - id: f8889.excess_employer
    printed: (helper)
    label: Employer contributions above the limit (line 11 less line 8)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line11
      take: f8889.line8
    cite:
      doc: i5329
      locator: 'p. 8, Line 47, "Also include on line 47 any excess contributions your employer made."'
  - id: f8889.excess_sum
    printed: (helper)
    label: Your contributions above your limit plus employer contributions above the limit
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f8889.excess_own
      - f8889.excess_employer
    cite:
      doc: i5329
      locator: 'p. 8, Line 47, "Also include on line 47 any excess contributions your employer made."'
  - id: f8889.excess_amt
    printed: (helper)
    label: 2025 excess HSA contributions for Form 5329 line 47 (none without contributions for 2025)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.any
          - const: true
        then: f8889.excess_sum
      - guard:
          op: test
          eq:
          - f8889.any
          - const: false
        then: f8889.zero
    cite:
      doc: i5329
      locator: 'p. 8, Line 47, "Enter the excess of your contributions (made by you or on your behalf) to your HSAs for 2025 from
        Form 8889, line 2 (unless withdrawn—discussed next), over your contribution limit (Form 8889, line 12)."'
  - id: f8889.covered_12
    printed: (helper)
    label: An eligible individual on the first day of every month of 2025, without the last-month rule
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: self_only
        then: f8889.yes
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: family
        then: f8889.yes
      - guard:
          op: test
          eq:
          - f8889.coverage
          - const: changed
        then: f8889.all_year
    cite:
      doc: i8889
      locator: 'p. 2, Testing period, "The testing period begins with the last month of your tax year and ends on the last day
        of the 12th month following that month"; p. 8, Testing period, "The testing period begins with the month in which the
        traditional IRA or Roth IRA distribution is contributed to the HSA and lasts through the last day of the 12th month
        following that month" (a testing period that began in 2024 ends in 2025, so an eligible individual in every month of
        2025 remained one throughout it)'
  - id: f8889.not_covered_12
    printed: (helper)
    label: Not an eligible individual on the first day of at least one month of 2025
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.covered_12
          - const: true
        then: f8889.no
      - guard:
          op: test
          eq:
          - f8889.covered_12
          - const: false
        then: f8889.yes
    cite:
      doc: i8889
      locator: 'p. 2, Testing period, "If you fail to remain an eligible individual during this period"'
  - id: f8889.ask_testing
    printed: (helper)
    label: 'The testing period that began in 2024 is asked: no contributions for 2025 (the months of 2025 are not otherwise
      asked), or not an eligible individual in every month of 2025'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.any
          - const: false
        then: f8889.yes
      - guard:
          op: test
          eq:
          - f8889.any
          - const: true
        then: f8889.not_covered_12
    cite:
      doc: i8889
      locator: 'p. 1, Who Must File, "You failed to be an “eligible individual” during a “testing period” and must recognize
        income"; p. 9, Part III'
  - id: f8889.ira_prior
    printed: (helper)
    gated_by: f8889.ira_prior_if_asked
    label: A qualified HSA funding distribution from an IRA was contributed to your HSA in 2024
    type: Bool
    expr:
      op: input
      source: Was a qualified HSA funding distribution (a distribution from your traditional IRA or Roth IRA to your HSA
        in a direct trustee-to-trustee transfer) contributed to your HSA in 2024?
    cite:
      doc: i8889
      locator: 'p. 8, Testing period, "If you received a traditional IRA or Roth IRA distribution, you must remain an
        eligible individual during the testing period. The testing period begins with the month in which the traditional
        IRA or Roth IRA distribution is contributed to the HSA and lasts through the last day of the 12th month following
        that month"; p. 9, Part III'
  - id: f8889.ira_prior_if_asked
    printed: (helper)
    label: 'A qualified HSA funding distribution was contributed in 2024: asked only when the answers do not show an
      eligible individual in every month of 2025'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.ask_testing
          - const: true
        then: f8889.ira_prior
      - guard:
          op: test
          eq:
          - f8889.ask_testing
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: p. 8, Testing period; p. 9, Part III
  - id: f8889.ask_last_month_prior
    printed: (helper)
    label: 'The last-month rule for 2024 is asked: the testing period is asked, and no qualified HSA funding distribution
      of 2024 has already begun one'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.ira_prior_if_asked
          - const: true
        then: f8889.no
      - guard:
          op: test
          eq:
          - f8889.ira_prior_if_asked
          - const: false
        then: f8889.ask_testing
    cite:
      doc: i8889
      locator: p. 2, Testing period; p. 9, Part III
  - id: f8889.testing_prior
    printed: (helper)
    gated_by: f8889.testing_prior_if_asked
    label: The last-month rule was used for 2024 (contributions were made for 2024 that could not have been made without
      it)
    type: Bool
    expr:
      op: input
      source: 'Did you use the last-month rule for 2024: you were an eligible individual on December 1, 2024, and
        contributions were made to your HSA for 2024, by you, your employer or anyone else, that could not have been made
        without the rule, because you were not an eligible individual in every month of 2024, or because your HDHP coverage
        on December 1, 2024 (self-only or family, counting family coverage you are treated as having through your spouse)
        was not your coverage in every month of 2024?'
    cite:
      doc: i8889
      locator: 'p. 2, Last-month rule, "You may consider yourself an "eligible individual" for the entire year if you are an
        eligible individual on the 1st day of the last month of the tax year"; p. 2, Testing period, "If you fail to remain
        an eligible individual during this period, other than because of death or becoming disabled, you will have to
        include in income the total contributions made that would not have been made except for the last-month rule"; p. 4,
        Line 3, rule 2, "You are treated as having the same HDHP coverage for the entire year as you had on the first day of
        the last month of your tax year"; p. 9, Part III'
  - id: f8889.testing_prior_if_asked
    printed: (helper)
    label: 'The last-month rule was used for 2024: asked only when the testing period is asked and no qualified HSA
      funding distribution of 2024 has already begun one'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.ask_last_month_prior
          - const: true
        then: f8889.testing_prior
      - guard:
          op: test
          eq:
          - f8889.ask_last_month_prior
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: p. 2, Testing period; p. 9, Part III
  - id: f8889.testing_if_asked
    printed: (helper)
    label: 'A testing period began in 2024 (a qualified HSA funding distribution contributed in 2024, or the last-month
      rule used for 2024): asked only when the answers do not show an eligible individual in every month of 2025'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.ira_prior_if_asked
          - const: true
        then: f8889.yes
      - guard:
          op: test
          eq:
          - f8889.ira_prior_if_asked
          - const: false
        then: f8889.testing_prior_if_asked
    cite:
      doc: i8889
      locator: p. 2, Testing period; p. 8, Testing period; p. 9, Part III
  - id: f8889.testing_failed
    printed: (gate)
    label: A testing period that began in 2024, and not an eligible individual in every month of 2025
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.testing_if_asked
          - const: true
        then: f8889.not_covered_12
      - guard:
          op: test
          eq:
          - f8889.testing_if_asked
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: 'p. 9, Part III, "Use Part III to figure any additional income and adjustments to income that must be reported
        on Schedule 1 (Form 1040) and additional taxes that must be reported on Schedule 2 (Form 1040) for failure to be an
        eligible individual during the testing period"'
  - id: f8889.line13_figured
    printed: (helper)
    label: Generally, enter the smaller of line 2 or line 12
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - f8889.line2
      - f8889.line12
    cite:
      doc: i8889
      locator: p. 8, Line 13, 'Generally, enter the smaller of line 2 or line 12 on line 13 and on Schedule 1 (Form 1040),
        Part II, line 13'
    refuses:
    - when: f8889.mfs
      form: Form 8889 on a married filing separately return
      remedy: Married filing separately is outside this tool; the HSA rules for spouses are supported on a joint return.
      cite:
        doc: i1040gi
        locator: p. 14, Married Filing Separately
    - when: f8889.ira_transfer
      form: Form 8889 line 10 (a qualified HSA funding distribution)
      remedy: A transfer from an IRA to an HSA (a qualified HSA funding distribution) is outside this tool. It reduces the
        amount that can be contributed and starts a testing period.
      cite:
        doc: i8889
        locator: p. 7, Line 10
    - when: f8889.excess_withdrawn
      form: Form 8889 lines 2, 13 and 14b for excess contributions withdrawn
      remedy: Excess contributions taken back out of an HSA by the due date of the return are treated as not contributed,
        and the withdrawal and its earnings are reported on lines 14a and 14b and as other income. This tool does not
        prepare that.
      cite:
        doc: i8889
        locator: p. 8, Excess Contributions You Make and Line 14b
    - when: f8889.bad_months
      form: Form 8889 line 3 month counts
      remedy: The number of eligible months must be at most 12 and the number of family months at most the eligible months,
        and the December 1 coverage must agree with them (December 1 is one of the months counted). Check the answers.
      cite:
        doc: i8889
        locator: p. 6, Line 3 Limitation Chart and Worksheet
    - when: f8889.excess
      form: Excess employer HSA contributions not included in Form W-2 box 1
      remedy: Employer contributions above the limit that your employer did not include in box 1 are other income, which
        this tool does not take; ask the employer for a corrected Form W-2.
      cite:
        doc: i8889
        locator: 'p. 8, Excess Employer Contributions, "Excess employer contributions are the excess, if any, of your employer''s contributions over your limitation on line 8."'
    - when: f8889.testing_failed
      form: Form 8889 Part III
      remedy: Income and additional tax for not staying an eligible individual during a testing period (Form 8889 Part
        III) are outside this tool. A testing period began in 2024, under the last-month rule or with a transfer from an
        IRA, and the answers show at least one month of 2025 without qualifying coverage.
      cite:
        doc: i8889
        locator: p. 2, Testing period; p. 8, Testing period; p. 9, Part III
  - id: f8889.line13_none
    printed: (helper)
    label: The HSA deduction with no contributions for 2025 (zero)
    type: NonNegDollars
    expr:
      op: copy
      from: f8889.zero
    cite:
      doc: i8889
      locator: p. 8, Line 13, 'Generally, enter the smaller of line 2 or line 12 on line 13 and on Schedule 1 (Form 1040),
        Part II, line 13'
    refuses:
    - when: f8889.ira_transfer
      form: Form 8889 line 10 (a qualified HSA funding distribution)
      remedy: A transfer from an IRA to an HSA (a qualified HSA funding distribution) is outside this tool. It reduces the
        amount that can be contributed and starts a testing period.
      cite:
        doc: i8889
        locator: p. 7, Line 10
    - when: f8889.excess_withdrawn
      form: Form 8889 lines 2, 13 and 14b for excess contributions withdrawn
      remedy: Excess contributions taken back out of an HSA by the due date of the return are treated as not contributed,
        and the withdrawal and its earnings are reported on lines 14a and 14b and as other income. This tool does not
        prepare that.
      cite:
        doc: i8889
        locator: p. 8, Excess Contributions You Make and Line 14b
    - when: f8889.testing_failed
      form: Form 8889 Part III
      remedy: Income and additional tax for not staying an eligible individual during a testing period (Form 8889 Part
        III) are outside this tool. A testing period began in 2024, under the last-month rule or with a transfer from an
        IRA, and the answers show at least one month of 2025 without qualifying coverage.
      cite:
        doc: i8889
        locator: p. 2, Testing period; p. 8, Testing period; p. 9, Part III
  - id: f8889.line13
    printed: '13'
    label: HSA deduction (see instructions)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.any
          - const: true
        then: f8889.line13_figured
      - guard:
          op: test
          eq:
          - f8889.any
          - const: false
        then: f8889.line13_none
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 13
    refuses:
    - when: f8889.owner_died
      form: Form 8889 for a person who died in 2025
      remedy: The Form 8889 of a person who died in 2025 follows special rules (the tax year ends with the month of death,
        so the last-month rule looks at that month and not at December, and an HSA left to the estate is included at its
        value on the date of death). This tool does not prepare it; prepare it with the person's final return.
      cite:
        doc: i8889
        locator: 'p. 2, Last-month rule; p. 3, Death of Account Beneficiary; i1040gi p. 12, Death of a Taxpayer'
    - when: f8889.inherited
      form: Form 8889 for an HSA acquired because its account beneficiary died
      remedy: An inherited HSA is reported differently (a beneficiary who is not the surviving spouse reports the account's
        value on the date of death on a Form 8889 of its own and skips Part I). This tool does not prepare it, and it does
        not prepare a surviving spouse's inherited HSA either.
      cite:
        doc: i8889
        locator: p. 3, Death of Account Beneficiary
    - when: f8889.archer
      form: Form 8853 (Archer MSAs) and Form 8889 line 4
      remedy: Archer MSAs are outside this tool. Contributions to one reduce the HSA limit on Form 8889 line 4, and
        contributions to it and distributions from it (including one rolled over into an HSA) are reported on Form 8853.
      cite:
        doc: f8889
        locator: Form 8889 (2025), line 4; i8853 p. 1, Who Must File
  - id: f8889.line14a
    printed: 14a
    label: Total distributions you received in 2025 from all HSAs (see instructions)
    type: NonNegDollars
    expr:
      op: input
      source: Total distributions you received in 2025 from all of your own HSAs (box 1 of your Forms 1099-SA, including
        distributions you rolled over, but not an amount the trustee transferred directly to the trustee of another of your
        HSAs); zero if none
    cite:
      doc: i8889
      locator: p. 8, Line 14a, "Enter the total distributions your HSAs made in 2025. These amounts should be shown on Form
        1099-SA, box 1"; pp. 3-4, Rollovers, "If you instruct the trustee of your HSA to transfer funds directly to the trustee of
        another of your HSAs, the transfer is not considered a rollover." and "Do not include the amount transferred in ...
        include it as a distribution on line 14a."
  - id: f8889.has_dist
    printed: (helper)
    label: Any HSA distributions in 2025
    type: Bool
    expr:
      op: test
      gt:
      - f8889.line14a
      - param: sales.zero
    cite:
      doc: f8889
      locator: p. 1, Part II, "HSA Distributions", "Total distributions you received in 2025 from all HSAs" (line 14a)
  - id: f8889.dist_code
    printed: (helper)
    gated_by: f8889.dist_code_if_dist
    label: A 2025 Form 1099-SA for an HSA shows a distribution code other than 1 or 3 in box 3
    type: Bool
    expr:
      op: input
      source: 'Does box 3 (distribution code) of any of your 2025 Forms 1099-SA for an HSA show a code other than 1 (normal
        distribution) or 3 (disability): 2 (excess contributions), 4 (death distribution other than code 6), 5 (prohibited
        transaction) or 6 (death distribution after year of death to a nonspouse beneficiary)?'
    cite:
      doc: f1099sa
      locator: 'p. 3, Instructions for Recipient, "Box 3. These codes identify the distribution you received: 1—Normal
        distribution; 2—Excess contributions; 3—Disability; 4—Death distribution other than code 6; 5—Prohibited transaction;
        6—Death distribution after year of death to a nonspouse beneficiary"'
  - id: f8889.dist_code_if_dist
    printed: (gate)
    label: 'A Form 1099-SA distribution code other than 1 or 3: asked only when there were HSA distributions in 2025'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: true
        then: f8889.dist_code
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: false
        then: f8889.no
    cite:
      doc: f1099sa
      locator: p. 3, Instructions for Recipient, Box 1 and Box 3
  - id: f8889.mistake_repaid
    printed: (helper)
    label: A mistaken distribution from your HSA that was repaid to the HSA
    type: Bool
    expr:
      op: input
      source: Was a distribution from your HSA made by mistake and repaid to the HSA (a mistaken distribution made in 2025,
        whether already repaid or to be repaid by the date allowed, or one made earlier and repaid in 2025)?
    cite:
      doc: i8889
      locator: 'p. 9, Lines 17a and 17b, "Note. There may be very limited and unusual circumstances in which you may be able
        to return mistaken distributions such that the amount will not be subject to the additional tax"; f1099sa p. 3,
        Instructions for Recipient, "You may repay a mistaken distribution from an HSA no later than the due date of the tax
        return (not including extensions) following the first year you knew or should have known the distribution was a
        mistake, providing the trustee allows the repayment"; i1099sa p. 1, HSA Mistaken Distributions, "the mistaken
        distribution is not included in gross income, is not subject to the additional 20% tax, and the repayment is not
        subject to the excise tax on excess contributions"'
  - id: f8889.loan
    printed: (helper)
    label: A deemed distribution from your HSA in 2025 (a prohibited transaction, or any part of an HSA used as security
      for a loan)
    type: Bool
    expr:
      op: input
      source: At any time in 2025, did you use any part of any of your HSAs as security for a loan, or engage in a
        transaction prohibited by section 4975 with any of your HSAs (for example the sale, exchange or leasing of property,
        the lending of money, or the furnishing of goods, services or facilities between you and the HSA)?
    cite:
      doc: i8889
      locator: 'p. 3, Deemed Distributions From HSAs, "You engaged in any transaction prohibited by section 4975 with respect
        to any of your HSAs, at any time in 2025" and "You used any portion of any of your HSAs as security for a loan at any
        time in 2025"; p. 9, Lines 17a and 17b Additional 20% Tax, "HSA distributions included in income (line 16) are subject to
        an additional 20% tax unless one of the following exceptions applies"; p969 p. 9, "Examples of prohibited transactions
        include the direct or indirect"'
  - id: f8889.medical_all
    printed: (helper)
    gated_by: f8889.medical_all_if_dist
    label: All of the 2025 HSA distributions that were not rolled over were used to pay qualified medical expenses
    type: Bool
    expr:
      op: input
      source: Were all of your 2025 HSA distributions, other than any you rolled over to another HSA, used to pay qualified
        medical expenses as line 15 counts them (not reimbursed by insurance or other coverage, incurred after the HSA was
        established, of you, your spouse, your dependents and the other persons line 15 allows, with insurance premiums
        counting only in the cases line 15 allows)?
    cite:
      doc: i8889
      locator: 'p. 2, Distributions From an HSA, "Distributions from an HSA used exclusively to pay qualified medical
        expenses of the account beneficiary, spouse, or dependents are excludable from gross income"; p. 8, Line 15, "Only
        include on line 15 distributions from your HSA that were used to pay you for qualified medical expenses not
        reimbursed by insurance or other coverage and that you incurred after the HSA was established"'
  - id: f8889.medical_all_if_dist
    printed: (helper)
    label: 'All distributions paid qualified medical expenses: asked only when there were HSA distributions in 2025'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: true
        then: f8889.medical_all
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: false
        then: f8889.no
    cite:
      doc: i8889
      locator: p. 8, Line 15
  - id: f8889.rollover
    printed: (helper)
    label: Distributions included on line 14a that you rolled over to another HSA
    type: NonNegDollars
    expr:
      op: input
      source: The part of those distributions that you rolled over within 60 days to another HSA of yours (an HSA of the same
        account beneficiary); do not count a rollover into an HSA that had already received a rollover contribution in the
        1-year period before it, since an HSA can receive only one rollover contribution during a 1-year period; zero if none
    cite:
      doc: i8889
      locator: p. 8, Line 14b, "Include on line 14b any distributions your HSA made in 2025 that qualified as a rollover
        contribution to another HSA"; p. 3, Rollovers, "Generally, you must complete the rollover within 60 days after you
        received the distribution", "reinvested in another HSA of the same account beneficiary" and "An HSA can only receive
        one rollover contribution during a 1-year period."
  - id: f8889.rollover_bad
    printed: (gate)
    label: The distributions rolled over are more than the total distributions
    type: Bool
    expr:
      op: test
      gt:
      - f8889.rollover
      - f8889.line14a
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 14b, "Distributions included on line 14a that you rolled over to another HSA"
  - id: f8889.line14b
    printed: 14b
    label: Distributions included on line 14a that you rolled over to another HSA. Also include any excess contributions (and
      the earnings on those excess contributions) included on line 14a that were withdrawn by the due date of your return
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: true
        then: f8889.rollover
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 14b; i8889 p. 8, Line 14b (a withdrawal of excess contributions is refused on lines 13 and 16, by f8889.excess_withdrawn)
    refuses:
    - when: f8889.rollover_bad
      when_known: true
      form: Form 8889 line 14b
      remedy: The distributions rolled over are part of the total distributions on line 14a and cannot be more than it.
      cite:
        doc: f8889
        locator: Form 8889 (2025), line 14b, "Distributions included on line 14a"
  - id: f8889.line14c
    printed: 14c
    label: Subtract line 14b from line 14a
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line14a
      take: f8889.line14b
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 14c (line 14b is at most line 14a)
  - id: f8889.medical
    printed: (helper)
    gated_by: f8889.medical_if_partial
    label: Qualified medical expenses paid using HSA distributions
    type: NonNegDollars
    expr:
      op: input
      source: |-
        The part of your 2025 HSA distributions used to pay qualified medical expenses; zero if none

        The expenses must not have been reimbursed by insurance or other coverage, and must have been incurred after the HSA was established.

        Whose expenses count:
        - yours and your spouse's
        - your dependents'
        - those of anyone who would be your dependent except that they filed a joint return, had gross income, or you (or your spouse, on a joint return) could be claimed as someone else's dependent
        - those of a child of divorced or separated parents, who counts for both parents

        Insurance premiums count only if they are for:
        - long-term care insurance
        - health care continuation coverage (such as COBRA), which can be for your spouse or a dependent
        - health care coverage while receiving unemployment compensation under federal or state law, which can be for your spouse or a dependent
        - Medicare and other health care coverage if you were 65 or older (not a Medicare supplemental policy, such as Medigap); if you, the HSA owner, are under 65, Medicare premiums for your spouse or dependents generally do not count
    cite:
      doc: i8889
      locator: p. 8, Line 15, "Only include on line 15 distributions from your HSA that were used to pay you for qualified
        medical expenses not reimbursed by insurance or other coverage and that you incurred after the HSA was established"
        and "Any person who would be a dependent except that"; p. 9, Line 15, TIP, divorced or separated parents; p. 2,
        Qualified Medical Expenses, "You cannot treat insurance premiums as qualified medical expenses unless the premiums are
        for:", "Long-term care (LTC) insurance", "Health care continuation coverage (such as coverage under COBRA)" and "Health
        care coverage while receiving unemployment compensation under federal or state law"; p. 3, "Medicare and other health
        care coverage if you were 65 or older (other than premiums for a Medicare supplemental policy, such as Medigap)",
        "Coverage under (2) and (3) can be for your spouse or a dependent meeting the requirement." and "are under age 65,
        Medicare premiums for your spouse or dependents (who are age 65 or older) are generally not qualified medical
        expenses"
  - id: f8889.medical_if_partial
    printed: (helper)
    label: 'Qualified medical expenses paid using HSA distributions: asked only when not all of the distributions paid them'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.medical_all_if_dist
          - const: false
        then: f8889.medical
      - guard:
          op: test
          eq:
          - f8889.medical_all_if_dist
          - const: true
        then: f8889.zero
    cite:
      doc: i8889
      locator: p. 8, Line 15
  - id: f8889.line15_dist
    printed: (helper)
    label: 'Line 15 when there were distributions: all of line 14c when every distribution paid qualified medical expenses,
      else the part that did'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.medical_all_if_dist
          - const: true
        then: f8889.line14c
      - guard:
          op: test
          eq:
          - f8889.medical_all_if_dist
          - const: false
        then: f8889.medical_if_partial
    cite:
      doc: i8889
      locator: 'p. 8, Line 15, "Only include on line 15 distributions from your HSA that were used to pay you for qualified
        medical expenses not reimbursed by insurance or other coverage and that you incurred after the HSA was established"'
  - id: f8889.line15
    printed: '15'
    label: Qualified medical expenses paid using HSA distributions (see instructions)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: true
        then: f8889.line15_dist
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 15; i8889 p. 8, Line 15
  - id: f8889.line16_figured
    printed: (helper)
    label: Line 14c less line 15, not less than zero, before the HSA screen
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8889.line14c
      take: f8889.line15
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 16, "Subtract line 15 from line 14c. If zero or less, enter -0-"
  - id: f8889.line16
    printed: '16'
    label: Taxable HSA distributions. Subtract line 15 from line 14c. If zero or less, enter -0-. Also, include this amount
      in the total on Schedule 1 (Form 1040), Part I, line 8f
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: true
        then: f8889.line16_figured
      - guard:
          op: test
          eq:
          - f8889.has_dist
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 16
    refuses:
    - when: f8889.owner_died
      form: Form 8889 for a person who died in 2025
      remedy: The Form 8889 of a person who died in 2025 follows special rules (the tax year ends with the month of death,
        so the last-month rule looks at that month and not at December, and an HSA left to the estate is included at its
        value on the date of death). This tool does not prepare it; prepare it with the person's final return.
      cite:
        doc: i8889
        locator: 'p. 2, Last-month rule; p. 3, Death of Account Beneficiary; i1040gi p. 12, Death of a Taxpayer'
    - when: f8889.inherited
      form: Form 8889 for an HSA acquired because its account beneficiary died
      remedy: An inherited HSA is reported differently (a beneficiary who is not the surviving spouse reports the account's
        value on the date of death on a Form 8889 of its own and skips Part I). This tool does not prepare it, and it does
        not prepare a surviving spouse's inherited HSA either.
      cite:
        doc: i8889
        locator: p. 3, Death of Account Beneficiary
    - when: f8889.excess_withdrawn
      form: Form 8889 lines 2, 13 and 14b for excess contributions withdrawn
      remedy: Excess contributions taken back out of an HSA by the due date of the return are treated as not contributed,
        and the withdrawal and its earnings are reported on lines 14a and 14b and as other income. This tool does not
        prepare that.
      cite:
        doc: i8889
        locator: p. 8, Excess Contributions You Make and Line 14b
    - when: f8889.dist_code_if_dist
      form: An HSA distribution with Form 1099-SA distribution code 2, 4, 5 or 6
      remedy: Box 3 of Form 1099-SA shows code 2 for excess contributions taken back, code 4 or 6 for a payment after the
        account owner's death, and code 5 for a prohibited transaction. This tool does not prepare any of these.
      cite:
        doc: f1099sa
        locator: p. 3, Instructions for Recipient, Box 3
  - id: f8889.has_taxable
    printed: (helper)
    label: Any taxable HSA distributions (line 16 more than zero)
    type: Bool
    expr:
      op: test
      gt:
      - f8889.line16
      - param: sales.zero
    cite:
      doc: i8889
      locator: p. 9, Lines 17a and 17b Additional 20% Tax, "HSA distributions included in income (line 16) are subject to
        an additional 20% tax unless one of the following exceptions applies"
  - id: f8889.line17a
    printed: 17a
    label: If any of the distributions included on line 16 meet any of the Exceptions to the Additional 20% Tax (see instructions),
      check here
    type: Bool
    expr:
      op: input
      source: Were any of your taxable HSA distributions made after you became disabled or turned age 65 (the exceptions to
        the additional 20% tax)?
    cite:
      doc: i8889
      locator: 'p. 9, Exceptions to the Additional 20% Tax, "The additional 20% tax does not apply to distributions made after
        the account beneficiary: • Dies, • Becomes disabled or • Turns age 65" and "If any of the exceptions apply to any
        of the distributions included on line 16, check the box on line 17a"'
  - id: f8889.subject_part
    printed: (helper)
    label: The part of line 16 that does not meet any of the exceptions
    type: NonNegDollars
    expr:
      op: input
      source: The part of your taxable HSA distributions (Form 8889 line 16) that was made before you became disabled or turned
        age 65 (the part subject to the additional 20% tax); zero if all of it was made after
    cite:
      doc: i8889
      locator: p. 9, Exceptions to the Additional 20% Tax, "Enter on line 17b only 20% (0.20) of any amount included on line
        16 that does not meet any of the exceptions"
  - id: f8889.subject_bad
    printed: (gate)
    label: The part subject to the additional 20% tax is more than line 16
    type: Bool
    expr:
      op: test
      gt:
      - f8889.subject_part
      - f8889.line16
    cite:
      doc: i8889
      locator: p. 9, Exceptions to the Additional 20% Tax, "any amount included on line 16"
  - id: f8889.subject_excepted
    printed: (helper)
    label: The part of line 16 subject to the additional 20% tax when some of it meets an exception
    type: NonNegDollars
    expr:
      op: copy
      from: f8889.subject_part
    cite:
      doc: i8889
      locator: p. 9, Exceptions to the Additional 20% Tax, "Enter on line 17b only 20% (0.20) of any amount included on line
        16 that does not meet any of the exceptions"
    ambiguity: amb.2025.hsa_partial_exception
    refuses:
    - when: f8889.subject_bad
      form: Form 8889 line 17b
      remedy: The part subject to the additional 20% tax is part of line 16 and cannot be more than it.
      cite:
        doc: i8889
        locator: p. 9, Exceptions to the Additional 20% Tax
  - id: f8889.subject
    printed: (helper)
    label: Distributions included on line 16 that are subject to the additional 20% tax
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.line17a
          - const: false
        then: f8889.line16
      - guard:
          op: test
          eq:
          - f8889.line17a
          - const: true
        then: f8889.subject_excepted
    cite:
      doc: i8889
      locator: p. 9, Lines 17a and 17b Additional 20% Tax, "HSA distributions included in income (line 16) are subject to
        an additional 20% tax unless one of the following exceptions applies"
  - id: f8889.line17b_figured
    printed: (helper)
    label: 20% of the distributions subject to the additional tax
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8889.subject
      rate:
        param: hsa.additional_rate
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 17b, "Enter 20% (0.20) of the distributions included on line 16 that are subject to the
        additional 20% tax"
    ambiguity: amb.2025.multiplication_subcent
  - id: f8889.line17b
    printed: 17b
    label: Additional 20% tax (see instructions). Enter 20% (0.20) of the distributions included on line 16 that are subject
      to the additional 20% tax. Also, include this amount in the total on Schedule 2 (Form 1040), Part II, line 17c
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8889.has_taxable
          - const: true
        then: f8889.line17b_figured
      - guard:
          op: test
          eq:
          - f8889.has_taxable
          - const: false
        then: f8889.zero
    cite:
      doc: f8889
      locator: Form 8889 (2025), line 17b; i8889 p. 9, Lines 17a and 17b Additional 20% Tax
    refuses:
    - when: f8889.mistake_repaid
      form: A mistaken HSA distribution repaid to the HSA
      remedy: A distribution made by mistake and returned to the HSA is left out of income and of the additional 20% tax
        under special rules (Notice 2004-50, Q&A 37 and 76). This tool does not prepare that.
      cite:
        doc: i8889
        locator: p. 9, Lines 17a and 17b, Note; f1099sa p. 3, Instructions for Recipient
    - when: f8889.loan
      form: A deemed distribution from an HSA
      remedy: Using an HSA as security for a loan, or a prohibited transaction with it such as borrowing from it, lending
        to it, or buying from or selling to it, counts as taking money out of the HSA (a deemed distribution), which is
        taxable and generally subject to the additional 20% tax. This tool does not prepare that.
      cite:
        doc: i8889
        locator: p. 3, Deemed Distributions From HSAs
  collection:
    parent: person
    cite:
      doc: i8889
      locator: 'p. 4, Name and social security number (SSN), "If married filing jointly and both you and your spouse have
        HSAs, complete a separate Form 8889 for each of you"'
