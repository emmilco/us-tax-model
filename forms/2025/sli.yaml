form:
  id: sli
  kind: form
  title: Student Loan Interest Deduction Worksheet—Schedule 1, Line 21
  tax_year: 2025
  note: The worksheet in the Form 1040 instructions; Pub. 970 cases (Form 2555, Form 4563, excluded Puerto Rico income) are
    refused.
  lines:
  - id: sli.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21
  - id: sli.no
    printed: (helper)
    label: Year parameter household.no (false)
    type: Bool
    expr:
      op: param
      ref: household.no
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'You paid interest in 2025 on a qualified student loan'
  - id: sli.any
    printed: (helper)
    label: You (or, on a joint return, your spouse) paid interest on a student loan in 2025
    type: Bool
    expr:
      op: input
      source: Did you (or, on a joint return, your spouse) pay interest on a student loan in 2025?
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'You paid interest in 2025 on a qualified student loan'
  - id: sli.any_if_not_mfs
    printed: (helper)
    label: You (or, on a joint return, your spouse) paid interest on a student loan in 2025, asked only when the filing status
      is not married filing separately (no otherwise, since that status cannot take the deduction)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - household.mfs
          - const: false
        then: sli.any
      - guard:
          op: test
          eq:
          - household.mfs
          - const: true
        then: sli.no
    cite:
      doc: i1040gi
      locator: 'p. 98, Schedule 1, line 21, "Your filing status is any status except married filing separately"'
  - id: sli.interest
    printed: (helper)
    label: Total interest you paid in 2025 on student loans
    type: NonNegDollars
    gated_by: sli.interest_if_any
    expr:
      op: input
      source: How much interest did you (or, on a joint return, your spouse) pay on student loans in 2025? Each lender reports it in box 1 of Form 1098-E; add the forms together.
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'You paid interest in 2025 on a qualified student loan'
  - id: sli.interest_if_any
    printed: (gate)
    label: Total interest paid in 2025 on student loans, asked only when interest was paid on a student loan (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - sli.any_if_not_mfs
          - const: true
        then: sli.interest
      - guard:
          op: test
          eq:
          - sli.any_if_not_mfs
          - const: false
        then: sli.zero
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'You paid interest in 2025 on a qualified student loan'
  - id: sli.unqualified_any
    printed: (helper)
    label: Any of that interest was on a loan that is not a qualified student loan, or one you were not legally obligated to pay
    type: Bool
    gated_by: sli.unqualified_any_if_any
    expr:
      op: input
      source: |-
        Was any of those loans one of these?

        - a loan from a relative, or from someone who borrowed the money from an employer's plan
        - a loan used partly for something other than school costs
        - a loan taken out for someone who was not you, your spouse or your dependent at the time
        - a loan for study not toward a degree, certificate or similar credential, or at a school that is not a college, university or eligible vocational school
        - a loan you were not legally bound to repay, such as one only your child signed
    cite:
      doc: i1040gi
      locator: pp. 98–99, Qualified student loan, 'A qualified student loan is any loan you took out to pay the qualified higher education expenses
        for any of the following individuals who were eligible students', 'a loan isn’t a qualified student loan if (a)
        any of the proceeds were used for other purposes, or (b) the loan was from either a related person or a person who
        borrowed the proceeds under a qualified employer plan or a contract purchased under such a plan', and Qualified
        higher education expenses, 'The expenses must be for education in a degree, certificate, or similar program at an
        eligible educational institution. An eligible educational institution includes most colleges, universities, and
        certain vocational schools.'; p970 p. 33, Don’t Include as Interest, "Interest you paid on a loan if, under the terms of the loan, you aren’t legally obligated to make interest payments"
  - id: sli.unqualified_any_if_any
    printed: (gate)
    label: Whether any of the interest was on a loan that is not a qualified student loan, or one you were not legally obligated to pay, asked only when interest was paid on a student loan (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - sli.any_if_not_mfs
          - const: true
        then: sli.unqualified_any
      - guard:
          op: test
          eq:
          - sli.any_if_not_mfs
          - const: false
        then: sli.no
    cite:
      doc: i1040gi
      locator: pp. 98–99, Qualified student loan, 'A qualified student loan is any loan you took out to pay the qualified higher education expenses
        for any of the following individuals who were eligible students', 'a loan isn’t a qualified student loan if (a)
        any of the proceeds were used for other purposes, or (b) the loan was from either a related person or a person who
        borrowed the proceeds under a qualified employer plan or a contract purchased under such a plan', and Qualified
        higher education expenses; p970 p. 33, Don’t Include as Interest, "Interest you paid on a loan if, under the terms of the loan, you aren’t legally obligated to make interest payments"
  - id: sli.unqualified
    printed: (helper)
    label: The part of that interest paid on loans that are not qualified student loans, or that you were not legally obligated to pay
    type: NonNegDollars
    gated_by: sli.unqualified_if_some
    expr:
      op: input
      source: How much of the interest was on those loans?
    cite:
      doc: i1040gi
      locator: pp. 98–99, Qualified student loan, 'A qualified student loan is any loan you took out to pay the qualified higher education expenses
        for any of the following individuals who were eligible students', 'a loan isn’t a qualified student loan if (a)
        any of the proceeds were used for other purposes, or (b) the loan was from either a related person or a person who
        borrowed the proceeds under a qualified employer plan or a contract purchased under such a plan', and Qualified
        higher education expenses; p970 p. 33, Don’t Include as Interest, "Interest you paid on a loan if, under the terms of the loan, you aren’t legally obligated to make interest payments"
  - id: sli.unqualified_if_some
    printed: (gate)
    label: The interest on loans that are not qualified student loans, or that you were not legally obligated to pay, asked only when there is such a loan (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - sli.unqualified_any_if_any
          - const: true
        then: sli.unqualified
      - guard:
          op: test
          eq:
          - sli.unqualified_any_if_any
          - const: false
        then: sli.zero
    cite:
      doc: i1040gi
      locator: pp. 98–99, Qualified student loan, 'A qualified student loan is any loan you took out to pay the qualified higher education expenses
        for any of the following individuals who were eligible students', 'a loan isn’t a qualified student loan if (a)
        any of the proceeds were used for other purposes, or (b) the loan was from either a related person or a person who
        borrowed the proceeds under a qualified employer plan or a contract purchased under such a plan', and Qualified
        higher education expenses; p970 p. 33, Don’t Include as Interest, "Interest you paid on a loan if, under the terms of the loan, you aren’t legally obligated to make interest payments"
  - id: sli.assisted_any
    printed: (helper)
    label: Any of that interest was paid by an employer under an educational assistance program, from tax-free qualified tuition program earnings or through tax-free student loan repayment assistance
    type: Bool
    gated_by: sli.assisted_any_if_any
    expr:
      op: input
      source: Was any of that interest paid for you (or, on a joint return, your spouse) by an employer's educational assistance plan, by a loan repayment program for health workers, or with tax-free earnings of a 529 plan?
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'Don't include any amount paid from a distribution of earnings made from a qualified
        tuition program (QTP)'; p4681 p. 5, Student loan repayment assistance, "You can’t deduct the interest you paid
        on a student loan to the extent payments were made through your participation in any of the above programs" and
        "The National Health Service Corps (NHSC) Loan Repayment Program"; p970 p. 33, No Double Benefit Allowed, "For
        payments made after March 27, 2020, do not deduct as interest on a student loan any interest paid by your employer
        under an educational assistance program"
  - id: sli.assisted_any_if_any
    printed: (gate)
    label: Whether any of the interest was paid by an employer under an educational assistance program, from tax-free qualified tuition program earnings or through tax-free loan repayment assistance, asked only when interest was paid on a student loan (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - sli.any_if_not_mfs
          - const: true
        then: sli.assisted_any
      - guard:
          op: test
          eq:
          - sli.any_if_not_mfs
          - const: false
        then: sli.no
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'Don't include any amount paid from a distribution of earnings made from a qualified
        tuition program (QTP)'; p4681 p. 5, Student loan repayment assistance, "You can’t deduct the interest you paid
        on a student loan to the extent payments were made through your participation in any of the above programs" and
        "The National Health Service Corps (NHSC) Loan Repayment Program"; p970 p. 33, No Double Benefit Allowed, "For
        payments made after March 27, 2020, do not deduct as interest on a student loan any interest paid by your employer
        under an educational assistance program"
  - id: sli.assisted
    printed: (helper)
    label: The part of that interest paid by an employer under an educational assistance program, from tax-free qualified tuition program earnings or through tax-free student loan repayment assistance
    type: NonNegDollars
    gated_by: sli.assisted_if_some
    expr:
      op: input
      source: How much of the interest was paid that way?
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'Don't include any amount paid from a distribution of earnings made from a qualified
        tuition program (QTP)'; p4681 p. 5, Student loan repayment assistance, "You can’t deduct the interest you paid
        on a student loan to the extent payments were made through your participation in any of the above programs" and
        "The National Health Service Corps (NHSC) Loan Repayment Program"; p970 p. 33, No Double Benefit Allowed, "For
        payments made after March 27, 2020, do not deduct as interest on a student loan any interest paid by your employer
        under an educational assistance program"
  - id: sli.assisted_if_some
    printed: (gate)
    label: The interest paid by an employer under an educational assistance program, from tax-free qualified tuition program earnings or through loan repayment assistance, asked only when there is some (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - sli.assisted_any_if_any
          - const: true
        then: sli.assisted
      - guard:
          op: test
          eq:
          - sli.assisted_any_if_any
          - const: false
        then: sli.zero
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'Don't include any amount paid from a distribution of earnings made from a qualified
        tuition program (QTP)'; p4681 p. 5, Student loan repayment assistance, "You can’t deduct the interest you paid
        on a student loan to the extent payments were made through your participation in any of the above programs" and
        "The National Health Service Corps (NHSC) Loan Repayment Program"; p970 p. 33, No Double Benefit Allowed, "For
        payments made after March 27, 2020, do not deduct as interest on a student loan any interest paid by your employer
        under an educational assistance program"
  - id: sli.not_counted
    printed: (helper)
    label: Interest that is not counted (on loans that are not qualified student loans or that you were not legally obligated to pay, and paid by an employer's educational assistance program, from tax-free earnings or through repayment assistance)
    type: NonNegDollars
    expr:
      op: sum
      of:
      - sli.unqualified_if_some
      - sli.assisted_if_some
    cite:
      doc: i1040gi
      locator: pp. 98–99, Qualified student loan, 'A qualified student loan is any loan you took out to pay the qualified higher education expenses
        for any of the following individuals who were eligible students', 'a loan isn’t a qualified student loan if (a)
        any of the proceeds were used for other purposes, or (b) the loan was from either a related person or a person who
        borrowed the proceeds under a qualified employer plan or a contract purchased under such a plan', and Qualified
        higher education expenses; p970 p. 33, Don’t Include as Interest, "Interest you paid on a loan if, under the terms of the loan, you aren’t legally obligated to make interest payments", and No Double Benefit Allowed, "do not deduct as interest on a student loan any interest paid by your employer under an educational assistance program"
  - id: sli.qualified
    printed: (helper)
    label: Total interest you paid in 2025 on qualified student loans
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: sli.interest_if_any
      take: sli.not_counted
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'You paid interest in 2025 on a qualified student loan' and 'Don't include any
        amount paid from a distribution of earnings made from a qualified tuition program (QTP)'
  - id: sli.has
    printed: (helper)
    label: Any student loan interest
    type: Bool
    expr:
      op: test
      gt:
      - sli.qualified
      - param: sales.zero
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21
  - id: sli.claimed_count
    printed: (helper)
    label: Number of the people on the return (you, and your spouse if filing jointly) claimed as a dependent on someone
      else's 2025 tax return
    type: Count
    expr:
      op: sum_over
      collection: person
      field: person.one
      where:
        op: test
        eq:
        - person.sav_claimed
        - const: true
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'You, or your spouse if filing jointly, aren't claimed as a dependent on someone
        else's (such as your parent's) 2025 tax return'
  - id: sli.max
    printed: (helper)
    label: Year parameter sli.max ($2,500)
    type: NonNegDollars
    expr:
      op: param
      ref: sli.max
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 1, $2,500
  - id: sli.line1
    printed: '1'
    label: Enter the total interest you paid in 2025 on qualified student loans (see the instructions for line 21). Don't
      enter more than $2,500
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - sli.qualified
      - sli.max
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 1
    refuses:
    - when: sa.excluded_income
      form: Pub. 970 (student loan interest with Form 2555 or 4563, or excluded Puerto Rico income)
      remedy: Use Pub. 970 instead of the worksheet; it is outside this tool.
      cite:
        doc: i1040gi
        locator: p. 98, Schedule 1, line 21, Exception
  - id: sli.line2
    printed: '2'
    label: Enter the amount from Form 1040 or 1040-SR, line 9
    type: Dollars
    expr:
      op: copy
      from: f1040.line9
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 2
  - id: sli.line3
    printed: '3'
    label: Enter the total of the amounts from Schedule 1, lines 11 through 20, and 23 and 25
    type: NonNegDollars
    expr:
      op: sum
      of:
      - s1.line11
      - s1.line13
      - s1.line15
      - s1.line16
      - s1.line17
      - s1.line18
      - s1.line19a
      - s1.line20
      - s1.line25
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 3 (lines 12, 14 and 23 are outside
        this tool and refused through line 2, Form 1040 line 9, by scope.schedule1)
  - id: sli.line4
    printed: '4'
    label: Subtract line 3 from line 2
    type: Dollars
    expr:
      op: subtract
      from: sli.line2
      take: sli.line3
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 4
  - id: sli.base_other
    printed: (helper)
    label: Year parameter sli.base_other ($85,000)
    type: NonNegDollars
    expr:
      op: param
      ref: sli.base_other
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 5, $85,000
  - id: sli.base_joint
    printed: (helper)
    label: Year parameter sli.base_joint ($170,000)
    type: NonNegDollars
    expr:
      op: param
      ref: sli.base_joint
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 5, $170,000
  - id: sli.line5
    printed: '5'
    label: Enter the amount shown below for your filing status. Single, head of household, or qualifying surviving spouse—$85,000.
      Married filing jointly—$170,000
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f1040.status
          - const: single
        then: sli.base_other
      - guard:
          op: test
          eq:
          - f1040.status
          - const: mfj
        then: sli.base_joint
      - guard:
          op: test
          eq:
          - f1040.status
          - const: mfs
        then: sli.zero
      - guard:
          op: test
          eq:
          - f1040.status
          - const: hoh
        then: sli.base_other
      - guard:
          op: test
          eq:
          - f1040.status
          - const: qss
        then: sli.base_other
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 5 (no amount for married filing
        separately, which cannot take the deduction)
  - id: sli.over
    printed: (helper)
    label: Is the amount on line 4 more than the amount on line 5?
    type: Bool
    expr:
      op: test
      gt:
      - sli.line4
      - sli.line5
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 6
  - id: sli.line6
    printed: '6'
    label: Subtract line 5 from line 4
    type: Dollars
    expr:
      op: subtract
      from: sli.line4
      take: sli.line5
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 6
  - id: sli.divisor_other
    printed: (helper)
    label: Year parameter sli.divisor_other ($15,000)
    type: NonNegDollars
    expr:
      op: param
      ref: sli.divisor_other
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 7, $15,000
  - id: sli.divisor_joint
    printed: (helper)
    label: Year parameter sli.divisor_joint ($30,000)
    type: NonNegDollars
    expr:
      op: param
      ref: sli.divisor_joint
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 7, $30,000
  - id: sli.divisor
    printed: (helper)
    label: $15,000 ($30,000 if married filing jointly)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f1040.status
          - const: single
        then: sli.divisor_other
      - guard:
          op: test
          eq:
          - f1040.status
          - const: mfj
        then: sli.divisor_joint
      - guard:
          op: test
          eq:
          - f1040.status
          - const: mfs
        then: sli.divisor_other
      - guard:
          op: test
          eq:
          - f1040.status
          - const: hoh
        then: sli.divisor_other
      - guard:
          op: test
          eq:
          - f1040.status
          - const: qss
        then: sli.divisor_other
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 7
  - id: sli.line8_figured
    printed: (helper)
    label: Divide line 6 by $15,000 ($30,000 if married filing jointly), rounded to three places, not more than 1.000; multiply
      line 1 by the result
    type: NonNegDollars
    expr:
      op: prorate
      amount: sli.line1
      part: sli.line6
      whole: sli.divisor
      places: 3
    cite:
      doc: i1040gi
      locator: 'p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, lines 7 and 8, "Divide line 6 by $15,000 ($30,000 if married filing jointly). Enter the result as a decimal (rounded to at least three places). If the result is 1.000 or more, enter 1.000" and "Multiply line 1 by line 7" (rounded to three places: amb.2025.sli_ratio_places)'
    ambiguity: amb.2025.sli_ratio_places
  - id: sli.line8
    printed: '8'
    label: Multiply line 1 by line 7
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - sli.over
          - const: true
        then: sli.line8_figured
      - guard:
          op: test
          eq:
          - sli.over
          - const: false
        then: sli.zero
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 6, "No. Skip lines 6 and 7,
        enter -0- on line 8, and go to line 9", line 8, "Multiply line 1 by line 7"
  - id: sli.line9
    printed: '9'
    label: Student loan interest deduction. Subtract line 8 from line 1. Enter the result here and on Schedule 1, line 21
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: sli.line1
      take: sli.line8
    cite:
      doc: i1040gi
      locator: p. 99, Student Loan Interest Deduction Worksheet—Schedule 1, Line 21, line 9 (line 8 never exceeds line 1,
        since the ratio is at most 1.000)
  - id: sli.eligible
    printed: (helper)
    label: 'You can take the deduction: a filing status other than married filing separately, and not claimed as a dependent'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        ne:
        - f1040.status
        - const: mfs
      - op: test
        eq:
        - sli.claimed_count
        - const: 0
          type: Count
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21, 'You can take this deduction only if all of the following apply'
  - id: sli.allowed
    printed: (helper)
    label: Student loan interest deduction for an eligible filer
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - sli.eligible
          - const: true
        then: sli.line9
      - guard:
          op: test
          eq:
          - sli.eligible
          - const: false
        then: sli.zero
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21
  - id: sli.deduction
    printed: (helper)
    label: Student loan interest deduction (Schedule 1, line 21)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - sli.has
          - const: true
        then: sli.allowed
      - guard:
          op: test
          eq:
          - sli.has
          - const: false
        then: sli.zero
    cite:
      doc: i1040gi
      locator: p. 98, Schedule 1, line 21
