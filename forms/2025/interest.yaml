form:
  id: interest
  kind: form
  title: Schedule B — interest payer entries
  tax_year: 2025
  note: Amounts are supplied from payer records; special treatments are screened at Schedule B. The early withdrawal penalty
    of each payer is totaled on Schedule 1 line 18.
  lines:
    - id: interest.amount
      printed: (helper)
      type: NonNegDollars
      label: Taxable interest from this payer, including Treasury interest; exclude tax-exempt interest
      expr:
        op: input
        source: Taxable interest from this payer, including Treasury interest; exclude tax-exempt interest
      cite:
        doc: i1040sb
        locator: pp. 1–3, interest, dividends and foreign accounts/trusts
    - id: interest.penalty
      printed: (helper)
      type: NonNegDollars
      label: Early withdrawal penalty charged by this payer (Form 1099-INT box 2, or the penalty shown on Form 1099-OID)
      expr:
        op: input
        source: Penalty on early withdrawal of savings this payer charged you (box 2 of Form 1099-INT, or the early withdrawal
          penalty shown on Form 1099-OID); zero if none. Do not subtract it from the interest.
      cite:
        doc: i1040gi
        locator: p. 95, Line 18, "The Form 1099-INT or Form 1099-OID you received will show the amount of any penalty you
          were charged"; f1099int p. 5, Instructions for Recipient, "Box 2. Shows interest or principal forfeited because
          of early withdrawal of time savings. You may deduct this amount to figure your adjusted gross income on your income
          tax return"
  collection:
    cite:
      doc: i1040sb
      locator: pp. 1–3, interest, dividends and foreign accounts/trusts
