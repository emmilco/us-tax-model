form:
  id: household
  kind: form
  title: Household facts for dependents and head of household
  tax_year: 2025
  note: Facts about the people on the return that the dependent tests, the credits and the head of
    household status read; "unmarried" here is the instructions' unmarried or considered unmarried
    at the end of 2025.
  lines:
    - id: household.persons
      printed: (helper)
      type: Count
      label: 'Number of people on the return (you, and your spouse if filing jointly)'
      expr:
        op: sum_over
        collection: person
        field: person.one
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
    - id: household.taxpayers
      printed: (helper)
      type: Count
      label: 'Number of entries for you'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.role
          - const: taxpayer
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
    - id: household.spouses
      printed: (helper)
      type: Count
      label: 'Number of entries for your spouse'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.role
          - const: spouse
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
    - id: household.roster_ok
      printed: (helper)
      type: Bool
      label: 'One entry for you, and one for your spouse exactly when filing jointly'
      expr:
        op: test
        any:
        - op: test
          all:
          - op: test
            eq:
            - f1040.status
            - const: mfj
          - op: test
            eq:
            - household.taxpayers
            - const: 1
              type: Count
          - op: test
            eq:
            - household.spouses
            - const: 1
              type: Count
        - op: test
          all:
          - op: test
            ne:
            - f1040.status
            - const: mfj
          - op: test
            eq:
            - household.taxpayers
            - const: 1
              type: Count
          - op: test
            eq:
            - household.spouses
            - const: 0
              type: Count
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
      refuses:
        - when: household.filer_under16
          form: A filer under age 16 at the end of 2025
          remedy: A return for a person under age 16 at the end of 2025 (you, or your spouse on a joint return) is outside this
            tool. The archived instructions state no such rule; this is an entry check the owner decided on, recorded in the
            ambiguity register (amb.2025.filer_under_16).
          cite:
            doc: i1040gi
            locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
    - id: household.roster_bad
      printed: (gate)
      type: Bool
      label: 'The people entered do not match the filing status'
      expr:
        op: test
        eq:
        - household.roster_ok
        - const: false
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
    - id: household.hsa_people
      printed: (helper)
      type: Count
      label: Number of people on the return with a Form 8889
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          gt:
          - person.hsa_forms
          - const: 0
            type: Count
      cite:
        doc: i8889
        locator: 'p. 4, Name and social security number (SSN), "If married filing jointly and both you and your spouse have HSAs, complete a separate Form 8889 for each of you"'
    - id: household.hsa_both
      printed: (helper)
      type: Bool
      label: You and your spouse each have a Form 8889
      expr:
        op: test
        eq:
        - household.hsa_people
        - const: 2
          type: Count
      cite:
        doc: i8889
        locator: p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, Steps 1 to 3, "Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, use the following rules to figure the amount on line 6", "Step 1. Refigure the contribution limit that
          would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for
          the months you were treated as having family coverage", "Step 2. Divide the refigured contribution limit
          from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as
          allocating nothing to one spouse)", "Step 3. Subtract the part of the contribution limit allocated to your
          spouse in Step 2 from the amount determined in Step 1"
    - id: household.hsa_split_count
      printed: (helper)
      type: Count
      label: 'Number of Forms 8889 using the spouse rule of line 6'
      expr:
        op: sum_over
        collection: person
        field: person.hsa_split
      cite:
        doc: i8889
        locator: p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, Steps 1 to 3, "Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, use the following rules to figure the amount on line 6", "Step 1. Refigure the contribution limit that
          would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for
          the months you were treated as having family coverage", "Step 2. Divide the refigured contribution limit
          from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as
          allocating nothing to one spouse)", "Step 3. Subtract the part of the contribution limit allocated to your
          spouse in Step 2 from the amount determined in Step 1"
    - id: household.hsa_agreed_count
      printed: (helper)
      type: Count
      label: 'Number of Forms 8889 using an agreed allocation'
      expr:
        op: sum_over
        collection: person
        field: person.hsa_agreed
      cite:
        doc: i8889
        locator: p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, Steps 1 to 3, "Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, use the following rules to figure the amount on line 6", "Step 1. Refigure the contribution limit that
          would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for
          the months you were treated as having family coverage", "Step 2. Divide the refigured contribution limit
          from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as
          allocating nothing to one spouse)", "Step 3. Subtract the part of the contribution limit allocated to your
          spouse in Step 2 from the amount determined in Step 1"
    - id: household.hsa_step1_sum
      printed: (helper)
      type: NonNegDollars
      label: 'Both spouses Step 1 limits added together'
      expr:
        op: sum_over
        collection: person
        field: person.hsa_step1
      cite:
        doc: i8889
        locator: p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, Steps 1 to 3, "Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, use the following rules to figure the amount on line 6", "Step 1. Refigure the contribution limit that
          would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for
          the months you were treated as having family coverage", "Step 2. Divide the refigured contribution limit
          from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as
          allocating nothing to one spouse)", "Step 3. Subtract the part of the contribution limit allocated to your
          spouse in Step 2 from the amount determined in Step 1"
    - id: household.hsa_share_sum
      printed: (helper)
      type: NonNegDollars
      label: 'Both spouses parts of the Step 1 limit added together'
      expr:
        op: sum_over
        collection: person
        field: person.hsa_share
      cite:
        doc: i8889
        locator: p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, Steps 1 to 3, "Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, use the following rules to figure the amount on line 6", "Step 1. Refigure the contribution limit that
          would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for
          the months you were treated as having family coverage", "Step 2. Divide the refigured contribution limit
          from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as
          allocating nothing to one spouse)", "Step 3. Subtract the part of the contribution limit allocated to your
          spouse in Step 2 from the amount determined in Step 1"
    - id: household.work_ssn_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return with an SSN valid for employment'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.work_ssn
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, and p. 40, Step 1, question 2'
    - id: household.any_work_ssn
      printed: (helper)
      type: Bool
      label: 'You, or your spouse if filing jointly, have an SSN valid for employment'
      expr:
        op: test
        gt:
        - household.work_ssn_count
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "If you are filing a joint return, only one spouse is required to have a valid SSN to be eligible for the CTC and ACTC"'
    - id: household.eic_ssn_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return with an SSN valid for the EIC'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.eic_ssn
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 40, Step 1, question 2; p. 44, Social security number (SSN), "For the EIC, a valid SSN is a number issued by the Social Security Administration unless “Not Valid for Employment” is printed on the social security card and the number was issued solely to allow the recipient of the SSN to apply for or receive a federally funded benefit"'
    - id: household.all_eic_ssn
      printed: (helper)
      type: Bool
      label: 'You, and your spouse if filing jointly, have SSNs valid for the EIC'
      expr:
        op: test
        eq:
        - household.eic_ssn_count
        - household.persons
      cite:
        doc: i1040gi
        locator: 'p. 40, Step 1, question 2, "Do you, and your spouse if filing a joint return, have a social security number ... that allows you to work and is valid for EIC purposes"; p. 44, Social security number (SSN), "For the EIC, a valid SSN is a number issued by the Social Security Administration unless “Not Valid for Employment” is printed on the social security card and the number was issued solely to allow the recipient of the SSN to apply for or receive a federally funded benefit"'
    - id: household.under16_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return under age 16 at the end of 2025'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.under16
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
    - id: household.filer_under16
      printed: (gate)
      type: Bool
      label: 'You, or your spouse if filing jointly, were under age 16 at the end of 2025'
      expr:
        op: test
        gt:
        - household.under16_count
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
      ambiguity: amb.2025.filer_under_16
    - id: household.tin_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return with an SSN or ITIN, or who have applied for an ITIN'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.tin_or_itin_applied
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "If you want to claim the credit for other dependents, you, and your spouse if filing jointly, must have either an SSN or ITIN"; p. 19, Step 5, question 1, "(Answer ''Yes'' if you are applying for an ITIN on or before the return due date (including extensions).)"'
    - id: household.all_tin
      printed: (helper)
      type: Bool
      label: 'You, and your spouse if filing jointly, have an SSN or ITIN, or have applied for an ITIN'
      expr:
        op: test
        eq:
        - household.tin_count
        - household.persons
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "If you want to claim the credit for other dependents, you, and your spouse if filing jointly, must have either an SSN or ITIN"'
    - id: household.id_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return with an SSN valid for employment or an SSN or ITIN'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.work_ssn_or_tin
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "The other spouse must have either an SSN or ITIN"'
      ambiguity: amb.2025.ctc_spouse_itin_application
    - id: household.ctc_ssn
      printed: (helper)
      type: Bool
      label: 'Child tax credit identification: you, or your spouse if filing jointly, have an SSN valid for employment, and each other person on the return has an SSN or ITIN'
      expr:
        op: test
        all:
        - op: test
          eq:
          - household.any_work_ssn
          - const: true
        - op: test
          eq:
          - household.id_count
          - household.persons
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "If you are filing a joint return, only one spouse is required to have a valid SSN to be eligible for the CTC and ACTC. The other spouse must have either an SSN or ITIN"'
    - id: household.taxpayer_work_ssn_count
      printed: (helper)
      label: Your entry, if the answer is yes
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.role
            - const: taxpayer
          - op: test
            eq:
            - person.work_ssn
            - const: true
      cite:
        doc: i1040gi
        locator: 'p. 101, Schedule 1-A, Part II, "You have a valid social security number (SSN)"; p. 104, Valid SSN for No
          Tax on Tips, "A valid SSN for purposes of the deduction for qualified tips is one that is valid for employment and
          that is issued by the Social Security Administration (SSA) before the due date of your 2025 return (including extensions)";
          p. 108, Valid SSN, "A valid SSN for purposes of the deduction for qualified overtime compensation is one that is valid
          for employment"; p. 110, Valid SSN, "A valid SSN for purposes of the enhanced deduction for seniors is one that is
          valid for employment"'
    - id: household.taxpayer_work_ssn
      printed: (helper)
      label: Do you have an SSN valid for employment issued before the due date of your return?
      type: Bool
      expr:
        op: test
        gt:
        - household.taxpayer_work_ssn_count
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: 'p. 101, Schedule 1-A, Part II, "You have a valid social security number (SSN)"; p. 104, Valid SSN for No
          Tax on Tips, "A valid SSN for purposes of the deduction for qualified tips is one that is valid for employment and
          that is issued by the Social Security Administration (SSA) before the due date of your 2025 return (including extensions)";
          p. 108, Valid SSN, "A valid SSN for purposes of the deduction for qualified overtime compensation is one that is valid
          for employment"; p. 110, Valid SSN, "A valid SSN for purposes of the enhanced deduction for seniors is one that is
          valid for employment"'
    - id: household.home_cost
      printed: (helper)
      type: Bool
      label: Did you pay over half the cost of keeping up your home for 2025?
      expr:
        op: input
        source: Did you pay over half the cost of keeping up your home for 2025? Cost of keeping up a home includes expenses such as rent, mortgage interest, real estate taxes, insurance on the home, repairs, utilities, and food eaten in the home. It does not include the cost of clothing, education, medical treatment, vacations, life insurance, or transportation, or the value of your services or those of a member of your household. Amounts paid out of funds received in the name of a person who lives in the home, such as their Social Security, count as paid by that person, not you. TANF or similar payments you received and used for the home count as paid by you.
      cite:
        doc: i1040gi
        locator: 'p. 14, Head of Household, Test 2; p. 15, "Keeping up a home. To find out what is included in the cost of keeping up a home, see Pub. 501."; p501 p. 9, Keeping Up a Home, "Costs you include. Include in the cost of keeping up a home expenses such as rent, mortgage interest, real estate taxes, insurance on the home, repairs, utilities, and food eaten in the home." p501 p. 9, "Costs you don’t include. Don’t include the cost of clothing, education, medical treatment, vacations, life insurance, or transportation. Also don’t include the value of your services or those of a member of your household." p501 p. 9, Note, "Amounts paid out of funds received in the child’s or qualifying person’s name, such as Social Security, are considered paid by the child, not you."; p501 p. 9, Note, "if you received Temporary Assistance to Needy Families (TANF) payments or other similar payments and used the payment to support another person, those payments are considered support you provided for that person"'
    - id: household.unmarried
      printed: (helper)
      type: Bool
      label: Were you unmarried, or considered unmarried under the head of household rules, at the end of 2025?
      expr:
        op: input
        source: |-
          Were you unmarried at the end of 2025, or considered unmarried for head of household?

          You are considered unmarried if any of these applies (if your spouse died in 2025, you are considered married for the whole year: answer No).

          - At the end of 2025 you were legally separated under your state's law by a decree of divorce or separate maintenance (if your divorce wasn't final at the end of 2025, an interlocutory decree, you were married).
          - You are married but lived apart from your spouse for the last 6 months of 2025, and all of these apply:
            - you file a separate return from your spouse
            - you paid over half the cost of keeping up your home for 2025
            - your home was the main home of your child, stepchild or foster child for more than half of 2025 (temporary absences by you or the child for special circumstances count as time lived in the home; a child born or who died in 2025 meets this if the child lived with you for more than half the part of the year the child was alive; a child adopted, lawfully placed with you for legal adoption or placed as an eligible foster child in 2025 meets it if your main home was the child's main home for more than half the time since)
            - you can claim this child as your dependent, or could except that the child's other parent can claim the child under the rule for children of divorced or separated parents
          - Your spouse was a nonresident alien at any time during 2025 and you did not elect to treat your spouse as a resident alien.

          Your spouse counts as living in your home during a temporary absence for special circumstances, such as business, medical care, school or military service, if it was reasonable to assume your spouse would return and you kept up the home during the absence.
      cite:
        doc: i1040gi
        locator: 'p. 14, Head of Household, "You are considered unmarried for this purpose if any of the following applies" through "the election to treat the alien spouse as a resident alien is not made"; p. 15, Married persons who live apart, "Even if you weren’t divorced or legally separated at the end of 2025, you are considered unmarried if all of the following apply" through "under the rule for Children of divorced or separated parents"; p. 14, Exception to time lived with you, "Temporary absences by you or the other person for special circumstances"; p. 15, Exception to time lived with you, "If the person is your qualifying child, the child must have lived with you for more than half the part of the year the child was alive" through "for more than half the time since the person was adopted or placed with you in 2025"; p501 p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."; p501 p. 8, Considered Unmarried, "Your spouse is considered to live in your home even if your spouse is temporarily absent due to special circumstances. See Temporary absences, later."; p501 p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."'
    - id: household.married
      printed: (helper)
      type: Bool
      label: Were you married at the end of 2025?
      expr:
        op: input
        source: |-
          Were you married at the end of 2025 (including married but considered unmarried for head of household status)?

          Use the marriage recognized under the law of the state or territory where it was entered into; a marriage entered into under foreign or American Indian tribal law counts if at least one U.S. state or territory would recognize it as a marriage.

          Include a common law marriage recognized in the state where you now live or where it began.

          Living apart does not end a marriage; an interlocutory (not final) divorce decree still means married.

          Answer No if, by December 31, you were divorced under a final decree, legally separated under a decree of divorce or separate maintenance, or had a court decree of annulment holding that no valid marriage ever existed.

          A registered domestic partnership, civil union or similar relationship not denominated as a marriage is not a marriage for federal tax purposes.

          This question asks whether you were married at year end; the separate filing-status rules for a spouse who died during 2025 are addressed separately.

          When choosing your filing status, also note: if you divorced solely to file as unmarried, intending at the time to remarry each other in the next tax year, and actually do so, you must file as married in both years.
      cite:
        doc: i1040gi
        locator: 'p. 41, Step 3, question 3, and Step 4, question 1, "Are you a married taxpayer whose filing status is married filing separately or head of household?"; i8889 p. 4, Line 3, rule 6, "If, at the end of 2025, you were age 55 or older and unmarried or married with self-only HDHP coverage for the entire year"; p501 p. 6, Marital Status, "State law governs whether you are married or legally separated under a divorce or separate maintenance decree."; p501 p. 6, Definition of marriage, "Individuals who have entered into a registered domestic partnership, civil union, or other similar relationship"; p501 p. 6, Considered married, "You are living together in a common law marriage recognized in the state where you now live or in the state where the common law marriage began."; p501 p. 6, Divorce and remarriage, "you and your spouse must file as married individuals in both years."; p501 p. 6, Annulled marriages, "you are considered unmarried even if you filed joint returns for earlier years."'
    - id: household.community_property
      printed: (helper)
      type: Bool
      label: Did you live in a community property state at any time in 2025?
      expr:
        op: input
        source: Did you live in a community property state (Arizona, California, Idaho, Louisiana, Nevada, New Mexico,
          Texas, Washington or Wisconsin) at any time in 2025?
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, "Community property states include Arizona, California, Idaho, Louisiana, Nevada, New Mexico, Texas, Washington, and Wisconsin"'
    - id: household.hoh_cp_married
      printed: (helper)
      label: 'Filing as head of household: married at the end of 2025, and lived in a community property state'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.married
            - const: true
          then: household.community_property
        - guard:
            op: test
            eq:
            - household.married
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually
          follow state law to determine what is community income and what is separate income"
    - id: household.hoh_community_property
      printed: (gate)
      type: Bool
      label: Married, filing as head of household, and living in a community property state
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.hoh_cp_married
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income"'
      ambiguity: amb.2025.hoh_community_property
    - id: household.credit_disallowed
      printed: (helper)
      type: Bool
      gated_by: household.credit_disallowed_if_claimed
      label: Was your (or, on a joint return, your spouse's) EIC for a year after 1996, or child tax credit, additional child tax credit
        or credit for other dependents for a year after 2015, reduced or disallowed other than for a math or clerical error, or is
        either of you in a 2- or 10-year disallowance period?
      expr:
        op: input
        source: Was the earned income credit of you (or, on a joint return, your spouse) for any year after 1996, or the child
          tax credit, additional child tax credit or credit for other dependents of either of you for any year after 2015,
          reduced or disallowed for any reason other than a math or clerical error, or is either of you in a 2- or 10-year
          period during which you can't take one of these credits because an earlier claim was found to be reckless,
          intentional or fraudulent?
      cite:
        doc: i1040gi
        locator: 'p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error" and "don’t file Form 8862 or take the credit for the ... 2 years after the most recent tax year for which there was a final determination that your EIC claim was due to reckless or intentional disregard of the EIC rules ... 10 years after the most recent tax year for which there was a final determination that your EIC claim was due to fraud"; p. 39, Form 8862, who must file, "You must file Form 8862 to claim the child tax credit or credit for other dependents if your child tax credit (refundable or nonrefundable depending on the tax year), additional child tax credit, or credit for other dependents for a year after 2015 was denied or reduced for any reason other than a math or clerical error"; i1040s8812 p. 2, Form 8862 may be required, "If your CTC, ACTC, or ODC for a year after 2015 was denied or reduced for any reason other than a math or clerical error, you must attach Form 8862 to your tax return to claim the CTC, ACTC, or ODC unless an exception applies"'
    - id: household.no
      printed: (helper)
      type: Bool
      label: Year parameter household.no (false)
      expr:
        op: param
        ref: household.no
      cite:
        doc: i1040gi
        locator: 'p. 39, Form 8862, who must file, "You must file Form 8862 to claim the child tax credit or credit for other dependents if your child tax credit"; p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.eic_above_zero
      printed: (helper)
      type: Bool
      label: The earned income credit figured in Step 6 (Worksheet A line 6, or Worksheet B line 11 for a filer who answered Yes to
        Step 5, question 2) is more than zero
      expr:
        op: test
        gt:
          - eic.line6
          - eic.zero
      cite:
        doc: i1040gi
        locator: 'p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.eic_claimed
      printed: (helper)
      type: Bool
      label: The earned income credit is claimed (Steps 1 to 5 are passed and the credit figured in Step 6, Worksheet A line 6 or
        Worksheet B line 11, is more than zero; false when Steps 1 to 5 are not passed)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - eic.eligible
                - const: true
            then: household.eic_above_zero
          - guard:
              op: test
              eq:
                - eic.eligible
                - const: false
            then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.claims_8862_credit
      printed: (helper)
      type: Bool
      label: The return claims the earned income credit, the child tax credit, the credit for other dependents or the additional
        child tax credit (the earned income credit is claimed, or Schedule 8812 line 8 is more than line 11)
      expr:
        op: test
        any:
          - op: test
            gt:
              - s8812.line8
              - s8812.line11
          - op: test
            eq:
              - household.eic_claimed
              - const: true
      cite:
        doc: i1040gi
        locator: 'p. 39, Form 8862, who must file, "You must file Form 8862 to claim the child tax credit or credit for other dependents if your child tax credit"; p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"; i1040s8812 p. 2, Form 8862 may be required, "you must attach Form 8862 to your tax return to claim the CTC, ACTC, or ODC unless an exception applies"'
    - id: household.credit_disallowed_if_claimed
      printed: (helper)
      type: Bool
      label: Whether an earlier earned income credit, child tax credit, additional child tax credit or credit for other dependents
        was reduced or disallowed (or a disallowance period applies), asked only when the return claims one of these credits
        (false otherwise, where Form 8862 does not apply)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - household.claims_8862_credit
                - const: true
            then: household.credit_disallowed
          - guard:
              op: test
              eq:
                - household.claims_8862_credit
                - const: false
            then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 39, Form 8862, who must file, "You must file Form 8862 to claim the child tax credit or credit for other dependents if your child tax credit"; p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.ctc_disallowed_claim
      printed: (gate)
      type: Bool
      label: Schedule 8812 line 8 is more than line 11 (a child tax credit or credit for other dependents is figured) and an earlier
        credit was reduced or disallowed (or a disallowance period applies)
      expr:
        op: test
        all:
          - op: test
            gt:
              - s8812.line8
              - s8812.line11
          - op: test
            eq:
              - household.credit_disallowed_if_claimed
              - const: true
      cite:
        doc: i1040s8812
        locator: 'p. 2, Form 8862 may be required, "If your CTC, ACTC, or ODC for a year after 2015 was denied or reduced for any reason other than a math or clerical error, you must attach Form 8862 to your tax return to claim the CTC, ACTC, or ODC unless an exception applies"'
    - id: household.eic_disallowed_claim
      printed: (gate)
      type: Bool
      label: The earned income credit is claimed (Steps 1 to 5 are passed with a credit above zero on Worksheet A line 6 or
        Worksheet B line 11) and an earlier credit was reduced or disallowed (or a disallowance period applies)
      expr:
        op: test
        all:
          - op: test
            eq:
              - household.eic_claimed
              - const: true
          - op: test
            eq:
              - household.credit_disallowed_if_claimed
              - const: true
      cite:
        doc: i1040gi
        locator: 'p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.test1_persons
      printed: (helper)
      type: Count
      label: Number of parents who qualify you under Test 1
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.hoh_test1
            - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 1
    - id: household.test2_persons
      printed: (helper)
      type: Count
      label: Number of persons who qualify you under Test 2
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.hoh_test2
            - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2
    - id: household.test2_absence_persons
      printed: (helper)
      type: Count
      label: Number of persons who would qualify you under Test 2 only by counting an absence head of household does not count
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.hoh_absence
            - const: true
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."
    - id: household.hoh_absence_from_test1
      printed: (helper)
      label: 'Head of household turns on an absence head of household does not count, from Test 1 on: Test 1 not met, home cost
        paid, no Test 2 person, and a person who would be one only by counting an absence'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.test1_met
            - const: true
          then: household.no
        - guard:
            op: test
            eq:
            - household.test1_met
            - const: false
          then: household.hoh_absence_from_cost
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.hoh_absence_from_cost
      printed: (helper)
      label: 'Head of household turns on an absence head of household does not count, from the home cost on: home cost paid, no
        Test 2 person, and a person who would be one only by counting an absence'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: true
          then: household.hoh_absence_from_test2
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: false
          then: household.no
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.hoh_absence_from_test2
      printed: (helper)
      label: 'Head of household turns on an absence head of household does not count, from Test 2 on: no Test 2 person, and a
        person who would be one only by counting an absence'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.no_test2_persons
            - const: true
          then: household.any_test2_absence
        - guard:
            op: test
            eq:
            - household.no_test2_persons
            - const: false
          then: household.no
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.no_test2_persons
      printed: (helper)
      label: No person qualifies you under Test 2
      type: Bool
      expr:
        op: test
        eq:
        - household.test2_persons
        - const: 0
          type: Count
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.any_test2_absence
      printed: (helper)
      label: A person would qualify you under Test 2 only by counting an absence head of household does not count
      type: Bool
      expr:
        op: test
        gt:
        - household.test2_absence_persons
        - const: 0
          type: Count
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.hoh_absence
      printed: (gate)
      type: Bool
      label: Head of household turns on a person who lived with you more than half the year only by counting an absence head of household does not count
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.unmarried
            - const: true
          then: household.hoh_absence_from_test1
        - guard:
            op: test
            eq:
            - household.unmarried
            - const: false
          then: household.no
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."
    - id: household.test1_met
      printed: (helper)
      type: Bool
      label: Test 1 met
      expr:
        op: test
        gt:
          - household.test1_persons
          - const: 0
            type: Count
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 1
    - id: household.any_test2_person
      printed: (helper)
      label: A person qualifies you under Test 2
      type: Bool
      expr:
        op: test
        gt:
        - household.test2_persons
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2, "You paid over half the cost of keeping up a home in which you lived and in
          which one of the following also lived for more than half of the year"
    - id: household.test2_met
      printed: (helper)
      type: Bool
      label: Test 2 met, having paid over half the cost of keeping up your own home
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: true
          then: household.any_test2_person
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2, "You paid over half the cost of keeping up a home in which you lived and in which one of the following also lived for more than half of the year"
    - id: household.hoh_eligible
      printed: (helper)
      type: Bool
      label: Unmarried or considered unmarried, and Test 1 or Test 2 applies
      expr:
        op: test
        all:
          - op: test
            eq:
              - household.unmarried
              - const: true
          - op: test
            any:
              - op: test
                eq:
                  - household.test1_met
                  - const: true
              - op: test
                eq:
                  - household.test2_met
                  - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, "Check the 'Head of household' box only if you are unmarried (or considered unmarried) and either Test 1 or Test 2 applies"
      refuses:
        - when: household.hoh_absence
          form: Temporary absences for head of household (Pub. 501)
          remedy: For head of household, an absence counts as time lived with you only if it was reasonable to assume the
            absent person would return and you kept up the home; the time the person who would qualify you lived with you
            must be recounted under that rule, which this tool does not do.
          cite:
            doc: p501
            locator: p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."
        - when: household.hoh_community_property
          form: Community income on a married head of household return in a community property state (Form 8958; Pub. 555)
          remedy: A married person filing as head of household who lived in a community property state may have to report
            community income under state law; Form 8958 and the community property rules of Pub. 555 are outside this tool.
          cite:
            doc: i1040gi
            locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555"'
    - id: household.hoh_fails
      printed: (gate)
      type: Bool
      label: Head of household checked without meeting its tests
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1040.status
              - const: hoh
          - op: test
            eq:
              - household.hoh_eligible
              - const: false
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household
    - id: household.qss_eligible
      printed: (helper)
      type: Bool
      label: Do all five qualifying surviving spouse tests apply to you?
      expr:
        op: input
        source: |-
          Do all five of these tests apply to you?

          - Your spouse died in 2023 or 2024 and you didn't remarry before the end of 2025 (if your spouse died in 2025, answer No).
          - You have a child or stepchild (not a foster child) whom you can claim as a dependent, or could claim as a dependent except that, for 2025, the child had gross income of $5,200 or more, the child filed a joint return, or you could be claimed as a dependent on someone else's return; an adopted child, including a child lawfully placed with you for legal adoption, is always your own child.
          - This child lived in your home for all of 2025, counting temporary absences by you or the child for special circumstances, such as school, vacation, business, medical care, military service or detention in a juvenile facility, as time lived in the home, but only an absence from which it was reasonable to assume the absent person would return and during which you kept up the home; a child born or who died in 2025, or adopted or lawfully placed with you for legal adoption in 2025, lived with you all year if your home was the child's home for the entire time the child was alive, or since the adoption or placement; if the child did not live with you all of 2025 because the child was presumed by law enforcement authorities to have been kidnapped by someone who isn't a member of your family or the child's family, answer No (the kidnapped-child rule of Pub. 501 is outside this tool).
          - You paid over half the cost of keeping up your home (rent, mortgage interest, real estate taxes, insurance on the home, repairs, utilities and food eaten in the home; not clothing, education, medical treatment, vacations, life insurance, transportation, or the value of your own or a household member’s services; amounts paid from a household member’s own funds, such as Social Security, count as paid by them; TANF or similar payments you received and used for the home count as paid by you).
          - You could have filed a joint return with your spouse the year your spouse died, even if you didn't actually do so.
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "You can check the “Qualifying surviving spouse” box in the Filing Status section on page 1 of Form 1040 or 1040-SR and use joint return tax rates for 2025 if all of the following apply. 1. Your spouse died in 2023 or 2024 and you didn’t remarry before the end of 2025. 2. You have a child or stepchild (not a foster child) whom you can claim as a dependent or could claim as a dependent except that, for 2025: a. The child had gross income of $5,200 or more, b. The child filed a joint return, or c. You could be claimed as a dependent on someone else’s return." and "3. This child lived in your home for all of 2025. If the child didn’t live with you for the required time, see Exception to time lived with you, later. 4. You paid over half the cost of keeping up your home. 5. You could have filed a joint return with your spouse the year your spouse died, even if you didn’t actually do so."; "If your spouse died in 2025, you can''t file as qualifying surviving spouse"; "An adopted child is always treated as your own child. An adopted child includes a child lawfully placed with you for legal adoption"; Exception to time lived with you, "Temporary absences by you or the child for special circumstances, such as school, vacation, business, medical care, military service, or detention in a juvenile facility, count as time lived in the home" and "A child is considered to have lived with you for all of 2025 if the child was born or died in 2025 and your home was the child’s home for the entire time the child was alive"; p501 p. 9, Note, "Amounts paid out of funds received in the child’s or qualifying person’s name, such as Social Security, are considered paid by the child, not you."; p501 p. 11, Qualifying Surviving Spouse, "4. This child lived in your home all year, except for temporary absences. See Temporary absences, earlier, under Head of Household."; p501 p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."; p501 p. 9, "Also don’t include the value of your services or those of a member of your household."; p501 p. 9, Note, "if you received Temporary Assistance to Needy Families (TANF) payments or other similar payments and used the payment to support another person, those payments are considered support you provided for that person"; p501 p. 11, Kidnapped child, "You may be eligible to file as a qualifying surviving spouse even if the child who qualifies you for this filing status has been kidnapped."'
    - id: household.qss_fails
      printed: (gate)
      type: Bool
      label: Qualifying surviving spouse checked without meeting its tests
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1040.status
              - const: qss
          - op: test
            eq:
              - household.qss_eligible
              - const: false
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "use joint return tax rates for 2025 if all of the following apply"'
    - id: household.rdp
      printed: (helper)
      type: Bool
      label: Were you a registered domestic partner in Nevada, Washington or California at any time in 2025?
      expr:
        op: input
        source: Were you a registered domestic partner in Nevada, Washington or California at any time in 2025?
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, Nevada, Washington, and California domestic partners, "A registered domestic partner in Nevada, Washington, or California must generally report half the combined community income of the individual and their domestic partner"'
    - id: household.spouse_died_2025
      printed: (helper)
      type: Bool
      label: Did your spouse die in 2025?
      expr:
        op: input
        source: Did your spouse die in 2025? (Asked when your filing status is single or head of household, or when filing jointly although not married at the end of 2025.)
      cite:
        doc: p501
        locator: p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."
    - id: household.widowed_2025
      printed: (gate)
      type: Bool
      label: Filing as single or head of household although your spouse died in 2025
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.spouse_died_2025
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.spouse_died_2025
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 13, Single, "You were widowed before January 1, 2025, and didn’t remarry before the end of 2025"; p. 13, Married Filing Jointly, "Your spouse died in 2025 and you didn’t remarry in 2025."; p501 p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."'
    - id: household.cp_married
      printed: (helper)
      type: Bool
      label: Married at any time in 2025 while living in a community property state, though not married at the end of 2025
      expr:
        op: input
        source: Were you married at any time during 2025, before a divorce or legal separation, while you lived in a
          community property state (Arizona, California, Idaho, Louisiana, Nevada, New Mexico, Texas, Washington or
          Wisconsin)? (Asked when you lived in a community property state in 2025, are not filing jointly and were not
          married at the end of 2025.)
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555."'
    - id: household.cp_not_joint
      printed: (helper)
      label: 'Not filing jointly: lived in a community property state, not married at the end of 2025, and married for part of
        2025 while living there'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.community_property
            - const: true
          then: household.cp_unmarried
        - guard:
            op: test
            eq:
            - household.community_property
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually
          follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub.
          555."
    - id: household.cp_unmarried
      printed: (helper)
      label: 'Not filing jointly and lived in a community property state: not married at the end of 2025, and married for part
        of 2025 while living there'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.married
            - const: true
          then: household.no
        - guard:
            op: test
            eq:
            - household.married
            - const: false
          then: household.cp_married
      cite:
        doc: i1040gi
        locator: p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually
          follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub.
          555."
    - id: household.cp_marriage_ended
      printed: (gate)
      type: Bool
      label: Not filing jointly, and married for part of 2025 while living in a community property state
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.cp_not_joint
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.cp_not_joint
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.cp_not_joint
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.cp_not_joint
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555."'
    - id: household.rdp_community_property
      printed: (gate)
      type: Bool
      label: Not filing jointly, living in a community property state, and a registered domestic partner in Nevada,
        Washington or California
      expr:
        op: test
        all:
          - op: test
            ne:
              - f1040.status
              - const: mfj
          - op: test
            eq:
              - household.community_property
              - const: true
          - op: test
            eq:
              - household.rdp
              - const: true
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, Nevada, Washington, and California domestic partners, "A registered domestic partner in Nevada, Washington, or California must generally report half the combined community income of the individual and their domestic partner. See Form 8958 and Pub. 555"'
    - id: household.joint_unmarried
      printed: (helper)
      label: Filing jointly, not married at the end of 2025, and no spouse who died in 2025
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.married
            - const: true
          then: household.no
        - guard:
            op: test
            eq:
            - household.married
            - const: false
          then: household.no_spouse_died
      cite:
        doc: i1040gi
        locator: p. 13, Single, "But if, at the end of 2025, your divorce wasn’t final (an interlocutory decree), you are considered
          married and can’t check the box."; p. 13, Married Filing Jointly, "You were married at the end of 2025"; p. 13, "Your
          spouse died in 2025 and you didn’t remarry in 2025."
    - id: household.no_spouse_died
      printed: (helper)
      label: Your spouse did not die in 2025
      type: Bool
      expr:
        op: test
        eq:
        - household.spouse_died_2025
        - const: false
      cite:
        doc: i1040gi
        locator: p. 13, Single, "But if, at the end of 2025, your divorce wasn’t final (an interlocutory decree), you are considered
          married and can’t check the box."; p. 13, Married Filing Jointly, "You were married at the end of 2025"; p. 13, "Your
          spouse died in 2025 and you didn’t remarry in 2025."
    - id: household.filing_status_conflict
      printed: (gate)
      type: Bool
      label: The filing status conflicts with the marriage facts entered
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.married
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.joint_unmarried
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 13, Single, "But if, at the end of 2025, your divorce wasn’t final (an interlocutory decree), you are considered married and can’t check the box."; p. 13, Married Filing Jointly, "You were married at the end of 2025"; p. 13, "Your spouse died in 2025 and you didn’t remarry in 2025."'
