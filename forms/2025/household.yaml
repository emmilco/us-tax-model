form:
  id: household
  kind: form
  title: Household facts for dependents and head of household
  tax_year: 2025
  note: Facts about the people on the return that the dependent tests, the credits and the head of
    household status read; "unmarried" here is the instructions' unmarried or considered unmarried
    at the end of 2025.
  lines:
    - id: household.persons
      printed: (helper)
      type: Count
      label: 'Number of people on the return (you, and your spouse if filing jointly)'
      expr:
        op: sum_over
        collection: person
        field: person.one
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
    - id: household.taxpayers
      printed: (helper)
      type: Count
      label: 'Number of entries for you'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.role
          - const: taxpayer
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
    - id: household.spouses
      printed: (helper)
      type: Count
      label: 'Number of entries for your spouse'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.role
          - const: spouse
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
    - id: household.roster_ok
      printed: (helper)
      type: Bool
      label: 'One entry for you, and one for your spouse exactly when filing jointly'
      expr:
        op: test
        any:
        - op: test
          all:
          - op: test
            eq:
            - f1040.status
            - const: mfj
          - op: test
            eq:
            - household.taxpayers
            - const: 1
              type: Count
          - op: test
            eq:
            - household.spouses
            - const: 1
              type: Count
        - op: test
          all:
          - op: test
            ne:
            - f1040.status
            - const: mfj
          - op: test
            eq:
            - household.taxpayers
            - const: 1
              type: Count
          - op: test
            eq:
            - household.spouses
            - const: 0
              type: Count
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
      refuses:
        - when: household.birth_year_bad
          form: Year of birth not possible
          remedy: Correct the year of birth. A person on a return for 2025 was born in 2025 or earlier, and a year more than
            125 years before 2025 is taken for a mistyped year.
          cite:
            doc: i1040gi
            locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
              January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"'
        - when: household.filer_under16
          form: A filer under age 16 at the end of 2025
          remedy: A return for a person under age 16 at the end of 2025 (you, or your spouse on a joint return) is outside this
            tool. The archived instructions state no such rule; this is an entry check the owner decided on, recorded in the
            ambiguity register (amb.2025.filer_under_16).
          cite:
            doc: i1040gi
            locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
    - id: household.roster_bad
      printed: (gate)
      type: Bool
      label: 'The people entered do not match the filing status'
      expr:
        op: test
        eq:
        - household.roster_ok
        - const: false
      cite:
        doc: f1040
        locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
          name and middle initial"; p. 1, Filing Status, "Married filing jointly (even if only one had income)"
    - id: household.hsa_people
      printed: (helper)
      type: Count
      label: Number of people on the return with a Form 8889
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          gt:
          - person.hsa_forms
          - const: 0
            type: Count
      cite:
        doc: i8889
        locator: 'p. 4, Name and social security number (SSN), "If married filing jointly and both you and your spouse have HSAs, complete a separate Form 8889 for each of you"'
    - id: household.hsa_both
      printed: (helper)
      type: Bool
      label: You and your spouse each have a Form 8889
      expr:
        op: test
        eq:
        - household.hsa_people
        - const: 2
          type: Count
      cite:
        doc: i8889
        locator: p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, Steps 1 to 3, "Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, use the following rules to figure the amount on line 6", "Step 1. Refigure the contribution limit that
          would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for
          the months you were treated as having family coverage", "Step 2. Divide the refigured contribution limit
          from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as
          allocating nothing to one spouse)", "Step 3. Subtract the part of the contribution limit allocated to your
          spouse in Step 2 from the amount determined in Step 1"
    - id: household.hsa_family_sum
      printed: (helper)
      type: NonNegDollars
      label: 'Both spouses family amounts for the months each was treated as having family coverage, added together'
      expr:
        op: sum_over
        collection: person
        field: person.hsa_family
      cite:
        doc: i8889
        locator: 'p. 7, Line 6, Step 1, "Refigure the contribution limit that would have been entered on line 5 if you had entered on
          line 3 the total of the worksheet amounts only for the months you were treated as having family coverage"; p969
          p. 6, Rules for married people, "Caution: The rules for married people apply only if both spouses are eligible
          individuals"'
    - id: household.hsa_self_sum
      printed: (helper)
      type: NonNegDollars
      label: 'Both spouses self-only amounts for their eligible months without family coverage, added together'
      expr:
        op: sum_over
        collection: person
        field: person.hsa_self
      cite:
        doc: i8889
        locator: 'p. 4, How To Complete Part I, "if you and your spouse are both eligible individuals and either of you has an HDHP
          with family coverage, you both are treated as having only the family coverage plan"; p. 7, Line 6, Step 4,
          "Determine any other contribution limits that apply for the tax year"'
    - id: household.hsa_agreed_count
      printed: (helper)
      type: Count
      label: 'Number of Forms 8889 using an agreed allocation'
      expr:
        op: sum_over
        collection: person
        field: person.hsa_agreed
      cite:
        doc: i8889
        locator: p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, Steps 1 to 3, "Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, use the following rules to figure the amount on line 6", "Step 1. Refigure the contribution limit that
          would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for
          the months you were treated as having family coverage", "Step 2. Divide the refigured contribution limit
          from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as
          allocating nothing to one spouse)", "Step 3. Subtract the part of the contribution limit allocated to your
          spouse in Step 2 from the amount determined in Step 1"
    - id: household.hsa_step1_sum
      printed: (helper)
      type: NonNegDollars
      label: 'Both spouses Step 1 limits added together'
      expr:
        op: sum_over
        collection: person
        field: person.hsa_step1
      cite:
        doc: i8889
        locator: p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, Steps 1 to 3, "Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, use the following rules to figure the amount on line 6", "Step 1. Refigure the contribution limit that
          would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for
          the months you were treated as having family coverage", "Step 2. Divide the refigured contribution limit
          from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as
          allocating nothing to one spouse)", "Step 3. Subtract the part of the contribution limit allocated to your
          spouse in Step 2 from the amount determined in Step 1"
    - id: household.hsa_share_sum
      printed: (helper)
      type: NonNegDollars
      label: 'Both spouses parts of the Step 1 limit added together'
      expr:
        op: sum_over
        collection: person
        field: person.hsa_share
      cite:
        doc: i8889
        locator: p. 7, Line 6, Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, Steps 1 to 3, "Spouses who have separate HSAs and had family coverage under an HDHP at any time during
          2025, use the following rules to figure the amount on line 6", "Step 1. Refigure the contribution limit that
          would have been entered on line 5 if you had entered on line 3 the total of the worksheet amounts only for
          the months you were treated as having family coverage", "Step 2. Divide the refigured contribution limit
          from Step 1 equally between you and your spouse, unless you both agree on a different allocation (such as
          allocating nothing to one spouse)", "Step 3. Subtract the part of the contribution limit allocated to your
          spouse in Step 2 from the amount determined in Step 1"
    - id: household.work_ssn_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return with an SSN valid for employment'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.work_ssn
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, and p. 40, Step 1, question 2'
    - id: household.any_work_ssn
      printed: (helper)
      type: Bool
      label: 'You, or your spouse if filing jointly, have an SSN valid for employment'
      expr:
        op: test
        gt:
        - household.work_ssn_count
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "If you are filing a joint return, only one spouse is required to have a valid SSN to be eligible for the CTC and ACTC"'
    - id: household.eic_ssn_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return with an SSN valid for the EIC'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.eic_ssn
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 40, Step 1, question 2; p. 44, Social security number (SSN), "For the EIC, a valid SSN is a number issued by the Social Security Administration unless “Not Valid for Employment” is printed on the social security card and the number was issued solely to allow the recipient of the SSN to apply for or receive a federally funded benefit"'
    - id: household.all_eic_ssn
      printed: (helper)
      type: Bool
      label: 'You, and your spouse if filing jointly, have SSNs valid for the EIC'
      expr:
        op: test
        eq:
        - household.eic_ssn_count
        - household.persons
      cite:
        doc: i1040gi
        locator: 'p. 40, Step 1, question 2, "Do you, and your spouse if filing a joint return, have a social security number ... that allows you to work and is valid for EIC purposes"; p. 44, Social security number (SSN), "For the EIC, a valid SSN is a number issued by the Social Security Administration unless “Not Valid for Employment” is printed on the social security card and the number was issued solely to allow the recipient of the SSN to apply for or receive a federally funded benefit"'
    - id: household.birth_year_bad_count
      printed: (helper)
      type: Count
      label: Number of people on the return whose year of birth entered is not possible (person.birth_year_bad)
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.birth_year_bad
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"'
    - id: household.birth_year_bad
      printed: (gate)
      type: Bool
      label: A year of birth entered for you, or your spouse on a joint return, is after the tax year or more than 125 years before it
      expr:
        op: test
        gt:
        - household.birth_year_bad_count
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"'
    - id: household.under16_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return under age 16 at the end of 2025'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.under16
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
    - id: household.filer_under16
      printed: (gate)
      type: Bool
      label: 'You, or your spouse if filing jointly, were under age 16 at the end of 2025'
      expr:
        op: test
        gt:
        - household.under16_count
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: 'p. 66, Self-Select PIN, "You can’t use the Self-Select PIN method if you are a first-time filer under age 16 at the end of 2025"'
      ambiguity: amb.2025.filer_under_16
    - id: household.tin_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return with an SSN or ITIN, or who have applied for an ITIN'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.tin_or_itin_applied
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "If you want to claim the credit for other dependents, you, and your spouse if filing jointly, must have either an SSN or ITIN"; p. 19, Step 5, question 1, "(Answer ''Yes'' if you are applying for an ITIN on or before the return due date (including extensions).)"'
    - id: household.all_tin
      printed: (helper)
      type: Bool
      label: 'You, and your spouse if filing jointly, have an SSN or ITIN, or have applied for an ITIN'
      expr:
        op: test
        eq:
        - household.tin_count
        - household.persons
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "If you want to claim the credit for other dependents, you, and your spouse if filing jointly, must have either an SSN or ITIN"'
    - id: household.id_count
      printed: (helper)
      type: Count
      label: 'Number of people on the return with an SSN valid for employment or an SSN or ITIN'
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.work_ssn_or_tin
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "The other spouse must have either an SSN or ITIN"'
      ambiguity: amb.2025.ctc_spouse_itin_application
    - id: household.ctc_ssn
      printed: (helper)
      type: Bool
      label: 'Child tax credit identification: you, or your spouse if filing jointly, have an SSN valid for employment, and each other person on the return has an SSN or ITIN'
      expr:
        op: test
        all:
        - op: test
          eq:
          - household.any_work_ssn
          - const: true
        - op: test
          eq:
          - household.id_count
          - household.persons
      cite:
        doc: i1040gi
        locator: 'p. 17, Before you begin, "If you are filing a joint return, only one spouse is required to have a valid SSN to be eligible for the CTC and ACTC. The other spouse must have either an SSN or ITIN"'
    - id: household.taxpayer_work_ssn_count
      printed: (helper)
      label: Your entry, if the answer is yes
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.role
            - const: taxpayer
          - op: test
            eq:
            - person.work_ssn
            - const: true
      cite:
        doc: i1040gi
        locator: 'p. 101, Schedule 1-A, Part II, "You have a valid social security number (SSN)"; p. 104, Valid SSN for No
          Tax on Tips, "A valid SSN for purposes of the deduction for qualified tips is one that is valid for employment and
          that is issued by the Social Security Administration (SSA) before the due date of your 2025 return (including extensions)";
          p. 108, Valid SSN, "A valid SSN for purposes of the deduction for qualified overtime compensation is one that is valid
          for employment"; p. 110, Valid SSN, "A valid SSN for purposes of the enhanced deduction for seniors is one that is
          valid for employment"'
    - id: household.taxpayer_work_ssn
      printed: (helper)
      label: Do you have an SSN valid for employment issued before the due date of your return?
      type: Bool
      expr:
        op: test
        gt:
        - household.taxpayer_work_ssn_count
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: 'p. 101, Schedule 1-A, Part II, "You have a valid social security number (SSN)"; p. 104, Valid SSN for No
          Tax on Tips, "A valid SSN for purposes of the deduction for qualified tips is one that is valid for employment and
          that is issued by the Social Security Administration (SSA) before the due date of your 2025 return (including extensions)";
          p. 108, Valid SSN, "A valid SSN for purposes of the deduction for qualified overtime compensation is one that is valid
          for employment"; p. 110, Valid SSN, "A valid SSN for purposes of the enhanced deduction for seniors is one that is
          valid for employment"'
    - id: household.home_cost
      printed: (helper)
      type: Bool
      label: Did you pay over half the cost of keeping up your home for 2025?
      expr:
        op: input
        source: Did you pay over half the cost of keeping up your home for 2025? Cost of keeping up a home includes expenses such as rent, mortgage interest, real estate taxes, insurance on the home, repairs, utilities, and food eaten in the home. It does not include the cost of clothing, education, medical treatment, vacations, life insurance, or transportation, or the value of your services or those of a member of your household. Amounts paid out of funds received in the name of a person who lives in the home, such as their Social Security, count as paid by that person, not you. TANF or similar payments you received and used for the home count as paid by you.
      cite:
        doc: i1040gi
        locator: 'p. 14, Head of Household, Test 2; p. 15, "Keeping up a home. To find out what is included in the cost of keeping up a home, see Pub. 501."; p501 p. 9, Keeping Up a Home, "Costs you include. Include in the cost of keeping up a home expenses such as rent, mortgage interest, real estate taxes, insurance on the home, repairs, utilities, and food eaten in the home." p501 p. 9, "Costs you don’t include. Don’t include the cost of clothing, education, medical treatment, vacations, life insurance, or transportation. Also don’t include the value of your services or those of a member of your household." p501 p. 9, Note, "Amounts paid out of funds received in the child’s or qualifying person’s name, such as Social Security, are considered paid by the child, not you."; p501 p. 9, Note, "if you received Temporary Assistance to Needy Families (TANF) payments or other similar payments and used the payment to support another person, those payments are considered support you provided for that person"'
    - id: household.considered_unmarried
      printed: (helper)
      type: Bool
      gated_by: household.considered_unmarried_if_married
      label: Married at the end of 2025 but considered unmarried under the head of household rules
      expr:
        op: input
        source: |-
          Although you were married at the end of 2025, are you considered unmarried for head of household?

          You are considered unmarried if either of these applies (if your spouse died in 2025, you are considered married for the whole year: answer No).

          - You lived apart from your spouse for the last 6 months of 2025, and all of these apply:
            - you file a separate return from your spouse
            - you paid over half the cost of keeping up your home for 2025
            - your home was the main home of your child, stepchild or foster child for more than half of 2025 (temporary absences by you or the child for special circumstances count as time lived in the home; a child born or who died in 2025 meets this if the child lived with you for more than half the part of the year the child was alive; a child adopted, lawfully placed with you for legal adoption or placed as an eligible foster child in 2025 meets it if your main home was the child's main home for more than half the time since)
            - you can claim this child as your dependent, or could except that the child's other parent can claim the child under the rule for children of divorced or separated parents
          - Your spouse was a nonresident alien at any time during 2025 and no election to treat your spouse as a resident alien is in effect for 2025 (an election made for an earlier year remains in effect until terminated).

          Your spouse counts as living in your home during a temporary absence for special circumstances, such as business, medical care, school or military service, if it was reasonable to assume your spouse would return and you kept up the home during the absence.
      cite:
        doc: i1040gi
        locator: 'p. 14, Head of Household, "You are considered unmarried for this purpose if any of the following applies" through "the election to treat the alien spouse as a resident alien is not made"; p. 15, Married persons who live apart, "Even if you weren’t divorced or legally separated at the end of 2025, you are considered unmarried if all of the following apply" through "under the rule for Children of divorced or separated parents"; p. 14, Exception to time lived with you, "Temporary absences by you or the other person for special circumstances"; p. 15, Exception to time lived with you, "If the person is your qualifying child, the child must have lived with you for more than half the part of the year the child was alive" through "for more than half the time since the person was adopted or placed with you in 2025"; p501 p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."; p501 p. 8, Considered Unmarried, "Your spouse is considered to live in your home even if your spouse is temporarily absent due to special circumstances. See Temporary absences, later."; p501 p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."; i1040gi p. 13, Nonresident aliens and dual-status aliens, "This choice remains in effect in subsequent years until terminated"'
    - id: household.considered_unmarried_if_married
      printed: (helper)
      label: 'Considered unmarried under the head of household rules, asked only of a person married at the end of 2025 (false otherwise)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.married
            - const: true
          then: household.considered_unmarried
        - guard:
            op: test
            eq:
            - household.married
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 14, Head of Household, "You are considered unmarried for this purpose if any of the following applies" through "the election to treat the alien spouse as a resident alien is not made"; p. 15, Married persons who live apart, "Even if you weren’t divorced or legally separated at the end of 2025, you are considered unmarried if all of the following apply" through "under the rule for Children of divorced or separated parents"; p. 14, Exception to time lived with you, "Temporary absences by you or the other person for special circumstances"; p. 15, Exception to time lived with you, "If the person is your qualifying child, the child must have lived with you for more than half the part of the year the child was alive" through "for more than half the time since the person was adopted or placed with you in 2025"; p501 p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."; p501 p. 8, Considered Unmarried, "Your spouse is considered to live in your home even if your spouse is temporarily absent due to special circumstances. See Temporary absences, later."; p501 p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."'
    - id: household.not_married
      printed: (helper)
      type: Bool
      label: Not married at the end of 2025
      expr:
        op: test
        eq:
        - household.married
        - const: false
      cite:
        doc: i1040gi
        locator: 'p. 14, Head of Household, "You are considered unmarried for this purpose if any of the following applies" through "the election to treat the alien spouse as a resident alien is not made"; p. 15, Married persons who live apart, "Even if you weren’t divorced or legally separated at the end of 2025, you are considered unmarried if all of the following apply" through "under the rule for Children of divorced or separated parents"; p. 14, Exception to time lived with you, "Temporary absences by you or the other person for special circumstances"; p. 15, Exception to time lived with you, "If the person is your qualifying child, the child must have lived with you for more than half the part of the year the child was alive" through "for more than half the time since the person was adopted or placed with you in 2025"; p501 p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."; p501 p. 8, Considered Unmarried, "Your spouse is considered to live in your home even if your spouse is temporarily absent due to special circumstances. See Temporary absences, later."; p501 p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."'
    - id: household.unmarried
      printed: (helper)
      type: Bool
      label: Unmarried, or considered unmarried under the head of household rules, at the end of 2025
      expr:
        op: test
        any:
        - op: test
          eq:
          - household.not_married
          - const: true
        - op: test
          eq:
          - household.considered_unmarried_if_married
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 14, Head of Household, "You are considered unmarried for this purpose if any of the following applies" through "the election to treat the alien spouse as a resident alien is not made"; p. 15, Married persons who live apart, "Even if you weren’t divorced or legally separated at the end of 2025, you are considered unmarried if all of the following apply" through "under the rule for Children of divorced or separated parents"; p. 14, Exception to time lived with you, "Temporary absences by you or the other person for special circumstances"; p. 15, Exception to time lived with you, "If the person is your qualifying child, the child must have lived with you for more than half the part of the year the child was alive" through "for more than half the time since the person was adopted or placed with you in 2025"; p501 p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."; p501 p. 8, Considered Unmarried, "Your spouse is considered to live in your home even if your spouse is temporarily absent due to special circumstances. See Temporary absences, later."; p501 p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."'
    - id: household.ever_married
      printed: (helper)
      type: Bool
      label: Have you ever been married?
      expr:
        op: input
        source: Have you ever been married? (Asked when your filing status is single or head of household. A common law marriage recognized in the state where you now live or where it began is a marriage; a registered domestic partnership, civil union or similar relationship not denominated as a marriage is not.)
      cite:
        doc: i1040gi
        locator: p. 13, Filing Status, Single, "You were never married"
    - id: household.status_states_marriage
      printed: (helper)
      type: Bool
      label: The filing status is one only a person who is or was married takes (married filing jointly, married filing separately or qualifying surviving spouse)
      expr:
        op: test
        any:
        - op: test
          eq:
          - f1040.status
          - const: mfj
        - op: test
          eq:
          - f1040.status
          - const: mfs
        - op: test
          eq:
          - f1040.status
          - const: qss
      cite:
        doc: i1040gi
        locator: p. 13, Filing Status, Single, "You were never married"
    - id: household.marriage_possible
      printed: (helper)
      type: Bool
      label: 'A marriage is possible: the filing status states one, or a person filing as single or head of household has been married at some time'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.ever_married
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.status_states_marriage
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.status_states_marriage
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.ever_married
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.status_states_marriage
      cite:
        doc: i1040gi
        locator: p. 13, Filing Status, Single, "You were never married"
    - id: household.married_dec31
      printed: (helper)
      type: Bool
      gated_by: household.married
      label: Were you married at the end of 2025?
      expr:
        op: input
        source: |-
          Were you married at the end of 2025 (including married but considered unmarried for head of household status)?

          Use the marriage recognized under the law of the state or territory where it was entered into; a marriage entered into under foreign or American Indian tribal law counts if at least one U.S. state or territory would recognize it as a marriage.

          Include a common law marriage recognized in the state where you now live or where it began.

          Living apart does not end a marriage; an interlocutory (not final) divorce decree still means married.

          Answer No if, by December 31, you were divorced under a final decree, legally separated under a decree of divorce or separate maintenance, or had a court decree of annulment holding that no valid marriage ever existed.

          A registered domestic partnership, civil union or similar relationship not denominated as a marriage is not a marriage for federal tax purposes.

          This question asks whether you were married at year end; the separate filing-status rules for a spouse who died during 2025 are addressed separately.

          When choosing your filing status, also note: if you divorced solely to file as unmarried, intending at the time to remarry each other in the next tax year, and actually do so, you must file as married in both years.
      cite:
        doc: i1040gi
        locator: 'p. 41, Step 3, question 3, and Step 4, question 1, "Are you a married taxpayer whose filing status is married filing separately or head of household?"; i8889 p. 4, Line 3, rule 6, "If, at the end of 2025, you were age 55 or older and unmarried or married with self-only HDHP coverage for the entire year"; p501 p. 6, Marital Status, "State law governs whether you are married or legally separated under a divorce or separate maintenance decree."; p501 p. 6, Definition of marriage, "Individuals who have entered into a registered domestic partnership, civil union, or other similar relationship"; p501 p. 6, Considered married, "You are living together in a common law marriage recognized in the state where you now live or in the state where the common law marriage began."; p501 p. 6, Divorce and remarriage, "you and your spouse must file as married individuals in both years."; p501 p. 6, Annulled marriages, "you are considered unmarried even if you filed joint returns for earlier years."'
    - id: household.married
      printed: (helper)
      label: 'Married at the end of 2025 (false for a person filing as single or head of household who has never been married)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.marriage_possible
            - const: true
          then: household.married_dec31
        - guard:
            op: test
            eq:
            - household.marriage_possible
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 41, Step 3, question 3, and Step 4, question 1, "Are you a married taxpayer whose filing status is married filing separately or head of household?"; i8889 p. 4, Line 3, rule 6, "If, at the end of 2025, you were age 55 or older and unmarried or married with self-only HDHP coverage for the entire year"; p501 p. 6, Marital Status, "State law governs whether you are married or legally separated under a divorce or separate maintenance decree."; p501 p. 6, Definition of marriage, "Individuals who have entered into a registered domestic partnership, civil union, or other similar relationship"; p501 p. 6, Considered married, "You are living together in a common law marriage recognized in the state where you now live or in the state where the common law marriage began."; p501 p. 6, Divorce and remarriage, "you and your spouse must file as married individuals in both years."; p501 p. 6, Annulled marriages, "you are considered unmarried even if you filed joint returns for earlier years."'
    - id: household.community_property
      printed: (helper)
      type: Bool
      label: Did you live in, or have your permanent home (domicile) in, a community property state at any time in 2025?
      expr:
        op: input
        source: Did you live in, or have your permanent home (domicile) in, a community property state (Arizona, California,
          Idaho, Louisiana, Nevada, New Mexico, Texas, Washington or Wisconsin) at any time in 2025?
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, "Community property states include Arizona, California, Idaho, Louisiana, Nevada, New Mexico, Texas, Washington, and Wisconsin"; p555 p. 2, Domicile, "The law of the state, or the law of the foreign country, where you are domiciled will determine if you have community property, community income, or both"; p555 p. 3, Domicile, "you intend to use for an indefinite or unlimited period, and to which, when absent, you intend to return" and "When this publication refers to where you live, it means your domicile."'
    - id: household.spouse_cp_domicile
      printed: (helper)
      type: Bool
      gated_by: household.spouse_cp_domicile_if_asked
      label: At some time in 2025 while married, the husband or wife lived in, or had a permanent home (domicile) in, a
        community property state
      expr:
        op: input
        source: At any time in 2025 while you were married, did your husband or wife live in, or have their permanent home
          (domicile) in, a community property state (Arizona, California, Idaho, Louisiana, Nevada, New Mexico, Texas,
          Washington or Wisconsin)? (Asked when you are not filing jointly, a marriage is possible, and you did not live
          or have your permanent home in one of those states yourself.)
      cite:
        doc: p555
        locator: 'p. 2, Domicile, "If you and your spouse (or your RDP) have different domiciles, check the laws of each to see if you have community property, community income, or both"; p. 6, Military retirement pay, "Active military pay earned while married and domiciled in a community property state is also community income"'
    - id: household.ask_spouse_cp_domicile
      printed: (helper)
      label: A marriage is possible and the filing status is not qualifying surviving spouse
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - household.marriage_possible
          - const: true
        - op: test
          ne:
          - f1040.status
          - const: qss
      cite:
        doc: p555
        locator: 'p. 2, Domicile, "If you and your spouse (or your RDP) have different domiciles, check the laws of each to see if you have community property, community income, or both"'
    - id: household.spouse_cp_domicile_if_asked
      printed: (helper)
      label: 'The husband or wife lived in, or had a permanent home in, a community property state in 2025, asked only where a
        marriage is possible and the filing status is not qualifying surviving spouse (false otherwise)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.ask_spouse_cp_domicile
            - const: true
          then: household.spouse_cp_domicile
        - guard:
            op: test
            eq:
            - household.ask_spouse_cp_domicile
            - const: false
          then: household.no
      cite:
        doc: p555
        locator: 'p. 2, Domicile, "If you and your spouse (or your RDP) have different domiciles, check the laws of each to see if you have community property, community income, or both"'
    - id: household.cp_retirement
      printed: (helper)
      type: Bool
      gated_by: household.cp_retirement_if_asked
      label: In 2025, either spouse received a pension, annuity or military retirement pay earned while the two were married
        and living in a community property state
      expr:
        op: input
        source: In 2025, did you or your husband or wife receive a pension, annuity or military retirement pay earned while
          the two of you were married and either of you lived or had your permanent home in a community property state
          (Arizona, California, Idaho, Louisiana, Nevada, New Mexico, Texas, Washington or Wisconsin)?
      cite:
        doc: p555
        locator: 'p. 5, Pensions, "distributions from pensions will be characterized as community or separate income
          depending on the respective periods of participation in the pension while married (or during the registered
          domestic partnership) and domiciled in a community property state"; p. 6, Civil service retirement, "Even if you
          now live in a noncommunity property state and you receive a civil service annuity, it may be community income if
          it is based on services you performed while married (or during the registered domestic partnership) and domiciled
          in a community property state"; p. 6, Military retirement pay, "military retirement pay for services performed
          during marriage and domicile in a community property state is community income"'
    - id: household.cp_retirement_if_asked
      printed: (helper)
      label: 'Retirement pay earned while married and living in a community property state, asked only where a marriage is
        possible and the filing status is not qualifying surviving spouse (false otherwise)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.ask_spouse_cp_domicile
            - const: true
          then: household.cp_retirement
        - guard:
            op: test
            eq:
            - household.ask_spouse_cp_domicile
            - const: false
          then: household.no
      cite:
        doc: p555
        locator: 'p. 6, Civil service retirement, "Even if you now live in a noncommunity property state and you receive a
          civil service annuity, it may be community income"'
    - id: household.cp_spouse_or_retirement
      printed: (helper)
      label: 'Your husband or wife lived in, or had a permanent home in, a community property state in 2025, or (asked when
        neither of you did) retirement pay was earned while married and living in one'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.spouse_cp_domicile_if_asked
            - const: true
          then: household.spouse_cp_domicile_if_asked
        - guard:
            op: test
            eq:
            - household.spouse_cp_domicile_if_asked
            - const: false
          then: household.cp_retirement_if_asked
      cite:
        doc: p555
        locator: 'p. 2, Domicile, "If you and your spouse (or your RDP) have different domiciles, check the laws of each to see
          if you have community property, community income, or both"; p. 6, Civil service retirement, "Even if you now live
          in a noncommunity property state and you receive a civil service annuity, it may be community income"'
    - id: household.cp_any
      printed: (helper)
      label: 'You lived in, or had your permanent home in, a community property state in 2025, or (asked when you did not)
        your husband or wife did, or (asked when neither did) retirement pay received in 2025 was earned while married and
        living in one'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.community_property
            - const: true
          then: household.community_property
        - guard:
            op: test
            eq:
            - household.community_property
            - const: false
          then: household.cp_spouse_or_retirement
      cite:
        doc: p555
        locator: 'p. 2, Domicile, "The law of the state, or the law of the foreign country, where you are domiciled will determine if you have community property, community income, or both. If you and your spouse (or your RDP) have different domiciles, check the laws of each"; p. 6, Civil service retirement, "Even if you now live in a noncommunity property state and you receive a civil service annuity, it may be community income if it is based on services you performed while married (or during the registered domestic partnership) and domiciled in a community property state"'
    - id: household.hoh_cp_married
      printed: (helper)
      label: 'Filing as head of household: married at the end of 2025, and you or your husband or wife lived in, or had a
        permanent home in, a community property state'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.married
            - const: true
          then: household.cp_any
        - guard:
            op: test
            eq:
            - household.married
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually
          follow state law to determine what is community income and what is separate income"
    - id: household.hoh_community_property
      printed: (gate)
      type: Bool
      label: Married, filing as head of household, and living in a community property state
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.hoh_cp_married
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income"'
      ambiguity: amb.2025.hoh_community_property
    - id: household.credit_disallowed
      printed: (helper)
      type: Bool
      gated_by: household.credit_disallowed_if_claimed
      label: Was your (or, on a joint return, your spouse's) EIC for a year after 1996, or child tax credit, additional child tax credit
        or credit for other dependents for a year after 2015, reduced or disallowed other than for a math or clerical error, or are you (or, on a joint return, your spouse) in a 2- or 10-year disallowance period?
      expr:
        op: input
        source: Was your (or, on a joint return, your spouse's) earned income credit for any year after 1996, or child tax credit, additional child tax credit or credit for other dependents for any year after 2015, reduced or disallowed for any reason other than a math or clerical error, or are you (or, on a joint return, your spouse) in a 2- or 10-year period during which one of these credits can't be taken because an earlier claim was found to be reckless,
          intentional or fraudulent?
      cite:
        doc: i1040gi
        locator: 'p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error" and "don’t file Form 8862 or take the credit for the ... 2 years after the most recent tax year for which there was a final determination that your EIC claim was due to reckless or intentional disregard of the EIC rules ... 10 years after the most recent tax year for which there was a final determination that your EIC claim was due to fraud"; p. 39, Form 8862, who must file, "You must file Form 8862 to claim the child tax credit or credit for other dependents if your child tax credit (refundable or nonrefundable depending on the tax year), additional child tax credit, or credit for other dependents for a year after 2015 was denied or reduced for any reason other than a math or clerical error"; i1040s8812 p. 2, Form 8862 may be required, "If your CTC, ACTC, or ODC for a year after 2015 was denied or reduced for any reason other than a math or clerical error, you must attach Form 8862 to your tax return to claim the CTC, ACTC, or ODC unless an exception applies"'
    - id: household.no
      printed: (helper)
      type: Bool
      label: Year parameter household.no (false)
      expr:
        op: param
        ref: household.no
      cite:
        doc: i1040gi
        locator: 'p. 39, Form 8862, who must file, "You must file Form 8862 to claim the child tax credit or credit for other dependents if your child tax credit"; p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.eic_above_zero
      printed: (helper)
      type: Bool
      label: The earned income credit figured in Step 6 (Worksheet A line 6, or Worksheet B line 11 for a filer who answered Yes to
        Step 5, question 2) is more than zero
      expr:
        op: test
        gt:
          - eic.line6
          - eic.zero
      cite:
        doc: i1040gi
        locator: 'p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.eic_claimed
      printed: (helper)
      type: Bool
      label: The earned income credit is claimed (Steps 1 to 5 are passed and the credit figured in Step 6, Worksheet A line 6 or
        Worksheet B line 11, is more than zero; false when Steps 1 to 5 are not passed)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - eic.eligible
                - const: true
            then: household.eic_above_zero
          - guard:
              op: test
              eq:
                - eic.eligible
                - const: false
            then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.claims_8862_credit
      printed: (helper)
      type: Bool
      label: The return claims the earned income credit, the child tax credit, the credit for other dependents or the additional
        child tax credit (the earned income credit is claimed, or Schedule 8812 line 8 is more than line 11)
      expr:
        op: test
        any:
          - op: test
            gt:
              - s8812.line8
              - s8812.line11
          - op: test
            eq:
              - household.eic_claimed
              - const: true
      cite:
        doc: i1040gi
        locator: 'p. 39, Form 8862, who must file, "You must file Form 8862 to claim the child tax credit or credit for other dependents if your child tax credit"; p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"; i1040s8812 p. 2, Form 8862 may be required, "you must attach Form 8862 to your tax return to claim the CTC, ACTC, or ODC unless an exception applies"'
    - id: household.credit_disallowed_if_claimed
      printed: (helper)
      type: Bool
      label: Whether an earlier earned income credit, child tax credit, additional child tax credit or credit for other dependents
        was reduced or disallowed (or a disallowance period applies), asked only when the return claims one of these credits
        (false otherwise, where Form 8862 does not apply)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - household.claims_8862_credit
                - const: true
            then: household.credit_disallowed
          - guard:
              op: test
              eq:
                - household.claims_8862_credit
                - const: false
            then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 39, Form 8862, who must file, "You must file Form 8862 to claim the child tax credit or credit for other dependents if your child tax credit"; p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.ctc_disallowed_claim
      printed: (gate)
      type: Bool
      label: Schedule 8812 line 8 is more than line 11 (a child tax credit or credit for other dependents is figured) and an earlier
        credit was reduced or disallowed (or a disallowance period applies)
      expr:
        op: test
        all:
          - op: test
            gt:
              - s8812.line8
              - s8812.line11
          - op: test
            eq:
              - household.credit_disallowed_if_claimed
              - const: true
      cite:
        doc: i1040s8812
        locator: 'p. 2, Form 8862 may be required, "If your CTC, ACTC, or ODC for a year after 2015 was denied or reduced for any reason other than a math or clerical error, you must attach Form 8862 to your tax return to claim the CTC, ACTC, or ODC unless an exception applies"'
    - id: household.eic_disallowed_claim
      printed: (gate)
      type: Bool
      label: The earned income credit is claimed (Steps 1 to 5 are passed with a credit above zero on Worksheet A line 6 or
        Worksheet B line 11) and an earlier credit was reduced or disallowed (or a disallowance period applies)
      expr:
        op: test
        all:
          - op: test
            eq:
              - household.eic_claimed
              - const: true
          - op: test
            eq:
              - household.credit_disallowed_if_claimed
              - const: true
      cite:
        doc: i1040gi
        locator: 'p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error"'
    - id: household.test1_persons
      printed: (helper)
      type: Count
      label: Number of parents who qualify you under Test 1
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.hoh_test1
            - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 1
    - id: household.test2_persons
      printed: (helper)
      type: Count
      label: Number of persons who qualify you under Test 2
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.hoh_test2
            - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2
    - id: household.test2_absence_persons
      printed: (helper)
      type: Count
      label: Number of persons who would qualify you under Test 2 only by counting an absence head of household does not count
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.hoh_absence
            - const: true
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."
    - id: household.hoh_absence_from_test1
      printed: (helper)
      label: 'Head of household turns on an absence head of household does not count, from Test 1 on: Test 1 not met, home cost
        paid, no Test 2 person, and a person who would be one only by counting an absence'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.test1_met
            - const: true
          then: household.no
        - guard:
            op: test
            eq:
            - household.test1_met
            - const: false
          then: household.hoh_absence_from_cost
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.hoh_absence_from_cost
      printed: (helper)
      label: 'Head of household turns on an absence head of household does not count, from the home cost on: home cost paid, no
        Test 2 person, and a person who would be one only by counting an absence'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: true
          then: household.hoh_absence_from_test2
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: false
          then: household.no
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.hoh_absence_from_test2
      printed: (helper)
      label: 'Head of household turns on an absence head of household does not count, from Test 2 on: no Test 2 person, and a
        person who would be one only by counting an absence'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.no_test2_persons
            - const: true
          then: household.any_test2_absence
        - guard:
            op: test
            eq:
            - household.no_test2_persons
            - const: false
          then: household.no
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.no_test2_persons
      printed: (helper)
      label: No person qualifies you under Test 2
      type: Bool
      expr:
        op: test
        eq:
        - household.test2_persons
        - const: 0
          type: Count
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.any_test2_absence
      printed: (helper)
      label: A person would qualify you under Test 2 only by counting an absence head of household does not count
      type: Bool
      expr:
        op: test
        gt:
        - household.test2_absence_persons
        - const: 0
          type: Count
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both
          of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the
          absent person will return to the home after the temporary absence. You must continue to keep up the home during the
          absence."
    - id: household.hoh_absence
      printed: (gate)
      type: Bool
      label: Head of household turns on a person who lived with you more than half the year only by counting an absence head of household does not count
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.unmarried
            - const: true
          then: household.hoh_absence_from_test1
        - guard:
            op: test
            eq:
            - household.unmarried
            - const: false
          then: household.no
      cite:
        doc: p501
        locator: p. 9, Temporary absences, "You and your qualifying person are considered to live together even if one or both of you are temporarily absent from your home due to special circumstances" and "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."
    - id: household.test1_met
      printed: (helper)
      type: Bool
      label: Test 1 met
      expr:
        op: test
        gt:
          - household.test1_persons
          - const: 0
            type: Count
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 1
    - id: household.any_test2_person
      printed: (helper)
      label: A person qualifies you under Test 2
      type: Bool
      expr:
        op: test
        gt:
        - household.test2_persons
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2, "You paid over half the cost of keeping up a home in which you lived and in
          which one of the following also lived for more than half of the year"
    - id: household.test2_met
      printed: (helper)
      type: Bool
      label: Test 2 met, having paid over half the cost of keeping up your own home
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: true
          then: household.any_test2_person
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2, "You paid over half the cost of keeping up a home in which you lived and in which one of the following also lived for more than half of the year"
    - id: household.hoh_eligible
      printed: (helper)
      type: Bool
      label: Unmarried or considered unmarried, and Test 1 or Test 2 applies
      expr:
        op: test
        all:
          - op: test
            eq:
              - household.unmarried
              - const: true
          - op: test
            any:
              - op: test
                eq:
                  - household.test1_met
                  - const: true
              - op: test
                eq:
                  - household.test2_met
                  - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, "Check the 'Head of household' box only if you are unmarried (or considered unmarried) and either Test 1 or Test 2 applies"
      refuses:
        - when: household.hoh_absence
          form: Temporary absences for head of household (Pub. 501)
          remedy: For head of household, an absence counts as time lived with you only if it was reasonable to assume the
            absent person would return and you kept up the home; the time the person who would qualify you lived with you
            must be recounted under that rule, which this tool does not do.
          cite:
            doc: p501
            locator: p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."
        - when: household.hoh_community_property
          form: Community income on a married head of household return in a community property state (Form 8958; Pub. 555)
          remedy: A married person filing as head of household, where either spouse lived in or had a permanent home in a
            community property state, may have to report community income under state law; Form 8958 and the community
            property rules of Pub. 555 are outside this tool.
          cite:
            doc: i1040gi
            locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555"'
    - id: household.hoh_fails
      printed: (gate)
      type: Bool
      label: Head of household checked without meeting its tests
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1040.status
              - const: hoh
          - op: test
            eq:
              - household.hoh_eligible
              - const: false
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household
      refuses:
        - when: household.hoh_missed
          form: Head of household filing status fits you
          remedy: You chose single, but your answers meet the head of household tests (you were unmarried, and you paid over
            half the cost of keeping up a home for a person who qualifies you). Head of household gives a lower tax than single
            on the same income. Go back and choose head of household. If your spouse died in 2023 or 2024 and you did not
            remarry, look first at the line about being widowed (qualifying surviving spouse), which may give a lower tax.
          cite:
            doc: i1040gi
            locator: 'p. 13, Filing Status, "The ones that will usually give you the lowest tax are listed last"; p. 13,
              Single, "You were widowed before January 1, 2025, and didn’t remarry before the end of 2025. But if you have a
              child, you may be able to use the qualifying surviving spouse filing status"; p. 14, Head of Household, "Check
              the ''Head of household'' box only if you are unmarried (or considered unmarried) and either Test 1 or Test 2
              applies"'
        - when: household.hoh_missed_mfs
          form: Head of household filing status fits you
          remedy: You chose married filing separately, but your answers meet the head of household tests (you lived apart
            from your spouse for the last 6 months of 2025 and are considered unmarried, and you paid over half the cost of
            keeping up a home for a person who qualifies you). Head of household gives a lower tax than married filing
            separately on the same income. Go back and choose head of household.
          cite:
            doc: i1040gi
            locator: 'p. 13, Filing Status, "The ones that will usually give you the lowest tax are listed last"; p. 14,
              Married Filing Separately, "You may be able to file as head of household if you had a child living with you
              and you lived apart from your spouse during the last 6 months of 2025"; p. 15, Married persons who live apart,
              "Even if you weren’t divorced or legally separated at the end of 2025, you are considered unmarried if all of
              the following apply"'
    - id: household.dependents_listed
      printed: (helper)
      type: Count
      label: Number of people listed as dependents
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2
    - id: household.dependents_any
      printed: (helper)
      type: Bool
      label: At least one person is listed as a dependent
      expr:
        op: test
        gt:
        - household.dependents_listed
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2
    - id: household.hoh_missed_cost
      printed: (helper)
      type: Bool
      label: 'You paid over half the cost of keeping up your home and a person who qualifies you under Test 2 lived with you
        (the home cost asked first, so the dependent tests are read only when it was paid)'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: true
          then: household.hoh_missed_person
        - guard:
            op: test
            eq:
            - household.home_cost
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2, "You paid over half the cost of keeping up a home in which you lived and in
          which one of the following also lived for more than half of the year"
    - id: household.test2_lived_persons
      printed: (helper)
      type: Count
      label: Number of persons who would qualify you under Test 2, counting every absence you counted
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.hoh_test2_lived
            - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2
    - id: household.hoh_missed_person
      printed: (helper)
      type: Bool
      label: 'A person qualifies you under Test 2: more persons lived with you than the ones who did only by counting an absence
        head of household does not count (the absence is asked only of a person who lived with you)'
      expr:
        op: test
        gt:
        - household.test2_lived_persons
        - household.test2_absence_persons
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2; p501 p. 9, Temporary absences, "It must be reasonable to assume the absent
          person will return to the home after the temporary absence."
    - id: household.hoh_missed_test2
      printed: (helper)
      type: Bool
      label: 'Test 2 met on a single or married filing separately return: asked only when a dependent is listed (false with
        none)'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.dependents_any
            - const: true
          then: household.hoh_missed_cost
        - guard:
            op: test
            eq:
            - household.dependents_any
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, Test 2, "You paid over half the cost of keeping up a home in which you lived and in
          which one of the following also lived for more than half of the year"
    - id: household.hoh_missed
      printed: (gate)
      type: Bool
      label: Single checked, though you were unmarried and Test 2 of head of household is met (Test 1, a parent's separate home, is not checked)
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1040.status
              - const: single
          - op: test
            eq:
              - household.unmarried
              - const: true
          - op: test
            eq:
              - household.hoh_missed_test2
              - const: true
      cite:
        doc: i1040gi
        locator: p. 14, Head of Household, "Check the 'Head of household' box only if you are unmarried (or considered unmarried)
          and either Test 1 or Test 2 applies"
    - id: household.hoh_missed_mfs
      printed: (gate)
      type: Bool
      label: Married filing separately checked, though a dependent is listed, you lived apart from your spouse for the last 6
        months of 2025, Test 2 of head of household is met, and you are considered unmarried (each asked only after the one
        before it holds)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.mfs
            - const: true
          then: household.hoh_missed_mfs_listed
        - guard:
            op: test
            eq:
            - household.mfs
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 14, Head of Household, "You are married but lived apart from your spouse for the last 6 months of 2025
          and you meet the other rules under Married persons who live apart" and "Check the ''Head of household'' box only if
          you are unmarried (or considered unmarried) and either Test 1 or Test 2 applies"; p501 p. 7, Married Filing
          Separately, "If you qualify to file as head of household, instead of as married filing separately, your tax may be
          lower"'
    - id: household.hoh_missed_mfs_listed
      printed: (helper)
      type: Bool
      label: 'Married filing separately: a dependent is listed, and the rest of the head of household test holds (false with no one listed)'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.dependents_any
            - const: true
          then: household.hoh_missed_mfs_apart
        - guard:
            op: test
            eq:
            - household.dependents_any
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 15, Married persons who live apart, "You lived apart from your spouse for the last 6 months of 2025",
          "You paid over half the cost of keeping up your home for 2025" and "Your home was the main home of your child,
          stepchild, or foster child for more than half of 2025"'
    - id: household.hoh_missed_mfs_apart
      printed: (helper)
      type: Bool
      label: 'Married filing separately with a dependent listed: you lived apart from your spouse for the last 6 months of 2025, and the rest of the head of household test holds'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.mfs_apart_last6
            - const: true
          then: household.hoh_missed_mfs_test2
        - guard:
            op: test
            eq:
            - household.mfs_apart_last6
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 15, Married persons who live apart, "You lived apart from your spouse for the last 6 months of 2025",
          "You paid over half the cost of keeping up your home for 2025" and "Your home was the main home of your child,
          stepchild, or foster child for more than half of 2025"'
    - id: household.hoh_missed_mfs_test2
      printed: (helper)
      type: Bool
      label: 'Married filing separately and living apart: Test 2 of head of household is met and you are considered unmarried (the considered-unmarried question asked only once Test 2 is met)'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.hoh_missed_test2
            - const: true
          then: household.unmarried
        - guard:
            op: test
            eq:
            - household.hoh_missed_test2
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 15, Married persons who live apart, "You lived apart from your spouse for the last 6 months of 2025",
          "You paid over half the cost of keeping up your home for 2025" and "Your home was the main home of your child,
          stepchild, or foster child for more than half of 2025"'
    - id: household.qss_eligible
      printed: (helper)
      type: Bool
      label: Do all five qualifying surviving spouse tests apply to you?
      expr:
        op: input
        source: |-
          Do all five of these tests apply to you?

          - Your spouse died in 2023 or 2024 and you didn't remarry before the end of 2025 (if your spouse died in 2025, answer No).
          - You have a child or stepchild (not a foster child) whom you can claim as a dependent, or could claim as a dependent except that, for 2025, the child had gross income of $5,200 or more, the child filed a joint return, or you could be claimed as a dependent on someone else's return; an adopted child, including a child lawfully placed with you for legal adoption, is always your own child.
          - This child lived in your home for all of 2025, counting temporary absences by you or the child for special circumstances, such as school, vacation, business, medical care, military service or detention in a juvenile facility, as time lived in the home, but only an absence from which it was reasonable to assume the absent person would return and during which you kept up the home; a child born or who died in 2025, or adopted or lawfully placed with you for legal adoption in 2025, lived with you all year if your home was the child's home for the entire time the child was alive, or since the adoption or placement; if the child did not live with you all of 2025 because the child was presumed by law enforcement authorities to have been kidnapped by someone who isn't a member of your family or the child's family, answer No (the kidnapped-child rule of Pub. 501 is outside this tool).
          - You paid over half the cost of keeping up your home (rent, mortgage interest, real estate taxes, insurance on the home, repairs, utilities and food eaten in the home; not clothing, education, medical treatment, vacations, life insurance, transportation, or the value of your own or a household member’s services; amounts paid from a household member’s own funds, such as Social Security, count as paid by them; TANF or similar payments you received and used for the home count as paid by you).
          - You could have filed a joint return with your spouse the year your spouse died, even if you didn't actually do so.
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "You can check the “Qualifying surviving spouse” box in the Filing Status section on page 1 of Form 1040 or 1040-SR and use joint return tax rates for 2025 if all of the following apply. 1. Your spouse died in 2023 or 2024 and you didn’t remarry before the end of 2025. 2. You have a child or stepchild (not a foster child) whom you can claim as a dependent or could claim as a dependent except that, for 2025: a. The child had gross income of $5,200 or more, b. The child filed a joint return, or c. You could be claimed as a dependent on someone else’s return." and "3. This child lived in your home for all of 2025. If the child didn’t live with you for the required time, see Exception to time lived with you, later. 4. You paid over half the cost of keeping up your home. 5. You could have filed a joint return with your spouse the year your spouse died, even if you didn’t actually do so."; "If your spouse died in 2025, you can''t file as qualifying surviving spouse"; "An adopted child is always treated as your own child. An adopted child includes a child lawfully placed with you for legal adoption"; Exception to time lived with you, "Temporary absences by you or the child for special circumstances, such as school, vacation, business, medical care, military service, or detention in a juvenile facility, count as time lived in the home" and "A child is considered to have lived with you for all of 2025 if the child was born or died in 2025 and your home was the child’s home for the entire time the child was alive"; p501 p. 9, Note, "Amounts paid out of funds received in the child’s or qualifying person’s name, such as Social Security, are considered paid by the child, not you."; p501 p. 11, Qualifying Surviving Spouse, "4. This child lived in your home all year, except for temporary absences. See Temporary absences, earlier, under Head of Household."; p501 p. 9, Temporary absences, "It must be reasonable to assume the absent person will return to the home after the temporary absence. You must continue to keep up the home during the absence."; p501 p. 9, "Also don’t include the value of your services or those of a member of your household."; p501 p. 9, Note, "if you received Temporary Assistance to Needy Families (TANF) payments or other similar payments and used the payment to support another person, those payments are considered support you provided for that person"; p501 p. 11, Kidnapped child, "You may be eligible to file as a qualifying surviving spouse even if the child who qualifies you for this filing status has been kidnapped."'
    - id: household.qss_fails
      printed: (gate)
      type: Bool
      label: Qualifying surviving spouse checked without meeting its tests
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1040.status
              - const: qss
          - op: test
            eq:
              - household.qss_eligible
              - const: false
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "use joint return tax rates for 2025 if all of the following apply"'
      refuses:
        - when: household.qss_child_not_all_year
          form: Qualifying surviving spouse filing status
          remedy: Qualifying surviving spouse needs a child or stepchild of yours who lived in your home for all of 2025,
            but none of the children you listed lived with you all year. Correct the answer about where the child lived, or
            choose another filing status.
          cite:
            doc: i1040gi
            locator: 'p. 15, Qualifying Surviving Spouse, "3. This child lived in your home for all of 2025"'
    - id: household.qss
      printed: (helper)
      type: Bool
      label: Filing status qualifying surviving spouse
      expr:
        op: test
        eq:
        - f1040.status
        - const: qss
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "You can check the “Qualifying surviving spouse” box in the Filing Status
          section on page 1 of Form 1040 or 1040-SR"'
    - id: household.qss_claimed
      printed: (helper)
      type: Bool
      label: Qualifying surviving spouse checked and its tests answered Yes (false for any other filing status)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.qss
            - const: true
          then: household.qss_eligible
        - guard:
            op: test
            eq:
            - household.qss
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "use joint return tax rates for 2025 if all of the following apply"'
    - id: household.qss_no_child
      printed: (helper)
      type: Bool
      label: No son, daughter or stepchild is listed
      expr:
        op: test
        eq:
          - household.qss_children_listed
          - const: 0
            type: Count
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "2. You have a child or stepchild (not a foster child) whom you can claim
          as a dependent or could claim as a dependent"'
    - id: household.qss_no_child_notice
      printed: (helper)
      type: Bool
      label: 'Notice: qualifying surviving spouse needs a son, daughter or stepchild of yours (not a foster child) who lived
        in your home for all of 2025, and none is listed among the people who lived with you. List that child (even one you
        cannot claim as a dependent), or choose another filing status.'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.qss_claimed
            - const: true
          then: household.qss_no_child
        - guard:
            op: test
            eq:
            - household.qss_claimed
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "2. You have a child or stepchild (not a foster child) whom you can claim
          as a dependent or could claim as a dependent" and "3. This child lived in your home for all of 2025"'
    - id: household.qss_children_listed
      printed: (helper)
      type: Count
      label: Number of people listed as your son, daughter or stepchild (not a foster child, grandchild or other descendant)
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.own_child_if_qss
            - const: true
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "2. You have a child or stepchild (not a foster child) whom you can claim
          as a dependent or could claim as a dependent" and "3. This child lived in your home for all of 2025"'
    - id: household.qss_children_all_year
      printed: (helper)
      type: Count
      label: Number of people listed as your son, daughter or stepchild who lived with you for all of 2025
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          all:
            - op: test
              eq:
                - dependent.own_child_if_qss
                - const: true
            - op: test
              eq:
                - dependent.child_all_year
                - const: true
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "2. You have a child or stepchild (not a foster child) whom you can claim
          as a dependent or could claim as a dependent" and "3. This child lived in your home for all of 2025"'
    - id: household.qss_child_conflict
      printed: (helper)
      type: Bool
      label: A child is listed, but no child listed lived with you for all of 2025
      expr:
        op: test
        all:
          - op: test
            gt:
              - household.qss_children_listed
              - const: 0
                type: Count
          - op: test
            eq:
              - household.qss_children_all_year
              - const: 0
                type: Count
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "2. You have a child or stepchild (not a foster child) whom you can claim
          as a dependent or could claim as a dependent" and "3. This child lived in your home for all of 2025"'
    - id: household.qss_child_conflict_if_claimed
      printed: (helper)
      type: Bool
      label: 'Qualifying surviving spouse tests answered Yes, and a child is listed but none lived with you all of 2025 (false
        when the tests were answered No)'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.qss_eligible
            - const: true
          then: household.qss_child_conflict
        - guard:
            op: test
            eq:
            - household.qss_eligible
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "2. You have a child or stepchild (not a foster child) whom you can claim
          as a dependent or could claim as a dependent" and "3. This child lived in your home for all of 2025"'
    - id: household.qss_child_not_all_year
      printed: (gate)
      type: Bool
      label: Qualifying surviving spouse checked and its tests answered Yes, but a child is listed and none of the children
        listed lived with you for all of 2025
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.qss
            - const: true
          then: household.qss_child_conflict_if_claimed
        - guard:
            op: test
            eq:
            - household.qss
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 15, Qualifying Surviving Spouse, "2. You have a child or stepchild (not a foster child) whom you can claim
          as a dependent or could claim as a dependent" and "3. This child lived in your home for all of 2025"'
    - id: household.rdp
      printed: (helper)
      type: Bool
      label: Were you a registered domestic partner in Nevada, Washington or California at any time in 2025?
      expr:
        op: input
        source: Were you a registered domestic partner in Nevada, Washington or California at any time in 2025?
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, Nevada, Washington, and California domestic partners, "A registered domestic partner in Nevada, Washington, or California must generally report half the combined community income of the individual and their domestic partner"'
    - id: household.spouse_died_this_year
      printed: (helper)
      type: Bool
      gated_by: household.spouse_died_this_year_if_ever_married
      label: Did your spouse die in 2025?
      expr:
        op: input
        source: Did your spouse die in 2025? (Asked when your filing status is single or head of household, when filing jointly although not married at the end of 2025, and on a joint return with child or dependent care expenses, Form 2441.)
      cite:
        doc: p501
        locator: p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."
    - id: household.spouse_died_this_year_if_ever_married
      printed: (helper)
      label: 'Your spouse died in 2025, asked only where a marriage is possible (false for a person never married)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.marriage_possible
            - const: true
          then: household.spouse_died_this_year
        - guard:
            op: test
            eq:
            - household.marriage_possible
            - const: false
          then: household.no
      cite:
        doc: p501
        locator: p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."
    - id: household.widowed_this_year
      printed: (gate)
      type: Bool
      label: Filing as single or head of household although your spouse died in 2025
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.spouse_died_this_year_if_ever_married
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.spouse_died_this_year_if_ever_married
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 13, Single, "You were widowed before January 1, 2025, and didn’t remarry before the end of 2025"; p. 13, Married Filing Jointly, "Your spouse died in 2025 and you didn’t remarry in 2025."; p501 p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."'
    - id: household.cp_married
      printed: (helper)
      type: Bool
      gated_by: household.cp_married_if_ever_married
      label: Married at any time in 2025 while living in, or having your permanent home in, a community property state,
        though not married at the end of 2025
      expr:
        op: input
        source: Were you married at any time during 2025, before a divorce or legal separation, while you lived in, or had
          your permanent home (domicile) in, a community property state (Arizona, California, Idaho, Louisiana, Nevada,
          New Mexico, Texas, Washington or Wisconsin)? (Asked when you lived in, or had your permanent home in, a
          community property state in 2025, are not filing jointly and were not married at the end of 2025.)
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555."'
    - id: household.cp_married_if_ever_married
      printed: (helper)
      label: 'Married for part of 2025 while living in a community property state, asked only where a marriage is possible (false for a person never married)'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.marriage_possible
            - const: true
          then: household.cp_married
        - guard:
            op: test
            eq:
            - household.marriage_possible
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555."'
    - id: household.cp_not_joint
      printed: (helper)
      label: 'Not filing jointly: lived in a community property state, not married at the end of 2025, and married for part of
        2025 while living there'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.community_property
            - const: true
          then: household.cp_unmarried
        - guard:
            op: test
            eq:
            - household.community_property
            - const: false
          then: household.no
      cite:
        doc: i1040gi
        locator: p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually
          follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub.
          555."
    - id: household.cp_unmarried
      printed: (helper)
      label: 'Not filing jointly and lived in a community property state: not married at the end of 2025, and married for part
        of 2025 while living there'
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.married
            - const: true
          then: household.no
        - guard:
            op: test
            eq:
            - household.married
            - const: false
          then: household.cp_married_if_ever_married
      cite:
        doc: i1040gi
        locator: p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually
          follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub.
          555."
    - id: household.cp_marriage_ended
      printed: (gate)
      type: Bool
      label: Not filing jointly, and married for part of 2025 while living in a community property state
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.cp_not_joint
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.cp_not_joint
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.cp_not_joint
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.cp_not_joint
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555."'
    - id: household.rdp_community_property
      printed: (gate)
      type: Bool
      label: Not filing jointly, and a registered domestic partner in Nevada, Washington or California at any time in 2025
        (wherever you lived)
      expr:
        op: test
        all:
          - op: test
            ne:
              - f1040.status
              - const: mfj
          - op: test
            eq:
              - household.rdp
              - const: true
      cite:
        doc: i1040gi
        locator: 'p. 23, Community Property States, Nevada, Washington, and California domestic partners, "A registered domestic partner in Nevada, Washington, or California must generally report half the combined community income of the individual and their domestic partner. See Form 8958 and Pub. 555"; p555 p. 2, Domicile, "If you and your spouse (or your RDP) have different domiciles, check the laws of each to see if you have community property, community income, or both."'
    - id: household.joint_unmarried
      printed: (helper)
      label: Not married at the end of 2025, and no spouse who died in 2025 (read for a joint or a separate return)
      type: Bool
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.married
            - const: true
          then: household.no
        - guard:
            op: test
            eq:
            - household.married
            - const: false
          then: household.no_spouse_died
      cite:
        doc: i1040gi
        locator: p. 13, Single, "But if, at the end of 2025, your divorce wasn’t final (an interlocutory decree), you are considered
          married and can’t check the box."; p. 13, Married Filing Jointly, "You were married at the end of 2025"; p. 13, "Your
          spouse died in 2025 and you didn’t remarry in 2025."
    - id: household.no_spouse_died
      printed: (helper)
      label: Your spouse did not die in 2025
      type: Bool
      expr:
        op: test
        eq:
        - household.spouse_died_this_year_if_ever_married
        - const: false
      cite:
        doc: i1040gi
        locator: p. 13, Single, "But if, at the end of 2025, your divorce wasn’t final (an interlocutory decree), you are considered
          married and can’t check the box."; p. 13, Married Filing Jointly, "You were married at the end of 2025"; p. 13, "Your
          spouse died in 2025 and you didn’t remarry in 2025."
    - id: household.filing_status_conflict
      printed: (gate)
      type: Bool
      label: The filing status conflicts with the marriage facts entered
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.married
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.joint_unmarried
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.joint_unmarried
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 13, Single, "But if, at the end of 2025, your divorce wasn’t final (an interlocutory decree), you are considered married and can’t check the box."; p. 13, Married Filing Jointly, "You were married at the end of 2025"; p. 13, "Your spouse died in 2025 and you didn’t remarry in 2025."; p. 14, Married Filing Separately, "if you are married at the end of 2025 and file a separate return"; p501 p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."'
    - id: household.mfs
      printed: (helper)
      type: Bool
      label: Filing status married filing separately
      expr:
        op: test
        eq:
        - f1040.status
        - const: mfs
      cite:
        doc: i1040gi
        locator: 'p. 14, Married Filing Separately, "Check the “Married filing separately” box in the Filing Status section on page 1 of Form 1040 or 1040-SR if you are married at the end of 2025 and file a separate return"'
    - id: household.mfs_spouse_notice
      printed: (helper)
      type: Bool
      label: 'Notice: on a married filing separately return, enter your spouse''s name in the entry space beside the box,
        and your spouse''s SSN or ITIN in the space for the spouse''s SSN ("NRA" if your spouse has none and needs none)'
      expr:
        op: copy
        from: household.mfs
      cite:
        doc: i1040gi
        locator: 'p. 14, Married Filing Separately, "Enter your spouse’s name in the entry space. Be sure to enter your spouse’s SSN or ITIN in the space for spouse’s SSN on Form 1040 or 1040-SR. If your spouse doesn’t have and isn’t required to have an SSN or ITIN, enter “NRA” in the entry space."'
    - id: household.mfs_living
      printed: (helper)
      gated_by: household.mfs_living_if_mfs
      type: Enum(mfs_living)
      label: 'Married filing separately: when you lived with your spouse in 2025 (together_late: at some time from July
        through December; apart_last6: only before July; apart_all_year: not at any time)'
      expr:
        op: input
        source: 'Married filing separately: did you live with your spouse at any time in 2025? together_late if you lived
          together at some time from July 1 through December 31, 2025; apart_last6 if you lived together only before
          July 1, 2025; apart_all_year if you did not live together at any time in 2025. A temporary absence for special
          circumstances, such as business, medical care, school or military service, counts as time lived together, and
          so does time you shared a home while separated.'
      cite:
        doc: i1040gi
        locator: 'p. 15, Married persons who live apart, "You lived apart from your spouse for the last 6 months of 2025. Temporary absences for special circumstances, such as for business, medical care, school, or military service, count as time lived in the home"; p. 32, Social Security Benefits Worksheet, line 8, "Married filing separately and you lived with your spouse at any time in 2025"; p. 31, Line 6d, "If you are married filing separately and you lived apart from your spouse for all of 2025, check the box on line 6d"; p501 p. 8, Considered Unmarried, "Your spouse didn''t live in your home during the last 6 months of the tax year"'
      ambiguity: amb.2025.mfs_lived_apart
    - id: household.mfs_living_else
      printed: (helper)
      type: Enum(mfs_living)
      label: Year parameter household.mfs_living_else (together_late)
      expr:
        op: param
        ref: household.mfs_living_else
      cite:
        doc: i1040gi
        locator: 'p. 32, Social Security Benefits Worksheet, line 8, "Married filing separately and you lived with your spouse at any time in 2025"'
    - id: household.mfs_living_if_mfs
      printed: (helper)
      type: Enum(mfs_living)
      label: 'When you lived with your spouse in 2025, asked only on a married filing separately return (together_late
        otherwise, so that neither lived-apart test is met)'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - household.mfs
            - const: true
          then: household.mfs_living
        - guard:
            op: test
            eq:
            - household.mfs
            - const: false
          then: household.mfs_living_else
      cite:
        doc: i1040gi
        locator: 'p. 31, Line 6d, "If you are married filing separately and you lived apart from your spouse for all of 2025, check the box on line 6d"; p. 15, Married persons who live apart, "You lived apart from your spouse for the last 6 months of 2025"'
    - id: household.mfs_apart_all_year
      printed: (helper)
      type: Bool
      label: Married filing separately, and you lived apart from your spouse for all of 2025
      expr:
        op: test
        eq:
        - household.mfs_living_if_mfs
        - const: apart_all_year
      cite:
        doc: i1040gi
        locator: 'p. 31, Line 6d, "If you are married filing separately and you lived apart from your spouse for all of 2025, check the box on line 6d"; p. 97, IRA Deduction Worksheet—Schedule 1, Line 20, line 2, "married filing separately and you lived apart from your spouse for all of 2025, enter $89,000"'
      ambiguity: amb.2025.mfs_lived_apart
    - id: household.mfs_apart_last6
      printed: (helper)
      type: Bool
      label: Married filing separately, and your spouse did not live with you at any time in the last 6 months of 2025
      expr:
        op: test
        any:
        - op: test
          eq:
          - household.mfs_living_if_mfs
          - const: apart_last6
        - op: test
          eq:
          - household.mfs_living_if_mfs
          - const: apart_all_year
      cite:
        doc: i1040gi
        locator: 'p. 15, Married persons who live apart, "You lived apart from your spouse for the last 6 months of 2025"; p. 44, Special rule for separated spouses, "You lived apart from your spouse for the last 6 months of 2025"'
      ambiguity: amb.2025.mfs_lived_apart
    - id: household.mfs_community_property
      printed: (gate)
      type: Bool
      label: Married filing separately, and you or your husband or wife lived in, or had a permanent home in, a community
        property state at some time in 2025
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - f1040.status
            - const: single
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfj
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: mfs
          then: household.cp_any
        - guard:
            op: test
            eq:
            - f1040.status
            - const: hoh
          then: household.no
        - guard:
            op: test
            eq:
            - f1040.status
            - const: qss
          then: household.no
      cite:
        doc: i1040gi
        locator: 'p. 14, Married Filing Separately, "Different rules apply to people in community property states; see Pub. 555"; p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income"'
      ambiguity: amb.2025.mfs_community_property
