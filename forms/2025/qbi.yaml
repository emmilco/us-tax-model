form:
  id: qbi
  kind: form
  title: Qualified business income and section 199A dividends — amounts and the choice of Form 8995
  tax_year: 2025
  note: Section 199A dividends and the qualified business income of the Schedule C businesses (with a prior-year qualified business loss carryforward), not PTP amounts. Taxable
    income before QBI is AGI less the selected deduction; Schedule 1-A is outside scope. The Jan.
    27, 2026 Form 8995 instruction correction is followed.
  lines:
    - id: qbi.dividends
      printed: (helper)
      type: NonNegDollars
      label: Qualified section 199A dividends from Form 1099-DIV box 5 after confirming holding-period and
        related-payment requirements
      expr:
        op: input
        source: Qualified section 199A dividends from Form 1099-DIV box 5 after confirming holding-period
          and related-payment requirements
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.unsupported
      printed: (helper)
      type: Bool
      label: 'Do you have any of these: qualified business income or loss, or PTP income or loss, other than section 199A dividends and the Schedule C businesses entered in this tool; a prior-year REIT or PTP loss carryforward, or losses or deductions suspended in an earlier year by another provision and allowed this year; or are you a patron of any agricultural or horticultural cooperative, specified or not (including any qualified payments from one on Form 1099-PATR)?'
      expr:
        op: input
        source: 'Do you have any of these: qualified business income or loss, or PTP income or loss, other than section 199A dividends and the Schedule C businesses entered in this tool; a prior-year REIT or PTP loss carryforward, or losses or deductions suspended in an earlier year by another provision and allowed this year; or are you a patron of any agricultural or horticultural cooperative, specified or not (including any qualified payments from one on Form 1099-PATR)?'
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
      ambiguity: amb.2025.qbi_cooperative_patron
    - id: qbi.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.eligible
      printed: (helper)
      type: NonNegDollars
      label: Amount from qbi.dividends
      expr:
        op: copy
        from: qbi.dividends
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
      refuses:
        - when: qbi.unsupported
          form: Forms 8995 / 8995-A business or PTP path
          remedy: Only section 199A dividend income without loss carryovers is supported.
          cite:
            doc: f8995
            locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.carryforward
      printed: '3'
      label: Qualified business net (loss) carryforward from the prior year (as a positive amount)
      type: NonNegDollars
      expr:
        op: input
        source: The qualified business loss carryforward from line 16 of your 2024 Form 8995 (or the corresponding line of your
          2024 Form 8995-A), entered as a positive amount (zero if none)
      cite:
        doc: i8995
        locator: 'p. 4, Line 3, "Include here the qualified portion of trade or business (loss) carryforward allowed in calculating
          taxable income in the current year"; p. 5, Line 16, "This is the amount to be carried forward to the next year" (owner:
          the printed amount)'
    - id: qbi.business_any
      printed: (gate)
      label: Business income or a carryforward with taxable income above the Form 8995 threshold
      type: Bool
      expr:
        op: test
        any:
        - op: test
          ne:
          - f8995.line2
          - param: sales.zero
        - op: test
          gt:
          - qbi.carryforward
          - param: sales.zero
      cite:
        doc: i8995
        locator: 'p. 1, Who Can Take the Deduction (owner: Form 8995-A with business income refused)'
    - id: qbi.via_8995a
      printed: (helper)
      label: Form 8995-A (section 199A dividends only)
      type: NonNegDollars
      expr:
        op: copy
        from: f8995a.line39
      cite:
        doc: f8995a
        locator: Form 8995-A (2025), line 39
      refuses:
      - when: qbi.business_any
        form: Form 8995-A with qualified business income (taxable income above the threshold)
        remedy: The qualified business income deduction above the Form 8995 threshold is outside this tool.
        cite:
          doc: i8995a
          locator: p. 1, Who Can Take the Deduction
    - id: qbi.deductions_before
      printed: (helper)
      type: NonNegDollars
      label: Form 1040 lines 12e and 13b, the deductions taken before the QBI deduction
      expr:
        op: sum
        of:
          - sa.deduction
          - f1040.line13b
      cite:
        doc: i8995-correction
        locator: 'Correction to 2025 Form 8995 instructions, Line 11, "Form 1040 or 1040-SR filers: Form 1040 or 1040-SR, line 11a, minus lines 12e and 13b"'
    - id: qbi.taxable_before
      printed: (helper)
      type: NonNegDollars
      label: Taxable income before the QBI deduction; Form 1040 line 11a minus lines 12e and 13b, floored at zero
      expr:
        op: subtract_floor0
        from: sa.agi
        take: qbi.deductions_before
      cite:
        doc: i8995-correction
        locator: 'Correction to 2025 Form 8995 instructions, Line 11, "Enter your taxable income figured before any QBI deduction", "Form 1040 or 1040-SR filers: Form 1040 or 1040-SR, line 11a, minus lines 12e and 13b"'
    - id: qbi.net_capital_gain
      printed: (helper)
      type: NonNegDollars
      label: Add sd.net_gain, f1040.line3a
      expr:
        op: sum
        of:
          - sd.net_gain
          - f1040.line3a
      cite:
        doc: f8995
        locator: p. 1, "Enter your net capital gain, if any, increased by any qualified dividends" (line 12); i8995 p.
          4, Line 12, "line 3a, plus your net capital gain", "your net capital gain is the smaller of Schedule D (Form
          1040), line 15 or 16, unless line 15 or 16 is zero or less"
    - id: qbi.threshold
      printed: (helper)
      type: NonNegDollars
      label: Year parameter qbi.threshold
      expr:
        op: param
        ref: qbi.threshold
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.use_8995a
      printed: (helper)
      type: Bool
      label: Taxable income before QBI exceeds the Form 8995 threshold
      expr:
        op: test
        gt:
          - qbi.taxable_before
          - qbi.threshold
      cite:
        doc: f8995
        locator: p. 1, "Use this form if your taxable income, before your qualified business income deduction, is at
          or below $197,300 ($394,600 if married filing jointly)"; i8995 pp. 3–4
    - id: qbi.deduction
      printed: (helper)
      type: NonNegDollars
      label: Select Form 8995 or dividend-only Form 8995-A
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - qbi.use_8995a
                - const: true
            then: qbi.via_8995a
          - guard:
              op: test
              eq:
                - qbi.use_8995a
                - const: false
            then: f8995.line15
      cite:
        doc: f8995
        locator: p. 1, "Use this form if your taxable income, before your qualified business income deduction, is at
          or below $197,300 ($394,600 if married filing jointly)", "Qualified business income deduction. Enter the
          smaller of line 10 or line 14" (line 15); i8995 pp. 3–4
