form:
  id: qbi
  kind: form
  title: Qualified business income and section 199A dividends — amounts and the choice of Form 8995
  tax_year: 2025
  note: Section 199A dividends and the qualified business income of the Schedule C businesses (with a prior-year qualified business loss carryforward), not PTP amounts. Taxable
    income before QBI is AGI less the selected deduction; Schedule 1-A is outside scope. The Jan.
    27, 2026 Form 8995 instruction correction is followed.
  lines:
    - id: qbi.dividends
      printed: (helper)
      type: NonNegDollars
      label: Qualified section 199A dividends from Form 1099-DIV box 5 after confirming holding-period and
        related-payment requirements
      gated_by: qbi.dividends_if_ordinary
      expr:
        op: input
        source: Qualified section 199A dividends from Form 1099-DIV box 5 after confirming holding-period
          and related-payment requirements
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.no
      printed: (helper)
      type: Bool
      label: Year parameter s3.no (false)
      expr:
        op: param
        ref: s3.no
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.prior_form
      printed: (helper)
      type: Bool
      label: "Does your (or, on a joint return, your spouse's) 2024 return include Form 8995 or Form 8995-A (Qualified Business Income Deduction)?"
      expr:
        op: input
        source: "Does your (or, on a joint return, your spouse's) 2024 return include Form 8995 or Form 8995-A (Qualified Business Income Deduction)?"
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.reit_loss
      printed: (helper)
      type: Bool
      gated_by: qbi.reit_loss_if_prior_form
      label: "Does your (or, on a joint return, your spouse's) 2024 Form 8995 or Form 8995-A show a qualified REIT dividends and PTP (loss) carryforward (2024 Form 8995, line 17, or the corresponding line of Form 8995-A)?"
      expr:
        op: input
        source: "Does your (or, on a joint return, your spouse's) 2024 Form 8995 or Form 8995-A show a qualified REIT dividends and PTP (loss) carryforward (2024 Form 8995, line 17, or the corresponding line of Form 8995-A)?"
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.reit_loss_if_prior_form
      printed: (gate)
      type: Bool
      label: "Whether the 2024 Form 8995 or 8995-A carries forward a REIT or PTP loss, asked only when the 2024 return includes that form (false without it)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - qbi.prior_form
            - const: true
          then: qbi.reit_loss
        - guard:
            op: test
            eq:
            - qbi.prior_form
            - const: false
          then: qbi.no
      cite:
        doc: i8995
        locator: 'p. 4, Line 7, "Include here the qualified portion of PTP (loss) carryforward allowed in calculating taxable income in the current year"'
    - id: qbi.suspended
      printed: (helper)
      type: Bool
      gated_by: qbi.suspended_if_business
      label: "Do you (or, on a joint return, your spouse) have losses or deductions of a trade or business that were suspended in an earlier year by another provision (such as the at-risk or passive activity limits) and are allowed in calculating taxable income this year?"
      expr:
        op: input
        source: "Do you (or, on a joint return, your spouse) have losses or deductions of a trade or business that were suspended in an earlier year by another provision (such as the at-risk or passive activity limits) and are allowed in calculating taxable income this year?"
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.suspended_if_business
      printed: (gate)
      type: Bool
      label: "Whether losses or deductions suspended in an earlier year are allowed this year, asked only when the return has a Schedule C (false without one)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s1.has_sc
            - const: true
          then: qbi.suspended
        - guard:
            op: test
            eq:
            - s1.has_sc
            - const: false
          then: qbi.no
      cite:
        doc: i8995
        locator: 'p. 3, Determining Your Qualified Business Income, "When losses or deductions previously suspended by other Code provisions are allowed in calculating taxable income"'
    - id: qbi.coop_patron
      printed: (helper)
      type: Bool
      label: "Are you (or, on a joint return, your spouse) a patron of any agricultural or horticultural cooperative, specified or not (including any qualified payments from one on Form 1099-PATR)?"
      expr:
        op: input
        source: "Are you (or, on a joint return, your spouse) a patron of any agricultural or horticultural cooperative, specified or not (including any qualified payments from one on Form 1099-PATR)?"
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.unsupported
      printed: (helper)
      type: Bool
      label: 'Any of these: a prior-year REIT or PTP loss carryforward; losses or deductions suspended in an earlier year by another provision and allowed this year; being a patron of any agricultural or horticultural cooperative, specified or not. Qualified business income or loss, or PTP income or loss, other than section 199A dividends and the Schedule C businesses is refused by the scope questions on Schedule E, Schedule K-1 and Schedule F income'
      expr:
        op: test
        any:
        - op: test
          eq:
          - qbi.reit_loss_if_prior_form
          - const: true
        - op: test
          eq:
          - qbi.suspended_if_business
          - const: true
        - op: test
          eq:
          - qbi.coop_patron
          - const: true
      cite:
        doc: i8995
        locator: 'p. 4, Line 7, "Include here the qualified portion of PTP (loss) carryforward allowed in calculating taxable income in the current year"; p. 3, Determining Your Qualified Business Income, "When losses or deductions previously suspended by other Code provisions are allowed in calculating taxable income"; p. 1, Who Can Take the Deduction, "You aren’t a patron in a specified agricultural or horticultural cooperative"; p. 3, Determining Your Qualified Business Income, "If you received qualified payments reported to you on Form 1099-PATR from a specified agricultural or horticultural cooperative, you must reduce your QBI by the patron reduction and use Form 8995-A"'
      ambiguity: amb.2025.qbi_cooperative_patron
    - id: qbi.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.eligible
      printed: (helper)
      type: NonNegDollars
      label: Amount from qbi.dividends_if_ordinary
      expr:
        op: copy
        from: qbi.dividends_if_ordinary
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
      refuses:
        - when: qbi.unsupported
          form: Forms 8995 / 8995-A business or PTP path
          remedy: Only section 199A dividend income without loss carryovers is supported.
          cite:
            doc: f8995
            locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.carryforward
      printed: '3'
      label: Qualified business net (loss) carryforward from the prior year (as a positive amount)
      type: NonNegDollars
      gated_by: qbi.carryforward_if_prior_form
      expr:
        op: input
        source: The qualified business loss carryforward from line 16 of your 2024 Form 8995 (or the corresponding line of your
          2024 Form 8995-A), entered as a positive amount (zero if none)
      cite:
        doc: i8995
        locator: 'p. 4, Line 3, "Include here the qualified portion of trade or business (loss) carryforward allowed in calculating
          taxable income in the current year"; p. 5, Line 16, "This is the amount to be carried forward to the next year" (owner:
          the printed amount)'
    - id: qbi.carryforward_if_prior_form
      printed: (gate)
      type: NonNegDollars
      label: The qualified business loss carryforward, asked only when the 2024 return includes Form 8995 or 8995-A (zero without it)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - qbi.prior_form
            - const: true
          then: qbi.carryforward
        - guard:
            op: test
            eq:
            - qbi.prior_form
            - const: false
          then: qbi.zero
      cite:
        doc: i8995
        locator: 'p. 4, Line 3, "Include here the qualified portion of trade or business (loss) carryforward allowed in calculating
          taxable income in the current year"; p. 5, Line 16, "This is the amount to be carried forward to the next year"'
    - id: qbi.business_any
      printed: (gate)
      label: Business income or a carryforward with taxable income above the Form 8995 threshold
      type: Bool
      expr:
        op: test
        any:
        - op: test
          ne:
          - f8995.line2
          - param: sales.zero
        - op: test
          gt:
          - qbi.carryforward_if_prior_form
          - param: sales.zero
      cite:
        doc: i8995
        locator: 'p. 1, Who Can Take the Deduction (owner: Form 8995-A with business income refused)'
    - id: qbi.via_8995a
      printed: (helper)
      label: Form 8995-A (section 199A dividends only)
      type: NonNegDollars
      expr:
        op: copy
        from: f8995a.line39
      cite:
        doc: f8995a
        locator: Form 8995-A (2025), line 39
      refuses:
      - when: qbi.business_any
        form: Form 8995-A with qualified business income (taxable income above the threshold)
        remedy: The qualified business income deduction above the Form 8995 threshold is outside this tool.
        cite:
          doc: i8995a
          locator: p. 1, Who Can Take the Deduction
    - id: qbi.deductions_before
      printed: (helper)
      type: NonNegDollars
      label: Form 1040 lines 12e and 13b, the deductions taken before the QBI deduction
      expr:
        op: sum
        of:
          - sa.deduction
          - f1040.line13b
      cite:
        doc: i8995-correction
        locator: 'Correction to 2025 Form 8995 instructions, Line 11, "Form 1040 or 1040-SR filers: Form 1040 or 1040-SR, line 11a, minus lines 12e and 13b"'
    - id: qbi.taxable_before
      printed: (helper)
      type: NonNegDollars
      label: Taxable income before the QBI deduction; Form 1040 line 11a minus lines 12e and 13b, floored at zero
      expr:
        op: subtract_floor0
        from: sa.agi
        take: qbi.deductions_before
      cite:
        doc: i8995-correction
        locator: 'Correction to 2025 Form 8995 instructions, Line 11, "Enter your taxable income figured before any QBI deduction", "Form 1040 or 1040-SR filers: Form 1040 or 1040-SR, line 11a, minus lines 12e and 13b"'
    - id: qbi.net_capital_gain
      printed: (helper)
      type: NonNegDollars
      label: Add sd.net_gain, f1040.line3a
      expr:
        op: sum
        of:
          - sd.net_gain
          - f1040.line3a_if_ordinary
      cite:
        doc: f8995
        locator: p. 1, "Enter your net capital gain, if any, increased by any qualified dividends" (line 12); i8995 p.
          4, Line 12, "line 3a, plus your net capital gain", "your net capital gain is the smaller of Schedule D (Form
          1040), line 15 or 16, unless line 15 or 16 is zero or less"
    - id: qbi.threshold
      printed: (helper)
      type: NonNegDollars
      label: Year parameter qbi.threshold
      expr:
        op: param
        ref: qbi.threshold
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.use_8995a
      printed: (helper)
      type: Bool
      label: Taxable income before QBI exceeds the Form 8995 threshold
      expr:
        op: test
        gt:
          - qbi.taxable_before
          - qbi.threshold
      cite:
        doc: f8995
        locator: p. 1, "Use this form if your taxable income, before your qualified business income deduction, is at
          or below $197,300 ($394,600 if married filing jointly)"; i8995 pp. 3–4
    - id: qbi.deduction
      printed: (helper)
      type: NonNegDollars
      label: Select Form 8995 or dividend-only Form 8995-A
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - qbi.use_8995a
                - const: true
            then: qbi.via_8995a
          - guard:
              op: test
              eq:
                - qbi.use_8995a
                - const: false
            then: f8995.line15
      cite:
        doc: f8995
        locator: p. 1, "Use this form if your taxable income, before your qualified business income deduction, is at
          or below $197,300 ($394,600 if married filing jointly)", "Qualified business income deduction. Enter the
          smaller of line 10 or line 14" (line 15); i8995 pp. 3–4
    - id: qbi.dividends_if_ordinary
      printed: (helper)
      type: NonNegDollars
      label: 'Qualified section 199A dividends (Form 1099-DIV box 5), when ordinary dividends (box 1a) are above zero; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.has_ordinary
                - const: true
            then: qbi.dividends
          - guard:
              op: test
              eq:
                - div.has_ordinary
                - const: false
            then: qbi.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 5. Shows the portion of the amount in box 1a that may be eligible for the 20% qualified business income deduction under section 199A"'
