form:
  id: qbi
  kind: form
  title: Qualified business income and section 199A dividends — amounts and the choice of Form 8995
  tax_year: 2025
  note: Section 199A dividends and the qualified business income of the Schedule C businesses (with a prior-year qualified business loss carryforward), not PTP amounts. Taxable
    income before QBI is AGI less the selected deduction; Schedule 1-A is outside scope. The Jan.
    27, 2026 Form 8995 instruction correction is followed.
  lines:
    - id: qbi.dividends
      printed: (helper)
      type: NonNegDollars
      label: Qualified section 199A dividends from Form 1099-DIV box 5, leaving out the part on shares held 45 days or less
        or that you are obliged to pay to someone else
      gated_by: qbi.dividends_if_ordinary
      expr:
        op: input
        source: Qualified section 199A dividends from Form 1099-DIV box 5. Leave out the part paid on shares you held for 45
          days or less, and the part you are obliged to pay to someone else; enter only the part that qualifies.
      cite:
        doc: f8995
        locator: 'Form 8995 (2025), lines 1–17; i8995 pp. 3–4; i8995 p. 3, "Qualified REIT dividends include any dividends
          you received from a REIT held for more than 45 days and for which the payment isn’t obligated to someone else"'
    - id: qbi.no
      printed: (helper)
      type: Bool
      label: Year parameter s3.no (false)
      expr:
        op: param
        ref: s3.no
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.prior_form
      printed: (helper)
      type: Bool
      label: "Did your (or, on a joint return, your spouse's) 2024 return, or any earlier one, include Form 8995 or Form 8995-A (Qualified Business Income Deduction)?"
      expr:
        op: input
        source: "Did your (or, on a joint return, your spouse's) 2024 return, or any earlier one, include Form 8995 or Form 8995-A (Qualified Business Income Deduction)?"
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.reit_loss
      printed: (helper)
      type: Bool
      gated_by: qbi.reit_loss_if_prior_form
      label: "Does the latest of your (or, on a joint return, your spouse's) Forms 8995 or 8995-A, from 2024 or earlier, show a qualified REIT dividends and PTP (loss) carryforward (Form 8995, line 17, or the corresponding line of Form 8995-A)?"
      expr:
        op: input
        source: "Does the latest of your (or, on a joint return, your spouse's) Forms 8995 or 8995-A, from 2024 or earlier, show a qualified REIT dividends and PTP (loss) carryforward (Form 8995, line 17, or the corresponding line of Form 8995-A)?"
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.reit_loss_if_prior_form
      printed: (gate)
      type: Bool
      label: "Whether the latest Form 8995 or 8995-A, from 2024 or earlier, carries forward a REIT or PTP loss, asked only when a return of 2024 or earlier includes that form (false without it)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - qbi.prior_form
            - const: true
          then: qbi.reit_loss
        - guard:
            op: test
            eq:
            - qbi.prior_form
            - const: false
          then: qbi.no
      cite:
        doc: i8995
        locator: 'p. 4, Line 7, "Include here the qualified portion of PTP (loss) carryforward allowed in calculating taxable income in the current year"'
    - id: qbi.suspended
      printed: (helper)
      type: Bool
      gated_by: qbi.suspended_if_business
      label: "Do you (or, on a joint return, your spouse) have losses or deductions of a trade or business that were suspended in an earlier year by another provision (such as the at-risk or passive activity limits) and are allowed in calculating taxable income this year? Leave out a section 179 deduction carried over from 2018 or later and deducted on this return's Schedule C, which is already counted in that Schedule C's profit or loss."
      expr:
        op: input
        source: "Do you (or, on a joint return, your spouse) have losses or deductions of a trade or business that were suspended in an earlier year by another provision (such as the at-risk or passive activity limits) and are allowed in calculating taxable income this year? Leave out a section 179 deduction carried over from 2018 or later and deducted on this return's Schedule C, which is already counted in that Schedule C's profit or loss."
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4; i8995 p. 3, "Such Code provisions include, but aren’t limited
          to, sections 163(j), 179, 461(l), 465, 469, 704(d), and 1366(d)", "In general, losses and deductions incurred prior
          to 2018 are not qualified losses or deductions"
    - id: qbi.suspended_if_business
      printed: (gate)
      type: Bool
      label: "Whether losses or deductions suspended in an earlier year are allowed this year, asked only when the return has a Schedule C (false without one)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s1.has_sc
            - const: true
          then: qbi.suspended
        - guard:
            op: test
            eq:
            - s1.has_sc
            - const: false
          then: qbi.no
      cite:
        doc: i8995
        locator: 'p. 3, Determining Your Qualified Business Income, "When losses or deductions previously suspended by other Code provisions are allowed in calculating taxable income"'
    - id: qbi.coop_patron
      printed: (helper)
      type: Bool
      label: "Are you (or, on a joint return, your spouse) a patron of any agricultural or horticultural cooperative, specified or not (including any qualified payments from one on Form 1099-PATR)?"
      expr:
        op: input
        source: "Are you (or, on a joint return, your spouse) a patron of any agricultural or horticultural cooperative, specified or not (including any qualified payments from one on Form 1099-PATR)?"
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.has_amount
      printed: (gate)
      type: Bool
      label: The return has a Schedule C or qualified section 199A dividends, so that Form 8995 or 8995-A could be filed
      expr:
        op: test
        any:
        - op: test
          eq:
          - s1.has_sc
          - const: true
        - op: test
          gt:
          - qbi.dividends_if_ordinary
          - param: sales.zero
      cite:
        doc: i8995
        locator: 'p. 1, Who Can Take the Deduction, "Individuals and eligible estates and trusts that have QBI use Form 8995
          to figure the QBI deduction if: • You have QBI, qualified REIT dividends, or qualified PTP income or loss"'
    - id: qbi.coop_patron_if_amount
      printed: (gate)
      type: Bool
      label: Whether you are a patron of an agricultural or horticultural cooperative, asked only when the return has a
        Schedule C or qualified section 199A dividends (false otherwise)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - qbi.has_amount
            - const: true
          then: qbi.coop_patron
        - guard:
            op: test
            eq:
            - qbi.has_amount
            - const: false
          then: qbi.no
      cite:
        doc: i8995
        locator: 'p. 1, Who Can Take the Deduction, "You have QBI, qualified REIT dividends, or qualified PTP income or loss
          (all defined later); and", "You aren’t a patron in a specified agricultural or horticultural cooperative"'
    - id: qbi.unreported_loss
      printed: (helper)
      type: Bool
      gated_by: qbi.unreported_loss_if_business
      label: "Did you (or, on a joint return, your spouse) have a qualified business net loss in any year from 2018 to 2024 whose return included neither Form 8995 nor Form 8995-A?"
      expr:
        op: input
        source: "Did you (or, on a joint return, your spouse) have a qualified business net loss (the qualified business income of all your trades or businesses together less than zero) in any year from 2018 to 2024 whose return included neither Form 8995 nor Form 8995-A?"
      cite:
        doc: i8995a
        locator: 'p. 6, Schedule C (Form 8995-A), "This includes prior year loss carryforwards even if the loss was unreported
          or the trade or business that generated the loss is no longer in existence"; i8995 p. 5, Line 16, "This amount will
          offset QBI in later tax years regardless of whether"; i8995 p. 3, "In general, losses and deductions incurred prior
          to 2018 are not qualified losses or deductions"'
    - id: qbi.unreported_loss_if_business
      printed: (gate)
      type: Bool
      label: "Whether a qualified business net loss of 2018 to 2024 was never reported on Form 8995 or 8995-A, asked only when the return has a Schedule C (false without one)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s1.has_sc
            - const: true
          then: qbi.unreported_loss
        - guard:
            op: test
            eq:
            - s1.has_sc
            - const: false
          then: qbi.no
      cite:
        doc: i8995a
        locator: 'p. 6, Schedule C (Form 8995-A), "This includes prior year loss carryforwards even if the loss was unreported
          or the trade or business that generated the loss is no longer in existence"'
    - id: qbi.unsupported
      printed: (helper)
      type: Bool
      label: 'Any of these: a prior-year REIT or PTP loss carryforward; losses or deductions suspended in an earlier year by another provision and allowed this year; being a patron of any agricultural or horticultural cooperative, specified or not. Qualified business income or loss, or PTP income or loss, other than section 199A dividends and the Schedule C businesses is refused by the scope questions on Schedule E, Schedule K-1 and Schedule F income'
      expr:
        op: test
        any:
        - op: test
          eq:
          - qbi.reit_loss_if_prior_form
          - const: true
        - op: test
          eq:
          - qbi.suspended_if_business
          - const: true
        - op: test
          eq:
          - qbi.coop_patron_if_amount
          - const: true
      cite:
        doc: i8995
        locator: 'p. 4, Line 7, "Include here the qualified portion of PTP (loss) carryforward allowed in calculating taxable income in the current year"; p. 3, Determining Your Qualified Business Income, "When losses or deductions previously suspended by other Code provisions are allowed in calculating taxable income"; p. 1, Who Can Take the Deduction, "You aren’t a patron in a specified agricultural or horticultural cooperative"; p. 3, Determining Your Qualified Business Income, "If you received qualified payments reported to you on Form 1099-PATR from a specified agricultural or horticultural cooperative, you must reduce your QBI by the patron reduction and use Form 8995-A"'
      ambiguity: amb.2025.qbi_cooperative_patron
    - id: qbi.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.eligible
      printed: (helper)
      type: NonNegDollars
      label: Amount from qbi.dividends_if_ordinary
      expr:
        op: copy
        from: qbi.dividends_if_ordinary
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
      refuses:
        - when: qbi.unreported_loss_if_business
          form: Form 8995, line 3, a qualified business loss of 2018 to 2024 never reported on Form 8995 or 8995-A
          remedy: A business loss of an earlier year that no Form 8995 or 8995-A carried forward is outside this tool.
          cite:
            doc: i8995a
            locator: 'p. 6, Schedule C (Form 8995-A), "This includes prior year loss carryforwards even if the loss was
              unreported or the trade or business that generated the loss is no longer in existence"'
        - when: qbi.unsupported
          form: Forms 8995 / 8995-A business or PTP path
          remedy: Only section 199A dividend income without loss carryovers is supported.
          cite:
            doc: f8995
            locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.carryforward
      printed: '3'
      label: Qualified business net (loss) carryforward from the prior year (as a positive amount)
      type: NonNegDollars
      gated_by: qbi.carryforward_if_prior_form
      expr:
        op: input
        source: The qualified business loss carryforward from line 16 of your latest Form 8995 from 2024 or earlier (or, if
          that form was a Form 8995-A, from line 6 of Schedule C (Form 8995-A) attached to it), entered as a positive amount
          (zero if none)
      cite:
        doc: i8995
        locator: 'p. 4, Line 3, "Include here the qualified portion of trade or business (loss) carryforward allowed in calculating
          taxable income in the current year"; p. 5, Line 16, "This is the amount to be carried forward to the next year" (owner:
          the printed amount); i8995a p. 6, Line 6, "The amount reported on this line must be reported in the next tax year on
          Schedule C (Form 8995-A), line 2, or Form 8995, line 3"'
    - id: qbi.carryforward_if_prior_form
      printed: (gate)
      type: NonNegDollars
      label: The qualified business loss carryforward, asked only when a return of 2024 or earlier includes Form 8995 or 8995-A (zero without it)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - qbi.prior_form
            - const: true
          then: qbi.carryforward
        - guard:
            op: test
            eq:
            - qbi.prior_form
            - const: false
          then: qbi.zero
      cite:
        doc: i8995
        locator: 'p. 4, Line 3, "Include here the qualified portion of trade or business (loss) carryforward allowed in calculating
          taxable income in the current year"; p. 5, Line 16, "This is the amount to be carried forward to the next year"'
    - id: qbi.business_any
      printed: (gate)
      label: Business income or a carryforward with taxable income above the Form 8995 threshold
      type: Bool
      expr:
        op: test
        any:
        - op: test
          ne:
          - f8995.line2
          - param: sales.zero
        - op: test
          gt:
          - qbi.carryforward_if_prior_form
          - param: sales.zero
      cite:
        doc: i8995
        locator: 'p. 1, Who Can Take the Deduction (owner: Form 8995-A with business income refused)'
    - id: qbi.via_8995a
      printed: (helper)
      label: Form 8995-A (section 199A dividends only)
      type: NonNegDollars
      expr:
        op: copy
        from: f8995a.line39
      cite:
        doc: f8995a
        locator: Form 8995-A (2025), line 39
      refuses:
      - when: qbi.business_any
        form: Form 8995-A with qualified business income (taxable income above the threshold)
        remedy: The qualified business income deduction above the Form 8995 threshold is outside this tool.
        cite:
          doc: i8995a
          locator: p. 1, Who Can Take the Deduction
    - id: qbi.deductions_before
      printed: (helper)
      type: NonNegDollars
      label: Form 1040 lines 12e and 13b, the deductions taken before the QBI deduction
      expr:
        op: sum
        of:
          - sa.deduction
          - f1040.line13b
      cite:
        doc: i8995-correction
        locator: 'Correction to 2025 Form 8995 instructions, Line 11, "Form 1040 or 1040-SR filers: Form 1040 or 1040-SR, line 11a, minus lines 12e and 13b"'
    - id: qbi.taxable_before
      printed: (helper)
      type: Dollars
      label: Taxable income before the QBI deduction; Form 1040 line 11a minus lines 12e and 13b, negative when the deductions are more than adjusted gross income
      expr:
        op: subtract
        from: sa.agi
        take: qbi.deductions_before
      cite:
        doc: i8995-correction
        locator: 'Correction to 2025 Form 8995 instructions, Line 11, "Enter your taxable income figured before any QBI deduction", "Form 1040 or 1040-SR filers: Form 1040 or 1040-SR, line 11a, minus lines 12e and 13b"'
    - id: qbi.net_capital_gain
      printed: (helper)
      type: NonNegDollars
      label: Add sd.net_gain, f1040.line3a
      expr:
        op: sum
        of:
          - sd.net_gain
          - f1040.line3a_if_ordinary
      cite:
        doc: f8995
        locator: p. 1, "Enter your net capital gain, if any, increased by any qualified dividends" (line 12); i8995 p.
          4, Line 12, "line 3a, plus your net capital gain", "your net capital gain is the smaller of Schedule D (Form
          1040), line 15 or 16, unless line 15 or 16 is zero or less"
    - id: qbi.threshold
      printed: (helper)
      type: NonNegDollars
      label: Year parameter qbi.threshold
      expr:
        op: param
        ref: qbi.threshold
      cite:
        doc: f8995
        locator: Form 8995 (2025), lines 1–17; i8995 pp. 3–4
    - id: qbi.use_8995a
      printed: (helper)
      type: Bool
      label: Taxable income before QBI exceeds the Form 8995 threshold
      expr:
        op: test
        gt:
          - qbi.taxable_before
          - qbi.threshold
      cite:
        doc: f8995
        locator: p. 1, "Use this form if your taxable income, before your qualified business income deduction, is at
          or below $197,300 ($394,600 if married filing jointly)"; i8995 pp. 3–4
    - id: qbi.deduction
      printed: (helper)
      type: NonNegDollars
      label: Select Form 8995 or dividend-only Form 8995-A
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - qbi.use_8995a
                - const: true
            then: qbi.via_8995a
          - guard:
              op: test
              eq:
                - qbi.use_8995a
                - const: false
            then: f8995.line15
      cite:
        doc: f8995
        locator: p. 1, "Use this form if your taxable income, before your qualified business income deduction, is at
          or below $197,300 ($394,600 if married filing jointly)", "Qualified business income deduction. Enter the
          smaller of line 10 or line 14" (line 15); i8995 pp. 3–4
    - id: qbi.dividends_if_ordinary
      printed: (helper)
      type: NonNegDollars
      label: 'Qualified section 199A dividends (Form 1099-DIV box 5), when ordinary dividends (box 1a) are above zero; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.has_ordinary
                - const: true
            then: qbi.dividends
          - guard:
              op: test
              eq:
                - div.has_ordinary
                - const: false
            then: qbi.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 5. Shows the portion of the amount in box 1a that may be eligible for the 20% qualified business income deduction under section 199A"'
