    type: Bool
    expr:
      op: input
      source: 'Does any of these apply: the insurance was obtained through the Marketplace and advance payments of the premium
        tax credit were made or you are claiming the premium tax credit; you file Form 2555; you were a more-than-2% shareholder
        of an S corporation; you used an optional method for net earnings from self-employment; you are a retired public
        safety officer who paid premiums from retirement plan distributions; or anyone is covered by qualified long-term care
        insurance entered for more than one business on this return (yours or your spouse''s)?'
    cite:
      doc: i1040gi
      locator: p. 95, Schedule 1, line 17, Exceptions, "Use Pub. 974 instead of the worksheet ... if the insurance plan ... was obtained
        through the Marketplace, and advance payments of the premium tax credit were made or you are claiming the premium
        tax credit"; i7206 pp. 1–2, "the total of the amounts entered for each person on line 2 of all Form(s) 7206 can’t
