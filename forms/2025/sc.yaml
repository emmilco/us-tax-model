    type: Bool
    expr:
      op: input
      source: 'Did you pay for health insurance for 2025 (for you, your spouse, your dependents, or your child under age 27
        at the end of 2025) that is established under this business: a policy in the name of the business or in your own name?'
    cite:
      doc: i1040gi
      locator: pp. 94–95, Schedule 1, line 17, "The insurance plan must be established under your business ... the policy can be either
        in your name or in the name of the business"
  - id: sc.hi_screen
