        you paid voluntarily) established under this business for you, your spouse and your dependents, and your child under
        age 27 at the end of 2025; but not amounts for any month you were eligible to participate in a health plan subsidized
        by your employer or your spouse's employer (or the employer of your dependent or of your child under age 27), and
        not long-term care insurance
    cite:
      doc: f7206
      locator: Form 7206 (2025), line 1; i7206 pp. 1–2
    refuses:
