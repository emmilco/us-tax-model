form:
  id: gift
  kind: form
  title: Form 8283 — groups of similar noncash property
  tax_year: 2025
  note: Group similar property across donees before testing $5,000. Values are supplied from valuation
    records; this does not determine fair market value or produce a completed signed Form 8283.
    Dates, descriptions and donee details remain in underlying records.
  lines:
    - id: gift.deduction
      printed: (helper)
      type: NonNegDollars
      label: Deduction before income limits for this item or group of similar items across all donees,
        after required valuation/basis reductions
      expr:
        op: input
        source: Deduction before income limits for this item or group of similar items across all donees,
          after required valuation/basis reductions
      cite:
        doc: i8283
        locator: pp. 1–3, Who Must File and Which Sections To Complete; f8283 Section A
    - id: gift.public_securities
      printed: (helper)
      type: Bool
      label: Is this group publicly traded securities?
      expr:
        op: input
        source: Is this group publicly traded securities?
      cite:
        doc: i8283
        locator: pp. 1–3, Who Must File and Which Sections To Complete; f8283 Section A
    - id: gift.special
      printed: (helper)
      type: Bool
      label: 'Does this group need an appraisal or other special treatment: a deduction over $5,000 (before any income limit), or property worth more than $5,000, for one item or for similar items given to all donees together (other than publicly traded securities), a noncash contribution reaching you through a Schedule K-1, vehicles, pass-through entity interests, intellectual property, inventory, conservation or partial interests, property with restrictions on its use, or a clothing or household item over $500 not in good used condition?'
      expr:
        op: input
        source: 'Does this group need an appraisal or other special treatment: a deduction over $5,000 (before any income limit), or property worth more than $5,000, for one item or for similar items given to all donees together (other than publicly traded securities), a noncash contribution reaching you through a Schedule K-1, vehicles, pass-through entity interests, intellectual property, inventory, conservation or partial interests, property with restrictions on its use, or a clothing or household item over $500 not in good used condition?'
      cite:
        doc: i8283
        locator: pp. 1–3, Who Must File and Which Sections To Complete; f8283 Section A
    - id: gift.section_b
      printed: (helper)
      type: Bool
      label: "Appraisal threshold: non-publicly-traded group over $5,000"
      expr:
        op: test
        all:
          - op: test
            eq:
              - gift.public_securities
              - const: false
          - op: test
            gt:
              - gift.deduction
              - const: 500000
      cite:
        doc: i8283
        locator: pp. 1–3, Who Must File and Which Sections To Complete; f8283 Section A
    - id: gift.allowed
      printed: (helper)
      type: NonNegDollars
      label: Amount from gift.deduction
      expr:
        op: copy
        from: gift.deduction
      cite:
        doc: i8283
        locator: pp. 1–3, Who Must File and Which Sections To Complete; f8283 Section A
      refuses:
        - when: gift.special
          form: Form 8283 special treatment
          remedy: This contribution requires unsupported appraisal or special-property treatment.
          cite:
            doc: i8283
            locator: pp. 1–3, Who Must File and Which Sections To Complete; f8283 Section A
        - when: gift.section_b
          form: Form 8283 Section B
          remedy: A group of similar items over $5,000 requires Section B and a qualified appraisal; publicly
            traded securities are excepted.
          cite:
            doc: i8283
            locator: pp. 1–3, Who Must File and Which Sections To Complete; f8283 Section A
  collection:
    cite:
      doc: i8283
      locator: pp. 1–3, Who Must File and Which Sections To Complete; f8283 Section A
