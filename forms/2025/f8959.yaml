form:
  id: f8959
  kind: form
  title: Form 8959 — Additional Medicare Tax on wages and self-employment income
  tax_year: 2025
  note: The total liability feeds Schedule 2 line 11. Additional Medicare withholding feeds Form 1040
    line 25c, separately from the tax. Railroad and self-employment paths are explicitly refused.
  lines:
    - id: f8959.unsupported
      printed: (helper)
      type: Bool
      label: 'Any church employee income or other self-employment income outside Schedule SE as this tool prepares it, RRTA compensation, tips not reported to your employer or allocated tips in Form W-2 box 8 (Form 4137), Form 8919 wages, uncollected Medicare tax in Form W-2 box 12 (codes B or N), or Medicare wages on a wage statement from a U.S. territory (such as Form 499R-2/W-2PR)?'
      expr:
        op: input
        source: 'Any church employee income or other self-employment income outside Schedule SE as this tool prepares it, RRTA compensation, tips not reported to your employer or allocated tips in Form W-2 box 8 (Form 4137), Form 8919 wages, uncollected Medicare tax in Form W-2 box 12 (codes B or N), or Medicare wages on a wage statement from a U.S. territory (such as Form 499R-2/W-2PR)?'
      cite:
        doc: f8959
        locator: Form 8959 (2025), lines 1–24; i8959 pp. 1–3
    - id: f8959.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
