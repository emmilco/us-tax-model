form:
  id: f8959
  kind: form
  title: Form 8959 — wage-only Additional Medicare Tax
  tax_year: 2025
  note: The total liability feeds Schedule 2 line 11. Additional Medicare withholding feeds Form 1040
    line 25c, separately from the tax. Railroad and self-employment paths are explicitly refused.
