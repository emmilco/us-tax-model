form:
  id: sa
  kind: form
  title: Schedule A — supported itemized deductions and standard comparison
  tax_year: 2025
  note: Income and deduction eligibility are explicit supplied facts. Charity valuation,
    substantiation and income-limit screening are not computed; an affirmative limitation answer is
    refused. The SALT formula follows the printed 2025 worksheet, including its MFS halving step.
  lines:
    - id: sa.unsupported
      printed: (helper)
      type: Bool
      label: 'Any casualty or theft loss (including a disaster loss added to the standard deduction); a deduction from the Schedule A line 16 list other than gambling losses; a foreign tax or generation-skipping tax deduction; mortgage interest or points not on Form 1098 or subject to the debt or use limits (loan proceeds not all used to buy, build or improve the home, or debt over the limit); or the sales-tax election?'
      expr:
        op: input
        source: 'Any casualty or theft loss (including a disaster loss added to the standard deduction); a deduction from the Schedule A line 16 list other than gambling losses; a foreign tax or generation-skipping tax deduction; mortgage interest or points not on Form 1098 or subject to the debt or use limits (loan proceeds not all used to buy, build or improve the home, or debt over the limit); or the sales-tax election?'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.gifts
      printed: (helper)
      type: Bool
      label: |-
        Did you or your spouse make any charitable contribution in 2025, or does either of you have a charitable contribution carried over from an earlier year? Answer Yes if any of these applies:

        - money given to a charity by cash, check, card or payroll deduction, including money put into a donor-advised fund
        - a payment to a charity that got you something back (such as a fundraising dinner, an auction item or a membership), or that earned you a state or local tax credit
        - property given to a charity, such as clothing, household items, a vehicle or stock, or property sold to a charity for less than its value
        - out-of-pocket costs of volunteer work for a charity, such as mileage, parking, supplies or uniforms, or unreimbursed costs of hosting a student or a foster child placed by a charitable organization
        - a charitable contribution shown on a Schedule K-1 from a partnership, S corporation, estate or trust
        - expenses you paid as a whaling captain for Native Alaskan subsistence bowhead whale hunting
        - a contribution from an earlier year (in most cases one of the five years before 2025) that was more than you could deduct that year, by either of you, on a joint or separate return; if you itemized in any of those years, check that return and any carryover worksheet or statement kept with it

        A charity here is any organization that is religious, charitable, educational, scientific or literary in purpose (such as a church, a school, a nonprofit hospital, a veterans' group or a fraternal order's charitable work), one that works to prevent cruelty to children or animals, or a federal, state, local or Indian tribal government receiving a gift for public purposes; nonprofit cemetery companies and other qualified organizations count too.
      expr:
        op: input
        source: |-
          Did you or your spouse make any charitable contribution in 2025, or does either of you have a charitable contribution carried over from an earlier year? Answer Yes if any of these applies:

          - money given to a charity by cash, check, card or payroll deduction, including money put into a donor-advised fund
          - a payment to a charity that got you something back (such as a fundraising dinner, an auction item or a membership), or that earned you a state or local tax credit
          - property given to a charity, such as clothing, household items, a vehicle or stock, or property sold to a charity for less than its value
          - out-of-pocket costs of volunteer work for a charity, such as mileage, parking, supplies or uniforms, or unreimbursed costs of hosting a student or a foster child placed by a charitable organization
          - a charitable contribution shown on a Schedule K-1 from a partnership, S corporation, estate or trust
          - expenses you paid as a whaling captain for Native Alaskan subsistence bowhead whale hunting
          - a contribution from an earlier year (in most cases one of the five years before 2025) that was more than you could deduct that year, by either of you, on a joint or separate return; if you itemized in any of those years, check that return and any carryover worksheet or statement kept with it

          A charity here is any organization that is religious, charitable, educational, scientific or literary in purpose (such as a church, a school, a nonprofit hospital, a veterans' group or a fraternal order's charitable work), one that works to prevent cruelty to children or animals, or a federal, state, local or Indian tribal government receiving a gift for public purposes; nonprofit cemetery companies and other qualified organizations count too.
      cite:
        doc: i1040sca
        locator: p. 9, Gifts to Charity, "You can deduct contributions or gifts you gave to organizations that are
          religious, charitable, educational, scientific, or literary in purpose", "Certain whaling captains may be able to
          deduct expenses paid in 2025 for Native Alaskan subsistence bowhead whale hunting activities" and "Federal,
          state, and local governments if the gifts are solely for public purposes"; p. 9, Gifts from which you benefit,
          "If you made a gift and received a benefit in return"; p. 9, Amounts You Can Deduct,
          "Contributions can be in cash, property, or out-of-pocket expenses you paid to do volunteer work"; p. 11, Line
          13, "You may have contributions that you couldn't deduct in an earlier year because they exceeded the limits on
          the amount you could deduct"
    - id: sa.no
      printed: (helper)
      type: Bool
      label: Year parameter sa.no (no)
      expr:
        op: param
        ref: sa.no
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.charity_limited
      printed: (helper)
      type: Bool
      gated_by: sa.charity_limited_if_gifts
      label: Are any charitable deductions reduced by income limits, or carried over from a prior year?
        Determine under Publication 526 before answering.
      expr:
        op: input
        source: Are any charitable deductions reduced by income limits, or carried over from a prior year?
          Determine under Publication 526 before answering.
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.charity_limited_if_gifts
      printed: (helper)
      type: Bool
      label: Charitable deductions are reduced by income limits or carried over from a prior year (no when you and
        your spouse gave nothing to charity and have no carryover)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.gifts
                - const: true
            then: sa.charity_limited
          - guard:
              op: test
              eq:
                - sa.gifts
                - const: false
            then: sa.no
      cite:
        doc: i1040sca
        locator: p. 10, Limit on the amount you can deduct, "See Pub. 526 to figure the amount of your deduction if
          any of the following applies"; p. 11, Line 13, "You may have contributions that you couldn't deduct in an
          earlier year because they exceeded the limits on the amount you could deduct"
    - id: sa.excluded_income
      printed: (helper)
      type: Bool
      label: 'Are you filing Form 2555 or Form 4563, or do you have income excluded as a bona fide resident of Puerto Rico?'
      expr:
        op: input
        source: 'Are you filing Form 2555 or Form 4563, or do you have income excluded as a bona fide resident of Puerto Rico?'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.dependent
      printed: (helper)
      type: Bool
      label: 'Can someone claim you or your spouse as a dependent for 2025, or are you a dual-status alien? (Answer no if the person who could claim you is not required to file and does not file, or files only to claim a refund of withheld or estimated tax.)'
      expr:
        op: input
        source: 'Can someone claim you or your spouse as a dependent for 2025, or are you a dual-status alien? (Answer no if the person who could claim you is not required to file and does not file, or files only to claim a refund of withheld or estimated tax.)'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.spouse_extra
      printed: (helper)
      type: Bool
      label: Married filing separately and claiming age or blindness boxes for your spouse (who had no income, isn't filing a return and can't be claimed as a dependent)?
      expr:
        op: input
        source: Married filing separately and claiming age or blindness boxes for your spouse (who had no income, isn't filing a return and can't be claimed as a dependent)?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.mfs_spouse_extra
      printed: (gate)
      type: Bool
      label: Married filing separately and claiming age or blindness boxes for your spouse
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - sa.mfs
            - const: true
          then: sa.spouse_extra
        - guard:
            op: test
            eq:
            - sa.mfs
            - const: false
          then: sa.no
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "If your filing status is married filing separately and your spouse was born before
          January 2, 1961, or was blind at the end of 2025, you can check the appropriate box(es) on line 12d if your
          spouse had no income, isn't filing a return, and can't be claimed as a dependent on another person's return"
    - id: sa.age65_count
      printed: (helper)
      label: Your entry, if the answer is yes
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.role
            - const: taxpayer
          - op: test
            eq:
            - person.age65
            - const: true
      cite:
        doc: f1040sa
        locator: i1040gi p. 35, Standard Deduction Chart for People Who Were Born Before January 2, 1961, or Were
          Blind, "You were born before January 2, 1961", "Enter the total number of boxes checked"
    - id: sa.age65
      printed: (helper)
      label: Were you born before January 2, 1961?
      type: Bool
      expr:
        op: test
        gt:
        - sa.age65_count
        - const: 0
          type: Count
      cite:
        doc: f1040sa
        locator: i1040gi p. 35, Standard Deduction Chart for People Who Were Born Before January 2, 1961, or Were
          Blind, "You were born before January 2, 1961", "Enter the total number of boxes checked"
    - id: sa.spouse_itemizes
      printed: (helper)
      type: Bool
      label: Married filing separately with a spouse who itemizes?
      expr:
        op: input
        source: Married filing separately with a spouse who itemizes?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.elect_itemize
      printed: (helper)
      type: Bool
      label: Elect to itemize even if the standard deduction is larger?
      expr:
        op: input
        source: Elect to itemize even if the standard deduction is larger?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.agi
      printed: (helper)
      type: Dollars
      label: Form 1040 line 11b adjusted gross income
      expr:
        op: copy
        from: f1040.line11b
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line1
      printed: "1"
      type: NonNegDollars
      label: Unreimbursed eligible medical and dental expenses
      expr:
        op: input
        source: |-
          Unreimbursed eligible medical and dental expenses paid in 2025 (Pub. 502 lists what counts) for these people:

          - yourself
          - your spouse
          - your dependents
          - your child whom you do not claim only because of the rules for children of divorced or separated parents
          - anyone you could have claimed as a dependent except that the person had gross income of $5,200 or more or filed a joint return

          Reduce them by payments from insurance or other sources, but do not reduce them by a 2025 reimbursement of expenses paid in an earlier year.

          Leave out:
          - amounts equal to tax-free distributions from a health savings account (HSA) or an Archer MSA
          - insurance premiums paid by a pretax reduction of your pay, and premiums and other medical and dental expenses paid by an employer-sponsored health plan (cafeteria plan) unless they are included in box 1 of your Form W-2
          - premiums for someone on your policy who is not one of the people listed above (for example a nondependent child under age 27), unless you had family coverage when you added that person and your premiums did not increase
          - if you are a retired public safety officer, premiums to the extent paid with a tax-free distribution from your retirement plan
          - the housework part of pay to someone who did both nursing and housework (only the nursing help counts)
          - meals while away from home for medical care, other than hospital care, which includes its meals and lodging (other lodging for medical care counts at no more than $50 a night for each person who meets the Pub. 502 lodging requirements)

          Reduce health insurance premiums by any self-employed health insurance deduction on Schedule 1 (Form 1040), line 17.

          For Marketplace coverage on a Form 1095-A, include the total premiums (including the part paid by advance payments of the premium tax credit), minus the premium tax credit allowed on Form 8962, line 24, and minus any excess advance payments you do not have to repay because of the repayment limit (Form 8962, line 27 minus line 29); advance payments you do repay count as premiums you paid.

          Include qualified long-term care insurance premiums only up to the limit for the age at the end of 2025 of the person for whom they were paid:

          - $480 if 40 or under
          - $900 if 41 to 50
          - $1,800 if 51 to 60
          - $4,810 if 61 to 70
          - $6,020 if 71 or older

          On the final return of a person who died in 2025, include the medical expenses paid out of that person's estate that Pub. 502 allows on the final return.
      cite:
        doc: i1040sca
        locator: 'p. 1, Medical and Dental Expenses, "If you received a distribution from a health savings account or a
          medical savings account in 2025, see Pub. 969 to figure your deduction", "Certain medical expenses paid out of a
          deceased taxpayer''s estate can be claimed on the deceased taxpayer''s final return", "You can''t include
          insurance premiums paid by making a pretax reduction to your employee compensation", "If you are a retired public
          safety officer, you can''t include any premiums you paid to the extent they were paid for with a tax-free
          distribution from your retirement plan", "If you paid someone to do both nursing and housework, you can deduct
          only the cost of the nursing help", "Hospital care (including meals and lodging), clinic costs, and lab fees",
          "Lodging expenses (but not meals) while away from home to receive medical care"; p. 2, "Don''t deduct more than
          $50 a night for each person who meets the requirements in Pub. 502 under Lodging", "Limit on long-term care
          premiums you can include. The amount you can include for qualified long-term care insurance contracts (as defined
          in Pub. 502) depends on the age at the end of 2025 of the person for whom the premiums were paid", Line 1 Medical
          and Dental Expenses, "Enter the total of your medical and dental expenses after you reduce these expenses by any
          payments received from insurance or other sources", "If advance payments of the premium tax credit were made or
          you think you may be eligible to claim a premium tax credit, fill out Form 8962 before filling out Schedule A, line
          1", "self-employed health insurance deduction on Schedule 1 (Form 1040), line 17, reduce the premiums by the
          amount on line 17", "You can include medical and dental bills you paid in 2025 for anyone who was one of the
          following either when the services were provided or when you paid for them", "Your child whom you don''t claim as
          a dependent because of the rules for children of divorced or separated parents", "Any person you could have
          claimed as a dependent on your return except that person received $5,200 or more of gross income or filed a joint
          return", "You can''t deduct any premiums attributable to this individual unless this individual is a person
          described under Whose medical and dental expenses can you include, earlier", "However, if you had family coverage
          when you added this individual to your policy and your premiums didn''t increase, you can enter on line 1 the full
          amount of your medical and dental insurance premiums", "If you received a reimbursement in 2025 for prior year
          medical or dental expenses, don''t reduce your 2025 expenses by this amount", "don’t include on line 1 insurance
          premiums paid by an employer-sponsored health insurance plan (cafeteria plan) unless the premiums are included in
          box 1 of your Form(s) W-2", "Also, don''t include any other medical and dental expenses paid by the plan unless the
          amount paid is included in box 1 of your Form(s) W-2"; p502 p. 12, Premium Tax Credit, "You can’t include in
          medical expenses the amount of health insurance premiums paid by or through the premium tax credit", "You also
          can’t include in medical expenses any amount of advance payments of the premium tax credit made that you did not
          have to pay back", "However, any amount of advance payments of the premium tax credit that you did have to pay
          back can be included in medical expenses", "You are treated as paying $5,100 ($8,700 less the allowed premium tax
          credit of $3,600)"; i8962 p. 2, "You cannot deduct the portion of your health insurance premium on your tax return
          that is paid for by the PTC or APTC (after you determine how much of any excess APTC you must repay)"; p969 p. 9, "You can’t deduct qualified medical expenses as
          an itemized deduction on Schedule A (Form 1040) that are equal to the tax-free distribution from your HSA"; p969
          p. 13, "You can’t deduct qualified medical expenses as an itemized deduction on Schedule A (Form 1040) that are
          equal to the tax-free distribution from your Archer MSA"'
    - id: sa.line5a
      printed: 5a
      type: NonNegDollars
      label: State/local income taxes paid, including withholding; no sales-tax election
      expr:
        op: input
        source: |-
          State/local income taxes paid, including withholding; no sales-tax election.

          Include state and local income taxes withheld in 2025 (but not withholding you deducted on another form, such as Schedule C), estimated payments made in 2025 (including a prior-year refund credited to 2025), and taxes paid in 2025 for a prior year, but not penalties or interest.

          Include mandatory contributions to:
          - the California, New Jersey or New York Nonoccupational Disability Benefit Fund
          - the Rhode Island Temporary Disability Benefit Fund
          - the Washington State Supplemental Workmen's Compensation Fund
          - the Alaska, California, New Jersey or Pennsylvania state unemployment fund
          - state family leave programs (such as New Jersey Family Leave Insurance or California Paid Family Leave)

          Do not reduce the amount by a state or local income tax refund or credit you expect for 2025, or by a refund or credit of prior-year state and local income taxes received in 2025.

          If you made a cash charitable contribution in return for a state or local tax credit and reduced your charitable deduction by that credit, you may include here (or on line 5b or 5c, whichever tax the credit offsets) the part of the credit you applied to your 2025 or an earlier year's state or local tax liability.

          Include income taxes imposed by a U.S. territory here (not as foreign taxes), except territory taxes allocable to excluded income and territory taxes you take as a credit instead of a deduction.
      cite:
        doc: i1040sca
        locator: 'p. 3, U.S. territory taxes, "Include taxes imposed by a U.S. territory with your state and local taxes on
          lines 5a, 5b, and 5c", "However, don''t include any U.S. territory taxes you paid that are allocable to excluded
          income", "You may want to take a credit for U.S. territory tax instead of a deduction", Line 5a, "don''t include on
          line 5a any withheld taxes you deducted on other forms, such as Schedule C, E, or F", "State and local estimated tax
          payments made during 2025, including any part of a prior year refund that you chose to have credited to your 2025
          state or local income taxes", "State and local income taxes paid in 2025 for a prior year, such as taxes paid with
          your 2024 state or local income tax return. Don''t include penalties or interest.", "Mandatory contributions you
          made to the California, New Jersey, or New York Nonoccupational Disability Benefit Fund", "Mandatory contributions
          to the Alaska, California, New Jersey, or Pennsylvania state unemployment fund", "Mandatory contributions to state
          family leave programs", "Refund of or credit for prior year state and local income taxes you actually received in
          2025", Safe harbor for certain charitable contributions made in exchange for a state or local tax credit, "If you
          meet these conditions and to the extent you apply the state or local tax credit to this or a prior year''s state or
          local tax liability, you may include this amount on line 5a, 5b, or 5c, whichever is appropriate"; p. 7, Line 6,
          "Don''t include taxes you paid to a U.S. territory on this line; instead, include U.S. territory taxes on the
          appropriate state and local tax line"'
    - id: sa.line5b
      printed: 5b
      type: NonNegDollars
      label: Deductible state/local real estate taxes
      expr:
        op: input
        source: |-
          Deductible state/local real estate taxes on real estate you own that was not used for business, only if the taxes are assessed uniformly at a like rate on all real property in the community and used for general community or governmental purposes.

          Leave out:
          - foreign real estate taxes
          - itemized charges for services to specific property or persons (for example trash collection, water use or mowing charges)
          - charges for improvements that tend to increase the property's value (for example an assessment to build a new sidewalk), except a charge used only to maintain an existing public facility (for example to repair an existing sidewalk)

          If your mortgage payments include real estate taxes, include only what the mortgage company actually paid to the taxing authority in 2025.

          Reduce the amount by a 2025 refund or rebate of real estate taxes paid in 2025, and by real estate tax charged to the buyer if you sold your home in 2025 (settlement statement, Form 1099-S box 6); do not reduce it by a refund of taxes paid in an earlier year.

          Only taxes paid in 2025 and assessed before 2026 count (state or local law determines when a tax is assessed, generally when you become liable for it), so leave out a prepayment of 2026 property tax not assessed before 2026.

          Include real estate taxes imposed by a U.S. territory, except those allocable to excluded income.
      cite:
        doc: i1040sca
        locator: 'p. 3, U.S. territory taxes, "Include taxes imposed by a U.S. territory with your state and local taxes on
          lines 5a, 5b, and 5c", "However, don''t include any U.S. territory taxes you paid that are allocable to excluded
          income"; p. 6, Line 5b, "Only taxes paid in 2025 and assessed prior to 2026 can be deducted for 2025", "State or local
          law determines whether and when a property tax is assessed, which is generally when the taxpayer becomes liable
          for the property tax imposed", "Enter on line 5b the state and local taxes you paid on real estate you own that
          wasn''t used for business, but only if the taxes are assessed uniformly at a like rate on all real property
          throughout the community, and the proceeds are used for general community or governmental purposes", "Foreign
          taxes you paid on real estate", "Itemized charges for services to specific property or persons", "Charges for
          improvements that tend to increase the value of your property", "However, a charge is deductible if it is used
          only to maintain an existing public facility in service", "If your mortgage payments include your real estate
          taxes, you can include only the amount the mortgage company actually paid to the taxing authority in 2025", "any
          real estate tax charged to the buyer should be shown on your settlement statement and in box 6 of any Form 1099-S
          you received", "This amount is considered a refund of real estate taxes", "If you received a refund or rebate in
          2025 of real estate taxes you paid in 2025, reduce your deduction by the amount of the refund or rebate", "If you
          received a refund or rebate in 2025 of real estate taxes you paid in an earlier year, don''t reduce your deduction
          by this amount"'
    - id: sa.line5c
      printed: 5c
      type: NonNegDollars
      label: Deductible state/local personal property taxes
      expr:
        op: input
        source: 'Deductible state/local personal property taxes: only taxes based on value alone and imposed on a
          yearly basis (for a yearly car registration fee based partly on value, only the part based on value), paid
          in 2025 and assessed before 2026. Include personal property taxes imposed by a U.S. territory, except those
          allocable to excluded income.'
      cite:
        doc: i1040sca
        locator: 'p. 3, U.S. territory taxes, "Include taxes imposed by a U.S. territory with your state and local taxes on
          lines 5a, 5b, and 5c", "However, don''t include any U.S. territory taxes you paid that are allocable to excluded
          income"; p. 6, Line 5c, "Enter on line 5c the state and local personal property taxes you paid, but only if the
          taxes were based on value alone and were imposed on a yearly basis", "You can deduct only the part of the fee that
          was based on the car''s value"; p. 7, "Only taxes paid in 2025 and assessed prior to 2026 can be deducted for
          2025"'
    - id: sa.line8a
      printed: 8a
      type: NonNegDollars
      label: Eligible home mortgage interest and points on Form 1098, after confirming the debt/use limits
        do not apply
      expr:
        op: input
        source: Eligible home mortgage interest and points on Form 1098, after confirming the debt/use
          limits do not apply
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line11
      printed: (helper)
      type: NonNegDollars
      gated_by: sa.line11_if_gifts
      label: Deductible cash/check charitable gifts before income limits, after benefits received and
        required substantiation
      expr:
        op: input
        source: Deductible cash/check charitable gifts before income limits, after benefits received and
          required substantiation
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line11_if_gifts
      printed: "11"
      type: NonNegDollars
      label: Gifts by cash or check (zero when you and your spouse gave nothing to charity and have no carryover)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.gifts
                - const: true
            then: sa.line11
          - guard:
              op: test
              eq:
                - sa.gifts
                - const: false
            then: sa.zero
      cite:
        doc: f1040sa
        locator: p. 1, Gifts to Charity, line 11, "Gifts by cash or check"; i1040sca p. 10, Line 11, "Enter on line 11 the total value of gifts you made in cash or by check
          (including out-of-pocket expenses)"
    - id: sa.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.agi_floor
      printed: (helper)
      type: NonNegDollars
      label: Form 1040 line 11b adjusted gross income, but not less than zero
      expr:
        op: subtract_floor0
        from: sa.agi
        take: sa.zero
      cite:
        doc: i1040sca
        locator: 'p. 1, Medical and Dental Expenses, "You can deduct only the part of your medical and dental expenses that
          exceeds 7.5% of the amount of your adjusted gross income on Form 1040 or 1040-SR, line 11b"'
      ambiguity: amb.2025.sa_medical_negative_agi
    - id: sa.line2
      printed: "2"
      type: NonNegDollars
      label: Amount from sa.agi_floor
      expr:
        op: copy
        from: sa.agi_floor
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
      ambiguity: amb.2025.sa_medical_negative_agi
    - id: sa.line3
      printed: "3"
      type: NonNegDollars
      label: Multiply sa.line2 by sa.medical_rate
      expr:
        op: multiply_rate
        amount: sa.line2
        rate:
          param: sa.medical_rate
      cite:
        doc: f1040sa
        locator: p. 1, Medical and Dental Expenses, line 3, "Multiply line 2 by 7.5% (0.075)"
      ambiguity: amb.2025.multiplication_subcent
    - id: sa.line4
      printed: "4"
      type: NonNegDollars
      label: Subtract sa.line3 from sa.line1; if zero or less, enter zero
      expr:
        op: subtract_floor0
        from: sa.line1
        take: sa.line3
      cite:
        doc: f1040sa
        locator: p. 1, Medical and Dental Expenses, line 4, "Subtract line 3 from line 1. If line 3 is more than line
          1, enter -0-"
    - id: sa.line5d
      printed: 5d
      type: NonNegDollars
      label: Add sa.line5a, sa.line5b, sa.line5c
