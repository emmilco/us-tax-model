    - id: sa.line5a
      printed: (helper)
      type: NonNegDollars
      gated_by: sa.line5a_if_state_tax
      label: State and local income tax withheld from your (or, on a joint return, your spouse's) pay in 2025 (Form W-2, boxes 17 and 19)
      expr:
        op: input
        source: |-
          State and local income tax withheld from your (or, on a joint return, your spouse's) pay in 2025: boxes 17 and 19 of each Form W-2.

          Do not count withholding you deduct on another form, such as Schedule C, E or F.

          Do not count here state or local income tax paid any other way (tax withheld from other income such as a pension, estimated payments, tax paid for an earlier year, mandatory contributions to a state disability, unemployment or family leave fund, U.S. territory income tax, or a state or local tax credit received for a charitable contribution); that is the amount of state and local income tax paid other than tax withheld from pay, entered separately.

          Do not reduce the amount by a state or local income tax refund or credit you expect for 2025, or by a refund or credit of prior-year state and local income taxes received in 2025.
      cite:
        doc: i1040sca
        locator: 'p. 3, Line 5a, "State and local income taxes withheld from your salary during 2025. Your Form(s) W-2 will
          show these amounts", "don''t include on line 5a any withheld taxes you deducted on other forms, such as Schedule C,
          E, or F", "State or local income tax refund or credit you expect to receive for 2025", "Refund of or credit for
          prior year state and local income taxes you actually received in 2025"; fw2 p. 4, Copy B, "17 State income tax",
          "19 Local income tax"'
    - id: sa.line5a_if_state_tax
      printed: (helper)
      type: NonNegDollars
      label: State and local income taxes withheld from pay (zero when none was withheld)
      expr:
        op: choose
        alternatives:
