    - id: sa.line11
      printed: (helper)
      type: NonNegDollars
      gated_by: sa.line11_if_gifts
      label: Gifts to charity in cash or by check, card or payroll deduction, including out-of-pocket volunteer costs, less
        the value of benefits received and the amounts that can't be deducted
      expr:
        op: input
        source: |-
          Gifts you (or, on a joint return, your spouse) made to charity in 2025 in money (cash, check, card or payroll deduction), including out-of-pocket costs of volunteer work (the actual cost of gas and oil or 14 cents a mile, plus parking and tolls).

          Count only what you paid above the value of any benefit you received in return, and only gifts for which you keep a bank record or a written record from the charity (and, for a gift of $250 or more, the charity's written acknowledgment). Membership benefits received for an annual payment of $75 or less, and an item of token value that the charity says need not be subtracted, are not subtracted.

          Leave out: the part of a gift for which you received or expect a state or local tax credit, unless the credit is not more than 15% of the gift; political contributions; raffle, bingo or lottery tickets; tuition; dues to clubs, lodges or similar groups; payments for the right to buy college athletic tickets; gifts to individuals or to groups run for profit or to lobby; gifts to foreign organizations (a gift to a U.S. organization that transfers funds to a foreign charity is not left out); travel away from home with a significant element of personal pleasure; the value of your time; and amounts repaid to you.
      cite:
        doc: i1040sca
        locator: 'p. 9, Amounts You Can Deduct, "Contributions can be in cash, property, or out-of-pocket expenses you paid to
          do volunteer work", "14 cents a mile", "But don''t deduct any amounts that were repaid to you", Gifts from which you
          benefit, "you can generally only deduct the amount that is more than the value of the benefit. But this rule doesn''t
          apply to certain membership benefits provided in return for an annual payment of $75 or less or to certain items or
          benefits of token value", Gifts of $250 or more; p526 p. 5, State or local tax credit, "the amount treated as a charitable contribution deduction is reduced by the amount of the state or local tax credit you receive or expect to receive", Exception, "If the state or local tax credit you receive or expect to receive doesn’t exceed 15% of your payment amount or 15% of the FMV of the transferred property, then your charitable contribution deduction isn’t reduced"; p526 p. 5, Membership fees or dues, "Both you and the organization
          can disregard the following membership benefits if you get them in return for an annual payment of $75 or less";
          p526 p. 6, Token items, "You don’t have to reduce your contribution by the value of any benefit you receive if both
          of the following are true"; p. 10, Amounts You Can''t Deduct, "Political contributions", "Cost of raffle, bingo, or lottery tickets",
          "Cost of tuition", "Value of your time or services", "Gifts to foreign organizations. However, you may be able to
          deduct gifts to certain U.S. organizations that transfer funds to foreign charities"; Line 11, "Enter on line 11 the total value of gifts you made in
          cash or by check (including out-of-pocket expenses)", Recordkeeping, "you must maintain as a record of the
          contribution a bank record (such as a canceled check or credit card statement) or a written record from the
          charity"'
