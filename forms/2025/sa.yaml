form:
  id: sa
  kind: form
  title: Schedule A — supported itemized deductions and standard comparison
  tax_year: 2025
  note: Income and deduction eligibility are explicit supplied facts. Charity valuation and
    substantiation are not computed; an affirmative limitation answer is refused, and so is an itemized
    return whose gifts an income limit reduces whatever the charity (more than 60% of AGI in all, or noncash
    gifts, all taken as capital gain property, more than 30%). Line 5b adds the real estate taxes of reported rentals not taken on Schedule E. The SALT
    formula follows the printed 2025 worksheet, including its MFS halving step.
  lines:
    - id: sa.unsupported
      printed: (helper)
      type: Bool
      label: 'A Schedule A item this tool does not compute: mortgage interest or points not on Form 1098 or subject to the debt or use limits; the sales-tax election; a foreign tax deduction, foreign tax not allowed as a credit, or generation-skipping tax on a trust distribution (line 6); or a deduction from the Schedule A line 16 list other than gambling losses'
      expr:
        op: test
        any:
          - op: test
            eq:
              - sa.mortgage_unreported_if_home
              - const: true
          - op: test
            eq:
              - sa.mortgage_over_limit_if_interest
              - const: true
          - op: test
            eq:
              - sa.mortgage_other_use_if_interest
              - const: true
          - op: test
            eq:
              - sa.sales_tax_wish
              - const: true
          - op: test
            eq:
              - sa.foreign_tax_deduct_if_tax
              - const: true
          - op: test
            eq:
              - sa.estate_tax_income
              - const: true
          - op: test
            eq:
              - sa.bond_premium
              - const: true
          - op: test
            eq:
              - sa.debt_instrument_loss
              - const: true
          - op: test
            eq:
              - sa.pension_unrecovered
              - const: true
          - op: test
            eq:
              - sa.impairment_work
              - const: true
          - op: test
            eq:
              - sa.gst_paid
              - const: true
          - op: test
            eq:
              - sa.foreign_tax_noncreditable
              - const: true
      cite:
        doc: i1040sca
        locator: 'p. 8, Limits on home mortgage interest, "Your deduction for home mortgage interest is subject to a number of limits"; p. 8, Line 8b, "If you paid home mortgage interest to a recipient who didn’t provide you a Form 1098, report your deductible mortgage interest on line 8b"; p. 3, Line 5a, "You can elect to deduct state and local general sales taxes instead of state and local income taxes"; p. 7, Line 6, "Include on this line income taxes you paid to a foreign country and generation-skipping tax (GST) imposed on certain income distributions"; p514 p. 3, Exceptions for foreign taxes not allowed as a credit, "you can deduct any foreign tax that is not allowed as a credit"; pp. 11–12, Other Itemized Deductions, "Only the expenses listed next can be deducted on line 16"'
    - id: sa.gifts
      printed: (helper)
      type: Bool
      label: |-
        Did you or your spouse make any charitable contribution in 2025? Answer Yes if any of these applies:

        - money given to a charity by cash, check, card or payroll deduction, including money put into a donor-advised fund
        - a payment to a charity that got you something back (such as a fundraising dinner, an auction item or a membership), or that earned you a state or local tax credit
        - property given to a charity, such as clothing, household items, a vehicle or stock, or property sold to a charity for less than its value
        - out-of-pocket costs of volunteer work for a charity, such as mileage, parking, supplies or uniforms, or unreimbursed costs of hosting a student or a foster child placed by a charitable organization
        - a charitable contribution shown on a Schedule K-1 from a partnership, S corporation, estate or trust
        - expenses you paid as a whaling captain for Native Alaskan subsistence bowhead whale hunting

        A charity here is any organization that is religious, charitable, educational, scientific or literary in purpose (such as a church, a school, a nonprofit hospital, a veterans' group or a fraternal order's charitable work), one that works to prevent cruelty to children or animals, or a federal, state, local or Indian tribal government receiving a gift for public purposes; nonprofit cemetery companies and other qualified organizations count too.
      expr:
        op: input
        source: |-
          Did you or your spouse make any charitable contribution in 2025? Answer Yes if any of these applies:

          - money given to a charity by cash, check, card or payroll deduction, including money put into a donor-advised fund
          - a payment to a charity that got you something back (such as a fundraising dinner, an auction item or a membership), or that earned you a state or local tax credit
          - property given to a charity, such as clothing, household items, a vehicle or stock, or property sold to a charity for less than its value
          - out-of-pocket costs of volunteer work for a charity, such as mileage, parking, supplies or uniforms, or unreimbursed costs of hosting a student or a foster child placed by a charitable organization
          - a charitable contribution shown on a Schedule K-1 from a partnership, S corporation, estate or trust
          - expenses you paid as a whaling captain for Native Alaskan subsistence bowhead whale hunting

          A charity here is any organization that is religious, charitable, educational, scientific or literary in purpose (such as a church, a school, a nonprofit hospital, a veterans' group or a fraternal order's charitable work), one that works to prevent cruelty to children or animals, or a federal, state, local or Indian tribal government receiving a gift for public purposes; nonprofit cemetery companies and other qualified organizations count too.
      cite:
        doc: i1040sca
        locator: p. 9, Gifts to Charity, "You can deduct contributions or gifts you gave to organizations that are
          religious, charitable, educational, scientific, or literary in purpose", "Certain whaling captains may be able to
          deduct expenses paid in 2025 for Native Alaskan subsistence bowhead whale hunting activities" and "Federal,
          state, and local governments if the gifts are solely for public purposes"; p. 9, Gifts from which you benefit,
          "If you made a gift and received a benefit in return"; p. 9, Amounts You Can Deduct,
          "Contributions can be in cash, property, or out-of-pocket expenses you paid to do volunteer work"; p. 11, Line
          13, "You may have contributions that you couldn't deduct in an earlier year because they exceeded the limits on
          the amount you could deduct"
    - id: sa.no
      printed: (helper)
      type: Bool
      label: Year parameter sa.no (no)
      expr:
        op: param
        ref: sa.no
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.charity_limited
      printed: (helper)
      type: Bool
      gated_by: sa.charity_limited_if_gifts
      label: Are any of the 2025 charitable deductions reduced by income limits? Determine under Publication 526 before
        answering.
      expr:
        op: input
        source: Are any of the 2025 charitable deductions reduced by income limits? Determine under Publication 526 before
          answering.
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.charity_limited_if_gifts
      printed: (helper)
      type: Bool
      label: The 2025 charitable deductions are reduced by income limits (no when you and your spouse gave nothing to
        charity in 2025)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.gifts
                - const: true
            then: sa.charity_limited
          - guard:
              op: test
              eq:
                - sa.gifts
                - const: false
            then: sa.no
      cite:
        doc: i1040sca
        locator: p. 10, Limit on the amount you can deduct, "See Pub. 526 to figure the amount of your deduction if
          any of the following applies"; p. 11, Line 13, "You may have contributions that you couldn't deduct in an
          earlier year because they exceeded the limits on the amount you could deduct"
    - id: sa.gift_carryover
      printed: (helper)
      type: Bool
      label: 'Do you (or, on a joint return, your spouse) have a charitable contribution carried over from an earlier year, one that was more than you could deduct in the year you made it?'
      expr:
        op: input
        source: 'Do you (or, on a joint return, your spouse) have a charitable contribution carried over from an earlier year, one that was more than you could deduct in the year you made it?'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.gift_carryover_if_no_gifts
      printed: (gate)
      type: Bool
      label: A charitable contribution is carried over from an earlier year (asked of every filer, whether or not they gave in 2025)
      expr:
        op: copy
        from: sa.gift_carryover
      cite:
        doc: i1040sca
        locator: 'p. 11, Line 13, "You may have contributions that you couldn''t deduct in an earlier year because they exceeded the limits on the amount you could deduct"'
    - id: sa.excluded_income
      printed: (helper)
      type: Bool
      label: 'Do you (or, on a joint return, your spouse) file Form 2555 or Form 4563, or exclude income from sources within Puerto Rico?'
      expr:
        op: input
        source: 'Do you (or, on a joint return, your spouse) file Form 2555 or Form 4563, or exclude income from sources within Puerto Rico?'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.dependent
      printed: (helper)
      type: Bool
      label: 'Can someone claim you or your spouse as a dependent for 2025? (Answer no if the person who could claim you is not required to file and does not file, or files only to claim a refund of withheld or estimated tax.)'
      expr:
        op: input
        source: 'Can someone claim you or your spouse as a dependent for 2025? (Answer no if the person who could claim you is not required to file and does not file, or files only to claim a refund of withheld or estimated tax.)'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.spouse_extra
      printed: (helper)
      type: Bool
      gated_by: sa.mfs_spouse_extra
      label: Married filing separately and claiming age or blindness boxes for your spouse (who had no income, isn't filing a return and can't be claimed as a dependent)?
      expr:
        op: input
        source: Married filing separately and claiming age or blindness boxes for your spouse (who had no income, isn't filing a return and can't be claimed as a dependent)?
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "you can check the appropriate box(es) on line 12d if your spouse had no income, isn't filing
          a return, and can't be claimed as a dependent on another person's return"; p. 34, Exception 2—Spouse itemizes on a
          separate return, "your standard deduction is zero, even if you were born before January 2, 1961, or were blind"
    - id: sa.mfs_spouse_extra
      printed: (gate)
      type: Bool
      label: Married filing separately and claiming age or blindness boxes for your spouse (asked only when the spouse is
        not itemizing on a separate return; otherwise no)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - sa.mfs_spouse_not_itemizing
            - const: true
          then: sa.spouse_extra
        - guard:
            op: test
            eq:
            - sa.mfs_spouse_not_itemizing
            - const: false
          then: sa.no
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "If your filing status is married filing separately and your spouse was born before
          January 2, 1961, or was blind at the end of 2025, you can check the appropriate box(es) on line 12d if your
          spouse had no income, isn't filing a return, and can't be claimed as a dependent on another person's return";
          p. 34, Exception 2—Spouse itemizes on a separate return, "your standard deduction is zero, even if you were born
          before January 2, 1961, or were blind"
    - id: sa.mfs_spouse_not_itemizing
      printed: (helper)
      type: Bool
      label: Married filing separately with a spouse who is not itemizing deductions on a separate return
      expr:
        op: test
        all:
        - op: test
          eq:
          - sa.mfs
          - const: true
        - op: test
          eq:
          - sa.mfs_spouse_itemizes
          - const: false
      cite:
        doc: i1040gi
        locator: p. 34, Exception 2—Spouse itemizes on a separate return, "your standard deduction is zero, even if you were born
          before January 2, 1961, or were blind"
    - id: sa.age65_count
      printed: (helper)
      label: Your entry, if the answer is yes
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.role
            - const: taxpayer
          - op: test
            eq:
            - person.age65
            - const: true
      cite:
        doc: f1040sa
        locator: i1040gi p. 35, Standard Deduction Chart for People Who Were Born Before January 2, 1961, or Were
          Blind, "You were born before January 2, 1961", "Enter the total number of boxes checked"
    - id: sa.age65
      printed: (helper)
      label: Were you born before January 2, 1961?
      type: Bool
      expr:
        op: test
        gt:
        - sa.age65_count
        - const: 0
          type: Count
      cite:
        doc: f1040sa
        locator: i1040gi p. 35, Standard Deduction Chart for People Who Were Born Before January 2, 1961, or Were
          Blind, "You were born before January 2, 1961", "Enter the total number of boxes checked"
    - id: sa.spouse_itemizes
      printed: (helper)
      type: Bool
      gated_by: sa.mfs_spouse_itemizes
      label: Is your husband or wife itemizing deductions on their own 2025 return, instead of taking the standard deduction?
      expr:
        op: input
        source: Is your husband or wife itemizing deductions on their own 2025 return, instead of taking the standard deduction?
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12b, "If your filing status is married filing separately and your spouse itemizes deductions
          on their return, check the box on line 12b"; p. 14, Married Filing Separately, "You also can’t take the standard
          deduction if your spouse itemizes deductions"; p. 34, Exception 2—Spouse itemizes on a separate return, "If you
          checked the box on line 12b, your standard deduction is zero"'
      ambiguity: amb.2025.sa_mfs_spouse_itemizes
    - id: sa.elect_itemize
      printed: (helper)
      type: Bool
      label: Elect to itemize even if the standard deduction is larger?
      expr:
        op: input
        source: Elect to itemize even if the standard deduction is larger?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.agi
      printed: (helper)
      type: Dollars
      label: Form 1040 line 11b adjusted gross income
      expr:
        op: copy
        from: f1040.line11b
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.medical_any
      printed: (helper)
      type: Bool
      label: 'In 2025, were the medical and dental costs you (or, on a joint return, your spouse) paid yourselves, after anything insurance paid, more than 7.5% of your adjusted gross income (your income after adjustments such as IRA or HSA deductions)?'
      expr:
        op: input
        source: 'In 2025, were the medical and dental costs you (or, on a joint return, your spouse) paid yourselves, after anything insurance paid, more than 7.5% of your adjusted gross income (your income after adjustments such as IRA or HSA deductions)?'
      cite:
        doc: i1040sca
        locator: 'p. 1, Medical and Dental Expenses, "You can deduct only the part of your medical and dental expenses that exceeds 7.5% of the amount of your adjusted gross income on Form 1040 or 1040-SR, line 11b"'
    - id: sa.medical_premiums
      printed: (helper)
      type: Bool
      label: 'In 2025, did you (or, on a joint return, your spouse) pay for health insurance with money that had already been taxed, such as Medicare premiums, a Marketplace plan, COBRA or long-term care insurance, rather than through a deduction from pay at a job?'
      expr:
        op: input
        source: 'In 2025, did you (or, on a joint return, your spouse) pay for health insurance with money that had already been taxed, such as Medicare premiums, a Marketplace plan, COBRA or long-term care insurance, rather than through a deduction from pay at a job?'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.medical_premiums_if_not_large
      printed: (gate)
      type: Bool
      label: Paid for health insurance with money already taxed (asked only when medical and dental costs were not said to be more than 7.5% of income)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.medical_any
                - const: false
            then: sa.medical_premiums
          - guard:
              op: test
              eq:
                - sa.medical_any
                - const: true
            then: sa.no
      cite:
        doc: i1040sca
        locator: 'p. 1, Medical and Dental Expenses, "Insurance premiums for medical and dental care", "You can''t include insurance premiums paid by making a pretax reduction to your employee compensation"'
    - id: sa.medical_asked
      printed: (helper)
      type: Bool
      label: Medical and dental costs are asked (they were more than 7.5% of income, health insurance was paid for with money already taxed, or an exception 05 to the additional tax on an early retirement distribution is claimed)
      expr:
        op: test
        any:
          - op: test
            eq:
              - sa.medical_any
              - const: true
          - op: test
            eq:
              - sa.medical_premiums_if_not_large
              - const: true
          - op: test
            eq:
              - sa.e05_claimed
              - const: true
      cite:
        doc: i1040sca
        locator: 'p. 1, Medical and Dental Expenses, "You can deduct only the part of your medical and dental expenses that exceeds 7.5% of the amount of your adjusted gross income", "You can''t include insurance premiums paid by making a pretax reduction to your employee compensation"'
    - id: sa.e05_claimed
      printed: (helper)
      type: Bool
      label: Someone on the return claims the medical-expense exception (05) to the additional tax on an early retirement distribution, which is limited to the medical expenses above 7.5% of AGI whether or not deductions are itemized
      expr:
        op: test
        gt:
          - sa.e05_amounts
          - const: 0
      cite:
        doc: i5329
        locator: 'p. 5, Line 2, exception 05, "Qualified retirement plan distributions up to the amount you paid for unreimbursed medical expenses during the year minus 7.5% of your adjusted gross income (AGI) for the year."'
    - id: sa.e05_amounts
      printed: (helper)
      type: NonNegDollars
      label: Exception 05 amounts claimed by everyone on the return, before the limit to the medical expenses
      expr:
        op: sum_over
        collection: person
        field: person.x_e05
      cite:
        doc: i5329
        locator: 'p. 5, Line 2, exception 05, "Qualified retirement plan distributions up to the amount you paid for unreimbursed medical expenses during the year minus 7.5% of your adjusted gross income (AGI) for the year."'
    - id: sa.line1
      printed: (helper)
      type: NonNegDollars
      gated_by: sa.line1_if_medical
      label: Unreimbursed eligible medical and dental expenses
      expr:
        op: input
        source: |-
          Unreimbursed eligible medical and dental expenses paid in 2025 (Pub. 502 lists what counts) for these people:

          - yourself
          - your spouse
          - your dependents
          - your child whom you do not claim only because of the rules for children of divorced or separated parents
          - anyone you could have claimed as a dependent except that the person had gross income of $5,200 or more or filed a joint return, or that you (or your spouse, if filing jointly) can be claimed as a dependent on someone else's 2025 return

          Reduce them by payments from insurance or other sources, but do not reduce them by a 2025 reimbursement of expenses paid in an earlier year.

          Leave out:
          - amounts equal to tax-free distributions from a health savings account (HSA) or an Archer MSA
          - insurance premiums paid by a pretax reduction of your pay, and premiums and other medical and dental expenses paid by an employer-sponsored health plan (cafeteria plan) unless they are included in box 1 of your Form W-2
          - premiums for someone on your policy who is not one of the people listed above (for example a nondependent child under age 27), unless you had family coverage when you added that person and your premiums did not increase
          - if you are a retired public safety officer, premiums to the extent paid with a tax-free distribution from your retirement plan
          - the housework part of pay to someone who did both nursing and housework (only the nursing help counts)
          - meals while away from home for medical care, other than hospital care, which includes its meals and lodging (other lodging for medical care counts at no more than $50 a night for each person who meets the Pub. 502 lodging requirements)

          Leave out health insurance entered for a business's self-employed health insurance deduction (Form 7206, lines 1 and 2); the part of it not deducted on Schedule 1 (Form 1040), line 17 is added to line 1 separately.

          For Marketplace coverage on a Form 1095-A, include the total premiums (including the part paid by advance payments of the premium tax credit), minus the premium tax credit allowed on Form 8962, line 24, and minus any excess advance payments you do not have to repay because of the repayment limit (Form 8962, line 27 minus line 29); advance payments you do repay count as premiums you paid.

          Include qualified long-term care insurance premiums only up to the limit for the age at the end of 2025 of the person for whom they were paid:

          - $480 if 40 or under
          - $900 if 41 to 50
          - $1,800 if 51 to 60
          - $4,810 if 61 to 70
          - $6,020 if 71 or older

          On the final return of a person who died in 2025, include the medical expenses paid out of that person's estate that Pub. 502 allows on the final return.
      cite:
        doc: i1040sca
        locator: 'p. 1, Medical and Dental Expenses, "If you received a distribution from a health savings account or a
          medical savings account in 2025, see Pub. 969 to figure your deduction", "Certain medical expenses paid out of a
          deceased taxpayer''s estate can be claimed on the deceased taxpayer''s final return", "You can''t include
          insurance premiums paid by making a pretax reduction to your employee compensation", "If you are a retired public
          safety officer, you can''t include any premiums you paid to the extent they were paid for with a tax-free
          distribution from your retirement plan", "If you paid someone to do both nursing and housework, you can deduct
          only the cost of the nursing help", "Hospital care (including meals and lodging), clinic costs, and lab fees",
          "Lodging expenses (but not meals) while away from home to receive medical care"; p. 2, "Don''t deduct more than
          $50 a night for each person who meets the requirements in Pub. 502 under Lodging", "Limit on long-term care
          premiums you can include. The amount you can include for qualified long-term care insurance contracts (as defined
          in Pub. 502) depends on the age at the end of 2025 of the person for whom the premiums were paid", Line 1 Medical
          and Dental Expenses, "Enter the total of your medical and dental expenses after you reduce these expenses by any
          payments received from insurance or other sources", "If advance payments of the premium tax credit were made or
          you think you may be eligible to claim a premium tax credit, fill out Form 8962 before filling out Schedule A, line
          1", "self-employed health insurance deduction on Schedule 1 (Form 1040), line 17, reduce the premiums by the
          amount on line 17", "You can include medical and dental bills you paid in 2025 for anyone who was one of the
          following either when the services were provided or when you paid for them", "Your child whom you don''t claim as
          a dependent because of the rules for children of divorced or separated parents", "Any person you could have
          claimed as a dependent on your return except that person received $5,200 or more of gross income or filed a joint
          return", "You can''t deduct any premiums attributable to this individual unless this individual is a person
          described under Whose medical and dental expenses can you include, earlier", "However, if you had family coverage
          when you added this individual to your policy and your premiums didn''t increase, you can enter on line 1 the full
          amount of your medical and dental insurance premiums", "If you received a reimbursement in 2025 for prior year
          medical or dental expenses, don''t reduce your 2025 expenses by this amount", "don’t include on line 1 insurance
          premiums paid by an employer-sponsored health insurance plan (cafeteria plan) unless the premiums are included in
          box 1 of your Form(s) W-2", "Also, don''t include any other medical and dental expenses paid by the plan unless the
          amount paid is included in box 1 of your Form(s) W-2"; p502 p. 12, Premium Tax Credit, "You can’t include in
          medical expenses the amount of health insurance premiums paid by or through the premium tax credit", "You also
          can’t include in medical expenses any amount of advance payments of the premium tax credit made that you did not
          have to pay back", "However, any amount of advance payments of the premium tax credit that you did have to pay
          back can be included in medical expenses", "You are treated as paying $5,100 ($8,700 less the allowed premium tax
          credit of $3,600)"; i8962 p. 2, "You cannot deduct the portion of your health insurance premium on your tax return
          that is paid for by the PTC or APTC (after you determine how much of any excess APTC you must repay)"; p969 p. 9, "You can’t deduct qualified medical expenses as
          an itemized deduction on Schedule A (Form 1040) that are equal to the tax-free distribution from your HSA"; p969
          p. 13, "You can’t deduct qualified medical expenses as an itemized deduction on Schedule A (Form 1040) that are
          equal to the tax-free distribution from your Archer MSA"'
    - id: sa.line1_if_medical
      printed: (gate)
      type: NonNegDollars
      label: Medical and dental expenses (zero when your costs were not more than 7.5% of income and you paid for no health insurance with money already taxed)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.medical_asked
                - const: true
            then: sa.line1
          - guard:
              op: test
              eq:
                - sa.medical_asked
                - const: false
            then: sa.zero
      cite:
        doc: i1040sca
        locator: 'p. 1, Medical and Dental Expenses, "If you received a distribution from a health savings account or a medical savings account in 2025, see Pub. 969 to figure your deduction", "Certain medical expenses paid out of a deceased taxpayer''s estate can be claimed on the deceased taxpayer''s final return", "You can''t include insurance premiums paid by making a pretax reduction to your employee compensation", "If you are a retired public safety officer, you can''t include any premiums you paid to the extent they were paid for with a tax-free distribution from your retirement plan", "If you paid someone to do both nursing and housework, you can deduct only the cost of the nursing help", "Hospital care (including meals and lodging), clinic costs, and lab fees", "Lodging expenses (but not meals) while away from home to receive medical care"; p. 2, "Don''t deduct more than $50 a night for each person who meets the requirements in Pub. 502 under Lodging", "Limit on long-term care premiums you can include. The amount you can include for qualified long-term care insurance contracts (as defined in Pub. 502) depends on the age at the end of 2025 of the person for whom the premiums were paid", Line 1 Medical and Dental Expenses, "Enter the total of your medical and dental expenses after you reduce these expenses by any payments received from insurance or other sources", "If advance payments of the premium tax credit were made or you think you may be eligible to claim a premium tax credit, fill out Form 8962 before filling out Schedule A, line 1", "self-employed health insurance deduction on Schedule 1 (Form 1040), line 17, reduce the premiums by the amount on line 17", "You can include medical and dental bills you paid in 2025 for anyone who was one of the following either when the services were provided or when you paid for them", "Your child whom you don''t claim as a dependent because of the rules for children of divorced or separated parents", "Any person you c