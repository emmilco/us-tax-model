    - id: sa.saltremaining
      printed: (helper)
      type: NonNegDollars
      label: Subtract sa.saltreduction from sa.saltbase; if zero or less, enter zero
      expr:
        op: subtract_floor0
        from: sa.saltbase
        take: sa.saltreduction
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.saltfloor_applied
      printed: (helper)
      type: NonNegDollars
      label: Larger of remaining ceiling and $10,000
      expr:
        op: larger_of
        of:
          - sa.saltremaining
          - sa.saltfloor
      cite:
        doc: i1040sca
        locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.salthalf
      printed: (helper)
      type: NonNegDollars
      label: Multiply sa.saltfloor_applied by sa.half
      expr:
        op: multiply_rate
        amount: sa.saltfloor_applied
        rate:
          param: sa.half
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
      ambiguity: amb.2025.multiplication_subcent
    - id: sa.mfs
      printed: (helper)
      type: Bool
      label: Married filing separately
      expr:
        op: test
        eq:
          - f1040.status
          - const: mfs
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.saltlimit
      printed: (helper)
      type: NonNegDollars
      label: Half the worksheet ceiling if married filing separately
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.mfs
                - const: true
            then: sa.salthalf
          - guard:
              op: test
              eq:
                - sa.mfs
                - const: false
            then: sa.saltfloor_applied
      cite:
        doc: i1040sca
        locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.line5e
      printed: 5e
      type: NonNegDollars
      label: Smaller of sa.line5d, sa.saltlimit
