        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, "Generally, your earned income is the total
          of the amount(s) you reported on Form 1040 or 1040-SR, line 1z, and Schedule 1, lines 3, 6, 8r, 8t, and 8u minus
          the amount, if any, on Schedule 1, line 15"; p501 p. 26, Table 8, line 1, "Enter your earned income (defined
          below). If none, enter -0-."'
      ambiguity: amb.2025.sa_dep_earned
    - id: sa.dep_add
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sa.dep_add ($450)
      expr:
        op: param
        ref: sa.dep_add
      cite:
        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 2, "Yes. Add $450 to your earned income.
          Enter the total"'
    - id: sa.dep_plus
      printed: (helper)
      type: NonNegDollars
      label: Earned income plus $450
      expr:
        op: sum
        of:
          - sa.dep_earned
          - sa.dep_add
      cite:
        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 2, "Yes. Add $450 to your earned income.
          Enter the total"'
    - id: sa.dep_min
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sa.dep_min ($1,350)
      expr:
        op: param
        ref: sa.dep_min
      cite:
        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 2, "No. Enter $1,350"'
    - id: sa.dep_line2
      printed: '2'
      type: NonNegDollars
      label: 'Is your earned income more than $900? Yes: add $450 to your earned income and enter the total. No: enter $1,350'
      expr:
        op: larger_of
        of:
          - sa.dep_plus
          - sa.dep_min
      cite:
        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 2, "Is your earned income* more than
          $900?", "Yes. Add $450 to your earned income. Enter the total", "No. Enter $1,350"; p501 p. 24, Standard Deduction
          for Dependents, "generally limited to the greater of: 1. $1,350, or 2. The individual''s earned income for the year
          plus $450"'
    - id: sa.dep_line3
      printed: '3'
      type: NonNegDollars
      label: 'Enter the amount shown for your filing status: single or married filing separately, $15,750; married filing
        jointly, $31,500; head of household, $23,625'
      expr:
        op: copy
        from: sa.standardbase
      cite:
        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 3, "Enter the amount shown below for your
          filing status"'
    - id: sa.dep_line4a
      printed: 4a
      type: NonNegDollars
      label: Enter the smaller of line 2 or line 3
      expr:
        op: smaller_of
        of:
          - sa.dep_line2
          - sa.dep_line3
      cite:
        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 4a, "Enter the smaller of line 2 or line
          3"'
    - id: sa.dep_line4b
      printed: 4b
      type: NonNegDollars
      label: If born before January 2, 1961, or blind, multiply the number on line 1 by $1,600 ($2,000 if single or head of
        household)
      expr:
        op: sum
        of:
          - sa.extra_age65
          - sa.extra_blind
      cite:
        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 4b, "If born before January 2, 1961, or
          blind, multiply the number on line 1 by $1,600 ($2,000 if single or head of household)"'
    - id: sa.dep_line4c
      printed: 4c
      type: NonNegDollars
      label: Add lines 4a and 4b. Enter the total here and on Form 1040 or 1040-SR, line 12e
      expr:
        op: sum
        of:
          - sa.dep_line4a
          - sa.dep_line4b
      cite:
        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 4c, "Add lines 4a and 4b. Enter the total
          here and on Form 1040 or 1040-SR, line 12e"'
    - id: sa.dep_qss
      printed: (gate)
      type: Bool
      label: Someone can claim you as a dependent and your filing status is qualifying surviving spouse
      expr:
        op: test
        all:
          - op: test
            eq:
              - sa.dependent
              - const: true
          - op: test
            eq:
              - f1040.status
              - const: qss
      cite:
        doc: i1040gi
        locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 3, "Enter the amount shown below for your
          filing status"'
      ambiguity: amb.2025.sa_dep_qss
    - id: sa.standard_amount
      printed: (helper)
      type: NonNegDollars
      label: Standard deduction before a spouse's itemizing on a separate return is applied (the Standard Deduction Worksheet
        for Dependents when someone can claim you, or your spouse if filing jointly, as a dependent)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.dependent
                - const: true
            then: sa.dep_line4c
          - guard:
              op: test
              eq:
                - sa.dependent
                - const: false
            then: sa.standardraw
      cite:
        doc: i1040gi
        locator: 'p. 34, Line 12e, "Exception 1—Dependent. Line 12a. If you checked a box on line 12a, use the Standard
          Deduction Worksheet for Dependents to figure your standard deduction"'
    - id: sa.standard
      printed: (helper)
      type: NonNegDollars
      label: Standard deduction, zero when MFS spouse itemizes
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.mfs_spouse_itemizes
                - const: true
            then: sa.zero
          - guard:
              op: test
              eq:
                - sa.mfs_spouse_itemizes
                - const: false
            then: sa.standard_amount
      cite:
        doc: i1040gi
        locator: pp. 34–35, line 12e and Standard Deduction Chart
      refuses:
        - when: sa.dep_qss
          form: Standard Deduction Worksheet for Dependents, line 3, for a qualifying surviving spouse
          remedy: The Standard Deduction Worksheet for Dependents gives no amount for a qualifying surviving spouse whom
            someone else can claim as a dependent, so this tool does not figure that standard deduction.
          cite:
            doc: i1040gi
            locator: 'p. 35, Standard Deduction Worksheet for Dependents—Line 12e, line 3, "Enter the amount shown below for
              your filing status"'
        - when: sa.mfs_spouse_extra
          form: Standard Deduction Chart spouse boxes on a separate return
          remedy: Checking age or blindness boxes for your spouse on a married filing separately return is outside
            this tool.
          cite:
            doc: i1040gi
            locator: pp. 34–35, line 12e and Standard Deduction Chart
    - id: sa.itemizes
      printed: (helper)
      type: Bool
      label: Itemize if elected, required, or itemized total exceeds standard
      expr:
        op: test
        any:
          - op: test
            eq:
              - sa.elect_itemize
              - const: true
          - op: test
            eq:
              - sa.mfs_spouse_itemizes
              - const: true
          - op: test
            gt:
              - sa.total_itemized
              - sa.standard
      cite:
        doc: f1040sa
        locator: p. 1, Total Itemized Deductions, line 18, "If you elect to itemize deductions even though they are
          less than your standard deduction, check this box"; i1040gi p. 34, Line 12e Standard Deduction or Itemized
          Deductions, "In most cases, your federal income tax will be less if you take the larger of your standard
          deduction or itemized deductions", "If you checked the box on line 12b, your standard deduction is zero"
    - id: sa.deduction
      printed: (helper)
      type: NonNegDollars
      label: Deduction selected for Form 1040 line 12e
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: true
            then: sa.total_itemized
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: false
            then: sa.standard
      cite:
        doc: i1040gi
        locator: pp. 34–35, line 12e and Standard Deduction Chart
      refuses:
        - when: sa.mfs_joint_paid_if_itemizing
          form: Schedule A on a separate return, expenses paid jointly with the spouse (Pub. 504, Table 1)
          remedy: On a married filing separately return, itemized deductions paid from money held with your spouse, or
            state income tax on a joint state return, are divided between you under Pub. 504; that is outside this tool.
          cite:
            doc: i1040sca
            locator: 'p. 1, "If you and your spouse paid expenses jointly and are filing separate returns for 2025, see Pub.
              504 to figure the portion of joint expenses that you can claim as itemized deductions"'
        - when: sa.charity_over_if_itemizing
          form: Schedule A charitable limitation (Pub. 526)
          remedy: Gifts to charity this large compared with your income are limited, and the deduction and the carryover are
            figured under Pub. 526, which this tool does not do.
          cite:
            doc: p526
            locator: 'p. 22, Limits on Deductions, "The amount you can deduct for charitable contributions is generally limited
              to no more than 60% of your AGI"; p. 25, "Your noncash contributions of capital gain property to 50% limit
              organizations is limited to 30% of your AGI"'
    - id: sa.mfs_joint_paid
      printed: (helper)
      type: Bool
      gated_by: sa.mfs_joint_paid_if_itemizing
      label: Was any amount you entered for these deductions paid from an account you hold with your husband or wife, or do
        the two of you file a joint 2025 state income tax return?
      expr:
        op: input
        source: Was any amount you entered for these deductions paid from an account you hold with your husband or wife, or
          do the two of you file a joint 2025 state income tax return?
      cite:
        doc: i1040sca
        locator: 'p. 1, "If you and your spouse paid expenses jointly and are filing separate returns for 2025, see Pub. 504
          to figure the portion of joint expenses that you can claim as itemized deductions"; p504 p. 5, Table 1, medical
          expenses "paid with funds deposited in a joint checking account in which you and your spouse have an equal
          interest", "half of the total medical expenses, subject to certain limits, unless you can show that you alone
          paid the expenses"; p504 p. 5, Table 1, state income tax, "file a joint state income tax return and you’re liable
          for only your own share of state income tax"'
    - id: sa.charity_over_if_itemizing
      printed: (gate)
      type: Bool
      label: Itemizing, and an income limit reduces the gifts to charity (no when taking the standard deduction, which the
        limits cannot change)
      expr:
        op: test
        all:
        - op: test
          eq:
          - sa.charity_over_test
          - const: true
        - op: test
          eq:
          - sa.itemizes
          - const: true
      cite:
        doc: p526
        locator: 'p. 22, Limits on Deductions, "The amount you can deduct for charitable contributions is generally limited
          to no more than 60% of your AGI"'
    - id: sa.mfs_itemizing
      printed: (helper)
      type: Bool
      label: Married filing separately and itemizing deductions
      expr:
        op: test
        all:
        - op: test
          eq:
          - sa.mfs
          - const: true
        - op: test
          eq:
          - sa.itemizes
          - const: true
      cite:
        doc: i1040sca
        locator: 'p. 1, "If you and your spouse paid expenses jointly and are filing separate returns for 2025, see Pub. 504"'
    - id: sa.mfs_joint_paid_if_itemizing
      printed: (gate)
      type: Bool
      label: Itemized expenses paid jointly with the spouse, asked only on a married filing separately return that itemizes
        (otherwise no)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.mfs_itemizing
                - const: true
            then: sa.mfs_joint_paid
          - guard:
              op: test
              eq:
                - sa.mfs_itemizing
                - const: false
            then: sa.no
      cite:
        doc: i1040sca
        locator: 'p. 1, "If you and your spouse paid expenses jointly and are filing separate returns for 2025, see Pub. 504"'
    - id: sa.mfs_spouse_itemizes
      printed: (helper)
      type: Bool
      label: MFS with spouse itemizing
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.mfs
                - const: true
            then: sa.spouse_itemizes
          - guard:
              op: test
              eq:
                - sa.mfs
                - const: false
            then: sa.no
      cite:
        doc: i1040gi
        locator: 'p. 34, Exception 2—Spouse itemizes on a separate return, "If you checked the box on line 12b, your
          standard deduction is zero"'
