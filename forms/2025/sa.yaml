form:
  id: sa
  kind: form
  title: Schedule A — supported itemized deductions and standard comparison
  tax_year: 2025
  note: Income and deduction eligibility are explicit supplied facts. Charity valuation,
    substantiation and income-limit screening are not computed; an affirmative limitation answer is
    refused. The SALT formula follows the printed 2025 worksheet, including its MFS halving step.
  lines:
    - id: sa.unsupported
      printed: (helper)
      type: Bool
      label: 'Any casualty or theft loss (including a disaster loss added to the standard deduction); a deduction from the Schedule A line 16 list other than gambling losses; a foreign tax or generation-skipping tax deduction; mortgage interest or points not on Form 1098 or subject to the debt or use limits (loan proceeds not all used to buy, build or improve the home, or debt over the limit); or the sales-tax election?'
      expr:
        op: input
        source: 'Any casualty or theft loss (including a disaster loss added to the standard deduction); a deduction from the Schedule A line 16 list other than gambling losses; a foreign tax or generation-skipping tax deduction; mortgage interest or points not on Form 1098 or subject to the debt or use limits (loan proceeds not all used to buy, build or improve the home, or debt over the limit); or the sales-tax election?'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.charity_limited
      printed: (helper)
      type: Bool
      label: Are any charitable deductions reduced by income limits, or carried over from a prior year?
        Determine under Publication 526 before answering.
      expr:
        op: input
        source: Are any charitable deductions reduced by income limits, or carried over from a prior year?
          Determine under Publication 526 before answering.
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.excluded_income
      printed: (helper)
      type: Bool
      label: 'Are you filing Form 2555 or Form 4563, or do you have income excluded as a bona fide resident of Puerto Rico?'
      expr:
        op: input
        source: 'Are you filing Form 2555 or Form 4563, or do you have income excluded as a bona fide resident of Puerto Rico?'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.dependent
      printed: (helper)
      type: Bool
      label: 'Can someone claim you or your spouse as a dependent for 2025, or are you a dual-status alien? (Answer no if the person who could claim you is not required to file and does not file, or files only to claim a refund of withheld or estimated tax.)'
      expr:
        op: input
        source: 'Can someone claim you or your spouse as a dependent for 2025, or are you a dual-status alien? (Answer no if the person who could claim you is not required to file and does not file, or files only to claim a refund of withheld or estimated tax.)'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.spouse_extra
      printed: (helper)
      type: Bool
      label: Married filing separately and claiming age or blindness boxes for your spouse (who had no income, isn't filing a return and can't be claimed as a dependent)?
      expr:
        op: input
        source: Married filing separately and claiming age or blindness boxes for your spouse (who had no income, isn't filing a return and can't be claimed as a dependent)?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.mfs_spouse_extra
      printed: (gate)
      type: Bool
      label: Married filing separately and claiming age or blindness boxes for your spouse
      expr:
        op: test
        all:
        - op: test
          eq:
          - f1040.status
          - const: mfs
        - op: test
          eq:
          - sa.spouse_extra
          - const: true
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "If your filing status is married filing separately and your spouse was born before
          January 2, 1961, or was blind at the end of 2025, you can check the appropriate box(es) on line 12d if your
          spouse had no income, isn't filing a return, and can't be claimed as a dependent on another person's return"
    - id: sa.age65_count
      printed: (helper)
      label: Your entry, if the answer is yes
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.role
            - const: taxpayer
          - op: test
            eq:
            - person.age65
            - const: true
      cite:
        doc: f1040sa
        locator: i1040gi p. 35, Standard Deduction Chart for People Who Were Born Before January 2, 1961, or Were
          Blind, "You were born before January 2, 1961", "Enter the total number of boxes checked"
    - id: sa.age65
      printed: (helper)
      label: Were you born before January 2, 1961?
      type: Bool
      expr:
        op: test
        gt:
        - sa.age65_count
        - const: 0
          type: Count
      cite:
        doc: f1040sa
        locator: i1040gi p. 35, Standard Deduction Chart for People Who Were Born Before January 2, 1961, or Were
          Blind, "You were born before January 2, 1961", "Enter the total number of boxes checked"
    - id: sa.spouse_itemizes
      printed: (helper)
      type: Bool
      label: Married filing separately with a spouse who itemizes?
      expr:
        op: input
        source: Married filing separately with a spouse who itemizes?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.elect_itemize
      printed: (helper)
      type: Bool
      label: Elect to itemize even if the standard deduction is larger?
      expr:
        op: input
        source: Elect to itemize even if the standard deduction is larger?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.agi
      printed: (helper)
      type: Dollars
      label: Form 1040 line 11b adjusted gross income
      expr:
        op: copy
        from: f1040.line11b
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line1
      printed: "1"
      type: NonNegDollars
      label: Unreimbursed eligible medical and dental expenses
      expr:
        op: input
        source: Unreimbursed eligible medical and dental expenses
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line5a
      printed: 5a
      type: NonNegDollars
      label: State/local income taxes paid, including withholding; no sales-tax election
      expr:
        op: input
        source: State/local income taxes paid, including withholding; no sales-tax election
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line5b
      printed: 5b
      type: NonNegDollars
      label: Deductible state/local real estate taxes
      expr:
        op: input
        source: Deductible state/local real estate taxes
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line5c
      printed: 5c
      type: NonNegDollars
      label: Deductible state/local personal property taxes
      expr:
        op: input
        source: Deductible state/local personal property taxes
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line8a
      printed: 8a
      type: NonNegDollars
      label: Eligible home mortgage interest and points on Form 1098, after confirming the debt/use limits
        do not apply
      expr:
        op: input
        source: Eligible home mortgage interest and points on Form 1098, after confirming the debt/use
          limits do not apply
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line11
      printed: "11"
      type: NonNegDollars
      label: Deductible cash/check charitable gifts before income limits, after benefits received and
        required substantiation
      expr:
        op: input
        source: Deductible cash/check charitable gifts before income limits, after benefits received and
          required substantiation
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.agi_floor
      printed: (helper)
      type: NonNegDollars
      label: Form 1040 line 11b adjusted gross income, but not less than zero
      expr:
        op: subtract_floor0
        from: sa.agi
        take: sa.zero
      cite:
        doc: i1040sca
        locator: 'p. 1, Medical and Dental Expenses, "You can deduct only the part of your medical and dental expenses that
          exceeds 7.5% of the amount of your adjusted gross income on Form 1040 or 1040-SR, line 11b"'
      ambiguity: amb.2025.sa_medical_negative_agi
    - id: sa.line2
      printed: "2"
      type: NonNegDollars
      label: Amount from sa.agi_floor
      expr:
        op: copy
        from: sa.agi_floor
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
      ambiguity: amb.2025.sa_medical_negative_agi
    - id: sa.line3
      printed: "3"
      type: NonNegDollars
      label: Multiply sa.line2 by sa.medical_rate
      expr:
        op: multiply_rate
        amount: sa.line2
        rate:
          param: sa.medical_rate
      cite:
        doc: f1040sa
        locator: p. 1, Medical and Dental Expenses, line 3, "Multiply line 2 by 7.5% (0.075)"
      ambiguity: amb.2025.multiplication_subcent
    - id: sa.line4
      printed: "4"
      type: NonNegDollars
      label: Subtract sa.line3 from sa.line1; if zero or less, enter zero
      expr:
        op: subtract_floor0
        from: sa.line1
        take: sa.line3
      cite:
        doc: f1040sa
        locator: p. 1, Medical and Dental Expenses, line 4, "Subtract line 3 from line 1. If line 3 is more than line
          1, enter -0-"
    - id: sa.line5d
      printed: 5d
      type: NonNegDollars
      label: Add sa.line5a, sa.line5b, sa.line5c
      expr:
        op: sum
        of:
          - sa.line5a
          - sa.line5b
          - sa.line5c
      cite:
        doc: f1040sa
        locator: p. 1, Taxes You Paid, line 5d, "d Add lines 5a through 5c"
    - id: sa.saltbase
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sa.salt_base
      expr:
        op: param
        ref: sa.salt_base
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.saltfloor
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sa.salt_floor
      expr:
        op: param
        ref: sa.salt_floor
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.saltthreshold
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sa.salt_threshold
      expr:
        op: param
        ref: sa.salt_threshold
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.saltexcess
      printed: (helper)
      type: NonNegDollars
      label: Subtract sa.saltthreshold from sa.agi; if zero or less, enter zero
      expr:
        op: subtract_floor0
        from: sa.agi
        take: sa.saltthreshold
      cite:
        doc: f1040sa
        locator: i1040sca p. 7, State and Local Tax Deduction Worksheet, "Enter $500,000 ($250,000 if married filing
          separately)", "Is the amount on line 4 more than the amount on line 5?", "Subtract line 5 from line 4"
    - id: sa.saltreduction
      printed: (helper)
      type: NonNegDollars
      label: Multiply sa.saltexcess by sa.salt_rate
      expr:
        op: multiply_rate
        amount: sa.saltexcess
        rate:
          param: sa.salt_rate
      cite:
        doc: f1040sa
        locator: i1040sca p. 7, State and Local Tax Deduction Worksheet, "Multiply line 6 by 30% (0.30)"
      ambiguity: amb.2025.multiplication_subcent
    - id: sa.saltremaining
      printed: (helper)
      type: NonNegDollars
      label: Subtract sa.saltreduction from sa.saltbase; if zero or less, enter zero
      expr:
        op: subtract_floor0
        from: sa.saltbase
        take: sa.saltreduction
      cite:
        doc: f1040sa
        locator: i1040sca p. 7, State and Local Tax Deduction Worksheet, "Subtract line 7 from line 1", "Enter
          $40,000"
    - id: sa.saltfloor_applied
      printed: (helper)
      type: NonNegDollars
      label: Larger of remaining ceiling and $10,000
      expr:
        op: larger_of
        of:
          - sa.saltremaining
          - sa.saltfloor
      cite:
        doc: i1040sca
        locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.salthalf
      printed: (helper)
      type: NonNegDollars
      label: Multiply sa.saltfloor_applied by sa.half
      expr:
        op: multiply_rate
        amount: sa.saltfloor_applied
        rate:
          param: sa.half
      cite:
        doc: f1040sa
        locator: i1040sca p. 7, State and Local Tax Deduction Worksheet, "State and local tax deduction. Enter the
          smaller of the amount on line 9 (half the amount on line 9 if married filing separately) or the amount from
          Schedule A, line 5d"
      ambiguity: amb.2025.multiplication_subcent
    - id: sa.mfs
      printed: (helper)
      type: Bool
      label: Married filing separately
      expr:
        op: test
        eq:
          - f1040.status
          - const: mfs
      cite:
        doc: f1040sa
        locator: i1040sca p. 7, State and Local Tax Deduction Worksheet, "(half the amount on line 9 if married filing
          separately)"
    - id: sa.saltlimit
      printed: (helper)
      type: NonNegDollars
      label: Half the worksheet ceiling if married filing separately
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.mfs
                - const: true
            then: sa.salthalf
          - guard:
              op: test
              eq:
                - sa.mfs
                - const: false
            then: sa.saltfloor_applied
      cite:
        doc: i1040sca
        locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.line5e
      printed: 5e
      type: NonNegDollars
      label: Smaller of sa.line5d, sa.saltlimit
      expr:
        op: smaller_of
        of:
          - sa.line5d
          - sa.saltlimit
      cite:
        doc: f1040sa
        locator: p. 1, Taxes You Paid, line 5e, "Enter the smaller of line 5d or $40,000 ($20,000 if married filing
          separately)"; i1040sca p. 7, Line 5e, "If Form 1040 or 1040-SR, line 11b is more than $500,000 ($250,000 if
          married filing separately), or if you completed Form 2555, Form 4563, or excluded income from Puerto Rico,
          complete the State and Local Tax Deduction Worksheet to figure the amount to enter on line 5e"
    - id: sa.line6
      printed: "6"
      type: NonNegDollars
      label: Amount from sa.zero
      expr:
        op: copy
        from: sa.zero
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
      refuses:
        - when: sa.unsupported
          form: Schedule A unsupported item / Form 4684
          remedy: Prepare the applicable deduction or limitation; only the listed Schedule A items are
            supported.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.charity_limited
          form: Schedule A charitable limitation / carryover
          remedy: Income-limited and carried-over charitable deductions are outside scope.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.excluded_income
          form: Schedule A SALT Worksheet / Forms 2555 and 4563
          remedy: Excluded-income addbacks are outside scope.
          cite:
            doc: i1040sca
            locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.line8b
      printed: 8b
      type: NonNegDollars
      label: Amount from sa.zero
      expr:
        op: copy
        from: sa.zero
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
      refuses:
        - when: sa.unsupported
          form: Schedule A unsupported item / Form 4684
          remedy: Prepare the applicable deduction or limitation; only the listed Schedule A items are
            supported.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.charity_limited
          form: Schedule A charitable limitation / carryover
          remedy: Income-limited and carried-over charitable deductions are outside scope.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.excluded_income
          form: Schedule A SALT Worksheet / Forms 2555 and 4563
          remedy: Excluded-income addbacks are outside scope.
          cite:
            doc: i1040sca
            locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.line8c
      printed: 8c
      type: NonNegDollars
      label: Amount from sa.zero
      expr:
        op: copy
        from: sa.zero
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
      refuses:
        - when: sa.unsupported
          form: Schedule A unsupported item / Form 4684
          remedy: Prepare the applicable deduction or limitation; only the listed Schedule A items are
            supported.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.charity_limited
          form: Schedule A charitable limitation / carryover
          remedy: Income-limited and carried-over charitable deductions are outside scope.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.excluded_income
          form: Schedule A SALT Worksheet / Forms 2555 and 4563
          remedy: Excluded-income addbacks are outside scope.
          cite:
            doc: i1040sca
            locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.line13
      printed: "13"
      type: NonNegDollars
      label: Amount from sa.zero
      expr:
        op: copy
        from: sa.zero
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
      refuses:
        - when: sa.unsupported
          form: Schedule A unsupported item / Form 4684
          remedy: Prepare the applicable deduction or limitation; only the listed Schedule A items are
            supported.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.charity_limited
          form: Schedule A charitable limitation / carryover
          remedy: Income-limited and carried-over charitable deductions are outside scope.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.excluded_income
          form: Schedule A SALT Worksheet / Forms 2555 and 4563
          remedy: Excluded-income addbacks are outside scope.
          cite:
            doc: i1040sca
            locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.line15
      printed: "15"
      type: NonNegDollars
      label: Amount from sa.zero
      expr:
        op: copy
        from: sa.zero
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
      refuses:
        - when: sa.unsupported
          form: Schedule A unsupported item / Form 4684
          remedy: Prepare the applicable deduction or limitation; only the listed Schedule A items are
            supported.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.charity_limited
          form: Schedule A charitable limitation / carryover
          remedy: Income-limited and carried-over charitable deductions are outside scope.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.excluded_income
          form: Schedule A SALT Worksheet / Forms 2555 and 4563
          remedy: Excluded-income addbacks are outside scope.
          cite:
            doc: i1040sca
            locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.gambling_losses
      printed: (helper)
      type: NonNegDollars
      label: Gambling losses you had during 2025
      expr:
        op: input
        source: 'Your gambling losses during 2025 (you and, on a joint return, your spouse), including the cost of
          nonwinning bingo, lottery and raffle tickets, in full, whether or not more than your winnings; zero if none'
      cite:
        doc: i1040sca
        locator: 'p. 11, Other Itemized Deductions, "Gambling losses (gambling losses include, but aren''t limited to, the
          cost of nonwinning bingo, lottery, and raffle tickets)"'
    - id: sa.line16_gambling
      printed: (helper)
      type: NonNegDollars
      label: Gambling losses, but only to the extent of gambling winnings reported on Schedule 1, line 8b
      expr:
        op: smaller_of
        of:
          - sa.gambling_losses
          - s1.line8b
      cite:
        doc: i1040sca
        locator: 'p. 11, Other Itemized Deductions, "but only to the extent of gambling winnings reported on Schedule 1 (Form
          1040), line 8b"; p525 p. 33, Gambling winnings, "If you itemize your deductions on Schedule A (Form 1040), you can
          deduct gambling losses you had during the year, but only up to the amount of your winnings"'
      ambiguity: amb.2025.gambling_losses
    - id: sa.line16
      printed: "16"
      type: NonNegDollars
      label: "Other—from list in instructions. List type and amount:"
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - s1.has_gambling
                - const: true
            then: sa.line16_gambling
          - guard:
              op: test
              eq:
                - s1.has_gambling
                - const: false
            then: sa.zero
      cite:
        doc: f1040sa
        locator: Schedule A (2025), line 16; i1040sca p. 11, Other Itemized Deductions, "Only the expenses listed next can be
          deducted on line 16"
      refuses:
        - when: sa.unsupported
          form: Schedule A unsupported item / Form 4684
          remedy: Prepare the applicable deduction or limitation; only the listed Schedule A items are
            supported.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.charity_limited
          form: Schedule A charitable limitation / carryover
          remedy: Income-limited and carried-over charitable deductions are outside scope.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.excluded_income
          form: Schedule A SALT Worksheet / Forms 2555 and 4563
          remedy: Excluded-income addbacks are outside scope.
          cite:
            doc: i1040sca
            locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.line7
      printed: "7"
      type: NonNegDollars
      label: Add sa.line5e, sa.line6
      expr:
        op: sum
        of:
          - sa.line5e
          - sa.line6
      cite:
        doc: f1040sa
        locator: p. 1, Taxes You Paid, line 7, "Add lines 5e and 6"
    - id: sa.line8e
      printed: 8e
      type: NonNegDollars
      label: Add sa.line8a, sa.line8b, sa.line8c
      expr:
        op: sum
        of:
          - sa.line8a
          - sa.line8b
          - sa.line8c
      cite:
        doc: f1040sa
        locator: p. 1, Interest You Paid, line 8e, "e Add lines 8a through 8c"
    - id: sa.line9
      printed: "9"
      type: NonNegDollars
      label: Amount from f4952.line8
      expr:
        op: copy
        from: f4952.line8
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line10
      printed: "10"
      type: NonNegDollars
      label: Add sa.line8e, sa.line9
      expr:
        op: sum
        of:
          - sa.line8e
          - sa.line9
      cite:
        doc: f1040sa
        locator: p. 1, Interest You Paid, line 10, "Add lines 8e and 9"
    - id: sa.line12
      printed: "12"
      type: NonNegDollars
      label: Total supported noncash donations before income limits
      expr:
        op: sum_over
        collection: gift
        field: gift.allowed
      cite:
        doc: f1040sa
        locator: p. 1, Gifts to Charity, line 12, "Other than by cash or check. If you made any gift of $250 or more,
          see instructions"
      refuses:
        - when: sa.unsupported
          form: Schedule A unsupported item / Form 4684
          remedy: Prepare the applicable deduction or limitation; only the listed Schedule A items are
            supported.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.charity_limited
          form: Schedule A charitable limitation / carryover
          remedy: Income-limited and carried-over charitable deductions are outside scope.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.excluded_income
          form: Schedule A SALT Worksheet / Forms 2555 and 4563
          remedy: Excluded-income addbacks are outside scope.
          cite:
            doc: i1040sca
            locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.form8283
      printed: (helper)
      display: 'Attachment notice on the values sheet: Form 8283 must be attached when noncash gifts exceed $500.'
      type: Bool
      label: Noncash total exceeds $500; Form 8283 attachment required
      expr:
        op: test
        gt:
          - sa.line12
          - const: 50000
      cite:
        doc: f1040sa
        locator: p. 1, Gifts to Charity, line 12, "You must attach Form 8283 if over $500"
    - id: sa.line14
      printed: "14"
      type: NonNegDollars
      label: Add sa.line11, sa.line12, sa.line13
      expr:
        op: sum
        of:
          - sa.line11
          - sa.line12
          - sa.line13
      cite:
        doc: f1040sa
        locator: p. 1, Gifts to Charity, line 14, "Add lines 11 through 13"
    - id: sa.line17
      printed: "17"
      type: NonNegDollars
      label: Add sa.line4, sa.line7, sa.line10, sa.line14, sa.line15, sa.line16
      expr:
        op: sum
        of:
          - sa.line4
          - sa.line7
          - sa.line10
          - sa.line14
          - sa.line15
          - sa.line16
      cite:
        doc: f1040sa
        locator: p. 1, Total Itemized Deductions, line 17, "Add the amounts in the far right column for lines 4
          through 16. Also, enter this amount on Form 1040 or 1040-SR, line 12e"
      refuses:
        - when: sa.unsupported
          form: Schedule A unsupported item / Form 4684
          remedy: Prepare the applicable deduction or limitation; only the listed Schedule A items are
            supported.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.charity_limited
          form: Schedule A charitable limitation / carryover
          remedy: Income-limited and carried-over charitable deductions are outside scope.
          cite:
            doc: f1040sa
            locator: Schedule A (2025), lines 1–18
        - when: sa.excluded_income
          form: Schedule A SALT Worksheet / Forms 2555 and 4563
          remedy: Excluded-income addbacks are outside scope.
          cite:
            doc: i1040sca
            locator: p. 7, State and Local Tax Deduction Worksheet
    - id: sa.standardbase
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sa.standard_base
      expr:
        op: param
        ref: sa.standard_base
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.extra
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sa.standard_extra
      expr:
        op: param
        ref: sa.standard_extra
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.boxes_age65
      printed: (helper)
      type: Count
      label: Number of boxes checked for born before January 2, 1961 (you, and your spouse if filing jointly), not counting a
        person who died in 2025 before reaching 65
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.age65
            - const: true
          - op: test
            eq:
            - person.died_before_65
            - const: false
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; pp. 34–35, Standard Deduction
          Chart for People Who Were Born Before January 2, 1961, or Were Blind
    - id: sa.extra_age65
      printed: (helper)
      type: NonNegDollars
      label: Additional standard deduction for each box checked for age
      expr:
        op: multiply_count
        amount: sa.extra
        count: sa.boxes_age65
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; pp. 34–35, Standard Deduction
          Chart for People Who Were Born Before January 2, 1961, or Were Blind
    - id: sa.boxes_blind
      printed: (helper)
      type: Count
      label: Number of boxes checked for blindness (you, and your spouse if filing jointly)
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.blind
          - const: true
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; pp. 34–35, Standard Deduction
          Chart for People Who Were Born Before January 2, 1961, or Were Blind
    - id: sa.extra_blind
      printed: (helper)
      type: NonNegDollars
      label: Additional standard deduction for each box checked for blindness
      expr:
        op: multiply_count
        amount: sa.extra
        count: sa.boxes_blind
      cite:
        doc: i1040gi
        locator: p. 33, Line 12d, "If you or your spouse (if you are married and filing a joint return) were born before
          January 2, 1961, or were blind at the end of 2025, check the appropriate box(es)"; pp. 34–35, Standard Deduction
          Chart for People Who Were Born Before January 2, 1961, or Were Blind
    - id: sa.standardraw
      printed: (helper)
      type: NonNegDollars
      label: Add sa.standardbase, sa.extra_age65, sa.extra_blind
      expr:
        op: sum
        of:
          - sa.standardbase
          - sa.extra_age65
          - sa.extra_blind
      cite:
        doc: f1040sa
        locator: i1040gi pp. 34–35, Line 12e Standard Deduction or Itemized Deductions, "Exception 4—Born before
          January 2, 1961, or blind", "Standard Deduction Chart for People Who Were Born Before January 2, 1961, or
          Were Blind", "If born before January 2, 1961, or blind, multiply the number on line 1 by $1,600 ($2,000 if
          single or head of household)"
    - id: sa.standard
      printed: (helper)
      type: NonNegDollars
      label: Standard deduction, zero when MFS spouse itemizes
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.mfs_spouse_itemizes
                - const: true
            then: sa.zero
          - guard:
              op: test
              eq:
                - sa.mfs_spouse_itemizes
                - const: false
            then: sa.standardraw
      cite:
        doc: i1040gi
        locator: pp. 34–35, line 12e and Standard Deduction Chart
      refuses:
        - when: sa.dependent
          form: Standard Deduction Worksheet for Dependents / dual-status rules
          remedy: Dependent and dual-status standard deductions are outside this resident nondependent slice.
          cite:
            doc: i1040gi
            locator: pp. 34–35, line 12e and Standard Deduction Chart
        - when: sa.mfs_spouse_extra
          form: Standard Deduction Chart spouse boxes on a separate return
          remedy: Checking age or blindness boxes for your spouse on a married filing separately return is outside
            this tool.
          cite:
            doc: i1040gi
            locator: pp. 34–35, line 12e and Standard Deduction Chart
    - id: sa.itemizes
      printed: (helper)
      type: Bool
      label: Itemize if elected, required, or itemized total exceeds standard
      expr:
        op: test
        any:
          - op: test
            eq:
              - sa.elect_itemize
              - const: true
          - op: test
            eq:
              - sa.mfs_spouse_itemizes
              - const: true
          - op: test
            gt:
              - sa.line17
              - sa.standard
      cite:
        doc: f1040sa
        locator: p. 1, Total Itemized Deductions, line 18, "If you elect to itemize deductions even though they are
          less than your standard deduction, check this box"; i1040gi p. 34, Line 12e Standard Deduction or Itemized
          Deductions, "In most cases, your federal income tax will be less if you take the larger of your standard
          deduction or itemized deductions", "If you checked the box on line 12b, your standard deduction is zero"
    - id: sa.deduction
      printed: (helper)
      type: NonNegDollars
      label: Deduction selected for Form 1040 line 12e
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: true
            then: sa.line17
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: false
            then: sa.standard
      cite:
        doc: i1040gi
        locator: pp. 34–35, line 12e and Standard Deduction Chart
    - id: sa.mfs_spouse_itemizes
      printed: (helper)
      type: Bool
      label: MFS with spouse itemizing
      expr:
        op: test
        all:
          - op: test
            eq:
              - sa.mfs
              - const: true
          - op: test
            eq:
              - sa.spouse_itemizes
              - const: true
      cite:
        doc: i1040gi
        locator: p. 34, Line 12e, Exception 2
