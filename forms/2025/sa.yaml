      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line2
      printed: "2"
      type: Dollars
      label: Amount from sa.agi
      expr:
        op: copy
        from: sa.agi
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line3
      printed: "3"
      type: Dollars
      label: Multiply sa.line2 by sa.medical_rate
      expr:
        op: multiply_rate
        amount: sa.line2
        rate:
          param: sa.medical_rate
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
      ambiguity: amb.2025.multiplication_subcent
    - id: sa.line4
      printed: "4"
      type: NonNegDollars
      label: Subtract sa.line3 from sa.line1; if zero or less, enter zero
      expr:
        op: subtract_floor0
        from: sa.line1
        take: sa.line3
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.line5d
      printed: 5d
      type: NonNegDollars
      label: Add sa.line5a, sa.line5b, sa.line5c
      expr:
        op: sum
        of:
          - sa.line5a
          - sa.line5b
          - sa.line5c
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.saltbase
