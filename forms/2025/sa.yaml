          - sa.extra_age65
          - sa.extra_blind
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.standard
      printed: (helper)
      type: NonNegDollars
      label: Standard deduction, zero when MFS spouse itemizes
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.mfs_spouse_itemizes
                - const: true
            then: sa.zero
          - guard:
              op: test
              eq:
                - sa.mfs_spouse_itemizes
                - const: false
            then: sa.standardraw
      cite:
        doc: i1040gi
        locator: pp. 34–35, line 12e and Standard Deduction Chart
      refuses:
        - when: sa.dependent
          form: Standard Deduction Worksheet for Dependents / dual-status rules
          remedy: Dependent and dual-status standard deductions are outside this resident nondependent slice.
          cite:
            doc: i1040gi
            locator: pp. 34–35, line 12e and Standard Deduction Chart
        - when: sa.spouse_extra
          form: Standard Deduction Chart spouse boxes
          remedy: Spouse age/blindness claims require the unsupported per-spouse interview.
          cite:
            doc: i1040gi
            locator: pp. 34–35, line 12e and Standard Deduction Chart
    - id: sa.itemizes
      printed: (helper)
      type: Bool
      label: Itemize if elected, required, or itemized total exceeds standard
      expr:
        op: test
        any:
          - op: test
            eq:
              - sa.elect_itemize
              - const: true
          - op: test
            eq:
              - sa.mfs_spouse_itemizes
              - const: true
          - op: test
            gt:
              - sa.line17
              - sa.standard
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.deduction
      printed: (helper)
      type: NonNegDollars
      label: Deduction selected for Form 1040 line 12e
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: true
            then: sa.line17
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: false
            then: sa.standard
      cite:
        doc: i1040gi
        locator: pp. 34–35, line 12e and Standard Deduction Chart
    - id: sa.mfs_spouse_itemizes
      printed: (helper)
      type: Bool
      label: MFS with spouse itemizing
      expr:
        op: test
        all:
          - op: test
            eq:
              - sa.mfs
              - const: true
          - op: test
            eq:
              - sa.spouse_itemizes
              - const: true
      cite:
        doc: i1040gi
        locator: p. 34, line 12e exception 2
