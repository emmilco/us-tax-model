form:
  id: sa
  kind: form
  title: Schedule A — supported itemized deductions and standard comparison
  tax_year: 2025
  note: Income and deduction eligibility are explicit supplied facts. Charity valuation,
    substantiation and income-limit screening are not computed; an affirmative limitation answer is
    refused. The SALT formula follows the printed 2025 worksheet, including its MFS halving step.
  lines:
    - id: sa.unsupported
      printed: (helper)
      type: Bool
      label: 'Any casualty or theft loss (including a disaster loss added to the standard deduction); a deduction from the Schedule A line 16 list; a foreign tax or generation-skipping tax deduction; mortgage interest or points not on Form 1098 or subject to the debt or use limits (loan proceeds not all used to buy, build or improve the home, or debt over the limit); or the sales-tax election?'
      expr:
        op: input
        source: 'Any casualty or theft loss (including a disaster loss added to the standard deduction); a deduction from the Schedule A line 16 list; a foreign tax or generation-skipping tax deduction; mortgage interest or points not on Form 1098 or subject to the debt or use limits (loan proceeds not all used to buy, build or improve the home, or debt over the limit); or the sales-tax election?'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.charity_limited
      printed: (helper)
      type: Bool
      label: Are any charitable deductions reduced by income limits, or carried over from a prior year?
        Determine under Publication 526 before answering.
      expr:
        op: input
        source: Are any charitable deductions reduced by income limits, or carried over from a prior year?
          Determine under Publication 526 before answering.
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.excluded_income
      printed: (helper)
      type: Bool
      label: 'Are you filing Form 2555 or Form 4563, or do you have income excluded as a bona fide resident of Puerto Rico?'
      expr:
        op: input
        source: 'Are you filing Form 2555 or Form 4563, or do you have income excluded as a bona fide resident of Puerto Rico?'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.dependent
      printed: (helper)
      type: Bool
      label: 'Can someone claim you or your spouse as a dependent for 2025, or are you a dual-status alien? (Answer no if the person who could claim you is not required to file and does not file, or files only to claim a refund of withheld or estimated tax.)'
      expr:
        op: input
        source: 'Can someone claim you or your spouse as a dependent for 2025, or are you a dual-status alien? (Answer no if the person who could claim you is not required to file and does not file, or files only to claim a refund of withheld or estimated tax.)'
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.spouse_extra
      printed: (helper)
      type: Bool
      label: Claiming any age/blindness standard-deduction boxes for a spouse?
      expr:
        op: input
        source: Claiming any age/blindness standard-deduction boxes for a spouse?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.age65_count
      printed: (helper)
      label: Your entry, if the answer is yes
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.role
            - const: taxpayer
          - op: test
            eq:
            - person.age65
            - const: true
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.age65
      printed: (helper)
      label: Were you born before January 2, 1961?
      type: Bool
      expr:
        op: test
        gt:
        - sa.age65_count
        - const: 0
          type: Count
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.blind_count
      printed: (helper)
      label: Your entry, if the answer is yes
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.role
            - const: taxpayer
          - op: test
            eq:
            - person.blind
            - const: true
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.blind
      printed: (helper)
      label: Are you blind under the standard-deduction instructions?
      type: Bool
      expr:
        op: test
        gt:
        - sa.blind_count
        - const: 0
          type: Count
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.spouse_itemizes
      printed: (helper)
      type: Bool
      label: Married filing separately with a spouse who itemizes?
      expr:
        op: input
        source: Married filing separately with a spouse who itemizes?
      cite:
        doc: f1040sa
        locator: Schedule A (2025), lines 1–18
    - id: sa.elect_itemize
      printed: (helper)
