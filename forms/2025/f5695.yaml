form:
  id: f5695
  kind: form
  title: Form 5695 — Residential Energy Credits (Parts I and II)
  tax_year: 2025
  note: Part I (residential clean energy credit, to Schedule 3 line 5a) and Part II (energy efficient home improvement
    credit, to Schedule 3 line 5b), with the Residential Clean Energy Credit Limit Worksheet (line 14) and the Energy
    Efficient Home Improvement Credit Limit Worksheet (line 31). Fuel cell property (lines 7a to 11), business use of an
    item, joint occupancy with anyone other than a spouse, spouses with separate main homes, improvements related to the
    construction of a home and items without a valid QMID are refused. Addresses and QMIDs are not values (the data model
    has no strings); a QMID is an attestation per category. Each kind of property is asked
    by a yes or no question beneath one opening question, and a part is figured only when one of its kinds was installed.
  lines:
  - id: f5695.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: f5695
      locator: Form 5695 (2025), lines 5b, 11, 18b to 20d, 22d to 26c, 29h and 32
  - id: f5695.any
    printed: (helper)
    label: "Anything was installed in 2025 at a home to save or make energy, or a home energy audit was paid for"
    type: Bool
    expr:
      op: input
      source: "In 2025, did you (or, on a joint return, your spouse) have anything installed at home that saves or makes energy: solar panels, a battery, insulation, windows, doors, or heating, cooling or hot-water equipment?"
    cite:
      doc: i5695
      locator: p. 2, Residential Clean Energy Credit (Part I), "You may be able to take a credit of 30% of your costs of
        qualified solar electric property, solar water heating property, small wind energy property, geothermal heat pump
        property, battery storage technology, and fuel cell property"; p. 2, Joint occupancy, "These rules don't apply to married individuals filing a joint
        return"; p. 1, Purpose of Form, "Also use Form 5695 to take
        any residential clean energy credit carryforward from 2024"; p. 1, Costs, "For purposes of both credits, costs are
        treated as being paid when the original installation of the item is completed", "For purposes of the
        residential clean energy credit only, costs connected with the construction of a home are treated as being
        paid when your original use of the constructed home begins"; p. 2, Association or cooperative costs, "you
        are treated as having paid your proportionate share of any costs of such association or corporation"; p. 1,
        Termination of credits, "You can’t claim residential clean energy credits for expenditures made after December
        31, 2025"

  - id: f5695.solar
    printed: (helper)
    label: "Solar electric property was installed"
    type: Bool
    gated_by: f5695.solar_if_any
    expr:
      op: input
