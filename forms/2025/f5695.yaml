      property) to enable the installation and use of a separate qualified energy efficient improvement or qualified energy
      property (enabled property), and were both the enabling property and the enabled property installed in 2025?
    type: Bool
    gated_by: f5695.line25a_if_panel
    expr:
      op: input
      source: Did you (or, on a joint return, your spouse) install improvements or replacements of panelboards,
        subpanelboards, branch circuits or feeders (enabling property) to enable the installation and use of separate
        enabled property (windows or skylights on line 20a, a central air conditioner on line 22a, a water heater on
        line 23a, a furnace or hot water boiler on line 24a, a heat pump on line 29a, a heat pump water heater on line
        29c, or a biomass stove or boiler on line 29e), and were both installed in 2025? (If one was installed in 2024
        and the other in 2025, you may choose to treat both as installed in 2025. Answer No if there are none.)
    cite:
      doc: i5695
      locator: p. 6, Lines 25a Through 25e, "both the enabling property and the enabled property must be installed in 2025",
        "If the enabling property and the enabled property were installed in consecutive tax years, then you can treat both
        as having been installed in the later of the tax year"; pp. 6-7, Line 25b, "Enter the code for the type(s) of enabled
        property from the following list"
  - id: f5695.line25a_if_panel
