      locator: p. 6, Lines 19a Through 19h, "Line 19d. Enter the QMID(s) and amount(s) you paid for the two next most
        expensive qualifying exterior doors in 2025"
  - id: f5695.line19d_i_if_doors
    printed: (gate)
    label: "The answer to line19d_i, asked only in its case (zero otherwise)"
