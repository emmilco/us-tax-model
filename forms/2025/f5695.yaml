    cite:
      doc: i5695
      locator: p. 5, Part II Energy Efficient Home Improvement Credit, "To qualify for the energy efficient home improvement
        credit for specified property, you must provide a valid QMID for each item"
  - id: f5695.hp_capped
    printed: (helper)
    label: Line 29g multiplied by 30%, not more than $2,000
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - f5695.hp_30
      - f5695.heat_pump_max
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 29h, "Multiply line 29g by 30% (0.30). Enter the results. Do not enter more than $2,000"
    refuses:
    - when: f5695.hp_no_qmid
      form: Form 5695 line 29 (a heat pump, heat pump water heater or biomass stove or boiler without a valid QMID)
      remedy: Qualified energy property installed in 2025 qualifies only with a valid QMID reported for it; obtain the QMID
        from the manufacturer, or do not claim that item.
      cite:
        doc: i5695
        locator: p. 5, Part II Energy Efficient Home Improvement Credit, "you must provide a valid QMID for each item"
  - id: f5695.line29h
    printed: 29h
    label: Multiply line 29g by 30% (0.30). Enter the results. Do not enter more than $2,000
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f5695.sec_b_claimed
          - const: true
        then: f5695.hp_capped
      - guard:
          op: test
          eq:
          - f5695.sec_b_claimed
          - const: false
        then: f5695.zero
    cite:
      doc: f5695
      locator: Form 5695 (2025), lines 21b and 29h, "Skip lines 22 through 25 and line 29"
  - id: f5695.joint_occupancy
    printed: (helper)
    label: Did you occupy the home jointly with someone other than your spouse, each occupant completing their own Form 5695?
    type: Bool
    expr:
      op: input
      source: Did you occupy the home jointly with someone other than your spouse on a joint return, so that each occupant
        completes their own Form 5695 for the same property? (Answer No if you and a neighbor only shared the cost of
        property benefiting each of your own main homes, and enter only the part of the cost you paid.)
    cite:
      doc: i5695
      locator: p. 3, Joint occupancy, "If you occupied your home jointly with someone, each occupant must complete their own
        Form 5695"; p. 3, Joint ownership of qualified property, "You figure your credit on the part of the cost you paid"
  - id: f5695.separate_homes
    printed: (helper)
    label: Did you and your spouse own and live apart in separate main homes?
    type: Bool
    expr:
      op: input
      source: Did you and your spouse both own and live apart in separate main homes in 2025?
    cite:
      doc: i5695
      locator: p. 3, Married taxpayers with more than one home, "If both you and your spouse owned and lived apart in
        separate main homes, the limit on the amount of the credit applies to each of you separately"
  - id: f5695.separate_homes_joint
    printed: (helper)
    label: Married filing jointly with separate main homes
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f1040.status
        - const: mfj
      - op: test
        eq:
        - f5695.separate_homes
        - const: true
    cite:
      doc: i5695
      locator: p. 3, Married taxpayers with more than one home, "If you are filing a joint return, figure your energy
        efficient home improvement credit as follows"
  - id: f5695.line30
    printed: "30"
    label: Add lines 28 and 29h
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f5695.line28
      - f5695.line29h
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 30
    refuses:
    - when: f5695.business_use
      form: Form 5695 for an item used less than 80% for nonbusiness purposes
      remedy: Allocating an item's cost between business and nonbusiness use is outside this tool.
      cite:
        doc: i5695
        locator: p. 1, Costs, "only that portion of the costs that is allocable to the nonbusiness use can be used to
          determine either credit"
    - when: f5695.joint_occupancy
      form: Form 5695 Part II for joint occupants (line 32a)
      remedy: Allocating the credit limits among joint occupants by the amounts each paid, with the statement line 32a
        requires, is outside this tool.
      cite:
        doc: i5695
        locator: p. 3, Joint occupancy, "If the aggregate credit that would be allowed to all occupants for any item of
          property exceeds the credit limit below, then you must figure your allocable share of the credit from each
          property"
    - when: f5695.separate_homes_joint
      form: Form 5695 Part II for spouses with separate main homes (a separate Form 5695 for each main home)
      remedy: Figuring lines 17a through 30 on a separate Form 5695 for each spouse's main home and combining them on line
        30 is outside this tool.
      cite:
        doc: i5695
        locator: p. 3, Married taxpayers with more than one home, "Complete lines 17a through 30 of a separate Form 5695 for
          each main home"
    - when: f5695.sec_a_new_home
      form: Form 5695 Part II, Section A, with improvements related to the construction of the main home (line 17e Yes)
      remedy: Separating improvements related to the construction of a home from those that are not is outside this tool.
      cite:
        doc: i5695
        locator: p. 5, Lines 17a Through 17e, "If the qualified improvements for which you are seeking to claim the credit
          are related to the construction of a new home, check the ... Yes ... box. If you check the ... Yes ... box, skip
          lines 18a through 20d"
    - when: f5695.sec_b_new_home
      form: Form 5695 Part II, Section B, for property installed in connection with the construction of a new home
      remedy: The energy efficient home improvement credit is only available for existing homes; separating such property
        from property for an existing home is outside this tool.
      cite:
        doc: i5695
        locator: p. 1, Costs, "The energy efficient home improvement credit (Part II) is only available for existing homes"
  - id: f5695.eehi_ws1
    printed: (helper)
    label: Energy Efficient Home Improvement Credit Limit Worksheet, line 1. Enter the amount from Form 1040, line 18
    type: Dollars
    expr:
      op: copy
      from: f1040.line18
    cite:
      doc: i5695
      locator: p. 7, Energy Efficient Home Improvement Credit Limit Worksheet—Line 31, line 1, "Enter the amount from Form
        1040, 1040-SR, or 1040-NR, line 18"
  - id: f5695.eehi_ws2
    printed: (helper)
    label: 'Energy Efficient Home Improvement Credit Limit Worksheet, line 2. Schedule 3 lines 6l, 1, 2, 6d, 3 and 4; in this
      tool lines 1, 2, 3 and 4, the others being refused'
    type: Dollars
    expr:
      op: sum
      of:
      - s3.line1
      - s3.line2
      - s3.line3
      - s3.line4
    cite:
      doc: i5695
      locator: p. 7, Energy Efficient Home Improvement Credit Limit Worksheet—Line 31, line 2, "Enter the total of the
        following credit(s)/adjustment(s) if you are taking the credit(s)/adjustment(s) on your 2025 income tax return"
    refuses:
    - when: scope.credits
      form: Energy Efficient Home Improvement Credit Limit Worksheet, line 2 (Schedule 3 lines 6d and 6l)
      remedy: Credits other than the foreign tax credit, the dependent credits, the child and dependent care credit, the education credits, the saver's credit and the residential energy credits are
        outside this tool.
      cite:
        doc: i5695
        locator: p. 7, Energy Efficient Home Improvement Credit Limit Worksheet—Line 31, line 2
  - id: f5695.eehi_ws3
    printed: (helper)
    label: Energy Efficient Home Improvement Credit Limit Worksheet, line 3. Subtract line 2 from line 1. If zero or less,
      enter -0-
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f5695.eehi_ws1
      take: f5695.eehi_ws2
    cite:
      doc: i5695
      locator: p. 7, Energy Efficient Home Improvement Credit Limit Worksheet—Line 31, line 3, "Subtract line 2 from line 1.
        Also enter this amount on Form 5695, line 31. If zero or less, enter -0- on Form 5695, lines 31 and 32"
  - id: f5695.line31
    printed: "31"
    label: Limitation based on tax liability. Enter the amount from the Energy Efficient Home Improvement Credit Limit
      Worksheet
    type: NonNegDollars
    expr:
      op: copy
      from: f5695.eehi_ws3
    cite:
      doc: i5695
      locator: p. 7, Line 31, "Complete the worksheet below to figure the amount to enter on line 31"
  - id: f5695.line32
    printed: "32"
    label: Energy efficient home improvement credit. Enter the smaller of line 30 or line 31. Also include this amount on
      Schedule 3 (Form 1040), line 5b
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - f5695.line30
      - f5695.line31
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 32
  - id: f5695.line32a
    printed: 32a
    label: If the special rule for joint occupants applies, check here and attach a statement
    type: Bool
    expr:
      op: test
      eq:
      - f5695.joint_occupancy
      - const: true
    cite:
      doc: i5695
      locator: p. 7, Lines 32a and 32b, "Line 32a. Joint occupants of a home who are claiming the energy efficient home
        improvement credit must check the box on line 32a"
    note: Joint occupancy is refused on line 30, so the box is unchecked on every return this tool completes.
  - id: f5695.condo
    printed: (helper)
    label: Do you live in a condominium or cooperative and claim a fractional share of its costs?
    type: Bool
    expr:
      op: input
      source: Do you live in a condominium or cooperative and include in Part II a fractional share of the qualified energy
        efficiency improvements or residential energy property costs of the condominium management association or the
        cooperative housing corporation?
    cite:
      doc: i5695
      locator: p. 7, Lines 32a and 32b, "Line 32b. Occupants of a condominium or cooperative who are claiming a fractional
        share of the qualified energy efficiency improvements or residential energy property costs must check the box on line
        32b"
  - id: f5695.line32b
    printed: 32b
    label: If you live in a condominium or cooperative and have a fractional share of the qualified energy efficiency
      improvements or residential energy property expenditures, check here
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f5695.part2_any
        - const: true
      - op: test
        eq:
        - f5695.condo
        - const: true
    cite:
      doc: i5695
      locator: p. 7, Lines 32a and 32b, "must check the box on line 32b"
