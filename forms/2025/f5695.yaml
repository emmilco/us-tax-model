      locator: p. 6, Lines 19a Through 19h, "Line 19a. Enter the amount you paid for the most expensive exterior door that
        meets the Energy Star program requirements"

  - id: f5695.door1_30
    printed: (helper)
    label: Line 19a multiplied by 30% (0.30)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f5695.line19a_if_doors
      rate: f5695.eehi_rate
    cite:
