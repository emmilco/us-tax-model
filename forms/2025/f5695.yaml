form:
  id: f5695
  kind: form
  title: Form 5695 — Residential Energy Credits (Parts I and II)
  tax_year: 2025
  note: Part I (residential clean energy credit, to Schedule 3 line 5a) and Part II (energy efficient home improvement
    credit, to Schedule 3 line 5b), with the Residential Clean Energy Credit Limit Worksheet (line 14) and the Energy
    Efficient Home Improvement Credit Limit Worksheet (line 31). Fuel cell property (lines 7a to 11), business use of an
    item, joint occupancy with anyone other than a spouse, spouses with separate main homes, improvements related to the
    construction of a home and items without a valid QMID are refused. Addresses and QMIDs are not values (the data model
    has no strings); a QMID is an attestation per category. Each part is figured only when its screen question is
    answered Yes; otherwise its Schedule 3 line is zero.
  lines:
  - id: f5695.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: f5695
      locator: Form 5695 (2025), lines 5b, 11, 18b to 20d, 22d to 26c and 29h
  - id: f5695.part1_any
    printed: (helper)
    label: Any residential clean energy property paid for in 2025, or a carryforward from 2024
    type: Bool
    expr:
      op: input
      source: Did you pay in 2025 for solar electric, solar water heating, small wind energy, geothermal heat pump, battery
        storage or fuel cell property for a home in the United States, or do you have a residential clean energy credit
        carryforward from line 16 of your 2024 Form 5695?
    cite:
      doc: i5695
      locator: p. 2, Residential Clean Energy Credit (Part I), "You may be able to take a credit of 30% of your costs of
        qualified solar electric property, solar water heating property, small wind energy property, geothermal heat pump
        property, battery storage technology, and fuel cell property"; p. 1, Purpose of Form, "Also use Form 5695 to take
        any residential clean energy credit carryforward from 2024"
  - id: f5695.part2_any
    printed: (helper)
    label: Any energy efficient home improvement costs paid in 2025
    type: Bool
    expr:
      op: input
      source: Did you pay in 2025 for insulation or air sealing, exterior doors, exterior windows or skylights, central air
        conditioners, natural gas, propane or oil water heaters, furnaces or hot water boilers, electric or natural gas
        heat pumps or heat pump water heaters, biomass stoves or boilers, panelboards, subpanelboards, branch circuits or
        feeders, or a home energy audit, for a home in the United States?
    cite:
      doc: i5695
      locator: p. 2, Energy Efficient Home Improvement Credit (Part II), "You may be able to take a credit equal to 30% of
        the sum of"; p. 1, Reminders, "A 30% credit, up to a maximum of $1,200, may be allowed for"
  - id: f5695.business_use
    printed: (helper)
    label: Is any item whose cost is entered on Form 5695 used less than 80% for nonbusiness purposes?
    type: Bool
    expr:
      op: input
      source: Is any item whose cost you are entering on Form 5695 used less than 80% for nonbusiness purposes (that is,
        is more than 20% of its use for a business)?
    cite:
      doc: i5695
      locator: p. 1, Costs, "If less than 80% of the use of an item is for nonbusiness purposes, only that portion of the
        costs that is allocable to the nonbusiness use can be used to determine either credit"
  - id: f5695.construction_later
    printed: (helper)
    label: Part I costs connected with constructing or reconstructing a home whose original use by you did not begin in
      2025?
    type: Bool
    expr:
      op: input
      source: Are any of the Part I costs (solar, wind, geothermal or battery property) connected with the construction or
        reconstruction of a home whose original use by you did not begin in 2025 (for example, a home built in 2025 that
        you first lived in in 2026)?
    cite:
      doc: i5695
      locator: p. 1, Costs, "in the case of costs connected with the reconstruction of your home, when your original use of
        the reconstructed home begins. For purposes of the residential clean energy credit only, costs connected with the
        construction of a home are treated as being paid when your original use of the constructed home begins"; fs-2025-05
        question 7, "If such construction or reconstruction is completed and taxpayer’s original use of the structure
        begins after December 31, 2025, the expenditure will be treated as made after December 31, 2025"
  - id: f5695.line1
    printed: "1"
    label: Qualified solar electric property costs
    type: NonNegDollars
    expr:
      op: input
      source: Qualified solar electric property costs you paid for a home in the United States (it need not be your main
        home), including labor (net of subsidies and rebates; see help; zero if none)
    cite:
      doc: i5695
      locator: p. 4, Line 1, "Enter the amounts you paid for qualified solar electric property"; p. 2, Qualified solar
        electric property costs, "The home doesn't have to be your main home"; p. 2, Caution, "If you received a subsidy
        from a public utility for the purchase or installation of an energy conservation product and that subsidy wasn't
        included in your gross income, you must reduce your cost for the product by the amount of that subsidy before you
        figure your credit"; p. 2, Association or cooperative costs, "you are treated as having paid your proportionate
        share of any costs of such association or corporation"; fs-2025-01 p. 16, Residential Clean Energy Property Credit
        - General questions, "Rebates generally represent a reduction in the purchase price or cost of property, so the tax
        credit amount must be reduced by the amount of the rebate", "Generally, a taxpayer is not required to reduce the
        purchase price or cost of property acquired with a governmental energy-efficiency incentive unless that incentive
        qualifies as a rebate under federal income tax law"; fs-2025-01 p. 16, Residential Clean Energy Property Credit -
        General questions, "Financing costs such as interest, as well as other miscellaneous costs such as origination fees
        and the cost of an extended warranty, are not eligible expenditures"
  - id: f5695.line2
    printed: "2"
    label: Qualified solar water heating property costs
    type: NonNegDollars
    expr:
      op: input
      source: Qualified solar water heating property costs you paid for a home in the United States (it need not be your
        main home; at least half of the energy it uses to heat water must come from the sun, and it must be certified by
        the Solar Rating Certification Corporation or a comparable entity endorsed by your state), including labor (net of
        subsidies and rebates; see help; zero if none)
    cite:
      doc: i5695
      locator: p. 4, Line 2, "Enter the amounts you paid for qualified solar water heating property"; p. 2, Qualified solar
        water heating property costs, "if at least half of the energy used by the solar water heating property for such
        purpose is derived from the sun"
  - id: f5695.line3
    printed: "3"
    label: Qualified small wind energy property costs
    type: NonNegDollars
    expr:
      op: input
      source: Qualified small wind energy property costs you paid for a home in the United States (it need not be your main
        home), including labor (net of subsidies and rebates; see help; zero if none)
    cite:
      doc: i5695
      locator: p. 4, Line 3, "Enter the amounts you paid for qualified small wind energy property"; pp. 2-3, Qualified
        small wind energy property costs, "property that uses a wind turbine to generate electricity"
  - id: f5695.line4
    printed: "4"
    label: Qualified geothermal heat pump property costs
    type: NonNegDollars
    expr:
      op: input
      source: Qualified geothermal heat pump property costs you paid for a home in the United States (it need not be your
        main home; it must meet the Energy Star requirements in effect at the time of purchase), including labor (net of
        subsidies and rebates; see help; zero if none)
    cite:
      doc: i5695
      locator: p. 4, Line 4, "Enter the amounts you paid for qualified geothermal heat pump property"; p. 2, Qualified
        geothermal heat pump property costs, "must meet the requirements of the Energy Star program that are in effect at
        the time of purchase"
  - id: f5695.line5a
    printed: 5a
    label: Qualified battery storage technology. Does the qualified battery storage technology have a capacity of at least 3
      kilowatt hours? If you checked the No box, you cannot claim a credit for qualified battery storage technology
    type: Bool
    expr:
      op: input
      source: Did you pay in 2025 for battery storage technology installed in connection with your home in the United States
        that has a capacity of at least 3 kilowatt hours? (Answer No if you had none; a battery of less than 3 kilowatt hours
        cannot be claimed.)
    cite:
      doc: i5695
      locator: p. 4, Lines 5a and 5b, "To qualify for the credit, the qualified battery storage technology must have a
        capacity of at least 3 kilowatt hours"; p. 2, Qualified battery storage technology costs, "installed in connection
        with your home located in the United States"
    ambiguity: amb.2025.f5695_battery_second_home
  - id: f5695.battery_cost
    printed: (helper)
    label: Qualified battery storage technology costs
    type: NonNegDollars
    expr:
      op: input
      source: Qualified battery storage technology costs you paid (capacity of at least 3 kilowatt hours), including labor
        (net of subsidies and rebates; see help)
    cite:
      doc: i5695
      locator: p. 4, Lines 5a and 5b, "enter the amounts you paid for qualified battery storage technology on line 5b"
  - id: f5695.line5b
    printed: 5b
    label: If you checked the Yes box, enter the qualified battery technology costs
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f5695.line5a
          - const: true
        then: f5695.battery_cost
      - guard:
          op: test
          eq:
          - f5695.line5a
          - const: false
        then: f5695.zero
    cite:
      doc: i5695
      locator: p. 4, Lines 5a and 5b, "If you check the ... No ... box, you can't include any battery storage technology
        costs on line 5b"
  - id: f5695.line6a
    printed: 6a
    label: Add lines 1 through 5b
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f5695.line1
      - f5695.line2
      - f5695.line3
      - f5695.line4
      - f5695.line5b
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 6a
    refuses:
    - when: f5695.business_use
      form: Form 5695 for an item used less than 80% for nonbusiness purposes
      remedy: Allocating an item's cost between business and nonbusiness use is outside this tool.
      cite:
        doc: i5695
        locator: p. 1, Costs, "only that portion of the costs that is allocable to the nonbusiness use can be used to
          determine either credit"
    - when: f5695.construction_later
      form: Form 5695 Part I for a constructed or reconstructed home whose original use did not begin in 2025
      remedy: Costs of constructing or reconstructing a home are treated as paid when your original use of the home begins;
        a home first used in another year is outside this tool.
      cite:
        doc: i5695
        locator: p. 1, Costs, "costs connected with the construction of a home are treated as being paid when your original
          use of the constructed home begins"
  - id: f5695.rce_rate
    printed: (helper)
    label: Year parameter f5695.rce_rate (30%)
    type: Rate
    expr:
      op: param
      ref: f5695.rce_rate
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 6b, "Multiply line 6a by 30% (0.30)"
  - id: f5695.line6b
    printed: 6b
    label: Multiply line 6a by 30% (0.30)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f5695.line6a
      rate: f5695.rce_rate
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 6b
    ambiguity: amb.2025.multiplication_subcent
  - id: f5695.line7a
    printed: 7a
    label: Qualified fuel cell property. Was qualified fuel cell property installed on, or in connection with, your main home
      located in the United States?
    type: Bool
    expr:
      op: input
      source: Was qualified fuel cell property installed on, or in connection with, your main home located in the United
        States in 2025? (Answer No if you had none.)
    cite:
      doc: i5695
      locator: p. 4, Lines 7a Through 7c, "Any qualified fuel cell property costs must have been for your main home located
        in the United States"
  - id: f5695.line11
    printed: "11"
    label: Enter the smaller of line 9 or line 10
    type: NonNegDollars
    expr:
      op: copy
      from: f5695.zero
    cite:
      doc: f5695
      locator: Form 5695 (2025), lines 7a and 11, "If you checked the ... No ... box, you cannot claim a credit for qualified
        fuel cell property. Skip lines 7b through 11"
    note: Zero when line 7a is No, as the form directs; fuel cell property (lines 7b to 11) is refused.
    refuses:
    - when: f5695.line7a
      form: Form 5695 lines 7b to 11 (qualified fuel cell property)
      remedy: The credit for qualified fuel cell property (its capacity limit and the joint occupancy rule) is outside this
        tool.
      cite:
        doc: i5695
        locator: p. 4, Lines 7a Through 7c; p. 2, Qualified fuel cell property costs, "The credit amount for costs paid for
          qualified fuel cell property is limited to $500 for each one-half kilowatt of capacity of the property"
  - id: f5695.line12
    printed: "12"
    label: Credit carryforward from 2024. Enter the amount, if any, from your 2024 Form 5695, line 16
    type: NonNegDollars
    expr:
      op: input
      source: The residential clean energy credit carryforward from 2024, the amount on line 16 of your 2024 Form 5695
        (zero if none)
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 12; i5695 p. 1, Purpose of Form, "Also use Form 5695 to take any residential clean
        energy credit carryforward from 2024"
  - id: f5695.line13
    printed: "13"
    label: Add lines 6b, 11, and 12
    type: NonNegDollars
    expr:
      op: sum
      of:
      - f5695.line6b
      - f5695.line11
      - f5695.line12
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 13
  - id: f5695.claiming_part1
    printed: (helper)
    label: Claiming the residential clean energy credit (Part I is completed and line 13 is more than zero)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f5695.part1_any
        - const: true
      - op: test
        gt:
        - f5695.line13
        - param: sales.zero
    cite:
      doc: i1040s8812
      locator: p. 4, Credit Limit Worksheet A, "You are claiming one or more of the following credits", "Residential clean
        energy credit, Form 5695, Part I"
    ambiguity: amb.2025.clwb_claiming_part1
  - id: f5695.rce_ws1
    printed: (helper)
    label: Residential Clean Energy Credit Limit Worksheet, line 1. Enter the amount from Form 1040, line 18
    type: Dollars
    expr:
      op: copy
      from: f1040.line18
    cite:
      doc: i5695
      locator: p. 5, Residential Clean Energy Credit Limit Worksheet—Line 14, line 1, "Enter the amount from Form 1040,
        1040-SR, or 1040-NR, line 18"
  - id: f5695.ctc_line19
    printed: (helper)
    label: 'Form 1040, line 19, when Credit Limit Worksheet B is not completed: the smaller of Schedule 8812 line 12 and
      Credit Limit Worksheet A line 3 (line 4 of that worksheet being zero)'
    type: Dollars
    expr:
      op: smaller_of
      of:
      - s8812.line12
      - s8812.clw_a3
    cite:
      doc: i1040s8812
      locator: p. 4, Credit Limit Worksheet A, "If you are not completing Credit Limit Worksheet B, enter -0-"
    note: Form 1040 line 19 is Schedule 8812 line 14, the smaller of line 12 and line 13, and line 13 is Credit Limit
      Worksheet A line 3 less line 4. When Credit Limit Worksheet B is not completed line 4 is zero, so this is that
      amount, figured without reading line 4, which reads Schedule 3 line 5a.
  - id: f5695.ctc
    printed: (helper)
    label: Child tax credit or credit for other dependents, Form 1040, line 19, or Credit Limit Worksheet B, line 14 when
      the instructions for Schedule 8812 direct you to complete that worksheet
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s8812.clwb_complete
          - const: true
        then: s8812.clwb_14
      - guard:
          op: test
          eq:
          - s8812.clwb_complete
          - const: false
        then: f5695.ctc_line19
    cite:
      doc: i5695
      locator: p. 5, Residential Clean Energy Credit Limit Worksheet—Line 14, "Include the amount in the instructions for
        Schedule 8812 (Form 1040), Credit Limit Worksheet B, line 14, instead of the amount from Form 1040, 1040-SR, or
        1040-NR, line 19, if the instructions for Schedule 8812 (Form 1040) direct you to complete Credit Limit Worksheet B"
  - id: f5695.rce_ws2
    printed: (helper)
    label: 'Residential Clean Energy Credit Limit Worksheet, line 2. Schedule 3 lines 6l, 1, 2, 6d, 3 and 4, Form 5695 line
      32, Schedule 3 lines 6m and 6f, Form 1040 line 19 (or Credit Limit Worksheet B line 14), and Schedule 3 lines 6g, 6c
      and 6h; in this tool Schedule 3 lines 1, 2, 3 and 4, Form 5695 line 32 and the child tax credit, the others being
      refused'
    type: Dollars
    expr:
      op: sum
      of:
      - s3.line1
      - s3.line2
      - s3.line3
      - s3.line4
      - s3.line5b
      - f5695.ctc
    cite:
      doc: i5695
      locator: p. 5, Residential Clean Energy Credit Limit Worksheet—Line 14, line 2, "Enter the total of the following
        credit(s)/adjustment(s) if you are taking the credit(s)/adjustment(s) on your 2025 income tax return"
    note: Form 5695 line 32 is read as Schedule 3 line 5b, which is line 32 when Part II is completed and zero otherwise.
    refuses:
    - when: scope.credits
      form: Residential Clean Energy Credit Limit Worksheet, line 2 (Schedule 3 lines 6c, 6d, 6f, 6g, 6h, 6l and 6m)
      remedy: Credits other than the foreign tax credit, the dependent credits, the child and dependent care credit, the education credits, the saver's credit and the residential energy credits are
        outside this tool.
      cite:
        doc: i5695
        locator: p. 5, Residential Clean Energy Credit Limit Worksheet—Line 14, line 2
  - id: f5695.rce_ws3
    printed: (helper)
    label: Residential Clean Energy Credit Limit Worksheet, line 3. Subtract line 2 from line 1. If zero or less, enter -0-
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f5695.rce_ws1
      take: f5695.rce_ws2
    cite:
      doc: i5695
      locator: p. 5, Residential Clean Energy Credit Limit Worksheet—Line 14, line 3, "Subtract line 2 from line 1. Also
        enter this amount on Form 5695, line 14. If zero or less, enter -0- on Form 5695, lines 14 and 15"
  - id: f5695.line14
    printed: "14"
    label: Limitation based on tax liability. Enter the amount from the Residential Clean Energy Credit Limit Worksheet
    type: NonNegDollars
    expr:
      op: copy
      from: f5695.rce_ws3
    cite:
      doc: i5695
      locator: p. 4, Line 14, "Complete the following worksheet to figure the amount to enter on line 14"
  - id: f5695.line15
    printed: "15"
    label: Residential clean energy credit. Enter the smaller of line 13 or line 14. Also include this amount on Schedule 3
      (Form 1040), line 5a
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - f5695.line13
      - f5695.line14
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 15
  - id: f5695.line16
    printed: "16"
    label: Credit carryforward to 2026. If line 15 is less than line 13, subtract line 15 from line 13
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f5695.line13
      take: f5695.line15
    cite:
      doc: i5695
      locator: p. 5, Line 16, "If you can't use all of the credit because of the tax liability limit (that is, line 14 is
        less than line 13), you can carry the unused portion of the credit to 2026"
  # Part II, Section A
  - id: f5695.line17a
    printed: 17a
    label: Are the qualified energy efficiency improvements installed in or on your main home located in the United States?
    type: Bool
    expr:
      op: input
      source: Are qualified energy efficiency improvements (insulation or air sealing, exterior doors, exterior windows or
        skylights) installed in or on your main home located in the United States, a home you owned during 2025? (Answer
        No if you have none.)
    cite:
      doc: i5695
      locator: p. 5, Lines 17a Through 17e, "Line 17a. To qualify for the credit, any qualified energy efficiency
        improvements must have been for your main home located in the United States"; p. 3, Section A—Qualified Energy
        Efficiency Improvements, "installed on or in your main home that you owned during 2025 located in the United States"
  - id: f5695.line17b
    printed: 17b
    label: Are you the original user of the qualified energy efficiency improvements?
    type: Bool
    expr:
      op: input
      source: Are you the original user of the qualified energy efficiency improvements?
    cite:
      doc: i5695
      locator: p. 5, Lines 17a Through 17e, "Line 17b. To qualify for the credit, you must be the original user of the
        qualified energy efficiency improvements"
  - id: f5695.line17c
    printed: 17c
    label: Are the components reasonably expected to remain in use for at least 5 years?
    type: Bool
    expr:
      op: input
      source: Are the components reasonably expected to remain in use for at least 5 years on your main home?
    cite:
      doc: i5695
      locator: p. 5, Lines 17a Through 17e, "Line 17c. To qualify for the credit, the components must be reasonably
        expected to remain in use for at least 5 years on your main home located in the United States"
  - id: f5695.sec_a_claimed
    printed: (helper)
    label: Lines 17a, 17b and 17c are all Yes (Section A is completed)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f5695.line17a
        - const: true
      - op: test
        eq:
        - f5695.line17b
        - const: true
      - op: test
        eq:
        - f5695.line17c
        - const: true
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 17c, "If you checked the ... No ... box for line 17a, 17b, or 17c, you cannot claim
        the energy efficient home improvement credit. Do not complete Part II, Section A"
    ambiguity: amb.2025.f5695_17abc_section_a
  - id: f5695.line17e
    printed: 17e
    label: Were any of these improvements related to the construction of this main home?
    type: Bool
    expr:
      op: input
      source: Were any of these qualified energy efficiency improvements related to the construction of this main home (a
        new home, rather than an existing home or an addition to or renovation of one), even if they were made after you
        moved in?
    cite:
      doc: i5695
      locator: p. 5, Lines 17a Through 17e, "Line 17e. You cannot claim the credit for expenses related to the construction
        of a new home"
  - id: f5695.sec_a_new_home
    printed: (helper)
    label: Section A is completed and line 17e is Yes
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f5695.sec_a_claimed
        - const: true
      - op: test
        eq:
        - f5695.line17e
        - const: true
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 17e, "If you checked the ... Yes ... box, you can only claim the energy efficient home
        improvement credit for qualifying improvements that were not related to the construction of the home"
  - id: f5695.eehi_rate
    printed: (helper)
    label: Year parameter f5695.eehi_rate (30%)
    type: Rate
    expr:
      op: param
      ref: f5695.eehi_rate
    cite:
      doc: f5695
      locator: Form 5695 (2025), lines 18b, 19c, 19g, 20d, 22d, 23d, 24d, 25e, 26c and 29h, "Multiply ... by 30% (0.30)"
  - id: f5695.line18a
    printed: 18a
    label: Enter the cost of insulation material or system (include air sealing material or system) specifically and
      primarily designed to reduce heat loss or gain of your home that meets the criteria established by the IECC
    type: NonNegDollars
    expr:
      op: input
      source: The cost of insulation material or system (including air sealing material or system) specifically and
        primarily designed to reduce heat loss or gain of your home that meets the criteria established by the IECC, not
        counting labor (net of subsidies and rebates; see help; zero if none)
    cite:
      doc: i5695
      locator: p. 5, Lines 18a and 18b, "Line 18a. Enter the amounts you paid for any insulation material or air sealing
        material or system"; p. 5, Lines 18a and 18b, "Don't include on lines 18a, 19a, 19d, 19e, 20a, and 20b any amounts
        paid for the onsite preparation, assembly, or original installation of the components"; p. 3, Subsidized energy
        financing, "Any amounts provided for by subsidized energy financing can't be used to figure the energy efficient
        home improvement credit"; fs-2025-01 p. 11, Energy Efficient Home Improvement Credit - General questions, "Rebates
        generally represent a reduction in the purchase price or cost of property, so the tax credit amount must be reduced
        by the amount of the rebate", "A taxpayer may not claim a credit for the amount of the subsidy that is used to
        purchase or install qualifying property"; fs-2025-01 p. 12, Energy Efficient Home Improvement Credit - General
        questions, "Financing costs such as interest are not eligible expenditures for purposes of the credit"
  - id: f5695.ins_30
    printed: (helper)
    label: Line 18a multiplied by 30% (0.30)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f5695.line18a
      rate: f5695.eehi_rate
    cite:
      doc: f5695
      locator: Form 5695 (2025), line 18b, "Multiply line 18a by 30% (0.30)"
    ambiguity: amb.2025.multiplication_subcent
  - id: f5695.insulation_max
    printed: (helper)
