  - id: f5695.line5a
    printed: 5a
    label: Qualified battery storage technology. Does the qualified battery storage technology have a capacity of at least 3
      kilowatt hours? If you checked the No box, you cannot claim a credit for qualified battery storage technology
    type: Bool
    gated_by: f5695.line5a_if_any
    expr:
      op: input
      source: Did you (or, on a joint return, your spouse) have 2025 costs for battery storage technology installed in
        connection with your home in the United States that has a capacity of at least 3 kilowatt hours (including your
        proportionate share of such costs paid by a condominium management association or cooperative housing
        corporation)? A cost counts in 2025 when the original installation is completed in 2025, whenever it was paid;
        but a cost connected with constructing or reconstructing a home counts when your original use of that home
        begins (for example, a battery installed in 2024 in a newly built home you first lived in in 2025 counts in
        2025). A battery installed after 2025 does not qualify. (Answer No if there were none; a battery of less than 3
        kilowatt hours cannot be claimed.)
    cite:
      doc: i5695
      locator: p. 4, Lines 5a and 5b, "To qualify for the credit, the qualified battery storage technology must have a
        capacity of at least 3 kilowatt hours"; p. 2, Joint occupancy, "These rules don't apply to married individuals filing a joint return"; p. 2, Qualified battery storage technology costs, "installed in connection
        with your home located in the United States"; p. 1, Costs, "costs are treated as being paid when the original
        installation of the item is completed", "For purposes of the residential clean energy credit only, costs
        connected with the construction of a home are treated as being paid when your original use of the
        constructed home begins"; p. 2, Association or cooperative costs, "you are treated as having paid your
        proportionate share of any costs of such association or corporation"
