        capacity of at least 3 kilowatt hours"; p. 2, Joint occupancy, "These rules don't apply to married individuals filing a joint return"; p. 2, Qualified battery storage technology costs, "installed in connection
        with your home located in the United States"; p. 1, Costs, "costs are treated as being paid when the original
        installation of the item is completed", "For purposes of the residential clean energy credit only, costs
        connected with the construction of a home are treated as being paid when your original use of the
