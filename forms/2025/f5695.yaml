        Solar roofing tiles and solar roofing shingles qualify; structural components such as a roof's decking or rafters, which serve only a roofing or structural function, do not.

        Costs allocable to a swimming pool, hot tub or any other energy storage medium that has a function other than storage do not qualify
    cite:
      doc: i5695
      locator: p. 1, Home, "A home is where you lived in 2025"; p. 4, Line 1, "Enter the amounts you paid for qualified solar electric property"; p. 2, Joint occupancy, "These rules don't apply to married individuals filing a joint return"; p. 2, Qualified solar
        electric property costs, "The home doesn't have to be your main home"; p. 2, Caution, "If you received a subsidy
        from a public utility for the purchase or installation of an energy conservation product and that subsidy wasn't
        included in your gross income, you must reduce your cost for the product by the amount of that subsidy before you
        figure your credit"; p. 2, Qualified solar electric property costs, "These solar roofing tiles and solar roofing
        shingles can qualify for the credit. This is in contrast to structural components such as a roof's decking or rafters
        that serve only a roofing or structural function and thus do not qualify for the credit"; p. 2, Caution, "Costs allocable
