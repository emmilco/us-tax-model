form:
  id: f2441
  kind: form
  title: Form 2441 — Child and Dependent Care Expenses (Parts I to III)
  tax_year: 2025
  note: Part I (care providers, collection dcprov), Part II (the credit, with the line 10 Credit Limit Worksheet) and Part III
    (dependent care benefits from Form W-2 box 10). Qualifying persons are the dependent entries (dependent.dc_qp), their
    column (d) expenses asked per entry. Refused here or on the lines that read this form - married filing separately,
    line 9b (2024 expenses paid in 2025), deemed income for a student or disabled spouse or filer (and with it a disabled
    spouse as a qualifying person), a qualifying person who is not your dependent, a spouse who died in 2025, a qualifying
    person with no SSN, ITIN or ATIN, nontaxable combat pay, excluded foreign or possessions income, an ineligible related
    care provider, two dependent care plans with different maximums and benefits from your own sole proprietorship or
    partnership (sc.special, scope.schedule1). Schedule 3 line 2 and Form 1040 line 1e read lines 11 and 26.
  lines:
    - id: f2441.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f2441
        locator: Form 2441 (2025), lines 6, 9b, 20, 22 and 25
    - id: f2441.benefits
      printed: (helper)
      type: Bool
      label: Did you receive dependent care benefits?
      expr:
        op: input
        source: Did you (or your spouse, if filing jointly) receive dependent care benefits for 2025 — amounts shown in box
          10 of a Form W-2, or an amount from your 2024 dependent care plan that you used in 2025 during a grace period?
      cite:
        doc: f2441
        locator: Form 2441 (2025), Part I, "Did you receive dependent care benefits? No. Complete only Part II below. Yes.
          Complete Part III on page 2 next."; i2441 p. 1, Purpose of Form
    - id: f2441.care
      printed: (helper)
      type: Bool
      label: Did you pay for the care of a qualifying person so you could work or look for work?
      expr:
        op: input
        source: In 2025, did you (or your spouse, if filing jointly) pay for, or incur expenses for, the care of a qualifying
          person — your child under age 13, or a dependent or spouse who was not able to care for themselves — so that you
          (and your spouse) could work or look for work? Include 2024 care you paid for in 2025 and 2025 care you will pay
          for in 2026.
      cite:
        doc: i2441
        locator: 'p. 1, Purpose of Form, "If you paid someone to care for your child or other qualifying person so you (or your spouse if filing jointly) could work or look for work in 2025, you may be able to take the credit for child and dependent care expenses"'
    - id: f2441.filing
      printed: (helper)
      type: Bool
      label: You file Form 2441 (you have care expenses or dependent care benefits)
      expr:
        op: test
        any:
          - op: test
            eq:
              - f2441.care
              - const: true
          - op: test
            eq:
              - f2441.benefits
              - const: true
      cite:
        doc: i2441
        locator: 'p. 1, Purpose of Form, "In addition, if you (or your spouse if filing jointly) received any dependent care benefits for 2025, you must use Form 2441 to figure the amount, if any, of the benefits you can exclude from your income"'
    - id: f2441.student_disabled
      printed: (gate)
      type: Bool
      label: Were you or your spouse a full-time student or not able to care for yourselves in 2025?
      expr:
        op: input
        source: In 2025, were you (or your spouse, if filing jointly) a full-time student at a school for some part of each
          of 5 calendar months, or physically or mentally not able to care for yourself at any time? (This includes paying
          for the care of your spouse who was not able to care for themselves.)
      cite:
        doc: i2441
        locator: 'p. 4, If You or Your Spouse Was a Student or Disabled, "For each month or part of a month your spouse was a student or was disabled, they are considered to have worked and earned income" and "These rules for a spouse who was a student or disabled also apply to you if you were a student or disabled"; p. 1, Qualifying Person(s), "Your disabled spouse who wasn''t physically or mentally able to care for themselves and lived with you for more than half the year"'
    - id: f2441.spouse_died
      printed: (helper)
      type: Bool
      label: Did your spouse die in 2025?
      expr:
        op: input
        source: Did your spouse die in 2025?
      cite:
        doc: p503
        locator: 'p. 11, Surviving spouse, "If your spouse died during the year and you file a joint return as a surviving spouse, you may, but aren''t required to, take into account the earned income of your spouse who died during the year"'
    - id: f2441.spouse_died_gate
      printed: (gate)
      type: Bool
      label: Married filing jointly with a spouse who died in 2025
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1040.status
              - const: mfj
          - op: test
            eq:
              - f2441.spouse_died
              - const: true
      cite:
        doc: i2441
        locator: 'p. 4, Special Situations, "If your spouse died in 2025, see Pub. 503"'
    - id: f2441.nondependent
      printed: (helper)
      type: Bool
      label: Did you pay for the care of a qualifying person who is not your dependent?
      expr:
        op: input
        source: 'Did you pay for the care of a person who was not able to care for themselves, lived with you for more than
          half of 2025 and would be your dependent except that they had gross income of $5,200 or more, they filed a joint
          return, or you (or your spouse) could be claimed as a dependent on someone else''s 2025 return; or of your child
          under 13 (or not able to care for themselves) whom you treat as your qualifying person as the custodial parent
          although you cannot claim the child as your dependent?'
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "or could claim as a dependent except: a. The disabled person had gross income of $5,200 or more, b. The disabled person filed a joint return, or c. You (or your spouse if filing jointly) could be claimed as a dependent on another taxpayer''s 2025 tax return"; p. 1, Special rule for children of divorced or separated parents or parents who live apart, "Even if you can''t claim your child as a dependent, they are treated as your qualifying person if"'
    - id: f2441.nondependent_gate
      printed: (gate)
      type: Bool
      label: Care expenses for a qualifying person who is not your dependent
      expr:
        op: test
        all:
          - op: test
            eq:
              - f2441.care
              - const: true
          - op: test
            eq:
              - f2441.nondependent
              - const: true
      cite:
        doc: i2441
        locator: 'p. 1, Qualifying Person(s), "or could claim as a dependent except"'
    - id: f2441.provider_count
      printed: (helper)
      type: Count
      label: Number of care providers
      expr:
        op: sum_over
        collection: dcprov
        field: dcprov.one
      cite:
        doc: i2441
        locator: 'p. 2, Line 1, "Complete columns (a) through (e) for each person or organization that provided the care"'
    - id: f2441.related_count
      printed: (helper)
      type: Count
      label: Number of care providers to whom payments do not count
      expr:
        op: sum_over
        collection: dcprov
        field: dcprov.one
        where:
          op: test
          eq:
            - dcprov.related
            - const: true
      cite:
        doc: p503
        locator: 'p. 8, Payments to Relatives or Dependents, "However, don''t count any amounts you pay to"'
      ambiguity: amb.2025.dc_ineligible_providers
    - id: f2441.provider_ineligible
      printed: (gate)
      type: Bool
      label: A care provider is an ineligible related person
      expr:
        op: test
        gt:
          - f2441.related_count
          - const: 0
            type: Count
      cite:
        doc: i2441
        locator: 'p. 3, Due Diligence, "Don''t list an ineligible related individual as a care provider on line 1. No credit is allowed for any amount paid to your spouse, the parent of your qualifying child, or a person whom you can claim as a dependent"'
      ambiguity: amb.2025.dc_ineligible_providers
    - id: f2441.line1_box
      printed: 1 (box)
      type: Bool
      label: If you have more than three care providers, see the instructions and check this box
      expr:
        op: test
        all:
          - op: test
            eq:
              - f2441.filing
              - const: true
          - op: test
            gt:
              - f2441.provider_count
              - param: dc.providers_listed
      cite:
        doc: i2441
        locator: 'p. 2, Line 1, "If you have more than three care providers, check the box above line 1 and attach a statement to your return with the required information"'
    - id: f2441.statement_count
      printed: (helper)
      type: Count
      label: Number of care providers entered as "See Attached Statement"
      expr:
        op: sum_over
        collection: dcprov
        field: dcprov.one
        where:
          op: test
          eq:
            - dcprov.see_statement
            - const: true
      cite:
        doc: i2441
        locator: 'p. 3, Due Diligence, "Enter “See Attached Statement” in the columns for which you don''t have the information"'
    - id: f2441.statement_notice
      printed: (helper)
      type: Bool
      label: 'Attachment notice: a statement must be attached explaining that a care provider did not give you the information you requested'
      expr:
        op: test
        all:
          - op: test
            eq:
              - f2441.filing
              - const: true
          - op: test
            gt:
              - f2441.statement_count
              - const: 0
                type: Count
      cite:
        doc: i2441
        locator: 'p. 3, Due Diligence, "Then, attach a statement to your return explaining that the provider didn''t give you the information you requested"'
    - id: f2441.household_count
      printed: (helper)
      type: Count
      label: Number of care providers who were your household employees
      expr:
        op: sum_over
        collection: dcprov
        field: dcprov.one
        where:
          op: test
          eq:
            - dcprov.household
            - const: true
      cite:
        doc: i2441
        locator: 'p. 3, Column (d), "You must check either the "Yes" or "No" box in column (d)"'
    - id: f2441.household_notice
      printed: (helper)
      type: Bool
      label: 'Notice: a care provider was your household employee, so you may owe employment taxes (Schedule H, which this tool does not prepare)'
      expr:
        op: test
        all:
          - op: test
            eq:
              - f2441.filing
              - const: true
          - op: test
            gt:
              - f2441.household_count
              - const: 0
                type: Count
      cite:
        doc: f2441
        locator: Form 2441 (2025), Part I, "Caution. If the care provider is your household employee, you may owe employment
          taxes. For details, see the Instructions for Schedule H (Form 1040)."
    - id: f2441.provider_paid
      printed: (helper)
      type: NonNegDollars
      label: Total of column (e), the amounts paid to the care providers
      expr:
        op: sum_over
        collection: dcprov
        field: dcprov.paid
      cite:
        doc: i2441
        locator: 'p. 3, Column (e), "Enter the total amount you actually paid in 2025 to the care provider"'
    - id: f2441.line1_paid
      printed: (helper)
      type: NonNegDollars
      label: Amounts paid to the care providers listed on line 1, column (e)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f2441.filing
                - const: true
            then: f2441.provider_paid
          - guard:
              op: test
              eq:
                - f2441.filing
                - const: false
            then: f2441.zero
      cite:
        doc: i2441
        locator: 'p. 3, Column (e), "Enter the total amount you actually paid in 2025 to the care provider. Also, include amounts your employer paid to a third party on your behalf"'
    - id: f2441.qp_count
      printed: (helper)
      type: Count
      label: Number of qualifying persons
      expr:
        op: sum_over
        collection: dependent
        field: dependent.dc_count
        where:
          op: test
          eq:
            - dependent.dc_qp
            - const: true
      cite:
        doc: p503
        locator: 'p. 12, Yearly limit, "Use the $3,000 limit if you had one qualifying person at any time during the year. Use $6,000 if you had more than one qualifying person at any time during the year"'
      refuses:
        - when: f2441.nondependent_gate
          form: Qualifying person who is not your dependent (Form 2441)
          remedy: A qualifying person you cannot claim as a dependent (a person who would be your dependent but for their gross
            income, their joint return or your being claimable as a dependent, or a child you treat as your qualifying person
            as the custodial parent) is outside this tool.
          cite:
            doc: i2441
            locator: 'p. 1, Qualifying Person(s), "or could claim as a dependent except"; p. 1, Special rule for children of divorced or separated parents or parents who live apart, "Even if you can''t claim your child as a dependent, they are treated as your qualifying person if"'
    - id: f2441.line2_box
      printed: 2 (box)
      type: Bool
      label: If you have more than three qualifying persons, see the instructions and check this box
      display: The line 2 check box, shown on the values sheet; it changes no amount (attach a statement listing the other qualifying persons).
      expr:
        op: test
        gt:
          - f2441.qp_count
          - param: dc.providers_listed
      cite:
        doc: i2441
        locator: 'p. 3, Line 2, "If you have more than three qualifying persons, check the box on line 2 and attach a statement to your return with the required information"'
    - id: f2441.paid_total
      printed: (helper)
      type: NonNegDollars
      label: Total of the qualified expenses incurred and paid in 2025 for the qualifying persons (line 2, column (d), before
        excluding any benefits)
      expr:
        op: sum_over
        collection: dependent
        field: dependent.dc_line2d
        where:
          op: test
          eq:
            - dependent.dc_qp
            - const: true
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 3, "Add the amounts in column (d) of line 2"
      ambiguity: amb.2025.dc_line30
      refuses:
        - when: f2441.nondependent_gate
          form: Qualifying person who is not your dependent (Form 2441)
          remedy: A qualifying person you cannot claim as a dependent (a person who would be your dependent but for their gross
            income, their joint return or your being claimable as a dependent, or a child you treat as your qualifying person
            as the custodial parent) is outside this tool.
          cite:
            doc: i2441
            locator: 'p. 1, Qualifying Person(s), "or could claim as a dependent except"; p. 1, Special rule for children of divorced or separated parents or parents who live apart, "Even if you can''t claim your child as a dependent, they are treated as your qualifying person if"'
        - when: f2441.provider_ineligible
          form: Care provider who is an ineligible related person (Form 2441, line 1)
          remedy: Payments to a person you or your spouse can claim as a dependent, your child under 19, a person who was your
            spouse during 2025, or the parent of your qualifying child under 13 do not count, and such a provider may not be
            listed. Remove that provider and the payments to them, or prepare the form outside this tool.
          cite:
            doc: p503
            locator: 'p. 8, Payments to Relatives or Dependents, "However, don''t count any amounts you pay to"'
    - id: f2441.limit_one
      printed: (helper)
      type: NonNegDollars
      label: Year parameter dc.limit_one ($3,000)
      expr:
        op: param
        ref: dc.limit_one
      cite:
        doc: f2441
        locator: Form 2441 (2025), lines 3 and 27
    - id: f2441.limit_two
      printed: (helper)
      type: NonNegDollars
      label: Year parameter dc.limit_two ($6,000)
      expr:
        op: param
        ref: dc.limit_two
      cite:
        doc: f2441
        locator: Form 2441 (2025), lines 3 and 27
    - id: f2441.two_or_more
      printed: (helper)
      type: Bool
      label: You had two or more qualifying persons
      expr:
        op: test
        ge:
          - f2441.qp_count
          - param: dc.persons_two
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 3, "or $6,000 if you had two or more persons", and line 27
    - id: f2441.limit
      printed: (helper)
      type: NonNegDollars
      label: $3,000 if you had one qualifying person, $6,000 if you had two or more
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f2441.two_or_more
                - const: true
            then: f2441.limit_two
          - guard:
              op: test
              eq:
                - f2441.two_or_more
                - const: false
            then: f2441.limit_one
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 3, "Don’t enter more than $3,000 if you had one qualifying person or $6,000 if you
          had two or more persons", and line 27
    - id: f2441.line3_expenses
      printed: (helper)
      type: NonNegDollars
      label: Line 3 without Part III. Add the amounts in column (d) of line 2, not more than $3,000 for one qualifying person
        or $6,000 for two or more
      expr:
        op: smaller_of
        of:
          - f2441.paid_total
          - f2441.limit
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 3
    - id: f2441.line3
      printed: "3"
      type: NonNegDollars
      label: Add the amounts in column (d) of line 2. Don't enter more than $3,000 if you had one qualifying person or $6,000
        if you had two or more persons. If you completed Part III, enter the amount from line 31
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f2441.benefits
                - const: true
            then: f2441.line31
          - guard:
              op: test
              eq:
                - f2441.benefits
                - const: false
            then: f2441.line3_expenses
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 3
    - id: f2441.has_1e
      printed: (helper)
      type: Bool
      label: Form 1040 line 1e (taxable dependent care benefits) is more than zero
      expr:
        op: test
        gt:
          - f1040.line1e
          - param: sales.zero
      cite:
        doc: i2441
        locator: 'p. 4, Lines 4 and 5, "The amount shown on Form 1040, 1040-SR, or 1040-NR, line 1z"'
      ambiguity: amb.2025.dc_line1e_attribution
    - id: f2441.box10_persons
      printed: (helper)
      type: Count
      label: Number of persons on the return whose Forms W-2 show box 10
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
            - person.dc_has_box10
            - const: true
      cite:
        doc: i2441
        locator: 'p. 4, Lines 4 and 5, "If filing jointly, figure your and your spouse''s earned income separately"'
      ambiguity: amb.2025.dc_line1e_attribution
    - id: f2441.one_box10
      printed: (helper)
      type: Bool
      label: Exactly one person on the return has Forms W-2 showing box 10
      expr:
        op: test
        eq:
          - f2441.box10_persons
          - const: 1
            type: Count
      cite:
        doc: i2441
        locator: 'p. 4, Lines 4 and 5, "If filing jointly, figure your and your spouse''s earned income separately"'
      ambiguity: amb.2025.dc_line1e_attribution
    - id: f2441.attrib_gate
      printed: (gate)
      type: Bool
      label: On a joint return, line 1e is more than zero, it is not from the Forms W-2 of one spouse alone, and a credit remains
        (line 31 is more than zero)
      expr:
        op: test
        all:
          - op: test
            eq:
              - f2441.has_1e
              - const: true
          - op: test
            eq:
              - f1040.status
              - const: mfj
          - op: test
            eq:
              - f2441.one_box10
              - const: false
          - op: test
            gt:
              - f2441.line31
              - param: sales.zero
      cite:
        doc: i2441
        locator: 'p. 4, Lines 4 and 5, "If filing jointly, figure your and your spouse''s earned income separately. Enter your earned income on line 4 and your spouse''s earned income on line 5"'
      ambiguity: amb.2025.dc_line1e_attribution
    - id: f2441.line4
      printed: "4"
      type: Dollars
      label: Enter your earned income
      expr:
        op: sum_over
        collection: person
        field: person.dc_earned
        where:
          op: test
          eq:
            - person.role
            - const: taxpayer
      cite:
        doc: i2441
        locator: 'p. 4, Lines 4 and 5, "Enter your earned income on line 4 and your spouse''s earned income on line 5" and "You must reduce your earned income by any loss from self-employment"'
      ambiguity: amb.2025.dc_line1e_attribution
      refuses:
        - when: f2441.student_disabled
          form: Deemed earned income for a student or disabled spouse or filer (Form 2441, line B and lines 4, 5, 18 and 19)
          remedy: The deemed earned income of $250 or $500 a month for a full-time student or a person not able to care for
            themselves, and a disabled spouse as a qualifying person, are outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, If You or Your Spouse Was a Student or Disabled, "Their earned income for each month is considered to be at least $250 ($500 if you had two or more qualifying persons at any time during 2025)"'
        - when: s8812.combat_pay
          form: Nontaxable combat pay election (Form 2441, lines 4, 5, 18 and 19)
          remedy: Nontaxable combat pay is outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, Lines 4 and 5, "Nontaxable combat pay if you elect to include it in earned income"'
        - when: sa.excluded_income
          form: Earned income less excluded foreign earned income (Form 2441, lines 4, 5, 18 and 19; Forms 2555 and 4563)
          remedy: Excluded foreign earned income, foreign housing and possessions income are outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, Lines 4 and 5, "Excluded as foreign earned income (including any housing exclusion) on Form 2555, line 43"'
        - when: f2441.attrib_gate
          form: Taxable dependent care benefits of both spouses (Form 2441, lines 4 and 5)
          remedy: When Form 1040 line 1e is more than zero on a joint return, is not from the Forms W-2 of one spouse alone,
            and a credit remains, the split of line 1e between the spouses' earned income is not settled by the instructions
            and is outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, Lines 4 and 5, "If filing jointly, figure your and your spouse''s earned income separately"'
    - id: f2441.spouse_earned
      printed: (helper)
      type: Dollars
      label: Your spouse's earned income for line 5
      expr:
        op: sum_over
        collection: person
        field: person.dc_earned
        where:
          op: test
          eq:
            - person.role
            - const: spouse
      cite:
        doc: i2441
        locator: 'p. 4, Lines 4 and 5, "Enter your earned income on line 4 and your spouse''s earned income on line 5"'
      ambiguity: amb.2025.dc_line1e_attribution
    - id: f2441.line5
      printed: "5"
      type: Dollars
      label: If married filing jointly, enter your spouse's earned income (if you or your spouse was a student or was disabled,
        see the instructions); all others, enter the amount from line 4
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f2441.joint
                - const: true
            then: f2441.spouse_earned
          - guard:
              op: test
              eq:
                - f2441.joint
                - const: false
            then: f2441.line4
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 5
      refuses:
        - when: f2441.student_disabled
          form: Deemed earned income for a student or disabled spouse or filer (Form 2441, line B and lines 4, 5, 18 and 19)
          remedy: The deemed earned income of $250 or $500 a month for a full-time student or a person not able to care for
            themselves, and a disabled spouse as a qualifying person, are outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, If You or Your Spouse Was a Student or Disabled, "Their earned income for each month is considered to be at least $250 ($500 if you had two or more qualifying persons at any time during 2025)"'
        - when: s8812.combat_pay
          form: Nontaxable combat pay election (Form 2441, lines 4, 5, 18 and 19)
          remedy: Nontaxable combat pay is outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, Lines 4 and 5, "Nontaxable combat pay if you elect to include it in earned income"'
        - when: sa.excluded_income
          form: Earned income less excluded foreign earned income (Form 2441, lines 4, 5, 18 and 19; Forms 2555 and 4563)
          remedy: Excluded foreign earned income, foreign housing and possessions income are outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, Lines 4 and 5, "Excluded as foreign earned income (including any housing exclusion) on Form 2555, line 43"'
        - when: f2441.spouse_died_gate
          form: Earned income of a spouse who died in 2025 (Form 2441, lines 5 and 19)
          remedy: The surviving spouse's choice whether to take into account the earned income of a spouse who died in 2025 is
            outside this tool.
          cite:
            doc: p503
            locator: 'p. 11, Surviving spouse, "you may, but aren''t required to, take into account the earned income of your spouse who died during the year"'
        - when: f2441.attrib_gate
          form: Taxable dependent care benefits of both spouses (Form 2441, lines 4 and 5)
          remedy: When Form 1040 line 1e is more than zero on a joint return, is not from the Forms W-2 of one spouse alone,
            and a credit remains, the split of line 1e between the spouses' earned income is not settled by the instructions
            and is outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, Lines 4 and 5, "If filing jointly, figure your and your spouse''s earned income separately"'
    - id: f2441.joint
      printed: (helper)
      type: Bool
      label: Married filing jointly
      expr:
        op: test
        eq:
          - f1040.status
          - const: mfj
      cite:
        doc: i2441
        locator: 'p. 4, Lines 4 and 5, "If filing jointly, figure your and your spouse''s earned income separately"'
    - id: f2441.line6_34
      printed: (helper)
      type: Dollars
      label: The smaller of line 3 or line 4
      expr:
        op: smaller_of
        of:
          - f2441.line3
          - f2441.line4
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 6
    - id: f2441.line6_345
      printed: (helper)
      type: Dollars
      label: The smallest of line 3, 4, or 5
      expr:
        op: smaller_of
        of:
          - f2441.line6_34
          - f2441.line5
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 6
    - id: f2441.line6
      printed: "6"
      type: NonNegDollars
      label: Enter the smallest of line 3, 4, or 5. If zero or less, enter -0-
      expr:
        op: subtract_floor0
        from: f2441.line6_345
        take: f2441.zero
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 6
    - id: f2441.line7
      printed: "7"
      type: Dollars
      label: Enter the amount from Form 1040, 1040-SR, or 1040-NR, line 11a
      expr:
        op: copy
        from: f1040.line11a
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 7
    - id: f2441.line8
      printed: "8"
      type: Rate
      label: Enter on line 8 the decimal amount shown below that applies to the amount on line 7
      expr:
        op: rate_lookup
        table: dc_rate
        key: f2441.line7
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 8
      ambiguity: amb.2025.dc_rate_nonpositive_agi
    - id: f2441.line9a
      printed: 9a
      type: NonNegDollars
      label: Multiply line 6 by the decimal amount on line 8
      expr:
        op: multiply_rate
        amount: f2441.line6
        rate: f2441.line8
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 9a
    - id: f2441.line9b
      printed: 9b
      type: NonNegDollars
      label: If you paid 2024 expenses in 2025, complete Worksheet A in the instructions. Enter the amount from line 13 of the
        worksheet here. Otherwise, enter -0- on line 9b and go to line 9c
      expr:
        op: copy
        from: f2441.zero
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 9b
      refuses:
        - when: f2441.prior_year
          form: Form 2441 line 9b (Worksheet A, 2024 expenses paid in 2025)
          remedy: The credit for 2024 care expenses paid in 2025 is figured on Worksheet A from your 2024 return, which is outside
            this tool.
          cite:
            doc: i2441
            locator: 'p. 4, Line 9b, "If you had qualified expenses for 2024 that you didn''t pay until 2025 and you didn''t claim a credit on the maximum amount of qualified expenses for 2024, you may be able to increase the amount of the credit you can take in 2025"'
    - id: f2441.prior_year
      printed: (gate)
      type: Bool
      label: Did you pay in 2025 for care provided in 2024?
      expr:
        op: input
        source: Did you pay in 2025 any qualified expenses for care provided in 2024?
      cite:
        doc: i2441
        locator: 'p. 4, Line 9b, "If you had qualified expenses for 2024 that you didn''t pay until 2025"'
    - id: f2441.line9c
      printed: 9c
      type: NonNegDollars
      label: Add lines 9a and 9b and enter the result
      expr:
        op: sum
        of:
          - f2441.line9a
          - f2441.line9b
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 9c
    - id: f2441.clw1
      printed: CLW 1
      type: Dollars
      label: Enter the amount from Form 1040, 1040-SR, or 1040-NR, line 18
      expr:
        op: copy
        from: f1040.line18
      cite:
        doc: i2441
        locator: 'p. 5, Line 10 Credit Limit Worksheet, "Enter the amount from Form 1040, 1040-SR, or 1040-NR, line 18"'
    - id: f2441.clw2
      printed: CLW 2
      type: Dollars
      label: Enter the amount from Schedule 3 (Form 1040), line 1 (foreign tax credit) and line 6l (Form 8978, line 14)
      expr:
        op: copy
        from: s3.line1
      cite:
        doc: i2441
        locator: 'p. 5, Line 10 Credit Limit Worksheet, "Enter the amount from Schedule 3 (Form 1040), line 1 (foreign tax credit) and line 6l (Form 8978, line 14)"'
      note: Schedule 3 line 6l (Form 8978) is refused by the credits screen (scope.credits), so line 2 is line 1 alone.
    - id: f2441.clw3
      printed: CLW 3
      type: NonNegDollars
      label: Subtract line 2 from line 1. Also enter this amount on Form 2441, line 10. But if zero or less, stop; you can't
        take the credit
      expr:
        op: subtract_floor0
        from: f2441.clw1
        take: f2441.clw2
      cite:
        doc: i2441
        locator: 'p. 5, Line 10 Credit Limit Worksheet, "Subtract line 2 from line 1. Also enter this amount on Form 2441, line 10. But if zero or less, stop; you can’t take the credit"'
    - id: f2441.line10
      printed: "10"
      type: NonNegDollars
      label: Tax liability limit. Enter the amount from the Credit Limit Worksheet in the instructions
      expr:
        op: copy
        from: f2441.clw3
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 10
    - id: f2441.line11
      printed: "11"
      type: NonNegDollars
      label: Credit for child and dependent care expenses. Enter the smaller of line 9c or line 10 here and on Schedule 3 (Form
        1040), line 2
      expr:
        op: smaller_of
        of:
          - f2441.line9c
          - f2441.line10
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 11
      refuses: &mfs
        - when: s3.mfs
          form: Form 2441 for married filing separately (line A; lines 19 and 21)
          remedy: A married filing separately return (the credit only when considered unmarried, the exclusion at $2,500) is
            outside this tool. Married filing jointly is supported.
          cite:
            doc: i2441
            locator: 'p. 2, Married Persons Filing Separately, "Generally, married persons must file a joint return to claim the credit"'
    - id: f2441.line12
      printed: "12"
      type: NonNegDollars
      label: Enter the total amount of dependent care benefits you received in 2025. Amounts you received as an employee should
        be shown in box 10 of your Form(s) W-2. Don't include amounts reported as wages in box 1 of Form(s) W-2
      expr:
        op: sum_over
        collection: person
        field: person.dc_benefits
      cite:
        doc: i2441
        locator: 'p. 5, Line 12, "Enter the total amount of dependent care benefits you received in 2025"'
      note: Benefits from your own sole proprietorship or partnership are refused by the Schedule C screen (sc.special) and
        the Schedule 1 screen (scope.schedule1).
    - id: f2441.line13
      printed: "13"
      type: NonNegDollars
      label: Enter the amount, if any, you carried over from 2024 and used in 2025 during the grace period
      expr:
        op: input
        source: The amount, if any, your employer's dependent care plan let you carry forward from 2024 that you used in 2025
          during the plan's grace period; zero if none
      cite:
        doc: i2441
        locator: 'p. 5, Line 13, "Enter on line 13 the amount you carried forward and used in 2025 during the grace period"'
    - id: f2441.line14
      printed: "14"
      type: NonNegDollars
      label: Enter the amount, if any, you forfeited or carried forward to 2026
      expr:
        op: input
        source: Of the dependent care benefits on line 12, the total you forfeited (you did not receive it because you did not
          incur the expense) and the amount you did not receive but your employer lets you carry forward to use in 2026; do
          not include amounts you expect to receive later; zero if none
      cite:
        doc: i2441
        locator: 'p. 5, Line 14, "enter on line 14 the total of the following amounts included on line 12" and "Any amount you didn''t receive but are permitted by your employer to carry forward and use in the following year"'
    - id: f2441.line15_sum
      printed: (helper)
      type: NonNegDollars
      label: Add the amounts on lines 12 and 13
      expr:
        op: sum
        of:
          - f2441.line12
          - f2441.line13
      cite:
        doc: i2441
        locator: 'p. 5, Line 15, "Add the amounts on lines 12 and 13 and subtract from that total the amount on line 14"'
    - id: f2441.line14_bad
      printed: (gate)
      type: Bool
      label: Line 14 is more than line 12
      expr:
        op: test
        gt:
          - f2441.line14
          - f2441.line12
      cite:
        doc: i2441
        locator: 'p. 5, Line 14, "enter on line 14 the total of the following amounts included on line 12"'
    - id: f2441.line15
      printed: "15"
      type: Dollars
      label: Combine lines 12 through 14
      expr:
        op: subtract
        from: f2441.line15_sum
        take: f2441.line14
      cite:
        doc: i2441
        locator: 'p. 5, Line 15, "Add the amounts on lines 12 and 13 and subtract from that total the amount on line 14. Enter the result on line 15"'
      refuses:
        - when: f2441.line14_bad
          form: Form 2441 line 14 amounts
          remedy: The amounts forfeited or carried forward on line 14 are amounts included on line 12, so line 14 cannot be more
            than line 12. Check the amounts with your employer.
          cite:
            doc: i2441
            locator: 'p. 5, Line 14, "enter on line 14 the total of the following amounts included on line 12"'
    # The legacy input id is retained; line 16 is not limited to a payment year.
    - id: f2441.paid_2026
      printed: (helper)
      type: NonNegDollars
      label: Qualified care expenses incurred in 2025 not already counted in the per-person care amounts
      expr:
        op: input
        source: Qualified expenses incurred in 2025 for the care of your qualifying persons that are not already included
          in the care amounts you entered for each person. Include all such expenses, regardless of when they were
          paid or will be paid, including expenses still unpaid. Do not count any expense twice; zero if none
      cite:
        doc: i2441
        locator: 'p. 5, Line 16, "Enter the total of all qualified expenses incurred in 2025 for the care of your qualifying person(s). It doesn''t matter when the expenses were paid"'
    - id: f2441.line16
      printed: "16"
      type: NonNegDollars
      label: Enter the total amount of qualified expenses incurred in 2025 for the care of the qualifying person(s)
      expr:
        op: sum
        of:
          - f2441.paid_total
          - f2441.paid_2026
      cite:
        doc: i2441
        locator: 'p. 5, Line 16, "Enter the total of all qualified expenses incurred in 2025 for the care of your qualifying person(s). It doesn''t matter when the expenses were paid"'
    - id: f2441.line17
      printed: "17"
      type: Dollars
      label: Enter the smaller of line 15 or 16
      expr:
        op: smaller_of
        of:
          - f2441.line15
          - f2441.line16
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 17
    - id: f2441.line18
      printed: "18"
      type: Dollars
      label: Enter your earned income
      expr:
        op: sum_over
        collection: person
        field: person.dc_earned_b
        where:
          op: test
          eq:
            - person.role
            - const: taxpayer
      cite:
        doc: i2441
        locator: 'p. 5, Line 18, "Enter your earned income on line 18 and your spouse''s earned income on line 19"'
      refuses:
        - when: f2441.student_disabled
          form: Deemed earned income for a student or disabled spouse or filer (Form 2441, line B and lines 4, 5, 18 and 19)
          remedy: The deemed earned income of $250 or $500 a month for a full-time student or a person not able to care for
            themselves, and a disabled spouse as a qualifying person, are outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, If You or Your Spouse Was a Student or Disabled, "Their earned income for each month is considered to be at least $250 ($500 if you had two or more qualifying persons at any time during 2025)"'
        - when: s8812.combat_pay
          form: Nontaxable combat pay election (Form 2441, lines 4, 5, 18 and 19)
          remedy: Nontaxable combat pay is outside this tool.
          cite:
            doc: i2441
            locator: 'p. 5, Line 18, "You can elect to include your nontaxable combat pay in earned income when figuring your exclusion or deduction"'
        - when: sa.excluded_income
          form: Earned income less excluded foreign earned income (Form 2441, lines 4, 5, 18 and 19; Forms 2555 and 4563)
          remedy: Excluded foreign earned income, foreign housing and possessions income are outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, Lines 4 and 5, "Excluded as foreign earned income (including any housing exclusion) on Form 2555, line 43"'
    - id: f2441.spouse_earned_b
      printed: (helper)
      type: Dollars
      label: Your spouse's earned income for line 19
      expr:
        op: sum_over
        collection: person
        field: person.dc_earned_b
        where:
          op: test
          eq:
            - person.role
            - const: spouse
      cite:
        doc: i2441
        locator: 'p. 5, Line 18, "Enter your earned income on line 18 and your spouse''s earned income on line 19"'
    - id: f2441.line19
      printed: "19"
      type: Dollars
      label: If married filing jointly, enter your spouse's earned income (if you or your spouse was a student or was disabled,
        see the instructions for line 5). If married filing separately, see instructions. All others, enter the amount from
        line 18
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f2441.joint
                - const: true
            then: f2441.spouse_earned_b
          - guard:
              op: test
              eq:
                - f2441.joint
                - const: false
            then: f2441.line18
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 19
      refuses:
        - when: f2441.student_disabled
          form: Deemed earned income for a student or disabled spouse or filer (Form 2441, line B and lines 4, 5, 18 and 19)
          remedy: The deemed earned income of $250 or $500 a month for a full-time student or a person not able to care for
            themselves, and a disabled spouse as a qualifying person, are outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, If You or Your Spouse Was a Student or Disabled, "Their earned income for each month is considered to be at least $250 ($500 if you had two or more qualifying persons at any time during 2025)"'
        - when: s8812.combat_pay
          form: Nontaxable combat pay election (Form 2441, lines 4, 5, 18 and 19)
          remedy: Nontaxable combat pay is outside this tool.
          cite:
            doc: i2441
            locator: 'p. 5, Line 18, "You can elect to include your nontaxable combat pay in earned income when figuring your exclusion or deduction"'
        - when: sa.excluded_income
          form: Earned income less excluded foreign earned income (Form 2441, lines 4, 5, 18 and 19; Forms 2555 and 4563)
          remedy: Excluded foreign earned income, foreign housing and possessions income are outside this tool.
          cite:
            doc: i2441
            locator: 'p. 4, Lines 4 and 5, "Excluded as foreign earned income (including any housing exclusion) on Form 2555, line 43"'
        - when: f2441.spouse_died_gate
          form: Earned income of a spouse who died in 2025 (Form 2441, lines 5 and 19)
          remedy: The surviving spouse's choice whether to take into account the earned income of a spouse who died in 2025 is
            outside this tool.
          cite:
            doc: p503
            locator: 'p. 11, Surviving spouse, "you may, but aren''t required to, take into account the earned income of your spouse who died during the year"'
    - id: f2441.line20_17_18
      printed: (helper)
      type: Dollars
      label: The smaller of line 17 or line 18
      expr:
        op: smaller_of
        of:
          - f2441.line17
          - f2441.line18
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 20
    - id: f2441.line20_all
      printed: (helper)
      type: Dollars
      label: The smallest of line 17, 18, or 19
      expr:
        op: smaller_of
        of:
          - f2441.line20_17_18
          - f2441.line19
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 20
    - id: f2441.line20
      printed: "20"
      type: NonNegDollars
      label: Enter the smallest of line 17, 18, or 19. If zero or less, enter -0-
      expr:
        op: subtract_floor0
        from: f2441.line20_all
        take: f2441.zero
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 20
    - id: f2441.plans_differ
      printed: (gate)
      type: Bool
      label: Were you (or your spouse) covered by two or more dependent care plans that allow different maximum amounts to be
        excluded?
      expr:
        op: input
        source: Were you (or your spouse, if filing jointly) covered in 2025 by two or more dependent care plans that allow different
          maximum amounts to be excluded?
      cite:
        doc: i2441
        locator: 'p. 5, Line 21, "Enter on line 21 the maximum amount that you may exclude for the year under your dependent care plan"'
      ambiguity: amb.2025.dc_plan_maximum
    - id: f2441.employer_care
      printed: (gate)
      type: Bool
      label: Did your employer furnish the care itself (at your workplace or by hiring a care provider)?
      expr:
        op: input
        source: Did your employer furnish dependent care to you itself, at your workplace or by hiring a care provider (rather
          than paying you, or a provider you chose, for care you arranged)?
      cite:
        doc: i2441
        locator: 'p. 3, Columns (a) and (b), "If you were covered by your employer''s dependent care plan and your employer furnished
          the care (either at your workplace or by hiring a care provider), enter your employer''s name in column (a)"'
    - id: f2441.employer_care_gate
      printed: (gate)
      type: Bool
      label: Your employer furnished the care and you also paid qualified expenses
      expr:
        op: test
        all:
          - op: test
            eq:
              - f2441.employer_care
              - const: true
          - op: test
            gt:
              - f2441.paid_total
              - f2441.zero
      cite:
        doc: i2441
        locator: 'p. 3, Columns (a) and (b), "enter your employer''s name in column (a)"'
    - id: f2441.plan_max
      printed: (helper)
      type: NonNegDollars
      label: The maximum amount your dependent care plan allows to be excluded for 2025
      expr:
        op: input
        source: The maximum amount your dependent care plan (or plans, if they all allow the same maximum) allows you to exclude
          for 2025; enter $5,000 if the plan allows $5,000 or more, or if you do not know of a lower plan maximum
      cite:
        doc: i2441
        locator: 'p. 5, Line 21, "Don''t enter more than the maximum amount allowed under your dependent care plan. For example, if your dependent care plan only allows a maximum of $4,000 to be excluded, substitute $4,000 for the $5,000 amount to enter on line 21"'
      ambiguity: amb.2025.dc_plan_maximum
    - id: f2441.exclusion_max
      printed: (helper)
      type: NonNegDollars
      label: Year parameter dc.exclusion_max ($5,000)
      expr:
        op: param
        ref: dc.exclusion_max
      cite:
        doc: i2441
        locator: 'p. 5, Line 21, "For 2025, the maximum amount that can be excluded from your income through a dependent care assistance program is $5,000"'
    - id: f2441.line21
      printed: "21"
      type: NonNegDollars
      label: Enter $5,000 ($2,500 if married filing separately and you were required to enter your spouse's earned income on
        line 19). However, don't enter more than the maximum amount allowed under your dependent care plan
      expr:
        op: smaller_of
        of:
          - f2441.exclusion_max
          - f2441.plan_max
      cite:
        doc: i2441
        locator: 'p. 5, Line 21, "Enter on line 21 the maximum amount that you may exclude for the year under your dependent care plan" and "Don''t enter more than the maximum amount allowed under your dependent care plan"'
      ambiguity: amb.2025.dc_plan_maximum
      refuses:
        - when: f2441.plans_differ
          form: Two or more dependent care plans with different maximums (Form 2441, line 21)
          remedy: The instructions speak of one plan's maximum; which maximum line 21 takes when your plans allow different amounts
            is not settled there and is outside this tool.
          cite:
            doc: i2441
            locator: 'p. 5, Line 21, "Don''t enter more than the maximum amount allowed under your dependent care plan"'
    - id: f2441.line22
      printed: "22"
      type: NonNegDollars
      label: Is any amount on line 12 or 13 from your sole proprietorship or partnership? No. Enter -0-. Yes. Enter the amount
        here
      expr:
        op: copy
        from: f2441.zero
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 22
      note: Benefits from your own sole proprietorship (Schedule C, sc.special) or partnership (Schedule K-1, scope.schedule1)
        are refused, so the answer is No and line 22 is zero.
    - id: f2441.line23
      printed: "23"
      type: Dollars
      label: Subtract line 22 from line 15
      expr:
        op: subtract
        from: f2441.line15
        take: f2441.line22
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 23
    - id: f2441.line24_20_21
      printed: (helper)
      type: NonNegDollars
      label: The smaller of line 20 or line 21
      expr:
        op: smaller_of
        of:
          - f2441.line20
          - f2441.line21
      cite:
        doc: f2441
        locator: Form 2441 (2025), lines 24 and 25
    - id: f2441.line24
      printed: "24"
      type: NonNegDollars
      label: Deductible benefits. Enter the smallest of line 20, 21, or 22. Also, include this amount on the appropriate line(s)
        of your return
      expr:
        op: smaller_of
        of:
          - f2441.line24_20_21
          - f2441.line22
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 24
    - id: f2441.line25
      printed: "25"
      type: NonNegDollars
      label: Excluded benefits. If you checked "No" on line 22, enter the smaller of line 20 or line 21. Otherwise, subtract line
        24 from the smaller of line 20 or line 21. If zero or less, enter -0-
      expr:
        op: subtract_floor0
        from: f2441.line24_20_21
        take: f2441.line24
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 25
      note: With "No" on line 22, line 24 is zero, so the subtraction gives the smaller of lines 20 and 21 as the "No" branch
        directs.
    - id: f2441.line26
      printed: "26"
      type: NonNegDollars
      label: Taxable benefits. Subtract line 25 from line 23. If zero or less, enter -0-. Also, enter this amount on Form 1040,
        1040-SR, or 1040-NR, line 1e
      expr:
        op: subtract_floor0
        from: f2441.line23
        take: f2441.line25
      cite:
        doc: i2441
        locator: 'p. 6, Line 26, "If line 26 is more than zero, you have taxable dependent care benefits. Enter this amount on Form 1040, 1040-SR, or 1040-NR, line 1e"'
      refuses: *mfs
    - id: f2441.line27
      printed: "27"
      type: NonNegDollars
      label: Enter $3,000 ($6,000 if two or more qualifying persons)
      expr:
        op: copy
        from: f2441.limit
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 27
    - id: f2441.line28
      printed: "28"
      type: NonNegDollars
      label: Add lines 24 and 25
      expr:
        op: sum
        of:
          - f2441.line24
          - f2441.line25
      cite:
        doc: f2441
        locator: Form 2441 (2025), line 28
    - id: f2441.line29
      printed: "29"
      type: NonNegDollars
      label: Subtract line 28 from line 27. If zero or less, stop. You can't take the credit. Exception. If you paid 2024 expenses
        in 2025, see the instructions for line 9b
      expr:
        op: subtract_floor0
        from: f2441.line27
        take: f2441.line28
