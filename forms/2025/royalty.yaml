form:
  id: royalty
  kind: form
  title: Schedule E, Part I — one royalty property
  tax_year: 2025
  note: 'One entry per royalty source (Schedule E type 6). Royalties are not passive and never go on Form 8582. Refused: royalties
    from the filer''s own business or services or a working interest, a patent transfer or coal or iron ore, car and travel
    costs, depreciation, depletion, and a loss with amounts not at risk.'
  lines:
  - id: royalty.zero
    printed: (helper)
    label: Zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040se
      locator: p. 3, Line 4
  - id: royalty.one
    printed: (helper)
    label: One
    type: Count
    expr:
      op: param
      ref: rental.one
    cite:
      doc: i1040se
      locator: p. 5, Line 1a
  - id: royalty.line4
    printed: '4'
    label: Royalties received
    type: NonNegDollars
    expr:
      op: input
      source: Royalties from it in 2025 before any taxes the payer withheld (Form 1099-MISC box 2), your share
    cite:
      doc: i1040se
      locator: 'p. 6, Line 4, "Report on line 4 royalties from oil, gas, or mineral properties (not including operating interests)"'
  - id: royalty.business
    printed: (helper)
    label: Royalty from the filer's own business or services (a self-employed writer, artist, inventor or other creator, or
      name, image and likeness income from sponsorships or services), or from an operating (working) interest in minerals
    type: Bool
    expr:
      op: input
      source: Did it come from your own business or services (as a self-employed writer, artist, musician, inventor or other
        creator, or name, image and likeness income from sponsorships or services), or from an operating (working) interest
        in oil, gas or other minerals?
    cite:
      doc: i1040se
      locator: p. 6, Line 4, "If you are in business as a self-employed writer, inventor, artist, etc., report your royalty
        income and expenses on Schedule C", "Report on line 4 royalties from oil, gas, or mineral properties (not including
        operating interests)", and "If your NIL income is derived from business activities such as sponsorship deals or
        service income, report your income and expenses on Schedule C"
  - id: royalty.depletion
    printed: (helper)
    label: Depletion claimed
    type: Bool
    expr:
      op: input
      source: Do you claim depletion for it (oil, gas or minerals)?
    cite:
      doc: i1040se
      locator: p. 6, Line 18, "Depletion"
  - id: royalty.capital
    printed: (helper)
    label: Payment for a transferred patent, or for coal or iron ore disposed of, that may be a sale of a capital asset
    type: Bool
    expr:
      op: input
      source: Is it a payment for a patent you transferred, or for coal or iron ore you disposed of?
    cite:
      doc: i1040se
      locator: p. 6, "You may be able to treat amounts received as 'royalties' for the transfer of a patent or amounts received
        on the disposal of coal and iron ore as the sale of a capital asset"
  - id: royalty.vehicle
    printed: (helper)
    label: Car, truck or travel expenses for the royalty (line 6)
    type: Bool
    expr:
      op: input
      source: Do you have car, truck or travel costs for it?
    cite:
      doc: i1040se
      locator: p. 4, Line 6
  - id: royalty.depreciation
    printed: (helper)
    label: Depreciation or amortization for the royalty (line 18)
    type: Bool
    expr:
      op: input
      source: Do you depreciate or amortize anything for it, such as a copyright or patent you bought?
    cite:
      doc: f1040se
      locator: Schedule E (2025), line 18, "Depreciation expense or depletion"
  - id: royalty.expenses_any
    printed: (helper)
    label: Any expenses for this royalty
    type: Bool
    expr:
      op: input
      source: Did you pay costs for it, or were any taken out of your payments (such as fees, severance or production taxes,
        or production costs)?
    cite:
      doc: i1040se
      locator: p. 6, General Instructions for Lines 5 Through 21
  - id: royalty.amt10
    printed: (helper)
    label: Legal and other professional fees paid in 2025
    type: NonNegDollars
    gated_by: royalty.line10
    expr:
      op: input
      source: Legal and other professional fees for it, paid in 2025; zero if none
    cite: &id001
      doc: i1040se
      locator: p. 6, Line 10
  - id: royalty.line10
    printed: '10'
    label: Legal and other professional fees
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - royalty.expenses_any
          - const: true
        then: royalty.amt10
      - guard:
          op: test
          eq:
          - royalty.expenses_any
          - const: false
        then: royalty.zero
    cite: *id001
  - id: royalty.amt16
    printed: (helper)
    label: Taxes paid in 2025
    type: NonNegDollars
    gated_by: royalty.line16
    expr:
      op: input
      source: Taxes on it paid in 2025, such as severance or production taxes, including any the payer withheld; zero if none
    cite: &id002
      doc: i1040se
      locator: p. 6, Line 16
  - id: royalty.line16
    printed: '16'
    label: Taxes
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - royalty.expenses_any
          - const: true
        then: royalty.amt16
      - guard:
          op: test
          eq:
          - royalty.expenses_any
          - const: false
        then: royalty.zero
    cite: *id002
  - id: royalty.amt19
    printed: (helper)
    label: Other paid in 2025
    type: NonNegDollars
    gated_by: royalty.line19
    expr:
      op: input
      source: Other costs of it (not depletion), paid in 2025, or taken out of your payments if the royalties you entered
        are before they were taken out; zero if none
    cite: &id003
      doc: i1040se
      locator: p. 6, Line 19
  - id: royalty.line19
    printed: '19'
    label: Other
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - royalty.expenses_any
          - const: true
        then: royalty.amt19
      - guard:
          op: test
          eq:
          - royalty.expenses_any
          - const: false
        then: royalty.zero
    cite:
      doc: i1040se
      locator: 'p. 7, Line 19, "Enter on line 19 any ordinary and necessary expenses not listed on lines 5 through 18"'
  - id: royalty.line20
    printed: '20'
    label: Total expenses. Add lines 5 through 19
    type: NonNegDollars
    expr:
      op: sum
      of:
      - royalty.line10
      - royalty.line16
      - royalty.line19
    cite:
      doc: f1040se
      locator: Schedule E (2025), line 20
  - id: royalty.line21
    printed: '21'
    label: Subtract line 20 from line 4 (royalties)
    type: Dollars
    expr:
      op: subtract
      from: royalty.line4
      take: royalty.line20
    cite:
      doc: f1040se
      locator: 'Schedule E (2025), line 21; i1040se p. 7, Line 21, "If you have amounts for which you are not at risk, use Form 6198 to determine the amount of your deductible loss"'
    refuses:
    - when: royalty.business
      form: Schedule C (royalties from your own trade or business)
      remedy: Royalties from your own business or services (as a self-employed writer, artist, inventor or other creator,
        or name, image and likeness income from sponsorships or services), or from a working interest, are reported on
        Schedule C; this tool does not prepare them on Schedule E.
      cite:
        doc: i1040se
        locator: p. 6, Line 4, "If you are in business as a self-employed writer, inventor, artist, etc., report your royalty
          income and expenses on Schedule C"
    - when: royalty.depletion
      form: Schedule E, line 18 (depletion)
      remedy: Depletion is outside this tool.
      cite:
        doc: i1040se
        locator: p. 6, Line 18, "Depletion"
    - when: royalty.capital
      form: Form 4797 or Schedule D (patent transfer, or coal or iron ore)
      remedy: Royalties that may be treated as the sale of a capital asset (from a patent you transferred, or coal or iron
        ore you disposed of) are outside this tool.
      cite:
        doc: i1040se
        locator: p. 6, "You may be able to treat amounts received as 'royalties' for the transfer of a patent or amounts
          received on the disposal of coal and iron ore as the sale of a capital asset"
    - when: royalty.vehicle
      form: Schedule E, line 6 (auto and travel)
      remedy: Car, truck and travel costs of a royalty are outside this tool.
      cite:
        doc: i1040se
        locator: p. 4, Line 6
    - when: royalty.depreciation
      form: Schedule E, line 18 (depreciation)
      remedy: Depreciation or amortization for a royalty is outside this tool.
      cite:
        doc: f1040se
        locator: Schedule E (2025), line 18, "Depreciation expense or depletion"
  - id: royalty.income
    printed: (helper)
    label: Royalty income (positive line 21)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: royalty.line21
      take: royalty.zero
    cite:
      doc: f1040se
      locator: Schedule E (2025), line 24, "Add positive amounts shown on line 21"
  - id: royalty.loss
    printed: (helper)
    label: Royalty loss (negative line 21)
    type: Dollars
    expr:
      op: subtract
      from: royalty.zero
      take: royalty.loss_abs
    cite:
      doc: f1040se
      locator: Schedule E (2025), line 25, "Add royalty losses from line 21"
  - id: royalty.loss_abs
    printed: (helper)
    label: Royalty loss as a positive amount
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: royalty.zero
      take: royalty.line21
    cite:
      doc: f1040se
      locator: Schedule E (2025), line 25, "Add royalty losses from line 21"
    refuses:
    - when: royalty.not_at_risk_if_loss
      form: Form 6198 (at-risk limits)
      remedy: A royalty loss with an amount not at risk is outside this tool.
      cite:
        doc: i1040se
        locator: p. 3, At-Risk Rules
  - id: royalty.has_loss
    printed: (helper)
    label: Line 21 is a loss
    type: Bool
    expr:
      op: test
      lt:
      - royalty.line21
      - const: 0
    cite:
      doc: i1040se
      locator: p. 7, Line 21
  - id: royalty.no
    printed: (helper)
    label: No (false)
    type: Bool
    expr:
      op: param
      ref: household.no
    cite:
      doc: i1040se
      locator: p. 7, Line 21
  - id: royalty.not_at_risk
    printed: (helper)
    label: Some investment not at risk
    type: Bool
    gated_by: royalty.not_at_risk_if_loss
    expr:
      op: input
      source: Was any money you put in borrowed without personal liability from anyone but a bank or regular lender,
        protected from loss by a guarantee or stop-loss agreement, or lent by someone with a stake in it?
    cite:
      doc: i1040se
      locator: p. 3, At-Risk Rules, "In most cases, you must complete Form 6198 to figure your loss if you have"
  - id: royalty.not_at_risk_if_loss
    printed: (gate)
    label: Asked only when the royalty has a loss (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - royalty.has_loss
          - const: true
        then: royalty.not_at_risk
      - guard:
          op: test
          eq:
          - royalty.has_loss
          - const: false
        then: royalty.no
    cite:
      doc: i1040se
      locator: p. 7, Line 21, "If you have amounts for which you are not at risk, use Form 6198 to determine the amount of
        your deductible loss"
  collection:
    cite:
      doc: i1040se
      locator: p. 3, Line 4
