form:
  id: s1
  kind: form
  title: Schedule 1 — Additional Income and Adjustments to Income (the lines this tool computes)
  tax_year: 2025
  note: Lines 1, 2a, 3, 7, 8b, 8c, 8f, 8g to 8j, 8r, 8z, 9, 10, 11, 13, 15 to 21, 24a, 25 and 26 (lines 2b, 19b and 19c are
    written on the form by hand, with a notice on the values sheet). Every other Schedule 1 item is refused by
    scope.schedule1 at Form 1040 lines 8 and 10, or by s1.line8_other at line 9.
  lines:
  - id: s1.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), lines 7, 11, 21
  - id: s1.line1
    printed: '1'
    label: Taxable refunds, credits, or offsets of state and local income taxes
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.has
          - const: false
        then: s1.zero
      - guard:
          op: test
          eq:
          - refund.has
          - const: true
        then: refund.taxable
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 1; i1040gi p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line
        9, "Enter the smaller of line 3 or line 8 here and on Schedule 1, line 1"
  - id: s1.uc_any
    printed: (helper)
    type: Bool
    label: "Did you (or, on a joint return, your spouse) receive unemployment compensation in 2025, counting benefits from a governmental paid family leave program, partial benefits and trade readjustment allowances?"
    expr:
      op: input
      source: "Did you (or, on a joint return, your spouse) receive unemployment compensation in 2025, counting benefits from a governmental paid family leave program, partial benefits and trade readjustment allowances?"
    cite:
      doc: i1040gi
      locator: 'p. 89, Schedule 1, line 7; f1099g p. 5, Instructions for Recipient, Box 1, "If you made contributions to a governmental UC program or to a governmental paid family leave program and received a payment from that program, the payer must issue a separate Form 1099-G to report this amount to you", "Combine the box 1 amounts from all Forms 1099-G and report the total as income on the UC line of your tax return"; p525 p. 29, Types of unemployment compensation, "Trade readjustment allowances under the Trade Act of 1974"; rr-2025-4 p. 27, Holdings, "(3) Amounts paid to the employee by the State as family leave benefits pursuant to the State’s PFML statute are included in the Federal gross income of the employee under § 61"'
    ambiguity: amb.2025.pfml_benefits_contributions
  - id: s1.uc_paid
    printed: (helper)
    label: Unemployment compensation paid to you in 2025
    type: NonNegDollars
    gated_by: s1.uc_paid_if_any
    expr:
      op: input
      source: 'Unemployment compensation paid to you (or, on a joint return, your spouse) in 2025: the total of box 1 of
        your (or, on a joint return, your spouse''s) Forms 1099-G, including a separate Form 1099-G for benefits from a governmental paid family leave program (if box 1 is wrong, the amount actually paid)'
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7, 'You should receive a Form 1099-G showing in box 1 the total unemployment compensation
        paid to you in 2025' and 'If the amount reported in box 1 of your Form(s) 1099-G is incorrect, report on line 7 only
        the actual amount'
  - id: s1.uc_paid_if_any
    printed: (gate)
    type: NonNegDollars
    label: "Unemployment compensation paid in 2025, asked only when unemployment compensation was received (zero otherwise)"
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.uc_any
          - const: true
        then: s1.uc_paid
      - guard:
          op: test
          eq:
          - s1.uc_any
          - const: false
        then: s1.zero
    cite:
      doc: i1040gi
      locator: "p. 89, Schedule 1, line 7"
  - id: s1.has_uc
    printed: (helper)
    label: Any unemployment compensation
    type: Bool
    expr:
      op: test
      gt:
      - s1.uc_paid_if_any
      - param: sales.zero
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7
  - id: s1.uc_repaid
    printed: (helper)
    label: Amount of a 2025 overpayment of unemployment compensation you repaid in 2025
    type: NonNegDollars
    expr:
      op: input
      source: Amount you (or, on a joint return, your spouse) repaid in 2025 of an overpayment of unemployment compensation
        received in 2025 (zero if none)
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7, 'If you received an overpayment of unemployment compensation in 2025, subtract the
        amount you repaid from the total amount you received'
  - id: s1.uc_unsupported
    printed: (helper)
    label: Did you (or, on a joint return, your spouse), in 2025 or any earlier year, make contributions to a governmental unemployment compensation program (including
      amounts withheld from your wages for it, and payments you made yourself, such as for coverage you elected as a self-employed
      person; not counting tax an employer paid on your wages, paid family leave or disability insurance contributions), or
      repay in 2025 any unemployment compensation you included in income in an earlier year?
    type: Bool
    expr:
      op: input
      source: Did you (or, on a joint return, your spouse), in 2025 or any earlier year, make contributions to a governmental unemployment compensation program (including
        amounts withheld from your wages for it, and payments you made yourself, such as for coverage you elected as a self-employed
        person; not counting tax an employer paid on your wages, paid family leave or disability insurance contributions), or
        repay in 2025 any unemployment compensation you included in income in an earlier year?
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7, contributions to a governmental unemployment compensation program and repayments
        of more than $3,000 included in income in an earlier year (Pub. 525); p. 89, "If you made contributions to a governmental
        unemployment compensation program and you aren't itemizing deductions, reduce the amount you report on line 7 by those
        contributions."
  - id: s1.line7_figured
    printed: (helper)
    label: Unemployment compensation less the amount of a 2025 overpayment repaid
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: s1.uc_paid_if_any
      take: s1.uc_repaid
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7, 'subtract the amount you repaid from the total amount you received. Enter the result
        on line 7'
    refuses:
    - when: s1.uc_unsupported
      form: Unemployment compensation contributions or earlier-year repayments (Form 1099-G instructions, Pub. 525)
      remedy: Reducing unemployment compensation by program contributions, or repayments of amounts included in an earlier
        year, is outside this tool.
      cite:
        doc: i1040gi
        locator: p. 89, Schedule 1, line 7, Caution and the last paragraph
  - id: s1.line7
    printed: '7'
    label: Unemployment compensation
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.has_uc
          - const: true
        then: s1.line7_figured
      - guard:
          op: test
          eq:
          - s1.has_uc
          - const: false
        then: s1.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 7
  - id: s1.line7_box
    printed: 7 (box)
    label: If you repaid a 2025 overpayment (see instructions), check here
    type: Bool
    display: The line 7 check box, shown on the values sheet; it changes no amount.
    expr:
      op: test
      gt:
      - s1.uc_repaid
      - param: sales.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 7, 'If you repaid a 2025 overpayment (see instructions), check here'
  - id: s1.line7_repaid
    printed: 7 (amount repaid)
    label: Enter amount repaid
    type: NonNegDollars
    display: The amount repaid written beside line 7, shown on the values sheet; it changes no amount.
    expr:
      op: copy
      from: s1.uc_repaid
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 7, 'enter amount repaid'
  - id: s1.ebl_loss
    printed: (helper)
    label: The net loss of all Schedules C (as a positive amount)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: s1.zero_ebl
      take: s1.ebl_total
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 3, "Business income or (loss). Attach Schedule C"; i1040sc p. 1, Excess
        business loss limitation
  - id: s1.ebl_total
    printed: (helper)
    label: Net profit or loss of all Schedules C, with a Schedule E rental or royalty loss counted
    type: Dollars
    expr:
      op: sum
      of:
      - s1.ebl_sc
      - s1.ebl_sche
    cite:
      doc: i1040sc
      locator: p. 1, Reminders, Excess business loss limitation; i1040se p. 1, Reminders, Excess business loss limitation
    ambiguity: amb.2025.s1_ebl_rental
  - id: s1.ebl_sc
    printed: (helper)
    label: Net profit or loss of all Schedules C
    type: Dollars
    expr:
      op: sum_over
      collection: person
      field: person.sc_total
    cite:
      doc: i1040sc
      locator: p. 1, Reminders, Excess business loss limitation
  - id: s1.ebl_sche_abs
    printed: (helper)
    label: The Schedule E rental and royalty losses before the passive activity limit, as a positive amount
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.rental
          - const: true
        then: sche.loss_prelimit
      - guard:
          op: test
          eq:
          - scope.rental
          - const: false
        then: s1.zero_ebl
    cite:
      doc: i1040se
      locator: p. 1, Reminders, Excess business loss limitation
    ambiguity: amb.2025.s1_ebl_rental
  - id: s1.ebl_sche
    printed: (helper)
    label: The Schedule E rental and royalty losses before the passive activity limit
    type: Dollars
    expr:
      op: subtract
      from: s1.zero_ebl
      take: s1.ebl_sche_abs
    cite:
      doc: i1040se
      locator: p. 1, Reminders, Excess business loss limitation
    ambiguity: amb.2025.s1_ebl_rental
  - id: s1.zero_ebl
    printed: (helper)
    label: Zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040sc
      locator: p. 1, Reminders, Excess business loss limitation
  - id: s1.ebl_threshold
    printed: (helper)
    label: Threshold for excess business loss
    type: NonNegDollars
    expr:
      op: param
      ref: s1.ebl_threshold
    cite:
      doc: rp-2024-40
      locator: p. 17, .32 Threshold for Excess Business Loss, "$313,000 ($626,000 for joint returns)"
  - id: s1.ebl
    printed: (gate)
    label: The Schedule C losses are more than the excess business loss threshold
    type: Bool
    expr:
      op: test
      gt:
      - s1.ebl_loss
      - s1.ebl_threshold
    cite:
      doc: i1040sc
      locator: p. 1, Reminders, "If you report a loss on line 31 ... you may be subject to a business loss limitation ... use
        Form 461"
  - id: s1.sc_count
    printed: (helper)
    label: Number of Schedules C on the return
    type: Count
    expr:
      op: sum_over
      collection: person
      field: person.sc_count
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 3, "Business income or (loss). Attach Schedule C"
  - id: s1.has_sc
    printed: (helper)
    label: The return has a Schedule C
    type: Bool
    expr:
      op: test
      gt:
      - s1.sc_count
      - const: 0
        type: Count
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 3, "Business income or (loss). Attach Schedule C"
  - id: s1.sc_1a_count
    printed: (helper)
    label: Number of Schedules C with tips or overtime for Schedule 1-A
    type: Count
    expr:
      op: sum_over
      collection: person
      field: person.sc_1a
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 5; p. 108, line 14b
  - id: s1.sc_1a
    printed: (gate)
    label: A business received tips or overtime to be deducted on Schedule 1-A
    type: Bool
    expr:
      op: test
      gt:
      - s1.sc_1a_count
      - const: 0
        type: Count
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 5, and the Multiple Trades or Businesses Worksheet; p. 108, line 14b
  - id: s1.line3
    printed: '3'
    label: Business income or (loss). Attach Schedule C
    type: Dollars
    expr:
      op: sum_over
      collection: person
      field: person.sc_total
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 3; i1040gi p. 89, Line 3, "If you operated a business or practiced your profession as a sole proprietor, report your income and expenses on Schedule C."; i1040sc p. 14, Line 31, "include it on Schedule 1 (Form 1040), line 3"
    refuses:
      - when: s1.ebl
        form: Form 461 (Limitation on Business Losses)
        remedy: A Schedule C loss above the excess business loss threshold is outside this tool.
        cite:
          doc: i1040sc
          locator: p. 1, Reminders, Excess business loss limitation; rp-2024-40 section 2.32
  - id: s1.ltc_payout
    printed: (helper)
    type: Bool
    label: "Did you (or, on a joint return, your spouse) receive in 2025 payments under a long-term care insurance contract, or accelerated death benefits under a life insurance contract (Form 1099-LTC; Form 8853)?"
    expr:
      op: input
      source: "Did you (or, on a joint return, your spouse) receive in 2025 payments under a long-term care insurance contract, or accelerated death benefits under a life insurance contract (Form 1099-LTC; Form 8853)?"
    cite:
      doc: f1040s1
      locator: "Schedule 1 (2025), line 8e"
  - id: s1.stock_options
    printed: (helper)
    type: Bool
    gated_by: s1.stock_options_if_options
    label: "Did you (or, on a joint return, your spouse) have income in 2025 from the exercise of stock options that is not otherwise reported on the return (Schedule 1, line 8k)?"
    expr:
      op: input
      source: "Did you (or, on a joint return, your spouse) have income in 2025 from the exercise of stock options that is not otherwise reported on the return (Schedule 1, line 8k)?"
    cite:
      doc: f1040s1
      locator: "Schedule 1 (2025), line 8k"
  - id: s1.stock_options_if_options
    printed: (gate)
    type: Bool
    label: "Stock option income not otherwise reported, asked only with employer stock options exercised or their shares sold (false otherwise)"
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s2.options_any
          - const: true
        then: s1.stock_options
      - guard:
          op: test
          eq:
          - s2.options_any
          - const: false
        then: s1.no
    cite:
      doc: i1040gi
      locator: 'p. 91, Line 8k, "Enter any income from the exercise of stock options not otherwise reported on Form 1040 or 1040-SR, line 1h"'
  - id: s1.olympic
    printed: (helper)
    type: Bool
    gated_by: s1.olympic_if_winnings
    label: "Did you (or, on a joint return, your spouse) receive in 2025 an Olympic or Paralympic medal or prize money from the United States Olympic and Paralympic Committee (Schedule 1, line 8m)?"
    expr:
      op: input
      source: "Did you (or, on a joint return, your spouse) receive in 2025 an Olympic or Paralympic medal or prize money from the United States Olympic and Paralympic Committee (Schedule 1, line 8m)?"
    cite:
      doc: f1040s1
      locator: "Schedule 1 (2025), line 8m"
  - id: s1.olympic_if_winnings
    printed: (gate)
    type: Bool
    label: "An Olympic or Paralympic medal or prize money, asked only with winnings, prizes or awards (false otherwise)"
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.winnings_any
          - const: true
        then: s1.olympic
      - guard:
          op: test
          eq:
          - s1.winnings_any
          - const: false
        then: s1.no
    cite:
      doc: i1040gi
      locator: 'p. 91, Line 8m, "The value of Olympic and Paralympic medals and the amount of United States Olympic Committee (USOC) prize money you receive on account of your participation in the Olympic or Paralympic Games may be nontaxable"'
  - id: s1.nqdc_pension
    printed: (helper)
    type: Bool
    gated_by: s1.nqdc_pension_if_w2
    label: "Did you (or, on a joint return, your spouse) receive in 2025 a pension or annuity from a nonqualified deferred compensation plan or a nongovernmental section 457 plan (Schedule 1, line 8t; it may be shown in box 11 of Form W-2)?"
    expr:
      op: input
      source: "Did you (or, on a joint return, your spouse) receive in 2025 a pension or annuity from a nonqualified deferred compensation plan or a nongovernmental section 457 plan (Schedule 1, line 8t; it may be shown in box 11 of Form W-2)?"
    cite:
      doc: f1040s1
      locator: "Schedule 1 (2025), line 8t"
  - id: s1.nqdc_pension_if_w2
    printed: (gate)
    type: Bool
    label: "The answer to s1.nqdc_pension, asked only when a Form W-2 is listed (false otherwise)"
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.has_w2
          - const: true
        then: s1.nqdc_pension
      - guard:
          op: test
          eq:
          - scope.has_w2
          - const: false
        then: s1.no
    cite:
      doc: f1040s1
      locator: "Schedule 1 (2025), line 8t"
  - id: s1.inmate_wages
    printed: (helper)
    type: Bool
    label: "Did you (or, on a joint return, your spouse) receive in 2025 amounts for services performed while an inmate in a penal institution (Schedule 1, line 8u)?"
    expr:
      op: input
      source: "Did you (or, on a joint return, your spouse) receive in 2025 amounts for services performed while an inmate in a penal institution (Schedule 1, line 8u)?"
    cite:
      doc: f1040s1
      locator: "Schedule 1 (2025), line 8u"
  - id: s1.options_amount
    printed: (helper)
    label: Income from the exercise of stock options not otherwise reported
    type: NonNegDollars
    gated_by: s1.line8k
    expr:
      op: input
      source: Income you (and, on a joint return, your spouse) had in 2025 from the exercise of stock options, or from shares
        bought with them, that is not included in box 1 of a Form W-2 or elsewhere on the return; zero if none
    cite:
      doc: i1040gi
      locator: 'p. 91, Line 8k, "Enter any income from the exercise of stock options not otherwise reported on Form 1040 or
        1040-SR, line 1h"'
  - id: s1.line8k
    printed: 8k
    label: Stock options
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.stock_options_if_options
          - const: true
        then: s1.options_amount
      - guard:
          op: test
          eq:
          - s1.stock_options_if_options
          - const: false
        then: s1.zero
    cite:
      doc: f1040s1
      locator: 'Schedule 1 (2025), line 8k; i1040gi p. 91, Line 8k, "Enter any income from the exercise of stock options not
        otherwise reported on Form 1040 or 1040-SR, line 1h"'
  - id: s1.f8853c_total
    printed: (helper)
    label: Form 8853, line 26, added for every Section C
    type: NonNegDollars
    expr:
      op: sum_over
      collection: f8853c
      field: f8853c.line26
    cite:
      doc: i8853
      locator: 'p. 8, Line 18, "Enter the total on line 26 from each separate Section C on the Form 8853 that you attach to your
        tax return"'
  - id: s1.line8e
    printed: 8e
    label: Income from Form 8853
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.ltc_payout
          - const: true
        then: s1.f8853c_total
      - guard:
          op: test
          eq:
          - s1.ltc_payout
          - const: false
        then: s1.zero
    cite:
      doc: i1040gi
      locator: 'p. 91, Line 8e, "Enter the total of the amounts from Form 8853, lines 8, 12, and 26" (lines 8 and 12, Sections
        A and B, are refused by scope.archer_msa)'
  - id: s1.digital_income
    printed: (helper)
    type: Bool
    gated_by: s1.digital_income_if_assets
    label: "Did you (or, on a joint return, your spouse) receive in 2025 digital assets as ordinary income that is not wages, business income or a capital gain, such as from staking, from mining not as a business, from a hard fork or from an airdrop?"
    expr:
      op: input
      source: "Did you (or, on a joint return, your spouse) receive in 2025 digital assets as ordinary income that is not wages, business income or a capital gain, such as from staking, from mining not as a business, from a hard fork or from an airdrop?"
    cite:
      doc: i1040gi
      locator: 'p. 92, Line 8v, "If, in 2025, you received ordinary income in connection with digital assets that isn’t
        reported elsewhere on your return (for example, digital assets, such as income from forks, staking, or mining,
        which aren’t wages reported on line 1a or capital gain or loss reported on Form 8949 and Schedule D), report this
        income on line 8v."; rr-2019-24 p. 5, Holding (2), "A taxpayer has gross income, ordinary in character, under § 61 as a
        result of an airdrop of a new cryptocurrency following a hard fork if the taxpayer receives units of new
        cryptocurrency"'
  - id: s1.digital_income_if_assets
    printed: (gate)
    type: Bool
    label: "Digital assets received as ordinary income, asked only after a Yes to the digital asset question on Form 1040
      page 1 (no otherwise)"
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f1040.digital_assets
          - const: true
        then: s1.digital_income
      - guard:
          op: test
          eq:
          - f1040.digital_assets
          - const: false
        then: s1.no
    cite:
      doc: i1040gi
      locator: 'p. 15, Digital Assets, "Check the “Yes” box next to the question on digital assets on page 1 of Form 1040
        or 1040-SR if at any time during 2025, you (a) received (as a reward, award, or payment for property or services)";
        p. 16, "Received new digital assets as a result of mining, staking, and similar activities; • Received digital
        assets as a result of a hard fork"'
  - id: s1.digital_amount
    printed: (helper)
    label: Digital assets received as ordinary income not reported elsewhere
    type: NonNegDollars
    gated_by: s1.line8v
    expr:
      op: input
      source: 'Fair market value, when received, of the digital assets you (and, on a joint return, your spouse) received
        in 2025 as ordinary income not reported elsewhere on the return, such as from staking, from mining not as a
        business or from a hard fork: not wages on a Form W-2, not income of a business on Schedule C, and not a gift or
        inheritance; zero if none'
    cite:
      doc: i1040gi
      locator: 'p. 92, Line 8v, "If, in 2025, you received ordinary income in connection with digital assets that isn’t
        reported elsewhere on your return" and "Don’t report a gift or inheritance of digital assets on line 8v."; p. 16,
        How To Report Digital Asset Transactions, "If you received any digital asset as compensation for services or
        disposed of any digital asset that you held for sale to customers in a trade or business, you must report the
        income as you would report other income of the same type"'
    ambiguity: amb.2025.digital_income_value
  - id: s1.line8v
    printed: 8v
    label: Digital assets received as ordinary income not reported elsewhere
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.digital_income_if_assets
          - const: true
        then: s1.digital_amount
      - guard:
          op: test
          eq:
          - s1.digital_income_if_assets
          - const: false
        then: s1.zero
    cite:
      doc: f1040s1
      locator: 'Schedule 1 (2025), line 8v; i1040gi p. 92, Line 8v, "report this income on line 8v"'
  - id: s1.line8_other
    printed: (gate)
    label: Do you have any income for Schedule 1 line 8 other than the items this tool computes?
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - s1.nqdc_pension_if_w2
        - const: true
      - op: test
        eq:
        - s1.olympic_if_winnings
        - const: true
