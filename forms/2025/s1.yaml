  - id: s1.alimony_received
    printed: (helper)
    label: Alimony or separate maintenance received in 2025 under an agreement entered into on or before December 31, 2018
    type: NonNegDollars
    expr:
      op: input
      source: |-
        Alimony or separate maintenance you (or, on a joint return, your spouse) received in 2025 under a divorce or separation agreement entered into on or before December 31, 2018 (cash payments only); zero if none.

        Counting as cash payments:
        - cash, checks or money orders the payer paid to a third party for you under the instrument, such as for your medical expenses, rent, utilities or tuition, or at your written request in place of alimony paid to you, if the request states that you both intend the payments to be alimony and the payer received it before filing the return for the year of the payments
        - premiums the payer must pay under the instrument for insurance on the payer's life to the extent you own the policy

        Do not include:
        - child support
        - noncash property settlements
        - your own part of community income
        - payments to keep up or the use of the payer's property
        - payments your divorce or separation instrument designates as not alimony (it states that the payments aren't deductible as alimony by the payer and are excludable from your income)
        - payments from a spouse with whom you file a joint return
        - payments made while you and the payer were members of the same household if you were legally separated under a decree of divorce or separate maintenance (a home you formerly shared is one household, even if you physically separate yourselves in the home, unless one of you was preparing to leave and left no later than 1 month after the payment)
        - payments made after the agreement was changed after 2018 in a way that expressly applies the post-2018 rules, that is, a change that states that the post-2018 alimony rules apply, or that alimony isn't deductible by the payer or isn't included in your income
    cite:
      doc: i1040gi
      locator: p. 89, Line 2a, "Enter amounts received as alimony or separate maintenance pursuant to a divorce or separation
        agreement entered into on or before December 31, 2018, unless that agreement was changed after December 31, 2018,
        to expressly provide that alimony received isn't included in your income"; p504
        p. 16, Certain Rules for Instruments Executed or Modified After 2018, "if the modification expressly states that
        the alimony isn’t deductible to the payer or includible in the income of the recipient", and Example 2, "the modification
        expressly provided that the post-2018 alimony rules apply";
        p504 p. 14, "The instrument doesn’t designate the payment as not alimony", Payments designated as not alimony, "You
        do this by including a provision in your divorce or separation instrument that states the payments aren’t deductible
        as alimony by you and are excludable from your spouse’s income", "is alimony if the spouses don’t file a joint
        return with each other", and Spouses can’t be members of the same household,
        "Payments to your spouse while you’re members of the same household aren’t alimony if you’re legally separated under
        a decree of divorce or separate maintenance" and "A home you formerly shared is considered one household, even if
        you physically separate yourselves in the home"; p504 p. 15, "You aren’t treated as members of the same household
        if one of you is preparing to leave the household and does leave no later than 1 month after the date of the
        payment"; p504 p. 13, Payments to a third party, "Cash payments, checks, or money orders to a third party on behalf of
        your spouse under the terms of your divorce or separation instrument can be alimony, if they otherwise qualify",
        "These include payments for your spouse’s medical expenses, housing costs (rent, utilities, etc.), taxes, tuition,
        etc.", and Life insurance premiums, "Alimony includes premiums you must pay under your divorce or separation instrument
        for insurance on your life to the extent your spouse owns the policy"; p504 p. 14, "cash payments made to a third
        party at the written request of your spouse may qualify as alimony if all the following requirements are met"
  - id: s1.alimony_paid
    printed: (helper)
    label: Alimony or separate maintenance paid in 2025 under an agreement entered into on or before December 31, 2018
    type: NonNegDollars
    expr:
      op: input
      source: |-
        Alimony or separate maintenance you (or, on a joint return, your spouse) paid in 2025 to or for a spouse or former spouse under a divorce or separation agreement entered into on or before December 31, 2018 (cash payments only); zero if none.

        Counting as cash payments:
        - cash, checks or money orders you paid to a third party for the recipient under the instrument, such as for the recipient's medical expenses, rent, utilities or tuition, or at the recipient's written request in place of alimony paid to the recipient, if the request states that you both intend the payments to be alimony and you received it before filing your return for the year of the payments
        - premiums you must pay under the instrument for insurance on your life to the extent the recipient owns the policy

        Do not include:
        - child support
        - noncash property settlements
        - the recipient's part of community income
        - payments to keep up or the use of your property
        - payments your divorce or separation instrument designates as not alimony (it states that the payments aren't deductible as alimony by you and are excludable from the recipient's income)
        - payments to a recipient with whom you file a joint return
        - payments made while you and the recipient were members of the same household if you were legally separated under a decree of divorce or separate maintenance (a home you formerly shared is one household, even if you physically separate yourselves in the home, unless one of you was preparing to leave and left no later than 1 month after the payment)
        - payments made after the agreement was changed after 2018 in a way that expressly applies the post-2018 rules, that is, a change that states that the post-2018 alimony rules apply, or that alimony isn't deductible by you or isn't included in the recipient's income
    cite:
      doc: i1040gi
      locator: p. 95, Line 19a, "If you made payments to or for your spouse or former spouse under a divorce or separation
        agreement entered into on or before December 31, 2018, you may be able to take this deduction"; p504
        p. 16, Certain Rules for Instruments Executed or Modified After 2018, "if the modification expressly states that
        the alimony isn’t deductible to the payer or includible in the income of the recipient", and Example 2, "the modification
        expressly provided that the post-2018 alimony rules apply";
        p504 p. 14, "The instrument doesn’t designate the payment as not alimony", Payments designated as not alimony, "You
        do this by including a provision in your divorce or separation instrument that states the payments aren’t deductible
        as alimony by you and are excludable from your spouse’s income", "is alimony if the spouses don’t file a joint
        return with each other", and Spouses can’t be members of the same household,
        "Payments to your spouse while you’re members of the same household aren’t alimony if you’re legally separated under
        a decree of divorce or separate maintenance" and "A home you formerly shared is considered one household, even if
        you physically separate yourselves in the home"; p504 p. 15, "You aren’t treated as members of the same household
        if one of you is preparing to leave the household and does leave no later than 1 month after the date of the
        payment"; p504 p. 13, Payments to a third party, "Cash payments, checks, or money orders to a third party on behalf of
        your spouse under the terms of your divorce or separation instrument can be alimony, if they otherwise qualify",
        "These include payments for your spouse’s medical expenses, housing costs (rent, utilities, etc.), taxes, tuition,
        etc.", and Life insurance premiums, "Alimony includes premiums you must pay under your divorce or separation instrument
        for insurance on your life to the extent your spouse owns the policy"; p504 p. 14, "cash payments made to a third
        party at the written request of your spouse may qualify as alimony if all the following requirements are met"
  - id: s1.alimony_unsupported
    printed: (gate)
    label: 'Does any of these apply to alimony you received or paid: payments under more than one divorce or separation agreement,
      or paid to more than one person; a recapture of alimony; or payments of which part is not alimony (child support, including
      an amount reduced on a contingency relating to a child; payments for a home either of you owns; or a part that must
      continue after the recipient''s death)?'
    type: Bool
    expr:
      op: input
      source: |-
        Does any of these apply to alimony you (or, on a joint return, your spouse) received or paid?

        - payments under more than one divorce or separation agreement, or paid to more than one person
        - a recapture of alimony (payments that decreased or ended during the first 3 calendar years, Pub. 504 Worksheet 1)
        - payments of which part is not alimony:
          - child support (including payments that fell short of the total of child support and alimony required, and an amount the instrument reduces on a contingency relating to a child, such as reaching a certain age, or at a time associated with one)
          - payments for a home either of you owns (mortgage, real estate taxes, insurance, repairs; Pub. 504 Table 4)
          - payments of which any part must continue, in cash or property, for any period after the recipient spouse's death (even if the instrument does not say so, for example under state law), or payments for which a payment due after the death is a substitute
    cite:
      doc: p504
      locator: p. 12, Alimony, "If you paid alimony to more than one person, enter the SSN or ITIN of one of the recipients";
        p. 13, Underpayment, "the payments apply first to child support and then to alimony"; p. 16, Recapture of Alimony,
        "If your alimony payments decrease or end during the first 3 calendar years, you may be subject to the recapture rule";
        p. 13, "Alimony doesn’t include" child support, noncash property settlements, community income, payments to keep up or use of the payer’s property; p. 15, "On the happening of a
        contingency relating to your child"; p. 13, "If you owned the home jointly with your spouse, see Table 4"; p. 15,
        Liability for payments after death of recipient spouse, "If any part of payments you make must continue to be made
        for any period after your spouse’s death, that part of your payments isn’t alimony" and "If you must make any payments
        in cash or property after your spouse’s death as a substitute for continuing otherwise qualifying payments before
        the death, the otherwise qualifying payments aren’t alimony"
  - id: s1.alimony_refused
    printed: (helper)
    label: Alimony received, before the screen for more than one agreement, recapture and child support
    type: NonNegDollars
    expr:
      op: copy
      from: s1.alimony_received
    cite:
      doc: i1040gi
      locator: p. 89, Line 2a; Line 2b, "Attach a statement listing the month and year of the other agreements"
    refuses:
    - when: s1.alimony_unsupported
      form: Alimony under more than one agreement, recapture of alimony, or payments partly child support (Pub. 504)
      remedy: Alimony from more than one divorce or separation agreement or paid to more than one person, the recapture of
        alimony (Pub. 504 Worksheet 1), and payments of which part is child support are outside this tool.
      cite:
        doc: p504
        locator: p. 12, Alimony; p. 13, Underpayment; p. 16, Recapture of Alimony
  - id: s1.line2a
    printed: 2a
    label: Alimony received
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.alimony_if_any
          - const: true
        then: s1.alimony_refused
      - guard:
          op: test
          eq:
          - s1.alimony_if_any
          - const: false
        then: s1.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 2a; i1040gi p. 89, Line 2a, "Alimony received is not included in your income if you
        entered into a divorce or separation agreement after December 31, 2018"
    ambiguity: amb.2025.alimony_screen
  - id: s1.line2b_notice
    printed: (helper)
    label: 'Notice: write on Schedule 1 line 2b the month and year of your original divorce or separation agreement'
    type: Bool
    display: 'Notice on the values sheet: line 2b (the date of the agreement) is written on the form by hand; this tool does
      not record it.'
    expr:
      op: test
      gt:
      - s1.line2a
      - param: sales.zero
    cite:
      doc: i1040gi
      locator: p. 89, Line 2b, "On line 2b, enter the month and year of your original divorce or separation agreement that
        relates to the alimony payment, if any, reported on line 2a"
    ambiguity: amb.2025.s1_unnumbered_lines
  - id: s1.cod_any
    printed: (gate)
    label: Was any of your debt canceled or forgiven in 2025?
    type: Bool
    expr:
      op: input
      source: Was any of your (or, on a joint return, your spouse's) debt canceled or forgiven in 2025 (for example, you received
        a Form 1099-C, a lender forgave a debt you owed without one, a lender took a discount off a loan you paid off early,
        or a loan modification reduced what you owed)?
    cite:
      doc: p4681
      locator: p. 4, Form 1099-C Reference Guide, "Even if you didn't receive a Form 1099-C, you must report canceled debt
        as gross income on your tax return unless one of the exceptions or exclusions described later applies"; p. 4,
        Discounts and Loan Modifications, "If a lender discounts (reduces) the principal balance of a loan because you pay
        it off early, or agrees to a loan modification (a “workout”) that includes a reduction in the principal balance of
        a loan, the amount of the discount or the amount of principal reduction is canceled debt"
  - id: s1.cod_amount
    printed: (helper)
    label: Canceled nonbusiness debt (Form 1099-C box 2, and any canceled nonbusiness debt with no Form 1099-C)
    type: NonNegDollars
    expr:
      op: input
      source: 'Canceled nonbusiness debt: the total of box 2 of your (or, on a joint return, your spouse''s) Forms 1099-C,
        plus any canceled nonbusiness debt for which you received no Form 1099-C; zero if none. On a joint return, count a debt both spouses owed once, even if each received a Form 1099-C for the whole amount. Count a debt in the year it was actually canceled, whatever year a Form 1099-C reports it in'
    cite:
      doc: p4681
      locator: p. 4, Form 1099-C Reference Guide, "Even if you didn't receive a Form 1099-C, you must report canceled debt
        as gross income on your tax return unless one of the exceptions or exclusions described later applies"; p. 4, Persons
        who each receive a Form 1099-C showing the full amount of debt, "If you and another person were jointly and severally
        liable for a canceled debt, each of you may get a Form 1099-C showing the entire amount of the canceled debt"; f1099c p.
        4, Instructions for Debtor, "Box 2. Shows the amount of debt either actually or deemed discharged" and "If an
        identifiable event has occurred but the debt has not actually been discharged, then include any discharged debt in
        your income in the year that it is actually discharged"
  - id: s1.has_cod
    printed: (helper)
    label: Any canceled nonbusiness debt
    type: Bool
    expr:
      op: test
      gt:
      - s1.cod_amount
      - param: sales.zero
    cite:
      doc: i1040gi
      locator: p. 91, Line 8c
  - id: s1.cod_unsupported
    printed: (gate)
    label: 'A canceled debt is excluded or excepted from income (Form 982), a business, rental or farm debt, canceled in
      a foreclosure, repossession or abandonment, deductible, nonrecourse, or owed jointly with someone not on this return
      (true when any of the canceled-debt screening questions is answered Yes)'
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - s1.cod_bankrupt
        - const: true
      - op: test
        eq:
        - s1.cod_student_home
        - const: true
      - op: test
        eq:
        - s1.cod_gift
        - const: true
      - op: test
        eq:
        - s1.cod_price_cut
        - const: true
      - op: test
        eq:
        - s1.cod_stockholder
        - const: true
      - op: test
        eq:
        - s1.cod_business
        - const: true
      - op: test
        eq:
        - s1.cod_property
        - const: true
      - op: test
        eq:
        - s1.cod_interest
        - const: true
      - op: test
        eq:
        - s1.cod_not_liable
        - const: true
      - op: test
        eq:
        - s1.cod_joint_other
        - const: true
    cite:
      doc: p4681
      locator: p. 3, General Rules, "There are several exceptions and exclusions that may result in part or all of a canceled
        debt being nontaxable"; p. 4, Persons who each receive a Form 1099-C showing the full amount of debt; p. 6, Exclusions,
        "If a canceled debt is excluded from your income, it is nontaxable"; p. 6, Deductible Debt, "If you use the cash method of accounting, you don’t realize income from the cancellation of debt if the payment of the debt would have been a deductible expense."
  - id: s1.cod_bankrupt
    printed: (helper)
    type: Bool
    label: "A canceled debt was canceled in a title 11 bankruptcy case or while insolvent, or is otherwise excluded from income (Form 982)"
    expr:
      op: input
      source: "Was a canceled debt canceled in a bankruptcy case, or while you (or, on a joint return, your spouse) owed more than everything you owned?"
    cite:
      doc: p4681
      locator: 'p. 6, Bankruptcy, "Debt canceled in a title 11 bankruptcy case isn’t included in your income"; p. 6, Insolvency, "Don’t include a canceled debt in income to the extent that you were insolvent immediately before the cancellation"'
  - id: s1.cod_student_home
    printed: (helper)
    type: Bool
    label: "A canceled debt was a student loan or a debt on the main home (qualified principal residence indebtedness)"
    expr:
      op: input
      source: "Was a canceled debt a student loan, or a loan on your (or, on a joint return, your spouse's) main home?"
    cite:
      doc: p4681
      locator: 'p. 4, Student Loans, "Cancellation of certain other loans after December 31, 2020, and before January 1, 2026"; p. 2, "Qualified principal residence indebtedness can be excluded from income for discharges before January 1, 2026"'
  - id: s1.cod_gift
    printed: (helper)
    type: Bool
    label: "A canceled debt was canceled as a gift, bequest, devise or inheritance"
    expr:
      op: input
      source: "Was a canceled debt forgiven as a gift, a bequest or an inheritance?"
    cite:
      doc: p4681
      locator: 'p. 4, Gifts, Bequests, Devises, and Inheritances, "In most cases, you don’t have income from canceled debt if the debt is canceled as a gift, bequest, devise, or inheritance"'
  - id: s1.cod_price_cut
    printed: (helper)
    type: Bool
    label: "A canceled debt was owed to the seller of property bought and was a reduction of its price"
    expr:
      op: input
      source: "Was a canceled debt owed to the seller of property you bought, who reduced what you owed for it?"
    cite:
      doc: p4681
      locator: 'p. 6, Price Reduced After Purchase, "If debt you owe the seller for the purchase of property is reduced by the seller at a time when you aren’t insolvent and the reduction doesn’t occur in a title 11 bankruptcy case, the reduction doesn’t result in cancellation of debt income"'
  - id: s1.cod_stockholder
    printed: (helper)
    type: Bool
    label: "A canceled debt was owed to a corporation in which the debtor is a stockholder"
    expr:
      op: input
      source: "Was a canceled debt owed to a corporation in which you (or, on a joint return, your spouse) hold stock?"
    cite:
      doc: p4681
      locator: 'p. 4, Stockholder Debt, "If you are a stockholder in a corporation and the corporation cancels or forgives your debt to it, the canceled debt is a constructive distribution"'
  - id: s1.cod_business
    printed: (helper)
    type: Bool
    label: "A canceled debt was a business, rental or farm debt"
    expr:
      op: input
      source: "Was a canceled debt a business, rental or farm debt?"
    cite:
      doc: p4681
      locator: 'p. 8, Qualified Farm Indebtedness; p. 9, Qualified Real Property Business Indebtedness; p. 3, General Rules, "There are several exceptions and exclusions that may result in part or all of a canceled debt being nontaxable"'
  - id: s1.cod_property
    printed: (helper)
    type: Bool
    label: "A canceled debt was canceled in connection with a foreclosure, repossession or abandonment of property"
    expr:
      op: input
      source: "Was a canceled debt canceled in connection with a foreclosure, repossession or abandonment of property (Form 1099-C box 7, or a Form 1099-A)?"
    cite:
      doc: p4681
      locator: 'p. 4, Sales or Other Dispositions (Such as Foreclosures and Repossessions); p. 4, Abandonments'
  - id: s1.cod_interest
    printed: (helper)
    type: Bool
    label: "A canceled debt includes interest or another amount that would have been deductible if paid"
    expr:
      op: input
      source: "Does a canceled debt include interest (Form 1099-C box 3) or another amount that would have been deductible if you had paid it?"
    cite:
      doc: p4681
      locator: 'p. 4, Interest included in canceled debt, "Whether the interest portion of the canceled debt must be included in your income depends on whether the interest would be deductible if you paid it"; p. 6, Deductible Debt, "you don’t realize income from the cancellation of debt if the payment of the debt would have been a deductible expense"'
  - id: s1.cod_not_liable
    printed: (helper)
    type: Bool
    label: "The debtor was not personally liable for a canceled debt (nonrecourse debt)"
    expr:
      op: input
      source: "Were you (or, on a joint return, your spouse) not personally liable for a canceled debt (Form 1099-C box 5)?"
    cite:
      doc: p4681
      locator: 'p. 3, "Debt for which you are personally liable is recourse debt. All other debt is nonrecourse debt"'
  - id: s1.cod_joint_other
    printed: (helper)
    type: Bool
    label: "A canceled debt was owed jointly with someone who is not on this return"
    expr:
      op: input
      source: "Were you (or, on a joint return, your spouse) liable for a canceled debt together with someone who is not on this return?"
    cite:
      doc: p4681
      locator: 'p. 4, Persons who each receive a Form 1099-C showing the full amount of debt, "If you and another person were jointly and severally liable for a canceled debt, each of you may get a Form 1099-C showing the entire amount of the canceled debt"'
  - id: s1.cod_refused
    printed: (helper)
    label: Canceled nonbusiness debt, before the screen for exceptions, exclusions and other debts
    type: NonNegDollars
    expr:
      op: copy
      from: s1.cod_amount
    cite:
      doc: p525
      locator: p. 20, Canceled Debts, "If the debt is a nonbusiness debt, report the canceled amount on Schedule 1 (Form 1040),
        line 8c"
    refuses:
    - when: s1.cod_unsupported
      form: Form 982, Pub. 4681 exceptions, business or farm debt, foreclosures and repossessions
      remedy: Canceled debt that is excluded from income or excepted, business, rental or farm debt, debt canceled in a foreclosure,
        repossession or abandonment, deductible interest, nonrecourse debt and debt owed jointly with another person are
        outside this tool; only fully taxable canceled nonbusiness debt is computed.
      cite:
        doc: p4681
        locator: p. 3, General Rules; p. 4, Exceptions; p. 6, Exclusions
  - id: s1.cod_figured
    printed: (helper)
    label: Cancellation of debt, when a debt was canceled
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.has_cod
          - const: true
        then: s1.cod_refused
      - guard:
          op: test
          eq:
          - s1.has_cod
          - const: false
        then: s1.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 8c; i1040gi p. 91, Line 8c, "Canceled debt may be shown in box 2 of Form 1099-C. However,
        part or all of your income from cancellation of debt may be nontaxable"
  - id: s1.line8c
    printed: 8c
    label: Cancellation of debt
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.cod_any
          - const: true
        then: s1.cod_figured
      - guard:
          op: test
          eq:
          - s1.cod_any
          - const: false
        then: s1.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 8c; i1040gi p. 91, Line 8c, "Canceled debt may be shown in box 2 of Form 1099-C. However,
        part or all of your income from cancellation of debt may be nontaxable"
    ambiguity: amb.2025.cod_fully_taxable
  - id: s1.line8f
    printed: 8f
    label: Income from Form 8889
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.hsa_taxable
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 8f; i1040gi p. 91, Line 8f, "Enter the total of the amounts from Form 8889, lines
        16 and 20" (Part III of Form 8889 is not prepared, and f8889.testing_failed refuses a failed testing period)
  - id: s1.nol_amount
    printed: (helper)
    label: Net operating loss carried into 2025
    type: NonNegDollars
    gated_by: s1.nol_amount_if_nol
    expr:
      op: input
      source: The net operating loss from earlier years that you (or, on a joint return, you and your spouse) carry into 2025
        and have not used up, from your records or Form 172; zero if none
    cite:
      doc: i172
      locator: 'p. 3, Deducting a Carryforward, "If you carry forward your NOL to a tax year after the NOL year, list your NOL
        deduction as a negative figure on Schedule 1 (Form 1040) for the year to which the NOL is carried"; p. 2, How to
        Claim an NOL Deduction, "If you carry more than one NOL to the same year, your NOL deduction is the total of these
        carrybacks and carryovers"'
  - id: s1.nol_amount_if_nol
    printed: (gate)
    label: The net operating loss carried into 2025, asked only after a Yes to the question on a loss carried into 2025
      (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.nol
          - const: true
        then: s1.nol_amount
      - guard:
          op: test
          eq:
          - scope.nol
          - const: false
        then: s1.zero
    cite:
      doc: i1040gi
      locator: 'p. 91, Line 8a, "Enter any deduction for an NOL from an earlier year"'
  - id: s1.nol_before_limit_date
    printed: (gate)
    gated_by: s1.nol_before_limit_date_if_nol
    label: Did any of the loss arise in a tax year that began before 2018?
    type: Bool
    expr:
      op: input
      source: Did any of the net operating loss carried into 2025 arise in a tax year that began before January 1, 2018?
    cite:
      doc: i172
      locator: 'p. 1, NOL deduction limitation, "cannot exceed the sum of: (1) the NOLs carried to the year from tax years
        beginning before January 1, 2018"'
  - id: s1.nol_before_limit_date_if_nol
    printed: (gate)
    label: A loss from a year before 2018, asked only with a loss carried into 2025 (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.nol
          - const: true
        then: s1.nol_before_limit_date
      - guard:
          op: test
          eq:
          - scope.nol
          - const: false
        then: s1.no
    cite:
      doc: i172
      locator: 'p. 2, How to Figure an NOL Carryover, "Only NOLs arising after 2017 and carried forward to a year after 2020
        are subject to the 80%-of-taxable-income limit"'
  - id: s1.nol_ebl
    printed: (gate)
    gated_by: s1.nol_ebl_if_nol
    label: Did any of the loss come from a business loss over the yearly limit (an excess business loss, Form 461)?
    type: Bool
    expr:
      op: input
      source: Did any of the net operating loss carried into 2025 come from an excess business loss disallowed in an earlier
        year (Form 461)?
    cite:
      doc: i172
      locator: 'p. 4, Excess Business Loss, "Excess business losses that are disallowed are treated as an NOL carryover to the
        following tax year"; i8995 p. 3, "Losses or deductions from a qualified trade or business that are suspended by
        other provisions of the Internal Revenue Code are not qualified losses" and "461(l)"'
  - id: s1.nol_ebl_if_nol
    printed: (gate)
    label: A loss from an excess business loss, asked only with a loss carried into 2025 (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.nol
          - const: true
        then: s1.nol_ebl
      - guard:
          op: test
          eq:
          - scope.nol
          - const: false
        then: s1.no
    cite:
      doc: i8995
      locator: 'p. 3, "Instead, qualified losses and deductions are taken into account in the tax year they’re included in
        calculating your taxable income"'
  - id: s1.nol_joint
    printed: (helper)
    label: A loss carried into 2025 on a joint return
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - scope.nol
        - const: true
      - op: test
        eq:
        - f1040.status
        - const: mfj
    cite:
      doc: i172
      locator: 'p. 3, Change in Marital Status, "If you file a joint return, the NOL deduction is limited to the income of that
        spouse"'
  - id: s1.nol_separate
    printed: (helper)
    label: A loss carried into 2025 on a return that is not joint
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - scope.nol
        - const: true
      - op: test
        ne:
        - f1040.status
        - const: mfj
    cite:
      doc: i172
      locator: 'p. 3, Joint to separate returns, "figure each of your carryovers separately"'
  - id: s1.nol_not_married
    printed: (gate)
    gated_by: s1.nol_not_married_if_joint
    label: Were the two of you not married to each other in a year the loss came from or was carried back to, or in a year
      since?
    type: Bool
    expr:
      op: input
      source: Were you and your spouse not married to each other in a year any of the loss arose or was carried back to, or in
        any year from then to 2025?
    cite:
      doc: i172
      locator: 'p. 3, Change in Marital Status, "If you and your spouse were not married to each other in all years involved in
        figuring NOL carrybacks and carryovers, only the spouse who had the loss can take the NOL deduction. If you file a
        joint return, the NOL deduction is limited to the income of that spouse"'
  - id: s1.nol_not_married_if_joint
    printed: (gate)
    label: Not married to each other in all the years of the loss, asked only on a joint return with a loss carried into 2025
      (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.nol_joint
          - const: true
        then: s1.nol_not_married
      - guard:
          op: test
          eq:
          - s1.nol_joint
          - const: false
        then: s1.no
    cite:
      doc: i172
      locator: 'p. 3, Change in Marital Status, "only the spouse who had the loss can take the NOL deduction"'
  - id: s1.nol_was_joint
    printed: (gate)
    gated_by: s1.nol_was_joint_if_separate
    label: Was a joint return filed for a year the loss came from or was carried back to, or for a year since?
    type: Bool
    expr:
      op: input
      source: Did you file a joint return for a year any of the loss arose or was carried back to, or for any year from then
        to 2024?
    cite:
      doc: i172
      locator: 'p. 3, Joint to separate returns, "If you and your spouse file separate returns for a tax year, but filed a joint
        return for any or all of the tax years involved in figuring the NOL carryover, figure each of your carryovers
        separately"'
  - id: s1.nol_was_joint_if_separate
    printed: (gate)
    label: A joint return in a year of the loss, asked only on a return that is not joint with a loss carried into 2025 (no
      otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.nol_separate
          - const: true
        then: s1.nol_was_joint
      - guard:
          op: test
          eq:
          - s1.nol_separate
          - const: false
        then: s1.no
    cite:
      doc: i172
      locator: 'p. 3, Change in Marital Status, "If you and your spouse were not married to each other in all years involved in
        figuring NOL carrybacks and carryovers, only the spouse who had the loss can take the NOL deduction"'
  - id: s1.nol_marital
    printed: (gate)
    label: The loss carried into 2025 must be divided between spouses (a change in marriage or in filing jointly since the
      loss)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - s1.nol_not_married_if_joint
        - const: true
      - op: test
        eq:
        - s1.nol_was_joint_if_separate
        - const: true
    cite:
      doc: i172
      locator: 'p. 3, Change in Marital Status, "only the spouse who had the loss can take the NOL deduction"; p. 3, Joint to
        separate returns, "figure each of your carryovers separately"'
  - id: s1.line8a
    printed: 8a
    label: Net operating loss
    type: Dollars
    expr:
      op: subtract
      from: s1.zero
      take: s1.nol_amount_if_nol
    cite:
      doc: i1040gi
      locator: 'p. 91, Line 8a, "Enter any deduction for an NOL from an earlier year. Enter the amount in the preprinted
        parentheses (as a negative number)"; i172 p. 3, Deducting a Carryforward, "list your NOL deduction as a negative
        figure on Schedule 1 (Form 1040)"'
    refuses:
    - when: s1.nol_before_limit_date_if_nol
      form: Form 172, NOL deduction limitation (a loss from a year before 2018)
      remedy: A net operating loss from a tax year that began before 2018 is deducted ahead of the limit on later losses;
        that is outside this tool.
      cite:
        doc: i172
        locator: 'p. 1, NOL deduction limitation, "cannot exceed the sum of: (1) the NOLs carried to the year from tax years
          beginning before January 1, 2018"'
    - when: s1.nol_ebl_if_nol
      form: Form 172 and Form 8995 (a loss carried from an excess business loss)
      remedy: A net operating loss from an excess business loss is taken into the qualified business income of the year it
        is deducted; that is outside this tool.
      cite:
        doc: i8995
        locator: 'p. 3, "Instead, qualified losses and deductions are taken into account in the tax year they’re included in
          calculating your taxable income"'
    - when: s1.nol_marital
      form: Form 172, Change in Marital Status
      remedy: A net operating loss from a year when you were not married to your spouse of 2025, or when you filed jointly
        and now file alone, must be divided between the spouses; that is outside this tool.
      cite:
        doc: i172
        locator: 'p. 3, Change in Marital Status, "only the spouse who had the loss can take the NOL deduction"; p. 3, Joint to
          separate returns, "figure each of your carryovers separately"'
  - id: s1.nol_ti
    printed: (helper)
    label: Form 1040 line 11b less line 14, as a negative amount when line 14 is more (taxable income after the net operating
      loss deduction, before line 15's floor at zero)
    type: Dollars
    expr:
      op: subtract
      from: f1040.line11b
      take: f1040.line14
    cite:
      doc: f1040
      locator: Form 1040 (2025), line 15, "Subtract line 14 from line 11b. If zero or less, enter -0-"
    ambiguity: amb.2025.s1_nol_limit_test
  - id: s1.nol_ti4
    printed: (helper)
    label: Four times that amount (the most the deduction can be while staying within 80% of taxable income figured without
      it)
    type: Dollars
    expr:
      op: sum
      of:
      - s1.nol_ti
      - s1.nol_ti
      - s1.nol_ti
      - s1.nol_ti
    cite:
      doc: i172
      locator: 'p. 6, Line 10, "can’t exceed 80% of taxable income without regard to the NOL deduction or sections 199A or 250"'
    ambiguity: amb.2025.s1_nol_limit_test
  - id: s1.nol_limit_test
    printed: (helper)
    label: The loss carried into 2025 is more than four times taxable income after deducting it
    type: Bool
    expr:
      op: test
      all:
      - op: test
        lt:
        - s1.nol_ti4
        - s1.nol_amount_if_nol
      - op: test
        gt:
        - s1.nol_amount_if_nol
        - const: 0
    cite:
      doc: i172
      locator: 'p. 2, "the lesser of: a. The NOLs carried to the year from tax years beginning after December 31, 2017, or b.
        80% of the excess (if any) of taxable income computed without regard to deductions for NOLs, or Qualified Business
        Income (QBI), or section 250 deductions"'
    ambiguity: amb.2025.s1_nol_limit_test
  - id: s1.nol_limit
    printed: (gate)
    label: The 80% limit on the net operating loss deduction may apply (the loss is more than four times taxable income
      after deducting it)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.nol
          - const: true
        then: s1.nol_limit_test
      - guard:
          op: test
          eq:
          - scope.nol
          - const: false
        then: s1.no
    cite:
      doc: i172
      locator: 'p. 2, "Only NOLs arising after 2017 and carried forward to a year after 2020 are subject to the
        80%-of-taxable-income limit"'
    ambiguity: amb.2025.s1_nol_limit_test
  - id: s1.line8s
    printed: 8s
    label: Nontaxable amount of Medicaid waiver payments included on Form 1040, line 1a or 1d (entered in parentheses, as a negative number)
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.line8s
    cite:
      doc: i1040gi
      locator: 'p. 92, Line 8s, "Then, on line 8s, enter the total amount of the nontaxable payments reported on Form 1040 or 1040-SR, line 1a or 1d", "in the entry space in the preprinted parentheses (as a negative number)"'
  - id: s1.line8s_neg
    printed: (helper)
    label: Line 8s as the negative number added on line 9
    type: Dollars
    expr:
      op: subtract
      from: s1.zero
      take: s1.line8s
    cite:
      doc: i1040gi
      locator: 'p. 92, Line 8s, "in the entry space in the preprinted parentheses (as a negative number)"'
  - id: s1.line9
    printed: '9'
    label: Total other income. Add lines 8a through 8z
    type: Dollars
    expr:
      op: sum
      of:
      - s1.line8a
      - s1.line8b
      - s1.line8c
      - s1.line8e
      - s1.line8f
      - s1.line8g
      - s1.line8h
      - s1.line8i
      - s1.line8j
      - s1.line8k
      - s1.line8r
      - s1.line8v
      - s1.line8s_neg
      - s1.line8z
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 9 (lines 8m, 8t and 8u are refused by s1.line8_other, 8l by scope.rental through
        scope.schedule1, 8d by sa.excluded_income, 8n and 8o by scope.cfc, 8p by the excess business loss refusal of
        s1.line3 and 8q by person.x_other)
    refuses:
    - when: s1.line8_other
      form: Schedule 1, line 8 (other income this tool does not compute)
      remedy: Other income on Schedule 1 line 8 other than gambling winnings, canceled debt, income from Form 8889, Alaska
        Permanent Fund dividends, jury duty pay, prizes and awards, income from an activity not engaged in for profit,
        scholarship and fellowship grants not on Form W-2 and the supported line 8z items is outside this tool.
      cite:
        doc: i1040gi
        locator: pp. 91–92, Lines 8a Through 8z
  - id: s1.line5
    printed: '5'
    label: Rental real estate, royalties, partnerships, S corporations, trusts, etc. Attach Schedule E
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.rental
          - const: true
        then: sche.line41
      - guard:
          op: test
          eq:
          - scope.rental
          - const: false
        then: s1.zero_ebl
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 5, "Rental real estate, royalties, partnerships, S corporations, trusts, etc. Attach
        Schedule E"; i1040se p. 1, General Instructions, "Use Schedule E (Form 1040) to report income or loss from rental real
        estate, royalties"
  - id: s1.line10_ex5
    printed: (helper)
    label: Lines 1 through 4, 6, 7 and 9 of Schedule 1 (additional income other than line 5)
    type: Dollars
    expr:
      op: sum
      of:
      - s1.line1
      - s1.line2a
      - s1.line3
      - s1.line7
      - s1.line9
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 10 (line 4 is refused by sd.other_forms on Schedule D, line 6 by scope.schedule1
        at Form 1040 line 8, the parts of line 2a this tool does not compute by s1.alimony_unsupported, and those of line 8
        as the line 9 citation says)
  - id: s1.line10
    printed: '10'
    label: Combine lines 1 through 7 and 9. This is your additional income. Enter here and on Form 1040, 1040-SR, or 1040-NR,
      line 8
    type: Dollars
    expr:
      op: sum
      of:
      - s1.line10_ex5
      - s1.line5
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 10 (line 4 is refused by sd.other_forms on Schedule D, line 6 by scope.schedule1
        at Form 1040 line 8, the parts of line 2a this tool does not compute by s1.alimony_unsupported, and those of line 8
        as the line 9 citation says)
  - id: s1.line11
    printed: '11'
    label: Educator expenses
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.educator_deduction
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 11; i1040gi p. 93, "If you and your spouse are filing jointly and both of you were eligible
        educators, the maximum deduction is $600. However, neither spouse can deduct more than $300 of their qualified expenses"
  - id: s1.line13
    printed: '13'
    label: Health savings account deduction. Attach Form 8889
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.hsa_deduction
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 13; i8889 p. 4, "Combine the amounts on line 13 of both Forms 8889 and enter this
        amount on Schedule 1 (Form 1040), line 13"
  - id: s1.line15
    printed: '15'
    label: Deductible part of self-employment tax. Attach Schedule SE
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.se_line13
    cite:
      doc: i1040gi
      locator: p. 93, Schedule 1, line 15, "The deductible part of your self-employment tax is on line 13 of Schedule SE"
  - id: s1.line16
    printed: '16'
    label: Self-employed SEP, SIMPLE, and qualified plans
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.s16
    cite:
      doc: i1040gi
      locator: p. 93, Schedule 1, line 16; p560 p. 17, Where To Deduct Contributions, "Sole proprietors and partners
        deduct contributions for themselves on line 16 of Schedule 1 (Form 1040)"; p560 p. 39, Table and Worksheets
        for the Self-Employed, "Enter your actual contribution, not to exceed your maximum deductible contribution, on
        Schedule 1 (Form 1040), line 16"
  - id: s1.line17
    printed: '17'
    label: Self-employed health insurance deduction
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.sehi
    cite:
      doc: i1040gi
      locator: pp. 94–95, Schedule 1, line 17, Self-Employed Health Insurance Deduction; f7206 line 14
  - id: s1.line18
    printed: '18'
    label: Penalty on early withdrawal of savings
    type: NonNegDollars
    expr:
      op: sum_over
      collection: interest
      field: interest.penalty
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 18; i1040gi p. 95, Line 18, "The Form 1099-INT or Form 1099-OID you received will
        show the amount of any penalty you were charged"
    ambiguity: amb.2025.ewp_oid
  - id: s1.paid_refused
    printed: (helper)
    label: Alimony paid, before the screen for more than one agreement, recapture and child support
    type: NonNegDollars
    expr:
      op: copy
      from: s1.alimony_paid
    cite:
      doc: p504
      locator: p. 12, Alimony, "Enter your total payments on line 19a"
    refuses:
    - when: s1.alimony_unsupported
      form: Alimony under more than one agreement, recapture of alimony, or payments partly child support (Pub. 504)
      remedy: Alimony from more than one divorce or separation agreement or paid to more than one person, the recapture of
        alimony (Pub. 504 Worksheet 1), and payments of which part is child support are outside this tool.
      cite:
        doc: p504
        locator: p. 12, Alimony; p. 13, Underpayment; p. 16, Recapture of Alimony
  - id: s1.line19a
    printed: 19a
    label: Alimony paid
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.alimony_if_any
          - const: true
        then: s1.paid_refused
      - guard:
          op: test
          eq:
          - s1.alimony_if_any
          - const: false
        then: s1.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 19a; i1040gi p. 95, Line 19a
    ambiguity: amb.2025.alimony_screen
  - id: s1.line19b_notice
    printed: (helper)
    label: 'Notice: write on Schedule 1 line 19b the recipient''s SSN'
    type: Bool
    display: 'Notice on the values sheet: line 19b (the recipient''s SSN or ITIN) is written on the form by hand; this tool
      does not record it.'
    expr:
      op: test
      gt:
      - s1.line19a
      - param: sales.zero
    cite:
      doc: p504
      locator: p. 12, Alimony, "In the space provided on line 19b, enter your recipient's SSN or ITIN"
    ambiguity: amb.2025.s1_unnumbered_lines
  - id: s1.line19c_notice
    printed: (helper)
    label: 'Notice: write on Schedule 1 line 19c the month and year of your original divorce or separation agreement'
    type: Bool
    display: 'Notice on the values sheet: line 19c (the date of the agreement) is written on the form by hand; this tool does
      not record it.'
    expr:
      op: test
      gt:
      - s1.line19a
      - param: sales.zero
    cite:
      doc: i1040gi
      locator: p. 95, Line 19c, "On line 19c, enter the month and year of your original divorce or separation agreement that
        relates to this deduction for alimony paid"
    ambiguity: amb.2025.s1_unnumbered_lines
  - id: s1.line20
    printed: '20'
    label: IRA deduction
    type: NonNegDollars
    expr:
      op: copy
      from: ira.line20
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 20; i1040gi p. 98, IRA Deduction Worksheet—Continued, line 12, "Add the amounts on lines
        12a and 12b and enter the total on Schedule 1, line 20"
  - id: s1.line20_box
    printed: 20 (box)
    label: If you are married filing separately and lived apart from your spouse for the entire year (see instructions), check
      here
    type: Bool
    display: The line 20 check box, shown on the values sheet; it changes no amount.
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - ira.any_trad
          - const: true
        then: household.mfs_apart_all_year
      - guard:
          op: test
          eq:
          - ira.any_trad
          - const: false
        then: s1.no
    cite:
      doc: i1040gi
      locator: 'p. 96, Married persons filing separately, "If you are married filing separately and you lived apart from your
        spouse for all of 2025, check the box on line 20"'
    ambiguity: amb.2025.s1_line20_box
  - id: s1.line21
    printed: '21'
    label: Student loan interest deduction
    type: NonNegDollars
    expr:
      op: copy
      from: sli.deduction
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 21
  - id: s1.jury_to_employer
    printed: (helper)
    label: Jury duty pay you gave to your employer because your employer paid your salary while you served on the jury
    type: NonNegDollars
    gated_by: s1.jury_to_employer_if_pay
    expr:
      op: input
      source: The part of the jury duty pay on line 8h that you (or, on a joint return, your spouse) gave to your employer
        because your employer paid your salary while you served on the jury; zero if none
    cite:
      doc: i1040gi
      locator: 'p. 99, Line 24a, "Enter your jury duty pay if you gave the pay to your employer because your employer paid
        your salary while you served on the jury"; p525 p. 34, Jury duty, "you can deduct the amount turned over to your
        employer as an adjustment to income"'
  - id: s1.has_jury_pay
    printed: (helper)
    label: Jury duty pay on line 8h is more than zero
    type: Bool
    expr:
      op: test
      gt:
      - s1.line8h
      - s1.zero
    cite:
      doc: i1040gi
      locator: 'p. 91, Line 8h, "Enter any jury duty pay and see the instructions for line 24a"; p. 99, Line 24a, "Enter your
        jury duty pay if you gave the pay to your employer because your employer paid your salary while you served on the
        jury"'
  - id: s1.jury_to_employer_if_pay
    printed: (helper)
    label: Jury duty pay you gave to your employer, asked only when there is jury duty pay on line 8h (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.has_jury_pay
          - const: true
        then: s1.jury_to_employer
      - guard:
          op: test
          eq:
          - s1.has_jury_pay
          - const: false
        then: s1.zero
    cite:
      doc: i1040gi
      locator: 'p. 91, Line 8h, "Enter any jury duty pay and see the instructions for line 24a"; p. 99, Line 24a, "Enter your
        jury duty pay if you gave the pay to your employer because your employer paid your salary while you served on the
        jury"'
  - id: s1.jury_over
    printed: (gate)
    label: The jury duty pay given to the employer is more than the jury duty pay on line 8h
    type: Bool
    expr:
      op: test
      gt:
      - s1.jury_to_employer_if_pay
      - s1.line8h
    cite:
      doc: i1040gi
      locator: p. 99, Line 24a, "Enter your jury duty pay if you gave the pay to your employer"
    ambiguity: amb.2025.jury_24a_cap
  - id: s1.line24a
    printed: 24a
    label: Jury duty pay (see instructions)
    type: NonNegDollars
    expr:
      op: copy
      from: s1.jury_to_employer_if_pay
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 24a; i1040gi p. 99, Line 24a, "Enter your jury duty pay if you gave the pay to your
        employer because your employer paid your salary while you served on the jury"
    refuses:
    - when: s1.jury_over
      form: Schedule 1, line 24a (more than the jury duty pay received)
      remedy: The jury duty pay given to your employer cannot be more than the jury duty pay reported on line 8h; correct
        the two amounts.
      cite:
        doc: i1040gi
        locator: p. 99, Line 24a, "Enter your jury duty pay if you gave the pay to your employer"
  - id: s1.line25
    printed: '25'
    label: Total other adjustments. Add lines 24a through 24z
    type: NonNegDollars
    expr:
      op: copy
      from: s1.line24a
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 25 (lines 24b to 24z are outside this tool and refused at Form 1040 line 10 by
        scope.schedule1)
  - id: s1.line26
    printed: '26'
    label: Add lines 11 through 23 and 25. These are your adjustments to income. Enter here and on Form 1040, 1040-SR, or
      1040-NR, line 10
    type: NonNegDollars
    expr:
      op: sum
      of:
      - s1.line11
      - s1.line13
      - s1.line15
      - s1.line16
      - s1.line17
      - s1.line18
      - s1.line19a
      - s1.line20
      - s1.line21
      - s1.line25
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 26 (lines 12, 14 and 23 are outside this tool and refused at Form 1040 line
        10 by scope.schedule1)
