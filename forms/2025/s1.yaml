      op: input
      source: |-
        Did you (or, on a joint return, your spouse) receive or pay alimony or separate maintenance in 2025 under a divorce or separation agreement entered into on or before December 31, 2018 (counting only payments made before any change after 2018 that expressly applies the post-2018 rules, that is, one that states that the post-2018 alimony rules apply, or that alimony isn't deductible by the payer or isn't included in the recipient's income), or must you include or may you deduct a recapture of alimony?

        Alimony under an agreement entered into after 2018 is neither income nor deductible; answer false for it.
    cite:
      doc: i1040gi
      locator: p. 89, Line 2a, "Enter amounts received as alimony or separate maintenance pursuant to a divorce or separation
        agreement entered into on or before December 31, 2018"; p. 95, Line 19a, "You can't take a deduction for alimony
        payments you made to or for your spouse if you entered into your divorce or separation agreement after December
        31, 2018"; p504 p. 16, Certain Rules for Instruments Executed or Modified After 2018, "if the modification expressly
        states that the alimony isn’t deductible to the payer or includible in the income of the recipient", and Example 2,
        "the modification expressly provided that the post-2018 alimony rules apply" and "The alimony payments made in January
        2025 through May 2025 are includible in the recipient’s income and deductible from the payer’s income."
  - id: s1.alimony_if_any
    printed: (gate)
    type: Bool
    label: "Alimony under an agreement of 2018 or earlier, or a recapture of alimony, asked only when alimony was paid or received since the start of 2023 (false otherwise)"
    expr:
      op: choose
      alternatives:
