form:
  id: s1
  kind: form
  title: Schedule 1 — selected lines (unemployment compensation, educator expenses, HSA deduction, student loan interest)
  tax_year: 2025
  note: Lines 7, 10, 11, 13, 21 and 26. Every other Schedule 1 item is refused by scope.schedule1 at Form 1040 lines 8 and
    10.
  lines:
  - id: s1.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), lines 7, 11, 21
  - id: s1.uc_paid
    printed: (helper)
    label: Unemployment compensation paid to you in 2025
    type: NonNegDollars
    expr:
      op: input
      source: 'Unemployment compensation paid to you in 2025: the total of box 1 of your Forms 1099-G (if box 1 is wrong,
        the amount actually paid to you)'
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7, 'You should receive a Form 1099-G showing in box 1 the total unemployment compensation
        paid to you in 2025' and 'If the amount reported in box 1 of your Form(s) 1099-G is incorrect, report on line 7 only
        the actual amount'
  - id: s1.has_uc
    printed: (helper)
    label: Any unemployment compensation
    type: Bool
    expr:
      op: test
      gt:
      - s1.uc_paid
      - param: sales.zero
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7
  - id: s1.uc_repaid
    printed: (helper)
    label: Amount of a 2025 overpayment of unemployment compensation you repaid in 2025
    type: NonNegDollars
    expr:
      op: input
      source: Amount you repaid in 2025 of an overpayment of unemployment compensation you received in 2025 (zero if none)
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7, 'If you received an overpayment of unemployment compensation in 2025, subtract the
        amount you repaid from the total amount you received'
  - id: s1.uc_unsupported
    printed: (helper)
    label: Did you make contributions to a governmental unemployment compensation program (not counting paid family leave
      or disability insurance contributions), or repay in 2025 any unemployment compensation you included in income in an
      earlier year?
    type: Bool
    expr:
      op: input
      source: Did you make contributions to a governmental unemployment compensation program (not counting paid family leave
        or disability insurance contributions), or repay in 2025 any unemployment compensation you included in income in an
        earlier year?
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7, contributions to a governmental unemployment compensation program and repayments
        of more than $3,000 included in income in an earlier year (Pub. 525)
  - id: s1.line7_figured
    printed: (helper)
    label: Unemployment compensation less the amount of a 2025 overpayment repaid
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: s1.uc_paid
      take: s1.uc_repaid
    cite:
      doc: i1040gi
      locator: p. 89, Schedule 1, line 7, 'subtract the amount you repaid from the total amount you received. Enter the result
        on line 7'
    refuses:
    - when: s1.uc_unsupported
      form: Unemployment compensation contributions or earlier-year repayments (Form 1099-G instructions, Pub. 525)
      remedy: Reducing unemployment compensation by program contributions, or repayments of amounts included in an earlier
        year, is outside this tool.
      cite:
        doc: i1040gi
        locator: p. 89, Schedule 1, line 7, Caution and the last paragraph
  - id: s1.line7
    printed: '7'
    label: Unemployment compensation
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1.has_uc
          - const: true
        then: s1.line7_figured
      - guard:
          op: test
          eq:
          - s1.has_uc
          - const: false
        then: s1.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 7
  - id: s1.line7_box
    printed: 7 (box)
    label: If you repaid a 2025 overpayment (see instructions), check here
    type: Bool
    display: The line 7 check box, shown on the values sheet; it changes no amount.
    expr:
      op: test
      gt:
      - s1.uc_repaid
      - param: sales.zero
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 7, 'If you repaid a 2025 overpayment (see instructions), check here'
  - id: s1.line7_repaid
    printed: 7 (amount repaid)
    label: Enter amount repaid
    type: NonNegDollars
    display: The amount repaid written beside line 7, shown on the values sheet; it changes no amount.
    expr:
      op: copy
      from: s1.uc_repaid
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 7, 'enter amount repaid'
  - id: s1.ebl_loss
    printed: (helper)
    label: The net loss of all Schedules C (as a positive amount)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: s1.zero_ebl
      take: s1.ebl_total
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 3; i1040sc p. 1, Excess business loss limitation
  - id: s1.ebl_total
    printed: (helper)
    label: Net profit or loss of all Schedules C
    type: Dollars
    expr:
      op: sum_over
      collection: person
      field: person.sc_total
    cite:
      doc: i1040sc
      locator: p. 1, Reminders, Excess business loss limitation
  - id: s1.zero_ebl
    printed: (helper)
    label: Zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040sc
      locator: p. 1, Reminders, Excess business loss limitation
  - id: s1.ebl_threshold
    printed: (helper)
    label: Threshold for excess business loss
    type: NonNegDollars
    expr:
      op: param
      ref: s1.ebl_threshold
    cite:
      doc: rp-2024-40
      locator: p. 17, section 3.32, Threshold for Excess Business Loss, "$313,000 ($626,000 for joint returns)"
  - id: s1.ebl
    printed: (gate)
    label: The Schedule C losses are more than the excess business loss threshold
    type: Bool
    expr:
      op: test
      gt:
      - s1.ebl_loss
      - s1.ebl_threshold
    cite:
      doc: i1040sc
      locator: p. 1, Reminders, "If you report a loss on line 31 ... you may be subject to a business loss limitation ... use
        Form 461"
  - id: s1.sc_count
    printed: (helper)
    label: Number of Schedules C on the return
    type: Count
    expr:
      op: sum_over
      collection: person
      field: person.sc_count
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 3
  - id: s1.has_sc
    printed: (helper)
    label: The return has a Schedule C
    type: Bool
    expr:
      op: test
      gt:
      - s1.sc_count
      - const: 0
        type: Count
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 3
  - id: s1.sc_1a_count
    printed: (helper)
    label: Number of Schedules C with tips or overtime for Schedule 1-A
    type: Count
    expr:
      op: sum_over
      collection: person
      field: person.sc_1a
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 5; p. 108, line 14b
  - id: s1.sc_1a
    printed: (gate)
    label: A business received tips or overtime to be deducted on Schedule 1-A
    type: Bool
    expr:
      op: test
      gt:
      - s1.sc_1a_count
      - const: 0
        type: Count
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 5, and the Multiple Trades or Businesses Worksheet; p. 108, line 14b
  - id: s1.line3
    printed: '3'
    label: Business income or (loss). Attach Schedule C
    type: Dollars
    expr:
      op: sum_over
      collection: person
      field: person.sc_total
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 3; i1040sc p. 14, Line 31, "include it on Schedule 1 (Form 1040), line 3"
    refuses:
      - when: s1.ebl
        form: Form 461 (Limitation on Business Losses)
        remedy: A Schedule C loss above the excess business loss threshold is outside this tool.
        cite:
          doc: i1040sc
          locator: p. 1, Reminders, Excess business loss limitation; rp-2024-40 section 3.32
  - id: s1.line10
    printed: '10'
    label: Combine lines 1 through 7 and 9. This is your additional income. Enter here and on Form 1040, 1040-SR, or 1040-NR,
      line 8
    type: Dollars
    expr:
      op: sum
      of:
      - s1.line3
      - s1.line7
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 10 (lines 1, 2, 4 to 6, 8a to 8z and 9 are outside this tool and refused at Form 1040 line
        8 by scope.schedule1)
  - id: s1.line11
    printed: '11'
    label: Educator expenses
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.educator_deduction
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 11; i1040gi p. 93, "If you and your spouse are filing jointly and both of you were eligible
        educators, the maximum deduction is $600. However, neither spouse can deduct more than $300 of their qualified expenses"
  - id: s1.line13
    printed: '13'
    label: Health savings account deduction. Attach Form 8889
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.hsa_deduction
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 13; i8889 p. 4, "Combine the amounts on line 13 of both Forms 8889 and enter this
        amount on Schedule 1 (Form 1040), line 13"
  - id: s1.line15
    printed: '15'
    label: Deductible part of self-employment tax. Attach Schedule SE
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.se_line13
    cite:
      doc: i1040gi
      locator: p. 93, Schedule 1, line 15, "The deductible part of your self-employment tax is on line 13 of Schedule SE"
  - id: s1.line16
    printed: '16'
    label: Self-employed SEP, SIMPLE, and qualified plans
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.s16
    cite:
      doc: i1040gi
      locator: p. 93, Schedule 1, line 16; p560 chapter 3, Where To Deduct Contributions, and chapter 5
  - id: s1.line17
    printed: '17'
    label: Self-employed health insurance deduction
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.sehi
    cite:
      doc: i1040gi
      locator: pp. 94–95, Schedule 1, line 17, Self-Employed Health Insurance Deduction; Form 7206 (2025), line 14
  - id: s1.line21
    printed: '21'
    label: Student loan interest deduction
    type: NonNegDollars
    expr:
      op: copy
      from: sli.deduction
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 21
  - id: s1.line26
    printed: '26'
    label: Add lines 11 through 23 and 25. These are your adjustments to income. Enter here and on Form 1040, 1040-SR, or
      1040-NR, line 10
    type: NonNegDollars
    expr:
      op: sum
      of:
      - s1.line11
      - s1.line13
      - s1.line15
      - s1.line16
      - s1.line17
      - s1.line21
    cite:
      doc: f1040s1
      locator: Schedule 1 (2025), line 26 (lines 12, 14, 18 to 20, 23 and 25 are outside this tool and refused at Form 1040 line
        10 by scope.schedule1)
