form:
  id: ltc
  kind: form
  title: Form 7206, line 2 — qualified long-term care insurance, one per person covered
  tax_year: 2025
  note: One entry per person covered by qualified long-term care insurance established under the business.
  lines:
  - id: ltc.payments
    printed: 2(a)
    label: Total payments made for that person during the year
    type: NonNegDollars
    expr:
      op: input
      source: |-
        The qualified long-term care insurance premiums paid in 2025 for this person under a policy established under this business (not for any month you were eligible to participate in a long-term care insurance plan subsidized by your employer or your spouse's employer, or the employer of your dependent or of your child under age 27 at the end of 2025).

        This person must be you, your spouse, your dependent, or your child (son, daughter, stepchild, adopted child or foster child) who was under age 27 at the end of 2025 even if not your dependent; enter zero for anyone else, such as a parent who is not your dependent or a child 27 or older who is not your dependent.

        Enter only premiums on a qualified long-term care insurance contract, that is, one that meets all of these:

        - it only provides coverage of qualified long-term care services
        - it is guaranteed renewable
        - it provides that refunds (other than on the death of the insured or the complete surrender or cancellation of the contract) and dividends may be used only to reduce future premiums or increase future benefits
        - it generally does not provide for a cash surrender value or other money that can be paid, assigned, pledged or borrowed
        - it generally does not pay or reimburse expenses that would be reimbursed under Medicare (except where Medicare is a secondary payer or the contract makes per diem or other periodic payments without regard to expenses)
    cite:
      doc: f7206
      locator: Form 7206 (2025), line 2(a); i7206 p. 1, "You may be able to deduct the amount you paid for health insurance,
        which includes medical, dental, and vision insurance and qualified long-term care insurance for yourself, your
        spouse, and your dependents.", "The health insurance can cover your child who was under age 27 at the end of 2025,
        even if the child wasn’t your dependent.", "A child includes your son, daughter, stepchild, adopted child, or foster
        child."; i7206 p. 2, Qualified long-term care insurance contract, "A qualified long-term care insurance contract is
        an insurance contract that only provides coverage of qualified long-term care services. The contract must meet all
        the following requirements. • It must be guaranteed renewable. • It must provide that refunds, other than refunds on
        the death of the insured or complete surrender or cancellation of the contract, and dividends under the contract may
        be used only to reduce future premiums or increase future benefits. • It must generally not provide for a cash surrender
        value or other money that can be paid, assigned, pledged, or borrowed. • It must generally not pay or reimburse expenses
        incurred for services or items that would be reimbursed under Medicare, except where Medicare is a secondary payer
        or the contract makes per diem or other periodic payments without regard to expenses"
  - id: ltc.age
    printed: (helper)
    label: That person's age at the end of 2025
    type: Enum(ltc_age)
    expr:
      op: input
      source: 'This person''s age at the end of 2025: 40 or younger (to40), 41 to 50 (to50), 51 to 60 (to60), 61 to 70 (to70),
        or 71 or older (over70)'
    cite:
      doc: f7206
      locator: Form 7206 (2025), line 2(b), "Use the person's age at the end of the tax year"
  - id: ltc.limit
    printed: 2(b)
    label: The amount for that person's age
    type: NonNegDollars
    expr:
      op: keyed_lookup
      table: ltc_limit
      keys:
      - ltc.age
    cite:
      doc: f7206
      locator: Form 7206 (2025), line 2(b), "The amount shown below. Use the person’s age at the end of the tax year"
  - id: ltc.amount
    printed: (helper)
    label: The smaller of (a) or (b)
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - ltc.payments
      - ltc.limit
    cite:
      doc: f7206
      locator: Form 7206 (2025), line 2, "enter for each person covered the smaller of (a) or (b)"; i7206 pp. 1–2
  collection:
    parent: sc
    cite:
      doc: f7206
      locator: Form 7206 (2025), line 2, "If more than one person is covered, figure separately the amount to enter for each person"; i7206 pp. 1–2
