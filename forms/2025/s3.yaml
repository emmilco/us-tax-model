        locator: p. 2, Part I—Information About Your Business, "If you are claiming a credit for the tax on undyed kerosene you purchased (other than from a blocked pump) and used in your home during the tax period for heating, lighting, or cooking"
    - id: s3.other_credit_14
      printed: (gate)
      type: Bool
      label: 'Helper of s3.other_credit: the same, from the situation of s3.prior_amt_if_forms on'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.prior_amt_if_forms
            - const: true
          then: s3.prior_amt_if_forms
        - guard:
            op: test
            eq:
            - s3.prior_amt_if_forms
            - const: false
          then: s3.other_credit_15
      cite:
        doc: i8801
        locator: p. 1, Who Should File, "An AMT liability and adjustments or preferences other than exclusion items"; f8801 p. 2, Part II, "Enter the amount from your 2024 Form 6251, line 11"
    - id: s3.other_credit_15
      printed: (gate)
      type: Bool
      label: 'Helper of s3.other_credit: the same, from the situation of s3.prior_forms_if_forms on'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.prior_forms_if_forms
            - const: true
          then: s3.prior_forms_if_forms
        - guard:
            op: test
            eq:
            - s3.prior_forms_if_forms
            - const: false
          then: s3.other_credit_16
      cite:
        doc: i3800
        locator: p. 3, Carryback and Carryforward of Unused Credit, "unused general business credits may be carried back 1 year and carried forward 20 years"; f8396 p. 2, Part II—Mortgage Interest Credit Carryforward to 2026, "you may have an unused credit to carry forward to the next 3 tax years"; i8801 p. 1, Who Should File, "A credit carryforward to 2025 (on 2024 Form 8801, line 26)"; f8834 p. 2, Line 1, "Enter the qualified electric vehicle passive activity credits allowed for your current tax year from Form 8582-CR"; i8839 p. 1, Purpose of Form, "You have a carryforward of an adoption credit from 2024"; f8859 p. 1, Purpose of Form, "to claim a carryforward of the District of Columbia first-time homebuyer credit from 2024"; i8912 p. 3, Line 12, "you may carry the unused portion of the credit to the next tax year"
    - id: s3.other_credit_16
      printed: (gate)
      type: Bool
      label: 'Helper of s3.other_credit: the same, from the situation of s3.repaid_income on'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.repaid_income
            - const: true
          then: s3.repaid_income
        - guard:
            op: test
            eq:
            - s3.repaid_income
            - const: false
          then: s3.mcc_if_interest
      cite:
        doc: p525
        locator: p. 36, Repayments, "If the amount you repaid was more than $3,000, you can deduct the repayment as an other itemized deduction on Schedule A (Form 1040), line 16, if you included the income under a claim of right" and "However, you can choose to take a credit for the year of repayment"; i1040gi p. 117, Line 13b, "If you are claiming a credit for repayment of amounts you included in your income in an earlier year because it appeared you had a right to the income"
    - id: s3.line7
      printed: '7'
      type: NonNegDollars
      label: Total other nonrefundable credits. Add lines 6a through 6z
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 7
      note: 'Zero: this tool prepares none of the credits of lines 6a through 6m, and each situation that gives one is refused here.'
      refuses:
      - when: s3.adoption_if_any
        form: Form 8839 (adoption credit)
        remedy: An adoption that became final in 2025, or adoption costs paid in 2025, can give the adoption credit (Form 8839, with its refundable part on Form 1040 line 30), which this tool does not prepare.
        cite:
          doc: i8839
          locator: p. 1, Purpose of Form, "You may be able to take this credit in 2025 if any of the following statements are true"
      - when: s3.adoption_us_if_earlier
        form: Form 8839 (adoption credit)
        remedy: Costs paid in 2024 toward adopting a U.S. child, where the adoption was not final at the end of 2024, are credited on the 2025 return (Form 8839), which this tool does not prepare.
        cite:
          doc: i8839
          locator: p. 1, Purpose of Form, "2024 and the adoption wasn’t final at the end of 2024"; p. 3, Domestic Adoption, "the year after the year of the payment"
      - when: s3.credit_bond
        form: Form 8912 (credit to holders of tax credit bonds)
        remedy: A tax credit from a bond, or one a fund passes on (Form 1097-BTC), is claimed on Form 8912, which this tool does not prepare.
        cite:
          doc: i8912
          locator: p. 1, Who Can Claim the Credits, "can claim the credit by filing Form 8912 for each tax year in which it holds the bond on a credit allowance date"; p. 2, Line 1, "This amount is the total bond credits reported to you on Form(s) 1097-BTC"
      - when: s3.elderly_credit_if_asked
        form: Schedule R (credit for the elderly or the disabled)
        remedy: The credit for the elderly or the disabled (Schedule R) is outside this tool. To go on without the credit, answer No to that question.
        cite:
          doc: i1040sr
          locator: p. 1, Qualified Individual, "You are a qualified individual for this credit if you are a U.S. citizen or resident alien"
      - when: s3.ev_dealer_if_ev
        form: Form 8936 (clean vehicle credits)
        remedy: A dealer took the clean vehicle credit off the price, so Form 8936 and its Schedule A must be filed with this return; this tool does not prepare them.
        cite:
          doc: i8936
          locator: p. 1, Purpose of Form, "You must file Form 8936 and Schedule A (Form 8936) if you purchased a new or used clean vehicle from a registered dealer and reduced the amount you paid at the time of sale by transferring the credit to the dealer"
      - when: s3.ev_credit_if_bought
        form: Form 8936 (clean vehicle credits)
        remedy: This tool does not prepare the clean vehicle credits (Form 8936). To go on without the credit, answer No to that question.
        cite:
          doc: i8936
          locator: p. 1, Purpose of Form, "to figure the following credits for clean vehicles you placed in service during your tax year"
      - when: s3.ev_equipment_if_ev
        form: Form 8911 (alternative fuel vehicle refueling property credit)
        remedy: This tool does not prepare the credit for vehicle charging or fueling equipment (Form 8911). To go on without the credit, answer No to that question.
        cite:
          doc: i8911
          locator: p. 1, Purpose of Form, "to figure your credit for alternative fuel vehicle refueling property you placed in service during your tax year"
      - when: s3.prior_amt_if_forms
        form: Form 8801 (credit for prior year minimum tax)
        remedy: Alternative minimum tax on your 2024 return can give a credit for 2025 (Form 8801), which this tool does not prepare.
        cite:
          doc: i8801
          locator: p. 1, Who Should File, "An AMT liability and adjustments or preferences other than exclusion items"
      - when: s3.prior_forms_if_forms
        form: Credit carried from an earlier year (Form 3800, 8396, 8801, 8834, 8839, 8859 or 8912)
        remedy: A credit carried over from an earlier year is outside this tool.
        cite:
          doc: i3800
          locator: p. 3, Carryback and Carryforward of Unused Credit, "unused general business credits may be carried back 1 year and carried forward 20 years"; f8396 p. 2, Part II—Mortgage Interest Credit Carryforward to 2026, "you may have an unused credit to carry forward to the next 3 tax years"; i8801 p. 1, Who Should File, "A credit carryforward to 2025 (on 2024 Form 8801, line 26)"; f8834 p. 2, Line 1, "Enter the qualified electric vehicle passive activity credits allowed for your current tax year from Form 8582-CR"; i8839 p. 1, Purpose of Form, "You have a carryforward of an adoption credit from 2024"; f8859 p. 1, Purpose of Form, "to claim a carryforward of the District of Columbia first-time homebuyer credit from 2024"; i8912 p. 3, Line 12, "you may carry the unused portion of the credit to the next tax year"
      - when: s3.mcc_if_interest
        form: Form 8396 (mortgage interest credit)
        remedy: A mortgage credit certificate gives the mortgage interest credit (Form 8396), which also reduces the home mortgage interest deducted on Schedule A; this tool does not prepare it.
        cite:
          doc: f8396
          locator: p. 2, Who Can Claim the Credit, "You can claim the credit only if you were issued a qualified Mortgage Credit Certificate (MCC) by a state or local governmental unit or agency"; p. 2, Line 3, "you must reduce the amount of home mortgage interest you would otherwise deduct on Schedule A by the amount on Form 8396, line 3"
    - id: s3.line8
      printed: "8"
      type: Dollars
      label: Add lines 1 through 4, 5a, 5b, and 7. Enter here and on Form 1040, line 20
      expr:
        op: sum
        of:
          - s3.line1
          - s3.line2
          - s3.line3
          - s3.line4
          - s3.line5a
          - s3.line5b
          - s3.line7
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 8
    - id: s3.mfs
      printed: (gate)
      label: Married filing separately
      type: Bool
      expr:
        op: test
        eq:
          - f1040.status
          - const: mfs
      cite:
        doc: i1040gi
        locator: p. 14, Married Filing Separately
    - id: s3.line9
      printed: "9"
      label: Net premium tax credit. Attach Form 8962
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f8962.any
                - const: true
            then: f8962.line26
          - guard:
              op: test
              eq:
                - f8962.any
                - const: false
            then: s3.zero
      cite:
        doc: f1040s3
        locator: 'p. 1, Part II, line 9, "Net premium tax credit. Attach Form 8962"; i1040gi p. 117, "your net premium tax credit
          will be shown on Form 8962, line 26."'
    - id: s3.line10
      printed: "10"
      label: Amount paid with request for extension to file (see instructions)
      type: NonNegDollars
      expr:
        op: input
        source: 'Amount paid with request for extension to file: the payment you (or, on a joint return, your spouse) made to
          get an automatic extension, or any amount you (or, on a joint return, your spouse) paid with Form 4868 or Form 2350,
          not counting any fee charged for making the payment; zero if none'
      cite:
        doc: f1040s3
        locator: 'Schedule 3 (2025), line 10; i1040gi p. 117, Line 10, "enter the amount of the payment or any amount you
          paid with Form 4868", "If you paid a fee when making your payment, don’t include on line 10 the fee you were
          charged" and "Also, include any amounts paid with Form 2350"; f4868 p. 2, "If you and your spouse each filed a
          separate Form 4868 but later file a joint return for 2025, enter the total paid with both Forms 4868 on the appropriate
          line of your joint return"'
    - id: s3.line11
      printed: "11"
      label: Excess social security and tier 1 RRTA tax withheld
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.credit
      cite:
        doc: i1040gi
        locator: 'p. 117, Line 11, Excess Social Security and Tier 1 RRTA Tax Withheld, "Figure this amount separately for you and your spouse"'
      refuses:
        - when: s3.mfs
          form: Married filing separately
          remedy: The rules for a married filing separately return (among them a spouse who itemizes, the Social
            Security base for spouses who lived together and the credits a separate return cannot take) are outside
            this tool. Married filing jointly is supported.
          cite:
            doc: i1040gi
            locator: p. 14, Married Filing Separately
    - id: s3.line12
      printed: '12'
      label: Credit for federal tax on fuels. Attach Form 4136
      type: NonNegDollars
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 12; i1040gi p. 117, Line 12, "Enter any credit for federal excise taxes paid on fuels"
      note: 'Zero: this tool does not prepare Form 4136, and a wish to claim its credit for kerosene used at home is refused here (a business’s claim is refused on its Schedule C).'
      refuses:
      - when: s3.kerosene_credit_if_kerosene
        form: Form 4136 (credit for federal tax paid on fuels)
        remedy: This tool does not prepare the credit for federal tax paid on fuels (Form 4136). To go on without the credit, answer No to that question.
        cite:
          doc: i4136
          locator: p. 2, Part I—Information About Your Business, "If you are claiming a credit for the tax on undyed kerosene you purchased (other than from a blocked pump) and used in your home during the tax period for heating, lighting, or cooking"
    - id: s3.line14
      printed: '14'
      label: Total other payments or refundable credits. Add lines 13a through 13z
      type: NonNegDollars
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 14
      note: 'Zero: this tool does not prepare the amounts of lines 13a through 13z, and each situation asked about that gives one is refused here.'
      refuses:
      - when: s3.farmland_deferral_if_sold
        form: Form 1062 (Schedule 3 line 13z)
        remedy: The election to pay the tax on a sale of farmland in installments (Form 1062) is reported on Schedule 3 line 13z, which this tool does not prepare.
        cite:
          doc: i1040gi
          locator: p. 117, Line 13z, "Use line 13z to report the credit under section 960(c) with respect to an excess limitation account", "Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin Islands" and "If you made the election to defer net income tax attributable to the gain on the sale or exchange of qualified farmland property"
      - when: s3.section960c_if_foreign
        form: Schedule 3 line 13z (section 960(c) credit)
        remedy: The credit under section 960(c) is reported on Schedule 3 line 13z, which this tool does not prepare.
        cite:
          doc: i1040gi
          locator: p. 117, Line 13z, "Use line 13z to report the credit under section 960(c) with respect to an excess limitation account", "Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin Islands" and "If you made the election to defer net income tax attributable to the gain on the sale or exchange of qualified farmland property"
      - when: s3.section965_if_foreign
        form: Schedule 3 line 13d (net 965 tax liability)
        remedy: A net 965 tax liability paid in installments is reported on Schedule 3 line 13d, which this tool does not prepare.
        cite:
          doc: i1040gi
          locator: p. 117, Line 13d, "If you elected to pay your net 965 tax liability in installments, report the deferred amount on line 13d"
      - when: s3.virgin_islands_if_foreign
        form: Form 8689 (Schedule 3 line 13z)
        remedy: Tax allocable to the U.S. Virgin Islands (Form 8689) is reported on Schedule 3 line 13z, which this tool does not prepare.
        cite:
          doc: i1040gi
          locator: p. 117, Line 13z, "Use line 13z to report the credit under section 960(c) with respect to an excess limitation account", "Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin Islands" and "If you made the election to defer net income tax attributable to the gain on the sale or exchange of qualified farmland property"
      - when: s3.repaid_income
        form: Repayment of income of an earlier year (Schedule 3 line 13b or Schedule A line 16)
        remedy: A repayment of more than $3,000 of income reported in an earlier year gives a choice between a deduction and a credit (Schedule 3 line 13b), which this tool does not figure.
        cite:
          doc: p525
          locator: p. 36, Repayments, "If the amount you repaid was more than $3,000, you can deduct the repayment as an other itemized deduction on Schedule A (Form 1040), line 16, if you included the income under a claim of right" and "However, you can choose to take a credit for the year of repayment"; i1040gi p. 117, Line 13b, "If you are claiming a credit for repayment of amounts you included in your income in an earlier year because it appeared you had a right to the income"
    - id: s3.line15
      printed: "15"
      label: Add lines 9 through 12 and 14. Enter here and on Form 1040, line 31
      type: NonNegDollars
      expr:
        op: sum
        of:
          - s3.line9
          - s3.line10
          - s3.line11
          - s3.line12
          - s3.line14
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 15
  note: Line 11 Social Security path is computed. Lines 7, 12 and 14 are zero behind refusals, because the credits and payments
    of lines 6a to 6z, 12 and 13a to 13z are not prepared; the situations that give them are asked about one by one.
