form:
  id: s3
  kind: form
  title: Schedule 3 — selected lines
  tax_year: 2025
  lines:
    - id: s3.line1
      printed: "1"
      type: Dollars
      label: Foreign tax credit
      expr:
        op: copy
        from: ftc.credit
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), Part I line 1
    - id: s3.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), lines 1 and 8
    - id: s3.line8
      printed: "8"
      type: Dollars
      label: Add lines 1 through 4, 5a, 5b, and 7. Enter here and on Form 1040, line 20
      expr:
        op: sum
        of:
          - s3.line1
          - s3.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 8
      refuses:
        - when: scope.credits
          form: Schedule 8812 / other credit forms
          remedy: Dependent and other unsupported credits require forms outside this proof of concept.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: s3.married
      printed: (gate)
      label: Married filing status requires unsupported per-spouse interview
      type: Bool
      expr:
        op: test
        any:
          - op: test
            eq:
              - f1040.status
              - const: mfj
          - op: test
            eq:
              - f1040.status
              - const: mfs
      cite:
        doc: i1040gi
        locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: s3.line9
      printed: "9"
      label: Net premium tax credit. Attach Form 8962
      type: NonNegDollars
      expr:
        op: input
        source: Net premium tax credit from Form 8962 (supplied subtotal; preparation outside Stage 2)
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 9
      note: Supplied subtotal; this stage does not prepare the underlying form or lines.
    - id: s3.line10
      printed: "10"
      label: Amount paid with request for extension to file (see instructions)
      type: NonNegDollars
      expr:
        op: input
        source: Amount paid with request for extension to file
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 10
    - id: s3.line11
      printed: "11"
      label: Excess social security and tier 1 RRTA tax withheld
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.credit
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 11
      refuses:
        - when: s3.married
          form: Schedule 3 line 11 (per-spouse computation)
          remedy: The interview currently represents one person. Married filing statuses are unsupported for
            this per-spouse rule.
          cite:
            doc: i1040gi
            locator: p. 117, Schedule 3 line 11 — Excess Social Security and Tier 1 RRTA Tax Withheld
    - id: s3.line12
      printed: "12"
      label: Credit for federal tax on fuels. Attach Form 4136
      type: NonNegDollars
      expr:
        op: input
        source: Credit for federal tax on fuels from Form 4136 (supplied subtotal; preparation outside Stage
          2)
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 12
      note: Supplied subtotal; this stage does not prepare the underlying form or lines.
    - id: s3.line14
      printed: "14"
      label: Total other payments or refundable credits. Add lines 13a through 13z
      type: NonNegDollars
      expr:
        op: input
        source: Total other payments or refundable credits (supplied subtotal; preparation outside Stage 2)
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 14
      note: Supplied subtotal; this stage does not prepare the underlying form or lines.
    - id: s3.line15
      printed: "15"
      label: Add lines 9 through 12 and 14. Enter here and on Form 1040, line 31
      type: NonNegDollars
      expr:
        op: sum
        of:
          - s3.line9
          - s3.line10
          - s3.line11
          - s3.line12
          - s3.line14
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 15
  note: Line 11 Social Security path is computed. Other Part II components are explicit supplied
    subtotals, not prepared forms; unknowns never default to zero.
