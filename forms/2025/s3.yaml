form:
  id: s3
  kind: form
  title: Schedule 3 — selected lines
  tax_year: 2025
  lines:
    - id: s3.line1
      printed: "1"
      type: Dollars
      label: Foreign tax credit
      expr:
        op: copy
        from: ftc.credit
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), Part I line 1
    - id: s3.line2
      printed: "2"
      type: NonNegDollars
      label: Credit for child and dependent care expenses from Form 2441, line 11. Attach Form 2441
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f2441.care
                - const: true
            then: f2441.line11
          - guard:
              op: test
              eq:
                - f2441.care
                - const: false
            then: s3.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 2
      note: Zero when you had no care expenses for a qualifying person (Form 2441 Part II is then not completed).
    - id: s3.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), lines 1 and 8
    - id: s3.line4
      printed: "4"
      type: NonNegDollars
      label: Retirement savings contributions credit. Attach Form 8880
      expr:
        op: copy
        from: f8880.line12
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 4
    - id: s3.line5a
      printed: 5a
      type: NonNegDollars
      label: Residential clean energy credit from Form 5695, line 15
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f5695.part1_any
                - const: true
            then: f5695.line15
          - guard:
              op: test
              eq:
                - f5695.part1_any
                - const: false
            then: s3.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 5a (zero when Form 5695 Part I is not completed)
    - id: s3.line5b
      printed: 5b
      type: NonNegDollars
      label: Energy efficient home improvement credit from Form 5695, line 32
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f5695.part2_any
                - const: true
            then: f5695.line32
          - guard:
              op: test
              eq:
                - f5695.part2_any
                - const: false
            then: s3.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 5b (zero when Form 5695 Part II is not completed)
    - id: s3.line8
      printed: "8"
      type: Dollars
      label: Add lines 1 through 4, 5a, 5b, and 7. Enter here and on Form 1040, line 20
      expr:
        op: sum
        of:
          - s3.line1
          - s3.line2
          - s3.line4
          - s3.line5a
          - s3.line5b
          - s3.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 8
      refuses:
        - when: scope.credits
          form: Other credit forms (Schedule 3 lines 3 and 6a to 6z; Form 1040 lines 29 to 31)
          remedy: Credits other than the foreign tax credit by election, the excess social security credit, the Schedule 8812 credits, the earned income credit, the child and dependent care credit, the saver's credit, the residential energy credits and the net premium tax credit entered from Form 8962 require forms outside this proof of concept.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: s3.mfs
      printed: (gate)
      label: Married filing separately
      type: Bool
      expr:
        op: test
        eq:
          - f1040.status
          - const: mfs
      cite:
        doc: i1040gi
        locator: p. 14, Married Filing Separately
    - id: s3.line9
      printed: "9"
      label: Net premium tax credit. Attach Form 8962
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f8962.any
                - const: true
            then: f8962.line26
          - guard:
              op: test
              eq:
                - f8962.any
                - const: false
            then: s3.zero
      cite:
        doc: f1040s3
        locator: 'p. 1, Part II, line 9, "Net premium tax credit. Attach Form 8962"; i1040gi p. 117, "your net premium tax credit
          will be shown on Form 8962, line 26."'
    - id: s3.line10
      printed: "10"
      label: Amount paid with request for extension to file (see instructions)
      type: NonNegDollars
      expr:
        op: input
        source: Amount paid with request for extension to file
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 10
    - id: s3.line11
      printed: "11"
      label: Excess social security and tier 1 RRTA tax withheld
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.credit
      cite:
        doc: i1040gi
        locator: 'p. 117, Line 11, Excess Social Security and Tier 1 RRTA Tax Withheld, "Figure this amount separately for you and your spouse"'
      refuses:
        - when: s3.mfs
          form: Married filing separately
          remedy: The rules for a married filing separately return (among them a spouse who itemizes, the Social
            Security base for spouses who lived together and the credits a separate return cannot take) are outside
            this tool. Married filing jointly is supported.
          cite:
            doc: i1040gi
            locator: p. 14, Married Filing Separately
    - id: s3.line12
      printed: "12"
      label: Credit for federal tax on fuels. Attach Form 4136
      type: NonNegDollars
      expr:
        op: input
        source: Credit for federal tax on fuels from Form 4136 (supplied subtotal; preparation outside Stage
          2)
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 12
      note: Supplied subtotal; this stage does not prepare the underlying form or lines.
    - id: s3.line14
      printed: "14"
      label: Total other payments or refundable credits. Add lines 13a through 13z
      type: NonNegDollars
      expr:
        op: input
        source: Total other payments or refundable credits (supplied subtotal; preparation outside Stage 2)
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 14
      note: Supplied subtotal; this stage does not prepare the underlying form or lines.
    - id: s3.line15
      printed: "15"
      label: Add lines 9 through 12 and 14. Enter here and on Form 1040, line 31
      type: NonNegDollars
      expr:
        op: sum
        of:
          - s3.line9
          - s3.line10
          - s3.line11
          - s3.line12
          - s3.line14
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 15
  note: Line 11 Social Security path is computed. Other Part II components are explicit supplied
    subtotals, not prepared forms; unknowns never default to zero.
