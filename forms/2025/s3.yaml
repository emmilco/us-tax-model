form:
  id: s3
  kind: form
  title: Schedule 3 — selected lines
  tax_year: 2025
  lines:
    - id: s3.line1
      printed: "1"
      type: Dollars
      label: Foreign tax credit
      expr:
        op: copy
        from: ftc.credit
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), Part I line 1
    - id: s3.line2
      printed: "2"
      type: NonNegDollars
      label: Credit for child and dependent care expenses from Form 2441, line 11. Attach Form 2441
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f2441.care
                - const: true
            then: f2441.line11
          - guard:
              op: test
              eq:
                - f2441.care
                - const: false
            then: s3.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 2
      note: Zero when you had no care expenses for a qualifying person (Form 2441 Part II is then not completed).
    - id: s3.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), lines 1 and 8
    - id: s3.line3
      printed: "3"
      type: Dollars
      label: Education credits from Form 8863, line 19
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f8863.eligible
                - const: true
            then: f8863.line19
          - guard:
              op: test
              eq:
                - f8863.eligible
                - const: false
            then: s3.zero
      cite:
        doc: f1040s3
        locator: 'p. 1, Part I, line 3, "Education credits from Form 8863, line 19"'
    - id: s3.line4
      printed: "4"
      type: NonNegDollars
      label: Retirement savings contributions credit. Attach Form 8880
      expr:
        op: copy
        from: f8880.line12
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 4
    - id: s3.line5a
      printed: 5a
      type: NonNegDollars
      label: Residential clean energy credit from Form 5695, line 15
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f5695.part1_any
                - const: true
            then: f5695.line15
          - guard:
              op: test
              eq:
                - f5695.part1_any
                - const: false
            then: s3.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 5a (zero when Form 5695 Part I is not completed)
    - id: s3.line5b
      printed: 5b
      type: NonNegDollars
      label: Energy efficient home improvement credit from Form 5695, line 32
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f5695.part2_any
                - const: true
            then: f5695.line32
          - guard:
              op: test
              eq:
                - f5695.part2_any
                - const: false
            then: s3.zero
      cite:
        doc: f1040s3
        locator: Schedule 3 (2025), line 5b (zero when Form 5695 Part II is not completed)
    - id: s3.no
      printed: (helper)
      type: Bool
      label: Year parameter s3.no (false)
      expr:
        op: param
        ref: s3.no
      cite:
        doc: i1040gi
        locator: p. 116, Lines 6a Through 6z, "Leave line 6z blank"
    - id: s3.adoption_any
      printed: (helper)
      type: Bool
      label: In 2024 or 2025, did you (or, on a joint return, your spouse) adopt a child, or pay expenses in connection with adopting a child or trying to adopt one?
      expr:
        op: input
        source: In 2024 or 2025, did you (or, on a joint return, your spouse) adopt a child, or pay expenses in connection with adopting a child or trying to adopt one?
      cite:
        doc: i8839
        locator: p. 1, Purpose of Form, "You may be able to take this credit in 2025 if any of the following statements are true"; p. 3, Domestic Adoption, "any year before the year the adoption becomes final"
    - id: s3.adoption
      printed: (helper)
      type: Bool
      gated_by: s3.adoption_if_any
      label: Did you (or, on a joint return, your spouse) adopt a child whose adoption became final in 2025, or pay expenses in 2025 in connection with adopting a child or trying to adopt one?
      expr:
        op: input
        source: Did you (or, on a joint return, your spouse) adopt a child whose adoption became final in 2025, or pay expenses in 2025 in connection with adopting a child or trying to adopt one?
      cite:
        doc: i8839
        locator: p. 1, Purpose of Form, "You may be able to take this credit in 2025 if any of the following statements are true"; i1040gi p. 116, Lines 6a Through 6z, "You may be able to take the adoption credit if you paid expenses to adopt a child or you adopted a child with special needs and the adoption became final in 2025"
    - id: s3.adoption_if_any
      printed: (gate)
      type: Bool
      label: Whether an adoption became final in 2025 or adoption expenses were paid in 2025, asked only with an adoption or adoption expenses in 2024 or 2025 (false without one)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.adoption_any
            - const: true
          then: s3.adoption
        - guard:
            op: test
            eq:
            - s3.adoption_any
            - const: false
          then: s3.no
      cite:
        doc: i8839
        locator: p. 1, Purpose of Form, "You may be able to take this credit in 2025 if any of the following statements are true"; i1040gi p. 116, Lines 6a Through 6z, "You may be able to take the adoption credit if you paid expenses to adopt a child or you adopted a child with special needs and the adoption became final in 2025"
    - id: s3.adoption_earlier
      printed: (helper)
      type: Bool
      gated_by: s3.adoption_earlier_if_any
      label: In 2024, did you (or, on a joint return, your spouse) pay expenses in connection with adopting a child or trying to adopt one, where the adoption was not final at the end of 2024?
      expr:
        op: input
        source: In 2024, did you (or, on a joint return, your spouse) pay expenses in connection with adopting a child or trying to adopt one, where the adoption was not final at the end of 2024?
      cite:
        doc: i8839
        locator: p. 1, Purpose of Form, "2024 and the adoption wasn’t final at the end of 2024"; p. 3, Domestic Adoption, "any year before the year the adoption becomes final"
    - id: s3.adoption_earlier_if_any
      printed: (gate)
      type: Bool
      label: Whether expenses were paid in 2024 for an adoption not final at the end of 2024, asked only with an adoption or adoption expenses in 2024 or 2025 (false without one)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.adoption_any
            - const: true
          then: s3.adoption_earlier
        - guard:
            op: test
            eq:
            - s3.adoption_any
            - const: false
          then: s3.no
      cite:
        doc: i8839
        locator: p. 1, Purpose of Form, "2024 and the adoption wasn’t final at the end of 2024"; p. 3, Domestic Adoption, "any year before the year the adoption becomes final"
    - id: s3.adoption_us
      printed: (helper)
      type: Bool
      gated_by: s3.adoption_us_if_earlier
      label: Was a child of such an adoption a citizen or resident of the United States (including U.S. territories) at the time the adoption effort began?
      expr:
        op: input
        source: Was a child of such an adoption a citizen or resident of the United States (including U.S. territories) at the time the adoption effort began?
      cite:
        doc: i8839
        locator: p. 3, Domestic Adoption, "If the eligible child is a U.S. citizen or resident, you can take the adoption credit or exclusion even if the adoption never became final" and "A child is a foreign child if they weren’t a citizen or resident of the United States (including U.S. territories) at the time the adoption effort began"
    - id: s3.adoption_us_if_earlier
      printed: (gate)
      type: Bool
      label: Whether the child of an adoption paid toward in 2024 and not final at the end of 2024 was a U.S. child, asked only with such payments (false without them)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.adoption_earlier_if_any
            - const: true
          then: s3.adoption_us
        - guard:
            op: test
            eq:
            - s3.adoption_earlier_if_any
            - const: false
          then: s3.no
      cite:
        doc: i8839
        locator: p. 3, Domestic Adoption, "If the eligible child is a U.S. citizen or resident, you can take the adoption credit or exclusion even if the adoption never became final" and "A child is a foreign child if they weren’t a citizen or resident of the United States (including U.S. territories) at the time the adoption effort began"
    - id: s3.credit_bond
      printed: (helper)
      type: Bool
      label: For 2025, were you (or, on a joint return, your spouse) allowed a credit as the holder of a tax credit bond (a clean renewable energy bond, new clean renewable energy bond, qualified energy conservation bond, qualified zone academy bond, qualified school construction bond or build America bond), held by you or a nominee or through a fund or other pass-through entity, whether or not reported on Form 1097-BTC?
      expr:
        op: input
        source: For 2025, were you (or, on a joint return, your spouse) allowed a credit as the holder of a tax credit bond (a clean renewable energy bond, new clean renewable energy bond, qualified energy conservation bond, qualified zone academy bond, qualified school construction bond or build America bond), held by you or a nominee or through a fund or other pass-through entity, whether or not reported on Form 1097-BTC?
      cite:
        doc: i8912
        locator: p. 1, Purpose of Form, "Use Form 8912 to claim the credit for the following tax credit bonds"; p. 2, Line 1, "This amount is the total bond credits reported to you on Form(s) 1097-BTC"; p. 3, Part IV, "Complete and attach a Part IV for each bond you held or bond credits received from a pass-through entity that weren’t reported to you on Form(s) 1097-BTC"
    - id: s3.seniors
      printed: (helper)
      type: Count
      label: Number of people on the return born before January 2, 1961
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.age65
          - const: true
      cite:
        doc: i1040sr
        locator: p. 1, Qualified Individual, "You were age 65 or older at the end of 2025" and "You were under age 65 (discussed later) at the end of 2025"
    - id: s3.under65s
      printed: (helper)
      type: Count
      label: Number of people on the return born after January 1, 1961
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
          - person.age65
          - const: false
      cite:
        doc: i1040sr
        locator: p. 1, Qualified Individual, "You were age 65 or older at the end of 2025" and "You were under age 65 (discussed later) at the end of 2025"
    - id: s3.any_senior
      printed: (helper)
      type: Bool
      label: Someone on the return is 65 or older
      expr:
        op: test
        gt:
        - s3.seniors
        - const: 0
          type: Count
      cite:
        doc: i1040sr
        locator: p. 1, Qualified Individual, "You were age 65 or older at the end of 2025" and "You were under age 65 (discussed later) at the end of 2025"
    - id: s3.any_under65
      printed: (helper)
      type: Bool
      label: Someone on the return is under 65
      expr:
        op: test
        gt:
        - s3.under65s
        - const: 0
          type: Count
      cite:
        doc: i1040sr
        locator: p. 1, Qualified Individual, "You were age 65 or older at the end of 2025" and "You were under age 65 (discussed later) at the end of 2025"
    - id: s3.disability_retired
      printed: (helper)
      type: Bool
      label: Did you (or, on a joint return, your spouse), if under age 65 at the end of 2025, retire on permanent and total disability?
      expr:
        op: input
        source: Did you (or, on a joint return, your spouse), if under age 65 at the end of 2025, retire on permanent and total disability?
      cite:
        doc: i1040sr
        locator: p. 1, Qualified Individual, "You retired on permanent and total disability"
    - id: s3.disability_if_under65
      printed: (gate)
      type: Bool
      label: Whether a person under 65 on the return retired on permanent and total disability, asked only when someone on the return was born after January 1, 1961 (false when everyone is 65 or older and qualifies by age)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.any_under65
            - const: true
          then: s3.disability_retired
        - guard:
            op: test
            eq:
            - s3.any_under65
            - const: false
          then: s3.no
      cite:
        doc: i1040sr
        locator: p. 1, Qualified Individual, "You retired on permanent and total disability"
    - id: s3.elderly_ask
      printed: (helper)
      type: Bool
      label: Someone on the return is 65 or older, or a person under 65 retired on permanent and total disability (the credit for the elderly or the disabled is asked about)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.any_senior
            - const: true
          then: s3.any_senior
        - guard:
            op: test
            eq:
            - s3.any_senior
            - const: false
          then: s3.disability_if_under65
      cite:
        doc: i1040sr
        locator: p. 1, Qualified Individual, "You were age 65 or older at the end of 2025" and "You retired on permanent and total disability"
    - id: s3.elderly_credit
      printed: (helper)
      type: Bool
      gated_by: s3.elderly_credit_if_asked
      label: Do you (or, on a joint return, your spouse) want to claim the credit for the elderly or the disabled (Schedule R)?
      expr:
        op: input
        source: Do you (or, on a joint return, your spouse) want to claim the credit for the elderly or the disabled (Schedule R)?
      cite:
        doc: i1040sr
        locator: p. 1, Qualified Individual, "You are a qualified individual for this credit if you are a U.S. citizen or resident alien"; p. 3, Income Limits, "If your AGI or your nontaxable pensions, annuities, or disability income are equal to or more than the income limits, you can’t take the credit"
    - id: s3.elderly_credit_if_asked
      printed: (gate)
      type: Bool
      label: Whether the credit for the elderly or the disabled is wanted, asked only when someone on the return is 65 or older or retired on permanent and total disability (false otherwise)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.elderly_ask
            - const: true
          then: s3.elderly_credit
        - guard:
            op: test
            eq:
            - s3.elderly_ask
            - const: false
          then: s3.no
      cite:
        doc: i1040sr
        locator: p. 1, Qualified Individual, "You are a qualified individual for this credit if you are a U.S. citizen or resident alien"; p. 3, Income Limits, "If your AGI or your nontaxable pensions, annuities, or disability income are equal to or more than the income limits, you can’t take the credit"
    - id: s3.ev
      printed: (helper)
      type: Bool
      label: In 2025, did you (or, on a joint return, your spouse) take possession of an electric, plug-in hybrid or fuel cell vehicle (a clean vehicle placed in service in 2025), or place in service at your home property to recharge an electric vehicle or to store or dispense an alternative fuel into a vehicle?
      expr:
        op: input
        source: In 2025, did you (or, on a joint return, your spouse) take possession of an electric, plug-in hybrid or fuel cell vehicle (a clean vehicle placed in service in 2025), or place in service at your home property to recharge an electric vehicle or to store or dispense an alternative fuel into a vehicle?
      cite:
        doc: i8936
        locator: p. 1, Purpose of Form, "to figure the following credits for clean vehicles you placed in service during your tax year"; p. 2, New Clean Vehicle Certification and Other Requirements, "You placed the vehicle in service during the tax year"; p. 7, Line 3, "The date the vehicle was placed in service is the date the taxpayer takes possession of the vehicle"; i8911 p. 1, Purpose of Form, "to figure your credit for alternative fuel vehicle refueling property you placed in service during your tax year"; i8911 p. 2, Qualified Alternative Fuel Vehicle Refueling Property, "To recharge an electric vehicle, but only if the recharging property is located at the point where the vehicle is recharged"
    - id: s3.ev_dealer
      printed: (helper)
      type: Bool
      gated_by: s3.ev_dealer_if_ev
      label: Did you (or, on a joint return, your spouse) purchase a new or used clean vehicle from a registered dealer and transfer the credit to the dealer at the time of sale, for a reduced price or another immediate financial benefit?
      expr:
        op: input
        source: Did you (or, on a joint return, your spouse) purchase a new or used clean vehicle from a registered dealer and transfer the credit to the dealer at the time of sale, for a reduced price or another immediate financial benefit?
      cite:
        doc: i8936
        locator: p. 1, Purpose of Form, "You must file Form 8936 and Schedule A (Form 8936) if you purchased a new or used clean vehicle from a registered dealer and reduced the amount you paid at the time of sale by transferring the credit to the dealer"; p. 1, Reminders, "you may be able to transfer the credit amount to the dealer at the time of sale and receive an immediate financial benefit in place of a tax credit claimed on your tax return"
    - id: s3.ev_dealer_if_ev
      printed: (gate)
      type: Bool
      label: Whether a dealer took the clean vehicle credit off the price, asked only with a clean vehicle or home refueling property in 2025 (false without one)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.ev
            - const: true
          then: s3.ev_dealer
        - guard:
            op: test
            eq:
            - s3.ev
            - const: false
          then: s3.no
      cite:
        doc: i8936
        locator: p. 1, Purpose of Form, "You must file Form 8936 and Schedule A (Form 8936) if you purchased a new or used clean vehicle from a registered dealer and reduced the amount you paid at the time of sale by transferring the credit to the dealer"; p. 1, Reminders, "you may be able to transfer the credit amount to the dealer at the time of sale and receive an immediate financial benefit in place of a tax credit claimed on your tax return"
    - id: s3.ev_bought
      printed: (helper)
      type: Bool
      gated_by: s3.ev_bought_if_ev
      label: Did you (or, on a joint return, your spouse) purchase, not lease from another person, a vehicle you took possession of in 2025, and acquire it before October 1, 2025 (a written binding contract entered into and a payment made, including a nominal down payment or a vehicle trade-in)?
      expr:
        op: input
        source: Did you (or, on a joint return, your spouse) purchase, not lease from another person, a vehicle you took possession of in 2025, and acquire it before October 1, 2025 (a written binding contract entered into and a payment made, including a nominal down payment or a vehicle trade-in)?
      cite:
        doc: i8936
        locator: p. 1, What’s New, "Taxpayers cannot claim clean vehicle credits for new, previously owned, or commercial clean vehicles that they acquired after September 30, 2025" and "a vehicle is “acquired” as of the date a written binding contract is entered into and a payment has been made"; p. 2, New Clean Vehicle Certification and Other Requirements, "If the vehicle is leased, only the lessor and not the lessee is entitled to the credit"
    - id: s3.ev_bought_if_ev
      printed: (gate)
      type: Bool
      label: Whether a vehicle received in 2025 was bought, and acquired before October 1, 2025, asked only with a clean vehicle or home refueling property in 2025 (false without one)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.ev
            - const: true
          then: s3.ev_bought
        - guard:
            op: test
            eq:
            - s3.ev
            - const: false
          then: s3.no
      cite:
        doc: i8936
        locator: p. 1, What’s New, "Taxpayers cannot claim clean vehicle credits for new, previously owned, or commercial clean vehicles that they acquired after September 30, 2025" and "a vehicle is “acquired” as of the date a written binding contract is entered into and a payment has been made"; p. 2, New Clean Vehicle Certification and Other Requirements, "If the vehicle is leased, only the lessor and not the lessee is entitled to the credit"
    - id: s3.ev_credit
      printed: (helper)
      type: Bool
      gated_by: s3.ev_credit_if_bought
      label: Do you (or, on a joint return, your spouse) want to claim a new or previously owned clean vehicle credit on this return for such a vehicle (Form 8936)?
      expr:
        op: input
        source: Do you (or, on a joint return, your spouse) want to claim a new or previously owned clean vehicle credit on this return for such a vehicle (Form 8936)?
      cite:
        doc: i8936
        locator: p. 1, Purpose of Form, "to figure the following credits for clean vehicles you placed in service during your tax year"
    - id: s3.ev_credit_if_bought
      printed: (gate)
      type: Bool
      label: Whether a clean vehicle credit is wanted on this return, asked only for a vehicle bought and acquired before October 1, 2025 (false otherwise)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.ev_bought_if_ev
            - const: true
          then: s3.ev_credit
        - guard:
            op: test
            eq:
            - s3.ev_bought_if_ev
            - const: false
          then: s3.no
      cite:
        doc: i8936
        locator: p. 1, Purpose of Form, "to figure the following credits for clean vehicles you placed in service during your tax year"
    - id: s3.ev_equipment
      printed: (helper)
      type: Bool
      gated_by: s3.ev_equipment_if_ev
      label: Do you (or, on a joint return, your spouse) want to claim the alternative fuel vehicle refueling property credit on this return for property placed in service at your main home in 2025 (Form 8911)?
      expr:
        op: input
        source: Do you (or, on a joint return, your spouse) want to claim the alternative fuel vehicle refueling property credit on this return for property placed in service at your main home in 2025 (Form 8911)?
      cite:
        doc: i8911
        locator: p. 1, Amount of Credit, "For property of a character not subject to depreciation and which is placed in service at your main home (personal use property), the credit is 30% of the cost of the property"
    - id: s3.ev_equipment_if_ev
      printed: (gate)
      type: Bool
      label: Whether the refueling property credit is wanted on this return, asked only with a clean vehicle or home refueling property in 2025 (false without one)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.ev
            - const: true
          then: s3.ev_equipment
        - guard:
            op: test
            eq:
            - s3.ev
            - const: false
          then: s3.no
      cite:
        doc: i8911
        locator: p. 1, Amount of Credit, "For property of a character not subject to depreciation and which is placed in service at your main home (personal use property), the credit is 30% of the cost of the property"
    - id: s3.farmland
      printed: (helper)
      type: Bool
      label: In 2025, did you (or, on a joint return, your spouse) sell or exchange farmland?
      expr:
        op: input
        source: In 2025, did you (or, on a joint return, your spouse) sell or exchange farmland?
      cite:
        doc: i1040gi
        locator: p. 117, Line 13z, "Use line 13z to report the credit under section 960(c) with respect to an excess limitation account", "Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin Islands" and "If you made the election to defer net income tax attributable to the gain on the sale or exchange of qualified farmland property"
    - id: s3.farmland_deferral
      printed: (helper)
      type: Bool
      gated_by: s3.farmland_deferral_if_sold
      label: Did you (or, on a joint return, your spouse) make the election to defer the net income tax attributable to the gain on the sale or exchange of qualified farmland property (Form 1062)?
      expr:
        op: input
        source: Did you (or, on a joint return, your spouse) make the election to defer the net income tax attributable to the gain on the sale or exchange of qualified farmland property (Form 1062)?
      cite:
        doc: i1040gi
        locator: p. 117, Line 13z, "Use line 13z to report the credit under section 960(c) with respect to an excess limitation account", "Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin Islands" and "If you made the election to defer net income tax attributable to the gain on the sale or exchange of qualified farmland property"
    - id: s3.farmland_deferral_if_sold
      printed: (gate)
      type: Bool
      label: Whether the election to defer the tax on a sale of qualified farmland was made, asked only with a sale of farmland in 2025 (false without one)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.farmland
            - const: true
          then: s3.farmland_deferral
        - guard:
            op: test
            eq:
            - s3.farmland
            - const: false
          then: s3.no
      cite:
        doc: i1040gi
        locator: p. 117, Line 13z, "Use line 13z to report the credit under section 960(c) with respect to an excess limitation account", "Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin Islands" and "If you made the election to defer net income tax attributable to the gain on the sale or exchange of qualified farmland property"
    - id: s3.foreign_any
      printed: (helper)
      type: Bool
      label: Have you (or, on a joint return, your spouse) ever paid income tax to a foreign country or a U.S. territory, had income from sources in a U.S. territory, or owned 10% or more of a foreign corporation?
      expr:
        op: input
