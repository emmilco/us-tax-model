form:
  id: f8606
  kind: form
  title: Form 8606 — Nondeductible IRAs, Part I (nondeductible contributions with no 2025 distribution), one per person
  tax_year: 2025
  note: Lines 1 to 3 and 14 of one person's Form 8606, from that person's IRA Deduction Worksheet (person.ira_*); shown only
    when the person made nondeductible contributions for 2025. A 2025 distribution from a traditional IRA or a Roth conversion
    (lines 4 to 13), and Parts II and III, are refused.
  lines:
  - id: f8606.files
    printed: (helper)
    label: This person files Form 8606 (nondeductible contributions to a traditional IRA for 2025)
    type: Bool
    expr:
      op: test
      eq:
      - person.ira_files_8606
      - const: true
    cite:
      doc: i8606
      locator: 'p. 2, Who Must File, "You made nondeductible contributions to a traditional IRA for 2025"'
  - id: f8606.line1
    printed: '1'
    label: Enter your nondeductible contributions to traditional IRAs for 2025, including those made for 2025 from January 1,
      2026, through April 15, 2026
    type: NonNegDollars
    shown_when: f8606.files
    expr:
      op: copy
      from: person.ira_nondeductible
    cite:
      doc: f8606
      locator: 'Form 8606 (2025), line 1; i8606 p. 9, Line 1, "subtract line 12 of the worksheet (or the amount you chose to deduct
        on Schedule 1 (Form 1040), line 20, if less) from the smaller of line 10 or line 11 of the worksheet"'
  - id: f8606.line2
    printed: '2'
    label: Enter your total basis in traditional IRAs
    type: NonNegDollars
    shown_when: f8606.files
    expr:
      op: copy
      from: person.ira_8606_line2
    cite:
      doc: f8606
      locator: 'Form 8606 (2025), line 2; i8606 p. 9, Line 2, "Generally, if this is the first year you are required to file
        Form 8606, enter -0-"'
  - id: f8606.line3
    printed: '3'
    label: Add lines 1 and 2
    type: NonNegDollars
    shown_when: f8606.files
    expr:
      op: sum
      of:
      - f8606.line1
      - f8606.line2
    cite:
      doc: f8606
      locator: Form 8606 (2025), line 3, "Add lines 1 and 2"
  - id: f8606.dist
    printed: 3 (question)
    label: In 2025, did you take a distribution from a traditional IRA, or make a Roth IRA conversion?
    type: Bool
    shown_when: f8606.files
    expr:
      op: test
      eq:
      - person.ira_dist_gate
      - const: true
    cite:
      doc: f8606
      locator: 'Form 8606 (2025), Part I, "In 2025, did you take a distribution from a traditional IRA, or make a Roth IRA conversion?"'
  - id: f8606.line14
    printed: '14'
    label: Subtract line 13 from line 3. This is your total basis in traditional IRAs for 2025 and earlier years (with no 2025
      distribution or conversion, the amount from line 3)
    type: NonNegDollars
    shown_when: f8606.files
    expr:
      op: copy
      from: f8606.line3
    cite:
      doc: f8606
      locator: 'Form 8606 (2025), Part I, "Enter the amount from line 3 on line 14. Do not complete the rest of Part I"; line
        14'
    refuses:
    - when: f8606.dist
      form: Form 8606 lines 4 to 13 (a 2025 traditional IRA distribution or Roth conversion with nondeductible contributions)
      remedy: With nondeductible contributions and a 2025 distribution from a traditional IRA or a Roth IRA conversion, the
        nontaxable part is figured on Form 8606 lines 4 to 13, which this tool does not prepare.
      cite:
        doc: f8606
        locator: 'Form 8606 (2025), Part I, "In 2025, did you take a distribution from a traditional IRA, or make a Roth IRA
          conversion?" and "Go to line 4"'
  collection:
    parent: person
    implicit: form
    cite:
      doc: i8606
      locator: 'p. 8, More than one Form 8606 required, "If both you and your spouse are required to file 2025 Form 8606, file
        a separate 2025 Form 8606 for each of you"'
