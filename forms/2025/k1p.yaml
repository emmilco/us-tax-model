form:
  id: k1p
  kind: form
  title: Schedule K-1 (Form 1065) — one partner's share from one partnership
  tax_year: 2025
  note: 'One entry per Schedule K-1 (Form 1065) a person received. Boxes 1 to 3 are each one activity; box 1 is passive unless
    the partner materially participated (tests 1, 2, 3 or 5), boxes 2 and 3 are passive, and box 2 goes in Part IV of Form
    8582 when a general partner actively participated and owned a tenth. The Form 8582 columns (a) to (c) and (e) of each
    activity, the Schedule E line 28 columns (h), (i) and (k), and the portfolio, self-employment, withholding and section
    199A amounts are figured here and totalled on the person. Refused: publicly traded partnerships, boxes 4b, 7, 10 to 13
    (other than 13 AE), 14 B and C, 15 (other than O), 16, 17, 20 (codes other than A, B, N, Z, AG), 21, 22 and 23, foreign
    partnerships, a sale of the interest, property distributions and distributions above basis, trading partnerships, material
    participation by tests 4, 6 or 7, losses above basis or not at risk, losses carried from earlier years by the basis or
    at-risk limits, the held-back losses Form 8582 does not take here, unreimbursed partnership expenses, interest on money
    borrowed to buy into the partnership, a fuel tax credit from it claimed in 2024, a real estate professional''s box 2
    when no rental of the filer''s own is listed (Schedule E Part I asks it then), and a rented home a partner used
    personally.'
  lines:
  - id: k1p.zero
    printed: (helper)
    label: Zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite: &id001
      doc: f1065sk1
      locator: p. 1, Part III, "Partner’s Share of Current Year Income"
  - id: k1p.no
    printed: (helper)
    label: No (false)
    type: Bool
    expr:
      op: param
      ref: household.no
    cite: *id001
  - id: k1p.yes
    printed: (helper)
    label: Yes (true)
    type: Bool
    expr:
      op: param
      ref: hsa.yes
    cite: *id001
  - id: k1p.one
    printed: (helper)
    label: One Schedule K-1
    type: Count
    expr:
      op: param
      ref: person.one
    cite: &id042
      doc: i1065sk1
      locator: p. 14, Codes, "report items from each partnership’s Schedule K-1 on a separate line 28 of Schedule E"
  - id: k1p.ptp
    printed: (helper)
    label: Publicly traded partnership (item D checked)
    type: Bool
    expr:
      op: input
      source: Is the box in item D checked, for a publicly traded partnership (PTP)?
    cite:
      doc: i1065sk1
      locator: p. 11, Item D, "If the box in item D is checked, you’re a partner in a PTP"
  - id: k1p.general
    printed: (helper)
    label: General partner or LLC member-manager (item G)
    type: Bool
    expr:
      op: input
      source: 'In item G, is the first box checked: general partner or LLC member-manager?'
    cite:
      doc: i1065sk1
      locator: p. 2, General Partner, "A general partner is a partner who is personally liable for partnership debts"
  - id: k1p.has_b1
    printed: (helper)
    label: 'Box 1 shows an amount: ordinary business income (loss)'
    type: Bool
    expr:
      op: input
      source: Does box 1 (ordinary business income or loss) show an amount?
    cite: &id002
      doc: i1065sk1
      locator: p. 14, Box 1. Ordinary Business Income (Loss), "The amount reported in box 1 is your share of the ordinary
        income (loss) from trade or business activities of the partnership"
  - id: k1p.box1
    printed: '1'
    label: Ordinary business income (loss)
    type: Dollars
    expr:
      op: input
      source: The amount in box 1, ordinary business income (loss). Enter a loss as a negative amount.
    cite: *id002
    gated_by: k1p.box1_if_any
  - id: k1p.box1_if_any
    printed: (gate)
    label: Box 1, asked only when the box shows an amount (zero otherwise)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1p.has_b1
          - const: true
        then: k1p.box1
      - guard:
          op: test
          eq:
          - k1p.has_b1
          - const: false
        then: k1p.zero
    cite: *id002
  - id: k1p.has_b2
