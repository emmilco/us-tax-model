      remedy: A Schedule K-1 with this item is outside this tool.
      cite: *id048
    - when: k1p.r_b14bc
      form: Schedule K-1 (Form 1065) box 14, codes B and C (optional methods of Schedule SE)
      remedy: A Schedule K-1 with this item is outside this tool.
      cite: *id049
    - when: k1p.r_b15
      form: Schedule K-1 (Form 1065) box 15 (credits; Form 8582-CR, Form 3800)
      remedy: A Schedule K-1 with this item is outside this tool.
      cite: *id050
    - when: k1p.r_b16
      form: Schedule K-3 (international items)
      remedy: A Schedule K-1 with this item is outside this tool.
      cite: *id051
    - when: k1p.r_b17
      form: Schedule K-1 (Form 1065) box 17 (Form 6251)
      remedy: A Schedule K-1 with this item is outside this tool.
      cite: *id052
    - when: k1p.r_b20
      form: Schedule K-1 (Form 1065) box 20, other information
