    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1p.active
          - const: true
        then: k1p.b2_overall_loss
      - guard:
          op: test
          eq:
          - k1p.active
          - const: false
        then: k1p.zero
    cite:
      doc: i8582
      locator: p. 12, Part VI, "Enter the overall loss from column (e) of Part IV for each activity"
  - id: k1p.p5_b2_income
    printed: (helper)
    label: Box 2 net income without active participation (Part V)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1p.active
          - const: true
        then: k1p.zero
      - guard:
          op: test
          eq:
          - k1p.active
          - const: false
        then: k1p.b2_net_income
    cite: &id040
      doc: i8582
      locator: p. 9, Part V, "Use Part V for all other passive activities"
  - id: k1p.p5_b2_loss
    printed: (helper)
    label: Box 2 net loss without active participation (Part V)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1p.active
          - const: true
        then: k1p.zero
      - guard:
          op: test
          eq:
          - k1p.active
          - const: false
        then: k1p.b2_net_loss
    cite: *id040
  - id: k1p.p5_b2_prior
    printed: (helper)
    label: Box 2 prior years unallowed loss without active participation (Part V)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1p.active
          - const: true
        then: k1p.zero
      - guard:
          op: test
          eq:
          - k1p.active
          - const: false
        then: k1p.prior_b2_if
    cite: *id040
  - id: k1p.p5_income
    printed: V (a)
    label: 'Part V column (a): net income of the passive activities other than Part IV'
    type: NonNegDollars
    expr:
      op: sum
      of:
      - k1p.b1_net_income
      - k1p.p5_b2_income
      - k1p.b3_net_income
    cite: *id040
    ambiguity: amb.2025.k1p_activity_per_box
  - id: k1p.p5_loss
    printed: V (b)
    label: 'Part V column (b): net loss of the passive activities other than Part IV'
    type: NonNegDollars
    expr:
      op: sum
      of:
      - k1p.b1_net_loss
      - k1p.p5_b2_loss
      - k1p.b3_net_loss
    cite: *id040
  - id: k1p.p5_prior
    printed: V (c)
    label: 'Part V column (c): prior years unallowed loss of the passive activities other than Part IV'
    type: NonNegDollars
    expr:
      op: sum
      of:
      - k1p.prior_b1_if
      - k1p.p5_b2_prior
      - k1p.prior_b3_if
    cite: *id040
  - id: k1p.prior_total
    printed: (helper)
    label: Prior years unallowed losses of this K-1
    type: NonNegDollars
    expr:
      op: sum
      of:
      - k1p.prior_b1_if
      - k1p.prior_b2_if
      - k1p.prior_b3_if
    cite: *id033
  - id: k1p.passive_loss
    printed: (helper)
    label: A passive activity of this K-1 has a net loss or a prior years unallowed loss
    type: Bool
    expr:
      op: test
      any:
      - op: test
        gt:
        - k1p.b1_loss_sum
        - const: 0
      - op: test
        gt:
        - k1p.b2_loss_sum
        - const: 0
      - op: test
        gt:
        - k1p.b3_loss_sum
        - const: 0
    cite:
      doc: i1065sk1
      locator: p. 9, Effect of determination, "If you have an overall loss (the excess of deductions and losses, including
        any prior-year unallowed loss, over income) or credits from a passive activity"
  - id: k1p.col_h
    printed: 28 (h)
    label: 'Passive income from Schedule K-1: Schedule E line 28 column (h)'
    type: NonNegDollars
    expr:
      op: sum
      of:
      - k1p.b1_net_income
      - k1p.b2_net_income
      - k1p.b3_net_income
    cite: *id037
  - id: k1p.np_b1_income
    printed: (helper)
    label: Box 1 income with material participation
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1p.b1_passive
          - const: true
        then: k1p.zero
      - guard:
          op: test
          eq:
          - k1p.b1_passive
          - const: false
        then: k1p.b1_pos
    cite: &id041
      doc: i1065sk1
      locator: p. 14, Box 1. Ordinary Business Income (Loss), "Report box 1 income (loss) from partnership trade or business
        activities in which you materially participated in column (i) or (k)"
  - id: k1p.col_k
    printed: 28 (k)
    label: 'Nonpassive income from Schedule K-1: Schedule E line 28 column (k)'
    type: NonNegDollars
    expr:
      op: sum
      of:
      - k1p.np_b1_income
      - k1p.box4a_if_any
    cite: *id041
  - id: k1p.col_i
    printed: 28 (i)
    label: 'Nonpassive loss allowed: Schedule E line 28 column (i) (as a positive amount)'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1p.b1_passive
          - const: true
        then: k1p.zero
      - guard:
          op: test
          eq:
          - k1p.b1_passive
          - const: false
        then: k1p.b1_neg
    cite: *id041
  - id: k1p.nonpassive_net
    printed: (helper)
    label: Nonpassive income less nonpassive loss (column (k) less column (i))
    type: Dollars
    expr:
      op: subtract
      from: k1p.col_k
      take: k1p.col_i
    cite: *id041
  - id: k1p.sche_row
    printed: (helper)
    label: The K-1 puts a row on Schedule E line 28 (an amount in box 1, 2, 3 or 4a, or a held-back loss)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        ne:
        - k1p.box1_if_any
        - const: 0
      - op: test
        ne:
        - k1p.box2_if_any
        - const: 0
      - op: test
        ne:
        - k1p.box3_if_any
        - const: 0
      - op: test
        gt:
        - k1p.box4a_if_any
        - const: 0
      - op: test
        gt:
        - k1p.prior_total
        - const: 0
    cite:
      doc: i1040se
      locator: p. 10, Line 28, "For nonpassive income or loss and passive income or losses for which you are not filing Form
        8582"
    ambiguity: amb.2025.k1p_portfolio_no_sche
  - id: k1p.se_pos
    printed: (helper)
    label: Positive net earnings from self-employment (box 14, code A)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1p.box14a_if_any
      take: k1p.zero
    cite: *id010
  - id: k1p.screened
    printed: (gate)
    label: This Schedule K-1 passed every screen (true; the refusals of a K-1 are told here)
    type: Bool
    expr:
      op: copy
      from: k1p.yes
    cite: *id042
    refuses:
    - when: k1p.ptp
      form: Publicly traded partnership (Schedule K-1 item D)
      remedy: A Schedule K-1 from a publicly traded partnership is outside this tool.
      cite:
        doc: i1065sk1
        locator: p. 10, Publicly traded partnerships (PTPs), "Don’t report passive income, gains, or losses from a PTP on
          Form 8582"
    - when: k1p.r_b4b
      form: Schedule K-1 (Form 1065) box 4b (guaranteed payments for capital)
      remedy: A Schedule K-1 with this item is outside this tool.
      cite: *id043
    - when: k1p.r_b7
      form: Schedule K-1 (Form 1065) box 7 (royalties on Schedule E, line 4)
      remedy: A Schedule K-1 with this item is outside this tool.
      cite: *id044
    - when: k1p.r_b10
      form: Schedule K-1 (Form 1065) box 10 (Form 4797)
      remedy: A Schedule K-1 with this item is outside this tool.
