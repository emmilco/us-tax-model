form:
  id: rprop
  kind: form
  title: Form 4562 — one building or improvement of a rental property
  tax_year: 2025
  note: 'One entry per building, or improvement to one, of a rental property; depreciated by Table A-6 (residential rental
    property, 27.5 years) or Table A-7a (nonresidential real property, 39 years), mid-month convention, straight line. Refused:
    personal property and land improvements, ADS and other methods, basis changes, dispositions, qualified improvement property, basis reduced by a credit or
    deduction, cooperative stock, and nonresidential
    real property placed in service before 1994.'
  lines:
  - id: rprop.zero
    printed: (helper)
    label: Zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i4562
      locator: p. 12, Column (g)—Depreciation deduction
  - id: rprop.kind
    printed: (a)
    label: Kind of property
    type: Enum(rprop_kind)
    expr:
      op: input
      source: 'What is this?


        - residential: a building (or an improvement to one) whose rent comes mostly (80% or more) from homes

        - nonresidential: any other building, such as shops or offices, or an improvement to one

        - personal: something other than a building or part of one, such as an appliance, carpet, furniture, a fence or a
        driveway'
    cite:
      doc: i4562
      locator: p. 10, Residential rental property
  - id: rprop.month
    printed: (b)
    label: Month placed in service
    type: Enum(month)
    expr:
      op: input
      source: The month it was first ready and available for rent (placed in service) by you
    cite:
      doc: p946
      locator: p. 73, Table A-6, "Month property placed in service"
  - id: rprop.year
    printed: (b)
    label: Year placed in service
    type: Enum(realty_year)
    expr:
      op: input
      source: The year it was first ready and available for rent (placed in service) by you; before1987 if earlier than 1987
    cite:
      doc: p946
      locator: p. 37, Using the MACRS Percentage Tables
  - id: rprop.basis
    printed: (c)
    label: Basis for depreciation
    type: NonNegDollars
    expr:
      op: input
      source: 'Its basis for depreciation: what you paid for the building or improvement, not the land (for a home you lived
        in before renting it, the smaller of its value and your adjusted basis when you began renting it); your share'
    cite:
      doc: i1040se
      locator: p. 6, Line 18
  - id: rprop.no
    printed: (helper)
    label: Year parameter household.no (false)
    type: Bool
    expr:
      op: param
      ref: household.no
    cite:
      doc: p946
      locator: p. 16, Qualified improvement property
  - id: rprop.new_nonres
    printed: (gate)
    label: Nonresidential real property placed in service after 2017, which may be qualified improvement property
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - rprop.kind
        - const: nonresidential
      - op: test
        le:
        - rprop.recovery_year
        - const: 8
          type: Count
    cite:
      doc: p946
      locator: p. 31, Qualified improvement property, "placed in service by you after 2017 and after the date the building
        was first placed in service by any person"
  - id: rprop.qip
    printed: (screen)
    label: Qualified improvement property (an improvement to an interior portion of a building that is nonresidential real
      property, placed in service after the building was first placed in service; not an enlargement, an elevator or
      escalator, or the internal structural framework)
    type: Bool
    gated_by: rprop.qip_if_new_nonres
    expr:
      op: input
      source: Is it an improvement to the inside of the building, made after the building was first placed in service by
        anyone, and not an enlargement, an elevator or escalator, or the internal structural framework?
    cite:
      doc: p946
      locator: p. 16, Qualified improvement property; p. 31, Qualified improvement property
  - id: rprop.qip_if_new_nonres
    printed: (gate)
    label: Qualified improvement property, asked only of nonresidential real property placed in service after 2017 (false
      otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rprop.new_nonres
          - const: true
        then: rprop.qip
      - guard:
          op: test
          eq:
          - rprop.new_nonres
          - const: false
        then: rprop.no
    cite:
      doc: i4562
      locator: p. 10, 15-year property, "Qualified improvement property, as defined in section 168(e)(6), placed in service
        by you after December 31, 2017"
  - id: rprop.disposed
    printed: (screen)
    label: Retired from service in 2025 (sold or exchanged, converted to personal use, abandoned or destroyed)
    type: Bool
    expr:
      op: input
      source: In 2025, was it sold, traded, given away, destroyed or torn out, or did you stop renting it for good?
    cite:
      doc: p527
      locator: p. 9, Retired From Service; p946 p. 40, "If you dispose of property before the end of its recovery period"
  - id: rprop.fast
    printed: (screen)
    label: A special depreciation allowance or section 179 deduction claimed, or depreciated by a method other than straight
      line over 27.5 or 39 years
    type: Bool
    expr:
      op: input
      source: Did you deduct any cost in one year (bonus depreciation or section 179), or depreciate it other than straight
        line over 27.5 or 39 years?
    cite:
      doc: p527
      locator: p. 12, Decreases to basis, "Special depreciation allowance or a section 179 deduction claimed on qualified
        property"; i4562 p. 11, Column (f)—Method
  - id: rprop.ads
    printed: (screen)
    label: Depreciated under the alternative depreciation system (ADS), elected or required
    type: Bool
    expr:
      op: input
      source: Do you depreciate it over 30 or 40 years (the alternative depreciation system, ADS), by choice or because you
        must?
    cite:
      doc: p527
      locator: p. 12, Depreciation Systems, "You must use GDS unless you are specifically required by law to use ADS or you
        elect to use ADS"; i4562 p. 13, Line 20c, Residential rental property
  - id: rprop.basis_changed
    printed: (screen)
    label: Basis adjusted after it was placed in service for anything other than depreciation or an improvement depreciated
      as a separate item (for example a casualty loss or an easement)
    type: Bool
    expr:
      op: input
      source: Since renting began, has anything but depreciation changed its cost for tax purposes, like a casualty loss or
        easement payment?
    cite:
      doc: p946
      locator: p. 37, Rules Covering the Use of the Tables, rule 4; p527 p. 12, Decreases to basis
  - id: rprop.credit
    printed: (screen)
    label: Basis reduced by a credit or deduction (for example the disabled access credit, the deduction for removal of
      barriers to the disabled and the elderly, or the section 179D deduction)
    type: Bool
    expr:
      op: input
      source: Did you take a credit or special deduction for part of its cost, like for disabled access or barrier removal?
    cite:
      doc: i4562
      locator: p. 11, Column (c)—Basis for depreciation, "The following are examples of some credits and deductions that
        reduce the basis for depreciation"
  - id: rprop.coop
    printed: (screen)
    label: Stock in a cooperative housing corporation
    type: Bool
    expr:
      op: input
      source: Is it stock in a cooperative housing corporation (a co-op apartment you rent out)?
    cite:
      doc: p527
      locator: p. 8, Cooperative apartments
  - id: rprop.exchanged
    printed: (screen)
    label: Acquired in a like-kind exchange or an involuntary conversion (carryover basis)
    type: Bool
    expr:
      op: input
      source: Did you get it in a trade for other property (a like-kind exchange), or to replace property that was destroyed,
        stolen or taken by a government (an involuntary conversion)?
    cite:
      doc: i4562
      locator: p. 9, "Generally, you must depreciate the carryover basis of property you acquire in a like-kind exchange
        or involuntary conversion during the current tax year over the remaining recovery period of the property exchanged
        or involuntarily converted"
  - id: rprop.screen
    printed: (helper)
    label: Depreciation of this property outside the tables this tool uses
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - rprop.disposed
        - const: true
      - op: test
        eq:
        - rprop.fast
        - const: true
      - op: test
        eq:
        - rprop.ads
        - const: true
      - op: test
        eq:
        - rprop.basis_changed
        - const: true
      - op: test
        eq:
        - rprop.credit
        - const: true
      - op: test
        eq:
        - rprop.coop
        - const: true
      - op: test
        eq:
        - rprop.exchanged
        - const: true
      - op: test
        eq:
        - rprop.qip_if_new_nonres
        - const: true
    cite:
      doc: i4562
      locator: p. 11, Column (f)—Method
  - id: rprop.personal
    printed: (gate)
    label: Personal property or a land improvement in a rental
    type: Bool
    expr:
      op: test
      eq:
      - rprop.kind
      - const: personal
    cite:
      doc: i4562
      locator: p. 9, Lines 19a Through 19j
  - id: rprop.early_nonres
    printed: (gate)
    label: Nonresidential real property placed in service before 1994 (31.5-year)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - rprop.kind
        - const: nonresidential
      - op: test
        gt:
        - rprop.recovery_year
        - const: 32
          type: Count
    cite:
      doc: p946
      locator: p. 74, Table A-7, "Straight Line—31.5 Years"
  - id: rprop.recovery_year
    printed: (helper)
    label: Year of recovery in 2025
    type: Count
    expr:
      op: keyed_lookup
      table: realty_recovery_year
      keys:
      - rprop.year
    cite:
      doc: p946
      locator: p. 37, Using the MACRS Percentage Tables
  - id: rprop.rate
    printed: (helper)
    label: Rate from Table A-6 or A-7a for the month placed in service and the year of recovery
    type: Rate
    expr:
      op: keyed_lookup
      table: macrs_mm
      keys:
      - rprop.kind
      - rprop.month
      - rprop.recovery_year
    cite:
      doc: p946
      locator: p. 73, Table A-6, "Month property placed in service"
  - id: rprop.dep
    printed: (g)
    label: Depreciation deduction
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: rprop.basis
      rate: rprop.rate
    cite:
      doc: i4562
      locator: p. 12, Column (g)—Depreciation deduction
    ambiguity: amb.2025.rental_prior_depreciation_tables
    refuses:
    - when: rprop.personal
      form: Form 4562 (personal property or land improvements in a rental)
      remedy: Appliances, carpet, furniture, fences and other property that is not a building are outside this tool.
      cite:
        doc: i4562
        locator: p. 9, Lines 19a Through 19j
    - when: rprop.screen
      form: Form 4562 (real property outside the mid-month tables)
      remedy: Real property depreciated another way, with a changed basis, disposed of, qualified improvement property, property
        with a credit or deduction for part of its cost, cooperative stock, or property received in a like-kind exchange or
        an involuntary conversion is outside this tool.
      cite:
        doc: i4562
        locator: p. 11, Column (f)—Method
    - when: rprop.early_nonres
      form: Form 4562 (nonresidential real property placed in service before 1994)
      remedy: Nonresidential real property placed in service before 1994 is outside this tool.
      cite:
        doc: p946
        locator: p. 74, Table A-7, "Straight Line—31.5 Years"
  - id: rprop.placed_this_year
    printed: (gate)
    label: Placed in service in 2025
    type: Bool
    expr:
      op: test
      eq:
      - rprop.year
      - const: y2025
    cite:
      doc: i4562
      locator: p. 9, Line 17
  - id: rprop.cent
    printed: (helper)
    label: One cent (a count carried as cents)
    type: NonNegDollars
    expr:
      op: param
      ref: rental.day_cents
    cite:
      doc: i4562
      locator: p. 9, Line 17
  - id: rprop.placed_this_year_cent
    printed: (helper)
    label: One cent if placed in service in 2025, zero otherwise
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rprop.placed_this_year
          - const: true
        then: rprop.cent
      - guard:
          op: test
          eq:
          - rprop.placed_this_year
          - const: false
        then: rprop.zero
    cite:
      doc: i4562
      locator: p. 9, Line 17
  collection:
    parent: rental
    cite:
      doc: p946
      locator: p. 3, Additions and Improvements
