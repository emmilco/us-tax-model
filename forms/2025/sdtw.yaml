form:
  id: sdtw
  kind: worksheet
  title: Schedule D Tax Worksheet
  tax_year: 2025
  note: Default Form 4952 capital-gain-first allocation. Form 2555 and alternative dotted-line
    allocation are outside scope. Skipped lines contribute zero; raw helpers show arithmetic before
    skip rules.
  lines:
    - id: sdtw.zero
      printed: (helper)
      type: NonNegDollars
      label: Zero for skipped worksheet lines
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: i1040sd
        locator: pp. 15–16, Schedule D Tax Worksheet
    - id: sdtw.ordinary_ceiling
      printed: (helper)
      type: NonNegDollars
      label: Ordinary-income ceiling for line 19
      expr:
        op: param
        ref: sdtw.ordinary_ceiling
      cite:
        doc: i1040sd
        locator: pp. 15–16, Schedule D Tax Worksheet
    - id: sdtw.after22
      printed: (helper)
      type: Bool
      label: Continue after line 22 when lines 1 and 16 differ
      expr:
        op: test
        ne:
          - sdtw.line1
          - sdtw.line16
      cite:
        doc: i1040sd
        locator: pp. 15–16, Schedule D Tax Worksheet
    - id: sdtw.after32
      printed: (helper)
      type: Bool
      label: Continue after line 32 when lines 1 and 32 differ
      expr:
        op: test
        all:
          - op: test
            eq:
              - sdtw.after22
              - const: true
          - op: test
            ne:
              - sdtw.line1
              - sdtw.line32
      cite:
        doc: i1040sd
        locator: pp. 15–16, Schedule D Tax Worksheet
    - id: sdtw.use1250
      printed: (helper)
      type: Bool
      label: Compute lines 35–40 when Schedule D line 19 is positive
      expr:
        op: test
        all:
          - op: test
            eq:
              - sdtw.after32
              - const: true
          - op: test
            gt:
              - sd.line19
              - const: 0
      cite:
        doc: i1040sd
        locator: pp. 15–16, Schedule D Tax Worksheet
    - id: sdtw.use28
      printed: (helper)
      type: Bool
      label: Follow printed flow to lines 41–43
      expr:
        op: test
        all:
          - op: test
            eq:
              - sdtw.after32
              - const: true
          - op: test
            any:
              - op: test
                eq:
                  - sd.line19
                  - const: 0
              - op: test
                gt:
                  - sd.line18
                  - const: 0
      cite:
        doc: i1040sd
        locator: pp. 15–16, Schedule D Tax Worksheet
    - id: sdtw.line1
      printed: "1"
      type: NonNegDollars
      label: Taxable income
