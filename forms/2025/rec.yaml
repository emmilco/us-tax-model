form:
  id: rec
  kind: worksheet
  title: Pub. 525 Worksheets 2a and 2 — recoveries of 2024 itemized deductions (Schedule 1, lines 1 and 8z)
  tax_year: 2025
  note: Used when, besides any state or local income tax refund, an amount deducted on the 2024 Schedule A was paid back
    in 2025 (a refund of real estate or personal property tax, mortgage interest refunded, a medical bill reimbursed, or
    another itemized deduction refunded). Worksheet 2a splits the state and local tax refunds under the 2024 limit on the
    deduction for taxes; Worksheet 2 tests the total against the 2024 itemized deductions over the 2024 standard
    deduction and against negative 2024 taxable income, and divides the taxable part between line 1 and line 8z. A
    recovery of an amount paid or deducted before 2024, of a deduction taken without itemizing or of a credit, of general
    sales tax, of deductions on two 2024 returns on a joint 2025 return, and the 2024 alternative minimum tax, unused
    credit, 0% capital gain, dependent, nonresident and joint state return cases are refused.
  lines:
  - id: rec.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 8, "If the result is zero or less, stop here. The amounts on lines 1a, 1b, and 2 aren’t
        taxable"
  - id: rec.no
    printed: (helper)
    label: Year parameter sa.no (no)
    type: Bool
    expr:
      op: param
      ref: sa.no
    cite:
      doc: p525
      locator: p. 24, Recoveries, "A recovery is a return of an amount you deducted or took a credit for in an earlier year"
  - id: rec.before_prior_year
    printed: (gate)
    gated_by: rec.before_prior_year_if_any
    label: Was any of the money paid back for something paid or deducted before 2024?
    type: Bool
    expr:
      op: input
      source: Was any of the money paid back to you (or, on a joint return, your spouse) in 2025 for something you paid or
        deducted in a year before 2024?
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, "If you recovered amounts from more than 1 year, such as a state income tax refund from 2024
        and a casualty loss reimbursement from 2023, complete a separate worksheet for each year"; p. 24, Recovery for 2 or
        more years, "you must allocate, on a pro rata basis, the recovered amount between the years in which you paid it"
  - id: rec.before_prior_year_if_any
    printed: (gate)
    label: A recovery for something paid or deducted before 2024, asked only after a Yes to the question on money paid back
      (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.recovery
          - const: true
        then: rec.before_prior_year
      - guard:
          op: test
          eq:
          - scope.recovery
          - const: false
        then: rec.no
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, "complete a separate worksheet for each year. Use information from your tax return for the
        year the expense was deducted"
  - id: rec.nonitemized
    printed: (gate)
    gated_by: rec.nonitemized_if_any
    label: Was any of the money paid back for a deduction taken without itemizing, or for a credit?
    type: Bool
    expr:
      op: input
      source: Was any of the money paid back to you (or, on a joint return, your spouse) in 2025 for a deduction taken without
        itemizing (for example a bad debt paid after you deducted it, or a business expense) or for an item on which you
        claimed a tax credit?
    cite:
      doc: p525
      locator: p. 24, Recoveries, "You may also have recoveries of nonitemized deductions (such as payments on previously
        deducted bad debts) and recoveries of items for which you previously claimed a tax credit"; p. 25, Caution, "If you
        also recovered an amount deducted as a nonitemized deduction, figure the amount of that recovery to include in your
        income and add it to your adjusted gross income (AGI) before applying the rules explained here"
  - id: rec.nonitemized_if_any
    printed: (gate)
    label: A recovery of a deduction taken without itemizing or of a credit, asked only after a Yes to the question on money
      paid back (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.recovery
          - const: true
        then: rec.nonitemized
      - guard:
          op: test
          eq:
          - scope.recovery
          - const: false
        then: rec.no
    cite:
      doc: p525
      locator: p. 28, Nonitemized Deduction Recoveries, "This section discusses recovery of deductions other than itemized
        deductions"; p. 28, Amounts Recovered for Credits, "you must increase your 2024 tax by the amount of the recovery"
  - id: rec.sales_tax
    printed: (gate)
    gated_by: rec.sales_tax_if_any
    label: Was any of the money paid back a refund of general sales tax?
    type: Bool
    expr:
      op: input
      source: Was any of the money paid back to you (or, on a joint return, your spouse) in 2025 a refund of state or local
        general sales tax?
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, footnote 2, "If you deducted state and local general sales taxes and received a refund of
        those taxes, include the amount on line 2, but don’t enter more than the excess of your sales tax deduction over
        your state and local income tax you could have deducted"
  - id: rec.sales_tax_if_any
    printed: (gate)
    label: A refund of general sales tax, asked only after a Yes to the question on money paid back (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.recovery
          - const: true
        then: rec.sales_tax
      - guard:
          op: test
          eq:
          - scope.recovery
          - const: false
        then: rec.no
    cite:
      doc: p525
      locator: p. 24, Example 27, "The maximum refund that you may have to include in income is $500 because it’s less than
        the excess of the tax deducted"
  - id: rec.joint_any
    printed: (helper)
    label: Money paid back on a joint 2025 return
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - scope.recovery
        - const: true
      - op: test
        eq:
        - refund.joint
        - const: true
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, "Use information from your tax return for the year the expense was deducted"
  - id: rec.two_returns
    printed: (gate)
    gated_by: rec.two_returns_if_joint
    label: Were these amounts for deductions on two 2024 returns, each of you filing your own?
    type: Bool
    expr:
      op: input
      source: Were the amounts paid back in 2025 for deductions on two 2024 federal returns, each of you filing your own (for
        example before you married, or as married filing separately)?
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, "complete a separate worksheet for each year. Use information from your tax return for the
        year the expense was deducted"
    ambiguity: amb.2025.rec_two_returns
  - id: rec.two_returns_if_joint
    printed: (gate)
    label: Amounts for deductions on two 2024 returns, asked only on a joint 2025 return after a Yes to the question on money
      paid back (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.joint_any
          - const: true
        then: rec.two_returns
      - guard:
          op: test
          eq:
          - rec.joint_any
          - const: false
        then: rec.no
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, "Use information from your tax return for the year the expense was deducted"
    ambiguity: amb.2025.rec_two_returns
  - id: rec.path
    printed: (helper)
    label: Worksheet 2 is used — money was paid back for 2024 and you itemized deductions for 2024
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scope.recovery
          - const: false
        then: rec.no
      - guard:
          op: test
          eq:
          - scope.recovery
          - const: true
        then: refund.itemized
    cite:
      doc: p525
      locator: p. 24, Deductions not itemized, "If you didn’t itemize deductions for the year for which you received the
        recovery of an expense that was deductible only if you itemized, don’t include any of the recovery amount in your
        income"; p. 24, Itemized Deduction Recoveries, statement 2, "You received a refund other than an income tax refund,
        such as a general sales tax or real property tax refund"
  - id: rec.has_property_tax
    printed: (helper)
    gated_by: rec.has_property_tax_if_path
    label: Was any of it a refund of 2024 real estate or personal property tax?
    type: Bool
    expr:
      op: input
      source: Was any of it a refund of state or local real estate tax or personal property tax you deducted for 2024?
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 2, "Enter the refunds received for state and local real estate taxes and state and
        local personal property taxes"
  - id: rec.has_property_tax_if_path
    printed: (gate)
    label: A refund of 2024 real estate or personal property tax, asked only when Worksheet 2 is used (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.path
          - const: true
        then: rec.has_property_tax
      - guard:
          op: test
          eq:
          - rec.path
          - const: false
        then: rec.no
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 2, "Enter the refunds received for state and local real estate taxes and state and
        local personal property taxes"
  - id: rec.property_tax
    printed: (helper)
    gated_by: rec.property_tax_if_has
    label: Refunds of 2024 real estate and personal property taxes received in 2025
    type: NonNegDollars
    expr:
      op: input
      source: The refunds you (or, on a joint return, your spouse) received in 2025 of state and local real estate taxes and
        state and local personal property taxes you deducted for 2024
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 2, "Enter the refunds received for state and local real estate taxes and state and
        local personal property taxes"
  - id: rec.property_tax_if_has
    printed: (gate)
    label: Refunds of 2024 real estate and personal property taxes (zero without one)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.has_property_tax_if_path
          - const: true
        then: rec.property_tax
      - guard:
          op: test
          eq:
          - rec.has_property_tax_if_path
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 2, "Enter the refunds received for state and local real estate taxes and state and
        local personal property taxes"
  - id: rec.has_mortgage
    printed: (helper)
    gated_by: rec.has_mortgage_if_path
    label: Was any of it 2024 mortgage interest refunded (Form 1098 box 4)?
    type: Bool
    expr:
      op: input
      source: Was any of it a refund or credit of home mortgage interest you deducted for 2024 (box 4 of Form 1098)?
    cite:
      doc: p525
      locator: p. 24, Mortgage interest refund, "If you received a refund or credit in 2025 of mortgage interest paid in an
        earlier year, the amount should be shown in box 4 of Form 1098"
  - id: rec.has_mortgage_if_path
    printed: (gate)
    label: Mortgage interest refunded, asked only when Worksheet 2 is used (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.path
          - const: true
        then: rec.has_mortgage
      - guard:
          op: test
          eq:
          - rec.path
          - const: false
        then: rec.no
    cite:
      doc: p525
      locator: p. 24, Mortgage interest refund, "You may have to include it in your income under the rules explained in the
        following discussions"
  - id: rec.mortgage
    printed: (helper)
    gated_by: rec.mortgage_if_has
    label: Mortgage interest deducted for 2024 and refunded in 2025
    type: NonNegDollars
    expr:
      op: input
      source: The refund or credit received in 2025 of home mortgage interest deducted on your (or, on a joint return, your
        and your spouse's) 2024 Schedule A (box 4 of Form 1098), but not more than the mortgage interest deducted
    cite:
      doc: p525
      locator: p. 24, Mortgage interest refund, "the amount should be shown in box 4 of Form 1098"; p. 27, Worksheet 2,
        footnote 2, "Don’t enter more than the amount deducted for the prior year"
    ambiguity: amb.2025.rec_mortgage_cap
  - id: rec.mortgage_if_has
    printed: (gate)
    label: Mortgage interest refunded (zero without one)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.has_mortgage_if_path
          - const: true
        then: rec.mortgage
      - guard:
          op: test
          eq:
          - rec.has_mortgage_if_path
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 2, "Enter the total of all other Schedule A (Form 1040) refunds or reimbursements"
  - id: rec.has_medical
    printed: (helper)
    gated_by: rec.has_medical_if_path
    label: Was any of it a reimbursement of 2024 medical or dental expenses?
    type: Bool
    expr:
      op: input
      source: Was any of it a reimbursement, for example from insurance, of 2024 medical or dental expenses you deducted on
        your 2024 Schedule A?
    cite:
      doc: p525
      locator: p. 26, Example 34, "In 2025, you received a $500 reimbursement from your medical insurance for your 2024
        expenses"
  - id: rec.has_medical_if_path
    printed: (gate)
    label: A medical reimbursement, asked only when Worksheet 2 is used (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.path
          - const: true
        then: rec.has_medical
      - guard:
          op: test
          eq:
          - rec.path
          - const: false
        then: rec.no
    cite:
      doc: p525
      locator: p. 25, Example 30, "Medical expenses"
  - id: rec.medical
    printed: (helper)
    gated_by: rec.medical_if_has
    label: Reimbursements in 2025 of 2024 medical and dental expenses
    type: NonNegDollars
    expr:
      op: input
      source: The reimbursements you (or, on a joint return, your spouse) received in 2025 of medical and dental expenses paid
        in 2024
    cite:
      doc: p525
      locator: p. 26, Example 34, "In 2025, you received a $500 reimbursement from your medical insurance for your 2024
        expenses"
  - id: rec.medical_deducted
    printed: (helper)
    gated_by: rec.medical_deducted_if_has
    label: The medical and dental expense deduction on your 2024 Schedule A, line 4
    type: NonNegDollars
    expr:
      op: input
      source: The amount on line 4 of your 2024 Schedule A (the medical and dental expenses you deducted)
    cite:
      doc: p525
      locator: 'p. 26, Example 34, "The only amount of the $500 reimbursement that must be included in your income for 2025 is $200, the amount actually deducted"; p. 26, Recovery limited to deduction, "The amount you include in your income is limited to the smaller of: • The amount deducted, or • The amount recovered"'
  - id: rec.medical_if_has
    printed: (gate)
    label: Medical reimbursements (zero without one)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.has_medical_if_path
          - const: true
        then: rec.medical
      - guard:
          op: test
          eq:
          - rec.has_medical_if_path
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 2, "Enter the total of all other Schedule A (Form 1040) refunds or reimbursements"
  - id: rec.medical_deducted_if_has
    printed: (gate)
    label: The 2024 medical deduction, asked only with a medical reimbursement (zero without one)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.has_medical_if_path
          - const: true
        then: rec.medical_deducted
      - guard:
          op: test
          eq:
          - rec.has_medical_if_path
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 26, Recovery limited to deduction, "You don’t include in your income any amount of your recovery that is
        more than the amount you deducted in the earlier year"
  - id: rec.medical_counted
    printed: (helper)
    label: Medical reimbursements counted, not more than the 2024 medical deduction
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - rec.medical_if_has
      - rec.medical_deducted_if_has
    cite:
      doc: p525
      locator: 'p. 26, Recovery limited to deduction, "The amount you include in your income is limited to the smaller of: • The amount deducted, or • The amount recovered"; p. 27, Worksheet 2, footnote 2, "Don’t enter more than the amount deducted for the prior year"'
  - id: rec.has_other
    printed: (helper)
    gated_by: rec.has_other_if_path
    label: Was any of it a refund of something else you itemized for 2024?
    type: Bool
    expr:
      op: input
      source: Was any of it a refund or reimbursement of something else you deducted on your 2024 Schedule A (not state or
        local income, real estate, personal property or sales tax, mortgage interest, or medical expenses), such as a
        casualty loss reimbursed?
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 2, "Enter the total of all other Schedule A (Form 1040) refunds or reimbursements
        (excluding the amounts you entered on lines 1a and 1b)"
  - id: rec.has_other_if_path
    printed: (gate)
    label: Another itemized deduction refunded, asked only when Worksheet 2 is used (no otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.path
          - const: true
        then: rec.has_other
      - guard:
          op: test
          eq:
          - rec.path
          - const: false
        then: rec.no
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 2, "Enter the total of all other Schedule A (Form 1040) refunds or reimbursements"
  - id: rec.other
    printed: (helper)
    gated_by: rec.other_if_has
    label: Other 2024 itemized deductions refunded or reimbursed in 2025
    type: NonNegDollars
    expr:
      op: input
      source: The refunds and reimbursements you (or, on a joint return, your spouse) received in 2025 of other deductions on
        your 2024 Schedule A (not state or local taxes, mortgage interest or medical expenses)
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 2, "Enter the total of all other Schedule A (Form 1040) refunds or reimbursements
        (excluding the amounts you entered on lines 1a and 1b)"
  - id: rec.other_deducted
    printed: (helper)
    gated_by: rec.other_deducted_if_has
    label: The amount deducted on your 2024 Schedule A for the items refunded
    type: NonNegDollars
    expr:
      op: input
      source: The amount deducted on your 2024 Schedule A for the items so refunded or reimbursed
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, footnote 2, "Don’t enter more than the amount deducted for the prior year"
  - id: rec.other_if_has
    printed: (gate)
    label: Other itemized deductions refunded (zero without one)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.has_other_if_path
          - const: true
        then: rec.other
      - guard:
          op: test
          eq:
          - rec.has_other_if_path
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 2, "Enter the total of all other Schedule A (Form 1040) refunds or reimbursements"
  - id: rec.other_deducted_if_has
    printed: (gate)
    label: The 2024 deduction for those items, asked only with such a refund (zero without one)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.has_other_if_path
          - const: true
        then: rec.other_deducted
      - guard:
          op: test
          eq:
          - rec.has_other_if_path
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, footnote 2, "Don’t enter more than the amount deducted for the prior year"
  - id: rec.other_counted
    printed: (helper)
    label: Other refunds counted, not more than the 2024 deduction for them
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - rec.other_if_has
      - rec.other_deducted_if_has
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, footnote 2, "Don’t enter more than the amount deducted for the prior year"
  - id: rec.w2a_line1
    printed: 2a:1
    label: Enter the income tax refund from Form(s) 1099-G (or similar statement)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.has
          - const: false
        then: rec.zero
      - guard:
          op: test
          eq:
          - refund.has
          - const: true
        then: refund.received_if_worksheet
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 1, "Enter the income tax refund from Form(s) 1099-G (or similar statement)"; p. 24,
        State tax refund, "Because you didn’t choose to deduct the state income tax, you don’t include the state income tax
        refund in income"
  - id: rec.w2a_line2
    printed: 2a:2
    label: Enter the refunds received for state and local real estate taxes and state and local personal property taxes
    type: NonNegDollars
    expr:
      op: copy
      from: rec.property_tax_if_has
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 2, "Enter the refunds received for state and local real estate taxes and state and
        local personal property taxes"
  - id: rec.w2a_line6
    printed: 2a:6
    label: Add lines 1 and 2 and enter the result here
    type: NonNegDollars
    expr:
      op: sum
      of:
      - rec.w2a_line1
      - rec.w2a_line2
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 6, "Add lines 1 and 2 and enter the result here"
  - id: rec.w2a_line3
    printed: 2a:3
    label: Total state and local refunds. Add lines 1 and 2. But don’t enter more than the amount of your state and local
      taxes shown on your 2024 Schedule A, line 5d
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - rec.w2a_line6
      - refund.line5d_prior_year
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 3, "Total state and local refunds. Add lines 1 and 2. But don’t enter more than the
        amount of your state and local taxes shown on your 2024 Schedule A (Form 1040), line 5d"
  - id: rec.w2a_cap
    printed: (helper)
    label: Is the amount of state and local taxes paid in 2024 (generally, your 2024 Schedule A, line 5d) more than the amount
      on your 2024 Schedule A, line 5e?
    type: Bool
    expr:
      op: test
      gt:
      - refund.line5d_prior_year
      - refund.line5e_prior_year
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 4, "Is the amount of state and local income taxes (or general sales taxes), real estate
        taxes, and personal property taxes paid in 2024"
  - id: rec.w2a_line4
    printed: 2a:4
    label: 'Is the amount of state and local taxes paid in 2024 (generally, your 2024 Schedule A, line 5d) more than the amount
      on your 2024 Schedule A, line 5e? No: the amount from line 3. Yes: subtract line 5e from line 5d'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.w2a_cap
          - const: true
        then: refund.line2
      - guard:
          op: test
          eq:
          - rec.w2a_cap
          - const: false
        then: rec.w2a_line3
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 4, "No. Enter the amount from line 3 on line 4 and go to line 6" and "Yes. Subtract the
        amount on your 2024 Schedule A (Form 1040), line 5e"
  - id: rec.w2a_line5_more
    printed: (helper)
    label: Is the amount on line 3 more than the amount on line 4?
    type: Bool
    expr:
      op: test
      gt:
      - rec.w2a_line3
      - rec.w2a_line4
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 5, "Is the amount on line 3 more than the amount on line 4?" and "No. [STOP] None of
        the refunds on line 1 or 2 are taxable"
  - id: rec.w2a_line5
    printed: 2a:5
    label: Subtract line 4 from line 3
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rec.w2a_line3
      take: rec.w2a_line4
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 5, "Yes. Subtract line 4 from line 3 and enter the result here"
  - id: rec.w2a_line7_share
    printed: (helper)
    label: Divide line 1 by line 6, then multiply by the amount on line 5
    type: NonNegDollars
    expr:
      op: prorate
      amount: rec.w2a_line5
      part: rec.w2a_line1
      whole: rec.w2a_line6
      places: 6
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 7, "If there is an amount on line 5, divide line 1 by line 6. Then multiply by the
        amount on line 5"
    ambiguity: amb.2025.rec_ratio_places
  - id: rec.w2a_line7_capped
    printed: (helper)
    label: 'Line 7 when the 2024 limit on taxes applied: zero if line 3 is not more than line 4 (none of the refunds is taxable),
      otherwise line 1 divided by line 6 times line 5'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.w2a_line5_more
          - const: true
        then: rec.w2a_line7_share
      - guard:
          op: test
          eq:
          - rec.w2a_line5_more
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 5, "No. [STOP] None of the refunds on line 1 or 2 are taxable"; line 7, "If there is
        an amount on line 5, divide line 1 by line 6"
  - id: rec.w2a_line7
    printed: 2a:7
    label: 'Amount to include on Worksheet 2, line 1a: if line 5 is blank, the amount from line 1; if there is an amount on line
      5, line 1 divided by line 6 times line 5'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.w2a_cap
          - const: false
        then: rec.w2a_line1
      - guard:
          op: test
          eq:
          - rec.w2a_cap
          - const: true
        then: rec.w2a_line7_capped
    cite:
      doc: p525
      locator: 'p. 26, Worksheet 2a, line 7, "Amount to include on Worksheet 2, line 1a: • If line 5 is blank, enter the amount from line 1"'
  - id: rec.w2a_line8_share
    printed: (helper)
    label: Divide line 2 by line 6, then multiply by the amount on line 5
    type: NonNegDollars
    expr:
      op: prorate
      amount: rec.w2a_line5
      part: rec.w2a_line2
      whole: rec.w2a_line6
      places: 6
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 8, "If there is an amount on line 5, divide line 2 by line 6. Then multiply by the
        amount on line 5"
    ambiguity: amb.2025.rec_ratio_places
  - id: rec.w2a_line8_capped
    printed: (helper)
    label: 'Line 8 when the 2024 limit on taxes applied: zero if line 3 is not more than line 4, otherwise line 2 divided by
      line 6 times line 5'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.w2a_line5_more
          - const: true
        then: rec.w2a_line8_share
      - guard:
          op: test
          eq:
          - rec.w2a_line5_more
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 26, Worksheet 2a, line 5, "No. [STOP] None of the refunds on line 1 or 2 are taxable"; line 8, "If there is
        an amount on line 5, divide line 2 by line 6"
  - id: rec.w2a_line8
    printed: 2a:8
    label: 'Amount to include on Worksheet 2, line 1b: if line 5 is blank, the amount from line 2; if there is an amount on line
      5, line 2 divided by line 6 times line 5'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.w2a_cap
          - const: false
        then: rec.w2a_line2
      - guard:
          op: test
          eq:
          - rec.w2a_cap
          - const: true
        then: rec.w2a_line8_capped
    cite:
      doc: p525
      locator: 'p. 26, Worksheet 2a, line 8, "Amount to include on Worksheet 2, line 1b: • If line 5 is blank, enter the amount from line 2"'
  - id: rec.line1a
    printed: 1a
    label: State/local income tax refund or credit
    type: NonNegDollars
    expr:
      op: copy
      from: rec.w2a_line7
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 1a, "State/local income tax refund or credit"; p. 27, NOTE, "Before completing lines 1a
        and 1b, see Worksheet 2a"
  - id: rec.line1b
    printed: 1b
    label: State/local real estate and personal property taxes
    type: NonNegDollars
    expr:
      op: copy
      from: rec.w2a_line8
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 1b, "State/local real estate and personal property taxes"
  - id: rec.line2
    printed: '2'
    label: Enter the total of all other Schedule A (Form 1040) refunds or reimbursements (excluding the amounts you entered on
      lines 1a and 1b)
    type: NonNegDollars
    expr:
      op: sum
      of:
      - rec.mortgage_if_has
      - rec.medical_counted
      - rec.other_counted
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 2, "Enter the total of all other Schedule A (Form 1040) refunds or reimbursements
        (excluding the amounts you entered on lines 1a and 1b)"; footnote 2, "Don’t enter more than the amount deducted for
        the prior year"
  - id: rec.line3
    printed: '3'
    label: Add lines 1a, 1b, and 2
    type: NonNegDollars
    expr:
      op: sum
      of:
      - rec.line1a
      - rec.line1b
      - rec.line2
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 3, "Add lines 1a, 1b, and 2"
  - id: rec.line4
    printed: '4'
    label: 'Itemized deductions for the prior year. For 2024: Schedule A (Form 1040), line 17'
    type: NonNegDollars
    expr:
      op: copy
      from: refund.line17_prior_year
    cite:
      doc: p525
      locator: 'p. 27, Worksheet 2, line 4, "Itemized deductions for the prior year. For 2024: • Schedule A (Form 1040), line
        17"'
  - id: rec.line5
    printed: '5'
    label: Enter any amount previously refunded to you (don’t enter an amount from line 1a, 1b, or 2)
    type: NonNegDollars
    expr:
      op: copy
      from: rec.zero
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 5, "Enter any amount previously refunded to you (don’t enter an amount from line 1a, 1b,
        or 2)"; p. 24, Recovery and expense in same year, "If the refund or other recovery and the expense occur in the same
        year, the recovery reduces the deduction or credit and isn’t reported as income"
    ambiguity: amb.2025.rec_line5
  - id: rec.line6
    printed: '6'
    label: Subtract line 5 from line 4
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rec.line4
      take: rec.line5
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 6, "Subtract line 5 from line 4"
  - id: rec.line7_mfs
    printed: (helper)
    label: 'Married filing separately in 2024: zero if your spouse itemized deductions in 2024, otherwise the 2024 standard
      deduction'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.mfs_spouse_itemized
          - const: true
        then: rec.zero
      - guard:
          op: test
          eq:
          - refund.mfs_spouse_itemized
          - const: false
        then: refund.line7
    cite:
      doc: p525
      locator: p. 25, Standard deduction limit, "Only your itemized deductions that are more than your standard deduction are
        subject to the recovery rule (unless you’re required to itemize your deductions)"
  - id: rec.prior_mfs
    printed: (helper)
    label: Your 2024 filing status was married filing separately
    type: Bool
    expr:
      op: test
      eq:
      - refund.status
      - const: mfs
    cite:
      doc: p525
      locator: p. 25, Standard deduction for earlier years, "you must know the standard deduction for your filing status for
        the year the deduction was claimed"
  - id: rec.line7
    printed: '7'
    label: Standard deduction for the prior year
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.prior_mfs
          - const: true
        then: rec.line7_mfs
      - guard:
          op: test
          eq:
          - rec.prior_mfs
          - const: false
        then: refund.line7
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 7, "Standard deduction for the prior year"; footnote 3, "See the instructions for
        prior-year forms at IRS.gov for prior-year standard deduction"; p. 25, Standard deduction for earlier years, "you
        must know the standard deduction for your filing status for the year the deduction was claimed"
  - id: rec.line8
    printed: '8'
    label: Subtract line 7 from line 6. If the result is zero or less, stop here. The amounts on lines 1a, 1b, and 2 aren’t
      taxable
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rec.line6
      take: rec.line7
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 8, "Subtract line 7 from line 6. If the result is zero or less, stop here. The amounts on
        lines 1a, 1b, and 2 aren’t taxable"
  - id: rec.line9
    printed: '9'
    label: Enter the smaller of line 3 or line 8
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - rec.line3
      - rec.line8
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 9, "Enter the smaller of line 3 or line 8"; p. 25, Example 32, "This is the smaller of
        your recoveries ($2,100) or the amount by which your itemized deductions were more than the standard deduction"
  - id: rec.ti_positive
    printed: (helper)
    label: Was your 2024 taxable income (Form 1040, line 15) more than zero?
    type: Bool
    expr:
      op: input
      source: Is the amount on line 15 (taxable income) of your 2024 Form 1040 more than zero?
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 10, "Taxable income for prior year" and "(2024 Form 1040, line 15"; footnote 4, "If
        taxable income is a negative amount, enter that amount in brackets. Don’t enter zero unless your taxable income is
        exactly zero"
  - id: rec.agi_prior
    printed: (helper)
    label: The amount on your 2024 Form 1040, line 11 (adjusted gross income)
    type: Dollars
    expr:
      op: input
      source: The amount on line 11 (adjusted gross income) of your 2024 Form 1040, as a negative number if it is a loss
    cite:
      doc: p525
      locator: 'p. 26, Negative taxable income, "You have a negative taxable income for 2024 if your: • Form 1040, the sum of lines 12 and 13, was more than line 11"'
    ambiguity: amb.2025.rec_prior_taxable
  - id: rec.ded_prior
    printed: (helper)
    label: The amount on your 2024 Form 1040, line 14 (lines 12 and 13 added)
    type: NonNegDollars
    expr:
      op: input
      source: The amount on line 14 of your 2024 Form 1040 (lines 12 and 13 added)
    cite:
      doc: p525
      locator: 'p. 26, Negative taxable income, "You have a negative taxable income for 2024 if your: • Form 1040, the sum of lines 12 and 13, was more than line 11"'
    ambiguity: amb.2025.rec_prior_taxable
  - id: rec.line10
    printed: '10'
    label: Taxable income for prior year (2024 Form 1040, line 15), as a negative amount when the sum of lines 12 and 13 was
      more than line 11
    type: Dollars
    expr:
      op: subtract
      from: rec.agi_prior
      take: rec.ded_prior
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 10, "Taxable income for prior year"; footnote 4, "If taxable income is a negative amount,
        enter that amount in brackets"; p. 26, Negative taxable income, "the sum of lines 12 and 13, was more than line 11"
    ambiguity: amb.2025.rec_prior_taxable
  - id: rec.negative_ti
    printed: (helper)
    label: The amount by which 2024 taxable income was negative (line 14 less line 11 of the 2024 Form 1040, zero if not more)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rec.ded_prior
      take: rec.agi_prior
    cite:
      doc: p525
      locator: p. 25, Negative taxable income, "If your taxable income for the prior year (Worksheet 2, line 10) was a negative
        amount, the recovery you must include in income is reduced by that amount"
  - id: rec.line11_negative
    printed: (helper)
    label: Add lines 9 and 10 (line 10 negative), but not less than zero
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rec.line9
      take: rec.negative_ti
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line 11, "add lines 9 and 10 and enter the result (but not less than zero)"; p. 26, Example 33, "You must include $50 in your 2025 income, rather than $250"
  - id: rec.nol_negative
    printed: (gate)
    label: Negative 2024 taxable income while a net operating loss is carried into 2025
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - rec.ti_positive
        - const: false
      - op: test
        gt:
        - rec.negative_ti
        - const: 0
      - op: test
        eq:
        - scope.nol
        - const: true
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, footnote 4, "Taxable income will have to be adjusted for any net operating loss carryover.
        For more information, see the Instructions for Form 172"
  - id: rec.line11
    printed: '11'
    label: 'Amount to include in income for 2025: if line 10 is zero or more, the amount from line 9; if line 10 is a negative
      amount, lines 9 and 10 added (but not less than zero)'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.ti_positive
          - const: true
        then: rec.line9
      - guard:
          op: test
          eq:
          - rec.ti_positive
          - const: false
        then: rec.line11_negative
    cite:
      doc: p525
      locator: 'p. 27, Worksheet 2, line 11, "Amount to include in income for 2025: • If line 10 is zero or more, enter the
        amount from line 9"'
    refuses:
    - when: refund.exc_tax
      form: Pub. 525, Itemized Deduction Recoveries (Unused tax credits, Subject to AMT, Capital gains)
      remedy: Your 2024 alternative minimum tax, unused credits, 0% capital gain rate or sales tax choice means the 2024 tax is
        refigured to find how much of what was paid back is taxable; that is outside this tool.
      cite:
        doc: p525
        locator: p. 27, Worksheet 2, "If you were subject to the AMT or your tax credits reduced your tax to zero, see Unused
          tax credits and Subject to AMT under Itemized Deduction Recoveries"; p. 25, Capital gains, "you’ll have to refigure
          your tax for the earlier year to determine if the recovery must be included in your income"
    - when: refund.exc_who
      form: Pub. 525, Itemized Deduction Recoveries (Worksheet 2)
      remedy: A 2024 return on which you could be claimed as a dependent, a 2024 Form 1040-NR, or a refund from a joint state
        or local return with someone you are not filing jointly with for 2025 changes the 2024 standard deduction or the
        refund to count; that is outside this tool.
      cite:
        doc: p525
        locator: p. 25, Itemized Deduction Recoveries, "You could be claimed as a dependent by someone else in 2024" and "You received a
          refund because of a jointly filed state or local income tax return"; p. 25, Nonresident aliens, "you can’t claim the
          standard deduction"
    - when: rec.nol_negative
      form: Pub. 525, Worksheet 2, line 10, and Form 172 (a net operating loss carryover)
      remedy: Negative 2024 taxable income while a net operating loss is carried into 2025 must be adjusted for the carryover
        under the Instructions for Form 172; that is outside this tool.
      cite:
        doc: p525
        locator: p. 27, Worksheet 2, footnote 4, "Taxable income will have to be adjusted for any net operating loss
          carryover"
  - id: rec.line11_is_line3
    printed: (helper)
    label: Line 11 equals line 3
    type: Bool
    expr:
      op: test
      eq:
      - rec.line11
      - rec.line3
    cite:
      doc: p525
      locator: 'p. 27, Worksheet 2, "If line 11 equals line 3: Enter the amount from line 1a on Schedule 1 (Form 1040), line 1"'
  - id: rec.line_b_share
    printed: (helper)
    label: Divide line 1a by line 3 (line A) and multiply line 11 by that percentage
    type: NonNegDollars
    expr:
      op: prorate
      amount: rec.line11
      part: rec.line1a
      whole: rec.line3
      places: 6
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line A, "Divide the amount on line 1a by the amount on line 3. Enter the percentage"; line B,
        "Multiply the amount on line 11 by the percentage on line A"; p. 25, Example 31, "$300 [($500 ÷ $2,500) × $1,500]"
    ambiguity: amb.2025.rec_ratio_places
  - id: rec.line_b
    printed: B
    label: 'The amount for Schedule 1, line 1: line 1a when line 11 equals line 3; otherwise line 11 times line 1a divided by
      line 3 (all of line 11 when lines 1b and 2 are zero, none when line 1a is zero)'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.line11_is_line3
          - const: true
        then: rec.line1a
      - guard:
          op: test
          eq:
          - rec.line11_is_line3
          - const: false
        then: rec.line_b_share
    cite:
      doc: p525
      locator: 'p. 27, Worksheet 2, "If line 11 is less than line 3 and either line 1a or line 1b or line 2 is zero: If there is an amount on line 1a, enter the amount from line 11 on Schedule 1 (Form 1040), line 1" and line B, "Enter the result here and on Schedule 1 (Form 1040), line 1"'
  - id: rec.line_c
    printed: C
    label: Subtract the amount on line B from the amount on line 11. Enter the result here and on Schedule 1 (Form 1040), line
      8z
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rec.line11
      take: rec.line_b
    cite:
      doc: p525
      locator: p. 27, Worksheet 2, line C, "Subtract the amount on line B from the amount on line 11. Enter the result here and
        on Schedule 1 (Form 1040), line 8z"; p. 25, Where to report, "the total of all other recoveries as other income on
        Schedule 1 (Form 1040), line 8z"
  - id: rec.to_line1
    printed: (helper)
    label: The taxable state or local income tax refund for Schedule 1, line 1, when Worksheet 2 is used
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.path
          - const: true
        then: rec.line_b
      - guard:
          op: test
          eq:
          - rec.path
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 25, Where to report, "Enter your state or local income tax refund on Schedule 1 (Form 1040), line 1"
  - id: rec.to_line8z
    printed: (helper)
    label: The taxable recoveries other than the state or local income tax refund, for Schedule 1, line 8z
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rec.path
          - const: true
        then: rec.line_c
      - guard:
          op: test
          eq:
          - rec.path
          - const: false
        then: rec.zero
    cite:
      doc: p525
      locator: p. 25, Where to report, "the total of all other recoveries as other income on Schedule 1 (Form 1040), line 8z";
        i1040gi p. 92, Line 8z, "See Recoveries in Pub. 525 for details on how to figure the amount to report"
    refuses:
    - when: rec.before_prior_year_if_any
      form: Pub. 525, Worksheet 2 (a recovery for an earlier year)
      remedy: Money paid back for something paid or deducted before 2024 is figured on a separate worksheet with that year's
        return; that is outside this tool.
      cite:
        doc: p525
        locator: p. 27, Worksheet 2, "If you recovered amounts from more than 1 year, such as a state income tax refund from
          2024 and a casualty loss reimbursement from 2023, complete a separate worksheet for each year"
    - when: rec.nonitemized_if_any
      form: Pub. 525, Nonitemized Deduction Recoveries and Amounts Recovered for Credits
      remedy: Money paid back for a deduction taken without itemizing (such as a bad debt) or for an item on which a credit
        was claimed is outside this tool.
      cite:
        doc: p525
        locator: p. 28, Nonitemized Deduction Recoveries, "If you recover an amount that you deducted in an earlier year when
          you were figuring your AGI, you must generally include the full amount"; p. 28, Amounts Recovered for Credits
    - when: rec.sales_tax_if_any
      form: Pub. 525, Worksheet 2, line 2 (a refund of general sales tax)
      remedy: A refund of general sales tax is limited by the sales tax and income tax you could have deducted for 2024; that
        is outside this tool.
      cite:
        doc: p525
        locator: p. 27, Worksheet 2, footnote 2, "don’t enter more than the excess of your sales tax deduction over your state
          and local income tax you could have deducted"
    - when: rec.two_returns_if_joint
      form: Pub. 525, Worksheet 2 (deductions on two 2024 returns)
      remedy: Amounts paid back for deductions on two 2024 returns, one for each of you, are tested against each 2024 return
        in turn; that is outside this tool.
      cite:
        doc: p525
        locator: p. 27, Worksheet 2, "Use information from your tax return for the year the expense was deducted"
