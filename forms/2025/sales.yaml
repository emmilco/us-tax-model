form:
  id: sales
  kind: form
  title: Form 8949 and Schedule D — manually classified securities transactions
  tax_year: 2025
  collection:
    cite:
      doc: f8949
      locator: Parts I and II, transaction rows
  note: Stable keys identify transactions. The taxpayer supplies holding-period
    and reporting classifications from records. Dates/descriptions and completed
    PDF preparation are deferred; this is a calculation values sheet. Wash-sale
    detection and basis determination are not automated.
  lines:
    - id: sales.box
      printed: (helper)
      label: "Classification from records: A/B/C short-term (held 1 year or less), D/E/F long-term (held more than 1 year); G–L digital assets. Property you inherited is long-term however long you held it. To count the holding period, begin on the day after you acquired the property and include the day you sold it. If your basis in property you received as a gift is the donor's adjusted basis, your holding period began on the day the donor's did. A block acquired on different dates is entered as separate transactions for its short-term and long-term parts. Stock or securities bought in a wash sale include the holding period of those sold. New stock from a nontaxable stock dividend or a spin-off, and nontaxable stock rights, include the holding period of the old stock; stock from a taxable stock dividend begins on the date of distribution, stock acquired by exercising stock rights on the date the right was exercised, and property acquired by exercising an option the day after the option was exercised. A nonbusiness bad debt is short-term, and so is a gain or loss under the net asset value (NAV) method for a money market fund. A loss on a short sale is long-term if, on the date of the short sale, you held substantially identical property for more than 1 year."
      type: Enum(sales_box)
      expr:
        op: input
        source: "Classification from records: A/B/C short-term (held 1 year or less), D/E/F long-term (held more than 1 year); G–L digital assets. Property you inherited is long-term however long you held it. To count the holding period, begin on the day after you acquired the property and include the day you sold it. If your basis in property you received as a gift is the donor's adjusted basis, your holding period began on the day the donor's did. A block acquired on different dates is entered as separate transactions for its short-term and long-term parts. Stock or securities bought in a wash sale include the holding period of those sold. New stock from a nontaxable stock dividend or a spin-off, and nontaxable stock rights, include the holding period of the old stock; stock from a taxable stock dividend begins on the date of distribution, stock acquired by exercising stock rights on the date the right was exercised, and property acquired by exercising an option the day after the option was exercised. A nonbusiness bad debt is short-term, and so is a gain or loss under the net asset value (NAV) method for a money market fund. A loss on a short sale is long-term if, on the date of the short sale, you held substantially identical property for more than 1 year."
      cite:
        doc: i8949
        locator: pp. 2–5, holding period and checkbox classifications; p. 2, "To figure the holding period, begin counting
          on the day after you received the property and include the day you disposed of it." and "Generally, if you
          disposed of property that you acquired by inheritance, report the disposition as a long-term gain (or loss)
          regardless of how long you held the property."; p. 6, "However, you must still report the short-term gain (or
          loss) on the sale on Part I and the long-term gain (or loss) on Part II."; p550 p. 82, Property received as a
          gift, "If you receive a gift of property and your basis is determined by the donor's adjusted basis, your holding
          period is considered to have started on the same day the donor's holding period started.", Stock dividends, "The
          holding period for stock you received as a taxable stock dividend begins on the date of distribution. The holding
          period for new stock you received as a nontaxable stock dividend begins on the same day as the holding period of
          the old stock. This rule also applies to stock acquired in a spin-off", Nontaxable stock rights, "Your holding
          period for nontaxable stock rights includes the holding period of the underlying stock. The holding period for
          stock acquired through the exercise of stock rights begins on the date the right was exercised." and Option
          exercised, "Your holding period for property you acquire when you exercise an option begins the day after you
          exercise the option."; p550 p. 86, "Your holding period for the new stock or securities includes the holding
          period of the stock or securities sold." and "If, on the date of the short sale, you held substantially identical
          property for more than 1 year, any loss you realize on the short sale is a long-term capital loss"; i8949 p. 2, "A
          nonbusiness bad debt must be treated as a short-term capital loss."; i8949 p. 5, Net asset value (NAV) method for
          money market funds, "No long-term capital gain (or loss) can be entered under the NAV method."
    - id: sales.route
      printed: (helper)
      label: Report this transaction in detail on Form 8949 or directly in Schedule D
        aggregate totals
      type: Enum(sales_route)
      expr:
        op: input
        source: Report this transaction in detail on Form 8949 or directly in Schedule D
          aggregate totals
      cite:
        doc: i1040sd
        locator: p. 10, lines 1a and 8a
    - id: sales.code
      printed: (helper)
      label: "Adjustment codes: none, B, W, BW; choose other for any additional code"
      type: Enum(sales_code)
      expr:
        op: input
        source: "Adjustment codes: none, B, W, BW; choose other for any additional code"
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.special
      printed: (helper)
      label: 'Does this sale involve collectibles (works of art, rugs, antiques, metals such as gold, silver or platinum bullion, including shares of an exchange-traded fund or trust that holds gold, silver, platinum or other metals, gems, stamps, coins, alcoholic beverages or other tangible property of that kind), qualified small business stock with a section 1202 exclusion, depreciable real property (section 1250 property: generally, real property that you depreciated, such as a home you once rented out or used in part as a home office), or an interest in a partnership, S corporation or trust (including S corporation stock) that holds collectibles or section 1250 property directly or through another entity, such as stock of an S corporation that owns art or gold worth more than its cost?'
      type: Bool
      expr:
        op: input
        source: 'Does this sale involve collectibles (works of art, rugs, antiques, metals such as gold, silver or platinum bullion, including shares of an exchange-traded fund or trust that holds gold, silver, platinum or other metals, gems, stamps, coins, alcoholic beverages or other tangible property of that kind), qualified small business stock with a section 1202 exclusion, depreciable real property (section 1250 property: generally, real property that you depreciated, such as a home you once rented out or used in part as a home office), or an interest in a partnership, S corporation or trust (including S corporation stock) that holds collectibles or section 1250 property directly or through another entity, such as stock of an S corporation that owns art or gold worth more than its cost?'
      cite:
        doc: i1040sd
        locator: pp. 11–12, lines 18 and 19; p. 11, Line 19, "section 1250 property (generally, real property that you depreciated)"; p. 11, line 18, "Include on the worksheet any gain (but not loss) from the sale or exchange of an interest in a partnership, S corporation, or trust held for more than 1 year and attributable to unrealized appreciation of collectibles."; p. 12,
          line 19, "You reported a long-term capital gain from the sale or exchange of an interest in a partnership that owned
          section 1250 property"
    - id: sales.aggregate_eligible
      printed: (helper)
      label: "Confirm all aggregate conditions: basis reported, no broker adjustments,
        no Ordinary box, no QOF disposition/deferral, no corrections, no
        collectibles"
      type: Bool
      expr:
        op: input
        source: "Confirm all aggregate conditions: basis reported, no broker
          adjustments, no Ordinary box, no QOF disposition/deferral, no
          corrections, no collectibles"
      cite:
        doc: i1040sd
        locator: p. 10, lines 1a and 8a
    - id: sales.proceeds
      printed: (helper)
      label: "Column (d): proceeds per broker report (or the correct proceeds if you received more than the report shows),
        or net proceeds if no report"
      type: NonNegDollars
      expr:
        op: input
        source: "Column (d): proceeds per broker report (or the correct proceeds if you received more than the report
          shows), or net proceeds if no report"
      cite:
        doc: i8949
        locator: p. 6, column (d); p. 6, "If the proceeds you received were more than shown on Form 1099-B, Form 1099-DA,
          or Form 1099-S (or substitute statement), enter the correct proceeds in column (d)."
    - id: sales.reported_basis
      printed: (helper)
      label: Basis shown on broker report
      type: NonNegDollars
      expr:
        op: input
        source: Basis shown on broker report
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.correct_basis
      printed: (helper)
      label: Correct adjusted basis from records (for inherited property shown on a Schedule A (Form 8971) as increasing
        the estate tax, starting from no more than its final estate tax value)
      type: NonNegDollars
      expr:
        op: input
        source: Correct adjusted basis from records. For property you inherited, if a Schedule A (Form 8971) you received
          shows in Part II, column (f), that the property increased the estate tax liability, start from an initial basis
          equal to or less than the final estate tax value in Part II, column (h), then adjust it. Among the adjustments,
          add a loss disallowed by the wash sale rules when you bought this stock or security as the replacement (unless
          the replacement was bought for an IRA or Roth IRA); add payments in lieu of dividends you could not deduct because
          you closed a short sale by the 45th day (to the stock used to close it); for stock from a compensatory option,
          add any amount you included in income upon grant or exercise that the reported basis does not reflect; and
          subtract nondividend distributions that were a return of your basis.
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W; p. 6, Schedule A (Form 8971)—Consistent basis
          reporting, "In this case, first use an amount that is equal to or less than the final estate tax value listed in
          Part II, column (h), of the Schedule A (Form 8971). This amount is your initial basis in the property."; p550
          p. 86, "If your loss was disallowed because of the wash sale rules, add the disallowed loss to the cost of the new
          stock or securities (except in (4) above)." and "Instead, you must increase the basis of the stock used to close
          the short sale by that amount."; i8949 p. 7, "Increase your basis by any amount you included in income upon grant
          or exercise of the option."; i8949 p. 5, Nondividend distributions, "Reduce your cost (or other basis) in a share
          by the distributions allocable to such share."
    - id: sales.wash_loss
      printed: (helper)
      label: Correct nondeductible wash-sale loss; positive cents, including losses
        not reported by broker; not more than the loss on this sale
      type: NonNegDollars
      expr:
        op: input
        source: Correct nondeductible wash-sale loss; positive cents, including losses
          not reported by broker. It cannot be more than the loss on this sale (column (e) less
          column (d), after any code B basis correction).
      cite:
        doc: i8949
        locator: p. 10, code W; a lower corrected loss requires an explanation statement
    - id: sales.covered
      printed: (helper)
      label: Basis reported to IRS
      type: Bool
      expr:
        op: test
        any:
          - op: test
            eq:
              - sales.box
              - const: A
          - op: test
            eq:
              - sales.box
              - const: D
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.digital
      printed: (helper)
      label: Digital asset box G–L
      type: Bool
      expr:
        op: test
        any:
          - op: test
            eq:
              - sales.box
              - const: G
          - op: test
            eq:
              - sales.box
              - const: H
          - op: test
            eq:
              - sales.box
              - const: I
          - op: test
            eq:
              - sales.box
              - const: J
          - op: test
            eq:
              - sales.box
              - const: K
          - op: test
            eq:
              - sales.box
              - const: L
      cite:
        doc: f8949
        locator: p. 1, Part I, "(G) Short-term transactions reported on Form(s) 1099-DA showing basis was reported to
          the IRS", "(H) Short-term transactions reported on Form(s) 1099-DA showing basis was not reported to the
          IRS", "(I) Short-term digital asset transactions not reported to you on Form 1099-DA or Form 1099-B"; p. 2,
          Part II, "(J) Long-term transactions reported on Form(s) 1099-DA showing basis was reported to the IRS",
          "(K) Long-term transactions reported on Form(s) 1099-DA showing basis was not reported to the IRS", "(L)
          Long-term digital asset transactions not reported to you on Form 1099-DA or Form 1099-B"
    - id: sales.has_b
      printed: (helper)
      label: Basis correction code B applies
      type: Bool
      expr:
        op: test
        any:
          - op: test
            eq:
              - sales.code
              - const: B
          - op: test
            eq:
              - sales.code
              - const: BW
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.has_w
      printed: (helper)
      label: Wash-sale code W applies
      type: Bool
      expr:
        op: test
        any:
          - op: test
            eq:
              - sales.code
              - const: W
          - op: test
            eq:
              - sales.code
              - const: BW
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.bad_code
      printed: (helper)
      label: Unsupported adjustment or code B without a broker basis report
      type: Bool
      expr:
        op: test
        any:
          - op: test
            eq:
              - sales.code
              - const: other
          - op: test
            all:
              - op: test
                eq:
                  - sales.has_b
                  - const: true
              - op: test
                any:
                  - op: test
                    eq:
                      - sales.box
                      - const: C
                  - op: test
                    eq:
                      - sales.box
                      - const: F
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.bad_aggregate
      printed: (helper)
      label: Aggregate route fails its eligibility conditions
      type: Bool
      expr:
        op: test
        all:
          - op: test
            eq:
              - sales.route
              - const: aggregate
          - op: test
            any:
              - op: test
                eq:
                  - sales.covered
                  - const: false
              - op: test
                ne:
                  - sales.code
                  - const: none
              - op: test
                eq:
                  - sales.aggregate_eligible
                  - const: false
      cite:
        doc: i1040sd
        locator: p. 10, lines 1a and 8a
    - id: sales.one
      printed: (helper)
      label: Screen this transaction before any aggregation
      type: Count
      expr:
        op: param
        ref: sales.one
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
      refuses:
        - when: sales.digital
          form: Form 8949 digital asset boxes G–L
          remedy: Digital asset transactions are outside this tool; prepare the applicable
            digital-asset part.
          cite:
            doc: f8949
            locator: Parts I and II, boxes G–L
        - when: sales.special
          form: Schedule D special gains worksheets
          remedy: Sales of collectibles, section 1202 stock or section 1250 property, and sales of an interest in a
            partnership, S corporation or trust that holds collectibles or section 1250 property, are unsupported.
          cite:
            doc: i1040sd
            locator: pp. 11–12, lines 18 and 19
        - when: sales.bad_code
          form: Form 8949 adjustment instructions
          remedy: Only applicable B and W adjustments are supported. Review the required
            code and prepare the unsupported adjustment.
          cite:
            doc: i8949
            locator: pp. 7–11, columns (e) through (h), codes B and W
        - when: sales.bad_aggregate
          form: Form 8949
          remedy: Use the detail route; this transaction does not qualify for Schedule D
            lines 1a/8a.
          cite:
            doc: i1040sd
            locator: p. 10, lines 1a and 8a
    - id: sales.zero
      printed: (helper)
      label: No adjustment
      type: NonNegDollars
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.e
      printed: (e)
      label: "Column (e): reported basis if covered; correct basis otherwise"
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sales.covered
                - const: true
            then: sales.reported_basis
          - guard:
              op: test
              eq:
                - sales.covered
                - const: false
            then: sales.correct_basis
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.b_difference
      printed: (helper)
      label: Reported basis minus correct basis
      type: Dollars
      expr:
        op: subtract
        from: sales.reported_basis
        take: sales.correct_basis
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.adjust_b
      printed: (helper)
      label: Correct reported basis in column (g)
      type: Bool
      expr:
        op: test
        all:
          - op: test
            eq:
              - sales.covered
              - const: true
          - op: test
            eq:
              - sales.has_b
              - const: true
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.b
      printed: (helper)
      label: Basis correction in column (g)
      type: Dollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sales.adjust_b
                - const: true
            then: sales.b_difference
          - guard:
              op: test
              eq:
                - sales.adjust_b
                - const: false
            then: sales.zero
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.wash_over
      printed: (helper)
      label: Gain or loss before the wash-sale adjustment, plus the entered wash-sale loss
      type: Dollars
      expr:
        op: sum
        of:
          - sales.before_adjustment
          - sales.b
          - sales.wash_loss
      cite:
        doc: i8949
        locator: p. 10, code W, "You have a nondeductible loss from a wash sale" and "enter the amount of the nondeductible
          loss as a positive number in column (g)"
    - id: sales.wash_bad
      printed: (gate)
      label: Code W with a wash-sale loss larger than the loss figured from columns (d), (e) and the code B adjustment
      type: Bool
      expr:
        op: test
        all:
          - op: test
            eq:
              - sales.has_w
              - const: true
          - op: test
            gt:
              - sales.wash_loss
              - param: sales.zero
          - op: test
            gt:
              - sales.wash_over
              - param: sales.zero
      cite:
        doc: i8949
        locator: p. 10, code W, "You have a nondeductible loss from a wash sale" and "enter the amount of the nondeductible
          loss as a positive number in column (g)"; p550 p. 86, Wash Sales, "A wash sale occurs when you sell or trade stock
          or securities at a loss"
    - id: sales.w
      printed: (helper)
      label: Wash-sale adjustment in column (g)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sales.has_w
                - const: true
            then: sales.wash_loss
          - guard:
              op: test
              eq:
                - sales.has_w
                - const: false
            then: sales.zero
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
      refuses:
        - when: sales.wash_bad
          form: Form 8949, column (g), code W
          remedy: The nondeductible wash-sale loss entered is more than the loss on this sale (column (e) less column
            (d), after any code B correction). Check the amount against your Form 1099-B and your records.
          cite:
            doc: i8949
            locator: p. 10, code W, "enter the amount of the nondeductible loss as a positive number in column (g)"
    - id: sales.g
      printed: (g)
      label: "Column (g): net adjustments"
      type: Dollars
      expr:
        op: sum
        of:
          - sales.b
          - sales.w
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.before_adjustment
      printed: (helper)
      label: Proceeds less column (e)
      type: Dollars
      expr:
        op: subtract
        from: sales.proceeds
        take: sales.e
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    - id: sales.h
      printed: (h)
      label: "Column (h): proceeds less basis plus adjustments"
      type: Dollars
      expr:
        op: sum
        of:
          - sales.before_adjustment
          - sales.g
      cite:
        doc: i8949
        locator: p. 11, column (h)
      ambiguity: amb.2025.sales_rounding
