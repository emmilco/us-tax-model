form:
  id: f1116
  kind: form
  title: Form 1116 — Foreign Tax Credit (passive category, one form)
  tax_year: 2025
  note: Prepared when foreign tax is owed a credit but the election without Form 1116 is not available or a carryover is
    claimed. One Form 1116, category c (passive), with income and tax reported in U.S. dollars on Forms 1099-DIV, 1099-INT
    or similar statements, and Schedule B (Form 1116) for a carryover claimed or generated. Refused on line 35 are other
    categories, tax paid directly, foreign capital gains, redeterminations, line 12 reductions, loss accounts, a changed
    or divided carryover, Schedule C income, state or local income tax among itemized deductions, the asset method for
    interest, adjusted qualified dividends, high-taxed income, a U.S. loss and a carryback to 2024.
  lines:
    - id: f1116.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 14, "Combine lines 11, 12, and 13. This is the total amount of foreign taxes available for credit"'
    - id: f1116.foreign_gain
      printed: (helper)
      type: Bool
      label: Did you have a capital gain or loss from sources outside the United States (including a foreign-source
        capital gain distribution)?
      expr:
        op: input
        source: Did you have a capital gain or loss from sources outside the United States, including a foreign-source
          capital gain distribution?
      cite:
        doc: i1116
        locator: 'p. 9, Foreign Qualified Dividends and Capital Gains (Losses), "If you have foreign source qualified dividends or foreign source capital gains (including any foreign source capital gain distributions) or losses, you may be required to make certain adjustments to those amounts before taking them into account on line 1a (gross income) or line 5 (losses)."'
    - id: f1116.redetermination
      printed: (helper)
      type: Bool
      label: Was foreign tax of an earlier year refunded or changed in 2025 (a foreign tax redetermination)?
      expr:
        op: input
        source: Was foreign tax of an earlier year refunded to you, or changed, in 2025?
      cite:
        doc: i1116
        locator: 'p. 2, "Use Schedule C (Form 1116) to report foreign tax redeterminations that occurred in the current tax year and that relate to prior tax years."'
    - id: f1116.reduction
      printed: (helper)
      type: Bool
      label: Must the foreign taxes be reduced on Form 1116 line 12 (income excluded on Form 2555 or 4563 or exempt
        Puerto Rico income, foreign oil and gas or mineral income, failure to file Form 5471 or 8865, an international
        boycott, or a foreign tax credit splitting event)?
      expr:
        op: input
        source: Must the foreign taxes be reduced for any item listed under Line 12 of the Form 1116 instructions?
      cite:
        doc: i1116
        locator: 'p. 19, Line 12, "You may have to reduce the foreign taxes you paid or accrued by the following items."'
    - id: f1116.loss_accounts
      printed: (helper)
      type: Bool
      label: Does an earlier year, with or without a Form 1116, leave an overall foreign loss, separate limitation loss or
        overall domestic loss account still to recapture?
      expr:
        op: input
        source: In an earlier year, with or without a Form 1116, did a foreign loss reduce U.S. income or foreign income of
          another category, or a U.S. loss reduce foreign income, leaving an overall foreign loss, separate limitation loss
          or overall domestic loss account still to recapture?
      cite:
        doc: i1116
        locator: 'p. 20, Line 16, "You are required to increase or decrease the amount on line 15 by the following adjustments."; p. 21, Recapture of prior-year overall foreign loss accounts, "If you had an overall foreign loss in a prior year that offset U.S. source income, a part of your foreign income (in the same category as the loss) is recharacterized as U.S. source income in each following tax year."'
    - id: f1116.other_category
      printed: (gate)
      type: Bool
      label: Some foreign income is not passive category income (it needs its own Form 1116 and the Part IV summary)
      expr:
        op: test
        eq:
          - ftc.all_passive_if_tax
          - const: false
      cite:
        doc: i1116
        locator: 'p. 11, Lines 1a and 1b, "If you received dividends (passive category income) and wages (general category income) from foreign sources, you must complete two Forms 1116."'
    - id: f1116.not_on_statement
      printed: (gate)
      type: Bool
      label: Some foreign income or tax was not reported on a payee statement in U.S. dollars (foreign-currency columns
        and conversion)
      expr:
        op: test
        eq:
          - ftc.statements_if_tax
          - const: false
      cite:
        doc: i1116
        locator: 'p. 18, Part II, "Generally, you must enter in Part II the amount of foreign taxes, in both the foreign currency denomination(s) and as converted into U.S. dollars, that relate to the category of income checked above Part I."'
    - id: f1116.not_creditable
      printed: (gate)
      type: Bool
      label: The foreign tax entered is not all creditable after the required reductions
      expr:
        op: test
        eq:
          - ftc.eligible_if_tax
          - const: false
      cite:
        doc: i1116
        locator: 'p. 18, Part II, "See General Instructions, earlier, for descriptions of foreign taxes that are eligible for the foreign tax credit and for foreign taxes that aren’t eligible for the foreign tax credit."'
    - id: f1116.business
      printed: (gate)
      type: Bool
      label: The return has a Schedule C, whose gross receipts line 3e would need
      expr:
        op: test
        eq:
          - s1.has_sc
          - const: true
      cite:
        doc: i1116
        locator: 'p. 17, Lines 3d and 3e, "gross income means the total of your gross receipts (reduced by cost of goods sold), total capital and ordinary gains (before subtracting any losses), and all other income (before subtracting any deductions)"'
    - id: f1116.rental
      printed: (gate)
      type: Bool
      label: The return has a Schedule E rental or royalty, whose gross rents and royalties line 3e would need
      expr:
        op: test
        eq:
          - sche.any
          - const: true
      cite:
        doc: i1116
        locator: 'p. 17, Lines 3d and 3e, "gross income means the total of your gross receipts (reduced by cost of goods sold), total capital and ordinary gains (before subtracting any losses), and all other income (before subtracting any deductions)"'
    - id: f1116.itemized_unread
      printed: (gate)
      type: Bool
      label: 'Itemized deductions include state or local income tax (Schedule A line 5a), whose part related to foreign
        income Pub. 514 allocates by the income the state taxes'
      expr:
        op: test
        all:
          - op: test
            eq:
              - sa.itemizes
              - const: true
          - op: test
            gt:
              - sa.line5a_total
              - const: 0
      cite:
        doc: p514
        locator: 'p. 27, State income taxes, "State income taxes (and certain taxes measured by taxable income) are definitely related and allocable to the gross income on which the taxes are imposed."; "If the total income taxed by the state is greater than the amount of U.S. source income for federal tax purposes, then the state tax is allocable to both U.S. source and foreign source income."'
      ambiguity: amb.2025.f1116_itemized
    - id: f1116.interest_threshold
      printed: (helper)
      type: NonNegDollars
      label: Year parameter f1116.interest_threshold
      expr:
        op: param
        ref: f1116.interest_threshold
      cite:
        doc: i1116
        locator: 'p. 18, Line 4a, "If your gross foreign source income (including income excluded on Form 2555) doesn’t exceed $5,000, you can allocate all of your interest expense to U.S. source income."'
    - id: f1116.foreign_over
      printed: (gate)
      type: Bool
      label: Gross foreign source income is more than $5,000, so interest expense is apportioned
      expr:
        op: test
        gt:
          - f1116.line3d_total
          - f1116.interest_threshold
      cite:
        doc: i1116
        locator: 'p. 18, Line 4a, "If your gross foreign source income (including income excluded on Form 2555) doesn’t exceed $5,000, you can allocate all of your interest expense to U.S. source income."'
      ambiguity: amb.2025.f1116_interest_threshold
    - id: f1116.hmi_applies
      printed: (gate)
      type: Bool
      label: Home mortgage interest is apportioned (itemized deductions and gross foreign source income over $5,000)
      expr:
        op: test
        all:
          - op: test
            eq:
              - sa.itemizes
              - const: true
          - op: test
            eq:
              - f1116.foreign_over
              - const: true
      cite:
        doc: i1116
        locator: 'p. 18, Line 4a, "Otherwise, deductible home mortgage interest including points is apportioned using a gross income method."'
    - id: f1116.asset_method
      printed: (gate)
      type: Bool
      label: Interest expense other than home mortgage interest (investment, student loan or car loan interest) must be
        apportioned by the asset method
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1116.foreign_over
              - const: true
          - op: test
            any:
              - op: test
                gt:
                  - s1.line21
                  - const: 0
              - op: test
                gt:
                  - s1a.vli_deduction
                  - const: 0
              - op: test
                all:
                  - op: test
                    eq:
                      - sa.itemizes
                      - const: true
                  - op: test
                    gt:
                      - sa.line9
                      - const: 0
      cite:
        doc: i1116
        locator: 'p. 18, Line 4b, "Other interest expense includes investment interest, interest incurred in a trade or business, passive activity interest, deductible student loan interest, and qualified passenger vehicle loan interest."'
    - id: f1116.l5
      printed: (helper)
      type: NonNegDollars
      label: Line 5 of the Qualified Dividends and Capital Gain Tax Worksheet, or line 18 of the Schedule D Tax Worksheet
        when that worksheet figures the tax
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1040.gate.sdtw
                - const: true
            then: sdtw.line18
          - guard:
              op: test
              eq:
                - f1040.gate.sdtw
                - const: false
            then: qdcg.line5
      cite:
        doc: i1116
        locator: 'p. 9, Adjustment exception, "Line 5 of the Qualified Dividends and Capital Gain Tax Worksheet doesn’t exceed"; p. 24, "Line 18 of the Schedule D Tax Worksheet in the Schedule D (Form 1040) instructions is less than or equal to"'
    - id: f1116.must_adjust
      printed: (gate)
      type: Bool
      label: Foreign qualified dividends and line 18 must be adjusted unless the adjustment exception is taken
      expr:
        op: test
        any:
          - op: test
            all:
              - op: test
                eq:
                  - f1040.gate.qdcg_applies
                  - const: true
              - op: test
                eq:
                  - f1040.gate.sdtw
                  - const: false
              - op: test
                gt:
                  - qdcg.line5
                  - const: 0
              - op: test
                lt:
                  - qdcg.line23
                  - qdcg.line24
          - op: test
            all:
              - op: test
                eq:
                  - f1040.gate.sdtw
                  - const: true
              - op: test
                gt:
                  - sdtw.line18
                  - const: 0
              - op: test
                lt:
                  - sdtw.line45
                  - sdtw.line46
      cite:
        doc: i1116
        locator: 'p. 9, "Line 5 of the Qualified Dividends and Capital Gain Tax Worksheet is greater than zero." and "Line 23 of the Qualified Dividends and Capital Gain Tax Worksheet is less than line 24 of that worksheet."; p. 24, "Line 45 of the Schedule D Tax Worksheet is less than line 46."'
    - id: f1116.exception_ceiling
      printed: (helper)
      type: NonNegDollars
      label: Year parameter f1116.exception_ceiling
      expr:
        op: param
        ref: f1116.exception_ceiling
      cite:
        doc: i1116
        locator: 'p. 9, Adjustment exception, "$394,600 if married filing jointly or qualifying surviving spouse" and "$197,300 if single"'
    - id: f1116.exception_qd_limit
      printed: (helper)
      type: NonNegDollars
      label: Year parameter f1116.exception_qd_limit
      expr:
        op: param
        ref: f1116.exception_qd_limit
      cite:
        doc: i1116
        locator: 'p. 9, Adjustment exception, "The amount of your foreign source capital gain distributions plus the amount of your foreign source qualified dividends is less than $20,000."'
    - id: f1116.div_total
      printed: (helper)
      type: NonNegDollars
      label: Foreign-source dividends of all columns (at least the foreign-source qualified dividends)
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.div_income_if_div
      cite:
        doc: i1116
        locator: 'p. 9, Adjustment exception, "The amount of your foreign source capital gain distributions plus the amount of your foreign source qualified dividends is less than $20,000."'
      ambiguity: amb.2025.f1116_exception
    - id: f1116.exception
      printed: (gate)
      type: Bool
      label: The adjustment exception applies (and the tool elects not to adjust)
      expr:
        op: test
        all:
          - op: test
            le:
              - f1116.l5
              - f1116.exception_ceiling
          - op: test
            lt:
              - f1116.div_total
              - f1116.exception_qd_limit
      cite:
        doc: i1116
        locator: 'p. 9, Adjustment exception, "You qualify for the adjustment exception if you meet both of the following requirements."'
      ambiguity: amb.2025.f1116_exception
    - id: f1116.adjust
      printed: (gate)
      type: Bool
      label: Foreign qualified dividends and line 18 must be adjusted (the Worksheet for Line 18)
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1116.must_adjust
              - const: true
          - op: test
            eq:
              - f1116.exception
              - const: false
      cite:
        doc: i1116
        locator: 'p. 23, Line 18, "If you have qualified dividends or capital gains, you may be required to make adjustments to those qualified dividends and gains before you take those amounts into account on line 18 as described next."'
    - id: f1116.int_total
      printed: (helper)
      type: NonNegDollars
      label: Foreign-source interest of all columns
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.int_income_if_int
      cite:
        doc: i1116
        locator: 'p. 11, Lines 1a and 1b, "Include income in the category checked above Part I that is taxable by the United States and is from sources within the country entered on line i"'
    - id: f1116.income_over
      printed: (gate)
      type: Bool
      label: The foreign dividends or interest of the columns are more than the ordinary dividends or taxable interest on
        Form 1040 lines 3b and 2b, of which they are parts
      expr:
        op: test
        any:
          - op: test
            gt:
              - f1116.div_total
              - f1040.line3b
          - op: test
            gt:
              - f1116.int_total
              - f1040.line2b
      cite:
        doc: i1116
        locator: 'p. 11, Lines 1a and 1b, "Include income in the category checked above Part I that is taxable by the United States and is from sources within the country entered on line i"'
    - id: f1116.tax_mismatch
      printed: (gate)
      type: Bool
      label: The foreign tax of the columns (line 8) differs from the foreign tax entered for the credit
      expr:
        op: test
        not:
          op: test
          eq:
            - f1116.line8
            - ftc.taxes_if_asked
      cite:
        doc: f1116
        locator: 'p. 1, Part II, line 8, "Add lines A through C, column (u). Enter the total here and on line 9, page 2"'
    - id: f1116.line1a_total
      printed: 1a (Total)
      type: NonNegDollars
      label: Gross income from sources within country shown above and of the type checked above (Total, add cols. A, B,
        and C)
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.line1a
      cite:
        doc: f1116
        locator: 'p. 1, Part I, "Total", "(Add cols. A, B, and C.)"'
    - id: f1116.line3a_itemized
      printed: (helper)
      type: NonNegDollars
      label: Itemized deductions for line 3a (Schedule A line 4, medical, and line 5e, state and local taxes, which on
        the returns prepared hold no income tax)
      expr:
        op: sum
        of:
          - sa.line4
          - sa.line5e
      cite:
        doc: i1116
        locator: 'p. 17, Lines 3a and 3b, "Include the following itemized deductions (from Schedule A (Form 1040)) on line 3a."; "Don’t include more state and local taxes on Form 1116, lines 2 and 3a, than the amount reported on Schedule A (Form 1040), line 5e."'
      ambiguity: amb.2025.f1116_itemized
    - id: f1116.line3a
      printed: 3a
      type: NonNegDollars
      label: Certain itemized deductions or standard deduction
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: true
            then: f1116.line3a_itemized
          - guard:
              op: test
              eq:
                - sa.itemizes
                - const: false
            then: f1040.line12e
      cite:
        doc: i1116
        locator: 'p. 17, Lines 3a and 3b, "If you don’t itemize deductions, enter your standard deduction on line 3a."'
    - id: f1116.line3b
      printed: 3b
      type: NonNegDollars
      label: Other deductions (Schedule 1, Part II adjustments to income, less the student loan interest deduction, which
        is interest expense)
      expr:
        op: subtract_floor0
        from: s1.line26
        take: s1.line21
      cite:
        doc: i1116
        locator: 'p. 17, Lines 3a and 3b, "Line 3b. Enter on line 3b any other deductions that don’t definitely relate to any specific type of income (for example, deductions shown on Schedule 1 (Form 1040), Part II, Adjustments to Income)."; p. 18, Line 4b, "Other interest expense includes investment interest, interest incurred in a trade or business, passive activity interest, deductible student loan interest, and qualified passenger vehicle loan interest."'
      ambiguity: amb.2025.f1116_3b_items
    - id: f1116.line3c
      printed: 3c
      type: NonNegDollars
      label: Add lines 3a and 3b
      expr:
        op: sum
        of:
          - f1116.line3a
          - f1116.line3b
      cite:
        doc: f1116
        locator: 'p. 1, Part I, line 3c, "Add lines 3a and 3b"'
    - id: f1116.line3d_total
      printed: (helper)
      type: NonNegDollars
      label: Gross foreign source income of all columns
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.line3d
      cite:
        doc: i1116
        locator: 'p. 18, Line 4a, "If your gross foreign source income (including income excluded on Form 2555) doesn’t exceed $5,000, you can allocate all of your interest expense to U.S. source income."'
    - id: f1116.gains
      printed: (helper)
      type: Dollars
      label: Capital gains before subtracting any losses (the gain of each sale entry that has a gain)
      expr:
        op: sum_over
        collection: sales
        field: sales.h
        where:
          op: test
          gt:
            - sales.h
            - const: 0
      cite:
        doc: i1116
        locator: 'p. 17, Lines 3d and 3e, "gross income means the total of your gross receipts (reduced by cost of goods sold), total capital and ordinary gains (before subtracting any losses), and all other income (before subtracting any deductions)"'
      ambiguity: amb.2025.f1116_gross_income
    - id: f1116.line3e
      printed: 3e
      type: Dollars
      label: Gross income from all sources (wages, taxable interest, ordinary dividends, taxable IRA distributions,
        pensions and social security, Schedule 1 lines 1, 2a, 7 and 9, capital gains before losses and capital gain
        distributions)
      expr:
        op: sum
        of:
          - f1040.line1z
          - f1040.line2b
          - f1040.line3b
          - f1040.line4b
          - f1040.line5b
          - f1040.line6b
          - s1.line1
          - s1.line2a
          - s1.line7
          - s1.line9
          - f1116.gains
          - sd.line13
      cite:
        doc: i1116
        locator: 'p. 17, Lines 3d and 3e, "Line 3e. Enter on line 3e in each column your gross income from all sources and all categories, both U.S. and foreign."'
      ambiguity: amb.2025.f1116_gross_income
    - id: f1116.has_gross
      printed: (gate)
      type: Bool
      label: Gross income from all sources is more than zero (line 3f can be figured)
      expr:
        op: test
        gt:
          - f1116.line3e
          - const: 0
      cite:
        doc: i1116
        locator: 'p. 18, Line 3f, "Divide line 3d by line 3e and round off the result to at least four decimal places"'
    - id: f1116.line6_total
      printed: 6 (Total)
      type: NonNegDollars
      label: Add lines 2, 3g, 4a, 4b, and 5 (Total, add cols. A, B, and C)
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.line6
      cite:
        doc: f1116
        locator: 'p. 1, Part I, line 6, "Add lines 2, 3g, 4a, 4b, and 5"'
    - id: f1116.line7_total
      printed: 7 (Total)
      type: Dollars
      label: Subtract line 6 from line 1a (Total, add cols. A, B, and C)
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.line7
      cite:
        doc: f1116
        locator: 'p. 1, Part I, line 7, "Subtract line 6 from line 1a. Enter the result here and on line 15, page 2"'
    - id: f1116.line8
      printed: '8'
      type: NonNegDollars
      label: Add lines A through C, column (u)
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.line8u
      cite:
        doc: f1116
        locator: 'p. 1, Part II, line 8, "Add lines A through C, column (u). Enter the total here and on line 9, page 2"'
    - id: f1116.gross_hi
      printed: (helper)
      type: NonNegDollars
      label: Foreign income of all columns subject to foreign tax of 15 percent or greater (one item of income)
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.gross_hi
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 4, (c)(2), "expenses, losses and other deductions shall be allocated and apportioned initially to each of the groups of passive income"; "All passive income received during the taxable year that is subject to a withholding tax of fifteen percent or greater shall be treated as one item of income."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.tax_hi
      printed: (helper)
      type: NonNegDollars
      label: Foreign tax on the foreign income of all columns in the 15 percent or greater group
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.tax_hi
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 4, (c)(2), "expenses, losses and other deductions shall be allocated and apportioned initially to each of the groups of passive income"; "All passive income received during the taxable year that is subject to a withholding tax of fifteen percent or greater shall be treated as one item of income."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.gross_lo
      printed: (helper)
      type: NonNegDollars
      label: Foreign income of all columns subject to foreign tax of less than 15 percent (but above zero) (one item of income)
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.gross_lo
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 4, (c)(2), "expenses, losses and other deductions shall be allocated and apportioned initially to each of the groups of passive income"; "All passive income received during the taxable year that is subject to a withholding tax of fifteen percent or greater shall be treated as one item of income."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.tax_lo
      printed: (helper)
      type: NonNegDollars
      label: Foreign tax on the foreign income of all columns in the less than 15 percent (but above zero) group
      expr:
        op: sum_over
        collection: f1116col
        field: f1116col.tax_lo
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 4, (c)(2), "expenses, losses and other deductions shall be allocated and apportioned initially to each of the groups of passive income"; "All passive income received during the taxable year that is subject to a withholding tax of fifteen percent or greater shall be treated as one item of income."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.hmi_total
      printed: (helper)
      type: NonNegDollars
      label: Home mortgage interest apportioned by gross income (Schedule A line 8e when line 4a is figured; zero otherwise)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1116.hmi_applies
                - const: true
            then: sa.line8e
          - guard:
              op: test
              eq:
                - f1116.hmi_applies
                - const: false
            then: f1116.zero
      cite:
        doc: i1116
        locator: 'p. 18, Line 4a, "Otherwise, deductible home mortgage interest including points is apportioned using a gross income method."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.ratable
      printed: (helper)
      type: NonNegDollars
      label: Deductions apportioned to the groups by gross income (line 3c and the home mortgage interest of line 4a)
      expr:
        op: sum
        of:
          - f1116.line3c
          - f1116.hmi_total
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 4, (c)(2), "expenses, losses and other deductions shall be allocated and apportioned initially to each of the groups of passive income"; "All passive income received during the taxable year that is subject to a withholding tax of fifteen percent or greater shall be treated as one item of income."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.exp_hi_figured
      printed: (helper)
      type: NonNegDollars
      label: Deductions apportioned to the 15 percent or greater group (line 3c and home mortgage interest times the group's income divided
        by line 3e, rounded to four decimal places)
      expr:
        op: prorate
        amount: f1116.ratable
        part: f1116.gross_hi
        whole: f1116.line3e
        places: 4
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 4, (c)(2), "expenses, losses and other deductions shall be allocated and apportioned initially to each of the groups of passive income"; "All passive income received during the taxable year that is subject to a withholding tax of fifteen percent or greater shall be treated as one item of income."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.exp_hi
      printed: (helper)
      type: NonNegDollars
      label: Deductions apportioned to the 15 percent or greater group (zero when line 3e is zero)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1116.has_gross
                - const: true
            then: f1116.exp_hi_figured
          - guard:
              op: test
              eq:
                - f1116.has_gross
                - const: false
            then: f1116.zero
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 4, (c)(2), "expenses, losses and other deductions shall be allocated and apportioned initially to each of the groups of passive income"; "All passive income received during the taxable year that is subject to a withholding tax of fifteen percent or greater shall be treated as one item of income."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.net_hi
      printed: (helper)
      type: NonNegDollars
      label: Income of the 15 percent or greater group after its deductions (zero if a loss)
      expr:
        op: subtract_floor0
        from: f1116.gross_hi
        take: f1116.exp_hi
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 3, (c) High-taxed income, "Income is considered to be high-taxed income if, after allocating expenses, losses, and"; "exceeds the highest rate of tax specified in section 1"'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.limit_hi
      printed: (helper)
      type: NonNegDollars
      label: The highest rate of section 1 (37 percent) times the 15 percent or greater group's income after deductions
      expr:
        op: multiply_rate
        amount: f1116.net_hi
        rate:
          param: f1116.high_tax_rate
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 3, (c) High-taxed income, "Income is considered to be high-taxed income if, after allocating expenses, losses, and"; "exceeds the highest rate of tax specified in section 1"'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.exp_lo_figured
      printed: (helper)
      type: NonNegDollars
      label: Deductions apportioned to the less than 15 percent group (line 3c and home mortgage interest times the group's income divided
        by line 3e, rounded to four decimal places)
      expr:
        op: prorate
        amount: f1116.ratable
        part: f1116.gross_lo
        whole: f1116.line3e
        places: 4
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 4, (c)(2), "expenses, losses and other deductions shall be allocated and apportioned initially to each of the groups of passive income"; "All passive income received during the taxable year that is subject to a withholding tax of fifteen percent or greater shall be treated as one item of income."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.exp_lo
      printed: (helper)
      type: NonNegDollars
      label: Deductions apportioned to the less than 15 percent group (zero when line 3e is zero)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1116.has_gross
                - const: true
            then: f1116.exp_lo_figured
          - guard:
              op: test
              eq:
                - f1116.has_gross
                - const: false
            then: f1116.zero
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 4, (c)(2), "expenses, losses and other deductions shall be allocated and apportioned initially to each of the groups of passive income"; "All passive income received during the taxable year that is subject to a withholding tax of fifteen percent or greater shall be treated as one item of income."'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.net_lo
      printed: (helper)
      type: NonNegDollars
      label: Income of the less than 15 percent group after its deductions (zero if a loss)
      expr:
        op: subtract_floor0
        from: f1116.gross_lo
        take: f1116.exp_lo
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 3, (c) High-taxed income, "Income is considered to be high-taxed income if, after allocating expenses, losses, and"; "exceeds the highest rate of tax specified in section 1"'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.limit_lo
      printed: (helper)
      type: NonNegDollars
      label: The highest rate of section 1 (37 percent) times the less than 15 percent group's income after deductions
      expr:
        op: multiply_rate
        amount: f1116.net_lo
        rate:
          param: f1116.high_tax_rate
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 3, (c) High-taxed income, "Income is considered to be high-taxed income if, after allocating expenses, losses, and"; "exceeds the highest rate of tax specified in section 1"'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.high_taxed
      printed: (gate)
      type: Bool
      label: The foreign tax of a withholding group (15 percent or greater, or less than 15 percent) is more than 37
        percent of the group's income after deductions, so that income is high-taxed income reclassified on line 13
      expr:
        op: test
        any:
          - op: test
            gt:
              - f1116.tax_hi
              - f1116.limit_hi
          - op: test
            gt:
              - f1116.tax_lo
              - f1116.limit_lo
      cite:
        doc: cfr-26-1-904-4
        locator: 'p. 3, (c) High-taxed income, "Income is considered to be high-taxed income if, after allocating expenses, losses, and"; "exceeds the highest rate of tax specified in section 1"'
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116.line9
      printed: '9'
      type: NonNegDollars
      label: Enter the amount from line 8. These are your total foreign taxes paid or accrued for the category of income
        checked above Part I
      expr:
        op: copy
        from: f1116.line8
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 9, "Enter the amount from line 8. These are your total foreign taxes paid or"'
    - id: f1116.line10
      printed: '10'
      type: NonNegDollars
      label: Carryover of foreign taxes (Schedule B (Form 1116), line 3, column (xiv)) when a carryover is claimed; zero
        otherwise (no carryback into 2025 is figured)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.carryover_if_asked
                - const: true
            then: f1116sb.l3_xiv
          - guard:
              op: test
              eq:
                - ftc.carryover_if_asked
                - const: false
            then: f1116.zero
      cite:
        doc: i1116
        locator: 'p. 19, Line 10, "The amount of foreign taxes carried forward to the current tax year is the amount in column (xiv) of Schedule B (Form 1116), line 3."'
    - id: f1116.line11
      printed: '11'
      type: NonNegDollars
      label: Add lines 9 and 10
      expr:
        op: sum
        of:
          - f1116.line9
          - f1116.line10
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 11, "Add lines 9 and 10"'
    - id: f1116.line12
      printed: '12'
      type: NonNegDollars
      label: Reduction in foreign taxes (zero on the returns prepared; a reduction is refused)
      expr:
        op: copy
        from: f1116.zero
      cite:
        doc: i1116
        locator: 'p. 19, Line 12, "You may have to reduce the foreign taxes you paid or accrued by the following items."'
    - id: f1116.line13
      printed: '13'
      type: NonNegDollars
      label: Taxes reclassified under high tax kickout (zero on the returns prepared; possible high-taxed income is
        refused)
      expr:
        op: copy
        from: f1116.zero
      cite:
        doc: i1116
        locator: 'p. 20, Line 13, "You must adjust the foreign taxes paid or accrued if they relate to passive income that is treated as other category income because it is high taxed."'
    - id: f1116.line14_less12
      printed: (helper)
      type: Dollars
      label: Line 11 less line 12
      expr:
        op: subtract
        from: f1116.line11
        take: f1116.line12
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 14, "Combine lines 11, 12, and 13. This is the total amount of foreign taxes available for credit"'
    - id: f1116.line14
      printed: '14'
      type: Dollars
      label: Combine lines 11, 12, and 13. This is the total amount of foreign taxes available for credit
      expr:
        op: sum
        of:
          - f1116.line14_less12
          - f1116.line13
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 14, "Combine lines 11, 12, and 13. This is the total amount of foreign taxes available for credit"'
    - id: f1116.line15
      printed: '15'
      type: Dollars
      label: Enter the amount from line 7. This is your taxable income or (loss) from sources outside the United States
        (before adjustments)
      expr:
        op: copy
        from: f1116.line7_total
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 15, "Enter the amount from line 7. This is your taxable income or (loss) from"; i1116 p. 20, Line 15, "The amount on line 15 is your taxable income (or loss), before adjustments, from sources outside the United States"'
    - id: f1116.line16
      printed: '16'
      type: NonNegDollars
      label: Adjustments to line 15 (zero on the returns prepared; a U.S. loss or a loss account is refused)
      expr:
        op: copy
        from: f1116.zero
      cite:
        doc: i1116
        locator: 'p. 20, Line 16, "You are required to increase or decrease the amount on line 15 by the following adjustments."'
    - id: f1116.line17
      printed: '17'
      type: Dollars
      label: Combine the amounts on lines 15 and 16. This is your net foreign source taxable income
      expr:
        op: sum
        of:
          - f1116.line15
          - f1116.line16
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 17, "Combine the amounts on lines 15 and 16. This is your net foreign source"'
    - id: f1116.line18_shown
      printed: (helper)
      type: Bool
      label: Line 17 is more than zero, so line 18 is completed (otherwise line 18 is skipped and line 19 is zero)
      expr:
        op: test
        gt:
          - f1116.line17
          - const: 0
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 17, "(If the result is zero or less, skip line 18 and enter -0- on line 19.)"'
    - id: f1116.line18_less14
      printed: (helper)
      type: Dollars
      label: Form 1040 line 11b minus line 14
      expr:
        op: subtract
        from: f1040.line11b
        take: f1040.line14
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 18, "Individuals: Enter the sum of (i) Form 1040, 1040-SR, or 1040-NR, line 11b,"'
    - id: f1116.line18_raw
      printed: (helper)
      type: Dollars
      label: The sum of (i) Form 1040 line 11b minus line 14 and (ii) Schedule 1-A line 37
      expr:
        op: sum
        of:
          - f1116.line18_less14
          - s1a.senior_deduction
      cite:
        doc: i1116
        locator: 'p. 23, Line 18, "Individuals: Enter on line 18 the sum of (i) Form 1040, 1040-SR, or 1040-NR, line 11b, minus Form 1040, 1040-SR, or 1040-NR, line 14; and (ii) Schedule 1-A (Form 1040), line 37."'
    - id: f1116.line18
      printed: '18'
      shown_when: f1116.line18_shown
      type: NonNegDollars
      label: Individuals, the sum of (i) Form 1040 line 11b minus line 14 and (ii) Schedule 1-A line 37; zero if zero or
        less
      expr:
        op: subtract_floor0
        from: f1116.line18_raw
        take: f1116.zero
      cite:
        doc: i1116
        locator: 'p. 23, Line 18, "If the result is zero or less, enter -0- on line 18 and on line 19."'
    - id: f1116.us_loss
      printed: (gate)
      type: Bool
      label: Line 15 is more than line 18, a net loss from U.S. sources to allocate on line 16
      expr:
        op: test
        gt:
          - f1116.line15
          - f1116.line18
      cite:
        doc: i1116
        locator: 'p. 21, "If you have a net loss from U.S. sources, proportionately allocate that loss among the separate categories of your foreign income."'
    - id: f1116.has_line18
      printed: (gate)
      type: Bool
      label: Line 18 is more than zero (line 19 is figured)
      expr:
        op: test
        gt:
          - f1116.line18
          - const: 0
      cite:
        doc: i1116
        locator: 'p. 25, Line 19, "Divide line 17 by line 18."'
    - id: f1116.line20
      printed: '20'
      type: Dollars
      label: Individuals, the total of Form 1040 line 16 and Schedule 2 line 1z
      expr:
        op: copy
        from: ftc.regular_tax
      cite:
        doc: i1116
        locator: 'p. 25, Line 20, "Enter the total of Form 1040, 1040-SR, or 1040-NR, line 16, and Schedule 2 (Form 1040), Part I, line 1z"'
    - id: f1116.line21_figured
      printed: (helper)
      type: Dollars
      label: Divide line 17 by line 18, rounded to four decimal places, not more than 1 and not less than 0 (line 19);
        multiply line 20 by the result
      expr:
        op: prorate
        amount: f1116.line20
        part: f1116.line17
        whole: f1116.line18
        places: 4
      cite:
        doc: i1116
        locator: 'p. 25, Line 19, "Divide line 17 by line 18." and "If line 18 is greater than zero and line 17 is more than line 18, enter"; f1116 p. 2, line 17, "(If the result is zero or less, skip line 18 and enter -0- on line 19.)"'
      ambiguity: amb.2025.f1116_ratio_places
    - id: f1116.line21
      printed: '21'
      type: Dollars
      label: Multiply line 20 by line 19 (maximum amount of credit)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1116.has_line18
                - const: true
            then: f1116.line21_figured
          - guard:
              op: test
              eq:
                - f1116.has_line18
                - const: false
            then: f1116.zero
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 21, "Multiply line 20 by line 19 (maximum amount of credit)"'
    - id: f1116.line22
      printed: '22'
      type: NonNegDollars
      label: Increase in limitation (section 960(c)) (zero on the returns prepared; refused on Schedule 3)
      expr:
        op: copy
        from: f1116.zero
      cite:
        doc: i1116
        locator: 'p. 25, Line 22, "Report on line 22 any such increase in limitation."'
    - id: f1116.line23
      printed: '23'
      type: Dollars
      label: Add lines 21 and 22
      expr:
        op: sum
        of:
          - f1116.line21
          - f1116.line22
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 23, "Add lines 21 and 22"'
    - id: f1116.line24
      printed: '24'
      type: Dollars
      label: Enter the smaller of line 14 or line 23
      expr:
        op: smaller_of
        of:
          - f1116.line14
          - f1116.line23
      cite:
        doc: f1116
        locator: 'p. 2, Part III, line 24, "Enter the smaller of line 14 or line 23. Enter here and on the appropriate line of Part IV."; i1116 p. 25, Line 24, "The maximum foreign tax credit you can claim in the current year is generally limited to the allocated amount of U.S. tax imposed on the foreign income"'
    - id: f1116.line27
      printed: '27'
      type: Dollars
      label: Credit for taxes on passive category income
      expr:
        op: copy
        from: f1116.line24
      cite:
        doc: f1116
        locator: 'p. 2, Part IV, line 27, "Credit for taxes on passive category income"'
    - id: f1116.line32
      printed: '32'
      type: Dollars
      label: Add lines 25 through 31 (only line 27 is used on the returns prepared)
      expr:
        op: copy
        from: f1116.line27
      cite:
        doc: f1116
        locator: 'p. 2, Part IV, line 32, "Add lines 25 through 31"'
    - id: f1116.line33
      printed: '33'
      type: Dollars
      label: Enter the smaller of line 20 or line 32
      expr:
        op: smaller_of
        of:
          - f1116.line20
          - f1116.line32
      cite:
        doc: f1116
        locator: 'p. 2, Part IV, line 33, "Enter the smaller of line 20 or line 32"; i1116 p. 25, Line 33, "Enter the smaller of line 20 or line 32"'
    - id: f1116.line34
      printed: '34'
      type: NonNegDollars
      label: Reduction of credit for international boycott operations (zero on the returns prepared; refused with line
        12)
      expr:
        op: copy
        from: f1116.zero
      cite:
        doc: f1116
        locator: 'p. 2, Part IV, line 34, "Reduction of credit for international boycott operations. See instructions for line 12"'
    - id: f1116.line35
      printed: '35'
      type: Dollars
      label: Subtract line 34 from line 33. This is your foreign tax credit
      expr:
        op: subtract
        from: f1116.line33
        take: f1116.line34
      cite:
        doc: f1116
        locator: 'p. 2, Part IV, line 35, "Subtract line 34 from line 33. This is your foreign tax credit."'
      refuses:
        - when: f1116.other_category
          form: Form 1116 (another category of income)
          remedy: Foreign income that is not passive (such as pay for work abroad or a business abroad) needs its own Form
            1116 for its category and the Part IV summary, which this tool does not prepare.
          cite:
            doc: i1116
            locator: 'p. 11, Lines 1a and 1b, "If you received dividends (passive category income) and wages (general category income) from foreign sources, you must complete two Forms 1116."'
        - when: f1116.not_on_statement
          form: Form 1116, Part II (foreign currency)
          remedy: Foreign tax paid directly to another country, or not reported on a statement in U.S. dollars, is entered in
            the foreign currency and converted, which this tool does not prepare.
          cite:
            doc: i1116
            locator: 'p. 18, Part II, "Generally, you must enter in Part II the amount of foreign taxes, in both the foreign currency denomination(s) and as converted into U.S. dollars, that relate to the category of income checked above Part I."'
        - when: f1116.not_creditable
          form: Form 1116
          remedy: Foreign tax that is not all creditable after the required reductions must be sorted out before Form 1116 is
            prepared; this tool does not determine it.
          cite:
            doc: i1116
            locator: 'p. 18, Part II, "See General Instructions, earlier, for descriptions of foreign taxes that are eligible for the foreign tax credit and for foreign taxes that aren’t eligible for the foreign tax credit."'
        - when: f1116.business
          form: Form 1116, line 3e (gross receipts)
          remedy: With a Schedule C business, gross income from all sources counts the business's gross receipts; this tool
            does not yet carry them to Form 1116.
          cite:
            doc: i1116
            locator: 'p. 17, Lines 3d and 3e, "gross income means the total of your gross receipts (reduced by cost of goods sold), total capital and ordinary gains (before subtracting any losses), and all other income (before subtracting any deductions)"'
        - when: f1116.rental
          form: Form 1116, line 3e (gross rents and royalties)
          remedy: With a Schedule E rental or royalty, gross income from all sources counts the gross rents and royalties
            (and the asset method counts interest of a passive activity); this tool does not yet carry them to Form 1116.
          cite:
            doc: i1116
            locator: 'p. 17, Lines 3d and 3e, "gross income means the total of your gross receipts (reduced by cost of goods sold), total capital and ordinary gains (before subtracting any losses), and all other income (before subtracting any deductions)"'
        - when: f1116.foreign_gain
          form: Form 1116, Worksheets A and B
          remedy: A foreign-source capital gain or loss must be adjusted on the worksheets in the Form 1116 instructions, which
            this tool does not prepare.
          cite:
            doc: i1116
            locator: 'p. 9, Foreign Qualified Dividends and Capital Gains (Losses), "If you have foreign source qualified dividends or foreign source capital gains (including any foreign source capital gain distributions) or losses, you may be required to make certain adjustments to those amounts before taking them into account on line 1a (gross income) or line 5 (losses)."'
        - when: f1116.redetermination
          form: Schedule C (Form 1116)
          remedy: A change in foreign tax of an earlier year is reported on Schedule C (Form 1116), which this tool does not
            prepare.
          cite:
            doc: i1116
            locator: 'p. 2, "Use Schedule C (Form 1116) to report foreign tax redeterminations that occurred in the current tax year and that relate to prior tax years."'
        - when: f1116.reduction
          form: Form 1116, line 12
          remedy: A reduction of foreign taxes on line 12 is not figured by this tool.
          cite:
            doc: i1116
            locator: 'p. 19, Line 12, "You may have to reduce the foreign taxes you paid or accrued by the following items."'
        - when: f1116.loss_accounts
          form: Form 1116, line 16
          remedy: Recapturing a foreign or domestic loss account on line 16 is not figured by this tool.
          cite:
            doc: i1116
            locator: 'p. 20, Line 16, "You are required to increase or decrease the amount on line 15 by the following adjustments."'
        - when: f1116sb.changed_if_carry
          form: Schedule B (Form 1116), line 2
          remedy: A change to the foreign tax carried from 2024 since that return was filed is an adjustment on line 2 of
            Schedule B (Form 1116), which this tool does not figure.
          cite:
            doc: i1116sb
            locator: 'p. 1, Line 2. Adjustments to line 1, "Report on lines 2a, 2b, 2c, 2d, etc., any adjustments resulting from events that occurred between the filing of your prior year tax return and the filing of your current year tax return."'
        - when: f1116sb.split_if_carry
          form: Schedule B (Form 1116) (allocation between spouses)
          remedy: Foreign tax carried from a joint return into a return that is not joint with the same spouse is divided
            between the spouses, which this tool does not figure.
          cite:
            doc: p514
            locator: 'p. 39, Allocations Between Spouses, "You may have to allocate an unused foreign tax or excess limit for a tax year in which you and your spouse filed a joint return."'
        - when: f1116.tax_mismatch
          form: Form 1116, Part II
          remedy: The foreign tax entered for each source must add up to the foreign tax entered for the year; correct one
            or the other.
          cite:
            doc: f1116
            locator: 'p. 1, Part II, line 8, "Add lines A through C, column (u). Enter the total here and on line 9, page 2"'
        - when: f1116.income_over
          form: Form 1116, line 1a
          remedy: Foreign dividends or interest cannot be more than the dividends or interest reported in all; correct the
            amounts entered.
          cite:
            doc: i1116
            locator: 'p. 11, Lines 1a and 1b, "Include income in the category checked above Part I that is taxable by the United States and is from sources within the country entered on line i"'
        - when: f1116.itemized_unread
          form: Form 1116, line 2 (state and local income tax)
          remedy: The part of state or local income tax related to foreign income depends on the income the state taxes,
            which this tool does not ask.
          cite:
            doc: p514
            locator: 'p. 27, State income taxes, "If the total income taxed by the state is greater than the amount of U.S. source income for federal tax purposes, then the state tax is allocable to both U.S. source and foreign source income."'
        - when: f1116.asset_method
          form: Form 1116, line 4b (asset method)
          remedy: With gross foreign income over $5,000, investment, student loan or car loan interest is apportioned by the
            value of your assets, which this tool does not figure.
          cite:
            doc: i1116
            locator: 'p. 18, Line 4b, "Otherwise, each type of interest expense is apportioned separately using an"'
        - when: f1116.adjust
          form: Form 1116, Worksheet for Line 18
          remedy: Your qualified dividends must be adjusted on line 1a and the Worksheet for Line 18, which this tool does not
            prepare.
          cite:
            doc: i1116
            locator: 'p. 23, Line 18, "If you have qualified dividends or capital gains, you may be required to make adjustments to those qualified dividends and gains before you take those amounts into account on line 18 as described next."'
        - when: f1116.high_taxed
          form: Form 1116, line 13 (high-taxed income)
          remedy: Passive income whose foreign tax is more than 37 percent of it after deductions is high-taxed income,
            moved to the general category on line 13 and a second Form 1116, which this tool does not prepare.
          cite:
            doc: cfr-26-1-904-4
            locator: 'p. 3, (c) High-taxed income, "If, after application of this paragraph (c), income that would otherwise be passive income is determined to be high-taxed income, the income is treated as general category income"'
        - when: f1116.us_loss
          form: Form 1116, line 16 (U.S. loss)
          remedy: A net loss from U.S. sources is allocated on line 16, which this tool does not figure.
          cite:
            doc: i1116
            locator: 'p. 21, "If you have a net loss from U.S. sources, proportionately allocate that loss among the separate categories of your foreign income."'
        - when: f1116sb.carryback
          form: Schedule B (Form 1116), line 7 (carryback to 2024)
          remedy: Foreign tax above this year's limit is carried back first to 2024 when that year had room under its limit,
            on an amended 2024 return, which this tool does not prepare.
          cite:
            doc: p514
            locator: 'p. 37, Carryback and Carryover, "You are considered to have paid this unused foreign tax first in 2024 (the first preceding tax year) up to the excess limit in that year"'
