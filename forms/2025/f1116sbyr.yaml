form:
  id: f1116sbyr
  kind: form
  title: Schedule B (Form 1116) — one earlier year's foreign tax carried into 2025
  tax_year: 2025
  collection:
    cite:
      doc: i1116sb
      locator: p. 1, Line 1. Foreign tax carryover from the prior tax year, "Enter on line 1 the amounts from the appropriate
        columns of line 8 of the prior year Schedule B."
  note: One entry per earlier year whose unused passive category foreign tax is carried into 2025, as line 8 of the 2024 Schedule
    B (Form 1116) shows it (on a joint return, both spouses' amounts for the year together).
  lines:
  - id: f1116sbyr.year
    printed: (helper)
    type: Enum(ftc_carry_year)
    label: The earlier tax year the unused foreign tax comes from (the 10th to the 1st preceding tax year)
    expr:
      op: input
      source: 'The tax year this unused foreign tax comes from: one of the ten years before 2025, by its column on the 2024
        Schedule B (Form 1116)'
    cite:
      doc: i1116sb
      locator: p. 1, Line 1. Foreign tax carryover from the prior tax year, "For example, enter on line 1, column (i) of the
        current year Schedule B the amount from line 8, column (ii) of the prior year Schedule B."
  - id: f1116sbyr.amount
    printed: (helper)
    type: NonNegDollars
    label: Foreign tax from that year carried into 2025 (line 8 of the 2024 Schedule B (Form 1116), passive category, in that
      year's column)
    expr:
      op: input
      source: 'The foreign tax from that year carried into 2025: line 8 of the 2024 Schedule B (Form 1116) for passive category
        income, in that year''s column (on a joint return, both spouses'' amounts together)'
    cite:
      doc: i1116sb
      locator: p. 1, Line 1. Foreign tax carryover from the prior tax year, "Enter on line 1 the amounts from the appropriate
        columns of line 8 of the prior year Schedule B."
