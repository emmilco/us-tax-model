form:
  id: retirement
  kind: form
  title: Form 1099-R distributions (IRAs, pensions and annuities)
  tax_year: 2025
  note: One entry per Form 1099-R. IRA distributions go to Form 1040 lines 4a and 4b, pensions and annuities to
    lines 5a and 5b. The Simplified Method Worksheet is figured for each annuity with after-tax cost.
  lines:
  - id: retirement.account
    printed: (helper)
    label: Kind of account the distribution came from
    type: Enum(retirement_account)
    expr:
      op: input
      source: 'Kind of account: traditional_ira (the IRA/SEP/SIMPLE box on Form 1099-R is checked; includes SEP
        and traditional SIMPLE IRAs), roth_ira (a Roth IRA or Roth SIMPLE IRA), or plan (a pension, annuity, 401(k),
        403(b) or governmental 457(b) plan)'
    cite:
      doc: f1099r
      locator: Instructions for Recipient, IRA/SEP/SIMPLE box; i1040gi pp. 26 and 28, lines 4a-4b and 5a-5b
  - id: retirement.code
    printed: (helper)
    label: Distribution code in box 7
    type: Enum(retirement_code)
    expr:
      op: input
      source: 'Distribution code in box 7: normal_7, death_4, early_exception_2, early_1 (code 1, early distribution, no known exception), simple_S (code S, SIMPLE IRA in its first 2 years), disability_3 (code 3, disability), direct_rollover_G, qualified_roth_Q,
        or other (any other code, or two codes)'
    cite:
      doc: f1099r
      locator: Instructions for Recipient, Box 7
  - id: retirement.box1
    printed: (helper)
    label: Gross distribution, box 1
    type: NonNegDollars
    expr:
      op: input
      source: Gross distribution, Form 1099-R box 1
    cite:
      doc: f1099r
      locator: Instructions for Recipient, Box 1
  - id: retirement.box5
    printed: (helper)
    label: Employee contributions recovered tax free, box 5
    type: NonNegDollars
    expr:
      op: input
      source: Employee contributions, designated Roth contributions or insurance premiums, Form 1099-R box 5 (a
        pension or annuity; zero for an IRA)
    cite:
      doc: f1099r
      locator: Instructions for Recipient, Box 5
  - id: retirement.rollover
    printed: (helper)
    gated_by: retirement.rollover_if_any
    label: Amount you rolled over to a qualified plan or IRA (not a Roth account) within 60 days, or later under a waiver
      or frozen-deposit extension, or recontributed to an IRA within 120 days after a first-home purchase was canceled or delayed
    type: NonNegDollars
    expr:
      op: input
      source: |-
        Amount of this distribution you rolled over within 60 days to a qualified plan or an IRA other than a Roth IRA (for a direct rollover, code G, the whole distribution is treated as rolled over).

        Also count:
        - an amount rolled over after the 60 days if the 60-day requirement was waived (you qualify for an automatic waiver, you self-certify that you meet the requirements of a waiver, or you received a private letter ruling granting a waiver) or the period was extended because the amount was a frozen deposit
        - an IRA distribution to buy, build or rebuild a first home that you contributed back to a traditional IRA within 120 days of the distribution because the purchase or construction was canceled or delayed

        Do not count any part of a required minimum distribution, which is not eligible for rollover, nor any of these from a pension, annuity, 401(k), 403(b) or 457(b) plan:

        - any part of a series of substantially equal payments over your life or life expectancy (or yours and your beneficiary's) or over 10 years or more
        - a hardship distribution
        - dividends on employer securities
        - the cost of life insurance coverage

        If you received this distribution as a beneficiary other than the surviving spouse, count only an amount paid by direct trustee-to-trustee transfer to an inherited IRA.

        For code S (a SIMPLE IRA in its first 2 years), count only an amount rolled over to another SIMPLE IRA.

        Do not count an amount rolled over into a SIMPLE IRA during the first 2 years of your participation in that SIMPLE IRA unless it came from another SIMPLE IRA.
    cite:
      doc: i1040gi
      locator: p. 27, Exception 1 (IRA rollovers); p. 30, Rollovers; p575 p. 21, Eligible rollover distribution, "An
        eligible rollover distribution is any distribution of all or any part of the balance to your credit in a qualified
        retirement plan except the following." and "A required minimum distribution (RMD)"; p590b p. 6, Distributions
        not eligible for rollover, "Amounts that must be distributed (required minimum distributions) during a particular
        year aren't eligible for rollover treatment."; p575 p. 21, Eligible rollover distribution, "Any of a series of substantially equal
        distributions paid at least once a year over", "Hardship distributions.", "Dividends paid on employer securities.",
        "The cost of life insurance coverage." and "a distribution to the plan participant’s beneficiary isn’t generally
        treated as an eligible rollover distribution"; p575 p. 24, Rollovers by nonspouse beneficiary, "The distribution must
        be a direct trustee-to-trustee transfer to your traditional or Roth IRA that was set up to receive the distribution.";
        p590b p. 5, Inherited from someone other than spouse, "you can't roll over any amounts into or out of the inherited
        IRA"; p560 p. 18, Distributions (Withdrawals), "a rollover from a SIMPLE IRA to a non-SIMPLE IRA can be made tax free only after a 2-year
        participation in the SIMPLE IRA plan"; p575 p. 21, Rollovers to SIMPLE retirement accounts, "During the first 2 years
        of participation in a SIMPLE retirement account, you may roll over amounts from one SIMPLE retirement account into
        another SIMPLE retirement account"; p575 p. 23, Ways to get a waiver of the 60-day rollover
        requirement, "There are three ways to obtain a waiver of the 60-day requirement." and Frozen deposits, "The 60-day
        rollover period is extended by the period for which the amount is a frozen deposit"; p590b p. 28, "the purchase or
        construction was canceled or delayed, you could generally contribute the amount of the distribution to an IRA within
        120 days of the distribution and not pay income tax or the 10% additional tax on early distributions. This
        contribution is treated as a rollover contribution to the IRA."
  - id: retirement.no
    printed: (helper)
    label: Year parameter s3.no (false)
    type: Bool
    expr:
      op: param
      ref: s3.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.rollover_any
    printed: (helper)
    label: 'Did any of this money go into a retirement account again (a rollover or a conversion), even if it was paid to you first?'
    type: Bool
    expr:
      op: input
      source: 'Did any of this money go into a retirement account again (a rollover or a conversion), even if it was paid to you first?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.rolled_some
    printed: (helper)
    label: 'The filer put some of this money into a retirement account (asked unless the form is a direct rollover, code G)'
    type: Bool
    expr:
      op: test
      eq:
      - retirement.rollover_any
      - const: true
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.put_back
    printed: (helper)
    label: Some of the money went into another retirement account (a direct rollover, code G, or the filer says so)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.direct
          - const: true
        then: retirement.direct
      - guard:
          op: test
          eq:
          - retirement.direct
          - const: false
        then: retirement.rolled_some
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.rollover_if_any
    printed: (gate)
    label: Amount rolled over, asked only when some of the money went into another retirement account (none otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.rollover_any
          - const: true
        then: retirement.rollover
      - guard:
          op: test
          eq:
          - retirement.rollover_any
          - const: false
        then: retirement.zero
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.is_trad
    printed: (helper)
    label: 'A traditional, SEP or SIMPLE IRA'
    type: Bool
    expr:
      op: test
      eq:
      - retirement.account
      - const: traditional_ira
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.is_death
    printed: (helper)
    label: 'Code 4 (death)'
    type: Bool
    expr:
      op: test
      eq:
      - retirement.code
      - const: death_4
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.plan_death
    printed: (helper)
    label: 'A payment from a plan to a beneficiary (code 4, not an IRA)'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - retirement.is_ira
        - const: false
      - op: test
        eq:
        - retirement.is_death
        - const: true
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.roth_moved
    printed: (helper)
    label: 'Did any of this money go into a Roth IRA or another Roth account?'
    type: Bool
    gated_by: retirement.roth_moved_if_put_back
    expr:
      op: input
      source: 'Did any of this money go into a Roth IRA or another Roth account?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.roth_moved_if_put_back
    printed: (gate)
    label: 'Did any of this money go into a Roth IRA or another Roth account? Asked only with some of the money went into another retirement account (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.put_back
          - const: true
        then: retirement.roth_moved
      - guard:
          op: test
          eq:
          - retirement.put_back
          - const: false
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.rollover_property
    printed: (helper)
    label: 'Did the plan or IRA pay out anything other than cash (such as shares) that you then sold, kept, or put only partly into the new account?'
    type: Bool
    gated_by: retirement.rollover_property_if_put_back
    expr:
      op: input
      source: 'Did the plan or IRA pay out anything other than cash (such as shares) that you then sold, kept, or put only partly into the new account?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.rollover_property_if_put_back
    printed: (gate)
    label: 'Did the plan or IRA pay out anything other than cash (such as shares) that you then sold, kept, or put only partly into the new account? Asked only with some of the money went into another retirement account (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.put_back
          - const: true
        then: retirement.rollover_property
      - guard:
          op: test
          eq:
          - retirement.put_back
          - const: false
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.rollover_qdro
    printed: (helper)
    label: 'Did you get this money under a court order in a divorce or separation (a qualified domestic relations order)?'
    type: Bool
    gated_by: retirement.rollover_qdro_if_put_back
    expr:
      op: input
      source: 'Did you get this money under a court order in a divorce or separation (a qualified domestic relations order)?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.rollover_qdro_if_put_back
    printed: (gate)
    label: 'Did you get this money under a court order in a divorce or separation (a qualified domestic relations order)? Asked only with some of the money went into another retirement account (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.put_back
          - const: true
        then: retirement.rollover_qdro
      - guard:
          op: test
          eq:
          - retirement.put_back
          - const: false
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.levy_returned
    printed: (helper)
    label: 'Was this money taken by the IRS under a levy and later returned to you?'
    type: Bool
    gated_by: retirement.levy_returned_if_put_back
    expr:
      op: input
      source: 'Was this money taken by the IRS under a levy and later returned to you?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.levy_returned_if_put_back
    printed: (gate)
    label: 'Was this money taken by the IRS under a levy and later returned to you? Asked only with some of the money went into another retirement account (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.put_back
          - const: true
        then: retirement.levy_returned
      - guard:
          op: test
          eq:
          - retirement.put_back
          - const: false
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.charity_hsa
    printed: (helper)
    label: 'Did any of this money go straight from the IRA to a charity, or into a health savings account?'
    type: Bool
    gated_by: retirement.charity_hsa_if_ira
    expr:
      op: input
      source: 'Did any of this money go straight from the IRA to a charity, or into a health savings account?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.charity_hsa_if_ira
    printed: (gate)
    label: 'Did any of this money go straight from the IRA to a charity, or into a health savings account? Asked only with an IRA (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: true
        then: retirement.charity_hsa
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: false
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.ira_returned
    printed: (helper)
    label: 'Was any of this a contribution of yours that the IRA paid back to you, for example because you had put in more than the yearly limit?'
    type: Bool
    gated_by: retirement.ira_returned_if_ira
    expr:
      op: input
      source: 'Was any of this a contribution of yours that the IRA paid back to you, for example because you had put in more than the yearly limit?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.ira_returned_if_ira
    printed: (gate)
    label: 'Was any of this a contribution of yours that the IRA paid back to you, for example because you had put in more than the yearly limit? Asked only with an IRA (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: true
        then: retirement.ira_returned
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: false
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.ira_basis
    printed: (helper)
    label: 'A traditional IRA of the owner holds basis: nondeductible contributions, after-tax money rolled over from a
      work plan, or basis that came with an IRA in a divorce transfer or from a decedent'
    type: Bool
    gated_by: retirement.ira_basis_if_trad
    expr:
      op: input
      source: 'Does any traditional IRA of yours hold money you already paid tax on, such as contributions you did not
        deduct, after-tax money rolled over from a work plan, or basis that came with an IRA from a spouse in a divorce or
        from someone who died?'
    cite:
      doc: i8606
      locator: 'p. 2, Who Must File, "You received distributions from a traditional IRA in 2025 and your basis in these IRAs
        is more than zero", "You or your spouse transferred all or part of their traditional IRA in 2025 to the other spouse
        under a divorce or separation agreement where the transfer resulted in a change in the basis", and "You received
        a distribution from an inherited traditional IRA that has a basis"; p. 9, Line 2, "You rolled over any nontaxable
        portion of your qualified retirement plan to a traditional IRA"'
  - id: retirement.ira_basis_if_trad
    printed: (gate)
    label: 'A traditional IRA of the owner holds basis (money already taxed), asked only with a traditional IRA (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_trad
          - const: true
        then: retirement.ira_basis
      - guard:
          op: test
          eq:
          - retirement.is_trad
          - const: false
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.box6
    printed: (helper)
    label: 'Is there an amount in box 6 of this form (net unrealized appreciation in employer''s securities)?'
    type: Bool
    gated_by: retirement.box6_if_plan
    expr:
      op: input
      source: 'Is there an amount in box 6 of this form (net unrealized appreciation in employer''s securities)?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.box6_if_plan
    printed: (gate)
    label: 'Is there an amount in box 6 of this form (net unrealized appreciation in employer''s securities)? Asked only with a pension, annuity or plan (not an IRA) (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: false
        then: retirement.box6
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: true
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.loan_offset
    printed: (helper)
    label: 'Was any of this amount an unpaid loan from the plan that was taken off your balance, not money paid out (a plan loan offset)?'
    type: Bool
    gated_by: retirement.loan_offset_if_plan
    expr:
      op: input
      source: 'Was any of this amount an unpaid loan from the plan that was taken off your balance, not money paid out (a plan loan offset)?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.loan_offset_if_plan
    printed: (gate)
    label: 'Was any of this amount an unpaid loan from the plan that was taken off your balance, not money paid out (a plan loan offset)? Asked only with a pension, annuity or plan (not an IRA) (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: false
        then: retirement.loan_offset
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: true
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.disability
    printed: (helper)
    label: 'Was any of this paid to you because you became disabled, under a plan that provides for disability retirement?'
    type: Bool
    gated_by: retirement.disability_if_plan
    expr:
      op: input
      source: 'Was any of this paid to you because you became disabled, under a plan that provides for disability retirement?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.disability_if_plan
    printed: (gate)
    label: 'Was any of this paid to you because you became disabled, under a plan that provides for disability retirement? Asked only with a pension, annuity or plan (not an IRA) (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: false
        then: retirement.disability
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: true
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.dis_early
    printed: (helper)
    label: 'When any of this was paid, were you younger than the earliest age at which the plan would have let you retire without the disability (its minimum retirement age)?'
    type: Bool
    gated_by: retirement.dis_early_if_disability
    expr:
      op: input
      source: 'When any of this was paid, were you younger than the earliest age at which the plan would have let you retire without the disability (its minimum retirement age)?'
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.dis_early_if_disability
    printed: (gate)
    label: 'When any of this was paid, were you younger than the earliest age at which the plan would have let you retire without the disability (its minimum retirement age)? Asked only with a disability pension (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.disability_if_plan
          - const: true
        then: retirement.dis_early
      - guard:
          op: test
          eq:
          - retirement.disability_if_plan
          - const: false
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.dis_all_early
    printed: (helper)
    label: 'Were you younger than that age when each payment of 2025 on this form was made?'
    type: Bool
    gated_by: retirement.dis_all_early_if_early
    expr:
      op: input
      source: 'Were you younger than that age when each payment of 2025 on this form was made?'
    cite:
      doc: i1040gi
      locator: 'p. 25, "Disability pensions shown on Form 1099-R if you haven’t reached the minimum retirement age set by your
        employer", "Disability pensions received after you reach minimum retirement age and other payments shown on Form 1099-R
        (other than payments from an IRA) are reported on lines 5a and 5b"'
  - id: retirement.dis_all_early_if_early
    printed: (gate)
    label: 'All of 2025''s payments made before the minimum retirement age. Asked only with a disability pension paid before
      that age (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
