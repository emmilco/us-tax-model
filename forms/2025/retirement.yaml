        - const: true
      - op: test
        eq:
        - retirement.ben_shared_if_death
        - const: true
      - op: test
        eq:
        - retirement.own_annuity_if_cost
        - const: true
      - op: test
        eq:
        - retirement.csrs_alt_if_cost
        - const: true
      - op: test
        eq:
        - retirement.started_before_simplified_method_date_if_cost
        - const: true
      - op: test
        eq:
        - retirement.general_rule_if_cost
        - const: true
      - op: test
        eq:
        - retirement.lump_at_start_if_cost
        - const: true
      - op: test
        eq:
        - retirement.disaster
        - const: true
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.annuity
    printed: (helper)
    gated_by: retirement.annuity_if_cost
    label: Is this a pension or annuity from a qualified plan, section 403(b) plan or tax-sheltered annuity, paid
      in periodic payments in which you have after-tax cost (box 9b or your records), with an annuity starting date
      after November 18, 1996, and on that date you were under age 75 or had fewer than 5 years of guaranteed payments?
      (This is when the Simplified Method applies. A nonperiodic payment received on or after the annuity starting date,
      one that is not one of the periodic payments, is generally fully taxable, so if box 1 is only such a payment, answer
      No; if box 1 also includes the periodic payments, answer for those payments.)
    type: Bool
    expr:
      op: input
      source: |-
        Is this a pension or annuity to which all of these apply?

        - from a qualified plan, section 403(b) plan or tax-sheltered annuity
        - paid in periodic payments in which you have after-tax cost (box 9b or your records)
        - with an annuity starting date after November 18, 1996
        - on that date you were under age 75 or had fewer than 5 years of guaranteed payments

        This is when the Simplified Method applies.

        If you are the survivor of a retiree, answer for the retiree's annuity, with its starting date and the retiree's age on that date.

        A nonperiodic payment received on or after the annuity starting date, one that is not one of the periodic payments, is generally fully taxable, so if box 1 is only such a payment, answer No; if box 1 also includes the periodic payments, answer for those payments.
    cite:
      doc: i1040gi
      locator: p. 30, Simplified Method, conditions 1 and 2; p. 28, Partially Taxable Pensions and Annuities; p575 p. 16,
        Distribution On or After Annuity Starting Date, "If you receive a nonperiodic payment from your annuity contract on or
        after the annuity starting date, you must generally include all of the payment in gross income.";
        p575 p. 34, Survivors of retirees, "If the retiree was reporting the annuity under the Simplified Method, the
        part of each payment that is tax free is the same as the tax-free amount figured by the retiree at the annuity starting
        date"
  - id: retirement.annuity_if_cost
    printed: (gate)
    label: 'The Simplified Method applies, asked only with after-tax cost in the plan (false without it)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.cost_any_if_plan
          - const: true
        then: retirement.annuity
      - guard:
          op: test
          eq:
          - retirement.cost_any_if_plan
          - const: false
        then: retirement.no
    cite:
      doc: i1040gi
      locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired Public
        Safety Officers, Simplified Method'
  - id: retirement.cost
    printed: (helper)
    label: Your cost in the plan at the annuity starting date (Simplified Method Worksheet, line 2)
    type: NonNegDollars
    expr:
      op: input
      source: Your cost (net investment, after-tax contributions) in the plan at the annuity starting date; it may
        be shown in Form 1099-R box 9b (if you are the survivor of a retiree, the retiree's cost at the retiree's annuity
        starting date)
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 2; p. 30, Cost;
        p575 p. 34, Survivors of retirees, "If the retiree was reporting the annuity under the Simplified Method, the
        part of each payment that is tax free is the same as the tax-free amount figured by the retiree at the annuity starting
        date"
  - id: retirement.used_last_year
    printed: (helper)
    label: Did you complete this worksheet for this annuity last year?
    type: Bool
    expr:
      op: input
      source: Did you complete the Simplified Method Worksheet for this annuity last year? (If you are the survivor
        of a retiree, answer Yes if you or the retiree completed it for this annuity last year.)
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, note under line 2;
        p575 p. 34, Survivors of retirees, "If the retiree was reporting the annuity under the Simplified Method, the
        part of each payment that is tax free is the same as the tax-free amount figured by the retiree at the annuity starting
        date"
  - id: retirement.last_line4
    printed: (helper)
    label: Line 4 of last year's Simplified Method Worksheet
    type: NonNegDollars
    expr:
      op: input
      source: The amount on line 4 of last year's Simplified Method Worksheet for this annuity (yours, or the retiree's
        if you are the survivor of a retiree)
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, note under line 2;
        p575 p. 34, Survivors of retirees, "If the retiree was reporting the annuity under the Simplified Method, the
        part of each payment that is tax free is the same as the tax-free amount figured by the retiree at the annuity starting
        date"
  - id: retirement.joint_life
    printed: (helper)
    label: Annuity starting date after 1997 and payments for your life and that of your beneficiary?
    type: Bool
    expr:
      op: input
      source: Was the annuity starting date after 1997, with payments for your life and that of your beneficiary
        (Table 2)? (If you are the survivor of a retiree, answer for the retiree's annuity, that is, whether its starting date
        was after 1997, with payments for the retiree's life and yours.)
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 3 and Table 2;
        p575 p. 34, Survivors of retirees, "If the retiree was reporting the annuity under the Simplified Method, the
        part of each payment that is tax free is the same as the tax-free amount figured by the retiree at the annuity starting
        date"
  - id: retirement.age
    printed: (helper)
    label: Age at the annuity starting date
    type: Count
    expr:
      op: input
      source: Your age at the annuity starting date (if you are the survivor of a retiree, the retiree's age on
        their annuity starting date)
    cite:
      doc: i1040gi
      locator: p. 29, Table 1; p. 30, Age (or Combined Ages) at Annuity Starting Date
  - id: retirement.combined_age
    printed: (helper)
    label: Combined ages at the annuity starting date
    type: Count
    expr:
      op: input
      source: Your combined ages (yours and your beneficiary's) at the annuity starting date (if you are the survivor
        of a retiree, the retiree's age and yours on the retiree's annuity starting date)
    cite:
      doc: i1040gi
      locator: p. 29, Table 2; p. 30, Age (or Combined Ages) at Annuity Starting Date;
        p575 p. 34, Survivors of retirees, "If the retiree was reporting the annuity under the Simplified Method, the
        part of each payment that is tax free is the same as the tax-free amount figured by the retiree at the annuity starting
        date"
  - id: retirement.months
    printed: (helper)
    label: Number of months for which this year's payments were made
    type: Count
    expr:
      op: input
      source: Number of months for which this year's payments were made (at most 12) — the months covered by the payments
        included in box 1 of this Form 1099-R, not the calendar months of 2025 since the payments began; for example, a
        pension paid monthly in arrears that began in July, with five payments in 2025 for July through November, is 5
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 5
  - id: retirement.recovered
    printed: (helper)
    label: Amount recovered tax free in years after 1986 (line 10 of last year's worksheet)
    type: NonNegDollars
    expr:
      op: input
      source: Amount, if any, recovered tax free in years after 1986 (if you completed this worksheet last year,
        line 10 of last year's worksheet; if you are the survivor of a retiree, include the amount the retiree recovered
        tax free)
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 6;
        p575 p. 34, Survivors of retirees, "If the retiree was reporting the annuity under the Simplified Method, the
        part of each payment that is tax free is the same as the tax-free amount figured by the retiree at the annuity starting
        date"; p575 p. 12, Exclusion limited to cost,
        "the total amount of annuity income that you can exclude over the years as a recovery of the cost can’t exceed your total cost"
  - id: retirement.zero
    printed: (helper)
    label: No amount
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 27, line 4b, Exception 2(b) (enter -0-)
  - id: retirement.one
    printed: (helper)
    label: One distribution
    type: Count
    expr:
      op: param
      ref: sales.one
    cite:
      doc: i1040gi
      locator: pp. 26-30, lines 4c and 5c
  - id: retirement.is_ira
    printed: (helper)
    label: IRA distribution (lines 4a and 4b)
    type: Bool
    expr:
      op: test
      ne:
      - retirement.account
      - const: plan
    cite:
      doc: i1040gi
      locator: p. 26, Lines 4a and 4b, IRA Distributions
  - id: retirement.roth
    printed: (helper)
    label: Roth IRA distribution
    type: Bool
    expr:
      op: test
      eq:
      - retirement.account
      - const: roth_ira
    cite:
      doc: i1040gi
      locator: p. 27, Exception 2, item 2
  - id: retirement.direct
    printed: (helper)
    label: Direct rollover (code G)
    type: Bool
    expr:
      op: test
      eq:
      - retirement.code
      - const: direct_rollover_G
    cite:
      doc: f1099r
      locator: p. 5, Box 2a, "For a direct rollover, other than from a qualified plan, section 403(b) plan, or
        governmental section 457(b) plan to a designated Roth account in the same plan or to a Roth IRA, zero should
        be shown and you must enter zero (-0-) on the “Taxable amount” line of your tax return"; pp. 7 and 9, Box 7,
        "G—Direct rollover of a distribution to a qualified plan, a section 403(b) plan, a governmental section 457(b)
        plan, or an IRA"
  - id: retirement.bad_code
    printed: (gate)
    label: Distribution code the tool does not compute
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - retirement.code
        - const: other
      - op: test
        all:
        - op: test
          eq:
          - retirement.code
          - const: simple_S
        - op: test
          ne:
          - retirement.account
          - const: traditional_ira
      - op: test
        all:
        - op: test
          eq:
          - retirement.code
          - const: disability_3
        - op: test
          eq:
          - retirement.is_ira
          - const: false
        - op: test
          eq:
          - retirement.dis_wages
          - const: false
      - op: test
        all:
        - op: test
          eq:
          - retirement.account
          - const: roth_ira
        - op: test
          ne:
          - retirement.code
          - const: qualified_roth_Q
      - op: test
        all:
        - op: test
          eq:
          - retirement.code
          - const: qualified_roth_Q
        - op: test
          ne:
          - retirement.account
          - const: roth_ira
    cite:
      doc: i1040gi
      locator: p. 27, Exception 2 (a Roth IRA distribution other than code Q needs Form 8606); f1099r pp. 7 and 9, Box
        7, "The following codes identify the distribution you received", "Q—Qualified distribution from a Roth IRA or
        Roth SIMPLE IRA"
  - id: retirement.rolled
    printed: (helper)
    label: Amount rolled over (the whole distribution for a direct rollover)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.direct
          - const: true
        then: retirement.box1
      - guard:
          op: test
          eq:
          - retirement.direct
          - const: false
        then: retirement.rollover_if_any
    cite:
      doc: i1040gi
      locator: p. 27, Exception 1; p. 30, Rollovers
    refuses: &id001
    - when: retirement.special
      form: Form 1099-R special cases (Forms 5329, 8606, 4972, 8915-F, Pub. 575 or 939)
      remedy: This distribution needs a form or rule outside this tool.
      cite:
        doc: i1040gi
        locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired
          Public Safety Officers, Simplified Method'
    - when: retirement.bad_code
      form: Form 8606 or another Form 1099-R code
      remedy: A Roth IRA distribution other than a qualified distribution (code Q), code S other than from a traditional
        SIMPLE IRA, code 3 other than from an IRA, or a distribution code other than 7, 4, 2, 1, S, 3, G or Q, is outside
        this tool.
      cite:
        doc: i1040gi
        locator: p. 27, Exception 2; f1099r Box 7
  - id: retirement.has_rollover
    printed: (helper)
    label: Part or all of the distribution was rolled over (an amount rolled over, or a direct rollover, code G)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        gt:
        - retirement.rolled
        - param: sales.zero
      - op: test
        eq:
        - retirement.direct
        - const: true
    cite:
      doc: i1040gi
      locator: p. 27, Exception 1 ('Also check box 1 on line 4c'); p. 30, Rollovers ('Use lines 5a and 5b to report
        a rollover, including a direct rollover'); p. 31, Line 5c
  - id: retirement.smw_shown
    printed: (helper)
    label: The Simplified Method Worksheet is completed (a pension or annuity, not an IRA, with some cost left to recover)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - retirement.is_ira
        - const: false
      - op: test
        eq:
        - retirement.annuity_with_cost
        - const: true
    cite:
      doc: i1040gi
      locator: 'p. 28, Fully Taxable Pensions and Annuities, "Your payments are fully taxable if (a) you didn’t contribute to the cost (see Cost, later) of your pension or annuity, or (b) you got your entire cost back tax free before 2025."; p. 29, Simplified Method Worksheet—Lines 5a and 5b'
  - id: retirement.smw1
    printed: (SMW 1)
    shown_when: retirement.smw_shown
    label: Enter the total pension or annuity payments from Form 1099-R, box 1
    type: NonNegDollars
    expr:
      op: copy
      from: retirement.box1
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 1
  - id: retirement.smw2
    printed: (SMW 2)
    shown_when: retirement.smw_shown
    label: Enter your cost in the plan at the annuity starting date
    type: NonNegDollars
    expr:
      op: copy
      from: retirement.cost
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 2
  - id: retirement.smw4_t1_360
    printed: (helper)
    label: Line 2 divided by 360 (Table 1)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table1_360
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 1 (360)
  - id: retirement.smw4_t1_310
    printed: (helper)
    label: Line 2 divided by 310 (Table 1)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table1_310
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 1 (310)
  - id: retirement.smw4_t1_260
    printed: (helper)
    label: Line 2 divided by 260 (Table 1)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table1_260
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 1 (260)
  - id: retirement.smw4_t1_210
    printed: (helper)
    label: Line 2 divided by 210 (Table 1)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table1_210
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 1 (210)
  - id: retirement.smw4_t1_160
    printed: (helper)
    label: Line 2 divided by 160 (Table 1)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table1_160
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 1 (160)
  - id: retirement.smw4_t2_410
    printed: (helper)
    label: Line 2 divided by 410 (Table 2)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table2_410
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 2 (410)
  - id: retirement.smw4_t2_360
    printed: (helper)
    label: Line 2 divided by 360 (Table 2)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table2_360
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 2 (360)
  - id: retirement.smw4_t2_310
    printed: (helper)
    label: Line 2 divided by 310 (Table 2)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table2_310
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 2 (310)
  - id: retirement.smw4_t2_260
    printed: (helper)
    label: Line 2 divided by 260 (Table 2)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table2_260
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 2 (260)
  - id: retirement.smw4_t2_210
    printed: (helper)
    label: Line 2 divided by 210 (Table 2)
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: retirement.smw2
      rate:
        param: smw.table2_210
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, lines 3 and 4, Table 2 (210)
  - id: retirement.smw4_table1
    printed: (helper)
    label: Line 2 divided by the Table 1 number for the age at the annuity starting date
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          all:
          - op: test
            ge:
            - retirement.age
            - const: 0
              type: Count
          - op: test
            lt:
            - retirement.age
            - const: 56
              type: Count
        then: retirement.smw4_t1_360
      - guard:
          op: test
          all:
          - op: test
            ge:
            - retirement.age
            - const: 56
              type: Count
          - op: test
            lt:
            - retirement.age
            - const: 61
              type: Count
        then: retirement.smw4_t1_310
      - guard:
          op: test
          all:
          - op: test
            ge:
            - retirement.age
            - const: 61
              type: Count
          - op: test
            lt:
            - retirement.age
            - const: 66
              type: Count
        then: retirement.smw4_t1_260
      - guard:
          op: test
          all:
          - op: test
            ge:
            - retirement.age
            - const: 66
              type: Count
          - op: test
            lt:
            - retirement.age
            - const: 71
              type: Count
        then: retirement.smw4_t1_210
      - guard:
          op: test
          ge:
          - retirement.age
          - const: 71
            type: Count
        then: retirement.smw4_t1_160
    cite:
      doc: i1040gi
      locator: p. 29, Table 1 for Line 3 (annuity starting date after November 18, 1996)
  - id: retirement.smw4_table2
    printed: (helper)
    label: Line 2 divided by the Table 2 number for the combined ages at the annuity starting date
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          all:
          - op: test
            ge:
            - retirement.combined_age
            - const: 0
              type: Count
          - op: test
            lt:
            - retirement.combined_age
            - const: 111
              type: Count
        then: retirement.smw4_t2_410
      - guard:
          op: test
          all:
          - op: test
            ge:
            - retirement.combined_age
            - const: 111
              type: Count
          - op: test
            lt:
            - retirement.combined_age
            - const: 121
              type: Count
        then: retirement.smw4_t2_360
      - guard:
          op: test
          all:
          - op: test
            ge:
            - retirement.combined_age
            - const: 121
              type: Count
          - op: test
            lt:
            - retirement.combined_age
            - const: 131
              type: Count
        then: retirement.smw4_t2_310
      - guard:
          op: test
          all:
          - op: test
            ge:
            - retirement.combined_age
            - const: 131
              type: Count
          - op: test
            lt:
            - retirement.combined_age
            - const: 141
              type: Count
        then: retirement.smw4_t2_260
      - guard:
          op: test
          ge:
          - retirement.combined_age
          - const: 141
            type: Count
        then: retirement.smw4_t2_210
    cite:
      doc: i1040gi
      locator: p. 29, Table 2 for Line 3
  - id: retirement.smw4_new
    printed: (helper)
    label: Line 2 divided by the number on line 3 (Table 2 for a joint and survivor annuity starting after 1997,
      Table 1 otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.joint_life
          - const: true
        then: retirement.smw4_table2
      - guard:
          op: test
          eq:
          - retirement.joint_life
          - const: false
        then: retirement.smw4_table1
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 3
  - id: retirement.smw4
    printed: (SMW 4)
    shown_when: retirement.smw_shown
    label: Divide line 2 by the number on line 3 (or, if you completed this worksheet last year, line 4 of last
      year's worksheet)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.used_last_year
          - const: true
        then: retirement.last_line4
      - guard:
          op: test
          eq:
          - retirement.used_last_year
          - const: false
        then: retirement.smw4_new
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 4, and the note under line 2
  - id: retirement.smw5
    printed: (SMW 5)
    shown_when: retirement.smw_shown
    label: Multiply line 4 by the number of months for which this year's payments were made
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: retirement.smw4
      count: retirement.months
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 5
  - id: retirement.smw6
    printed: (SMW 6)
    shown_when: retirement.smw_shown
    label: Enter the amount, if any, recovered tax free in years after 1986
    type: NonNegDollars
    expr:
      op: copy
      from: retirement.recovered
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 6
  - id: retirement.smw7
    printed: (SMW 7)
    shown_when: retirement.smw_shown
    label: Subtract line 6 from line 2
    type: Dollars
    expr:
      op: subtract
      from: retirement.smw2
      take: retirement.smw6
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 7
  - id: retirement.smw8
    printed: (SMW 8)
    shown_when: retirement.smw_shown
    label: Enter the smaller of line 5 or line 7
    type: Dollars
    expr:
      op: smaller_of
      of:
      - retirement.smw5
      - retirement.smw7
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 8
  - id: retirement.smw9
    printed: (SMW 9)
    shown_when: retirement.smw_shown
    label: Taxable amount. Subtract line 8 from line 1. Enter the result, but not less than zero
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: retirement.smw1
      take: retirement.smw8
    cite:
      doc: i1040gi
      locator: p. 29, Simplified Method Worksheet, line 9
  - id: retirement.smw10
    printed: (SMW 10)
    shown_when: retirement.smw_shown
    label: Add lines 6 and 8. This is the amount you have recovered tax free through 2025
    type: Dollars
    expr:
      op: sum
      of:
      - retirement.smw6
      - retirement.smw8
    cite:
      doc: i1040gi
      locator: 'p. 29, Simplified Method Worksheet, line 10, "No. Add lines 6 and 8. This is the amount you have recovered tax
        free through 2025" (the worksheet is used here only for an annuity starting date after November 18, 1996, so line
        10''s question, "Was your annuity starting date before 1987?", is answered No)'
  - id: retirement.smw11
    printed: (SMW 11)
    shown_when: retirement.smw_shown
    label: Balance of cost to be recovered. Subtract line 10 from line 2
    display: 'Shown on the values sheet so the filer knows whether next year''s payments are fully taxable: "If zero, you won''t have to complete this worksheet next year."'
    type: Dollars
    expr:
      op: subtract
      from: retirement.smw2
      take: retirement.smw10
    cite:
      doc: i1040gi
      locator: 'p. 29, Simplified Method Worksheet, line 11, "Balance of cost to be recovered. Subtract line 10 from line 2. If
        zero, you won''t have to complete this worksheet next year. The payments you receive next year will generally be fully
        taxable"'
  - id: retirement.cost_left
    printed: (helper)
    label: Some cost is left to recover (line 7 of the Simplified Method Worksheet is more than zero)
    type: Bool
    expr:
      op: test
      gt:
      - retirement.smw7
      - param: sales.zero
    cite:
      doc: i1040gi
      locator: p. 28, Fully Taxable Pensions and Annuities, 'you got your entire cost back tax free before 2025'
  - id: retirement.annuity_with_cost
    printed: (helper)
    label: The Simplified Method applies and some cost is left to recover
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - retirement.annuity_if_cost
        - const: true
      - op: test
        eq:
        - retirement.cost_left
        - const: true
    cite:
      doc: i1040gi
      locator: p. 28, Fully Taxable and Partially Taxable Pensions and Annuities
  - id: retirement.annuity_rollover
    printed: (helper)
    label: A pension or annuity figured by the Simplified Method of which some amount was rolled over
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - retirement.is_ira
        - const: false
      - op: test
        eq:
        - retirement.annuity_if_cost
        - const: true
      - op: test
        eq:
        - retirement.has_rollover
        - const: true
    cite:
      doc: i1040gi
      locator: p. 30, Rollovers, 'See Pub. 575 for more details on rollovers'
  - id: retirement.annuity_taxable
    printed: (helper)
    label: 'Taxable annuity amount: Simplified Method line 9, or the whole of box 1 once the cost has been recovered'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.cost_left
          - const: true
        then: retirement.smw9
      - guard:
          op: test
          eq:
          - retirement.cost_left
          - const: false
        then: retirement.box1
    cite:
      doc: i1040gi
      locator: p. 28, Fully Taxable Pensions and Annuities ('If your pension or annuity is fully taxable, enter the
        total pension or annuity payments (from Form(s) 1099-R, box 1) on line 5b'); p. 29, Simplified Method Worksheet,
        line 9
  - id: retirement.ira_taxable
    printed: (helper)
    label: 'Taxable IRA amount: the part not rolled over (zero for a qualified Roth IRA distribution)'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.roth
          - const: true
        then: retirement.zero
      - guard:
          op: test
          eq:
          - retirement.roth
          - const: false
        then: retirement.ira_not_rolled
    cite:
      doc: i1040gi
      locator: p. 27, line 4b, Exception 1 and Exception 2(b)
  - id: retirement.ira_not_rolled
    printed: (helper)
    label: Box 1 less the amount rolled over
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: retirement.box1
      take: retirement.rolled
    cite:
      doc: i1040gi
      locator: p. 27, Exception 1, 'enter the part not rolled over on line 4b'
  - id: retirement.plan_excluded
    printed: (helper)
    label: Taxable contributions (box 5) and the amount rolled over
    type: NonNegDollars
    expr:
      op: sum
      of:
      - retirement.box5
      - retirement.rolled
    cite:
      doc: i1040gi
      locator: p. 30, Rollovers, 'subtract any contributions (usually shown in box 5) ... subtract the amount of
        the rollover'
  - id: retirement.plan_simple
    printed: (helper)
    label: Box 1 less taxable contributions (box 5) and the amount rolled over
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: retirement.box1
      take: retirement.plan_excluded
    cite:
      doc: i1040gi
      locator: p. 28, Fully Taxable Pensions and Annuities; p. 30, Rollovers
  - id: retirement.plan_taxable
    printed: (helper)
    label: Taxable pension or annuity amount (the Simplified Method for an annuity with after-tax cost)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.annuity_if_cost
          - const: true
        then: retirement.annuity_taxable
      - guard:
          op: test
          eq:
          - retirement.annuity_if_cost
          - const: false
        then: retirement.plan_simple
    cite:
      doc: i1040gi
      locator: p. 28, Partially Taxable Pensions and Annuities; p. 29, Simplified Method Worksheet, line 9
  - id: retirement.taxable
    printed: (helper)
    label: Taxable amount of this distribution (line 4b or 5b)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: true
        then: retirement.ira_taxable
      - guard:
          op: test
          eq:
          - retirement.is_ira
          - const: false
        then: retirement.plan_taxable
    cite:
      doc: i1040gi
      locator: pp. 27-30, lines 4b and 5b
    refuses: &id002
    - when: retirement.special
      form: Form 1099-R special cases (Forms 5329, 8606, 4972, 8915-F, Pub. 575 or 939)
      remedy: This distribution needs a form or rule outside this tool.
      cite:
        doc: i1040gi
        locator: 'pp. 27-30, lines 4a-5b: Exceptions 2-4, Lump-Sum Distributions, Insurance Premiums for Retired
          Public Safety Officers, Simplified Method'
    - when: retirement.bad_code
      form: Form 8606 or another Form 1099-R code
      remedy: A Roth IRA distribution other than a qualified distribution (code Q), code S other than from a traditional
        SIMPLE IRA, code 3 other than from an IRA, or a distribution code other than 7, 4, 2, 1, S, 3, G or Q, is outside
        this tool.
      cite:
        doc: i1040gi
        locator: p. 27, Exception 2; f1099r Box 7
    - when: retirement.screen_refused
      form: Form 5329 or Form 8915-F for this Form 1099-R
      remedy: A qualified disaster recovery distribution, a modified series of substantially equal payments, an annuity or
        modified endowment contract distribution, a repayment, a December 30-31 long-term care distribution, more than one
        exception, an exception covering only part of a code 2 distribution, or a code 4 or 7 that does not fit needs Form
        5329 or Form 8915-F rules this tool does not apply.
      cite:
        doc: i5329
        locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
    - when: retirement.annuity_rollover
      form: Pub. 575 (rollover of a pension or annuity figured by the Simplified Method)
      remedy: A rollover from a pension or annuity whose taxable part is figured with the Simplified Method is
        outside this tool.
      cite:
        doc: i1040gi
        locator: p. 30, Rollovers, 'See Pub. 575 for more details on rollovers'
  - id: retirement.show_a
    printed: (helper)
    label: An exception applies, so the total distribution goes on line 4a or 5a
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - retirement.has_rollover
        - const: true
      - op: test
        eq:
        - retirement.roth
        - const: true
      - op: test
        all:
        - op: test
          eq:
          - retirement.is_ira
          - const: false
        - op: test
          any:
          - op: test
            eq:
            - retirement.annuity_with_cost
            - const: true
          - op: test
            all:
            - op: test
              eq:
              - retirement.annuity_if_cost
              - const: false
            - op: test
              gt:
              - retirement.box5
              - param: sales.zero
    cite:
      doc: i1040gi
      locator: p. 27, line 4b ('If the distribution from your IRA is fully taxable, enter the total distribution
        on line 4b; don't make an entry on line 4a'); p. 28, Fully Taxable and Partially Taxable Pensions and Annuities;
        p. 30, Rollovers
  - id: retirement.amount_a
    printed: (helper)
    label: Total distribution entered on line 4a or 5a (none when fully taxable)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.show_a
          - const: true
        then: retirement.box1
      - guard:
          op: test
          eq:
          - retirement.show_a
          - const: false
        then: retirement.zero
    cite:
      doc: i1040gi
      locator: pp. 27-30, lines 4a and 5a
    refuses: *id002
  - id: retirement.sav_military
    printed: (helper)
    label: Is this a distribution from a military retirement plan (other than the federal Thrift Savings Plan)?
    type: Bool
    expr:
      op: input
      source: Is this a distribution from a military retirement plan (such as military retired pay), other than the federal
        Thrift Savings Plan (TSP)?
    cite:
      doc: f8880
      locator: 'p. 2, Line 4, "Distributions from a military retirement plan (other than the federal TSP)"'
  - id: retirement.sav_404k
    printed: (helper)
    label: Is this a distribution of dividends paid on stock held by an employee stock ownership plan (section 404(k))?
    type: Bool
    expr:
      op: input
      source: Is this a distribution of dividends paid on stock held by an employee stock ownership plan under section 404(k)
        (reported on its own Form 1099-R)?
    cite:
      doc: f8880
      locator: 'p. 2, Line 4, "Distributions of dividends paid on stock held by an employee stock ownership plan under section
        404(k)"'
  - id: retirement.sav_inherited
    printed: (helper)
    label: Is this a distribution from an inherited IRA that you received as a beneficiary other than the owner's spouse?
    type: Bool
    expr:
      op: input
      source: Is this a distribution from an inherited IRA that you (or your spouse, on a joint return) received as a beneficiary
        who was not the IRA owner's spouse?
    cite:
      doc: f8880
      locator: 'p. 2, Line 4, "Distributions from an inherited IRA by a nonspousal beneficiary"'
    ambiguity: amb.2025.savers_inherited_plans
  - id: retirement.sav_excluded
    printed: (helper)
    label: A distribution Form 8880 line 4 does not count (from a military retirement plan or of section 404(k) dividends, for a
      plan; from an inherited IRA as a nonspouse beneficiary, for an IRA)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        all:
        - op: test
          eq:
          - retirement.is_ira
          - const: false
        - op: test
          eq:
          - retirement.sav_military
          - const: true
      - op: test
        all:
        - op: test
          eq:
          - retirement.is_ira
          - const: false
        - op: test
          eq:
          - retirement.sav_404k
          - const: true
      - op: test
        all:
        - op: test
          eq:
          - retirement.is_ira
          - const: true
        - op: test
          eq:
          - retirement.sav_inherited
          - const: true
    cite:
      doc: f8880
      locator: 'p. 2, Line 4, "Don’t include any of the following"; "Distributions of dividends paid on stock held by an employee
        stock ownership plan under section 404(k)"; "Distributions from a military retirement plan (other than the federal TSP)";
        "Distributions from an inherited IRA by a nonspousal beneficiary"'
    ambiguity: amb.2025.savers_inherited_plans
  - id: retirement.sav_gross
    printed: (helper)
    label: The distribution less the part rolled over (the whole distribution for a direct rollover)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: retirement.box1
      take: retirement.rolled
    cite:
      doc: f8880
      locator: 'p. 2, Line 4, "Enter the total amount of distributions"; "Distributions not taxable as the result of a rollover
        or a trustee-to- trustee transfer"'
    ambiguity: amb.2025.savers_line4_gross
  - id: retirement.sav_amount
    printed: (helper)
    label: This distribution's amount on Form 8880 line 4
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.sav_excluded
          - const: true
        then: retirement.zero
      - guard:
          op: test
          eq:
          - retirement.sav_excluded
          - const: false
        then: retirement.sav_gross
    cite:
      doc: f8880
      locator: 'p. 2, Line 4, "Enter the total amount of distributions you, and your spouse if filing jointly, received after
        2022 and before the due date of your 2025 return (including extensions) from any of the following types of plans"'
# --- Stage 21: Form 5329 (generated) ---
  - id: retirement.early
    printed: (helper)
    label: An early distribution with no known exception (code 1, or code S from a SIMPLE IRA in the first 2 years)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - retirement.code
        - const: early_1
      - op: test
        eq:
        - retirement.code
        - const: simple_S
    cite:
      doc: i5329
      locator: p. 3, Line 1, "Enter the amount of early distributions includible in income (other than qualified disaster recovery
        distributions) that you received from:"
  - id: retirement.early_screen
    printed: (gate)
    label: An early distribution of a kind Form 5329 Part I is not computed for here
    type: Bool
    expr:
      op: input
      source: 'Is any of these true of this distribution: it is a qualified disaster recovery distribution (Form 8915-F); it
        is part of a series of substantially equal periodic payments that was modified (recapture); it is from an annuity contract
        or a modified endowment contract; it repays a birth or adoption, terminal illness, domestic abuse or emergency personal
        expense distribution; it is an emergency personal expense distribution within 3 years after an earlier one you have
        not repaid; it is a qualified long-term care distribution made December 30 or 31, 2025; or more than one exception to
        the additional tax applies to it?'
    cite:
      doc: i5329
      locator: p. 5, Line 2, "Enter on line 2 the amount that you can exclude.", "In the space provided, enter the applicable
        exception number (01–23). If more than one exception applies, enter 99."
  - id: retirement.under59
    printed: (helper)
    label: 'Were you under age 59½ when you received any of this money?'
    type: Bool
    gated_by: retirement.under59_if_code7
    expr:
      op: input
      source: 'Were you under age 59½ when you received any of this money?'
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.is_code7
    printed: (helper)
    label: 'Code 7 (normal distribution)'
    type: Bool
    expr:
      op: test
      eq:
      - retirement.code
      - const: normal_7
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.under59_if_code7
    printed: (gate)
    label: 'Under age 59½ when the money was received, asked only with code 7 (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_code7
          - const: true
        then: retirement.under59
      - guard:
          op: test
          eq:
          - retirement.is_code7
          - const: false
        then: retirement.no
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.sec457
    printed: (helper)
    label: 'Is it from a section 457 plan (a deferred compensation plan of a state or local government or a tax-exempt employer), and not money that was rolled into that plan from another kind of plan?'
    type: Bool
    gated_by: retirement.sec457_if_under59
    expr:
      op: input
      source: 'Is it from a section 457 plan (a deferred compensation plan of a state or local government or a tax-exempt employer), and not money that was rolled into that plan from another kind of plan?'
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.sec457_if_under59
    printed: (gate)
    label: 'A section 457 plan distribution not from a rollover, asked only with code 7 under age 59½ (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.under59_if_code7
          - const: true
        then: retirement.sec457
      - guard:
          op: test
          eq:
          - retirement.under59_if_code7
          - const: false
        then: retirement.no
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.code7_wrong
    printed: (helper)
    label: 'Code 7 although under age 59½, other than a section 457 plan distribution not from a rollover'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - retirement.under59_if_code7
        - const: true
      - op: test
        eq:
        - retirement.sec457_if_under59
        - const: false
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.code2_partial
    printed: (helper)
    label: 'Code 2 means the payer knows of an exception to the extra tax on early withdrawals. Does that exception fail to cover all of this money (it covers only part of it, or none)?'
    type: Bool
    gated_by: retirement.code2_partial_if_code2
    expr:
      op: input
      source: 'Code 2 means the payer knows of an exception to the extra tax on early withdrawals. Does that exception fail to cover all of this money (it covers only part of it, or none)?'
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.is_code2
    printed: (helper)
    label: 'Code 2 (early distribution, exception applies)'
    type: Bool
    expr:
      op: test
      eq:
      - retirement.code
      - const: early_exception_2
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.code2_partial_if_code2
    printed: (gate)
    label: 'The code 2 exception does not cover the whole distribution, asked only with code 2 (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_code2
          - const: true
        then: retirement.code2_partial
      - guard:
          op: test
          eq:
          - retirement.is_code2
          - const: false
        then: retirement.no
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.not_beneficiary
    printed: (helper)
    label: 'Code 4 is for money paid to the beneficiary of a person who has died. Did you get this money some other way, or are you the surviving spouse and have you made the IRA your own (by choosing to, by putting money into it, or by not taking a required minimum distribution from it as a beneficiary)?'
    type: Bool
    gated_by: retirement.not_beneficiary_if_death
    expr:
      op: input
      source: 'Code 4 is for money paid to the beneficiary of a person who has died. Did you get this money some other way, or are you the surviving spouse and have you made the IRA your own (by choosing to, by putting money into it, or by not taking a required minimum distribution from it as a beneficiary)?'
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.not_beneficiary_if_death
    printed: (gate)
    label: 'Code 4 although not a beneficiary, asked only with code 4 (false otherwise)'
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - retirement.is_death
          - const: true
        then: retirement.not_beneficiary
      - guard:
          op: test
          eq:
          - retirement.is_death
          - const: false
        then: retirement.no
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.code_screen
    printed: (gate)
    label: 'A code 2, 4 or 7 distribution whose code does not fit'
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - retirement.code2_partial_if_code2
        - const: true
      - op: test
        eq:
        - retirement.code7_wrong
        - const: true
      - op: test
        eq:
        - retirement.not_beneficiary_if_death
        - const: true
    cite:
      doc: i5329
      locator: 'p. 5, Line 2, "Enter on line 2 the amount that you can exclude."'
  - id: retirement.screen_refused
    printed: (gate)
    label: This Form 1099-R needs Form 5329 parts or codes this tool does not compute
    type: Bool
    expr:
      op: test
      any:
      - op: test
        all:
        - op: test
          eq:
          - retirement.early
          - const: true
        - op: test
          eq:
          - retirement.early_screen
          - const: true
      - op: test
        all:
        - op: test
          any:
          - op: test
            eq:
            - retirement.code
            - const: early_exception_2
          - op: test
            eq:
            - retirement.code
            - const: normal_7
          - op: test
            eq:
            - retirement.code
            - const: death_4
        - op: test
          eq:
          - retirement.code_screen
          - const: true
    cite:
      doc: i5329
      locator: p. 5, Line 2, "Enter on line 2 the amount that you can exclude.", "In the space provided, enter the applicable
        exception number (01–23). If more than one exception applies, enter 99."
  - id: retirement.exception
    printed: (helper)
    label: Exception to the additional tax that applies to this distribution (i5329 p. 5 table), or none
    type: Enum(early_exception)
    expr:
      op: input
      source: |-
        Which exception to the 10% additional tax applies to this distribution?

        Enter the number from the table in the Form 5329 instructions (for example 02 substantially equal periodic payments, 03 disability, 05 medical expenses, 08 higher education expenses, 09 first home, 12 incorrectly coded as early, 19 birth or adoption, 20 terminal illness), or none.

        An exception applies only if its conditions are met, for example:
        - 01, a qualified retirement plan distribution (not an IRA) received after you separated from service in or after the year you reached age 55 (age 50 for qualified public safety employees and private sector firefighters) or after 25 years of service under the plan, whichever is earlier
        - 02, payments made at least annually for your life (or life expectancy) or the joint lives (or joint life expectancies) of you and your designated beneficiary, which from an employer plan must begin after separation from service
        - 03, total and permanent disability, if you can furnish proof that you can't do any substantial gainful activity because of your physical or mental condition and a medical determination has been made that the condition can be expected to result in death or to be of long, continued, and indefinite duration
        - 04, a distribution due to death (not from a modified endowment contract)
        - 09, an IRA distribution for a first home, only if you had no present interest in a main home during the 2-year period ending on the date of acquisition (the date you entered into a binding contract to buy it, or building or rebuilding began) and, if you are married, your spouse also meets this no-ownership requirement
        - 11, a qualified reservist distribution, only if you were ordered or called to active duty after September 11, 2001, for more than 179 days or for an indefinite period because you are a member of a reserve component, the distribution is from an IRA or from amounts attributable to elective deferrals under a section 401(k) or 403(b) plan or a similar arrangement, and it was made no earlier than the date of the order or call and no later than the close of the active duty period
        - 19, a qualified birth or adoption distribution, only if made during the 1-year period beginning on the date your child was born or the legal adoption was finalized, an adopted child being an eligible adoptee (not the child of your spouse, and under age 18 or physically or mentally incapable of self-support)
    cite:
      doc: i5329
      locator: p. 5, Line 2, "Enter on line 2 the amount that you can exclude.", "In the space provided, enter the applicable
        exception number (01–23). If more than one exception applies, enter 99.", "Qualified retirement plan distributions
        (doesn’t apply to IRAs) you received after separation from service when the separation from service occurs in or
        after the year you reach age 55 (age 50 for qualified public safety employees and private sector firefighters) or
        25 years of service under the plan, whichever is earlier.", "(if from an employer plan, payments must begin after
        separation from service)", "You are considered disabled if you can furnish proof that you can’t do any substantial
        gainful activity because of your physical or mental condition." and "Distributions due to death (doesn’t apply to
        modified endowment contracts)."; p590b p. 28, First-time homebuyer, "you are a first-time homebuyer if you had no
        present interest in a main home during the 2-year period ending on the date of acquisition of the home which the
        distribution is being used to buy, build, or rebuild. If you are married, your spouse must also meet this
        no-ownership requirement.", "You enter into a binding contract to buy the main home", "You were ordered or called
        to active duty after September 11, 2001.", "of more than 179 days or for an indefinite period because you are a
        member of a reserve component.", "The distribution is from an IRA or from amounts attributable to elective deferrals
        under a section 401(k) or 403(b) plan or a similar arrangement.", "the date of the order or call to active duty and
        no later than the close of the active duty period.", "if made during the 1-year period beginning on the date on
        which your child was born or the date on which the legal adoption of your child was finalized" and "an eligible
        adoptee is any individual (other than the child of the taxpayer’s spouse) who has not reached age 18 or is
        physically or mentally incapable of self-support."
  - id: retirement.has_exception
    printed: (helper)
    label: An exception applies
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - retirement.early
        - const: true
      - op: test
        ne:
        - retirement.exception
        - const: none
    cite:
      doc: i5329
      locator: p. 5, Line 2, "Enter on line 2 the amount that you can exclude.", "In the space provided, enter the applicable
        exception number (01–23). If more than one exception applies, enter 99."
  - id: retirement.exc_amount
    printed: (helper)
    label: Amount of this distribution the exception covers
    type: NonNegDollars
    expr:
      op: input
      source: |-
        Amount of this distribution that the exception covers (the tool applies the dollar limits per person).

        - Medical expenses (05), birth or adoption (19) and domestic abuse (22): the amount of the distribution that qualifies, whatever it was spent on; for 05 the tool limits it to the medical expenses above 7.5% of AGI, and for 22 enter no more than 50% of the present value of the IRA or plan account
        - First home (09): the amount used to pay qualified acquisition costs before the close of the 120th day after the day you received it
        - Emergency expenses (23): no more than your total interest in the IRA or plan account minus $1,000
        - Health insurance premiums while unemployed (07): the premiums you paid
        - Higher education (08): your adjusted qualified education expenses (Pub. 970, chapter 8)
        - Other exceptions: the amount the exception covers
    cite:
      doc: i5329
      locator: p. 5, Line 2, "Enter on line 2 the amount that you can exclude.", "In the space provided, enter the applicable
        exception number (01–23). If more than one exception applies, enter 99."
    ambiguity: amb.2025.f5329_education_k12
  - id: retirement.wrong_kind
    printed: (gate)
    label: An exception that does not apply to this kind of account
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - retirement.has_exception
        - const: true
      - op: test
        any:
        - op: test
          all:
          - op: test
            eq:
            - retirement.is_ira
            - const: true
          - op: test
            any:
            - op: test
              eq:
              - retirement.exception
              - const: e01
            - op: test
              eq:
              - retirement.exception
              - const: e06
        - op: test
