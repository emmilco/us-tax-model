form:
  id: rental
  kind: form
  title: Schedule E, Part I — one rental real estate property
  tax_year: 2025
  note: 'One entry per rental real estate property (Schedule E types 1 to 5). Its expenses, other than advertising and commissions, are divided
    by days when it had personal use but was not used as a home; a home rented fewer than 15 days is left out. Its Form 8582 worksheet columns
    (Parts IV to VIII) are figured here and totalled on Form 8582. Refused: self-rental and other property, average stays
    of 7 days or less, significant services, less than 10% owned, not for profit, depletion, part of a property the filer lives in, property held mainly for sale or offered in business hours, property incidental to the filer''s own business, car and travel expenses, mortgage interest beyond Form 1098, the cost of a bought leasehold, a home
    used personally and rented 15 days or more, a held-back loss from a year without active participation, a loss with
    amounts not at risk, and net income from a rental of nondepreciable property when Form 8582 is required.'
  lines:
  - id: rental.zero
    printed: (helper)
    label: Zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040se
      locator: p. 7, Line 21
  - id: rental.no
    printed: (helper)
    label: No (false)
    type: Bool
    expr:
      op: param
      ref: household.no
    cite:
      doc: i1040se
      locator: p. 1, Line 2
  - id: rental.one
    printed: (helper)
    label: One
    type: Count
    expr:
      op: param
      ref: rental.one
    cite:
      doc: i1040se
      locator: p. 5, Line 1a
  - id: rental.kind
    printed: 1b
    label: Type of property
    type: Enum(rental_kind)
    expr:
      op: input
      source: 'What kind of property is this?


        - sfr: a house or condo (one home)

        - multi: a building with two or more homes

        - vacation: a vacation or short-stay rental

        - commercial: shops, offices or other business space

        - land: land only

        - self_rental: property rented to a business you or your spouse run

        - other: something else'
    cite:
      doc: i1040se
      locator: 'p. 5, Line 1b, "Enter one of the codes listed under “Type of Property” in Part I of the form"'
  - id: rental.self_rental
    printed: (gate)
    label: Self-rental (type 7) or other property (type 8)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - rental.kind
        - const: self_rental
      - op: test
        eq:
        - rental.kind
        - const: other
    cite:
      doc: i1040se
      locator: p. 5, Line 1b, "Self-Rental"
  - id: rental.days_fair
    printed: '2'
    label: Fair rental days
    type: Count
    expr:
      op: input
      source: How many days in 2025 was it rented at a fair price? Count a day rented at a fair price even if you also used
        it that day; do not count days it was empty but offered for rent.
    cite:
      doc: i1040se
      locator: 'p. 5, Line 2, "For each property listed on line 1a, report the number of days in the year each property was rented at fair rental value and the number of days of personal use"'
  - id: rental.personal_any
    printed: (helper)
    label: Any day of personal use in 2025
    type: Bool
    expr:
      op: input
      source: On any day in 2025, did you, another owner or a relative of either use it, or did anyone stay free, below a
        fair rent or under a home swap?
    cite:
      doc: p527
      locator: p. 26, What is a day of personal use?, "A day of personal use of a dwelling unit is any day that the unit is
        used by any of the following persons"
  - id: rental.days_personal
    printed: '2'
    label: Personal use days
    type: Count
    expr:
      op: input
      source: How many days in 2025 was it used that way (by you, another owner or a relative of either, or by anyone staying
        free, below a fair rent or under a home swap)? Leave out days a relative rented it at a fair rent as their main home,
        days another owner rented it as their main home at a fair rent under a shared equity financing agreement, days spent
        mostly repairing it, and days it was your main home before or after renting it out (or trying to) for 12 months or
        more in a row, or for less if you then sold or traded it.
    cite:
      doc: p527
      locator: 'p. 26, What is a day of personal use?; i1040se p. 5, Line 2, "For each property listed on line 1a, report the number of days in the year each property was rented at fair rental value and the number of days of personal use"'
  - id: rental.days_overlap
    printed: (helper)
    label: Days of personal use that were also fair rental days
    type: Count
    expr:
      op: input
      source: Of those days, how many were also days it was rented at a fair price (for example, a renter let you stay a weekend)?
    cite:
      doc: p527
      locator: p. 26, Dwelling Unit Used as a Home, "If a dwelling unit is used for personal purposes on a day it is rented
        at a fair rental price"
  - id: rental.day_cents
    printed: (helper)
    label: One day carried as one cent
    type: NonNegDollars
    expr:
      op: param
      ref: rental.day_cents
    cite: &id001
      doc: p527
      locator: p. 25, Dividing Expenses, "divide your expenses between the rental use and the personal use based on the number
        of days used for each purpose"; p. 26, "Any day that the unit is rented at a fair rental price is a", "The total use of
        the cottage was 99 days"
  - id: rental.tenth_cents
    printed: (helper)
    label: 'One day of personal use carried as ten cents (against one cent per rental day: the 10% test)'
    type: NonNegDollars
    expr:
      op: param
      ref: rental.tenth_cents
    cite:
      doc: p527
      locator: p. 26, Dwelling Unit Used as a Home, "10% of the total days it is rented to others at a fair rental price"
  - id: rental.fair_c
    printed: (helper)
    label: Fair rental days (as cents)
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: rental.day_cents
      count: rental.days_fair
    cite: *id001
  - id: rental.personal_raw
    printed: (helper)
    label: Personal use days as answered (as cents)
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: rental.day_cents
      count: rental.days_personal
    cite: *id001
  - id: rental.personal_c
    printed: (helper)
    label: Personal use days (as cents), asked only when there was personal use (none otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.personal_any
          - const: true
        then: rental.personal_raw
      - guard:
          op: test
          eq:
          - rental.personal_any
          - const: false
        then: rental.zero
    cite: *id001
  - id: rental.overlap_raw
    printed: (helper)
    label: Overlap days as answered (as cents)
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: rental.day_cents
      count: rental.days_overlap
    cite: *id001
  - id: rental.overlap_c
    printed: (helper)
    label: Overlap days (as cents), asked only when there was personal use (none otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.personal_any
          - const: true
        then: rental.overlap_raw
      - guard:
          op: test
          eq:
          - rental.personal_any
          - const: false
        then: rental.zero
    cite: *id001
  - id: rental.use_c
    printed: (helper)
    label: Fair rental days plus personal use days, before taking out overlap days (as cents)
    type: NonNegDollars
    expr:
      op: sum
      of:
      - rental.fair_c
      - rental.personal_c
    cite: *id001
  - id: rental.total_c
    printed: (helper)
    label: 'Total days of use: rental days plus personal use days not also rental days (as cents)'
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rental.use_c
      take: rental.overlap_c
    cite: *id001
  - id: rental.home_rent_c
    printed: (helper)
    label: Fair rental days less days also used personally, for the home test (as cents)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rental.fair_c
      take: rental.overlap_c
    cite:
      doc: p527
      locator: p. 26, Dwelling Unit Used as a Home, "don't count that day as a day of rental use in applying (2) above"
  - id: rental.home_pers10
    printed: (helper)
    label: Ten times the personal use days (as cents)
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: rental.tenth_cents
      count: rental.days_personal
    cite:
      doc: p527
      locator: p. 26, Dwelling Unit Used as a Home
  - id: rental.home_pers10_if_any
    printed: (helper)
    label: Ten times the personal use days (as cents), when there was personal use (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.personal_any
          - const: true
        then: rental.home_pers10
      - guard:
          op: test
          eq:
          - rental.personal_any
          - const: false
        then: rental.zero
    cite:
      doc: p527
      locator: p. 26, Dwelling Unit Used as a Home
  - id: rental.home
    printed: (gate)
    label: 'Used as a home: personal use more than the greater of 14 days or 10% of the fair rental days'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        gt:
        - rental.personal_c
        - param: rental.home_days
      - op: test
        gt:
        - rental.home_pers10_if_any
        - rental.home_rent_c
    cite:
      doc: p527
      locator: p. 26, Dwelling Unit Used as a Home, "You use a dwelling unit as a home during the tax year if you use it for
        personal purposes more than the greater of"
    ambiguity: amb.2025.rental_overlap_days
  - id: rental.excluded
    printed: (gate)
    label: 'Used as a home and rented fewer than 15 days: not reported'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - rental.home
        - const: true
      - op: test
        lt:
        - rental.days_fair
        - param: rental.min_rental_days
    cite: &id002
      doc: i1040se
      locator: p. 5, Line 2, "do not report the rental income and do not deduct any rental expenses"
  - id: rental.reported
    printed: (helper)
    label: The property is reported on Schedule E (not excluded)
    type: Bool
    expr:
      op: test
      eq:
      - rental.excluded
      - const: false
    cite: *id002
  - id: rental.ws51
    printed: (gate)
    label: Used as a home and rented 15 days or more (Worksheet 5-1)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - rental.home
        - const: true
      - op: test
        eq:
        - rental.excluded
        - const: false
    cite:
      doc: p527
      locator: p. 28, Used as a home and rented 15 days or more
  - id: rental.short_stays
    printed: (helper)
    label: Average stay of 30 days or less
    type: Bool
    expr:
      op: input
      source: Did renters stay 30 days or less, on average? Divide the days it was rented by the number of separate stays.
    cite:
      doc: i8582
      locator: p. 3, Exceptions, "Figure the average period of customer use for a class of property by dividing the total
        number of days in all rental periods by the number of rentals"
  - id: rental.stay7
    printed: (helper)
    label: Average stay of 7 days or less
    type: Bool
    gated_by: rental.stay7_if_short
    expr:
      op: input
      source: Was the average stay 7 days or less?
    cite:
      doc: i8582
      locator: p. 3, Exceptions, "Figure the average period of customer use for a class of property by dividing the total
        number of days in all rental periods by the number of rentals"
  - id: rental.stay7_if_short
    printed: (gate)
    label: Average stay of 7 days or less, asked only when stays averaged 30 days or less (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.short_stays
          - const: true
        then: rental.stay7
      - guard:
          op: test
          eq:
          - rental.short_stays
          - const: false
        then: rental.no
    cite:
      doc: i8582
      locator: p. 3, Exceptions
  - id: rental.services
    printed: (helper)
    label: Significant services provided to renters (Schedule C)
    type: Bool
    expr:
      op: input
      source: Did you, or someone for you, provide services for renters, such as cleaning during their stay, changing linen
        or meals?
    cite:
      doc: i1040se
      locator: p. 5, Line 3, "If you provided significant services to the renter, such as maid service, report the rental
        activity on Schedule C"
  - id: rental.under_tenth
    printed: (helper)
    label: Less than 10% owned (with the spouse)
    type: Bool
    expr:
      op: input
      source: At any time in 2025, did you (with your spouse) own less than a tenth of it, by value?
    cite:
      doc: i8582
      locator: p. 4, Active participation, "in the activity was less than 10% (by value) of all interests in the activity"
  - id: rental.not_for_profit
    printed: (helper)
    label: Not rented to make a profit
    type: Bool
    expr:
      op: input
      source: Was it rented not to make a profit, for example to a friend at a low rent?
    cite:
      doc: p527
      locator: p. 17, Not Rented for Profit
  - id: rental.depletion
    printed: (helper)
    label: Depletion claimed
    type: Bool
    expr:
      op: input
      source: Do you claim depletion for it (oil, gas, minerals or timber)?
    cite:
      doc: i1040se
      locator: p. 6, Line 18, "Depletion"
  - id: rental.part_home
    printed: (helper)
    label: Part of a property the filer also lives in, lived in during 2025, or uses
    type: Bool
    expr:
      op: input
      source: Is it part of a property you live in or use yourself, or lived in during 2025, such as a room in your home,
        one unit of a building you live in, or space in a building that holds your own office?
    cite:
      doc: i1040se
      locator: p. 6, Renting out part of your home
  - id: rental.held_for_sale
    printed: (helper)
    label: Held mainly for sale (as an investment or by a real estate dealer), or made available in business hours for
      nonexclusive use by many customers
    type: Bool
    expr:
      op: input
      source: Do you hold it mainly to sell at a gain rather than to rent (as an investment, or for sale to customers as a
        real estate dealer), or do you make it available during set business hours for use by many customers, such as a
        parking lot?
    cite:
      doc: i8582
      locator: p. 3, Exceptions, "The rental of property is incidental to an activity of holding property for investment";
        p. 4, "You customarily make the rental property available during defined business hours for nonexclusive use by
        various customers"
  - id: rental.business_incidental
    printed: (helper)
    label: Rental incidental to a trade or business activity the filer owns an interest in (mainly used in it, gross rent
      under 2% of the smaller of unadjusted basis and value)
    type: Bool
    expr:
      op: input
      source: Was it mainly used in a business you or your spouse owned a part of in 2025, in 2025 or in 2 of the 5 years
        before, with 2025 rent under 2% of the smaller of its cost and its value?
    cite:
      doc: i8582
      locator: p. 3, Exceptions, "The rental of property is incidental to a trade or business activity if"
  - id: rental.is_land
    printed: (helper)
    label: Land only (nothing on it subject to depreciation)
    type: Bool
    expr:
      op: test
      eq:
      - rental.kind
      - const: land
    cite: &id017
      doc: p925
      locator: p. 16, Rental of Nondepreciable Property, "less than 30% of the unadjusted basis of the property is subject
        to depreciation"
  - id: rental.land_heavy
    printed: (helper)
    label: Less than 30% of the unadjusted basis of the property subject to depreciation
    type: Bool
    gated_by: rental.land_heavy_if_built
    expr:
      op: input
      source: Was less than 30% of what it cost (before depreciation) for its buildings and other things that wear out, the
        rest being for the land?
    cite: *id017
  - id: rental.land_heavy_if_built
    printed: (gate)
    label: Less than 30% subject to depreciation, asked only when the property is not land only (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.is_land
          - const: false
        then: rental.land_heavy
      - guard:
          op: test
          eq:
          - rental.is_land
          - const: true
        then: rental.no
    cite: *id017
  - id: rental.vehicle
    printed: (helper)
    label: Car, truck or travel expenses for the rental (line 6)
    type: Bool
    expr:
      op: input
      source: Car, truck or travel costs for the rental
    cite:
      doc: i1040se
      locator: p. 4, Line 6
  - id: rental.active
    printed: (helper)
    label: Active participation
    type: Bool
    expr:
      op: input
      source: Did you or your spouse help make decisions for it, such as approving tenants, setting the rent or approving
        repairs, even if a manager did the daily work?
    cite:
      doc: i1040se
      locator: p. 4, Active participation, "You can meet the active participation requirement without regular, continuous,
        and substantial involvement"
  - id: rental.rents
    printed: (helper)
    label: Rents and other rental income received (your share)
    type: NonNegDollars
    expr:
      op: input
      source: Rent and other income from it in 2025 (your share), including advance rent, bills a tenant paid for you, and
        the value of goods or work you got in place of rent
    cite:
      doc: i1040se
      locator: 'p. 4, Line 3; p. 5, Line 3, "If you received services or property instead of money as rent, report the fair
        market value of the services or property as rental income on line 3"'
  - id: rental.has_advertising
    printed: (helper)
    label: 'Advertising: any'
    type: Bool
    expr:
      op: input
      source: Advertising
    cite: &id003
      doc: i1040se
      locator: p. 6, General Instructions for Lines 5 Through 21
  - id: rental.amt5
    printed: (helper)
    label: Advertising paid in 2025, before any division for personal use
    type: NonNegDollars
    gated_by: rental.amt5_if_any
    expr:
      op: input
      source: Advertising for renters, paid in 2025 (your share)
    cite: *id003
  - id: rental.amt5_if_any
    printed: (gate)
    label: Advertising, asked only when ticked (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.has_advertising
          - const: true
        then: rental.amt5
      - guard:
          op: test
          eq:
          - rental.has_advertising
          - const: false
        then: rental.zero
    cite: *id003
  - id: rental.line5
    printed: '5'
    label: Advertising
    type: NonNegDollars
    expr:
      op: copy
      from: rental.amt5_if_any
    cite:
      doc: p527
      locator: 'p. 31, Line 2d, "Enter the total of your rental expenses that are directly related only to the rental
        activity" and "Also, include rental agency fees, advertising"; p. 29, Worksheet 5-1, line 2e, "Fully deductible
        rental expenses"; pp. 23-24, Renting Part of Property, "You don''t have to divide the expenses that belong only
        to the rental part of your property" (a cost of the rental activity alone is taken whole, also when the unit had
        personal use)'
    ambiguity: amb.2025.rental_direct_expenses
  - id: rental.has_cleaning
    printed: (helper)
    label: 'Cleaning and maintenance: any'
    type: Bool
    expr:
      op: input
      source: Cleaning and maintenance
    cite: &id004
      doc: i1040se
      locator: p. 6, General Instructions for Lines 5 Through 21
  - id: rental.amt7
    printed: (helper)
    label: Cleaning and maintenance paid in 2025, before any division for personal use
    type: NonNegDollars
    gated_by: rental.amt7_if_any
    expr:
      op: input
      source: Cleaning and maintenance (not repairs), paid in 2025 (your share)
    cite: *id004
  - id: rental.amt7_if_any
    printed: (gate)
    label: Cleaning and maintenance, asked only when ticked (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.has_cleaning
          - const: true
        then: rental.amt7
      - guard:
          op: test
          eq:
          - rental.has_cleaning
          - const: false
        then: rental.zero
    cite: *id004
  - id: rental.div7
    printed: (helper)
    label: 'Cleaning and maintenance: the rental part (rental days over total days of use)'
    type: NonNegDollars
    expr:
      op: prorate
      amount: rental.amt7_if_any
      part: rental.fair_c
      whole: rental.total_c
      places: 6
    cite: *id001
    ambiguity: amb.2025.rental_use_ratio_places
  - id: rental.line7
    printed: '7'
    label: Cleaning and maintenance
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.personal_any
          - const: false
        then: rental.amt7_if_any
      - guard:
          op: test
          eq:
          - rental.personal_any
          - const: true
        then: rental.div7
    cite:
      doc: i1040se
      locator: p. 5, Line 2, "If you rented out a dwelling unit that you also used for personal purposes"
  - id: rental.has_commissions
    printed: (helper)
    label: 'Commissions: any'
    type: Bool
    expr:
      op: input
      source: Commissions
    cite: &id005
      doc: i1040se
      locator: p. 6, General Instructions for Lines 5 Through 21
  - id: rental.amt8
    printed: (helper)
    label: Commissions paid in 2025, before any division for personal use
    type: NonNegDollars
    gated_by: rental.amt8_if_any
    expr:
      op: input
      source: Commissions paid, for example to an agent who found a renter, paid in 2025 (your share)
    cite: *id005
  - id: rental.amt8_if_any
    printed: (gate)
    label: Commissions, asked only when ticked (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.has_commissions
          - const: true
        then: rental.amt8
      - guard:
          op: test
          eq:
          - rental.has_commissions
          - const: false
        then: rental.zero
    cite: *id005
  - id: rental.line8
    printed: '8'
    label: Commissions
    type: NonNegDollars
    expr:
      op: copy
      from: rental.amt8_if_any
    cite:
      doc: p527
      locator: 'p. 31, Line 2d, "Enter the total of your rental expenses that are directly related only to the rental
        activity" and "Also, include rental agency fees, advertising"; p. 29, Worksheet 5-1, line 2e, "Fully deductible
        rental expenses"; pp. 23-24, Renting Part of Property, "You don''t have to divide the expenses that belong only
        to the rental part of your property" (a cost of the rental activity alone is taken whole, also when the unit had
        personal use)'
    ambiguity: amb.2025.rental_direct_expenses
  - id: rental.has_insurance
    printed: (helper)
    label: 'Insurance: any'
    type: Bool
    expr:
      op: input
      source: Insurance
    cite: &id006
      doc: i1040se
      locator: p. 6, General Instructions for Lines 5 Through 21
  - id: rental.amt9
    printed: (helper)
    label: Insurance for 2025 coverage, before any division for personal use
    type: NonNegDollars
    gated_by: rental.amt9_if_any
    expr:
      op: input
      source: Insurance on it for 2025 coverage, paid in 2025 or paid earlier for more than one year (only the part for 2025;
        your share)
    cite:
      doc: p527
      locator: p. 5, Insurance premiums paid in advance, "For each year of coverage, you can deduct only the part of the premium
        payment that applies to that year"
  - id: rental.amt9_if_any
    printed: (gate)
    label: Insurance, asked only when ticked (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.has_insurance
          - const: true
        then: rental.amt9
      - guard:
          op: test
          eq:
          - rental.has_insurance
          - const: false
        then: rental.zero
    cite: *id006
  - id: rental.div9
    printed: (helper)
