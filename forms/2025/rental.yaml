    - when: rental.stay7_if_short
      form: 'Schedule C or Schedule E with Form 8582 (not a rental activity: average stay of 7 days or less)'
      remedy: A rental whose average stay is 7 days or less is not a rental activity under the passive activity rules and
        is outside this tool.
      cite:
        doc: i8582
        locator: p. 3, Exceptions, "Figure the average period of customer use for a class of property by dividing the total
          number of days in all rental periods by the number of rentals"
    - when: rental.services
      form: Schedule C (rental with significant services)
      remedy: A rental where you provide significant services, such as maid service, is reported on Schedule C; this tool
        does not prepare it.
      cite:
        doc: i1040se
        locator: p. 5, Line 3, "If you provided significant services to the renter"
    - when: rental.under_tenth
      form: Form 8582, Part V (ownership of less than 10%)
      remedy: A rental you own less than 10% of is outside this tool.
      cite:
        doc: i8582
        locator: p. 4, Active participation, "in the activity was less than 10% (by value) of all interests in the activity"
    - when: rental.not_for_profit
      form: Not rented for profit (Schedule 1, line 8l and Schedule A)
      remedy: Property not rented for profit is reported differently and is outside this tool.
      cite:
        doc: p527
        locator: p. 17, Not Rented for Profit
    - when: rental.depletion
      form: Schedule E, line 18 (depletion)
      remedy: Depletion is outside this tool.
      cite:
        doc: i1040se
        locator: p. 6, Line 18, "Depletion"
    - when: rental.part_home
      form: Schedule E, Part I (rental of part of a property you also live in)
      remedy: Renting out part of a home or building you also live in, such as a room, is outside this tool.
      cite:
        doc: i1040se
        locator: p. 6, Renting out part of your home
    - when: rental.held_for_sale
      form: Form 8582 exceptions, or Schedule C (property held mainly for sale, or offered in business hours to many customers)
      remedy: Property held mainly to sell, as an investment or by a real estate dealer, and property offered during
        business hours to many customers may not be a rental activity, and are outside this tool.
      cite:
        doc: i8582
        locator: p. 3, Exceptions, "The rental of property is incidental to an activity of holding property for investment";
          i1040se p. 6, "Do not use Schedule E to report income and expenses from rentals of real estate you held for sale
          to customers in the ordinary course of your business as a real estate dealer"
    - when: rental.business_incidental
      form: Form 8582 exceptions (rental incidental to a trade or business)
      remedy: Property mainly used in a business you or your spouse own, and rented for under 2% of its cost or value, is
        not a rental activity under the passive activity rules and is outside this tool.
      cite:
        doc: i8582
        locator: p. 3, Exceptions, "The rental of property is incidental to a trade or business activity if"
    - when: rental.vehicle
      form: Schedule E, line 6 (auto and travel)
      remedy: Car, truck and travel expenses of a rental are outside this tool.
      cite:
        doc: i1040se
        locator: p. 4, Line 6
    - when: rental.ws51
      form: Pub. 527, Worksheet 5-1 (dwelling unit used as a home)
      remedy: A home you also lived in or used for more than the greater of 14 days or 10% of the days rented, and rented
        15 days or more, is outside this tool.
      cite:
        doc: p527
        locator: p. 28, Used as a home and rented 15 days or more
  - id: rental.line3
    printed: '3'
    label: Rents received
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.excluded
          - const: true
        then: rental.zero
      - guard:
          op: test
          eq:
          - rental.excluded
          - const: false
        then: rental.rents
    cite: *id002
  - id: rental.line21
    printed: '21'
    label: Subtract line 20 from line 3 (rents)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.excluded
          - const: true
        then: rental.zero
      - guard:
          op: test
          eq:
          - rental.excluded
          - const: false
        then: rental.line21_full
    cite:
      doc: i1040se
      locator: 'p. 5, Line 2, "do not report the rental income and do not deduct any rental expenses"; p. 7, Line 21, "If you have amounts for which you are not at risk, use Form 6198 to determine the amount of your deductible loss"'
  - id: rental.net_income
    printed: IV/V (a)
    label: Current year net income
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rental.line21
      take: rental.zero
    cite: &id016
      doc: i8582
      locator: p. 10, Part IV, "You find these amounts in Part VII, column (c), of your 2024 Form 8582"
  - id: rental.net_loss
    printed: IV/V (b)
    label: Current year net loss
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rental.zero
      take: rental.line21
    cite: *id016
  - id: rental.prior_any
    printed: (helper)
    label: A loss from this rental held back on the 2024 return
    type: Bool
    expr:
      op: input
      source: Was a loss from this rental held back (not deducted) on any of your (or, on a joint return, your
        spouse's) earlier returns, even a separate one?
    cite: *id016
  - id: rental.prior_amt
    printed: (helper)
    label: Prior years unallowed loss
    type: NonNegDollars
    gated_by: rental.prior_amt_if_any
    expr:
      op: input
      source: The loss held back for this rental, from your 2024 Form 8582, Part VII, column (c)
    cite: *id016
  - id: rental.prior_amt_if_any
    printed: (gate)
    label: Prior years unallowed loss, asked only when a loss was held back (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.prior_any
          - const: true
        then: rental.prior_amt
      - guard:
          op: test
          eq:
          - rental.prior_any
          - const: false
        then: rental.zero
    cite: *id016
  - id: rental.prior_ws51
    printed: (helper)
    label: Part of the carryover is expenses carried over from a year the filer also used it as a home (Worksheet 5-1)
    type: Bool
    gated_by: rental.prior_ws51_if_any
    expr:
      op: input
      source: Did any of the held-back loss come from rental costs carried over from an earlier year when the place counted as your
        home through personal use (by you, a co-owner, a relative, or anyone paying below a fair rent) (Pub. 527, Worksheet
        5-1)?
    cite:
      doc: p527
      locator: p. 28, "The excess expenses that can’t be used to offset income from other sources are carried forward to the
        next year and treated as rental expenses for the same property"
  - id: rental.prior_ws51_if_any
    printed: (gate)
    label: Asked only when a loss or cost was carried over (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.prior_any
          - const: true
        then: rental.prior_ws51
      - guard:
          op: test
          eq:
          - rental.prior_any
          - const: false
        then: rental.no
    cite:
      doc: p527
      locator: p. 28, Used as a home and rented 15 days or more
  - id: rental.prior_not_active
    printed: (helper)
    label: Part of the held-back loss arose in a year without active participation
    type: Bool
    gated_by: rental.prior_not_active_if_both
    expr:
      op: input
      source: Did any of that held-back loss come from a year when neither you nor your spouse helped make its decisions,
        or when you and your spouse together owned under 10% of it at some time?
    cite:
      doc: i8582
      locator: p. 10, Part IV, "Don’t enter a prior-year unallowed loss in column (c) of Part IV unless you actively participated
        in the activity in both the year the loss arose and the current tax year"
  - id: rental.prior_not_active_if_both
    printed: (gate)
    label: Asked only of an actively managed rental with a held-back loss (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.prior_and_active
          - const: true
        then: rental.prior_not_active
      - guard:
          op: test
          eq:
          - rental.prior_and_active
          - const: false
        then: rental.no
    cite:
      doc: i8582
      locator: p. 4, Part IV
  - id: rental.prior_and_active
    printed: (helper)
    label: A held-back loss on a rental with active participation
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - rental.prior_any
        - const: true
      - op: test
        eq:
        - rental.active
        - const: true
    cite:
      doc: i8582
      locator: p. 4, Part IV
  - id: rental.prior_loss
    printed: IV/V (c)
    label: Prior years unallowed loss
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.reported
          - const: true
        then: rental.prior_amt_if_any
      - guard:
          op: test
          eq:
          - rental.reported
          - const: false
        then: rental.zero
    cite: *id016
    refuses:
    - when: rental.prior_not_active_if_both
      form: Form 8582, Part IV and Part V (prior-year loss from a year without active participation)
      remedy: A held-back loss from a year in which you did not actively participate is outside this tool.
      cite:
        doc: i8582
        locator: p. 4, Part IV
    - when: rental.prior_ws51_if_any
      form: Pub. 527, Worksheet 5-1 (expenses carried over from a year of home use)
      remedy: Rental costs carried over from an earlier year's Worksheet 5-1, when the place counted as your home, are
        outside this tool.
      cite:
        doc: p527
        locator: p. 28, "This limitation will apply to expenses carried forward to another year even if you don’t use
          the property as your home for that subsequent year"
  - id: rental.part4
    printed: (gate)
    label: 'Actively participated, and not a separate filer who lived with the spouse: Part IV (otherwise Part V)'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - rental.active
        - const: true
      - op: test
        eq:
        - f8582.mfs_together
        - const: false
    cite:
      doc: i8582
      locator: p. 10, Part IV, "Individuals and qualifying estates who actively participated in rental real estate activities
        must include the income or loss from those activities in Part IV"; p. 10, Part IV, Caution, "Married individuals who
        file separate returns and lived with their spouses at any time during the tax year don't qualify under the active
        participation rule and must use Part V instead of Part IV."
  - id: rental.loss_sum
    printed: (helper)
    label: Net loss plus prior years unallowed loss
    type: NonNegDollars
    expr:
      op: sum
      of:
      - rental.net_loss
      - rental.prior_loss
    cite:
      doc: i8582
      locator: p. 13, Part VIII—Allowed Losses, "enter the net loss plus the prior-year unallowed loss for the activity"
  - id: rental.overall_loss
    printed: IV/V (e)
    label: Overall loss
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rental.loss_sum
      take: rental.net_income
    cite:
      doc: i8582
      locator: p. 10, Columns (d) and (e), "Combine income and losses in columns (a) through (c) for each activity"
  - id: rental.p6_loss
    printed: VI (a)
    label: 'Part VI: overall loss of an activity with active participation'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.part4
          - const: true
        then: rental.overall_loss
      - guard:
          op: test
          eq:
          - rental.part4
          - const: false
        then: rental.zero
    cite:
      doc: i8582
      locator: p. 12, Part VI, "Enter the overall loss from column (e) of Part IV for each activity"
  - id: rental.p6c
    printed: VI (c)
    label: 'Part VI: special allowance'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.p6_on
          - const: true
        then: rental.p6c_share
      - guard:
          op: test
          eq:
          - rental.p6_on
          - const: false
        then: rental.zero
    cite:
      doc: i8582
      locator: p. 12, Part VI, "Multiply each ratio in column (b) by the amount on Part II, line 9"
  - id: rental.p6_on
    printed: (helper)
    label: 'Part VI applies to this activity: an overall loss in Part IV and an amount on line 9'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        gt:
        - rental.p6_loss
        - const: 0
      - op: test
        gt:
        - f8582.line9
        - const: 0
    cite:
      doc: i8582
      locator: p. 12, Part VI, "Use Part VI to allocate the special allowance on Part II, line 9"
  - id: rental.p6c_share
    printed: (helper)
    label: 'Part VI: line 9 times this activity’s ratio'
    type: NonNegDollars
    expr:
      op: prorate
      amount: f8582.line9
      part: rental.p6_loss
      whole: f8582.p6_total
      places: 6
    cite:
      doc: i8582
      locator: p. 12, Part VI, "Divide each of the individual losses shown in column (a) by the total of all the losses in
        column (a)"
    ambiguity: amb.2025.f8582_ratio_places
  - id: rental.p7a
    printed: VII (a)
    label: 'Part VII: loss (Part VI column (d), or Part V column (e))'
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rental.overall_loss
      take: rental.p6c
    cite:
      doc: i8582
      locator: p. 12, Part VII—Allocation of Unallowed Losses
  - id: rental.p7c
    printed: VII (c)
    label: 'Part VII: unallowed loss'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.p7_on
          - const: true
        then: rental.p7c_share
      - guard:
          op: test
          eq:
          - rental.p7_on
          - const: false
        then: rental.zero
    cite:
      doc: i8582
      locator: p. 13, Column (c), "Multiply each ratio in column (b) by the amount on line C above"
  - id: rental.p7_on
    printed: (helper)
    label: 'Part VII applies to this activity: a loss in Part VII column (a) and an unallowed amount on line C'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        gt:
        - rental.p7a
        - const: 0
      - op: test
        gt:
        - f8582.p7_C
        - const: 0
    cite:
      doc: i8582
      locator: p. 12, Part VII—Allocation of Unallowed Losses
  - id: rental.p7c_share
    printed: (helper)
    label: 'Part VII: line C times this activity’s ratio'
    type: NonNegDollars
    expr:
      op: prorate
      amount: f8582.p7_C
      part: rental.p7a
      whole: f8582.p7_total
      places: 6
    cite:
      doc: i8582
      locator: p. 13, Column (c), "Subtract line B from line A"
    ambiguity: amb.2025.f8582_ratio_places
  - id: rental.loss_after_p7
    printed: (helper)
    label: Loss with prior-year unallowed loss, less the Part VII unallowed loss (the loss line 22 reports)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rental.loss_sum
      take: rental.p7c
    cite:
      doc: i8582
      locator: p. 13, Part VIII—Allowed Losses, "Subtract column (b) from column (a)"
  - id: rental.p7_listed
    printed: (helper)
    label: 'Listed in Part VII: a loss in Part VII column (a)'
    type: Bool
    expr:
      op: test
      gt:
      - rental.p7a
      - const: 0
    cite:
      doc: i8582
      locator: p. 12, Part VII, "Complete Part VII if any activities have an overall loss in column (e) of Part V or losses
        in column (d) of Part VI"
  - id: rental.allowed
    printed: VIII (c)
    label: 'Part VIII: loss allowed (only for an activity listed in Part VII, a loss in its column (a); zero otherwise)'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.p7_listed
          - const: true
        then: rental.loss_after_p7
      - guard:
          op: test
          eq:
          - rental.p7_listed
          - const: false
        then: rental.zero
    cite:
      doc: i8582
      locator: p. 13, Part VIII—Allowed Losses, "Use Part VIII for any activity listed in Part VII"; p. 12, Part VII,
        "Complete Part VII if any activities have an overall loss in column (e) of Part V or losses in column (d) of
        Part VI", so an activity with no loss in Part VII column (a) has no Part VIII entry
  - id: rental.carryforward
    printed: VIII (b)
    label: Unallowed loss carried to 2026
    type: NonNegDollars
    display: 'Keep this amount: it is the loss held back for this rental, entered next year.'
    expr:
      op: copy
      from: rental.p7c
    cite:
      doc: i8582
      locator: p. 13, Part VIII—Allowed Losses, "Keep a record of these amounts so the losses can be used to figure your PAL
        next year"
  - id: rental.not_at_risk
    printed: (helper)
    label: Some investment not at risk
    type: Bool
    gated_by: rental.not_at_risk_if_loss
    expr:
      op: input
      source: Is any money you put in, or any debt on it, owed by no one personally (other than a mortgage on it from a bank,
        government or other regular lender), protected from loss by a guarantee, stop-loss or similar arrangement, or lent
        by someone with a stake in it?
    cite:
      doc: i1040se
      locator: p. 3, At-Risk Rules, "In most cases, you are not at risk for amounts such as the following", and Qualified
        nonrecourse financing
  - id: rental.not_at_risk_if_loss
    printed: (gate)
    label: Asked only when the property has a loss (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - rental.has_loss
          - const: true
        then: rental.not_at_risk
      - guard:
          op: test
          eq:
          - rental.has_loss
          - const: false
        then: rental.no
    cite:
      doc: i1040se
      locator: p. 7, Line 21, "If you have amounts for which you are not at risk, use Form 6198 to determine the amount of
        your deductible loss"
  - id: rental.has_loss
    printed: (helper)
    label: Line 21 is a loss
    type: Bool
    expr:
      op: test
      lt:
      - rental.line21
      - const: 0
    cite:
      doc: i1040se
      locator: p. 7, Line 21
  - id: rental.nondep
    printed: (helper)
    label: 'Rental of nondepreciable property: land only, or less than 30% of the unadjusted basis subject to depreciation'
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - rental.is_land
        - const: true
      - op: test
        eq:
        - rental.land_heavy_if_built
        - const: true
    cite: *id017
  - id: rental.nondep_gain
    printed: (helper)
    label: Net passive income including prior-year unallowed losses (net income less the prior years unallowed loss)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: rental.net_income
      take: rental.prior_loss
    cite:
      doc: p925
      locator: p. 16, Rental of Nondepreciable Property, "If you have net passive income (including prior-year unallowed
        losses) from renting property in a rental activity"
  - id: rental.nondep_income
    printed: (gate)
    label: 'Net passive income from a rental of nondepreciable property, recharacterized as nonpassive, on a return that
      must file Form 8582'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - rental.nondep
        - const: true
      - op: test
        gt:
        - rental.nondep_gain
        - const: 0
      - op: test
        eq:
        - f8582.required
        - const: true
    cite:
      doc: p925
      locator: p. 15, Recharacterization of Passive Income, "If the result is net income, don’t enter any of the income or
        losses from the activity or property on Form 8582 or its separate parts, as they are recharacterized as nonpassive";
        p. 16, Rental of Nondepreciable Property
  - id: rental.line22
    printed: '22'
    label: Deductible rental real estate loss after limitation, if any, on Form 8582
    type: Dollars
    expr:
      op: subtract
      from: rental.zero
      take: rental.loss_after_p7
    cite:
      doc: i1040se
      locator: p. 8, Line 22
    refuses:
    - when: rental.not_at_risk_if_loss
      form: Form 6198 (at-risk limits)
      remedy: A rental loss with an amount not at risk is outside this tool.
      cite:
        doc: i1040se
        locator: p. 2, At-Risk Rules
    - when: rental.nondep_income
      form: Form 8582 (rental of nondepreciable property, income recharacterized as nonpassive)
      remedy: Net income from renting land, or property whose buildings were under 30% of its cost, is treated as
        nonpassive when Form 8582 limits other losses, and is outside this tool.
      cite: *id017
  - id: rental.dep_prior
    printed: (helper)
    label: MACRS on buildings placed in service before 2025
    type: NonNegDollars
    expr:
      op: sum_over
      collection: rprop
      field: rprop.dep
      where:
        op: test
        eq:
        - rprop.placed_this_year
        - const: false
    cite:
      doc: i4562
      locator: p. 9, Line 17
  - id: rental.dep_res25
    printed: (helper)
    label: MACRS on residential rental property placed in service in 2025
    type: NonNegDollars
    expr:
      op: sum_over
      collection: rprop
      field: rprop.dep
      where:
        op: test
        all:
        - op: test
          eq:
          - rprop.placed_this_year
          - const: true
        - op: test
          eq:
          - rprop.kind
          - const: residential
    cite:
      doc: i4562
      locator: p. 9, Lines 19a Through 19j
  - id: rental.dep_non25
    printed: (helper)
    label: MACRS on nonresidential real property placed in service in 2025
    type: NonNegDollars
    expr:
      op: sum_over
      collection: rprop
      field: rprop.dep
      where:
        op: test
        all:
        - op: test
          eq:
          - rprop.placed_this_year
          - const: true
        - op: test
          eq:
          - rprop.kind
          - const: nonresidential
    cite:
      doc: i4562
      locator: p. 9, Lines 19a Through 19j
  - id: rental.count25
    printed: (helper)
    label: Buildings or improvements placed in service in 2025, one cent each
    type: NonNegDollars
    expr:
      op: sum_over
      collection: rprop
      field: rprop.placed_this_year_cent
    cite:
      doc: i1040se
      locator: p. 7, Line 18, "You must complete and attach Form 4562 only if"
  - id: rental.needs_4562
    printed: (helper)
    label: Form 4562 is needed for this property
    type: Bool
    expr:
      op: test
      gt:
      - rental.count25
      - const: 0
    cite:
      doc: i1040se
      locator: p. 7, Line 18, "You must complete and attach Form 4562 only if"
  collection:
    cite:
      doc: i1040se
      locator: p. 5, Line 1a
