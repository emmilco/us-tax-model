form:
  id: f8962
  kind: form
  title: Form 8962, Premium Tax Credit (Parts I to III)
  tax_year: 2025
  note: Prepared when there is a Form 1095-A. Parts IV and V (allocation, year of marriage), coverage of someone not lawfully
    present, QSEHRA and individual coverage HRAs, unpaid premiums and advance payments for someone in no tax family are refused;
    married filing separately is refused for the whole return.
  lines:
  - id: f8962.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: f8962
      locator: p. 1, Part I, line 3, "Household income. Add the amounts on lines 2a and 2b. See instructions"
  - id: f8962.forms
    printed: (helper)
    label: Number of Forms 1095-A
    type: Count
    expr:
      op: sum_over
      collection: f1095a
      field: f1095a.one
    cite:
      doc: i8962
      locator: p. 15, Column (a), "If you have more than one Form 1095-A, add the amounts together and enter the total on
        Form 8962, line 11, column (a)."
  - id: f8962.any
    printed: (helper)
    label: Any Form 1095-A, so Form 8962 is prepared
    type: Bool
    expr:
      op: test
      gt:
      - f8962.forms
      - const: 0
        type: Count
    cite:
      doc: i8962
      locator: p. 3, Who Must File, "You are taking the PTC."
  - id: f8962.alloc
    printed: (gate)
    label: A policy shared with another tax family, or a divorce or separation in 2025 with a shared policy
    type: Bool
    expr:
      op: input
      source: Did any Form 1095-A policy cover someone in your tax family and also someone who is not in it (for example a
        former spouse, or a child someone else claims), or were you divorced or legally separated during 2025 while enrolled
        in a policy with your former spouse?
    cite:
      doc: i8962
      locator: p. 12, Allocating policy amounts, "The policy covered at least one individual in your tax family and at least
        one individual in another tax family"
  - id: f8962.married_in_2025
    printed: (gate)
    label: Married during 2025 with coverage before the first full month of marriage
    type: Bool
    expr:
      op: input
      source: Did you and your spouse marry during 2025, and was anyone in your tax family enrolled in a Marketplace plan
        before your first full month of marriage?
    cite:
      doc: i8962
      locator: p. 13, Table 4, "Was anyone in your tax family enrolled in a qualified health plan before your first full month
        of marriage?"
  - id: f8962.marriage
    printed: (gate)
    label: A joint return with Marketplace coverage before the first full month of a 2025 marriage
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f1040.status
        - const: mfj
      - op: test
        eq:
        - f8962.married_in_2025
        - const: true
    cite:
      doc: i8962
      locator: p. 13, Table 4, "Was anyone in your tax family enrolled in a qualified health plan before your first full month
        of marriage?"
  - id: f8962.other
    printed: (gate)
    label: Coverage this tool does not reconcile (not lawfully present, an HRA, unpaid premiums, no tax family)
    type: Bool
    expr:
      op: input
      source: 'Does any of these apply: someone enrolled was not lawfully present in the United States; you or a family member
        were offered or covered by a qualified small employer HRA (QSEHRA, W-2 box 12 code FF) or an individual coverage HRA
        for 2025; any part of a month''s premium was not paid by the due date of your return, or a Form 1095-A shows zero
        in column A for a month whose premium you paid; or advance payments were made for someone who is in no one''s tax
        family?'
    cite:
      doc: i8962
      locator: p. 6, "Individuals who are not lawfully present in the United States are not eligible for the PTC for their
        coverage in a qualified health plan through a Marketplace."; p. 3, "If you were covered under an individual coverage
        HRA for 2025, you are not allowed a PTC for your 2025 Marketplace health insurance."; p. 1, "If the QSEHRA is affordable
        for a month, no PTC is allowed for the month."; p. 4, Enrollment premiums, "You are generally not allowed a monthly
        credit amount for the month if any part of that month"
  - id: f8962.two_counted
    printed: (gate)
    label: Column B counted on two Forms 1095-A from the same state for the same month
    type: Bool
    expr:
      op: test
      all:
      - op: test
        gt:
        - f8962.forms
        - const: 1
          type: Count
      - op: test
        eq:
        - f8962.same_state_counted
        - const: true
    cite:
      doc: i8962
      locator: p. 15, Column (b), "Enter the amount from column B of only one Form 1095-A—do not add the amounts from each
        form."
  - id: f8962.same_state_counted
    printed: (gate)
    label: Did you count column B on two Forms 1095-A from the same state that show coverage in the same month?
    type: Bool
    expr:
      op: input
      source: Of the Forms 1095-A whose column B you counted, do two from the same state show coverage in the same month?
    cite:
      doc: i8962
      locator: p. 16, Column (b), "If you have more than one Form 1095-A showing coverage in a particular month, use the following
        rules to determine the amounts to enter on Form 8962, column (b), for that month."
  - id: f8962.deps
    printed: (helper)
    label: Dependents you claim
    type: Count
    expr:
      op: sum_over
      collection: dependent
      field: dependent.one
      where:
        op: test
        eq:
        - dependent.claimed
        - const: true
    cite:
      doc: i8962
      locator: p. 3, Terms You May Need To Know, "Your dependents whom you claim on your 2025 tax return."
  - id: f8962.line1
    printed: '1'
    label: Tax family size
    shown_when: f8962.any
    type: Count
    expr:
      op: sum
      of:
      - household.persons
      - f8962.deps
    cite:
      doc: f8962
      locator: p. 1, Part I, line 1, "Tax family size. Enter your tax family size. See instructions"
  - id: f8962.ws1_1
    printed: (helper)
    label: 'Worksheet 1-1, line 1: AGI (Form 1040 line 11a)'
    type: Dollars
    expr:
      op: copy
      from: f1040.line11a
    cite:
      doc: i8962
      locator: p. 8, Worksheet 1-1, line 1, "Enter your AGI* from Form 1040, 1040-SR, or 1040-NR, line 11a"
  - id: f8962.ws1_2
    printed: (helper)
    label: 'Worksheet 1-1, line 2: tax-exempt interest (Form 1040 line 2a)'
    type: NonNegDollars
    expr:
      op: copy
      from: f1040.line2a
    cite:
      doc: i8962
      locator: p. 8, Worksheet 1-1, line 2, "Enter any tax-exempt interest from Form 1040, 1040-SR, or 1040-NR, line 2a"
  - id: f8962.ws1_3
    printed: (helper)
    label: 'Worksheet 1-1, line 3: Form 2555 amounts (zero after the screen)'
    type: NonNegDollars
    expr:
      op: copy
      from: f8962.zero
    cite:
      doc: i8962
      locator: p. 8, Worksheet 1-1, line 3, "Enter any amounts from Form 2555, lines 45 and 50"
    refuses:
    - when: sa.excluded_income
      form: Form 2555
      remedy: The foreign earned income and housing exclusions (Form 2555) are outside this tool.
      cite:
        doc: i8962
        locator: p. 8, Worksheet 1-1, line 3, "Enter any amounts from Form 2555, lines 45 and 50"
  - id: f8962.ws1_4
    printed: (helper)
    label: 'Worksheet 1-1, line 4: social security benefits not taxed (line 6a less line 6b)'
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f1040.line6a
      take: f1040.line6b
    cite:
      doc: i8962
      locator: p. 8, Worksheet 1-1, line 4, "If line 6a is more than line 6b, subtract line 6b from line 6a and enter the
        result"
  - id: f8962.line2a
    printed: 2a
    label: Modified AGI (Worksheet 1-1, line 5)
    shown_when: f8962.any
    type: Dollars
    expr:
      op: sum
      of:
      - f8962.ws1_1
      - f8962.ws1_2
      - f8962.ws1_3
      - f8962.ws1_4
    cite:
      doc: i8962
      locator: p. 8, Worksheet 1-1, line 5, "Add lines 1 through 4. Enter here and on Form 8962, line 2a"
  - id: f8962.line2b
    printed: 2b
    label: Dependents' modified AGI (dependents required to file because of their income)
    shown_when: f8962.any
    type: Dollars
    expr:
      op: sum_over
      collection: dependent
      field: dependent.ptc_magi_counted
      where:
        op: test
        eq:
        - dependent.claimed
        - const: true
    cite:
      doc: i8962
      locator: p. 8, Line 2b, "Only include your dependents who are required to file an income tax return because their income
        meets the income tax return filing threshold.", "Do not include the modified AGI of dependents who are filing a tax
        return only to claim a refund of tax withheld or estimated tax."
    ambiguity: amb.2025.ptc_dependent_filing
  - id: f8962.income_total
    printed: (helper)
    label: Lines 2a and 2b combined
    type: Dollars
    expr:
      op: sum
      of:
      - f8962.line2a
      - f8962.line2b
    cite:
      doc: i8962
      locator: p. 8, Line 3, "Combine them even if one or both of them are negative. If the total is less than zero, enter
        -0- on line 3."
  - id: f8962.line3
    printed: '3'
    label: Household income
    shown_when: f8962.any
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8962.income_total
      take: f8962.zero
    cite:
      doc: i8962
      locator: p. 8, Line 3, "Combine them even if one or both of them are negative. If the total is less than zero, enter
        -0- on line 3."
  - id: f8962.fpl_table
    printed: (gate)
    label: Which federal poverty table applies (contiguous, alaska or hawaii)
    type: Enum(ptc_fpl_table)
    expr:
      op: input
      source: 'Which federal poverty table applies: alaska if you, or your spouse on a joint return, lived in Alaska during
        2025; otherwise hawaii if either of you lived in Hawaii during 2025; otherwise contiguous (the 48 contiguous states
        and the District of Columbia)'
    cite:
      doc: i8962
      locator: p. 8, Line 4, "use the table with the higher dollar amounts for your family size."
  - id: f8962.big_family
    printed: (gate)
    label: Tax family size above 20
    type: Bool
    expr:
      op: test
      gt:
      - f8962.line1
      - const: 20
        type: Count
    cite:
      doc: i8962
      locator: p. 8, Line 4, Table 1-1, "If your family size was more than 8 people"
  - id: f8962.line4
    printed: '4'
    label: Federal poverty line
    shown_when: f8962.any
    type: NonNegDollars
    expr:
      op: keyed_lookup
      table: ptc_poverty_line
      keys:
      - f8962.fpl_table
      - f8962.line1
    cite:
      doc: i8962
      locator: p. 8, Line 4, "use the table with the higher dollar amounts for your family size."
    refuses:
    - when: f8962.big_family
      form: Form 8962 line 4 for a tax family of more than 20
      remedy: The poverty table here stops at a family of 20; use the footnote to Table 1-1, 1-2 or 1-3.
      cite:
        doc: i8962
        locator: p. 8, Line 4, Table 1-1, "If your family size was more than 8 people"
  - id: f8962.line5
    printed: '5'
    label: Household income as a percentage of the federal poverty line (Worksheet 2)
    shown_when: f8962.any
    type: Count
    expr:
      op: percent_floor
      part: f8962.line3
      whole: f8962.line4
      cap: 400
    cite:
      doc: i8962
      locator: p. 9, Worksheet 2, line 4, "Enter 401 here and on line 5 of Form 8962."
  - id: f8962.aptc
    printed: (helper)
    label: Any advance payments on the Forms 1095-A
    type: Bool
    expr:
      op: test
      gt:
      - f8962.aptc_total
      - const: 0
    cite:
      doc: i8962
      locator: p. 10, "If APTC was paid for any individuals in your tax family, skip lines 7 and 8, and go to line 9."
  - id: f8962.aptc_total
    printed: (helper)
    label: Advance payments on all Forms 1095-A (line 33C)
    type: NonNegDollars
    expr:
      op: sum_over
      collection: f1095a
      field: f1095a.line33c
    cite:
      doc: i8962
      locator: p. 16, Column (f), "If you have more than one Form 1095-A, add the amounts together and enter the total on
        Form 8962, line 11, column (f)."
  - id: f8962.estimate_100
    printed: (gate)
    label: The Marketplace estimated household income of at least 100% of the poverty line
    type: Bool
    expr:
      op: input
      source: When you enrolled, did the Marketplace estimate that your household income for 2025 would be at least 100% of
        the federal poverty line for your family size?
    cite:
      doc: i8962
      locator: p. 9, "The Marketplace estimated at the time of enrollment that your household income would be at least 100%
        of the federal poverty line for your family size for 2025."
  - id: f8962.applicable
    printed: (helper)
    label: You are an applicable taxpayer (line 5 at least 100, or the Marketplace estimate exception)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        ge:
        - f8962.line5
        - const: 100
          type: Count
      - op: test
        all:
        - op: test
          eq:
          - f8962.aptc
          - const: true
        - op: test
          eq:
          - f8962.estimate_100
          - const: true
    cite:
      doc: i8962
      locator: p. 6, Applicable taxpayer, "Generally, you are an applicable taxpayer if your household income for 2025"; p.
        9, "The Marketplace estimated at the time of enrollment that your household income would be at least 100% of the federal
        poverty line for your family size for 2025."
    ambiguity: amb.2025.ptc_not_applicable
  - id: f8962.show_applicable
    printed: (helper)
    label: Lines 7 and 8 are used (a Form 1095-A and an applicable taxpayer)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.any
        - const: true
      - op: test
        eq:
        - f8962.applicable
        - const: true
    cite:
      doc: i8962
      locator: p. 10, "If you meet all of the requirements under either Estimated household income at least 100% of the federal
        poverty line or Alien lawfully present in the United States, earlier, continue to line 7."
  - id: f8962.filing
    printed: (helper)
    label: Form 8962 is completed past line 5 (a Form 1095-A, and an applicable taxpayer or advance payments)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.any
        - const: true
      - op: test
        any:
        - op: test
          eq:
          - f8962.applicable
          - const: true
        - op: test
          eq:
          - f8962.aptc
          - const: true
    cite:
      doc: i8962
      locator: p. 10, "However, if no APTC was paid for any individuals in your tax family, stop; do not complete Form 8962."
  - id: f8962.alien_below
    printed: (gate)
    label: An enrolled lawfully present alien not eligible for Medicaid because of immigration status
    type: Bool
    expr:
      op: input
      source: Was someone in your tax family who enrolled in a qualified health plan through the Marketplace lawfully present
        in the United States but not eligible for Medicaid because of their immigration status?
    cite:
      doc: i8962
      locator: p. 9, Alien lawfully present in the United States, "Certain aliens with household income below 100% of the federal
        poverty line are not eligible for Medicaid because of their immigration status."
  - id: f8962.alien_branch
    printed: (gate)
    label: A Form 1095-A, household income below 100% of the poverty line and the lawfully present alien exception
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.any
        - const: true
      - op: test
        lt:
        - f8962.line5
        - const: 100
          type: Count
      - op: test
        eq:
        - f8962.alien_below
        - const: true
    cite:
      doc: i8962
      locator: p. 9, Line 5, "If the amount on line 5 is less than 100%, you can take the PTC if you meet the requirements under
        Estimated household income at least 100% of the federal poverty line next or Alien lawfully present in the United
        States, later."
  - id: f8962.line7
    printed: '7'
    label: Applicable figure (Table 2)
    shown_when: f8962.show_applicable
    type: Rate
    expr:
      op: keyed_lookup
      table: ptc_applicable_figure
      keys:
      - f8962.line5
    cite:
      doc: i8962
      locator: p. 10, Line 7, "Enter on line 7 the decimal number from Table 2 that applies to the amount you entered on line
        5."; p. 11, Table 2, "If the amount on line 5 is 150 or less, your applicable figure is 0.0000."
  - id: f8962.line8a
    printed: 8a
    label: Annual contribution amount (line 3 times line 7, to the nearest dollar)
    shown_when: f8962.show_applicable
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8962.line3
      rate: f8962.line7
      unit: 100
    cite:
      doc: i8962
      locator: p. 12, Line 8a, "Multiply line 3 by line 7 and enter the result on line 8a, rounded to the nearest whole dollar
        amount."
  - id: f8962.line8b
    printed: 8b
    label: Monthly contribution amount (line 8a divided by 12, to the nearest dollar)
    shown_when: f8962.show_applicable
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: f8962.line8a
      rate:
        param: ptc.twelfth
      unit: 100
    cite:
      doc: i8962
      locator: p. 12, Line 8b, "Divide line 8a by 12.0 and enter the result on line 8b, rounded to the nearest whole dollar
        amount."
  - id: f8962.line9
    printed: '9'
    label: Allocating policy amounts, or the alternative calculation for year of marriage
    shown_when: f8962.filing
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - f8962.alloc
        - const: true
      - op: test
        eq:
        - f8962.marriage
        - const: true
    cite:
      doc: f8962
      locator: p. 1, Part II, line 9, "Are you allocating policy amounts with another taxpayer or do you want to use the alternative
        calculation for year of marriage? See instructions."
  - id: f8962.nonuniform
    printed: (helper)
    label: Forms 1095-A without full-year coverage and unchanged columns A and B
    type: Count
    expr:
      op: sum_over
      collection: f1095a
      field: f1095a.one
      where:
        op: test
        eq:
        - f1095a.uniform
        - const: false
    cite: &id001
      doc: i8962
      locator: p. 14, Line 10, "Check “Yes” and continue to line 11 if all of the following apply for each qualified health
        plan", "Full-year coverage with no changes on Form 1095-A, Part III, column A or B."
  - id: f8962.line10
    printed: '10'
    label: Annual calculation (every Form 1095-A has full-year coverage with no changes in columns A and B)
    shown_when: f8962.filing
    type: Bool
    expr:
      op: test
      eq:
      - f8962.nonuniform
      - const: 0
        type: Count
    cite: *id001
    ambiguity: amb.2025.ptc_annual_route
  - id: f8962.show_annual
    printed: (helper)
    label: Line 11 is used (Form 8962 completed past line 5 and line 10 Yes)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.filing
        - const: true
      - op: test
        eq:
        - f8962.line10
        - const: true
    cite: *id001
  - id: f8962.show_annual_calc
    printed: (helper)
    label: Line 11 is used and you are an applicable taxpayer
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.show_annual
        - const: true
      - op: test
        eq:
        - f8962.applicable
        - const: true
    cite:
      doc: i8962
      locator: p. 10, "If APTC was paid for any individuals in your tax family, skip lines 7 and 8, and go to line 9."
  - id: f8962.line11a
    printed: 11(a)
    label: Annual enrollment premiums (Form(s) 1095-A, line 33A)
    shown_when: f8962.show_annual
    type: NonNegDollars
    expr:
      op: sum_over
      collection: f1095a
      field: f1095a.line33a
    cite:
      doc: f8962
      locator: p. 1, Part II, line 11, "(a) Annual enrollment premiums (Form(s) 1095-A, line 33A)"
  - id: f8962.line11b
    printed: 11(b)
    label: Annual applicable SLCSP premium (Form(s) 1095-A, line 33B)
    shown_when: f8962.show_annual
    type: NonNegDollars
    expr:
      op: sum_over
      collection: f1095a
      field: f1095a.line33b
      where:
        op: test
        eq:
        - f1095a.b_used
        - const: true
    cite:
      doc: f8962
      locator: p. 1, Part II, line 11, "(b) Annual applicable SLCSP premium (Form(s) 1095-A, line 33B)"
  - id: f8962.line11c
    printed: 11(c)
    label: Annual contribution amount (line 8a)
    shown_when: f8962.show_annual_calc
    type: NonNegDollars
    expr:
      op: copy
      from: f8962.line8a
    cite:
      doc: f8962
      locator: p. 1, Part II, line 11, "(c) Annual contribution amount (line 8a)"
  - id: f8962.line11d
    printed: 11(d)
    label: Annual maximum premium assistance (subtract (c) from (b), if zero or less, enter -0-)
    shown_when: f8962.show_annual_calc
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8962.line11b
      take: f8962.line11c
    cite:
      doc: f8962
      locator: p. 1, Part II, line 11, "(d) Annual maximum premium assistance (subtract (c) from (b)"
  - id: f8962.line11e
    printed: 11(e)
    label: Annual PTC allowed (smaller of (a) or (d))
    shown_when: f8962.show_annual_calc
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - f8962.line11a
      - f8962.line11d
    cite:
      doc: f8962
      locator: p. 1, Part II, line 11, "(e) Annual PTC allowed"
  - id: f8962.line11f
    printed: 11(f)
    label: Annual advance payment of PTC (Form(s) 1095-A, line 33C)
    shown_when: f8962.show_annual
    type: NonNegDollars
    expr:
      op: copy
      from: f8962.aptc_total
    cite:
      doc: f8962
      locator: p. 1, Part II, line 11, "1095-A, line 33C)"
  - id: f8962.show_jan
    printed: (helper)
    label: 'Line 12 is used: line 10 No and coverage in January'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.filing
        - const: true
      - op: test
        eq:
        - f8962.line10
        - const: false
      - op: test
        any:
        - op: test
          gt:
          - f8962.line12a
          - const: 0
        - op: test
          gt:
          - f8962.line12b
          - const: 0
    cite:
      doc: i8962
      locator: p. 17, Column (c), "If columns (a) and (b) of any of lines 12 through 23 are blank, leave column (c) of the
        corresponding line blank."
  - id: f8962.show_jan_calc
    printed: (helper)
    label: Line 12 is used and you are an applicable taxpayer
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.show_jan
        - const: true
      - op: test
        eq:
        - f8962.applicable
        - const: true
    cite:
      doc: i8962
      locator: p. 10, "If APTC was paid for any individuals in your tax family, skip lines 7 and 8, and go to line 9."
  - id: f8962.line12a
