      op: sum
      of:
      - f8962.line12f
      - f8962.line13f
      - f8962.line14f
      - f8962.line15f
      - f8962.line16f
      - f8962.line17f
      - f8962.line18f
      - f8962.line19f
      - f8962.line20f
      - f8962.line21f
      - f8962.line22f
      - f8962.line23f
    cite:
      doc: f8962
      locator: p. 1, Part II, line 25, "Advance payment of PTC. Enter the amount from line 11, column (f), or add lines 12
        through 23, column (f), and enter the total here"
  - id: f8962.allowed
    printed: (helper)
    label: 'The PTC allowed: line 11, column (e), or lines 12 through 23, column (e), added'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8962.line10
          - const: true
        then: f8962.line11e
      - guard:
          op: test
          eq:
          - f8962.line10
          - const: false
        then: f8962.monthly_e
    cite:
      doc: f8962
      locator: p. 1, Part II, line 24, "Total PTC. Enter the amount from line 11, column (e), or add lines 12 through 23,
        column (e), and enter the total here"
  - id: f8962.line24
    printed: '24'
    label: Total PTC
    shown_when: f8962.filing
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8962.applicable
          - const: false
        then: f8962.zero
      - guard:
          op: test
          eq:
          - f8962.applicable
          - const: true
        then: f8962.allowed
    cite:
      doc: f8962
      locator: p. 1, Part II, line 24, "Total PTC. Enter the amount from line 11, column (e), or add lines 12 through 23,
        column (e), and enter the total here"
    ambiguity: amb.2025.ptc_not_applicable
    refuses: &id003
    - when: f8962.alloc
      form: Form 8962 Part IV, Allocation of Policy Amounts
      remedy: A policy shared with another tax family, and a divorce or separation in 2025, need an allocation of the policy
        amounts (Part IV), which this tool does not prepare.
      cite:
        doc: i8962
        locator: p. 12, Allocating policy amounts, "The policy covered at least one individual in your tax family and at least
          one individual in another tax family"
    - when: f8962.marriage
      form: Form 8962 Part V, Alternative Calculation for Year of Marriage
      remedy: A 2025 marriage with Marketplace coverage before the first full month of marriage needs the year-of-marriage
        rules (Part V and Pub. 974), which this tool does not prepare.
      cite:
        doc: i8962
        locator: p. 13, Table 4, "Was anyone in your tax family enrolled in a qualified health plan before your first full
          month of marriage?"
    - when: f8962.other
      form: Form 8962 with coverage outside this tool
      remedy: Coverage of someone not lawfully present, a QSEHRA or individual coverage HRA, unpaid premiums and advance payments
        for someone in no tax family need Pub. 974 rules this tool does not prepare.
      cite:
        doc: i8962
        locator: p. 6, "Individuals who are not lawfully present in the United States are not eligible for the PTC for their
          coverage in a qualified health plan through a Marketplace."
    - when: f8962.alien_branch
      form: Form 8962 for a lawfully present alien below 100% of the federal poverty line
      remedy: A lawfully present alien not eligible for Medicaid because of immigration status, with household income below
        100% of the poverty line, can be an applicable taxpayer, which this tool does not prepare.
      cite:
        doc: i8962
        locator: p. 9, Alien lawfully present in the United States, "Certain aliens with household income below 100% of the
          federal poverty line are not eligible for Medicaid because of their immigration status."
    - when: f8962.two_counted
      form: Form 8962, line 11 or 12 to 23, column (b)
      remedy: For a month that several counted Forms 1095-A from one state cover, enter column B from only one of them. Forms
        that share only some of their months need month-by-month choices this tool does not take.
      cite:
        doc: i8962
        locator: p. 15, Column (b), "Enter the amount from column B of only one Form 1095-A—do not add the amounts from each
          form."
  - id: f8962.line25
    printed: '25'
    label: Advance payment of PTC
    shown_when: f8962.filing
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f8962.line10
          - const: true
        then: f8962.line11f
      - guard:
          op: test
          eq:
          - f8962.line10
          - const: false
        then: f8962.monthly_f
    cite:
      doc: f8962
      locator: p. 1, Part II, line 25, "Advance payment of PTC. Enter the amount from line 11, column (f), or add lines 12
        through 23, column (f), and enter the total here"
    refuses: *id003
  - id: f8962.net
    printed: (helper)
    label: Form 8962 completed past line 5 and line 24 is at least line 25 (line 26 is used)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.filing
        - const: true
      - op: test
        ge:
        - f8962.line24
        - f8962.line25
    cite:
      doc: f8962
      locator: p. 1, Part II, line 26, "If line 24 equals line 25, enter -0-. Stop here. If line 25 is greater than line 24,
        leave this line blank and continue to line 27"
  - id: f8962.line26
    printed: '26'
    label: Net PTC (to Schedule 3, line 9)
    shown_when: f8962.net
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8962.line24
      take: f8962.line25
    cite:
      doc: f8962
      locator: p. 1, Part II, line 26, "Net PTC. If line 24 is greater than line 25, subtract line 25 from line 24. Enter
        the difference here and on Schedule 3 (Form 1040), line 9."
  - id: f8962.excess
    printed: (helper)
    label: Form 8962 completed past line 5 and line 25 is greater than line 24 (Part III is used)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.filing
        - const: true
      - op: test
        gt:
        - f8962.line25
        - f8962.line24
    cite:
      doc: f8962
      locator: p. 1, Part III, line 27, "Excess advance payment of PTC. If line 25 is greater than line 24, subtract line
        24 from line 25. Enter the difference here"
  - id: f8962.line27
    printed: '27'
    label: Excess advance payment of PTC
    shown_when: f8962.excess
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: f8962.line25
      take: f8962.line24
    cite:
      doc: f8962
      locator: p. 1, Part III, line 27, "Excess advance payment of PTC. If line 25 is greater than line 24, subtract line
        24 from line 25. Enter the difference here"
  - id: f8962.repay_200
    printed: (helper)
    label: Table 5 limitation, line 5 below 200
    type: NonNegDollars
    expr:
      op: param
      ref: ptc.repay_200
    cite:
      doc: i8962
      locator: p. 18, Line 28, "The excess APTC you must repay may be limited to the amounts in Table 5."
  - id: f8962.repay_300
    printed: (helper)
    label: Table 5 limitation, line 5 below 300
    type: NonNegDollars
    expr:
      op: param
      ref: ptc.repay_300
    cite:
      doc: i8962
      locator: p. 18, Line 28, "The excess APTC you must repay may be limited to the amounts in Table 5."
  - id: f8962.repay_400
    printed: (helper)
    label: Table 5 limitation, line 5 below 400
    type: NonNegDollars
    expr:
      op: param
      ref: ptc.repay_400
    cite:
      doc: i8962
      locator: p. 18, Line 28, "The excess APTC you must repay may be limited to the amounts in Table 5."
  - id: f8962.show_28
    printed: (helper)
    label: Line 28 is used (Part III, and line 5 below 400)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - f8962.excess
        - const: true
      - op: test
        lt:
        - f8962.line5
        - const: 400
          type: Count
    cite:
      doc: i8962
      locator: p. 18, Line 28, "If your entry on Form 8962, line 5, is 400 or more, there is no repayment limitation."
  - id: f8962.line28
    printed: '28'
    label: Repayment limitation (Table 5)
    shown_when: f8962.show_28
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          all:
          - op: test
            ge:
            - f8962.line5
            - const: 0
              type: Count
          - op: test
            lt:
            - f8962.line5
            - const: 200
              type: Count
        then: f8962.repay_200
      - guard:
          op: test
          all:
          - op: test
            ge:
            - f8962.line5
            - const: 200
              type: Count
          - op: test
            lt:
            - f8962.line5
            - const: 300
              type: Count
        then: f8962.repay_300
      - guard:
          op: test
          all:
          - op: test
            ge:
            - f8962.line5
            - const: 300
              type: Count
          - op: test
            lt:
            - f8962.line5
            - const: 400
              type: Count
        then: f8962.repay_400
      - guard:
          op: test
          ge:
          - f8962.line5
          - const: 400
            type: Count
        then: f8962.line27
    cite:
      doc: i8962
      locator: p. 18, Line 28, "The excess APTC you must repay may be limited to the amounts in Table 5.", "Leave line 28
        blank and enter the amount from line 27 on line 29."
  - id: f8962.line29
    printed: '29'
    label: Excess advance PTC repayment (to Schedule 2, line 1a)
    shown_when: f8962.excess
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - f8962.line27
      - f8962.line28
    cite:
      doc: f8962
      locator: p. 1, Part III, line 29, "Excess advance PTC repayment. Enter the smaller of line 27 or line 28 here and on
        Schedule 2 (Form 1040), line 1a"
