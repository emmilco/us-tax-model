        Property Half-Year Convention", "Mid-Quarter Convention Placed in Service in First Quarter", "Mid-Quarter
        Convention Placed in Service in Fourth Quarter", "Straight Line Method Half-Year Convention", "Straight Line
        Method Mid-Quarter Convention Placed in Service in First Quarter", "Table A-12. Straight Line Method
