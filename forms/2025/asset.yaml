        "Mid-Quarter Convention Placed in Service in First Quarter", "Mid-Quarter Convention Placed in Service in
        Fourth Quarter", "Straight Line Method Mid-Quarter Convention Placed in Service in First Quarter", "Table
        A-12. Straight Line Method Mid-Quarter Convention Placed in Service in Fourth Quarter"
  - id: asset.macrs_hy
