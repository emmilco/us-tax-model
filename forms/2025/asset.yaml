form:
  id: asset
  kind: form
  title: Form 4562 — one item of depreciable property (other than a vehicle) of a business
  tax_year: 2025
  note: 'One entry per item of property other than a vehicle (vehicles are scveh entries), placed in service 2005 to 2025
    and depreciated by the GDS percentage tables; its lines feed Form 4562 lines 6, 14, 17, 19 and, for listed property, lines
    25, 26 and 29 of its business. Refused: the classes outside this tool, dispositions, exchanges, real property, ADS and
    other methods, basis adjustments, amortization, listed property used 50% or less for business, and the other items of
    the screen.'
  lines:
  - id: asset.zero
    printed: (helper)
    label: Zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i4562
      locator: p. 9, Lines 19a Through 19j
  - id: asset.class
    printed: (a)
    label: Asset class of the property (Pub. 946, Appendix B)
    type: Enum(asset_class)
    expr:
      op: input
      source: 'The asset class of this property: find the property in Pub. 946 Appendix B, Table B-1, and the activity it
        is used in in Table B-2 (use the Table B-2 class when the property is specifically listed there under your activity);
        or choose A (personal property with no class life), B (qualified technological equipment), C (property used in research
        and experimentation), or qualified improvement property'
    cite:
      doc: p946
      locator: p. 98, Appendix B, How To Use the Tables; i4562 p. 10, Determining the classification
  - id: asset.period
    printed: (d)
    label: Recovery period under GDS for the asset class
    type: Enum(macrs_period)
    expr:
      op: keyed_lookup
      table: class_lives
      keys:
      - asset.class
    cite:
      doc: p946
      locator: Appendix B, Tables B-1 and B-2, GDS (MACRS) column; i4562 p. 11, Column (d)—Recovery period
  - id: asset.outside
    printed: (gate)
    label: The asset class is outside this tool
    type: Bool
    expr:
      op: test
      eq:
      - asset.period
      - const: outside
    cite:
      doc: p946
      locator: Appendix B, Tables B-1 and B-2 (farming classes, classes with footnotes, and periods other than 3 to 20 years)
  - id: asset.screen
    printed: (screen)
    label: Does any of these apply to this property?
    type: Bool
    expr:
      op: input
      source: 'Does any of these apply to this property: you disposed of it or converted it to personal use in 2025; you acquired
        it in a like-kind exchange or an involuntary conversion, from a related person, or by gift or inheritance; it is real
        property (a building or a structural component, other than qualified improvement property) or land; it is a car, truck
        or other vehicle (enter vehicles separately); you depreciate it under ADS, under an elected straight line or 150%
        declining balance method, or by a method other than the MACRS percentage tables; its basis was adjusted for anything
        other than depreciation (for example a casualty loss); it is in a general asset account; you amortize it; it is used
        predominantly outside the United States, or is tax-exempt use or tax-exempt bond financed property; it was placed
        in service before 2005; its business use percentage has changed since you placed it in service; or it is property
        with a long production period, an aircraft, or qualified production property?'
    cite:
      doc: i4562
      locator: pp. 8-12, Part III, Lines 16 to 20 and MACRS recapture; p946 p. 37, Rules Covering the Use of the
        Tables
  - id: asset.screened
    printed: (gate)
    label: This property is outside this tool
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - asset.outside
        - const: true
      - op: test
        eq:
        - asset.screen
        - const: true
    cite:
      doc: i4562
      locator: pp. 8-12, Part III
  - id: asset.placed
    printed: (b)
    label: Year placed in service
    type: Enum(placed_year)
    expr:
      op: input
      source: The year you placed this property in service in the business (2005 to 2025)
    cite:
      doc: i4562
      locator: p. 11, Column (b)—Month and year placed in service; p946 p. 39, the example of the third recovery
        year
  - id: asset.cost
    printed: (helper)
    label: Cost or other basis
    type: NonNegDollars
    expr:
      op: input
      source: The cost or other basis of the property (what you paid, including sales tax, delivery and installation; for
        property converted from personal use, the smaller of its adjusted basis or its fair market value on the date of conversion)
    cite:
      doc: i4562
      locator: p. 11, Column (c)—Basis for depreciation; p. 14, Column (d)—Cost or other basis
    refuses:
    - when: asset.screened
      form: Form 4562 property outside this tool (Pub. 946 Appendix B class, disposition, exchange, real property, ADS, other
        methods, basis adjustment, amortization and the other items of the screen)
      remedy: This property is outside the depreciation this tool covers.
      cite:
        doc: i4562
        locator: pp. 8-12, Part III, and Pub. 946 Appendix B
  - id: asset.pct
    printed: (helper)
    label: Business/investment use percentage (whole percent)
    type: Count
    expr:
      op: input
      source: The percentage of this property's use that is for this business (a whole number from 1 to 100)
    cite:
      doc: i4562
      locator: p. 11, Column (c)—Basis for depreciation, "multiply the cost or other basis of the property by the percentage
        of business/investment use"
  - id: asset.cent
    printed: (helper)
    label: One cent
    type: NonNegDollars
    expr:
      op: param
      ref: sc.one_cent
    cite:
      doc: i4562
      locator: p. 11, Column (c), percentage of business/investment use
  - id: asset.hundred
    printed: (helper)
    label: One hundred cents (100%)
    type: NonNegDollars
    expr:
      op: param
      ref: sc.hundred_cents
    cite:
      doc: i4562
      locator: p. 11, Column (c), percentage of business/investment use
  - id: asset.pct_c
    printed: (helper)
    label: The business use percentage, as cents
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: asset.cent
      count: asset.pct
    cite:
      doc: i4562
      locator: p. 11, Column (c)
  - id: asset.pct_bad
    printed: (gate)
    label: The business use percentage is more than 100
    type: Bool
    expr:
      op: test
      gt:
      - asset.pct
      - const: 100
        type: Count
    cite:
      doc: i4562
      locator: p. 11, Column (c)
  - id: asset.listed
    printed: (helper)
    label: Is this listed property?
    type: Bool
    expr:
      op: input
      source: 'Is this listed property: property used for entertainment or recreation (such as photographic, phonographic,
        communication or video recording equipment) that is not used exclusively in your business or at your regular business
        establishment, or a computer placed in service before 2018 that is not used exclusively at your regular business establishment?'
    cite:
      doc: i4562
      locator: p. 3, Listed Property and its Exceptions; p. 13, Part V
  - id: asset.half
    printed: (helper)
    label: Fifty percent, as cents
    type: NonNegDollars
    expr:
      op: param
      ref: sc.fifty_cents
    cite:
      doc: i4562
      locator: p. 14, Lines 26 and 27, "property used more than 50% in a qualified business use"
  - id: asset.over_half
    printed: (helper)
    label: Business use is more than 50%
    type: Bool
    expr:
      op: test
      gt:
      - asset.pct_c
      - asset.half
    cite:
      doc: i4562
      locator: p. 14, Lines 26 and 27; p. 3, Part I, "used predominantly (more than 50%) in your trade or business"
  - id: asset.listed_low
    printed: (gate)
    label: Listed property used 50% or less for business, or a percentage over 100
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - asset.pct_bad
        - const: true
      - op: test
        all:
        - op: test
          eq:
          - asset.listed
          - const: true
        - op: test
          eq:
          - asset.over_half
          - const: false
    cite:
      doc: i4562
      locator: p. 14, Lines 26 and 27, line 27 (ADS) and Listed property recapture
  - id: asset.basis
    printed: '(c)'
    label: Basis for depreciation (business/investment use only), before section 179 and the special allowance
    type: NonNegDollars
    expr:
      op: prorate
      amount: asset.cost
      part: asset.pct_c
      whole: asset.hundred
      places: 6
    cite:
      doc: i4562
      locator: p. 11, Column (c)—Basis for depreciation
    refuses:
    - when: asset.listed_low
      form: Listed property used 50% or less in a qualified business use (Form 4562 line 27), or a business use over 100%
      remedy: Listed property used 50% or less for business is depreciated under ADS and is outside this tool.
      cite:
        doc: i4562
        locator: p. 14, Lines 26 and 27; p. 15, Column (f), "used 50% or less ... straight line method over its ADS recovery
          period"
  - id: asset.is2025
    printed: (helper)
    label: Placed in service in 2025
    type: Bool
    expr:
      op: test
      eq:
      - asset.placed
      - const: y2025
    cite:
      doc: i4562
      locator: p. 9, Lines 19a Through 19j, "Use lines 19a through 19j only for assets placed in service during the tax year
        beginning in 2025"; Line 17
  - id: asset.on_19
    printed: (helper)
    label: Reported on lines 6, 14 and 19 (property placed in service in 2025 that is not listed property)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - asset.is2025
        - const: true
      - op: test
        eq:
        - asset.listed
        - const: false
    cite:
      doc: i4562
      locator: p. 5, Line 6, "Do not include any listed property on line 6"; p. 9, Lines 19a Through 19j, "Use lines 19a through 19j
        only for assets placed in service during the tax year beginning in 2025"
  - id: asset.on_17
    printed: (helper)
    label: Reported on line 17 (property placed in service before 2025 that is not listed property)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - asset.is2025
        - const: false
      - op: test
        eq:
        - asset.listed
        - const: false
    cite:
      doc: i4562
      locator: p. 9, Line 17
  - id: asset.on_26_2025
    printed: (helper)
    label: Reported on lines 25 and 26 column (i) (listed property placed in service in 2025)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - asset.is2025
        - const: true
      - op: test
        eq:
        - asset.listed
        - const: true
    cite:
      doc: i4562
      locator: p. 13, Part V and Line 25
  - id: asset.year
    printed: (helper)
    label: Year of recovery in 2025
    type: Count
    expr:
      op: keyed_lookup
      table: recovery_year
      keys:
      - asset.placed
    cite:
      doc: p946
      locator: p. 37, Using the MACRS Percentage Tables
  - id: asset.last
    printed: (helper)
    label: Last year of recovery for the recovery period
    type: Count
    expr:
      op: keyed_lookup
      table: macrs_last_year
      keys:
      - asset.period
    cite:
      doc: p946
      locator: Appendix A, Tables A-1 to A-5 and A-8 to A-12
  - id: asset.done
    printed: (helper)
    label: The recovery period ended before 2025
    type: Bool
    expr:
      op: test
      gt:
      - asset.year
      - asset.last
    cite:
      doc: p946
      locator: p. 37, Using the MACRS Percentage Tables
  - id: asset.quarter
    printed: (helper)
    label: Quarter of 2025 in which the property was placed in service
    type: Enum(quarter)
    expr:
      op: input
      source: 'The quarter of 2025 in which you placed this property in service: January to March, April to June, July to
        September, or October to December'
    cite:
      doc: p946
      locator: p. 41, Using the Applicable Convention, Mid-quarter convention, "A calendar year is divided into the following
        quarters"
  - id: asset.qconv
    printed: (helper)
    label: Mid-quarter convention for that quarter
    type: Enum(macrs_convention)
    expr:
      op: keyed_lookup
      table: quarter_convention
      keys:
      - asset.quarter
    cite:
      doc: i4562
      locator: p. 11, Column (e)—Convention, Mid-quarter convention
  - id: asset.s179
    printed: 6(c)
    label: Section 179 elected cost
    shown_when: asset.on_19
    type: NonNegDollars
    expr:
      op: input
      source: The amount of this property's cost you elect to expense under section 179 (zero if none; not more than its business
        cost)
    cite:
      doc: i4562
      locator: p. 5, Line 6, Column (c)—Elected cost
  - id: asset.s179_bad
    printed: (gate)
    label: The section 179 election is more than the business cost, or the property is not used more than 50% in the business
    type: Bool
    expr:
      op: test
      all:
      - op: test
        gt:
        - asset.s179
        - asset.zero
      - op: test
        any:
        - op: test
          gt:
          - asset.s179
          - asset.basis
        - op: test
          eq:
          - asset.over_half
          - const: false
    cite:
      doc: i4562
      locator: p. 3, Part I, "placed in service during the tax year and used predominantly (more than 50%) in your trade or
        business"; p. 5, Line 6, Column (c)
  - id: asset.after179
    printed: (helper)
    label: Basis less the section 179 election
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: asset.basis
      take: asset.s179
    cite:
      doc: i4562
      locator: p. 7, How to figure the allowance, "subtract from the business/investment portion of the cost or other basis
        of the property any credits and deductions allocable to the property ... Section 179 expense deduction"
    refuses:
    - when: asset.s179_bad
      form: Section 179 election above the business cost, or on property used 50% or less in the business
      remedy: A section 179 election must not exceed the business cost and needs more than 50% business use.
      cite:
        doc: i4562
        locator: p. 3, Part I; p. 5, Line 6, Column (c)
  - id: asset.after_jan19
    printed: (helper)
    label: Acquired after January 19, 2025
    type: Bool
    expr:
      op: input
      source: Did you acquire this property after January 19, 2025?
    cite:
      doc: i4562
      locator: p. 5, Line 14, Certain qualified property acquired after January 19, 2025, and Certain qualified property acquired
        after September 27, 2017, and before January 20, 2025
  - id: asset.bonus_choice
    printed: (helper)
    label: Special depreciation allowance for this class of property
    type: Enum(bonus_choice)
    expr:
      op: input
      source: For the class of property this belongs to (its recovery period), did you claim the special depreciation allowance
        (full), elect the 40% allowance instead of 100% for property acquired after January 19, 2025 (forty), or elect not
        to claim any special allowance (none)?
    cite:
      doc: i4562
      locator: p. 5, Line 14, "you can elect to take a 40% special depreciation allowance"; p. 7, Election out, "for any class
        of property"
  - id: asset.bonus_same
    printed: (screen)
    label: Is the choice the same for all property of this class placed in service in 2025?
    type: Bool
    expr:
      op: input
      source: Is that choice the same for all property in the same recovery period class that you (and your spouse, on a joint
        return) placed in service in 2025?
    cite:
      doc: i4562
      locator: p. 7, Election out, "for any class of property, to not deduct any special depreciation allowance for all such
        property in such class placed in service during the tax year"
  - id: asset.bonus_mixed
    printed: (gate)
    label: The special allowance choice differs within a class
    type: Bool
    expr:
      op: test
      eq:
      - asset.bonus_same
      - const: false
    cite:
      doc: i4562
      locator: p. 7, Election out
  - id: asset.rate40
    printed: (helper)
    label: 40% special allowance
    type: Rate
    expr:
      op: param
      ref: sc.bonus_rate_40
    cite:
      doc: i4562
      locator: p. 5, Line 14, "is limited to a special depreciation allowance of 40% of the depreciable basis"
  - id: asset.bonus_full
    printed: (helper)
    label: 100% special allowance
    type: NonNegDollars
    expr:
      op: copy
      from: asset.after179
    cite:
      doc: i4562
      locator: p. 5, Line 14, Certain qualified property acquired after January 19, 2025, "is eligible for a 100% special
        depreciation allowance"
    refuses:
    - when: asset.bonus_mixed
      form: Different special allowance elections within one class of property
      remedy: An election that is not the same for the whole class is outside this tool.
      cite:
        doc: i4562
        locator: p. 7, Election out
  - id: asset.bonus_forty
    printed: (helper)
    label: 40% special allowance
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: asset.after179
      rate: asset.rate40
    cite:
      doc: i4562
      locator: p. 7, How to figure the allowance, "multiplying the depreciable basis of the property by the applicable percentage"
    refuses:
    - when: asset.bonus_mixed
      form: Different special allowance elections within one class of property
      remedy: An election that is not the same for the whole class is outside this tool.
      cite:
        doc: i4562
        locator: p. 7, Election out
  - id: asset.bonus_fullcase
    printed: (helper)
    label: 'The allowance when it is claimed: 100% if acquired after January 19, 2025, otherwise 40%'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - asset.after_jan19
          - const: true
        then: asset.bonus_full
      - guard:
          op: test
          eq:
          - asset.after_jan19
          - const: false
        then: asset.bonus_forty
    cite:
      doc: i4562
      locator: p. 5, Line 14, Certain qualified property acquired after January 19, 2025, and Certain qualified property acquired
        after September 27, 2017, and before January 20, 2025
  - id: asset.bonus
    printed: '14'
    label: Special depreciation allowance for this property
    shown_when: asset.on_19
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - asset.bonus_choice
          - const: full
        then: asset.bonus_fullcase
      - guard:
          op: test
          eq:
          - asset.bonus_choice
          - const: forty
        then: asset.bonus_forty
      - guard:
          op: test
          eq:
          - asset.bonus_choice
          - const: none
        then: asset.zero
    cite:
      doc: i4562
      locator: pp. 5-7, Line 14, Qualified property and Election out
  - id: asset.f25
    printed: '25'
    label: Special depreciation allowance for this listed property (line 25)
    shown_when: asset.on_26_2025
    type: NonNegDollars
    expr:
      op: copy
      from: asset.bonus
    cite:
      doc: i4562
      locator: p. 13, Line 25
  - id: asset.f26i
    printed: 26(i)
    label: Elected section 179 cost of this listed property (column (i))
    shown_when: asset.on_26_2025
    type: NonNegDollars
    expr:
      op: copy
      from: asset.s179
    cite:
      doc: i4562
      locator: p. 16, Column (i)—Elected section 179 cost
  - id: asset.ub
    printed: (helper)
    label: Basis for MACRS depreciation (after section 179 and the special allowance)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: asset.after179
      take: asset.bonus
    cite:
      doc: i4562
      locator: p. 11, Column (c), "From that result, subtract ... Section 179 expense deduction ... Any special depreciation
        allowance included on line 14"
  - id: asset.col19c
    printed: 19(c)
    label: Basis for depreciation (business/investment use only), column (c), after the section 179 deduction and the special allowance
    shown_when: asset.on_19
    type: NonNegDollars
    expr:
      op: copy
      from: asset.ub
    cite:
      doc: i4562
      locator: p. 11, Column (c), "From that result, subtract ... Section 179 expense deduction ... Any special depreciation allowance
        included on line 14"
  - id: asset.hy
    printed: (helper)
    label: Half-year convention
    type: Enum(macrs_convention)
    expr:
      op: param
      ref: sc.conv_hy
    cite:
      doc: i4562
      locator: p. 11, Column (e)—Convention, Half-year convention
  - id: asset.rate_hy
    printed: (helper)
    label: MACRS rate, half-year convention
    type: Rate
    expr:
      op: keyed_lookup
      table: macrs_gds
      keys:
      - asset.period
      - asset.hy
      - asset.year
    cite:
      doc: i4562
      locator: p. 12, Column (g), "Multiply column (c) by the applicable rate from the appropriate table"; Pub. 946 Tables
        A-1 and A-8
  - id: asset.rate_mq
    printed: (helper)
    label: MACRS rate, mid-quarter convention
    type: Rate
    expr:
      op: keyed_lookup
      table: macrs_gds
      keys:
      - asset.period
      - asset.qconv
      - asset.year
    cite:
      doc: i4562
      locator: p. 12, Column (g); Pub. 946 Tables A-2 to A-5 and A-9 to A-12
  - id: asset.macrs_hy
    printed: (helper)
    label: MACRS depreciation, half-year convention
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: asset.ub
      rate: asset.rate_hy
    cite:
      doc: i4562
      locator: p. 12, Column (g)
  - id: asset.macrs_mq
    printed: (helper)
    label: MACRS depreciation, mid-quarter convention
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: asset.ub
      rate: asset.rate_mq
    cite:
      doc: i4562
      locator: p. 12, Column (g)
  - id: asset.macrs2025
    printed: 19(g)
    label: MACRS depreciation for 2025 property
    shown_when: asset.on_19
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - mq.applies
          - const: false
        then: asset.macrs_hy
      - guard:
          op: test
          eq:
          - mq.applies
          - const: true
        then: asset.macrs_mq
    cite:
      doc: i4562
      locator: p. 11, Column (e), "Half-year convention. This convention applies to all property reported on lines 19a through
        19h, unless the mid-quarter convention applies"
  - id: asset.mqbase
    printed: (helper)
    label: Depreciable basis for the mid-quarter test (after section 179, before the special allowance)
    type: NonNegDollars
    expr:
      op: copy
      from: asset.after179
    cite:
      doc: p946
      locator: p. 34, Which Convention Applies?, Mid-quarter convention, Caution, "reflects the reduction in basis for amounts
        expensed under section 179 and the part of the basis of property attributable to personal use. However, it does not
        reflect any reduction in basis for any special depreciation allowance"
  - id: asset.mq_q4_2025
    printed: (helper)
    label: That basis when placed in service October to December
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - asset.quarter
          - const: q1
        then: asset.zero
      - guard:
          op: test
          eq:
          - asset.quarter
          - const: q2
        then: asset.zero
      - guard:
          op: test
          eq:
          - asset.quarter
          - const: q3
        then: asset.zero
      - guard:
          op: test
          eq:
          - asset.quarter
          - const: q4
        then: asset.mqbase
    cite:
      doc: p946
      locator: p. 34, Which Convention Applies?, Mid-quarter convention, "placed in service during the last 3 months of the
        tax year"
  - id: asset.prior_conv
    printed: (e)
    label: Convention used in the year placed in service
    type: Enum(macrs_convention)
    expr:
      op: input
      source: 'The convention used for this property in the year you placed it in service: half-year, or mid-quarter with
        the quarter placed in service'
    cite:
      doc: i4562
      locator: p. 11, Column (e)—Convention; Line 17, "see the instructions for line 19, column (g)"
  - id: asset.prior_179
    printed: (helper)
    label: Section 179 deduction elected for this property in the year placed in service
    type: NonNegDollars
    expr:
      op: input
      source: The section 179 amount you elected for this property in the year you placed it in service (zero if none)
    cite:
