form:
  id: asset
  kind: form
  title: Form 4562 — one item of depreciable property (other than a vehicle) of a business
  tax_year: 2025
  note: 'One entry per item of property other than a vehicle (vehicles are scveh entries), placed in service 2005 to 2025
    and depreciated by the GDS percentage tables; its lines feed Form 4562 lines 6, 14, 17, 19 and, for listed property, lines
    25, 26 and 29 of its business. Refused: the classes outside this tool, dispositions, exchanges, real property, ADS and
    other methods, basis adjustments, amortization, listed property used 50% or less for business, and the other items of
    the screen.'
  lines:
  - id: asset.zero
    printed: (helper)
    label: Zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i4562
      locator: p. 9, Lines 19a Through 19j
  - id: asset.class
    printed: (a)
    label: Asset class of the property (Pub. 946, Appendix B)
    type: Enum(asset_class)
    expr:
      op: input
      source: 'The asset class of this property: find the property in Pub. 946 Appendix B, Table B-1, and the activity it
        is used in in Table B-2 (use the Table B-2 class when the property is specifically listed there under your activity);
        or choose A (personal property with no class life), B (qualified technological equipment), C (property used in research
        and experimentation), or qualified improvement property (an improvement you made to an interior part of a building
        that is nonresidential real property, that is section 1250 property, and that you placed in service after 2017 and
        after the date the building was first placed in service by anyone; it does not include an improvement attributable
        to the enlargement of the building, any elevator or escalator, or the internal structural framework of the building,
        nor an improvement to residential rental property: such an improvement is real property, not qualified improvement
        property)'
    cite:
      doc: p946
      locator: p. 98, Appendix B, How To Use the Tables; i4562 p. 10, Determining the classification; p946 p. 31, Qualified
        improvement property, "Generally, this is any improvement to an interior part of a building that is nonresidential
        real property, and the improvement is section 1250 property, is made by you, and is placed in service by you after
        2017 and after the date the building was first placed in service by any person", "However, a qualified improvement
        does not include any improvement for which the expenditure is attributable to any of the following" and "The enlargement
        of the building. • Any elevator or escalator. • The internal structural framework of the building"
  - id: asset.period
    printed: (d)
    label: Recovery period under GDS for the asset class
    type: Enum(macrs_period)
    expr:
      op: keyed_lookup
      table: class_lives
      keys:
      - asset.class
    cite:
      doc: p946
      locator: pp. 99–108, Table B-1, "Table B-1. Table of Class Lives and Recovery Periods", "Class Life GDS (in
        years) (MACRS) ADS", "Table B-2. Table of Class Lives and Recovery Periods" (GDS (MACRS) column); i4562 p. 11,
        Column (d)—Recovery period
  - id: asset.outside
    printed: (gate)
    label: The asset class is outside this tool
    type: Bool
    expr:
      op: test
      eq:
      - asset.period
      - const: outside
    cite:
      doc: p946
      locator: 'pp. 99–108, Table B-1, "Table B-1. Table of Class Lives and Recovery Periods", "Table B-2. Table of Class Lives and Recovery Periods", "Agriculture: 01.1", "Certain Property for Which Recovery Periods Assigned" (farming classes, classes with footnotes, and periods other than 3 to 20 years)'
  - id: asset.qip_early
    printed: (gate)
    label: Qualified improvement property placed in service before 2018
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - asset.class
        - const: cqip
      - op: test
        gt:
        - asset.year
        - const: 8
          type: Count
    cite:
      doc: i4562
      locator: p. 10, Determining the classification, "Qualified improvement property, as defined in section 168(e)(6),
        placed in service by you after December 31, 2017"
  - id: asset.screen
    printed: (screen)
    label: Does any of these apply to this property?
    type: Bool
    expr:
      op: input
      source: 'Does any of these apply to this property: you disposed of it or converted it to personal use in 2025; you acquired
        it in a like-kind exchange or an involuntary conversion, with a trade-in (you traded in other property as part of
        its price), from a related person, or by gift or inheritance; it is real
        property (a building or a structural component, other than qualified improvement property) or land; it is a car, truck
        or other vehicle (enter vehicles separately); you must depreciate it under ADS (for example, it is imported property
        covered by an executive order of the President of the United States; it is used predominantly in a farming business
        and placed in service in a tax year in which you made an election under section 263A(d)(3) not to have the uniform
        capitalization rules apply; it is qualified improvement property held by an electing real property trade or business;
        or it has a recovery period of 10 years or more and is held by an electing farming business), or you elected ADS, the
        straight line method or the 150% declining balance method for it, or you depreciate it by a method other than the MACRS
        percentage tables; it is a film, videotape or sound recording; it is computer software, unless you placed it in service
        in 2025 and deduct all of its business cost in 2025 through section 179 and the special depreciation allowance; it
        is an initial clearing and grading land improvement for gas utility property or for electric utility transmission and
        distribution plants; its basis was adjusted for anything other than depreciation (for example a casualty loss), or is
        reduced by a credit or deduction other than the section 179 deduction and the special depreciation allowance (for
        example the section 179D deduction for energy efficient commercial building property, the deduction for removal of
        barriers to the disabled and the elderly, the disabled access credit, the enhanced oil recovery credit, the credit
        for alternative fuel vehicle refueling property, the credit for employer-provided childcare facilities and services,
        or a basis adjustment for investment credit property or advanced manufacturing investment credit property); it is
        in a general asset account; you amortize it; it is used
        predominantly outside the United States, or is tax-exempt use or tax-exempt bond financed property; it was placed
        in service before 2005; its business use percentage has changed since you placed it in service; it is qualified
        reuse and recycling property (machinery or equipment used exclusively to collect, distribute or recycle reuse and
        recyclable materials, section 168(m)); you acquired it before September 28, 2017; it is property with a long
        production period, an aircraft, or qualified production property; you claim a special depreciation allowance for
        it in 2025 and its original use did not begin with you (original use is the first use to which the property is put,
        whether or not by you, so property someone else used before you acquired it is used property, and so is reconditioned
        or rebuilt property you acquired unless the cost of its used parts is not more than 20% of its total cost); you claim a special
        depreciation allowance for it in 2025 and it is property described in section 168(k)(9)(A) or 168(k)(9)(B), that is,
        property primarily used in a trade or business of furnishing or selling electrical energy, water or sewage disposal
        services, gas or steam through a local distribution system, or transportation of gas or steam by pipeline,
        whose rates are established or approved by a State or political subdivision, an agency or instrumentality of
        the United States, a public service or public utility commission or similar body of a State or political
        subdivision, or the governing or ratemaking body of an electric cooperative, or property used in a trade or
        business that has had
        floor plan financing indebtedness (a loan used to buy motor vehicles, boats, farm machinery or equipment, or
        trailers or campers held for sale or lease, and secured by them) whose interest was taken into account under
        section 163(j)(1)(C) in figuring the business interest expense limit; it is qualified rent-to-own property
        (section 168(i)(14)), energy property specified in section
        168(e)(3)(B)(vi), a motorsports entertainment complex (section 168(i)(15)), a natural gas gathering line (section
        168(i)(17)), qualified smart electric meter or qualified smart electric grid system property, or electric transmission
        property specified in section 168(e)(3)(E)(v); your 2025 tax year, or any tax year since you placed it in service,
        is shorter than 12 months; or it is listed property whose qualified business use is 50% or less once you leave out
        uses that are not qualified business use (investment use; leasing it to a 5% owner or related person, or using it
        as compensation for services of a 5% owner or related person, unless for the lease the value is reported as income
        to that person; using it as compensation for services of anyone else unless an amount is included in that person''s
        income for the use and any required income tax was withheld; and use that is nondeductible under section 274)?'
    cite:
      doc: i4562
      locator: pp. 8-12, Part III, Lines 16 to 20 and MACRS recapture; p. 7, Exceptions, "Property described in section
        168(k)(9)(A) or 168(k)(9)(B)" (the description in the question restates IRC section 168(k)(9), which is not archived);
        p. 6, "Qualified property can be either new property or certain used property"; p946 p. 31, "Original use means the
        first use to which the property is put, whether or not by you"; p. 8, Line 16, "Computer software.
        Use the straight line method over 36 months"; p. 9, "However, MACRS does not apply to films, videotapes, and sound
        recordings"; p. 10, "Initial clearing and grading land improvements for gas utility property"; p. 11, Column (c),
        "The following are examples of some credits and deductions that reduce the basis for depreciation"; p. 12, "The
        following types of property must be depreciated under ADS"; pp. 10-11, Column (a)—Classification of property and
        Column (f)—Method; p. 14,
        Lines 26 and 27, "Generally, a qualified business use is any use in your trade or business. However, it does not
        include any of the following"; p946 p. 37, Rules Covering the Use of the Tables, "You cannot use the percentage
        tables for a short tax year", and p. 46, Property Placed in Service Before a Short Tax Year; p946 p. 17, Trade-in of
        other property, "If you buy qualifying property with cash and a trade-in, its cost for purposes of the section 179
        deduction includes only the cash you paid"; i4562 p. 14, "If you acquired the property through a trade-in, special
        rules apply for determining the basis, recovery period, depreciation method, and convention"
  - id: asset.screened
    printed: (gate)
    label: This property is outside this tool
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - asset.outside
        - const: true
      - op: test
        eq:
        - asset.qip_early
        - const: true
      - op: test
        eq:
        - asset.screen
        - const: true
    cite:
      doc: i4562
      locator: pp. 8-12, Part III
  - id: asset.placed
    printed: (b)
    label: Year placed in service
    type: Enum(placed_year)
    expr:
      op: input
      source: The year you placed this property in service in the business (2005 to 2025). Property is placed in service
        when it is ready and available for a specific use, even if you have not yet used it; property you converted from
        personal use to use in the business is placed in service on the date of the conversion
    cite:
      doc: i4562
      locator: p. 11, Column (b)—Month and year placed in service; p946 p. 39, Using the MACRS Percentage Tables, the example of the third recovery year;
        p946 p. 32, "The placed in service date for your property is the date the property is ready and available for a specific
        use. It is therefore not necessarily the date it is first used." and "If you converted property held for personal use
        to use in a trade or business or for the production of income, treat the property as being placed in service on the
        conversion date"
  - id: asset.cost
    printed: (helper)
    label: Cost or other basis
    type: NonNegDollars
    expr:
      op: input
      source: The cost or other basis of the property (what you paid, including sales tax, delivery and installation; for
        property converted from personal use, the smaller of its adjusted basis or its fair market value on the date of conversion)
    cite:
      doc: i4562
      locator: p. 11, Column (c)—Basis for depreciation; p. 14, Column (d)—Cost or other basis
    refuses:
    - when: asset.screened
      form: Form 4562 property outside this tool (Pub. 946 Appendix B class, qualified improvement property placed in
        service before 2018, disposition, exchange, real property, reuse and recycling property, an acquisition before
        September 28, 2017, ADS, other methods, basis adjustment, amortization, a short tax year and the other items of
        the screen)
      remedy: This property is outside the depreciation this tool covers.
      cite:
        doc: i4562
        locator: pp. 8-12, Part III, and Pub. 946 Appendix B
  - id: asset.pct
    printed: (helper)
    label: Business/investment use percentage (whole percent)
    type: Count
    expr:
      op: input
      source: 'The percentage of this property''s use that is for this business (a whole number from 1 to 100). For listed
        property, measure the use by the time the property is actually used (rather than merely being available for use),
        in the most appropriate unit of time. For listed property you converted from personal use to business use during
        2025, figure the percentage only for the months you used it in the business, multiply it by the number of those months
        and divide by 12.'
    cite:
      doc: i4562
      locator: p. 11, Column (c)—Basis for depreciation, "multiply the cost or other basis of the property by the percentage
        of business/investment use"; p. 14, Column (c)—Business/investment use percentage, "allocate the use based on the
        most appropriate unit of time the property is actually used (rather than merely being available for use)" and "If during the tax year you
        convert property used solely for personal purposes to business/investment use (or vice versa), figure the percentage
        of business/investment use only for the number of months you use the property in your business or for the production
        of income"
  - id: asset.cent
    printed: (helper)
    label: One cent
    type: NonNegDollars
    expr:
      op: param
      ref: sc.one_cent
    cite:
      doc: i4562
      locator: p. 11, Column (c), percentage of business/investment use
  - id: asset.hundred
    printed: (helper)
    label: One hundred cents (100%)
    type: NonNegDollars
    expr:
      op: param
      ref: sc.hundred_cents
    cite:
      doc: i4562
      locator: p. 11, Column (c), percentage of business/investment use
  - id: asset.pct_c
    printed: (helper)
    label: The business use percentage, as cents
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: asset.cent
      count: asset.pct
    cite:
      doc: i4562
      locator: p. 11, Column (c)
  - id: asset.pct_bad
    printed: (gate)
    label: The business use percentage is more than 100
    type: Bool
    expr:
      op: test
      gt:
      - asset.pct
      - const: 100
        type: Count
    cite:
      doc: i4562
      locator: p. 11, Column (c)
  - id: asset.listed
    printed: (helper)
    label: Is this listed property?
    type: Bool
    expr:
      op: input
      source: 'Is this listed property: property used for entertainment or recreation (such as photographic, phonographic,
        communication or video recording equipment) that is not used exclusively in your business or at your regular business
        establishment, or a computer placed in service before 2018 that is not used exclusively at your regular business establishment?
        A part of your home is your regular business establishment only if that part meets the requirements for deducting
        expenses for the business use of a home.'
    cite:
      doc: i4562
      locator: p. 3, Listed Property and its Exceptions, "a portion of the taxpayer’s home is treated as a regular business
        establishment only if that portion meets the requirements for deducting expenses attributable to the business use
        of a home"; p. 13, Part V
  - id: asset.half
    printed: (helper)
    label: Fifty percent, as cents
    type: NonNegDollars
    expr:
      op: param
      ref: sc.fifty_cents
    cite:
      doc: i4562
      locator: p. 14, Lines 26 and 27, "property used more than 50% in a qualified business use"
  - id: asset.over_half
    printed: (helper)
    label: Business use is more than 50%
    type: Bool
    expr:
      op: test
      gt:
      - asset.pct_c
      - asset.half
    cite:
      doc: i4562
      locator: p. 14, Lines 26 and 27; p. 3, Part I, "used predominantly (more than 50%) in your trade or business"
  - id: asset.listed_low
    printed: (gate)
    label: Listed property used 50% or less for business, or a percentage over 100
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - asset.pct_bad
        - const: true
      - op: test
        all:
        - op: test
          eq:
          - asset.listed
          - const: true
        - op: test
          eq:
          - asset.over_half
          - const: false
    cite:
      doc: i4562
      locator: p. 14, Lines 26 and 27, line 27 (ADS) and Listed property recapture
  - id: asset.basis
    printed: '(c)'
    label: Basis for depreciation (business/investment use only), before section 179 and the special allowance
    type: NonNegDollars
    expr:
      op: prorate
      amount: asset.cost
      part: asset.pct_c
      whole: asset.hundred
      places: 6
    cite:
      doc: i4562
      locator: p. 11, Column (c)—Basis for depreciation
    refuses:
    - when: asset.listed_low
      form: Listed property used 50% or less in a qualified business use (Form 4562 line 27), or a business use over 100%
      remedy: Listed property used 50% or less for business is depreciated under ADS and is outside this tool.
      cite:
        doc: i4562
        locator: p. 14, Lines 26 and 27; p. 15, Column (f)—Recovery period, "For property placed in service after 1986 and
          used 50% or less in a qualified business use, depreciate the property using the straight line method over its ADS
          recovery period"
  - id: asset.is2025
    printed: (helper)
    label: Placed in service in 2025
    type: Bool
    expr:
      op: test
      eq:
      - asset.placed
      - const: y2025
    cite:
      doc: i4562
      locator: p. 9, Lines 19a Through 19j, "Use lines 19a through 19j only for assets placed in service during the
        tax year beginning in 2025"; p. 9, Line 17, "For tangible property placed in service in tax years beginning
        before 2025 and depreciated under MACRS"
  - id: asset.on_19
    printed: (helper)
    label: Reported on lines 6, 14 and 19 (property placed in service in 2025 that is not listed property)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - asset.is2025
        - const: true
      - op: test
        eq:
        - asset.listed
        - const: false
    cite:
      doc: i4562
      locator: p. 5, Line 6, "Do not include any listed property on line 6"; p. 9, Lines 19a Through 19j, "Use lines 19a through 19j
        only for assets placed in service during the tax year beginning in 2025"
  - id: asset.on_17
    printed: (helper)
    label: Reported on line 17 (property placed in service before 2025 that is not listed property)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - asset.is2025
        - const: false
      - op: test
        eq:
        - asset.listed
        - const: false
    cite:
      doc: i4562
      locator: p. 9, Line 17
  - id: asset.on_26_2025
    printed: (helper)
    label: Reported on lines 25 and 26 column (i) (listed property placed in service in 2025)
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - asset.is2025
        - const: true
      - op: test
        eq:
        - asset.listed
        - const: true
    cite:
      doc: i4562
      locator: p. 13, Part V and Line 25
  - id: asset.year
    printed: (helper)
    label: Year of recovery in 2025
    type: Count
    expr:
      op: keyed_lookup
      table: recovery_year
      keys:
      - asset.placed
    cite:
      doc: p946
      locator: p. 37, Using the MACRS Percentage Tables
  - id: asset.last
    printed: (helper)
    label: Last year of recovery for the recovery period
    type: Count
    expr:
      op: keyed_lookup
      table: macrs_last_year
      keys:
      - asset.period
    cite:
      doc: p946
      locator: pp. 71–84, Table A-1 to Table A-5 and Table A-8 to Table A-12, "3-, 5-, 7-, 10-, 15-, and 20-Year
        Property Half-Year Convention", "Mid-Quarter Convention Placed in Service in First Quarter", "Mid-Quarter
        Convention Placed in Service in Fourth Quarter", "Depreciation rate for recovery period", "Straight Line
        Method Half-Year Convention", "Straight Line Method Mid-Quarter Convention Placed in Service in First
        Quarter", "Table A-12. Straight Line Method Mid-Quarter Convention Placed in Service in Fourth Quarter",
        "Recovery periods in years" (the last year printed for the recovery period)
  - id: asset.done
    printed: (helper)
    label: The recovery period ended before 2025
    type: Bool
    expr:
      op: test
      gt:
      - asset.year
      - asset.last
    cite:
      doc: p946
      locator: p. 37, Using the MACRS Percentage Tables
    refuses:
    - when: asset.screened
      form: Form 4562 property outside this tool (Pub. 946 Appendix B class, qualified improvement property placed in
        service before 2018, disposition, exchange, real property, reuse and recycling property, an acquisition before
        September 28, 2017, ADS, other methods, basis adjustment, amortization, a short tax year and the other items of
        the screen)
      remedy: This property is outside the depreciation this tool covers.
      cite:
        doc: i4562
        locator: pp. 8-12, Part III, and Pub. 946 Appendix B
    - when: asset.listed_low
      form: Listed property used 50% or less in a qualified business use (Form 4562 line 27), or a business use over 100%
      remedy: Listed property used 50% or less for business is depreciated under ADS and is outside this tool.
      cite:
        doc: i4562
        locator: p. 15, "used 50% or less in a qualified business use, depreciate the property using the straight line
          method over its ADS recovery period"
  - id: asset.quarter
    printed: (helper)
    label: Quarter of 2025 in which the property was placed in service
    type: Enum(quarter)
    expr:
      op: input
      source: 'The quarter of 2025 in which you placed this property in service: January to March, April to June, July to
        September, or October to December'
    cite:
      doc: p946
      locator: p. 41, Using the Applicable Convention, Mid-quarter convention, "A calendar year is divided into the following
        quarters"
  - id: asset.qconv
    printed: (helper)
    label: Mid-quarter convention for that quarter
    type: Enum(macrs_convention)
    expr:
      op: keyed_lookup
      table: quarter_convention
      keys:
      - asset.quarter
    cite:
      doc: i4562
      locator: p. 11, Column (e)—Convention, Mid-quarter convention
  - id: asset.s179
    printed: 6(c)
    label: Section 179 elected cost
    shown_when: asset.on_19
    type: NonNegDollars
    expr:
      op: input
      source: 'The amount of this property''s cost you elect to expense under section 179 (zero if none; not more than its
        business cost). Only section 179 property qualifies: property you acquired by purchase for use in the active conduct
        of your business that is tangible personal property or off-the-shelf computer software, or other tangible property
        (not a building or its structural components) used as an integral part of manufacturing, production or extraction
        or of furnishing transportation, communications, electricity, gas, water or sewage disposal services (or as a research
        or bulk storage facility used with those activities), a storage facility (other than a building or its structural
        components) used in connection with distributing petroleum or any primary product of petroleum, or qualified improvement
        property you elect to treat as section 179 property. Enter zero for land and land improvements (such as swimming pools, paved parking areas, wharves, docks,
        bridges and fences), property held for investment, and property you purchased and lease to others, unless you manufactured
        or produced it, or the lease term is less than 50% of its class life and for the first 12 months after the transfer
        to the lessee your deductions for it as trade or business expenses (other than rents and reimbursed amounts) are more
        than 15% of its rental income. Also enter zero for property used by a tax-exempt organization (unless used in connection
        with the production of income subject to the tax on unrelated trade or business income) and property used by a governmental
        unit or a foreign person or entity (unless used under a lease with a term of less than 6 months).'
    cite:
      doc: i4562
      locator: p. 5, Line 6, Column (c)—Elected cost; pp. 2-3, Section 179 property, "Section 179 property is property
        that you acquire by purchase for use in the active conduct of your trade or business", "Storage facilities (except
        buildings and their structural components) used in connection with distributing petroleum or any primary product of
        petroleum", "Property held for investment
        (section 212 property)" and "for taxpayers other than a corporation, this election does not apply to any section 179
        property you purchased and leased to others unless"; p946 p. 17, "Land and land improvements do not qualify as section
        179 property" and "you cannot elect the section 179 deduction for the following property"
  - id: asset.not179
    printed: (helper)
    label: This property is not section 179 property
    type: Bool
    expr:
      op: input
      source: 'Is this property one that does not qualify for the section 179 deduction: a land improvement (such as a swimming
        pool, paved parking area, wharf, dock, bridge or fence); property held for investment; property you purchased and
        lease to others, unless you manufactured or produced it, or the lease term (including options to renew) is less than
        50% of its class life and for the first 12 months after the transfer to the lessee your business deductions for it
        (other than rents and reimbursed amounts) are more than 15% of its rental income; property used by a tax-exempt organization,
        unless used in connection with the production of income subject to the tax on unrelated trade or business income;
        or property used by a governmental unit or a foreign person or entity, unless used under a lease with a term of less
        than 6 months?'
    cite:
      doc: p946
      locator: p. 17, What Property Does Not Qualify?, "Land and land improvements do not qualify as section 179 property",
        "Even if the requirements explained earlier under What Property Qualifies? are met, you cannot elect the section 179
        deduction for the following property" and Leased property; i4562 p. 2, "Property held for investment (section 212
        property)"; i4562 p. 3, "for taxpayers other than a corporation, this election does not apply to any section 179
        property you purchased and leased to others unless"; i4562 p. 4, Line 2, "Enter the total cost of all section 179
        property you placed in service during the tax year"
  - id: asset.s179_bad
    printed: (gate)
    label: The section 179 election is more than the business cost, the property is not used more than 50% in the business,
      or it is not section 179 property
    type: Bool
    expr:
      op: test
      all:
      - op: test
        gt:
        - asset.s179
        - asset.zero
      - op: test
        any:
        - op: test
          gt:
          - asset.s179
          - asset.basis
        - op: test
          eq:
          - asset.over_half
          - const: false
        - op: test
          eq:
          - asset.not179
          - const: true
    cite:
      doc: i4562
      locator: p. 3, Part I, "placed in service during the tax year and used predominantly (more than 50%) in your trade or
        business"; p. 5, Line 6, Column (c); p946 p. 17, "Land and land improvements do not qualify as section 179 property"
        and "you cannot elect the section 179 deduction for the following property"
  - id: asset.after179
    printed: (helper)
    label: Basis less the section 179 election
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: asset.basis
      take: asset.s179
    cite:
      doc: i4562
      locator: p. 7, How to figure the allowance, "subtract from the business/investment portion of the cost or other basis
        of the property any credits and deductions allocable to the property ... Section 179 expense deduction"
    refuses:
    - when: asset.s179_bad
      form: Section 179 election above the business cost, on property used 50% or less in the business, or on property that
        is not section 179 property
      remedy: A section 179 election must not exceed the business cost, needs more than 50% business use, and is allowed
        only for section 179 property.
      cite:
        doc: i4562
        locator: p. 3, Part I; p. 5, Line 6, Column (c); p946 p. 17, What Property Does Not Qualify?
  - id: asset.after_jan19
    printed: (helper)
    label: Acquired after January 19, 2025
    type: Bool
    expr:
      op: input
      source: Did you acquire this property after January 19, 2025? (Property acquired before September 28, 2017 is
        screened out above.)
    cite:
      doc: i4562
      locator: p. 5, Line 14, Certain qualified property acquired after January 19, 2025, and Certain qualified property acquired
        after September 27, 2017, and before January 20, 2025
  - id: asset.bonus_choice
    printed: (helper)
    label: Special depreciation allowance for this class of property
    type: Enum(bonus_choice)
    expr:
      op: input
      source: For the class of property this belongs to (its recovery period), did you claim the special depreciation allowance
        (full), elect the 40% allowance instead of 100% for property acquired after January 19, 2025 (forty), or elect not
        to claim any special allowance (none)?
    cite:
      doc: i4562
      locator: pp. 5–6, Line 14, "you can elect to take a 40% special depreciation allowance"; p. 7, Election out, "for any class
        of property"
  - id: asset.bonus_same
    printed: (screen)
    label: Is the choice the same for all property of this class placed in service in 2025?
    type: Bool
    expr:
      op: input
      source: Is that choice the same for all property in the same recovery period class that you (and your spouse, on a joint
        return) placed in service in 2025?
    cite:
      doc: i4562
      locator: p. 7, Election out, "for any class of property, to not deduct any special depreciation allowance for all such
        property in such class placed in service during the tax year"
  - id: asset.bonus_mixed
    printed: (gate)
    label: The special allowance choice differs within a class
    type: Bool
    expr:
      op: test
      eq:
      - asset.bonus_same
      - const: false
    cite:
      doc: i4562
      locator: p. 7, Election out
  - id: asset.rate40
    printed: (helper)
    label: 40% special allowance
    type: Rate
    expr:
      op: param
      ref: sc.bonus_rate_40
    cite:
      doc: i4562
      locator: pp. 5–6, Line 14, "is limited to a special depreciation allowance of 40% of the depreciable basis"
  - id: asset.bonus_full
    printed: (helper)
    label: 100% special allowance
    type: NonNegDollars
    expr:
      op: copy
      from: asset.after179
    cite:
      doc: i4562
      locator: pp. 5–6, Line 14, Certain qualified property acquired after January 19, 2025, "is eligible for a 100% special
        depreciation allowance"
    refuses:
    - when: asset.bonus_mixed
      form: Different special allowance elections within one class of property
      remedy: An election that is not the same for the whole class is outside this tool.
      cite:
        doc: i4562
        locator: p. 7, Election out
  - id: asset.bonus_forty
    printed: (helper)
    label: 40% special allowance
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: asset.after179
      rate: asset.rate40
    cite:
      doc: i4562
      locator: p. 7, How to figure the allowance, "multiplying the depreciable basis of the property by the applicable percentage"
    refuses:
    - when: asset.bonus_mixed
      form: Different special allowance elections within one class of property
      remedy: An election that is not the same for the whole class is outside this tool.
      cite:
        doc: i4562
        locator: p. 7, Election out
  - id: asset.bonus_fullcase
