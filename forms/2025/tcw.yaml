      cite: { doc: i1040gi, locator: 'p. 80, Section D—Use if your filing status is Head of household, row 4, "Over $250,500 but not over $626,350", "(c) Multiply (a) by (b)", "× 35% (0.35)"' }
    - id: hoh.row4.tax
      printed: "Tax"
