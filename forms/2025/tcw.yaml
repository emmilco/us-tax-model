# Tax Computation Worksheet—Line 16 (Stage 1).
#
# Modeled from the printed worksheet (i1040gi p. 80): four sections by filing
# status (A single, B married filing jointly or qualifying surviving spouse,
# C married filing separately, D head of household), five rows per section.
# Each row multiplies the amount by its rate and subtracts its amount.

def:
  id: tcw
  kind: def
  title: "Tax Computation Worksheet—Line 16"
  tax_year: 2025
  parameters: [amount, status]
  lines:

    - id: amount
      printed: "(a)"
      label: "Enter the amount from line 15"
      type: NonNegDollars
      expr: { op: input, source: "Bound by the calling line (the amount whose tax is computed)." }
      cite: { doc: i1040gi, locator: "TCW, column (a)" }

    - id: status
      printed: "(status)"
      label: "Use the section for your filing status"
      type: Enum(filing_status)
      expr: { op: input, source: "Bound by the calling line (Form 1040 filing status)." }
      cite: { doc: i1040gi, locator: "TCW, sections A-D" }

    # Section A — Single
    - id: single.row1.product
      printed: "(c)"
      label: "Multiply line (a) by 22% (0.22)"
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "amount", rate: { param: "tcw.single.b1.rate" } }
      cite: { doc: i1040gi, locator: "TCW Section A, row 1" }
    - id: single.row1.tax
      printed: "(d)"
      label: "Subtract (d) from (c)"
      type: Dollars
      expr: { op: subtract, from: "single.row1.product", take: { param: "tcw.single.b1.subtract" } }
      cite: { doc: i1040gi, locator: "TCW Section A, row 1" }
    - id: single.row2.product
      printed: "(c)"
      label: "Multiply line (a) by 24% (0.24)"
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "amount", rate: { param: "tcw.single.b2.rate" } }
      cite: { doc: i1040gi, locator: "TCW Section A, row 2" }
