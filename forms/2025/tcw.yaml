# Tax Computation Worksheet—Line 16 (Stage 1).
#
# Modeled from the printed worksheet (i1040gi p. 80): four sections by filing
# status (A single, B married filing jointly or qualifying surviving spouse,
# C married filing separately, D head of household), five rows per section.
# Each row multiplies the amount by its rate and subtracts its amount. The
# page's columns are (a) the amount, (b) the multiplication amount, (c) the
# product, (d) the subtraction amount and an unlettered "Tax." column for the
# result; (b) and (d) are year parameters named inline, (c) and Tax are lines
# keyed to those column headings.

def:
  id: tcw
  kind: def
  title: "Tax Computation Worksheet—Line 16"
  tax_year: 2025
  parameters: [amount, status]
  lines:

    - id: amount
      printed: "(a)"
      label: "Enter the amount from line 15"
      type: NonNegDollars
      expr: { op: input, source: "Bound by the calling line (the amount whose tax is computed)." }
      cite: { doc: i1040gi, locator: "TCW, column (a)" }

    - id: status
      printed: "(status)"
      label: "Use the section for your filing status"
      type: Enum(filing_status)
      expr: { op: input, source: "Bound by the calling line (Form 1040 filing status)." }
      cite: { doc: i1040gi, locator: "TCW, sections A-D" }

    # Section A — Single
    - id: single.row1.product
      printed: "(c)"
      label: "Multiply line (a) by 22% (0.22)"
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "amount", rate: { param: "tcw.single.b1.rate" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 1, "At least $100,000 but not over $103,350", "(c) Multiply (a) by (b)", "× 22% (0.22)"' }
    - id: single.row1.tax
      printed: "Tax"
      label: "Tax. Subtract (d) from (c). Enter the result here and on the entry space on line 16."
      type: Dollars
      expr: { op: subtract, from: "single.row1.product", take: { param: "tcw.single.b1.subtract" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 1, "At least $100,000 but not over $103,350", "$ 5,086.00", "Tax. Subtract (d) from (c)"' }
    - id: single.row2.product
      printed: "(c)"
      label: "Multiply line (a) by 24% (0.24)"
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "amount", rate: { param: "tcw.single.b2.rate" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 2, "Over $103,350 but not over $197,300", "(c) Multiply (a) by (b)", "× 24% (0.24)"' }
    - id: single.row2.tax
      printed: "Tax"
      label: "Tax. Subtract (d) from (c). Enter the result here and on the entry space on line 16."
      type: Dollars
      expr: { op: subtract, from: "single.row2.product", take: { param: "tcw.single.b2.subtract" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 2, "Over $103,350 but not over $197,300", "$ 7,153.00", "Tax. Subtract (d) from (c)"' }
    - id: single.row3.product
      printed: "(c)"
      label: "Multiply line (a) by 32% (0.32)"
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "amount", rate: { param: "tcw.single.b3.rate" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 3, "Over $197,300 but not over $250,525", "(c) Multiply (a) by (b)", "× 32% (0.32)"' }
    - id: single.row3.tax
      printed: "Tax"
      label: "Tax. Subtract (d) from (c). Enter the result here and on the entry space on line 16."
      type: Dollars
      expr: { op: subtract, from: "single.row3.product", take: { param: "tcw.single.b3.subtract" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 3, "Over $197,300 but not over $250,525", "$ 22,937.00", "Tax. Subtract (d) from (c)"' }
    - id: single.row4.product
      printed: "(c)"
      label: "Multiply line (a) by 35% (0.35)"
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "amount", rate: { param: "tcw.single.b4.rate" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 4, "Over $250,525 but not over $626,350", "(c) Multiply (a) by (b)", "× 35% (0.35)"' }
    - id: single.row4.tax
      printed: "Tax"
      label: "Tax. Subtract (d) from (c). Enter the result here and on the entry space on line 16."
      type: Dollars
      expr: { op: subtract, from: "single.row4.product", take: { param: "tcw.single.b4.subtract" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 4, "Over $250,525 but not over $626,350", "$ 30,452.75", "Tax. Subtract (d) from (c)"' }
    - id: single.row5.product
      printed: "(c)"
      label: "Multiply line (a) by 37% (0.37)"
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "amount", rate: { param: "tcw.single.b5.rate" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 5, "Over $626,350", "(c) Multiply (a) by (b)", "× 37% (0.37)"' }
    - id: single.row5.tax
      printed: "Tax"
      label: "Tax. Subtract (d) from (c). Enter the result here and on the entry space on line 16."
      type: Dollars
      expr: { op: subtract, from: "single.row5.product", take: { param: "tcw.single.b5.subtract" } }
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, row 5, "Over $626,350", "$ 42,979.75", "Tax. Subtract (d) from (c)"' }
    - id: single.result
      printed: "Tax"
      label: "Section A—Use if your filing status is Single. Tax. Subtract (d) from (c). Enter the result here and on the entry space on line 16."
      type: Dollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              all:
                - { op: test, ge: ["amount", { param: "ordinary.table_boundary" }] }
                - { op: test, le: ["amount", { param: "tcw.single.b1.upper" }] }
            then: "single.row1.tax"
          - guard:
              op: test
              all:
                - { op: test, gt: ["amount", { param: "tcw.single.b1.upper" }] }
                - { op: test, le: ["amount", { param: "tcw.single.b2.upper" }] }
            then: "single.row2.tax"
          - guard:
              op: test
              all:
                - { op: test, gt: ["amount", { param: "tcw.single.b2.upper" }] }
                - { op: test, le: ["amount", { param: "tcw.single.b3.upper" }] }
            then: "single.row3.tax"
          - guard:
              op: test
              all:
                - { op: test, gt: ["amount", { param: "tcw.single.b3.upper" }] }
                - { op: test, le: ["amount", { param: "tcw.single.b4.upper" }] }
            then: "single.row4.tax"
          - guard: { op: test, gt: ["amount", { param: "tcw.single.b4.upper" }] }
            then: "single.row5.tax"
      cite: { doc: i1040gi, locator: 'p. 80, Section A—Use if your filing status is Single, "Complete the row below that applies to you", "Tax. Subtract (d) from (c)"' }

