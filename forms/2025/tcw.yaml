          - guard: { op: test, eq: ["status", { const: "qss" }] }
            then: "mfj.result"
          - guard: { op: test, eq: ["status", { const: "mfs" }] }
            then: "mfs.result"
          - guard: { op: test, eq: ["status", { const: "hoh" }] }
            then: "hoh.result"
