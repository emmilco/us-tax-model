form:
  id: k1s
  kind: form
  title: Schedule K-1 (Form 1120-S), Shareholder's Share of Income, Deductions, Credits, etc., one per S corporation
  tax_year: 2025
  note: One entry per Schedule K-1 (Form 1120-S) a person received. Boxes 1 to 5b, 7 to 8c, 13 code O, 16 codes A to D and
    17 code V are entered; each box 1, 2 and 3 is one activity. Box 1 is passive or nonpassive by material participation tests
    1, 3, 5 and 6; box 2 is in Form 8582 Part IV with active participation. Losses are limited by stock basis on the K-1's
    Form 7203 (collection f7203); the passive activity limitation (Form 8582) is applied by the return-level forms from the
    lines exposed here. Boxes 6, 9 to 12, 13 (other codes), 14, 15, 16 E and F and 17 (other codes), more than one activity,
    a disposition of stock, at-risk amounts, losses carried from earlier years by basis or at-risk limits and the other material
    participation tests are refused.
  lines:
  - id: k1s.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Ordinary business income (loss)"
  - id: k1s.no
    printed: (helper)
    label: Year parameter s3.no (false)
    type: Bool
    expr:
      op: param
      ref: s3.no
    cite:
      doc: i1120ssk
      locator: p. 6, Specific Instructions, "If you are an individual, and the above limitations don’t apply to the amounts
        shown on your Schedule K-1, take the amounts shown and report them on the appropriate lines of your tax return"
  - id: k1s.multi
    printed: 18, 19
    label: Box 18 or box 19 is checked (more than one activity for at-risk or passive activity purposes)
    type: Bool
    expr:
      op: input
      source: Is box 18 or box 19 of this Schedule K-1 checked (the corporation has more than one activity)?
    cite:
      doc: i1120ssk
      locator: p. 19, Box 18. More Than One Activity for At-Risk Purposes, "When the corporation has more than one activity
        for at-risk purposes, it will check this box and attach a statement"; p. 19, Box 19. More Than One Activity for Passive
        Activity Purposes, "When the corporation has more than one activity for passive activity purposes, it will check this
        box and attach a statement"
  - id: k1s.disposed
    printed: (screen)
    label: Sold or otherwise disposed of stock of the corporation in 2025, or had stock redeemed
    type: Bool
    expr:
      op: input
      source: In 2025, did you sell, give away or otherwise dispose of any of your shares in this corporation, or did it buy
        any back from you?
    cite:
      doc: i7203
      locator: p. 1, Who Must File, "Disposed of stock in an S corporation (whether or not gain is recognized)"; i7203 p.
        3, Line 13, "If a portion of your stock is redeemed, sold, or otherwise disposed of during the year, attach two"
  - id: k1s.box1_any
    printed: '1'
    label: Box 1 (ordinary business income (loss)) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 1 of this Schedule K-1 (ordinary business income or loss) show an amount?
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Ordinary business income (loss)"
  - id: k1s.box2_any
    printed: '2'
    label: Box 2 (net rental real estate income (loss)) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 2 of this Schedule K-1 (net rental real estate income or loss) show an amount?
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Net rental real estate income (loss)"
  - id: k1s.box3_any
    printed: '3'
    label: Box 3 (other net rental income (loss)) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 3 of this Schedule K-1 (other net rental income or loss) show an amount?
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Other net rental income (loss)"
  - id: k1s.box4_any
    printed: '4'
    label: Box 4 (interest income) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 4 of this Schedule K-1 (interest income) show an amount?
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Interest income"
  - id: k1s.box5_any
    printed: 5a
    label: Box 5a (ordinary dividends) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 5a of this Schedule K-1 (ordinary dividends) show an amount?
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Ordinary dividends"
  - id: k1s.box1
    printed: '1'
    label: Ordinary business income (loss)
    type: Dollars
    gated_by: k1s.box1_if_any
    expr:
      op: input
      source: What amount is in box 1 (ordinary business income or loss)? Enter a loss as a negative number.
    cite: &id001
      doc: i1120ssk
      locator: p. 6, Box 1. Ordinary Business Income (Loss), "Report box 1 income (loss) from corporate trade or business
        activities in which you materially participated in column (i) or (k) of Schedule E (Form 1040), line 28"
  - id: k1s.box1_if_any
    printed: (gate)
    label: Box 1, asked only when box 1 shows an amount (zero otherwise)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box1_any
          - const: true
        then: k1s.box1
      - guard:
          op: test
          eq:
          - k1s.box1_any
          - const: false
        then: k1s.zero
    cite: *id001
  - id: k1s.box2
    printed: '2'
    label: Net rental real estate income (loss)
    type: Dollars
    gated_by: k1s.box2_if_any
    expr:
      op: input
      source: What amount is in box 2 (net rental real estate income or loss)? Enter a loss as a negative number.
    cite: &id002
      doc: i1120ssk
      locator: p. 6, Box 2. Net Rental Real Estate Income (Loss), "Generally, the income (loss) reported in box 2 is a passive
        activity amount for all shareholders"
  - id: k1s.box2_if_any
    printed: (gate)
    label: Box 2, asked only when box 2 shows an amount (zero otherwise)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box2_any
          - const: true
        then: k1s.box2
      - guard:
          op: test
          eq:
          - k1s.box2_any
          - const: false
        then: k1s.zero
    cite: *id002
  - id: k1s.box3
    printed: '3'
    label: Other net rental income (loss)
    type: Dollars
    gated_by: k1s.box3_if_any
    expr:
      op: input
      source: What amount is in box 3 (other net rental income or loss)? Enter a loss as a negative number.
    cite: &id003
      doc: i1120ssk
      locator: p. 7, Box 3. Other Net Rental Income (Loss), "The amount in box 3 is a passive activity amount for all shareholders"
  - id: k1s.box3_if_any
    printed: (gate)
    label: Box 3, asked only when box 3 shows an amount (zero otherwise)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box3_any
          - const: true
        then: k1s.box3
      - guard:
          op: test
          eq:
          - k1s.box3_any
          - const: false
        then: k1s.zero
    cite: *id003
  - id: k1s.box4
    printed: '4'
    label: Interest income
    type: NonNegDollars
    gated_by: k1s.box4_if_any
    expr:
      op: input
      source: What amount is in box 4 (interest income)?
    cite: &id004
      doc: i1120ssk
      locator: p. 7, Box 4. Interest Income, "Report interest income on Form 1040 or 1040-SR, line 2b"
  - id: k1s.box4_if_any
    printed: (gate)
    label: Box 4, asked only when box 4 shows an amount (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box4_any
          - const: true
        then: k1s.box4
      - guard:
          op: test
          eq:
          - k1s.box4_any
          - const: false
        then: k1s.zero
    cite: *id004
  - id: k1s.box5a
    printed: 5a
    label: Ordinary dividends
    type: NonNegDollars
    gated_by: k1s.box5a_if_any
    expr:
      op: input
      source: What amount is in box 5a (ordinary dividends)?
    cite: &id005
      doc: i1120ssk
      locator: p. 7, Box 5a. Ordinary Dividends, "Report ordinary dividends on Form 1040 or 1040-SR, line 3b"
  - id: k1s.box5a_if_any
    printed: (gate)
    label: Box 5a, asked only when box 5a shows an amount (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box5_any
          - const: true
        then: k1s.box5a
      - guard:
          op: test
          eq:
          - k1s.box5_any
          - const: false
        then: k1s.zero
    cite: *id005
  - id: k1s.box5b
    printed: 5b
    label: Qualified dividends
    type: NonNegDollars
    gated_by: k1s.box5b_if_any
    expr:
      op: input
      source: What amount is in box 5b (qualified dividends)? Enter 0 if it is empty.
    cite: &id006
      doc: i1120ssk
      locator: p. 7, Box 5b. Qualified Dividends, "Report any qualified dividends on Form 1040 or 1040-SR, line 3a"
  - id: k1s.box5b_if_any
    printed: (gate)
    label: Box 5b, asked only when box 5a shows an amount (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box5_any
          - const: true
        then: k1s.box5b
      - guard:
          op: test
          eq:
          - k1s.box5_any
          - const: false
        then: k1s.zero
    cite: *id006
  - id: k1s.box6
    printed: '6'
    label: Box 6 (royalties) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 6 of this Schedule K-1 (royalties) show an amount?
    cite:
      doc: i1120ssk
      locator: p. 7, Box 6. Royalties, "Report royalties on Schedule E (Form 1040), line 4"
  - id: k1s.box7_any
    printed: '7'
    label: Box 7 (net short-term capital gain (loss)) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 7 of this Schedule K-1 (net short-term capital gain or loss) show an amount?
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Net short-term capital gain (loss)"
  - id: k1s.box8_any
    printed: 8a
    label: Box 8a, 8b or 8c (long-term capital gain (loss)) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 8a, 8b or 8c of this Schedule K-1 (long-term capital gain or loss) show an amount?
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Net long-term capital gain (loss)"
  - id: k1s.box9
    printed: '9'
    label: Box 9 (net section 1231 gain (loss)) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 9 of this Schedule K-1 (net section 1231 gain or loss) show an amount?
    cite:
      doc: i1120ssk
      locator: p. 7, Box 9. Net Section 1231 Gain (Loss), "The amount in box 9 is generally passive if it is from a"
  - id: k1s.box10
    printed: '10'
    label: Box 10 (other income (loss)) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 10 of this Schedule K-1 (other income or loss) show an amount?
    cite:
      doc: i1120ssk
      locator: p. 8, Box 10. Other Income (Loss), "Losses reported in box 10 may be limited"
  - id: k1s.box11_12
    printed: 11, 12
    label: Box 11 (section 179 deduction) or box 12 (other deductions) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 11 (section 179 deduction) or box 12 (other deductions) of this Schedule K-1 show an amount?
    cite:
      doc: i1120ssk
      locator: p. 9, Box 11. Section 179 Deduction, "Use this amount, along with the total cost of section 179 property placed
        in service during the year from other sources, to complete Part I of Form 4562"; p. 9, Box 12. Other Deductions, "Deductions
        reported in box 12 may be limited"
  - id: k1s.box7
    printed: '7'
    label: Net short-term capital gain (loss)
    type: Dollars
    gated_by: k1s.box7_if_any
    expr:
      op: input
      source: What amount is in box 7 (net short-term capital gain or loss)? Enter a loss as a negative number.
    cite: &id007
      doc: i1120ssk
      locator: p. 7, Box 7. Net Short-Term Capital Gain (Loss), "report the net short-term capital gain (loss) on Schedule
        D (Form 1040), Capital Gains and Losses, line 5"
  - id: k1s.box7_if_any
    printed: (gate)
    label: Box 7, asked only when box 7 shows an amount (zero otherwise)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box7_any
          - const: true
        then: k1s.box7
      - guard:
          op: test
          eq:
          - k1s.box7_any
          - const: false
        then: k1s.zero
    cite: *id007
  - id: k1s.box8a
    printed: 8a
    label: Net long-term capital gain (loss)
    type: Dollars
    gated_by: k1s.box8a_if_any
    expr:
      op: input
      source: What amount is in box 8a (net long-term capital gain or loss)? Enter a loss as a negative number, and 0 if it
        is empty.
    cite: &id008
      doc: i1120ssk
      locator: p. 7, Box 8a. Net Long-Term Capital Gain (Loss), "report the net long-term capital gain (loss) on Schedule
        D (Form 1040), line 12"
  - id: k1s.box8a_if_any
    printed: (gate)
    label: Box 8a, asked only when box 8a, 8b or 8c shows an amount (zero otherwise)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box8_any
          - const: true
        then: k1s.box8a
      - guard:
          op: test
          eq:
          - k1s.box8_any
          - const: false
        then: k1s.zero
    cite: *id008
  - id: k1s.box8b
    printed: 8b
    label: Collectibles (28%) gain (loss)
    type: Dollars
    gated_by: k1s.box8b_if_any
    expr:
      op: input
      source: What amount is in box 8b (collectibles (28%) gain or loss)? Enter a loss as a negative number, and 0 if it is
        empty.
    cite: &id009
      doc: i1120ssk
      locator: p. 7, Box 8b. Collectibles (28%) Gain (Loss), "report collectibles gain or loss on line 4 of the 28% Rate Gain
        Worksheet"
  - id: k1s.box8b_if_any
    printed: (gate)
    label: Box 8b, asked only when box 8a, 8b or 8c shows an amount (zero otherwise)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box8_any
          - const: true
        then: k1s.box8b
      - guard:
          op: test
          eq:
          - k1s.box8_any
          - const: false
        then: k1s.zero
    cite: *id009
  - id: k1s.box8c
    printed: 8c
    label: Unrecaptured section 1250 gain
    type: NonNegDollars
    gated_by: k1s.box8c_if_any
    expr:
      op: input
      source: What amount is in box 8c (unrecaptured section 1250 gain)? Enter 0 if it is empty.
    cite: &id010
      doc: i1120ssk
      locator: p. 7, Box 8c. Unrecaptured Section 1250 Gain, "Report unrecaptured section 1250 gain from the sale or exchange
        of the corporation’s business assets on line 5"
  - id: k1s.box8c_if_any
    printed: (gate)
    label: Box 8c, asked only when box 8a, 8b or 8c shows an amount (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box8_any
          - const: true
        then: k1s.box8c
      - guard:
          op: test
          eq:
          - k1s.box8_any
          - const: false
        then: k1s.zero
    cite: *id010
  - id: k1s.box8_stmt
    printed: (screen)
    label: Box 8c refers to an attached statement of unrecaptured section 1250 gain of other types
    type: Bool
    gated_by: k1s.box8_stmt_if_any
    expr:
      op: input
      source: Does box 8c say STMT, or point to an attached statement, instead of showing only an amount?
    cite: &id011
      doc: i1120ssk
      locator: p. 7, Box 8c. Unrecaptured Section 1250 Gain, "If it reports the other two types of unrecaptured gain, it will
        provide an attached statement that shows the amount for each type of unrecaptured section 1250 gain"
  - id: k1s.box8_stmt_if_any
    printed: (gate)
    label: Box 8c statement, asked only when box 8a, 8b or 8c shows an amount (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box8_any
          - const: true
        then: k1s.box8_stmt
      - guard:
          op: test
          eq:
          - k1s.box8_any
          - const: false
        then: k1s.no
    cite: *id011
  - id: k1s.box13o_any
    printed: 13 O
    label: Box 13 shows code O (backup withholding)
    type: Bool
    expr:
      op: input
      source: Does box 13 of this Schedule K-1 show code O (backup withholding)?
    cite: &id012
      doc: i1120ssk
      locator: p. 13, Code O. Backup withholding, "Include this amount in the total you enter on Form 1040 or 1040-SR, line
        25c"
  - id: k1s.box13_other
    printed: '13'
    label: Box 13 shows a code other than O (credits)
    type: Bool
    expr:
      op: input
      source: Does box 13 of this Schedule K-1 (credits) show any code other than O?
    cite:
      doc: i1120ssk
      locator: p. 12, Box 13. Credits, "If you have credits that are passive activity credits to you, you must complete Form
        8582-CR in addition to the credit forms identified below"
  - id: k1s.box14
    printed: '14'
    label: Box 14 is checked (Schedule K-3 attached)
    type: Bool
    expr:
      op: input
      source: Is box 14 of this Schedule K-1 checked (a Schedule K-3 is attached)?
    cite:
      doc: i1120ssk
      locator: p. 14, Box 14. International Transactions, "If the S corporation checked the box, see the attached Schedule
        K-3 with respect to items of international tax relevance"
  - id: k1s.box15
    printed: '15'
    label: Box 15 (alternative minimum tax (AMT) items) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 15 of this Schedule K-1 (alternative minimum tax items) show an amount?
    cite:
      doc: i1120ssk
      locator: p. 14, Box 15. Alternative Minimum Tax (AMT) Items, "See List of Codes, later"
  - id: k1s.box16_any
    printed: '16'
    label: Box 16 (items affecting shareholder basis) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 16 of this Schedule K-1 (items affecting shareholder basis) show an amount?
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Items affecting shareholder basis"
  - id: k1s.box17_any
    printed: '17'
    label: Box 17 (other information) shows an amount
    type: Bool
    expr:
      op: input
      source: Does box 17 of this Schedule K-1 (other information) show an amount?
    cite:
      doc: f1120ssk
      locator: p. 1, Part III, "Other information"
  - id: k1s.box13o
    printed: 13 O
    label: Backup withholding (box 13, code O)
    type: NonNegDollars
    gated_by: k1s.box13o_if_any
    expr:
      op: input
      source: What amount is shown in box 13 with code O (backup withholding)?
    cite: *id012
  - id: k1s.box13o_if_any
    printed: (gate)
    label: Box 13 code O, asked only when box 13 shows code O (zero otherwise)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box13o_any
          - const: true
        then: k1s.box13o
      - guard:
          op: test
          eq:
          - k1s.box13o_any
          - const: false
        then: k1s.zero
    cite: *id012
  - id: k1s.box16a_any
    printed: 16 A
    label: Box 16 shows code A (tax-exempt interest income)
    type: Bool
    gated_by: k1s.box16a_any_if_16
    expr:
      op: input
      source: Does box 16 of this Schedule K-1 show code A (tax-exempt interest income)?
    cite: &id013
      doc: i1120ssk
      locator: p. 15, Code A. Tax-exempt interest income, "Individual shareholders include this amount on Form 1040 or 1040-SR,
        line 2a"
  - id: k1s.box16a_any_if_16
    printed: (gate)
    label: Box 16 code A, asked only when box 16 shows an amount (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box16_any
          - const: true
        then: k1s.box16a_any
      - guard:
          op: test
          eq:
          - k1s.box16_any
          - const: false
        then: k1s.no
    cite: *id013
  - id: k1s.box16b_any
    printed: 16 B
    label: Box 16 shows code B (other tax-exempt income)
    type: Bool
    gated_by: k1s.box16b_any_if_16
    expr:
      op: input
      source: Does box 16 of this Schedule K-1 show code B (other tax-exempt income)?
    cite: &id014
      doc: i1120ssk
      locator: p. 15, Code B. Other tax-exempt income, "Generally, you must increase the basis of your stock by the amount
        shown, but don’t include it in income on your tax return"
  - id: k1s.box16b_any_if_16
    printed: (gate)
    label: Box 16 code B, asked only when box 16 shows an amount (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box16_any
          - const: true
        then: k1s.box16b_any
      - guard:
          op: test
          eq:
          - k1s.box16_any
          - const: false
        then: k1s.no
    cite: *id014
  - id: k1s.box16c_any
    printed: 16 C
    label: Box 16 shows code C (nondeductible expenses)
    type: Bool
    gated_by: k1s.box16c_any_if_16
    expr:
      op: input
      source: Does box 16 of this Schedule K-1 show code C (nondeductible expenses)?
    cite: &id015
      doc: i1120ssk
      locator: p. 15, Code C. Nondeductible expenses, "Generally, you must decrease the basis of your stock by this amount"
  - id: k1s.box16c_any_if_16
    printed: (gate)
    label: Box 16 code C, asked only when box 16 shows an amount (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.box16_any
          - const: true
        then: k1s.box16c_any
      - guard:
          op: test
          eq:
          - k1s.box16_any
          - const: false
        then: k1s.no
    cite: *id015
  - id: k1s.box16d_any
    printed: 16 D
    label: Box 16 shows code D (distributions)
    type: Bool
    gated_by: k1s.box16d_any_if_16
    expr:
      op: input
      source: Does box 16 of this Schedule K-1 show code D (distributions)?
    cite: &id016
      doc: i1120ssk
