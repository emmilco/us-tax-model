        then: k1s.zero
    cite: *id029
  - id: k1s.former_passive
    printed: (gate)
    label: A prior-year unallowed passive loss of the box 1 activity, which is not passive this year
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - k1s.material
        - const: true
      - op: test
        gt:
        - k1s.b1_prior_if_any
        - const: 0
    cite:
      doc: i8582
      locator: p. 10, Column (c), "Enter the prior-year unallowed losses for each activity"
  - id: k1s.gain1
    printed: (helper)
    label: Box 1 income (zero for a loss)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.box1_if_any
      take: k1s.zero
    cite: &id030
      doc: i7203
      locator: p. 2, Line 3, "Reminder. Enter only positive amounts from Schedule K-1 (Form 1120-S) on line 3. Negative amounts
        (decreases to stock basis) are entered in Part III"
  - id: k1s.loss1
    printed: (helper)
    label: Box 1 loss, as a positive amount (zero for income)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.zero
      take: k1s.box1_if_any
    cite: *id030
  - id: k1s.gain2
    printed: (helper)
    label: Box 2 income (zero for a loss)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.box2_if_any
      take: k1s.zero
    cite: *id030
  - id: k1s.loss2
    printed: (helper)
    label: Box 2 loss, as a positive amount (zero for income)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.zero
      take: k1s.box2_if_any
    cite: *id030
  - id: k1s.gain3
    printed: (helper)
    label: Box 3 income (zero for a loss)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.box3_if_any
      take: k1s.zero
    cite: *id030
  - id: k1s.loss3
    printed: (helper)
    label: Box 3 loss, as a positive amount (zero for income)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.zero
      take: k1s.box3_if_any
    cite: *id030
  - id: k1s.gain7
    printed: (helper)
    label: Box 7 gain (zero for a loss)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.box7_if_any
      take: k1s.zero
    cite: *id030
  - id: k1s.loss7
    printed: (helper)
    label: Box 7 loss, as a positive amount (zero for a gain)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.zero
      take: k1s.box7_if_any
    cite: *id030
  - id: k1s.gain8
    printed: (helper)
    label: Box 8a gain (zero for a loss)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.box8a_if_any
      take: k1s.zero
    cite: *id030
  - id: k1s.loss8
    printed: (helper)
    label: Box 8a loss, as a positive amount (zero for a gain)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.zero
      take: k1s.box8a_if_any
    cite: *id030
  - id: k1s.loss_items
    printed: (helper)
    label: Total of the losses in boxes 1, 2, 3, 7 and 8a, as a positive amount
    type: NonNegDollars
    expr:
      op: sum
      of:
      - k1s.loss1
      - k1s.loss2
      - k1s.loss3
      - k1s.loss7
      - k1s.loss8
    cite: *id030
    ambiguity: amb.2025.f7203_capital_lines
  - id: k1s.f7203_required
    printed: (gate)
    label: 'Form 7203 is required: a loss or deduction item, or a distribution (box 16, code D)'
    type: Bool
    expr:
      op: test
      any:
      - op: test
        gt:
        - k1s.loss_items
        - const: 0
      - op: test
        gt:
        - k1s.box16d_if_any
        - const: 0
    cite:
      doc: i7203
      locator: p. 1, Who Must File, "Are claiming a deduction for their share of an aggregate loss from an S corporation";
        "Received a non-dividend distribution from an S corporation"
    ambiguity: amb.2025.f7203_required
  - id: k1s.allowed1
    printed: (helper)
    label: Box 1 loss allowed by stock basis (Form 7203 line 35, column (c))
    type: NonNegDollars
    expr:
      op: sum_over
      collection: f7203
      field: f7203.c35
    cite:
      doc: i7203
      locator: p. 5, Column (e), "The allowable losses and deductions from columns (c) and (d) should be reported on the appropriate
        areas of your return (subject to any additional limitations)"
  - id: k1s.allowed2
    printed: (helper)
    label: Box 2 loss allowed by stock basis (Form 7203 line 36, column (c))
    type: NonNegDollars
    expr:
      op: sum_over
      collection: f7203
      field: f7203.c36
    cite:
      doc: i7203
      locator: p. 5, Column (e), "The allowable losses and deductions from columns (c) and (d) should be reported on the appropriate
        areas of your return (subject to any additional limitations)"
  - id: k1s.allowed3
    printed: (helper)
    label: Box 3 loss allowed by stock basis (Form 7203 line 37, column (c))
    type: NonNegDollars
    expr:
      op: sum_over
      collection: f7203
      field: f7203.c37
    cite:
      doc: i7203
      locator: p. 5, Column (e), "The allowable losses and deductions from columns (c) and (d) should be reported on the appropriate
        areas of your return (subject to any additional limitations)"
  - id: k1s.basis_carry_out
    printed: (helper)
    label: Losses carried to 2026 by the basis limitation (Form 7203 line 47, column (e))
    type: NonNegDollars
    expr:
      op: sum_over
      collection: f7203
      field: f7203.e47
    cite:
      doc: i7203
      locator: p. 5, Column (e), "The allowable losses and deductions from columns (c) and (d) should be reported on the appropriate
        areas of your return (subject to any additional limitations)"
  - id: k1s.f7203_n
    printed: (helper)
    label: One Form 7203 for this corporation, screened
    type: Count
    expr:
      op: sum_over
      collection: f7203
      field: f7203.one
    cite:
      doc: i7203
      locator: p. 1, Purpose of Form, "Use Form 7203 to figure potential limitations of your share of the S corporation's
        deductions, credits, and other items that can be deducted on your return"
  - id: k1s.not_at_risk
    printed: (screen)
    label: Some of the stock or loan basis is not at risk (nonrecourse, guaranteed, borrowed from an owner, or similar)
    type: Bool
    gated_by: k1s.not_at_risk_if_loss
    expr:
      op: input
      source: Did you pay for your shares, or for loans to the corporation, with money borrowed on terms that protect you
        from loss (a loan you are not personally liable for, or one someone guarantees for you), or borrowed from another
        owner of the corporation or someone related to one?
    cite: &id031
      doc: i1120ssk
      locator: p. 3, At-Risk Limitations, "you will have to complete Form 6198, At-Risk Limitations, to figure your allowable
        loss for the activity"
  - id: k1s.has_loss
    printed: (helper)
    label: A loss in box 1, 2, 3, 7 or 8a
    type: Bool
    expr:
      op: test
      gt:
      - k1s.loss_items
      - const: 0
    cite: *id031
  - id: k1s.not_at_risk_if_loss
    printed: (gate)
    label: Not at risk, asked only when a box shows a loss (false otherwise)
    type: Bool
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.has_loss
          - const: true
        then: k1s.not_at_risk
      - guard:
          op: test
          eq:
          - k1s.has_loss
          - const: false
        then: k1s.no
    cite: *id031
  - id: k1s.ok
    printed: (gate)
    label: This Schedule K-1 passes every screen and its Form 7203 is supported
    type: Bool
    expr:
      op: test
      eq:
      - k1s.f7203_n
      - const: 1
        type: Count
    cite:
      doc: i1120ssk
      locator: p. 6, Specific Instructions, "If any of the above limitations apply, adjust the amounts on Schedule K-1 before
        you report them on your return"
    refuses:
    - when: k1s.multi
      form: Schedule K-1 (Form 1120-S) with more than one activity (box 18 or 19)
      remedy: A corporation with more than one activity reports each on an attached statement, and each activity's income
        and losses are limited separately; that is outside this tool.
      cite:
        doc: i1120ssk
        locator: p. 19, Box 19. More Than One Activity for Passive Activity Purposes, "Use the information in the attached
          statement to correctly determine your passive activity limitations"
    - when: k1s.disposed
      form: Form 7203 for a disposition of S corporation stock, and Form 8949
      remedy: A sale or other disposition of S corporation stock, or a redemption, needs the stock basis at the date of sale
        (two Forms 7203) and the gain or loss on Form 8949; that is outside this tool.
      cite:
        doc: i7203
        locator: p. 3, Line 13, "If a portion of your stock is redeemed, sold, or otherwise disposed of during the year, attach
          two"
    - when: k1s.box6
      form: Schedule E (Form 1040), line 4 (royalties from a Schedule K-1)
      remedy: Royalties from an S corporation are reported on Schedule E line 4, which this tool does not prepare for a Schedule
        K-1.
      cite:
        doc: i1120ssk
        locator: p. 7, Box 6. Royalties, "Report royalties on Schedule E (Form 1040), line 4"
    - when: k1s.box8_stmt_if_any
      form: Unrecaptured section 1250 gain from an attached statement
      remedy: Unrecaptured section 1250 gain of the other two types is reported from the corporation's statement on other
        lines of the worksheet; that is outside this tool.
      cite: *id011
    - when: k1s.box9
      form: Form 4797 (net section 1231 gain or loss from a Schedule K-1)
      remedy: Section 1231 gain or loss is reported on Form 4797, which this tool does not prepare.
      cite:
        doc: i1120ssk
        locator: p. 7, Box 9. Net Section 1231 Gain (Loss), "The amount in box 9 is generally passive if it is from a"
    - when: k1s.box10
      form: Schedule K-1 (Form 1120-S), box 10 (other income (loss))
      remedy: The items of box 10 go to forms and lines this tool does not prepare.
      cite:
        doc: i1120ssk
        locator: p. 8, Box 10. Other Income (Loss), "Losses reported in box 10 may be limited"
    - when: k1s.box11_12
      form: Schedule K-1 (Form 1120-S), boxes 11 and 12 (section 179 and other deductions)
      remedy: Section 179 and the other deductions of box 12 are limited and reported on forms this tool does not prepare.
      cite:
        doc: i1120ssk
        locator: p. 9, Box 12. Other Deductions, "Deductions reported in box 12 may be limited"
    - when: k1s.box13_other
      form: Credits from a Schedule K-1 (Form 1120-S), box 13 (Form 3800, Form 8582-CR)
      remedy: The credits of box 13, other than backup withholding, are figured on forms this tool does not prepare.
      cite:
        doc: i1120ssk
        locator: p. 12, Box 13. Credits, "If you have credits that are passive activity credits to you, you must complete
          Form 8582-CR in addition to the credit forms identified below"
    - when: k1s.box14
      form: Schedule K-3 (Form 1120-S) (international items)
      remedy: Items of international tax relevance reported on Schedule K-3 are outside this tool.
      cite:
        doc: i1120ssk
        locator: p. 14, Box 14. International Transactions, "If the S corporation checked the box, see the attached Schedule
          K-3 with respect to items of international tax relevance"
    - when: k1s.box15
      form: Form 6251 (alternative minimum tax items from a Schedule K-1)
      remedy: Alternative minimum tax items are figured on Form 6251, which this tool does not prepare.
      cite:
        doc: i1120ssk
        locator: p. 14, Box 15. Alternative Minimum Tax (AMT) Items, "See List of Codes, later"
    - when: k1s.box16ef_if_16
      form: Form 7203 Part II (loan repayments) or Form 1116 (foreign taxes from a Schedule K-1)
      remedy: A repayment of a loan you made to the corporation, and foreign taxes it paid, are figured on forms this tool
        does not prepare.
      cite: *id017
    - when: k1s.box17_other_if_17
      form: Schedule K-1 (Form 1120-S), box 17 (other information)
      remedy: The codes of box 17 other than A, B, V and AC go to forms this tool does not prepare.
      cite: *id019
    - when: k1s.v_other_if_any
      form: Form 8995, lines 6 to 9 (section 199A dividends and qualified PTP income)
      remedy: Section 199A dividends and qualified PTP income from an S corporation are outside this tool.
      cite: *id021
    - when: k1s.mp_other_if_ask
      form: Schedule E (Form 1040), Part II, with material participation by test 2, 4 or 7
      remedy: Material participation by these tests is outside this tool.
      cite: *id026
    - when: k1s.former_passive
      form: Form 8582 (prior-year unallowed loss of an activity that is not passive this year)
      remedy: A prior-year unallowed loss of an activity in which you now materially participate is allowed under special
        rules that are outside this tool.
      cite: *id029
    - when: k1s.basis_carry
      form: Form 7203, Part III, column (b), and Schedule E (Form 1040), line 27
      remedy: A loss or deduction carried from an earlier year by the basis limitation is outside this tool.
      cite:
        doc: i7203
        locator: p. 4, Part III. Shareholder Allowable Loss and Deduction Items, "Column (b). Enter any loss or deduction
          items disallowed due to basis limitations in prior years that were carried forward"
    - when: k1s.risk_carry
      form: Form 6198 (At-Risk Limitations)
      remedy: A loss carried from an earlier year by the at-risk limitation is figured on Form 6198, which this tool does
        not prepare.
      cite:
        doc: i1120ssk
        locator: p. 3, At-Risk Limitations, "Any loss from a section 465 activity not allowed for this tax year will be treated
          as a deduction allocable to the activity in the next tax year"
    - when: k1s.not_at_risk_if_loss
      form: Form 6198 (At-Risk Limitations)
      remedy: A loss with amounts not at risk is figured on Form 6198, which this tool does not prepare.
      cite: *id031
  - id: k1s.b1_net
    printed: (helper)
    label: 'Box 1 after the basis limitation: the income, or the loss allowed (Form 7203, Part III, column (c))'
    type: Dollars
    expr:
      op: subtract
      from: k1s.gain1
      take: k1s.allowed1
    cite: &id032
      doc: i1120ssk
      locator: p. 6, Box 1. Ordinary Business Income (Loss), "report your box 1 income (loss) as instructed after applying
        the basis and at-risk limitations on losses"
  - id: k1s.b2_net
    printed: (helper)
    label: 'Box 2 after the basis limitation: the income, or the loss allowed (Form 7203, Part III, column (c))'
    type: Dollars
    expr:
      op: subtract
      from: k1s.gain2
      take: k1s.allowed2
    cite: *id032
  - id: k1s.b3_net
    printed: (helper)
    label: 'Box 3 after the basis limitation: the income, or the loss allowed (Form 7203, Part III, column (c))'
    type: Dollars
    expr:
      op: subtract
      from: k1s.gain3
      take: k1s.allowed3
    cite: *id032
  - id: k1s.basis_cut
    printed: (gate)
    label: Some loss of this K-1 is carried to 2026 by the basis limitation
    type: Bool
    expr:
      op: test
      gt:
      - k1s.basis_carry_out
      - const: 0
    cite:
      doc: i7203
      locator: p. 4, Part III. Shareholder Allowable Loss and Deduction Items, "Loss and deductions in excess of basis are
        suspended and carried forward indefinitely and the character of the loss and deduction items is retained"
  - id: k1s.b1_np
    printed: (helper)
    label: Box 1 after basis when materially participated (nonpassive; zero otherwise)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.material
          - const: true
        then: k1s.b1_net
      - guard:
          op: test
          eq:
          - k1s.material
          - const: false
        then: k1s.zero
    cite: *id001
  - id: k1s.b1_passive
    printed: (helper)
    label: Box 1 after basis when not materially participated (passive; zero otherwise)
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.material
          - const: false
        then: k1s.b1_net
      - guard:
          op: test
          eq:
          - k1s.material
          - const: true
        then: k1s.zero
    cite:
      doc: i1120ssk
      locator: p. 6, Box 1. Ordinary Business Income (Loss), "Report box 1 income (loss) from corporate trade or business
        activities in which you didn’t materially participate as follows"
  - id: k1s.col_k
    printed: 28 (k)
    label: 'Schedule E line 28, column (k): nonpassive income (box 1, materially participated)'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.ok
          - const: true
        then: k1s.np_income
      - guard:
          op: test
          eq:
          - k1s.ok
          - const: false
        then: k1s.zero
    cite: *id001
  - id: k1s.np_income
    printed: (helper)
    label: Nonpassive box 1 income
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.b1_np
      take: k1s.zero
    cite: *id001
  - id: k1s.np_loss
    printed: (helper)
    label: Nonpassive box 1 loss allowed by basis, as a positive amount
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.zero
      take: k1s.b1_np
    cite: *id001
  - id: k1s.col_i
    printed: 28 (i)
    label: 'Schedule E line 28, column (i): nonpassive loss allowed (box 1, materially participated), as a positive amount'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.ok
          - const: true
        then: k1s.np_loss
      - guard:
          op: test
          eq:
          - k1s.ok
          - const: false
        then: k1s.zero
    cite: *id001
  - id: k1s.p1_income
    printed: (helper)
    label: Passive box 1 income
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.b1_passive
      take: k1s.zero
    cite: &id033
      doc: i1120ssk
      locator: p. 6, Box 1. Ordinary Business Income (Loss), "If income is reported in box 1, report the income in column
        (h) of Schedule E (Form 1040), line 28"
  - id: k1s.p1_loss
    printed: (helper)
    label: Passive box 1 loss after basis, as a positive amount
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.zero
      take: k1s.b1_passive
    cite: *id033
  - id: k1s.p2_income
    printed: (helper)
    label: Box 2 income (passive)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.b2_net
      take: k1s.zero
    cite: *id033
  - id: k1s.p2_loss
    printed: (helper)
    label: Box 2 loss after basis, as a positive amount (passive)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.zero
      take: k1s.b2_net
    cite: *id033
  - id: k1s.p3_income
    printed: (helper)
    label: Box 3 income (passive)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.b3_net
      take: k1s.zero
    cite: *id033
  - id: k1s.p3_loss
    printed: (helper)
    label: Box 3 loss after basis, as a positive amount (passive)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: k1s.zero
      take: k1s.b3_net
    cite: *id033
  - id: k1s.passive_income
    printed: (helper)
    label: Passive income of boxes 1, 2 and 3
    type: NonNegDollars
    expr:
      op: sum
      of:
      - k1s.p1_income
      - k1s.p2_income
      - k1s.p3_income
    cite: *id033
  - id: k1s.col_h
    printed: 28 (h)
    label: 'Schedule E line 28, column (h): passive income'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.ok
          - const: true
        then: k1s.passive_income
      - guard:
          op: test
          eq:
          - k1s.ok
          - const: false
        then: k1s.zero
    cite: *id033
  - id: k1s.p4_income_raw
    printed: (helper)
    label: Box 2 income with active participation (Form 8582 Part IV, column (a))
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: true
        then: k1s.p2_income
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: false
        then: k1s.zero
    cite: &id034
      doc: i8582
      locator: p. 10, Part IV, "Individuals and qualifying estates who actively participated in rental real estate activities
        must include the income or loss from those activities in Part IV"
  - id: k1s.p4_loss_raw
    printed: (helper)
    label: Box 2 loss with active participation (Form 8582 Part IV, column (b))
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: true
        then: k1s.p2_loss
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: false
        then: k1s.zero
    cite: *id034
  - id: k1s.p4_prior_raw
    printed: (helper)
    label: Prior-year unallowed loss of the box 2 activity with active participation (Form 8582 Part IV, column (c))
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: true
        then: k1s.b2_prior_if_any
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: false
        then: k1s.zero
    cite: *id034
  - id: k1s.p5_b2_income
    printed: (helper)
    label: Box 2 income without active participation
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: false
        then: k1s.p2_income
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: true
        then: k1s.zero
    cite: *id034
  - id: k1s.p5_b2_loss
    printed: (helper)
    label: Box 2 loss without active participation
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: false
        then: k1s.p2_loss
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: true
        then: k1s.zero
    cite: *id034
  - id: k1s.p5_b2_prior
    printed: (helper)
    label: Prior-year unallowed loss of the box 2 activity without active participation
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - k1s.part4
          - const: false
