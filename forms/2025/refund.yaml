form:
  id: refund
  kind: form
  title: State and Local Income Tax Refund Worksheet—Schedule 1, Line 1
  tax_year: 2025
  note: The worksheet in the Form 1040 instructions, for a 2025 refund of 2024 state or local income tax deducted on the
    2024 Schedule A. None of a refund is taxable when you did not itemize in 2024 or deducted general sales taxes instead of
    income taxes. The Pub. 525 exceptions, Form 1099-G box 8 and other recoveries are refused (Pub. 525 Worksheet 2 is not
    encoded).
  lines:
  - id: refund.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, "None of your refund is taxable"
  - id: refund.received
    printed: (helper)
    label: State or local income tax refunds, credits or offsets you received in 2025
    type: NonNegDollars
    expr:
      op: input
      source: 'State or local income tax refunds, credits or offsets you received in 2025: the total of box 2 of your Forms
        1099-G (or a similar statement), including any part you chose to apply to your 2025 estimated state or local income
        tax and any part offset against a debt, and any refund for which you received no Form 1099-G; zero if none'
    cite:
      doc: i1040gi
      locator: p. 88, Line 1, "If you received a refund, credit, or offset of state or local income taxes in 2025, you may
        be required to report this amount", "Report any taxable refund you received even if you didn’t receive Form 1099-G"
        and "If you chose to apply part or all of the refund to your 2025 estimated state or local income tax, the amount
        applied is treated as received in 2025"; f1099g p. 5, Instructions for Recipient, "Box 2. Shows refunds, credits,
        or offsets of state or local income tax you received"
  - id: refund.has
    printed: (helper)
    label: Any state or local income tax refund received in 2025
    type: Bool
    expr:
      op: test
      gt:
      - refund.received
      - param: sales.zero
    cite:
      doc: i1040gi
      locator: p. 88, Line 1, "If you received a refund, credit, or offset of state or local income taxes in 2025"
  - id: refund.other
    printed: (gate)
    label: In 2025, did you receive any other refund, reimbursement or recovery of an amount you deducted or took a credit
      for in an earlier year, other than a refund of state or local income tax (for example a refund of general sales tax,
      real estate tax or personal property tax, a refund of mortgage interest in box 4 of Form 1098, a reimbursement of
      medical expenses, or a payment on a bad debt you deducted)?
    type: Bool
    expr:
      op: input
      source: In 2025, did you receive any other refund, reimbursement or recovery of an amount you deducted or took a credit
        for in an earlier year, other than a refund of state or local income tax (for example a refund of general sales tax,
        real estate tax or personal property tax, a refund of mortgage interest in box 4 of Form 1098, a reimbursement of
        medical expenses, or a payment on a bad debt you deducted)?
    cite:
      doc: p525
      locator: p. 24, Recoveries, "A recovery is a return of an amount you deducted or took a credit for in an earlier year"
        and "You may also have recoveries of nonitemized deductions (such as payments on previously deducted bad debts)";
        p. 25, Where to report, "the total of all other recoveries as other income on Schedule 1 (Form 1040), line 8z";
        i1040gi p. 89, Line 1, "2. You received a refund other than an income tax refund, such as a general sales tax or
        real property tax refund, in 2025 of an amount deducted or credit claimed in an earlier year"
  - id: refund.box8
    printed: (gate)
    label: Is box 8 ("If checked, box 2 is trade or business income") checked on any Form 1099-G that reports these refunds?
    type: Bool
    expr:
      op: input
      source: Is box 8 ("If checked, box 2 is trade or business income") checked on any Form 1099-G that reports these refunds?
    cite:
      doc: f1099g
      locator: p. 5, Instructions for Recipient, "Box 8. If this box is checked, the amount in box 2 is attributable to an
        income tax that applies exclusively to income from a trade or business" and "If taxable, report the amount in box
        2 on Schedule C or F (Form 1040), as appropriate"
  - id: refund.not_2024
    printed: (gate)
    label: Is any of these refunds for a tax year other than 2024 (box 3 of Form 1099-G), or did you make your last payment
      of 2024 estimated state or local income tax in 2025?
    type: Bool
    expr:
      op: input
      source: Is any of these refunds for a tax year other than 2024 (box 3 of Form 1099-G), or did you make your last payment
        of 2024 estimated state or local income tax in 2025?
    cite:
      doc: i1040gi
      locator: p. 89, Line 1, "1. You received a refund in 2025 that is for a tax year other than 2024" and "5. You made
        your last payment of 2024 estimated state or local income tax in 2025"; f1099g p. 5, Instructions for Recipient,
        "Box 3. Identifies the tax year for which the box 2 refunds, credits, or offsets shown were made"
    ambiguity: amb.2025.refund_exceptions
  - id: refund.itemized
    printed: (helper)
    label: Did you itemize deductions on Schedule A for 2024?
    type: Bool
    expr:
      op: input
      source: Did you itemize deductions on Schedule A for 2024?
    cite:
      doc: i1040gi
      locator: p. 88, Line 1, "None of your refund is taxable if, in the year you paid the tax, ... you either (a) didn’t itemize
        deductions"; p525 p. 24, Deductions not itemized, "If you didn’t itemize deductions for the year for which you received
        the recovery of an expense that was deductible only if you itemized, don’t include any of the recovery amount in
        your income"
  - id: refund.sales
    printed: (helper)
    label: On your 2024 Schedule A, did you deduct state and local general sales taxes instead of state and local income taxes
      (the box on line 5a checked)?
    type: Bool
    expr:
      op: input
      source: On your 2024 Schedule A, did you deduct state and local general sales taxes instead of state and local income
        taxes (the box on line 5a checked)?
    cite:
      doc: i1040gi
      locator: p. 88, Line 1, "or (b) elected to deduct state and local general sales taxes instead of state and local income
        taxes"; p525 p. 24, State tax refund, "Because you didn’t choose to deduct the state income tax, you don’t include
        the state income tax refund in income"
  - id: refund.worksheet
    printed: (helper)
    label: You itemized deductions for 2024 and deducted state and local income taxes, so the worksheet is used
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - refund.itemized
        - const: true
      - op: test
        eq:
        - refund.sales
        - const: false
    cite:
      doc: i1040gi
      locator: p. 88, Line 1, "If the refund was for a tax you paid in 2024 and you deducted state and local income taxes
        on your 2024 Schedule A, use the State and Local Income Tax Refund Worksheet"
    ambiguity: amb.2025.refund_not_itemized
  - id: refund.exc_tax
    printed: (gate)
    label: 'For 2024: did you owe alternative minimum tax; were you unable to use the full amount of credits you were entitled
      to because the total credits were more than the amount on your 2024 Form 1040 or 1040-SR, line 18; did you have taxable
      income on your 2024 Form 1040 or 1040-SR, line 15, but no tax on line 16 because of the 0% tax rate on net capital
      gain and qualified dividends; or is your 2024 state and local income tax refund more than your 2024 state and local
      income tax deduction minus the amount you could have deducted as your 2024 state and local general sales taxes?'
    type: Bool
    expr:
      op: input
      source: 'For 2024: did you owe alternative minimum tax; were you unable to use the full amount of credits you were entitled
        to because the total credits were more than the amount on your 2024 Form 1040 or 1040-SR, line 18; did you have taxable
        income on your 2024 Form 1040 or 1040-SR, line 15, but no tax on line 16 because of the 0% tax rate on net capital
        gain and qualified dividends; or is your 2024 state and local income tax refund more than your 2024 state and local
        income tax deduction minus the amount you could have deducted as your 2024 state and local general sales taxes?'
    cite:
      doc: i1040gi
      locator: p. 89, Line 1, "3. You had taxable income on your 2024 Form 1040 or 1040-SR, line 15, but no tax on your Form
        1040 or 1040-SR, line 16, because of the 0% tax rate on net capital gain and qualified dividends in certain situations",
        "4. Your 2024 state and local income tax refund is more than your 2024 state and local income tax deduction minus
        the amount you could have deducted as your 2024 state and local general sales taxes", "6. You owed alternative minimum
        tax in 2024" and "7. You couldn’t use the full amount of credits you were entitled to in 2024"
  - id: refund.exc_who
    printed: (gate)
    label: Could you be claimed as a dependent by someone else in 2024; were you a nonresident alien filing Form 1040-NR for
      2024; or did you receive any of these refunds because of a jointly filed state or local income tax return when you
      are not filing a joint 2025 Form 1040 or 1040-SR with the same person?
    type: Bool
    expr:
      op: input
      source: Could you be claimed as a dependent by someone else in 2024; were you a nonresident alien filing Form 1040-NR
        for 2024; or did you receive any of these refunds because of a jointly filed state or local income tax return when
        you are not filing a joint 2025 Form 1040 or 1040-SR with the same person?
    cite:
      doc: i1040gi
      locator: p. 89, Line 1, "8. You could be claimed as a dependent by someone else in 2024" and "9. You received a refund
        because of a jointly filed state or local income tax return, but you aren’t filing a joint 2025 Form 1040 or 1040-SR
        with the same person"; p525 p. 24, Itemized Deduction Recoveries, "You can’t use the State and Local Income Tax
        Refund Worksheet—Schedule 1, Line 1, and must use this discussion if you’re a nonresident alien"
    ambiguity: amb.2025.refund_exceptions
  - id: refund.line5d_2024
    printed: (helper)
    label: The amount on your 2024 Schedule A, line 5d
    type: NonNegDollars
    expr:
      op: input
      source: The amount on your 2024 Schedule A, line 5d (your state and local income or general sales taxes, real estate
        taxes and personal property taxes, added together)
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 1, "your state and local income
        taxes shown on your 2024 Schedule A, line 5d", and line 2, "(generally, this is the amount reported on your 2024
        Schedule A, line 5d)"
    ambiguity: amb.2025.refund_paid_5d
  - id: refund.line5e_2024
    printed: (helper)
    label: The amount on your 2024 Schedule A, line 5e
    type: NonNegDollars
    expr:
      op: input
      source: The amount on your 2024 Schedule A, line 5e
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 2, "more than the amount on your
        2024 Schedule A, line 5e"
  - id: refund.line1
    printed: '1'
    label: Enter the income tax refund from Form(s) 1099-G (or similar statement). But don’t enter more than the amount of
      your state and local income taxes shown on your 2024 Schedule A, line 5d
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - refund.received
      - refund.line5d_2024
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 1, "Enter the income tax refund
        from Form(s) 1099-G (or similar statement). But don’t enter more than the amount of your state and local income taxes
        shown on your 2024 Schedule A, line 5d"
    ambiguity: amb.2025.refund_cap_5d
    refuses:
    - when: refund.exc_tax
      form: Pub. 525, Itemized Deduction Recoveries (Worksheet 2)
      remedy: Your 2024 alternative minimum tax, unused credits, 0% capital gain rate or sales tax choice means the refund
        is figured with Pub. 525 instead of the Form 1040 worksheet; that is outside this tool.
      cite:
        doc: i1040gi
        locator: pp. 88–89, Line 1, "Exception. See Itemized Deduction Recoveries in Pub. 525 instead of using the State
          and Local Income Tax Refund Worksheet in these instructions if any of the following applies", items 3, 4, 6 and
          7
    - when: refund.exc_who
      form: Pub. 525, Itemized Deduction Recoveries (Worksheet 2)
      remedy: A 2024 return on which you could be claimed as a dependent, a 2024 Form 1040-NR, or a refund from a joint state
        or local return with someone you are not filing jointly with for 2025 is figured with Pub. 525 instead of the Form
        1040 worksheet; that is outside this tool.
      cite:
        doc: i1040gi
        locator: pp. 88–89, Line 1, "Exception. See Itemized Deduction Recoveries in Pub. 525 instead of using the State
          and Local Income Tax Refund Worksheet in these instructions if any of the following applies", items 8 and 9; p525
          p. 24, Itemized Deduction Recoveries, "if you’re a nonresident alien"
  - id: refund.line2_more
    printed: (helper)
    label: Is the amount of state and local income taxes (or general sales taxes), real estate taxes, and personal property
      taxes paid in 2024 (generally, this is the amount reported on your 2024 Schedule A, line 5d) more than the amount on
      your 2024 Schedule A, line 5e?
    type: Bool
    display: The line 2 question, shown on the values sheet; line 2 is zero when the answer is No, so line 3 is line 1.
    expr:
      op: test
      gt:
      - refund.line5d_2024
      - refund.line5e_2024
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 2, "Is the amount of state and
        local income taxes (or general sales taxes), real estate taxes, and personal property taxes paid in 2024"
  - id: refund.line2
    printed: '2'
    label: Subtract the amount on your 2024 Schedule A, line 5e, from the amount of state and local income taxes (or general
      sales taxes), real estate taxes, and personal property taxes paid in 2024 (generally, this is the amount reported on
      your 2024 Schedule A, line 5d)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: refund.line5d_2024
      take: refund.line5e_2024
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 2, "No. Enter the amount from line
        1 on line 3 and go to line 4. Yes. Subtract the amount on your 2024 Schedule A, line 5e" (zero on No, so that line
        3 is line 1)
  - id: refund.line3_more
    printed: (helper)
    label: Is the amount on line 1 more than the amount on line 2?
    type: Bool
    expr:
      op: test
      gt:
      - refund.line1
      - refund.line2
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 3, "Is the amount on line 1 more
        than the amount on line 2?" and "No. STOP None of your refund is taxable"
  - id: refund.line3
    printed: '3'
    label: Subtract line 2 from line 1
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: refund.line1
      take: refund.line2
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 3, "Yes. Subtract line 2 from line
        1"
  - id: refund.line17_2024
    printed: (helper)
    label: Your total itemized deductions from your 2024 Schedule A, line 17
    type: NonNegDollars
    expr:
      op: input
      source: Your total itemized deductions from your 2024 Schedule A, line 17
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 4, "Enter your total itemized
        deductions from your 2024 Schedule A, line 17"
  - id: refund.line4
    printed: '4'
    label: Enter your total itemized deductions from your 2024 Schedule A, line 17
    type: NonNegDollars
    expr:
      op: copy
      from: refund.line17_2024
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 4
  - id: refund.status
    printed: (helper)
    label: The filing status claimed on your 2024 Form 1040 or 1040-SR
    type: Enum(filing_status)
    expr:
      op: input
      source: The filing status claimed on your 2024 Form 1040 or 1040-SR
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 5, "Enter the amount shown below
        for the filing status claimed on your 2024 Form 1040 or 1040-SR"
  - id: refund.mfs_spouse_itemized
    printed: (helper)
    label: Did your spouse itemize deductions in 2024?
    type: Bool
    expr:
      op: input
      source: Did your spouse itemize deductions in 2024?
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, Note, "If the filing status on your
        2024 Form 1040 or 1040-SR was married filing separately and your spouse itemized deductions in 2024"
  - id: refund.std_single
    printed: (helper)
    label: Year parameter refund.std_single ($14,600)
    type: NonNegDollars
    expr:
      op: param
      ref: refund.std_single
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 5, "Single or married filing separately—$14,600"
  - id: refund.std_joint
    printed: (helper)
    label: Year parameter refund.std_joint ($29,200)
    type: NonNegDollars
    expr:
      op: param
      ref: refund.std_joint
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 5, "Married filing jointly or qualifying
        surviving spouse—$29,200"
  - id: refund.std_hoh
    printed: (helper)
    label: Year parameter refund.std_hoh ($21,900)
    type: NonNegDollars
    expr:
      op: param
      ref: refund.std_hoh
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 5, "Head of household—$21,900"
  - id: refund.line5
    printed: '5'
    label: 'Enter the amount shown below for the filing status claimed on your 2024 Form 1040 or 1040-SR. Single or married
      filing separately—$14,600. Married filing jointly or qualifying surviving spouse—$29,200. Head of household—$21,900'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.status
          - const: single
        then: refund.std_single
      - guard:
          op: test
          eq:
          - refund.status
          - const: mfj
        then: refund.std_joint
      - guard:
          op: test
          eq:
          - refund.status
          - const: mfs
        then: refund.std_single
      - guard:
          op: test
          eq:
          - refund.status
          - const: hoh
        then: refund.std_hoh
      - guard:
          op: test
          eq:
          - refund.status
          - const: qss
        then: refund.std_joint
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 5
  - id: refund.box_married
    printed: (helper)
    label: Year parameter refund.box_married ($1,550)
    type: NonNegDollars
    expr:
      op: param
      ref: refund.box_married
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Multiply the number of boxes
        checked by $1,550"
  - id: refund.box_unmarried
    printed: (helper)
    label: Year parameter refund.box_unmarried ($1,950)
    type: NonNegDollars
    expr:
      op: param
      ref: refund.box_unmarried
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "($1,950 if your 2024 filing
        status was single or head of household)"
  - id: refund.per_box
    printed: (helper)
    label: The amount for each box checked, $1,550 ($1,950 if your 2024 filing status was single or head of household)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.status
          - const: single
        then: refund.box_unmarried
      - guard:
          op: test
          eq:
          - refund.status
          - const: mfj
        then: refund.box_married
      - guard:
          op: test
          eq:
          - refund.status
          - const: mfs
        then: refund.box_married
      - guard:
          op: test
          eq:
          - refund.status
          - const: hoh
        then: refund.box_unmarried
      - guard:
          op: test
          eq:
          - refund.status
          - const: qss
        then: refund.box_married
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Multiply the number of boxes
        checked by $1,550 ($1,950 if your 2024 filing status was single or head of household)"
  - id: refund.you_born
    printed: (helper)
    label: Were you born before January 2, 1960?
    type: Bool
    expr:
      op: input
      source: Were you born before January 2, 1960?
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "You were born before January
        2, 1960"
    ambiguity: amb.2025.refund_boxes_2024
  - id: refund.you_blind
    printed: (helper)
    label: Were you blind at the end of 2024?
    type: Bool
    expr:
      op: input
      source: Were you blind at the end of 2024?
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "You are blind"
    ambiguity: amb.2025.refund_boxes_2024
  - id: refund.spouse_born
    printed: (helper)
    label: Was the spouse on your 2024 return born before January 2, 1960? If your 2024 filing status was married filing separately,
      answer yes only if your spouse also had no income, wasn't filing a return, and couldn't be claimed as a dependent on
      another person's return.
    type: Bool
    expr:
      op: input
      source: Was the spouse on your 2024 return born before January 2, 1960? If your 2024 filing status was married filing
        separately, answer yes only if your spouse also had no income, wasn't filing a return, and couldn't be claimed as a
        dependent on another person's return.
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Spouse was born before January
        2, 1960" and "If your filing status is married filing separately, you can check the boxes for your spouse only if
        your spouse had no income, isn’t filing a return, and can’t be claimed as a dependent on another person’s return"
    ambiguity: amb.2025.refund_boxes_2024
  - id: refund.spouse_blind
    printed: (helper)
    label: Was the spouse on your 2024 return blind at the end of 2024? If your 2024 filing status was married filing separately,
      answer yes only if your spouse also had no income, wasn't filing a return, and couldn't be claimed as a dependent on
      another person's return.
    type: Bool
    expr:
      op: input
      source: Was the spouse on your 2024 return blind at the end of 2024? If your 2024 filing status was married filing separately,
        answer yes only if your spouse also had no income, wasn't filing a return, and couldn't be claimed as a dependent on
        another person's return.
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Spouse is blind" and "If your
        filing status is married filing separately, you can check the boxes for your spouse only if your spouse had no income,
        isn’t filing a return, and can’t be claimed as a dependent on another person’s return"
    ambiguity: amb.2025.refund_boxes_2024
  - id: refund.spouse_boxes
    printed: (helper)
    label: Your 2024 filing status was married filing jointly or married filing separately (the spouse boxes can apply)
    type: Bool
    expr:
      op: test
      any:
      - op: test
        eq:
        - refund.status
        - const: mfj
      - op: test
        eq:
        - refund.status
        - const: mfs
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "If your filing status is married
        filing separately, you can check the boxes for your spouse only if"; p. 33, Line 12d, "If you or your spouse (if you
        are married and filing a joint return)" and "Don’t check any boxes for your spouse if your filing status is head of
        household"
    ambiguity: amb.2025.refund_boxes_2024
  - id: refund.amt_you_born
    printed: (helper)
    label: The amount for the box "You were born before January 2, 1960" (zero if not checked)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.you_born
          - const: true
        then: refund.per_box
      - guard:
          op: test
          eq:
          - refund.you_born
          - const: false
        then: refund.zero
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Multiply the number of boxes
        checked by $1,550"
  - id: refund.amt_you_blind
    printed: (helper)
    label: The amount for the box "You are blind" (zero if not checked)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.you_blind
          - const: true
        then: refund.per_box
      - guard:
          op: test
          eq:
          - refund.you_blind
          - const: false
        then: refund.zero
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Multiply the number of boxes
        checked by $1,550"
  - id: refund.amt_spouse_born
    printed: (helper)
    label: The amount for the box "Spouse was born before January 2, 1960" (zero if not checked, and when your 2024 filing status was not married filing
      jointly or married filing separately)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.spouse_boxes
          - const: false
        then: refund.zero
      - guard:
          op: test
          eq:
          - refund.spouse_boxes
          - const: true
        then: refund.amt_spouse_born_checked
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Multiply the number of boxes
        checked by $1,550"
    ambiguity: amb.2025.refund_boxes_2024
  - id: refund.amt_spouse_born_checked
    printed: (helper)
    label: The amount for the box "Spouse was born before January 2, 1960" when the spouse boxes can apply (zero if not checked)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.spouse_born
          - const: true
        then: refund.per_box
      - guard:
          op: test
          eq:
          - refund.spouse_born
          - const: false
        then: refund.zero
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Multiply the number of boxes
        checked by $1,550"
  - id: refund.amt_spouse_blind
    printed: (helper)
    label: The amount for the box "Spouse is blind" (zero if not checked, and when your 2024 filing status was not married filing
      jointly or married filing separately)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.spouse_boxes
          - const: false
        then: refund.zero
      - guard:
          op: test
          eq:
          - refund.spouse_boxes
          - const: true
        then: refund.amt_spouse_blind_checked
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Multiply the number of boxes
        checked by $1,550"
    ambiguity: amb.2025.refund_boxes_2024
  - id: refund.amt_spouse_blind_checked
    printed: (helper)
    label: The amount for the box "Spouse is blind" when the spouse boxes can apply (zero if not checked)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.spouse_blind
          - const: true
        then: refund.per_box
      - guard:
          op: test
          eq:
          - refund.spouse_blind
          - const: false
        then: refund.zero
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Multiply the number of boxes
        checked by $1,550"
  - id: refund.line6
    printed: '6'
    label: Check any boxes that apply. Multiply the number of boxes checked by $1,550 ($1,950 if your 2024 filing status was
      single or head of household). No boxes checked, enter -0-
    type: NonNegDollars
    expr:
      op: sum
      of:
      - refund.amt_you_born
      - refund.amt_you_blind
      - refund.amt_spouse_born
      - refund.amt_spouse_blind
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 6, "Check any boxes that apply"
        and "No boxes checked. Enter -0-" (the amount for each box checked, added; the same as the number of boxes times the
        amount)
  - id: refund.line7
    printed: '7'
    label: Add lines 5 and 6
    type: NonNegDollars
    expr:
      op: sum
      of:
      - refund.line5
      - refund.line6
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 7, "Add lines 5 and 6"
  - id: refund.line8_figured
    printed: (helper)
    label: Is the amount on line 7 less than the amount on line 4? Subtract line 7 from line 4 (zero if not)
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: refund.line4
      take: refund.line7
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 8, "Is the amount on line 7 less
        than the amount on line 4?", "No. STOP None of your refund is taxable" and "Yes. Subtract line 7 from line 4"
  - id: refund.line8
    printed: '8'
    label: Subtract line 7 from line 4 (if your 2024 filing status was married filing separately and your spouse itemized
      deductions in 2024, the amount from line 4)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.status
          - const: single
        then: refund.line8_figured
      - guard:
          op: test
          eq:
          - refund.status
          - const: mfj
        then: refund.line8_figured
      - guard:
          op: test
          eq:
          - refund.status
          - const: mfs
        then: refund.line8_mfs
      - guard:
          op: test
          eq:
          - refund.status
          - const: hoh
        then: refund.line8_figured
      - guard:
          op: test
          eq:
          - refund.status
          - const: qss
        then: refund.line8_figured
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 8; Note, "skip lines 5 through 7,
        enter the amount from line 4 on line 8, and go to line 9"
  - id: refund.line8_mfs
    printed: (helper)
    label: 'Married filing separately in 2024: the amount from line 4 if your spouse itemized deductions in 2024 (lines 5 through
      7 skipped), otherwise line 4 less line 7'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.mfs_spouse_itemized
          - const: true
        then: refund.line4
      - guard:
          op: test
          eq:
          - refund.mfs_spouse_itemized
          - const: false
        then: refund.line8_figured
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, Note, "If the filing status on your
        2024 Form 1040 or 1040-SR was married filing separately and your spouse itemized deductions in 2024, skip lines 5
        through 7, enter the amount from line 4 on line 8, and go to line 9"
  - id: refund.line9_figured
    printed: (helper)
    label: The smaller of line 3 or line 8
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - refund.line3
      - refund.line8
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 9, "Enter the smaller of line 3
        or line 8"
  - id: refund.line9
    printed: '9'
    label: Taxable part of your refund. Enter the smaller of line 3 or line 8 here and on Schedule 1, line 1
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.line3_more
          - const: false
        then: refund.zero
      - guard:
          op: test
          eq:
          - refund.line3_more
          - const: true
        then: refund.line9_figured
    cite:
      doc: i1040gi
      locator: p. 90, State and Local Income Tax Refund Worksheet—Schedule 1, Line 1, line 9, "Taxable part of your refund.
        Enter the smaller of line 3 or line 8 here and on Schedule 1, line 1"; line 3, "No. STOP None of your refund is
        taxable"
  - id: refund.taxable
    printed: (helper)
    label: Taxable part of your refund (zero when you did not itemize for 2024 or deducted general sales taxes)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - refund.worksheet
          - const: false
        then: refund.zero
      - guard:
          op: test
          eq:
          - refund.worksheet
          - const: true
        then: refund.line9
    cite:
      doc: i1040gi
      locator: p. 88, Line 1, "None of your refund is taxable if, in the year you paid the tax, ... you either (a) didn’t itemize
        deductions, or (b) elected to deduct state and local general sales taxes instead of state and local income taxes"
    ambiguity: amb.2025.refund_not_itemized
    refuses:
    - when: refund.box8
      form: Form 1099-G box 8 (a refund of a tax on trade or business income, Schedule C or F)
      remedy: A refund of an income tax that applies only to trade or business income is reported, if taxable, on Schedule
        C or F; that is outside this tool.
      cite:
        doc: f1099g
        locator: p. 5, Instructions for Recipient, "Box 8. If this box is checked, the amount in box 2 is attributable to an
          income tax that applies exclusively to income from a trade or business"
    - when: refund.not_2024
      form: Pub. 525, Itemized Deduction Recoveries (Worksheet 2)
      remedy: A refund for a tax year other than 2024, or a refund when your last 2024 estimated state or local tax payment
        was made in 2025, is figured with Pub. 525 (and may reduce your 2025 deduction for taxes); that is outside this tool.
      cite:
        doc: i1040gi
        locator: pp. 88–89, Line 1, "Exception. See Itemized Deduction Recoveries in Pub. 525 instead of using the State and
          Local Income Tax Refund Worksheet in these instructions if any of the following applies", items 1 and 5; p525 p.
          24, Recovery for 2 or more years, "you must allocate, on a pro rata basis, the recovered amount between the years
          in which you paid it"
