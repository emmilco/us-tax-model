form:
  id: sd
  kind: form
  title: Schedule D — securities sales and supplied distribution subtotals
  tax_year: 2025
  note: Special-gain feeders are computed from 1099-DIV box 2b/2d. Section 1202 distributions,
    non-securities source forms are refused. Lines 6 and 14 come from the Capital Loss Carryover Worksheet
    (`clcw`), held as negative amounts. Boolean flow predicates are
    shown even when their printed line is skipped.
  lines:
    - id: sd.no
      printed: (helper)
      label: Year parameter household.no (false)
      type: Bool
      expr:
        op: param
        ref: household.no
      cite:
        doc: f1040sd
        locator: Schedule D (2025), Parts I–III
    - id: sd.sold_other
      printed: (gate)
      label: 'In 2025, did you (or, on a joint return, your spouse) sell or trade real estate or business property? Answer Yes too if any payment for anything you (or, on a joint return, your spouse) sold, in 2025 or before, comes in a year after the year of the sale.'
      type: Bool
      expr:
        op: input
        source: 'In 2025, did you (or, on a joint return, your spouse) sell or trade real estate or business property? Answer Yes too if any payment for anything you (or, on a joint return, your spouse) sold, in 2025 or before, comes in a year after the year of the sale.'
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File; p. 1, "To report a gain from Form 2439 or 6252 or Part I of Form 4797" and "To report a gain or loss from Form 4684, 6781, or 8824"'
    - id: sd.business_property
      printed: (gate)
      label: 'Was any of that property used in a business or rented out, or was it oil, gas or mineral property? Count any sale of something that was not held as an investment or for personal use.'
      type: Bool
      gated_by: sd.business_property_if_sold
      expr:
        op: input
        source: 'Was any of that property used in a business or rented out, or was it oil, gas or mineral property? Count any sale of something that was not held as an investment or for personal use.'
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Use Form 4797 to report the following." and "Real property used in your trade or business"'
    - id: sd.business_property_if_sold
      printed: (gate)
      label: 'Whether property sold or traded was business, rental or mineral property (Form 4797), asked only with a sale or trade of real estate or business property or a sale paid for over more than one year (false without one)'
      type: Bool
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sd.sold_other
                - const: true
            then: sd.business_property
          - guard:
              op: test
              eq:
                - sd.sold_other
                - const: false
            then: sd.no
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Use Form 4797 to report the following." and "Real property used in your trade or business"'
    - id: sd.installment
      printed: (gate)
      label: 'Does any payment for any of it come in a year after the year of the sale, with the gain reported as the payments arrive (an installment sale)?'
      type: Bool
      gated_by: sd.installment_if_sold
      expr:
        op: input
        source: 'Does any payment for any of it come in a year after the year of the sale, with the gain reported as the payments arrive (an installment sale)?'
      cite:
        doc: i1040sd
        locator: 'p. 6, Installment Sales, "Use Form 6252 to report the sale on the installment method. Also, use Form 6252 to report any payment received in 2025 from a sale made in an earlier year that you reported on the installment method." and "To elect out of the installment method, report the full amount of the gain on Form 8949"'
    - id: sd.installment_if_sold
      printed: (gate)
      label: 'Whether a sale is reported on the installment method (Form 6252), asked only with a sale or trade of real estate or business property or a sale paid for over more than one year (false without one)'
      type: Bool
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sd.sold_other
                - const: true
            then: sd.installment
          - guard:
              op: test
              eq:
                - sd.sold_other
                - const: false
            then: sd.no
      cite:
        doc: i1040sd
        locator: 'p. 6, Installment Sales, "Use Form 6252 to report the sale on the installment method. Also, use Form 6252 to report any payment received in 2025 from a sale made in an earlier year that you reported on the installment method." and "To elect out of the installment method, report the full amount of the gain on Form 8949"'
    - id: sd.like_kind
      printed: (gate)
      label: 'Did you trade any of it for other real estate, putting off the tax on the gain (a like-kind exchange)?'
      type: Bool
      gated_by: sd.like_kind_if_sold
      expr:
        op: input
        source: 'Did you trade any of it for other real estate, putting off the tax on the gain (a like-kind exchange)?'
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Use Form 8824 to report like-kind exchanges."'
    - id: sd.like_kind_if_sold
      printed: (gate)
      label: 'Whether there was a like-kind exchange (Form 8824), asked only with a sale or trade of real estate or business property or a sale paid for over more than one year (false without one)'
      type: Bool
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sd.sold_other
                - const: true
            then: sd.like_kind
          - guard:
              op: test
              eq:
                - sd.sold_other
                - const: false
            then: sd.no
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Use Form 8824 to report like-kind exchanges."'
    - id: sd.home_sale
      printed: (gate)
      label: 'Was any of it your (or, on a joint return, your spouse''s) main home, with a Form 1099-S for the sale or a gain you cannot exclude in full?'
      type: Bool
      gated_by: sd.home_sale_if_sold
      expr:
        op: input
        source: 'Was any of it your (or, on a joint return, your spouse''s) main home, with a Form 1099-S for the sale or a gain you cannot exclude in full?'
      cite:
        doc: i1040sd
        locator: 'p. 2, Sale of Your Home, "Report the sale or exchange of your main home on Form 8949 if: • You can’t exclude all of your gain from income, or • You received a Form 1099-S for the sale or exchange."'
    - id: sd.home_sale_if_sold
      printed: (gate)
      label: 'Whether the sale of a main home must be reported on Form 8949 (a Form 1099-S, or gain beyond the exclusion), asked only with a sale or trade of real estate or business property or a sale paid for over more than one year (false without one)'
      type: Bool
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sd.sold_other
                - const: true
            then: sd.home_sale
          - guard:
              op: test
              eq:
                - sd.sold_other
                - const: false
            then: sd.no
      cite:
        doc: i1040sd
        locator: 'p. 2, Sale of Your Home, "Report the sale or exchange of your main home on Form 8949 if: • You can’t exclude all of your gain from income, or • You received a Form 1099-S for the sale or exchange."'
    - id: sd.sec1256
      printed: (gate)
      label: 'In 2025, did you (or, on a joint return, your spouse) trade futures, foreign currency contracts or options on a stock index (section 1256 contracts, shown in boxes 8 to 11 of a Form 1099-B), or hold offsetting positions taxed as a straddle?'
      type: Bool
      expr:
        op: input
        source: 'In 2025, did you (or, on a joint return, your spouse) trade futures, foreign currency contracts or options on a stock index (section 1256 contracts, shown in boxes 8 to 11 of a Form 1099-B), or hold offsetting positions taxed as a straddle?'
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Use Form 6781 to report gains and losses from section 1256 contracts and straddles."; f1099b p. 7, "Box 8. Shows the profit or (loss) realized on regulated futures, foreign currency, or Section 1256 option contracts closed during 2025."'
    - id: sd.condemned
      printed: (gate)
      label: 'In 2025, was your (or, on a joint return, your spouse''s) business or investment property taken by a government, or sold under threat of that (a condemnation)?'
      type: Bool
      expr:
        op: input
        source: 'In 2025, was your (or, on a joint return, your spouse''s) business or investment property taken by a government, or sold under threat of that (a condemnation)?'
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "The involuntary conversion (other than from casualty or theft) of property used in a trade or business and capital assets held more than 1 year for business or profit."'
    - id: sd.small_business_stock
      printed: (gate)
      label: 'In 2025, did you (or, on a joint return, your spouse) lose money on stock that a small company issued to you, a loss you claim as an ordinary loss and not a capital loss (section 1244 or section 1242 stock)?'
      type: Bool
      expr:
        op: input
        source: 'In 2025, did you (or, on a joint return, your spouse) lose money on stock that a small company issued to you, a loss you claim as an ordinary loss and not a capital loss (section 1244 or section 1242 stock)?'
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Ordinary loss on the sale, exchange, or worthlessness of small business investment company (section 1242) stock." and "Ordinary loss on the sale, exchange, or worthlessness of small business (section 1244) stock."'
    - id: sd.trader_election
      printed: (gate)
      label: 'Do you (or, on a joint return, your spouse) trade securities or commodities as a business, under a mark-to-market election made in an earlier year?'
      type: Bool
      expr:
        op: input
        source: 'Do you (or, on a joint return, your spouse) trade securities or commodities as a business, under a mark-to-market election made in an earlier year?'
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Ordinary gain or loss on securities or commodities held in connection with your trading business, if you previously made a mark-to-market election."'
    - id: sd.f2439
      printed: (gate)
      label: 'Did a mutual fund or a real estate investment trust (REIT) send you (or, on a joint return, your spouse) a Form 2439 for 2025, a notice of gains it kept and paid tax on?'
      type: Bool
      gated_by: sd.f2439_if_dividends
      expr:
        op: input
        source: 'Did a mutual fund or a real estate investment trust (REIT) send you (or, on a joint return, your spouse) a Form 2439 for 2025, a notice of gains it kept and paid tax on?'
      cite:
        doc: i1040sd
        locator: 'p. 6, "Include on Schedule D, line 11, the amount from box 1a of Form 2439."'
    - id: sd.f2439_if_dividends
      printed: (gate)
      label: 'Whether a fund or REIT sent a Form 2439 (undistributed long-term capital gains), asked only when you or your spouse received dividends or other distributions (false otherwise)'
      type: Bool
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.any
                - const: true
            then: sd.f2439
          - guard:
              op: test
              eq:
                - div.any
                - const: false
            then: sd.no
      cite:
        doc: i1040sd
        locator: 'p. 6, "Include on Schedule D, line 11, the amount from box 1a of Form 2439."'
    - id: sd.casualty
      printed: (gate)
      label: 'In 2025, was your (or, on a joint return, your spouse''s) property damaged, destroyed or stolen, leaving a loss that insurance did not cover or an insurance payment above what the property cost?'
      type: Bool
      expr:
        op: input
        source: 'In 2025, was your (or, on a joint return, your spouse''s) property damaged, destroyed or stolen, leaving a loss that insurance did not cover or an insurance payment above what the property cost?'
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Use Form 4684 to report involuntary conversions of property due to casualty or theft."'
    - id: sd.qof
      printed: (gate)
      label: 'Did you (or, on a joint return, your spouse) own an investment in an opportunity zone fund (QOF) at any time in 2025, or put off tax on a 2025 gain by investing in one?'
      type: Bool
      expr:
        op: input
        source: 'Did you (or, on a joint return, your spouse) own an investment in an opportunity zone fund (QOF) at any time in 2025, or put off tax on a 2025 gain by investing in one?'
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Use Form 8997 to report each QOF investment you held at the beginning and end of the tax year and the deferred gains associated with each investment. Also, use Form 8997 to report any capital gains you are deferring by investing in a QOF during the tax year and any QOF investment you disposed of during the tax year."; i8949 p. 12, "you will need to complete a Form 8997 for each year you hold the investment"; i1040gi p. 31, Line 7a, Exception 1, "You don’t have to file Form 8949 or Schedule D if you aren’t deferring any capital gain by investing in a qualified opportunity fund"'
    - id: sd.other_forms
      printed: (helper)
      label: 'Are there gains or losses from (or that belong on) Forms 4797, 2439, 6252, 4684, 6781 or 8824, or an investment in a qualified opportunity fund (Form 8997)? Count section 1256 contracts and a casualty or theft of property whether you held the property directly or through an entity.'
      type: Bool
      expr:
        op: test
        any:
          - op: test
            eq:
              - sd.business_property_if_sold
              - const: true
          - op: test
            eq:
              - sd.installment_if_sold
              - const: true
          - op: test
            eq:
              - sd.like_kind_if_sold
              - const: true
          - op: test
            eq:
              - sd.sec1256
              - const: true
          - op: test
            eq:
              - sd.condemned
              - const: true
          - op: test
            eq:
              - sd.small_business_stock
              - const: true
          - op: test
            eq:
              - sd.trader_election
              - const: true
          - op: test
            eq:
              - sd.f2439_if_dividends
              - const: true
          - op: test
            eq:
              - sd.casualty
              - const: true
          - op: test
            eq:
              - sd.qof
              - const: true
      cite:
        doc: i1040sd
        locator: 'p. 1, Other Forms You May Have To File, "Use Form 8997 to report each QOF investment you held at the beginning and end of the tax year", "Use Form 4797 to report the following.", "The involuntary conversion (other than from casualty or theft) of property used in a trade or business", "Ordinary loss on the sale, exchange, or worthlessness of small business (section 1244) stock.", "Ordinary gain or loss on securities or commodities held in connection with your trading business, if you previously made a mark-to-market election.", "Use Form 4684 to report involuntary conversions of property due to casualty or theft.", "Use Form 6781 to report gains and losses from section 1256 contracts and straddles.", "Use Form 8824 to report like-kind exchanges."; p. 6, Installment Sales, "Use Form 6252 to report the sale on the installment method"; p. 6, "Include on Schedule D, line 11, the amount from box 1a of Form 2439."'
    - id: sd.route_each
      printed: (gate)
      label: 'Do you want to choose, sale by sale, between listing a sale on Form 8949 and adding it to a total on Schedule D? The tax is the same either way; with a No, every sale is listed.'
      type: Bool
      expr:
        op: input
        source: 'Do you want to choose, sale by sale, between listing a sale on Form 8949 and adding it to a total on Schedule D? The tax is the same either way; with a No, every sale is listed.'
      cite:
        doc: i1040sd
        locator: p. 10, lines 1a and 8a
    - id: sd.special_any
      printed: (helper)
      label: |-
        Does any of the following apply to any of the sales you listed?

        Does any of them involve:
        - collectibles (works of art, rugs, antiques, metals such as gold, silver or platinum bullion, including shares of an exchange-traded fund or trust that holds gold, silver, platinum or other metals, gems, stamps, coins, alcoholic beverages or other tangible property of that kind)
        - a non-fungible token (NFT) whose underlying asset is a collectible, such as an NFT that represents ownership of a work of art or a gem
        - qualified small business stock with a section 1202 exclusion
        - depreciable real property (section 1250 property: generally, real property for which depreciation was allowed or allowable (claimed, or that you could have claimed), such as a home you once rented out or used in part as a home office)
        - an interest in a partnership, S corporation or trust (including S corporation stock) that holds collectibles or section 1250 property directly or through another entity, such as stock of an S corporation that owns art or gold worth more than its cost
        - a loss on stock held 1 year or less on which you received an extraordinary dividend (one that equals or exceeds 10% of your basis in the stock, 5% for preferred stock) reported as a qualified dividend
        - a gain from a constructive ownership transaction on a financial asset (an interest in a partnership, S corporation, trust, mutual fund or REIT), such as a forward contract to acquire it

        Or does any of them dispose of an investment in a qualified opportunity fund (QOF), or is any of its gain deferred by an investment in a QOF?
      type: Bool
      expr:
        op: input
        source: |-
          Does any of the following apply to any of the sales you listed?

          Does any of them involve:
          - collectibles (works of art, rugs, antiques, metals such as gold, silver or platinum bullion, including shares of an exchange-traded fund or trust that holds gold, silver, platinum or other metals, gems, stamps, coins, alcoholic beverages or other tangible property of that kind)
          - a non-fungible token (NFT) whose underlying asset is a collectible, such as an NFT that represents ownership of a work of art or a gem
          - qualified small business stock with a section 1202 exclusion
          - depreciable real property (section 1250 property: generally, real property for which depreciation was allowed or allowable (claimed, or that you could have claimed), such as a home you once rented out or used in part as a home office)
          - an interest in a partnership, S corporation or trust (including S corporation stock) that holds collectibles or section 1250 property directly or through another entity, such as stock of an S corporation that owns art or gold worth more than its cost
          - a loss on stock held 1 year or less on which you received an extraordinary dividend (one that equals or exceeds 10% of your basis in the stock, 5% for preferred stock) reported as a qualified dividend
          - a gain from a constructive ownership transaction on a financial asset (an interest in a partnership, S corporation, trust, mutual fund or REIT), such as a forward contract to acquire it

          Or does any of them dispose of an investment in a qualified opportunity fund (QOF), or is any of its gain deferred by an investment in a QOF?
      cite:
        doc: i1040sd
        locator: pp. 11–12, lines 18 and 19; p. 11, Line 19, "section 1250 property (generally, real property that you depreciated)"; p. 12, "Figure the smaller of (a) the depreciation allowed or allowable, or (b) the total gain for the sale."; p. 11, line 18, "Include on the worksheet any gain (but not loss) from the sale or exchange of an interest in a partnership, S corporation, or trust held for more than 1 year and attributable to unrealized appreciation of collectibles."; p. 12,
          line 19, "You reported a long-term capital gain from the sale or exchange of an interest in a partnership that owned
          section 1250 property"; p. 10, Disposal of QOF Investment, "If you disposed of any investment in a QOF during the tax year,
          check the box on page 1 of Schedule D and see the Instructions for Form 8949 for additional reporting requirements.";
          p. 4, "If qualified dividends that you reported on Form 1040, 1040-SR, or 1040-NR, line 3a, include extraordinary
          dividends, any loss on the sale or exchange of the stock is a long-term capital loss to the extent of the
          extraordinary dividends. An extraordinary dividend is a dividend that equals or exceeds 10% (5% in the case of
          preferred stock) of your basis in the stock."; p550 p. 79, Gains From Certain Constructive Ownership
          Transactions, "all or part of the gain may be treated instead as ordinary income" and Financial asset, "any
          equity interest in a pass-through entity"; i1040gi p. 15, Digital Assets, "digital assets include non-fungible
          tokens (NFTs)"
      ambiguity: amb.2025.nft_collectible
    - id: sd.carryover
      printed: (helper)
      label: 'Did line 21 of your 2024 Schedule D show a loss, or would it have, on a correct 2024 return, if you filed none or left a loss off?'
      type: Bool
      expr:
        op: input
        source: 'Did line 21 of your 2024 Schedule D show a loss, or would it have, on a correct 2024 return, if you filed
          no 2024 return or Schedule D or left a capital loss off it? On a 2025 joint return, answer for your 2024 joint
          return, or for either spouse''s separate 2024 return.'
      cite:
        doc: i1040sd
        locator: p. 10, Capital Loss Carryover Worksheet—Lines 6 and 14, "Use this worksheet to figure your capital loss
          carryovers from 2024 to 2025 if your 2024 Schedule D, line 21, is a loss", "Otherwise, you don’t have any
          carryovers"; p550 p. 102, Capital loss carryover, "you must take the current year's allowable deduction into
          account, whether or not you claimed it and whether or not you filed a return for the current year"
    - id: sd.distributions
      printed: (helper)
      label: Capital gain distributions, generally Form 1099-DIV box 2a
      type: NonNegDollars
      gated_by: sd.distributions_if_dividends
      expr:
        op: input
        source: Capital gain distributions, generally Form 1099-DIV box 2a
      cite:
        doc: i1040sd
        locator: p. 11, line 13
    - id: sd.line18
      printed: (helper)
      label: Line 18. 28% Rate Gain Worksheet result, or zero when line 17 is No (lines 18 through 21 skipped)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sd.line17
                - const: true
            then: g28.line7
          - guard:
              op: test
              eq:
                - sd.line17
                - const: false
            then: sd.zero
      cite:
        doc: i1040sd
        locator: p. 11, Line 18, "If you checked “Yes” on line 17, complete the 28% Rate Gain Worksheet"; f1040sd p. 2, line 17, "No. Skip lines 18 through 21, and go to line 22"
    - id: sd.line19
      printed: (helper)
      label: Line 19. Unrecaptured Section 1250 Gain Worksheet result, or zero when line 17 is No (lines 18 through 21 skipped)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sd.line17
                - const: true
            then: u1250.line18
          - guard:
              op: test
              eq:
                - sd.line17
                - const: false
            then: sd.zero
      cite:
        doc: i1040sd
        locator: pp. 11–12, Line 19, "If you checked “Yes” on line 17, complete the Unrecaptured Section 1250 Gain Worksheet"; f1040sd p. 2, line 17, "No. Skip lines 18 through 21, and go to line 22"
    - id: sd.filing4952
      printed: (helper)
      label: Are you filing Form 4952?
      type: Bool
      expr:
        op: copy
        from: f4952.required
      cite:
        doc: f1040sd
        locator: Schedule D (2025), Parts I–III
    - id: sd.investment_election
      printed: (helper)
      label: Form 4952 line 4g (supplied subtotal; Form 4952 deferred to Stage 4)
      type: NonNegDollars
      expr:
        op: copy
        from: f4952.election
      cite:
        doc: i1040sd
        locator: p. 15, Schedule D Tax Worksheet, applicability
    - id: sd.count
      printed: (helper)
      label: Count screened transactions
      type: Count
      expr:
        op: sum_over
        collection: sales
        field: sales.one
      cite:
        doc: f1040sd
        locator: p. 1, Capital Gains and Losses, "Use Form 8949 to list your transactions for lines 1b, 2, 3, 8b, 9,
          and 10"
      refuses:
        - when: sd.home_sale_if_sold
          form: Form 8949, sale of your main home
          remedy: Report the sale of your main home on Form 8949, with code H and the excluded gain in column (g), or
            with code L for a loss on a home sold with a Form 1099-S. This tool does not prepare it.
          cite:
            doc: i8949
            locator: 'p. 9, code H, "Report the sale or exchange on Form 8949 as you would if you weren''t taking the exclusion. Then enter the amount of excluded (nontaxable) gain as a negative number (in parentheses) in column (g)."; i1040sd p. 2, How To Report the Sale of Your Main Home'
        - when: sd.other_forms
          form: Schedule D additional source forms
          remedy: Prepare the required source forms; their gains/losses are outside the supported securities
            slice.
          cite:
            doc: f1040sd
            locator: Schedule D (2025), Parts I–III
    - id: sd.screen
      printed: (helper)
      label: Transaction screening dependency
      type: Bool
      expr:
        op: test
        lt:
          - sd.count
          - const: 0
            type: Count
      cite:
        doc: f1040sd
        locator: p. 1, Capital Gains and Losses, "Use Form 8949 to list your transactions for lines 1b, 2, 3, 8b, 9,
          and 10"
      note: "Structural propagation gate: a valid Count is never negative, so true is unreachable. Unknown
        or refused transaction screening propagates through this test before any category filter can
        omit a transaction."
    - id: sd.filed
      printed: (helper)
      label: Schedule D required for entered sales, special distribution gains or a capital loss carryover
      type: Bool
      expr:
        op: test
        any:
          - op: test
            gt:
              - sd.count
              - const: 0
                type: Count
          - op: test
            gt:
              - div.box2b_if_capital_gain
              - const: 0
          - op: test
            gt:
              - div.box2d_if_capital_gain
              - const: 0
          - op: test
            lt:
              - sd.line6
              - const: 0
          - op: test
            lt:
              - sd.line14
              - const: 0
      cite:
        doc: i1040gi
        locator: p. 31, Line 7a, "If you sold a capital asset, such as a stock, bond, or digital asset, you
          must complete and attach Form 8949 and Schedule D", "None of the Form(s) 1099-DIV (or substitute statements)
          have an amount in box 2b (unrecaptured section 1250 gain), box 2c (section 1202 gain), or box 2d
          (collectibles (28%) gain)", "You have no capital losses"
    - id: sd.zero
      printed: (helper)
      label: No amount on an inapplicable line
      type: NonNegDollars
      expr:
        op: param
        ref: sales.zero
