form:
  id: sd
  kind: form
  title: Schedule D — securities sales and supplied distribution subtotals
  tax_year: 2025
  note: Special-gain feeders are computed from 1099-DIV box 2b/2d. Section 1202 distributions,
    non-securities source forms and prior-year carryovers are refused. Boolean flow predicates are
    shown even when their printed line is skipped.
  lines:
    - id: sd.other_forms
      printed: (helper)
      label: 'Are there gains or losses from (or that belong on) Forms 4797, 2439, 6252, 4684, 6781 or 8824, or capital gains or losses on a Schedule K-1? Count section 1256 contracts and a casualty or theft of property whether you held the property directly or through an entity.'
      type: Bool
      expr:
        op: input
        source: 'Are there gains or losses from (or that belong on) Forms 4797, 2439, 6252, 4684, 6781 or 8824, or capital gains or losses on a Schedule K-1? Count section 1256 contracts and a casualty or theft of property whether you held the property directly or through an entity.'
      cite:
        doc: f1040sd
        locator: Schedule D (2025), Parts I–III
    - id: sd.carryover
      printed: (helper)
      label: 'Is there a capital loss carried into 2025 from any earlier year?'
      type: Bool
      expr:
        op: input
        source: 'Is there a capital loss carried into 2025 from any earlier year?'
      cite:
        doc: f1040sd
        locator: Schedule D (2025), Parts I–III
    - id: sd.distributions
      printed: (helper)
      label: Capital gain distributions, generally Form 1099-DIV box 2a
      type: NonNegDollars
      expr:
        op: input
        source: Capital gain distributions, generally Form 1099-DIV box 2a
      cite:
        doc: i1040sd
        locator: p. 11, line 13
    - id: sd.line18
      printed: (helper)
      label: Line 18. 28% Rate Gain Worksheet result, or zero when line 17 is No (lines 18 through 21 skipped)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sd.line17
                - const: true
            then: g28.line7
          - guard:
              op: test
              eq:
                - sd.line17
                - const: false
            then: sd.zero
      cite:
        doc: i1040sd
        locator: p. 11, Line 18, "If you checked “Yes” on line 17, complete the 28% Rate Gain Worksheet"; f1040sd p. 2, line 17, "No. Skip lines 18 through 21, and go to line 22"
    - id: sd.line19
      printed: (helper)
      label: Line 19. Unrecaptured Section 1250 Gain Worksheet result, or zero when line 17 is No (lines 18 through 21 skipped)
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - sd.line17
                - const: true
            then: u1250.line18
          - guard:
              op: test
              eq:
                - sd.line17
                - const: false
            then: sd.zero
      cite:
        doc: i1040sd
        locator: pp. 11–12, Line 19, "If you checked “Yes” on line 17, complete the Unrecaptured Section 1250 Gain Worksheet"; f1040sd p. 2, line 17, "No. Skip lines 18 through 21, and go to line 22"
    - id: sd.filing4952
      printed: (helper)
      label: Are you filing Form 4952?
      type: Bool
      expr:
        op: copy
        from: f4952.required
      cite:
        doc: f1040sd
        locator: Schedule D (2025), Parts I–III
    - id: sd.investment_election
      printed: (helper)
      label: Form 4952 line 4g (supplied subtotal; Form 4952 deferred to Stage 4)
      type: NonNegDollars
      expr:
        op: copy
        from: f4952.election
      cite:
        doc: i1040sd
        locator: p. 15, Schedule D Tax Worksheet, applicability
    - id: sd.count
      printed: (helper)
      label: Count screened transactions
      type: Count
      expr:
        op: sum_over
        collection: sales
        field: sales.one
      cite:
        doc: f1040sd
        locator: p. 1, Capital Gains and Losses, "Use Form 8949 to list your transactions for lines 1b, 2, 3, 8b, 9,
          and 10"
      refuses:
        - when: sd.other_forms
          form: Schedule D additional source forms
          remedy: Prepare the required source forms; their gains/losses are outside the supported securities
            slice.
          cite:
            doc: f1040sd
            locator: Schedule D (2025), Parts I–III
        - when: sd.carryover
          form: Capital Loss Carryover Worksheet
          remedy: Prior-year capital loss carryovers are unsupported; prepare the carryover worksheet.
          cite:
            doc: f1040sd
            locator: Schedule D (2025), Parts I–III
    - id: sd.screen
      printed: (helper)
      label: Transaction screening dependency
      type: Bool
      expr:
        op: test
        lt:
          - sd.count
          - const: 0
            type: Count
      cite:
        doc: f1040sd
        locator: p. 1, Capital Gains and Losses, "Use Form 8949 to list your transactions for lines 1b, 2, 3, 8b, 9,
          and 10"
      note: "Structural propagation gate: a valid Count is never negative, so true is unreachable. Unknown
        or refused transaction screening propagates through this test before any category filter can
        omit a transaction."
    - id: sd.filed
      printed: (helper)
      label: Schedule D required for entered sales or special distribution gains
      type: Bool
      expr:
        op: test
        any:
          - op: test
            gt:
              - sd.count
              - const: 0
                type: Count
          - op: test
            gt:
              - sd.line18
              - const: 0
          - op: test
            gt:
              - sd.line19
              - const: 0
      cite:
        doc: f1040sd
        locator: i1040gi p. 31, Line 7a, "If you sold a capital asset, such as a stock, bond, or digital asset, you
          must complete and attach Form 8949 and Schedule D", "None of the Form(s) 1099-DIV (or substitute statements)
          have an amount in box 2b (unrecaptured section 1250 gain), box 2c (section 1202 gain), or box 2d
          (collectibles (28%) gain)"
    - id: sd.zero
      printed: (helper)
      label: No amount on an inapplicable line
      type: NonNegDollars
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040sd
        locator: Schedule D (2025), Parts I–III
    - id: sd.line1a.d
      printed: 1a(d)
      label: Line 1a, column (d) totals
      type: NonNegDollars
      expr:
        op: sum_over
        collection: sales
        field: sales.proceeds
        where:
          op: test
          all:
            - op: test
              eq:
                - sales.box
                - const: A
            - op: test
              eq:
                - sales.route
                - const: aggregate
      cite:
        doc: f1040sd
        locator: p. 1, Part I, line 1a, column (d), "Totals for all short-term transactions reported on Form 1099-B or
          Form 1099-DA for which basis was reported to the IRS and for which you have no adjustments", "(d) Proceeds
          (sales price)"
      refuses:
        - when: sd.screen
          form: Schedule D
          remedy: Resolve transaction screening before calculating totals.
          cite:
            doc: f1040sd
            locator: Schedule D (2025), Parts I–III
