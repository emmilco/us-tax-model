form:
  id: ftc
  kind: form
  title: Foreign tax credit — election without Form 1116, or Form 1116
  tax_year: 2025
  note: Creditable foreign tax is a supplied amount after reductions; this slice does not determine
    foreign-tax law or automate holdings/related-payment tests. The election is made whenever its
    conditions are met and no carryover is claimed; otherwise the credit is Form 1116 line 35. NIIT is
    excluded from regular tax.
  lines:
    - id: ftc.taxes
      printed: (helper)
      type: NonNegDollars
      gated_by: ftc.taxes_if_asked
      label: "Total creditable foreign taxes after required reductions; generally Form 1099-INT box 6 and Form 1099-DIV box 7, less any tax that is not creditable (such as tax on a dividend that fails the holding period or must be paid over)"
      expr:
        op: input
        source: "Total creditable foreign taxes after required reductions; generally Form 1099-INT box 6 and Form 1099-DIV box 7, leaving out tax withheld on a dividend from stock held fewer than 16 days within the 31-day period that begins 15 days before the ex-dividend date, and tax on a dividend to the extent you have to make related payments"
      cite:
        doc: i1116
        locator: "pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20, regular tax; p. 3, Foreign Taxes Not Eligible for a Credit, item 5, \"Foreign taxes withheld on a dividend from a corporation, if you haven’t held the stock for at least 16 days within the 31-day period that begins 15 days before the ex-dividend date\", and item 6, \"Foreign taxes withheld on a dividend to the extent that you have to make related payments on positions in substantially similar or related property\""
    - id: ftc.asked
      printed: (gate)
      type: Bool
      label: 'Shares or a Form 1099-DIV, taxable interest above zero, or income tax ever paid to another country: the filers who can have foreign tax to enter'
      expr:
        op: test
        any:
          - op: test
            eq:
              - div.any
              - const: true
          - op: test
            gt:
              - sb.interest_total
              - const: 0
          - op: test
            eq:
              - s3.foreign_any
              - const: true
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.taxes_if_asked
      printed: (helper)
      type: NonNegDollars
      label: 'Total creditable foreign taxes after required reductions, when you or your spouse owned shares or received a Form 1099-DIV, were paid taxable interest, or ever paid income tax to another country; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.asked
                - const: true
            then: ftc.taxes
          - guard:
              op: test
              eq:
                - ftc.asked
                - const: false
            then: ftc.zero
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.carryover
      printed: (helper)
      type: Bool
      gated_by: ftc.carryover_if_asked
      label: Are any of your (or, on a joint return, your spouse's) unused foreign taxes carried to 2025 from another tax year?
      expr:
        op: input
        source: Are any of your (or, on a joint return, your spouse's) unused foreign taxes carried to 2025 from another tax year (Schedule B (Form 1116) of 2024, line 8)?
      cite:
        doc: i1116
        locator: p. 19, Line 10, "Enter the unused foreign taxes in the separate category from another tax year that are eligible to be carried forward to or back to 2025"
    - id: ftc.carryover_ask
      printed: (helper)
      type: Bool
      label: 'The carryover question is asked: foreign tax, territory income or a foreign corporation at some time, or a 2024 return with a form besides Form 1040 and its schedules'
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s3.foreign_any
            - const: true
          then: s3.foreign_any
        - guard:
            op: test
            eq:
            - s3.foreign_any
            - const: false
          then: s3.prior_other_forms
      cite:
        doc: i1116
        locator: p. 19, Line 10, "Enter the unused foreign taxes in the separate category from another tax year that are eligible to be carried forward to or back to 2025"
    - id: ftc.carryover_if_asked
      printed: (gate)
      type: Bool
      label: Whether a foreign tax credit carried from another year is claimed, asked only of a filer who has paid income tax to a foreign country or a U.S. territory, had territory income or owned part of a foreign corporation, or whose 2024 return includes a form besides Form 1040 and its schedules (false otherwise)
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - ftc.carryover_ask
            - const: true
          then: ftc.carryover
        - guard:
            op: test
            eq:
            - ftc.carryover_ask
            - const: false
          then: ftc.no
      cite:
        doc: i1116
        locator: p. 19, Line 10, "Enter the unused foreign taxes in the separate category from another tax year that are eligible to be carried forward to or back to 2025"
    - id: ftc.all_passive
      printed: (helper)
      type: Bool
      gated_by: ftc.all_passive_if_tax
      label: "Was all foreign-source gross income passive category income under the small-tax election rules (counting high-taxed income and certain export financing interest as passive)?"
      expr:
        op: input
        source: "Was all foreign-source gross income passive category income under the small-tax election rules? For this purpose passive income also includes income subject to the special rule for high-taxed income and certain export financing interest."
      cite:
        doc: i1116
        locator: "pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20, regular tax; p. 1, Election To Claim the Foreign Tax Credit Without Filing Form 1116, \"However, for this purpose, passive income also includes (a) income subject to the special rule for high-taxed income, described later; and (b) certain export financing interest.\""
    - id: ftc.statements
      printed: (helper)
      type: Bool
      gated_by: ftc.statements_if_tax
      label: Were all foreign income and taxes reported on qualified payee statements?
      expr:
        op: input
        source: Were all foreign income and taxes reported on qualified payee statements?
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.eligible
      printed: (helper)
      type: Bool
      gated_by: ftc.eligible_if_tax
      label: "Is all of the foreign tax entered creditable, after leaving out tax that fails the creditability, holding-period or related-payment rules and making the required foreign-tax reductions?"
      expr:
        op: input
        source: "Is all of the foreign tax entered creditable? Tax that fails the creditability, holding-period or related-payment rules is left out of the amount entered, and the required foreign-tax reductions are made in it, before answering."
      cite:
        doc: i1116
        locator: "pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20, regular tax; p. 2, \"You are still required to take into account the general rules for determining whether a tax is creditable\" and \"You are still required to reduce the taxes available for credit by any amount you would have entered on line 12 of Form 1116\""
    - id: ftc.elect
      printed: (helper)
      type: Bool
      label: The credit is claimed without Form 1116 whenever the election's conditions are met and no carryover from
        another year is claimed (that credit, the smaller of the foreign tax and the regular tax, is never less than a Form
        1116 credit without a carryover, whose line 21 is at most line 20; foreign tax carried in is used only on Form 1116)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.carryover_if_asked
                - const: true
            then: ftc.no
          - guard:
              op: test
              eq:
                - ftc.carryover_if_asked
                - const: false
            then: ftc.yes
      cite:
        doc: i1116
        locator: "pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20, regular tax; pp. 1–2, \"You can’t carry over to or from any other year any foreign taxes paid or accrued\""
      ambiguity: amb.2025.f1116_carryover_election
    - id: ftc.yes
      printed: (helper)
      type: Bool
      label: Year parameter ftc.yes (true)
      expr:
        op: param
        ref: ftc.yes
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t apply and"'
    - id: ftc.limit
      printed: (helper)
      type: NonNegDollars
      label: Year parameter ftc.limit
      expr:
        op: param
        ref: ftc.limit
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.has_tax
      printed: (helper)
      type: Bool
      label: Positive foreign taxes
      expr:
        op: test
        gt:
          - ftc.taxes_if_asked
          - const: 0
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.no
      printed: (helper)
      type: Bool
      label: Year parameter ftc.no (false)
      expr:
        op: param
        ref: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"'
    - id: ftc.all_passive_if_tax
      printed: (helper)
      type: Bool
      label: Whether all foreign-source gross income was passive category income, asked only with foreign tax (false without foreign tax, where neither the election nor Form
        1116 applies)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.all_passive
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"; p. 1, "This
          election is available only if you meet all of the following conditions"'
    - id: ftc.statements_if_tax
      printed: (helper)
      type: Bool
      label: Whether all foreign income and taxes were reported on qualified payee statements, asked only with foreign tax (false without foreign tax, where neither the election nor Form
        1116 applies)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.statements
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"; p. 1, "This
          election is available only if you meet all of the following conditions"'
    - id: ftc.eligible_if_tax
      printed: (helper)
      type: Bool
      label: Whether the creditability, holding-period, related-payment and reduction rules are met, asked only with foreign tax (false without foreign tax, where neither the election nor Form
        1116 applies)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.eligible
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"; p. 1, "This
          election is available only if you meet all of the following conditions"'
    - id: ftc.elect_if_tax
      printed: (helper)
      type: Bool
      label: Whether the election without Form 1116 is made, asked only with foreign tax (false without foreign tax, where neither the election nor Form
        1116 applies)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.elect
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"; p. 1, "This
          election is available only if you meet all of the following conditions"'
    - id: ftc.needs1116
      printed: (helper)
      type: Bool
      label: Foreign tax fails a condition of the election, so the credit is figured on Form 1116
      expr:
        op: test
        all:
          - op: test
            eq:
              - ftc.has_tax
              - const: true
          - op: test
            any:
              - op: test
                gt:
                  - ftc.taxes_if_asked
                  - ftc.limit
              - op: test
                eq:
                  - ftc.all_passive_if_tax
                  - const: false
              - op: test
                eq:
                  - ftc.statements_if_tax
                  - const: false
              - op: test
                eq:
                  - ftc.eligible_if_tax
                  - const: false
              - op: test
                eq:
                  - ftc.elect_if_tax
                  - const: false
              - op: test
                eq:
                  - sa.excluded_income
                  - const: true
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax; i1040gi p. 115, "You aren’t filing Form 4563 or excluding income from sources within Puerto Rico"
    - id: ftc.carryover_no_tax
      printed: (gate)
      type: Bool
      label: A foreign tax credit carried from another year is claimed, with no foreign tax paid in 2025
      expr:
        op: test
        all:
          - op: test
            eq:
              - ftc.carryover_if_asked
              - const: true
          - op: test
            eq:
              - ftc.has_tax
              - const: false
      cite:
        doc: i1116
        locator: p. 19, Line 10, "Enter the unused foreign taxes in the separate category from another tax year that are eligible to be carried forward to or back to 2025"
    - id: ftc.regular_tax
      printed: (helper)
      type: Dollars
      label: Regular tax for the limit (Form 1040 line 16 plus Schedule 2 line 1z)
      expr:
        op: sum
        of:
          - f1040.line16
          - s2.line1z
      cite:
        doc: i1116
        locator: p. 25, Line 20, "Enter the total of Form 1040, 1040-SR, or 1040-NR, line 16, and Schedule 2 (Form 1040), Part I,
          line 1z, less any tax included on line 16 from Form 4972."
    - id: ftc.limited
      printed: (helper)
      type: Dollars
      label: Smaller of ftc.taxes_if_asked, ftc.regular_tax
      expr:
        op: smaller_of
        of:
          - ftc.taxes_if_asked
          - ftc.regular_tax
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.credit_tax
      printed: (helper)
      type: Dollars
      label: With foreign tax, the credit without Form 1116 when the election's conditions are met, and Form 1116 line
        35 when they are not
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.needs1116
                - const: false
            then: ftc.limited
          - guard:
              op: test
              eq:
                - ftc.needs1116
                - const: true
            then: f1116.line35
      cite:
        doc: i1116
        locator: 'pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t apply and"'
    - id: ftc.credit
      printed: (helper)
      type: Dollars
      label: The credit without Form 1116 (the smaller of creditable foreign tax and regular income tax) when the election's
        conditions are met; Form 1116 line 35 when they are not; zero if no foreign tax
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.credit_tax
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.zero
      cite:
        doc: i1116
        locator: 'pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t apply and"'
      refuses:
        - when: ftc.carryover_no_tax
          form: Form 1116 (a carryover with no foreign tax in 2025)
          remedy: A foreign tax credit carried from another year, with no foreign tax paid in 2025, is figured on Form 1116
            from the year's foreign income, which this tool does not ask for without foreign tax.
          cite:
            doc: i1116
            locator: p. 19, Line 10, "Enter the unused foreign taxes in the separate category from another tax year that are eligible to be carried forward to or back to 2025"
