form:
  id: ftc
  kind: form
  title: Foreign tax credit — election without Form 1116
  tax_year: 2025
  note: Creditable foreign tax is a supplied amount after reductions; this slice does not determine
    foreign-tax law or automate holdings/related-payment tests. The election is an explicit user
    choice. NIIT is excluded from regular tax.
  lines:
    - id: ftc.taxes
      printed: (helper)
      type: NonNegDollars
      label: Total creditable foreign taxes after required reductions; generally Form 1099-INT box 6 and
        Form 1099-DIV box 7
      expr:
        op: input
        source: Total creditable foreign taxes after required reductions; generally Form 1099-INT box 6 and
          Form 1099-DIV box 7
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.all_passive
      printed: (helper)
      type: Bool
      gated_by: ftc.all_passive_if_tax
      label: Was all foreign-source gross income passive category income under the small-tax election
        rules?
      expr:
        op: input
        source: Was all foreign-source gross income passive category income under the small-tax election
          rules?
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.statements
      printed: (helper)
      type: Bool
      gated_by: ftc.statements_if_tax
      label: Were all foreign income and taxes reported on qualified payee statements?
      expr:
        op: input
        source: Were all foreign income and taxes reported on qualified payee statements?
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.eligible
      printed: (helper)
      type: Bool
      gated_by: ftc.eligible_if_tax
      label: Have creditability, holding-period, related-payment and required foreign-tax reduction rules
        been satisfied?
      expr:
        op: input
        source: Have creditability, holding-period, related-payment and required foreign-tax reduction rules
          been satisfied?
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.elect
      printed: (helper)
      type: Bool
      gated_by: ftc.elect_if_tax
      label: Elect the credit without Form 1116, with no carryover to or from this election year?
      expr:
        op: input
        source: Elect the credit without Form 1116, with no carryover to or from this election year?
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.limit
      printed: (helper)
      type: NonNegDollars
      label: Year parameter ftc.limit
      expr:
        op: param
        ref: ftc.limit
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.has_tax
      printed: (helper)
      type: Bool
      label: Positive foreign taxes
      expr:
        op: test
        gt:
          - ftc.taxes
          - const: 0
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.no
      printed: (helper)
      type: Bool
      label: Year parameter ftc.no (false)
      expr:
        op: param
        ref: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"'
    - id: ftc.all_passive_if_tax
      printed: (helper)
      type: Bool
      label: Whether all foreign-source gross income was passive category income, asked only with foreign tax (false without foreign tax, where neither the election nor Form
        1116 applies)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.all_passive
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"; p. 1, "This
          election is available only if you meet all of the following conditions"'
    - id: ftc.statements_if_tax
      printed: (helper)
      type: Bool
      label: Whether all foreign income and taxes were reported on qualified payee statements, asked only with foreign tax (false without foreign tax, where neither the election nor Form
        1116 applies)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.statements
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"; p. 1, "This
          election is available only if you meet all of the following conditions"'
    - id: ftc.eligible_if_tax
      printed: (helper)
      type: Bool
      label: Whether the creditability, holding-period, related-payment and reduction rules are met, asked only with foreign tax (false without foreign tax, where neither the election nor Form
        1116 applies)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.eligible
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"; p. 1, "This
          election is available only if you meet all of the following conditions"'
    - id: ftc.elect_if_tax
      printed: (helper)
      type: Bool
      label: Whether the election without Form 1116 is made, asked only with foreign tax (false without foreign tax, where neither the election nor Form
        1116 applies)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.elect
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.no
      cite:
        doc: i1116
        locator: 'p. 2, Purpose of Form, "File Form 1116 to claim the foreign tax credit if the election, earlier, doesn’t
          apply and", "You paid or accrued certain foreign taxes to a foreign country or U.S. territory"; p. 1, "This
          election is available only if you meet all of the following conditions"'
    - id: ftc.needs1116
      printed: (helper)
      type: Bool
      label: Fails a condition of the election
      expr:
        op: test
        all:
          - op: test
            eq:
              - ftc.has_tax
              - const: true
          - op: test
            any:
              - op: test
                gt:
                  - ftc.taxes
                  - ftc.limit
              - op: test
                eq:
                  - ftc.all_passive_if_tax
                  - const: false
              - op: test
                eq:
                  - ftc.statements_if_tax
                  - const: false
              - op: test
                eq:
                  - ftc.eligible_if_tax
                  - const: false
              - op: test
                eq:
                  - ftc.elect_if_tax
                  - const: false
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.regular_tax
      printed: (helper)
      type: Dollars
      label: Regular tax for the limit (Form 1040 line 16 plus Schedule 2 line 1z)
      expr:
        op: sum
        of:
          - f1040.line16
          - s2.line1z
      cite:
        doc: i1116
        locator: p. 25, Line 20, "Enter the total of Form 1040, 1040-SR, or 1040-NR, line 16, and Schedule 2 (Form 1040), Part I,
          line 1z, less any tax included on line 16 from Form 4972."
    - id: ftc.limited
      printed: (helper)
      type: Dollars
      label: Smaller of ftc.taxes, ftc.regular_tax
      expr:
        op: smaller_of
        of:
          - ftc.taxes
          - ftc.regular_tax
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
    - id: ftc.credit
      printed: (helper)
      type: Dollars
      label: Credit is the smaller of creditable foreign tax and regular income tax; zero if no foreign
        tax
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: true
            then: ftc.limited
          - guard:
              op: test
              eq:
                - ftc.has_tax
                - const: false
            then: ftc.zero
      cite:
        doc: i1116
        locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
          regular tax
      refuses:
        - when: ftc.needs1116
          form: Form 1116
          remedy: The small-tax election is unavailable or not chosen. Form 1116 is deferred, not dropped;
            prepare it separately.
          cite:
            doc: i1116
            locator: pp. 1–2, election to claim the foreign tax credit without filing Form 1116; p. 25, Line 20,
              regular tax
