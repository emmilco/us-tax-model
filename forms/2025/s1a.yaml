      locator: 'p. 110, Schedule 1-A, Part V, "Fill out Schedule 1-A, Part V, only if" and "If you are married filing jointly, the spouse who is claiming the enhanced deduction for seniors must have a valid SSN"'
  - id: s1a.spouse_died_before_65_count
    printed: (helper)
    label: 'Your spouse''s entry, if your spouse was born between January 2, 1960, and January 1, 1961, and died in 2025 before reaching age 65'
    type: Count
    expr:
      op: sum_over
      collection: person
      field: person.one
      where:
        op: test
        all:
        - op: test
          eq:
          - person.role
          - const: spouse
        - op: test
          eq:
          - person.died_before_65
          - const: true
    cite:
      doc: i1040gi
      locator: p. 110, Schedule 1-A, Part V, "Death of a taxpayer in 2025"
  - id: s1a.spouse_died_before_65
    printed: (helper)
    label: 'Your spouse was born between January 2, 1960, and January 1, 1961, and died in 2025 before reaching age 65'
    type: Bool
    expr:
      op: test
      gt:
      - s1a.spouse_died_before_65_count
      - const: 0
        type: Count
    cite:
      doc: i1040gi
      locator: p. 110, Schedule 1-A, Part V, "Death of a taxpayer in 2025"
  - id: s1a.spouse_senior_decedent
    printed: (gate)
    label: A spouse who died in 2025 before reaching age 65
    type: Bool
    expr:
      op: test
      eq:
      - s1a.spouse_died_before_65
      - const: true
    cite:
      doc: i1040gi
      locator: p. 110, Schedule 1-A, Part V, "Death of a taxpayer in 2025"
  - id: s1a.line36b_senior
    printed: (helper)
    label: Line 36b for a spouse born before January 2, 1961, with a valid SSN
    type: NonNegDollars
    expr:
      op: copy
      from: s1a.line35
    cite:
