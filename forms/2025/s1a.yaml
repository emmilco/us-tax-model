      form: Enhanced deduction for seniors on the final return of a person who died in 2025 before reaching age 65
      remedy: A person born before January 2, 1961, who died in 2025 before reaching age 65 does not qualify; this case is
        outside this tool.
      cite:
        doc: i1040gi
        locator: p. 110, Schedule 1-A, Part V, "Death of a taxpayer in 2025"
  - id: s1a.line36b
    printed: 36b
    label: If you are married filing jointly, your spouse has a valid social security number (see instructions), and your
      spouse was born before January 2, 1961, enter the amount from line 35
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
