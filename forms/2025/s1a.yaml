form:
  id: s1a
  kind: form
  title: Schedule 1-A (Form 1040) — Additional Deductions
  tax_year: 2025
  note: For a single, head of household, qualifying surviving spouse or married filing jointly return (married filing separately is refused through s3.mfs). Tips and overtime as an employee
    only, by the methods the instructions give for 2025; tips or overtime in a trade or business, Form 4137, and excluded
    Puerto Rico income or Forms 2555 and 4563 are refused. Lines 11, 19 and 28 (a whole number of $1,000 units) are kept as
    that many thousands of dollars; lines 12, 20 and 29 multiply them by $100 or $200 per thousand.
  lines:
  - id: s1a.zero
    printed: (helper)
    label: Year parameter sales.zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025)
  - id: s1a.line1
    printed: '1'
    label: Enter the amount from Form 1040, 1040-SR, or 1040-NR, line 11b
    type: Dollars
    expr:
      op: copy
      from: f1040.line11b
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 1
  - id: s1a.line2a
    printed: 2a
    label: Enter any income from Puerto Rico that you excluded
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part I; Schedule 1-A (2025), line 2a (zero unless refused through sa.excluded_income)
    refuses:
    - when: sa.excluded_income
      form: Schedule 1-A, Part I, lines 2a to 2d (excluded Puerto Rico income, Form 2555, Form 4563)
      remedy: Modified AGI with excluded Puerto Rico income or Form 2555 or 4563 amounts is outside this tool.
      cite:
        doc: i1040gi
        locator: p. 101, Schedule 1-A, Part I, "If you do have excluded income from Puerto Rico, or you are filing Form 2555
          or 4563, complete lines 2a through 2e"
  - id: s1a.line2b
    printed: 2b
    label: Enter the amount from Form 2555, line 45
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part I; Schedule 1-A (2025), line 2b (zero unless refused through sa.excluded_income)
  - id: s1a.line2c
    printed: 2c
    label: Enter the amount from Form 2555, line 50
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part I; Schedule 1-A (2025), line 2c (zero unless refused through sa.excluded_income)
  - id: s1a.line2d
    printed: 2d
    label: Enter the amount from Form 4563, line 15
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part I; Schedule 1-A (2025), line 2d (zero unless refused through sa.excluded_income)
  - id: s1a.line2e
    printed: 2e
    label: Add lines 2a, 2b, 2c, and 2d
    type: NonNegDollars
    expr:
      op: sum
      of:
      - s1a.line2a
      - s1a.line2b
      - s1a.line2c
      - s1a.line2d
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 2e
  - id: s1a.line3
    printed: '3'
    label: Add lines 1 and 2e
    type: Dollars
    expr:
      op: sum
      of:
      - s1a.line1
      - s1a.line2e
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 3
  - id: s1a.tips
    printed: (helper)
    label: Did you receive qualified tips as an employee in 2025 that you want to deduct?
    type: Bool
    expr:
      op: input
      source: Did you receive tips as an employee in 2025 in an occupation on the IRS list of occupations that customarily
        and regularly received tips (IRS.gov/TippedOccupations) that you want to deduct on Schedule 1-A, Part II? (Tips received
        as a non-employee, in your own trade or business, are asked about with Schedule C.)
    cite:
      doc: i1040gi
      locator: pp. 101-103, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"
  - id: s1a.tip_employers
    printed: (helper)
    label: Number of employers on the Qualified Tips From More Than One Employer Worksheet
    type: Count
    expr:
      op: sum_over
      collection: person
      field: person.tip_employers
      where:
        op: test
        eq:
        - person.work_ssn
        - const: true
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 4c
  - id: s1a.tip_total
    printed: (helper)
    label: Worksheet line 2. Add lines 1A through 1E, column (d)
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.tip_total
      where:
        op: test
        eq:
        - person.work_ssn
        - const: true
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, line 2
  - id: s1a.tip_reported
    printed: (helper)
    label: 'Worksheet column (b) total: qualified tips reported on Form W-2 or on Forms 4070'
    type: NonNegDollars
    expr:
      op: sum_over
      collection: person
      field: person.tip_reported
      where:
        op: test
        eq:
        - person.work_ssn
        - const: true
    cite:
      doc: i1040gi
      locator: p. 104, Qualified Tips From More Than One Employer Worksheet, column (b); p. 103, paragraphs 1 through 3, "Enter this
        amount on line 4a"
  - id: s1a.tip_multi
    printed: (helper)
    label: Tips from more than one employer
    type: Bool
    expr:
      op: test
      gt:
      - s1a.tip_employers
      - param: ss.one
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 4a, "If you received qualified tips as an employee with respect to employment with
        more than one employer, enter -0- on line 4a"
  - id: s1a.tip_ssn_count
    printed: (helper)
    label: 'Number of people with a valid SSN who received qualified tips'
    type: Count
    expr:
      op: sum_over
      collection: person
      field: person.one
      where:
        op: test
        all:
        - op: test
          eq:
          - person.work_ssn
          - const: true
        - op: test
          gt:
          - person.tip_employers
          - const: 0
            type: Count
    cite:
      doc: i1040gi
      locator: 'p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if" and "If you are married filing a joint return, the spouse who received the qualified tips must have a valid SSN"'
  - id: s1a.tip_ssn
    printed: (helper)
    label: 'You have a valid SSN or, if married filing jointly, a spouse who received them has a valid SSN'
    type: Bool
    expr:
      op: test
      any:
      - op: test
        all:
        - op: test
          ne:
          - f1040.status
          - const: mfj
        - op: test
          eq:
          - household.taxpayer_work_ssn
          - const: true
      - op: test
        all:
        - op: test
          eq:
          - f1040.status
          - const: mfj
        - op: test
          gt:
          - s1a.tip_ssn_count
          - const: 0
            type: Count
    cite:
      doc: i1040gi
      locator: 'p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if" and "If you are married filing a joint return, the spouse who received the qualified tips must have a valid SSN"'
  - id: s1a.part2
    printed: (helper)
    label: 'Part II applies: qualified tips claimed, not married filing separately, and a person who received them has a valid SSN'
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - s1a.tips
        - const: true
      - op: test
        ne:
        - f1040.status
        - const: mfs
      - op: test
        eq:
        - s1a.tip_ssn
        - const: true
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line4a_calc
    printed: (helper)
    label: 'Figured: Enter qualified tips included on Form W-2, box 7, but see the instructions if Form W-2, box 5 is more
      than $176,100 or you received tips that are not subject to social security and Medicare taxes'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.tip_multi
          - const: true
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.tip_multi
          - const: false
        then: s1a.tip_reported
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 4a; pp. 103-104, paragraphs 1 through 3
  - id: s1a.line4a
    printed: 4a
    label: Enter qualified tips included on Form W-2, box 7, but see the instructions if Form W-2, box 5 is more than $176,100
      or you received tips that are not subject to social security and Medicare taxes
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line4a_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line4b_calc
    printed: (helper)
    label: 'Figured: Qualified tips included on Form 4137, line 1, row A, column (c). If Form 4137 is not filed, enter -0-'
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 4b
    refuses:
    - when: s2.other
      form: Form 4137 (Social Security and Medicare Tax on Unreported Tip Income)
      remedy: Tips reported on Form 4137 are outside this tool.
      cite:
        doc: i1040gi
        locator: p. 101, Schedule 1-A, Part II, "If you received cash and charge tips of $20 or more in a calendar month and
          didn't report all of those tips to your employer, you must file Form 4137"; p. 104, line 4b
  - id: s1a.line4b
    printed: 4b
    label: Qualified tips included on Form 4137, line 1, row A, column (c). If Form 4137 is not filed, enter -0-
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line4b_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line4c_one
    printed: (helper)
    label: 'Line 4c with one employer: the larger of line 4a or line 4b'
    type: NonNegDollars
    expr:
      op: larger_of
      of:
      - s1a.line4a
      - s1a.line4b
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 4c
  - id: s1a.line4c_calc
    printed: (helper)
    label: 'Figured: If you only received qualified tips as an employee with respect to employment with one employer, enter
      the larger of line 4a or line 4b. Otherwise, see the instructions to determine the amount to enter on line 4c'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.tip_multi
          - const: true
        then: s1a.tip_total
      - guard:
          op: test
          eq:
          - s1a.tip_multi
          - const: false
        then: s1a.line4c_one
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 4c, and the Qualified Tips From More Than One Employer Worksheet
  - id: s1a.line4c
    printed: 4c
    label: If you only received qualified tips as an employee with respect to employment with one employer, enter the larger
      of line 4a or line 4b. Otherwise, see the instructions to determine the amount to enter on line 4c
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line4c_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line5_calc
    printed: (helper)
    label: 'Figured: Qualified tips received in the course of a trade or business'
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040gi
      locator: p. 104, Schedule 1-A, line 5
    refuses:
    - when: scope.schedule1
      form: Schedule 1-A, line 5 (qualified tips in a trade or business, with Schedule C, E or F)
      remedy: Income from a trade or business is outside this tool.
      cite:
        doc: i1040gi
        locator: p. 104, Schedule 1-A, line 5, and the Multiple Trades or Businesses Worksheet
    - when: s1.sc_1a
      form: Schedule 1-A, line 5 (qualified tips in a trade or business, with Schedule C)
      remedy: Qualified tips received in a trade or business are outside this tool.
      cite:
        doc: i1040gi
        locator: p. 104, Schedule 1-A, line 5, and the Multiple Trades or Businesses Worksheet
  - id: s1a.line5
    printed: '5'
    label: Qualified tips received in the course of a trade or business
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line5_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line6_calc
    printed: (helper)
    label: 'Figured: Add lines 4c and 5'
    type: NonNegDollars
    expr:
      op: sum
      of:
      - s1a.line4c
      - s1a.line5
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 6
  - id: s1a.line6
    printed: '6'
    label: Add lines 4c and 5
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line6_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line7_calc
    printed: (helper)
    label: 'Figured: Enter the smaller of the amount on line 6 or $25,000'
    type: NonNegDollars
    expr:
      op: smaller_of
      of:
      - s1a.line6
      - s1a.tips_max
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 7
  - id: s1a.line7
    printed: '7'
    label: Enter the smaller of the amount on line 6 or $25,000
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line7_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.tips_max
    printed: (helper)
    label: Year parameter s1a.tips_max ($25,000)
    type: NonNegDollars
    expr:
      op: param
      ref: s1a.tips_max
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 7, $25,000
  - id: s1a.base_other
    printed: (helper)
    label: Year parameter s1a.base_other ($150,000)
    type: NonNegDollars
    expr:
      op: param
      ref: s1a.base_other
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), lines 9 and 17, $150,000
  - id: s1a.base_joint
    printed: (helper)
    label: Year parameter s1a.base_joint ($300,000)
    type: NonNegDollars
    expr:
      op: param
      ref: s1a.base_joint
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), lines 9 and 17, $300,000
  - id: s1a.line8_calc
    printed: (helper)
    label: 'Figured: Enter the amount from line 3'
    type: Dollars
    expr:
      op: copy
      from: s1a.line3
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 8
  - id: s1a.line8
    printed: '8'
    label: Enter the amount from line 3
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line8_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line9_calc
    printed: (helper)
    label: 'Figured: Enter $150,000 ($300,000 if married filing jointly)'
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - f1040.status
          - const: single
        then: s1a.base_other
      - guard:
          op: test
          eq:
          - f1040.status
          - const: mfj
        then: s1a.base_joint
      - guard:
          op: test
          eq:
          - f1040.status
          - const: mfs
        then: s1a.base_other
      - guard:
          op: test
          eq:
          - f1040.status
          - const: hoh
        then: s1a.base_other
      - guard:
          op: test
          eq:
          - f1040.status
          - const: qss
        then: s1a.base_other
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 9
  - id: s1a.line9
    printed: '9'
    label: Enter $150,000 ($300,000 if married filing jointly)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line9_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line10_calc
    printed: (helper)
    label: 'Figured: Subtract line 9 from line 8. If zero or less, enter the amount from line 7 on line 13'
    type: Dollars
    expr:
      op: subtract
      from: s1a.line8
      take: s1a.line9
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 10
  - id: s1a.line10
    printed: '10'
    label: Subtract line 9 from line 8. If zero or less, enter the amount from line 7 on line 13
    type: Dollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line10_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line10_over
    printed: (helper)
    label: Is the amount on line 8 more than the amount on line 9?
    type: Bool
    expr:
      op: test
      gt:
      - s1a.line8
      - s1a.line9
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 10, "If zero or less"
  - id: s1a.line10_pos
    printed: (helper)
    label: Line 10 if more than zero, otherwise zero
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: s1a.line8
      take: s1a.line9
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 10
  - id: s1a.line11_thousands
    printed: (helper)
    label: Line 11. Divide line 10 by $1,000, decreasing the result to the next lower whole number (kept as that many thousands
      of dollars)
    type: NonNegDollars
    expr:
      op: round
      of: s1a.line10_pos
      unit: 100000
      rule: down
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 11 (the whole number of $1,000 units, kept as that many thousands of dollars)
  - id: s1a.line12_calc
    printed: (helper)
    label: 'Figured: Multiply line 11 by $100'
    type: NonNegDollars
    expr:
      op: multiply_rate
      amount: s1a.line11_thousands
      rate:
        param: s1a.hundred_per_thousand
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), lines 11 and 12
  - id: s1a.line12
    printed: '12'
    label: Multiply line 11 by $100
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: false
        then: s1a.zero
      - guard:
          op: test
          eq:
          - s1a.part2
          - const: true
        then: s1a.line12_calc
    cite:
      doc: i1040gi
      locator: p. 101, Schedule 1-A, Part II, "Fill out Schedule 1-A, Part II, only if"; Part II caution, "If married, you
        must file jointly"
  - id: s1a.line13_figured
    printed: (helper)
    label: Subtract line 12 from line 7. If zero or less, enter -0-
    type: NonNegDollars
    expr:
      op: subtract_floor0
      from: s1a.line7
      take: s1a.line12
    cite:
      doc: f1040s1a
      locator: Schedule 1-A (2025), line 13
  - id: s1a.line13_amount
    printed: (helper)
    label: Line 13 when Part II applies
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - s1a.line10_over
          - const: false
        then: s1a.line7
      - guard:
          op: test
          eq:
          - s1a.line10_over
