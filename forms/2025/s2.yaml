form:
  id: s2
  kind: form
  title: Schedule 2 — Additional Taxes (the lines this tool computes)
  tax_year: 2025
  note: Other Schedule 2 sources are screened, not silently defaulted. Form 1040 integration is
    completed in Stage 5.
  lines:
    - id: s2.amt
      printed: (helper)
      type: Bool
      label: Are you required to file Form 6251 or do you have an AMT adjustment requiring its review?
      expr:
        op: input
        source: Are you required to file Form 6251 or do you have an AMT adjustment requiring its review?
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
    - id: s2.other
      printed: (helper)
      type: Bool
      label: 'Any amount on Schedule 2 other than self-employment tax from Schedule SE, Additional Medicare Tax, Net Investment Income Tax or the additional 20% tax on taxable HSA distributions (Form 8889 line 17b, which this tool figures), for example the alternative minimum tax, repayment of a clean vehicle credit, household employment taxes, the additional tax on an HSA you did not keep as an eligible individual (Form 8889 Part III), uncollected social security or Medicare tax on tips or group-term life insurance (W-2 box 12 codes A, B, M or N), tax on unreported tips (Form 4137), or interest on deferred tax? (Form 5329 Part I, early distributions, and the 2025 HSA excess are figured by this tool and are not other amounts.)'
      expr:
        op: input
        source: 'Any amount on Schedule 2 other than self-employment tax from Schedule SE, Additional Medicare Tax, Net Investment Income Tax or the additional 20% tax on taxable HSA distributions (Form 8889 line 17b, which this tool figures), for example the alternative minimum tax, repayment of a clean vehicle credit, household employment taxes, the additional tax on an HSA you did not keep as an eligible individual (Form 8889 Part III), uncollected social security or Medicare tax on tips or group-term life insurance (W-2 box 12 codes A, B, M or N), tax on unreported tips (Form 4137), or interest on deferred tax? (Form 5329 Part I, early distributions, and the 2025 HSA excess are figured by this tool and are not other amounts.)'
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
    - id: s2.zero
      printed: (helper)
      type: NonNegDollars
      label: Year parameter sales.zero
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
    - id: s2.line1a
      printed: 1a
      type: NonNegDollars
      label: Excess advance premium tax credit repayment. Attach Form 8962
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f8962.any
                - const: true
            then: f8962.line29
          - guard:
              op: test
              eq:
                - f8962.any
                - const: false
            then: s2.zero
      cite:
        doc: f1040s2
        locator: 'p. 1, Part I, line 1a, "Excess advance premium tax credit repayment. Attach Form 8962"; i1040gi p. 111, "If
          the advance credit payments were more than the premium tax credit you can claim, the amount you must repay will be
          shown on Form 8962, line 29."'
    - id: s2.line1z
      printed: 1z
      type: NonNegDollars
      label: Add lines 1a through 1y (lines 1b to 1y are refused by the Schedule 2 screen)
      expr:
        op: copy
        from: s2.line1a
      cite:
        doc: f1040s2
        locator: 'p. 1, Part I, line 1z, "Add lines 1a through 1y"'
    - id: s2.line2
      printed: "2"
      type: NonNegDollars
      label: Amount from s2.zero
      expr:
        op: copy
        from: s2.zero
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
      refuses:
        - when: s2.amt
          form: Form 6251
          remedy: Alternative minimum tax is outside scope; prepare Form 6251.
          cite:
            doc: f1040s2
            locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
        - when: s2.other
          form: Schedule 2 additional source forms
          remedy: Prepare the other required tax forms; this slice supports only Schedule SE and Forms 8959 and 8960.
          cite:
            doc: f1040s2
            locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
    - id: s2.line3
      printed: "3"
      type: NonNegDollars
      label: Add lines 1z and 2
      expr:
        op: sum
        of:
          - s2.line1z
          - s2.line2
      cite:
        doc: f1040s2
        locator: 'p. 1, Part I, line 3, "Add lines 1z and 2. Enter here and on Form 1040, 1040-SR, or 1040-NR, line 17"'
      refuses:
        - when: s2.amt
          form: Form 6251
          remedy: Alternative minimum tax is outside scope; prepare Form 6251.
          cite:
            doc: f1040s2
            locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
        - when: s2.other
          form: Schedule 2 additional source forms
          remedy: Prepare the other required tax forms; this slice supports only Schedule SE and Forms 8959 and 8960.
          cite:
            doc: f1040s2
            locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
    - id: s2.line4
      printed: "4"
      type: NonNegDollars
      label: Self-employment tax. Attach Schedule SE
      expr:
        op: sum_over
        collection: person
        field: person.se_line12
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), line 4; i1040sse p. 2, Joint Returns, "Enter the combined SE tax on Schedule 2 (Form 1040), line 4"
    - id: s2.line8_must
      printed: (helper)
      type: Count
      label: Persons who must file Form 5329
      expr:
        op: sum_over
        collection: person
        field: person.x_must
      cite:
        doc: i5329
        locator: 'p. 1, Who Must File, "However, if distribution code 1 is correctly shown in box 7 of all your Forms 1099-R and you owe the additional tax on the full amount shown on each Form 1099-R, you don’t have to file Form 5329."'
    - id: s2.line8_file
      printed: (helper)
      type: Bool
      label: Someone on the return must file Form 5329, so a Form 5329 is prepared for each person with an early distribution
      expr:
        op: test
        gt:
          - s2.line8_must
          - const: 0
            type: Count
      cite:
        doc: i5329
        locator: 'p. 1, Who Must File, "However, if distribution code 1 is correctly shown in box 7 of all your Forms 1099-R and you owe the additional tax on the full amount shown on each Form 1099-R, you don’t have to file Form 5329."'
      ambiguity: amb.2025.f5329_joint_box
    - id: s2.e05_total
      printed: (helper)
      type: NonNegDollars
      label: Exception 05 (medical expenses) amounts of everyone on the return, each person's already limited to Schedule A line 4
      expr:
        op: sum_over
        collection: person
        field: person.x_c05
      cite:
        doc: i5329
        locator: 'p. 5, Line 2, "Qualified retirement plan distributions up to the amount you paid for unreimbursed medical expenses during the year minus 7.5% of your adjusted gross income (AGI) for the year."'
    - id: s2.e05_over
      printed: (gate)
      type: Bool
      label: On a joint return, medical-expense exceptions of both spouses above the medical expenses over 7.5% of AGI
      expr:
        op: test
        all:
          - op: test
            gt:
              - s2.e05_total
              - const: 0
          - op: test
            gt:
              - s2.e05_total
              - sa.line4
      cite:
        doc: i5329
        locator: 'p. 5, Line 2, "Qualified retirement plan distributions up to the amount you paid for unreimbursed medical expenses during the year minus 7.5% of your adjusted gross income (AGI) for the year."'
      ambiguity: amb.2025.f5329_medical_joint
    - id: s2.line8
      printed: "8"
      type: NonNegDollars
      label: Additional tax on IRAs or other tax-favored accounts. Attach Form 5329 if required
      expr:
        op: sum_over
        collection: person
        field: person.x_tax
      cite:
        doc: f1040s2
        locator: 'p. 1, Part II, line 8, "Additional tax on IRAs or other tax-favored accounts. Attach Form 5329 if required. If not required, check here"'
      refuses:
        - when: s2.e05_over
          form: Form 5329 line 2 (exception 05 of both spouses)
          remedy: The medical-expense exceptions of both spouses together exceed the medical expenses above 7.5% of your joint
            AGI; reduce them so that together they do not exceed it.
          cite:
            doc: i5329
            locator: 'p. 5, Line 2, "Qualified retirement plan distributions up to the amount you paid for unreimbursed medical expenses during the year minus 7.5% of your adjusted gross income (AGI) for the year."'
    - id: s2.line8_box
      printed: 8 (box)
      type: Bool
      label: If not required, check here (the 10% tax on code 1 distributions entered directly, without Form 5329)
      display: The Schedule 2 line 8 check box, shown on the values sheet; it changes no amount.
      expr:
        op: test
        all:
          - op: test
            gt:
              - s2.line8
              - const: 0
          - op: test
            eq:
              - s2.line8_file
              - const: false
      cite:
        doc: f1040s2
        locator: 'p. 1, Part II, line 8, "Additional tax on IRAs or other tax-favored accounts. Attach Form 5329 if required. If not required, check here"; i1040gi p. 112, Line 8, "Also check the box on line 8 to indicate that you don’t have to file Form 5329."'
    - id: s2.line11
      printed: "11"
      type: NonNegDollars
      label: Amount from f8959.line18
      expr:
        op: copy
        from: f8959.line18
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
    - id: s2.line12
      printed: "12"
      type: NonNegDollars
      label: Amount from f8960.line17
      expr:
        op: copy
        from: f8960.line17
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
    - id: s2.line17c
      printed: 17c
      type: NonNegDollars
      label: Additional tax on HSA distributions. Attach Form 8889
      expr:
        op: sum_over
        collection: person
        field: person.hsa_addtax
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), line 17c; f8889 line 17b, "Also, include this amount in the total on Schedule 2 (Form
          1040), Part II, line 17c"
    - id: s2.line18
      printed: "18"
      type: NonNegDollars
      label: Total additional taxes. Add lines 17a through 17z
      expr:
        op: copy
        from: s2.line17c
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), line 18 (the other line 17 items are refused by s2.other)
    - id: s2.line21
      printed: "21"
      type: NonNegDollars
      label: Add s2.line4, s2.line8, s2.line11, s2.line12, s2.line18
      expr:
        op: sum
        of:
          - s2.line4
          - s2.line8
          - s2.line11
          - s2.line12
          - s2.line18
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), line 21, "Add lines 4, 7 through 16, 18, and 19. These are your total other taxes"
      refuses:
        - when: s2.amt
          form: Form 6251
          remedy: Alternative minimum tax is outside scope; prepare Form 6251.
          cite:
            doc: f1040s2
            locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
        - when: s2.other
          form: Schedule 2 additional source forms
          remedy: Prepare the other required tax forms; this slice supports only Schedule SE and Forms 8959 and 8960.
          cite:
            doc: f1040s2
            locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
