      label: Number of people on the return with a Form 8919 firm under reason code G
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          eq:
            - person.f8919_ss8
            - const: true
      cite:
        doc: f8919
        locator: 'p. 1, Reason codes, "enter reason code G and file Form SS-8 on or before the date you file your tax return"'
    - id: s2.ss8_notice
      printed: (helper)
      type: Bool
      label: 'Notice: for each firm given reason code G on Form 8919, file Form SS-8 with the IRS, separately and not
        attached to this return, on or before the date you file it'
      expr:
        op: test
        gt:
          - s2.ss8_count
          - const: 0
            type: Count
      cite:
        doc: f8919
        locator: 'p. 1, Reason codes, "If none of the reason codes apply to you, but you believe you should have been treated
          as an employee, enter reason code G and file Form SS-8 on or before the date you file your tax return"; p. 2,
          "Don’t attach Form SS-8 to your tax return. Form SS-8 must be filed separately"'
    - id: s2.ss_medicare_total
      printed: "7"
      type: NonNegDollars
      label: Total additional social security and Medicare tax. Add lines 5 and 6
      expr:
        op: sum
        of:
          - s2.tip_ss_tax
          - s2.wage_ss_tax
      cite:
        doc: f1040s2
        locator: 'Schedule 2 (2025), line 7, "Total additional social security and Medicare tax. Add lines 5 and 6"'
    - id: s2.tax_favored_accounts_must
      printed: (helper)
      type: Count
      label: Persons who must file Form 5329
      expr:
        op: sum_over
        collection: person
        field: person.x_must
      cite:
        doc: i5329
        locator: 'p. 1, Who Must File, "However, if distribution code 1 is correctly shown in box 7 of all your Forms 1099-R and you owe the additional tax on the full amount shown on each Form 1099-R, you don’t have to file Form 5329."'
    - id: s2.tax_favored_accounts_file
      printed: (helper)
      type: Bool
      label: Someone on the return must file Form 5329, so a Form 5329 is prepared for each person with an early distribution
      expr:
        op: test
        gt:
          - s2.tax_favored_accounts_must
          - const: 0
            type: Count
      cite:
        doc: i5329
        locator: 'p. 1, Who Must File, "However, if distribution code 1 is correctly shown in box 7 of all your Forms 1099-R and you owe the additional tax on the full amount shown on each Form 1099-R, you don’t have to file Form 5329."'
      ambiguity: amb.2025.f5329_joint_box
    - id: s2.e05_total
      printed: (helper)
      type: NonNegDollars
      label: Exception 05 (medical expenses) amounts of everyone on the return, each person's already limited to Schedule A line 4
      expr:
        op: sum_over
        collection: person
        field: person.x_c05
      cite:
        doc: i5329
        locator: 'p. 5, Line 2, "Qualified retirement plan distributions up to the amount you paid for unreimbursed medical expenses during the year minus 7.5% of your adjusted gross income (AGI) for the year."'
    - id: s2.e05_over
      printed: (gate)
      type: Bool
      label: On a joint return, medical-expense exceptions of both spouses above the medical expenses over 7.5% of AGI
      expr:
        op: test
        all:
          - op: test
            gt:
              - s2.e05_total
              - const: 0
          - op: test
            gt:
              - s2.e05_total
              - sa.line4
      cite:
        doc: i5329
        locator: 'p. 5, Line 2, "Qualified retirement plan distributions up to the amount you paid for unreimbursed medical expenses during the year minus 7.5% of your adjusted gross income (AGI) for the year."'
      ambiguity: amb.2025.f5329_medical_joint
    - id: s2.tax_favored_accounts
      printed: "8"
      type: NonNegDollars
      label: Additional tax on IRAs or other tax-favored accounts. Attach Form 5329 if required
      expr:
        op: sum_over
        collection: person
        field: person.x_tax
      cite:
        doc: f1040s2
        locator: 'p. 1, Part II, line 8, "Additional tax on IRAs or other tax-favored accounts. Attach Form 5329 if required. If not required, check here"'
      refuses:
        - when: s2.e05_over
          form: Form 5329 line 2 (exception 05 of both spouses)
          remedy: The medical-expense exceptions of both spouses together exceed the medical expenses above 7.5% of your joint
            AGI; reduce them so that together they do not exceed it.
          cite:
            doc: i5329
            locator: 'p. 5, Line 2, "Qualified retirement plan distributions up to the amount you paid for unreimbursed medical expenses during the year minus 7.5% of your adjusted gross income (AGI) for the year."'
    - id: s2.tax_favored_accounts_box
      printed: 8 (box)
      type: Bool
      label: If not required, check here (the 10% tax on code 1 distributions entered directly, without Form 5329)
      display: The Schedule 2 line 8 check box, shown on the values sheet; it changes no amount.
      expr:
        op: test
        all:
          - op: test
            gt:
              - s2.tax_favored_accounts
              - const: 0
          - op: test
            eq:
              - s2.tax_favored_accounts_file
              - const: false
      cite:
        doc: f1040s2
        locator: 'p. 1, Part II, line 8, "Additional tax on IRAs or other tax-favored accounts. Attach Form 5329 if required. If not required, check here"; i1040gi p. 112, Line 8, "Also check the box on line 8 to indicate that you don’t have to file Form 5329."'
    - id: s2.line11
      printed: "11"
      type: NonNegDollars
      label: Amount from f8959.total_tax
      expr:
        op: copy
        from: f8959.total_tax
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
    - id: s2.niit
      printed: "12"
      type: NonNegDollars
      label: Amount from f8960.line17
      expr:
        op: copy
        from: f8960.line17
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
    - id: s2.hsa_distribution_tax
      printed: 17c
      type: NonNegDollars
      label: Additional tax on HSA distributions. Attach Form 8889
      expr:
        op: sum_over
        collection: person
        field: person.hsa_addtax
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), line 17c; f8889 line 17b, "Also, include this amount in the total on Schedule 2 (Form
          1040), Part II, line 17c"
    - id: s2.other_additional_total
      printed: "18"
      type: NonNegDollars
      label: Total additional taxes. Add lines 17a through 17z
      expr:
        op: copy
        from: s2.hsa_distribution_tax
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), line 18 (the other line 17 items are refused by s2.other)
    - id: s2.line21
      printed: "21"
      type: NonNegDollars
      label: Add s2.line4, s2.ss_medicare_total, s2.tax_favored_accounts, s2.line11, s2.niit, s2.other_additional_total
      expr:
        op: sum
        of:
          - s2.line4
          - s2.ss_medicare_total
          - s2.tax_favored_accounts
          - s2.line11
          - s2.niit
          - s2.other_additional_total
      cite:
        doc: f1040s2
        locator: Schedule 2 (2025), line 21, "Add lines 4, 7 through 16, 18, and 19. These are your total other taxes"
      refuses:
        - when: s2.other
          form: Schedule 2 additional source forms
          remedy: Prepare the other required tax forms; this slice supports only Schedule SE and Forms 8959 and 8960.
          cite:
            doc: f1040s2
            locator: Schedule 2 (2025), lines 2, 3, 11, 12 and 21
