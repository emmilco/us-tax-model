form:
  id: s2
  kind: form
  title: Schedule 2 — Additional Taxes (the lines this tool computes)
  tax_year: 2025
  note: Other Schedule 2 sources are screened, not silently defaulted. Form 1040 integration is
    completed in Stage 5.
  lines:
    - id: s2.no
      printed: (helper)
      type: Bool
      label: "Year parameter household.no (false)"
      expr:
        op: param
        ref: household.no
      cite:
        doc: f1040s2
        locator: "Schedule 2 (2025), lines 2, 3, 11, 12 and 21"
    - id: s2.options_any
      printed: (helper)
      type: Bool
      label: "In 2025, did you (or, on a joint return, your spouse) exercise employee stock options, including options inherited or received in a divorce?"
      expr:
        op: input
        source: "In 2025, did you (or, on a joint return, your spouse) exercise employee stock options, including options inherited or received in a divorce?"
      cite:
        doc: f1040s2
        locator: "Schedule 2 (2025), lines 2, 3, 11, 12 and 21"
    - id: s2.iso
      printed: (helper)
      type: Bool
      gated_by: s2.iso_if_options
      label: "Did you (or, on a joint return, your spouse) exercise incentive stock options in 2025 and not dispose of the stock in 2025?"
      expr:
        op: input
        source: "Did you (or, on a joint return, your spouse) exercise incentive stock options in 2025 and not dispose of the stock in 2025?"
      cite:
        doc: i6251
        locator: "Who Must File; Part I, the adjustment for the exercise of incentive stock options"
    - id: s2.iso_if_options
      printed: (gate)
      type: Bool
      label: "Incentive stock options exercised in 2025 with the stock not disposed of in 2025, asked only with stock options exercised (false without them)"
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - s2.options_any
            - const: true
          then: s2.iso
        - guard:
            op: test
            eq:
            - s2.options_any
            - const: false
          then: s2.no
      cite:
        doc: i6251
        locator: 'p. 1, Who Must File, "Attach Form 6251 to your return if any of the following statements are true"; p. 4, Line 2i—Exercise of Incentive Stock Options, "For the regular tax, no income is recognized when an incentive stock option (ISO), as defined in section 422(b), is exercised. However, this rule doesn’t apply for the AMT"'
    - id: s2.iso_vested
      printed: (helper)
      type: Bool
      label: "Did shares that you (or, on a joint return, your spouse) bought before 2025 with incentive stock options vest in 2025, that is, first become yours to sell or no longer able to be forfeited?"
      expr:
        op: input
        source: "Did shares that you (or, on a joint return, your spouse) bought before 2025 with incentive stock options vest in 2025, that is, first become yours to sell or no longer able to be forfeited?"
      cite:
        doc: i6251
        locator: 'p. 4, Line 2i—Exercise of Incentive Stock Options, "when your rights in the acquired stock first become transferable or when these rights are no longer subject to a substantial risk of forfeiture", "you may elect to include in AMT income the excess of the stock’s FMV (determined without regard to any lapse restriction) over the exercise price upon the transfer to you"; p. 1, Who Must File, "Attach Form 6251 to your return if any of the following statements are true"'
    - id: s2.amt_mfs_max
      printed: (helper)
      type: NonNegDollars
      label: Year parameter amt.mfs_addback_max ($68,500)
      expr: { op: param, ref: amt.mfs_addback_max }
      cite:
        doc: i6251
        locator: 'p. 9, Line 4—Alternative Minimum Taxable Income, "If line 4 is $1,174,350 or more, include an additional $68,500"'
    - id: s2.amt_exemption
      printed: (helper)
      type: NonNegDollars
      label: "Exemption Worksheet line 1: $88,100 if single or head of household; $137,000 if married filing jointly or qualifying surviving spouse; $68,500 if married filing separately"
      expr: { op: param, ref: amt.exemption }
      cite:
        doc: i6251
        locator: 'p. 9, Exemption Worksheet—Line 5, line 1, "Enter $88,100 if single or head of household; $137,000 if married filing jointly or qualifying surviving spouse; or $68,500 if married filing separately"'
    - id: s2.amt_l19
      printed: (helper)
      type: NonNegDollars
      label: "Form 6251 line 19: $96,700 if married filing jointly or qualifying surviving spouse, $48,350 if single or married filing separately, $64,750 if head of household"
      expr: { op: param, ref: qdcg.zero_rate_ceiling }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 19, "$96,700 if married filing jointly or qualifying surviving spouse, $48,350 if single or married filing separately, or $64,750 if head of household"'
    - id: s2.amt_l25
      printed: (helper)
      type: NonNegDollars
      label: "Form 6251 line 25: $533,400 if single, $300,000 if married filing separately, $600,050 if married filing jointly or qualifying surviving spouse, $566,700 if head of household"
      expr: { op: param, ref: qdcg.fifteen_rate_ceiling }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 25, "$533,400 if single, $300,000 if married filing separately, $600,050 if married filing jointly or qualifying surviving spouse, or $566,700 if head of household"'
    - id: s2.amt_l1a
      printed: (helper)
      type: Dollars
      label: "Form 6251 line 1a: Form 1040 line 14 less Schedule 1-A line 37"
      expr: { op: subtract, from: f1040.line14, take: s1a.senior_deduction }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 1a, "Subtract Schedule 1-A (Form 1040), line 37, from Form 1040, 1040-SR, or 1040-NR, line 14"; i6251 p. 2, Line 1a'
    - id: s2.amt_l1b
      printed: (helper)
      type: Dollars
      label: "Form 6251 line 1b: Form 1040 line 11b less line 1a (negative if less than zero)"
      expr: { op: subtract, from: f1040.line11b, take: s2.amt_l1a }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 1b, "Subtract line 1a from Form 1040, 1040-SR, or 1040-NR, line 11b (if less than zero, enter as a negative amount)"'
    - id: s2.amt_l2a
      printed: (helper)
      type: NonNegDollars
      label: "Form 6251 line 2a: the taxes of Schedule A line 7 when itemizing, otherwise the standard deduction (Form 1040 line 12e)"
      expr:
        op: choose
        alternatives:
        - guard: { op: test, eq: [sa.itemizes, { const: true }] }
          then: sa.line7
        - guard: { op: test, eq: [sa.itemizes, { const: false }] }
          then: f1040.line12e
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 2a, "If filing Schedule A (Form 1040), enter the taxes from Schedule A, line 7; otherwise, enter the amount from Form 1040 or 1040-SR, line 12e"'
    - id: s2.amt_dep
      printed: (helper)
      type: NonNegDollars
      label: "The most that Form 6251 line 2l (post-1986 depreciation) can add: the regular-tax MACRS depreciation of every business that the alternative minimum tax may refigure"
      expr: { op: sum_over, collection: person, field: person.amt_dep }
      cite:
        doc: i6251
        locator: 'p. 6, Line 2l, How Is the Adjustment Figured?, "Subtract the AMT deduction for depreciation from the regular tax deduction and enter the result"; p. 5, What Depreciation Must Be Refigured for the AMT?, "Property placed in service after 1998 that is depreciated for the regular tax using the 200% declining balance method"'
    - id: s2.amt_dep_any
      printed: (gate)
      type: Bool
      label: Some business depreciation that the alternative minimum tax may refigure is deducted
      expr: { op: test, gt: [s2.amt_dep, { const: 0 }] }
      cite:
        doc: i6251
        locator: 'p. 9, Line 3, Related Adjustments, "If you have an entry on line 2c because you deducted investment interest allocable to an interest in a trade or business, or on line 2d, 2h, 2i, or 2k through 2t"'
    - id: s2.amt_rel_items
      printed: (helper)
      type: NonNegDollars
      label: The deductions limited by business income that a related adjustment can refigure (section 179, SE retirement plans, SE health insurance, IRA deduction)
      expr: { op: sum, of: [s179.line12, s1.line16, s1.line17, s1.line20] }
      cite:
        doc: i6251
        locator: 'p. 9, Line 3, Related Adjustments, "Section 179 expense deduction (Form 4562, line 12)", "Self-employed health insurance deduction (Schedule 1 (Form 1040), line 17)", "Self-employed SEP, SIMPLE, and qualified plans deduction (Schedule 1 (Form 1040), line 16)", "IRA deduction (Schedule 1 (Form 1040), line 20), affected by the earned income limitation of section 219(b)(1)(B)"'
    - id: s2.amt_rel
      printed: (helper)
      type: NonNegDollars
      label: "The most that related adjustments (Form 6251 line 3) can add: those deductions when depreciation may be refigured, otherwise zero"
      expr:
        op: choose
        alternatives:
        - guard: { op: test, eq: [s2.amt_dep_any, { const: true }] }
          then: s2.amt_rel_items
        - guard: { op: test, eq: [s2.amt_dep_any, { const: false }] }
          then: s2.zero
      cite:
        doc: i6251
        locator: 'p. 9, Line 3, Related Adjustments, "you may have to refigure any item of income or deduction based on a limit of income other than adjusted gross income (AGI) or modified AGI", "Figure the difference between the AMT and regular tax amount for each item"'
    - id: s2.amt_l4_known
      printed: (helper)
      type: Dollars
      label: "Form 6251 line 4 at its largest from what is known before the private activity bond question: lines 1b and 2a, less the refund of Schedule 1 line 1 (line 2b), with the depreciation and related adjustments at their largest"
      expr: { op: subtract, from: s2.amt_l4_sum, take: s1.line1 }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 4, "Alternative minimum taxable income. Combine lines 1b through 3"; line 2b, "Tax refund from Schedule 1 (Form 1040), line 1 or line 8z"'
    - id: s2.amt_l4_sum
      printed: (helper)
      type: Dollars
      label: Lines 1b, 2a and 2e (the net operating loss deduction), with the depreciation and related adjustments at their largest
      expr: { op: sum, of: [s2.amt_l1b, s2.amt_l2a, s2.amt_dep, s2.amt_rel, s1.nol_amount_if_nol] }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 4, "Alternative minimum taxable income. Combine lines 1b through 3"; line 2e, "Net
          operating loss deduction from Schedule 1 (Form 1040), line 8a. Enter as a positive amount" (line 2f, the
          alternative tax net operating loss deduction, entered as a negative amount, taken at zero for the largest line 4)'
    - id: s2.amt_pab
      printed: (helper)
      type: NonNegDollars
      gated_by: s2.amt_pab_if_could
      label: "Of your (or, on a joint return, your spouse's) tax-exempt interest, how much is from private activity bonds: box 9 of your Forms 1099-INT, plus any tax-exempt OID (Form 1099-OID box 11) on a private activity bond? Zero if none."
      expr:
        op: input
        source: "Of your (or, on a joint return, your spouse's) tax-exempt interest, how much is from private activity bonds: box 9 of your Forms 1099-INT, plus any tax-exempt OID (Form 1099-OID box 11) on a private activity bond? Zero if none."
      cite:
        doc: i6251
        locator: 'p. 3, Line 2g—Interest From Private Activity Bonds, "Each payer of this type of interest should send you a Form 1099-INT showing the amount of this interest in box 9"; i1099int p. 1, "For a specified private activity bond with OID, report the tax-exempt OID in box 11 on Form 1099-OID, and the tax-exempt stated interest in boxes 8 and 9 on Form 1099-INT"'
    - id: s2.amt_pab_ask
      printed: (gate)
      type: Bool
      label: Tax-exempt interest is entered and the alternative minimum tax could apply if all of it were from private activity bonds
      expr:
        op: test
        all:
        - op: test
          gt: [f1040.tax_exempt_interest_if_any, { const: 0 }]
        - op: test
          eq: [s2.amt_could, { const: true }]
      cite:
        doc: i6251
        locator: 'p. 3, Line 2g—Interest From Private Activity Bonds, "Enter on line 2g interest income from “specified private activity bonds”"'
    - id: s2.amt_pab_if_could
      printed: (gate)
      type: NonNegDollars
      label: "Form 6251 line 2g: private activity bond interest, asked only where it could matter (zero otherwise)"
      expr:
        op: choose
        alternatives:
        - guard: { op: test, eq: [s2.amt_pab_ask, { const: true }] }
          then: s2.amt_pab
        - guard: { op: test, eq: [s2.amt_pab_ask, { const: false }] }
          then: s2.zero
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 2g, "Interest from specified private activity bonds exempt from the regular tax"'
    - id: s2.amt_pab_over
      printed: (gate)
      type: Bool
      label: The private activity bond interest entered is more than all tax-exempt interest
      expr:
        op: test
        all:
        - op: test
          eq: [s2.amt_pab_ask, { const: true }]
        - op: test
          gt: [s2.amt_pab_if_could, f1040.tax_exempt_interest_if_any]
      cite:
        doc: i6251
        locator: 'p. 3, Line 2g—Interest From Private Activity Bonds, "the interest on which isn’t includible in gross income for the regular tax"'
    - id: s2.amt_l4
      printed: (helper)
      type: Dollars
      label: "Form 6251 line 4, at its largest: the known amount plus private activity bond interest"
      expr: { op: sum, of: [s2.amt_l4_known, s2.amt_pab_if_could] }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 4, "Alternative minimum taxable income. Combine lines 1b through 3"'
      refuses:
        - when: s2.amt_pab_over
          form: Form 1099-INT box 9
          remedy: Private activity bond interest (box 9) is part of tax-exempt interest (box 8); correct the amounts entered.
          cite:
            doc: i6251
            locator: 'p. 3, Line 2g—Interest From Private Activity Bonds, "Each payer of this type of interest should send you a Form 1099-INT showing the amount of this interest in box 9"'
    - id: s2.amt_mfs
      printed: (gate)
      type: Bool
      label: Married filing separately
      expr: { op: test, eq: [f1040.status, { const: mfs }] }
      cite:
        doc: i6251
        locator: 'p. 9, Line 4—Alternative Minimum Taxable Income, "If your filing status is married filing separately and line 4 is more than $900,350, you must include an additional amount on line 4"'
    - id: s2.amt_mfs_over
      printed: (helper)
      type: NonNegDollars
      label: Line 4 over $900,350
      expr: { op: subtract_floor0, from: s2.amt_l4, take: { param: amt.mfs_addback_start } }
      cite:
        doc: i6251
        locator: 'p. 9, Line 4—Alternative Minimum Taxable Income, "Otherwise, include 25% of the excess of the amount on line 4 over $900,350"'
    - id: s2.amt_mfs_phaseout_part
      printed: (helper)
      type: NonNegDollars
      label: 25% of line 4 over $900,350
      expr: { op: multiply_rate, amount: s2.amt_mfs_over, rate: { param: amt.rate_25 } }
      cite:
        doc: i6251
        locator: 'p. 9, Line 4—Alternative Minimum Taxable Income, "Otherwise, include 25% of the excess of the amount on line 4 over $900,350"'
    - id: s2.amt_mfs_add
      printed: (helper)
      type: NonNegDollars
      label: The additional amount for married filing separately, not more than $68,500
      expr: { op: smaller_of, of: [s2.amt_mfs_phaseout_part, s2.amt_mfs_max] }
      cite:
        doc: i6251
        locator: 'p. 9, Line 4—Alternative Minimum Taxable Income, "If line 4 is $1,174,350 or more, include an additional $68,500"'
    - id: s2.amt_l4_mfs
      printed: (helper)
      type: Dollars
      label: Line 4 with the additional amount for married filing separately
      expr: { op: sum, of: [s2.amt_l4, s2.amt_mfs_add] }
      cite:
        doc: i6251
        locator: 'p. 9, Line 4—Alternative Minimum Taxable Income, "For example, if the amount on line 4 is $920,350, enter $925,350 instead"'
    - id: s2.amt_l4m
      printed: (helper)
      type: Dollars
      label: "Form 6251 line 4, at its largest, as entered (with the additional amount when married filing separately)"
      expr:
        op: choose
        alternatives:
        - guard: { op: test, eq: [s2.amt_mfs, { const: true }] }
          then: s2.amt_l4_mfs
        - guard: { op: test, eq: [s2.amt_mfs, { const: false }] }
          then: s2.amt_l4
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 4, "(If married filing separately and line 4 is more than $900,350, see instructions.)"'
    - id: s2.amt_ex_over
      printed: (helper)
      type: NonNegDollars
      label: "Exemption Worksheet line 4: line 4 over the phase-out amount"
      expr: { op: subtract_floor0, from: s2.amt_l4m, take: { param: amt.phaseout_start } }
      cite:
        doc: i6251
        locator: 'p. 9, Exemption Worksheet—Line 5, line 4, "Subtract line 3 from line 2. If zero or less, enter -0-"'
    - id: s2.amt_ex_cut
      printed: (helper)
      type: NonNegDollars
      label: "Exemption Worksheet line 5: 25% of its line 4"
      expr: { op: multiply_rate, amount: s2.amt_ex_over, rate: { param: amt.rate_25 } }
      cite:
        doc: i6251
        locator: 'p. 9, Exemption Worksheet—Line 5, line 5, "Multiply line 4 by 25% (0.25)"'
    - id: s2.amt_l5
      printed: (helper)
      type: NonNegDollars
      label: "Form 6251 line 5: the exemption (Exemption Worksheet line 6)"
      expr: { op: subtract_floor0, from: s2.amt_exemption, take: s2.amt_ex_cut }
      cite:
        doc: i6251
        locator: 'p. 9, Exemption Worksheet—Line 5, line 6, "Subtract line 5 from line 1. If zero or less, enter -0-. Also, enter this amount on Form 6251, line 5"'
    - id: s2.amt_l6
      printed: (helper)
      type: NonNegDollars
      label: "Form 6251 line 6: line 4 less line 5 (zero if zero or less)"
      expr: { op: subtract_floor0, from: s2.amt_l4m, take: s2.amt_l5 }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 6, "Subtract line 5 from line 4. If more than zero, go to line 7. If zero or less, enter -0- here and on lines 7, 9, and 11, and go to line 10"'
    - id: s2.amt_l6_high
      printed: (gate)
      type: Bool
      label: Line 6 is more than $239,100 ($119,550 if married filing separately)
      expr: { op: test, gt: [s2.amt_l6, { param: amt.bracket }] }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 39, "If line 12 is $239,100 or less ($119,550 or less if married filing separately), multiply line 12 by 26% (0.26)"'
    - id: s2.amt_l39_low
      printed: (helper)
      type: NonNegDollars
      label: Line 6 times 26%
      expr: { op: multiply_rate, amount: s2.amt_l6, rate: { param: amt.rate_26 } }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 39, "multiply line 12 by 26% (0.26)"'
    - id: s2.amt_l39_product
      printed: (helper)
      type: NonNegDollars
      label: Line 6 times 28%
      expr: { op: multiply_rate, amount: s2.amt_l6, rate: { param: amt.rate_28 } }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 39, "Otherwise, multiply line 12 by 28% (0.28) and subtract $4,782 ($2,391 if married filing separately) from the result"'
    - id: s2.amt_l39_high
      printed: (helper)
      type: Dollars
      label: Line 6 times 28%, less $4,782 ($2,391 if married filing separately)
      expr: { op: subtract, from: s2.amt_l39_product, take: { param: amt.bracket_subtract } }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 39, "Otherwise, multiply line 12 by 28% (0.28) and subtract $4,782 ($2,391 if married filing separately) from the result"'
    - id: s2.amt_l39
      printed: (helper)
      type: Dollars
      label: "Form 6251 line 39 (line 7 for all others): the tax at 26% and 28% on line 6"
      expr:
        op: choose
        alternatives:
        - guard: { op: test, eq: [s2.amt_l6_high, { const: false }] }
          then: s2.amt_l39_low
        - guard: { op: test, eq: [s2.amt_l6_high, { const: true }] }
          then: s2.amt_l39_high
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 7, "All others: If line 6 is $239,100 or less ($119,550 or less if married filing separately), multiply line 6 by 26% (0.26). Otherwise, multiply line 6 by 28% (0.28) and subtract $4,782 ($2,391 if married filing separately) from the result"; line 39, "If line 12 is $239,100 or less ($119,550 or less if married filing separately), multiply line 12 by 26% (0.26). Otherwise, multiply line 12 by 28% (0.28) and subtract $4,782 ($2,391 if married filing separately) from the result"'
    - id: s2.amt_l13
      printed: (helper)
      type: Dollars
      label: "Form 6251 line 13: line 13 of the Schedule D Tax Worksheet, or line 4 of the Qualified Dividends and Capital Gain Tax Worksheet (the regular-tax amounts)"
      expr:
        op: choose
        alternatives:
        - guard: { op: test, eq: [f1040.gate.sdtw, { const: true }] }
          then: sdtw.line13
        - guard: { op: test, eq: [f1040.gate.sdtw, { const: false }] }
          then: qdcg.line4
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 13, "Enter the amount from line 4 of the Qualified Dividends and Capital Gain Tax Worksheet in the Instructions for Form 1040 or the amount from line 13 of the Schedule D Tax Worksheet in the Instructions for Schedule D (Form 1040), whichever applies (as refigured for the AMT, if necessary)"; i6251 p. 13, "None of the statements apply", "Use the regular tax amounts to complete lines 13, 14, and 15"'
    - id: s2.amt_l14
      printed: (helper)
      type: NonNegDollars
      label: "Form 6251 line 14: Schedule D line 19 when the Schedule D Tax Worksheet is used (zero otherwise)"
      expr:
        op: choose
        alternatives:
        - guard: { op: test, eq: [f1040.gate.sdtw, { const: true }] }
          then: sd.line19
        - guard: { op: test, eq: [f1040.gate.sdtw, { const: false }] }
          then: s2.zero
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 14, "Enter the amount from Schedule D (Form 1040), line 19 (as refigured for the AMT, if necessary)"; line 15, "If you did not complete a Schedule D Tax Worksheet for the regular tax or the AMT, enter the amount from line 13"'
    - id: s2.amt_l13_14
      printed: (helper)
      type: Dollars
      label: Lines 13 and 14 added
      expr: { op: sum, of: [s2.amt_l13, s2.amt_l14] }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 15, "Otherwise, add lines 13 and 14, and enter the smaller of that result or the amount from line 10 of the Schedule D Tax Worksheet"'
    - id: s2.amt_l15_sdtw
      printed: (helper)
      type: Dollars
      label: The smaller of lines 13 and 14 added, or line 10 of the Schedule D Tax Worksheet
      expr: { op: smaller_of, of: [s2.amt_l13_14, sdtw.line10] }
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 15, "Otherwise, add lines 13 and 14, and enter the smaller of that result or the amount from line 10 of the Schedule D Tax Worksheet (as refigured for the AMT, if necessary)"'
    - id: s2.amt_l15
      printed: (helper)
      type: Dollars
      label: "Form 6251 line 15"
      expr:
        op: choose
        alternatives:
        - guard: { op: test, eq: [f1040.gate.sdtw, { const: true }] }
          then: s2.amt_l15_sdtw
        - guard: { op: test, eq: [f1040.gate.sdtw, { const: false }] }
          then: s2.amt_l13
      cite:
        doc: f6251
        locator: 'Form 6251 (2025), line 15, "If you did not complete a Schedule D Tax Worksheet for the regular tax or the AMT, enter the amount from line 13"'
    - id: s2.amt_l16
      printed: (helper)
      type: Dollars
      label: "Form 6251 line 16: the smaller of line 12 (line 6) or line 15"
