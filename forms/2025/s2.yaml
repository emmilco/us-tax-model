    - id: s2.other
      printed: (helper)
      type: Bool
      label: |-
        Any amount on Schedule 2 other than the following?

        - self-employment tax from Schedule SE
        - Additional Medicare Tax
        - Net Investment Income Tax
        - the additional 20% tax on taxable HSA distributions (Form 8889 line 17b, which this tool figures)

        Other amounts, for example:
        - the alternative minimum tax
        - repayment of a clean vehicle credit
        - household employment taxes
        - the additional tax on an HSA you did not keep as an eligible individual (Form 8889 Part III)
        - uncollected social security or Medicare tax on tips or group-term life insurance (W-2 box 12 codes A, B, M or N)
        - interest on deferred tax

        Form 5329 Part I, early distributions, and the 2025 HSA excess are figured by this tool and are not other amounts.
      expr:
        op: test
        any:
        - op: test
          eq:
          - s2.w2_marks_if_w2
          - const: true
        - op: test
          eq:
          - s2.household_employee_if_help
          - const: true
        - op: test
          eq:
          - s2.mortgage_subsidy_if_interest
          - const: true
        - op: test
          eq:
          - s2.hsa_testing
          - const: true
        - op: test
          eq:
          - s2.credit_recapture
          - const: true
        - op: test
          eq:
          - s2.lookback_if_business
          - const: true
        - op: test
          eq:
          - s2.other_tax
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 111, Line 1y, "Other additions to tax"; p. 112, Line 5, "If you received tips of $20 or more in any month and you didn’t report the full amount to your employer"; p. 113, Line 9, "Enter the household employment taxes you owe for having a household employee"; p. 113, Line 13, "This tax should be shown in box 12 of Form W-2 with codes A and B or M and N"; p. 113, Line 16, "Enter the amount from Form 8611, line 14"; p. 113, Lines 17a Through 17z, "Line 17a. Recapture of the following credits"; p. 113, Line 17b, "If you sold your home in 2025 and it was financed (in whole or in part) from the proceeds of any tax-exempt qualified mortgage bond or you claimed the mortgage interest credit, you may owe a recapture tax on the mortgage subsidy"; p. 113, Line 17d, "Enter any additional tax for failure to remain an eligible individual during the testing period from Form 8889, line 21"; p. 114, Line 17h, "This income should be shown in box 12 of Form W-2 with code Z"; p. 114, Line 17k, "This tax should be shown in box 12 of Form W-2 with code K"; p. 114, Line 17n, "Enter any look-back interest under section 167(g) or 460(b)"; p. 114, Line 17z, "Use line 17z to report any taxes not reported elsewhere on your return or other schedules"; p. 114, Line 19, "Enter the recapture amount of the net EPE claimed on Form 4255, line 1d, column (l)"'
