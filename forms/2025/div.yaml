form:
  id: div
  kind: form
  title: Form 1099-DIV — distribution components and scope screening
  tax_year: 2025
  note: Boxes 1a/1b/2a/5 are the shared supplied totals used by the other forms. Box 7 feeds the
    supplied creditable foreign-tax total in ftc.taxes; box 8 is supporting country information.
    Boxes 14–16 concern state reporting; state tax paid is entered once on Schedule A. This is a
    values sheet, not a prepared information return.
  lines:
    - id: div.box2b
      printed: (helper)
      type: NonNegDollars
      label: Unrecaptured section 1250 gain, box 2b
      gated_by: div.box2b_if_capital_gain
      expr:
        op: input
        source: Unrecaptured section 1250 gain, box 2b
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.box2c
      printed: (helper)
      type: NonNegDollars
      label: Section 1202 gain, box 2c
      gated_by: div.box2c_if_capital_gain
      expr:
        op: input
        source: Section 1202 gain, box 2c
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.box2d
      printed: (helper)
      type: NonNegDollars
      label: Collectibles (28%) gain, box 2d
      gated_by: div.box2d_if_capital_gain
      expr:
        op: input
        source: Collectibles (28%) gain, box 2d
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.box3
      printed: (helper)
      type: NonNegDollars
      label: Nondividend distributions/return of capital, box 3
      gated_by: div.box3_if_dividends
      expr:
        op: input
        source: Nondividend distributions/return of capital, box 3 (total of all your Forms 1099-DIV, with your share of
          amounts paid in someone else's name and any received without a form)
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.box9
      printed: (helper)
      type: NonNegDollars
      label: Cash liquidation distributions, box 9
      gated_by: div.box9_if_dividends
      expr:
        op: input
        source: Cash liquidation distributions, box 9
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.box10
      printed: (helper)
      type: NonNegDollars
      label: Noncash liquidation distributions, box 10
      gated_by: div.box10_if_dividends
      expr:
        op: input
        source: Noncash liquidation distributions, box 10
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.box12
      printed: (helper)
      type: NonNegDollars
      label: Exempt-interest dividends, box 12
      gated_by: div.box12_if_dividends
      expr:
        op: input
        source: Exempt-interest dividends, box 12 (total of all your Forms 1099-DIV, with your share of amounts paid in
          someone else's name and any received without a form; box 13 amounts are already included)
      cite:
        doc: f1099div
        locator: 'Instructions for Recipient, Box 12 ("Shows exempt-interest dividends from a mutual fund or other RIC
          paid to you during the calendar year. See the Instructions for Form 1040 for where to report") and Box 13
          ("This amount is included in box 12")'
    - id: div.box13
      printed: (helper)
      type: NonNegDollars
      label: Specified private activity bond interest dividends, box 13
      gated_by: div.box13_if_dividends
      expr:
        op: input
        source: Specified private activity bond interest dividends, box 13
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.basis_reconciled
      printed: (helper)
      type: Bool
      label: Was every nondividend distribution (box 3) no more than the remaining basis in the shares it was paid on?
      gated_by: div.basis_reconciled_if_return_of_capital
      expr:
        op: input
        source: Was every nondividend distribution (Form 1099-DIV box 3, a return of capital) that you (or, on a joint
          return, your spouse) received in 2025 no more than the remaining basis in the shares it was paid on (their cost
          or other basis, already reduced by any earlier returns of capital)? Answer No if any distribution was more than
          that remaining basis, for example because earlier returns of capital had already reduced the basis to zero; the
          part above the basis is a taxable capital gain, which this tool does not report.
      cite:
        doc: f1099div
        locator: p. 5, Instructions for Recipient, Box 3, "To the extent of your cost (or other basis) in the stock, the
          distribution reduces your basis and is not taxable. Any amount received in excess of your basis is taxable to
          you as capital gain"
    - id: div.box1a
      printed: (helper)
      display: 'Form 1099-DIV box 1a shown on the values sheet as the ordinary dividends it carries to Schedule B.'
      type: NonNegDollars
      label: Amount from sb.ordinary_dividends_if_dividends
      expr:
        op: copy
        from: sb.ordinary_dividends_if_dividends
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.box1b
      printed: (helper)
      display: 'Form 1099-DIV box 1b shown on the values sheet as the qualified dividends it carries to Form 1040 line 3a.'
      type: NonNegDollars
      label: Amount from f1040.line3a_if_ordinary
      expr:
        op: copy
        from: f1040.line3a_if_ordinary
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.box2a
      printed: (helper)
      display: 'Form 1099-DIV box 2a shown on the values sheet as the capital gain distributions it carries to Schedule D.'
      type: NonNegDollars
      label: Amount from sd.distributions_if_dividends
      expr:
        op: copy
        from: sd.distributions_if_dividends
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.box5
      printed: (helper)
      display: 'Form 1099-DIV box 5 shown on the values sheet as the section 199A dividends it carries to the QBI deduction.'
      type: NonNegDollars
      label: Amount from qbi.dividends_if_ordinary
      expr:
        op: copy
        from: qbi.dividends_if_ordinary
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.section1202
      printed: (helper)
      type: Bool
      label: Section 1202 distribution present
      expr:
        op: test
        gt:
          - div.box2c_if_capital_gain
          - const: 0
      cite:
        doc: f1099div
        locator: p. 5, Instructions for Recipient, Box 2c, "Shows the portion of the amount in box 2a that is section
          1202 gain from certain small business stock that may be subject to an exclusion"
    - id: div.amt
      printed: (helper)
      type: Bool
      label: Specified private activity bond dividends present
      expr:
        op: test
        gt:
          - div.box13_if_dividends
          - const: 0
      cite:
        doc: f1099div
        locator: p. 5, Instructions for Recipient, Box 13, "Shows exempt-interest dividends subject to the alternative
          minimum tax"
    - id: div.unsupported
      printed: (helper)
      type: Bool
      label: Unsupported liquidation or unreconciled basis/excess distribution
      expr:
        op: test
        any:
          - op: test
            gt:
              - div.box9_if_dividends
              - const: 0
          - op: test
            gt:
              - div.box10_if_dividends
              - const: 0
          - op: test
            all:
              - op: test
                gt:
                  - div.box3_if_dividends
                  - const: 0
              - op: test
                eq:
                  - div.basis_reconciled_if_return_of_capital
                  - const: false
      cite:
        doc: f1099div
        locator: p. 5, Instructions for Recipient, boxes 3, 9 and 10, "Box 3. Shows a return of capital. To the extent of your cost (or other basis) in the stock, the
          distribution reduces your basis and is not taxable", "Boxes 9 and 10. Show cash and noncash liquidation
          distributions"
    - id: div.bad_special
      printed: (helper)
      type: Bool
      label: A gain component exceeds total capital gain distributions
      expr:
        op: test
        any:
          - op: test
            gt:
              - div.box2b_if_capital_gain
              - sd.distributions_if_dividends
          - op: test
            gt:
              - div.box2c_if_capital_gain
              - sd.distributions_if_dividends
          - op: test
            gt:
              - div.box2d_if_capital_gain
              - sd.distributions_if_dividends
          - op: test
            gt:
              - div.special_total
              - sd.distributions_if_dividends
      cite:
        doc: f1099div
        locator: p. 5, Instructions for Recipient, boxes 2b to 2d, "Box 2b. Shows the portion of the amount in box 2a
          that is unrecaptured section 1250 gain", "Box 2c. Shows the portion of the amount in box 2a that is section
          1202 gain", "Box 2d. Shows the portion of the amount in box 2a that is 28% rate gain"
      ambiguity: amb.2025.div_gain_portions_disjoint
    - id: div.screen
      printed: (helper)
      type: NonNegDollars
      label: Zero only after distribution scope checks
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
      refuses:
        - when: div.section1202
          form: Form 8949 code Q / Form 6251
          remedy: Section 1202 distributions require exclusion analysis and may require AMT. Code Q and Form
            6251 remain outside scope.
          cite:
            doc: i1040sd
            locator: p. 8, Gain from Form 1099-DIV and Alternative Minimum Tax
        - when: div.bad_special
          form: Form 1099-DIV corrected amounts
          remedy: Boxes 2b, 2c and 2d are portions of box 2a. Correct inconsistent supplied amounts.
          cite:
            doc: f1099div
            locator: Instructions for Recipient, boxes 1–16
        - when: div.amt
          form: Form 6251
          remedy: Review private activity bond interest for the alternative minimum tax; Form 6251 is outside
            scope.
          cite:
            doc: f1099div
            locator: Instructions for Recipient, boxes 1–16
        - when: div.unsupported
          form: Form 1099-DIV special distribution treatment
          remedy: Prepare the required liquidation treatment or reconcile return-of-capital basis
            and any excess gain.
          cite:
            doc: f1099div
            locator: Instructions for Recipient, boxes 1–16
        - when: div.bad_components
          form: Form 1099-DIV dividend components
          remedy: "Correct the supplied totals: qualified dividends and section 199A dividends are portions of
            ordinary dividends."
          cite:
            doc: f1099div
            locator: Instructions for Recipient, boxes 1a, 1b and 5
      ambiguity: amb.2025.box2c_scope
    - id: div.bad_components
      printed: (gate)
      label: Qualified or section 199A dividends exceed ordinary dividends
      type: Bool
      expr:
        op: test
        any:
          - op: test
            gt:
              - f1040.line3a_if_ordinary
              - sb.ordinary_dividends_if_dividends
          - op: test
            gt:
              - qbi.dividends_if_ordinary
              - sb.ordinary_dividends_if_dividends
      cite:
        doc: f1099div
        locator: p. 5, Instructions for Recipient, boxes 1b and 5, "Box 1b. Shows the portion of the amount in box 1a
          that may be eligible for reduced capital gains rates", "Box 5. Shows the portion of the amount in box 1a
          that may be eligible for the 20% qualified business income deduction under section 199A"
    - id: div.special_total
      printed: (helper)
      type: NonNegDollars
      label: Total special capital-gain distribution components
      expr:
        op: sum
        of:
          - div.box2b_if_capital_gain
          - div.box2c_if_capital_gain
          - div.box2d_if_capital_gain
      cite:
        doc: f1099div
        locator: p. 5, Instructions for Recipient, boxes 2b to 2d, "Box 2b. Shows the portion of the amount in box 2a
          that is unrecaptured section 1250 gain", "Box 2c. Shows the portion of the amount in box 2a that is section
          1202 gain", "Box 2d. Shows the portion of the amount in box 2a that is 28% rate gain"
    - id: div.any
      printed: (gate)
      type: Bool
      label: 'In 2025, did you (or, on a joint return, your spouse) own shares of a company or a fund outside a retirement account, or get a Form 1099-DIV?'
      expr:
        op: input
        source: 'In 2025, did you (or, on a joint return, your spouse) own shares of a company or a fund outside a retirement account, or get a Form 1099-DIV?'
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, boxes 1a, 2a, 3, 9, 10, 12 and 13, Box 1b, "The amount shown may be dividends a corporation paid directly to you as a participant (or beneficiary of a participant) in an employee stock ownership plan (ESOP)", Nominees, "If this form includes amounts belonging to another person, you are considered a nominee recipient", "Box 1a. Shows total ordinary dividends that are taxable", "Box 2a. Shows total capital gain distributions from a regulated investment company (RIC) or real estate investment trust (REIT)", "Box 3. Shows a return of capital. To the extent of your cost (or other basis) in the stock, the distribution reduces your basis and is not taxable", "Boxes 9 and 10. Show cash and noncash liquidation distributions", "Box 12. Shows exempt-interest dividends from a mutual fund or other RIC paid to you during the calendar year", "Box 13. Shows exempt-interest dividends subject to the alternative minimum tax. This amount is included in box 12"'
    - id: div.has_ordinary
      printed: (gate)
      type: Bool
      label: Ordinary dividends (box 1a) are above zero
      expr:
        op: test
        gt:
          - sb.ordinary_dividends_if_dividends
          - const: 0
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, boxes 1b and 5, "Box 1b. Shows the portion of the amount in box 1a that may be eligible for reduced capital gains rates", "Box 5. Shows the portion of the amount in box 1a that may be eligible for the 20% qualified business income deduction under section 199A"'
    - id: div.has_capital_gain
      printed: (gate)
      type: Bool
      label: Capital gain distributions (box 2a) are above zero
      expr:
        op: test
        gt:
          - sd.distributions_if_dividends
          - const: 0
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, boxes 2b, 2c and 2d, "Box 2b. Shows the portion of the amount in box 2a that is unrecaptured section 1250 gain from certain depreciable real property", "Box 2c. Shows the portion of the amount in box 2a that is section 1202 gain from certain small business stock that may be subject to an exclusion", "Box 2d. Shows the portion of the amount in box 2a that is 28% rate gain from sales or exchanges of collectibles"'
    - id: div.has_return_of_capital
      printed: (gate)
      type: Bool
      label: Nondividend distributions (box 3) are above zero
      expr:
        op: test
        gt:
          - div.box3_if_dividends
          - const: 0
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, Box 3, "Box 3. Shows a return of capital. To the extent of your cost (or other basis) in the stock, the distribution reduces your basis and is not taxable"'
    - id: div.zero
      printed: (helper)
      type: NonNegDollars
      label: No amount in a box whose condition does not hold
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.no
      printed: (helper)
      type: Bool
      label: No answer needed where the question is not asked
      expr:
        op: param
        ref: div.no
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, Box 3, "Box 3. Shows a return of capital. To the extent of your cost (or other basis) in the stock, the distribution reduces your basis and is not taxable"'
    - id: div.other_boxes
      printed: (gate)
      type: Bool
      gated_by: div.other_boxes_if_dividends
      label: 'An amount in box 2b, 2c, 2d, 3, 9, 10 or 13 of any Form 1099-DIV'
      expr:
        op: input
        source: "Look at your (or, on a joint return, your spouse's) Forms 1099-DIV for 2025. Does any of them show an amount in box 2b, 2c, 2d, 3, 9, 10 or 13?"
      cite:
        doc: f1099div
        locator: Instructions for Recipient, boxes 1–16
    - id: div.other_boxes_if_dividends
      printed: (helper)
      type: Bool
      label: 'An amount in box 2b, 2c, 2d, 3, 9, 10 or 13 of any Form 1099-DIV, when you or your spouse owned shares or received a Form 1099-DIV; false otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.any
                - const: true
            then: div.other_boxes
          - guard:
              op: test
              eq:
                - div.any
                - const: false
            then: div.no
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 2b. Shows the portion of the amount in box 2a that is unrecaptured section 1250 gain", "Box 2c. Shows the portion of the amount in box 2a that is section 1202 gain", "Box 2d. Shows the portion of the amount in box 2a that is 28% rate gain", "Box 3. Shows a return of capital", "Boxes 9 and 10. Show cash and noncash liquidation distributions", "Box 13. Shows exempt-interest dividends subject to the alternative minimum tax"; boxes 2e and 2f are not asked: "Note: Boxes 2e and 2f apply only to foreign persons and entities whose income maintains its character when passed through or distributed to its direct or indirect foreign owners or beneficiaries"'
    - id: div.capital_gain_boxes
      printed: (helper)
      type: Bool
      label: 'An amount in one of those boxes, when capital gain distributions (box 2a) are above zero; false otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.has_capital_gain
                - const: true
            then: div.other_boxes_if_dividends
          - guard:
              op: test
              eq:
                - div.has_capital_gain
                - const: false
            then: div.no
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 2b. Shows the portion of the amount in box 2a that is unrecaptured section 1250 gain", "Box 2c. Shows the portion of the amount in box 2a that is section 1202 gain", "Box 2d. Shows the portion of the amount in box 2a that is 28% rate gain", "Box 3. Shows a return of capital", "Boxes 9 and 10. Show cash and noncash liquidation distributions", "Box 13. Shows exempt-interest dividends subject to the alternative minimum tax"'
    - id: div.box2b_if_capital_gain
      printed: (helper)
      type: NonNegDollars
      label: 'Unrecaptured section 1250 gain, box 2b, when capital gain distributions (box 2a) are above zero and a Form 1099-DIV shows an amount in one of the less common boxes; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.capital_gain_boxes
                - const: true
            then: div.box2b
          - guard:
              op: test
              eq:
                - div.capital_gain_boxes
                - const: false
            then: div.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 2b. Shows the portion of the amount in box 2a that is unrecaptured section 1250 gain from certain depreciable real property"'
    - id: div.box2c_if_capital_gain
      printed: (helper)
      type: NonNegDollars
      label: 'Section 1202 gain, box 2c, when capital gain distributions (box 2a) are above zero and a Form 1099-DIV shows an amount in one of the less common boxes; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.capital_gain_boxes
                - const: true
            then: div.box2c
          - guard:
              op: test
              eq:
                - div.capital_gain_boxes
                - const: false
            then: div.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 2c. Shows the portion of the amount in box 2a that is section 1202 gain from certain small business stock that may be subject to an exclusion"'
    - id: div.box2d_if_capital_gain
      printed: (helper)
      type: NonNegDollars
      label: 'Collectibles (28%) gain, box 2d, when capital gain distributions (box 2a) are above zero and a Form 1099-DIV shows an amount in one of the less common boxes; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.capital_gain_boxes
                - const: true
            then: div.box2d
          - guard:
              op: test
              eq:
                - div.capital_gain_boxes
                - const: false
            then: div.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 2d. Shows the portion of the amount in box 2a that is 28% rate gain from sales or exchanges of collectibles"'
    - id: div.box3_if_dividends
      printed: (helper)
      type: NonNegDollars
      label: 'Nondividend distributions/return of capital, box 3, when a Form 1099-DIV shows an amount in one of the less common boxes; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.other_boxes_if_dividends
                - const: true
            then: div.box3
          - guard:
              op: test
              eq:
                - div.other_boxes_if_dividends
                - const: false
            then: div.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 3. Shows a return of capital. To the extent of your cost (or other basis) in the stock, the distribution reduces your basis and is not taxable"'
    - id: div.box9_if_dividends
      printed: (helper)
      type: NonNegDollars
      label: 'Cash liquidation distributions, box 9, when a Form 1099-DIV shows an amount in one of the less common boxes; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.other_boxes_if_dividends
                - const: true
            then: div.box9
          - guard:
              op: test
              eq:
                - div.other_boxes_if_dividends
                - const: false
            then: div.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Boxes 9 and 10. Show cash and noncash liquidation distributions"'
    - id: div.box10_if_dividends
      printed: (helper)
      type: NonNegDollars
      label: 'Noncash liquidation distributions, box 10, when a Form 1099-DIV shows an amount in one of the less common boxes; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.other_boxes_if_dividends
                - const: true
            then: div.box10
          - guard:
              op: test
              eq:
                - div.other_boxes_if_dividends
                - const: false
            then: div.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Boxes 9 and 10. Show cash and noncash liquidation distributions"'
    - id: div.box12_if_dividends
      printed: (helper)
      type: NonNegDollars
      label: 'Exempt-interest dividends, box 12, when you or your spouse owned shares or received a Form 1099-DIV; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.any
                - const: true
            then: div.box12
          - guard:
              op: test
              eq:
                - div.any
                - const: false
            then: div.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 12. Shows exempt-interest dividends from a mutual fund or other RIC paid to you during the calendar year"'
    - id: div.box13_if_dividends
      printed: (helper)
      type: NonNegDollars
      label: 'Specified private activity bond interest dividends, box 13, when a Form 1099-DIV shows an amount in one of the less common boxes; zero otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.other_boxes_if_dividends
                - const: true
            then: div.box13
          - guard:
              op: test
              eq:
                - div.other_boxes_if_dividends
                - const: false
            then: div.zero
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 13. Shows exempt-interest dividends subject to the alternative minimum tax. This amount is included in box 12"'
    - id: div.basis_reconciled_if_return_of_capital
      printed: (helper)
      type: Bool
      label: 'For box 3, basis reductions applied, when nondividend distributions (box 3) are above zero; false otherwise'
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - div.has_return_of_capital
                - const: true
            then: div.basis_reconciled
          - guard:
              op: test
              eq:
                - div.has_return_of_capital
                - const: false
            then: div.no
      cite:
        doc: f1099div
        locator: 'p. 5, Instructions for Recipient, "Box 3. Shows a return of capital. To the extent of your cost (or other basis) in the stock, the distribution reduces your basis and is not taxable"'
