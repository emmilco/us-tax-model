      type: NonNegDollars
      gated_by: f1040.line25b_if_withheld_other
      expr:
        op: input
        source: Federal income tax withheld shown on your (or, on a joint return, your spouse's) Forms 1099 (supplied total
          of box 4 of Forms 1099-R, 1099-INT, 1099-DIV, 1099-G and other Forms 1099, box 6 of Form SSA-1099 and box 10 of Form RRB-1099)
      cite:
        doc: i1040gi
