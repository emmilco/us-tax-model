      expr:
        op: copy
        from: s2.line21
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 23
    - id: f1040.line24
      printed: "24"
      label: Add lines 22 and 23. This is your total tax
      type: NonNegDollars
      expr:
        op: sum
        of:
          - f1040.line22
          - f1040.line23
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 24
    - id: f1040.line25a
      printed: 25a
      label: Federal income tax withheld from Form(s) W-2
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.box2
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 25a
    - id: f1040.withheld_other_any
      printed: (gate)
      label: Was federal income tax withheld in 2025 from any payment other than wages?
      type: Bool
