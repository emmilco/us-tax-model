form:
  id: f1040
  kind: form
  title: Form 1040 — U.S. Individual Income Tax Return (the lines this tool computes)
  tax_year: 2025
  lines:
    - id: f1040.status
      printed: Filing Status
      label: Single. Married filing jointly (even if only one had income). Married filing separately. Head
        of household (HOH). Qualifying surviving spouse (QSS).
      type: Enum(filing_status)
      expr:
        op: input
        source: Form 1040, Filing Status checkboxes
      cite:
        doc: f1040
        locator: Form 1040, Filing Status
    - id: f1040.digital_assets
      printed: Digital Assets
      label: 'At any time during 2025, did you (or, on a joint return, your spouse) receive a digital asset (as a reward,
        award, or payment for property or services), or sell, exchange, or otherwise dispose of a digital asset (or a
        financial interest in a digital asset)?'
      type: Bool
      expr:
        op: input
        source: |-
          At any time during 2025, did you (or, on a joint return, your spouse) receive a digital asset (as a reward, award, or payment for property or services), or sell, exchange, or otherwise dispose of a digital asset (or a financial interest in a digital asset)?

          A digital asset is a digital representation of value recorded on a cryptographically secured distributed ledger or similar technology, such as a cryptocurrency, a stablecoin or a non-fungible token (NFT).

          Yes, for example, if you received digital assets as payment for property or services, as a reward or award, or from mining, staking or a hard fork, or if you sold one, exchanged or traded one for another, or used one to pay for property or services.

          No, if all you did was hold digital assets, transfer them between wallets or accounts you own or control, or buy them with U.S. or other real currency.
      cite:
        doc: f1040
        locator: 'Form 1040 (2025), page 1, Digital Assets, "At any time during 2025, did you: (a) receive (as a reward,
          award, or payment for property or services); or (b) sell, exchange, or otherwise dispose of a digital asset (or
          a financial interest in a digital asset)?"; i1040gi p. 15, Digital Assets, "Digital assets are any digital
          representations of value that are recorded on a cryptographically secured distributed ledger or any similar
          technology."; i1040gi p. 16, "Received new digital assets as a result of mining, staking, and similar
          activities", "Disposed of a digital asset in exchange or trade for another digital asset", "Holding a digital
          asset in a wallet or account" and "Purchasing digital assets using U.S. or other real currency"'
    - id: f1040.digital_sales
      printed: (helper)
      label: Number of sales entered with a digital asset box (G to L) on Form 8949
      type: Count
      expr:
        op: sum_over
        collection: sales
        field: sales.one
        where:
          op: test
          eq:
            - sales.digital
            - const: true
      cite:
        doc: f8949
        locator: p. 1, Part I, "(G) Short-term transactions reported on Form(s) 1099-DA showing basis was reported to
          the IRS"
    - id: f1040.digital_conflict
      printed: (gate)
      label: A No to the digital asset question on a return that lists a sale with a digital asset box (G to L)
      type: Bool
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1040.digital_assets
              - const: false
          - op: test
            gt:
              - f1040.digital_sales
              - const: 0
                type: Count
      cite:
        doc: i1040gi
        locator: 'p. 16, How To Report Digital Asset Transactions, "If, in 2025, you disposed of any digital asset, which
          you held as a capital asset, through a sale, trade, exchange, payment, or other transfer, check “Yes” and use
          Form 8949 to calculate your capital gain or loss"'
    - id: f1040.line1a
      printed: 1a
      label: Total amount from Form(s) W-2, box 1
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.box1
      cite:
        doc: i1040gi
        locator: pp. 23–24, Line 1a, Total Amount From Form(s) W-2, Box 1, "Enter the total amount from Form(s) W-2,
          box 1. If a joint return, also include your spouse’s income from Form(s) W-2, box 1"
      refuses:
        - when: household.mfs_community_property
          form: Community income on a married filing separately return (Form 8958; Pub. 555)
          remedy: A married person who files a separate return, where either spouse lived in or had a permanent home in a
            community property state, may have to report half of the community income of both spouses under state law;
            Form 8958 and the community property rules of Pub. 555 are outside this tool.
          cite:
            doc: i1040gi
            locator: 'p. 14, Married Filing Separately, "Different rules apply to people in community property states; see Pub. 555"; p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555."'
        - when: household.roster_bad
          form: The people on the return
          remedy: Enter one person with the role taxpayer, and, only when married filing jointly, one person with the
            role spouse.
          cite:
            doc: f1040
            locator: Form 1040 (2025), page 1, "Your first name and middle initial" and "If joint return, spouse’s first
              name and middle initial"; Filing Status
        - when: household.cp_marriage_ended
          form: Community income of a marriage that ended in 2025 (Form 8958; Pub. 555)
          remedy: Income earned while you were married and lived in, or had your permanent home in, a community property state
            may be community income under state law, half yours and half your former spouse's; Form 8958 and the community
            property rules of Pub. 555 are outside this tool.
          cite:
            doc: i1040gi
            locator: 'p. 23, Community Property States, "If you and your spouse lived in a community property state, you must usually follow state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555."'
        - when: household.rdp_community_property
          form: Community income of a registered domestic partner (Form 8958; Pub. 555)
          remedy: A registered domestic partner in Nevada, Washington or California must generally report half the combined
            community income of the partners; Form 8958 and the community property rules of Pub. 555 are outside this tool.
          cite:
            doc: i1040gi
            locator: 'p. 23, Community Property States, Nevada, Washington, and California domestic partners, "A registered domestic partner in Nevada, Washington, or California must generally report half the combined community income of the individual and their domestic partner. See Form 8958 and Pub. 555"'
    - id: f1040.line1b
      printed: 1b
      label: Household employee wages not reported on Form(s) W-2
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.household_wages_if_pay
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1b, "Enter the total of your wages received as a household employee that was not reported on Form(s) W-2"'
    - id: f1040.line1c
      printed: 1c
      label: Tip income not reported on line 1a
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.line1c
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1c, "Enter the total of your tip income that was not reported on Form 1040, line 1a"; f4137 p. 1, line 4, "Include as income on Form 1040, 1040-SR, or 1040-NR, line 1c"'
    - id: f1040.line1d
      printed: 1d
      label: Medicaid waiver payments not reported on Form(s) W-2, box 1
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.line1d
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1d, "Medicaid Waiver Payments Not Reported on Form(s) W-2, Box 1"'
    - id: f1040.line1e
      printed: 1e
      label: Taxable dependent care benefits from Form 2441, line 26
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f2441.benefits
                - const: true
            then: f2441.line26
          - guard:
              op: test
              eq:
                - f2441.benefits
                - const: false
            then: f2441.zero
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1e, "Taxable Dependent Care Benefits From Form 2441, Line 26" and "But first complete Form 2441 to see if you can exclude part or all of the benefits"'
      note: Zero when you received no dependent care benefits (Form 2441 Part III is then not completed).
    - id: f1040.line1g
      printed: 1g
      label: Wages from Form 8919, line 6
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.f8919_wages
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1g, "Enter the total of your wages from Form 8919, line 6"'
    - id: f1040.line1h
      printed: 1h
      label: Other earned income
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.line1h
      cite:
        doc: i1040gi
        locator: 'p. 24, Line 1h, "The following types of income must be included in the total on line 1h", "Strike or lockout benefits (other than bona fide gifts)"; p. 25, "Disability pensions shown on Form 1099-R if you haven’t reached the minimum retirement age set by your employer"'
    - id: f1040.line1z
      printed: 1z
      label: Add lines 1a through 1h
      type: NonNegDollars
      expr:
        op: sum
        of:
          - f1040.line1a
          - f1040.line1b
          - f1040.line1c
          - f1040.line1d
          - f1040.line1e
          - f1040.line1g
          - f1040.line1h
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 1z (line 1f, employer-provided adoption benefits, is refused by scope.adoption_benefits)
    - id: f1040.tax_exempt_any
      printed: (gate)
      label: Was tax-exempt interest received in 2025?
      type: Bool
      expr:
        op: input
        source: In 2025, did you (or, on a joint return, your spouse) get tax-exempt interest, for example from a city or
          state bond?
      cite:
        doc: i1040gi
        locator: Instructions for Form 1040, p. 25, line 2a, "Enter the total on line 2a" (Form 1099-INT box 8, Form
          1099-OID boxes 2 and 11, net of amortized bond premium and acquisition premium)
    - id: f1040.tax_exempt_interest
      printed: (helper)
      label: Tax-exempt interest and tax-exempt OID, net of amortized premium
      type: NonNegDollars
      gated_by: f1040.tax_exempt_interest_if_any
      expr:
        op: input
        source: 'Total tax-exempt interest and tax-exempt OID for 2025 (Form 1099-INT box 8; Form 1099-OID boxes 2 and 11), net of amortized bond premium and acquisition premium; do not include exempt-interest dividends (Form 1099-DIV box 12) or interest earned in an IRA, HSA, Archer or Medicare Advantage MSA, or Coverdell education savings account'
      cite:
        doc: i1040gi
        locator: Instructions for Form 1040, p. 25, line 2a, "Enter the total on line 2a" (Form 1099-INT box 8, Form
          1099-OID boxes 2 and 11, net of amortized bond premium and acquisition premium)
    - id: f1040.tax_exempt_interest_if_any
      printed: (helper)
      label: Tax-exempt interest and tax-exempt OID, net of amortized premium, when any was received; zero otherwise
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1040.tax_exempt_any
                - const: true
            then: f1040.tax_exempt_interest
          - guard:
              op: test
              eq:
                - f1040.tax_exempt_any
                - const: false
            then: div.zero
      cite:
        doc: i1040gi
        locator: Instructions for Form 1040, p. 25, line 2a, "Enter the total on line 2a" (Form 1099-INT box 8, Form
          1099-OID boxes 2 and 11, net of amortized bond premium and acquisition premium)
    - id: f1040.line2a
      printed: 2a
      label: Tax-exempt interest
      type: NonNegDollars
      expr:
        op: sum
        of:
          - f1040.tax_exempt_interest_if_any
          - div.box12_if_dividends
      cite:
        doc: i1040gi
        locator: Instructions for Form 1040, p. 25, line 2a, "Enter the total on line 2a" and "Also include on line 2a any
          exempt-interest dividends from a mutual fund or other regulated investment company. This amount should be
          shown in box 12 of Form 1099-DIV"
    - id: f1040.line2b
      printed: 2b
      label: Taxable interest
      type: Dollars
      expr:
        op: copy
        from: sb.line4
      cite:
        doc: i1040gi
        locator: Instructions for Form 1040, p. 25, line 2b
    - id: f1040.line3b
      printed: 3b
      label: Ordinary dividends
      type: NonNegDollars
      expr:
        op: copy
        from: sb.line6
      cite:
        doc: i1040gi
        locator: Instructions for Form 1040, p. 26, line 3b
    - id: f1040.line3a
      printed: 3a
      label: Qualified dividends
      type: NonNegDollars
      gated_by: f1040.line3a_if_ordinary
      expr:
        op: input
        source: Qualified dividends, generally the total of Form 1099-DIV box 1b, less any amount the line 3a exceptions
          leave out (for example, dividends on stock held less than 61 days of the 121-day period around the ex-dividend
          date, or received as a nominee)
      cite:
        doc: i1040gi
        locator: 'pp. 25–26, Line 3a, Exception, "Some dividends may be reported as qualified dividends in box 1b of Form
          1099-DIV but aren’t qualified dividends"'
    - id: f1040.line4a
      printed: 4a
      label: IRA distributions
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.ira_amount_a
      cite:
        doc: i1040gi
        locator: pp. 26-27, Lines 4a and 4b (total distributions where an exception applies; 'More than one distribution')
    - id: f1040.line4b
      printed: 4b
      label: IRA distributions, taxable amount
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.ira_taxable
      cite:
        doc: i1040gi
        locator: p. 27, line 4b, 'figure the taxable amount of each distribution and enter the total of the taxable
          amounts on line 4b'
    - id: f1040.ira_rollovers
      printed: (helper)
      label: Number of IRA distributions with a rollover
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.ira_rollovers
      cite:
        doc: i1040gi
        locator: p. 27, Exception 1, 'Also check box 1 on line 4c'
    - id: f1040.line4c_rollover
      printed: 4c
      label: Check if (box 1) Rollover
      type: Bool
      expr:
        op: test
        gt:
        - f1040.ira_rollovers
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: p. 27, Exception 1, 'Also check box 1 on line 4c'
    - id: f1040.line5a
      printed: 5a
      label: Pensions and annuities
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.plan_amount_a
      cite:
        doc: i1040gi
        locator: pp. 28-30, Lines 5a and 5b
    - id: f1040.line5b
      printed: 5b
      label: Pensions and annuities, taxable amount
      type: NonNegDollars
      expr:
        op: sum_over
        collection: person
        field: person.plan_taxable
      cite:
        doc: i1040gi
        locator: pp. 28-30, Lines 5a and 5b; p. 29, Simplified Method Worksheet, 'Enter the total of the taxable parts
          on Form 1040 or 1040-SR, line 5b'
    - id: f1040.plan_rollovers
      printed: (helper)
      label: Number of pension distributions with a rollover
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.plan_rollovers
      cite:
        doc: i1040gi
        locator: p. 30, Rollovers, 'Also check box 1 on line 5c'
    - id: f1040.line5c_rollover
      printed: 5c
      label: Check if (box 1) Rollover
      type: Bool
      expr:
        op: test
        gt:
        - f1040.plan_rollovers
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: pp. 30-31, Line 5c, 'If you have a rollover ... check box 1 on line 5c'
    - id: f1040.line6a
      printed: 6a
      label: Social security benefits
      type: NonNegDollars
      expr:
        op: copy
        from: ssb.line1
      cite:
        doc: i1040gi
        locator: p. 32, Social Security Benefits Worksheet, line 1, 'Also enter this amount on Form 1040 or 1040-SR,
          line 6a'
    - id: f1040.line6b
      printed: 6b
      label: Social security benefits, taxable amount
      type: NonNegDollars
      expr:
        op: copy
        from: ssb.line18
      cite:
        doc: i1040gi
        locator: p. 32, Social Security Benefits Worksheet, line 18
    - id: f1040.line6c
      printed: 6c
      label: If you elect to use the lump-sum election method, check here
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - ssb.has_benefits
          - const: true
        - op: test
          eq:
          - ssb.lump_sum
          - const: true
      cite:
        doc: i1040gi
        locator: p. 31, Line 6c (the election itself is refused on the Social Security Benefits Worksheet)
    - id: f1040.line6d
      printed: 6d
      label: If you are married filing separately and lived apart from your spouse the entire year, check here
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - f1040.status
          - const: mfs
        - op: test
          eq:
          - ssb.has_benefits
          - const: true
        - op: test
          eq:
          - ssb.lived_apart
          - const: true
      cite:
        doc: i1040gi
        locator: 'p. 31, Line 6d, "If you are married filing separately and you lived apart from your spouse for all of 2025, check the box on line 6d. If you don’t check the box on line 6d, you may get a math error notice from the IRS."'
      ambiguity: amb.2025.mfs_lived_apart_boxes
    - id: f1040.line7a
      printed: 7a
      label: Capital gain or (loss). Attach Schedule D if required
      type: Dollars
      expr:
        op: copy
        from: sd.to1040
      cite:
        doc: i1040gi
        locator: 'p. 31, Line 7a, "If you sold a capital asset, such as a stock, bond, or digital asset, you must complete and attach Form 8949 and Schedule D"'
      refuses:
        - when: f1040.digital_conflict
          form: Form 1040, Digital Assets question
          remedy: A sale entered under box G, H, I, J, K or L of Form 8949 is a sale of a digital asset, which needs a Yes
            to the digital asset question. Answer Yes, or correct the box of the sale.
          cite:
            doc: i1040gi
            locator: 'p. 16, How To Report Digital Asset Transactions, "If, in 2025, you disposed of any digital asset,
              which you held as a capital asset, through a sale, trade, exchange, payment, or other transfer, check “Yes”
              and use Form 8949 to calculate your capital gain or loss"'
    - id: f1040.line7b_sd_not_required
      printed: 7b
      label: 'Check if: Schedule D not required'
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - sd.filed
          - const: false
        - op: test
          gt:
          - f1040.line7a
          - const: 0
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 7a, "If Exception 1 applies, enter your total capital gain distributions (from box 2a of Form(s) 1099-DIV) on line 7a and check the box “Schedule D not required” on line 7b."'
    - id: f1040.line8
      printed: "8"
      label: Additional income from Schedule 1, line 10
      type: Dollars
      expr:
        op: copy
        from: s1.line10
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 8
      refuses:
        - when: scope.schedule1
          form: Schedule 1
          remedy: Schedule 1 income and adjustments other than the ones this tool computes (Schedule C business income, a taxable state or local income tax refund, alimony under an agreement made before 2019, unemployment compensation, the supported line 8 items, educator expenses, the HSA deduction, the deductible part of self-employment tax, self-employed SEP and SIMPLE contributions, the self-employed health insurance deduction, the early withdrawal penalty, the IRA deduction, student loan interest and jury duty pay given to your employer) are outside this tool.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
        - when: scope.other_income
          form: Form 1040 additional income/return forms
          remedy: Prepare the required unsupported income or return treatment.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: f1040.line9
      printed: "9"
      label: Add lines 1z, 2b, 3b, 4b, 5b, 6b, 7a, and 8. This is your total income
      type: Dollars
      expr:
        op: sum
        of:
          - f1040.line1z
          - f1040.line2b
          - f1040.line3b
          - f1040.line4b
          - f1040.line5b
          - f1040.line6b
          - f1040.line7a
          - f1040.line8
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 9
    - id: f1040.line10
      printed: "10"
      label: Adjustments to income from Schedule 1, line 26
      type: NonNegDollars
      expr:
        op: copy
        from: s1.line26
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 10
      refuses:
        - when: scope.schedule1
          form: Schedule 1
          remedy: Schedule 1 income and adjustments other than the ones this tool computes (Schedule C business income, a taxable state or local income tax refund, alimony under an agreement made before 2019, unemployment compensation, the supported line 8 items, educator expenses, the HSA deduction, the deductible part of self-employment tax, self-employed SEP and SIMPLE contributions, the self-employed health insurance deduction, the early withdrawal penalty, the IRA deduction, student loan interest and jury duty pay given to your employer) are outside this tool.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: f1040.line11a
      printed: 11a
      label: Subtract line 10 from line 9. This is your adjusted gross income
      type: Dollars
      expr:
        op: subtract
        from: f1040.line9
        take: f1040.line10
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 11a
    - id: f1040.line11b
      printed: 11b
      label: Amount from line 11a (adjusted gross income)
      type: Dollars
      expr:
        op: copy
        from: f1040.line11a
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 11b
    - id: f1040.line12b
      printed: 12b
      label: Spouse itemizes on a separate return
      type: Bool
      expr:
        op: copy
        from: sa.mfs_spouse_itemizes
      cite:
        doc: i1040gi
        locator: 'p. 33, Line 12b, "If your filing status is married filing separately and your spouse itemizes deductions on their return, check the box on line 12b"; p. 34, Exception 2—Spouse itemizes on a separate return, "If you checked the box on line 12b, your standard deduction is zero"'
    - id: f1040.line12e
      printed: 12e
      label: Standard deduction or itemized deductions (from Schedule A)
      type: NonNegDollars
      expr:
        op: copy
        from: sa.deduction
      cite:
        doc: i1040gi
        locator: pp. 34–35, line 12e and Standard Deduction Chart
      refuses:
        - when: household.filing_status_conflict
          form: Filing status inconsistent with your marriage facts
          remedy: Correct the filing status or marriage facts. A person married at the end of 2025 cannot file as single;
            filing jointly requires marriage at year end or the death of a spouse during 2025. The head of household
            and qualifying surviving spouse tests are checked separately.
          cite:
            doc: i1040gi
            locator: 'p. 13, Single and Married Filing Jointly, "You were married at the end of 2025" and "Your spouse died in 2025 and you didn’t remarry in 2025."'

        - when: household.widowed_this_year
          form: Filing status after a spouse's death in 2025
          remedy: Your spouse died in 2025, so you are considered married for the whole year for filing status; file a joint
            return with your deceased spouse (married filing jointly) or a separate return (married filing separately).
          cite:
            doc: i1040gi
            locator: 'p. 13, Single, "You were widowed before January 1, 2025, and didn’t remarry before the end of 2025"; p. 13, Married Filing Jointly, "Your spouse died in 2025 and you didn’t remarry in 2025."; p501 p. 6, Spouse died during the year, "If your spouse died during the year, you are considered married for the whole year for filing status purposes."'
        - when: household.hoh_fails
          form: Head of household filing status
          remedy: Head of household is checked but the tests are not met; you must be unmarried or considered unmarried, have paid over half the cost of keeping up your home, and have a qualifying person.
          cite:
            doc: i1040gi
            locator: p. 14, Head of Household
        - when: household.qss_fails
          form: Qualifying surviving spouse filing status
          remedy: Qualifying surviving spouse is checked but the tests are not met; your spouse must have died in 2023 or 2024 and you must not have remarried before the end of 2025, a child or stepchild (not a foster child) you can claim as a dependent must have lived in your home all year, you must have paid over half the cost of keeping up your home, and you must have been able to file jointly the year your spouse died; or the qualifying child was presumed kidnapped, whose rule (Pub. 501) is outside this tool.
          cite:
            doc: i1040gi
            locator: 'p. 15, Qualifying Surviving Spouse; p501 p. 11, Kidnapped child, "You may be eligible to file as a qualifying surviving spouse even if the child who qualifies you for this filing status has been kidnapped."'
    - id: f1040.qbi_deduction
      printed: 13a
      label: Qualified business income deduction from Form 8995 or Form 8995-A
      type: NonNegDollars
      expr:
        op: copy
        from: qbi.deduction
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 13a
    - id: f1040.s1a_deductions
      printed: 13b
      label: Additional deductions from Schedule 1-A, line 38
      type: NonNegDollars
      expr:
        op: copy
        from: s1a.total_deductions
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 13b; i1040gi p. 34, Line 13b, "enter on line 13b the amount, if any, from Schedule 1-A, line 38"
    - id: f1040.line14
      printed: "14"
      label: Add lines 12e, 13a, and 13b
      type: NonNegDollars
      expr:
        op: sum
        of:
          - f1040.line12e
          - f1040.qbi_deduction
          - f1040.s1a_deductions
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 14
    - id: f1040.line15
      printed: "15"
      label: Subtract line 14 from line 11b. If zero or less, enter -0-. This is your taxable income
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: f1040.line11b
        take: f1040.line14
      cite:
        doc: i1040gi
        locator: f1040 Form 1040 (2025), line 15, "Subtract line 14 from line 11b. If zero or less, enter -0-. This is
          your taxable income"
      refuses:
        - when: s1.nol_limit
          form: Form 172, NOL deduction limitation (the 80% limit)
          remedy: Your net operating loss carried into 2025 is more than four times your taxable income after deducting it,
            so the limit of 80% of taxable income figured without the deduction may apply; figuring the limit and the loss
            carried to 2026 is outside this tool.
          cite:
            doc: i172
            locator: 'p. 2, "Only NOLs arising after 2017 and carried forward to a year after 2020 are subject to the
              80%-of-taxable-income limit"'
    - id: f1040.gate.qdcg_applies
      printed: (gate)
      label: Use the Qualified Dividends and Capital Gain Tax Worksheet?
      type: Bool
      expr:
        op: test
        all:
          - op: test
            gt:
              - f1040.line15
              - const: 0
          - op: test
            any:
              - op: test
                gt:
                  - f1040.line3a_if_ordinary
                  - const: 0
              - op: test
                all:
                  - op: test
                    eq:
                      - sd.filed
                      - const: false
                  - op: test
                    gt:
                      - sd.distributions_if_dividends
                      - const: 0
              - op: test
                eq:
                  - sd.line17
                  - const: true
      cite:
        doc: i1040gi
        locator: p. 36, Line 16, Qualified Dividends and Capital Gain Tax Worksheet, "Use the Qualified Dividends and
          Capital Gain Tax Worksheet, later, to figure your tax if you don’t have to use the Schedule D Tax Worksheet
          and if any of the following applies", "You reported qualified dividends on Form 1040 or 1040-SR, line 3a",
          "You don’t have to file Schedule D and you reported capital gain distributions on Form 1040 or 1040-SR, line
          7a", "You are filing Schedule D, and Schedule D, lines 15 and 16, are both more than zero"
    - id: f1040.gate.sdtw
      printed: (gate)
      type: Bool
      label: Schedule D Tax Worksheet required after its exceptions
      expr:
        op: test
        all:
          - op: test
            eq:
              - f1040.gate.qdcg_applies
              - const: true
          - op: test
            any:
              - op: test
                all:
                  - op: test
                    eq:
                      - sd.line17
                      - const: true
                  - op: test
                    any:
                      - op: test
                        gt:
                          - sd.line18
                          - const: 0
                      - op: test
                        gt:
                          - sd.line19
                          - const: 0
              - op: test
                all:
                  - op: test
                    eq:
                      - sd.filing4952
                      - const: true
                  - op: test
                    gt:
                      - sd.investment_election
                      - const: 0
      cite:
        doc: i1040sd
        locator: p. 15, Schedule D Tax Worksheet, applicability and exceptions
      ambiguity: amb.2025.sd4952_selection
    - id: f1040.non_sdtw_tax
      printed: (helper)
      label: Tax when Schedule D Tax Worksheet does not apply
      type: Dollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1040.gate.qdcg_applies
                - const: true
            then: qdcg.line25
          - guard:
              op: test
              eq:
                - f1040.gate.qdcg_applies
                - const: false
            then:
              def: tax_on_amount
              bind:
                amount: f1040.line15
                status: f1040.status
              line: tax
      cite:
        doc: i1040gi
        locator: p. 36, Line 16, "No. Use one of the following methods to figure your tax", "If your taxable income is
          less than $100,000, you must use the Tax Table", "If your taxable income is $100,000 or more, use the Tax
          Computation Worksheet", "Use the Qualified Dividends and Capital Gain Tax Worksheet, later, to figure your
          tax if you don’t have to use the Schedule D Tax Worksheet"
    - id: f1040.line16
      printed: "16"
      label: "Tax (see instructions). Check if any from Form(s): 1 8814 2 4972 3"
      type: Dollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1040.gate.sdtw
                - const: true
            then: sdtw.line47
          - guard:
              op: test
              eq:
                - f1040.gate.sdtw
                - const: false
            then: f1040.non_sdtw_tax
      cite:
        doc: i1040gi
        locator: p. 34, Line 16, Tax, "Tax on your taxable income. Figure the tax using one of the methods described
          later"; p. 36, Line 16, "Use the Schedule D Tax Worksheet in the Instructions for Schedule D to figure the
          amount to enter on Form 1040 or 1040-SR, line 16", "Use the Qualified Dividends and Capital Gain Tax
          Worksheet, later, to figure your tax if you don’t have to use the Schedule D Tax Worksheet"
      refuses:
        - when: scope.other_line16
          form: Forms 8814, 4972, 8615, 8621 or 8978, a section 962 election, or an education credit recapture
          remedy: Additional Form 1040 line 16 taxes are outside this proof of concept.
          cite:
            doc: f1040
            locator: Form 1040 (2025), lines 8, 10, 13b, 16, 19–20 and 27–31
    - id: f1040.line17
      printed: "17"
      label: Amount from Schedule 2, line 3
      type: NonNegDollars
      expr:
        op: copy
        from: s2.line3
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 17
    - id: f1040.line18
      printed: "18"
      label: Add lines 16 and 17
      type: Dollars
      expr:
        op: sum
        of:
          - f1040.line16
          - f1040.line17
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 18
    - id: f1040.line19
      printed: "19"
      label: Child tax credit or credit for other dependents from Schedule 8812
      type: Dollars
      expr:
        op: copy
        from: s8812.line14
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 19
    - id: f1040.line20
      printed: "20"
      label: Amount from Schedule 3, line 8
      type: Dollars
      expr:
        op: copy
        from: s3.line8
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 20
    - id: f1040.line21
      printed: "21"
