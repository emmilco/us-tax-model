        op: subtract_floor0
        from: f1040.line24
        take: f1040.line33
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 37
    - id: f1040.line3a_if_ordinary
      printed: (helper)
      type: NonNegDollars
      label: 'Qualified dividends (Form 1040 line 3a), when ordinary dividends (box 1a) are above zero; zero otherwise'
      expr:
