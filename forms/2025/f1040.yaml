      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1040.withheld_other_any
                - const: true
            then: f1040.line25b
          - guard:
              op: test
              eq:
                - f1040.withheld_other_any
                - const: false
            then: div.zero
      cite:
        doc: i1040gi
        locator: p. 39, Line 25b, "This should be shown in box 4 of Form 1099, box 6, of Form SSA-1099, or box 10 of Form RRB-1099"
    - id: f1040.line25c_other
      printed: (helper)
      label: Federal income tax withheld on Forms W-2G, Schedules K-1 and Forms 1042-S, 8805 and 8288-A
      type: NonNegDollars
      gated_by: f1040.line25c_other_if_withheld_other
