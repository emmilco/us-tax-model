      type: Dollars
      expr:
        op: sum
        of:
          - f1040.line19
          - f1040.line20
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 21
    - id: f1040.line22
      printed: "22"
      label: Subtract line 21 from line 18. If zero or less, enter -0-
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: f1040.line18
        take: f1040.line21
      cite:
        doc: f1040
        locator: Form 1040 (2025), line 22
    - id: f1040.line23
      printed: "23"
