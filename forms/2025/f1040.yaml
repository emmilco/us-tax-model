          - f1040.line34
      cite:
        doc: i1040gi
        locator: p. 65, Line 38, "Lines 35a, 36, and 38 must equal line 34. If the penalty is more than the overpayment on
          line 34, enter -0- on lines 35a and 36."
    - id: f1040.line37
      printed: "37"
