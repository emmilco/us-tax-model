        doc: i1040gi
        locator: p. 39, Line 25b, "This should be shown in box 4 of Form 1099, box 6, of Form SSA-1099, or box 10 of Form RRB-1099"; p. 39, Line 25c—Other Forms, "Federal income tax withheld on your Form(s) W-2G"
    - id: f1040.line25b
      printed: 25b
