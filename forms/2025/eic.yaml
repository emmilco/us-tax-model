form:
  id: eic
  kind: worksheet
  title: Earned Income Credit (EIC)—Steps 1 to 6 and Worksheet A—Line 27a
  tax_year: 2025
  note: The eligibility steps of the Form 1040 instructions (pp. 40–43) as helper lines, in the order the flow
    chart asks them, and Worksheet A (p. 46) as printed lines 1 to 6. Worksheet B (self-employment, clergy,
    church employees, statutory employees) is refused with citations; married filers who file separately or as head of
    household answer Step 3, questions 4 and 5; a filer
    whose income is at or above the largest Step 1 limit for the filing status stops before any person is
    counted.
  lines:
    # Questions the flow chart asks of the filer.
    - id: eic.qc_of_another
      printed: (helper)
      type: Bool
      label: Could you be a qualifying child of another person for 2025?
      expr:
        op: input
        source: Could you be a qualifying child of another person for 2025? Answer no if the other person isn't required
          to file, and isn't filing, a 2025 tax return or is filing a 2025 return only to claim a refund of withheld income
          tax or estimated tax paid.
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, question 6, and p. 42, Step 4, question 5
    - id: eic.age_range_count
      printed: (helper)
      type: Count
      label: Number of people on the return born after December 31, 1960, and before January 2, 2001
      expr:
        op: sum_over
        collection: person
        field: person.one
        where:
          op: test
          all:
          - op: test
            eq:
            - person.born_before_2001
            - const: true
          - op: test
            eq:
            - person.born_after_1960
            - const: true
      cite:
        doc: i1040gi
        locator: p. 41, Step 4, question 2, "Were you, or your spouse if filing a joint return, at least age 25 but under
          age 65 at the end of 2025? (Check 'Yes' if you, or your spouse if filing a joint return, were born after December
          31, 1960, and before January 2, 2001.)"
    - id: eic.age_range
      printed: (helper)
      type: Bool
      label: You, or your spouse if filing a joint return, were at least age 25 but under age 65 at the end of 2025
      expr:
        op: test
        gt:
        - eic.age_range_count
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: p. 41, Step 4, question 2, "Were you, or your spouse if filing a joint return, at least age 25 but under
          age 65 at the end of 2025?"
    - id: eic.us_home
      printed: (helper)
      type: Bool
      label: Was your main home in the United States for more than half of 2025?
      expr:
        op: input
        source: Was your main home in the United States (the 50 states and the District of Columbia) for more than half of
          2025? If you were on extended active military duty outside the United States, that time counts as a main home in
          the United States.
      cite:
        doc: i1040gi
        locator: p. 42, Step 4, question 3; p. 44, Members of the military; p. 45, United States
    - id: eic.zero
      printed: (helper)
      type: NonNegDollars
      label: No amount
      expr:
        op: param
        ref: sales.zero
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, worksheet lines 2 and 4 (zero in this tool)

    # Qualifying children (Step 3, question 1) and those with valid SSNs (Step 1, question 1; Worksheet A).
    - id: eic.qc_count
      printed: (helper)
      type: Count
      label: Number of qualifying children for the EIC
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.eic_child
            - const: true
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, question 1, "Do you have at least one child who meets the conditions to be your qualifying
          child for the purpose of claiming the EIC?"
    - id: eic.ssn_count
      printed: (helper)
      type: Count
      label: Number of qualifying children for the EIC who have valid SSNs
      expr:
        op: sum_over
        collection: dependent
        field: dependent.one
        where:
          op: test
          eq:
            - dependent.eic_ssn_child
            - const: true
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1, "children who have valid SSNs lived with you"; p. 46, Worksheet A, line 2
    - id: eic.has_qc
      printed: (helper)
      type: Bool
      label: At least one qualifying child for the EIC
      expr:
        op: test
        gt:
          - eic.qc_count
          - const: 0
            type: Count
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, question 1
    - id: eic.married_rules
      printed: (helper)
      type: Bool
      label: A married filer whose filing status is married filing separately or head of household
      expr:
        op: test
        any:
          - op: test
            eq:
              - f1040.status
              - const: mfs
          - op: test
            all:
              - op: test
                eq:
                  - f1040.status
                  - const: hoh
              - op: test
                eq:
                  - household.married
                  - const: true
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, question 3, and Step 4, question 1, "Are you a married taxpayer whose filing status is married
          filing separately or head of household?"

    # Step 1.
    - id: eic.top_limit
      printed: (helper)
      type: NonNegDollars
      label: Largest Step 1 income limit for the filing status (three or more children)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1040.status
                - const: single
            then: eic.limit3_other
          - guard:
              op: test
              eq:
                - f1040.status
                - const: mfj
            then: eic.limit3_joint
          - guard:
              op: test
              eq:
                - f1040.status
                - const: mfs
            then: eic.limit3_other
          - guard:
              op: test
              eq:
                - f1040.status
                - const: hoh
            then: eic.limit3_other
          - guard:
              op: test
              eq:
                - f1040.status
                - const: qss
            then: eic.limit3_other
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1, "3 or more children ... less than $61,555 ($68,675 if married filing jointly)"
    - id: eic.below_top
      printed: (helper)
      type: Bool
      label: Adjusted gross income below the largest Step 1 limit (otherwise question 1 is "No" for any number of children)
      expr:
        op: test
        lt:
          - f1040.line11b
          - eic.top_limit
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1 (each limit for fewer children is lower than the limit for 3 or more children)
    - id: eic.limit0_other
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit, no children
      expr:
        op: param
        ref: eic.limit0.other
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1
    - id: eic.limit1_other
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit, 1 child
      expr:
        op: param
        ref: eic.limit1.other
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1
    - id: eic.limit2_other
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit, 2 children
      expr:
        op: param
        ref: eic.limit2.other
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1
    - id: eic.limit3_other
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit, 3 or more children
      expr:
        op: param
        ref: eic.limit3.other
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1
    - id: eic.limit0_joint
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit, no children, married filing jointly
      expr:
        op: param
        ref: eic.limit0.joint
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1
    - id: eic.limit1_joint
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit, 1 child, married filing jointly
      expr:
        op: param
        ref: eic.limit1.joint
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1
    - id: eic.limit2_joint
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit, 2 children, married filing jointly
      expr:
        op: param
        ref: eic.limit2.joint
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1
    - id: eic.limit3_joint
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit, 3 or more children, married filing jointly
      expr:
        op: param
        ref: eic.limit3.joint
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1
    - id: eic.limit_other
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit by the number of qualifying children with valid SSNs
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 0
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 1
                      type: Count
            then: eic.limit0_other
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 1
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 2
                      type: Count
            then: eic.limit1_other
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 2
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 3
                      type: Count
            then: eic.limit2_other
          - guard:
              op: test
              ge:
                - eic.ssn_count
                - const: 3
                  type: Count
            then: eic.limit3_other
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1, and p. 42, Step 5, question 3
    - id: eic.limit_joint
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit by the number of qualifying children with valid SSNs, married filing jointly
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 0
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 1
                      type: Count
            then: eic.limit0_joint
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 1
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 2
                      type: Count
            then: eic.limit1_joint
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 2
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 3
                      type: Count
            then: eic.limit2_joint
          - guard:
              op: test
              ge:
                - eic.ssn_count
                - const: 3
                  type: Count
            then: eic.limit3_joint
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1, and p. 42, Step 5, question 3 (the amounts in parentheses)
    - id: eic.limit
      printed: (helper)
      type: NonNegDollars
      label: Step 1 and Step 5 limit for the filing status and the number of qualifying children with valid SSNs
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1040.status
                - const: single
            then: eic.limit_other
          - guard:
              op: test
              eq:
                - f1040.status
                - const: mfj
            then: eic.limit_joint
          - guard:
              op: test
              eq:
                - f1040.status
                - const: mfs
            then: eic.limit_other
          - guard:
              op: test
              eq:
                - f1040.status
                - const: hoh
            then: eic.limit_other
          - guard:
              op: test
              eq:
                - f1040.status
                - const: qss
            then: eic.limit_other
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1, and p. 42, Step 5, question 3 (the same four limits)
    - id: eic.step1_income
      printed: (helper)
      type: Bool
      label: Step 1, question 1. Is the amount on Form 1040, line 11b, less than the limit for the number of children who have valid SSNs?
      expr:
        op: test
        lt:
          - f1040.line11b
          - eic.limit
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 1
    - id: eic.step1_ssn
      printed: (helper)
      type: Bool
      label: Step 1, question 2. Do you have a social security number issued on or before the due date of your return that allows you to work and is valid for EIC purposes?
      expr:
        op: test
        eq:
          - household.all_eic_ssn
          - const: true
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 2; pp. 44–45, Social security number (SSN), "For the EIC, a valid SSN is a number issued
          by the Social Security Administration unless “Not Valid for Employment” is printed on the social security card and
          the number was issued solely to allow the recipient of the SSN to apply for or receive a federally funded benefit"
    - id: eic.step1_foreign
      printed: (helper)
      type: Bool
      label: Step 1, question 3. Not filing Form 2555 (foreign earned income)
      expr:
        op: test
        eq:
          - sa.excluded_income
          - const: false
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 3
      refuses:
        - when: sa.excluded_income
          form: Form 2555 (EIC, Step 1, question 3)
          remedy: A filer excluding foreign earned income can't take the EIC; Form 2555 and excluded income are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 40, Step 1, question 3, "Are you filing Form 2555 (relating to foreign earned income)? ... Yes. STOP"
    - id: eic.step1_resident
      printed: (helper)
      type: Bool
      label: Step 1, question 4. Not a nonresident alien for any part of 2025
      expr:
        op: test
        eq:
          - scope.other_income
          - const: false
      cite:
        doc: i1040gi
        locator: p. 40, Step 1, question 4
      refuses:
        - when: scope.other_income
          form: Nonresident aliens (EIC, Step 1, question 4)
          remedy: Nonresident and dual-status treatment is outside this tool.
          cite:
            doc: i1040gi
            locator: p. 40, Step 1, question 4; p. 44, Nonresident aliens

    # Step 2.
    - id: eic.gain_7a
      printed: (helper)
      type: NonNegDollars
      label: Form 1040, line 7a; if line 7a is a loss, enter -0-
      expr:
        op: subtract_floor0
        from: f1040.line7a
        take: eic.zero
      cite:
        doc: i1040gi
        locator: p. 40, Step 2, question 1, "*If line 7a is a loss, enter -0-."
    - id: eic.investment_income
      printed: (helper)
      type: Dollars
      label: 'Step 2, question 1. Investment income: Form 1040, lines 2a, 2b, 3b and 7a'
      expr:
        op: sum
        of:
          - f1040.line2a
          - f1040.line2b
          - f1040.line3b
          - eic.gain_7a
      cite:
        doc: i1040gi
        locator: 'p. 40, Step 2, question 1, "Add the amounts from Form 1040 or 1040-SR: Line 2a ... Line 2b + Line 3b + Line 7a*"'
    - id: eic.step2_income
      printed: (helper)
      type: Bool
      label: Step 2, question 2. Investment income not more than $11,950 (more than $11,950 stops at question 3 without Form 4797)
      expr:
        op: test
        le:
          - eic.investment_income
          - param: eic.investment_limit
      cite:
        doc: i1040gi
        locator: p. 40, Step 2, questions 2 and 3 (Form 4797 is refused before this question, so question 3 is "No. STOP")
    - id: eic.step2_other
      printed: (helper)
      type: Bool
      label: Step 2, question 4. No Schedule E, rental of personal property, Form 8814 or passive activity
      expr:
        op: test
        all:
          - op: test
            eq:
              - scope.schedule1
              - const: false
          - op: test
            eq:
              - scope.other_line16
              - const: false
      cite:
        doc: i1040gi
        locator: p. 40, Step 2, question 4
      refuses:
        - when: scope.schedule1
          form: Pub. 596, Worksheet 1 (EIC, Step 2, question 4)
          remedy: Schedule E, rental of personal property and passive activity income are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 40, Step 2, question 4, "Yes. Use Worksheet 1 ... in Pub. 596"
        - when: scope.other_line16
          form: Form 8814 (EIC, Step 2, question 4)
          remedy: Reporting a child's interest and dividends on Form 8814 is outside this tool.
          cite:
            doc: i1040gi
            locator: p. 40, Step 2, question 4

    # Steps 3 and 4.
    - id: eic.same_home
      printed: (helper)
      type: Bool
      label: Did you and your spouse have the same principal residence for the last 6 months of 2025?
      expr:
        op: input
        source: Did you and your spouse have the same principal residence for the last 6 months of 2025?
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, question 4
    - id: eic.legally_separated
      printed: (helper)
      type: Bool
      label: Are you legally separated under a written separation agreement or a decree of separate maintenance, and did you live apart from your spouse at the end of 2025?
      expr:
        op: input
        source: Are you legally separated according to your state law under a written separation agreement or a decree of
          separate maintenance, and did you live apart from your spouse at the end of 2025?
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, question 5; p. 44, Special rule for separated spouses
    - id: eic.step3_married
      printed: (helper)
      type: Bool
      label: 'Step 3, questions 3 to 5: not a married filer filing separately or as head of household, or one who lived apart from the spouse for the last 6 months of 2025 or is legally separated and lived apart at the end of 2025'
      expr:
        op: test
        any:
          - op: test
            eq:
              - eic.married_rules
              - const: false
          - op: test
            eq:
              - eic.same_home
              - const: false
          - op: test
            eq:
              - eic.legally_separated
              - const: true
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, question 3 ("No. Skip questions 4 and 5"), question 4 ("No. Skip question 5"), question 5
          ("No. STOP")
    - id: eic.step3
      printed: (helper)
      type: Bool
      label: 'Step 3, questions 2 to 6: filing jointly, or passing questions 3 to 5 and not a qualifying child of another person'
      expr:
        op: test
        any:
          - op: test
            eq:
              - f1040.status
              - const: mfj
          - op: test
            all:
              - op: test
                eq:
                  - eic.step3_married
                  - const: true
              - op: test
                eq:
                  - eic.qc_of_another
                  - const: false
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, questions 2 to 6
    - id: eic.step4
      printed: (helper)
      type: Bool
      label: 'Step 4: not a married filer filing separately or as head of household, aged 25 to 64, main home in the United States, and not a qualifying child or dependent of another person'
      expr:
        op: test
        all:
          - op: test
            eq:
              - eic.married_rules
              - const: false
          - op: test
            eq:
              - eic.age_range
              - const: true
          - op: test
            eq:
              - eic.us_home
              - const: true
          - op: test
            any:
              - op: test
                eq:
                  - f1040.status
                  - const: mfj
              - op: test
                all:
                  - op: test
                    eq:
                      - eic.qc_of_another
                      - const: false
                  - op: test
                    eq:
                      - sa.dependent
                      - const: false
      cite:
        doc: i1040gi
        locator: pp. 41–42, Step 4, questions 1 to 6 (question 2 "at least age 25 but under age 65", born after December 31,
          1960 and before January 2, 2001)
      refuses:
        - when: sa.dependent
          form: Dependent of another person or dual-status alien (EIC, Step 4, question 6)
          remedy: A filer who can be claimed as a dependent, or a dual-status alien, is outside this tool.
          cite:
            doc: i1040gi
            locator: p. 42, Step 4, question 6
    - id: eic.step34
      printed: (helper)
      type: Bool
      label: Step 3 for a filer with a qualifying child, Step 4 otherwise
      expr:
        op: test
        any:
          - op: test
            all:
              - op: test
                eq:
                  - eic.has_qc
                  - const: true
              - op: test
                eq:
                  - eic.step3
                  - const: true
          - op: test
            all:
              - op: test
                eq:
                  - eic.has_qc
                  - const: false
              - op: test
                eq:
                  - eic.step4
                  - const: true
      cite:
        doc: i1040gi
        locator: p. 41, Step 3, question 1, "No. Skip questions 2 through 6; go to Step 4"
    - id: eic.reached_step5
      printed: (helper)
      label: Step 5 is reached (Steps 1 and 2 passed and Step 3 or 4 sends you to Step 5)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - eic.reached_step3
          - const: true
        - op: test
          eq:
          - eic.step34
          - const: true
      cite:
        doc: i1040gi
        locator: p. 42, Step 4, "Go to Step 5"; each earlier "STOP You can't take the credit" ends the flowchart (pp. 40-42)
    - id: eic.step5_line1
      printed: (Step 5, 1)
      type: NonNegDollars
      label: Enter the amount from Form 1040 or 1040-SR, line 1z
      expr:
        op: copy
        from: f1040.line1z
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, worksheet line 1
      refuses:
        - when: scope.schedule1
          form: Clergy, church employees and statutory employees (EIC, Step 5, questions 1 and 2; Worksheet B)
          remedy: Clergy, church employee and statutory employee income are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 42, Step 5, questions 1 and 2; p. 43, Clergy and Church employees; p. 47, Worksheet B
    - id: eic.step5_line2
      printed: (Step 5, 2)
      type: NonNegDollars
      label: Medicaid waiver payments excluded from income on Schedule 1, line 8s, unless chosen as earned income; zero in this tool
      expr:
        op: copy
        from: eic.zero
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, worksheet line 2
      refuses:
        - when: scope.other_income
          form: Medicaid waiver payments (EIC, Step 5, line 2)
          remedy: Medicaid waiver payments are outside this tool.
          cite:
            doc: i1040gi
            locator: p. 42, Step 5, worksheet line 2
    - id: eic.step5_line3
      printed: (Step 5, 3)
      type: Dollars
      label: Subtract line 2 from line 1
      expr:
        op: subtract
        from: eic.step5_line1
        take: eic.step5_line2
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, worksheet line 3
    - id: eic.step5_line4
      printed: (Step 5, 4)
      type: NonNegDollars
      label: Nontaxable combat pay you elect to include in earned income; zero in this tool
      expr:
        op: copy
        from: eic.zero
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, worksheet line 4
      refuses:
        - when: s8812.combat_pay
          form: Nontaxable combat pay (EIC, Step 5, line 4)
          remedy: Nontaxable combat pay is outside this tool.
          cite:
            doc: i1040gi
            locator: p. 42, Step 5, worksheet line 4; p. 43, Combat pay, nontaxable
    - id: eic.earned_income
      printed: (Step 5, 5)
      type: Dollars
      label: Add lines 3 and 4. This is your earned income
      expr:
        op: sum
        of:
          - eic.step5_line3
          - eic.step5_line4
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, worksheet line 5
    - id: eic.sc_count
      printed: (helper)
      label: Number of Schedules C on the return
      type: Count
      expr:
        op: sum_over
        collection: person
        field: person.sc_count
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, question 2, "Were you self-employed at any time in 2025"
    - id: eic.self_employed
      printed: (helper)
      label: 'Step 5, question 2: self-employed (Worksheet B)'
      type: Bool
      expr:
        op: test
        gt:
        - eic.sc_count
        - const: 0
          type: Count
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, question 2, "Yes. Skip question 3 ... and Step 6; go to Worksheet B"
    - id: eic.wsb_se
      printed: (helper)
      label: Worksheet B, lines 1e and 2c (both spouses on a joint return)
      type: Dollars
      expr:
        op: sum_over
        collection: person
        field: person.eic_se
      cite:
        doc: i1040gi
        locator: p. 47, Worksheet B, Parts 1 and 2
    - id: eic.show_wsb4b
      printed: (helper)
      label: Worksheet B is used (Step 5 reached and Step 5 question 2 is Yes)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - eic.reached_step5
          - const: true
        - op: test
          eq:
          - eic.self_employed
          - const: true
      cite:
        doc: i1040gi
        locator: p. 47, Worksheet B, "Use this worksheet if you answered “Yes” to Step 5, question 2"
    - id: eic.wsb_4b
      printed: 4b
      shown_when: eic.show_wsb4b
      label: Worksheet B, line 4b. Combine lines 1e, 2c, 3, and 4a. This is your total earned income
      type: Dollars
      expr:
        op: sum
        of:
        - eic.earned_income
        - eic.wsb_se
      cite:
        doc: i1040gi
        locator: p. 47, Worksheet B, Part 4, line 4b (line 4a is your earned income from Step 5; line 3, statutory employees,
          is refused)
    - id: eic.show_wsb6
      printed: (helper)
      label: Worksheet B line 6 is completed (the credit is reached and Worksheet B is used)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - eic.eligible
          - const: true
        - op: test
          eq:
          - eic.self_employed
          - const: true
      cite:
        doc: i1040gi
        locator: p. 47, Worksheet B, line 5, "No. You can’t take the credit"
    - id: eic.wsb_6
      printed: '6'
      shown_when: eic.show_wsb6
      label: Worksheet B, line 6. Enter your total earned income from Part 4, line 4b (zero if line 4b is zero or less)
      type: NonNegDollars
      expr:
        op: subtract_floor0
        from: eic.wsb_4b
        take: eic.zero
      cite:
        doc: i1040gi
        locator: p. 47, Worksheet B, Part 4, "STOP If line 4b is zero or less, you can't take the credit", and Part 5, line 6
    - id: eic.earned_for_limit
      printed: (helper)
      label: Earned income compared with the limit (Step 5, question 3, or Worksheet B, line 5)
      type: Dollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - eic.self_employed
            - const: false
          then: eic.earned_income
        - guard:
            op: test
            eq:
            - eic.self_employed
            - const: true
          then: eic.wsb_4b
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, question 3; p. 47, Worksheet B, Part 4, line 5
    - id: eic.step5_income
      printed: (helper)
      type: Bool
      label: Step 5, question 3. Is your earned income less than the limit for the number of qualifying children with valid SSNs?
      expr:
        op: test
        lt:
          - eic.earned_for_limit
          - eic.limit
      cite:
        doc: i1040gi
        locator: p. 42, Step 5, question 3
    - id: eic.eligible
      printed: (helper)
      type: Bool
      label: Steps 1 to 5 passed in order (Step 6, figure the credit on Worksheet A)
      expr:
        op: test
        all:
          - op: test
            eq:
              - eic.below_top
              - const: true
          - op: test
            eq:
              - eic.step1_income
              - const: true
          - op: test
            eq:
              - eic.step1_ssn
              - const: true
          - op: test
            eq:
              - eic.step1_foreign
              - const: true
          - op: test
            eq:
              - eic.step1_resident
              - const: true
          - op: test
            eq:
              - eic.step2_income
              - const: true
          - op: test
            eq:
              - eic.step2_other
              - const: true
          - op: test
            eq:
              - eic.step34
              - const: true
          - op: test
            eq:
              - eic.step5_income
              - const: true
      cite:
        doc: i1040gi
        locator: pp. 40–43, Steps 1 to 6 (each "No. STOP You can't take the credit" ends the flow chart; Step 6, question 1,
          "No. Go to Worksheet A")

    # Worksheet A.
    - id: eic.line1
      printed: '1'
      shown_when: eic.eligible
      label: Enter your earned income from Step 5 (Worksheet A, line 1), or Worksheet B, line 6
      type: Dollars
      expr:
        op: choose
        alternatives:
        - guard:
            op: test
            eq:
            - eic.self_employed
            - const: false
          then: eic.earned_income
        - guard:
            op: test
            eq:
            - eic.self_employed
            - const: true
          then: eic.wsb_6
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 1; p. 48, Worksheet B, Part 5, line 6 (Worksheet A lines 2 to 6 are Worksheet B lines
          7 to 11)
    - id: eic.line1_in_table
      printed: (helper)
      type: Bool
      label: Line 1 is at least $1, the first amount the EIC Table lists
      expr:
        op: test
        ge:
          - eic.line1
          - param: eic.table_start
      cite:
        doc: i1040gi
        locator: p. 49, EIC Table, first row "At least 1" (see the ambiguity register, amb.2025.eic_below_table)
    - id: eic.line1_table0
      printed: (helper)
      type: NonNegDollars
      label: EIC Table credit for line 1, no qualifying children with valid SSNs
      expr:
        op: table_lookup
        table: eic_0
        key: eic.line1
        status: f1040.status
      cite:
        doc: i1040gi
        locator: pp. 49–60, EIC Table, column 0
    - id: eic.line1_table1
      printed: (helper)
      type: NonNegDollars
      label: EIC Table credit for line 1, one qualifying child with a valid SSN
      expr:
        op: table_lookup
        table: eic_1
        key: eic.line1
        status: f1040.status
      cite:
        doc: i1040gi
        locator: pp. 49–60, EIC Table, column 1
    - id: eic.line1_table2
      printed: (helper)
      type: NonNegDollars
      label: EIC Table credit for line 1, two qualifying children with valid SSNs
      expr:
        op: table_lookup
        table: eic_2
        key: eic.line1
        status: f1040.status
      cite:
        doc: i1040gi
        locator: pp. 49–60, EIC Table, column 2
    - id: eic.line1_table3
      printed: (helper)
      type: NonNegDollars
      label: EIC Table credit for line 1, three or more qualifying children with valid SSNs
      expr:
        op: table_lookup
        table: eic_3
        key: eic.line1
        status: f1040.status
      cite:
        doc: i1040gi
        locator: pp. 49–60, EIC Table, column 3
    - id: eic.line1_table
      printed: (helper)
      type: NonNegDollars
      label: EIC Table credit for line 1 in the column for the number of qualifying children with valid SSNs
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 0
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 1
                      type: Count
            then: eic.line1_table0
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 1
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 2
                      type: Count
            then: eic.line1_table1
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 2
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 3
                      type: Count
            then: eic.line1_table2
          - guard:
              op: test
              ge:
                - eic.ssn_count
                - const: 3
                  type: Count
            then: eic.line1_table3
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 2, "the number of qualifying children you have who have valid SSNs"
    - id: eic.line2
      printed: "2"
      shown_when: eic.eligible
      type: NonNegDollars
      label: Look up the amount on line 1 in the EIC Table to find the credit, using the column for your filing status and the number of qualifying children who have valid SSNs
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - eic.line1_in_table
                - const: true
            then: eic.line1_table
          - guard:
              op: test
              eq:
                - eic.line1_in_table
                - const: false
            then: eic.zero
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 2
    - id: eic.show3
      printed: (helper)
      label: Worksheet A line 3 is completed (the credit is reached and line 2 is more than zero)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - eic.eligible
          - const: true
        - op: test
          gt:
          - eic.line2
          - param: sales.zero
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 2, "If line 2 is zero, You can’t take the credit"
    - id: eic.line3
      printed: "3"
      shown_when: eic.show3
      type: Dollars
      label: Enter the amount from Form 1040 or 1040-SR, line 11b
      expr:
        op: copy
        from: f1040.line11b
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 3
    - id: eic.line4
      printed: "4"
      type: Bool
      label: Are the amounts on lines 3 and 1 the same?
      expr:
        op: test
        eq:
          - eic.line3
          - eic.line1
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 4
    - id: eic.threshold_other
      printed: (helper)
      type: NonNegDollars
      label: Line 5 amount by whether you have a qualifying child with a valid SSN
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 0
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 1
                      type: Count
            then: eic.threshold0_other
          - guard:
              op: test
              ge:
                - eic.ssn_count
                - const: 1
                  type: Count
            then: eic.threshold1_other
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5
    - id: eic.threshold_joint
      printed: (helper)
      type: NonNegDollars
      label: Line 5 amount by whether you have a qualifying child with a valid SSN, married filing jointly
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 0
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 1
                      type: Count
            then: eic.threshold0_joint
          - guard:
              op: test
              ge:
                - eic.ssn_count
                - const: 1
                  type: Count
            then: eic.threshold1_joint
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5 (the amounts in parentheses)
    - id: eic.line5_threshold
      printed: (helper)
      type: NonNegDollars
      label: Line 5 amount for the filing status and whether you have a qualifying child with a valid SSN
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - f1040.status
                - const: single
            then: eic.threshold_other
          - guard:
              op: test
              eq:
                - f1040.status
                - const: mfj
            then: eic.threshold_joint
          - guard:
              op: test
              eq:
                - f1040.status
                - const: mfs
            then: eic.threshold_other
          - guard:
              op: test
              eq:
                - f1040.status
                - const: hoh
            then: eic.threshold_other
          - guard:
              op: test
              eq:
                - f1040.status
                - const: qss
            then: eic.threshold_other
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5
    - id: eic.threshold0_other
      printed: (helper)
      type: NonNegDollars
      label: Line 5 amount, no qualifying children
      expr:
        op: param
        ref: eic.ws_threshold0.other
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5
    - id: eic.threshold1_other
      printed: (helper)
      type: NonNegDollars
      label: Line 5 amount, 1 or more qualifying children
      expr:
        op: param
        ref: eic.ws_threshold1.other
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5
    - id: eic.threshold0_joint
      printed: (helper)
      type: NonNegDollars
      label: Line 5 amount, no qualifying children, married filing jointly
      expr:
        op: param
        ref: eic.ws_threshold0.joint
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5
    - id: eic.threshold1_joint
      printed: (helper)
      type: NonNegDollars
      label: Line 5 amount, 1 or more qualifying children, married filing jointly
      expr:
        op: param
        ref: eic.ws_threshold1.joint
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5
    - id: eic.line5_blank
      printed: (helper)
      type: Bool
      label: Line 5. Is the amount on line 3 less than the line 5 amount? (Yes leaves line 5 blank)
      expr:
        op: test
        lt:
          - eic.line3
          - eic.line5_threshold
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5, "Yes. Leave line 5 blank; enter the amount from line 2 on line 6"
    - id: eic.line3_table0
      printed: (helper)
      type: NonNegDollars
      label: EIC Table credit for line 3, no qualifying children with valid SSNs
      expr:
        op: table_lookup
        table: eic_0
        key: eic.line3
        status: f1040.status
      cite:
        doc: i1040gi
        locator: pp. 49–60, EIC Table, column 0
    - id: eic.line3_table1
      printed: (helper)
      type: NonNegDollars
      label: EIC Table credit for line 3, one qualifying child with a valid SSN
      expr:
        op: table_lookup
        table: eic_1
        key: eic.line3
        status: f1040.status
      cite:
        doc: i1040gi
        locator: pp. 49–60, EIC Table, column 1
    - id: eic.line3_table2
      printed: (helper)
      type: NonNegDollars
      label: EIC Table credit for line 3, two qualifying children with valid SSNs
      expr:
        op: table_lookup
        table: eic_2
        key: eic.line3
        status: f1040.status
      cite:
        doc: i1040gi
        locator: pp. 49–60, EIC Table, column 2
    - id: eic.line3_table3
      printed: (helper)
      type: NonNegDollars
      label: EIC Table credit for line 3, three or more qualifying children with valid SSNs
      expr:
        op: table_lookup
        table: eic_3
        key: eic.line3
        status: f1040.status
      cite:
        doc: i1040gi
        locator: pp. 49–60, EIC Table, column 3
    - id: eic.show5
      printed: (helper)
      label: Worksheet A line 5 is completed (the credit is reached, line 2 is more than zero, line 4 is No and line 5 is not left
        blank)
      type: Bool
      expr:
        op: test
        all:
        - op: test
          eq:
          - eic.eligible
          - const: true
        - op: test
          eq:
          - eic.line4
          - const: false
        - op: test
          eq:
          - eic.line5_blank
          - const: false
        - op: test
          gt:
          - eic.line2
          - param: sales.zero
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 2, "If line 2 is zero, You can’t take the credit"; line 4, "Yes. Skip line 5; enter the amount from line 2 on line 6"; line 5, "Yes. Leave line 5 blank"
    - id: eic.line5
      printed: "5"
      shown_when: eic.show5
      type: NonNegDollars
      label: Look up the amount on line 3 in the EIC Table to find the credit, using the column for your filing status and the number of qualifying children who have valid SSNs
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 0
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 1
                      type: Count
            then: eic.line3_table0
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 1
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 2
                      type: Count
            then: eic.line3_table1
          - guard:
              op: test
              all:
                - op: test
                  ge:
                    - eic.ssn_count
                    - const: 2
                      type: Count
                - op: test
                  lt:
                    - eic.ssn_count
                    - const: 3
                      type: Count
            then: eic.line3_table2
          - guard:
              op: test
              ge:
                - eic.ssn_count
                - const: 3
                  type: Count
            then: eic.line3_table3
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5, "No. Look up the amount on line 3 in the EIC Table to find the credit"
    - id: eic.smaller
      printed: (helper)
      type: NonNegDollars
      label: The smaller of lines 5 and 2
      expr:
        op: smaller_of
        of:
          - eic.line5
          - eic.line2
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5, "Look at the amounts on lines 5 and 2. Then, enter the smaller amount on line 6"
    - id: eic.after_line4
      printed: (helper)
      type: NonNegDollars
      label: When line 4 is No, line 2 if line 5 is left blank and otherwise the smaller of lines 5 and 2
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - eic.line5_blank
                - const: true
            then: eic.line2
          - guard:
              op: test
              eq:
                - eic.line5_blank
                - const: false
            then: eic.smaller
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 5
    - id: eic.line6
      printed: "6"
      shown_when: eic.eligible
      type: NonNegDollars
      label: This is your earned income credit
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - eic.line4
                - const: true
            then: eic.line2
          - guard:
              op: test
              eq:
                - eic.line4
                - const: false
            then: eic.after_line4
      cite:
        doc: i1040gi
        locator: p. 46, Worksheet A, line 4, "Yes. Skip line 5; enter the amount from line 2 on line 6", and line 6
    - id: eic.credit
      printed: (helper)
      type: NonNegDollars
      label: Earned income credit for Form 1040, line 27a (Worksheet A, line 6, or Worksheet B, line 11 for a filer who answered Yes
        to Step 5, question 2, when Steps 1 to 5 are passed; zero otherwise)
      expr:
        op: choose
        alternatives:
          - guard:
              op: test
              eq:
                - eic.eligible
                - const: true
            then: eic.line6
          - guard:
              op: test
              eq:
                - eic.eligible
                - const: false
            then: eic.zero
      cite:
        doc: i1040gi
        locator: pp. 40–46, each "STOP You can't take the credit"; Worksheet A, line 6, "Enter this amount on Form 1040 or
          1040-SR, line 27a"
      refuses:
        - when: household.credit_disallowed
          form: Form 8862 and the EIC disallowance period (Form 8862, who must file)
          remedy: Your EIC, child tax credit, additional child tax credit or credit for other dependents for an earlier year was
            reduced or disallowed, or you are in a disallowance period; Form 8862 and the disallowance period are outside this
            tool.
          cite:
            doc: i1040gi
            locator: 'p. 43, Form 8862, who must file, "You must file Form 8862 if your EIC for a year after 1996 was reduced or disallowed for any reason other than a math or clerical error" and "don’t file Form 8862 or take the credit for the ... 2 years after the most recent tax year for which there was a final determination that your EIC claim was due to reckless or intentional disregard of the EIC rules ... 10 years after the most recent tax year for which there was a final determination that your EIC claim was due to fraud"'

    # Boxes the instructions tell the filer to check (Form 1040 lines 27b and 27c, the Dependents section box).
    - id: eic.reached_step3
      printed: (helper)
      type: Bool
      label: Steps 1 and 2 passed, so Step 3 or Step 4 is asked
      expr:
        op: test
        all:
          - op: test
            eq:
              - eic.below_top
              - const: true
          - op: test
            eq:
              - eic.step1_income
              - const: true
          - op: test
            eq:
              - eic.step1_ssn
              - const: true
          - op: test
            eq:
              - eic.step1_foreign
              - const: true
          - op: test
            eq:
              - eic.step1_resident
              - const: true
          - op: test
            eq:
              - eic.step2_income
              - const: true
          - op: test
            eq:
              - eic.step2_other
              - const: true
      cite:
        doc: i1040gi
        locator: pp. 40–41, Steps 1 and 2 ("Go to Step 3")
    - id: eic.check_27c
      printed: (helper)
      type: Bool
      label: The instructions say to check the box on line 27c (a STOP that says so, or Worksheet A line 2 is zero); the filer's own choice not to claim the EIC is not asked
      expr:
        op: test
        any:
          - op: test
            all:
              - op: test
                eq:
                  - eic.below_top
                  - const: true
              - op: test
                eq:
                  - eic.step1_income
                  - const: true
              - op: test
                eq:
                  - eic.step1_ssn
                  - const: false
          - op: test
            all:
              - op: test
