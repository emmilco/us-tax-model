form:
  id: scveh
  kind: form
  title: Schedule C line 9 and Part IV, and Form 4562 Part V — one vehicle used in a business
  tax_year: 2025
  note: 'One entry per car, truck or van used in the business: the standard mileage rate or actual expenses (Schedule C line
    9 and, for a lease, line 20a), and for an owned vehicle on actual expenses its depreciation by Pub. 946''s Depreciation
    Worksheet for Passenger Automobiles (Form 4562 Part V): placed in service 2019 to 2025, a 2019 vehicle''s first year after
    its recovery period from its unrecovered basis. Refused: earlier special allowances, earlier standard mileage, business
    use of 50% or less, dispositions, trade-ins and the other items of the screen.'
  lines:
  - id: scveh.zero
    printed: (helper)
    label: Zero
    type: NonNegDollars
    expr:
      op: param
      ref: sales.zero
    cite:
      doc: i1040sc
      locator: p. 6, Line 9
  - id: scveh.method
    printed: (helper)
    label: Standard mileage rate or actual expenses
    type: Enum(vehicle_method)
    expr:
      op: input
      source: For this vehicle, do you take the standard mileage rate (standard) or deduct actual expenses (actual)?
    cite:
      doc: i1040sc
      locator: p. 6, Line 9, "You can deduct the actual expenses of operating your car or truck or take the standard mileage
        rate"
  - id: scveh.owned
    printed: (helper)
    label: Owned (not leased)
    type: Bool
    expr:
      op: input
      source: Do you own this vehicle (answer No if you lease it)?
    cite:
      doc: i1040sc
      locator: p. 6, Line 9, "Owned the vehicle ... or Leased the vehicle"
  - id: scveh.placed_date
    printed: '43'
    label: When did you place your vehicle in service for business purposes? (month/day/year)
    type: Count
    expr:
      op: input
      source: The year you first placed this vehicle in service for business purposes (for example 2023)
    cite:
      doc: f1040sc
      locator: Schedule C (2025), line 43
  - id: scveh.miles_business
    printed: 44a
    label: Business miles
    type: Count
    expr:
      op: input
      source: The miles you drove this vehicle in 2025 for this business (not commuting)
    cite:
      doc: f1040sc
      locator: Schedule C (2025), line 44a; i1040sc p. 15, Line 44b
  - id: scveh.miles_commuting
    printed: 44b
    label: Commuting miles
    type: Count
    expr:
      op: input
      source: The commuting miles you drove this vehicle in 2025 (travel between your home and a work location, as defined
        in the instructions for line 44b)
    cite:
      doc: i1040sc
      locator: p. 15, Line 44b
  - id: scveh.miles_other
    printed: 44c
    label: Other miles
    type: Count
    expr:
      op: input
      source: The other (personal) miles you drove this vehicle in 2025
    cite:
      doc: f1040sc
      locator: Schedule C (2025), line 44c
  - id: scveh.cent
    printed: (helper)
    label: One cent
    type: NonNegDollars
    expr:
      op: param
      ref: sc.one_cent
    cite:
      doc: i4562
      locator: p. 14, Column (c)—Business/investment use percentage
  - id: scveh.bm_c
    printed: (helper)
    label: Business miles, as cents
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: scveh.cent
      count: scveh.miles_business
    cite:
      doc: i4562
      locator: p. 14, Column (c), "dividing the number of miles the vehicle is driven for trade or business purposes"
  - id: scveh.cm_c
    printed: (helper)
    label: Commuting miles, as cents
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: scveh.cent
      count: scveh.miles_commuting
    cite:
      doc: i4562
      locator: p. 14, Column (c), "(not to include any commuting mileage)"
  - id: scveh.om_c
    printed: (helper)
    label: Other miles, as cents
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: scveh.cent
      count: scveh.miles_other
    cite:
      doc: i4562
      locator: p. 14, Column (c)
  - id: scveh.nonbusiness_c
    printed: (helper)
    label: Commuting and other miles, as cents
    type: NonNegDollars
    expr:
      op: sum
      of:
      - scveh.cm_c
      - scveh.om_c
    cite:
      doc: i4562
      locator: p. 14, Column (c)
  - id: scveh.total_c
    printed: (helper)
    label: Total miles, as cents
    type: NonNegDollars
    expr:
      op: sum
      of:
      - scveh.bm_c
      - scveh.nonbusiness_c
    cite:
      doc: i4562
      locator: p. 14, Column (c), "by the total number of miles the vehicle is driven for all purposes"
    refuses:
    - when: scveh.no_miles
      form: A vehicle with actual expenses and no miles
      remedy: The business-use percentage of a vehicle's actual expenses is its business miles divided by its total miles,
        so it cannot be figured for a vehicle with no miles in 2025. Enter the vehicle's miles, or leave out a vehicle
        that was not driven.
      cite:
        doc: i4562
        locator: p. 14, Column (c), "by the total number of miles the vehicle is driven for all purposes"
  - id: scveh.no_miles
    printed: (gate)
    label: Actual expenses claimed for a vehicle with no miles
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - scveh.method
        - const: actual
      - op: test
        eq:
        - scveh.miles_business
        - const: 0
          type: Count
      - op: test
        eq:
        - scveh.miles_commuting
        - const: 0
          type: Count
      - op: test
        eq:
        - scveh.miles_other
        - const: 0
          type: Count
    cite:
      doc: i4562
      locator: p. 14, Column (c), "by the total number of miles the vehicle is driven for all purposes"
  - id: scveh.over_half
    printed: (helper)
    label: Business use is more than 50%
    type: Bool
    expr:
      op: test
      gt:
      - scveh.bm_c
      - scveh.nonbusiness_c
    cite:
      doc: i4562
      locator: p. 14, Lines 26 and 27, "property used more than 50% in a qualified business use"
  - id: scveh.parking
    printed: (helper)
    label: Business parking fees and tolls
    type: NonNegDollars
    expr:
      op: input
      source: Parking fees and tolls for this vehicle's business use in 2025 (zero if none)
    cite:
      doc: i1040sc
      locator: p. 6, Line 9, "Add to this amount your parking fees and tolls"
  - id: scveh.smr_ok
    printed: (screen)
    label: May you use the standard mileage rate for this vehicle?
    type: Bool
    expr:
      op: input
      source: 'If you own this vehicle: did you use the standard mileage rate for it in the first year you used it for business?
        If you lease it: are you using the standard mileage rate for the entire lease period? (Answer No if this is one of
        five or more vehicles you used in the business at the same time.)'
    cite:
      doc: i1040sc
      locator: p. 6, Line 9, "You must use actual expenses if you used five or more vehicles simultaneously" and "You can
        take the standard mileage rate for 2025 only if you"
  - id: scveh.smr_bad
    printed: (gate)
    label: The standard mileage rate is not available for this vehicle
    type: Bool
    expr:
      op: test
      eq:
      - scveh.smr_ok
      - const: false
    cite:
      doc: i1040sc
      locator: p. 6, Line 9
  - id: scveh.rate
    printed: (helper)
    label: Standard mileage rate per mile
    type: NonNegDollars
    expr:
      op: param
      ref: sc.mileage_rate
    cite:
      doc: n-25-05
      locator: Section 3, "The standard mileage rate for transportation or travel expenses for 2025 is 70 cents per mile for
        all miles of business use"
  - id: scveh.smr_amount
    printed: (helper)
    label: Business miles times the standard mileage rate
    type: NonNegDollars
    expr:
      op: multiply_count
      amount: scveh.rate
      count: scveh.miles_business
    cite:
      doc: i1040sc
      locator: p. 6, Line 9, "Multiply the number of business miles driven by 0.70"
    refuses:
    - when: scveh.smr_bad
      form: Standard mileage rate not available (not used in the vehicle's first year or for the whole lease, or five or more
        vehicles at once)
      remedy: Use actual expenses for this vehicle, or this vehicle is outside this tool.
      cite:
        doc: i1040sc
        locator: p. 6, Line 9
  - id: scveh.line9_standard
    printed: (helper)
    label: Standard mileage amount plus parking fees and tolls
    type: NonNegDollars
    expr:
      op: sum
      of:
      - scveh.smr_amount
      - scveh.parking
    cite:
      doc: i1040sc
      locator: p. 6, Line 9, "Add to this amount your parking fees and tolls; and Enter the total on line 9"
  - id: scveh.operating
    printed: (helper)
    label: Actual operating expenses of the vehicle
    type: NonNegDollars
    expr:
      op: input
      source: 'The total 2025 operating expenses of this vehicle: gasoline, oil, repairs, insurance, license plates and similar
        (not depreciation, not lease or rent payments, not interest, not parking and tolls)'
    cite:
      doc: i1040sc
      locator: p. 7, Line 9, If you deduct actual expenses, "Include on line 9 the business portion of expenses for gasoline,
        oil, repairs, insurance, license plates, etc."
  - id: scveh.operating_business
    printed: (helper)
    label: The business portion of the operating expenses
    type: NonNegDollars
    expr:
      op: prorate
      amount: scveh.operating
      part: scveh.bm_c
      whole: scveh.total_c
      places: 6
    cite:
      doc: i1040sc
      locator: p. 7, Line 9, "the business portion of expenses"
  - id: scveh.line9_actual
    printed: (helper)
    label: Business portion of the operating expenses plus parking fees and tolls
    type: NonNegDollars
    expr:
      op: sum
      of:
      - scveh.operating_business
      - scveh.parking
    cite:
      doc: i1040sc
      locator: p. 7, Line 9, If you deduct actual expenses
  - id: scveh.line9
    printed: '9'
    label: Car and truck expenses for this vehicle
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scveh.method
          - const: standard
        then: scveh.line9_standard
      - guard:
          op: test
          eq:
          - scveh.method
          - const: actual
        then: scveh.line9_actual
    cite:
      doc: i1040sc
      locator: pp. 6-7, Line 9
  - id: scveh.is_actual_owned
    printed: (helper)
    label: Owned and on actual expenses
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - scveh.method
        - const: actual
      - op: test
        eq:
        - scveh.owned
        - const: true
    cite:
      doc: i1040sc
      locator: p. 7, Line 9, "Show depreciation on line 13 and rent or lease payments on line 20a"
  - id: scveh.is_actual_leased
    printed: (helper)
    label: Leased and on actual expenses
    type: Bool
    expr:
      op: test
      all:
      - op: test
        eq:
        - scveh.method
        - const: actual
      - op: test
        eq:
        - scveh.owned
        - const: false
    cite:
      doc: i1040sc
      locator: p. 7, Line 9
  - id: scveh.lease
    printed: (helper)
    label: Lease payments for the vehicle
    type: NonNegDollars
    expr:
      op: input
      source: Your 2025 lease payments for this vehicle
    cite:
      doc: i1040sc
      locator: p. 8, Lines 20a and 20b, "enter on line 20a the business portion of your rental cost"
  - id: scveh.lease_business
    printed: (helper)
    label: The business portion of the lease payments
    type: NonNegDollars
    expr:
      op: prorate
      amount: scveh.lease
      part: scveh.bm_c
      whole: scveh.total_c
      places: 6
    cite:
      doc: i1040sc
      locator: p. 8, Lines 20a and 20b
  - id: scveh.line20a
    printed: 20a
    label: Rent or lease of this vehicle (business portion)
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scveh.is_actual_leased
          - const: true
        then: scveh.lease_business
      - guard:
          op: test
          eq:
          - scveh.is_actual_leased
          - const: false
        then: scveh.zero
    cite:
      doc: i1040sc
      locator: p. 8, Lines 20a and 20b
  - id: scveh.low_use
    printed: (gate)
    label: Business use is 50% or less
    type: Bool
    expr:
      op: test
      eq:
      - scveh.over_half
      - const: false
    cite:
      doc: i4562
      locator: p. 14, Lines 26 and 27
  - id: scveh.placed
    printed: (b)
    label: Year placed in service
    type: Enum(placed_year)
    expr:
      op: input
      source: The year you placed this vehicle in service in the business (2019 to 2025; a vehicle placed in service earlier
        is outside this tool)
    cite:
      doc: i4562
      locator: p. 14, Column (b)—Date placed in service
    refuses:
    - when: scveh.low_use
      form: Listed property used 50% or less in a qualified business use (Form 4562 line 27)
      remedy: A vehicle used 50% or less for business is depreciated under ADS and is outside this tool.
      cite:
        doc: i4562
        locator: p. 14, Lines 26 and 27; p. 15, Column (f)
  - id: scveh.screen
    printed: (screen)
    label: Does any of these apply to this vehicle?
    type: Bool
    expr:
      op: input
      source: 'Does any of these apply to this vehicle: you placed it in service before 2019; you claimed a special depreciation
        allowance for it in an earlier year; you used the standard mileage rate for it in an earlier year; you disposed of
        it in 2025; you acquired it in a trade-in or from a related person; its business use was 50% or less in any earlier
        year; it is an electric vehicle placed in service before 2007; you reduced its basis by a clean-fuel deduction or a vehicle credit; you converted it from personal use to business use during 2025; or you use it in your business of transporting persons or property for hire, or it is an ambulance
        or hearse?'
    cite:
      doc: i4562
      locator: pp. 13-15, Part V, Lines 26 and 27 and Limits for passenger automobiles (p. 14, "If during the tax year you convert
        property used solely for personal purposes to business/investment use"); p946 p. 63, Deductions for Passenger Automobiles
        Acquired in a Trade-In
  - id: scveh.screened
    printed: (gate)
    label: This vehicle's depreciation is outside this tool
    type: Bool
    expr:
      op: test
      eq:
      - scveh.screen
      - const: true
    cite:
      doc: i4562
      locator: pp. 13-15, Part V
  - id: scveh.cost
    printed: (d)
    label: Cost or other basis
    type: NonNegDollars
    expr:
      op: input
      source: The vehicle's cost (including sales tax) or other basis, not reduced by any section 179 deduction or depreciation
        (for a vehicle converted from personal use, the smaller of its adjusted basis or its fair market value on the date
        of conversion)
    cite:
      doc: i4562
      locator: p. 14, Column (d)—Cost or other basis
    refuses:
    - when: scveh.screened
      form: Vehicle depreciation outside this tool (placed in service before 2019, an earlier special allowance, an earlier
        standard mileage rate, a disposition, a trade-in, earlier business use of 50% or less, and the other items of the
        screen)
      remedy: This vehicle's depreciation is outside this tool.
      cite:
        doc: i4562
        locator: pp. 13-15, Part V
    - when: scveh.too_old
      form: Vehicle placed in service before 2019
      remedy: A vehicle placed in service before 2019 is outside this tool.
      cite:
        doc: p946
        locator: p. 61, Deductions After the Recovery Period
  - id: scveh.passenger
    printed: (helper)
    label: Subject to the limits for passenger automobiles
    type: Bool
    expr:
      op: input
      source: 'Is this a passenger automobile subject to the depreciation limits: a 4-wheeled vehicle made mainly for public
        roads rated at 6,000 pounds unloaded gross vehicle weight or less (for a truck or van, 6,000 pounds gross vehicle
        weight or less), and not a truck or van specially modified as a qualified nonpersonal use vehicle?'
    cite:
      doc: i4562
      locator: pp. 14–15, Limits for passenger automobiles, "Passenger automobiles are 4-wheeled vehicles ..." and Exception
  - id: scveh.suv
    printed: (helper)
    label: An SUV or similar vehicle rated 6,000 to 14,000 pounds
    type: Bool
    expr:
      op: input
      source: 'If it is not subject to those limits: is it a 4-wheeled vehicle mainly designed or used to carry passengers
        over public roads, rated at more than 6,000 and not more than 14,000 pounds gross vehicle weight, other than one seating
        more than nine behind the driver, one with a cargo area of at least 6 feet not readily accessible from the passenger
        compartment, or one with no seating behind the driver and no body section more than 30 inches ahead of the windshield?'
    cite:
      doc: i4562
      locator: p. 16, Column (i)—Elected section 179 cost, "You cannot elect to expense more than $31,300 of the cost of any
        SUVs and certain other vehicles"
  - id: scveh.year
    printed: (helper)
    label: Year of recovery in 2025
    type: Count
    expr:
      op: keyed_lookup
      table: recovery_year
      keys:
      - scveh.placed
    cite:
      doc: p946
      locator: p. 37, Using the MACRS Percentage Tables
  - id: scveh.is2025
    printed: (helper)
    label: Placed in service in 2025
    type: Bool
    expr:
      op: test
      eq:
      - scveh.placed
      - const: y2025
    cite:
      doc: i4562
      locator: p. 13, Line 25; p. 16, Column (i)
  - id: scveh.is2019
    printed: (helper)
    label: Placed in service in 2019 (2025 is after the recovery period)
    type: Bool
    expr:
      op: test
      eq:
      - scveh.placed
      - const: y2019
    cite:
      doc: p946
      locator: p. 61, Deductions After the Recovery Period
  - id: scveh.y5
    printed: (helper)
    label: Five-year property
    type: Enum(macrs_period)
    expr:
      op: param
      ref: sc.period_y5
    cite:
      doc: i4562
      locator: pp. 9-10, Lines 19a Through 19j, Column (a), "5-year property includes the following. Automobiles. Light general
        purpose trucks"
  - id: scveh.bus_cost
    printed: '13'
    label: Business/investment cost (cost times business use)
    type: NonNegDollars
    expr:
      op: prorate
      amount: scveh.cost
      part: scveh.bm_c
      whole: scveh.total_c
      places: 6
    cite:
      doc: p946
      locator: pp. 61-62, Depreciation Worksheet for Passenger Automobiles, line 13, "Multiply line 12 by line 8. This is
        your business/investment cost"
  - id: scveh.s179_elect
    printed: (i)
    label: Elected section 179 cost
    type: NonNegDollars
    expr:
      op: input
      source: The amount of this vehicle's cost you elect to expense under section 179 (zero if none)
    cite:
      doc: i4562
      locator: p. 16, Column (i)—Elected section 179 cost
  - id: scveh.suv_cap
    printed: (helper)
    label: SUV section 179 limit
    type: NonNegDollars
    expr:
      op: param
      ref: s179.suv_limit
    cite:
      doc: i4562
      locator: p. 16, Column (i), "$31,300"
  - id: scveh.s179_bad
    printed: (gate)
    label: The section 179 election is more than the business cost, or than the SUV limit
    type: Bool
    expr:
      op: test
      any:
      - op: test
        gt:
        - scveh.s179_elect
        - scveh.bus_cost
      - op: test
        all:
        - op: test
          eq:
          - scveh.passenger
          - const: false
        - op: test
          eq:
          - scveh.suv
          - const: true
        - op: test
          gt:
          - scveh.s179_elect
          - scveh.suv_cap
    cite:
      doc: i4562
      locator: p. 16, Column (i)
  - id: scveh.after_jan19
    printed: (helper)
    label: Acquired after January 19, 2025
    type: Bool
    expr:
      op: input
      source: Did you acquire this vehicle after January 19, 2025?
    cite:
      doc: i4562
      locator: p. 13, Line 25, "certain qualified property acquired after January 19, 2025"
  - id: scveh.bonus_choice
    printed: (helper)
    label: Special depreciation allowance for 5-year property
    type: Enum(bonus_choice)
    expr:
      op: input
      source: For 5-year property placed in service in 2025, did you claim the special depreciation allowance (full), elect
        the 40% allowance instead of 100% for property acquired after January 19, 2025 (forty), or elect not to claim any
        special allowance (none)?
    cite:
      doc: i4562
      locator: p. 13, Line 25; p. 7, Election out
  - id: scveh.bonus_same
    printed: (screen)
    label: Is the choice the same for all 5-year property placed in service in 2025?
    type: Bool
    expr:
      op: input
      source: Is that choice the same for all 5-year property (vehicles, computers and other 5-year property) that you (and
        your spouse, on a joint return) placed in service in 2025?
    cite:
      doc: i4562
      locator: p. 7, Election out
  - id: scveh.bonus_mixed
    printed: (gate)
    label: The special allowance choice differs within the 5-year class
    type: Bool
    expr:
      op: test
      eq:
      - scveh.bonus_same
      - const: false
    cite:
      doc: i4562
      locator: p. 7, Election out
  - id: scveh.claims_bonus
    printed: (helper)
    label: A special allowance is claimed
    type: Bool
    expr:
      op: test
      ne:
      - scveh.bonus_choice
      - const: none
    cite:
      doc: i4562
      locator: p. 13, Line 25
  - id: scveh.rate40
    printed: (helper)
    label: 40% special allowance
    type: Rate
    expr:
      op: param
      ref: sc.bonus_rate_40
    cite:
      doc: i4562
      locator: p. 5, Line 14
  - id: scveh.lim_first_bonus
    printed: (helper)
    label: First-year limit with the special allowance
    type: NonNegDollars
    expr:
      op: keyed_lookup
      table: auto_limit
      keys:
      - scveh.placed
      - scveh.year
    cite:
      doc: p946
      locator: p. 59, Maximum Depreciation Deduction, Passenger Automobiles (table)
  - id: scveh.lim_first_none
    printed: (helper)
    label: First-year limit without the special allowance
    type: NonNegDollars
    expr:
      op: keyed_lookup
      table: auto_limit_first_nobonus
      keys:
      - scveh.placed
    cite:
      doc: p946
      locator: p. 59, Maximum Depreciation Deduction, footnote 1, "the maximum depreciation deduction is $12,200"
  - id: scveh.lim_2025
    printed: (helper)
    label: Limit for a 2025 vehicle
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scveh.claims_bonus
          - const: true
        then: scveh.lim_first_bonus
      - guard:
          op: test
          eq:
          - scveh.claims_bonus
          - const: false
        then: scveh.lim_first_none
    cite:
      doc: i4562
      locator: p. 14, Limits for passenger automobiles; Table 2, "* If you take the special depreciation allowance ... the
        limit is $20,200"
  - id: scveh.lim_prior
    printed: (helper)
    label: Limit for the vehicle's 2025 year of recovery
    type: NonNegDollars
    expr:
      op: keyed_lookup
      table: auto_limit
      keys:
      - scveh.placed
      - scveh.year
    cite:
      doc: p946
      locator: p. 59, Maximum Depreciation Deduction, Passenger Automobiles (table)
  - id: scveh.line7
    printed: '7'
    label: Maximum depreciation deduction for this year from the appropriate table
    type: NonNegDollars
    expr:
      op: choose
      alternatives:
      - guard:
          op: test
          eq:
          - scveh.is2025
          - const: true
        then: scveh.lim_2025
      - guard:
          op: test
          eq:
          - scveh.is2025
          - const: false
        then: scveh.lim_prior
    cite:
      doc: p946
      locator: pp. 61-62, Depreciation Worksheet for Passenger Automobiles, line 7
  - id: scveh.line9w
