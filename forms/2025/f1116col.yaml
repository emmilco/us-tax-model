    - id: f1116col.line8u
      printed: (u)
      type: NonNegDollars
      label: Total foreign taxes paid or accrued (add cols. (q) through (t))
      expr:
        op: sum
        of:
          - f1116col.tax_div_if_div
          - f1116col.tax_int_if_int
      cite:
        doc: f1116
        locator: 'p. 1, Part II, "(u) Total foreign"'
    - id: f1116col.div_15
      printed: (helper)
      type: NonNegDollars
      label: Fifteen percent of the column's foreign dividends
      expr:
        op: multiply_rate
        amount: f1116col.div_income_if_div
        rate:
          param: f1116.withholding_split
      cite:
        doc: cfr-26-1-904-4
        locator: p. 4, (c)(3), "All passive income received during the taxable year that is subject to a withholding tax of fifteen
          percent or greater shall be treated as one item of income."; "All passive income received during the taxable year that
          is subject to a withholding tax of less than fifteen percent (but greater than zero) shall be treated as one item of
          income."
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116col.div_hi
      printed: (gate)
      type: Bool
      label: The column's foreign dividends are subject to foreign tax of 15 percent of them or more
      expr:
        op: test
        all:
        - op: test
          gt:
          - f1116col.tax_div_if_div
          - const: 0
        - op: test
          ge:
          - f1116col.tax_div_if_div
          - f1116col.div_15
      cite:
        doc: cfr-26-1-904-4
        locator: p. 4, (c)(3), "All passive income received during the taxable year that is subject to a withholding tax of fifteen
          percent or greater shall be treated as one item of income."; "All passive income received during the taxable year that
          is subject to a withholding tax of less than fifteen percent (but greater than zero) shall be treated as one item of
          income."
      ambiguity: amb.2025.f1116_high_taxed
    - id: f1116col.div_lo
