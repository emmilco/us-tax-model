# New York State tax rate schedule.
#
# Transcribed from the web edition of IT-201-I (the PDF's rows are flattened; sources/ny/2025/README.md).
# Each band: "over / but not over / The tax is: <base> plus <rate> of the excess over <over>"; the first band's
# base is 0 ("<rate> of line 38"). The product is rounded once to the whole dollar (decision C4,
# amb.ny.2025.whole_dollars); the printed bases are whole dollars, so base + rounded product is the rounding of
# the printed sum. Bands by filing-status group; a status reaches its group's section.

def:
  id: ny_rs
  kind: def
  title: 'New York State tax rate schedule'
  tax_year: 2025
  parameters: [amount, status]
  lines:
    - id: amount
      printed: "(line 38)"
      label: 'Taxable income (line 38)'
      type: NonNegDollars
      expr: { op: input, source: "Bound by the calling line (the taxable income whose tax is computed)." }
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "If line 38 is:"' }
    - id: status
      printed: "(status)"
      label: "Use the schedule for your filing status"
      type: Enum(filing_status)
      expr: { op: input, source: "Bound by the calling line (the federal filing status, IT-201 item A)." }
      cite: { doc: ny_it201i, locator: 'p. 4, Item A, "In most cases, you must use the same filing status you used on your federal return."' }
    - id: single.b1.excess
      printed: "(band 1)"
      label: "The amount over the band's lower bound (the excess over)"
      type: NonNegDollars
      expr: { op: subtract_floor0, from: "amount", take: { param: "ny.rs.single.b1.over" } }
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Single and married filing separately—filing status ① and ③", band 1' }
    - id: single.b1.product
      printed: "(band 1)"
      label: "Multiply the excess by the band's rate, rounded to the whole dollar"
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "single.b1.excess", rate: { param: "ny.rs.b1.rate" }, unit: 100 }
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Single and married filing separately—filing status ① and ③", band 1' }
      ambiguity: amb.ny.2025.whole_dollars
    - id: single.b1.base
      printed: "(band 1)"
      label: "The band's base amount"
      type: NonNegDollars
      expr: { op: param, ref: "ny.rs.single.b1.base" }
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Single and married filing separately—filing status ① and ③", band 1' }
    - id: single.b1.tax
      printed: "The tax is"
      label: "The base amount plus the rate times the excess"
      type: NonNegDollars
      expr: { op: sum, of: ["single.b1.base", "single.b1.product"] }
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Single and married filing separately—filing status ① and ③", band 1' }
    - id: single.b2.excess
