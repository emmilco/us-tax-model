      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Head of household—filing status ④", band 8' }
    - id: hoh.b9.excess
      printed: "(band 9)"
      label: "The amount over the band's lower bound (the excess over)"
      type: NonNegDollars
      expr: { op: subtract_floor0, from: "amount", take: { param: "ny.rs.hoh.b9.over" } }
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Head of household—filing status ④", band 9' }
    - id: hoh.b9.product
      printed: "(band 9)"
      label: "Multiply the excess by the band's rate, rounded to the whole dollar"
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "hoh.b9.excess", rate: { param: "ny.rs.b9.rate" }, unit: 100 }
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Head of household—filing status ④", band 9' }
      ambiguity: amb.ny.2025.whole_dollars
    - id: hoh.b9.base
      printed: "(band 9)"
      label: "The band's base amount"
      type: NonNegDollars
      expr: { op: param, ref: "ny.rs.hoh.b9.base" }
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Head of household—filing status ④", band 9' }
    - id: hoh.b9.tax
      printed: "The tax is"
      label: "The base amount plus the rate times the excess"
      type: NonNegDollars
      expr: { op: sum, of: ["hoh.b9.base", "hoh.b9.product"] }
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Head of household—filing status ④", band 9' }
    - id: hoh.result
      printed: "The tax is"
      label: 'Head of household—filing status ④: the tax for the band that holds the amount'
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard: { op: test, all: [{ op: test, ge: ["amount", { const: 0 }] }, { op: test, le: ["amount", { param: "ny.rs.hoh.b1.upper" }] }] }
            then: "hoh.b1.tax"
          - guard: { op: test, all: [{ op: test, gt: ["amount", { param: "ny.rs.hoh.b1.upper" }] }, { op: test, le: ["amount", { param: "ny.rs.hoh.b2.upper" }] }] }
            then: "hoh.b2.tax"
          - guard: { op: test, all: [{ op: test, gt: ["amount", { param: "ny.rs.hoh.b2.upper" }] }, { op: test, le: ["amount", { param: "ny.rs.hoh.b3.upper" }] }] }
            then: "hoh.b3.tax"
          - guard: { op: test, all: [{ op: test, gt: ["amount", { param: "ny.rs.hoh.b3.upper" }] }, { op: test, le: ["amount", { param: "ny.rs.hoh.b4.upper" }] }] }
            then: "hoh.b4.tax"
          - guard: { op: test, all: [{ op: test, gt: ["amount", { param: "ny.rs.hoh.b4.upper" }] }, { op: test, le: ["amount", { param: "ny.rs.hoh.b5.upper" }] }] }
            then: "hoh.b5.tax"
          - guard: { op: test, all: [{ op: test, gt: ["amount", { param: "ny.rs.hoh.b5.upper" }] }, { op: test, le: ["amount", { param: "ny.rs.hoh.b6.upper" }] }] }
            then: "hoh.b6.tax"
          - guard: { op: test, all: [{ op: test, gt: ["amount", { param: "ny.rs.hoh.b6.upper" }] }, { op: test, le: ["amount", { param: "ny.rs.hoh.b7.upper" }] }] }
            then: "hoh.b7.tax"
          - guard: { op: test, all: [{ op: test, gt: ["amount", { param: "ny.rs.hoh.b7.upper" }] }, { op: test, le: ["amount", { param: "ny.rs.hoh.b8.upper" }] }] }
            then: "hoh.b8.tax"
          - guard: { op: test, gt: ["amount", { param: "ny.rs.hoh.b8.upper" }] }
            then: "hoh.b9.tax"
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Head of household—filing status ④", "If line 38 is:", "over", "but not over"' }
    - id: tax
      printed: "The tax is"
      label: "The tax from the schedule for the filing status"
      type: NonNegDollars
      expr:
        op: choose
        alternatives:
          - guard: { op: test, eq: ["status", { const: "single" }] }
            then: "single.result"
          - guard: { op: test, eq: ["status", { const: "mfj" }] }
            then: "mfj.result"
          - guard: { op: test, eq: ["status", { const: "qss" }] }
            then: "mfj.result"
          - guard: { op: test, eq: ["status", { const: "mfs" }] }
            then: "single.result"
          - guard: { op: test, eq: ["status", { const: "hoh" }] }
            then: "hoh.result"
      cite: { doc: ny_it201i-html, locator: 'New York State tax rate schedule, "Married filing jointly and qualifying surviving spouse—filing status ② and ⑤", "Single and married filing separately—filing status ① and ③", "Head of household—filing status ④"' }
