      cite: { doc: ny_it201i, locator: 'p. 18, Sales and use tax chart, "200,001 and greater", "0.0175% (0.000175)"' }
      ambiguity: amb.ny.2025.whole_dollars
    - id: ny_it201.sut.cap
      printed: '(chart)'
      label: '$125'
      type: NonNegDollars
      expr: { op: param, ref: "ny.sut.cap" }
