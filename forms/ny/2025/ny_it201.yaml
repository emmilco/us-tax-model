      cite: { doc: ny_it201i, locator: 'p. 5, Item C, "If you can be claimed as a dependent on another taxpayer’s federal return, you must mark an X in the Yes box."' }
      ambiguity: amb.ny.2025.item_c
    - id: ny_it201.item_h_count
      printed: 'H (count)'
      label: 'Number of dependents listed in item H'
      type: Count
      expr: 
        op: sum_over
        collection: dependent
        field: dependent.one
        where: { op: test, eq: ["dependent.claimed", { const: true }] }
      cite: { doc: ny_it201i, locator: 'p. 6, Item H, "Enter the required information for each dependent you claimed on federal Form 1040. Also enter the required information for any dependent you were entitled to claim on your federal return but chose not to"' }
    - id: ny_it201.line1
      printed: '1'
      label: 'Wages, salaries, tips, etc.'
      type: NonNegDollars
      expr: { op: round, of: "f1040.line1z", unit: 100, rule: half_up }
      cite: { doc: ny_it201, locator: 'p. 2, Federal income and adjustments, "Wages, salaries, tips, etc."' }
      ambiguity: amb.ny.2025.whole_dollars
      refuses:
        - when: ny_it201.gate.part_year_state
          form: 'Form IT-203, Nonresident and Part-Year Resident Income Tax Return'
          remedy: 'This tool prepares Form IT-201 for a full-year New York State and New York City resident only; a nonresident or part-year resident files Form IT-203.'
          cite: { doc: ny_it201i, locator: 'p. 3, New York nonresidents and part-year residents, "you must file Form IT-203, Nonresident and Part-Year Resident Income Tax Return"' }
        - when: ny_it201.gate.part_year_city
          form: 'Form IT-360.1, Change of City Resident Status'
          remedy: 'This tool computes the New York City resident tax for a full-year City resident only.'
          cite: { doc: ny_it201i, locator: 'p. 14, Line 50: Part-year New York City resident tax, "complete Form IT-360.1, Change of City Resident Status"' }
        - when: ny_it201.gate.spouse_nonresident
          form: 'Separate New York returns, or a joint return taxing both as residents'
          remedy: 'When one spouse was not a full-year New York State and City resident, New York requires separate returns or a joint return as if both were residents; this tool does neither.'
          cite: { doc: ny_it201i, locator: 'p. 3, Separate returns are required for some married taxpayers who file a joint federal return, "If one of you was a New York State resident and the other was a nonresident or part-year resident, you must each file a separate New York return."' }
        - when: ny_it201.gate.special_accrual
          form: 'Form IT-225 (special accrual modifications A-115 and S-129)'
          remedy: 'The special accrual rules for a change of residence are outside this tool.'
          cite: { doc: ny_it201i, locator: 'p. 31, Special accruals, "see the instructions for Form IT-225, addition modification number A-115 and subtraction modification number S-129"' }
        - when: ny_it201.gate.yonkers
          form: 'Yonkers lines 55 to 57 (Form Y-203 or IT-360.1)'
          remedy: 'Yonkers resident surcharge and nonresident earnings tax are outside this tool.'
          cite: { doc: ny_it201i, locator: 'p. 5, Item D2, "you may be considered a resident or part-year resident for Yonkers income tax purposes"' }
        - when: ny_it201.gate.special_code
          form: 'Item G special condition codes'
          remedy: 'A special condition (for example Build America Bond interest, which changes the household credit income) is outside this tool.'
          cite: { doc: ny_it201i, locator: 'p. 13, Note 1, "if on Form IT-201 you entered special condition code A6 (for Build America Bond interest), your federal adjusted gross income is the line 19 amount minus any Build America Bond interest"' }
        - when: ny_it201.gate.decedent
          form: 'A deceased taxpayer''s return'
          remedy: 'Returns for a taxpayer who died are outside this tool.'
          cite: { doc: ny_it201i, locator: 'p. 31, Deceased taxpayers, "the taxpayer’s spouse or personal representative may have to file and sign a return for that taxpayer"' }
