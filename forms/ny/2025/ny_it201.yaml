# Form IT-201 (2025), Resident Income Tax Return, for a full-year New York City resident on the New York standard
# deduction (docs/ny/2026-11-04_ny_cloud_brief.md; premise map research/premises/ny-it201-nyc-resident.md and its
# verification; the owner's decisions docs/ny/DECISIONS.md, B1 to B11 and C1 to C8). Lines in printed order, each
# preceded by the questions, gates and helpers it reads. Lines 1 to 18 take the federal lines (C3) rounded to the
# whole dollar (C4); every line the target never fills is zero, refused by its own screen where it could apply.
# Generated from a script kept out of the repository; edit this file directly from now on.

