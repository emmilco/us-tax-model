        - when: ny_it201.gate.itemize
          form: 'Form IT-196, New York Resident, Nonresident, and Part-Year Resident Itemized Deductions'
          remedy: 'This tool takes the New York standard deduction only.'
          cite: { doc: ny_it201i, locator: 'p. 11, Notes, "If you choose the itemized deduction, you must submit Form IT-196 with your return."' }
