    - id: ny_it201.dependent_single
      printed: '(gate)'
      label: 'Single and item C Yes'
      type: Bool
      expr: { op: test, all: [{ op: test, eq: ["f1040.status", { const: single }] }, { op: test, eq: ["ny_it201.item_c", { const: true }] }] }
      cite: { doc: ny_it201i-html, locator: 'New York State standard deduction table, "① Single and you marked item C Yes", "$3,100"' }
