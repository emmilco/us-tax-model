      cite: { doc: ny_it201, locator: 'p. 4, Payments and refundable credits, "NYS noncustodial parent EIC"' }
      refuses:
        - when: ny_it201.gate.noncustodial
          form: 'Form IT-209, Claim for Noncustodial Parent New York State Earned Income Credit'
          remedy: 'This credit is not computed by this tool.'
          cite: { doc: ny_it201i, locator: 'p. 19, Line 66, "complete Form IT-209 and transfer the credit amount to the appropriate line of Form IT-201"' }
    - id: ny_it201.gate.real_property
      printed: '(gate)'
      label: 'The real property tax credit may apply'
      type: Bool
      expr: { op: test, eq: ["ny_it201.ask.real_property_credit", { const: true }] }
      cite: { doc: ny_it201i, locator: 'p. 19, Line 67, "If you qualify, complete Form IT-214 and transfer the amount from Form IT-214 to Form IT-201, line 67."' }
    - id: ny_it201.line67
      printed: '67'
      label: 'Real property tax credit'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201, locator: 'p. 4, Payments and refundable credits, "Real property tax credit"' }
      refuses:
        - when: ny_it201.gate.real_property
          form: 'Form IT-214, Claim for Real Property Tax Credit for Homeowners and Renters'
          remedy: 'This credit is not computed by this tool.'
          cite: { doc: ny_it201i, locator: 'p. 19, Line 67, "complete Form IT-214"' }
    - id: ny_it201.gate.college_tuition
      printed: '(gate)'
      label: 'College tuition paid'
      type: Bool
      expr: { op: test, eq: ["ny_it201.ask.college_tuition", { const: true }] }
      cite: { doc: ny_it201i, locator: 'p. 19, Line 68, "Did you or your spouse or any dependents pay college tuition expenses during 2025?"' }
    - id: ny_it201.line68
      printed: '68'
      label: 'College tuition credit'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201, locator: 'p. 4, Payments and refundable credits, "College tuition credit"' }
      refuses:
        - when: ny_it201.gate.college_tuition
          form: 'Form IT-272, Claim for College Tuition Credit or Itemized Deduction'
          remedy: 'The college tuition credit is not computed by this tool.'
          cite: { doc: ny_it201i, locator: 'p. 19, Line 68, "complete Form IT-272, Claim for"' }
    - id: ny_it201.stc_income
      printed: '(69)'
      label: 'Income for the school tax credit: federal AGI (line 19) minus IRA distributions included in it (line 9)'
      type: Dollars
      expr: { op: subtract, from: "ny_it201.line19", take: "ny_it201.line9" }
      cite: { doc: ny_it201i, locator: 'p. 20, Line 69, "Income, for purposes of determining your New York City school tax credit, means your federal adjusted gross income from Form IT-201, line 19, minus distributions from an individual retirement account and an individual retirement annuity, from Form IT-201, line 9, if they were included in your federal adjusted gross income."' }
    - id: ny_it201.stc_fixed_eligible
      printed: '(gate)'
      label: 'Item C No and income of $250,000 or less'
      type: Bool
      expr: { op: test, all: [{ op: test, eq: ["ny_it201.item_c", { const: false }] }, { op: test, le: ["ny_it201.stc_income", { param: "ny.stc.fixed.limit" }] }] }
      cite: { doc: ny_it201i, locator: 'p. 20, Line 69, "or your income (see below) is more than $250,000, you do not qualify for this credit"' }
    - id: ny_it201.stc_fixed_amount
      printed: '(69)'
      label: 'Table 1 - Full-year New York City residents: the credit for the filing status'
      type: NonNegDollars
      expr: { op: param, ref: "ny.stc.fixed" }
      cite: { doc: ny_it201i-html, locator: 'Table 1 - Full-year New York City residents, "$63", "$125"' }
    - id: ny_it201.line69
      printed: '69'
      label: 'NYC school tax credit (fixed amount)'
      type: NonNegDollars
      expr: 
        op: choose
        alternatives:
          - guard: { op: test, eq: ["ny_it201.stc_fixed_eligible", { const: true }] }
            then: "ny_it201.stc_fixed_amount"
          - guard: { op: test, eq: ["ny_it201.stc_fixed_eligible", { const: false }] }
            then: "ny_it201.zero_stc"
      cite: { doc: ny_it201i, locator: 'p. 20, Line 69, "determine your credit using Table 1 below if you were a full-year resident"' }
    - id: ny_it201.zero_stc
      printed: '(helper)'
      label: 'No school tax credit'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201i, locator: 'p. 20, Line 69, "you do not qualify for this credit"' }
    - id: ny_it201.gate.stc_rr_income
      printed: '(gate)'
      label: 'Line 69a: income or New York City taxable income more than $500,000'
      type: Bool
      expr: { op: test, all: [{ op: test, eq: ["ny_it201.item_c", { const: false }] }, { op: test, any: [{ op: test, gt: ["ny_it201.stc_income", { param: "ny.stc.rr.limit" }] }, { op: test, gt: ["ny_it201.line47", { param: "ny.stc.rr.limit" }] }] }] }
      cite: { doc: ny_it201i, locator: 'p. 20, Line 69a, "or your income (see below) is more than $500,000, you do not qualify to claim this credit"' }
    - id: ny_it201.stc_rr_low
      printed: '(69a)'
      label: '0.171% of taxable income'
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "ny_it201.line47", rate: { param: "ny.stc.rr.low_rate" }, unit: 100 }
      cite: { doc: ny_it201i-html, locator: 'Calculation of NYC school tax credit (rate reduction amount) for single ① and married filing separately ③, "0.171% of taxable income"' }
      ambiguity: amb.ny.2025.whole_dollars
    - id: ny_it201.stc_rr_excess
      printed: '(69a)'
      label: 'The excess of New York City taxable income over the bracket amount'
      type: NonNegDollars
      expr: { op: subtract_floor0, from: "ny_it201.line47", take: { param: "ny.stc.rr.over" } }
      cite: { doc: ny_it201i-html, locator: 'Calculation of NYC school tax credit (rate reduction amount) for single ① and married filing separately ③, "plus 0.228% of the excess over $12,000"' }
    - id: ny_it201.stc_rr_excess_product
      printed: '(69a)'
      label: '0.228% of the excess'
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "ny_it201.stc_rr_excess", rate: { param: "ny.stc.rr.high_rate" }, unit: 100 }
      cite: { doc: ny_it201i-html, locator: 'Calculation of NYC school tax credit (rate reduction amount) for married filing jointly ② and qualifying surviving spouse ⑤, "plus 0.228% of the excess over $21,600"' }
      ambiguity: amb.ny.2025.whole_dollars
    - id: ny_it201.stc_rr_base
      printed: '(69a)'
      label: 'The bracket''s base amount ($21, $37 or $25)'
      type: NonNegDollars
      expr: { op: param, ref: "ny.stc.rr.base" }
      cite: { doc: ny_it201i-html, locator: 'Calculation of NYC school tax credit (rate reduction amount) for head of household ④, "$25"' }
    - id: ny_it201.stc_rr_high
      printed: '(69a)'
      label: 'The base amount plus 0.228% of the excess'
      type: NonNegDollars
      expr: { op: sum, of: ["ny_it201.stc_rr_base", "ny_it201.stc_rr_excess_product"] }
      cite: { doc: ny_it201i-html, locator: 'Calculation of NYC school tax credit (rate reduction amount) for head of household ④, "plus 0.228% of the excess over $14,400"' }
    - id: ny_it201.stc_rr_low_band
      printed: '(gate)'
      label: 'Is New York City taxable income not over the bracket amount ($12,000, $21,600 or $14,400)?'
      type: Bool
      expr: { op: test, le: ["ny_it201.line47", { param: "ny.stc.rr.over" }] }
      cite: { doc: ny_it201i-html, locator: 'Calculation of NYC school tax credit (rate reduction amount) for single ① and married filing separately ③, "If city taxable income is:"' }
    - id: ny_it201.stc_rr
      printed: '(69a)'
      label: 'The rate reduction amount from the table for the filing status'
      type: NonNegDollars
      expr: 
        op: choose
        alternatives:
          - guard: { op: test, eq: ["ny_it201.stc_rr_low_band", { const: true }] }
            then: "ny_it201.stc_rr_low"
          - guard: { op: test, eq: ["ny_it201.stc_rr_low_band", { const: false }] }
            then: "ny_it201.stc_rr_high"
      cite: { doc: ny_it201i-html, locator: 'Calculation of NYC school tax credit (rate reduction amount) for married filing jointly ② and qualifying surviving spouse ⑤, "If city taxable income is:"' }
    - id: ny_it201.line69a
      printed: '69a'
      label: 'NYC school tax credit (rate reduction amount)'
      type: NonNegDollars
      expr: 
        op: choose
        alternatives:
          - guard: { op: test, eq: ["ny_it201.item_c", { const: true }] }
            then: "ny_it201.zero_stc"
          - guard: { op: test, eq: ["ny_it201.item_c", { const: false }] }
            then: "ny_it201.stc_rr"
      cite: { doc: ny_it201i, locator: 'p. 21, Line 69a, "If you were a city resident for all of 2025, use the amount from Form IT-201, line 47."' }
      ambiguity: amb.ny.2025.school_credit_income
      refuses:
        - when: ny_it201.gate.stc_rr_income
          form: 'Form IT-201 line 69a above $500,000'
          remedy: 'Whether the $500,000 limit applies to income or to New York City taxable income is unsettled; this tool refuses either above it (decision B7).'
          cite: { doc: ny_it201i, locator: 'p. 20, Line 69a, "or your income (see below) is more than $500,000, you do not qualify to claim this credit"' }
    - id: ny_it201.line70
      printed: '70'
      label: 'NYC earned income credit'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201, locator: 'p. 4, Payments and refundable credits, "NYC earned income credit"' }
      ambiguity: amb.ny.2025.eic_could_claim
      refuses:
        - when: ny_it201.gate.eic
          form: 'Form IT-215, Claim for Earned Income Credit'
          remedy: 'The New York City earned income credit is not computed by this tool (decision B9).'
          cite: { doc: ny_it201i, locator: 'p. 21, Line 70, "If you qualify, complete either Form IT-215 or Form IT-209"' }
    - id: ny_it201.gate.it270
      printed: '(gate)'
      label: 'Dependents claimed and federal AGI within $5,000 of the highest NYC income tax elimination credit threshold'
      type: Bool
      expr: { op: test, all: [{ op: test, gt: ["ny_it201.item_h_count", { const: 0, type: Count }] }, { op: test, le: ["ny_it201.line19", { param: "ny.it270.max_threshold_plus" }] }] }
      cite: { doc: ny_it270i, locator: 'p. 1, General information, "you claimed one or more dependents on Form IT-201, item H or Form IT-203, item I,"' }
    - id: ny_it201.line70a
      printed: '70a'
      label: 'NYC income tax elimination credit'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201, locator: 'p. 4, Payments and refundable credits, "NYC income tax elimination credit"' }
      refuses:
        - when: ny_it201.gate.it270
          form: 'Form IT-270, New York City Income Tax Elimination Credit'
          remedy: 'This credit is not computed by this tool (decision B10); with no dependent on item H it does not apply.'
          cite: { doc: ny_it201i, locator: 'p. 21, Line 70a: New York City income tax elimination credit, "Review the instructions for Form IT-270, New York City Income Tax Elimination Credit, to see if you qualify for this credit."' }
    - id: ny_it201.line71
      printed: '71'
      label: 'Other refundable credits (Form IT-201-ATT, line 18)'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201, locator: 'p. 4, Payments and refundable credits, "Other refundable credits (Form IT-201-ATT, line 18)"' }
      refuses:
        - when: ny_it201.gate.other_credits
          form: 'Form IT-201-ATT, Section D'
          remedy: 'Other refundable credits are not computed by this tool.'
          cite: { doc: ny_it201i, locator: 'p. 21, Line 71, "Enter the total amount of other refundable credits from Form IT-201-ATT, Part 1, Section D, line 18."' }
    - id: ny_it201.gate.other_withholding
      printed: '(gate)'
      label: 'New York withholding on a form other than Form W-2'
      type: Bool
      expr: { op: test, eq: ["ny_it201.ask.other_withholding", { const: true }] }
      cite: { doc: ny_it201i, locator: 'p. 21, Lines 72, 73, and 74, "Form IT-1099-R, Summary of Federal Form 1099-R Statements"' }
    - id: ny_it201.line72
      printed: '72'
      label: 'Total New York State tax withheld'
      type: NonNegDollars
      expr: { op: sum_over, collection: ny_it2, field: ny_it2.state_withheld }
      cite: { doc: ny_it201i, locator: 'p. 21, Lines 72, 73, and 74: Total New York State, New York City, and Yonkers tax withheld, "Complete Form IT-2, Summary of W-2 Statements, for all federal Forms W-2 (or W-2c) you received."' }
      refuses:
        - when: ny_it201.gate.other_withholding
          form: 'Form IT-1099-R (and New York withholding on Forms 1099-G and W-2G)'
          remedy: 'New York withholding on forms other than Form W-2 is outside this tool (decision B2).'
          cite: { doc: ny_it201i, locator: 'p. 21, Lines 72, 73, and 74, "If you had New York State, New York City, or Yonkers tax withheld from annuities, pensions, retirement pay, or IRA payments, you must complete Form IT-1099-R"' }
    - id: ny_it201.line73
      printed: '73'
      label: 'Total New York City tax withheld'
      type: NonNegDollars
      expr: { op: sum_over, collection: ny_it2, field: ny_it2.city_withheld }
      cite: { doc: ny_it201i, locator: 'p. 21, Lines 72, 73, and 74: Total New York State, New York City, and Yonkers tax withheld, "Enter on the appropriate line your total New York State, New York City, and Yonkers tax withheld from any of the following:"' }
      refuses:
        - when: ny_it201.gate.other_withholding
          form: 'Form IT-1099-R (and New York withholding on Forms 1099-G and W-2G)'
          remedy: 'New York withholding on forms other than Form W-2 is outside this tool (decision B2).'
          cite: { doc: ny_it201i, locator: 'p. 21, Lines 72, 73, and 74, "you must complete Form IT-1099-R, Summary of Federal Form 1099-R Statements"' }
    - id: ny_it201.line74
      printed: '74'
      label: 'Total Yonkers tax withheld'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201, locator: 'p. 4, Payments and refundable credits, "Total Yonkers tax withheld"' }
      note: 'Zero: Yonkers is refused (line 1, item D2), and a W-2 record with Yonkers withholding is refused (ny_it2).'
    - id: ny_it201.line75
      printed: '75'
      label: 'Total estimated tax payments and amount paid with Form IT-370'
      type: NonNegDollars
      expr: { op: input, source: 'Your 2025 New York State and City estimated tax payments (including the last installment even if paid in 2026), any 2024 overpayment applied to 2025 estimated tax, and any amount paid with Form IT-370' }
      cite: { doc: ny_it201i, locator: 'p. 22, Line 75: Total estimated tax payments and amount paid with Form IT-370, "your 2025 estimated tax payments for New York State, New York City, Yonkers, and metropolitan commuter transportation mobility tax"' }
    - id: ny_it201.line76
      printed: '76'
      label: 'Total payments (add lines 63 through 75)'
      type: NonNegDollars
      expr: { op: sum, of: ["ny_it201.line63", "ny_it201.line64", "ny_it201.line65", "ny_it201.line66", "ny_it201.line67", "ny_it201.line68", "ny_it201.line69", "ny_it201.line69a", "ny_it201.line70", "ny_it201.line70a", "ny_it201.line71", "ny_it201.line72", "ny_it201.line73", "ny_it201.line74", "ny_it201.line75"] }
      cite: { doc: ny_it201, locator: 'p. 4, Payments and refundable credits, "Total payments (add lines 63 through 75)"' }
    - id: ny_it201.tax_due
      printed: '(80)'
      label: 'If line 76 is less than line 62, subtract line 76 from line 62'
      type: NonNegDollars
      expr: { op: subtract_floor0, from: "ny_it201.line62", take: "ny_it201.line76" }
      cite: { doc: ny_it201, locator: 'p. 4, Your refund, amount you owe, and account information, "subtract line 76 from line 62"' }
    - id: ny_it201.prepayments
      printed: '(81)'
      label: 'Your 2025 prepayments: New York tax withheld and estimated tax payments (lines 72 to 75)'
      type: NonNegDollars
      expr: { op: sum, of: ["ny_it201.line72", "ny_it201.line73", "ny_it201.line74", "ny_it201.line75"] }
      cite: { doc: ny_it201i, locator: 'p. 23, Line 81, "the total amount of your 2025 prepayments (the amount of withholding and estimated tax payments you have already made or which were paid on your behalf by a partnership or S corporation for 2025)"' }
    - id: ny_it201.safe_harbor_100
      printed: '(81)'
      label: '100% of your 2024 New York income tax'
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "ny_it201.ask.prior_year_tax", rate: { param: "ny.est.prior_rate" }, unit: 100 }
      cite: { doc: ny_it201i, locator: 'p. 23, Line 81, "In general, you are not subject to a penalty if your 2025 prepayments equal at least 100% of your 2024 New York income tax based on a 12-month return."' }
    - id: ny_it201.safe_harbor_110
      printed: '(81)'
      label: '110% of your 2024 New York income tax'
      type: NonNegDollars
      expr: { op: multiply_rate, amount: "ny_it201.ask.prior_year_tax", rate: { param: "ny.est.prior_rate_high" }, unit: 100 }
      cite: { doc: ny_it201i, locator: 'p. 23, Line 81, "your 2025 prepayments must equal at least 110% of your 2024 New York income tax based on a 12-month return"' }
    - id: ny_it201.safe_harbor
      printed: '(81)'
      label: 'The prepayments required to be safe from the estimated tax penalty'
      type: NonNegDollars
      expr: 
        op: choose
        alternatives:
          - guard: { op: test, eq: ["ny_it201.ask.prior_agi_high", { const: false }] }
            then: "ny_it201.safe_harbor_100"
          - guard: { op: test, eq: ["ny_it201.ask.prior_agi_high", { const: true }] }
            then: "ny_it201.safe_harbor_110"
      cite: { doc: ny_it201i, locator: 'p. 23, Line 81, "However, if your 2024 New York adjusted gross income was more than $150,000 (or $75,000 if you are married filing separately for 2025) and you are not a farmer or a fisherman, your 2025 prepayments must equal at least 110% of your 2024 New York income tax based on a 12-month return."' }
      note: 'The farmer or fisherman exception is not asked; for one the 110% amount is required, which can only refuse more often.'
    - id: ny_it201.gate.estimated_penalty
      printed: '(gate)'
      label: 'A balance due with prepayments below the safe harbor (an estimated tax penalty may be owed)'
      type: Bool
      expr: { op: test, all: [{ op: test, gt: ["ny_it201.tax_due", { const: 0 }] }, { op: test, lt: ["ny_it201.prepayments", "ny_it201.safe_harbor"] }] }
      cite: { doc: ny_it201i, locator: 'p. 23, Line 81: Penalty for underpaying your tax (estimated tax penalty), "You may owe an estimated tax penalty if you did not have enough tax withheld from your wages or did not make enough estimated tax payments on other income you earned during the year."' }
    - id: ny_it201.line81
      printed: '81'
      label: 'Estimated tax penalty (include this amount in line 80 or reduce the overpayment on line 77)'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201, locator: 'p. 4, Your refund, amount you owe, and account information, "Estimated tax penalty"' }
      refuses:
        - when: ny_it201.gate.estimated_penalty
          form: 'Form IT-2105.9, Underpayment of Estimated Tax by Individuals and Fiduciaries'
          remedy: 'With a balance due and prepayments below 100% (110% above $150,000 of 2024 New York AGI) of your 2024 New York tax, an estimated tax penalty may be owed; this tool does not compute it (decision B6).'
          cite: { doc: ny_it201i, locator: 'p. 23, Line 81, "For more information, see Form IT-2105.9, Underpayment of Estimated Tax by Individuals and Fiduciaries, and its instructions."' }
    - id: ny_it201.gate.late
      printed: '(gate)'
      label: 'Late filing or payment penalties or interest'
      type: Bool
      expr: { op: test, eq: ["ny_it201.ask.late_penalty", { const: true }] }
      cite: { doc: ny_it201i, locator: 'p. 24, Line 82, "If you owe a late filing penalty, late payment penalty, or interest:"' }
    - id: ny_it201.line82
      printed: '82'
      label: 'Other penalties and interest'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201, locator: 'p. 4, Your refund, amount you owe, and account information, "Other penalties and interest"' }
      refuses:
        - when: ny_it201.gate.late
          form: 'Form IT-201 line 82 (late filing or payment penalties and interest)'
          remedy: 'Late penalties and interest are outside this tool (decision B11).'
          cite: { doc: ny_it201i, locator: 'p. 24, Line 82, "Calculate the penalty and interest using the Penalty and Interest Calculator"' }
    - id: ny_it201.overpaid_before_penalty
      printed: '(77)'
      label: 'If line 76 is more than line 62, subtract line 62 from line 76'
      type: NonNegDollars
      expr: { op: subtract_floor0, from: "ny_it201.line76", take: "ny_it201.line62" }
      cite: { doc: ny_it201, locator: 'p. 4, Your refund, amount you owe, and account information, "Amount overpaid (if line 76 is more than line 62, subtract line 62 from line 76)"' }
    - id: ny_it201.line77
      printed: '77'
      label: 'Amount overpaid'
      type: NonNegDollars
      expr: { op: subtract_floor0, from: "ny_it201.overpaid_before_penalty", take: "ny_it201.line81" }
      cite: { doc: ny_it201i, locator: 'p. 22, Line 77: Amount overpaid, "If you have to pay an estimated tax penalty (see line 81 instructions), subtract the penalty from the overpayment and enter the net overpayment on line 77."' }
    - id: ny_it201.line79
      printed: '79'
      label: 'Amount of line 77 that you want applied to your 2026 estimated tax'
      type: NonNegDollars
      expr: { op: input, source: 'How much of your overpayment (line 77) do you want applied to your 2026 New York estimated tax? (0 for none)' }
      cite: { doc: ny_it201i, locator: 'p. 23, Line 79: Estimated tax, "Enter the amount of overpayment from line 77 that you want applied to your New York State, New York City, Yonkers, and metropolitan commuter transportation mobility tax estimated tax for 2026."' }
    - id: ny_it201.gate.line79_over
      printed: '(gate)'
      label: 'Line 79 is more than line 77'
      type: Bool
      expr: { op: test, gt: ["ny_it201.line79", "ny_it201.line77"] }
      cite: { doc: ny_it201i, locator: 'p. 23, Line 79: Estimated tax, "The total of lines 78a through 79 should equal the amount on line 77."' }
    - id: ny_it201.line78
      printed: '78'
      label: 'Amount of line 77 available for refund (subtract line 79 from line 77)'
      type: NonNegDollars
      expr: { op: subtract_floor0, from: "ny_it201.line77", take: "ny_it201.line79" }
      cite: { doc: ny_it201i, locator: 'p. 23, Line 78: Amount of line 77 available for refund, "Subtract the amount on line 79 (estimated tax) from line 77."' }
      refuses:
        - when: ny_it201.gate.line79_over
          form: 'Line 79 more than the overpayment'
          remedy: 'The amount applied to 2026 estimated tax cannot be more than the overpayment on line 77; correct line 79.'
          cite: { doc: ny_it201i, locator: 'p. 23, Line 79: Estimated tax, "The total of lines 78a through 79 should equal the amount on line 77."' }
    - id: ny_it201.gate.refund_529
      printed: '(gate)'
      label: 'A refund deposit into a New York 529 account'
      type: Bool
      expr: { op: test, eq: ["ny_it201.ask.refund_529", { const: true }] }
      cite: { doc: ny_it201i, locator: 'p. 23, Line 78a: NYS 529 account deposit, "You may directly deposit all or a portion of your refund in up to three NYS 529 college savings accounts."' }
    - id: ny_it201.line78a
      printed: '78a'
      label: 'Amount of line 78 that you want to deposit into a NYS 529 account (Form IT-195, line 4)'
      type: NonNegDollars
      expr: { op: param, ref: "ny.zero" }
      cite: { doc: ny_it201, locator: 'p. 4, Your refund, amount you owe, and account information, "Amount of line 78 that you want to deposit into a NYS 529 account"' }
      refuses:
        - when: ny_it201.gate.refund_529
          form: 'Form IT-195, Allocation of Refund'
          remedy: 'Depositing a refund into a 529 account is outside this tool (decision B11).'
          cite: { doc: ny_it201i, locator: 'p. 23, Line 78a: NYS 529 account deposit, "Use Form IT-195, Allocation of Refund"' }
    - id: ny_it201.line78b
      printed: '78b'
      label: 'Total refund after NYS 529 account deposit (subtract line 78a from line 78)'
      type: NonNegDollars
      expr: { op: subtract_floor0, from: "ny_it201.line78", take: "ny_it201.line78a" }
      cite: { doc: ny_it201, locator: 'p. 4, Your refund, amount you owe, and account information, "Total refund after NYS 529 account deposit (subtract line 78a from line 78)"' }
    - id: ny_it201.line80
      printed: '80'
      label: 'Amount you owe'
      type: NonNegDollars
      expr: { op: sum, of: ["ny_it201.tax_due", "ny_it201.line81", "ny_it201.line82"] }
      cite: { doc: ny_it201i, locator: 'p. 23, Line 80: Amount you owe, "Enter on line 80 the amount of tax you owe plus any estimated tax penalty you owe (see line 81 instructions) and any other penalties and interest you owe (see line 82 instructions)."' }
