      type: NonNegDollars
      expr: { op: param, ref: "ny.dependent_exemption" }
      cite: { doc: ny_it201i, locator: 'p. 11, Line 36: Dependent exemption amount, "The value of each New York State dependent exemption is $1,000."' }
    - id: ny_it201.line36
      printed: '36'
      label: 'Dependent exemption amount (multiply the number of dependents listed in item H by 1,000)'
      type: NonNegDollars
      expr: { op: multiply_count, amount: "ny_it201.exemption", count: "ny_it201.item_h_count" }
      cite: { doc: ny_it201i, locator: 'p. 11, Line 36: Dependent exemption amount, "Multiply the number of your dependents listed on Form IT-201, item H"' }
    - id: ny_it201.line37
      printed: '37'
      label: 'Taxable income (subtract line 36 from line 35)'
      type: NonNegDollars
      expr: { op: subtract_floor0, from: "ny_it201.line35", take: "ny_it201.line36" }
      cite: { doc: ny_it201i, locator: 'p. 11, Lines 37 and 38: Taxable income, "Subtract line 36 from line 35. The result is your taxable income."' }
      note: 'The instructions say "If line 36 is more than line 35, leave line 37 and line 38 blank"; a blank is read as zero.'
