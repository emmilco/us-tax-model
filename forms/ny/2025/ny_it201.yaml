      label: 'NYC household credit'
      type: NonNegDollars
      expr: 
        op: choose
        alternatives:
          - guard: { op: test, eq: ["ny_it201.item_c", { const: true }] }
            then: "ny_it201.zero"
          - guard: { op: test, eq: ["ny_it201.item_c", { const: false }] }
            then: "ny_it201.hh_city_by_status"
      cite: { doc: ny_it201i, locator: 'p. 13, Line 48: New York City household credit (NYC residents only), "If you marked the Yes box at item C on the front of Form IT-201, you do not qualify for this credit and should go to line 49."' }
      refuses:
        - when: ny_it201.gate.hh_city_mfs
          form: 'New York City household credit table 6 (married filing separately)'
          remedy: 'The table for married filing separately needs your spouse''s federal AGI and both returns'' dependents; this tool refuses it where a credit is allowed.'
          cite: { doc: ny_it201i, locator: 'p. 14, Note 4, "use your spouse’s federal adjusted gross income as reported on their federal return"' }
        - when: ny_it201.gate.hh_city_over7
          form: 'New York City household credit, more than 7 people (Note 3)'
          remedy: 'More than seven people in the household credit count is outside this tool where a credit is allowed.'
          cite: { doc: ny_it201i, locator: 'p. 14, "Note 3 For each individual over 7, add the amount in this column to the column 7 amount."' }
