            then: "ny_it201.sut.chart"
      cite: { doc: ny_it201i, locator: 'p. 19, Line 59, "If you do not owe any sales or use tax, you must enter 0 on line 59. Do not leave line 59 blank."' }
      refuses:
        - when: ny_it201.gate.use_tax_st141
          form: 'Form ST-141, Individual Purchaser''s Periodic Report of Sales and Use Tax'
          remedy: 'An exact use tax calculation, an item of $1,000 or more, or business purchases are outside this tool (decision B3).'
          cite: { doc: ny_it201i, locator: 'p. 18, Line 59: Sales or use tax, "You must use Form ST-141 to calculate your sales and use tax liability to be reported on this return if any of the following apply:"' }
