    - id: ny_it201.sut.top
      printed: '(chart)'
      label: '0.0175% (0.000175) of income, or $125, whichever amount is smaller'
      type: NonNegDollars
      expr: { op: smaller_of, of: ["ny_it201.sut.top_product", "ny_it201.sut.cap"] }
      cite: { doc: ny_it201i, locator: 'p. 18, Sales and use tax chart, "of income, or $125, whichever amount is smaller"' }
    - id: ny_it201.sut.chart
      printed: '(chart)'
      label: 'The sales and use tax chart amount for federal adjusted gross income (line 19; zero or a negative amount is in the first row)'
      type: NonNegDollars
      expr: 
        op: choose
        alternatives:
          - guard: { op: test, all: [{ op: test, ge: ["ny_it201.hh_agi", { const: 0 }] }, { op: test, le: ["ny_it201.hh_agi", { param: "ny.sut.b1.upper" }] }] }
            then: "ny_it201.sut.b1"
          - guard: { op: test, all: [{ op: test, gt: ["ny_it201.hh_agi", { param: "ny.sut.b1.upper" }] }, { op: test, le: ["ny_it201.hh_agi", { param: "ny.sut.b2.upper" }] }] }
            then: "ny_it201.sut.b2"
          - guard: { op: test, all: [{ op: test, gt: ["ny_it201.hh_agi", { param: "ny.sut.b2.upper" }] }, { op: test, le: ["ny_it201.hh_agi", { param: "ny.sut.b3.upper" }] }] }
            then: "ny_it201.sut.b3"
          - guard: { op: test, all: [{ op: test, gt: ["ny_it201.hh_agi", { param: "ny.sut.b3.upper" }] }, { op: test, le: ["ny_it201.hh_agi", { param: "ny.sut.b4.upper" }] }] }
            then: "ny_it201.sut.b4"
          - guard: { op: test, all: [{ op: test, gt: ["ny_it201.hh_agi", { param: "ny.sut.b4.upper" }] }, { op: test, le: ["ny_it201.hh_agi", { param: "ny.sut.b5.upper" }] }] }
            then: "ny_it201.sut.b5"
          - guard: { op: test, all: [{ op: test, gt: ["ny_it201.hh_agi", { param: "ny.sut.b5.upper" }] }, { op: test, le: ["ny_it201.hh_agi", { param: "ny.sut.b6.upper" }] }] }
            then: "ny_it201.sut.b6"
          - guard: { op: test, all: [{ op: test, gt: ["ny_it201.hh_agi", { param: "ny.sut.b6.upper" }] }, { op: test, le: ["ny_it201.hh_agi", { param: "ny.sut.b7.upper" }] }] }
            then: "ny_it201.sut.b7"
          - guard: { op: test, gt: ["ny_it201.hh_agi", { param: "ny.sut.b7.upper" }] }
            then: "ny_it201.sut.top"
      cite: { doc: ny_it201i, locator: 'p. 18, Sales and use tax chart, "If your federal adjusted gross income (line 19) is:"' }
    - id: ny_it201.gate.use_tax_st141
