    - id: ny_it201.line34
      printed: '34'
      label: 'Enter your standard deduction'
      type: NonNegDollars
      expr: 
        op: choose
        alternatives:
          - guard: { op: test, eq: ["ny_it201.dependent_single", { const: true }] }
            then: "ny_it201.std_deduction_dependent"
          - guard: { op: test, eq: ["ny_it201.dependent_single", { const: false }] }
