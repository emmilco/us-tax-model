      printed: '(gate)'
      label: 'A joint return with a spouse who was not a full-year New York State and City resident'
      type: Bool
      expr: { op: test, all: [{ op: test, eq: ["f1040.status", { const: mfj }] }, { op: test, eq: ["ny_it201.ask.spouse_resident", { const: false }] }] }
      cite: { doc: ny_it201i, locator: 'p. 4, Item A, "One spouse is a New York State resident and the other is a nonresident or part-year resident."' }
