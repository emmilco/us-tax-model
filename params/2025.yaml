params:
  tax_year: 2025
  enums:
    sales_box:
      values:
        - A
        - B
        - C
        - D
        - E
        - F
        - G
        - H
        - I
        - J
        - K
        - L
      cite:
        doc: f8949
        locator: Parts I and II, checkbox classifications
    sales_route:
      values:
        - detail
        - aggregate
      cite:
        doc: i1040sd
        locator: p. 10, lines 1a and 8a
    sales_code:
      values:
        - none
        - B
        - W
        - BW
        - other
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    filing_status:
      values:
        - single
        - mfj
        - mfs
        - hoh
        - qss
      cite:
        doc: f1040
        locator: Form 1040, Filing Status (checkboxes)
    hsa_coverage:
      values:
        - none
        - self_only
        - family
      cite:
        doc: i8889
        locator: "p. 4, Line 3, rules 2 and 4(b), and p. 6, Line 3 Limitation Chart: the type of HDHP coverage (self-only or family) on the first day of a month, or not an eligible individual that day"
    retirement_account:
      values:
        - traditional_ira
        - roth_ira
        - plan
      cite:
        doc: f1099r
        locator: "Instructions for Recipient: traditional IRA or traditional SIMPLE IRA (the IRA/SEP/SIMPLE box), Roth IRA or Roth SIMPLE IRA, and qualified plans, section 403(b) and governmental 457(b) plans (pensions and annuities); i1040gi pp. 26-28, lines 4a, 4b, 5a and 5b"
    retirement_code:
      values:
        - normal_7
        - death_4
        - early_exception_2
        - direct_rollover_G
        - qualified_roth_Q
        - other
      cite:
        doc: f1099r
        locator: "Instructions for Recipient, Box 7: 7 normal distribution; 4 death; 2 early distribution, exception applies; G direct rollover to a qualified plan, 403(b), governmental 457(b) or IRA; Q qualified distribution from a Roth IRA; every other code or combination is 'other'"
    dependent_relationship:
      values:
        - child
        - sibling
        - sibling_descendant
        - parent
        - parent_relative
        - in_law
        - household_member
        - other
      cite:
        doc: i1040gi
        locator: "pp. 17 and 19, Who Qualifies as Your Dependent, Steps 1 and 4: child is a son, daughter, stepchild,
          foster child or a descendant of any of them; sibling is a brother, sister, stepbrother, stepsister, half
          brother or half sister, or a son or daughter of a brother, sister, half brother or half sister (Step 4 lists
          step siblings but not their children); sibling_descendant is any other descendant of a sibling, including a
          step sibling's child (a qualifying child relationship under Step 1, and a Step 4 relative only as a
          household member who lived with you all year); parent is a father or
          mother; parent_relative is an ancestor or sibling of a parent (a Step 4 relative, but not the parent of
          Head of Household Test 1); in_law is a step-parent or an in-law; household_member is any other person
          who lived with you all year"
    overtime_method:
      values:
        - employer_reported
        - premium
        - total_time_and_half
        - premium_double
        - total_double
        - other
      cite:
        doc: i1040gi
        locator: 'pp. 106-107, Schedule 1-A, "Determining the amount of qualified overtime compensation for 2025": an amount the employer provides (Form W-2 box 14 or on request), methods 1 to 4; method 5, adjustments and other overtime rates are refused'
    carloan_kind:
      values:
        - original
        - refinanced
        - death
      cite:
        doc: fr-2025-24154
        locator: 'pp. 20–22, Proposed § 1.163-16(d)(4) (refinancing of an SPVL) and (d)(5) (whether the SPVL was incurred by the taxpayer; change in obligor by reason of death)'
