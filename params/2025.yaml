# Tax year 2025 parameters (Stage 1 subset), each with a citation.
#
# Money values are integer cents. Rates are integer pairs {num, den}.
# Status-keyed values carry one value per filing-status key; `qss` is
# qualifying surviving spouse.

params:
  tax_year: 2025
  enums:
    sales_box:
      values:
        - A
        - B
        - C
        - D
        - E
        - F
        - G
        - H
        - I
        - J
        - K
        - L
      cite:
        doc: f8949
        locator: Parts I and II, checkbox classifications
    sales_route:
      values:
        - detail
        - aggregate
      cite:
        doc: i1040sd
        locator: p. 10, lines 1a and 8a
    sales_code:
      values:
        - none
        - B
        - W
        - BW
        - other
      cite:
        doc: i8949
        locator: pp. 7–11, columns (e) through (h), codes B and W
    filing_status:
      values: [single, mfj, mfs, hoh, qss]
      cite: { doc: f1040, locator: "Form 1040, Filing Status (checkboxes)" }
  values:

    # The switch between the Tax Table and the Tax Computation Worksheet.
    ordinary.table_boundary:
      type: Dollars
      value: 10000000
      cite:
        doc: i1040gi
        locator: "Instructions for Form 1040, line 16 (Tax Table or Tax Computation Worksheet)"
        quote: "If your taxable income is less than $100,000, you must use the Tax Table ... If your taxable income is $100,000 or more, use the Tax Computation Worksheet right after the Tax Table."

    # Qualified Dividends and Capital Gain Tax Worksheet, lines 6 and 13 and
    # the two rates applied on lines 18 and 21.
    qdcg.zero_rate_ceiling:
      type: Dollars
      value: { single: 4835000, mfs: 4835000, mfj: 9670000, qss: 9670000, hoh: 6475000 }
      cite:
        doc: i1040gi
        locator: "QDCGT worksheet, line 6"
        quote: "$48,350 if single or married filing separately, $96,700 if married filing jointly or qualifying surviving spouse, $64,750 if head of household."
    qdcg.fifteen_rate_ceiling:
      type: Dollars
      value: { single: 53340000, mfs: 30000000, mfj: 60005000, qss: 60005000, hoh: 56670000 }
      cite:
        doc: i1040gi
        locator: "QDCGT worksheet, line 13"
        quote: "$533,400 if single, $300,000 if married filing separately, $600,050 if married filing jointly or qualifying surviving spouse, $566,700 if head of household."
    qdcg.rate_15:
      type: Rate
      value: { num: 15, den: 100 }
      cite: { doc: i1040gi, locator: "QDCGT worksheet, line 18" }
    qdcg.rate_20:
      type: Rate
      value: { num: 20, den: 100 }
      cite: { doc: i1040gi, locator: "QDCGT worksheet, line 21" }

    # Tax Computation Worksheet, i1040gi p. 80. One entry per printed row:
    # the row's "not over" bound (upper), multiplication rate, and
    # subtraction amount. The first band's lower bound is
    # ordinary.table_boundary; each later band's lower bound is the previous
    # band's upper.
    tcw.single.b1.upper:
      type: Dollars
      value: 10335000
      cite: { doc: i1040gi, locator: "TCW Section A, row 1 (not over $103,350)" }
    tcw.single.b1.rate:
